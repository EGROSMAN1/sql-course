/* FIREBASE BAR */
.fb-bar{background:var(--tc11);border-bottom:1px solid var(--tc4);padding:.5rem 1.5rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;position:sticky;top:48px;z-index:90}
.fb-login-btn{display:flex;align-items:center;gap:6px;background:var(--tc12);color:#fff;border:none;padding:7px 14px;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--font)}
.fb-logout-btn{display:none;align-items:center;gap:5px;background:transparent;color:var(--tc6);border:1px solid var(--tc8);padding:5px 10px;border-radius:6px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:var(--font)}
.fb-user-info{display:none;align-items:center;gap:.5rem}
.fb-user-photo{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--tc10)}
.fb-user-name{font-size:12.5px;font-weight:700;color:var(--tc2)}
.fb-saved-score{display:none;font-size:11px;color:var(--tc5);font-family:var(--mono);background:var(--tc13);padding:3px 9px;border-radius:4px}

.fb-history-btn{display:none;align-items:center;gap:5px;background:transparent;color:var(--tc6);border:1px solid var(--tc8);padding:5px 10px;border-radius:6px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:var(--font)}
.fb-history-btn:hover{color:var(--tc2);border-color:var(--tc10)}
.fb-history-wrap{background:var(--tc11);border-bottom:1px solid var(--tc4);padding:1rem 1.5rem;display:none}
.hstats-row{display:flex;gap:1.5rem;margin-bottom:1rem;justify-content:center}
.hstat-mini{text-align:center}
.hstat-n{font-size:1.4rem;font-weight:900;font-family:var(--mono)}
.hstat-l{font-size:10px;color:var(--tc14);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.hchart{display:flex;align-items:flex-end;gap:.4rem;height:130px;padding:.5rem 0;overflow-x:auto}
.hbar-wrap{display:flex;flex-direction:column;align-items:center;gap:.2rem;min-width:32px;flex-shrink:0}
.hbar{width:24px;border-radius:4px 4px 0 0;transition:all .3s;min-height:8px}
.hbar-val{font-size:9.5px;color:var(--tc6);font-family:var(--mono)}
.hbar-lbl{font-size:9px;color:var(--tc14)}
#fb-toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(20px);background:#00d4c8;color:#070d0f;padding:10px 20px;border-radius:8px;font-weight:700;font-size:13px;opacity:0;transition:all .3s;z-index:999;pointer-events:none}
#fb-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* HERO */
.hero{padding:2rem 1.5rem 1.5rem;text-align:center;border-bottom:1px solid var(--tc4);background:radial-gradient(ellipse 70% 60% at 50% 0%,var(--tc15),transparent 70%)}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:var(--tc16);border:1px solid var(--tc8);color:var(--tc5);font-size:10px;font-weight:700;padding:4px 12px;border-radius:20px;font-family:var(--mono);letter-spacing:1px;margin-bottom:.75rem}
.hero-title{font-size:2rem;font-weight:900;color:var(--tc2);margin-bottom:.3rem}
.hero-title em{color:var(--tc5);font-style:normal}
.hero-desc{color:var(--tc6);font-size:.9rem;margin-bottom:1.25rem}
.hero-stats{display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap}
.hs{text-align:center}
.hs-n{font-size:1.6rem;font-weight:900;font-family:var(--mono);color:var(--tc5)}
.hs-l{font-size:10px;color:var(--tc14);text-transform:uppercase;letter-spacing:.5px;font-weight:600}

/* PROGRESS */
.prog-bar-wrap{padding:.75rem 1.5rem;background:var(--tc11);border-bottom:1px solid var(--tc4);display:flex;align-items:center;gap:1rem;position:sticky;top:96px;z-index:80}
.prog-bar{flex:1;height:4px;background:var(--tc7);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:#00d4c8;border-radius:2px;transition:width .3s}
.prog-txt{font-size:11px;color:var(--tc6);font-family:var(--mono);white-space:nowrap}
.score-display{font-size:12px;font-weight:700;font-family:var(--mono);color:var(--tc5);white-space:nowrap}

/* MAIN */
.main{max-width:800px;margin:0 auto;padding:1.5rem 1rem 4rem}

/* SECTION LABEL */
.sec-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--tc5);font-family:var(--mono);padding:.75rem 0 .5rem;margin-top:1rem;border-bottom:1px solid var(--tc4);margin-bottom:1rem}

/* QUESTION CARD */
.q-card{background:var(--tc11);border:1px solid var(--tc4);border-radius:10px;padding:1.1rem 1.25rem;margin-bottom:.75rem;transition:border-color .2s}
.q-card.correct{border-color:var(--tc17)}
.q-card.wrong{border-color:var(--tc18)}
.q-header{margin-bottom:.85rem}
.q-meta{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem}
.q-num{font-size:10px;font-family:var(--mono);color:var(--tc14);background:var(--tc7);padding:2px 8px;border-radius:4px;font-weight:700}
.q-section-tag{font-size:10px;color:var(--tc14);font-weight:600}
.q-text{font-size:14px;font-weight:700;color:var(--tc2);line-height:1.55}
.options{display:flex;flex-direction:column;gap:.4rem}
.option{display:flex;align-items:flex-start;gap:.65rem;padding:.6rem .8rem;background:var(--tc7);border:1px solid var(--tc4);border-radius:7px;cursor:pointer;transition:all .15s;user-select:none}
.option:hover:not(.disabled){border-color:var(--tc8);background:var(--tc19)}
.option.disabled{cursor:default}
.option.correct-ans{border-color:var(--tc20);background:var(--tc21)}
.option.wrong-ans{border-color:var(--tc22);background:var(--tc23)}
.opt-letter{width:20px;height:20px;border-radius:4px;background:var(--tc1);border:1px solid var(--tc8);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--tc6);flex-shrink:0;font-family:var(--mono)}
.option.correct-ans .opt-letter{background:var(--tc24);border-color:var(--tc20);color:var(--tc25)}
.option.wrong-ans .opt-letter{background:var(--tc26);border-color:var(--tc27);color:var(--tc28)}
.opt-text{font-size:13px;color:var(--tc6);line-height:1.5}
.option.correct-ans .opt-text{color:var(--tc2)}
.explanation{background:var(--tc7);border-right:2px solid var(--tc10);border-radius:0 6px 6px 0;padding:.6rem .85rem;margin-top:.6rem;display:none}
.explanation.show{display:block}
.exp-label{font-size:10px;font-weight:700;color:var(--tc5);font-family:var(--mono);margin-bottom:.25rem}
.exp-text{font-size:12.5px;color:var(--tc6);line-height:1.6}

/* FINISH */
.finish-card{background:var(--tc11);border:1px solid var(--tc8);border-radius:14px;padding:2.5rem;text-align:center;margin-top:2rem;display:none}
.finish-card.show{display:block}
.finish-emoji{font-size:3rem;margin-bottom:.75rem}
.finish-title{font-size:1.5rem;font-weight:900;color:var(--tc2);margin-bottom:.5rem}
.finish-score{font-size:2.5rem;font-weight:900;font-family:var(--mono);color:var(--tc5);margin-bottom:.5rem}
.finish-grade{font-size:1rem;font-weight:700;margin-bottom:.5rem}
.finish-sub{font-size:.9rem;color:var(--tc6);margin-bottom:1.5rem}
.retry-btn{background:#00d4c8;color:#070d0f;border:none;padding:10px 24px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;font-family:var(--font);margin-left:.5rem}
.level-link{display:inline-block;background:transparent;color:var(--tc6);border:1px solid var(--tc8);padding:10px 20px;border-radius:8px;font-weight:600;font-size:13px;text-decoration:none;margin-top:.5rem;transition:all .15s}
.level-link:hover{border-color:var(--tc10);color:var(--tc5)}

/* MOBILE */
@media(max-width:768px){
  .topnav{padding:.4rem .75rem}
  .topnav-title{font-size:11px}
  .level-tabs{display:none}
  .hero{padding:1.25rem .75rem 1rem}
  .hero-title{font-size:1.5rem}
  .main{padding:1rem .5rem 3rem}
  .q-card{padding:.85rem}
  .q-text{font-size:13px}
  .option{padding:.5rem .65rem}
  .opt-text{font-size:12.5px}
  .finish-card{padding:1.5rem}
  .finish-score{font-size:2rem}
}

  {n:13,s:"חלק א׳ — פונקציות מחרוזת",t:"כיצד נבדוק אם מחרוזת מתחילה ב-'A'?",o:["WHERE col = 'A%'","WHERE col LIKE 'A%'","WHERE col STARTS WITH 'A'","WHERE col = 'A'"],c:1,e:"האופרטור LIKE עם הסימן % משמש לחיפוש תבניות."},
  {n:14,s:"חלק א׳ — פונקציות מחרוזת",t:"מה המשמעות של \"_\" (קו תחתי) בשימוש עם LIKE?",o:["כל מספר של תווים.","תו בודד כלשהו.","רווח.","סוף המחרוזת."],c:1,e:"\"_\" מייצג בדיוק תו אחד במקום שבו הוא נמצא."},

  {n:21,s:"חלק ב׳ — אגרגציה ו-GROUP BY",t:"מה מחזירה הפונקציה COUNT(*)?",o:["סכום הערכים בעמודה.","מספר השורות כולל כפילויות וערכי NULL.","רק שורות עם ערכים ייחודיים.","את הערך המקסימלי."],c:1,e:"COUNT(*) סופרת את כל הרשומות בטבלה ללא קשר לתוכן."},
  {n:22,s:"חלק ב׳ — אגרגציה ו-GROUP BY",t:"איזו פונקציה מחזירה את הערך הגבוה ביותר בעמודה?",o:["HIGH()","TOP()","MAX()","LARGE()"],c:2,e:"MAX מוצאת את הערך המקסימלי בקבוצה."},
  {n:23,s:"חלק ב׳ — אגרגציה ו-GROUP BY",t:"מה עושה הפונקציה SUM()?",o:["סופרת כמה שורות יש.","מחזירה את הממוצע.","מחשבת את הסכום הכולל של ערכים מספריים.","מחזירה את הערך המינימלי."],c:2,e:"SUM מחברת את כל הערכים בעמודה מספרית."},
  {n:24,s:"חלק ב׳ — אגרגציה ו-GROUP BY",t:"מה ההבדל בין COUNT(column) לבין COUNT(*)?",o:["אין הבדל.","COUNT(column) מתעלמת מערכי NULL בעמודה הספציפית.","COUNT(*) מתעלמת מ-NULL.","COUNT(column) סופרת רק ערכים ייחודיים."],c:1,e:"כשמציינים עמודה, SQL סופר רק שורות שבהן יש ערך שאינו NULL."},

  {n:26,s:"חלק ב׳ — אגרגציה ו-GROUP BY",t:"איפה יופיע ה-GROUP BY בשאילתה?",o:["לפני ה-WHERE.","אחרי ה-WHERE ולפני ה-ORDER BY.","בתחילת השאילתה.","אחרי ה-HAVING."],c:1,e:"סדר הפקודות: SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY."},
  {n:27,s:"חלק ב׳ — אגרגציה ו-GROUP BY",t:"כיצד ניתן לסנן תוצאות של פונקציה אגרגטיבית (כמו SUM > 100)?",o:["WHERE","HAVING","GROUP BY","LIMIT"],c:1,e:"WHERE מסנן שורות לפני הקיבוץ, HAVING מסנן קבוצות אחרי הקיבוץ."},
  {n:28,s:"חלק ב׳ — אגרגציה ו-GROUP BY",t:"מה מחזירה הפונקציה MIN()?",o:["את ממוצע הערכים.","את הערך הנמוך ביותר.","את מספר הערכים.","את הערך הראשון בטבלה."],c:1,e:"MIN מוצאת את הערך המינימלי."},
  {n:29,s:"חלק ב׳ — אגרגציה ו-GROUP BY",t:"איזו פונקציה מחשבת ממוצע?",o:["AVERAGE()","AVG()","MEAN()","SUM() / COUNT()"],c:1,e:"AVG() היא הפונקציה המובנית לחישוב ממוצע חשבוני."},
  {n:30,s:"חלק ב׳ — אגרגציה ו-GROUP BY",t:"מה קורה לערכי NULL בחישוב AVG(price)?",o:["הם נחשבים כ-0.","השאילתה מחזירה שגיאה.","הם מושמטים מהחישוב (גם מהמונה וגם מהמכנה).","הם הופכים ל-NULL בתוצאה הסופית."],c:2,e:"פונקציות אגרגטיביות (פרט ל-COUNT) מתעלמות לחלוטין מ-NULL."},
  {n:31,s:"חלק ב׳ — אגרגציה ו-GROUP BY",t:"האם ניתן להשתמש ב-GROUP BY ללא פונקציה אגרגטיבית?",o:["לא, זה חובה.","כן, זה יפעל בדומה ל-DISTINCT.","רק אם יש JOIN.","רק ב-SQL Server."],c:1,e:"קיבוץ ללא חישוב פשוט יציג את הערכים הייחודיים של העמודה."},
  {n:32,s:"חלק ב׳ — אגרגציה ו-GROUP BY",t:"מה מחזירה: SELECT COUNT(DISTINCT city) FROM customers?",o:["את מספר הלקוחות בעיר.","את מספר הערים השונות (הייחודיות) שקיימות בטבלה.","את רשימת שמות הערים.","את מספר הלקוחות הכולל."],c:1,e:"DISTINCT גורם ל-COUNT לספור כל ערך רק פעם אחת."},
  {n:33,s:"חלק ב׳ — אגרגציה ו-GROUP BY",t:"מהי השגיאה הנפוצה ביותר בשימוש ב-GROUP BY?",o:["שימוש ב-SUM במקום ב-COUNT.","בחירת עמודה ב-SELECT שאינה ב-GROUP BY ואינה אגרגטיבית.","כתיבת ה-GROUP BY לפני ה-FROM.","שימוש ביותר מ-3 עמודות בקיבוץ."],c:1,e:"כל עמודה ב-SELECT חייבת להיות חלק מהקיבוץ או בתוך פונקציה (כמו SUM)."},
  {n:34,s:"חלק ב׳ — אגרגציה ו-GROUP BY",t:"מה עושה הפונקציה COUNT(1)?",o:["סופרת רק את השורה הראשונה.","מחזירה תמיד 1.","זהה ל-COUNT(*) - סופרת את כל השורות.","סופרת רק שורות שבהן הערך הוא 1."],c:2,e:"ברוב מסדי הנתונים זה קיצור דרך לספירת כל השורות."},
  {n:35,s:"חלק ב׳ — אגרגציה ו-GROUP BY",t:"כיצד נחשב את סכום המכירות לכל איש מכירות בנפרד?",o:["SELECT SUM(sales) FROM data","SELECT seller, SUM(sales) FROM data GROUP BY seller","SELECT seller, SUM(sales) FROM data WHERE seller = 'all'","SELECT seller FROM data ORDER BY SUM(sales)"],c:1,e:"ה-GROUP BY יוצר 'סל' לכל מוכר ומחשב בתוכו את הסכום."},
  {n:36,s:"חלק ב׳ — אגרגציה ו-GROUP BY",t:"האם מותר להשתמש בכינוי (Alias) בתוך ה-HAVING?",o:["תמיד.","תלוי במסד הנתונים (ב-MySQL כן, ב-SQL Server לרוב לא).","אף פעם.","רק אם זה מספר."],c:1,e:"SQL Server מעבד את ה-HAVING לפני ה-SELECT, לכן הוא לא מכיר את הכינוי."},
  {n:37,s:"חלק ב׳ — אגרגציה ו-GROUP BY",t:"מה התוצאה של MIN(name) כאשר העמודה היא טקסט?",o:["שגיאה, אי אפשר לבצע על טקסט.","השם הראשון לפי סדר ה-ABC.","השם הקצר ביותר.","מספר התווים בשם הקצר ביותר."],c:1,e:"MIN ו-MAX עובדות גם על מחרוזות לפי סדר אלפביתי."},
  {n:38,s:"חלק ב׳ — אגרגציה ו-GROUP BY",t:"מה ההבדל בין WHERE amount > 100 לבין HAVING amount > 100?",o:["אין הבדל.","HAVING מהיר יותר.","WHERE מסנן עסקאות בודדות, HAVING מסנן קבוצות.","WHERE משמש רק לטקסט."],c:2,e:"סינון לפני הקיבוץ מול סינון אחרי הקיבוץ."},
  {n:39,s:"חלק ב׳ — אגרגציה ו-GROUP BY",t:"האם ניתן לקבץ לפי יותר מעמודה אחת? (למשל עיר ומגדר)",o:["לא.","כן, פשוט מפרידים בפסיק: GROUP BY city, gender.","רק אם משתמשים ב-UNION.","רק ב-Oracle."],c:1,e:"ניתן ליצור תתי-קבוצות מפורטות ככל שנרצה."},
  {n:40,s:"חלק ב׳ — אגרגציה ו-GROUP BY",t:"איזו פונקציה לא קיימת ב-SQL כפונקציה סטנדרטית?",o:["SUM()","AVG()","MEDIAN()","COUNT()"],c:2,e:"חישוב חציון ב-SQL דורש פונקציות חלון או שאילתות משנה."},
  // ── חלק 3: JOINs ──
  {n:41,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מהו תפקידו העיקרי של JOIN?",o:["למחוק כפילויות.","לשלב נתונים משתי טבלאות על בסיס עמודה משותפת.","למיין נתונים.","ליצור טבלה חדשה."],c:1,e:"JOIN מאפשר לשלב מידע ממספר טבלאות קשורות בשאילתה אחת."},
  {n:42,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מהו ה-INNER JOIN?",o:["מחזיר את כל השורות משתי הטבלאות.","מחזיר רק שורות שיש להן התאמה בשתי הטבלאות.","מחזיר רק את הטבלה השמאלית.","מחזיר שורות שאין להן התאמה."],c:1,e:"INNER JOIN מחזיר רק שורות שיש להן ערך תואם בשתי הטבלאות."},
  {n:43,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מה מחזיר LEFT JOIN?",o:["רק שורות מהטבלה הימנית.","כל השורות מהטבלה השמאלית, ושורות תואמות מהימנית (אם אין התאמה יופיע NULL).","רק שורות שמופיעות רק בצד שמאל.","את החיתוך של שתי הטבלאות."],c:1,e:"LEFT JOIN שומר את כל שורות הטבלה השמאלית גם אם אין התאמה."},
  {n:44,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מה יקרה ב-RIGHT JOIN אם אין התאמה בטבלה השמאלית?",o:["השורה תושמט.","תוצג שגיאה.","יוצגו נתוני הטבלה הימנית וערכי NULL בעמודות של השמאלית.","הטבלה השמאלית תתמלא באפסים."],c:2,e:"RIGHT JOIN שומר את כל שורות הטבלה הימנית. חוסרים בשמאל מופיעים כ-NULL."},
  {n:45,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מהו FULL OUTER JOIN?",o:["מחזיר רק את מה שמשותף.","מחזיר את כל השורות משתי הטבלאות, עם NULL במקומות שאין התאמה.","מחזיר רק את השורות הלא תואמות.","מחבר טבלאות ללא תנאי."],c:1,e:"FULL OUTER JOIN מחזיר הכל משתי הטבלאות עם NULL בפערים."},
  {n:46,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מהו CROSS JOIN?",o:["חיבור לפי מפתח ראשי.","מכפלה קרטזית - כל שורה בטבלה א׳ משולבת עם כל שורה בטבלה ב׳.","חיבור של טבלה עם עצמה.","חיבור שמבוסס על גדול/קטן."],c:1,e:"CROSS JOIN יוצר את כל השילובים האפשריים בין שתי הטבלאות."},
  {n:47,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"אם בטבלה א׳ יש 5 שורות ובטבלה ב׳ יש 3 שורות, כמה שורות יחזיר CROSS JOIN?",o:["8","5","15","2"],c:2,e:"5 כפול 3 = 15. מכפלה קרטזית."},
  {n:48,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מהו SELF JOIN?",o:["חיבור של שתי טבלאות זהות בנתונים.","חיבור של טבלה לעצמה (למשל למצוא קשר בין עובד למנהל).","שאילתה ללא JOIN.","שימוש ב-DISTINCT על טבלה."],c:1,e:"SELF JOIN מאפשר להשוות שורות באותה טבלה (למשל היררכיות)."},
  {n:49,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"באיזו מילת מפתח משתמשים כדי להגדיר את התנאי לחיבור?",o:["WHERE","ON","AT","USING"],c:1,e:"התחביר הוא JOIN table ON condition."},
  {n:50,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מה ההבדל בין JOIN ל-UNION?",o:["אין הבדל.","JOIN מחבר עמודות (לצדדים), UNION מחבר שורות (אחת מתחת לשנייה).","UNION דורש ON.","JOIN דורש שמספר העמודות יהיה זהה."],c:1,e:"JOIN = חיבור אופקי. UNION = חיבור אנכי."},
  {n:51,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מהו ה-Natural Join?",o:["חיבור שמבוסס על מפתח זר בלבד.","חיבור אוטומטי המבוסס על כל העמודות בעלות שם זהה בשתי הטבלאות.","חיבור של טבלאות טבעיות.","חיבור ללא מילים שמורות."],c:1,e:"NATURAL JOIN מחבר אוטומטית לפי עמודות בעלות שם זהה."},
  {n:52,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"האם ניתן לבצע JOIN בין יותר מ-2 טבלאות?",o:["לא.","כן, ניתן לשרשר כמה JOIN-ים בזה אחר זה.","רק עד 3 טבלאות.","רק אם משתמשים ב-Subquery."],c:1,e:"ניתן לשרשר JOIN-ים רבים בשאילתה אחת."},
  {n:53,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מה יחזיר ה-INNER JOIN אם בשתי הטבלאות אין אף ערך תואם?",o:["את כל הטבלה הראשונה.","טבלה ריקה.","שורות עם NULL.","שגיאת מערכת."],c:1,e:"INNER JOIN ללא התאמות מחזיר טבלה ריקה."},
  {n:54,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"באיזה מקרה נשתמש ב-LEFT JOIN?",o:["כשרוצים רק נתונים שקיימים בשני הצדדים.","כשרוצים רשימה מלאה של לקוחות, גם כאלו שלא ביצעו הזמנה.","כשיש לנו רק טבלה אחת.","כדי לשפר ביצועים."],c:1,e:"LEFT JOIN אידיאלי לשמירת כל הרשומות מהטבלה הראשית."},
  {n:55,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מה עושה הפקודה USING(column_name)?",o:["מחליפה את ה-FROM.","תחליף ל-ON כאשר שם העמודה המקשרת זהה בשתי הטבלאות.","משמשת לסינון שורות.","מגדירה איזה אינדקס להפעיל."],c:1,e:"USING היא קיצור ל-ON כשהעמודה נושאת שם זהה בשתי הטבלאות."},
  {n:56,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מהו Anti-Join (באופן רעיוני)?",o:["חיבור של כל מה שמתאים.","שליפת שורות מטבלה אחת שאין להן אף התאמה בטבלה השנייה.","מחיקת נתונים משותפים.","חיבור בסדר הפוך."],c:1,e:"Anti-Join מוצא שורות שלא נמצאת להן התאמה בטבלה השנייה."},
  {n:57,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"כיצד מבצעים Anti-Join בעזרת LEFT JOIN?",o:["מוסיפים LIMIT 1.","בודקים ב-WHERE איפה העמודה מהטבלה הימנית היא NULL.","משתמשים ב-INNER JOIN.","משתמשים ב-GROUP BY."],c:1,e:"LEFT JOIN + WHERE right.col IS NULL = Anti-Join."},
  {n:58,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מהו Non-Equi Join?",o:["חיבור ללא סימני שוויון.","JOIN שבו תנאי החיבור משתמש באופרטורים כמו <, > או BETWEEN.","חיבור של טבלאות לא שוות בגודלן.","טעות תחבירית."],c:1,e:"Non-Equi Join משתמש באופרטורים שאינם שוויון."},
  {n:59,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מהו ה-Alias ולמה הוא חשוב ב-JOIN?",o:["הוא משמש להצפנת נתונים.","הוא מאפשר לקצר שמות טבלאות ולמנוע עמימות כשמות עמודות זהים.","הוא חובה ב-INNER JOIN.","הוא מחליף את ה-SELECT."],c:1,e:"Alias חיוני ב-JOIN כדי להבחין בין עמודות בעלות שם זהה."},
  {n:60,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מה יקרה אם נשכח לכתוב את תנאי ה-ON ב-JOIN?",o:["השאילתה תעבוד ותנחש את הקשר.","תתקבל שגיאת תחביר (או CROSS JOIN בגרסאות מסוימות).","רק השורה הראשונה תוצג.","הנתונים יימחקו."],c:1,e:"ללא ON תתקבל שגיאה או CROSS JOIN בהתאם למסד הנתונים."},
  {n:61,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"איזה JOIN הוא ברירת המחדל אם כותבים רק את המילה JOIN?",o:["LEFT JOIN","INNER JOIN","CROSS JOIN","FULL JOIN"],c:1,e:"JOIN לבד = INNER JOIN."},
  {n:62,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"בטבלת עובדים יש עמודת manager_id המצביעה על employee_id באותה טבלה. איזה JOIN נדרש?",o:["OUTER JOIN","SELF JOIN","NATURAL JOIN","CROSS JOIN"],c:1,e:"SELF JOIN מחבר טבלה לעצמה — מצוין להיררכיות."},
  {n:63,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"האם ביצועי JOIN מושפעים מאינדקסים?",o:["לא, JOIN לא קשור לאינדקס.","כן, אינדקס על עמודות ה-ON מאיץ משמעותית את השאילתה.","רק ב-LEFT JOIN.","רק בטבלאות קטנות."],c:1,e:"אינדקס על עמודות ה-ON הוא קריטי לביצועי JOIN."},
  {n:64,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מהו היתרון של FULL OUTER JOIN על פני UNION?",o:["הוא מהיר יותר.","הוא שומר על מבנה העמודות משתי הטבלאות זו לצד זו.","הוא לא דורש מפתחות.","הוא תמיד מחזיר פחות שורות."],c:1,e:"FULL OUTER JOIN מחבר לרוחב — UNION מחבר לגובה."},
  {n:65,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מה קורה ב-JOIN אם יש ערכי NULL בשתי העמודות המקשרות?",o:["הן יחשבו כהתאמה.","NULL לעולם לא שווה ל-NULL ב-JOIN, לכן לא תהיה התאמה.","תוצג שגיאה.","המערכת תתעלם מהשורות הללו."],c:1,e:"NULL = NULL אינו נכון ב-SQL. NULL לא תואם ל-NULL ב-JOIN."},
  {n:66,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"איך ניתן לחבר 3 טבלאות: לקוחות, הזמנות ומוצרים?",o:["JOIN אחד ארוך.","שני JOIN-ים: לקוחות לזמנות, ואז זמנות למוצרים.","אי אפשר, מותר רק 2.","בעזרת UNION."],c:1,e:"ניתן לשרשר JOIN-ים: A JOIN B JOIN C."},
  {n:67,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מה ההבדל בין LEFT JOIN ל-LEFT OUTER JOIN?",o:["OUTER מחזיר יותר נתונים.","אין הבדל, מדובר באותה פקודה.","LEFT JOIN הוא רק ל-MySQL.","OUTER JOIN דורש WHERE."],c:1,e:"LEFT JOIN ו-LEFT OUTER JOIN זהים לחלוטין."},
  {n:68,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מתי נשתמש ב-CROSS JOIN בכוונה?",o:["כדי למצוא התאמות בין מחירים.","כדי ליצור את כל השילובים האפשריים (כמו כל הצבעים × כל המידות).","כשיש לנו מפתח ראשי חזק.","כדי למחוק כפילויות."],c:1,e:"CROSS JOIN שימושי ליצירת קומבינציות מוצרים, לוחות זמנים וכו׳."},
  {n:69,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"האם סדר הטבלאות משנה ב-INNER JOIN?",o:["כן, זה משנה את התוצאה.","לא, התוצאה הלוגית תהיה זהה.","רק אם יש מעל 1000 שורות.","רק ב-Oracle."],c:1,e:"ב-INNER JOIN סדר הטבלאות לא משנה את התוצאה הלוגית."},
  {n:70,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"האם סדר הטבלאות משנה ב-LEFT JOIN?",o:["לא.","כן, הטבלה שכתובה ראשונה (משמאל) היא זו שכל שורותיה יישמרו.","רק אם משתמשים ב-ON.","רק ב-SQL Server."],c:1,e:"ב-LEFT JOIN הסדר קריטי — הטבלה הראשונה תמיד מופיעה במלואה."},
  {n:71,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:'מהו "Cartesian Product"?',o:["תוצאה של INNER JOIN.","תוצאה של CROSS JOIN (מכפלה קרטזית).","פונקציית מתמטית ב-SQL.","טעות בחישוב ממוצע."],c:1,e:"Cartesian Product = CROSS JOIN = כל שורה × כל שורה."},
  {n:72,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"כיצד ניתן למנוע כפילויות בתוצאת JOIN?",o:["השתמש ב-ORDER BY.","השתמש ב-DISTINCT.","השתמש ב-LEFT JOIN.","השתמש ב-SUM."],c:1,e:"DISTINCT מסיר שורות כפולות מהתוצאה."},
  {n:73,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מתי נכתוב את שם הטבלה לפני שם העמודה (למשל Orders.ID)?",o:["תמיד, זה חובה.","כאשר שם העמודה קיים ביותר מטבלה אחת בשאילתה.","רק ב-WHERE.","רק ב-GROUP BY."],c:1,e:"ציון שם הטבלה נחוץ כדי למנוע עמימות."},
  {n:74,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מה מחזיר A RIGHT JOIN B?",o:["את כל A.","את כל B ואת מה שמתאים מ-A.","רק את מה שמשותף.","את השורות שקיימות רק ב-A."],c:1,e:"RIGHT JOIN שומר את כל שורות הטבלה הימנית (B)."},
  {n:75,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"האם ניתן להשתמש ב-Subquery בתוך JOIN?",o:["לא.","כן, ניתן להתייחס לתוצאת שאילתה כאל טבלה (Derived Table).","רק ב-INNER JOIN.","רק אם יש GROUP BY."],c:1,e:"Derived Table (תת-שאילתה בתוך FROM) ניתן לחבר ב-JOIN כמו טבלה רגילה."},
  {n:76,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מהו ה-JOIN הכי פחות נפוץ בשימוש יומיומי?",o:["INNER JOIN","LEFT JOIN","CROSS JOIN","SELF JOIN"],c:2,e:"CROSS JOIN נדיר מכיוון שמכפלה קרטזית לעיתים רחוקות הגיונית."},
  {n:77,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מה תפקיד ה-ON בשאילתת JOIN?",o:["להגדיר את שם הטבלה.","להגדיר את הלוגיקה לפיה השורות יתחברו.","לסנן את התוצאה הסופית.","להפעיל את השרת."],c:1,e:"ON מגדיר את תנאי ההתאמה בין הטבלאות."},
  {n:78,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מה המשמעות של: SELECT * FROM T1, T2?",o:["שגיאה.","INNER JOIN.","CROSS JOIN (כתיבה בסגנון ישן).","UNION."],c:2,e:"פסיק בין טבלאות ב-FROM הוא כתיבה ישנה ל-CROSS JOIN."},
  {n:79,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מהו Multiple Join?",o:["JOIN שמחזיר הרבה שורות.","חיבור של יותר משתי טבלאות באותה שאילתה.","שימוש ב-GROUP BY אחרי JOIN.","חיבור שנעשה כמה פעמים ביום."],c:1,e:"Multiple Join = שרשרת של JOIN-ים בשאילתה אחת."},
  {n:80,s:"חלק ג׳ — קשרים בין טבלאות (JOINs)",t:"מהו הכלל החשוב ביותר בעבודה עם JOIN?",o:["תמיד להשתמש ב-LEFT JOIN.","להכיר את הקשרים בין הטבלאות (Primary Key ו-Foreign Key).","לכתוב הכל באותיות גדולות.","לא להשתמש ביותר מ-2 עמודות ב-ON."],c:1,e:"הבנת קשרי PK/FK בין הטבלאות היא הבסיס לכל JOIN נכון."}
];

const letters = ['א','ב','ג','ד'];

let correct = 0;
let currentSection = null;

function updateScore(){
  const total = Object.keys(answers).length;
  const pct = total > 0 ? Math.round(correct/total*100) : 0;
  document.getElementById('scoreText').textContent = '✅ ' + correct + ' / ' + total;
  document.getElementById('scoreFill').style.width = (Math.round(correct/questions.length*100)) + '%';
  document.getElementById('progTxt').textContent = total + ' / ' + questions.length;
  document.getElementById('scoreDisplay').textContent = pct + '%';
  document.getElementById('heroAnswered').textContent = total;
  document.getElementById('heroCorrect').textContent = correct;
  document.getElementById('heroPct').textContent = pct + '%';
  if(total === questions.length) showFinish();
}

function selectOption(qIdx, optIdx){
  if(answers[qIdx] !== undefined) return;
  const q = questions[qIdx];
  const isCorrect = optIdx === q.c;
  answers[qIdx] = optIdx;
  if(isCorrect) correct++;
  const card = document.getElementById('qcard-'+qIdx);
  card.classList.add(isCorrect ? 'correct' : 'wrong');
  card.querySelectorAll('.option').forEach((o,i)=>{
    o.classList.add('disabled');
    if(i === q.c) o.classList.add('correct-ans');
    if(i === optIdx && !isCorrect) o.classList.add('wrong-ans');
  });
  const exp = document.getElementById('exp-'+qIdx);
  exp.querySelector('.exp-text').innerHTML = (isCorrect ? '✅ נכון! ' : '❌ טעית — התשובה הנכונה מסומנת בירוק. ') + q.e;
  exp.classList.add('show');
  updateScore();
}

function buildQuiz(){
  const mc = document.getElementById('mainContent');
  mc.innerHTML = '';
  currentSection = null;
  questions.forEach((q,i)=>{
    if(q.s !== currentSection){
      currentSection = q.s;
      mc.innerHTML += `<div class="sec-label">${q.s}</div>`;
    }
    const opts = q.o.map((o,oi)=>`
      <div class="option" onclick="selectOption(${i},${oi})">
        <div class="opt-letter">${letters[oi]}</div>
        <div class="opt-text">${o}</div>
      </div>`).join('');
    mc.innerHTML += `
    <div class="q-card" id="qcard-${i}">
      <div class="q-header">
        <div class="q-meta">
          <div class="q-num">שאלה ${q.n}</div>
          <div class="q-section-tag">${q.s.split('—')[1]?.trim()||q.s}</div>
        </div>
        <div class="q-text">${q.t}</div>
      </div>
      <div class="options">${opts}</div>
      <div class="explanation" id="exp-${i}">
        <div class="exp-label">💡 הסבר</div>
        <div class="exp-text"></div>
      </div>
    </div>`;
  });
  mc.innerHTML += `
  <div class="finish-card" id="finishCard">
    <div class="finish-emoji">🎉</div>
    <div class="finish-title">סיימת את הקוויז הבינוני!</div>
    <div class="finish-score" id="finishScore">0/80</div>
    <div class="finish-grade" id="finishGrade"></div>
    <div class="finish-sub" id="finishSub"></div>
    <br>
    <button class="retry-btn" onclick="resetQuiz()">🔄 נסה שוב</button>
    <a href="quiz.html" class="level-link">🧠 מוכן לרמה המתקדמת? ←</a>
  </div>`;
}

function showFinish(){
  const card = document.getElementById('finishCard');
  if(window.fbAutoSave && window.currentUser) window.fbAutoSave(correct, questions.length);
  const pct = Math.round(correct/questions.length*100);
  document.getElementById('finishScore').textContent = correct + ' / ' + questions.length;
  let grade, sub;
  if(pct>=90){grade='⭐ מצוין!';sub='שליטה מרשימה ברמה הבינונית!';}
  else if(pct>=75){grade='👍 טוב מאוד';sub='עוד קצת תרגול ותגיע לשלמות!';}
  else if(pct>=60){grade='📚 טוב';sub='כדאי לחזור על החומר החלש.';}
  else{grade='💪 המשך להתאמן';sub='חזור על הפרקים ונסה שוב!';}
  document.getElementById('finishGrade').textContent = grade;
  document.getElementById('finishSub').textContent = sub;
  card.classList.add('show');
  card.scrollIntoView({behavior:'smooth',block:'center'});
}

function resetQuiz(){
  answers = {}; correct = 0;
  document.getElementById('finishCard').classList.remove('show');
  updateScore();
  buildQuiz();
  window.scrollTo({top:0,behavior:'smooth'});
}

buildQuiz();
updateScore();
</script>

<script>
function fbLogin(){if(window._fbLogin)window._fbLogin();else{var b=document.getElementById('fb-login-btn');if(b)b.setAttribute('data-pending','1');}}
function fbLogout(){if(window._fbLogout)window._fbLogout();}
function fbToggleHistory(){if(window._fbToggleHistory)window._fbToggleHistory();}
function triggerSave(){if(window._triggerSave)window._triggerSave();}
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyA04LDMDGohAs1uRnUVwWVTs5coVMrEO64",
  authDomain: "sql-course-507b5.firebaseapp.com",
  projectId: "sql-course-507b5",
  storageBucket: "sql-course-507b5.firebasestorage.app",
  messagingSenderId: "999664091380",
  appId: "1:999664091380:web:349959985ae11ce8c51ea1"
});

const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
let currentUser = null;
window.currentUser = null;
const QUIZ_ID = 'medium';

onAuthStateChanged(auth, async (user) => {
  currentUser = user; window.currentUser = user;
  const loginBtn = document.getElementById('fb-login-btn');
  const logoutBtn = document.getElementById('fb-logout-btn');
  const userInfo = document.getElementById('fb-user-info');
  const histBtn = document.getElementById('fb-history-btn');
  const saveBtn = document.getElementById('fb-save-btn');
  if(user){
    document.getElementById('fb-user-name').textContent = user.displayName;
    document.getElementById('fb-user-photo').src = user.photoURL;
    document.getElementById('fb-user-photo').style.display = 'block';
    loginBtn.style.display='none'; logoutBtn.style.display='flex';
    userInfo.style.display='flex'; histBtn.style.display='flex'; saveBtn.style.display='flex';
    await loadProgress(); await loadHistory();
  } else {
    loginBtn.style.display='flex'; logoutBtn.style.display='none';
    userInfo.style.display='none'; histBtn.style.display='none'; saveBtn.style.display='none';
  }
});

window.fbLogin = async () => { try { await signInWithPopup(auth, provider); } catch(e){console.error(e);} };
window.fbLogout = async () => { await signOut(auth); };
window.fbToggleHistory = () => {
  const w = document.getElementById('fb-history-wrap');
  w.style.display = w.style.display==='none' ? 'block' : 'none';
};
window.triggerSave = async () => {
  if(!currentUser){ window.fbLogin(); return; }
  const scoreEl = document.getElementById('scoreText');
  const txt = scoreEl ? scoreEl.textContent.replace('✅ ','') : '0 / 0';
  const parts = txt.split('/');
  const sc = parseInt(parts[0])||0; const tot = parseInt(parts[1])||0;
  if(tot===0){ showToast('⚠️ ענה על לפחות שאלה אחת קודם!'); return; }
  await saveProgress(sc, tot);
};

async function saveProgress(score, total){
  if(!currentUser) return;
  const pct = Math.round(score/total*100);
  await setDoc(doc(db,'users',currentUser.uid,'quizzes',QUIZ_ID),{score,total,pct,lastUpdate:new Date().toISOString()},{merge:true});
  await addDoc(collection(db,'users',currentUser.uid,'history'),{quizId:QUIZ_ID,score,total,pct,date:new Date().toISOString()});
  showToast('✅ ההתקדמות נשמרה בענן!');
  await loadHistory();
}
window.fbAutoSave = saveProgress;

async function loadProgress(){
  if(!currentUser) return;
  const snap = await getDoc(doc(db,'users',currentUser.uid,'quizzes',QUIZ_ID));
  if(snap.exists()){
    const d = snap.data();
    const el = document.getElementById('fb-saved-score');
    el.textContent = `ניסיון אחרון: ${d.score}/${d.total} (${d.pct}%)`;
    el.style.display = 'block';
  }
}

async function loadHistory(){
  if(!currentUser) return;
  const q = query(collection(db,'users',currentUser.uid,'history'),orderBy('date','desc'),limit(10));
  const snap = await getDocs(q);
  const hist = [];
  snap.forEach(d=>hist.push(d.data()));
  renderChart(hist.filter(h=>h.quizId===QUIZ_ID));
}

function renderChart(history){
  const panel = document.getElementById('fb-history-panel');
  if(!history.length){ panel.innerHTML='<p style="color:var(--tc6);font-size:13px;text-align:center;padding:1rem">עדיין אין היסטוריה — ענה על שאלות ושמור!</p>'; return; }
  const rev = [...history].reverse();
  const best = Math.max(...history.map(h=>h.pct));
  const avg = Math.round(history.reduce((a,h)=>a+h.pct,0)/history.length);
  const bars = rev.map(h=>{
    const d = new Date(h.date);
    const lbl = `${d.getDate()}/${d.getMonth()+1}`;
    const color = h.pct>=80?'var(--aq)':h.pct>=50?'#FFB020':'#FF4060';
    return `<div class="hbar-wrap"><div class="hbar-val">${h.pct}%</div><div class="hbar" style="height:${Math.max(h.pct*1.1,8)}px;background:${color}"></div><div class="hbar-lbl">${lbl}</div></div>`;
  }).join('');
  panel.innerHTML = `<div class="hstats-row"><div class="hstat-mini"><div class="hstat-n" style="color:var(--tc5)">${best}%</div><div class="hstat-l">שיא אישי</div></div><div class="hstat-mini"><div class="hstat-n" style="color:var(--tc30)">${avg}%</div><div class="hstat-l">ממוצע</div></div><div class="hstat-mini"><div class="hstat-n" style="color:var(--tc6)">${history.length}</div><div class="hstat-l">ניסיונות</div></div></div><div class="hchart">${bars}</div>`;
}

function showToast(msg){
  let t=document.getElementById('fb-toast');
  if(!t){t=document.createElement('div');t.id='fb-toast';document.body.appendChild(t);}
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
<script>(function(){
  var D=document,H=D.documentElement;
  function cur(){return H.getAttribute('data-theme')==='light'?'light':'dark';}
  var wrap=D.createElement('div');
  wrap.className='egr-theme';wrap.id='egrTheme';
  wrap.setAttribute('role','group');
  wrap.setAttribute('aria-label','Theme');
  var bD=D.createElement('button'),bL=D.createElement('button');
  bD.type='button';bL.type='button';
  bD.id='egrThemeDark';bL.id='egrThemeLight';
  bD.innerHTML='<span class="egr-i" aria-hidden="true">\u263E</span><span>Dark Mode</span>';
  bL.innerHTML='<span class="egr-i" aria-hidden="true">\u2600</span><span>Light Mode</span>';
  bD.title='Dark Mode';bL.title='Light Mode';
  wrap.appendChild(bD);wrap.appendChild(bL);
  function paint(){var l=cur()==='light';
    bD.setAttribute('aria-pressed',l?'false':'true');
    bL.setAttribute('aria-pressed',l?'true':'false');
    var mt=D.querySelector('meta[name="theme-color"]');
    if(mt){if(!mt.dataset.egrDark)mt.dataset.egrDark=mt.getAttribute('content')||'';
      mt.setAttribute('content',l?'#f2f4f8':mt.dataset.egrDark);}}
  function set(t){H.setAttribute('data-theme',t);
    try{localStorage.setItem('egr-theme',t);}catch(e){}
    paint();}
  bD.addEventListener('click',function(){set('dark');});
  bL.addEventListener('click',function(){set('light');});
  function box(el){if(!el)return null;
    var c=el.closest?el.closest('header,.topnav,.topbar,.header,nav'):null;
    return c||el.parentElement||el;}
  function float(){if(wrap.parentNode)wrap.parentNode.removeChild(wrap);
    wrap.style.marginInlineStart='';wrap.classList.add('egr-floating');
    D.body.appendChild(wrap);}
  function mount(){
    var fl=D.querySelectorAll('a[title="\u05E2\u05D1\u05E8\u05D9\u05EA"],a[title="English"],a[title="\u4E2D\u6587"]');
    var anchor=null,mode=0;
    if(fl.length>=2&&fl[0].parentNode){anchor=fl[0];mode=1;}
    else{
      anchor=D.querySelector('.lang-flags')||D.querySelector('.lang')||
             D.querySelector('.topnav-right')||D.querySelector('.header-right')||
             D.querySelector('.nav-right')||D.querySelector('.topbar-right')||
             D.querySelector('header .hd')||D.querySelector('.header-inner')||
             D.querySelector('.topbar')||D.querySelector('.topnav')||
             D.querySelector('header');
      mode=anchor?2:0;
    }
    if(!mode){float();paint();return;}
    var frame=box(anchor);
    var h0=frame?frame.getBoundingClientRect().height:0;
    var restore=null;
    if(mode===1){
      if(anchor.style&&anchor.style.marginInlineStart==='auto'){
        restore=anchor;wrap.style.marginInlineStart='auto';anchor.style.marginInlineStart='0';
      }
      anchor.parentNode.insertBefore(wrap,anchor);
    }else{anchor.appendChild(wrap);}
    function fits(){
      var r=wrap.getBoundingClientRect();
      var h1=frame?frame.getBoundingClientRect().height:0;
      var fr=frame?frame.getBoundingClientRect():null;
      if(r.width<40||r.height<10)return false;
      if(frame&&h1>h0+1)return false;
      if(fr&&(r.right>fr.right+2||r.left<fr.left-2))return false;
      return true;
    }
    if(!fits()){
      // keep the full wording, just tighten it
      wrap.classList.add('egr-mid');
      if(!fits()){
        // last try inside the header: shorter words
        wrap.classList.remove('egr-mid');wrap.classList.add('egr-compact');
        bD.lastChild.textContent='Dark';bL.lastChild.textContent='Light';
        if(!fits()){
          wrap.classList.remove('egr-compact');
          bD.lastChild.textContent='Dark Mode';bL.lastChild.textContent='Light Mode';
          if(restore)restore.style.marginInlineStart='auto';
          float();
        }
      }
    }
    paint();}
  function guardCovered(){
    if(wrap.classList.contains('egr-floating'))return;
    var r=wrap.getBoundingClientRect();
    if(r.width<10)return;
    var t=D.elementFromPoint(r.left+r.width*0.75, r.top+r.height/2);
    if(t&&!wrap.contains(t)){float();paint();}
  }
  function start(){mount();
    setTimeout(guardCovered,3000);setTimeout(guardCovered,8000);}
  if(D.readyState==='loading')D.addEventListener('DOMContentLoaded',start);else start();
})();</script></body>
