<style>
/* ============================================================
   עיצוב — תואם לשפה הוויזואלית של האתר (כהה, RTL, טורקיז)
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }

:root {
  --bg-0:#0b0e13; --bg-1:#12161d; --bg-2:#181d26; --bg-3:#1f2530;
  --line:#2a3140; --line-2:#39414f;
  --fg-1:#e6edf3; --fg-2:#a9b4c2; --fg-3:#8e99a8;
  --accent:#00d4c8; --accent-dim:rgba(0,212,200,.14);
  --green:#4ade80; --red:#ff6b6b; --amber:#ffb84d; --blue:#7aa7ff; --purple:#c084fc;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --sans:"Heebo","Segoe UI",Arial,sans-serif;
  --r:10px; --shadow:0 8px 28px rgba(0,0,0,.4);
  --sidebar-w:310px;
}

html, body { height:100%; max-width:100%; overflow-x:hidden; }
body {
  margin:0; background:var(--bg-0); color:var(--fg-1);
  font:15px/1.7 var(--sans); overflow:hidden;
}
button { font:inherit; cursor:pointer; }
::-webkit-scrollbar { width:9px; height:9px; }
::-webkit-scrollbar-track { background:var(--bg-1); }
::-webkit-scrollbar-thumb { background:var(--line-2); border-radius:99px; }
::-webkit-scrollbar-thumb:hover { background:#4a5464; }

/* ---------- שלד העמוד ---------- */
.app { display:flex; flex-direction:column; height:100vh; height:100dvh;
  min-width:0; max-width:100%; overflow-x:hidden; }

.topbar {
  display:flex; align-items:center; gap:14px; padding:0 16px; height:56px;
  background:var(--bg-1); border-bottom:1px solid var(--line); flex:0 0 auto;
  min-width:0; overflow:hidden;
}
.brand { display:flex; align-items:center; gap:9px; font-weight:700; font-size:16px; }
.brand .dot { width:9px; height:9px; border-radius:99px; background:var(--accent);
  box-shadow:0 0 12px var(--accent); }
.brand small { color:var(--fg-3); font-weight:500; font-size:12px; }

.kernel { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--fg-2);
  background:var(--bg-2); border:1px solid var(--line); border-radius:99px; padding:5px 12px; }
.kernel .led { width:7px; height:7px; border-radius:99px; background:var(--amber); }
.kernel.ready .led { background:var(--green); box-shadow:0 0 8px var(--green); }
.kernel.err   .led { background:var(--red); }

.xp { margin-inline-start:auto; display:flex; align-items:center; gap:14px; font-size:12.5px; color:var(--fg-2); }
.xp b { color:var(--accent); font-size:14px; }
.xp .bar { width:120px; height:6px; background:var(--bg-3); border-radius:99px; overflow:hidden; }
.xp .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--blue)); }

.icon-btn { background:var(--bg-2); border:1px solid var(--line); color:var(--fg-2);
  border-radius:8px; padding:6px 11px; font-size:13px; }
.icon-btn:hover { color:var(--fg-1); border-color:var(--accent); }

.body { display:flex; flex:1 1 auto; min-height:0; min-width:0; }

/* ---------- סרגל צד ---------- */
.sidebar { width:var(--sidebar-w); flex:0 0 var(--sidebar-w); background:var(--bg-1);
  border-inline-start:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
.sb-top { padding:12px; border-bottom:1px solid var(--line); }
.sb-search { width:100%; background:var(--bg-2); border:1px solid var(--line); color:var(--fg-1);
  border-radius:8px; padding:8px 11px; font:inherit; font-size:13.5px; }
.sb-search:focus { outline:none; border-color:var(--accent); }
.sb-filters { display:flex; gap:6px; margin-top:9px; flex-wrap:wrap; }
.chip { background:var(--bg-2); border:1px solid var(--line); color:var(--fg-3);
  border-radius:99px; padding:4px 11px; font-size:12px; user-select:none; }
.chip:hover { color:var(--fg-1); }
.chip.on { background:var(--accent); color:#04302d; border-color:var(--accent); font-weight:600; }
.sb-list { flex:1 1 auto; overflow-y:auto; padding:8px; }
.lvl-head { position:sticky; top:0; z-index:2; background:var(--bg-1); padding:9px 8px 6px;
  font-size:11.5px; font-weight:700; color:var(--accent); letter-spacing:.03em;
  display:flex; align-items:center; gap:8px; }
.lvl-head .ln { flex:1; height:1px; background:var(--line); }
.ex-item { display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:8px;
  cursor:pointer; font-size:13px; color:var(--fg-2); }
.ex-item:hover { background:var(--bg-2); color:var(--fg-1); }
.ex-item.active { background:var(--accent-dim); color:var(--fg-1);
  box-shadow:inset 2px 0 0 var(--accent); }
.ex-item .n { font-family:var(--mono); font-size:11.5px; color:var(--fg-3); min-width:26px; }
.ex-item.done .n { color:var(--green); }
.ex-item .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ex-item .st { width:15px; text-align:center; font-size:12px; }
.d-tag { font-size:10px; padding:1px 6px; border-radius:5px; font-weight:600; }
.d-easy   { background:rgba(74,222,128,.15); color:var(--green); }
.d-med    { background:rgba(122,167,255,.15); color:var(--blue); }
.d-hard   { background:rgba(255,184,77,.15);  color:var(--amber); }
.d-expert { background:rgba(192,132,252,.16); color:var(--purple); }

/* ---------- אזור עבודה ---------- */
.main { flex:1 1 auto; display:flex; min-width:0; min-height:0; }
.pane { display:flex; flex-direction:column; min-width:0; min-height:0; }
.pane-desc   { flex:0 0 33%; border-inline-start:1px solid var(--line); overflow-y:auto; background:var(--bg-1); }
.pane-work   { flex:1 1 auto; }

.ex-head { padding:16px 20px 12px; border-bottom:1px solid var(--line); }
.ex-head h1 { margin:0 0 8px; font-size:19px; line-height:1.4; }
.ex-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--fg-3); }
.ex-meta .pts { color:var(--accent); font-weight:600; }
.tag { background:var(--bg-3); border:1px solid var(--line); color:var(--fg-3);
  border-radius:6px; padding:1px 8px; font-size:11px; }

.ex-body { padding:16px 20px 28px; font-size:14.5px; line-height:1.85; }
.ex-body h3 { color:var(--accent); font-size:14px; margin:20px 0 7px; }
.ex-body code { background:var(--bg-3); padding:1px 6px; border-radius:5px;
  font-family:var(--mono); font-size:12.5px; direction:ltr; display:inline-block; }
.ex-body pre { background:var(--bg-0); border:1px solid var(--line); border-radius:var(--r);
  padding:11px 13px; overflow-x:auto; direction:ltr; text-align:left;
  font-family:var(--mono); font-size:12.5px; line-height:1.65; margin:10px 0; }
.ex-body ul { padding-inline-start:20px; margin:8px 0; }
.ex-body li { margin:4px 0; }
.ex-body b { color:var(--fg-1); }

.disclosure { margin:14px 0; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
.disclosure > summary { padding:10px 14px; cursor:pointer; font-size:13.5px; font-weight:600;
  color:var(--fg-2); background:var(--bg-2); list-style:none; user-select:none; }
.disclosure > summary::-webkit-details-marker { display:none; }
.disclosure > summary::before { content:'▸ '; color:var(--accent); }
.disclosure[open] > summary::before { content:'▾ '; }
.disclosure > summary:hover { color:var(--fg-1); }
.disclosure .inner { padding:12px 14px; border-top:1px solid var(--line); font-size:13.5px; }
.disclosure.hint > summary { color:var(--amber); }
.disclosure.sol  > summary { color:var(--purple); }

/* ---------- עורך + מראה ---------- */
.split { display:flex; flex-direction:column; flex:1 1 auto; min-height:0; min-width:0; }
.sec-bar { display:flex; align-items:center; gap:10px; padding:8px 14px; flex-wrap:wrap;
  background:var(--bg-1); border-bottom:1px solid var(--line); flex:0 0 auto; font-size:12.5px;
  min-width:0; }
.sec-bar .ttl { font-weight:600; color:var(--fg-2); display:flex; align-items:center; gap:7px; }
.sec-bar .ttl .sq { width:7px; height:7px; border-radius:2px; background:var(--accent); }
.sec-bar .sp { margin-inline-start:auto; display:flex; gap:8px; align-items:center; }
.kbd { font-family:var(--mono); font-size:10.5px; background:var(--bg-3); border:1px solid var(--line);
  border-bottom-width:2px; border-radius:5px; padding:1px 6px; color:var(--fg-3); }

.editor-wrap { flex:1 1 58%; min-height:0; min-width:0; position:relative; overflow:hidden; }
.CodeMirror { height:100% !important; font-family:var(--mono) !important; font-size:13.5px;
  line-height:1.7; direction:ltr; text-align:left; background:var(--bg-0) !important; }
.CodeMirror-gutters { background:var(--bg-1) !important; border-inline-end:1px solid var(--line) !important; }
.CodeMirror-activeline-background { background:rgba(255,255,255,.03) !important; }
/* ערכת material-darker נותנת להערות ולמספרי השורה ניגודיות 2.55:1 — מתחת ל-AA.
   מעלים אותם לרמה קריאה בלי לשנות את שאר הצבעים. */
.cm-s-material-darker .cm-comment { color:#8a99a3 !important; }
.cm-s-material-darker .CodeMirror-linenumber { color:#7f8c99 !important; }
.cm-s-material-darker .CodeMirror-cursor { border-inline-start:2px solid var(--accent) !important; }
.CodeMirror-hints { z-index:9999; font-family:var(--mono); font-size:12.5px; direction:ltr;
  background:var(--bg-2); border:1px solid var(--line-2); border-radius:8px;
  box-shadow:var(--shadow); max-height:260px; padding:4px; }
.CodeMirror-hint { color:var(--fg-1); padding:4px 9px; border-radius:6px; }
li.CodeMirror-hint-active { background:var(--accent); color:#04302d; font-weight:600; }
.hint-kind { float:right; font-size:10px; opacity:.65; margin-inline-start:10px; font-family:var(--sans); }

.mirror-wrap { flex:1 1 42%; min-height:0; display:flex; flex-direction:column;
  border-top:1px solid var(--line); background:var(--bg-0); }
.mirror-out { flex:1 1 auto; overflow:auto; padding:12px 14px; margin:0;
  font-family:var(--mono); font-size:13px; line-height:1.7; direction:ltr; text-align:left;
  white-space:pre-wrap; word-break:break-word; color:var(--fg-1); }
.mirror-out.err { color:#ffb3bc; }
.mirror-out .muted { color:var(--fg-2); }
.live-dot { width:7px; height:7px; border-radius:99px; background:var(--fg-3); }
.live-dot.on { background:var(--green); box-shadow:0 0 8px var(--green); animation:pulse 1.4s infinite; }
.live-dot.run { background:var(--amber); box-shadow:0 0 8px var(--amber); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

.switch { display:inline-flex; align-items:center; gap:7px; color:var(--fg-3); font-size:12px;
  cursor:pointer; user-select:none; min-height:34px; padding:4px 2px; }
.switch input { appearance:none; -webkit-appearance:none; flex:0 0 auto;
  width:34px; height:19px; min-width:34px; background:var(--bg-3); border:1px solid var(--line);
  border-radius:99px; position:relative; cursor:pointer; transition:.15s; margin:0; }
.switch input::after { content:''; position:absolute; top:2px; inset-inline-start:2px; width:13px; height:13px;
  border-radius:99px; background:var(--fg-3); transition:.15s; }
.switch input:checked { background:var(--accent-dim); border-color:var(--accent); }
.switch input:checked::after { inset-inline-start:17px; background:var(--accent); }
.switch input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

/* ---------- כפתורים ופאנל בדיקות ---------- */
.actions { display:flex; gap:9px; padding:10px 14px; background:var(--bg-1);
  border-top:1px solid var(--line); flex:0 0 auto; align-items:center; flex-wrap:wrap; min-width:0; }
.btn { border:1px solid var(--line); background:var(--bg-2); color:var(--fg-1);
  border-radius:9px; padding:8px 16px; font-size:13.5px; font-weight:600; transition:.14s; }
.btn:hover { border-color:var(--line-2); }
.btn.primary { background:var(--accent); color:#04302d; border-color:var(--accent); }
.btn.primary:hover { filter:brightness(1.08); }
.btn.ghost { background:transparent; color:var(--fg-2); }
.btn:disabled { opacity:.45; cursor:not-allowed; }

.tests { border-top:1px solid var(--line); background:var(--bg-1); flex:0 0 auto;
  max-height:38vh; overflow-y:auto; display:none; }
.tests.show { display:block; }
.tests-head { padding:11px 15px; display:flex; align-items:center; gap:10px;
  font-weight:700; font-size:14px; position:sticky; top:0; background:var(--bg-1); z-index:2; }
.tests-head .badge { border-radius:99px; padding:2px 11px; font-size:12px; }
.tests-head.pass .badge { background:rgba(74,222,128,.16); color:var(--green); }
.tests-head.fail .badge { background:rgba(255,107,107,.16); color:var(--red); }
.t-row { display:flex; gap:10px; padding:8px 15px; border-top:1px solid var(--line); font-size:13px; align-items:flex-start; }
.t-row .ic { font-family:var(--mono); font-weight:700; }
.t-row.ok .ic { color:var(--green); }
.t-row.no .ic { color:var(--red); }
.t-row .nm { flex:1; }
.t-row .msg { display:block; color:var(--fg-3); font-family:var(--mono); font-size:11.5px;
  direction:ltr; text-align:left; margin-top:3px; }

.why { margin:12px 15px 16px; padding:13px 15px; border-radius:var(--r);
  background:var(--accent-dim); border:1px solid rgba(0,212,200,.3); font-size:14px; line-height:1.85; }
.why h4 { margin:0 0 7px; color:var(--accent); font-size:13px; }
.why code { background:rgba(0,0,0,.34); padding:1px 5px; border-radius:4px;
  font-family:var(--mono); font-size:12.5px; direction:ltr; display:inline-block; }
.why pre { background:rgba(0,0,0,.34); border-radius:8px; padding:10px 12px; overflow-x:auto;
  direction:ltr; text-align:left; font-family:var(--mono); font-size:12.5px; margin:8px 0; }

.toast { position:fixed; inset-block-end:22px; inset-inline-start:50%; transform:translateX(50%);
  background:var(--bg-2); border:1px solid var(--accent); color:var(--fg-1);
  border-radius:10px; padding:11px 20px; font-size:13.5px; font-weight:600;
  box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:.22s; z-index:999; }
.toast.show { opacity:1; transform:translateX(50%) translateY(-6px); }

/* ---------- רספונסיבי ---------- */
.mobile-only { display:none; }
@media (max-width:1100px) { .pane-desc { flex:0 0 40%; } }
@media (max-width:430px) {
  /* מסכי טלפון צרים — פריסה מינימלית */
  .btn { padding:9px 11px; font-size:12.5px; }
  .actions { gap:6px; }
  .xp span:first-child { display:none; }
  .sec-bar .switch span { display:none; }   /* משאירים את המתג, מוותרים על התווית */
  .ex-head { padding:13px 14px 10px; }
  .ex-head h1 { font-size:17px; }
  .ex-body { padding:13px 14px 22px; font-size:14px; }
}

@media (max-width:900px) {
  .mobile-only { display:inline-flex; }
  /* בנייד אין מקלדת פיזית — הקיצורים רק תופסים מקום */
  .sec-bar .sp .kbd, .sec-bar .sp .kbd + span { display:none; }
  .brand small { display:none; }
  .brand { font-size:15px; }
  .topbar { gap:10px; padding:0 12px; }
  .xp { gap:10px; font-size:11.5px; }
  .actions { gap:7px; padding:9px 10px; }
  .btn { padding:9px 13px; font-size:13px; }
  .sec-bar { padding:7px 10px; gap:8px; }
  /* בעמוד RTL, inset-inline-end:0 מציב את המגירה בקצה השמאלי —
     ולכן ההסתרה חייבת להיות translateX שלילי. חיובי היה משאיר אותה בתוך המסך. */
  .sidebar { position:fixed; inset-block:56px 0; inset-inline-end:0; z-index:60;
    transform:translateX(-100%); transition:transform .22s; box-shadow:var(--shadow);
    visibility:hidden; }
  .sidebar.open { transform:translateX(0); visibility:visible; }
  /* שכבת רקע: נותנת אזור ברור לסגירת המגירה, ומונעת נגיעות בטעות בתוכן שמאחור */
  .scrim { position:fixed; inset:56px 0 0 0; background:rgba(0,0,0,.55); z-index:55;
    opacity:0; pointer-events:none; transition:opacity .22s; }

window.PY200_EXERCISES = [{"id":1,"num":1,"level":1,"title":"שלום עולם","diff":"easy","points":10,"tags":["print","מחרוזות","משתנים"],"desc":"<p>התרגיל הראשון בכל שפת תכנות: להדפיס טקסט למסך.</p><p>צור משתנה בשם <code>greeting</code> שהערך שלו הוא המחרוזת <code>Hello, World!</code> (בדיוק כך, כולל האות הגדולה, הפסיק, הרווח וסימן הקריאה), ואז הדפס אותו בעזרת <code>print</code>.</p><p><b>הפלט הצפוי:</b></p><pre>Hello, World!</pre>","hint":"מחרוזת (string) נכתבת בין מרכאות: <code>\"טקסט\"</code>. השמה למשתנה נעשית בסימן <code>=</code>, והצד שמקבל את הערך תמיד נמצא משמאל.","starter":"# צור כאן משתנה בשם greeting והדפס אותו\n","solution":"greeting = \"Hello, World!\"   # השמה: השם משמאל, הערך מימין\nprint(greeting)\n","explanation":"<p>שורת ההשמה יוצרת בזיכרון תא בשם <code>greeting</code> ושומרת בו את המחרוזת. <code>print</code> היא פונקציה מובנית שמדפיסה למסך את הערך שהיא מקבלת.</p><p>שים לב להפרדה בין שני הדברים: המשתנה מחזיק את הערך, וההדפסה רק מציגה אותו. אם נדפיס בלי לשמור במשתנה, הערך יאבד מיד.</p>","tests":[{"name":"הערך נכון","code":"assert greeting == \"Hello, World!\", \"greeting צריך להיות בדיוק Hello, World!\""},{"name":"הטיפוס מחרוזת","code":"assert isinstance(greeting, str), \"greeting צריך להיות מחרוזת\""},{"name":"אורך המחרוזת","code":"assert len(greeting) == 13, \"אורך המחרוזת צריך להיות 13 תווים\""}]},{"id":2,"num":2,"level":1,"title":"הדפסת כמה ערכים בשורה אחת","diff":"easy","points":10,"tags":["print","משתנים"],"desc":"<p>ל-<code>print</code> אפשר להעביר כמה ערכים מופרדים בפסיק, והיא תדפיס את כולם בשורה אחת עם רווח ביניהם.</p><p>צור שלושה משתנים:</p><ul><li><code>city</code> — המחרוזת <code>תל אביב</code></li><li><code>country</code> — המחרוזת <code>ישראל</code></li><li><code>year</code> — המספר השלם <code>1909</code> (בלי מרכאות!)</li></ul><p>ואז הדפס את שלושתם בקריאה אחת: <code>print(city, country, year)</code>.</p><p><b>הפלט הצפוי:</b></p><pre>תל אביב ישראל 1909</pre>","hint":"מספר נכתב בלי מרכאות. <code>1909</code> הוא מספר, ואילו <code>\"1909\"</code> הוא מחרוזת — שני דברים שונים לגמרי.","starter":"# צור כאן את שלושת המשתנים city, country, year\n# ואז הדפס אותם בקריאה אחת ל-print\n","solution":"city = \"תל אביב\"\ncountry = \"ישראל\"\nyear = 1909            # בלי מרכאות — זהו מספר שלם\n\nprint(city, country, year)\n","explanation":"<p><code>print</code> יכולה לקבל מספר ארגומנטים ומדפיסה אותם ברצף, כשברירת המחדל היא רווח בין ערך לערך.</p><p>ההבדל החשוב כאן הוא בין <code>1909</code> ל-<code>\"1909\"</code>: הראשון מספר שאפשר לחשב איתו, השני מחרוזת שאפשר רק לשרשר. בהדפסה שניהם נראים אותו דבר — אבל הם לא.</p>","tests":[{"name":"שם העיר","code":"assert city == \"תל אביב\""},{"name":"שם המדינה","code":"assert country == \"ישראל\""},{"name":"השנה נכונה","code":"assert year == 1909"},{"name":"השנה היא מספר ולא מחרוזת","code":"assert isinstance(year, int), \"year צריך להיות מספר שלם, לא מחרוזת\""}]},{"id":3,"num":3,"level":1,"title":"החלפת ערכים בין שני משתנים","diff":"easy","points":10,"tags":["משתנים","השמה"],"desc":"<p>בקוד נתונים שני משתנים:</p><pre>a = 5\nb = 9</pre><p>החלף ביניהם, כך שבסוף הריצה <code>a</code> יחזיק 9 ו-<code>b</code> יחזיק 5. אל תשנה את שתי שורות ההשמה הראשונות — הוסף קוד אחריהן.</p><p><b>דוגמה:</b> לפני — <code>a=5, b=9</code>; אחרי — <code>a=9, b=5</code>.</p>","hint":"בפייתון אפשר לבצע השמה לכמה משתנים בבת אחת: <code>x, y = 1, 2</code>. הצד הימני מחושב במלואו לפני שמשהו נכתב בצד השמאלי.","starter":"a = 5\nb = 9\n# החלף כאן בין הערכים של a ו-b\n","solution":"a = 5\nb = 9\n\n# פייתון מחשב קודם את כל הצד הימני (9, 5) ורק אז משים בצד השמאלי\na, b = b, a\n","explanation":"<p>בשפות רבות נדרש משתנה עזר: <code>tmp = a; a = b; b = tmp</code>. בפייתון יש קיצור אלגנטי — <code>a, b = b, a</code>.</p><p>הסיבה שזה עובד: הצד הימני מחושב תחילה ונארז כטאפל (tuple — רצף סדור ובלתי-משתנה) עם הערכים המקוריים, ורק אחר כך הערכים נפרקים חזרה למשתנים. לכן הדריסה של <code>a</code> לא פוגעת בערך הישן שלו.</p>","tests":[{"name":"a קיבל את הערך של b","code":"assert a == 9, \"ציפינו ש-a יהיה 9\""},{"name":"b קיבל את הערך של a","code":"assert b == 5, \"ציפינו ש-b יהיה 5\""},{"name":"הזוג כולו נכון","code":"assert (a, b) == (9, 5)"},{"name":"ההחלפה בוצעה והטיפוסים נשמרו","code":"assert isinstance(a, int) and isinstance(b, int) and a > b, \"אחרי ההחלפה a חייב להיות גדול מ-b\""}]},{"id":4,"num":4,"level":1,"title":"עדכון משתנה בזמן ריצה","diff":"easy","points":10,"tags":["משתנים","אריתמטיקה","השמה"],"desc":"<p>משתנה יכול לשנות את ערכו במהלך התוכנית. הקיצור <code>x += 5</code> שקול ל-<code>x = x + 5</code>, ו-<code>x -= 5</code> שקול ל-<code>x = x - 5</code>.</p><p>התחל מ-<code>salary = 8000</code> ובצע עליו, בסדר הזה:</p><ol><li>העלאה של 1200</li><li>ניכוי מס של 1500</li></ol><p>לאחר מכן צור משתנה חדש <code>annual</code> שהוא המשכורת הסופית כפול 12.</p><p><b>הערכים הצפויים:</b> <code>salary</code> = 7700, <code>annual</code> = 92400.</p>","hint":"כל שורה מתבצעת לפי הסדר. <code>salary += 1200</code> קורא את הערך הנוכחי, מוסיף, וכותב חזרה לאותו משתנה.","starter":"salary = 8000\n# עדכן כאן את salary, ואז חשב את annual\n","solution":"salary = 8000\nsalary += 1200      # שקול ל: salary = salary + 1200\nsalary -= 1500      # שקול ל: salary = salary - 1500\n\nannual = salary * 12\n","explanation":"<p>משתנה בפייתון הוא שם שמצביע על ערך. השמה חוזרת פשוט מפנה את השם לערך חדש — הערך הישן נזרק.</p><p>האופרטורים <code>+=</code> ו-<code>-=</code> נקראים augmented assignment. הם לא עושים שום דבר קסום: הם קיצור תחבירי לקריאה, חישוב וכתיבה חזרה. כל שורה פועלת על הערך שהשאירה קודמתה. בחיבור ובחיסור בלבד אפשר להחליף בין שתי השורות ולקבל את אותה תוצאה, אבל ברגע שמעורבים כפל או חילוק — הסדר משנה מאוד.</p>","tests":[{"name":"המשכורת הסופית","code":"assert salary == 7700, \"ציפינו ל-7700\""},{"name":"החישוב השנתי","code":"assert annual == 92400, \"ציפינו ל-92400\""},{"name":"annual הוא מספר שלם","code":"assert isinstance(annual, int)"},{"name":"annual נגזר מ-salary","code":"assert annual == salary * 12"}]},{"id":5,"num":5,"level":1,"title":"ארבעת הטיפוסים הבסיסיים","diff":"easy","points":10,"tags":["טיפוסים","משתנים"],"desc":"<p>לכל ערך בפייתון יש טיפוס (type). ארבעת הבסיסיים הם:</p><ul><li><code>int</code> — מספר שלם, למשל <code>7</code></li><li><code>float</code> — מספר עשרוני, למשל <code>19.9</code></li><li><code>str</code> — מחרוזת טקסט, למשל <code>\"מחשב\"</code></li><li><code>bool</code> — ערך אמת, <code>True</code> או <code>False</code></li></ul><p>צור ארבעה משתנים, אחד מכל טיפוס:</p><ul><li><code>count</code> = 7</li><li><code>price</code> = 19.9</li><li><code>name</code> = <code>\"מחשב\"</code></li><li><code>in_stock</code> = <code>True</code></li></ul>","hint":"<code>True</code> ו-<code>False</code> נכתבים באות ראשונה גדולה ובלי מרכאות. מספר עשרוני משתמש בנקודה, לא בפסיק.","starter":"# צור כאן את ארבעת המשתנים: count, price, name, in_stock\n","solution":"count = 7           # int   — מספר שלם\nprice = 19.9        # float — מספר עשרוני (נקודה, לא פסיק)\nname = \"מחשב\"       # str   — מחרוזת\nin_stock = True     # bool  — אמת/שקר, באות גדולה ובלי מרכאות\n","explanation":"<p>פייתון היא שפה עם טיפוסים דינמיים: לא מצהירים על הטיפוס מראש, הוא נקבע מהערך שהושם. <code>7</code> יוצר <code>int</code>, <code>7.0</code> יוצר <code>float</code>.</p><p>הטיפוס חשוב כי הוא קובע אילו פעולות מותרות. אפשר לחסר שני <code>int</code>, אבל אי אפשר לחסר שתי מחרוזות. <code>bool</code> הוא למעשה מקרה פרטי של <code>int</code> בפייתון (<code>True</code> שווה 1), אבל <code>isinstance(x, bool)</code> יודע להבחין ביניהם.</p>","tests":[{"name":"count הוא int בערך 7","code":"assert count == 7 and isinstance(count, int)"},{"name":"price הוא float בערך 19.9","code":"assert price == 19.9 and isinstance(price, float)"},{"name":"name הוא מחרוזת","code":"assert name == \"מחשב\" and isinstance(name, str)"},{"name":"in_stock הוא בוליאני","code":"assert in_stock is True and isinstance(in_stock, bool), \"in_stock צריך להיות True בוליאני\""}]},{"id":6,"num":6,"level":1,"title":"בדיקת טיפוס עם isinstance","diff":"easy","points":10,"tags":["טיפוסים","בוליאנים"],"desc":"<p>הפונקציה <code>isinstance(value, type)</code> מחזירה <code>True</code> אם הערך הוא מהטיפוס שנבדק. למשל הקריאה <code>isinstance(5, int)</code> מחזירה <code>True</code>.</p><p>בקוד נתונים ארבעה ערכים:</p><pre>a = 42\nb = \"42\"\nc = 4.2\nd = False</pre><p>צור חמישה משתנים בוליאניים שבודקים אותם: <code>a_is_int</code>, <code>b_is_str</code>, <code>b_is_int</code>, <code>c_is_float</code>, <code>d_is_bool</code>.</p><p><b>שים לב:</b> <code>b</code> נראה כמו מספר, אבל הוא מחרוזת — ולכן <code>b_is_int</code> צריך לצאת <code>False</code>.</p>","hint":"אל תנחש את התשובות ואל תכתוב <code>True</code> ידנית — תן ל-<code>isinstance</code> לחשב אותן בשבילך.","starter":"a = 42\nb = \"42\"\nc = 4.2\nd = False\n# חשב כאן את חמשת המשתנים הבוליאניים\n","solution":"a = 42\nb = \"42\"\nc = 4.2\nd = False\n\na_is_int = isinstance(a, int)\nb_is_str = isinstance(b, str)\nb_is_int = isinstance(b, int)    # False — מחרוזת שנראית כמו מספר היא עדיין מחרוזת\nc_is_float = isinstance(c, float)\nd_is_bool = isinstance(d, bool)\n","explanation":"<p><code>isinstance</code> היא הדרך המקובלת לבדוק טיפוס. היא עדיפה על השוואה ישירה כמו <code>type(x) == int</code> כי היא מכבדת גם ירושה בין מחלקות.</p><p>המלכודת הקלאסית שהתרגיל מדגים: <code>\"42\"</code> ו-<code>42</code> נראים זהים כשמדפיסים אותם, אבל הם טיפוסים שונים. זו הסיבה שחייבים להמיר טקסט למספר לפני שמחשבים איתו — נושא התרגיל הבא.</p>","tests":[{"name":"a הוא int","code":"assert a_is_int is True"},{"name":"b הוא מחרוזת","code":"assert b_is_str is True"},{"name":"b אינו int למרות שנראה כמו מספר","code":"assert b_is_int is False, \"מחרוזת \\\"42\\\" אינה int\""},{"name":"c הוא float","code":"assert c_is_float is True"},{"name":"d הוא בוליאני","code":"assert d_is_bool is True"}]},{"id":7,"num":7,"level":1,"title":"המרת טקסט למספר","diff":"easy","points":10,"tags":["המרות","טיפוסים","אריתמטיקה"],"desc":"<p>נתונים שני ערכים כטקסט:</p><pre>qty_text = \"12\"\nprice_text = \"4.5\"</pre><p>אי אפשר לכפול מחרוזות זו בזו, ולכן צריך להמיר. צור:</p><ul><li><code>qty</code> — <code>qty_text</code> כמספר שלם (<code>int</code>)</li><li><code>price</code> — <code>price_text</code> כמספר עשרוני (<code>float</code>)</li><li><code>total</code> — המכפלה שלהם</li><li><code>total_text</code> — <code>total</code> חזרה כמחרוזת (<code>str</code>)</li></ul><p><b>דוגמה:</b> 12 כפול 4.5 שווה 54.0, ולכן <code>total_text</code> יהיה <code>\"54.0\"</code>.</p>","hint":"שלוש פונקציות ההמרה נקראות בדיוק כמו שמות הטיפוסים: <code>int()</code>, <code>float()</code>, <code>str()</code>.","starter":"qty_text = \"12\"\nprice_text = \"4.5\"\n# המר כאן וחשב\n","solution":"qty_text = \"12\"\nprice_text = \"4.5\"\n\nqty = int(qty_text)          # \"12\"  -> 12\nprice = float(price_text)    # \"4.5\" -> 4.5\ntotal = qty * price          # int * float -> float\ntotal_text = str(total)      # 54.0 -> \"54.0\"\n","explanation":"<p>המרת טיפוס (casting) היא פעולה מפורשת בפייתון — השפה לא תמיר בשבילך. <code>\"12\" * 4</code> לא ייתן 48 אלא ישכפל את המחרוזת ארבע פעמים.</p><p>שים לב ש-<code>total</code> יצא <code>float</code> ולא <code>int</code>: כשמערבבים <code>int</code> עם <code>float</code> בפעולה אריתמטית, פייתון מקדם את התוצאה ל-<code>float</code> כדי לא לאבד דיוק. לכן <code>str(total)</code> מחזיר <code>\"54.0\"</code> ולא <code>\"54\"</code>.</p>","tests":[{"name":"ההמרה ל-int","code":"assert qty == 12 and isinstance(qty, int)"},{"name":"ההמרה ל-float","code":"assert price == 4.5 and isinstance(price, float)"},{"name":"המכפלה","code":"assert total == 54.0, \"ציפינו ל-54.0\""},{"name":"ההמרה חזרה למחרוזת","code":"assert total_text == \"54.0\" and isinstance(total_text, str)"}]},{"id":8,"num":8,"level":1,"title":"int מקצץ, round מעגל","diff":"easy","points":10,"tags":["המרות","עיגול","טיפוסים"],"desc":"<p>שתי דרכים להפוך מספר עשרוני לשלם, והן לא זהות:</p><ul><li><code>int(x)</code> — מוחק את החלק שאחרי הנקודה (קיצוץ לכיוון אפס)</li><li><code>round(x)</code> — מעגל למספר השלם הקרוב</li></ul><p>נתון <code>value_text = \"7.89\"</code>. צור:</p><ul><li><code>value</code> — הערך כ-<code>float</code></li><li><code>whole</code> — <code>int(value)</code></li><li><code>rounded</code> — <code>round(value)</code></li><li><code>negative_whole</code> — <code>int(-7.89)</code></li></ul><p><b>הערכים הצפויים:</b> 7.89, 7, 8, -7. שים לב שהערך האחרון הוא -7 ולא -8.</p>","hint":"<code>int()</code> תמיד זורק את השבר וקרב לכיוון אפס — גם כשהמספר שלילי. לכן <code>int(-7.89)</code> אינו -8.","starter":"value_text = \"7.89\"\n# חשב כאן את value, whole, rounded, negative_whole\n","solution":"value_text = \"7.89\"\n\nvalue = float(value_text)\nwhole = int(value)              # 7  — הקיצוץ מוחק את .89\nrounded = round(value)          # 8  — עיגול למספר הקרוב\nnegative_whole = int(-7.89)     # -7 — קיצוץ לכיוון אפס, לא כלפי מטה\n","explanation":"<p>ההבדל בין קיצוץ (truncation) לעיגול (rounding) הוא מקור נפוץ לבאגים בחישובים כספיים.</p><p><code>int()</code> תמיד מקרב לכיוון אפס: 7.89 הופך ל-7 ו--7.89 הופך ל--7. <code>round()</code> מקרב לערך השלם הקרוב ביותר, וכשהמרחק שווה בדיוק (למשל 2.5) הוא מקרב למספר הזוגי — <code>round(2.5)</code> נותן 2 ו-<code>round(3.5)</code> נותן 4. זה נקרא banker's rounding והוא מונע הטיה מצטברת כשמעגלים הרבה ערכים.</p>","tests":[{"name":"ההמרה ל-float","code":"assert value == 7.89 and isinstance(value, float)"},{"name":"קיצוץ עם int","code":"assert whole == 7, \"int(7.89) הוא 7\""},{"name":"עיגול עם round","code":"assert rounded == 8, \"round(7.89) הוא 8\""},{"name":"קיצוץ של מספר שלילי","code":"assert negative_whole == -7, \"int(-7.89) הוא -7 ולא -8\""}]},{"id":9,"num":9,"level":1,"title":"חמש הפעולות האריתמטיות","diff":"easy","points":10,"tags":["אריתמטיקה","אופרטורים"],"desc":"<p>נתונים <code>a = 17</code> ו-<code>b = 5</code>. חשב לתוך משתנים:</p><ul><li><code>s</code> — הסכום (<code>+</code>)</li><li><code>d</code> — ההפרש (<code>-</code>)</li><li><code>p</code> — המכפלה (<code>*</code>)</li><li><code>q</code> — המנה בחילוק רגיל (<code>/</code>)</li><li><code>power</code> — <code>a</code> בחזקת 2 (<code>**</code>)</li></ul><p><b>הערכים הצפויים:</b> 22, 12, 85, 3.4, 289.</p><p><b>שים לב:</b> אופרטור <code>/</code> תמיד מחזיר <code>float</code>, גם כשהחילוק יוצא עגול.</p>","hint":"אופרטור החזקה בפייתון הוא כוכבית כפולה <code>**</code>, לא <code>^</code>. הסימן <code>^</code> קיים בפייתון אבל עושה משהו אחר לגמרי.","starter":"a = 17\nb = 5\n# חשב כאן את s, d, p, q, power\n","solution":"a = 17\nb = 5\n\ns = a + b       # 22\nd = a - b       # 12\np = a * b       # 85\nq = a / b       # 3.4  — חילוק רגיל, התוצאה תמיד float\npower = a ** 2  # 289  — ** הוא אופרטור החזקה\n","explanation":"<p>חמש הפעולות הבסיסיות. הנקודה החשובה ביותר כאן היא ש-<code>/</code> בפייתון 3 הוא <i>true division</i>: הוא תמיד מחזיר <code>float</code>, גם עבור <code>10 / 2</code> שיחזיר <code>5.0</code> ולא <code>5</code>.</p><p>מי שרוצה תוצאה שלמה משתמש ב-<code>//</code> — נושא שיגיע בהמשך.</p>","tests":[{"name":"סכום","code":"assert s == 22"},{"name":"הפרש","code":"assert d == 12"},{"name":"מכפלה","code":"assert p == 85"},{"name":"מנה","code":"assert q == 3.4"},{"name":"מנה היא תמיד float","code":"assert isinstance(q, float), \"אופרטור / מחזיר תמיד float\""},{"name":"חזקה","code":"assert power == 289"}]},{"id":10,"num":10,"level":1,"title":"ציון משוקלל וממוצע","diff":"easy","points":10,"tags":["אריתמטיקה","סדר פעולות"],"desc":"<p>תלמיד קיבל ארבעה ציוני תרגילים: 80, 92, 75, 89.</p><p>בנוסף יש לו ציון מבחן <code>exam = 88</code> וציון עבודות <code>homework = 95</code>.</p><p>חשב:</p><ul><li><code>average</code> — הממוצע של ארבעת התרגילים</li><li><code>final</code> — הציון הסופי: 60 אחוז מהמבחן ועוד 40 אחוז מהעבודות</li></ul><p><b>הערכים הצפויים:</b> <code>average</code> = 84.0, <code>final</code> = 90.8.</p><p><b>שים לב לסדר הפעולות:</b> כפל וחילוק קודמים לחיבור, ולכן צריך סוגריים סביב סכום ארבעת הציונים לפני החלוקה ב-4.</p>","hint":"בלי סוגריים, <code>80 + 92 + 75 + 89 / 4</code> יחלק רק את הערך האחרון. 60 אחוז נכתבים כ-<code>0.6</code>.","starter":"exam = 88\nhomework = 95\n# חשב כאן את average ואת final\n","solution":"exam = 88\nhomework = 95\n\n# הסוגריים מכריחים לחשב קודם את הסכום ורק אז לחלק\naverage = (80 + 92 + 75 + 89) / 4      # 336 / 4 = 84.0\nfinal = exam * 0.6 + homework * 0.4    # 52.8 + 38.0 = 90.8\n","explanation":"<p>פייתון מכבד את סדר הפעולות המתמטי: חזקה, אחר כך כפל וחילוק, ולבסוף חיבור וחיסור. כשצריך לשנות את הסדר — משתמשים בסוגריים.</p><p>בשורת <code>final</code> אין צורך בסוגריים: הכפלים מתבצעים לפני החיבור בדיוק כפי שאנחנו רוצים. במקרים כאלה מותר להוסיף סוגריים בכל זאת אם זה מבהיר את הכוונה לקורא.</p><p>הערה על מספרים עשרוניים: מכיוון ש-<code>float</code> מיוצג בבינארית, השוואות מדויקות עלולות להפתיע. בקוד אמיתי עדיף להשוות עם סבילות קטנה או לעגל לפני ההשוואה.</p>","tests":[{"name":"ממוצע התרגילים","code":"assert average == 84.0, \"ציפינו לממוצע 84.0\""},{"name":"הממוצע הוא float","code":"assert isinstance(average, float)"},{"name":"הציון הסופי","code":"assert abs(final - 90.8) < 1e-9, \"ציפינו ל-90.8\""},{"name":"הציון הסופי מעוגל","code":"assert round(final, 1) == 90.8"}]},{"id":11,"num":11,"level":1,"title":"הנחה על מוצר","diff":"easy","points":10,"tags":["אריתמטיקה","אחוזים","השוואות"],"desc":"<p>מחיר מוצר הוא <code>price = 250</code>, וההנחה היא 15 אחוז.</p><p>חשב:</p><ul><li><code>discount</code> — סכום ההנחה בשקלים</li><li><code>final_price</code> — המחיר אחרי ההנחה</li><li><code>is_cheap</code> — האם המחיר הסופי קטן מ-220 (ערך בוליאני, בעזרת <code>&lt;</code>)</li><li><code>saved_more_than_30</code> — האם ההנחה גדולה מ-30 (בעזרת <code>&gt;</code>)</li></ul><p><b>הערכים הצפויים:</b> 37.5, 212.5, <code>True</code>, <code>True</code>.</p>","hint":"אופרטור השוואה כמו <code>&lt;</code> מחזיר בעצמו ערך בוליאני, ואפשר לשמור אותו במשתנה בדיוק כמו כל ערך אחר. אין צורך ב-<code>if</code>.","starter":"price = 250\n# חשב כאן את discount, final_price, is_cheap, saved_more_than_30\n","solution":"price = 250\n\ndiscount = price * 0.15          # 37.5\nfinal_price = price - discount   # 212.5\n\n# אופרטור השוואה מחזיר True/False — אפשר לשמור אותו ישירות במשתנה\nis_cheap = final_price < 220\nsaved_more_than_30 = discount > 30\n","explanation":"<p>אחוזים בקוד הם פשוט כפל בשבר עשרוני: 15 אחוז הם <code>0.15</code>.</p><p>הרעיון המרכזי כאן הוא שהשוואה היא <b>ביטוי</b> שמחזיר ערך, לא הוראת בקרה. <code>final_price &lt; 220</code> מחושב ל-<code>True</code>, ואפשר להשים אותו במשתנה, להעביר לפונקציה או להדפיס. מתחילים רבים כותבים <code>if x &lt; y: result = True else: result = False</code> — זה מיותר, אפשר פשוט <code>result = x &lt; y</code>.</p>","tests":[{"name":"סכום ההנחה","code":"assert discount == 37.5"},{"name":"המחיר הסופי","code":"assert final_price == 212.5"},{"name":"בדיקת זולות","code":"assert is_cheap is True and isinstance(is_cheap, bool)"},{"name":"בדיקת גודל ההנחה","code":"assert saved_more_than_30 is True and isinstance(saved_more_than_30, bool)"},{"name":"עקביות בין ההנחה למחיר","code":"assert discount + final_price == 250"}]},{"id":12,"num":12,"level":1,"title":"חילוק שלם ושארית","diff":"easy","points":10,"tags":["חילוק שלם","שארית","divmod"],"desc":"<p>שני אופרטורים חדשים:</p><ul><li><code>//</code> — חילוק שלם: כמה פעמים המחלק נכנס שלם</li><li><code>%</code> — שארית (modulo): מה נשאר אחרי החילוק השלם</li></ul><p>יש 287 עוגיות לחלק שווה בשווה בין 4 ילדים. חשב:</p><ul><li><code>each</code> — כמה עוגיות מקבל כל ילד</li><li><code>left</code> — כמה עוגיות נשארות</li><li><code>q</code> ו-<code>r</code> — אותם שני ערכים, אבל בקריאה אחת ל-<code>divmod(287, 4)</code></li></ul><p><b>הערכים הצפויים:</b> 71 ו-3.</p>","hint":"<code>divmod(a, b)</code> מחזירה זוג ערכים, ואפשר לפרק אותו לשני משתנים בשורה אחת: <code>q, r = divmod(...)</code>.","starter":"cookies = 287\nkids = 4\n# חשב כאן את each, left, q, r\n","solution":"cookies = 287\nkids = 4\n\neach = cookies // kids     # 71 — חילוק שלם\nleft = cookies % kids      # 3  — השארית\n\n# divmod מחזירה את שניהם יחד, ופריקה לשני משתנים בשורה אחת\nq, r = divmod(cookies, kids)\n","explanation":"<p><code>//</code> ו-<code>%</code> הם זוג משלים: תמיד מתקיים <code>a == (a // b) * b + (a % b)</code>.</p><p><code>divmod</code> מבצעת את שתי הפעולות בבת אחת ומחזירה tuple. זה יעיל יותר (חילוק אחד במקום שניים) וגם קריא יותר כשצריך את שתי התוצאות.</p><p>שימוש נפוץ ב-<code>%</code>: בדיקת זוגיות. <code>n % 2 == 0</code> אומר שהמספר זוגי.</p>","tests":[{"name":"כמה לכל ילד","code":"assert each == 71"},{"name":"כמה נשאר","code":"assert left == 3"},{"name":"divmod נותן את אותו זוג","code":"assert (q, r) == (71, 3)"},{"name":"זהות החילוק מתקיימת","code":"assert each * kids + left == 287, \"המנה כפול המחלק ועוד השארית חייבים להחזיר את המקור\""}]},{"id":13,"num":13,"level":1,"title":"המרת שניות לשעות, דקות ושניות","diff":"easy","points":10,"tags":["חילוק שלם","שארית","אריתמטיקה"],"desc":"<p>נתון <code>total_seconds = 3725</code>. פרק אותו ליחידות זמן:</p><ul><li><code>hours</code> — מספר השעות השלמות</li><li><code>minutes</code> — מספר הדקות שנשארו אחרי השעות</li><li><code>seconds</code> — מספר השניות שנשארו אחרי הדקות</li></ul><p><b>הערכים הצפויים:</b> 1 שעה, 2 דקות, 5 שניות (כי 3725 = 3600 + 120 + 5).</p><p>בשעה יש 3600 שניות ובדקה 60.</p>","hint":"השתמש ב-<code>//</code> כדי לחלץ את היחידה הגדולה, וב-<code>%</code> כדי לקבל את מה שנשאר לשלב הבא. שמור את השארית במשתנה ביניים.","starter":"total_seconds = 3725\n# חשב כאן את hours, minutes, seconds\n","solution":"total_seconds = 3725\n\nhours = total_seconds // 3600            # 1\nrest = total_seconds % 3600              # 125 — מה שנשאר אחרי השעות\nminutes = rest // 60                     # 2\nseconds = rest % 60                      # 5\n","explanation":"<p>זהו הדפוס הקלאסי של פירוק לבסיסים מעורבים: בכל שלב לוקחים את המנה השלמה ליחידה הנוכחית ומעבירים את השארית לשלב הבא.</p><p>אפשר לכתוב את אותו דבר בעזרת <code>divmod</code> בשתי שורות: <code>hours, rest = divmod(total_seconds, 3600)</code> ואחריה <code>minutes, seconds = divmod(rest, 60)</code>. אותה לוגיקה, פחות רעש.</p><p>אותו דפוס משמש להמרת אגורות לשקלים, בתים לקילובייטים, וכל פירוק דומה.</p>","tests":[{"name":"שעות","code":"assert hours == 1"},{"name":"דקות","code":"assert minutes == 2"},{"name":"שניות","code":"assert seconds == 5"},{"name":"הפירוק מרכיב חזרה את המקור","code":"assert hours * 3600 + minutes * 60 + seconds == 3725"},{"name":"הדקות והשניות בטווח חוקי","code":"assert 0 <= minutes < 60 and 0 <= seconds < 60"}]},{"id":14,"num":14,"level":1,"title":"אינדוקס במחרוזת","diff":"easy","points":10,"tags":["מחרוזות","אינדוקס"],"desc":"<p>מחרוזת היא רצף של תווים, וכל תו יושב במקום ממוספר. הספירה מתחילה מ-0. אינדקס שלילי סופר מהסוף: <code>-1</code> הוא התו האחרון.</p><p>נתון <code>word = \"Programming\"</code>. חלץ:</p><ul><li><code>first</code> — התו הראשון</li><li><code>last</code> — התו האחרון</li><li><code>third</code> — התו השלישי (זה שבאינדקס 2)</li><li><code>middle</code> — התו שבאמצע, כלומר באינדקס <code>len(word) // 2</code></li><li><code>length</code> — אורך המחרוזת</li></ul><p><b>הערכים הצפויים:</b> <code>\"P\"</code>, <code>\"g\"</code>, <code>\"o\"</code>, <code>\"a\"</code>, 11.</p>","hint":"האינדקס האחרון של מחרוזת באורך n הוא n-1, ולכן <code>word[len(word)]</code> תמיד ייתן שגיאה. השתמש ב-<code>word[-1]</code> במקום.","starter":"word = \"Programming\"\n# חלץ כאן את first, last, third, middle, length\n","solution":"word = \"Programming\"\n\nfirst = word[0]                    # \"P\"  — הספירה מתחילה מאפס\nlast = word[-1]                    # \"g\"  — אינדקס שלילי סופר מהסוף\nthird = word[2]                    # \"o\"  — התו השלישי יושב באינדקס 2\nlength = len(word)                 # 11\nmiddle = word[length // 2]         # word[5] = \"a\"\n","explanation":"<p>שני הכללים שכדאי לזכור: הספירה מתחילה מ-0, ואינדקס שלילי סופר מהסוף. <code>s[-1]</code> הוא קיצור נוח ל-<code>s[len(s) - 1]</code>.</p><p>חריגה מהטווח (למשל <code>word[11]</code> במחרוזת באורך 11) זורקת <code>IndexError</code>. זו התנהגות מכוונת: עדיף שגיאה ברורה מאשר ערך שגוי בשקט.</p><p>הערה: תוצאת אינדוקס על מחרוזת היא בעצמה מחרוזת באורך 1 — בפייתון אין טיפוס נפרד של תו.</p>","tests":[{"name":"התו הראשון","code":"assert first == \"P\""},{"name":"התו האחרון","code":"assert last == \"g\""},{"name":"התו באינדקס 2","code":"assert third == \"o\""},{"name":"התו האמצעי","code":"assert middle == \"a\""},{"name":"האורך","code":"assert length == 11"},{"name":"תו בודד הוא מחרוזת באורך 1","code":"assert isinstance(first, str) and len(first) == 1"}]},{"id":15,"num":15,"level":1,"title":"פרוסות: פירוק תאריך","diff":"easy","points":10,"tags":["מחרוזות","פרוסות"],"desc":"<p>פרוסה (slice) מחלצת קטע מתוך מחרוזת: <code>s[start:end]</code> מחזירה את התווים מ-<code>start</code> ועד <code>end</code> <b>לא כולל</b>. אם משמיטים צד, פייתון משלים מההתחלה או עד הסוף.</p><p>נתון <code>date_text = \"2024-08-17\"</code>. חלץ בעזרת פרוסות:</p><ul><li><code>year</code> — <code>\"2024\"</code></li><li><code>month</code> — <code>\"08\"</code></li><li><code>day</code> — <code>\"17\"</code></li><li><code>compact</code> — התאריך בלי המקפים: <code>\"20240817\"</code></li></ul><p>כל הערכים נשארים מחרוזות, בלי המרה למספר.</p>","hint":"המקפים יושבים באינדקסים 4 ו-7. פרוסה כמו <code>s[:4]</code> מתחילה מהתחלת המחרוזת, ו-<code>s[8:]</code> נמשכת עד הסוף.","starter":"date_text = \"2024-08-17\"\n# חלץ כאן את year, month, day, compact\n","solution":"date_text = \"2024-08-17\"\n\nyear = date_text[:4]        # מהתחלה עד אינדקס 4 (לא כולל) -> \"2024\"\nmonth = date_text[5:7]      # אינדקסים 5 ו-6 -> \"08\"\nday = date_text[8:]         # מאינדקס 8 ועד הסוף -> \"17\"\n\ncompact = year + month + day   # \"20240817\"\n","explanation":"<p>הכלל המרכזי בפרוסות: הגבול השמאלי כלול, הימני לא. לכן <code>s[5:7]</code> מחזירה בדיוק שני תווים, ו-<code>s[a:b]</code> תמיד מכילה <code>b - a</code> תווים (כשהטווח חוקי).</p><p>השמטת גבול מקבילה לכתיבת ההתחלה או הסוף: <code>s[:4]</code> זהה ל-<code>s[0:4]</code>, ו-<code>s[8:]</code> זהה ל-<code>s[8:len(s)]</code>.</p><p>יתרון נוסף של פרוסות על פני אינדוקס: פרוסה מחוץ לטווח לא זורקת שגיאה אלא מחזירה מחרוזת ריקה.</p>","tests":[{"name":"שנה","code":"assert year == \"2024\""},{"name":"חודש","code":"assert month == \"08\""},{"name":"יום","code":"assert day == \"17\""},{"name":"תאריך דחוס","code":"assert compact == \"20240817\""},{"name":"הערכים נשארו מחרוזות","code":"assert isinstance(year, str) and isinstance(month, str) and len(month) == 2"}]},{"id":16,"num":16,"level":1,"title":"פרוסות עם צעד והיפוך","diff":"easy","points":10,"tags":["מחרוזות","פרוסות"],"desc":"<p>לפרוסה יש חלק שלישי — הצעד: <code>s[start:end:step]</code>. צעד 2 לוקח כל תו שני, וצעד <code>-1</code> עובר על המחרוזת מהסוף להתחלה.</p><p>נתון <code>code = \"abcdefgh\"</code>. צור:</p><ul><li><code>reversed_code</code> — המחרוזת הפוכה</li><li><code>every_second</code> — כל תו שני מההתחלה</li><li><code>middle</code> — התווים מאינדקס 2 עד 6 (לא כולל)</li><li><code>last_three</code> — שלושת התווים האחרונים</li></ul><p><b>הערכים הצפויים:</b> <code>\"hgfedcba\"</code>, <code>\"aceg\"</code>, <code>\"cdef\"</code>, <code>\"fgh\"</code>.</p><p>המשתנה <code>code</code> עצמו חייב להישאר ללא שינוי — מחרוזות בפייתון אינן ניתנות לשינוי.</p>","hint":"היפוך מחרוזת הוא <code>s[::-1]</code>: בלי התחלה, בלי סוף, וצעד מינוס אחד. שלושת האחרונים הם <code>s[-3:]</code>.","starter":"code = \"abcdefgh\"\n# צור כאן את reversed_code, every_second, middle, last_three\n","solution":"code = \"abcdefgh\"\n\nreversed_code = code[::-1]     # \"hgfedcba\"\nevery_second = code[::2]       # \"aceg\" — כל תו שני\nmiddle = code[2:6]             # \"cdef\"\nlast_three = code[-3:]         # \"fgh\"\n","explanation":"<p><code>s[::-1]</code> הוא הניב המקובל בפייתון להיפוך רצף. הוא עובד על מחרוזות, רשימות וכל רצף אחר.</p><p>נקודה חשובה: כל פרוסה יוצרת <b>מחרוזת חדשה</b> ואינה משנה את המקור. מחרוזות בפייתון הן immutable — בלתי ניתנות לשינוי. אפילו <code>s.upper()</code> לא משנה את <code>s</code> אלא מחזירה מחרוזת חדשה, ולכן אם לא נשמור את התוצאה במשתנה היא פשוט תיעלם.</p>","tests":[{"name":"היפוך","code":"assert reversed_code == \"hgfedcba\""},{"name":"כל תו שני","code":"assert every_second == \"aceg\""},{"name":"קטע אמצעי","code":"assert middle == \"cdef\""},{"name":"שלושה אחרונים","code":"assert last_three == \"fgh\""},{"name":"המקור לא השתנה","code":"assert code == \"abcdefgh\" and middle == code[2:6], \"פרוסה לא משנה את המחרוזת המקורית\""}]},{"id":17,"num":17,"level":1,"title":"ניקוי רווחים ושינוי אותיות","diff":"easy","points":10,"tags":["מחרוזות","מתודות"],"desc":"<p>שלוש מתודות מחרוזת בסיסיות:</p><ul><li><code>.strip()</code> — מסירה רווחים מההתחלה ומהסוף</li><li><code>.upper()</code> — הופכת הכול לאותיות גדולות</li><li><code>.lower()</code> — הופכת הכול לאותיות קטנות</li></ul><p>נתון <code>raw = \"   Shalom World   \"</code> (שלושה רווחים בכל צד). צור:</p><ul><li><code>clean</code> — <code>raw</code> בלי הרווחים המיותרים</li><li><code>upper</code> — <code>clean</code> באותיות גדולות</li><li><code>lower</code> — <code>clean</code> באותיות קטנות</li><li><code>length_before</code> ו-<code>length_after</code> — האורכים לפני ואחרי הניקוי</li></ul><p><b>הערכים הצפויים:</b> <code>\"Shalom World\"</code>, <code>\"SHALOM WORLD\"</code>, <code>\"shalom world\"</code>, 18, 12.</p>","hint":"מתודת מחרוזת אף פעם לא משנה את המחרוזת עצמה — היא מחזירה מחרוזת חדשה. חייבים לשמור את התוצאה במשתנה.","starter":"raw = \"   Shalom World   \"\n# צור כאן את clean, upper, lower, length_before, length_after\n","solution":"raw = \"   Shalom World   \"\n\nlength_before = len(raw)     # 18 — כולל הרווחים\nclean = raw.strip()          # \"Shalom World\"\nlength_after = len(clean)    # 12\n\nupper = clean.upper()\nlower = clean.lower()\n","explanation":"<p>מתודה נקראת עם נקודה על האובייקט: <code>raw.strip()</code>. <code>strip</code> מסירה רווחים משני הצדדים בלבד — רווחים באמצע נשארים, ולכן <code>\"Shalom World\"</code> נשמר עם הרווח בין המילים.</p><p>יש גם <code>.lstrip()</code> ו-<code>.rstrip()</code> לצד אחד בלבד, ואפשר להעביר ל-<code>strip</code> ארגומנט עם התווים שרוצים להסיר, למשל <code>s.strip(\".,\")</code>.</p><p>הטעות הנפוצה: לכתוב <code>raw.strip()</code> בלי להשים לאף משתנה ולצפות ש-<code>raw</code> ישתנה. הוא לא ישתנה.</p>","tests":[{"name":"ניקוי רווחים","code":"assert clean == \"Shalom World\""},{"name":"אותיות גדולות","code":"assert upper == \"SHALOM WORLD\""},{"name":"אותיות קטנות","code":"assert lower == \"shalom world\""},{"name":"אורכים לפני ואחרי","code":"assert length_before == 18 and length_after == 12"},{"name":"המקור לא השתנה","code":"assert raw == \"   Shalom World   \" and clean != raw, \"מתודות מחרוזת לא משנות את המקור\""}]},{"id":18,"num":18,"level":1,"title":"החלפת טקסט וספירת מופעים","diff":"easy","points":10,"tags":["מחרוזות","מתודות","replace"],"desc":"<p><code>.replace(old, new)</code> מחליפה את כל המופעים. אם מוסיפים ארגומנט שלישי — <code>.replace(old, new, 1)</code> — מוחלף רק המופע הראשון. <code>.count(sub)</code> סופרת כמה פעמים מופיע קטע טקסט.</p><p>נתון <code>text = \"I like tea, tea is great\"</code>. צור:</p><ul><li><code>all_replaced</code> — כל <code>\"tea\"</code> הוחלף ב-<code>\"coffee\"</code></li><li><code>first_only</code> — רק המופע הראשון הוחלף</li><li><code>count_tea</code> — כמה פעמים מופיע <code>\"tea\"</code></li></ul><p><b>הערכים הצפויים:</b><br><code>\"I like coffee, coffee is great\"</code><br><code>\"I like coffee, tea is great\"</code><br>2</p>","hint":"שים לב שכל קריאה ל-<code>replace</code> פועלת על <code>text</code> המקורי — לא על תוצאת הקריאה הקודמת.","starter":"text = \"I like tea, tea is great\"\n# צור כאן את all_replaced, first_only, count_tea\n","solution":"text = \"I like tea, tea is great\"\n\nall_replaced = text.replace(\"tea\", \"coffee\")      # כל המופעים\nfirst_only = text.replace(\"tea\", \"coffee\", 1)     # הארגומנט השלישי מגביל למופע אחד\ncount_tea = text.count(\"tea\")                     # 2\n","explanation":"<p><code>replace</code> מחזירה מחרוזת חדשה, ולכן אפשר לקרוא לה פעמיים על אותו מקור ולקבל שתי תוצאות שונות — המקור לא נפגע בדרך.</p><p>הארגומנט השלישי, <code>count</code>, הוא המספר המרבי של החלפות. הוא שימושי כשרוצים לתקן רק את המופע הראשון, למשל בהחלפת כותרת בטקסט.</p><p>שים לב ש-<code>count</code> סופרת מופעים לא חופפים. למשל <code>\"aaa\".count(\"aa\")</code> מחזיר 1, לא 2.</p>","tests":[{"name":"החלפת כל המופעים","code":"assert all_replaced == \"I like coffee, coffee is great\""},{"name":"החלפת המופע הראשון בלבד","code":"assert first_only == \"I like coffee, tea is great\""},{"name":"ספירת מופעים","code":"assert count_tea == 2"},{"name":"המקור לא השתנה","code":"assert text == \"I like tea, tea is great\" and all_replaced != text"},{"name":"אחרי ההחלפה לא נשאר tea","code":"assert all_replaced.count(\"tea\") == 0"}]},{"id":19,"num":19,"level":1,"title":"פיצול שורת CSV","diff":"easy","points":10,"tags":["מחרוזות","split","המרות"],"desc":"<p><code>.split(sep)</code> מפצלת מחרוזת לרשימה לפי תו מפריד.</p><p>נתונה שורת נתונים <code>row = \"דנה,25,חיפה\"</code>. פצל אותה לפי הפסיק וצור:</p><ul><li><code>parts</code> — הרשימה שהתקבלה מהפיצול</li><li><code>name</code> — האיבר הראשון</li><li><code>age</code> — האיבר השני, מומר למספר שלם</li><li><code>city</code> — האיבר השלישי</li><li><code>field_count</code> — כמה שדות יש בשורה</li></ul><p><b>הערכים הצפויים:</b> <code>[\"דנה\", \"25\", \"חיפה\"]</code>, <code>\"דנה\"</code>, 25 (מספר!), <code>\"חיפה\"</code>, 3.</p>","hint":"התוצאה של <code>split</code> היא תמיד רשימה של מחרוזות — גם כשהתוכן נראה כמו מספר. לכן <code>age</code> דורש המרה מפורשת.","starter":"row = \"דנה,25,חיפה\"\n# פצל כאן וצור את parts, name, age, city, field_count\n","solution":"row = \"דנה,25,חיפה\"\n\nparts = row.split(\",\")       # ['דנה', '25', 'חיפה']\n\nname = parts[0]\nage = int(parts[1])          # חובה להמיר — מהפיצול מגיעה מחרוזת\ncity = parts[2]\nfield_count = len(parts)     # 3\n","explanation":"<p><code>split</code> היא הכלי הבסיסי לקריאת נתונים בפורמט טבלאי. היא מחזירה רשימה, ו-<code>len</code> על הרשימה נותנת את מספר השדות.</p><p>נקודה קריטית: כל האיברים ברשימה הם מחרוזות. <code>parts[1]</code> הוא <code>\"25\"</code> ולא <code>25</code>, ולכן <code>parts[1] + 1</code> יזרוק שגיאה. המרה עם <code>int()</code> היא שלב חובה.</p><p>קריאה ל-<code>split()</code> בלי ארגומנט מפצלת לפי רווחים לבנים ומתעלמת מרווחים כפולים — התנהגות שונה מ-<code>split(\" \")</code>.</p>","tests":[{"name":"הפיצול לרשימה","code":"assert parts == [\"דנה\", \"25\", \"חיפה\"]"},{"name":"שם","code":"assert name == \"דנה\""},{"name":"גיל כמספר","code":"assert age == 25 and isinstance(age, int), \"age צריך להיות מספר שלם\""},{"name":"עיר","code":"assert city == \"חיפה\""},{"name":"מספר שדות","code":"assert field_count == 3"}]},{"id":20,"num":20,"level":1,"title":"פיצול וחיבור מילים","diff":"easy","points":10,"tags":["מחרוזות","split","join"],"desc":"<p><code>.split()</code> בלי ארגומנט מפצלת לפי רווחים, ו-<code>sep.join(list)</code> מחברת רשימת מחרוזות בחזרה למחרוזת אחת עם מפריד ביניהן.</p><p>נתון <code>sentence = \"python is a great language\"</code>. צור:</p><ul><li><code>words</code> — רשימת המילים</li><li><code>word_count</code> — מספר המילים</li><li><code>hyphenated</code> — המילים מחוברות במקפים</li><li><code>backwards</code> — המילים בסדר הפוך, מחוברות ברווחים</li></ul><p><b>הערכים הצפויים:</b> 5 מילים, <code>\"python-is-a-great-language\"</code>, <code>\"language great a is python\"</code>.</p>","hint":"<code>join</code> נקראת <b>על המפריד</b>, לא על הרשימה: <code>\"-\".join(words)</code>. להיפוך סדר הרשימה אפשר להשתמש בפרוסה <code>[::-1]</code>.","starter":"sentence = \"python is a great language\"\n# צור כאן את words, word_count, hyphenated, backwards\n","solution":"sentence = \"python is a great language\"\n\nwords = sentence.split()             # פיצול לפי רווחים\nword_count = len(words)              # 5\n\nhyphenated = \"-\".join(words)         # join נקראת על המפריד\nbackwards = \" \".join(words[::-1])    # הפרוסה הופכת את סדר הרשימה\n","explanation":"<p><code>split</code> ו-<code>join</code> הן פעולות הפוכות: אחת מפרקת מחרוזת לרשימה, השנייה מרכיבה רשימה חזרה למחרוזת.</p><p>התחביר של <code>join</code> מבלבל בהתחלה כי הוא נראה הפוך מהאינטואיציה. ההיגיון: <code>join</code> היא מתודה של מחרוזת, והמחרוזת שעליה קוראים היא הדבק שבין האיברים. כדי לחבר בלי מפריד כלל כותבים <code>\"\".join(words)</code>.</p><p><code>join</code> דורשת שכל איברי הרשימה יהיו מחרוזות. רשימת מספרים תזרוק שגיאה, ותצטרך להמיר אותם קודם.</p>","tests":[{"name":"פיצול למילים","code":"assert words == [\"python\", \"is\", \"a\", \"great\", \"language\"]"},{"name":"ספירת מילים","code":"assert word_count == 5"},{"name":"חיבור במקפים","code":"assert hyphenated == \"python-is-a-great-language\""},{"name":"היפוך סדר המילים","code":"assert backwards == \"language great a is python\""},{"name":"המשפט המקורי לא השתנה","code":"assert sentence == \"python is a great language\" and words == sentence.split()"}]},{"id":21,"num":21,"level":1,"title":"f-strings: שילוב ערכים בטקסט","diff":"easy","points":10,"tags":["f-strings","מחרוזות"],"desc":"<p>f-string היא מחרוזת שמתחילה באות <code>f</code> לפני המרכאות, ובתוכה אפשר לשים משתנים וביטויים בתוך סוגריים מסולסלים: <code>f\"שלום {name}\"</code>.</p><p>נתונים <code>name = \"דנה\"</code>, <code>age = 25</code>, <code>city = \"חיפה\"</code>. צור:</p><ul><li><code>intro</code> — <code>\"דנה, בת 25, מחיפה\"</code></li><li><code>label</code> — <code>\"דנה (25)\"</code></li><li><code>next_year</code> — <code>\"בשנה הבאה דנה תהיה בת 26\"</code></li></ul><p>שים לב ש-<code>next_year</code> דורש חישוב <b>בתוך</b> ה-f-string. כתוב את כל השלושה בעזרת f-strings, בלי לשרשר מחרוזות ידנית.</p>","hint":"בתוך הסוגריים המסולסלים אפשר לכתוב כל ביטוי פייתון תקין, כולל <code>age + 1</code>. אין צורך ב-<code>str()</code> — ההמרה נעשית אוטומטית.","starter":"name = \"דנה\"\nage = 25\ncity = \"חיפה\"\n# צור כאן את intro, label, next_year\n","solution":"name = \"דנה\"\nage = 25\ncity = \"חיפה\"\n\nintro = f\"{name}, בת {age}, מ{city}\"\nlabel = f\"{name} ({age})\"\nnext_year = f\"בשנה הבאה {name} תהיה בת {age + 1}\"   # ביטוי בתוך הסוגריים\n","explanation":"<p>f-string (formatted string literal) היא הדרך המודרנית והקריאה ביותר לבנות טקסט מערכים בפייתון 3.6 ומעלה.</p><p>שני יתרונות מרכזיים על פני שרשור עם <code>+</code>: אין צורך להמיר מספרים ל-str בעצמך, וכל ערך מופיע במקומו בטקסט כך שקל לקרוא את התוצאה הסופית.</p><p>בתוך הסוגריים אפשר לשים לא רק שם משתנה אלא כל ביטוי — חישוב, קריאה לפונקציה, או גישה לאיבר ברשימה. כדי להדפיס סוגר מסולסל ממשי כותבים אותו פעמיים: <code>{{</code>.</p>","tests":[{"name":"הצגה עצמית","code":"assert intro == \"דנה, בת 25, מחיפה\""},{"name":"תווית קצרה","code":"assert label == \"דנה (25)\""},{"name":"חישוב בתוך ה-f-string","code":"assert next_year == \"בשנה הבאה דנה תהיה בת 26\""},{"name":"התוצאות הן מחרוזות","code":"assert isinstance(intro, str) and isinstance(label, str)"}]},{"id":22,"num":22,"level":1,"title":"עיצוב מספרים בתוך f-string","diff":"easy","points":10,"tags":["f-strings","עיצוב","עיגול"],"desc":"<p>אחרי שם המשתנה בתוך הסוגריים אפשר לכתוב נקודתיים ומפרט עיצוב:</p><ul><li><code>{x:.2f}</code> — שתי ספרות אחרי הנקודה</li><li><code>{x:.0f}</code> — בלי ספרות אחרי הנקודה</li><li><code>{x:,.2f}</code> — עם פסיק כמפריד אלפים</li><li><code>{n:05d}</code> — מספר שלם בריפוד אפסים לרוחב 5</li></ul><p>נתונים <code>price = 1234.5678</code> ו-<code>serial = 42</code>. צור את המחרוזות:</p><ul><li><code>two_dec</code> — <code>\"1234.57\"</code></li><li><code>no_dec</code> — <code>\"1235\"</code></li><li><code>with_commas</code> — <code>\"1,234.57\"</code></li><li><code>padded</code> — <code>\"00042\"</code></li></ul>","hint":"מפרט העיצוב מעגל בעצמו — אין צורך לקרוא ל-<code>round</code> לפני כן. התוצאה תמיד מחרוזת, גם כשמדובר במספר.","starter":"price = 1234.5678\nserial = 42\n# צור כאן את two_dec, no_dec, with_commas, padded\n","solution":"price = 1234.5678\nserial = 42\n\ntwo_dec = f\"{price:.2f}\"        # \"1234.57\" — מעגל אוטומטית\nno_dec = f\"{price:.0f}\"         # \"1235\"\nwith_commas = f\"{price:,.2f}\"   # \"1,234.57\" — פסיק כמפריד אלפים\npadded = f\"{serial:05d}\"        # \"00042\" — ריפוד אפסים לרוחב 5\n","explanation":"<p>מפרט העיצוב (format spec) מגיע אחרי נקודתיים בתוך הסוגריים. האות בסוף קובעת את הסוג: <code>f</code> למספר עשרוני קבוע, <code>d</code> למספר שלם.</p><p>המספר שאחרי הנקודה הוא מספר הספרות אחרי הנקודה העשרונית, והעיגול מתבצע כחלק מהעיצוב. שים לב שהתוצאה היא <b>מחרוזת</b> — <code>f\"{price:.2f}\"</code> מחזיר <code>\"1234.57\"</code> ולא את המספר 1234.57.</p><p>לכן יש הפרדה חשובה: <code>round</code> משמש לחישוב, ומפרט העיצוב משמש לתצוגה. אין להשתמש במחרוזת מעוצבת בהמשך חישוב בלי להמיר אותה חזרה.</p>","tests":[{"name":"שתי ספרות עשרוניות","code":"assert two_dec == \"1234.57\""},{"name":"בלי ספרות עשרוניות","code":"assert no_dec == \"1235\""},{"name":"מפריד אלפים","code":"assert with_commas == \"1,234.57\""},{"name":"ריפוד אפסים","code":"assert padded == \"00042\" and len(padded) == 5"},{"name":"התוצאה היא מחרוזת ולא מספר","code":"assert isinstance(two_dec, str), \"עיצוב מחזיר מחרוזת\""}]},{"id":23,"num":23,"level":1,"title":"יישור טקסט לטבלה","diff":"easy","points":10,"tags":["מחרוזות","עיצוב","מתודות"],"desc":"<p>כדי לסדר טקסט בעמודות משתמשים במתודות יישור:</p><ul><li><code>.ljust(width, fill)</code> — מיישר לשמאל ומרפד מימין</li><li><code>.rjust(width, fill)</code> — מיישר לימין ומרפד משמאל</li><li><code>.center(width, fill)</code> — ממרכז ומרפד משני הצדדים</li><li><code>.zfill(width)</code> — מרפד באפסים משמאל</li></ul><p>נתונים <code>item = \"Apple\"</code> ו-<code>qty = 7</code>. צור:</p><ul><li><code>cell</code> — <code>item</code> ברוחב 10, מיושר לשמאל, מרופד בנקודות (<code>\"Apple.....\"</code>)</li><li><code>num</code> — <code>qty</code> כמחרוזת ברוחב 3 מרופדת באפסים (<code>\"007\"</code>)</li><li><code>header</code> — <code>\"STOCK\"</code> ממורכז ברוחב 11 עם מקפים (<code>\"---STOCK---\"</code>)</li><li><code>row</code> — <code>cell</code> ואחריו <code>num</code> (<code>\"Apple.....007\"</code>)</li></ul>","hint":"<code>zfill</code> עובדת רק על מחרוזות, ולכן צריך להמיר את המספר קודם. לשרשור שתי מחרוזות משתמשים ב-<code>+</code>.","starter":"item = \"Apple\"\nqty = 7\n# צור כאן את cell, num, header, row\n","solution":"item = \"Apple\"\nqty = 7\n\ncell = item.ljust(10, \".\")       # \"Apple.....\" — רוחב 10\nnum = str(qty).zfill(3)          # \"007\" — חייבים להמיר למחרוזת קודם\nheader = \"STOCK\".center(11, \"-\") # \"---STOCK---\"\n\nrow = cell + num                 # \"Apple.....007\"\n","explanation":"<p>מתודות היישור מקבלות רוחב יעד ותו מילוי אופציונלי (ברירת המחדל היא רווח). אם המחרוזת כבר ארוכה מהרוחב המבוקש — היא מוחזרת כמות שהיא, בלי קיצוץ.</p><p>הרוחב הקבוע הוא מה שמאפשר לעמודות להתיישר זו מתחת לזו כשמדפיסים שורה אחרי שורה.</p><p><code>center</code> עם רוחב 11 ומחרוזת באורך 5 מחלקת 6 תווי מילוי לשני הצדדים. כשההפרש אי-זוגי, התו העודף נוסף בצד ימין.</p><p>אלטרנטיבה מודרנית: אותו יישור אפשרי גם בתוך f-string, למשל <code>f\"{item:.&lt;10}\"</code>.</p>","tests":[{"name":"יישור לשמאל בריפוד נקודות","code":"assert cell == \"Apple.....\" and len(cell) == 10"},{"name":"ריפוד אפסים","code":"assert num == \"007\""},{"name":"כותרת ממורכזת","code":"assert header == \"---STOCK---\" and len(header) == 11"},{"name":"השורה המלאה","code":"assert row == \"Apple.....007\""},{"name":"אורך השורה המלאה","code":"assert len(row) == 13 and row.endswith(\"007\")"}]},{"id":24,"num":24,"level":1,"title":"הפונקציה הראשונה שלך","diff":"easy","points":10,"tags":["פונקציות","f-strings","מחרוזות"],"desc":"<p>עד עכשיו כתבנו קוד ששומר ערכים במשתנים. פונקציה מאפשרת לארוז קוד עם שם, לקבל קלט משתנה ולהחזיר תוצאה.</p><p>המבנה: <code>def name(params):</code> ואחריו גוף מוזח, ובסוף <code>return</code> שמחזיר את הערך.</p><p>כתוב פונקציה <code>greet(name)</code> שמקבלת שם ו<b>מחזירה</b> (לא מדפיסה!) את המחרוזת <code>\"שלום, &lt;name&gt;!\"</code>.</p><p><b>דוגמאות:</b></p><pre>greet(\"דנה\")   ->  \"שלום, דנה!\"\ngreet(\"Yossi\") ->  \"שלום, Yossi!\"</pre>","hint":"ההבדל בין <code>print</code> ל-<code>return</code> קריטי: <code>print</code> מציגה למסך ומחזירה <code>None</code>, ואילו <code>return</code> מחזירה ערך שאפשר להשתמש בו הלאה.","starter":"def greet(name):\n    # כתוב כאן\n    pass\n","solution":"def greet(name):\n    \"\"\"מחזירה ברכה אישית.\"\"\"\n    return f\"שלום, {name}!\"\n","explanation":"<p>פונקציה היא בלוק קוד עם שם ופרמטרים. הקריאה <code>greet(\"דנה\")</code> מפעילה את הגוף כאשר <code>name</code> מקבל את הערך <code>\"דנה\"</code>.</p><p>הטעות הנפוצה ביותר של מתחילים היא לכתוב <code>print(f\"שלום, {name}!\")</code> במקום <code>return</code>. הפלט על המסך נראה נכון, אבל הפונקציה מחזירה <code>None</code> ולכן <code>x = greet(\"דנה\")</code> ישים ב-<code>x</code> את <code>None</code>. כל הבדיקות בקורס בודקות ערך מוחזר, ולכן <code>return</code> הוא חובה.</p><p>אפשר, כמובן, גם להדפיס וגם להחזיר — אבל הפרדה בין חישוב לתצוגה היא הרגל טוב.</p>","tests":[{"name":"שם בעברית","code":"assert greet(\"דנה\") == \"שלום, דנה!\""},{"name":"שם באנגלית","code":"assert greet(\"Yossi\") == \"שלום, Yossi!\""},{"name":"מחרוזת ריקה","code":"assert greet(\"\") == \"שלום, !\", \"גם שם ריק צריך לעבוד בלי לקרוס\""},{"name":"הפונקציה מחזירה ולא רק מדפיסה","code":"assert greet(\"A\") is not None, \"צריך return ולא print\""}]},{"id":25,"num":25,"level":1,"title":"פונקציה שמעצבת סכום כסף","diff":"easy","points":10,"tags":["פונקציות","f-strings","עיצוב"],"desc":"<p>כתוב פונקציה <code>format_price(amount)</code> שמקבלת מספר ומחזירה אותו כמחרוזת עם בדיוק שתי ספרות אחרי הנקודה ועם פסיק כמפריד אלפים.</p><p><b>דוגמאות:</b></p><pre>format_price(1234.5)   ->  \"1,234.50\"\nformat_price(0)        ->  \"0.00\"\nformat_price(999.999)  ->  \"1,000.00\"\nformat_price(-5)       ->  \"-5.00\"</pre><p>שים לב שהעיצוב מעגל בעצמו: 999.999 הופך ל-1,000.00.</p>","hint":"מפרט עיצוב אחד מספיק לשתי הדרישות יחד. סדר הרכיבים הוא קודם הפסיק ואז מספר הספרות.","starter":"def format_price(amount):\n    # כתוב כאן\n    pass\n","solution":"def format_price(amount):\n    \"\"\"מחזירה סכום מעוצב: מפריד אלפים ושתי ספרות עשרוניות.\"\"\"\n    return f\"{amount:,.2f}\"\n","explanation":"<p>מפרט העיצוב <code>,.2f</code> מבצע שלושה דברים בבת אחת: מעגל לשתי ספרות, מוסיף אפסים אם חסרות ספרות, ומכניס פסיקים בין קבוצות של שלוש ספרות.</p><p>העיגול כאן מתרחש בזמן העיצוב, ולכן <code>999.999</code> מוצג כ-<code>1,000.00</code> — הפסיק נוסף אחרי העיגול, לא לפניו.</p><p>מספרים שליליים מטופלים אוטומטית: הסימן נשמר לפני הספרות. אם רוצים סימן מפורש גם לחיוביים אפשר לכתוב <code>{amount:+,.2f}</code>.</p><p>הפונקציה מקבלת גם <code>int</code> וגם <code>float</code> — מפרט <code>f</code> ממיר בעצמו.</p>","tests":[{"name":"סכום עם אלפים","code":"assert format_price(1234.5) == \"1,234.50\""},{"name":"אפס","code":"assert format_price(0) == \"0.00\""},{"name":"עיגול שמוסיף ספרה","code":"assert format_price(999.999) == \"1,000.00\""},{"name":"סכום שלילי","code":"assert format_price(-5) == \"-5.00\""},{"name":"מיליון","code":"assert format_price(1000000) == \"1,000,000.00\""}]},{"id":26,"num":26,"level":1,"title":"ממוצע מעוגל","diff":"easy","points":10,"tags":["פונקציות","עיגול","אריתמטיקה"],"desc":"<p>כתוב פונקציה <code>average_score(a, b, c)</code> שמקבלת שלושה ציונים ומחזירה את הממוצע שלהם <b>כמספר</b> (לא כמחרוזת), מעוגל לשתי ספרות אחרי הנקודה.</p><p><b>דוגמאות:</b></p><pre>average_score(80, 92, 75)    ->  82.33\naverage_score(100, 100, 100) ->  100.0\naverage_score(0, 0, 1)       ->  0.33\naverage_score(-1, 0, 1)      ->  0.0</pre><p>שים לב: הפונקציה מחזירה <code>float</code>, ולכן חייבים <code>round</code> ולא f-string.</p>","hint":"לחלוקה השתמש ב-<code>/</code> (חילוק רגיל) ולא ב-<code>//</code>. <code>round(x, 2)</code> מקבל שני ארגומנטים: המספר ומספר הספרות.","starter":"def average_score(a, b, c):\n    # כתוב כאן\n    pass\n","solution":"def average_score(a, b, c):\n    \"\"\"מחזירה את ממוצע שלושת הציונים, מעוגל לשתי ספרות.\"\"\"\n    return round((a + b + c) / 3, 2)\n","explanation":"<p>שני חלקים: החישוב <code>(a + b + c) / 3</code> והעיגול <code>round(..., 2)</code>. הסוגריים הכרחיים — בלעדיהם רק <code>c</code> יחולק ב-3.</p><p>ההבדל מהתרגיל הקודם: כאן מחזירים <b>מספר</b> ולא מחרוזת. <code>round(82.333, 2)</code> מחזיר את ה-<code>float</code> 82.33, ואילו <code>f\"{82.333:.2f}\"</code> היה מחזיר את המחרוזת <code>\"82.33\"</code>. בחירת הטיפוס הנכון חשובה כי מספר אפשר להמשיך לחשב איתו.</p><p>שים לב ש-<code>round(100.0, 2)</code> מחזיר <code>100.0</code> ולא <code>100.00</code> — אפסים בסוף אינם חלק מהערך המספרי, רק מהתצוגה.</p>","tests":[{"name":"ממוצע לא עגול","code":"assert average_score(80, 92, 75) == 82.33"},{"name":"כל הציונים זהים","code":"assert average_score(100, 100, 100) == 100.0"},{"name":"ממוצע קטן","code":"assert average_score(0, 0, 1) == 0.33"},{"name":"ערכים שליליים מתקזזים","code":"assert average_score(-1, 0, 1) == 0.0"},{"name":"התוצאה היא מספר ולא מחרוזת","code":"assert isinstance(average_score(1, 2, 3), float), \"צריך להחזיר float\""}]},{"id":27,"num":27,"level":1,"title":"חישוב אחוזים כמחרוזת","diff":"easy","points":10,"tags":["פונקציות","אחוזים","f-strings","עיגול"],"desc":"<p>כתוב פונקציה <code>percent(part, whole)</code> שמחזירה את היחס בין שני המספרים כמחרוזת אחוזים עם ספרה אחת אחרי הנקודה וסימן אחוז בסוף.</p><p><b>דוגמאות:</b></p><pre>percent(1, 3)   ->  \"33.3%\"\npercent(1, 2)   ->  \"50.0%\"\npercent(0, 5)   ->  \"0.0%\"\npercent(3, 3)   ->  \"100.0%\"\npercent(5, 2)   ->  \"250.0%\"</pre><p>שים לב שגם 0 וגם יחס גדול מ-1 חייבים לעבוד.</p>","hint":"היחס הוא <code>part / whole</code>, והכפלה ב-100 הופכת אותו לאחוזים. את סימן האחוז אפשר לכתוב פשוט כטקסט אחרי הסוגריים המסולסלים.","starter":"def percent(part, whole):\n    # כתוב כאן\n    pass\n","solution":"def percent(part, whole):\n    \"\"\"מחזירה את היחס באחוזים כמחרוזת, עם ספרה עשרונית אחת.\"\"\"\n    ratio = part / whole * 100\n    return f\"{ratio:.1f}%\"\n","explanation":"<p>הפונקציה משלבת שלושה דברים שנלמדו: חילוק שמחזיר <code>float</code>, עיצוב עם <code>.1f</code>, וטקסט קבוע בתוך ה-f-string.</p><p>סימן האחוז נכתב כטקסט רגיל אחרי הסוגריים. אפשר גם להשתמש במפרט <code>%</code> המובנה — <code>f\"{part / whole:.1%}\"</code> — שמכפיל ב-100 ומוסיף את הסימן בעצמו. שים לב שאז <b>לא</b> מכפילים ב-100 ידנית, אחרת התוצאה תהיה גדולה פי 100.</p><p><code>percent(1, 3)</code> נותן 33.333... שמעוגל ל-33.3. מקרה שדורש תשומת לב הוא <code>whole = 0</code> — חילוק באפס יזרוק <code>ZeroDivisionError</code>. בקוד אמיתי היינו בודקים זאת לפני החילוק.</p>","tests":[{"name":"שליש","code":"assert percent(1, 3) == \"33.3%\""},{"name":"חצי","code":"assert percent(1, 2) == \"50.0%\""},{"name":"אפס","code":"assert percent(0, 5) == \"0.0%\", \"0 מתוך 5 הוא 0.0%\""},{"name":"שלם","code":"assert percent(3, 3) == \"100.0%\""},{"name":"יחס גדול מ-100 אחוז","code":"assert percent(5, 2) == \"250.0%\""}]},{"id":28,"num":28,"level":1,"title":"שורת חשבונית עם מע\"מ","diff":"easy","points":10,"tags":["פונקציות","עיגול","f-strings","אחוזים"],"desc":"<p>תרגיל מסכם לרמה הזו. כתוב פונקציה <code>price_summary(price, rate)</code> שמקבלת מחיר לפני מע\"מ ושיעור מע\"מ באחוזים, ומחזירה מחרוזת בפורמט:</p><pre>\"&lt;מחיר&gt; + &lt;מע\"מ&gt; = &lt;סה\"כ&gt;\"</pre><p>שלושת המספרים מוצגים עם בדיוק שתי ספרות אחרי הנקודה. סכום המע\"מ והסכום הכולל מעוגלים לשתי ספרות <b>לפני</b> החיבור, כמו בחשבונית אמיתית.</p><p><b>דוגמאות:</b></p><pre>price_summary(19.9, 17)  ->  \"19.90 + 3.38 = 23.28\"\nprice_summary(100, 17)   ->  \"100.00 + 17.00 = 117.00\"\nprice_summary(0, 17)     ->  \"0.00 + 0.00 = 0.00\"\nprice_summary(50, 0)     ->  \"50.00 + 0.00 = 50.00\"</pre>","hint":"חשב את המע\"מ, עגל אותו עם <code>round(..., 2)</code>, ורק אז חבר אותו למחיר כדי לקבל את הסכום הכולל. את כל שלושת הערכים הרכב במחרוזת אחת עם מפרט <code>:.2f</code>.","starter":"def price_summary(price, rate):\n    # כתוב כאן\n    pass\n","solution":"def price_summary(price, rate):\n    \"\"\"מחזירה שורת חשבונית: מחיר + מע\"מ = סה\"כ, בשתי ספרות עשרוניות.\"\"\"\n    vat = round(price * rate / 100, 2)    # מעגלים לאגורות לפני החיבור\n    total = round(price + vat, 2)\n    return f\"{price:.2f} + {vat:.2f} = {total:.2f}\"\n","explanation":"<p>התרגיל מחבר את כל הנושאים של הרמה: אריתמטיקה עם אחוזים, עיגול לצורך חישוב, ועיצוב לצורך תצוגה.</p><p>ההחלטה המהותית כאן היא <b>מתי</b> לעגל. עיגול המע\"מ לפני החיבור מבטיח שהשורה תסתדר חשבונאית: הסכום המוצג הוא באמת סכום שני הערכים המוצגים. אם היינו מעגלים רק בתצוגה, יכולנו לקבל שורה כמו <code>19.90 + 3.38 = 23.29</code> שנראית כמו טעות למרות שכל ערך בפני עצמו מעוגל נכון.</p><p>לכן הכלל המעשי: עגל בשלב החישוב כשהערך המעוגל הוא הערך הקובע, והשתמש במפרט העיצוב רק להצגה אחידה של מה שכבר חושב.</p>","tests":[{"name":"מע\"מ על מחיר עשרוני","code":"assert price_summary(19.9, 17) == \"19.90 + 3.38 = 23.28\""},{"name":"מחיר עגול","code":"assert price_summary(100, 17) == \"100.00 + 17.00 = 117.00\""},{"name":"מחיר אפס","code":"assert price_summary(0, 17) == \"0.00 + 0.00 = 0.00\", \"0 צריך להחזיר שורה תקינה\""},{"name":"שיעור מע\"מ אפס","code":"assert price_summary(50, 0) == \"50.00 + 0.00 = 50.00\""},{"name":"סכום גדול","code":"assert price_summary(1000, 17) == \"1000.00 + 170.00 = 1170.00\""}]},{"id":29,"num":29,"level":2,"title":"סימן המספר","diff":"easy","points":15,"tags":["תנאים","פונקציות"],"desc":"<p>מכאן והלאה כל תרגיל נכתב כ<b>פונקציה</b> שמחזירה ערך. במקום להדפיס תוצאה, הפונקציה\n מסיימת עם <code>return</code>, והבודק קורא לה עם כמה קלטים שונים.</p>\n <p>כתוב פונקציה <code>sign(n)</code> שמקבלת מספר ומחזירה מחרוזת:</p>\n <ul>\n   <li><code>\"חיובי\"</code> אם המספר גדול מאפס</li>\n   <li><code>\"שלילי\"</code> אם המספר קטן מאפס</li>\n   <li><code>\"אפס\"</code> אם המספר שווה לאפס</li>\n </ul>\n <p>דוגמה: <code>sign(5)</code> יחזיר <code>\"חיובי\"</code>, <code>sign(-2.5)</code> יחזיר\n <code>\"שלילי\"</code>, <code>sign(0)</code> יחזיר <code>\"אפס\"</code>.</p>","hint":"שלושה מקרים זרים זה לזה — בדיוק המבנה של if / elif / else. שים לב: return מסיים את הפונקציה מיד.","starter":"def sign(n):\n    # כתוב כאן\n    pass\n","solution":"def sign(n):\n    if n > 0:\n        return \"חיובי\"\n    elif n < 0:\n        return \"שלילי\"\n    else:\n        return \"אפס\"\n","explanation":"<p>שרשרת <code>if / elif / else</code> נבדקת מלמעלה למטה ועוצרת בתנאי הראשון שמתקיים.\n לכן כשהגענו ל-<code>elif n &lt; 0</code> אנחנו כבר יודעים בוודאות ש-<code>n &gt; 0</code> לא התקיים,\n ואין צורך לבדוק את זה שוב.</p>\n <p>ה-<code>else</code> תופס את כל מה שנשאר — כאן רק המקרה <code>n == 0</code>. אפשר היה לכתוב\n <code>elif n == 0</code>, אבל <code>else</code> מבטיח שהפונקציה תמיד מחזירה ערך ולא <code>None</code>.</p>\n <p><code>return</code> לא רק מחזיר ערך — הוא גם <b>מסיים</b> את הפונקציה, ולכן שאר הענפים לא ירוצו.</p>","tests":[{"name":"מספר חיובי","code":"assert sign(5) == 'חיובי', 'ציפינו חיובי'"},{"name":"מספר שלילי","code":"assert sign(-2.5) == 'שלילי', 'ציפינו שלילי'"},{"name":"מקרה קצה: אפס","code":"assert sign(0) == 'אפס', 'ציפינו אפס'"},{"name":"חיובי קטן מאוד","code":"assert sign(0.001) == 'חיובי'"}]},{"id":30,"num":30,"level":2,"title":"ציון לאות","diff":"easy","points":15,"tags":["תנאים","פונקציות"],"desc":"<p>כתוב פונקציה <code>grade_letter(score)</code> שמקבלת ציון מספרי בין 0 ל-100\n ומחזירה את אות הציון לפי הטבלה:</p>\n <ul>\n   <li>90 ומעלה — <code>\"A\"</code></li>\n   <li>80 עד 89 — <code>\"B\"</code></li>\n   <li>70 עד 79 — <code>\"C\"</code></li>\n   <li>60 עד 69 — <code>\"D\"</code></li>\n   <li>מתחת ל-60 — <code>\"F\"</code></li>\n </ul>\n <p>דוגמה: <code>grade_letter(85)</code> יחזיר <code>\"B\"</code>, <code>grade_letter(59.5)</code>\n יחזיר <code>\"F\"</code>.</p>","hint":"אם תבדוק את הסף הגבוה ביותר קודם, כל elif הבא כבר יודע שהציון קטן מהסף הקודם — ואז מספיק תנאי אחד בכל שורה.","starter":"def grade_letter(score):\n    # כתוב כאן\n    pass\n","solution":"def grade_letter(score):\n    if score >= 90:\n        return \"A\"\n    elif score >= 80:   # כאן כבר ידוע ש-score < 90\n        return \"B\"\n    elif score >= 70:\n        return \"C\"\n    elif score >= 60:\n        return \"D\"\n    else:\n        return \"F\"\n","explanation":"<p>הטריק כאן הוא <b>סדר הבדיקות</b>. אם בודקים מהסף הגבוה לנמוך, כל <code>elif</code> מקבל\n בחינם את המידע שכל התנאים שמעליו נכשלו. לכן <code>score &gt;= 80</code> מספיק, ואין צורך לכתוב\n <code>80 &lt;= score &lt; 90</code>.</p>\n <p>אילו היינו מסדרים מהנמוך לגבוה, כל ציון מעל 60 היה נתפס מיד ב-<code>score &gt;= 60</code>\n והתשובה הייתה תמיד <code>\"D\"</code> — טעות קלאסית.</p>","tests":[{"name":"ציון B","code":"assert grade_letter(85) == 'B'"},{"name":"גבול תחתון של A","code":"assert grade_letter(90) == 'A'"},{"name":"מקרה קצה: אפס","code":"assert grade_letter(0) == 'F'"},{"name":"כל הטווחים","code":"assert [grade_letter(s) for s in [100, 80, 79, 60, 59.5]] == ['A','B','C','D','F']"}]},{"id":31,"num":31,"level":2,"title":"מחיר כרטיס לפי גיל","diff":"easy","points":15,"tags":["תנאים","פונקציות"],"desc":"<p>מוזיאון גובה מחיר כרטיס לפי גיל המבקר:</p>\n <ul>\n   <li>מתחת לגיל 5 — כניסה חינם, <code>0</code></li>\n   <li>גיל 5 עד 17 (כולל) — <code>30</code></li>\n   <li>גיל 18 עד 64 (כולל) — <code>50</code></li>\n   <li>גיל 65 ומעלה — <code>25</code></li>\n </ul>\n <p>כתוב פונקציה <code>ticket_price(age)</code> שמחזירה את המחיר כמספר שלם.\n דוגמה: <code>ticket_price(10)</code> יחזיר <code>30</code>, <code>ticket_price(70)</code>\n יחזיר <code>25</code>.</p>","hint":"סדר את הבדיקות מהגיל הנמוך לגבוה (או להפך) — כך כל תנאי צריך רק גבול אחד. שים לב שהמחיר לא עולה מונוטונית עם הגיל, אבל זה לא משנה לסדר הבדיקות.","starter":"def ticket_price(age):\n    # כתוב כאן\n    pass\n","solution":"def ticket_price(age):\n    if age < 5:\n        return 0\n    elif age < 18:\n        return 30\n    elif age < 65:\n        return 50\n    else:\n        return 25\n","explanation":"<p>כל <code>elif</code> מגדיר רק את <b>הגבול העליון</b> של הטווח שלו, כי הגבול התחתון כבר\n מובטח על ידי התנאים שנכשלו לפניו. זה הופך שרשרת של ארבעה טווחים לארבע השוואות פשוטות.</p>\n <p>שים לב לגבולות: <code>age &lt; 18</code> תופס גם את גיל 17 אבל לא את 18 — בדיוק מה שהוגדר.\n שגיאות \"off by one\" בגבולות הן הבאג הנפוץ ביותר בתרגילים כאלה, ולכן הבדיקות בודקות דווקא\n את הערכים 5, 17, 18, 64 ו-65.</p>","tests":[{"name":"ילד","code":"assert ticket_price(10) == 30"},{"name":"מקרה קצה: תינוק","code":"assert ticket_price(0) == 0"},{"name":"גבולות מדויקים","code":"assert [ticket_price(a) for a in [4,5,17,18,64,65]] == [0,30,30,50,50,25]"},{"name":"קשיש","code":"assert ticket_price(90) == 25"}]},{"id":32,"num":32,"level":2,"title":"מי נכנס למופע","diff":"easy","points":15,"tags":["תנאים","אופרטורים לוגיים"],"desc":"<p>הכניסה למופע מותרת אם מתקיים אחד משני אלה:</p>\n <ul>\n   <li>המבקר הוא VIP — ואז הוא נכנס תמיד</li>\n   <li>או שהמבקר בן 18 לפחות <b>וגם</b> יש לו כרטיס</li>\n </ul>\n <p>כתוב פונקציה <code>can_enter(age, has_ticket, is_vip)</code> שמחזירה <code>True</code>\n או <code>False</code>. שני הפרמטרים האחרונים הם ערכי אמת (<code>True</code>/<code>False</code>).</p>\n <p>דוגמה: <code>can_enter(20, True, False)</code> יחזיר <code>True</code>,\n <code>can_enter(15, True, False)</code> יחזיר <code>False</code>,\n <code>can_enter(15, False, True)</code> יחזיר <code>True</code>.</p>","hint":"אפשר לכתוב את כל הכלל בשורת return אחת עם and, or וסוגריים. זכור: and קושר חזק יותר מ-or.","starter":"def can_enter(age, has_ticket, is_vip):\n    # כתוב כאן\n    pass\n","solution":"def can_enter(age, has_ticket, is_vip):\n    # הסוגריים לא הכרחיים (and קודם ל-or) אבל הופכים את הכוונה לברורה\n    return is_vip or (age >= 18 and has_ticket)\n","explanation":"<p>ביטוי בוליאני הוא בעצמו ערך, ולכן אפשר להחזיר אותו ישירות. אין צורך ב-\n <code>if ...: return True else: return False</code> — זו כפילות מיותרת.</p>\n <p><b>סדר עדיפות:</b> ב-Python <code>not</code> חזק מ-<code>and</code>, ו-<code>and</code> חזק\n מ-<code>or</code>. לכן <code>is_vip or age &gt;= 18 and has_ticket</code> נקרא בדיוק כמו\n <code>is_vip or (age &gt;= 18 and has_ticket)</code>. הסוגריים לא משנים את התוצאה, אבל הם\n מתעדים את הכוונה וחוסכים למי שקורא את הקוד את הצורך לזכור את הטבלה.</p>\n <p><b>הערכה עצלה (short-circuit):</b> אם <code>is_vip</code> הוא <code>True</code>, Python\n כלל לא מחשב את הצד הימני של ה-<code>or</code>.</p>","tests":[{"name":"בוגר עם כרטיס","code":"assert can_enter(20, True, False) == True"},{"name":"קטין ללא VIP","code":"assert can_enter(15, True, False) == False"},{"name":"מקרה קצה: קטין שהוא VIP","code":"assert can_enter(15, False, True) == True"},{"name":"בוגר בלי כרטיס","code":"assert can_enter(30, False, False) == False"}]},{"id":33,"num":33,"level":2,"title":"שנה מעוברת","diff":"easy","points":15,"tags":["תנאים","אופרטורים לוגיים"],"desc":"<p>שנה בלוח הגרגוריאני היא מעוברת אם היא מתחלקת ב-4, <b>אבל לא</b> אם היא מתחלקת ב-100 —\n <b>אלא אם כן</b> היא מתחלקת ב-400.</p>\n <p>כתוב פונקציה <code>is_leap(year)</code> שמחזירה <code>True</code> אם השנה מעוברת,\n אחרת <code>False</code>.</p>\n <p>דוגמה: <code>is_leap(2024)</code> יחזיר <code>True</code>, <code>is_leap(1900)</code>\n יחזיר <code>False</code> (מתחלקת ב-100 אך לא ב-400), <code>is_leap(2000)</code> יחזיר\n <code>True</code> (מתחלקת ב-400).</p>","hint":"תרגם כל חלק במשפט לתנאי: 'מתחלק ב-4' הוא year % 4 == 0. 'אבל לא' הוא and not. 'אלא אם כן' הוא or נוסף מסביב להכל.","starter":"def is_leap(year):\n    # כתוב כאן\n    pass\n","solution":"def is_leap(year):\n    return (year % 4 == 0 and year % 100 != 0) or year % 400 == 0\n","explanation":"<p>הכלל בעברית מכיל שלוש שכבות, וכל שכבה מתורגמת לאופרטור לוגי אחד:</p>\n <ul>\n   <li>\"מתחלקת ב-4\" → <code>year % 4 == 0</code></li>\n   <li>\"אבל לא ב-100\" → <code>and year % 100 != 0</code></li>\n   <li>\"אלא אם כן ב-400\" → <code>or year % 400 == 0</code> שעוקף את כל מה שלפניו</li>\n </ul>\n <p>הסוגריים כאן <b>מיותרים טכנית</b> — <code>and</code> קודם ל-<code>or</code> ממילא — אבל הם\n מבהירים שה-<code>or</code> הוא \"דלת אחורית\" שגוברת על שני התנאים הראשונים יחד.</p>\n <p>שים לב ש-<code>%</code> על מספר שלילי ב-Python מחזיר תמיד ערך באותו סימן של המחלק, ולכן\n הנוסחה עובדת גם לשנים שליליות (לפני הספירה): <code>is_leap(-4)</code> מחזירה <code>True</code>.</p>","tests":[{"name":"שנה מעוברת רגילה","code":"assert is_leap(2024) == True"},{"name":"שנה רגילה","code":"assert is_leap(2023) == False"},{"name":"מקרה קצה: כפולת 100","code":"assert is_leap(1900) == False and is_leap(2000) == True"},{"name":"טווח שלם","code":"assert [y for y in range(1896, 1910) if is_leap(y)] == [1896, 1904, 1908]"}]},{"id":34,"num":34,"level":2,"title":"סכום עד n","diff":"easy","points":15,"tags":["לולאות","range"],"desc":"<p>כתוב פונקציה <code>sum_to(n)</code> שמחזירה את סכום כל המספרים השלמים מ-1 עד\n <code>n</code> (כולל), בעזרת לולאת <code>for</code>.</p>\n <p>אם <code>n</code> קטן מ-1, הסכום הוא <code>0</code>.</p>\n <p>דוגמה: <code>sum_to(5)</code> יחזיר <code>15</code> כי\n <code>1+2+3+4+5 = 15</code>. <code>sum_to(0)</code> יחזיר <code>0</code>.</p>","hint":"התחל ממשתנה צובר בערך 0 לפני הלולאה, והוסף לו בכל סיבוב. range(1, n+1) נותן בדיוק את המספרים 1 עד n.","starter":"def sum_to(n):\n    # כתוב כאן\n    pass\n","solution":"def sum_to(n):\n    total = 0\n    for i in range(1, n + 1):   # n+1 כי range לא כולל את הקצה העליון\n        total += i\n    return total\n","explanation":"<p>זו <b>תבנית הצבירה</b> הבסיסית: מאתחלים משתנה לפני הלולאה, מעדכנים אותו בכל סיבוב,\n ומחזירים אותו אחריה. חשוב שהאתחול יהיה <b>מחוץ</b> ללולאה — אחרת הוא היה מתאפס בכל סיבוב.</p>\n <p><code>range(1, n+1)</code> מייצר 1, 2, ..., n. ה-<code>+1</code> נדרש כי הקצה העליון של\n <code>range</code> לעולם אינו נכלל.</p>\n <p>כאשר <code>n &lt;= 0</code> הטווח <code>range(1, n+1)</code> ריק, הלולאה לא רצה אפילו פעם אחת,\n ו-<code>total</code> נשאר 0 — כלומר מקרה הקצה מטופל מעצמו בלי <code>if</code> מיוחד.</p>","tests":[{"name":"סכום עד 5","code":"assert sum_to(5) == 15"},{"name":"מקרה קצה: אפס","code":"assert sum_to(0) == 0 and sum_to(-4) == 0"},{"name":"מספר יחיד","code":"assert sum_to(1) == 1"},{"name":"מספר גדול","code":"assert sum_to(100) == 5050"}]},{"id":35,"num":35,"level":2,"title":"ספירה לאחור","diff":"easy","points":15,"tags":["לולאות","range"],"desc":"<p>ל-<code>range</code> יש שלושה פרמטרים: <code>range(start, stop, step)</code>.\n הפרמטר השלישי הוא הצעד, והוא יכול להיות <b>שלילי</b>.</p>\n <p>כתוב פונקציה <code>countdown(n)</code> שמחזירה <b>רשימה</b> של המספרים מ-<code>n</code>\n ועד 1 בסדר יורד. אם <code>n</code> קטן מ-1 — החזר רשימה ריקה.</p>\n <p>דוגמה: <code>countdown(5)</code> יחזיר <code>[5, 4, 3, 2, 1]</co
