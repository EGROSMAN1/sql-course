<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070d0f;--bg2:#0c1518;--bg3:#111e21;
  --border:rgba(0,212,200,.08);--border2:rgba(0,212,200,.18);
  --text:#e8f4f5;--text2:#6b9098;--text3:#2a4048;
  --aq:#00d4c8;--aq2:rgba(0,212,200,.12);
  --green:#00e676;--red:#ff4757;--orange:#FFB020;
  --font:'Heebo',sans-serif;--mono:'IBM Plex Mono',monospace;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);overflow-x:hidden}

/* TOPNAV */
.topnav{background:rgba(7,13,15,.97);border-bottom:1px solid var(--border);padding:.6rem 1.25rem;display:flex;align-items:center;gap:.75rem;position:sticky;top:0;z-index:100;flex-wrap:wrap}
.back-btn{color:var(--aq);text-decoration:none;font-size:12px;font-weight:700;font-family:var(--mono)}
.topnav-title{font-size:13px;font-weight:700;color:var(--text2)}
.topnav-right{display:flex;align-items:center;gap:.5rem;margin-right:auto}
.score-badge{background:var(--bg3);border:1px solid var(--border2);color:var(--aq);font-size:12px;font-weight:700;padding:4px 10px;border-radius:6px;font-family:var(--mono)}
.level-tabs{display:flex;gap:.35rem;margin-right:.5rem}
.ltab{font-size:11px;font-weight:700;padding:4px 10px;border-radius:5px;text-decoration:none;border:1px solid var(--border2);color:var(--text2);transition:all .12s;font-family:var(--mono)}
.ltab:hover{color:var(--text);border-color:var(--border2)}
.ltab.active{background:var(--aq2);border-color:var(--aq);color:var(--aq)}

/* FIREBASE BAR */
.fb-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:.5rem 1.5rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;position:sticky;top:48px;z-index:90}
.fb-login-btn{display:flex;align-items:center;gap:6px;background:#4285f4;color:#fff;border:none;padding:7px 14px;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--font)}
.fb-logout-btn{display:none;align-items:center;gap:5px;background:transparent;color:var(--text2);border:1px solid var(--border2);padding:5px 10px;border-radius:6px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:var(--font)}
.fb-user-info{display:none;align-items:center;gap:.5rem}
.fb-user-photo{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--aq)}
.fb-user-name{font-size:12.5px;font-weight:700;color:var(--text)}
.fb-saved-score{display:none;font-size:11px;color:var(--aq);font-family:var(--mono);background:rgba(0,212,200,.08);padding:3px 9px;border-radius:4px}
.fb-save-btn{display:none;align-items:center;gap:5px;background:var(--aq);color:var(--bg);border:none;padding:7px 14px;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--font);margin-right:auto}
.fb-history-btn{display:none;align-items:center;gap:5px;background:transparent;color:var(--text2);border:1px solid var(--border2);padding:5px 10px;border-radius:6px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:var(--font)}
.fb-history-btn:hover{color:var(--text);border-color:var(--aq)}
.fb-history-wrap{background:var(--bg2);border-bottom:1px solid var(--border);padding:1rem 1.5rem;display:none}
.hstats-row{display:flex;gap:1.5rem;margin-bottom:1rem;justify-content:center}
.hstat-mini{text-align:center}
.hstat-n{font-size:1.4rem;font-weight:900;font-family:var(--mono)}
.hstat-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.hchart{display:flex;align-items:flex-end;gap:.4rem;height:130px;padding:.5rem 0;overflow-x:auto}
.hbar-wrap{display:flex;flex-direction:column;align-items:center;gap:.2rem;min-width:32px;flex-shrink:0}
.hbar{width:24px;border-radius:4px 4px 0 0;transition:all .3s;min-height:8px}
.hbar-val{font-size:9.5px;color:var(--text2);font-family:var(--mono)}
.hbar-lbl{font-size:9px;color:var(--text3)}
#fb-toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--aq);color:var(--bg);padding:10px 20px;border-radius:8px;font-weight:700;font-size:13px;opacity:0;transition:all .3s;z-index:999;pointer-events:none}
#fb-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* HERO */
.hero{padding:2rem 1.5rem 1.5rem;text-align:center;border-bottom:1px solid var(--border);background:radial-gradient(ellipse 70% 60% at 50% 0%,rgba(0,212,200,.06),transparent 70%)}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,212,200,.1);border:1px solid var(--border2);color:var(--aq);font-size:10px;font-weight:700;padding:4px 12px;border-radius:20px;font-family:var(--mono);letter-spacing:1px;margin-bottom:.75rem}
.hero-title{font-size:2rem;font-weight:900;color:var(--text);margin-bottom:.3rem}
.hero-title em{color:var(--aq);font-style:normal}
.hero-desc{color:var(--text2);font-size:.9rem;margin-bottom:1.25rem}
.hero-stats{display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap}
.hs{text-align:center}
.hs-n{font-size:1.6rem;font-weight:900;font-family:var(--mono);color:var(--aq)}
.hs-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}

/* PROGRESS */
.prog-bar-wrap{padding:.75rem 1.5rem;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:1rem;position:sticky;top:96px;z-index:80}
.prog-bar{flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--aq);border-radius:2px;transition:width .3s}
.prog-txt{font-size:11px;color:var(--text2);font-family:var(--mono);white-space:nowrap}
.score-display{font-size:12px;font-weight:700;font-family:var(--mono);color:var(--aq);white-space:nowrap}

/* MAIN */
.main{max-width:800px;margin:0 auto;padding:1.5rem 1rem 4rem}

/* SECTION LABEL */
.sec-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--aq);font-family:var(--mono);padding:.75rem 0 .5rem;margin-top:1rem;border-bottom:1px solid var(--border);margin-bottom:1rem}

/* QUESTION CARD */
.q-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1.1rem 1.25rem;margin-bottom:.75rem;transition:border-color .2s}
.q-card.correct{border-color:rgba(0,230,118,.3)}
.q-card.wrong{border-color:rgba(255,71,87,.3)}
.q-header{margin-bottom:.85rem}
.q-meta{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem}
.q-num{font-size:10px;font-family:var(--mono);color:var(--text3);background:var(--bg3);padding:2px 8px;border-radius:4px;font-weight:700}
.q-section-tag{font-size:10px;color:var(--text3);font-weight:600}
.q-text{font-size:14px;font-weight:700;color:var(--text);line-height:1.55}
.options{display:flex;flex-direction:column;gap:.4rem}
.option{display:flex;align-items:flex-start;gap:.65rem;padding:.6rem .8rem;background:var(--bg3);border:1px solid var(--border);border-radius:7px;cursor:pointer;transition:all .15s;user-select:none}
.option:hover:not(.disabled){border-color:var(--border2);background:rgba(0,212,200,.05)}
.option.disabled{cursor:default}
.option.correct-ans{border-color:rgba(0,230,118,.5);background:rgba(0,230,118,.07)}
.option.wrong-ans{border-color:rgba(255,71,87,.4);background:rgba(255,71,87,.07)}
.opt-letter{width:20px;height:20px;border-radius:4px;background:var(--bg);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--text2);flex-shrink:0;font-family:var(--mono)}
.option.correct-ans .opt-letter{background:rgba(0,230,118,.2);border-color:rgba(0,230,118,.5);color:var(--green)}
.option.wrong-ans .opt-letter{background:rgba(255,71,87,.2);border-color:rgba(255,71,87,.5);color:var(--red)}
.opt-text{font-size:13px;color:var(--text2);line-height:1.5}
.option.correct-ans .opt-text{color:var(--text)}
.explanation{background:var(--bg3);border-right:2px solid var(--aq);border-radius:0 6px 6px 0;padding:.6rem .85rem;margin-top:.6rem;display:none}
.explanation.show{display:block}
.exp-label{font-size:10px;font-weight:700;color:var(--aq);font-family:var(--mono);margin-bottom:.25rem}
.exp-text{font-size:12.5px;color:var(--text2);line-height:1.6}

/* FINISH */
.finish-card{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:2.5rem;text-align:center;margin-top:2rem;display:none}
.finish-card.show{display:block}
.finish-emoji{font-size:3rem;margin-bottom:.75rem}
.finish-title{font-size:1.5rem;font-weight:900;color:var(--text);margin-bottom:.5rem}
.finish-score{font-size:2.5rem;font-weight:900;font-family:var(--mono);color:var(--aq);margin-bottom:.5rem}
.finish-grade{font-size:1rem;font-weight:700;margin-bottom:.5rem}
.finish-sub{font-size:.9rem;color:var(--text2);margin-bottom:1.5rem}
.retry-btn{background:var(--aq);color:var(--bg);border:none;padding:10px 24px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;font-family:var(--font);margin-left:.5rem}
.level-link{display:inline-block;background:transparent;color:var(--text2);border:1px solid var(--border2);padding:10px 20px;border-radius:8px;font-weight:600;font-size:13px;text-decoration:none;margin-top:.5rem;transition:all .15s}
.level-link:hover{border-color:var(--aq);color:var(--aq)}

/* MOBILE */
/* ===== MOBILE — comprehensive responsive layout ===== */
@media(max-width:900px){
  .level-tabs{flex-wrap:wrap;gap:4px;justify-content:flex-end}
  .level-tabs .ltab:not([title]){font-size:11px;padding:3px 7px}
}
@media(max-width:768px){
  .topnav{padding:.45rem .7rem;gap:.4rem;flex-wrap:wrap}
  .topnav-title{font-size:12px;flex:1;min-width:0;text-align:center}
  .back-btn{font-size:11.5px;padding:4px 9px}
  /* Hide the SQL-quiz tabs on mobile but KEEP language flags visible */
  .level-tabs .ltab:not([title="עברית"]):not([title="English"]):not([title="中文"]){display:none}
  .level-tabs{flex-wrap:nowrap;gap:3px}
  .score-badge{font-size:11.5px;padding:3px 8px}
  .hero{padding:1.2rem .8rem .9rem}
  .hero-title{font-size:1.4rem;line-height:1.25}
  .hero-subtitle{font-size:12.5px}
  .hero-stats{gap:.5rem;flex-wrap:wrap;justify-content:center;margin-top:.9rem}
  .hs{min-width:60px;padding:.4rem .55rem}
  .hs-n{font-size:1.1rem}
  .hs-l{font-size:10.5px}
  .prog-bar-wrap{padding:.6rem .8rem;gap:.5rem;flex-wrap:wrap}
  .prog-bar{height:8px}
  .prog-txt,.score-display{font-size:12px}
  .main{padding:.9rem .65rem 3rem}
  .q-card{padding:.85rem;border-radius:10px;margin-bottom:.9rem}
  .q-num{font-size:11px}
  .q-section{font-size:11px;padding:2px 8px}
  .q-text{font-size:13.5px;line-height:1.55}
  .options{gap:.4rem}
  .option{padding:.6rem .7rem;min-height:42px;font-size:13px}
  .opt-letter{width:22px;height:22px;font-size:11.5px;flex-shrink:0}
  .opt-text{font-size:12.5px;line-height:1.45}
  .explanation{font-size:12.5px;padding:.7rem .8rem;line-height:1.55}
  .explanation b{font-size:12.5px}
  .finish-card{padding:1.4rem .9rem;margin:1.5rem .3rem}
  .finish-title{font-size:1.3rem}
  .finish-score{font-size:1.8rem}
  .finish-msg{font-size:13px}
  .finish-actions{flex-direction:column;gap:.5rem}
  .finish-actions button,.finish-actions a{width:100%;padding:.7rem 1rem;font-size:13.5px;justify-content:center}
  .fb-bar{padding:.4rem .7rem;font-size:11.5px;flex-wrap:wrap;gap:.4rem}
  .fb-login-btn,.fb-logout-btn{font-size:11px;padding:4px 10px}
}
@media(max-width:480px){
  .topnav{padding:.4rem .55rem}
  .topnav-title{font-size:11px}
  .back-btn{font-size:11px;padding:3px 7px}
  .hero{padding:1rem .65rem .8rem}
  .hero-title{font-size:1.2rem}
  .hero-subtitle{font-size:11.5px}
  .hero-stats{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:.2rem}
  .hero-stats::-webkit-scrollbar{display:none}
  .hs{flex-shrink:0;min-width:55px}
  .main{padding:.7rem .5rem 2.5rem}
  .q-card{padding:.75rem}
  .q-text{font-size:13px}
  .option{padding:.55rem .6rem;min-height:40px}
  .opt-text{font-size:12px}
  .opt-letter{width:20px;height:20px;font-size:11px}
  .prog-bar-wrap{padding:.5rem .65rem}
}
@media(max-width:380px){
  .topnav{padding:.35rem .45rem}
  .topnav-title{font-size:10.5px}
  .hero-title{font-size:1.1rem}
  .hs{min-width:48px;padding:.35rem .4rem}
  .hs-n{font-size:1rem}
  .hs-l{font-size:9.5px}
  .q-card{padding:.65rem}
  .q-text{font-size:12.5px}
  .option{padding:.5rem .55rem}
  .opt-text{font-size:11.5px}
  .opt-letter{width:18px;height:18px;font-size:10px}
}

/* trilingual flag toggle — compact on mobile (3 langs) */
@media(max-width:560px){
  a[title="עברית"],a[title="English"],a[title="中文"]{font-size:11px;padding:3px 7px;gap:3px}
  a[title="עברית"] svg,a[title="English"] svg,a[title="中文"] svg{width:16px;height:11px}
  .lang-flags{flex-wrap:wrap;gap:4px}
}
@media(max-width:380px){
  a[title="עברית"],a[title="English"],a[title="中文"]{font-size:0;padding:3px 5px;gap:0}
  a[title="עברית"] svg,a[title="English"] svg,a[title="中文"] svg{width:18px;height:12px}
}

/* trilingual flag toggle — compact on mobile (3 langs) */
@media(max-width:560px){
  a[title="עברית"],a[title="English"],a[title="中文"]{font-size:11px;padding:3px 7px;gap:3px}

<script>
const questions = [
  {n:1,s:"חלק א׳ — היכרות בסיסית עם הטבלה",t:"איזו פקודה משמשת להצגת 5 השורות הראשונות בטבלה?",o:["df.first(5)","df.head()","df.top()","df.show(5)"],c:1,e:"head() מציגה כברירת מחדל את 5 השורות הראשונות לצורך הצצה ראשונית בנתונים."},
  {n:2,s:"חלק א׳ — היכרות בסיסית עם הטבלה",t:"כיצד ניתן לראות את מספר השורות והעמודות המדויק בטבלה?",o:["df.size()","df.info","df.shape","df.count()"],c:2,e:"shape הוא מאפיין (לא פונקציה) שמחזיר tuple של (שורות, עמודות) — לכן נכתב ללא סוגריים."},
  {n:3,s:"חלק א׳ — היכרות בסיסית עם הטבלה",t:"מה עושה הפקודה df.describe()?",o:["מציגה את שמות העמודות","מפיקה סטטיסטיקה תיאורית אוטומטית (ממוצע, מינ׳, מקס׳) לעמודות מספריות","מתארת את סוגי הנתונים","בודקת ערכים כפולים"],c:1,e:"describe מספקת מדדים סטטיסטיים מרכזיים — ממוצע, סטיית תקן, אחוזונים — במכה אחת."},
  {n:4,s:"חלק א׳ — היכרות בסיסית עם הטבלה",t:"מדוע חשוב להשתמש ב-df_new = df.copy() במקום ב-df_new = df?",o:["הטבלה תתפוס פחות זיכרון","למנוע מצב שבו שינויים בעותק ישפיעו בטעות גם על המקור","כדי לשרשר את הטבלה לעצמה","copy משמש רק לייצוא קבצים"],c:1,e:"הצבה רגילה יוצרת רק הפניה לאותו אובייקט. copy() מבטיחה עותק עצמאי לחלוטין."},
  {n:5,s:"חלק א׳ — היכרות בסיסית עם הטבלה",t:"איזו פקודה תהפוך את סדר השורות בטבלה (האחרונה הופכת לראשונה)?",o:["df.reverse()","df.iloc[::-1]","df.sort_values(ascending=False)","df.flip_rows()"],c:1,e:"[::-1] בתוך iloc הוא טריק slicing של פייתון — צעדים של מינוס 1 לאורך השורות."},
  {n:6,s:"חלק א׳ — היכרות בסיסית עם הטבלה",t:"כיצד נשלוף כ-10% מהשורות באופן אקראי?",o:["df.sample(n=10)","df.sample(percent=10)","df.sample(frac=0.1)","df.sample(ratio=0.1)"],c:2,e:"frac (Fraction) מקבל שבר בין 0 ל-1 ומייצג את חלק השורות לדגימה. שימו לב: התוצאה מעוגלת לשורה שלמה — על 107 שורות frac=0.1 יחזיר 11 שורות. להוספת שחזוריות מעבירים random_state=42."},
  {n:7,s:"חלק א׳ — היכרות בסיסית עם הטבלה",t:"איך נבדוק כמה זיכרון (בבתים) צורכת כל עמודה בטבלה?",o:["df.info()","df.memory_usage(deep=True)","df.size","df.bytes()"],c:1,e:"memory_usage(deep=True) מנתחת לעומק גם עמודות object (טקסט) ומחזירה צריכת זיכרון מדויקת."},
  {n:8,s:"חלק א׳ — היכרות בסיסית עם הטבלה",t:"באיזו פקודה נכפה על פנדס להציג תמיד את כל העמודות בלי קיצור?",o:["df.show_all_columns()","pd.set_option('display.max_columns', None)","pd.display_settings(columns='all')","df.columns.expand()"],c:1,e:"set_option שולטת בהגדרות התצוגה הגלובליות. None מבטל את ההגבלה."},
  {n:9,s:"חלק א׳ — היכרות בסיסית עם הטבלה",t:"כיצד נדע כמה שורות יש בטבלה בלי להשתמש ב-len()?",o:["df.size()","df.shape[0]","df.rows()","df.count_rows()"],c:1,e:"shape מחזיר (שורות, עמודות). המקום [0] הוא מספר השורות."},
  {n:10,s:"חלק א׳ — היכרות בסיסית עם הטבלה",t:"מה מחזירה הפקודה df.columns?",o:["מספר עמודות","אובייקט עם רשימת שמות כל העמודות","מסדר עמודות בא״ב","מוחקת עמודות ריקות"],c:1,e:"מאפיין (לא פונקציה) שמחזיר את שמות העמודות — שימושי לתצוגה או לעדכון."},
  {n:11,s:"חלק ב׳ — סינון, שליפה ומיון",t:"מהי הדרך הנכונה לסנן לפי שני תנאים: גיל > 30 וגם עיר = Tel Aviv?",o:["df[df['age']>30 and df['city']=='Tel Aviv']","df[(df['age']>30) & (df['city']=='Tel Aviv')]","df[df['age']>30 & df['city']=='Tel Aviv']","df.filter(age>30, city='Tel Aviv')"],c:1,e:"חובה & עבור 'וגם' (או | עבור 'או'), וחובה לעטוף כל תנאי בסוגריים."},
  {n:12,s:"חלק ב׳ — סינון, שליפה ומיון",t:"כיצד נשלוף את 5 השורות עם הערכים הגבוהים ביותר בעמודה?",o:["df.sort_values(desc=True).head(5)","df.max(5,'column')","df.top(5,'column')","df.nlargest(5,'column')"],c:3,e:"nlargest יעיל יותר ממיון מלא — מקביל ל-ORDER BY DESC LIMIT 5."},
  {n:13,s:"חלק ב׳ — סינון, שליפה ומיון",t:"באיזו פקודה נסנן בסגנון SQL במחרוזת טקסט?",o:["df.filter_text(\"age>30\")","df.query(\"age>30\")","df.search(\"age>30\")","df.sql(\"SELECT * WHERE age>30\")"],c:1,e:"query מקבלת תנאי כמחרוזת — לעיתים קריאה יותר מתנאי בוליאני בסוגריים."},
  {n:14,s:"חלק ב׳ — סינון, שליפה ומיון",t:"מה ההבדל בין df.loc ל-df.iloc?",o:["loc שולפת עמודות, iloc שולפת שורות","loc למספרים, iloc לטקסט","loc לפי שמות (Labels), iloc לפי מיקום מספרי","אין הבדל"],c:2,e:"ה-i ב-iloc = Integer location. נשתמש בה כשנדע מיקום ולא שם."},
  {n:15,s:"חלק ב׳ — סינון, שליפה ומיון",t:"איך נסנן לקוחות בערים 'Tel Aviv' או 'Haifa' בצורה היעילה?",o:["df[df['city']=='Tel Aviv' and df['city']=='Haifa']","df[(df['city']=='Tel Aviv') & (df['city']=='Haifa')]","df[df['city'].isin(['Tel Aviv','Haifa'])]","df.filter(city='Tel Aviv','Haifa')"],c:2,e:"isin חוסך תנאי OR ארוכים ומאפשר בדיקה מול רשימה בפקודה אחת."},
  {n:16,s:"חלק ב׳ — סינון, שליפה ומיון",t:"איזה סימן מחליף את OR (או) בתנאי סינון בפנדס?",o:["||","or","|","&"],c:2,e:"| (Pipe) משמש כ-OR בוליאני בין תנאים, ועוטפים כל תנאי בסוגריים."},
  {n:17,s:"חלק ב׳ — סינון, שליפה ומיון",t:"איך נמיין את הטבלה לפי 'price' מהיקר לזול?",o:["df.sort_values('price', ascending=False)","df.sort('price', desc=True)","df.order_by('price','DESC')","df.sort_values('price')"],c:0,e:"ascending=False ממיין בסדר יורד (מהגדול לקטן)."},
  {n:18,s:"חלק ב׳ — סינון, שליפה ומיון",t:"איך ניצור עמודה חדשה 'total' = 'price' + 'tax'?",o:["df.add_column('total','price'+'tax')","df['total']=df['price']+df['tax']","df.new('total')=df['price']+df['tax']","pd.concat(df['price'],df['tax'],name='total')"],c:1,e:"הגדרת שם בסוגריים מרובעים והשמת ביטוי מחושב — הצורה הסטנדרטית בפנדס."},
  {n:19,s:"חלק ב׳ — סינון, שליפה ומיון",t:"כיצד נציג את 3 הלקוחות עם ההכנסות הנמוכות מ-'revenue'?",o:["df.nsmallest(3,'revenue')","df.min(3,'revenue')","df.bottom(3,'revenue')","df.tail(3,'revenue')"],c:0,e:"nsmallest מקבילה ל-ORDER BY ASC LIMIT 3 — מהירה יותר ממיון מלא."},
  {n:20,s:"חלק ב׳ — סינון, שליפה ומיון",t:"איך נשלוף לפי מיקום: שורה 0, עמודה 1?",o:["df.loc[0,1]","df.iloc[0,1]","df.get(0,1)","df.select(0,1)"],c:1,e:"iloc תמיד עובדת עם אינדקסים מספריים שלמים."},
  {n:21,s:"חלק ב׳ — סינון, שליפה ומיון",t:"באיזה ערך של הפרמטר method תתנהג df['column'].rank(ascending=False) בדיוק כמו RANK ב-SQL?",o:["method='average' (ברירת המחדל)","method='min'","method='first'","method='dense'"],c:1,e:"ברירת המחדל של rank היא method='average', שמחלקת דירוג ממוצע לערכים שווים (למשל 2.5 ו-2.5) — התנהגות שאין לה מקבילה ישירה ב-SQL. המיפוי המדויק הוא: method='min' = RANK (דילוג אחרי תיקו), method='dense' = DENSE_RANK (בלי דילוג), method='first' = ROW_NUMBER (שובר תיקו לפי סדר הופעה)."},
  {n:22,s:"חלק ב׳ — סינון, שליפה ומיון",t:"איך נבדוק אם גיל הלקוח בין 18 ל-25 (כולל)?",o:["df['age'].between(18,25)","df['age'].in_range(18,25)","df['age'].middle(18,25)","df['age']==range(18,25)"],c:0,e:"between מקבילה ל-BETWEEN ב-SQL ומחזירה True/False."},
  {n:23,s:"חלק ג׳ — ערכים חסרים",t:"איזו פקודה סופרת בדיוק כמה ערכים ריקים יש בכל עמודה?",o:["df.count_nulls()","df.isnull()","df.isna().sum()","df.empty().count()"],c:2,e:"isna() מסמן True/False לכל תא, sum() סוכם את ה-True בכל עמודה."},
  {n:24,s:"חלק ג׳ — ערכים חסרים",t:"באיזו פקודה נמחק כל שורה שיש בה לפחות תא ריק אחד?",o:["df.dropna()","df.remove_nulls()","df.fillna(0)","df.drop_empty()"],c:0,e:"dropna() ברירת מחדל מוחקת שורות עם NaN. השתמש בזהירות — עלול למחוק הרבה נתונים."},
  {n:25,s:"חלק ג׳ — ערכים חסרים",t:"df.ffill() נועדה ל:",o:["מילוי בערך 0","מילוי ערכים חסרים על-ידי 'משיכת' הערך התקין מהשורה הקודמת","סינון לפי העמודה הראשונה","מציאת ערכים כפולים"],c:1,e:"Forward Fill — שימושי מאוד לערכי כותרת שצריכים לחול על שורות מתחתיהם."},
  {n:26,s:"חלק ג׳ — ערכים חסרים",t:"מה ההבדל בין df.dropna() ל-df.dropna(thresh=3)?",o:["thresh=3 מוחק רק 3 שורות","thresh=3 משאיר שורות עם לפחות 3 ערכים תקינים","thresh מוחק רק עמודות","אין הבדל"],c:1,e:"thresh (Threshold) קובע סף מינימום של ערכים תקינים בשורה כדי שלא תימחק."},
  {n:27,s:"חלק ג׳ — ערכים חסרים",t:"איזו פקודה הפוכה מ-isna() ומחזירה True רק לתאים מלאים?",o:["df.is_full()","df.has_data()","df.notna()","df.valid()"],c:2,e:"notna מסמן True רק לתאים שיש בהם ערך — שימושי לסינון."},
  {n:28,s:"חלק ג׳ — ערכים חסרים",t:"איך נדע במהירות באילו עמודות יש לפחות תא ריק אחד?",o:["df.isna().any()","df.isna().all()","df.check_nulls()","df.has_empty()"],c:0,e:"any() אחרי isna() מחזיר True לכל עמודה שיש בה לפחות ערך חסר אחד, ו-False לעמודה מלאה. שימו לב להבדל: any() שואל 'לפחות אחד', ואילו all() שואל 'כולם' ויחזיר True רק לעמודה שכולה ריקה."},
  {n:29,s:"חלק ג׳ — ערכים חסרים",t:"איזו פקודה משלימה ערכים חסרים על-ידי חישוב הערך היחסי בין השכן הקודם לבא?",o:["df.fill_between()","df.ffill()","df.interpolate()","df.bfill()"],c:2,e:"interpolate 'מותחת קו' בין הערכים — חובה לסדרות זמן ורצפים פיננסיים."},
  {n:30,s:"חלק ג׳ — ערכים חסרים",t:"איך נמלא ערכים חסרים ב-'age' בממוצע של אותה עמודה?",o:["df['age'].fillna(mean)","df['age'].fill_mean()","df['age'].fillna(df['age'].mean())","df['age'].replace_na('mean')"],c:2,e:"fillna מקבל ערך — כאן נעביר את הממוצע המחושב כארגומנט."},
  {n:31,s:"חלק ג׳ — ערכים חסרים",t:"מה עושה df.bfill()?",o:["ממלא ריקים ב-0","מילוי לאחור (Backward Fill) — לוקח ערך מהשורה הבאה","מילוי קדימה (Forward Fill)","מבצע Undo"],c:1,e:"bfill לוקח נתון מהשורה הבאה ו'מעלה' אותו למעלה למילוי תאים ריקים."},

  {n:67,s:"חלק ט׳ — טקסט ומחרוזות",t:"מה עושה df['column'].str.contains('test')?",o:["מחליפה test במילה אחרת","מחזירה True/False לפי האם הטקסט מכיל 'test'","מפצלת לפי המילה","מוחקת את המילה"],c:1,e:"str.contains מחזירה True/False לכל תא לפי האם המחרוזת מכילה את הביטוי — מקבילה ל-LIKE '%test%' ב-SQL, ומשמשת ישירות לסינון. שימו לב: ברירת המחדל היא regex=True, כלומר תווים כמו . או | מתפרשים כביטוי רגולרי. לחיפוש טקסט מילולי בלבד יש להוסיף regex=False."},
  {n:68,s:"חלק ט׳ — טקסט ומחרוזות",t:"איזו פקודה מנקה רווחים מתחילת ומסוף הטקסט (כמו TRIM)?",o:["df['column'].str.clean()","df['column'].str.strip()","df['column'].str.clear()","df['column'].str.replace(' ','')"],c:1,e:"strip מסירה רווחים בקצוות — כלי חיוני לניקוי נתונים לפני השוואות."},
  {n:69,s:"חלק ט׳ — טקסט ומחרוזות",t:"איך נפצל עמודת שם מלא (עם פסיק) לשתי עמודות?",o:["df['column'].str.split(',', expand=True)","df['column'].str.divide(',')","df.separate('column', by=',')","pd.concat('column', split=',')"],c:0,e:"expand=True פורס את התוצאות לעמודות חדשות במקום להשאיר רשימה בתא."},
  {n:70,s:"חלק ט׳ — טקסט ומחרוזות",t:"איך נחליף את כל הרווחים בקווים תחתונים בשמות העמודות?",o:["df.rename(spaces='_')","df.columns = df.columns.str.replace(' ', '_')","df.replace_column_names(' ', '_')","pd.clean_columns(df)"],c:1,e:"ניגשים ישירות למערך df.columns ומפעילים str.replace — מעדכן כל הכותרות בבת אחת."},
  {n:71,s:"חלק ט׳ — טקסט ומחרוזות",t:"איך נספור כמה תווים יש בכל תא בעמודת טקסט?",o:["df['column'].count_chars()","df['column'].length()","df['column'].str.len()","df['column'].size()"],c:2,e:"str.len מחשב את אורך המחרוזת בכל תא — שימושי לבדיקות תקינות."},
  {n:72,s:"חלק ט׳ — טקסט ומחרוזות",t:"איך נהפוך את כל הטקסט בעמודת 'city' לאותיות קטנות?",o:["df['city'].lower()","df['city'].str.lower()","df['city'].lowercase()","str.lower(df['city'])"],c:1,e:"חובה לעבור דרך מחלקת .str כדי לגשת לפעולות טקסט ברמת העמודה בפנדס."},
  {n:73,s:"חלק ט׳ — טקסט ומחרוזות",t:"df['column'].str.replace('A','B') מבצעת:",o:["מחליפה שם עמודה","מחליפה כל הופעה של 'A' ב-'B' בתוך טקסט","מחליפה שורות","מוחקת A"],c:1,e:"str.replace מחליפה כל הופעה של המחרוזת בתוך כל תא. שימו לב להבדל שמבלבל: ב-str.replace ברירת המחדל היא regex=False (החלפה מילולית), ואילו ב-str.contains ברירת המחדל היא regex=True. אם רוצים תבנית רגולרית בהחלפה יש לציין regex=True במפורש."},
  {n:74,s:"חלק י׳ — אינדקסים וסטטיסטיקה",t:"באיזו פקודה נמצא את תווית האינדקס של השורה שבה נמצא הערך המקסימלי?",o:["df['column'].max()","df['column'].argmax()","df['column'].idxmax()","df['column'].top_index()"],c:2,e:"max מחזיר את הערך עצמו, ואילו idxmax מחזיר את תווית האינדקס (label) של השורה שבה הערך יושב — נוח לשליפה מיידית עם df.loc. שימו לב להבדל מ-argmax, שמחזיר את המיקום המספרי (0,1,2...) ולא את התווית; כשהאינדקס הוא 0,1,2 רגיל שתיהן מחזירות אותו דבר, אבל אחרי סינון או set_index הן נבדלות."},
  {n:75,s:"חלק י׳ — אינדקסים וסטטיסטיקה",t:"מה מחזירה df.corr(numeric_only=True)?",o:["שגיאות כתיב","מטריצת מתאם (קורלציה) בין העמודות המספריות","מספר שורות נכונות","מוחקת עמודות עם קשר"],c:1,e:"corr מחזירה מטריצה של מקדמי מתאם פירסון בין כל זוג עמודות מספריות, בערכים שבין 1- ל-1 — כלי מרכזי לזיהוי משתנים שנעים יחד. חשוב: מפנדס 2.0 ואילך df.corr() בלי numeric_only=True מרימה ValueError אם יש בטבלה עמודת טקסט, ולכן על טבלה אמיתית כמעט תמיד נכתוב numeric_only=True. מתאם אינו סיבתיות."},
  {n:76,s:"חלק י׳ — אינדקסים וסטטיסטיקה",t:"איך נמצא את הערך השכיח ביותר בעמודה?",o:["df['column'].mean()","df['column'].median()","df['column'].mode()","df['column'].frequent()"],c:2,e:"mean = ממוצע, median = חציון, ו-mode = השכיח, כלומר הערך שמופיע הכי הרבה פעמים. שימו לב: mode מחזירה Series ולא מספר בודד, ואם כמה ערכים מופיעים באותה שכיחות מרבית — כולם יוחזרו. לקבלת ערך יחיד נהוג לכתוב df['column'].mode()[0]."},
  {n:77,s:"חלק י׳ — אינדקסים וסטטיסטיקה",t:"איזו פונקציה מחזירה את תווית האינדקס של השורה שבה נמצא הערך הקטן ביותר?",o:["df['column'].min()","df['column'].argmin()","df['column'].idxmin()","df['column'].lowest_index()"],c:2,e:"idxmin פועלת כמו idxmax אך על המינימום: היא מחזירה את תווית האינדקס (label) של השורה שבה נמצא הערך הקטן ביותר, ולא את הערך עצמו. שימו לב להבדל מ-argmin, שמחזירה את המיקום המספרי בשורות ולא את התווית."},
  {n:78,s:"חלק י׳ — אינדקסים וסטטיסטיקה",t:"מה מחשבת df['salary'].std()?",o:["שונות","סטיית תקן (Standard Deviation)","ממוצע","מספר תאים"],c:1,e:"std הוא Standard Deviation — מודד את פיזור הנתונים סביב הממוצע באותן יחידות של הנתונים עצמם. שימו לב: פנדס מחשב כברירת מחדל סטיית תקן של מדגם (ddof=1), בעוד numpy.std מחשב של אוכלוסייה (ddof=0) — ולכן אותם נתונים בדיוק יכולים לתת שני מספרים שונים בשתי הספריות."},
  {n:79,s:"חלק י׳ — אינדקסים וסטטיסטיקה",t:"ומה df['salary'].var()?",o:["שונות (Variance)","ערך ממוצע","חציון","סטיית תקן"],c:0,e:"var מייצגת Variance — סטיית התקן בריבוע. מדד נוסף לפיזור הנתונים."},
  {n:80,s:"חלק י׳ — אינדקסים וסטטיסטיקה",t:"מה ההבדל בין df.where(cond, other=0) ל-df.mask(cond, 0)?",o:["where למספרים, mask לטקסט","where שומר את הערכים שמקיימים את התנאי, mask מחליף אותם","where רק ב-SQL","פעולות זהות"],c:1,e:"פעולות משלימות — שתיהן עובדות עם תנאי בוליאני, אבל בכיוונים הפוכים."},
  {n:81,s:"חלק י\"א — לוגיקה והמרות חכמות",t:"איך נחתוך ערכים בעמודה כך שמתחת ל-0 יהיה 0 ומעל 100 יהיה 100?",o:["df['col'].limit(0,100)","df['col'].clip(lower=0, upper=100)","df['col'].cut(0,100)","df['col'].where(0,100)"],c:1,e:"clip קוטם ערכים קיצוניים (Outliers) לפי גבולות שהוגדרו."},
  {n:82,s:"חלק י\"א — לוגיקה והמרות חכמות",t:"איך נחלק עמודת גיל לשלושה דליים — עד 18, 18-35, ומעל 35 — בלי לאבד אף שורה?",o:["pd.cut(df['age'], bins=[0,18,35,100])","pd.cut(df['age'], bins=[-np.inf,18,35,np.inf], labels=['0-18','18-35','35+'])","df['age'].split_groups(3)","df['age'].astype('category')"],c:1,e:"pd.cut ממירה מספרים רציפים לקטגוריות לפי גבולות שאנו קובעים. שימו לב לשתי מלכודות: הדליים סגורים מימין ופתוחים משמאל (right=True), ולכן bins=[0,18,35,100] יסמן גיל 0 כ-NaN אלא אם נוסיף include_lowest=True; וכל ערך מחוץ לגבול העליון (למשל 120) גם הוא ייצא NaN. שימוש ב-np.inf בקצוות מבטיח שכל שורה תשויך לדלי, ו-labels נותן שמות קריאים במקום סימון (18.0, 35.0]."},
  {n:83,s:"חלק י\"א — לוגיקה והמרות חכמות",t:"מה היתרון של df.eval('profit = revenue - expenses')?",o:["מעגלת אוטומטית","מאפשרת חישובים ע״י מחרוזת ולרוב רצה מהר יותר על דאטה גדול","שולחת ל-SQL","מתעלמת מתאים ריקים"],c:1,e:"eval מאפשרת לכתוב חישוב כמחרוזת, כולל יצירת עמודה חדשה בתוך הביטוי. כשספריית NumExpr מותקנת ומדובר בטבלה גדולה מאוד, פנדס מנתב אליה את החישוב וחוסך יצירת מערכי ביניים — על טבלאות קטנות אין הבדל ביצועים, ואם NumExpr אינה מותקנת פנדס פשוט מחשב במנוע הרגיל. חשוב: eval מחזירה טבלה חדשה ואינה משנה את המקור, אלא אם מוסיפים inplace=True."},
  {n:84,s:"חלק י\"א — לוגיקה והמרות חכמות",t:"df.mask(df['age']<18, 0) מבצעת:",o:["מסתירה את הקטנים מ-18","מאפסת ל-0 את כל התאים בשורות שבהן הגיל קטן מ-18","מוחקת את עמודת הגיל","שומרת רק את הקטנים מ-18"],c:1,e:"mask מחליפה ערכים היכן שהתנאי מתקיים (ו-where עושה את ההפך). מלכודת חשובה: כשמפעילים mask על כל הטבלה עם תנאי שמבוסס על עמודה אחת, פנדס מרחיב את התנאי על כל השורה — ולכן גם עמודות אחרות (שם, עיר) יוחלפו ב-0. אם רוצים להשפיע רק על עמודת הגיל, יש לכתוב df['age'] = df['age'].mask(df['age']<18, 0)."},
  {n:85,s:"חלק י\"א — לוגיקה והמרות חכמות",t:"df['column'].map({'Yes':1, 'No':0}) משמשת ל:",o:["תרגום שפות","המרת קטגוריות לערכים מספריים, לרוב כהכנה למודלים","מחיקת Yes/No","הוספת עמודות חדשות"],c:1,e:"map עובדת עם מילון וממירה כל ערך לפי המיפוי — שימושי במיוחד להכנת נתונים למודלים. שימו לב: ערך שאינו מופיע במילון הופך ל-NaN בשקט, בלי שום שגיאה, ולכן כדאי לבדוק אחרי המיפוי עם isna().sum(). לשמירת הערכים שלא מופו אפשר להשתמש ב-replace במקום, או להוסיף .fillna() אחרי."},
  {n:86,s:"חלק י\"א — לוגיקה והמרות חכמות",t:"מה מטרת df['column'].apply(function)?",o:["שמירת קובץ","הפעלת פונקציה מותאמת אישית על כל תא","אישור שינויים","הגדרת תצוגה"],c:1,e:"apply נותן גמישות מלאה — אפשר ליישם כל לוגיקה שאין לה פקודה מובנית."},
  {n:87,s:"חלק י\"ב — סוגי נתונים",t:"להמרת עמודת טקסט עם מעט ערכים חוזרים (מגדר/סטטוס), איזה סוג חוסך הכי הרבה זיכרון?",o:["df['col'].astype(int)","df['col'].astype('category')","df['col'].astype(str)","df['col'].astype('object')"],c:1,e:"category מקודד טקסטים למספרים מאחורי הקלעים — חוסך זיכרון ומאיץ סינון/מיון."},
  {n:88,s:"חלק י\"ב — סוגי נתונים",t:"איך נשלוף את כל העמודות ששמן מכיל 'date'?",o:["df.select_columns('date')","df.get(contains='date')","df.filter(like='date')","df.columns.find('date')"],c:2,e:"filter עם like שולפת עמודות לפי תת-מחרוזת בשם — חוסך עבודה ידנית."},
  {n:89,s:"חלק י\"ב — סוגי נתונים",t:"איך נסיר את כל עמודות הטקסט ונשאיר רק מספרים/תאריכים?",o:["df.remove_text()","df.filter_types(keep='numbers')","df.select_dtypes(exclude=['object'])","df.drop_strings()"],c:2,e:"select_dtypes מסננת עמודות לפי סוג הנתונים שלהן, ו-exclude מסיר את הסוגים שצוינו. שימו לב לשינוי בפנדס 3.0: עמודות טקסט מקבלות כעת את ה-dtype החדש str ולא object כבעבר. exclude=['object'] עדיין עובד מטעמי תאימות לאחור, אך הכתיב המומלץ קדימה הוא exclude=['str'] — ושניהם מחזירים את אותה תוצאה."},
  {n:90,s:"חלק י\"ב — סוגי נתונים",t:"מה מטרת df['column'].astype(float)?",o:["להמיר למספרים עשרוניים","להמיר למספרים שלמים","לעגל מספרים","למחוק עשרוניים"],c:0,e:"astype משנה Data Type, ו-float = מספר עשרוני."},
  {n:91,s:"חלק י\"ב — סוגי נתונים",t:"איך נשנה סוגי נתונים של כמה עמודות במכה אחת?",o:["df.astype({'c1':'int','c2':'float'})","df.change_type(c1='int', c2='float')","df.convert_dtypes()","df.set_types({'c1':'int'})"],c:0,e:"astype גמישה — מקבלת מילון של עמודה → סוג נתונים."},
  {n:92,s:"חלק י\"ב — סוגי נתונים",t:"איך נשלוף רק את עמודות הטקסט (object)?",o:["df.select_dtypes(include=['str'])","df.get_text_columns()","df.filter(type='object')","df.loc[:,'object']"],c:0,e:"select_dtypes(include=[...]) מסננת עמודות לפי סוג. בפנדס 3.0 עמודות טקסט מקבלות את ה-dtype החדש str, ולכן include=['str'] הוא הכתיב הנכון. include=['object'] עדיין מחזיר אותן מטעמי תאימות לאחור, אך מפיק אזהרת הוצאה משימוש ויפסיק לעבוד בגרסה הבאה; לקוד שצריך לרוץ גם על פנדס 2 וגם על 3 אפשר לכתוב include=['object','str']."},
  {n:93,s:"חלק י\"ג — קריאה ושמירה",t:"לקובץ ענק שרוצים לחסוך בו זיכרון, מה הגישה הנכונה בטעינה?",o:["pd.read_csv(...).head(100)","pd.read_csv(..., usecols=['c1','c2'])","קריאת כל הקובץ ואז drop","טעינה בפורמט טקסט"],c:1,e:"usecols מבטיחה שעמודות מיותרות לא ייכנסו לזיכרון מלכתחילה."},
  {n:94,s:"חלק י\"ג — קריאה ושמירה",t:"איך נשמור לאקסל עם שם גיליון 'Data'?",o:["df.save_excel('f.xlsx', sheet='Data')","df.to_excel('f.xlsx', sheet_name='Data')","df.export_excel('f.xlsx', tab='Data')","pd.write_excel(df,'f.xlsx','Data')"],c:1,e:"to_excel + sheet_name = שליטה על שם הגיליון בתוך הקובץ."},
  {n:95,s:"חלק י\"ג — קריאה ושמירה",t:"איזו פקודה מייצאת את הטבלה לפורמט JSON, המתאים במיוחד להעברת נתונים ל-Web ול-API?",o:["df.to_csv('data.csv')","df.to_sql('data.sql')","df.to_json('data.json')","df.to_html('data.html')"],c:2,e:"to_json ממיר את הטבלה למחרוזת או לקובץ JSON — הפורמט הטבעי ל-JavaScript ולממשקי API. שני פרמטרים שחשוב להכיר: orient קובע את מבנה הפלט (ברירת המחדל 'columns', ולעיתים קרובות נעדיף orient='records' שמייצר רשימת אובייקטים, שורה לכל רשומה), ו-date_format='iso' מייצא תאריכים כמחרוזת קריאה במקום כמספר מילישניות — ברירת המחדל הישנה כבר מסומנת להוצאה משימוש בפנדס 3.0. לשם השוואה: to_sql דורש חיבור פעיל למסד נתונים (con) ולא רק שם קובץ."},
  {n:96,s:"חלק י\"ג — קריאה ושמירה",t:"איך נשנה שם של עמודה בודדת בפנדס?",o:["df.change_columns('old'='new')","df.columns['old']='new'","df.rename(columns={'old':'new'})","df.replace_name('old','new')"],c:2,e:"rename משתמשת במילון למיפוי מדויק בין השם הישן לחדש."},
  {n:97,s:"חלק י\"ג — קריאה ושמירה",t:"קראנו קובץ CSV ורוצים למחוק ממנו שורות ספציפיות לפי מספרן. באיזה פרמטר של drop נשתמש?",o:["df.drop(rows=[0,1])","df.drop(index=[0,1])","df.drop(columns=[0,1])","df.drop_rows([0,1])"],c:1,e:"drop משמשת גם למחיקת שורות וגם למחיקת עמודות, וההבדל הוא בשם הפרמטר: index למחיקת שורות לפי תווית, columns למחיקת עמודות לפי שם. אין פרמטר בשם rows ואין מתודה drop_rows. כמו רוב פעולות פנדס, drop מחזירה טבלה חדשה ואינה משנה את המקור אלא אם מוסיפים inplace=True."},

  {n:100,s:"חלק י\"ג — קריאה ושמירה",t:"מה קורה כשמשתמשים ב-df.rename(columns={'A':'B'}) בלי inplace=True?",o:["שם העמודה משתנה במקור","מוחזרת טבלה חדשה עם השם החדש, והטבלה המקורית נשארת ללא שינוי","שגיאה","קובץ ה-CSV משתנה"],c:1,e:"רוב פעולות פנדס מחזירות אובייקט חדש ואינן נוגעות במקור, ולכן חובה לשמור את התוצאה: df = df.rename(columns={'A':'B'}). שימו לב שמדובר בטבלה חדשה ולא ב'תצוגה' (view) — היא אינה חולקת נתונים עם המקור. החלופה inplace=True קיימת אך אינה מומלצת: היא אינה חוסכת זיכרון בפועל, ומונעת שרשור פקודות."},
];

const letters = ['א','ב','ג','ד'];
let answers = {};
let correct = 0;
let currentSection = null;

function updateScore(){
  const total = Object.keys(answers).length;
  const pct = total > 0 ? Math.round(correct/total*100) : 0;
  document.getElementById('scoreText').textContent = '✅ ' + correct + ' / ' + total;
  document.getElementById('scoreFill').style.width = (Math.round(correct/questions.length*100)) + '%';
  document.getElementById('progTxt').textContent = total + ' / ' + questions.length;
  document.getElementById('scoreDisplay').textContent = pct + '%';
  document.getElementById('heroAnswered').textContent = total;
  document.getElementById('heroCorrect').textContent = correct;
  document.getElementById('heroPct').textContent = pct + '%';
  if(total === questions.length) showFinish();
}

function selectOption(qIdx, optIdx){
  if(answers[qIdx] !== undefined) return;
  const q = questions[qIdx];
  const isCorrect = optIdx === q.c;
  answers[qIdx] = optIdx;
  if(isCorrect) correct++;
  const card = document.getElementById('qcard-'+qIdx);
  card.classList.add(isCorrect ? 'correct' : 'wrong');
  card.querySelectorAll('.option').forEach((o,i)=>{
    o.classList.add('disabled');
    if(i === q.c) o.classList.add('correct-ans');
    if(i === optIdx && !isCorrect) o.classList.add('wrong-ans');
  });
  const exp = document.getElementById('exp-'+qIdx);
  exp.querySelector('.exp-text').innerHTML = (isCorrect ? '✅ נכון! ' : '❌ טעית — התשובה הנכונה מסומנת בירוק. ') + q.e;
  exp.classList.add('show');
  updateScore();
}

function buildQuiz(){
  const mc = document.getElementById('mainContent');
  mc.innerHTML = '';
  currentSection = null;
  questions.forEach((q,i)=>{
    if(q.s !== currentSection){
      currentSection = q.s;
      mc.innerHTML += `<div class="sec-label">${q.s}</div>`;
    }
    const opts = q.o.map((o,oi)=>`
      <div class="option" onclick="selectOption(${i},${oi})">
        <div class="opt-letter">${letters[oi]}</div>
        <div class="opt-text">${o}</div>
      </div>`).join('');
    mc.innerHTML += `
    <div class="q-card" id="qcard-${i}">
      <div class="q-header">
        <div class="q-meta">
          <div class="q-num">שאלה ${q.n}</div>
          <div class="q-section-tag">${q.s.split('—')[1]?.trim()||q.s}</div>
        </div>
        <div class="q-text">${q.t}</div>
      </div>
      <div class="options">${opts}</div>
      <div class="explanation" id="exp-${i}">
        <div class="exp-label">💡 הסבר</div>
        <div class="exp-text"></div>
      </div>
    </div>`;
  });
  mc.innerHTML += `
  <div class="finish-card" id="finishCard">
    <div class="finish-emoji">🎉</div>
    <div class="finish-title">סיימת את הקוויז הבינוני!</div>
    <div class="finish-score" id="finishScore">0/80</div>
    <div class="finish-grade" id="finishGrade"></div>
    <div class="finish-sub" id="finishSub"></div>
    <br>
    <button class="retry-btn" onclick="resetQuiz()">🔄 נסה שוב</button>
    <a href="quiz.html" class="level-link">🧠 מוכן לרמה המתקדמת? ←</a>
  </div>`;
}

function showFinish(){
  const card = document.getElementById('finishCard');
  if(window.fbAutoSave && window.currentUser) window.fbAutoSave(correct, questions.length);
  const pct = Math.round(correct/questions.length*100);
  document.getElementById('finishScore').textContent = correct + ' / ' + questions.length;
  let grade, sub;
  if(pct>=90){grade='⭐ מצוין!';sub='שליטה מרשימה ברמה הבינונית!';}
  else if(pct>=75){grade='👍 טוב מאוד';sub='עוד קצת תרגול ותגיע לשלמות!';}
  else if(pct>=60){grade='📚 טוב';sub='כדאי לחזור על החומר החלש.';}
  else{grade='💪 המשך להתאמן';sub='חזור על הפרקים ונסה שוב!';}
  document.getElementById('finishGrade').textContent = grade;
  document.getElementById('finishSub').textContent = sub;
  card.classList.add('show');
  card.scrollIntoView({behavior:'smooth',block:'center'});
}

function resetQuiz(){
  answers = {}; correct = 0;
  document.getElementById('finishCard').classList.remove('show');
  updateScore();
  buildQuiz();
  window.scrollTo({top:0,behavior:'smooth'});
}

buildQuiz();
updateScore();
</script>

<!-- Firebase SDK -->
<script>
function fbLogin(){if(window._fbLogin)window._fbLogin();else{var b=document.getElementById('fb-login-btn');if(b)b.setAttribute('data-pending','1');}}
function fbLogout(){if(window._fbLogout)window._fbLogout();}
function fbToggleHistory(){if(window._fbToggleHistory)window._fbToggleHistory();}
function triggerSave(){if(window._triggerSave)window._triggerSave();}
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyA04LDMDGohAs1uRnUVwWVTs5coVMrEO64",
  authDomain: "sql-course-507b5.firebaseapp.com",
  projectId: "sql-course-507b5",
  storageBucket: "sql-course-507b5.firebasestorage.app",
  messagingSenderId: "999664091380",
  appId: "1:999664091380:web:349959985ae11ce8c51ea1"
});

const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
let currentUser = null;
window.currentUser = null;
const QUIZ_ID = 'pandas';

onAuthStateChanged(auth, async (user) => {
  currentUser = user; window.currentUser = user;
  const loginBtn = document.getElementById('fb-login-btn');
  const logoutBtn = document.getElementById('fb-logout-btn');
  const userInfo = document.getElementById('fb-user-info');
  const histBtn = document.getElementById('fb-history-btn');
  const saveBtn = document.getElementById('fb-save-btn');
  if(user){
    document.getElementById('fb-user-name').textContent = user.displayName;
    document.getElementById('fb-user-photo').src = user.photoURL;
    document.getElementById('fb-user-photo').style.display = 'block';
    loginBtn.style.display='none'; logoutBtn.style.display='flex';
    userInfo.style.display='flex'; histBtn.style.display='flex'; saveBtn.style.display='flex';
    await loadProgress(); await loadHistory();
  } else {
    loginBtn.style.display='flex'; logoutBtn.style.display='none';
    userInfo.style.display='none'; histBtn.style.display='none'; saveBtn.style.display='none';
  }
});

window.fbLogin = async () => { try { await signInWithPopup(auth, provider); } catch(e){console.error(e);} };
window.fbLogout = async () => { await signOut(auth); };
window.fbToggleHistory = () => {
  const w = document.getElementById('fb-history-wrap');
  w.style.display = w.style.display==='none' ? 'block' : 'none';
};
window.triggerSave = async () => {
  if(!currentUser){ window.fbLogin(); return; }
  const scoreEl = document.getElementById('scoreText');
  const txt = scoreEl ? scoreEl.textContent.replace('✅ ','') : '0 / 0';
  const parts = txt.split('/');
  const sc = parseInt(parts[0])||0; const tot = parseInt(parts[1])||0;
  if(tot===0){ showToast('⚠️ ענה על לפחות שאלה אחת קודם!'); return; }
  await saveProgress(sc, tot);
};

async function saveProgress(score, total){
  if(!currentUser) return;
  const pct = Math.round(score/total*100);
  await setDoc(doc(db,'users',currentUser.uid,'quizzes',QUIZ_ID),{score,total,pct,lastUpdate:new Date().toISOString()},{merge:true});
  await addDoc(collection(db,'users',currentUser.uid,'history'),{quizId:QUIZ_ID,score,total,pct,date:new Date().toISOString()});
  showToast('✅ ההתקדמות נשמרה בענן!');
  await loadHistory();
}
window.fbAutoSave = saveProgress;

async function loadProgress(){
  if(!currentUser) return;
  const snap = await getDoc(doc(db,'users',currentUser.uid,'quizzes',QUIZ_ID));
  if(snap.exists()){
    const d = snap.data();
    const el = document.getElementById('fb-saved-score');
    el.textContent = `ניסיון אחרון: ${d.score}/${d.total} (${d.pct}%)`;
    el.style.display = 'block';
  }
}

async function loadHistory(){
  if(!currentUser) return;
  const q = query(collection(db,'users',currentUser.uid,'history'),orderBy('date','desc'),limit(10));
  const snap = await getDocs(q);
  const hist = [];
  snap.forEach(d=>hist.push(d.data()));
  renderChart(hist.filter(h=>h.quizId===QUIZ_ID));
}

function renderChart(history){
  const panel = document.getElementById('fb-history-panel');
  if(!history.length){ panel.innerHTML='<p style="color:var(--text2);font-size:13px;text-align:center;padding:1rem">עדיין אין היסטוריה — ענה על שאלות ושמור!</p>'; return; }
  const rev = [...history].reverse();
  const best = Math.max(...history.map(h=>h.pct));
  const avg = Math.round(history.reduce((a,h)=>a+h.pct,0)/history.length);
  const bars = rev.map(h=>{
    const d = new Date(h.date);
    const lbl = `${d.getDate()}/${d.getMonth()+1}`;
    const color = h.pct>=80?'var(--aq)':h.pct>=50?'#FFB020':'#FF4060';
    return `<div class="hbar-wrap"><div class="hbar-val">${h.pct}%</div><div class="hbar" style="height:${Math.max(h.pct*1.1,8)}px;background:${color}"></div><div class="hbar-lbl">${lbl}</div></div>`;
  }).join('');
  panel.innerHTML = `<div class="hstats-row"><div class="hstat-mini"><div class="hstat-n" style="color:var(--aq)">${best}%</div><div class="hstat-l">שיא אישי</div></div><div class="hstat-mini"><div class="hstat-n" style="color:#FFB020">${avg}%</div><div class="hstat-l">ממוצע</div></div><div class="hstat-mini"><div class="hstat-n" style="color:var(--text2)">${history.length}</div><div class="hstat-l">ניסיונות</div></div></div><div class="hchart">${bars}</div>`;
}

function showToast(msg){
  let t=document.getElementById('fb-toast');
  if(!t){t=document.createElement('div');t.id='fb-toast';document.body.appendChild(t);}
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
