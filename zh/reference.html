 INT) <span class="kw">RETURNS TABLE AS RETURN</span> (<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Orders</span> <span class="kw">WHERE</span> CustID=@ID)</pre><p>一个返回表的函数。你可以像对普通表一样对它做 JOIN。非常快。</p></article><article><h3>Multi-Statement TVF</h3><pre dir="ltr"><span class="kw">CREATE FUNCTION</span> GetData() <span class="kw">RETURNS</span> @t <span class="kw">TABLE</span>(...) <span class="kw">AS BEGIN INSERT INTO</span> @t ... <span class="kw">RETURN END</span></pre><p>一个带复杂逻辑、返回表的函数。比内联式更灵活但更慢。</p></article><article><h3>EXEC with variables</h3><pre dir="ltr"><span class="kw">EXEC</span> (@SQL)</pre><p>从字符串运行动态 SQL。用于在运行时构建灵活的查询。</p></article><article><h3>sp_executesql</h3><pre dir="ltr"><span class="kw">EXEC</span> sp_executesql @SQL, <span class="str">'@ID INT'</span>, @ID=<span class="num">5</span></pre><p>带参数的动态 SQL。比普通的 EXEC 更安全——防止 SQL 注入。</p></article><article><h3>sys.procedures</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> sys.procedures</pre><p>数据库中所有过程的列表。用于文档记录和审查现有代码。</p></article></section><section><h2>触发器</h2><article><h3>CREATE TRIGGER (AFTER INSERT)</h3><pre dir="ltr"><span class="kw">CREATE TRIGGER</span> trg_ins <span class="kw">ON</span> <span class="tbl">Orders</span> <span class="kw">AFTER INSERT AS</span> ...</pre><p>一个在 INSERT 之后自动运行的触发器。用于自动事件——发送邮件、更新日志。</p></article><article><h3>CREATE TRIGGER (INSTEAD OF)</h3><pre dir="ltr"><span class="kw">CREATE TRIGGER</span> trg_v <span class="kw">ON</span> MyView <span class="kw">INSTEAD OF INSERT AS</span> ...</pre><p>替换另一个操作。用于允许在原本不直接支持的视图上做 INSERT。</p></article><article><h3>INSERTED / DELETED tables</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> INSERTED; <span class="kw">SELECT</span> * <span class="kw">FROM</span> DELETED</pre><p>触发器内部保存被插入/删除数据的虚拟表。用于保存旧值。</p></article><article><h3>DISABLE TRIGGER</h3><pre dir="ltr"><span class="kw">DISABLE TRIGGER</span> trg_ins <span class="kw">ON</span> <span class="tbl">Orders</span></pre><p>临时禁用一个触发器。用于批量数据导入而不触发自动逻辑。</p></article><article><h3>DDL TRIGGER</h3><pre dir="ltr"><span class="kw">CREATE TRIGGER</span> trg_ddl <span class="kw">ON DATABASE FOR</span> DROP_TABLE <span class="kw">AS</span> ...</pre><p>针对 DROP TABLE 等 DDL 操作的触发器。用于防止生产环境中的意外删除。</p></article></section><section><h2>分区 —— 拆分表</h2><article><h3>CREATE PARTITION FUNCTION</h3><pre dir="ltr"><span class="kw">CREATE PARTITION FUNCTION</span> pf_year(INT) <span class="kw">AS RANGE RIGHT FOR VALUES</span>(<span class="num">2021</span>,<span class="num">2022</span>,<span class="num">2023</span>)</pre><p>为分区定义范围。用于按年/月把一张巨型表拆分成多个部分。</p></article><article><h3>CREATE PARTITION SCHEME</h3><pre dir="ltr"><span class="kw">CREATE PARTITION SCHEME</span> ps_year <span class="kw">AS PARTITION</span> pf_year <span class="kw">ALL TO</span> ([PRIMARY])</pre><p>给每个分区分配文件组。创建分区表的第二步。</p></article><article><h3>CREATE TABLE ON Partition</h3><pre dir="ltr"><span class="kw">CREATE TABLE</span> <span class="tbl">Sales</span>(Date INT) <span class="kw">ON</span> ps_year(Date)</pre><p>创建一张分区表。SQL 会根据行的值自动管理它存储在哪里。</p></article><article><h3>Partition Elimination</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Sales</span> <span class="kw">WHERE</span> Year=<span class="num">2023</span></pre><p>SQL 只读取相关的分区，跳过其余的。在巨型表上快 10 倍以上。</p></article><article><h3>ALTER TABLE SWITCH PARTITION</h3><pre dir="ltr"><span class="kw">ALTER TABLE</span> <span class="tbl">Sales</span> <span class="kw">SWITCH PARTITION</span> <span class="num">1</span> <span class="kw">TO</span> <span class="tbl">SalesArchive</span></pre><p>以 O(1) 在表之间移动整个分区。用于即时归档旧数据。</p></article></section><section><h2>时态表 —— 带历史记录的表</h2><article><h3>CREATE SYSTEM-VERSIONED TABLE</h3><pre dir="ltr"><span class="kw">CREATE TABLE</span> <span class="tbl">Products</span>(ID INT, Price DECIMAL, ValidFrom DATETIME2 <span class="kw">GENERATED ALWAYS AS ROW START</span>, ValidTo DATETIME2 <span class="kw">GENERATED ALWAYS AS ROW END</span>, <span class="kw">PERIOD FOR SYSTEM_TIME</span>(ValidFrom,ValidTo)) <span class="kw">WITH</span> (SYSTEM_VERSIONING=ON)</pre><p>一张自动管理历史的表。SQL 会自动保留每一个旧版本。</p></article><article><h3>FOR SYSTEM_TIME AS OF</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Products</span> <span class="kw">FOR SYSTEM_TIME AS OF</span> <span class="str">'2023-01-01'</span></pre><p>返回数据在某个给定日期时的样子。“时间旅行”——看到数据库过去的样子。</p></article><article><h3>FOR SYSTEM_TIME BETWEEN</h3><pre dir="ltr"><span class="kw">FOR SYSTEM_TIME BETWEEN</span> <span class="str">'2022-01-01'</span> <span class="kw">AND</span> <span class="str">'2023-01-01'</span></pre><p>某个日期范围内的所有更改。用于审计和跟踪数据随时间的变化。</p></article><article><h3>FOR SYSTEM_TIME ALL</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Products</span> <span class="kw">FOR SYSTEM_TIME ALL</span></pre><p>每一行有史以来的每一个版本。用于显示完整的变更时间线。</p></article><article><h3>ALTER TABLE OFF System Versioning</h3><pre dir="ltr"><span class="kw">ALTER TABLE</span> <span class="tbl">Products</span> <span class="kw">SET</span> (SYSTEM_VERSIONING=OFF)</pre><p>关闭历史管理。用于清理历史数据和结构性更改。</p></article></section><section><h2>图数据库与层级结构</h2><article><h3>CREATE NODE TABLE</h3><pre dir="ltr"><span class="kw">CREATE TABLE</span> <span class="tbl">Person</span>(ID INT) <span class="kw">AS NODE</span></pre><p>一张节点表（SQL Graph）。用于表示社交网络、图和依赖关系。</p></article><article><h3>CREATE EDGE TABLE</h3><pre dir="ltr"><span class="kw">CREATE TABLE</span> <span class="tbl">Knows</span> <span class="kw">AS EDGE</span></pre><p>图中的一张边表。连接两个节点——Person KNOWS Person。</p></article><article><h3>MATCH (Graph Query)</h3><pre dir="ltr"><span class="kw">SELECT</span> p1.Name, p2.Name <span class="kw">FROM</span> <span class="tbl">Person</span> p1, <span class="tbl">Knows</span>, <span class="tbl">Person</span> p2 <span class="kw">WHERE MATCH</span>(p1-(<span class="tbl">Knows</span>)->p2)</pre><p>一个图查询——谁认识谁。用于分析社交网络和依赖图。</p></article><article><h3>Recursive CTE - Tree</h3><pre dir="ltr"><span class="kw">WITH RECURSIVE</span> tree <span class="kw">AS</span>(<span class="kw">SELECT</span> ID, ParentID, <span class="num">0</span> lvl <span class="kw">FROM</span> <span class="tbl">Cats</span> <span class="kw">WHERE</span> ParentID <span class="kw">IS NULL UNION ALL SELECT</span> c.ID, c.ParentID, t.lvl+<span class="num">1</span> <span class="kw">FROM</span> <span class="tbl">Cats</span> c <span class="kw">JOIN</span> tree t <span class="kw">ON</span> c.ParentID=t.ID)</pre><p>一棵递归的层级树。用于嵌套类别、组织架构图和产品 BOM 树。</p></article><article><h3>PATH with CTE</h3><pre dir="ltr"><span class="str">''</span> <span class="kw">AS</span> path ... t.path+<span class="str">'/'</span>+c.Name</pre><p>在树中构建完整路径（Root/Branch/Leaf）。用于显示面包屑和分析树的深度。</p></article></section><section><h2>地理与位置（空间）</h2><article><h3>geometry/geography types</h3><pre dir="ltr"><span class="col">Location</span> geography</pre><p>用于 GPS 点、线和多边形的特殊数据类型。用于地图和距离。</p></article><article><h3>STDistance()</h3><pre dir="ltr"><span class="col">Loc1</span>.<span class="fn">STDistance</span>(<span class="col">Loc2</span>)</pre><p>两个地理点之间的距离，以米为单位。用于派出最近的配送。</p></article><article><h3>STContains()</h3><pre dir="ltr"><span class="col">Zone</span>.<span class="fn">STContains</span>(<span class="col">Point</span>)</pre><p>检查某个点是否在某个区域内。用于“客户是否在配送区域内？”的问题。</p></article><article><h3>STIntersects()</h3><pre dir="ltr"><span class="col">Area1</span>.<span class="fn">STIntersects</span>(<span class="col">Area2</span>)</pre><p>两个区域是否相交。用于检测服务区之间的重叠。</p></article><article><h3>geography::Point()</h3><pre dir="ltr">geography::<span class="fn">Point</span>(<span class="num">31.77</span>, <span class="num">35.21</span>, <span class="num">4326</span>)</pre><p>创建一个 GPS 点（纬度、经度）。用于存储客户和门店的位置。</p></article></section><section><h2>行级安全与动态脱敏</h2><article><h3>CREATE SECURITY POLICY</h3><pre dir="ltr"><span class="kw">CREATE SECURITY POLICY</span> SalesFilter <span class="kw">ADD FILTER PREDICATE</span> dbo.fn_filter(<span class="col">SalesRep</span>) <span class="kw">ON</span> <span class="tbl">Orders</span></pre><p>行级安全——每位员工只看到自己的行。自动且对应用透明。</p></article><article><h3>CREATE FUNCTION (RLS Predicate)</h3><pre dir="ltr"><span class="kw">CREATE FUNCTION</span> fn_filter(@User nvarchar(<span class="num">50</span>)) <span class="kw">RETURNS TABLE AS RETURN SELECT</span> <span class="num">1</span> r <span class="kw">WHERE</span> @User=<span class="fn">USER_NAME</span>()</pre><p>RLS 的筛选函数。对每一行返回 1（允许）或 0（阻止）。</p></article><article><h3>Dynamic Data Masking</h3><pre dir="ltr"><span class="col">Email</span> VARCHAR(<span class="num">100</span>) <span class="kw">MASKED WITH</span> (FUNCTION=<span class="str">'email()'</span>)</pre><p>自动对敏感数据脱敏：a***@***.com。分析师看到掩码，DBA 看到全部。</p></article><article><h3>ADD MASK</h3><pre dir="ltr"><span class="kw">ALTER TABLE</span> <span class="tbl">Customers</span> <span class="kw">ALTER COLUMN</span> Phone <span class="kw">ADD MASKED WITH</span> (FUNCTION=<span class="str">'partial(0,"XXX-XXX-",4)'</span>)</pre><p>给一个现有列添加掩码。XXX-XXX-1234——只显示后 4 位。</p></article><article><h3>GRANT UNMASK</h3><pre dir="ltr"><span class="kw">GRANT UNMASK TO</span> AdminUser</pre><p>让某个特定用户看到真实数据。用于“按需知情”策略。</p></article></section><section><h2>Always Encrypted 与透明数据加密</h2><article><h3>Always Encrypted</h3><pre dir="ltr"><span class="col">SSN</span> <span class="kw">ENCRYPTED WITH</span> (COLUMN_ENCRYPTION_KEY=CEK, ENCRYPTION_TYPE=Deterministic)</pre><p>列级加密。即使是 DBA 也看不到数据——只有应用可以。</p></article><article><h3>Transparent Data Encryption</h3><pre dir="ltr"><span class="kw">ALTER DATABASE</span> MyDB <span class="kw">SET ENCRYPTION ON</span></pre><p>加密磁盘上所有的数据库文件。防范文件被人从服务器物理盗取。</p></article><article><h3>BACKUP ENCRYPTION</h3><pre dir="ltr"><span class="kw">BACKUP DATABASE</span> MyDB <span class="kw">TO DISK</span>=<span class="str">'backup.bak'</span> <span class="kw">WITH ENCRYPTION</span></pre><p>加密备份文件。没有密钥，备份对攻击者毫无价值。</p></article><article><h3>OPEN SYMMETRIC KEY</h3><pre dir="ltr"><span class="kw">OPEN SYMMETRIC KEY</span> MyKey <span class="kw">DECRYPTION BY PASSWORD</span>=<span class="str">'pass'</span></pre><p>打开一个加密密钥以供使用。在手动加密/解密数据之前。</p></article><article><h3>ENCRYPTBYKEY / DECRYPTBYKEY</h3><pre dir="ltr"><span class="fn">ENCRYPTBYKEY</span>(<span class="fn">KEY_GUID</span>(<span class="str">'MyKey'</span>), CreditCard)</pre><p>对一个字段进行手动加密和解密。用于按需恢复的加密存储。</p></article></section><section><h2>高可用性与复制</h2><article><h3>ALTER DATABASE SET RECOVERY FULL</h3><pre dir="ltr"><span class="kw">ALTER DATABASE</span> MyDB <span class="kw">SET RECOVERY FULL</span></pre><p>完整恢复模式——保留整个操作日志。对高 SLA 的生产环境是必备。</p></article><article><h3>BACKUP LOG</h3><pre dir="ltr"><span class="kw">BACKUP LOG</span> MyDB <span class="kw">TO DISK</span>=<span class="str">'log.bak'</span></pre><p>一份事务日志备份。支持恢复到精确的时间点——时间点恢复（Point-in-Time Recovery）。</p></article><article><h3>RESTORE DATABASE WITH STANDBY</h3><pre dir="ltr"><span class="kw">RESTORE DATABASE</span> MyDB <span class="kw">WITH STANDBY</span>=<span class="str">'undo.bak'</span></pre><p>以只读模式恢复，并可选择继续。用于可供读取的备份服务器。</p></article><article><h3>RESTORE WITH NORECOVERY</h3><pre dir="ltr"><span class="kw">RESTORE DATABASE</span> MyDB <span class="kw">WITH NORECOVERY</span></pre><p>一种允许继续应用后续备份的恢复。用于来自多份备份的恢复链。</p></article><article><h3>sys.dm_exec_requests</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> sys.dm_exec_requests</pre><p>服务器上当前正在运行的所有查询。用于查找卡住的查询和阻塞。</p></article></section><section><h2>DMV —— 动态管理视图</h2><article><h3>sys.dm_exec_query_stats</h3><pre dir="ltr"><span class="kw">SELECT TOP</span> <span class="num">10</span> * <span class="kw">FROM</span> sys.dm_exec_query_stats <span class="kw">ORDER BY</span> total_elapsed_time <span class="kw">DESC</span></pre><p>自服务器启动以来最慢的查询。用于查找性能问题。</p></article><article><h3>sys.dm_index_usage_stats</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> sys.dm_db_index_usage_stats <span class="kw">WHERE</span> user_seeks=<span class="num">0</span></pre><p>未使用的索引。删除的候选——它们节省空间并加速写入。</p></article><article><h3>sys.dm_missing_index_details</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> sys.dm_db_missing_index_details</pre><p>服务器推荐的缺失索引。用于快速提升性能。</p></article><article><h3>sys.dm_exec_connections</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> sys.dm_exec_connections</pre><p>到服务器的所有活动连接。用于监控负载和查找卡住的连接。</p></article><article><h3>sys.dm_os_wait_stats</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> sys.dm_os_wait_stats <span class="kw">ORDER BY</span> wait_time_ms <span class="kw">DESC</span></pre><p>服务器上最长的等待类型。用于查找瓶颈（CPU、I/O、锁）。</p></article></section><section><h2>云 SQL 与现代特性</h2><article><h3>EXTERNAL DATA SOURCE</h3><pre dir="ltr"><span class="kw">CREATE EXTERNAL DATA SOURCE</span> BlobStorage <span class="kw">WITH</span> (TYPE=BLOB_STORAGE, LOCATION=<span class="str">'https://...'</span>)</pre><p>定义一个外部数据源（Azure Blob、S3）。用于在 SQL 中直接读取云端文件。</p></article><article><h3>OPENROWSET (Blob)</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM OPENROWSET</span>(BULK <span class="str">'data.csv'</span>, DATA_SOURCE=<span class="str">'BlobStorage'</span>, FORMAT=<span class="str">'CSV'</span>) t</pre><p>直接从云端读取 CSV/Parquet。在 Azure Synapse 和 SQL Server 2019+ 中。</p></article><article><h3>PolyBase</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> ExternalTable</pre><p>像查询常规 SQL 表一样查询 Hadoop、Azure 和 S3。用于大数据分析。</p></article><article><h3>OPENDATASOURCE</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM OPENDATASOURCE</span>(<span class="str">'SQLNCLI'</span>, <span class="str">'server=OtherServer;uid=sa;pwd=p'</span>).DB.dbo.Table</pre><p>无需链接服务器即可一次性访问另一台 SQL 服务器。用于罕见的跨服务器查询。</p></article><article><h3>LINKED SERVER</h3><pre dir="ltr"><span class="kw">EXEC</span> sp_addlinkedserver @server=<span class="str">'OtherServer'</span></pre><p>到外部服务器的永久连接。用于跨服务器和不同数据库的常规查询。</p></article></section><section><h2>架构（Schema）、元数据与对象管理</h2><article><h3>CREATE SCHEMA</h3><pre dir="ltr"><span class="kw">CREATE SCHEMA</span> Sales</pre><p>为对象创建一个命名空间。Sales.Orders vs HR.Employees——组织与权限管理。</p></article><article><h3>INFORMATION_SCHEMA</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> INFORMATION_SCHEMA.TABLES</pre><p>关于所有表、列和关系的信息。ANSI 标准——适用于所有 SQL 引擎。</p></article><article><h3>sys.columns</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> sys.columns <span class="kw">WHERE</span> object_id=<span class="fn">OBJECT_ID</span>(<span class="str">'Orders'</span>)</pre><p>一张表的所有列及其数据类型。用于文档记录和构建动态 SQL。</p></article><article><h3>sys.foreign_keys</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> sys.foreign_keys</pre><p>数据库中所有的外键。用于记录关系和自动生成 ERD 图。</p></article><article><h3>sp_help</h3><pre dir="ltr"><span class="kw">EXEC</span> sp_help <span class="str">'Orders'</span></pre><p>关于一张表的完整信息——列、索引、键。这张表的“身份证”。</p></article></section></div>
