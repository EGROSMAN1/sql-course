const D=[
 {id:'s1',t:'DML —— 检索、插入与更新数据',cc:'var(--teal)',f:[
  {n:1,nm:'SELECT',s:'<span class="kw">SELECT</span> <span class="col">FirstName</span>, <span class="col">LastName</span> <span class="kw">FROM</span> <span class="tbl">Employees</span>',d:'SQL 中最核心的数据检索命令。指定具体的列能节省服务器资源，并只返回你需要的精确数据。'},
  {n:2,nm:'FROM',s:'<span class="kw">SELECT</span> <span class="col">City</span> <span class="kw">FROM</span> <span class="tbl">Customers</span>',d:'把 SQL 引擎指向数据源——要搜索哪张表、视图或哪一组表。没有它，查询就没有方向。'},
  {n:3,nm:'INSERT INTO',s:'<span class="kw">INSERT INTO</span> <span class="tbl">Customers</span> (<span class="col">Name</span>, <span class="col">City</span>) <span class="kw">VALUES</span> (<span class="str">\'Dan\'</span>, <span class="str">\'Haifa\'</span>)',d:'用于向表中插入新行。重要：列的顺序必须与 VALUES 中值的顺序完全对应。'},
  {n:4,nm:'UPDATE',s:'<span class="kw">UPDATE</span> <span class="tbl">Products</span> <span class="kw">SET</span> <span class="col">Price</span> = <span class="num">150</span> <span class="kw">WHERE</span> <span class="col">ID</span> = <span class="num">1</span>',d:'用于编辑现有数据。关键：务必使用 WHERE——否则你会覆盖表中的每一行！'},
  {n:5,nm:'DELETE',s:'<span class="kw">DELETE FROM</span> <span class="tbl">Orders</span> <span class="kw">WHERE</span> <span class="col">Status</span> = <span class="str">\'Canceled\'</span>',d:'永久删除行。如果忘记 WHERE，有大规模删除的风险。'},
  {n:6,nm:'DISTINCT',s:'<span class="kw">SELECT DISTINCT</span> <span class="col">City</span> <span class="kw">FROM</span> <span class="tbl">Customers</span>',d:'清除重复，只返回唯一值的列表。'},
  {n:7,nm:'SELECT INTO',s:'<span class="kw">SELECT</span> * <span class="kw">INTO</span> <span class="tbl">BackupTable</span> <span class="kw">FROM</span> <span class="tbl">OriginalTable</span>',d:'创建一张新表并同时把数据复制进去。适合快速备份和临时工作。'},
  {n:8,nm:'INSERT INTO SELECT',s:'<span class="kw">INSERT INTO</span> <span class="tbl">Archive</span> <span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Orders</span> <span class="kw">WHERE</span> <span class="col">Year</span> = <span class="num">2020</span>',d:'从一张表读取并推入一张已有的表。适合归档和数据迁移流程。'},
  {n:9,nm:'MERGE',s:'<span class="kw">MERGE</span> <span class="tbl">Target</span> t <span class="kw">USING</span> <span class="tbl">Source</span> s <span class="kw">ON</span> t.ID = s.ID <span class="kw">WHEN MATCHED THEN UPDATE</span>...',d:'“Upsert”——找到匹配：更新它；没找到：插入它。省去复杂的逻辑。'},
  {n:10,nm:'AS (Alias)',s:'<span class="kw">SELECT</span> <span class="col">FirstName</span> <span class="kw">AS</span> Name <span class="kw">FROM</span> <span class="tbl">Employees</span> e',d:'列或表的临时名称。让标题更清晰，并在 JOIN 中缩短冗长的名称。'},
 ]},
 {id:'s2',t:'筛选与逻辑运算符',cc:'var(--yellow)',f:[
  {n:11,nm:'WHERE',s:'<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Products</span> <span class="kw">WHERE</span> <span class="col">Price</span> &gt; <span class="num">100</span>',d:'主要的筛选引擎。它检查每一行，只放行条件为真的记录。'},
  {n:12,nm:'AND',s:'<span class="kw">WHERE</span> <span class="col">Category</span> = <span class="str">\'Toys\'</span> <span class="kw">AND</span> <span class="col">Price</span> &lt; <span class="num">50</span>',d:'要求所有条件同时成立。只有全部满足的行才会显示。'},
  {n:13,nm:'OR',s:'<span class="kw">WHERE</span> <span class="col">City</span> = <span class="str">\'Haifa\'</span> <span class="kw">OR</span> <span class="col">City</span> = <span class="str">\'Eilat\'</span>',d:'只要其中一个条件成立即可。与 AND 组合时务必使用括号。'},
  {n:14,nm:'NOT',s:'<span class="kw">WHERE NOT</span> <span class="col">Category</span> = <span class="str">\'Food\'</span>',d:'对条件取反。当定义“你不想要什么”更容易时很有用。'},
  {n:15,nm:'IN',s:'<span class="kw">WHERE</span> <span class="col">Department</span> <span class="kw">IN</span> (<span class="str">\'HR\'</span>, <span class="str">\'Sales\'</span>, <span class="str">\'IT\'</span>)',d:'一连串 OR 的简洁替代。接受一组值，检查值是否匹配其中之一。'},
  {n:16,nm:'NOT IN',s:'<span class="kw">WHERE</span> <span class="col">Country</span> <span class="kw">NOT IN</span> (<span class="str">\'USA\'</span>, <span class="str">\'UK\'</span>)',d:'确保值不在列表中。用于过滤掉并排除一组 ID。'},
  {n:17,nm:'BETWEEN',s:'<span class="kw">WHERE</span> <span class="col">OrderDate</span> <span class="kw">BETWEEN</span> <span class="str">\'2023-01-01\'</span> <span class="kw">AND</span> <span class="str">\'2023-12-31\'</span>',d:'一个连续的筛选范围，包含边界值。常用于日期和价格范围。'},
  {n:18,nm:'NOT BETWEEN',s:'<span class="kw">WHERE</span> <span class="col">Age</span> <span class="kw">NOT BETWEEN</span> <span class="num">20</span> <span class="kw">AND</span> <span class="num">30</span>',d:'检索范围之外的数据。用于查找统计上的离群值。'},
  {n:19,nm:'LIKE',s:'<span class="kw">WHERE</span> <span class="col">Email</span> <span class="kw">LIKE</span> <span class="str">\'%@gmail.com\'</span>',d:'灵活的字符串搜索。% = 任意字符序列。_ = 单个字符。'},
  {n:20,nm:'NOT LIKE',s:'<span class="kw">WHERE</span> <span class="col">Address</span> <span class="kw">NOT LIKE</span> <span class="str">\'%PO Box%\'</span>',d:'过滤掉包含某种模式的记录。用于数据清理。'},
  {n:21,nm:'IS NULL',s:'<span class="kw">WHERE</span> <span class="col">DeliveryDate</span> <span class="kw">IS NULL</span>',d:'NULL = “数据不存在”。你不能用 = 来比较它。IS NULL 能找到空单元格。'},
  {n:22,nm:'IS NOT NULL',s:'<span class="kw">WHERE</span> <span class="col">PhoneNumber</span> <span class="kw">IS NOT NULL</span>',d:'查找包含某些内容的行。用于清理报表和分析完整的数据。'},
  {n:23,nm:'= equals',s:'<span class="kw">WHERE</span> <span class="col">Status</span> = <span class="str">\'Active\'</span>',d:'基本的比较运算符。要求完全匹配。'},
  {n:24,nm:'<> / != not equal',s:'<span class="kw">WHERE</span> <span class="col">Role</span> &lt;&gt; <span class="str">\'Admin\'</span>',d:'这两种写法完全相同。显示所有不等于指定值的内容。'},
  {n:25,nm:'> greater than',s:'<span class="kw">WHERE</span> <span class="col">Amount</span> &gt; <span class="num">1000</span>',d:'高于参考点的值。不包含该值本身。'},
  {n:26,nm:'< less than',s:'<span class="kw">WHERE</span> <span class="col">InventoryLevel</span> &lt; <span class="num">10</span>',d:'低于参考点的值。用于对即将耗尽的库存发出警报。'},
  {n:27,nm:'>= greater than or equal',s:'<span class="kw">WHERE</span> <span class="col">Age</span> &gt;= <span class="num">18</span>',d:'包含阈值本身。定义最低门槛的正确方式。'},
  {n:28,nm:'<= less than or equal',s:'<span class="kw">WHERE</span> <span class="col">Discount</span> &lt;= <span class="num">0.5</span>',d:'设定上限。折扣最多 50%（含）的产品。'},
  {n:29,nm:'EXISTS',s:'<span class="kw">WHERE EXISTS</span> (<span class="kw">SELECT</span> <span class="num">1</span> <span class="kw">FROM</span> <span class="tbl">Orders</span> o <span class="kw">WHERE</span> o.CustID = c.ID)',d:'检查“是否存在？”。非常快——它在第一个匹配处就停止。在许多情况下优于 JOIN。'},
  {n:30,nm:'NOT EXISTS',s:'<span class="kw">WHERE NOT EXISTS</span> (<span class="kw">SELECT</span> <span class="num">1</span> <span class="kw">FROM</span> <span class="tbl">Orders</span> o <span class="kw">WHERE</span> o.CustID = c.ID)',d:'在另一张表中没有任何踪迹的实体。在性能上通常优于 NOT IN。'},
  {n:31,nm:'ANY',s:'<span class="kw">WHERE</span> <span class="col">Price</span> &gt; <span class="kw">ANY</span> (<span class="kw">SELECT</span> <span class="col">Price</span> <span class="kw">FROM</span> <span class="tbl">Competitors</span>)',d:'针对一组结果进行比较。只要条件对至少一个值成立即可。'},
  {n:32,nm:'ALL',s:'<span class="kw">WHERE</span> <span class="col">Price</span> &gt; <span class="kw">ALL</span> (<span class="kw">SELECT</span> <span class="col">Price</span> <span class="kw">FROM</span> <span class="tbl">Competitors</span>)',d:'更严格——条件必须对列表中的每一个值都成立，无一例外。'},
 ]},
 {id:'s3',t:'排序、分组与输出格式化',cc:'var(--orange)',f:[
  {n:33,nm:'ORDER BY',s:'<span class="kw">ORDER BY</span> <span class="col">LastName</span>, <span class="col">FirstName</span>',d:'按逻辑顺序组织结果。没有 ORDER BY，SQL 会以任意顺序返回行。'},
  {n:34,nm:'ASC',s:'<span class="kw">ORDER BY</span> <span class="col">Price</span> <span class="kw">ASC</span>',d:'升序排序——从小到大、A 到 Z。这是默认值，可以省略。'},
  {n:35,nm:'DESC',s:'<span class="kw">ORDER BY</span> <span class="col">OrderDate</span> <span class="kw">DESC</span>',d:'降序排序。把最新、最赚钱或最高的排在最前面。'},
  {n:36,nm:'TOP',s:'<span class="kw">SELECT TOP</span> <span class="num">10</span> * <span class="kw">FROM</span> <span class="tbl">Customers</span> <span class="kw">ORDER BY</span> <span class="col">Score</span> <span class="kw">DESC</span>',d:'只取前 X 行（SQL Server）。配合 ORDER BY DESC——就是“前 10 名”。'},
  {n:37,nm:'LIMIT',s:'<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Customers</span> <span class="kw">ORDER BY</span> <span class="col">Score</span> <span class="kw">DESC</span> <span class="kw">LIMIT</span> <span class="num">10</span>',d:'MySQL/PostgreSQL 中相当于 TOP。始终放在查询的末尾。'},
  {n:38,nm:'OFFSET',s:'<span class="kw">ORDER BY</span> <span class="col">ID</span> <span class="kw">OFFSET</span> <span class="num">20</span> <span class="kw">ROWS</span>',d:'跳过 X 行。分页机制的一部分——翻阅结果页。'},
  {n:39,nm:'FETCH NEXT',s:'<span class="kw">OFFSET</span> <span class="num">20</span> <span class="kw">ROWS FETCH NEXT</span> <span class="num">10</span> <span class="kw">ROWS ONLY</span>',d:'与 OFFSET 配合。定义跳过之后要取多少行。'},
  {n:40,nm:'GROUP BY',s:'<span class="kw">SELECT</span> <span class="col">Category</span>, <span class="fn">COUNT</span>(*) <span class="kw">FROM</span> <span class="tbl">Products</span> <span class="kw">GROUP BY</span> <span class="col">Category</span>',d:'把具有相同值的记录归为一组，并支持按组进行聚合计算。'},
  {n:41,nm:'HAVING',s:'<span class="kw">GROUP BY</span> <span class="col">Category</span> <span class="kw">HAVING</span> <span class="fn">COUNT</span>(*) &gt; <span class="num">50</span>',d:'“针对组的 WHERE”。它在计算完成之后筛选。使用聚合函数时必须用它。'},
  {n:42,nm:'ROLLUP',s:'<span class="kw">GROUP BY ROLLUP</span> (<span class="col">Department</span>)',d:'自动在底部添加一行“总计”。省去单独的计算。'},
  {n:43,nm:'CUBE',s:'<span class="kw">GROUP BY CUBE</span> (<span class="col">Department</span>, <span class="col">JobTitle</span>)',d:'为每一种可能的组合创建汇总行。用于分析型矩阵报表。'},
  {n:44,nm:'GROUPING SETS',s:'<span class="kw">GROUP BY GROUPING SETS</span> ((<span class="col">Dept</span>), (<span class="col">Title</span>), ())',d:'精确控制——准确指定要生成哪些汇总层级。比 CUBE 更高效。'},
 ]},
 {id:'s4',t:'聚合函数',cc:'var(--blue)',f:[
  {n:45,nm:'COUNT(col)',s:'<span class="kw">SELECT</span> <span class="fn">COUNT</span>(<span class="col">Email</span>) <span class="kw">FROM</span> <span class="tbl">Customers</span>',d:'统计某一列中的值。忽略 NULL 行。10 行中有 8 个邮箱 → 返回 8。'},
  {n:46,nm:'COUNT(*)',s:'<span class="kw">SELECT</span> <span class="fn">COUNT</span>(*) <span class="kw">FROM</span> <span class="tbl">Orders</span>',d:'统计物理行数，包括 NULL。快速知道“一共有多少条记录？”的方式。'},
  {n:47,nm:'SUM()',s:'<span class="kw">SELECT</span> <span class="fn">SUM</span>(<span class="col">Amount</span>) <span class="kw">FROM</span> <span class="tbl">Sales</span> <span class="kw">WHERE</span> <span class="col">Year</span> = <span class="num">2023</span>',d:'把数值加总。财务报表跳动的心脏。'},
  {n:48,nm:'AVG()',s:'<span class="kw">SELECT</span> <span class="fn">AVG</span>(<span class="col">Salary</span>) <span class="kw">FROM</span> <span class="tbl">Employees</span>',d:'忽略 NULL 的算术平均值。用于平均工资、等待时间、年龄等等。'},
  {n:49,nm:'MIN()',s:'<span class="kw">SELECT</span> <span class="fn">MIN</span>(<span class="col">Price</span>) <span class="kw">FROM</span> <span class="tbl">Products</span>',d:'最小值。也用于最早的日期或按字母排序的第一个名字。'},
  {n:50,nm:'MAX()',s:'<span class="kw">SELECT</span> <span class="fn">MAX</span>(<span class="col">OrderDate</span>) <span class="kw">FROM</span> <span class="tbl">Orders</span>',d:'最大值。用于最赚钱的交易或最近的时间戳。'},
 ]},
 {id:'s5',t:'连接与集合运算',cc:'var(--purple)',f:[
  {n:51,nm:'INNER JOIN',s:'<span class="kw">SELECT</span> c.Name, o.Amount <span class="kw">FROM</span> <span class="tbl">Customers</span> c <span class="kw">INNER JOIN</span> <span class="tbl">Orders</span> o <span class="kw">ON</span> c.ID = o.CustID',d:'只取两边都完全匹配的行。报告活跃交易时最安全的选择。'},
  {n:52,nm:'LEFT JOIN',s:'<span class="kw">SELECT</span> c.Name, o.Amount <span class="kw">FROM</span> <span class="tbl">Customers</span> c <span class="kw">LEFT JOIN</span> <span class="tbl">Orders</span> o <span class="kw">ON</span> c.ID = o.CustID',d:'左表中的所有行，即使没有匹配（右侧为 NULL）。用于查找没有订单的客户。'},
  {n:53,nm:'RIGHT JOIN',s:'<span class="kw">SELECT</span> c.Name, o.Amount <span class="kw">FROM</span> <span class="tbl">Customers</span> c <span class="kw">RIGHT JOIN</span> <span class="tbl">Orders</span> o <span class="kw">ON</span> c.ID = o.CustID',d:'右表中的所有行。通常更好的做法是交换顺序并使用 LEFT。'},
  {n:54,nm:'FULL OUTER JOIN',s:'<span class="kw">SELECT</span> c.Name, o.Amount <span class="kw">FROM</span> <span class="tbl">Customers</span> c <span class="kw">FULL OUTER JOIN</span> <span class="tbl">Orders</span> o <span class="kw">ON</span> c.ID = o.CustID',d:'来自各方的一切——匹配项加上两侧的缺口。用于审计和查找不匹配。'},
  {n:55,nm:'CROSS JOIN',s:'<span class="kw">SELECT</span> Colors.Name, Sizes.Name <span class="kw">FROM</span> <span class="tbl">Colors</span> <span class="kw">CROSS JOIN</span> <span class="tbl">Sizes</span>',d:'笛卡尔积——每一行 × 每一行。3 种颜色 × 3 种尺码 = 9 行。'},
  {n:56,nm:'SELF JOIN',s:'<span class="kw">SELECT</span> e1.Name <span class="kw">AS</span> Emp, e2.Name <span class="kw">AS</span> Mgr <span class="kw">FROM</span> <span class="tbl">Employees</span> e1 <span class="kw">JOIN</span> <span class="tbl">Employees</span> e2 <span class="kw">ON</span> e1.MgrID = e2.ID',d:'把一张表连接到它自己。用于在同一张表中处理经理—员工层级。'},
  {n:57,nm:'ON',s:'<span class="kw">JOIN</span> <span class="tbl">Orders</span> o <span class="kw">ON</span> c.ID = o.CustomerID',d:'定义连接条件——哪些列在两张表中代表相同的信息。'},
  {n:58,nm:'USING',s:'<span class="kw">JOIN</span> <span class="tbl">Orders</span> <span class="kw">USING</span> (CustomerID)',d:'当连接列在两张表中同名时，作为 ON 的简写。'},
  {n:59,nm:'UNION',s:'<span class="kw">SELECT</span> <span class="col">City</span> <span class="kw">FROM</span> <span class="tbl">Customers</span> <span class="kw">UNION</span> <span class="kw">SELECT</span> <span class="col">City</span> <span class="kw">FROM</span> <span class="tbl">Suppliers</span>',d:'把查询纵向堆叠并去除重复。两者必须具有相同的列结构。'},
  {n:60,nm:'UNION ALL',s:'<span class="kw">SELECT</span> <span class="col">City</span> <span class="kw">FROM</span> <span class="tbl">Customers</span> <span class="kw">UNION ALL</span> <span class="kw">SELECT</span> <span class="col">City</span> <span class="kw">FROM</span> <span class="tbl">Suppliers</span>',d:'不去除重复的合并。更快——在没有重叠时更可取。'},
  {n:61,nm:'INTERSECT',s:'<span class="kw">SELECT</span> <span class="col">ProductID</span> <span class="kw">FROM</span> <span class="tbl">Sales2023</span> <span class="kw">INTERSECT</span> <span class="kw">SELECT</span> <span class="col">ProductID</span> <span class="kw">FROM</span> <span class="tbl">Sales2024</span>',d:'交集——只取在两个查询中都出现的行。用于两年都购买的忠实客户。'},
  {n:62,nm:'EXCEPT / MINUS',s:'<span class="kw">SELECT</span> <span class="col">ProductID</span> <span class="kw">FROM</span> <span class="tbl">Sales2023</span> <span class="kw">EXCEPT</span> <span class="kw">SELECT</span> <span class="col">ProductID</span> <span class="kw">FROM</span> <span class="tbl">Sales2024</span>',d:'相减——在第一个查询中而不在第二个查询中的行。仅在 2023 年售出的产品。'},
 ]},
 {id:'s6',t:'DDL —— 定义结构与基础架构',cc:'#ff7b72',f:[
  {n:63,nm:'CREATE DATABASE',s:'<span class="kw">CREATE DATABASE</span> CompanyCRM',d:'创建一个新数据库。在服务器上分配空间、文件和日志。'},
  {n:64,nm:'DROP DATABASE',s:'<span class="kw">DROP DATABASE</span> CompanyCRM',d:'删除整个数据库——包括所有表和数据。没有备份就无法恢复！'},
  {n:65,nm:'CREATE TABLE',s:'<span class="kw">CREATE TABLE</span> <span class="tbl">Users</span> (<span class="col">ID</span> INT, <span class="col">Name</span> VARCHAR(<span class="num">50</span>))',d:'创建一张新表并定义其列结构和数据类型。'},
  {n:66,nm:'ALTER TABLE',s:'<span class="kw">ALTER TABLE</span> <span class="tbl">Users</span> <span class="kw">ADD</span> <span class="col">Email</span> VARCHAR(<span class="num">100</span>)',d:'对现有表的结构性更改——添加列、删除、更改数据类型。'},
  {n:67,nm:'DROP TABLE',s:'<span class="kw">DROP TABLE</span> <span class="tbl">Users</span>',d:'彻底删除——数据和结构都被移除。你需要从头 CREATE。'},
  {n:68,nm:'TRUNCATE TABLE',s:'<span class="kw">TRUNCATE TABLE</span> <span class="tbl">Logs</span>',d:'快速清空内容。结构保留。比 DELETE 更快——用于重置系统。'},
  {n:69,nm:'CREATE INDEX',s:'<span class="kw">CREATE INDEX</span> idx_ln <span class="kw">ON</span> <span class="tbl">Employees</span> (<span class="col">LastName</span>)',d:'列的“目录”。让你直接跳到某条记录，而不必扫描全部。'},
  {n:70,nm:'DROP INDEX',s:'<span class="kw">DROP INDEX</span> idx_ln <span class="kw">ON</span> <span class="tbl">Employees</span>',d:'删除一个索引。索引会拖慢写入——删除未使用的索引能提升性能。'},
  {n:71,nm:'CREATE VIEW',s:'<span class="kw">CREATE VIEW</span> ActiveUsers <span class="kw">AS</span> <span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Users</span> <span class="kw">WHERE</span> <span class="col">Status</span> = <span class="str">\'Active\'</span>',d:'一张“虚拟表”——把复杂查询以一个名称保存。对用户隐藏逻辑。'},
  {n:72,nm:'DROP VIEW',s:'<span class="kw">DROP VIEW</span> ActiveUsers',d:'删除一个视图。底层数据保持不变。'},
  {n:73,nm:'CREATE PROCEDURE',s:'<span class="kw">CREATE PROCEDURE</span> GetUser (@ID INT) <span class="kw">AS BEGIN SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Users</span> <span class="kw">WHERE</span> ID=@ID <span class="kw">END</span>',d:'存储在数据库中的小程序。提升安全性并防止 SQL 注入。'},
  {n:74,nm:'DROP PROCEDURE',s:'<span class="kw">DROP PROCEDURE</span> GetUser',d:'删除一个存储过程。用于版本升级和清理旧代码。'},
  {n:75,nm:'CREATE FUNCTION',s:'<span class="kw">CREATE FUNCTION</span> CalcTax (@V DECIMAL) <span class="kw">RETURNS</span> DECIMAL <span class="kw">AS BEGIN RETURN</span> @V * <span class="num">1.17</span> <span class="kw">END</span>',d:'用于重复计算的自定义函数。返回一个干净的值，并在查询内部使用。'},
  {n:76,nm:'PRIMARY KEY',s:'<span class="kw">CREATE TABLE</span> <span class="tbl">Users</span> (<span class="col">ID</span> INT <span class="kw">PRIMARY KEY</span>, <span class="col">Name</span> VARCHAR(<span class="num">50</span>))',d:'每一行唯一的“身份证”。防止重复并要求必须有值。'},
  {n:77,nm:'FOREIGN KEY',s:'<span class="kw">CONSTRAINT</span> FK_User <span class="kw">FOREIGN KEY</span> (<span class="col">UserID</span>) <span class="kw">REFERENCES</span> <span class="tbl">Users</span>(<span class="col">ID</span>)',d:'在表之间建立严格的关联。防止录入不存在的虚构 ID。'},
  {n:78,nm:'UNIQUE',s:'<span class="kw">CREATE TABLE</span> <span class="tbl">Users</span> (<span class="col">Email</span> VARCHAR(<span class="num">100</span>) <span class="kw">UNIQUE</span>)',d:'列中的所有值必须互不相同。用于唯一的邮箱和电话号码。'},
  {n:79,nm:'NOT NULL',s:'<span class="kw">CREATE TABLE</span> <span class="tbl">Users</span> (<span class="col">Name</span> VARCHAR(<span class="num">50</span>) <span class="kw">NOT NULL</span>)',d:'要求列中必须有值。防止创建没有名字的客户或没有价格的产品。'},
  {n:80,nm:'CHECK',s:'<span class="kw">CREATE TABLE</span> <span class="tbl">Products</span> (<span class="col">Price</span> DECIMAL <span class="kw">CHECK</span> (<span class="col">Price</span> &gt; <span class="num">0</span>))',d:'检查值是否符合业务规则。不允许出现负价格。'},
  {n:81,nm:'DEFAULT',s:'<span class="kw">CREATE TABLE</span> <span class="tbl">Users</span> (<span class="col">Status</span> VARCHAR(<span class="num">20</span>) <span class="kw">DEFAULT</span> <span class="str">\'Pending\'</span>)',d:'如果用户没有输入，则自动填入一个值。而不是让单元格留为 NULL。'},
  {n:82,nm:'IDENTITY / AUTO_INCREMENT',s:'<span class="kw">CREATE TABLE</span> <span class="tbl">Users</span> (<span class="col">ID</span> INT <span class="kw">IDENTITY</span>(<span class="num">1</span>,<span class="num">1</span>) <span class="kw">PRIMARY KEY</span>)',d:'自动递增的计数器（1,2,3……）。每一行新行都获得唯一的 ID。'},
 ]},
 {id:'s7',t:'事务与安全权限',cc:'#8ba3c7',f:[
  {n:83,nm:'GRANT',s:'<span class="kw">GRANT</span> SELECT, INSERT <span class="kw">ON</span> <span class="tbl">Users</span> <span class="kw">TO</span> AnalystRole',d:'授予访问权限。你可以给予“只读”并阻止更改。'},
  {n:84,nm:'REVOKE',s:'<span class="kw">REVOKE</span> INSERT <span class="kw">ON</span> <span class="tbl">Users</span> <span class="kw">FROM</span> AnalystRole',d:'撤销已授予的权利。用于变更角色和保护敏感数据。'},
  {n:85,nm:'BEGIN TRAN',s:'<span class="kw">BEGIN TRAN</span>; <span class="kw">UPDATE</span> <span class="tbl">Accounts</span> <span class="kw">SET</span> Balance = Balance - <span class="num">100</span>...',d:'开启一个工作单元——所有操作作为一个整体来管理。在提交之前，它们都是暂定的。'},
  {n:86,nm:'COMMIT',s:'<span class="kw">COMMIT</span>',d:'封存事务，使所有操作成为最终且不可逆。'},
  {n:87,nm:'ROLLBACK',s:'<span class="kw">ROLLBACK</span>',d:'救命稻草。撤销自事务开始以来的所有更改，恢复到先前的状态。'},
  {n:88,nm:'SAVEPOINT',s:'<span class="kw">SAVEPOINT</span> Stage1',d:'巨型事务内部的临时保存点。之后的失败只回滚到这个点。'},
 ]},
 {id:'s8',t:'文本处理函数',cc:'var(--green)',f:[
  {n:89,nm:'CONCAT()',s:'<span class="kw">SELECT</span> <span class="fn">CONCAT</span>(<span class="col">FirstName</span>, <span class="str">\' \'</span>, <span class="col">LastName</span>) <span class="kw">FROM</span> <span class="tbl">Employees</span>',d:'连接字段和文本。优雅地处理 NULL——它会忽略它们。'},
  {n:90,nm:'CONCAT_WS()',s:'<span class="kw">SELECT</span> <span class="fn">CONCAT_WS</span>(<span class="str">\', \'</span>, <span class="col">City</span>, <span class="col">State</span>, <span class="col">Country</span>) <span class="kw">FROM</span> <span class="tbl">Addresses</span>',d:'“带分隔符的连接”。定义一个分隔符，自动把所有内容连接起来。'},
  {n:91,nm:'SUBSTRING()',s:'<span class="kw">SELECT</span> <span class="fn">SUBSTRING</span>(<span class="col">IDNumber</span>, <span class="num">1</span>, <span class="num">4</span>) <span class="kw">FROM</span> <span class="tbl">Customers</span>',d:'按位置裁剪文本：列名、起始字符、多少个字符。'},
  {n:92,nm:'LEN() / LENGTH()',s:'<span class="kw">WHERE</span> <span class="fn">LEN</span>(<span class="col">Password</span>) &lt; <span class="num">8</span>',d:'统计文本中有多少个字符。用于检查过短的密码和验证数据。'},
  {n:93,nm:'UPPER()',s:'<span class="kw">SELECT</span> <span class="fn">UPPER</span>(<span class="col">CountryCode</span>) <span class="kw">FROM</span> <span class="tbl">Countries</span>',d:'转换为大写。用于规范化比较——两边都转 UPPER = 一致的搜索。'},
  {n:94,nm:'LOWER()',s:'<span class="kw">SELECT</span> <span class="fn">LOWER</span>(<span class="col">Email</span>) <span class="kw">FROM</span> <span class="tbl">Users</span>',d:'转换为小写。处理邮箱的常见约定。'},
  {n:95,nm:'TRIM()',s:'<span class="kw">SELECT</span> <span class="fn">TRIM</span>(<span class="col">Username</span>) <span class="kw">FROM</span> <span class="tbl">Accounts</span>',d:'去除开头和结尾的空格。用于清理复制粘贴带来的“杂质”。'},
  {n:96,nm:'LTRIM()',s:'<span class="kw">SELECT</span> <span class="fn">LTRIM</span>(<span class="col">Comment</span>) <span class="kw">FROM</span> <span class="tbl">Feedback</span>',d:'只去除左侧的空格。'},
  {n:97,nm:'RTRIM()',s:'<span class="kw">SELECT</span> <span class="fn">RTRIM</span>(<span class="col">Comment</span>) <span class="kw">FROM</span> <span class="tbl">Feedback</span>',d:'只去除字符串末尾的空格。'},
  {n:98,nm:'REPLACE()',s:'<span class="kw">SELECT</span> <span class="fn">REPLACE</span>(<span class="col">Phone</span>, <span class="str">\'-\'</span>, <span class="str">\'\'</span>) <span class="kw">FROM</span> <span class="tbl">Customers</span>',d:'替换某个模式的每一次出现。用于移除电话号码中的短横线。'},
  {n:99,nm:'REVERSE()',s:'<span class="kw">SELECT</span> <span class="fn">REVERSE</span>(<span class="col">StringCol</span>) <span class="kw">FROM</span> <span class="tbl">Strings</span>',d:'反转字符的顺序。一个用于查找最后一个字符位置的技巧。'},
  {n:100,nm:'LEFT()',s:'<span class="kw">SELECT</span> <span class="fn">LEFT</span>(<span class="col">OrderNum</span>, <span class="num">2</span>) <span class="kw">FROM</span> <span class="tbl">Orders</span>',d:'从左侧取 X 个字符。从开头提取时比 SUBSTRING 更简短。'},
  {n:101,nm:'RIGHT()',s:'<span class="kw">SELECT</span> <span class="fn">RIGHT</span>(<span class="col">CreditCard</span>, <span class="num">4</span>) <span class="kw">FROM</span> <span class="tbl">Payments</span>',d:'从右侧取 X 个字符。用于信用卡的后 4 位。'},
  {n:102,nm:'CHARINDEX()',s:'<span class="kw">SELECT</span> <span class="fn">CHARINDEX</span>(<span class="str">\'@\'</span>, <span class="col">Email</span>) <span class="kw">FROM</span> <span class="tbl">Users</span>',d:'搜索某个字符/单词并返回数字位置。用于裁剪长度不一的邮箱。'},
  {n:103,nm:'PATINDEX()',s:'<span class="kw">SELECT</span> <span class="fn">PATINDEX</span>(<span class="str">\'%[0-9]%\'</span>, <span class="col">Address</span>) <span class="kw">FROM</span> <span class="tbl">Customers</span>',d:'查找智能模式（SQL Server）。用于定位地址中第一个数字的位置。'},
  {n:104,nm:'FORMAT()',s:'<span class="kw">SELECT</span> <span class="fn">FORMAT</span>(<span class="col">Price</span>, <span class="str">\'C\'</span>, <span class="str">\'en-US\'</span>) <span class="kw">FROM</span> <span class="tbl">Products</span>',d:'把值格式化成漂亮的文本——百万中的逗号、货币符号、日期格式。'},
 ]},
 {id:'s9',t:'日期与时间函数',cc:'#ffa657',f:[
  {n:105,nm:'GETDATE() / NOW()',s:'<span class="kw">SELECT</span> <span class="fn">GETDATE</span>()',d:'精确到毫秒的当前日期和时间。新记录的自动时间戳。'},
  {n:106,nm:'CURRENT_DATE',s:'<span class="kw">SELECT CURRENT_DATE</span>',d:'只有今天的日期，不含时间。用于只关心日期的条件。'},
  {n:107,nm:'CURRENT_TIME',s:'<span class="kw">SELECT CURRENT_TIME</span>',d:'不含日期的当前时间。用于效率报表和每日负载。'},
  {n:108,nm:'DATEADD()',s:'<span class="kw">SELECT</span> <span class="fn">DATEADD</span>(day, <span class="num">30</span>, <span class="col">OrderDate</span>) <span class="kw">AS</span> DueDate <span class="kw">FROM</span> <span class="tbl">Orders</span>',d:'给日期加上（或加负号减去）时间。用于计算到期日。'},
  {n:109,nm:'DATEDIFF()',s:'<span class="kw">SELECT</span> <span class="fn">DATEDIFF</span>(day, <span class="col">OrderDate</span>, <span class="col">ShipDate</span>) <span class="kw">FROM</span> <span class="tbl">Orders</span>',d:'两个日期之间的间隔。用于响应时间、客户年龄、距发货的天数。'},
  {n:110,nm:'DATEPART()',s:'<span class="kw">SELECT</span> <span class="fn">DATEPART</span>(quarter, <span class="col">OrderDate</span>) <span class="kw">FROM</span> <span class="tbl">Sales</span>',d:'把某个特定元素提取为数字（quarter = 1-4）。按季度进行 GROUP BY 时必不可少。'},
  {n:111,nm:'YEAR()',s:'<span class="kw">SELECT</span> <span class="fn">YEAR</span>(<span class="col">OrderDate</span>) <span class="kw">FROM</span> <span class="tbl">Sales</span>',d:'隔离出年份。用于年度营收报表（2021、2022、2023……）。'},
  {n:112,nm:'MONTH()',s:'<span class="kw">SELECT</span> <span class="fn">MONTH</span>(<span class="col">OrderDate</span>) <span class="kw">FROM</span> <span class="tbl">Sales</span>',d:'月份编号（1-12）。用于跨年份的季节性分析。'},
  {n:113,nm:'DAY()',s:'<span class="kw">SELECT</span> <span class="fn">DAY</span>(<span class="col">BirthDate</span>) <span class="kw">FROM</span> <span class="tbl">Customers</span>',d:'当月的第几天（1-31）。用于生日和每月的信用卡还款。'},
  {n:114,nm:'EOMONTH()',s:'<span class="kw">SELECT</span> <span class="fn">EOMONTH</span>(<span class="col">OrderDate</span>) <span class="kw">AS</span> EndOfMonth <span class="kw">FROM</span> <span class="tbl">Sales</span>',d:'跳到当月的最后一天。解决“这个月有多少天”的问题。用于财务结账。'},
  {n:115,nm:'ISDATE()',s:'<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Import</span> <span class="kw">WHERE</span> <span class="fn">ISDATE</span>(<span class="col">RawText</span>) = <span class="num">1</span>',d:'检查文本是否为有效日期。防范来自表单的坏数据。'},
 ]},
 {id:'s10',t:'数学函数',cc:'var(--orange)',f:[
  {n:116,nm:'ROUND()',s:'<span class="kw">SELECT</span> <span class="fn">ROUND</span>(<span class="col">Price</span>, <span class="num">2</span>) <span class="kw">FROM</span> <span class="tbl">Products</span>',d:'四舍五入到 X 位小数。用于精确的发票。'},
  {n:117,nm:'CEILING()',s:'<span class="kw">SELECT</span> <span class="fn">CEILING</span>(<span class="num">4.1</span>) <span class="cmt">-- Returns 5</span>',d:'把任何小数向上取整到下一个整数。4.1 辆公交车 → 你必须租 5 辆。'},
  {n:118,nm:'FLOOR()',s:'<span class="kw">SELECT</span> <span class="fn">FLOOR</span>(<span class="num">4.9</span>) <span class="cmt">-- Returns 4</span>',d:'向下截断到较小的整数。4.9 包 → 你只能装 4 包。'},
  {n:119,nm:'ABS()',s:'<span class="kw">SELECT</span> <span class="fn">ABS</span>(<span class="col">Income</span> - <span class="col">Expense</span>) <span class="kw">FROM</span> <span class="tbl">Books</span>',d:'绝对值——负数变正数。用于计算差距的大小。'},
  {n:120,nm:'POWER()',s:'<span class="kw">SELECT</span> <span class="fn">POWER</span>(<span class="col">Radius</span>, <span class="num">2</span>) <span class="kw">FROM</span> <span class="tbl">Shapes</span>',d:'求幂。用于复利和面积计算。'},
  {n:121,nm:'SQRT()',s:'<span class="kw">SELECT</span> <span class="fn">SQRT</span>(<span class="col">Area</span>) <span class="kw">FROM</span> <span class="tbl">Squares</span>',d:'平方根。用于距离计算和标准差。'},
  {n:122,nm:'RAND()',s:'<span class="kw">SELECT</span> <span class="fn">RAND</span>()',d:'0 到 1 之间的随机数。用于抽奖和随机抽样。'},
  {n:123,nm:'SIGN()',s:'<span class="kw">SELECT</span> <span class="fn">SIGN</span>(<span class="col">NetProfit</span>) <span class="kw">FROM</span> <span class="tbl">Reports</span>',d:'1（正）、-1（负）、0。用于快速的盈亏指示。'},
  {n:124,nm:'PI()',s:'<span class="kw">SELECT</span> <span class="fn">PI</span>() * <span class="fn">POWER</span>(<span class="col">Radius</span>, <span class="num">2</span>) <span class="kw">AS</span> Area',d:'内置的 π 常量。用于精确的几何计算。'},
  {n:125,nm:'MOD() / %',s:'<span class="kw">WHERE</span> <span class="col">EmployeeID</span> % <span class="num">2</span> = <span class="num">0</span>',d:'除法的余数。用于查找偶数行，以及把列表平均分到几个通道。'},
 ]},
 {id:'s11',t:'智能条件与 NULL 处理',cc:'var(--red)',f:[
  {n:126,nm:'CASE',s:'<span class="kw">SELECT CASE WHEN</span> Score &gt; <span class="num">90</span> <span class="kw">THEN</span> <span class="str">\'A\'</span> <span class="kw">ELSE</span> <span class="str">\'F\'</span> <span class="kw">END FROM</span> <span class="tbl">Tests</span>',d:'查询内部的分支逻辑。构建一个实时对数据进行分类的计算列。'},
  {n:127,nm:'WHEN / THEN',s:'<span class="kw">CASE WHEN</span> condition <span class="kw">THEN</span> result <span class="kw">END</span>',d:'CASE 的核心。WHEN = 要测试的条件，THEN = 条件为真时的输出。'},
  {n:128,nm:'COALESCE()',s:'<span class="kw">SELECT</span> <span class="fn">COALESCE</span>(<span class="col">Mobile</span>, <span class="col">HomePhone</span>, <span class="str">\'No Phone\'</span>) <span class="kw">FROM</span> <span class="tbl">Contacts</span>',d:'返回第一个不为 NULL 的值。处理缺失数据的“优先级瀑布”。'},
  {n:129,nm:'ISNULL() / IFNULL()',s:'<span class="kw">SELECT</span> <span class="fn">ISNULL</span>(<span class="col">Discount</span>, <span class="num">0</span>) <span class="kw">FROM</span> <span class="tbl">Sales</span>',d:'如果为 NULL，则返回一个回退值。在计算中必不可少——NULL 会破坏数学运算。'},
  {n:130,nm:'NULLIF()',s:'<span class="kw">SELECT</span> Amount / <span class="fn">NULLIF</span>(<span class="col">Quantity</span>, <span class="num">0</span>) <span class="kw">FROM</span> <span class="tbl">Inventory</span>',d:'如果两个值相同 → 返回 NULL。防止除以零的崩溃。'},
 ]},
 {id:'s12',t:'数据类型转换与提升',cc:'var(--purple)',f:[
  {n:131,nm:'IIF()',s:'<span class="kw">SELECT</span> <span class="fn">IIF</span>(Stock &gt; <span class="num">0</span>, <span class="str">\'In Stock\'</span>, <span class="str">\'Out of Stock\'</span>) <span class="kw">FROM</span> <span class="tbl">Products</span>',d:'用于两种状态的简写 CASE。SQL Server。三个输入：条件、真、假。'},
  {n:132,nm:'CAST()',s:'<span class="kw">SELECT</span> <span class="fn">CAST</span>(<span class="col">Price</span> <span class="kw">AS</span> INT) <span class="kw">FROM</span> <span class="tbl">Products</span>',d:'转换数据类型的标准工具。数字转文本以便拼接，文本转数字以便相加。'},
  {n:133,nm:'CONVERT()',s:'<span class="kw">SELECT</span> <span class="fn">CONVERT</span>(VARCHAR(<span class="num">10</span>), <span class="col">OrderDate</span>, <span class="num">103</span>) <span class="kw">FROM</span> <span class="tbl">Orders</span>',d:'CAST 的兄弟，带有格式化能力。它可以在转换时格式化日期。'},
  {n:134,nm:'TRY_CAST()',s:'<span class="kw">SELECT</span> <span class="fn">TRY_CAST</span>(<span class="col">StringVal</span> <span class="kw">AS</span> INT) <span class="kw">FROM</span> <span class="tbl">DirtyData</span>',d:'一种安全的转换。乱码 → NULL 而不是崩溃。查询继续运行。'},
  {n:135,nm:'TRY_CONVERT()',s:'<span class="kw">SELECT</span> <span class="fn">TRY_CONVERT</span>(DATE, <span class="col">StringDate</span>) <span class="kw">FROM</span> <span class="tbl">DirtyData</span>',d:'一种安全的 CONVERT。用于从不可靠的外部源摄取数据。'},
 ]},
 {id:'s13',t:'窗口函数',cc:'var(--yellow)',f:[
  {n:136,nm:'OVER()',s:'<span class="kw">SELECT</span> Name, <span class="fn">SUM</span>(Salary) <span class="kw">OVER</span>() <span class="kw">AS</span> Total <span class="kw">FROM</span> <span class="tbl">Employees</span>',d:'通往窗口函数的大门。无需 GROUP BY 就能对每条记录进行聚合计算。工资 + 公司总薪资一起显示。'},
  {n:137,nm:'PARTITION BY',s:'<span class="fn">SUM</span>(Salary) <span class="kw">OVER</span>(<span class="kw">PARTITION BY</span> Department)',d:'把窗口拆分成子组。部门薪资而不是整个公司。对每一组重置。'},
  {n:138,nm:'ROW_NUMBER()',s:'<span class="fn">ROW_NUMBER</span>() <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> Salary <span class="kw">DESC</span>)',d:'唯一的连续编号（1,2,3……）。忽略并列。用于强制排序和去除重复。'},
  {n:139,nm:'RANK()',s:'<span class="fn">RANK</span>() <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> Salary <span class="kw">DESC</span>)',d:'竞赛式排名。并列 → 两者都得第 2 名。下一个 → 跳到 4（跳过 3）。'},
  {n:140,nm:'DENSE_RANK()',s:'<span class="fn">DENSE_RANK</span>() <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> Salary <span class="kw">DESC</span>)',d:'密集排名。在第 2 名并列之后，下一个得 3（而不是 4）。用于信用评级和订阅等级。'},
  {n:141,nm:'NTILE()',s:'<span class="fn">NTILE</span>(<span class="num">4</span>) <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> Salary)',d:'拆分成 X 个相等的组。NTILE(4) = 四个四分位。用于营销细分。'},
  {n:142,nm:'LEAD()',s:'<span class="fn">LEAD</span>(Revenue) <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> Month)',d:'从下一行取一个值。把下个月的营收与当前月并排显示——无需 JOIN。'},
  {n:143,nm:'LAG()',s:'<span class="fn">LAG</span>(Revenue) <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> Month)',d:'从上一行取一个值。把昨天和今天并排——在单个查询中计算 % 增长。'},
  {n:144,nm:'FIRST_VALUE()',s:'<span class="fn">FIRST_VALUE</span>(Name) <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> HireDate)',d:'窗口中的第一条记录，对每一行都有效。把最资深的员工与每位员工并排显示。'},
  {n:145,nm:'LAST_VALUE()',s:'<span class="fn">LAST_VALUE</span>(Name) <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> HireDate)',d:'窗口中的最后一条记录。把订单的最终阶段与所有中间阶段并排显示。'},
 ]},
 {id:'s14',t:'高级结构与架构',cc:'var(--cyan)',f:[
  {n:146,nm:'WITH (CTE)',s:'<span class="kw">WITH</span> HighVal <span class="kw">AS</span> (<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Orders</span> <span class="kw">WHERE</span> Amount &gt; <span class="num">1000</span>) <span class="kw">SELECT</span> * <span class="kw">FROM</span> HighVal',d:'一张贯穿整个查询的临时工作表。把复杂的代码变成可读的步骤。'},
  {n:147,nm:'PIVOT',s:'<span class="kw">PIVOT</span>(<span class="fn">SUM</span>(Amount) <span class="kw">FOR</span> Year <span class="kw">IN</span> ([<span class="num">2022</span>], [<span class="num">2023</span>])) <span class="kw">AS</span> pvt',d:'把行转成列。用于 Excel 式的报表——把一年中的各月作为列。'},
  {n:148,nm:'UNPIVOT',s:'<span class="kw">UNPIVOT</span> (Amount <span class="kw">FOR</span> Year <span class="kw">IN</span> ([<span class="num">2022</span>], [<span class="num">2023</span>])) <span class="kw">AS</span> unpvt',d:'把列转回行。用于规范化来自外部源的矩阵。'},
  {n:149,nm:'EXEC / EXECUTE',s:'<span class="kw">EXEC</span> GetUser @UserID = <span class="num">5</span>',d:'运行存储过程。也用于执行在运行时以文本构建的动态代码。'},
  {n:150,nm:'DECLARE',s:'<span class="kw">DECLARE</span> @Year INT = <span class="num">2023</span>; <span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Sales</span> <span class="kw">WHERE</span> Year = @Year',d:'在脚本中创建变量。改动顶部的一个值会影响下面的所有代码。'},
 ]},

 ,{id:'s15',t:'JSON 与 XML —— 半结构化数据',cc:'var(--orange)',f:[
  {n:151,nm:'FOR JSON',s:'<span class="kw">SELECT</span> Name, Age <span class="kw">FROM</span> <span class="tbl">Users</span> <span class="kw">FOR JSON AUTO</span>',d:'把 SQL 结果转成 JSON 格式。让 Web 开发者无需进一步转换就能在 JavaScript 中直接使用数据。'},
  {n:152,nm:'OPENJSON()',s:'<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="fn">OPENJSON</span>(@JsonString)',d:'把 JSON 字符串转成带行和列的常规表。用于处理来自外部 API 的数据。'},
  {n:153,nm:'JSON_VALUE()',s:'<span class="kw">SELECT</span> <span class="fn">JSON_VALUE</span>(<span class="col">JsonCol</span>, <span class="str">\'$.Address.City\'</span>) <span class="kw">FROM</span> <span class="tbl">Customers</span>',d:'按路径从 JSON 中提取单个值。用于从大型 JSON 列中取出特定字段。'},
  {n:154,nm:'JSON_QUERY()',s:'<span class="kw">SELECT</span> <span class="fn">JSON_QUERY</span>(<span class="col">JsonCol</span>, <span class="str">\'$.Hobbies\'</span>) <span class="kw">FROM</span> <span class="tbl">Customers</span>',d:'从 JSON 中提取复杂的对象或数组。与返回简单值的 JSON_VALUE 不同。'},
  {n:155,nm:'JSON_MODIFY()',s:'<span class="kw">UPDATE</span> <span class="tbl">Users</span> <span class="kw">SET</span> JsonCol = <span class="fn">JSON_MODIFY</span>(JsonCol, <span class="str">\'$.Status\'</span>, <span class="str">\'VIP\'</span>)',d:'在不重写整个文档的情况下，编辑 JSON 内部的某个特定值。'},
  {n:156,nm:'ISJSON()',s:'<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Logs</span> <span class="kw">WHERE</span> <span class="fn">ISJSON</span>(<span class="col">RawData</span>) = <span class="num">1</span>',d:'检查字符串是否为有效的 JSON。有效返回 1，格式错误返回 0。用于过滤掉坏数据。'},
  {n:157,nm:'FOR XML',s:'<span class="kw">SELECT</span> Name <span class="kw">FROM</span> <span class="tbl">Users</span> <span class="kw">FOR XML PATH</span>(<span class="str">\'User\'</span>)',d:'把表结果转成 XML 格式。在银行、政府和遗留系统中仍然常见。'},
  {n:158,nm:'OPENXML()',s:'<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="fn">OPENXML</span>(@doc, <span class="str">\'/Users/User\'</span>)',d:'把 XML 字符串转成关系表。用于处理来自旧 XML 接口的数据。'},
 ]},
 {id:'s16',t:'高级字符串函数',cc:'var(--cyan)',f:[
  {n:159,nm:'STRING_AGG()',s:'<span class="kw">SELECT</span> Dept, <span class="fn">STRING_AGG</span>(Name, <span class="str">\', \'</span>) <span class="kw">FROM</span> <span class="tbl">Employees</span> <span class="kw">GROUP BY</span> Dept',d:'用分隔符把多行合并成一个字符串。“5 名员工” → “Dan, Yael, Ron, Michal, Noa”。'},
  {n:160,nm:'STRING_SPLIT()',s:'<span class="kw">SELECT</span> value <span class="kw">FROM</span> <span class="fn">STRING_SPLIT</span>(<span class="str">\'Apple,Banana,Orange\'</span>, <span class="str">\',\'</span>)',d:'用分隔符把字符串拆成单独的行。与 STRING_AGG 相反。'},
  {n:161,nm:'REPLICATE()',s:'<span class="kw">SELECT</span> <span class="fn">REPLICATE</span>(<span class="str">\'0\'</span>, <span class="num">5</span>) + OrderNumber <span class="kw">FROM</span> <span class="tbl">Orders</span>',d:'把字符重复 X 次。用于给数字补前导零（000045）。'},
  {n:162,nm:'SPACE()',s:'<span class="kw">SELECT</span> FirstName + <span class="fn">SPACE</span>(<span class="num">5</span>) + LastName <span class="kw">FROM</span> <span class="tbl">Users</span>',d:'生成 X 个空格。比手动敲空格更易读。'},
  {n:163,nm:'SOUNDEX()',s:'<span class="kw">WHERE</span> <span class="fn">SOUNDEX</span>(Name) = <span class="fn">SOUNDEX</span>(<span class="str">\'Smith\'</span>)',d:'把单词转成语音（发音）编码。用于查找拼写错误的名字——“Smythe” = “Smith”。'},
  {n:164,nm:'DIFFERENCE()',s:'<span class="kw">SELECT</span> <span class="fn">DIFFERENCE</span>(Name, <span class="str">\'Michael\'</span>) <span class="kw">FROM</span> <span class="tbl">Users</span>',d:'两个单词语音相似度的 0-4 评分。4 = 发音完全相同。用于“你是不是想找……？”引擎。'},
  {n:165,nm:'QUOTENAME()',s:'<span class="kw">SELECT</span> <span class="fn">QUOTENAME</span>(TableName) <span class="kw">FROM</span> Sys.Tables',d:'用方括号把对象名称包起来。防止带空格名称出错，并防范 SQL 注入。'},
  {n:166,nm:'TRANSLATE()',s:'<span class="kw">SELECT</span> <span class="fn">TRANSLATE</span>(Phone, <span class="str">\'()-\'</span>, <span class="str">\'   \'</span>) <span class="kw">FROM</span> <span class="tbl">Contacts</span>',d:'一次替换多个字符。用于在单个查询中清理电话号码里的标点。'},
  {n:167,nm:'ASCII()',s:'<span class="kw">SELECT</span> <span class="fn">ASCII</span>(<span class="fn">LEFT</span>(Password, <span class="num">1</span>)) <span class="kw">FROM</span> <span class="tbl">Logins</span>',d:'返回第一个字符的 ASCII 码。用于检查密码是否以大写字母开头。'},
  {n:168,nm:'CHAR()',s:'<span class="kw">SELECT</span> <span class="str">\'Hello\'</span> + <span class="fn">CHAR</span>(<span class="num">13</span>) + <span class="str">\'World\'</span>',d:'把数字编码转成字符。CHAR(13) = 换行，CHAR(9) = Tab。用于无法直接输入的字符。'},
 ]},
 {id:'s17',t:'系统函数与标识符',cc:'var(--purple)',f:[
  {n:169,nm:'DB_NAME()',s:'<span class="kw">SELECT</span> <span class="fn">DB_NAME</span>()',d:'返回当前数据库的名称。用于在拥有多个数据库的服务器上识别代码在哪里运行。'},
  {n:170,nm:'OBJECT_ID()',s:'<span class="kw">IF</span> <span class="fn">OBJECT_ID</span>(<span class="str">\'TempTable\'</span>) <span class="kw">IS NOT NULL DROP TABLE</span> TempTable',d:'检查某个表/对象是否存在。在 DROP 之前防止“表不存在”的错误。'},
  {n:171,nm:'OBJECT_NAME()',s:'<span class="kw">SELECT</span> <span class="fn">OBJECT_NAME</span>(<span class="num">1234567</span>)',d:'把内部 ID 转成可读的名称。用于分析系统表和跟踪性能。'},
  {n:172,nm:'@@VERSION',s:'<span class="kw">SELECT</span> @@VERSION',d:'返回 SQL Server 和操作系统的版本。用于在运行代码前检查兼容性。'},
  {n:173,nm:'@@ROWCOUNT',s:'<span class="kw">UPDATE</span> <span class="tbl">Users</span> <span class="kw">SET</span> Status=<span class="num">1</span>; <span class="kw">SELECT</span> @@ROWCOUNT',d:'上一条命令影响的行数。用于指示 UPDATE/DELETE 的成功/失败。'},
  {n:174,nm:'@@ERROR',s:'<span class="kw">IF</span> @@ERROR &lt;&gt; <span class="num">0</span> <span class="kw">PRINT</span> <span class="str">\'Error occurred\'</span>',d:'上一条命令的错误代码。0 = 成功。大多已被 TRY...CATCH 取代。'},
  {n:175,nm:'@@IDENTITY',s:'<span class="kw">INSERT INTO</span> <span class="tbl">Orders</span>(Amt) <span class="kw">VALUES</span>(<span class="num">50</span>); <span class="kw">SELECT</span> @@IDENTITY',d:'最后一个自动生成的 ID。用于在 INSERT 之后获取订单号。'},
  {n:176,nm:'SCOPE_IDENTITY()',s:'<span class="kw">SELECT</span> <span class="fn">SCOPE_IDENTITY</span>()',d:'类似 @@IDENTITY 但更安全——只返回当前作用域的 ID，不包括触发器产生的。'},
  {n:177,nm:'IDENT_CURRENT()',s:'<span class="kw">SELECT</span> <span class="fn">IDENT_CURRENT</span>(<span class="str">\'Orders\'</span>)',d:'某张特定表中的最后一个 ID——来自任何连接。用于监控表增长的速度。'},
  {n:178,nm:'HOST_NAME()',s:'<span class="kw">SELECT</span> <span class="fn">HOST_NAME</span>()',d:'连接来源机器的名称。用于审计系统跟踪谁从哪里访问。'},
  {n:179,nm:'SUSER_SNAME()',s:'<span class="kw">SELECT</span> <span class="fn">SUSER_SNAME</span>()',d:'当前用户的名称。用于构建行级安全——每位员工只看到自己的数据。'},
  {n:180,nm:'@@SERVERNAME',s:'<span class="kw">SELECT</span> @@SERVERNAME',d:'SQL 服务器的名称。用于需要知道连到哪一台的多服务器应用。'},
 ]},
 {id:'s18',t:'错误处理与流程控制',cc:'var(--red)',f:[
  {n:181,nm:'TRY...CATCH',s:'<span class="kw">BEGIN TRY</span> ... <span class="kw">END TRY BEGIN CATCH</span> ... <span class="kw">END CATCH</span>',d:'一种错误处理机制。TRY 中失败的代码会转到 CATCH 而不是崩溃。过程中最重要的工具。'},
  {n:182,nm:'THROW',s:'<span class="kw">BEGIN CATCH</span> <span class="kw">THROW</span>; <span class="kw">END CATCH</span>',d:'把错误重新抛给调用方应用。用于在数据库中记录错误，同时仍向用户显示一个错误。'},
  {n:183,nm:'RAISERROR',s:'<span class="fn">RAISERROR</span>(<span class="str">\'Out of stock\'</span>, <span class="num">16</span>, <span class="num">1</span>)',d:'引发一个自定义的、故意的错误。用于在出现业务问题（库存 = 0）时中止流程，即使没有 SQL 错误。'},
  {n:184,nm:'ERROR_MESSAGE()',s:'<span class="kw">INSERT INTO</span> <span class="tbl">Logs</span> <span class="kw">VALUES</span> (<span class="fn">ERROR_MESSAGE</span>())',d:'CATCH 内部的完整错误文本。用于把错误详情保存到日志表。'},
  {n:185,nm:'ERROR_NUMBER()',s:'<span class="kw">IF</span> <span class="fn">ERROR_NUMBER</span>() = <span class="num">2627</span> <span class="kw">PRINT</span> <span class="str">\'Duplicate\'</span>',d:'数字错误代码。用于按类型分别处理错误——重复 vs 权限 vs 连接。'},
  {n:186,nm:'ERROR_LINE()',s:'<span class="kw">SELECT</span> <span class="fn">ERROR_LINE</span>() <span class="kw">AS</span> FailedAtRow',d:'出错的代码行。在冗长的过程中节省数小时的调试时间。'},
  {n:187,nm:'WHILE',s:'<span class="kw">WHILE</span> @Counter &lt; <span class="num">10</span> <span class="kw">BEGIN</span> ... <span class="kw">SET</span> @Counter = @Counter + <span class="num">1</span> <span class="kw">END</span>',d:'SQL 中的循环。用于在无法进行基于集合的操作时逐步处理数据。'},
  {n:188,nm:'BREAK',s:'<span class="kw">IF</span> @Value = <span class="num">0</span> <span class="kw">BREAK</span>',d:'立即停止 WHILE 循环。用于发现错误时从循环中紧急退出。'},
  {n:189,nm:'CONTINUE',s:'<span class="kw">IF</span> @Skip = <span class="num">1</span> <span class="kw">CONTINUE</span>',d:'跳到循环的下一次迭代。用于跳过无关记录而不中止一切。'},
  {n:190,nm:'RETURN',s:'<span class="kw">IF</span> @User <span class="kw">IS NULL RETURN</span>',d:'停止整个过程。一个“守门员”——如果输入无效，立即退出。'},
  {n:191,nm:'WAITFOR DELAY',s:'<span class="kw">WAITFOR DELAY</span> <span class="str">\'00:00:10\'</span>',d:'延迟 X 时间。用于分批处理数据并加入停顿，以免拖垮服务器。'},
  {n:192,nm:'WAITFOR TIME',s:'<span class="kw">WAITFOR TIME</span> <span class="str">\'02:00:00\'</span>',d:'等到某个特定时间。用于运行夜间维护任务。'},
 ]},
 {id:'s19',t:'高级安全权限',cc:'#ff7b72',f:[
  {n:206,nm:'CREATE LOGIN',s:'<span class="kw">CREATE LOGIN</span> JohnDoe <span class="kw">WITH PASSWORD</span> = <span class="str">\'Pass1\'</span>',d:'创建对 SQL 服务器的访问。第一步——“进入大楼”。它还不授予对数据的访问。'},
  {n:207,nm:'CREATE USER',s:'<span class="kw">CREATE USER</span> JohnDoeUser <span class="kw">FOR LOGIN</span> JohnDoe',d:'把一个登录名关联到某个特定数据库。进入大楼之后的“某个房间的员工门禁”。'},
  {n:208,nm:'ALTER LOGIN / USER',s:'<span class="kw">ALTER LOGIN</span> JohnDoe <span class="kw">DISABLE</span>',d:'编辑或冻结一个用户。用于员工离职时立即撤销访问，而不删除其历史。'},
  {n:209,nm:'CREATE ROLE',s:'<span class="kw">CREATE ROLE</span> DataAnalysts',d:'创建一个权限组。管理一个组而不是逐个管理用户——可扩展又清晰。'},
  {n:210,nm:'DENY',s:'<span class="kw">DENY DELETE ON</span> <span class="tbl">Orders</span> <span class="kw">TO</span> DataAnalysts',d:'强力封锁。它会覆盖任何其他 GRANT——即使对管理员组的成员也是如此。'},
  {n:211,nm:'EXECUTE AS',s:'<span class="kw">EXECUTE AS USER</span> = <span class="str">\'AdminUser\'</span>',d:'模拟另一个用户来测试权限。无需该用户的密码。'},
  {n:212,nm:'REVERT',s:'<span class="kw">REVERT</span>',d:'取消 EXECUTE AS 并恢复到原来的身份。无需断开重连。'},
 ]},
 {id:'s20',t:'维护与优化',cc:'var(--teal,#00d4aa)',f:[
  {n:213,nm:'WITH (NOLOCK)',s:'<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">MassiveTable</span> <span class="kw">WITH</span> (NOLOCK)',d:'不等待锁就读取。更快，但它可能返回正在更新中的数据（脏读）。'},
  {n:214,nm:'OPTION (RECOMPILE)',s:'<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Users</span> <span class="kw">WHERE</span> ID = @Var <span class="kw">OPTION</span> (RECOMPILE)',d:'强制重新计算执行计划。用于服务器“记住”了一个糟糕计划的慢查询。'},
  {n:215,nm:'OPTION (MAXDOP)',s:'<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">HugeTable</span> <span class="kw">OPTION</span> (MAXDOP <span class="num">1</span>)',d:'限制查询使用多少个 CPU 核心。防止一个查询拖垮整台服务器。'},
  {n:216,nm:'SET NOCOUNT ON',s:'<span class="kw">SET NOCOUNT ON</span>; <span class="kw">UPDATE</span> <span class="tbl">Users</span> <span class="kw">SET</span> Name=<span class="str">\'X\'</span>',d:'静默“受影响行数”消息。在拥有数千次操作的过程中减少带宽负载。'},
  {n:217,nm:'DBCC CHECKDB',s:'<span class="fn">DBCC CHECKDB</span>(<span class="str">\'MyDatabase\'</span>)',d:'扫描磁盘上所有数据的完整性。查找文件损坏（corruption）。每周运行一次。'},
  {n:218,nm:'UPDATE STATISTICS',s:'<span class="kw">UPDATE STATISTICS</span> <span class="tbl">Customers</span>',d:'更新数据的统计图谱。加速已经开始变慢的查询。'},
  {n:219,nm:'ALTER INDEX REBUILD',s:'<span class="kw">ALTER INDEX ALL ON</span> <span class="tbl">Customers</span> <span class="kw">REBUILD</span>',d:'从头重建索引。消除碎片并恢复“第一天”的速度。期间表会被锁定。'},
  {n:220,nm:'ALTER INDEX REORGANIZE',s:'<span class="kw">ALTER INDEX</span> idx_name <span class="kw">ON</span> <span class="tbl">Customers</span> <span class="kw">REORGANIZE</span>',d:'不加锁地重新整理。比 REBUILD 更温和。用于安静的日常维护。'},
  {n:221,nm:'DBCC FREEPROCCACHE',s:'<span class="fn">DBCC FREEPROCCACHE</span>',d:'清除所有执行计划内存。用于重置因计划嗅探（plan sniffing）而变慢的服务器。'},
  {n:222,nm:'DBCC SHRINKDATABASE',s:'<span class="fn">DBCC SHRINKDATABASE</span>(<span class="str">\'MyDB\'</span>)',d:'收缩数据库并把磁盘空间归还给操作系统。在删除大量数据之后使用。'},
 ]},
 {id:'s21',t:'高级日期与时区',cc:'#ffa657',f:[
  {n:223,nm:'DATEFROMPARTS()',s:'<span class="kw">SELECT</span> <span class="fn">DATEFROMPARTS</span>(<span class="num">2023</span>, <span class="num">10</span>, <span class="num">31</span>)',d:'用 3 个独立的数字（年、月、日）构建一个日期。用于合并来自应用的独立字段。'},
  {n:224,nm:'TIMEFROMPARTS()',s:'<span class="kw">SELECT</span> <span class="fn">TIMEFROMPARTS</span>(<span class="num">14</span>, <span class="num">30</span>, <span class="num">0</span>, <span class="num">0</span>, <span class="num">0</span>)',d:'用 5 个数字构建一个时间。用于带独立时/分字段的打卡系统。'},
  {n:225,nm:'DATETIME2FROMPARTS()',s:'<span class="kw">SELECT</span> <span class="fn">DATETIME2FROMPARTS</span>(<span class="num">2023</span>,<span class="num">1</span>,<span class="num">1</span>,<span class="num">12</span>,<span class="num">0</span>,<span class="num">0</span>,<span class="num">0</span>,<span class="num">0</span>)',d:'以高精度构建完整的 DATETIME2（年+月+日+时+分+秒）。'},
  {n:226,nm:'SYSUTCDATETIME()',s:'<span class="kw">SELECT</span> <span class="fn">SYSUTCDATETIME</span>()',d:'通用 UTC 的当前时间。对面向全球用户的应用是必备。'},
  {n:227,nm:'AT TIME ZONE',s:'<span class="kw">SELECT</span> OrderDate <span class="kw">AT TIME ZONE</span> <span class="str">\'Israel Standard Time\'</span>',d:'把日期转换到某个特定时区，包含夏令时。无需手动计算。'},
  {n:228,nm:'SWITCHOFFSET()',s:'<span class="kw">SELECT</span> <span class="fn">SWITCHOFFSET</span>(<span class="col">OrderDate</span>, <span class="str">\'+03:00\'</span>)',d:'手动移动时区偏移。用于以用户的本地时间显示日期。'},
  {n:229,nm:'TODATETIMEOFFSET()',s:'<span class="kw">SELECT</span> <span class="fn">TODATETIMEOFFSET</span>(<span class="fn">GETDATE</span>(), <span class="str">\'+02:00\'</span>)',d:'把一个普通日期变成带时区身份的 DateTimeOffset。用于全球计算。'},
  {n:230,nm:'DATENAME()',s:'<span class="kw">SELECT</span> <span class="fn">DATENAME</span>(month, <span class="fn">GETDATE</span>())',d:'返回一个文本名称（January、Monday）。与返回数字的 DATEPART 不同。'},
 ]},
 {id:'s22',t:'临时表、GUID 与序列',cc:'var(--green)',f:[
  {n:231,nm:'CREATE TABLE #Temp',s:'<span class="kw">CREATE TABLE</span> #UserStats (<span class="col">ID</span> INT, <span class="col">Score</span> INT)',d:'一张本地临时表——它只存在于当前连接中。用于中间计算而不污染数据库。'},
  {n:232,nm:'CREATE TABLE ##Temp',s:'<span class="kw">CREATE TABLE</span> ##GlobalCache (<span class="col">Data</span> VARCHAR(<span class="num">100</span>))',d:'一张全局临时表——所有连接都可访问。用于在用户之间共享缓存数据。'},
  {n:233,nm:'DECLARE @Table TABLE',s:'<span class="kw">DECLARE</span> @MyList <span class="kw">TABLE</span> (EmpID INT)',d:'仅在 RAM 中的表。对少量数据非常快——不写入磁盘。'},
  {n:234,nm:'NEWID()',s:'<span class="kw">INSERT INTO</span> <span class="tbl">Users</span> (ID) <span class="kw">VALUES</span> (<span class="fn">NEWID</span>())',d:'生成一个全局唯一的 GUID。用于安全、不可猜测的 ID，以及跨服务器合并数据。'},
  {n:235,nm:'NEWSEQUENTIALID()',s:'<span class="kw">DEFAULT</span> <span class="fn">NEWSEQUENTIALID</span>()',d:'一个按升序运行的 GUID。解决 NEWID 的性能问题——保持索引有序。'},
  {n:236,nm:'CREATE SEQUENCE',s:'<span class="kw">CREATE SEQUENCE</span> InvoiceSeq <span class="kw">AS INT START WITH</span> <span class="num">1</span>',d:'一个不绑定到表的独立计数器。多张表可以共享的递增编号。'},
  {n:237,nm:'NEXT VALUE FOR',s:'<span class="kw">INSERT INTO</span> <span class="tbl">Invoices</span> (ID) <span class="kw">VALUES</span> (<span class="kw">NEXT VALUE FOR</span> InvoiceSeq)',d:'从 SEQUENCE 取下一个编号。用于无重复的编号发票。'},
  {n:238,nm:'FORMATMESSAGE()',s:'<span class="fn">FORMATMESSAGE</span>(<span class="str">\'Welcome %s, code: %i\'</span>, <span class="str">\'Dan\'</span>, <span class="num">123</span>)',d:'把变量注入文本模板。用于构建可读、集中管理的错误消息。'},
 ]},
 {id:'s23',t:'高级窗口函数',cc:'var(--yellow)',f:[
  {n:239,nm:'PERCENT_RANK()',s:'<span class="fn">PERCENT_RANK</span>() <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> Score)',d:'以百分比表示的相对排名（0-1）。“高于全班的 85%”——无需知道班级人数。'},
  {n:240,nm:'CUME_DIST()',s:'<span class="fn">CUME_DIST</span>() <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> Score)',d:'累积分布——数据中小于或等于当前值的比例。用于钟形曲线。'},
  {n:241,nm:'PERCENTILE_CONT()',s:'<span class="fn">PERCENTILE_CONT</span>(<span class="num">0.5</span>) <span class="kw">WITHIN GROUP</span> (<span class="kw">ORDER BY</span> Salary) <span class="kw">OVER</span>()',d:'带插值的百分位数。如果没有精确的中间值，则返回两个值的平均。'},
  {n:242,nm:'PERCENTILE_DISC()',s:'<span class="fn">PERCENTILE_DISC</span>(<span class="num">0.5</span>) <span class="kw">WITHIN GROUP</span> (<span class="kw">ORDER BY</span> Salary) <span class="kw">OVER</span>()',d:'精确的百分位数——只返回数据中确实存在的值。不做插值。'},
  {n:243,nm:'GROUPING()',s:'<span class="kw">SELECT</span> Dept, <span class="fn">GROUPING</span>(Dept), <span class="fn">SUM</span>(Salary) <span class="kw">GROUP BY ROLLUP</span>(Dept)',d:'对 ROLLUP 汇总行返回 1。用于区分真正的 NULL 和“总计”行。'},
  {n:244,nm:'GROUPING_ID()',s:'<span class="fn">GROUPING_ID</span>(Dep, Job) <span class="kw">GROUP BY CUBE</span>(Dep, Job)',d:'在 CUBE 中标识分组类型的二进制代码。用于对多维矩阵的行排序。'},
  {n:245,nm:'CHOOSE()',s:'<span class="kw">SELECT</span> <span class="fn">CHOOSE</span>(MonthNum, <span class="str">\'Jan\'</span>, <span class="str">\'Feb\'</span>, <span class="str">\'Mar\'</span>...) <span class="kw">FROM</span> <span class="tbl">Sales</span>',d:'按索引从列表中挑选一个值。CHOOSE(2,...) = 第二项。CASE 的简短替代。'},
  {n:246,nm:'ANY_VALUE()',s:'<span class="kw">SELECT</span> Category, <span class="fn">ANY_VALUE</span>(ManagerName) <span class="kw">FROM</span> <span class="tbl">Items</span> <span class="kw">GROUP BY</span> Category',d:'返回组中的某个值。当它们全部相同时——比把 MAX(Name) 当作间接技巧更快。'},
  {n:247,nm:'NULLS FIRST / LAST',s:'<span class="kw">ORDER BY</span> DeliveryDate <span class="kw">ASC NULLS LAST</span>',d:'控制 NULL 在排序中出现的位置。防止空白跳到报表顶部。支持：Postgres/MySQL。'},
  {n:248,nm:'Dynamic PIVOT',s:'<span class="fn">EXEC</span>(@DynamicPivotQuery)',d:'一个根据数据动态构建自身的 PIVOT。用于列事先未知的透视表。'},
 ]},

 ,{id:'s24',t:'数据复制与表操作（高级 DML）',cc:'var(--cyan)',f:[
  {n:251,nm:'SELECT TOP WITH TIES',s:'<span class="kw">SELECT TOP</span> <span class="num">3</span> <span class="kw">WITH TIES</span> * <span class="kw">FROM</span> <span class="tbl">Orders</span> <span class="kw">ORDER BY</span> Amount <span class="kw">DESC</span>',d:'返回前 N 名，包括并列。如果有 4 行并列第 3——它们全部返回。'},
  {n:252,nm:'INSERT OR IGNORE',s:'<span class="kw">INSERT OR IGNORE INTO</span> <span class="tbl">Users</span> <span class="kw">VALUES</span>(<span class="num">1</span>, <span class="str">\'Dan\'</span>)',d:'添加一行，如果它已存在——则静默忽略，不报错。SQLite/MySQL。'},
  {n:253,nm:'INSERT OR REPLACE',s:'<span class="kw">INSERT OR REPLACE INTO</span> <span class="tbl">Users</span> <span class="kw">VALUES</span>(<span class="num">1</span>, <span class="str">\'Dan\'</span>)',d:'添加一行，如果它已存在——则替换它。SQLite 中 upsert 的捷径。'},
  {n:254,nm:'UPDATE FROM (JOIN)',s:'<span class="kw">UPDATE</span> t <span class="kw">SET</span> t.Price = s.NewPrice <span class="kw">FROM</span> <span class="tbl">Products</span> t <span class="kw">JOIN</span> <span class="tbl">Source</span> s <span class="kw">ON</span> t.ID = s.ID',d:'通过 JOIN 用另一张表的数据更新一张表。用于从外部源同步价格。'},
  {n:255,nm:'DELETE WITH JOIN',s:'<span class="kw">DELETE</span> t <span class="kw">FROM</span> <span class="tbl">Orders</span> t <span class="kw">JOIN</span> <span class="tbl">Cancelled</span> c <span class="kw">ON</span> t.ID = c.ID',d:'按条件从一张被连接的表中删除行。比 NOT IN 更精确。'},
  {n:256,nm:'OUTPUT (SQL Server)',s:'<span class="kw">DELETE FROM</span> <span class="tbl">Orders</span> <span class="kw">OUTPUT DELETED</span>.* <span class="kw">WHERE</span> Status=<span class="str">\'Old\'</span>',d:'返回在操作期间被删除/更新的行。用于文档记录和变更日志。'},
  {n:257,nm:'RETURNING (PostgreSQL)',s:'<span class="kw">INSERT INTO</span> <span class="tbl">Users</span>(Name) <span class="kw">VALUES</span>(<span class="str">\'Dan\'</span>) <span class="kw">RETURNING</span> ID',d:'返回所创建行的值。PostgreSQL 中相当于 OUTPUT——用于获取新的 ID。'},
  {n:258,nm:'EXCEPT ALL',s:'<span class="kw">SELECT</span> ID <span class="kw">FROM</span> <span class="tbl">A</span> <span class="kw">EXCEPT ALL SELECT</span> ID <span class="kw">FROM</span> <span class="tbl">B</span>',d:'带重复的相减——不从结果中去除重复。比普通的 EXCEPT 更快。'},
  {n:259,nm:'INTERSECT ALL',s:'<span class="kw">SELECT</span> ID <span class="kw">FROM</span> <span class="tbl">A</span> <span class="kw">INTERSECT ALL SELECT</span> ID <span class="kw">FROM</span> <span class="tbl">B</span>',d:'带重复的交集——保留所有出现。PostgreSQL/高级引擎。'},
  {n:260,nm:'TABLESAMPLE',s:'<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Customers</span> <span class="kw">TABLESAMPLE</span> (<span class="num">10</span> PERCENT)',d:'返回表中 X 百分比的随机样本。用于在巨型表上快速测试。'},
 ]},
 {id:'s25',t:'高级数据分析（Analytics）',cc:'var(--purple)',f:[
  {n:261,nm:'RATIO_TO_REPORT()',s:'<span class="fn">RATIO_TO_REPORT</span>(Amount) <span class="kw">OVER</span>()',d:'占总数的百分比。每一行除以总计——用于某项销售占公司总额的份额。'},
  {n:262,nm:'SUM OVER (Running Total)',s:'<span class="fn">SUM</span>(Amount) <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> Date <span class="kw">ROWS UNBOUNDED PRECEDING</span>)',d:'累计总和——每一行都把它之前的全部加起来。'},
  {n:263,nm:'AVG OVER (Moving Avg)',s:'<span class="fn">AVG</span>(Amount) <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> Date <span class="kw">ROWS BETWEEN</span> <span class="num">6</span> <span class="kw">PRECEDING AND CURRENT ROW</span>)',d:'7 天移动平均。用于平滑销售数据中的季节性和趋势。'},
  {n:264,nm:'MIN/MAX OVER (Running)',s:'<span class="fn">MAX</span>(Price) <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> Date <span class="kw">ROWS UNBOUNDED PRECEDING</span>)',d:'累计的最大/最小值——在每个时间点回答“到目前为止的峰值是多少？”。'},
  {n:265,nm:'COUNT DISTINCT (Approx)',s:'<span class="fn">APPROX_COUNT_DISTINCT</span>(<span class="col">CustomerID</span>)',d:'近似的去重计数（约 2% 误差）。在大数据上比 COUNT DISTINCT 快 10 倍。'},
  {n:266,nm:'LISTAGG() / GROUP_CONCAT',s:'<span class="fn">LISTAGG</span>(Name, <span class="str">\', \'</span>) <span class="kw">WITHIN GROUP</span> (<span class="kw">ORDER BY</span> Name)',d:'把行合并成一个有序列表。Oracle/PostgreSQL——带内部排序的 STRING_AGG。'},
  {n:267,nm:'PIVOT with SUM/COUNT/AVG',s:'<span class="fn">SUM</span>(Amount) <span class="kw">FOR</span> Quarter <span class="kw">IN</span> ([Q1],[Q2],[Q3],[Q4])',d:'带多种函数的透视——不只是 SUM。用于灵活的多维报表。'},
  {n:268,nm:'CROSS APPLY',s:'<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Customers</span> c <span class="kw">CROSS APPLY</span> (<span class="kw">SELECT TOP</span> <span class="num">3</span> * <span class="kw">FROM</span> <span class="tbl">Orders</span> o <span class="kw">WHERE</span> o.CustID=c.ID) t',d:'为每一行运行一个子查询。像 JOIN 但带相关性——用于每位客户的 TOP N。'},
  {n:269,nm:'OUTER APPLY',s:'<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Customers</span> c <span class="kw">OUTER APPLY</span> (...) t',d:'像 CROSS APPLY，但也返回没有匹配的行（类似 LEFT JOIN）。'},
  {n:270,nm:'GENERATE_SERIES()',s:'<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="fn">GENERATE_SERIES</span>(<span class="num">1</span>, <span class="num">12</span>)',d:'生成一串数字/日期序列。用于日历和在缺失日期上没有“空洞”的报表。'},
 ]},
 {id:'s26',t:'全文搜索与文本检索',cc:'var(--orange)',f:[
  {n:271,nm:'CONTAINS()',s:'<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Articles</span> <span class="kw">WHERE</span> <span class="fn">CONTAINS</span>(Body, <span class="str">\'SQL AND performance\'</span>)',d:'高级全文搜索。因为使用文本索引，所以比 LIKE 更快。支持 AND/OR/NOT。'},
  {n:272,nm:'FREETEXT()',s:'<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Docs</span> <span class="kw">WHERE</span> <span class="fn">FREETEXT</span>(Content, <span class="str">\'database optimization\'</span>)',d:'自由形式的搜索——也能找到词形变化和相关词。比 CONTAINS 不够精确但更灵活。'},
  {n:273,nm:'CONTAINSTABLE()',s:'<span class="kw">SELECT</span> k.RANK, t.* <span class="kw">FROM</span> <span class="tbl">Docs</span> t <span class="kw">JOIN</span> <span class="fn">CONTAINSTABLE</span>(<span class="tbl">Docs</span>,*,<span class="str">\'SQL\'</span>) k <span class="kw">ON</span> t.ID=k.[KEY]',d:'像 CONTAINS，但返回相关性排名。用于带匹配评分的搜索引擎。'},
  {n:274,nm:'FREETEXTTABLE()',s:'<span class="kw">JOIN</span> <span class="fn">FREETEXTTABLE</span>(<span class="tbl">Docs</span>,*,<span class="str">\'query\'</span>) k <span class="kw">ON</span> t.ID=k.[KEY]',d:'带排名的 FREETEXT。用于 Google 式搜索——返回按相关性排序的结果。'},
  {n:275,nm:'MATCH...AGAINST (MySQL)',s:'<span class="kw">WHERE</span> <span class="fn">MATCH</span>(title, body) <span class="kw">AGAINST</span>(<span class="str">\'SQL performance\'</span>)',d:'MySQL 中的全文搜索。需要在列上建立 FULLTEXT 索引。比 LIKE 快得多。'},
  {n:276,nm:'LIKE with Escape',s:'<span class="kw">WHERE</span> Name <span class="kw">LIKE</span> <span class="str">\'100\\%\'</span> <span class="kw">ESCAPE</span> <span class="str">\'\\\'</span>',d:'搜索字面的 % 字符（不是通配符）。用于把 “100%” 当作字面文本来搜索。'},
  {n:277,nm:'REGEXP / RLIKE (MySQL)',s:'<span class="kw">WHERE</span> Email <span class="fn">REGEXP</span> <span class="str">\'^[a-zA-Z]+@\'</span>',d:'用正则表达式进行搜索。用于验证复杂格式——邮箱、电话、产品代码。'},
  {n:278,nm:'SIMILAR TO (PostgreSQL)',s:'<span class="kw">WHERE</span> Code <span class="kw">SIMILAR TO</span> <span class="str">\'[A-Z]{3}-[0-9]+\'</span>',d:'SQL 标准风格的正则表达式。在 PostgreSQL 中——介于 LIKE 和 REGEXP 之间。'},
 ]},
 {id:'s27',t:'高级索引与优化',cc:'#ff7b72',f:[
  {n:279,nm:'CREATE FILTERED INDEX',s:'<span class="kw">CREATE INDEX</span> idx_active <span class="kw">ON</span> <span class="tbl">Users</span>(Name) <span class="kw">WHERE</span> Status=<span class="str">\'Active\'</span>',d:'只针对一个子集的索引。更小更快——用于总是按固定条件筛选的查询。'},
  {n:280,nm:'CREATE COLUMNSTORE INDEX',s:'<span class="kw">CREATE COLUMNSTORE INDEX</span> idx_col <span class="kw">ON</span> <span class="tbl">Sales</span>(Date, Amount)',d:'用于分析的列式索引。在数据仓库的 GROUP BY/SUM 上快 10-100 倍。'},
  {n:281,nm:'CREATE COVERING INDEX',s:'<span class="kw">CREATE INDEX</span> idx_cov <span class="kw">ON</span> <span class="tbl">Orders</span>(CustID) <span class="kw">INCLUDE</span>(Amount, Date)',d:'一个在 INCLUDE 中带额外列的索引。避免读取表本身——查询更快。'},
  {n:282,nm:'EXPLAIN / EXECUTION PLAN',s:'<span class="kw">EXPLAIN SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Users</span> <span class="kw">WHERE</span> ID=<span class="num">1</span>',d:'显示查询的执行计划。用于发现不必要的全表扫描和缺失的索引。'},
  {n:283,nm:'SET STATISTICS IO ON',s:'<span class="kw">SET STATISTICS IO ON</span>; <span class="kw">SELECT</span> ...',d:'显示读取了多少个磁盘页。用于查找导致变慢的高 I/O 查询。'},
  {n:284,nm:'SET STATISTICS TIME ON',s:'<span class="kw">SET STATISTICS TIME ON</span>; <span class="kw">SELECT</span> ...',d:'显示 CPU 和解析时间。用于对慢查询进行精确的性能分析。'},
  {n:285,nm:'WITH (FORCESCAN)',s:'<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">T</span> <span class="kw">WITH</span> (FORCESCAN)',d:'即使存在索引也强制全表扫描。用于全扫描更快的情况（小表）。'},
  {n:286,nm:'WITH (FORCESEEK)',s:'<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">T</span> <span class="kw">WITH</span> (FORCESEEK)',d:'强制使用某个索引。当引擎判断失误而选择扫描时——FORCESEEK 能修正它。'},
  {n:287,nm:'sp_updatestats',s:'<span class="kw">EXEC</span> sp_updatestats',d:'更新数据库中所有表的统计信息。在大量数据加载之后使用。'},
 ]},
 {id:'s28',t:'高级存储过程与函数',cc:'var(--green)',f:[
  {n:288,nm:'CREATE OR ALTER PROCEDURE',s:'<span class="kw">CREATE OR ALTER PROCEDURE</span> GetOrders <span class="kw">AS</span> ...',d:'用单个命令创建一个过程，或替换一个已有的过程。无需单独的 DROP-CREATE。'},
  {n:289,nm:'Procedure with OUTPUT',s:'<span class="kw">CREATE PROCEDURE</span> Calc (@In INT, @Out INT <span class="kw">OUTPUT</span>) <span class="kw">AS SET</span> @Out = @In * <span class="num">2</span>',d:'一个通过 OUTPUT 参数返回值的过程。用于需要返回多个值的计算。'},
  {n:290,nm:'Procedure with DEFAULT',s:'<span class="kw">CREATE PROCEDURE</span> GetData (@Days INT = <span class="num">30</span>) <span class="kw">AS</span> ...',d:'一个带默认值的参数。你可以不带参数调用它——它会自动取 30 天。'},
  {n:291,nm:'Inline Table-Valued Function',s:'<span class="kw">CREATE FUNCTION</span> GetOrders(@ID INT) <span class="kw">RETURNS TABLE AS RETURN</span> (<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Orders</span> <span class="kw">WHERE</span> CustID=@ID)',d:'一个返回表的函数。你可以像对普通表一样对它做 JOIN。非常快。'},
  {n:292,nm:'Multi-Statement TVF',s:'<span class="kw">CREATE FUNCTION</span> GetData() <span class="kw">RETURNS</span> @t <span class="kw">TABLE</span>(...) <span class="kw">AS BEGIN INSERT INTO</span> @t ... <span class="kw">RETURN END</span>',d:'一个带复杂逻辑、返回表的函数。比内联式更灵活但更慢。'},
  {n:293,nm:'EXEC with variables',s:'<span class="kw">EXEC</span> (@SQL)',d:'从字符串运行动态 SQL。用于在运行时构建灵活的查询。'},
  {n:294,nm:'sp_executesql',s:'<span class="kw">EXEC</span> sp_executesql @SQL, <span class="str">\'@ID INT\'</span>, @ID=<span class="num">5</span>',d:'带参数的动态 SQL。比普通的 EXEC 更安全——防止 SQL 注入。'},
  {n:295,nm:'sys.procedures',s:'<span class="kw">SELECT</span> * <span class="kw">FROM</span> sys.procedures',d:'数据库中所有过程的列表。用于文档记录和审查现有代码。'},
 ]},
 {id:'s29',t:'触发器',cc:'var(--yellow)',f:[
  {n:296,nm:'CREATE TRIGGER (AFTER INSERT)',s:'<span class="kw">CREATE TRIGGER</span> trg_ins <span class="kw">ON</span> <span class="tbl">Orders</span> <span class="kw">AFTER INSERT AS</span> ...',d:'一个在 INSERT 之后自动运行的触发器。用于自动事件——发送邮件、更新日志。'},
  {n:297,nm:'CREATE TRIGGER (INSTEAD OF)',s:'<span class="kw">CREATE TRIGGER</span> trg_v <span class="kw">ON</span> MyView <span class="kw">INSTEAD OF INSERT AS</span> ...',d:'替换另一个操作。用于允许在原本不直接支持的视图上做 INSERT。'},
  {n:298,nm:'INSERTED / DELETED tables',s:'<span class="kw">SELECT</span> * <span class="kw">FROM</span> INSERTED; <span class="kw">SELECT</span> * <span class="kw">FROM</span> DELETED',d:'触发器内部保存被插入/删除数据的虚拟表。用于保存旧值。'},
  {n:299,nm:'DISABLE TRIGGER',s:'<span class="kw">DISABLE TRIGGER</span> trg_ins <span class="kw">ON</span> <span class="tbl">Orders</span>',d:'临时禁用一个触发器。用于批量数据导入而不触发自动逻辑。'},
  {n:300,nm:'DDL TRIGGER',s:'<span class="kw">CREATE TRIGGER</span> trg_ddl <span class="kw">ON DATABASE FOR</span> DROP_TABLE <span class="kw">AS</span> ...',d:'针对 DROP TABLE 等 DDL 操作的触发器。用于防止生产环境中的意外删除。'},
 ]},
 {id:'s30',t:'分区 —— 拆分表',cc:'var(--blue)',f:[
  {n:301,nm:'CREATE PARTITION FUNCTION',s:'<span class="kw">CREATE PARTITION FUNCTION</span> pf_year(INT) <span class="kw">AS RANGE RIGHT FOR VALUES</span>(<span class="num">2021</span>,<span class="num">2022</span>,<span class="num">2023</span>)',d:'为分区定义范围。用于按年/月把一张巨型表拆分成多个部分。'},
  {n:302,nm:'CREATE PARTITION SCHEME',s:'<span class="kw">CREATE PARTITION SCHEME</span> ps_year <span class="kw">AS PARTITION</span> pf_year <span class="kw">ALL TO</span> ([PRIMARY])',d:'给每个分区分配文件组。创建分区表的第二步。'},
  {n:303,nm:'CREATE TABLE ON Partition',s:'<span class="kw">CREATE TABLE</span> <span class="tbl">Sales</span>(Date INT) <span class="kw">ON</span> ps_year(Date)',d:'创建一张分区表。SQL 会根据行的值自动管理它存储在哪里。'},
  {n:304,nm:'Partition Elimination',s:'<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Sales</span> <span class="kw">WHERE</span> Year=<span class="num">2023</span>',d:'SQL 只读取相关的分区，跳过其余的。在巨型表上快 10 倍以上。'},
  {n:305,nm:'ALTER TABLE SWITCH PARTITION',s:'<span class="kw">ALTER TABLE</span> <span class="tbl">Sales</span> <span class="kw">SWITCH PARTITION</span> <span class="num">1</span> <span class="kw">TO</span> <span class="tbl">SalesArchive</span>',d:'以 O(1) 在表之间移动整个分区。用于即时归档旧数据。'},
 ]},

function render(data){
  const c=document.getElementById('content');
  c.innerHTML='';
  data.forEach(cat=>{
    if(!cat.f.length)return;
    const s=document.createElement('section');
    s.className='sec';s.id=cat.id;
    s.innerHTML=`<div class="sec-hdr">
      <span class="sec-badge" style="background:color-mix(in srgb,${cat.cc} 15%,transparent);color:${cat.cc};border:1px solid color-mix(in srgb,${cat.cc} 30%,transparent)">${cat.id.replace('s','')}</span>
      <h2 class="sec-title">${cat.t}</h2>
      <span class="sec-cnt">${cat.f.length} functions</span>
    </div>
    <div class="cards">${cat.f.map(f=>`<div class="card" style="--cc:${cat.cc}">
      <div class="ch"><span class="cnum">#${f.n}</span><span class="cname">${f.nm}</span></div>
      <div class="csyn">${f.s}</div>
      <div class="cdesc">${f.d}</div>
    </div>`).join('')}</div>`;
    c.appendChild(s);
  });
}

function search(q){
  const v=q.trim().toLowerCase();
  const nr=document.getElementById('nr');
  if(!v){render(D);nr.style.display='none';return;}
  const res=D.map(cat=>({...cat,f:cat.f.filter(f=>
    f.nm.toLowerCase().includes(v)||f.d.toLowerCase().includes(v)||f.s.replace(/<[^>]+>/g,'').toLowerCase().includes(v)
  )})).filter(cat=>cat.f.length>0);
  render(res);
  nr.style.display=res.length===0?'block':'none';
}

// Active highlight on scroll
const obs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      document.querySelectorAll('.cbtn').forEach(b=>b.classList.remove('active'));
      const b=document.querySelector(`.cbtn[href="#${e.target.id}"]`);
      if(b){b.classList.add('active');b.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});}
    }
  });
},{threshold:0.1,rootMargin:'-80px 0px -50% 0px'});

render(D);
document.querySelectorAll('.sec').forEach(s=>obs.observe(s));
</script>
