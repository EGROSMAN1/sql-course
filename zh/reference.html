<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080C14;--bg2:#0D1220;--bg3:#111828;--bg4:#16202E;
  --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);
  --text:#F1F5FF;--text2:#8896AA;--text3:#2A3450;
  --cyan:#00E5FF;--green:#00E5A0;--green2:#00b380;
  --orange:#FFB020;--yellow:#FFB020;--red:#FF4060;--purple:#9B5CFF;
  --purple:#d2a8ff;--teal:#00d4aa;--blue:#2D6FFF;
  --font:'Heebo',sans-serif;--mono:'IBM Plex Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.6}
.topnav{background:rgba(8,12,20,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:.6rem 1.5rem;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:200;flex-wrap:wrap;height:48px}
.back{color:var(--cyan);text-decoration:none;font-size:12px;font-weight:700;font-family:var(--mono)}
.ntitle{font-size:13px;font-weight:700;color:var(--text2)}
.nlinks{display:flex;gap:.75rem;margin-right:auto}
.nlink{color:var(--text3);text-decoration:none;font-size:12px;font-weight:600;transition:color .15s}
.nlink:hover{color:var(--cyan)}
.hero{padding:2.5rem 2rem 2rem;text-align:center;background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(10,58,110,.25),transparent 70%);border-bottom:1px solid var(--border)}
.hero h1{font-size:2rem;font-weight:900;margin-bottom:.4rem}
.hero h1 span{color:var(--cyan)}
.hero p{color:var(--text2);font-size:14px;max-width:580px;margin:0 auto 1.2rem}
.hstats{display:flex;gap:2rem;justify-content:center;flex-wrap:wrap}
.hs{text-align:center}
.hs-n{font-size:1.7rem;font-weight:900;color:var(--cyan);font-family:var(--mono)}
.hs-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
/* CAT NAV */
.catnav{position:sticky;top:48px;z-index:100;background:rgba(13,20,32,.98);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:.45rem 1rem;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.catnav::-webkit-scrollbar{display:none}
.cbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border2);color:var(--text3);padding:.25rem .75rem;border-radius:20px;font-family:var(--font);font-size:11.5px;font-weight:700;cursor:pointer;transition:all .15s;margin-left:.35rem;text-decoration:none;background:transparent}
.cbtn:hover{border-color:var(--border);color:var(--text2)}
.cbtn.active{background:color-mix(in srgb,var(--cc) 15%,transparent);border-color:var(--cc);color:var(--cc)}
/* SEARCH */
.main{max-width:1100px;margin:0 auto;padding:1.5rem 1.5rem 4rem}
.srch{margin-bottom:1.5rem;position:relative}
.srch input{width:100%;background:var(--bg2);border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:13px;padding:.55rem 1rem .55rem 2.4rem;border-radius:10px;outline:none;transition:border .15s}
.srch input:focus{border-color:var(--cyan)}
.srch input::placeholder{color:var(--text3)}
.srch-ico{position:absolute;right:.8rem;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}
.no-res{text-align:center;color:var(--text3);padding:2rem;font-size:13px;display:none}
/* SECTION */
.sec{margin-bottom:2.5rem}
.sec-hdr{display:flex;align-items:center;gap:.85rem;margin-bottom:1.1rem;padding-bottom:.65rem;border-bottom:2px solid var(--border)}
.sec-badge{font-size:11px;font-family:var(--mono);font-weight:700;padding:3px 9px;border-radius:4px;flex-shrink:0}
.sec-title{font-size:1.1rem;font-weight:800;color:var(--text)}
.sec-cnt{font-size:10px;color:var(--text3);font-family:var(--mono);margin-right:auto}
/* CARDS */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.85rem}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1rem 1.1rem;transition:all .15s;position:relative;overflow:hidden}
.card:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.card::before{content:'';position:absolute;top:0;right:0;width:3px;height:100%;background:var(--cc,var(--border2))}
.ch{display:flex;align-items:flex-start;gap:.65rem;margin-bottom:.65rem}
.cnum{font-size:9.5px;font-family:var(--mono);color:var(--text3);background:var(--bg3);padding:2px 6px;border-radius:3px;flex-shrink:0;margin-top:2px}
.cname{font-size:13.5px;font-weight:800;color:var(--text);font-family:var(--mono)}
.csyn{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:.5rem .75rem;font-family:var(--mono);font-size:11px;direction:ltr;text-align:left;margin-bottom:.6rem;overflow-x:auto;white-space:nowrap;color:var(--purple)}
.csyn::-webkit-scrollbar{height:3px}
.csyn::-webkit-scrollbar-thumb{background:var(--border2)}
.cdesc{font-size:12px;color:var(--text2);line-height:1.6}
.kw{color:#ff7b72}.fn{color:#56d364}.tbl{color:#ffa657}.col{color:#79c0ff}.str{color:#a5d6ff}.num{color:#f2cc60}.cmt{color:var(--text3);font-style:italic}
.bktop{position:fixed;bottom:1.5rem;left:1.5rem;background:var(--bg3);border:1px solid var(--border2);color:var(--text2);width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;transition:all .15s;text-decoration:none;z-index:100}
.bktop:hover{border-color:var(--cyan);color:var(--cyan)}
@media(max-width:768px){
  .topnav{height:auto;flex-wrap:wrap}
  .nlinks{display:none}
  .hero{padding:1.5rem .75rem}
  .hero h1{font-size:1.4rem}
  .cards{grid-template-columns:1fr}
  .main{padding:1rem .75rem 3rem}
  .catnav{padding:.35rem .5rem}
  .cbtn{font-size:10.5px;padding:.2rem .55rem}
}

/* ===== MOBILE RESPONSIVE ===== */
@media(max-width:768px){
  /* Topnav */
  .topnav{padding:.5rem .75rem;flex-wrap:wrap;gap:.4rem;height:auto}
  .topnav-links,.nav-links-desktop{display:none!important}
  .topnav-title{font-size:12px;max-width:calc(100% - 120px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .back-btn{font-size:11px}
  .hamburger{display:flex!important}
  
  /* Layout */
  .main,.main-content,.content{padding:.75rem .6rem 3rem!important}
  .layout{flex-direction:column!important}
  .sidebar-left,.sidebar{display:none!important}
  
  /* Typography */
  h1{font-size:1.5rem!important;line-height:1.2}
  h2{font-size:1.25rem!important}
  h3{font-size:1.05rem!important}
  pre,code{font-size:11px!important;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
  
  /* Tables */
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  
  /* Practice page */
  .lesson-tabs{overflow-x:auto;flex-wrap:nowrap!important;gap:.25rem;padding:.25rem .5rem}
  .lesson-tab{font-size:11px!important;padding:.5rem .6rem!important;white-space:nowrap;flex-shrink:0}
  .lesson-badge{display:none!important}
  .q-card{padding:.85rem!important}
  .q-text{font-size:13.5px!important;line-height:1.6}
  .q-hint,.q-answer{font-size:12.5px!important;padding:.6rem .75rem!important}
  .q-actions{flex-wrap:wrap;gap:.4rem}
  .q-meta{flex-wrap:wrap;gap:.3rem}
  .section-divider{padding:.5rem .6rem!important;font-size:13px!important}
  
  /* Quiz pages */
  .quiz-container,.quiz-wrap{padding:.75rem!important}
  .question-card{padding:1rem!important;border-radius:10px}
  .q-text,.question-text{font-size:14px!important;line-height:1.6}
  .options,.answers{gap:.5rem!important}
  .option-btn,.answer-btn{font-size:13px!important;padding:.7rem .85rem!important;text-align:right;border-radius:8px}
  .explain-box{font-size:12.5px!important;padding:.65rem .85rem!important}
  .hero-title,.quiz-title{font-size:1.5rem!important}
  .hero-stats,.quiz-stats{gap:.6rem!important;flex-wrap:wrap}
  .hero-stat-num,.stat-number{font-size:1.4rem!important}
  .finish-card{padding:1.5rem 1rem!important}
  .finish-score{font-size:2.2rem!important}
  .hero,.quiz-hero{padding:2rem .75rem 1.5rem!important}
  
  /* Videos pages */
  .video-grid{grid-template-columns:1fr!important}
  .filter-row,.filter-bar{flex-wrap:wrap!important;gap:.35rem!important}
  .filter-btn{font-size:11px!important;padding:.25rem .6rem!important}
  .video-card,.vid-card{border-radius:8px}
  .video-thumb,.vid-thumb{border-radius:8px 8px 0 0}
  
  /* Course / Study / Lessons */
  .chapter,.section-block{padding:.85rem!important}
  .code-block,.sql-block{margin:.5rem 0!important;border-radius:8px!important;font-size:11.5px!important}
  .tip-box,.note-box,.info-box{padding:.75rem!important;font-size:13px}
  .step-body p{font-size:13px!important}
  .file-grid{grid-template-columns:1fr!important}
  .progress-section{flex-direction:column!important;gap:.75rem!important}
  
  /* Reference page */
  .cards{grid-template-columns:1fr!important}
  .catnav,.cat-nav{padding:.3rem .5rem!important}
  .cbtn,.cat-btn{font-size:10.5px!important;padding:.2rem .55rem!important}
  
  /* Setup page */
  .steps-grid{grid-template-columns:1fr!important}
  .step-card{padding:1rem!important}
  
  /* General touch improvements */
  a,button{min-height:40px}
  .btn,.button{padding:.65rem 1.1rem!important;font-size:13px!important}
  img{max-width:100%;height:auto}
  
  /* Score badges */
  .score-badge,.badge{font-size:11px!important;padding:3px 8px!important}
  
  /* Bottom padding for mobile */
  body{padding-bottom:env(safe-area-inset-bottom)}
}

@media(max-width:480px){
  .topnav-title{font-size:11px}
  .q-text,.question-text{font-size:13px!important}
  .option-btn,.answer-btn{font-size:12.5px!important}
  .hero-title,.quiz-title{font-size:1.3rem!important}
  pre,code{font-size:10.5px!important}
  .main,.main-content,.content{padding:.6rem .5rem 2.5rem!important}
}

/* trilingual flag toggle — compact on mobile (3 langs) */
@media(max-width:560px){
  a[title="עברית"],a[title="English"],a[title="中文"]{font-size:11px;padding:3px 7px;gap:3px}
  a[title="עברית"] svg,a[title="English"] svg,a[title="中文"] svg{width:16px;height:11px}
  .lang-flags{flex-wrap:wrap;gap:4px}

  a[title="עברית"] svg,a[title="English"] svg,a[title="中文"] svg{width:18px;height:12px}
}

<div class="seo-static" aria-hidden="false"><section><h2>DML —— 检索、插入与更新数据</h2><article><h3>SELECT</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="col">FirstName</span>, <span class="col">LastName</span> <span class="kw">FROM</span> <span class="tbl">Employees</span></pre><p>SQL 中最核心的数据检索命令。指定具体的列能节省服务器资源，并只返回你需要的精确数据。</p></article><article><h3>FROM</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="col">City</span> <span class="kw">FROM</span> <span class="tbl">Customers</span></pre><p>把 SQL 引擎指向数据源——要搜索哪张表、视图或哪一组表。没有它，查询就没有方向。</p></article><article><h3>INSERT INTO</h3><pre dir="ltr"><span class="kw">INSERT INTO</span> <span class="tbl">Customers</span> (<span class="col">Name</span>, <span class="col">City</span>) <span class="kw">VALUES</span> (<span class="str">'Dan'</span>, <span class="str">'Haifa'</span>)</pre><p>用于向表中插入新行。重要：列的顺序必须与 VALUES 中值的顺序完全对应。</p></article><article><h3>UPDATE</h3><pre dir="ltr"><span class="kw">UPDATE</span> <span class="tbl">Products</span> <span class="kw">SET</span> <span class="col">Price</span> = <span class="num">150</span> <span class="kw">WHERE</span> <span class="col">ID</span> = <span class="num">1</span></pre><p>用于编辑现有数据。关键：务必使用 WHERE——否则你会覆盖表中的每一行！</p></article><article><h3>DELETE</h3><pre dir="ltr"><span class="kw">DELETE FROM</span> <span class="tbl">Orders</span> <span class="kw">WHERE</span> <span class="col">Status</span> = <span class="str">'Canceled'</span></pre><p>永久删除行。如果忘记 WHERE，有大规模删除的风险。</p></article><article><h3>DISTINCT</h3><pre dir="ltr"><span class="kw">SELECT DISTINCT</span> <span class="col">City</span> <span class="kw">FROM</span> <span class="tbl">Customers</span></pre><p>清除重复，只返回唯一值的列表。</p></article><article><h3>SELECT INTO</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">INTO</span> <span class="tbl">BackupTable</span> <span class="kw">FROM</span> <span class="tbl">OriginalTable</span></pre><p>创建一张新表并同时把数据复制进去。适合快速备份和临时工作。</p></article><article><h3>INSERT INTO SELECT</h3><pre dir="ltr"><span class="kw">INSERT INTO</span> <span class="tbl">Archive</span> <span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Orders</span> <span class="kw">WHERE</span> <span class="col">Year</span> = <span class="num">2020</span></pre><p>从一张表读取并推入一张已有的表。适合归档和数据迁移流程。</p></article><article><h3>MERGE</h3><pre dir="ltr"><span class="kw">MERGE</span> <span class="tbl">Target</span> t <span class="kw">USING</span> <span class="tbl">Source</span> s <span class="kw">ON</span> t.ID = s.ID <span class="kw">WHEN MATCHED THEN UPDATE</span>...</pre><p>“Upsert”——找到匹配：更新它；没找到：插入它。省去复杂的逻辑。</p></article><article><h3>AS (Alias)</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="col">FirstName</span> <span class="kw">AS</span> Name <span class="kw">FROM</span> <span class="tbl">Employees</span> e</pre><p>列或表的临时名称。让标题更清晰，并在 JOIN 中缩短冗长的名称。</p></article></section><section><h2>筛选与逻辑运算符</h2><article><h3>WHERE</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Products</span> <span class="kw">WHERE</span> <span class="col">Price</span> &gt; <span class="num">100</span></pre><p>主要的筛选引擎。它检查每一行，只放行条件为真的记录。</p></article><article><h3>AND</h3><pre dir="ltr"><span class="kw">WHERE</span> <span class="col">Category</span> = <span class="str">'Toys'</span> <span class="kw">AND</span> <span class="col">Price</span> &lt; <span class="num">50</span></pre><p>要求所有条件同时成立。只有全部满足的行才会显示。</p></article><article><h3>OR</h3><pre dir="ltr"><span class="kw">WHERE</span> <span class="col">City</span> = <span class="str">'Haifa'</span> <span class="kw">OR</span> <span class="col">City</span> = <span class="str">'Eilat'</span></pre><p>只要其中一个条件成立即可。与 AND 组合时务必使用括号。</p></article><article><h3>NOT</h3><pre dir="ltr"><span class="kw">WHERE NOT</span> <span class="col">Category</span> = <span class="str">'Food'</span></pre><p>对条件取反。当定义“你不想要什么”更容易时很有用。</p></article><article><h3>IN</h3><pre dir="ltr"><span class="kw">WHERE</span> <span class="col">Department</span> <span class="kw">IN</span> (<span class="str">'HR'</span>, <span class="str">'Sales'</span>, <span class="str">'IT'</span>)</pre><p>一连串 OR 的简洁替代。接受一组值，检查值是否匹配其中之一。</p></article><article><h3>NOT IN</h3><pre dir="ltr"><span class="kw">WHERE</span> <span class="col">Country</span> <span class="kw">NOT IN</span> (<span class="str">'USA'</span>, <span class="str">'UK'</span>)</pre><p>确保值不在列表中。用于过滤掉并排除一组 ID。</p></article><article><h3>BETWEEN</h3><pre dir="ltr"><span class="kw">WHERE</span> <span class="col">OrderDate</span> <span class="kw">BETWEEN</span> <span class="str">'2023-01-01'</span> <span class="kw">AND</span> <span class="str">'2023-12-31'</span></pre><p>一个连续的筛选范围，包含边界值。常用于日期和价格范围。</p></article><article><h3>NOT BETWEEN</h3><pre dir="ltr"><span class="kw">WHERE</span> <span class="col">Age</span> <span class="kw">NOT BETWEEN</span> <span class="num">20</span> <span class="kw">AND</span> <span class="num">30</span></pre><p>检索范围之外的数据。用于查找统计上的离群值。</p></article><article><h3>LIKE</h3><pre dir="ltr"><span class="kw">WHERE</span> <span class="col">Email</span> <span class="kw">LIKE</span> <span class="str">'%@gmail.com'</span></pre><p>灵活的字符串搜索。% = 任意字符序列。_ = 单个字符。</p></article><article><h3>NOT LIKE</h3><pre dir="ltr"><span class="kw">WHERE</span> <span class="col">Address</span> <span class="kw">NOT LIKE</span> <span class="str">'%PO Box%'</span></pre><p>过滤掉包含某种模式的记录。用于数据清理。</p></article><article><h3>IS NULL</h3><pre dir="ltr"><span class="kw">WHERE</span> <span class="col">DeliveryDate</span> <span class="kw">IS NULL</span></pre><p>NULL = “数据不存在”。你不能用 = 来比较它。IS NULL 能找到空单元格。</p></article><article><h3>IS NOT NULL</h3><pre dir="ltr"><span class="kw">WHERE</span> <span class="col">PhoneNumber</span> <span class="kw">IS NOT NULL</span></pre><p>查找包含某些内容的行。用于清理报表和分析完整的数据。</p></article><article><h3>= equals</h3><pre dir="ltr"><span class="kw">WHERE</span> <span class="col">Status</span> = <span class="str">'Active'</span></pre><p>基本的比较运算符。要求完全匹配。</p></article><article><h3><> / != not equal</h3><pre dir="ltr"><span class="kw">WHERE</span> <span class="col">Role</span> &lt;&gt; <span class="str">'Admin'</span></pre><p>这两种写法完全相同。显示所有不等于指定值的内容。</p></article><article><h3>> greater than</h3><pre dir="ltr"><span class="kw">WHERE</span> <span class="col">Amount</span> &gt; <span class="num">1000</span></pre><p>高于参考点的值。不包含该值本身。</p></article><article><h3>< less than</h3><pre dir="ltr"><span class="kw">WHERE</span> <span class="col">InventoryLevel</span> &lt; <span class="num">10</span></pre><p>低于参考点的值。用于对即将耗尽的库存发出警报。</p></article><article><h3>>= greater than or equal</h3><pre dir="ltr"><span class="kw">WHERE</span> <span class="col">Age</span> &gt;= <span class="num">18</span></pre><p>包含阈值本身。定义最低门槛的正确方式。</p></article><article><h3><= less than or equal</h3><pre dir="ltr"><span class="kw">WHERE</span> <span class="col">Discount</span> &lt;= <span class="num">0.5</span></pre><p>设定上限。折扣最多 50%（含）的产品。</p></article><article><h3>EXISTS</h3><pre dir="ltr"><span class="kw">WHERE EXISTS</span> (<span class="kw">SELECT</span> <span class="num">1</span> <span class="kw">FROM</span> <span class="tbl">Orders</span> o <span class="kw">WHERE</span> o.CustID = c.ID)</pre><p>检查“是否存在？”。非常快——它在第一个匹配处就停止。在许多情况下优于 JOIN。</p></article><article><h3>NOT EXISTS</h3><pre dir="ltr"><span class="kw">WHERE NOT EXISTS</span> (<span class="kw">SELECT</span> <span class="num">1</span> <span class="kw">FROM</span> <span class="tbl">Orders</span> o <span class="kw">WHERE</span> o.CustID = c.ID)</pre><p>在另一张表中没有任何踪迹的实体。在性能上通常优于 NOT IN。</p></article><article><h3>ANY</h3><pre dir="ltr"><span class="kw">WHERE</span> <span class="col">Price</span> &gt; <span class="kw">ANY</span> (<span class="kw">SELECT</span> <span class="col">Price</span> <span class="kw">FROM</span> <span class="tbl">Competitors</span>)</pre><p>针对一组结果进行比较。只要条件对至少一个值成立即可。</p></article><article><h3>ALL</h3><pre dir="ltr"><span class="kw">WHERE</span> <span class="col">Price</span> &gt; <span class="kw">ALL</span> (<span class="kw">SELECT</span> <span class="col">Price</span> <span class="kw">FROM</span> <span class="tbl">Competitors</span>)</pre><p>更严格——条件必须对列表中的每一个值都成立，无一例外。</p></article></section><section><h2>排序、分组与输出格式化</h2><article><h3>ORDER BY</h3><pre dir="ltr"><span class="kw">ORDER BY</span> <span class="col">LastName</span>, <span class="col">FirstName</span></pre><p>按逻辑顺序组织结果。没有 ORDER BY，SQL 会以任意顺序返回行。</p></article><article><h3>ASC</h3><pre dir="ltr"><span class="kw">ORDER BY</span> <span class="col">Price</span> <span class="kw">ASC</span></pre><p>升序排序——从小到大、A 到 Z。这是默认值，可以省略。</p></article><article><h3>DESC</h3><pre dir="ltr"><span class="kw">ORDER BY</span> <span class="col">OrderDate</span> <span class="kw">DESC</span></pre><p>降序排序。把最新、最赚钱或最高的排在最前面。</p></article><article><h3>TOP</h3><pre dir="ltr"><span class="kw">SELECT TOP</span> <span class="num">10</span> * <span class="kw">FROM</span> <span class="tbl">Customers</span> <span class="kw">ORDER BY</span> <span class="col">Score</span> <span class="kw">DESC</span></pre><p>只取前 X 行（SQL Server）。配合 ORDER BY DESC——就是“前 10 名”。</p></article><article><h3>LIMIT</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Customers</span> <span class="kw">ORDER BY</span> <span class="col">Score</span> <span class="kw">DESC</span> <span class="kw">LIMIT</span> <span class="num">10</span></pre><p>MySQL/PostgreSQL 中相当于 TOP。始终放在查询的末尾。</p></article><article><h3>OFFSET</h3><pre dir="ltr"><span class="kw">ORDER BY</span> <span class="col">ID</span> <span class="kw">OFFSET</span> <span class="num">20</span> <span class="kw">ROWS</span></pre><p>跳过 X 行。分页机制的一部分——翻阅结果页。</p></article><article><h3>FETCH NEXT</h3><pre dir="ltr"><span class="kw">OFFSET</span> <span class="num">20</span> <span class="kw">ROWS FETCH NEXT</span> <span class="num">10</span> <span class="kw">ROWS ONLY</span></pre><p>与 OFFSET 配合。定义跳过之后要取多少行。</p></article><article><h3>GROUP BY</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="col">Category</span>, <span class="fn">COUNT</span>(*) <span class="kw">FROM</span> <span class="tbl">Products</span> <span class="kw">GROUP BY</span> <span class="col">Category</span></pre><p>把具有相同值的记录归为一组，并支持按组进行聚合计算。</p></article><article><h3>HAVING</h3><pre dir="ltr"><span class="kw">GROUP BY</span> <span class="col">Category</span> <span class="kw">HAVING</span> <span class="fn">COUNT</span>(*) &gt; <span class="num">50</span></pre><p>“针对组的 WHERE”。它在计算完成之后筛选。使用聚合函数时必须用它。</p></article><article><h3>ROLLUP</h3><pre dir="ltr"><span class="kw">GROUP BY ROLLUP</span> (<span class="col">Department</span>)</pre><p>自动在底部添加一行“总计”。省去单独的计算。</p></article><article><h3>CUBE</h3><pre dir="ltr"><span class="kw">GROUP BY CUBE</span> (<span class="col">Department</span>, <span class="col">JobTitle</span>)</pre><p>为每一种可能的组合创建汇总行。用于分析型矩阵报表。</p></article><article><h3>GROUPING SETS</h3><pre dir="ltr"><span class="kw">GROUP BY GROUPING SETS</span> ((<span class="col">Dept</span>), (<span class="col">Title</span>), ())</pre><p>精确控制——准确指定要生成哪些汇总层级。比 CUBE 更高效。</p></article></section><section><h2>聚合函数</h2><article><h3>COUNT(col)</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">COUNT</span>(<span class="col">Email</span>) <span class="kw">FROM</span> <span class="tbl">Customers</span></pre><p>统计某一列中的值。忽略 NULL 行。10 行中有 8 个邮箱 → 返回 8。</p></article><article><h3>COUNT(*)</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">COUNT</span>(*) <span class="kw">FROM</span> <span class="tbl">Orders</span></pre><p>统计物理行数，包括 NULL。快速知道“一共有多少条记录？”的方式。</p></article><article><h3>SUM()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">SUM</span>(<span class="col">Amount</span>) <span class="kw">FROM</span> <span class="tbl">Sales</span> <span class="kw">WHERE</span> <span class="col">Year</span> = <span class="num">2023</span></pre><p>把数值加总。财务报表跳动的心脏。</p></article><article><h3>AVG()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">AVG</span>(<span class="col">Salary</span>) <span class="kw">FROM</span> <span class="tbl">Employees</span></pre><p>忽略 NULL 的算术平均值。用于平均工资、等待时间、年龄等等。</p></article><article><h3>MIN()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">MIN</span>(<span class="col">Price</span>) <span class="kw">FROM</span> <span class="tbl">Products</span></pre><p>最小值。也用于最早的日期或按字母排序的第一个名字。</p></article><article><h3>MAX()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">MAX</span>(<span class="col">OrderDate</span>) <span class="kw">FROM</span> <span class="tbl">Orders</span></pre><p>最大值。用于最赚钱的交易或最近的时间戳。</p></article></section><section><h2>连接与集合运算</h2><article><h3>INNER JOIN</h3><pre dir="ltr"><span class="kw">SELECT</span> c.Name, o.Amount <span class="kw">FROM</span> <span class="tbl">Customers</span> c <span class="kw">INNER JOIN</span> <span class="tbl">Orders</span> o <span class="kw">ON</span> c.ID = o.CustID</pre><p>只取两边都完全匹配的行。报告活跃交易时最安全的选择。</p></article><article><h3>LEFT JOIN</h3><pre dir="ltr"><span class="kw">SELECT</span> c.Name, o.Amount <span class="kw">FROM</span> <span class="tbl">Customers</span> c <span class="kw">LEFT JOIN</span> <span class="tbl">Orders</span> o <span class="kw">ON</span> c.ID = o.CustID</pre><p>左表中的所有行，即使没有匹配（右侧为 NULL）。用于查找没有订单的客户。</p></article><article><h3>RIGHT JOIN</h3><pre dir="ltr"><span class="kw">SELECT</span> c.Name, o.Amount <span class="kw">FROM</span> <span class="tbl">Customers</span> c <span class="kw">RIGHT JOIN</span> <span class="tbl">Orders</span> o <span class="kw">ON</span> c.ID = o.CustID</pre><p>右表中的所有行。通常更好的做法是交换顺序并使用 LEFT。</p></article><article><h3>FULL OUTER JOIN</h3><pre dir="ltr"><span class="kw">SELECT</span> c.Name, o.Amount <span class="kw">FROM</span> <span class="tbl">Customers</span> c <span class="kw">FULL OUTER JOIN</span> <span class="tbl">Orders</span> o <span class="kw">ON</span> c.ID = o.CustID</pre><p>来自各方的一切——匹配项加上两侧的缺口。用于审计和查找不匹配。</p></article><article><h3>CROSS JOIN</h3><pre dir="ltr"><span class="kw">SELECT</span> Colors.Name, Sizes.Name <span class="kw">FROM</span> <span class="tbl">Colors</span> <span class="kw">CROSS JOIN</span> <span class="tbl">Sizes</span></pre><p>笛卡尔积——每一行 × 每一行。3 种颜色 × 3 种尺码 = 9 行。</p></article><article><h3>SELF JOIN</h3><pre dir="ltr"><span class="kw">SELECT</span> e1.Name <span class="kw">AS</span> Emp, e2.Name <span class="kw">AS</span> Mgr <span class="kw">FROM</span> <span class="tbl">Employees</span> e1 <span class="kw">JOIN</span> <span class="tbl">Employees</span> e2 <span class="kw">ON</span> e1.MgrID = e2.ID</pre><p>把一张表连接到它自己。用于在同一张表中处理经理—员工层级。</p></article><article><h3>ON</h3><pre dir="ltr"><span class="kw">JOIN</span> <span class="tbl">Orders</span> o <span class="kw">ON</span> c.ID = o.CustomerID</pre><p>定义连接条件——哪些列在两张表中代表相同的信息。</p></article><article><h3>USING</h3><pre dir="ltr"><span class="kw">JOIN</span> <span class="tbl">Orders</span> <span class="kw">USING</span> (CustomerID)</pre><p>当连接列在两张表中同名时，作为 ON 的简写。</p></article><article><h3>UNION</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="col">City</span> <span class="kw">FROM</span> <span class="tbl">Customers</span> <span class="kw">UNION</span> <span class="kw">SELECT</span> <span class="col">City</span> <span class="kw">FROM</span> <span class="tbl">Suppliers</span></pre><p>把查询纵向堆叠并去除重复。两者必须具有相同的列结构。</p></article><article><h3>UNION ALL</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="col">City</span> <span class="kw">FROM</span> <span class="tbl">Customers</span> <span class="kw">UNION ALL</span> <span class="kw">SELECT</span> <span class="col">City</span> <span class="kw">FROM</span> <span class="tbl">Suppliers</span></pre><p>不去除重复的合并。更快——在没有重叠时更可取。</p></article><article><h3>INTERSECT</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="col">ProductID</span> <span class="kw">FROM</span> <span class="tbl">Sales2023</span> <span class="kw">INTERSECT</span> <span class="kw">SELECT</span> <span class="col">ProductID</span> <span class="kw">FROM</span> <span class="tbl">Sales2024</span></pre><p>交集——只取在两个查询中都出现的行。用于两年都购买的忠实客户。</p></article><article><h3>EXCEPT / MINUS</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="col">ProductID</span> <span class="kw">FROM</span> <span class="tbl">Sales2023</span> <span class="kw">EXCEPT</span> <span class="kw">SELECT</span> <span class="col">ProductID</span> <span class="kw">FROM</span> <span class="tbl">Sales2024</span></pre><p>相减——在第一个查询中而不在第二个查询中的行。仅在 2023 年售出的产品。</p></article></section><section><h2>DDL —— 定义结构与基础架构</h2><article><h3>CREATE DATABASE</h3><pre dir="ltr"><span class="kw">CREATE DATABASE</span> CompanyCRM</pre><p>创建一个新数据库。在服务器上分配空间、文件和日志。</p></article><article><h3>DROP DATABASE</h3><pre dir="ltr"><span class="kw">DROP DATABASE</span> CompanyCRM</pre><p>删除整个数据库——包括所有表和数据。没有备份就无法恢复！</p></article><article><h3>CREATE TABLE</h3><pre dir="ltr"><span class="kw">CREATE TABLE</span> <span class="tbl">Users</span> (<span class="col">ID</span> INT, <span class="col">Name</span> VARCHAR(<span class="num">50</span>))</pre><p>创建一张新表并定义其列结构和数据类型。</p></article><article><h3>ALTER TABLE</h3><pre dir="ltr"><span class="kw">ALTER TABLE</span> <span class="tbl">Users</span> <span class="kw">ADD</span> <span class="col">Email</span> VARCHAR(<span class="num">100</span>)</pre><p>对现有表的结构性更改——添加列、删除、更改数据类型。</p></article><article><h3>DROP TABLE</h3><pre dir="ltr"><span class="kw">DROP TABLE</span> <span class="tbl">Users</span></pre><p>彻底删除——数据和结构都被移除。你需要从头 CREATE。</p></article><article><h3>TRUNCATE TABLE</h3><pre dir="ltr"><span class="kw">TRUNCATE TABLE</span> <span class="tbl">Logs</span></pre><p>快速清空内容。结构保留。比 DELETE 更快——用于重置系统。</p></article><article><h3>CREATE INDEX</h3><pre dir="ltr"><span class="kw">CREATE INDEX</span> idx_ln <span class="kw">ON</span> <span class="tbl">Employees</span> (<span class="col">LastName</span>)</pre><p>列的“目录”。让你直接跳到某条记录，而不必扫描全部。</p></article><article><h3>DROP INDEX</h3><pre dir="ltr"><span class="kw">DROP INDEX</span> idx_ln <span class="kw">ON</span> <span class="tbl">Employees</span></pre><p>删除一个索引。索引会拖慢写入——删除未使用的索引能提升性能。</p></article><article><h3>CREATE VIEW</h3><pre dir="ltr"><span class="kw">CREATE VIEW</span> ActiveUsers <span class="kw">AS</span> <span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Users</span> <span class="kw">WHERE</span> <span class="col">Status</span> = <span class="str">'Active'</span></pre><p>一张“虚拟表”——把复杂查询以一个名称保存。对用户隐藏逻辑。</p></article><article><h3>DROP VIEW</h3><pre dir="ltr"><span class="kw">DROP VIEW</span> ActiveUsers</pre><p>删除一个视图。底层数据保持不变。</p></article><article><h3>CREATE PROCEDURE</h3><pre dir="ltr"><span class="kw">CREATE PROCEDURE</span> GetUser (@ID INT) <span class="kw">AS BEGIN SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Users</span> <span class="kw">WHERE</span> ID=@ID <span class="kw">END</span></pre><p>存储在数据库中的小程序。提升安全性并防止 SQL 注入。</p></article><article><h3>DROP PROCEDURE</h3><pre dir="ltr"><span class="kw">DROP PROCEDURE</span> GetUser</pre><p>删除一个存储过程。用于版本升级和清理旧代码。</p></article><article><h3>CREATE FUNCTION</h3><pre dir="ltr"><span class="kw">CREATE FUNCTION</span> CalcTax (@V DECIMAL) <span class="kw">RETURNS</span> DECIMAL <span class="kw">AS BEGIN RETURN</span> @V * <span class="num">1.17</span> <span class="kw">END</span></pre><p>用于重复计算的自定义函数。返回一个干净的值，并在查询内部使用。</p></article><article><h3>PRIMARY KEY</h3><pre dir="ltr"><span class="kw">CREATE TABLE</span> <span class="tbl">Users</span> (<span class="col">ID</span> INT <span class="kw">PRIMARY KEY</span>, <span class="col">Name</span> VARCHAR(<span class="num">50</span>))</pre><p>每一行唯一的“身份证”。防止重复并要求必须有值。</p></article><article><h3>FOREIGN KEY</h3><pre dir="ltr"><span class="kw">CONSTRAINT</span> FK_User <span class="kw">FOREIGN KEY</span> (<span class="col">UserID</span>) <span class="kw">REFERENCES</span> <span class="tbl">Users</span>(<span class="col">ID</span>)</pre><p>在表之间建立严格的关联。防止录入不存在的虚构 ID。</p></article><article><h3>UNIQUE</h3><pre dir="ltr"><span class="kw">CREATE TABLE</span> <span class="tbl">Users</span> (<span class="col">Email</span> VARCHAR(<span class="num">100</span>) <span class="kw">UNIQUE</span>)</pre><p>列中的所有值必须互不相同。用于唯一的邮箱和电话号码。</p></article><article><h3>NOT NULL</h3><pre dir="ltr"><span class="kw">CREATE TABLE</span> <span class="tbl">Users</span> (<span class="col">Name</span> VARCHAR(<span class="num">50</span>) <span class="kw">NOT NULL</span>)</pre><p>要求列中必须有值。防止创建没有名字的客户或没有价格的产品。</p></article><article><h3>CHECK</h3><pre dir="ltr"><span class="kw">CREATE TABLE</span> <span class="tbl">Products</span> (<span class="col">Price</span> DECIMAL <span class="kw">CHECK</span> (<span class="col">Price</span> &gt; <span class="num">0</span>))</pre><p>检查值是否符合业务规则。不允许出现负价格。</p></article><article><h3>DEFAULT</h3><pre dir="ltr"><span class="kw">CREATE TABLE</span> <span class="tbl">Users</span> (<span class="col">Status</span> VARCHAR(<span class="num">20</span>) <span class="kw">DEFAULT</span> <span class="str">'Pending'</span>)</pre><p>如果用户没有输入，则自动填入一个值。而不是让单元格留为 NULL。</p></article><article><h3>IDENTITY / AUTO_INCREMENT</h3><pre dir="ltr"><span class="kw">CREATE TABLE</span> <span class="tbl">Users</span> (<span class="col">ID</span> INT <span class="kw">IDENTITY</span>(<span class="num">1</span>,<span class="num">1</span>) <span class="kw">PRIMARY KEY</span>)</pre><p>自动递增的计数器（1,2,3……）。每一行新行都获得唯一的 ID。</p></article></section><section><h2>事务与安全权限</h2><article><h3>GRANT</h3><pre dir="ltr"><span class="kw">GRANT</span> SELECT, INSERT <span class="kw">ON</span> <span class="tbl">Users</span> <span class="kw">TO</span> AnalystRole</pre><p>授予访问权限。你可以给予“只读”并阻止更改。</p></article><article><h3>REVOKE</h3><pre dir="ltr"><span class="kw">REVOKE</span> INSERT <span class="kw">ON</span> <span class="tbl">Users</span> <span class="kw">FROM</span> AnalystRole</pre><p>撤销已授予的权利。用于变更角色和保护敏感数据。</p></article><article><h3>BEGIN TRAN</h3><pre dir="ltr"><span class="kw">BEGIN TRAN</span>; <span class="kw">UPDATE</span> <span class="tbl">Accounts</span> <span class="kw">SET</span> Balance = Balance - <span class="num">100</span>...</pre><p>开启一个工作单元——所有操作作为一个整体来管理。在提交之前，它们都是暂定的。</p></article><article><h3>COMMIT</h3><pre dir="ltr"><span class="kw">COMMIT</span></pre><p>封存事务，使所有操作成为最终且不可逆。</p></article><article><h3>ROLLBACK</h3><pre dir="ltr"><span class="kw">ROLLBACK</span></pre><p>救命稻草。撤销自事务开始以来的所有更改，恢复到先前的状态。</p></article><article><h3>SAVEPOINT</h3><pre dir="ltr"><span class="kw">SAVEPOINT</span> Stage1</pre><p>巨型事务内部的临时保存点。之后的失败只回滚到这个点。</p></article></section><section><h2>文本处理函数</h2><article><h3>CONCAT()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">CONCAT</span>(<span class="col">FirstName</span>, <span class="str">' '</span>, <span class="col">LastName</span>) <span class="kw">FROM</span> <span class="tbl">Employees</span></pre><p>连接字段和文本。优雅地处理 NULL——它会忽略它们。</p></article><article><h3>CONCAT_WS()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">CONCAT_WS</span>(<span class="str">', '</span>, <span class="col">City</span>, <span class="col">State</span>, <span class="col">Country</span>) <span class="kw">FROM</span> <span class="tbl">Addresses</span></pre><p>“带分隔符的连接”。定义一个分隔符，自动把所有内容连接起来。</p></article><article><h3>SUBSTRING()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">SUBSTRING</span>(<span class="col">IDNumber</span>, <span class="num">1</span>, <span class="num">4</span>) <span class="kw">FROM</span> <span class="tbl">Customers</span></pre><p>按位置裁剪文本：列名、起始字符、多少个字符。</p></article><article><h3>LEN() / LENGTH()</h3><pre dir="ltr"><span class="kw">WHERE</span> <span class="fn">LEN</span>(<span class="col">Password</span>) &lt; <span class="num">8</span></pre><p>统计文本中有多少个字符。用于检查过短的密码和验证数据。</p></article><article><h3>UPPER()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">UPPER</span>(<span class="col">CountryCode</span>) <span class="kw">FROM</span> <span class="tbl">Countries</span></pre><p>转换为大写。用于规范化比较——两边都转 UPPER = 一致的搜索。</p></article><article><h3>LOWER()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">LOWER</span>(<span class="col">Email</span>) <span class="kw">FROM</span> <span class="tbl">Users</span></pre><p>转换为小写。处理邮箱的常见约定。</p></article><article><h3>TRIM()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">TRIM</span>(<span class="col">Username</span>) <span class="kw">FROM</span> <span class="tbl">Accounts</span></pre><p>去除开头和结尾的空格。用于清理复制粘贴带来的“杂质”。</p></article><article><h3>LTRIM()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">LTRIM</span>(<span class="col">Comment</span>) <span class="kw">FROM</span> <span class="tbl">Feedback</span></pre><p>只去除左侧的空格。</p></article><article><h3>RTRIM()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">RTRIM</span>(<span class="col">Comment</span>) <span class="kw">FROM</span> <span class="tbl">Feedback</span></pre><p>只去除字符串末尾的空格。</p></article><article><h3>REPLACE()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">REPLACE</span>(<span class="col">Phone</span>, <span class="str">'-'</span>, <span class="str">''</span>) <span class="kw">FROM</span> <span class="tbl">Customers</span></pre><p>替换某个模式的每一次出现。用于移除电话号码中的短横线。</p></article><article><h3>REVERSE()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">REVERSE</span>(<span class="col">StringCol</span>) <span class="kw">FROM</span> <span class="tbl">Strings</span></pre><p>反转字符的顺序。一个用于查找最后一个字符位置的技巧。</p></article><article><h3>LEFT()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">LEFT</span>(<span class="col">OrderNum</span>, <span class="num">2</span>) <span class="kw">FROM</span> <span class="tbl">Orders</span></pre><p>从左侧取 X 个字符。从开头提取时比 SUBSTRING 更简短。</p></article><article><h3>RIGHT()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">RIGHT</span>(<span class="col">CreditCard</span>, <span class="num">4</span>) <span class="kw">FROM</span> <span class="tbl">Payments</span></pre><p>从右侧取 X 个字符。用于信用卡的后 4 位。</p></article><article><h3>CHARINDEX()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">CHARINDEX</span>(<span class="str">'@'</span>, <span class="col">Email</span>) <span class="kw">FROM</span> <span class="tbl">Users</span></pre><p>搜索某个字符/单词并返回数字位置。用于裁剪长度不一的邮箱。</p></article><article><h3>PATINDEX()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">PATINDEX</span>(<span class="str">'%[0-9]%'</span>, <span class="col">Address</span>) <span class="kw">FROM</span> <span class="tbl">Customers</span></pre><p>查找智能模式（SQL Server）。用于定位地址中第一个数字的位置。</p></article><article><h3>FORMAT()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">FORMAT</span>(<span class="col">Price</span>, <span class="str">'C'</span>, <span class="str">'en-US'</span>) <span class="kw">FROM</span> <span class="tbl">Products</span></pre><p>把值格式化成漂亮的文本——百万中的逗号、货币符号、日期格式。</p></article></section><section><h2>日期与时间函数</h2><article><h3>GETDATE() / NOW()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">GETDATE</span>()</pre><p>精确到毫秒的当前日期和时间。新记录的自动时间戳。</p></article><article><h3>CURRENT_DATE</h3><pre dir="ltr"><span class="kw">SELECT CURRENT_DATE</span></pre><p>只有今天的日期，不含时间。用于只关心日期的条件。</p></article><article><h3>CURRENT_TIME</h3><pre dir="ltr"><span class="kw">SELECT CURRENT_TIME</span></pre><p>不含日期的当前时间。用于效率报表和每日负载。</p></article><article><h3>DATEADD()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">DATEADD</span>(day, <span class="num">30</span>, <span class="col">OrderDate</span>) <span class="kw">AS</span> DueDate <span class="kw">FROM</span> <span class="tbl">Orders</span></pre><p>给日期加上（或加负号减去）时间。用于计算到期日。</p></article><article><h3>DATEDIFF()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">DATEDIFF</span>(day, <span class="col">OrderDate</span>, <span class="col">ShipDate</span>) <span class="kw">FROM</span> <span class="tbl">Orders</span></pre><p>两个日期之间的间隔。用于响应时间、客户年龄、距发货的天数。</p></article><article><h3>DATEPART()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">DATEPART</span>(quarter, <span class="col">OrderDate</span>) <span class="kw">FROM</span> <span class="tbl">Sales</span></pre><p>把某个特定元素提取为数字（quarter = 1-4）。按季度进行 GROUP BY 时必不可少。</p></article><article><h3>YEAR()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">YEAR</span>(<span class="col">OrderDate</span>) <span class="kw">FROM</span> <span class="tbl">Sales</span></pre><p>隔离出年份。用于年度营收报表（2021、2022、2023……）。</p></article><article><h3>MONTH()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">MONTH</span>(<span class="col">OrderDate</span>) <span class="kw">FROM</span> <span class="tbl">Sales</span></pre><p>月份编号（1-12）。用于跨年份的季节性分析。</p></article><article><h3>DAY()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">DAY</span>(<span class="col">BirthDate</span>) <span class="kw">FROM</span> <span class="tbl">Customers</span></pre><p>当月的第几天（1-31）。用于生日和每月的信用卡还款。</p></article><article><h3>EOMONTH()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">EOMONTH</span>(<span class="col">OrderDate</span>) <span class="kw">AS</span> EndOfMonth <span class="kw">FROM</span> <span class="tbl">Sales</span></pre><p>跳到当月的最后一天。解决“这个月有多少天”的问题。用于财务结账。</p></article><article><h3>ISDATE()</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Import</span> <span class="kw">WHERE</span> <span class="fn">ISDATE</span>(<span class="col">RawText</span>) = <span class="num">1</span></pre><p>检查文本是否为有效日期。防范来自表单的坏数据。</p></article></section><section><h2>数学函数</h2><article><h3>ROUND()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">ROUND</span>(<span class="col">Price</span>, <span class="num">2</span>) <span class="kw">FROM</span> <span class="tbl">Products</span></pre><p>四舍五入到 X 位小数。用于精确的发票。</p></article><article><h3>CEILING()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">CEILING</span>(<span class="num">4.1</span>) <span class="cmt">-- Returns 5</span></pre><p>把任何小数向上取整到下一个整数。4.1 辆公交车 → 你必须租 5 辆。</p></article><article><h3>FLOOR()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">FLOOR</span>(<span class="num">4.9</span>) <span class="cmt">-- Returns 4</span></pre><p>向下截断到较小的整数。4.9 包 → 你只能装 4 包。</p></article><article><h3>ABS()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">ABS</span>(<span class="col">Income</span> - <span class="col">Expense</span>) <span class="kw">FROM</span> <span class="tbl">Books</span></pre><p>绝对值——负数变正数。用于计算差距的大小。</p></article><article><h3>POWER()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">POWER</span>(<span class="col">Radius</span>, <span class="num">2</span>) <span class="kw">FROM</span> <span class="tbl">Shapes</span></pre><p>求幂。用于复利和面积计算。</p></article><article><h3>SQRT()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">SQRT</span>(<span class="col">Area</span>) <span class="kw">FROM</span> <span class="tbl">Squares</span></pre><p>平方根。用于距离计算和标准差。</p></article><article><h3>RAND()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">RAND</span>()</pre><p>0 到 1 之间的随机数。用于抽奖和随机抽样。</p></article><article><h3>SIGN()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">SIGN</span>(<span class="col">NetProfit</span>) <span class="kw">FROM</span> <span class="tbl">Reports</span></pre><p>1（正）、-1（负）、0。用于快速的盈亏指示。</p></article><article><h3>PI()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">PI</span>() * <span class="fn">POWER</span>(<span class="col">Radius</span>, <span class="num">2</span>) <span class="kw">AS</span> Area</pre><p>内置的 π 常量。用于精确的几何计算。</p></article><article><h3>MOD() / %</h3><pre dir="ltr"><span class="kw">WHERE</span> <span class="col">EmployeeID</span> % <span class="num">2</span> = <span class="num">0</span></pre><p>除法的余数。用于查找偶数行，以及把列表平均分到几个通道。</p></article></section><section><h2>智能条件与 NULL 处理</h2><article><h3>CASE</h3><pre dir="ltr"><span class="kw">SELECT CASE WHEN</span> Score &gt; <span class="num">90</span> <span class="kw">THEN</span> <span class="str">'A'</span> <span class="kw">ELSE</span> <span class="str">'F'</span> <span class="kw">END FROM</span> <span class="tbl">Tests</span></pre><p>查询内部的分支逻辑。构建一个实时对数据进行分类的计算列。</p></article><article><h3>WHEN / THEN</h3><pre dir="ltr"><span class="kw">CASE WHEN</span> condition <span class="kw">THEN</span> result <span class="kw">END</span></pre><p>CASE 的核心。WHEN = 要测试的条件，THEN = 条件为真时的输出。</p></article><article><h3>COALESCE()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">COALESCE</span>(<span class="col">Mobile</span>, <span class="col">HomePhone</span>, <span class="str">'No Phone'</span>) <span class="kw">FROM</span> <span class="tbl">Contacts</span></pre><p>返回第一个不为 NULL 的值。处理缺失数据的“优先级瀑布”。</p></article><article><h3>ISNULL() / IFNULL()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">ISNULL</span>(<span class="col">Discount</span>, <span class="num">0</span>) <span class="kw">FROM</span> <span class="tbl">Sales</span></pre><p>如果为 NULL，则返回一个回退值。在计算中必不可少——NULL 会破坏数学运算。</p></article><article><h3>NULLIF()</h3><pre dir="ltr"><span class="kw">SELECT</span> Amount / <span class="fn">NULLIF</span>(<span class="col">Quantity</span>, <span class="num">0</span>) <span class="kw">FROM</span> <span class="tbl">Inventory</span></pre><p>如果两个值相同 → 返回 NULL。防止除以零的崩溃。</p></article></section><section><h2>数据类型转换与提升</h2><article><h3>IIF()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">IIF</span>(Stock &gt; <span class="num">0</span>, <span class="str">'In Stock'</span>, <span class="str">'Out of Stock'</span>) <span class="kw">FROM</span> <span class="tbl">Products</span></pre><p>用于两种状态的简写 CASE。SQL Server。三个输入：条件、真、假。</p></article><article><h3>CAST()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">CAST</span>(<span class="col">Price</span> <span class="kw">AS</span> INT) <span class="kw">FROM</span> <span class="tbl">Products</span></pre><p>转换数据类型的标准工具。数字转文本以便拼接，文本转数字以便相加。</p></article><article><h3>CONVERT()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">CONVERT</span>(VARCHAR(<span class="num">10</span>), <span class="col">OrderDate</span>, <span class="num">103</span>) <span class="kw">FROM</span> <span class="tbl">Orders</span></pre><p>CAST 的兄弟，带有格式化能力。它可以在转换时格式化日期。</p></article><article><h3>TRY_CAST()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">TRY_CAST</span>(<span class="col">StringVal</span> <span class="kw">AS</span> INT) <span class="kw">FROM</span> <span class="tbl">DirtyData</span></pre><p>一种安全的转换。乱码 → NULL 而不是崩溃。查询继续运行。</p></article><article><h3>TRY_CONVERT()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">TRY_CONVERT</span>(DATE, <span class="col">StringDate</span>) <span class="kw">FROM</span> <span class="tbl">DirtyData</span></pre><p>一种安全的 CONVERT。用于从不可靠的外部源摄取数据。</p></article></section><section><h2>窗口函数</h2><article><h3>OVER()</h3><pre dir="ltr"><span class="kw">SELECT</span> Name, <span class="fn">SUM</span>(Salary) <span class="kw">OVER</span>() <span class="kw">AS</span> Total <span class="kw">FROM</span> <span class="tbl">Employees</span></pre><p>通往窗口函数的大门。无需 GROUP BY 就能对每条记录进行聚合计算。工资 + 公司总薪资一起显示。</p></article><article><h3>PARTITION BY</h3><pre dir="ltr"><span class="fn">SUM</span>(Salary) <span class="kw">OVER</span>(<span class="kw">PARTITION BY</span> Department)</pre><p>把窗口拆分成子组。部门薪资而不是整个公司。对每一组重置。</p></article><article><h3>ROW_NUMBER()</h3><pre dir="ltr"><span class="fn">ROW_NUMBER</span>() <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> Salary <span class="kw">DESC</span>)</pre><p>唯一的连续编号（1,2,3……）。忽略并列。用于强制排序和去除重复。</p></article><article><h3>RANK()</h3><pre dir="ltr"><span class="fn">RANK</span>() <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> Salary <span class="kw">DESC</span>)</pre><p>竞赛式排名。并列 → 两者都得第 2 名。下一个 → 跳到 4（跳过 3）。</p></article><article><h3>DENSE_RANK()</h3><pre dir="ltr"><span class="fn">DENSE_RANK</span>() <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> Salary <span class="kw">DESC</span>)</pre><p>密集排名。在第 2 名并列之后，下一个得 3（而不是 4）。用于信用评级和订阅等级。</p></article><article><h3>NTILE()</h3><pre dir="ltr"><span class="fn">NTILE</span>(<span class="num">4</span>) <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> Salary)</pre><p>拆分成 X 个相等的组。NTILE(4) = 四个四分位。用于营销细分。</p></article><article><h3>LEAD()</h3><pre dir="ltr"><span class="fn">LEAD</span>(Revenue) <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> Month)</pre><p>从下一行取一个值。把下个月的营收与当前月并排显示——无需 JOIN。</p></article><article><h3>LAG()</h3><pre dir="ltr"><span class="fn">LAG</span>(Revenue) <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> Month)</pre><p>从上一行取一个值。把昨天和今天并排——在单个查询中计算 % 增长。</p></article><article><h3>FIRST_VALUE()</h3><pre dir="ltr"><span class="fn">FIRST_VALUE</span>(Name) <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> HireDate)</pre><p>窗口中的第一条记录，对每一行都有效。把最资深的员工与每位员工并排显示。</p></article><article><h3>LAST_VALUE()</h3><pre dir="ltr"><span class="fn">LAST_VALUE</span>(Name) <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> HireDate)</pre><p>窗口中的最后一条记录。把订单的最终阶段与所有中间阶段并排显示。</p></article></section><section><h2>高级结构与架构</h2><article><h3>WITH (CTE)</h3><pre dir="ltr"><span class="kw">WITH</span> HighVal <span class="kw">AS</span> (<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Orders</span> <span class="kw">WHERE</span> Amount &gt; <span class="num">1000</span>) <span class="kw">SELECT</span> * <span class="kw">FROM</span> HighVal</pre><p>一张贯穿整个查询的临时工作表。把复杂的代码变成可读的步骤。</p></article><article><h3>PIVOT</h3><pre dir="ltr"><span class="kw">PIVOT</span>(<span class="fn">SUM</span>(Amount) <span class="kw">FOR</span> Year <span class="kw">IN</span> ([<span class="num">2022</span>], [<span class="num">2023</span>])) <span class="kw">AS</span> pvt</pre><p>把行转成列。用于 Excel 式的报表——把一年中的各月作为列。</p></article><article><h3>UNPIVOT</h3><pre dir="ltr"><span class="kw">UNPIVOT</span> (Amount <span class="kw">FOR</span> Year <span class="kw">IN</span> ([<span class="num">2022</span>], [<span class="num">2023</span>])) <span class="kw">AS</span> unpvt</pre><p>把列转回行。用于规范化来自外部源的矩阵。</p></article><article><h3>EXEC / EXECUTE</h3><pre dir="ltr"><span class="kw">EXEC</span> GetUser @UserID = <span class="num">5</span></pre><p>运行存储过程。也用于执行在运行时以文本构建的动态代码。</p></article><article><h3>DECLARE</h3><pre dir="ltr"><span class="kw">DECLARE</span> @Year INT = <span class="num">2023</span>; <span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Sales</span> <span class="kw">WHERE</span> Year = @Year</pre><p>在脚本中创建变量。改动顶部的一个值会影响下面的所有代码。</p></article></section><section><h2>JSON 与 XML —— 半结构化数据</h2><article><h3>FOR JSON</h3><pre dir="ltr"><span class="kw">SELECT</span> Name, Age <span class="kw">FROM</span> <span class="tbl">Users</span> <span class="kw">FOR JSON AUTO</span></pre><p>把 SQL 结果转成 JSON 格式。让 Web 开发者无需进一步转换就能在 JavaScript 中直接使用数据。</p></article><article><h3>OPENJSON()</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="fn">OPENJSON</span>(@JsonString)</pre><p>把 JSON 字符串转成带行和列的常规表。用于处理来自外部 API 的数据。</p></article><article><h3>JSON_VALUE()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">JSON_VALUE</span>(<span class="col">JsonCol</span>, <span class="str">'$.Address.City'</span>) <span class="kw">FROM</span> <span class="tbl">Customers</span></pre><p>按路径从 JSON 中提取单个值。用于从大型 JSON 列中取出特定字段。</p></article><article><h3>JSON_QUERY()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">JSON_QUERY</span>(<span class="col">JsonCol</span>, <span class="str">'$.Hobbies'</span>) <span class="kw">FROM</span> <span class="tbl">Customers</span></pre><p>从 JSON 中提取复杂的对象或数组。与返回简单值的 JSON_VALUE 不同。</p></article><article><h3>JSON_MODIFY()</h3><pre dir="ltr"><span class="kw">UPDATE</span> <span class="tbl">Users</span> <span class="kw">SET</span> JsonCol = <span class="fn">JSON_MODIFY</span>(JsonCol, <span class="str">'$.Status'</span>, <span class="str">'VIP'</span>)</pre><p>在不重写整个文档的情况下，编辑 JSON 内部的某个特定值。</p></article><article><h3>ISJSON()</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Logs</span> <span class="kw">WHERE</span> <span class="fn">ISJSON</span>(<span class="col">RawData</span>) = <span class="num">1</span></pre><p>检查字符串是否为有效的 JSON。有效返回 1，格式错误返回 0。用于过滤掉坏数据。</p></article><article><h3>FOR XML</h3><pre dir="ltr"><span class="kw">SELECT</span> Name <span class="kw">FROM</span> <span class="tbl">Users</span> <span class="kw">FOR XML PATH</span>(<span class="str">'User'</span>)</pre><p>把表结果转成 XML 格式。在银行、政府和遗留系统中仍然常见。</p></article><article><h3>OPENXML()</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="fn">OPENXML</span>(@doc, <span class="str">'/Users/User'</span>)</pre><p>把 XML 字符串转成关系表。用于处理来自旧 XML 接口的数据。</p></article></section><section><h2>高级字符串函数</h2><article><h3>STRING_AGG()</h3><pre dir="ltr"><span class="kw">SELECT</span> Dept, <span class="fn">STRING_AGG</span>(Name, <span class="str">', '</span>) <span class="kw">FROM</span> <span class="tbl">Employees</span> <span class="kw">GROUP BY</span> Dept</pre><p>用分隔符把多行合并成一个字符串。“5 名员工” → “Dan, Yael, Ron, Michal, Noa”。</p></article><article><h3>STRING_SPLIT()</h3><pre dir="ltr"><span class="kw">SELECT</span> value <span class="kw">FROM</span> <span class="fn">STRING_SPLIT</span>(<span class="str">'Apple,Banana,Orange'</span>, <span class="str">','</span>)</pre><p>用分隔符把字符串拆成单独的行。与 STRING_AGG 相反。</p></article><article><h3>REPLICATE()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">REPLICATE</span>(<span class="str">'0'</span>, <span class="num">5</span>) + OrderNumber <span class="kw">FROM</span> <span class="tbl">Orders</span></pre><p>把字符重复 X 次。用于给数字补前导零（000045）。</p></article><article><h3>SPACE()</h3><pre dir="ltr"><span class="kw">SELECT</span> FirstName + <span class="fn">SPACE</span>(<span class="num">5</span>) + LastName <span class="kw">FROM</span> <span class="tbl">Users</span></pre><p>生成 X 个空格。比手动敲空格更易读。</p></article><article><h3>SOUNDEX()</h3><pre dir="ltr"><span class="kw">WHERE</span> <span class="fn">SOUNDEX</span>(Name) = <span class="fn">SOUNDEX</span>(<span class="str">'Smith'</span>)</pre><p>把单词转成语音（发音）编码。用于查找拼写错误的名字——“Smythe” = “Smith”。</p></article><article><h3>DIFFERENCE()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">DIFFERENCE</span>(Name, <span class="str">'Michael'</span>) <span class="kw">FROM</span> <span class="tbl">Users</span></pre><p>两个单词语音相似度的 0-4 评分。4 = 发音完全相同。用于“你是不是想找……？”引擎。</p></article><article><h3>QUOTENAME()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">QUOTENAME</span>(TableName) <span class="kw">FROM</span> Sys.Tables</pre><p>用方括号把对象名称包起来。防止带空格名称出错，并防范 SQL 注入。</p></article><article><h3>TRANSLATE()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">TRANSLATE</span>(Phone, <span class="str">'()-'</span>, <span class="str">'   '</span>) <span class="kw">FROM</span> <span class="tbl">Contacts</span></pre><p>一次替换多个字符。用于在单个查询中清理电话号码里的标点。</p></article><article><h3>ASCII()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">ASCII</span>(<span class="fn">LEFT</span>(Password, <span class="num">1</span>)) <span class="kw">FROM</span> <span class="tbl">Logins</span></pre><p>返回第一个字符的 ASCII 码。用于检查密码是否以大写字母开头。</p></article><article><h3>CHAR()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="str">'Hello'</span> + <span class="fn">CHAR</span>(<span class="num">13</span>) + <span class="str">'World'</span></pre><p>把数字编码转成字符。CHAR(13) = 换行，CHAR(9) = Tab。用于无法直接输入的字符。</p></article></section><section><h2>系统函数与标识符</h2><article><h3>DB_NAME()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">DB_NAME</span>()</pre><p>返回当前数据库的名称。用于在拥有多个数据库的服务器上识别代码在哪里运行。</p></article><article><h3>OBJECT_ID()</h3><pre dir="ltr"><span class="kw">IF</span> <span class="fn">OBJECT_ID</span>(<span class="str">'TempTable'</span>) <span class="kw">IS NOT NULL DROP TABLE</span> TempTable</pre><p>检查某个表/对象是否存在。在 DROP 之前防止“表不存在”的错误。</p></article><article><h3>OBJECT_NAME()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">OBJECT_NAME</span>(<span class="num">1234567</span>)</pre><p>把内部 ID 转成可读的名称。用于分析系统表和跟踪性能。</p></article><article><h3>@@VERSION</h3><pre dir="ltr"><span class="kw">SELECT</span> @@VERSION</pre><p>返回 SQL Server 和操作系统的版本。用于在运行代码前检查兼容性。</p></article><article><h3>@@ROWCOUNT</h3><pre dir="ltr"><span class="kw">UPDATE</span> <span class="tbl">Users</span> <span class="kw">SET</span> Status=<span class="num">1</span>; <span class="kw">SELECT</span> @@ROWCOUNT</pre><p>上一条命令影响的行数。用于指示 UPDATE/DELETE 的成功/失败。</p></article><article><h3>@@ERROR</h3><pre dir="ltr"><span class="kw">IF</span> @@ERROR &lt;&gt; <span class="num">0</span> <span class="kw">PRINT</span> <span class="str">'Error occurred'</span></pre><p>上一条命令的错误代码。0 = 成功。大多已被 TRY...CATCH 取代。</p></article><article><h3>@@IDENTITY</h3><pre dir="ltr"><span class="kw">INSERT INTO</span> <span class="tbl">Orders</span>(Amt) <span class="kw">VALUES</span>(<span class="num">50</span>); <span class="kw">SELECT</span> @@IDENTITY</pre><p>最后一个自动生成的 ID。用于在 INSERT 之后获取订单号。</p></article><article><h3>SCOPE_IDENTITY()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">SCOPE_IDENTITY</span>()</pre><p>类似 @@IDENTITY 但更安全——只返回当前作用域的 ID，不包括触发器产生的。</p></article><article><h3>IDENT_CURRENT()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">IDENT_CURRENT</span>(<span class="str">'Orders'</span>)</pre><p>某张特定表中的最后一个 ID——来自任何连接。用于监控表增长的速度。</p></article><article><h3>HOST_NAME()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">HOST_NAME</span>()</pre><p>连接来源机器的名称。用于审计系统跟踪谁从哪里访问。</p></article><article><h3>SUSER_SNAME()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">SUSER_SNAME</span>()</pre><p>当前用户的名称。用于构建行级安全——每位员工只看到自己的数据。</p></article><article><h3>@@SERVERNAME</h3><pre dir="ltr"><span class="kw">SELECT</span> @@SERVERNAME</pre><p>SQL 服务器的名称。用于需要知道连到哪一台的多服务器应用。</p></article></section><section><h2>错误处理与流程控制</h2><article><h3>TRY...CATCH</h3><pre dir="ltr"><span class="kw">BEGIN TRY</span> ... <span class="kw">END TRY BEGIN CATCH</span> ... <span class="kw">END CATCH</span></pre><p>一种错误处理机制。TRY 中失败的代码会转到 CATCH 而不是崩溃。过程中最重要的工具。</p></article><article><h3>THROW</h3><pre dir="ltr"><span class="kw">BEGIN CATCH</span> <span class="kw">THROW</span>; <span class="kw">END CATCH</span></pre><p>把错误重新抛给调用方应用。用于在数据库中记录错误，同时仍向用户显示一个错误。</p></article><article><h3>RAISERROR</h3><pre dir="ltr"><span class="fn">RAISERROR</span>(<span class="str">'Out of stock'</span>, <span class="num">16</span>, <span class="num">1</span>)</pre><p>引发一个自定义的、故意的错误。用于在出现业务问题（库存 = 0）时中止流程，即使没有 SQL 错误。</p></article><article><h3>ERROR_MESSAGE()</h3><pre dir="ltr"><span class="kw">INSERT INTO</span> <span class="tbl">Logs</span> <span class="kw">VALUES</span> (<span class="fn">ERROR_MESSAGE</span>())</pre><p>CATCH 内部的完整错误文本。用于把错误详情保存到日志表。</p></article><article><h3>ERROR_NUMBER()</h3><pre dir="ltr"><span class="kw">IF</span> <span class="fn">ERROR_NUMBER</span>() = <span class="num">2627</span> <span class="kw">PRINT</span> <span class="str">'Duplicate'</span></pre><p>数字错误代码。用于按类型分别处理错误——重复 vs 权限 vs 连接。</p></article><article><h3>ERROR_LINE()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">ERROR_LINE</span>() <span class="kw">AS</span> FailedAtRow</pre><p>出错的代码行。在冗长的过程中节省数小时的调试时间。</p></article><article><h3>WHILE</h3><pre dir="ltr"><span class="kw">WHILE</span> @Counter &lt; <span class="num">10</span> <span class="kw">BEGIN</span> ... <span class="kw">SET</span> @Counter = @Counter + <span class="num">1</span> <span class="kw">END</span></pre><p>SQL 中的循环。用于在无法进行基于集合的操作时逐步处理数据。</p></article><article><h3>BREAK</h3><pre dir="ltr"><span class="kw">IF</span> @Value = <span class="num">0</span> <span class="kw">BREAK</span></pre><p>立即停止 WHILE 循环。用于发现错误时从循环中紧急退出。</p></article><article><h3>CONTINUE</h3><pre dir="ltr"><span class="kw">IF</span> @Skip = <span class="num">1</span> <span class="kw">CONTINUE</span></pre><p>跳到循环的下一次迭代。用于跳过无关记录而不中止一切。</p></article><article><h3>RETURN</h3><pre dir="ltr"><span class="kw">IF</span> @User <span class="kw">IS NULL RETURN</span></pre><p>停止整个过程。一个“守门员”——如果输入无效，立即退出。</p></article><article><h3>WAITFOR DELAY</h3><pre dir="ltr"><span class="kw">WAITFOR DELAY</span> <span class="str">'00:00:10'</span></pre><p>延迟 X 时间。用于分批处理数据并加入停顿，以免拖垮服务器。</p></article><article><h3>WAITFOR TIME</h3><pre dir="ltr"><span class="kw">WAITFOR TIME</span> <span class="str">'02:00:00'</span></pre><p>等到某个特定时间。用于运行夜间维护任务。</p></article></section><section><h2>高级安全权限</h2><article><h3>CREATE LOGIN</h3><pre dir="ltr"><span class="kw">CREATE LOGIN</span> JohnDoe <span class="kw">WITH PASSWORD</span> = <span class="str">'Pass1'</span></pre><p>创建对 SQL 服务器的访问。第一步——“进入大楼”。它还不授予对数据的访问。</p></article><article><h3>CREATE USER</h3><pre dir="ltr"><span class="kw">CREATE USER</span> JohnDoeUser <span class="kw">FOR LOGIN</span> JohnDoe</pre><p>把一个登录名关联到某个特定数据库。进入大楼之后的“某个房间的员工门禁”。</p></article><article><h3>ALTER LOGIN / USER</h3><pre dir="ltr"><span class="kw">ALTER LOGIN</span> JohnDoe <span class="kw">DISABLE</span></pre><p>编辑或冻结一个用户。用于员工离职时立即撤销访问，而不删除其历史。</p></article><article><h3>CREATE ROLE</h3><pre dir="ltr"><span class="kw">CREATE ROLE</span> DataAnalysts</pre><p>创建一个权限组。管理一个组而不是逐个管理用户——可扩展又清晰。</p></article><article><h3>DENY</h3><pre dir="ltr"><span class="kw">DENY DELETE ON</span> <span class="tbl">Orders</span> <span class="kw">TO</span> DataAnalysts</pre><p>强力封锁。它会覆盖任何其他 GRANT——即使对管理员组的成员也是如此。</p></article><article><h3>EXECUTE AS</h3><pre dir="ltr"><span class="kw">EXECUTE AS USER</span> = <span class="str">'AdminUser'</span></pre><p>模拟另一个用户来测试权限。无需该用户的密码。</p></article><article><h3>REVERT</h3><pre dir="ltr"><span class="kw">REVERT</span></pre><p>取消 EXECUTE AS 并恢复到原来的身份。无需断开重连。</p></article></section><section><h2>维护与优化</h2><article><h3>WITH (NOLOCK)</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">MassiveTable</span> <span class="kw">WITH</span> (NOLOCK)</pre><p>不等待锁就读取。更快，但它可能返回正在更新中的数据（脏读）。</p></article><article><h3>OPTION (RECOMPILE)</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Users</span> <span class="kw">WHERE</span> ID = @Var <span class="kw">OPTION</span> (RECOMPILE)</pre><p>强制重新计算执行计划。用于服务器“记住”了一个糟糕计划的慢查询。</p></article><article><h3>OPTION (MAXDOP)</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">HugeTable</span> <span class="kw">OPTION</span> (MAXDOP <span class="num">1</span>)</pre><p>限制查询使用多少个 CPU 核心。防止一个查询拖垮整台服务器。</p></article><article><h3>SET NOCOUNT ON</h3><pre dir="ltr"><span class="kw">SET NOCOUNT ON</span>; <span class="kw">UPDATE</span> <span class="tbl">Users</span> <span class="kw">SET</span> Name=<span class="str">'X'</span></pre><p>静默“受影响行数”消息。在拥有数千次操作的过程中减少带宽负载。</p></article><article><h3>DBCC CHECKDB</h3><pre dir="ltr"><span class="fn">DBCC CHECKDB</span>(<span class="str">'MyDatabase'</span>)</pre><p>扫描磁盘上所有数据的完整性。查找文件损坏（corruption）。每周运行一次。</p></article><article><h3>UPDATE STATISTICS</h3><pre dir="ltr"><span class="kw">UPDATE STATISTICS</span> <span class="tbl">Customers</span></pre><p>更新数据的统计图谱。加速已经开始变慢的查询。</p></article><article><h3>ALTER INDEX REBUILD</h3><pre dir="ltr"><span class="kw">ALTER INDEX ALL ON</span> <span class="tbl">Customers</span> <span class="kw">REBUILD</span></pre><p>从头重建索引。消除碎片并恢复“第一天”的速度。期间表会被锁定。</p></article><article><h3>ALTER INDEX REORGANIZE</h3><pre dir="ltr"><span class="kw">ALTER INDEX</span> idx_name <span class="kw">ON</span> <span class="tbl">Customers</span> <span class="kw">REORGANIZE</span></pre><p>不加锁地重新整理。比 REBUILD 更温和。用于安静的日常维护。</p></article><article><h3>DBCC FREEPROCCACHE</h3><pre dir="ltr"><span class="fn">DBCC FREEPROCCACHE</span></pre><p>清除所有执行计划内存。用于重置因计划嗅探（plan sniffing）而变慢的服务器。</p></article><article><h3>DBCC SHRINKDATABASE</h3><pre dir="ltr"><span class="fn">DBCC SHRINKDATABASE</span>(<span class="str">'MyDB'</span>)</pre><p>收缩数据库并把磁盘空间归还给操作系统。在删除大量数据之后使用。</p></article></section><section><h2>高级日期与时区</h2><article><h3>DATEFROMPARTS()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">DATEFROMPARTS</span>(<span class="num">2023</span>, <span class="num">10</span>, <span class="num">31</span>)</pre><p>用 3 个独立的数字（年、月、日）构建一个日期。用于合并来自应用的独立字段。</p></article><article><h3>TIMEFROMPARTS()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">TIMEFROMPARTS</span>(<span class="num">14</span>, <span class="num">30</span>, <span class="num">0</span>, <span class="num">0</span>, <span class="num">0</span>)</pre><p>用 5 个数字构建一个时间。用于带独立时/分字段的打卡系统。</p></article><article><h3>DATETIME2FROMPARTS()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">DATETIME2FROMPARTS</span>(<span class="num">2023</span>,<span class="num">1</span>,<span class="num">1</span>,<span class="num">12</span>,<span class="num">0</span>,<span class="num">0</span>,<span class="num">0</span>,<span class="num">0</span>)</pre><p>以高精度构建完整的 DATETIME2（年+月+日+时+分+秒）。</p></article><article><h3>SYSUTCDATETIME()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">SYSUTCDATETIME</span>()</pre><p>通用 UTC 的当前时间。对面向全球用户的应用是必备。</p></article><article><h3>AT TIME ZONE</h3><pre dir="ltr"><span class="kw">SELECT</span> OrderDate <span class="kw">AT TIME ZONE</span> <span class="str">'Israel Standard Time'</span></pre><p>把日期转换到某个特定时区，包含夏令时。无需手动计算。</p></article><article><h3>SWITCHOFFSET()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">SWITCHOFFSET</span>(<span class="col">OrderDate</span>, <span class="str">'+03:00'</span>)</pre><p>手动移动时区偏移。用于以用户的本地时间显示日期。</p></article><article><h3>TODATETIMEOFFSET()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">TODATETIMEOFFSET</span>(<span class="fn">GETDATE</span>(), <span class="str">'+02:00'</span>)</pre><p>把一个普通日期变成带时区身份的 DateTimeOffset。用于全球计算。</p></article><article><h3>DATENAME()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">DATENAME</span>(month, <span class="fn">GETDATE</span>())</pre><p>返回一个文本名称（January、Monday）。与返回数字的 DATEPART 不同。</p></article></section><section><h2>临时表、GUID 与序列</h2><article><h3>CREATE TABLE #Temp</h3><pre dir="ltr"><span class="kw">CREATE TABLE</span> #UserStats (<span class="col">ID</span> INT, <span class="col">Score</span> INT)</pre><p>一张本地临时表——它只存在于当前连接中。用于中间计算而不污染数据库。</p></article><article><h3>CREATE TABLE ##Temp</h3><pre dir="ltr"><span class="kw">CREATE TABLE</span> ##GlobalCache (<span class="col">Data</span> VARCHAR(<span class="num">100</span>))</pre><p>一张全局临时表——所有连接都可访问。用于在用户之间共享缓存数据。</p></article><article><h3>DECLARE @Table TABLE</h3><pre dir="ltr"><span class="kw">DECLARE</span> @MyList <span class="kw">TABLE</span> (EmpID INT)</pre><p>仅在 RAM 中的表。对少量数据非常快——不写入磁盘。</p></article><article><h3>NEWID()</h3><pre dir="ltr"><span class="kw">INSERT INTO</span> <span class="tbl">Users</span> (ID) <span class="kw">VALUES</span> (<span class="fn">NEWID</span>())</pre><p>生成一个全局唯一的 GUID。用于安全、不可猜测的 ID，以及跨服务器合并数据。</p></article><article><h3>NEWSEQUENTIALID()</h3><pre dir="ltr"><span class="kw">DEFAULT</span> <span class="fn">NEWSEQUENTIALID</span>()</pre><p>一个按升序运行的 GUID。解决 NEWID 的性能问题——保持索引有序。</p></article><article><h3>CREATE SEQUENCE</h3><pre dir="ltr"><span class="kw">CREATE SEQUENCE</span> InvoiceSeq <span class="kw">AS INT START WITH</span> <span class="num">1</span></pre><p>一个不绑定到表的独立计数器。多张表可以共享的递增编号。</p></article><article><h3>NEXT VALUE FOR</h3><pre dir="ltr"><span class="kw">INSERT INTO</span> <span class="tbl">Invoices</span> (ID) <span class="kw">VALUES</span> (<span class="kw">NEXT VALUE FOR</span> InvoiceSeq)</pre><p>从 SEQUENCE 取下一个编号。用于无重复的编号发票。</p></article><article><h3>FORMATMESSAGE()</h3><pre dir="ltr"><span class="fn">FORMATMESSAGE</span>(<span class="str">'Welcome %s, code: %i'</span>, <span class="str">'Dan'</span>, <span class="num">123</span>)</pre><p>把变量注入文本模板。用于构建可读、集中管理的错误消息。</p></article></section><section><h2>高级窗口函数</h2><article><h3>PERCENT_RANK()</h3><pre dir="ltr"><span class="fn">PERCENT_RANK</span>() <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> Score)</pre><p>以百分比表示的相对排名（0-1）。“高于全班的 85%”——无需知道班级人数。</p></article><article><h3>CUME_DIST()</h3><pre dir="ltr"><span class="fn">CUME_DIST</span>() <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> Score)</pre><p>累积分布——数据中小于或等于当前值的比例。用于钟形曲线。</p></article><article><h3>PERCENTILE_CONT()</h3><pre dir="ltr"><span class="fn">PERCENTILE_CONT</span>(<span class="num">0.5</span>) <span class="kw">WITHIN GROUP</span> (<span class="kw">ORDER BY</span> Salary) <span class="kw">OVER</span>()</pre><p>带插值的百分位数。如果没有精确的中间值，则返回两个值的平均。</p></article><article><h3>PERCENTILE_DISC()</h3><pre dir="ltr"><span class="fn">PERCENTILE_DISC</span>(<span class="num">0.5</span>) <span class="kw">WITHIN GROUP</span> (<span class="kw">ORDER BY</span> Salary) <span class="kw">OVER</span>()</pre><p>精确的百分位数——只返回数据中确实存在的值。不做插值。</p></article><article><h3>GROUPING()</h3><pre dir="ltr"><span class="kw">SELECT</span> Dept, <span class="fn">GROUPING</span>(Dept), <span class="fn">SUM</span>(Salary) <span class="kw">GROUP BY ROLLUP</span>(Dept)</pre><p>对 ROLLUP 汇总行返回 1。用于区分真正的 NULL 和“总计”行。</p></article><article><h3>GROUPING_ID()</h3><pre dir="ltr"><span class="fn">GROUPING_ID</span>(Dep, Job) <span class="kw">GROUP BY CUBE</span>(Dep, Job)</pre><p>在 CUBE 中标识分组类型的二进制代码。用于对多维矩阵的行排序。</p></article><article><h3>CHOOSE()</h3><pre dir="ltr"><span class="kw">SELECT</span> <span class="fn">CHOOSE</span>(MonthNum, <span class="str">'Jan'</span>, <span class="str">'Feb'</span>, <span class="str">'Mar'</span>...) <span class="kw">FROM</span> <span class="tbl">Sales</span></pre><p>按索引从列表中挑选一个值。CHOOSE(2,...) = 第二项。CASE 的简短替代。</p></article><article><h3>ANY_VALUE()</h3><pre dir="ltr"><span class="kw">SELECT</span> Category, <span class="fn">ANY_VALUE</span>(ManagerName) <span class="kw">FROM</span> <span class="tbl">Items</span> <span class="kw">GROUP BY</span> Category</pre><p>返回组中的某个值。当它们全部相同时——比把 MAX(Name) 当作间接技巧更快。</p></article><article><h3>NULLS FIRST / LAST</h3><pre dir="ltr"><span class="kw">ORDER BY</span> DeliveryDate <span class="kw">ASC NULLS LAST</span></pre><p>控制 NULL 在排序中出现的位置。防止空白跳到报表顶部。支持：Postgres/MySQL。</p></article><article><h3>Dynamic PIVOT</h3><pre dir="ltr"><span class="fn">EXEC</span>(@DynamicPivotQuery)</pre><p>一个根据数据动态构建自身的 PIVOT。用于列事先未知的透视表。</p></article></section><section><h2>数据复制与表操作（高级 DML）</h2><article><h3>SELECT TOP WITH TIES</h3><pre dir="ltr"><span class="kw">SELECT TOP</span> <span class="num">3</span> <span class="kw">WITH TIES</span> * <span class="kw">FROM</span> <span class="tbl">Orders</span> <span class="kw">ORDER BY</span> Amount <span class="kw">DESC</span></pre><p>返回前 N 名，包括并列。如果有 4 行并列第 3——它们全部返回。</p></article><article><h3>INSERT OR IGNORE</h3><pre dir="ltr"><span class="kw">INSERT OR IGNORE INTO</span> <span class="tbl">Users</span> <span class="kw">VALUES</span>(<span class="num">1</span>, <span class="str">'Dan'</span>)</pre><p>添加一行，如果它已存在——则静默忽略，不报错。SQLite/MySQL。</p></article><article><h3>INSERT OR REPLACE</h3><pre dir="ltr"><span class="kw">INSERT OR REPLACE INTO</span> <span class="tbl">Users</span> <span class="kw">VALUES</span>(<span class="num">1</span>, <span class="str">'Dan'</span>)</pre><p>添加一行，如果它已存在——则替换它。SQLite 中 upsert 的捷径。</p></article><article><h3>UPDATE FROM (JOIN)</h3><pre dir="ltr"><span class="kw">UPDATE</span> t <span class="kw">SET</span> t.Price = s.NewPrice <span class="kw">FROM</span> <span class="tbl">Products</span> t <span class="kw">JOIN</span> <span class="tbl">Source</span> s <span class="kw">ON</span> t.ID = s.ID</pre><p>通过 JOIN 用另一张表的数据更新一张表。用于从外部源同步价格。</p></article><article><h3>DELETE WITH JOIN</h3><pre dir="ltr"><span class="kw">DELETE</span> t <span class="kw">FROM</span> <span class="tbl">Orders</span> t <span class="kw">JOIN</span> <span class="tbl">Cancelled</span> c <span class="kw">ON</span> t.ID = c.ID</pre><p>按条件从一张被连接的表中删除行。比 NOT IN 更精确。</p></article><article><h3>OUTPUT (SQL Server)</h3><pre dir="ltr"><span class="kw">DELETE FROM</span> <span class="tbl">Orders</span> <span class="kw">OUTPUT DELETED</span>.* <span class="kw">WHERE</span> Status=<span class="str">'Old'</span></pre><p>返回在操作期间被删除/更新的行。用于文档记录和变更日志。</p></article><article><h3>RETURNING (PostgreSQL)</h3><pre dir="ltr"><span class="kw">INSERT INTO</span> <span class="tbl">Users</span>(Name) <span class="kw">VALUES</span>(<span class="str">'Dan'</span>) <span class="kw">RETURNING</span> ID</pre><p>返回所创建行的值。PostgreSQL 中相当于 OUTPUT——用于获取新的 ID。</p></article><article><h3>EXCEPT ALL</h3><pre dir="ltr"><span class="kw">SELECT</span> ID <span class="kw">FROM</span> <span class="tbl">A</span> <span class="kw">EXCEPT ALL SELECT</span> ID <span class="kw">FROM</span> <span class="tbl">B</span></pre><p>带重复的相减——不从结果中去除重复。比普通的 EXCEPT 更快。</p></article><article><h3>INTERSECT ALL</h3><pre dir="ltr"><span class="kw">SELECT</span> ID <span class="kw">FROM</span> <span class="tbl">A</span> <span class="kw">INTERSECT ALL SELECT</span> ID <span class="kw">FROM</span> <span class="tbl">B</span></pre><p>带重复的交集——保留所有出现。PostgreSQL/高级引擎。</p></article><article><h3>TABLESAMPLE</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Customers</span> <span class="kw">TABLESAMPLE</span> (<span class="num">10</span> PERCENT)</pre><p>返回表中 X 百分比的随机样本。用于在巨型表上快速测试。</p></article></section><section><h2>高级数据分析（Analytics）</h2><article><h3>RATIO_TO_REPORT()</h3><pre dir="ltr"><span class="fn">RATIO_TO_REPORT</span>(Amount) <span class="kw">OVER</span>()</pre><p>占总数的百分比。每一行除以总计——用于某项销售占公司总额的份额。</p></article><article><h3>SUM OVER (Running Total)</h3><pre dir="ltr"><span class="fn">SUM</span>(Amount) <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> Date <span class="kw">ROWS UNBOUNDED PRECEDING</span>)</pre><p>累计总和——每一行都把它之前的全部加起来。</p></article><article><h3>AVG OVER (Moving Avg)</h3><pre dir="ltr"><span class="fn">AVG</span>(Amount) <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> Date <span class="kw">ROWS BETWEEN</span> <span class="num">6</span> <span class="kw">PRECEDING AND CURRENT ROW</span>)</pre><p>7 天移动平均。用于平滑销售数据中的季节性和趋势。</p></article><article><h3>MIN/MAX OVER (Running)</h3><pre dir="ltr"><span class="fn">MAX</span>(Price) <span class="kw">OVER</span>(<span class="kw">ORDER BY</span> Date <span class="kw">ROWS UNBOUNDED PRECEDING</span>)</pre><p>累计的最大/最小值——在每个时间点回答“到目前为止的峰值是多少？”。</p></article><article><h3>COUNT DISTINCT (Approx)</h3><pre dir="ltr"><span class="fn">APPROX_COUNT_DISTINCT</span>(<span class="col">CustomerID</span>)</pre><p>近似的去重计数（约 2% 误差）。在大数据上比 COUNT DISTINCT 快 10 倍。</p></article><article><h3>LISTAGG() / GROUP_CONCAT</h3><pre dir="ltr"><span class="fn">LISTAGG</span>(Name, <span class="str">', '</span>) <span class="kw">WITHIN GROUP</span> (<span class="kw">ORDER BY</span> Name)</pre><p>把行合并成一个有序列表。Oracle/PostgreSQL——带内部排序的 STRING_AGG。</p></article><article><h3>PIVOT with SUM/COUNT/AVG</h3><pre dir="ltr"><span class="fn">SUM</span>(Amount) <span class="kw">FOR</span> Quarter <span class="kw">IN</span> ([Q1],[Q2],[Q3],[Q4])</pre><p>带多种函数的透视——不只是 SUM。用于灵活的多维报表。</p></article><article><h3>CROSS APPLY</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Customers</span> c <span class="kw">CROSS APPLY</span> (<span class="kw">SELECT TOP</span> <span class="num">3</span> * <span class="kw">FROM</span> <span class="tbl">Orders</span> o <span class="kw">WHERE</span> o.CustID=c.ID) t</pre><p>为每一行运行一个子查询。像 JOIN 但带相关性——用于每位客户的 TOP N。</p></article><article><h3>OUTER APPLY</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Customers</span> c <span class="kw">OUTER APPLY</span> (...) t</pre><p>像 CROSS APPLY，但也返回没有匹配的行（类似 LEFT JOIN）。</p></article><article><h3>GENERATE_SERIES()</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="fn">GENERATE_SERIES</span>(<span class="num">1</span>, <span class="num">12</span>)</pre><p>生成一串数字/日期序列。用于日历和在缺失日期上没有“空洞”的报表。</p></article></section><section><h2>全文搜索与文本检索</h2><article><h3>CONTAINS()</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Articles</span> <span class="kw">WHERE</span> <span class="fn">CONTAINS</span>(Body, <span class="str">'SQL AND performance'</span>)</pre><p>高级全文搜索。因为使用文本索引，所以比 LIKE 更快。支持 AND/OR/NOT。</p></article><article><h3>FREETEXT()</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Docs</span> <span class="kw">WHERE</span> <span class="fn">FREETEXT</span>(Content, <span class="str">'database optimization'</span>)</pre><p>自由形式的搜索——也能找到词形变化和相关词。比 CONTAINS 不够精确但更灵活。</p></article><article><h3>CONTAINSTABLE()</h3><pre dir="ltr"><span class="kw">SELECT</span> k.RANK, t.* <span class="kw">FROM</span> <span class="tbl">Docs</span> t <span class="kw">JOIN</span> <span class="fn">CONTAINSTABLE</span>(<span class="tbl">Docs</span>,*,<span class="str">'SQL'</span>) k <span class="kw">ON</span> t.ID=k.[KEY]</pre><p>像 CONTAINS，但返回相关性排名。用于带匹配评分的搜索引擎。</p></article><article><h3>FREETEXTTABLE()</h3><pre dir="ltr"><span class="kw">JOIN</span> <span class="fn">FREETEXTTABLE</span>(<span class="tbl">Docs</span>,*,<span class="str">'query'</span>) k <span class="kw">ON</span> t.ID=k.[KEY]</pre><p>带排名的 FREETEXT。用于 Google 式搜索——返回按相关性排序的结果。</p></article><article><h3>MATCH...AGAINST (MySQL)</h3><pre dir="ltr"><span class="kw">WHERE</span> <span class="fn">MATCH</span>(title, body) <span class="kw">AGAINST</span>(<span class="str">'SQL performance'</span>)</pre><p>MySQL 中的全文搜索。需要在列上建立 FULLTEXT 索引。比 LIKE 快得多。</p></article><article><h3>LIKE with Escape</h3><pre dir="ltr"><span class="kw">WHERE</span> Name <span class="kw">LIKE</span> <span class="str">'100\%'</span> <span class="kw">ESCAPE</span> <span class="str">'\'</span></pre><p>搜索字面的 % 字符（不是通配符）。用于把 “100%” 当作字面文本来搜索。</p></article><article><h3>REGEXP / RLIKE (MySQL)</h3><pre dir="ltr"><span class="kw">WHERE</span> Email <span class="fn">REGEXP</span> <span class="str">'^[a-zA-Z]+@'</span></pre><p>用正则表达式进行搜索。用于验证复杂格式——邮箱、电话、产品代码。</p></article><article><h3>SIMILAR TO (PostgreSQL)</h3><pre dir="ltr"><span class="kw">WHERE</span> Code <span class="kw">SIMILAR TO</span> <span class="str">'[A-Z]{3}-[0-9]+'</span></pre><p>SQL 标准风格的正则表达式。在 PostgreSQL 中——介于 LIKE 和 REGEXP 之间。</p></article></section><section><h2>高级索引与优化</h2><article><h3>CREATE FILTERED INDEX</h3><pre dir="ltr"><span class="kw">CREATE INDEX</span> idx_active <span class="kw">ON</span> <span class="tbl">Users</span>(Name) <span class="kw">WHERE</span> Status=<span class="str">'Active'</span></pre><p>只针对一个子集的索引。更小更快——用于总是按固定条件筛选的查询。</p></article><article><h3>CREATE COLUMNSTORE INDEX</h3><pre dir="ltr"><span class="kw">CREATE COLUMNSTORE INDEX</span> idx_col <span class="kw">ON</span> <span class="tbl">Sales</span>(Date, Amount)</pre><p>用于分析的列式索引。在数据仓库的 GROUP BY/SUM 上快 10-100 倍。</p></article><article><h3>CREATE COVERING INDEX</h3><pre dir="ltr"><span class="kw">CREATE INDEX</span> idx_cov <span class="kw">ON</span> <span class="tbl">Orders</span>(CustID) <span class="kw">INCLUDE</span>(Amount, Date)</pre><p>一个在 INCLUDE 中带额外列的索引。避免读取表本身——查询更快。</p></article><article><h3>EXPLAIN / EXECUTION PLAN</h3><pre dir="ltr"><span class="kw">EXPLAIN SELECT</span> * <span class="kw">FROM</span> <span class="tbl">Users</span> <span class="kw">WHERE</span> ID=<span class="num">1</span></pre><p>显示查询的执行计划。用于发现不必要的全表扫描和缺失的索引。</p></article><article><h3>SET STATISTICS IO ON</h3><pre dir="ltr"><span class="kw">SET STATISTICS IO ON</span>; <span class="kw">SELECT</span> ...</pre><p>显示读取了多少个磁盘页。用于查找导致变慢的高 I/O 查询。</p></article><article><h3>SET STATISTICS TIME ON</h3><pre dir="ltr"><span class="kw">SET STATISTICS TIME ON</span>; <span class="kw">SELECT</span> ...</pre><p>显示 CPU 和解析时间。用于对慢查询进行精确的性能分析。</p></article><article><h3>WITH (FORCESCAN)</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">T</span> <span class="kw">WITH</span> (FORCESCAN)</pre><p>即使存在索引也强制全表扫描。用于全扫描更快的情况（小表）。</p></article><article><h3>WITH (FORCESEEK)</h3><pre dir="ltr"><span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">T</span> <span class="kw">WITH</span> (FORCESEEK)</pre><p>强制使用某个索引。当引擎判断失误而选择扫描时——FORCESEEK 能修正它。</p></article><article><h3>sp_updatestats</h3><pre dir="ltr"><span class="kw">EXEC</span> sp_updatestats</pre><p>更新数据库中所有表的统计信息。在大量数据加载之后使用。</p></article></section><section><h2>高级存储过程与函数</h2><article><h3>CREATE OR ALTER PROCEDURE</h3><pre dir="ltr"><span class="kw">CREATE OR ALTER PROCEDURE</span> GetOrders <span class="kw">AS</span> ...</pre><p>用单个命令创建一个过程，或替换一个已有的过程。无需单独的 DROP-CREATE。</p></article><article><h3>Procedure with OUTPUT</h3><pre dir="ltr"><span class="kw">CREATE PROCEDURE</span> Calc (@In INT, @Out INT <span class="kw">OUTPUT</span>) <span class="kw">AS SET</span> @Out = @In * <span class="num">2</span></pre><p>一个通过 OUTPUT 参数返回值的过程。用于需要返回多个值的计算。</p></article><article><h3>Procedure with DEFAULT</h3><pre dir="ltr"><span class="kw">CREATE PROCEDURE</span> GetData (@Days INT = <span class="num">30</span>) <span class="kw">AS</span> ...</pre><p>一个带默认值的参数。你可以不带参数调用它——它会自动取 30 天。</p></article><article><h3>Inline Table-Valued Function</h3><pre dir="ltr"><span class="kw">CREATE FUNCTION</span> GetOrders(@ID
