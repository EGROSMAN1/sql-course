<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070d0f;--bg2:#0c1518;--bg3:#111e21;
  --border:rgba(0,212,200,.08);--border2:rgba(0,212,200,.18);
  --text:#e8f4f5;--text2:#6b9098;--text3:#2a4048;
  --aq:#00d4c8;--aq2:rgba(0,212,200,.12);
  --green:#00e676;--red:#ff4757;--orange:#FFB020;--purple:#9B5CFF;
  --font:'Heebo',sans-serif;--mono:'IBM Plex Mono',monospace;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);overflow-x:hidden}
.topnav{background:rgba(7,13,15,.97);border-bottom:1px solid var(--border);padding:.6rem 1.25rem;display:flex;align-items:center;gap:.75rem;position:sticky;top:0;z-index:100;flex-wrap:wrap}
.back-btn{color:var(--aq);text-decoration:none;font-size:12px;font-weight:700;font-family:var(--mono)}
.topnav-title{font-size:13px;font-weight:700;color:var(--text2)}
.topnav-right{display:flex;align-items:center;gap:.5rem;margin-right:auto;flex-wrap:wrap}
.score-badge{background:var(--bg3);border:1px solid var(--border2);color:var(--aq);font-size:12px;font-weight:700;padding:4px 10px;border-radius:6px;font-family:var(--mono)}
.ltabs{display:flex;gap:.3rem;flex-wrap:wrap}
.ltab{font-size:11px;font-weight:700;padding:4px 9px;border-radius:5px;text-decoration:none;border:1px solid var(--border2);color:var(--text2);transition:all .12s}
.ltab:hover{color:var(--text)}
.ltab.active{background:rgba(155,92,255,.15);border-color:var(--purple);color:var(--purple)}
/* Firebase */
.fb-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:.5rem 1.5rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;position:sticky;top:48px;z-index:90}
.fb-login-btn{display:flex;align-items:center;gap:6px;background:#4285f4;color:#fff;border:none;padding:7px 14px;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--font)}
.fb-logout-btn{display:none;align-items:center;gap:5px;background:transparent;color:var(--text2);border:1px solid var(--border2);padding:5px 10px;border-radius:6px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:var(--font)}
.fb-user-info{display:none;align-items:center;gap:.5rem}
.fb-user-photo{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--aq)}
.fb-user-name{font-size:12.5px;font-weight:700;color:var(--text)}
.fb-saved-score{display:none;font-size:11px;color:var(--aq);font-family:var(--mono);background:rgba(0,212,200,.08);padding:3px 9px;border-radius:4px}
.fb-save-btn{display:none;align-items:center;gap:5px;background:var(--aq);color:var(--bg);border:none;padding:7px 14px;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--font);margin-right:auto}
.fb-history-btn{display:none;align-items:center;gap:5px;background:transparent;color:var(--text2);border:1px solid var(--border2);padding:5px 10px;border-radius:6px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:var(--font)}
.fb-history-btn:hover{color:var(--text);border-color:var(--aq)}
.fb-history-wrap{background:var(--bg2);border-bottom:1px solid var(--border);padding:1rem 1.5rem;display:none}
.hstats-row{display:flex;gap:1.5rem;margin-bottom:1rem;justify-content:center}
.hstat-mini{text-align:center}
.hstat-n{font-size:1.4rem;font-weight:900;font-family:var(--mono)}
.hstat-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.hchart{display:flex;align-items:flex-end;gap:.4rem;height:130px;padding:.5rem 0;overflow-x:auto}
.hbar-wrap{display:flex;flex-direction:column;align-items:center;gap:.2rem;min-width:32px;flex-shrink:0}
.hbar{width:24px;border-radius:4px 4px 0 0;min-height:8px}
.hbar-val{font-size:9.5px;color:var(--text2);font-family:var(--mono)}
.hbar-lbl{font-size:9px;color:var(--text3)}
#fb-toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--aq);color:var(--bg);padding:10px 20px;border-radius:8px;font-weight:700;font-size:13px;opacity:0;transition:all .3s;z-index:999;pointer-events:none}
#fb-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Hero */
.hero{padding:2rem 1.5rem 1.5rem;text-align:center;border-bottom:1px solid var(--border);background:radial-gradient(ellipse 70% 60% at 50% 0%,rgba(155,92,255,.07),transparent 70%)}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(155,92,255,.12);border:1px solid rgba(155,92,255,.3);color:var(--purple);font-size:10px;font-weight:700;padding:4px 12px;border-radius:20px;font-family:var(--mono);letter-spacing:1px;margin-bottom:.75rem}
.hero-title{font-size:2rem;font-weight:900;color:var(--text);margin-bottom:.3rem}
.hero-title em{color:var(--purple);font-style:normal}
.hero-desc{color:var(--text2);font-size:.9rem;margin-bottom:1.25rem}
.hero-stats{display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap}
.hs{text-align:center}
.hs-n{font-size:1.6rem;font-weight:900;font-family:var(--mono);color:var(--purple)}
.hs-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
/* Progress */
.prog-bar-wrap{padding:.75rem 1.5rem;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:1rem;position:sticky;top:96px;z-index:80}
.prog-bar{flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--purple);border-radius:2px;transition:width .3s}
.prog-txt{font-size:11px;color:var(--text2);font-family:var(--mono);white-space:nowrap}
.score-display{font-size:12px;font-weight:700;font-family:var(--mono);color:var(--purple);white-space:nowrap}
/* Main */
.main{max-width:800px;margin:0 auto;padding:1.5rem 1rem 4rem}
.sec-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--purple);font-family:var(--mono);padding:.75rem 0 .5rem;margin-top:1rem;border-bottom:1px solid var(--border);margin-bottom:1rem}
/* Cards */
.q-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1.1rem 1.25rem;margin-bottom:.75rem;transition:border-color .2s}
.q-card.correct{border-color:rgba(0,230,118,.3)}
.q-card.wrong{border-color:rgba(255,71,87,.3)}
.q-meta{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem}
.q-num{font-size:10px;font-family:var(--mono);color:var(--text3);background:var(--bg3);padding:2px 8px;border-radius:4px;font-weight:700}
.q-sec-tag{font-size:10px;color:var(--text3);font-weight:600}
.q-text{font-size:14px;font-weight:700;color:var(--text);line-height:1.55;margin-bottom:.85rem}
.options{display:flex;flex-direction:column;gap:.4rem}
.option{display:flex;align-items:flex-start;gap:.65rem;padding:.6rem .8rem;background:var(--bg3);border:1px solid var(--border);border-radius:7px;cursor:pointer;transition:all .15s;user-select:none}
.option:hover:not(.disabled){border-color:var(--border2);background:rgba(155,92,255,.05)}
.option.disabled{cursor:default}
.option.correct-ans{border-color:rgba(0,230,118,.5);background:rgba(0,230,118,.07)}
.option.wrong-ans{border-color:rgba(255,71,87,.4);background:rgba(255,71,87,.07)}
.opt-letter{width:20px;height:20px;border-radius:4px;background:var(--bg);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--text2);flex-shrink:0;font-family:var(--mono)}
.option.correct-ans .opt-letter{background:rgba(0,230,118,.2);border-color:rgba(0,230,118,.5);color:var(--green)}
.option.wrong-ans .opt-letter{background:rgba(255,71,87,.2);border-color:rgba(255,71,87,.5);color:var(--red)}
.opt-text{font-size:13px;color:var(--text2);line-height:1.5}
.option.correct-ans .opt-text{color:var(--text)}
.explanation{background:var(--bg3);border-right:2px solid var(--purple);border-radius:0 6px 6px 0;padding:.6rem .85rem;margin-top:.6rem;display:none}
.explanation.show{display:block}
.exp-label{font-size:10px;font-weight:700;color:var(--purple);font-family:var(--mono);margin-bottom:.25rem}
.exp-text{font-size:12.5px;color:var(--text2);line-height:1.6}
/* Finish */
.finish-card{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:2.5rem;text-align:center;margin-top:2rem;display:none}
.finish-card.show{display:block}
.finish-emoji{font-size:3rem;margin-bottom:.75rem}
.finish-title{font-size:1.5rem;font-weight:900;color:var(--text);margin-bottom:.5rem}
.finish-score{font-size:2.5rem;font-weight:900;font-family:var(--mono);color:var(--purple);margin-bottom:.5rem}
.finish-grade{font-size:1rem;font-weight:700;margin-bottom:.5rem}
.finish-sub{font-size:.9rem;color:var(--text2);margin-bottom:1.5rem}
.retry-btn{background:var(--purple);color:#fff;border:none;padding:10px 24px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;font-family:var(--font)}
.level-link{display:inline-block;background:transparent;color:var(--text2);border:1px solid var(--border2);padding:10px 20px;border-radius:8px;font-weight:600;font-size:13px;text-decoration:none;margin-top:.5rem;transition:all .15s;margin-right:.5rem}
.level-link:hover{border-color:var(--purple);color:var(--purple)}
@media(max-width:768px){
  .ltabs{display:none}
  .hero{padding:1.25rem .75rem 1rem}
  .hero-title{font-size:1.5rem}
  .main{padding:1rem .5rem 3rem}
  .q-text{font-size:13px}
  .opt-text{font-size:12.5px}
}

/* trilingual flag toggle — compact on mobile (3 langs) */
@media(max-width:560px){
  a[title="עברית"],a[title="English"],a[title="中文"]{font-size:11px;padding:3px 7px;gap:3px}
  a[title="עברית"] svg,a[title="English"] svg,a[title="中文"] svg{width:16px;height:11px}
  .lang-flags{flex-wrap:wrap;gap:4px}
}
@media(max-width:380px){
  a[title="עברית"],a[title="English"],a[title="中文"]{font-size:0;padding:3px 5px;gap:0}
  a[title="עברית"] svg,a[title="English"] svg,a[title="中文"] svg{width:18px;height:12px}
}

const L=['A','B','C','D'];
let answers={}, correct=0, curSec=null;

function updateScore(){
  const tot=Object.keys(answers).length;
  const pct=tot>0?Math.round(correct/tot*100):0;
  document.getElementById('scoreText').textContent='✅ '+correct+' / '+tot;
  document.getElementById('scoreFill').style.width=(Math.round(correct/Q.length*100))+'%';
  document.getElementById('progTxt').textContent=tot+' / '+Q.length;
  document.getElementById('scoreDisplay').textContent=pct+'%';
  document.getElementById('heroAnswered').textContent=tot;
  document.getElementById('heroCorrect').textContent=correct;
  document.getElementById('heroPct').textContent=pct+'%';
  if(tot===Q.length) showFinish();
}

function selectOption(qi,oi){
  if(answers[qi]!==undefined)return;
  const q=Q[qi]; const ok=oi===q.c;
  answers[qi]=oi; if(ok)correct++;
  const card=document.getElementById('qcard-'+qi);
  card.classList.add(ok?'correct':'wrong');
  card.querySelectorAll('.option').forEach((o,i)=>{
    o.classList.add('disabled');
    if(i===q.c)o.classList.add('correct-ans');
    if(i===oi&&!ok)o.classList.add('wrong-ans');
  });
  const exp=document.getElementById('exp-'+qi);
  exp.querySelector('.exp-text').innerHTML=(ok?'✅ 正确！ ':'❌ 错误——正确答案以绿色标出。 ')+q.e;
  exp.classList.add('show');
  updateScore();
}

  const mc=document.getElementById('mainContent');
  mc.innerHTML=''; curSec=null;
  Q.forEach((q,i)=>{
    if(q.s!==curSec){curSec=q.s;mc.innerHTML+=`<div class="sec-label">${q.s}</div>`;}
    const opts=q.o.map((o,oi)=>`<div class="option" onclick="selectOption(${i},${oi})"><div class="opt-letter">${L[oi]}</div><div class="opt-text">${o}</div></div>`).join('');
    mc.innerHTML+=`<div class="q-card" id="qcard-${i}"><div class="q-meta"><div class="q-num">第 ${q.n} 题</div><div class="q-sec-tag">${q.s.split('—')[1]?.trim()||q.s}</div></div><div class="q-text">${q.t}</div><div class="options">${opts}</div><div class="explanation" id="exp-${i}"><div class="exp-label">💡 Explanation</div><div class="exp-text"></div></div></div>`;
  });
  mc.innerHTML+=`<div class="finish-card" id="finishCard"><div class="finish-emoji">🏆</div><div class="finish-title">You finished the advanced level!</div><div class="finish-score" id="finishScore">0/60</div><div class="finish-grade" id="finishGrade"></div><div class="finish-sub" id="finishSub"></div><br><button class="retry-btn" onclick="resetQuiz()">🔄 重新尝试</button><a href="quiz-medium.html" class="level-link">📗 Back to the intermediate level</a></div>`;
}

function showFinish(){
  if(window.fbAutoSave&&window.currentUser)window.fbAutoSave(correct,Q.length);
  const pct=Math.round(correct/Q.length*100);
  document.getElementById('finishScore').textContent=correct+' / '+Q.length;
  const grades=[[90,'🏆 优秀！','令人印象深刻地掌握了高级水平！'],[75,'⭐ 很好','再多练一点你就能完全掌握了！'],[60,'👍 良好','值得复习一下较薄弱的材料。'],[0,'💪 继续练习','复习一下各章节再试一次！']];
  const [,grade,sub]=grades.find(([t])=>pct>=t);
  document.getElementById('finishGrade').textContent=grade;
  document.getElementById('finishSub').textContent=sub;
  const card=document.getElementById('finishCard');
  card.classList.add('show');
  card.scrollIntoView({behavior:'smooth',block:'center'});
}

function resetQuiz(){
  answers={};correct=0;
  document.getElementById('finishCard').classList.remove('show');
  updateScore();buildQuiz();
  window.scrollTo({top:0,behavior:'smooth'});
}

buildQuiz();updateScore();
</script>

<script>
function fbLogin(){if(window._fbLogin)window._fbLogin();else{var b=document.getElementById('fb-login-btn');if(b)b.setAttribute('data-pending','1');}}
function fbLogout(){if(window._fbLogout)window._fbLogout();}
function fbToggleHistory(){if(window._fbToggleHistory)window._fbToggleHistory();}
function triggerSave(){if(window._triggerSave)window._triggerSave();}
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getAuth,signInWithPopup,GoogleAuthProvider,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{getFirestore,doc,setDoc,getDoc,collection,addDoc,query,orderBy,limit,getDocs}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyA04LDMDGohAs1uRnUVwWVTs5coVMrEO64",authDomain:"sql-course-507b5.firebaseapp.com",projectId:"sql-course-507b5",storageBucket:"sql-course-507b5.firebasestorage.app",messagingSenderId:"999664091380",appId:"1:999664091380:web:349959985ae11ce8c51ea1"});
const auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
let currentUser=null;window.currentUser=null;const QID='advanced2';
onAuthStateChanged(auth,async(user)=>{
  currentUser=user;window.currentUser=user;
  const li=document.getElementById('fb-login-btn'),lo=document.getElementById('fb-logout-btn'),ui=document.getElementById('fb-user-info'),hb=document.getElementById('fb-history-btn'),sb=document.getElementById('fb-save-btn');
  if(user){
    document.getElementById('fb-user-name').textContent=user.displayName;
    document.getElementById('fb-user-photo').src=user.photoURL;
    document.getElementById('fb-user-photo').style.display='block';
    li.style.display='none';lo.style.display='flex';ui.style.display='flex';hb.style.display='flex';sb.style.display='flex';
    await loadProg();await loadHist();
  }else{li.style.display='flex';lo.style.display='none';ui.style.display='none';hb.style.display='none';sb.style.display='none';}
});
window._fbLogin=window.fbLogin=async()=>{try{await signInWithPopup(auth,provider);}catch(e){console.error(e);}};
window._fbLogout=window.fbLogout=async()=>{await signOut(auth);};
window._fbToggleHistory=window.fbToggleHistory=()=>{const w=document.getElementById('fb-history-wrap');w.style.display=w.style.display==='none'?'block':'none';};
window._triggerSave=window.triggerSave=async()=>{
  if(!currentUser){window.fbLogin();return;}
  const txt=(document.getElementById('scoreText')?.textContent||'0 / 0').replace('✅ ','');
  const p=txt.split('/');const sc=parseInt(p[0])||0,tot=parseInt(p[1])||0;
  if(tot===0){showToast('⚠️ 请先至少回答一道题！');return;}
  await saveProg(sc,tot);
};
async function saveProg(score,total){
  if(!currentUser)return;
  const pct=Math.round(score/total*100);
  await setDoc(doc(db,'users',currentUser.uid,'quizzes',QID),{score,total,pct,lastUpdate:new Date().toISOString()},{merge:true});
  await addDoc(collection(db,'users',currentUser.uid,'history'),{quizId:QID,score,total,pct,date:new Date().toISOString()});
  showToast('✅ 进度已保存到云端！');await loadHist();
}
window.fbAutoSave=saveProg;
async function loadProg(){
  if(!currentUser)return;
  const s=await getDoc(doc(db,'users',currentUser.uid,'quizzes',QID));
  if(s.exists()){const d=s.data();const el=document.getElementById('fb-saved-score');el.textContent=`Last attempt: ${d.score}/${d.total} (${d.pct}%)`;el.style.display='block';}
}
async function loadHist(){
  if(!currentUser)return;
  const q=query(collection(db,'users',currentUser.uid,'history'),orderBy('date','desc'),limit(10));
  const s=await getDocs(q);const hist=[];
  s.forEach(d=>hist.push(d.data()));
  renderChart(hist.filter(h=>h.quizId===QID));
}
function renderChart(h){
  const p=document.getElementById('fb-history-panel');
  if(!h.length){p.innerHTML='<p style="color:var(--text2);font-size:13px;text-align:center;padding:1rem">No history yet — answer questions and save!</p>';return;}
  const rev=[...h].reverse();
  const best=Math.max(...h.map(x=>x.pct)),avg=Math.round(h.reduce((a,x)=>a+x.pct,0)/h.length);
  const bars=rev.map(x=>{const d=new Date(x.date);const lbl=`${d.getDate()}/${d.getMonth()+1}`;const col=x.pct>=80?'var(--aq)':x.pct>=50?'#FFB020':'#FF4060';return`<div class="hbar-wrap"><div class="hbar-val">${x.pct}%</div><div class="hbar" style="height:${Math.max(x.pct*1.1,8)}px;background:${col}"></div><div class="hbar-lbl">${lbl}</div></div>`;}).join('');
  p.innerHTML=`<div class="hstats-row"><div class="hstat-mini"><div class="hstat-n" style="color:var(--aq)">${best}%</div><div class="hstat-l">Personal best</div></div><div class="hstat-mini"><div class="hstat-n" style="color:#FFB020">${avg}%</div><div class="hstat-l">Average</div></div><div class="hstat-mini"><div class="hstat-n" style="color:var(--text2)">${h.length}</div><div class="hstat-l">Attempts</div></div></div><div class="hchart">${bars}</div>`;
}
function showToast(msg){let t=document.getElementById('fb-toast');if(!t){t=document.createElement('div');t.id='fb-toast';document.body.appendChild(t);}t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
</script>
</body>
