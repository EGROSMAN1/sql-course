<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070d0f;--bg2:#0c1518;--bg3:#111e21;
  --border:rgba(0,212,200,.08);--border2:rgba(0,212,200,.18);
  --text:#e8f4f5;--text2:#6b9098;--text3:#2a4048;
  --aq:#00d4c8;--aq2:rgba(0,212,200,.12);
  --green:#00e676;--red:#ff4757;--orange:#FFB020;
  --font:'Heebo',sans-serif;--mono:'IBM Plex Mono',monospace;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);overflow-x:hidden}

/* TOPNAV */
.topnav{background:rgba(7,13,15,.97);border-bottom:1px solid var(--border);padding:.6rem 1.25rem;display:flex;align-items:center;gap:.75rem;position:sticky;top:0;z-index:100;flex-wrap:wrap}
.back-btn{color:var(--aq);text-decoration:none;font-size:12px;font-weight:700;font-family:var(--mono)}
.topnav-title{font-size:13px;font-weight:700;color:var(--text2)}
.topnav-right{display:flex;align-items:center;gap:.5rem;margin-right:auto}
.score-badge{background:var(--bg3);border:1px solid var(--border2);color:var(--aq);font-size:12px;font-weight:700;padding:4px 10px;border-radius:6px;font-family:var(--mono)}
.level-tabs{display:flex;gap:.35rem;margin-right:.5rem}
.ltab{font-size:11px;font-weight:700;padding:4px 10px;border-radius:5px;text-decoration:none;border:1px solid var(--border2);color:var(--text2);transition:all .12s;font-family:var(--mono)}
.ltab:hover{color:var(--text);border-color:var(--border2)}
.ltab.active{background:var(--aq2);border-color:var(--aq);color:var(--aq)}

/* FIREBASE BAR */
.fb-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:.5rem 1.5rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;position:sticky;top:48px;z-index:90}
.fb-login-btn{display:flex;align-items:center;gap:6px;background:#4285f4;color:#fff;border:none;padding:7px 14px;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--font)}
.fb-logout-btn{display:none;align-items:center;gap:5px;background:transparent;color:var(--text2);border:1px solid var(--border2);padding:5px 10px;border-radius:6px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:var(--font)}
.fb-user-info{display:none;align-items:center;gap:.5rem}
.fb-user-photo{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--aq)}
.fb-user-name{font-size:12.5px;font-weight:700;color:var(--text)}
.fb-saved-score{display:none;font-size:11px;color:var(--aq);font-family:var(--mono);background:rgba(0,212,200,.08);padding:3px 9px;border-radius:4px}
.fb-save-btn{display:none;align-items:center;gap:5px;background:var(--aq);color:var(--bg);border:none;padding:7px 14px;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--font);margin-right:auto}
.fb-history-btn{display:none;align-items:center;gap:5px;background:transparent;color:var(--text2);border:1px solid var(--border2);padding:5px 10px;border-radius:6px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:var(--font)}
.fb-history-btn:hover{color:var(--text);border-color:var(--aq)}
.fb-history-wrap{background:var(--bg2);border-bottom:1px solid var(--border);padding:1rem 1.5rem;display:none}
.hstats-row{display:flex;gap:1.5rem;margin-bottom:1rem;justify-content:center}
.hstat-mini{text-align:center}
.hstat-n{font-size:1.4rem;font-weight:900;font-family:var(--mono)}
.hstat-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.hchart{display:flex;align-items:flex-end;gap:.4rem;height:130px;padding:.5rem 0;overflow-x:auto}
.hbar-wrap{display:flex;flex-direction:column;align-items:center;gap:.2rem;min-width:32px;flex-shrink:0}
.hbar{width:24px;border-radius:4px 4px 0 0;transition:all .3s;min-height:8px}
.hbar-val{font-size:9.5px;color:var(--text2);font-family:var(--mono)}
.hbar-lbl{font-size:9px;color:var(--text3)}
#fb-toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--aq);color:var(--bg);padding:10px 20px;border-radius:8px;font-weight:700;font-size:13px;opacity:0;transition:all .3s;z-index:999;pointer-events:none}
#fb-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* HERO */
.hero{padding:2rem 1.5rem 1.5rem;text-align:center;border-bottom:1px solid var(--border);background:radial-gradient(ellipse 70% 60% at 50% 0%,rgba(0,212,200,.06),transparent 70%)}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,212,200,.1);border:1px solid var(--border2);color:var(--aq);font-size:10px;font-weight:700;padding:4px 12px;border-radius:20px;font-family:var(--mono);letter-spacing:1px;margin-bottom:.75rem}
.hero-title{font-size:2rem;font-weight:900;color:var(--text);margin-bottom:.3rem}
.hero-title em{color:var(--aq);font-style:normal}
.hero-desc{color:var(--text2);font-size:.9rem;margin-bottom:1.25rem}
.hero-stats{display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap}
.hs{text-align:center}
.hs-n{font-size:1.6rem;font-weight:900;font-family:var(--mono);color:var(--aq)}
.hs-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}

/* PROGRESS */
.prog-bar-wrap{padding:.75rem 1.5rem;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:1rem;position:sticky;top:96px;z-index:80}
.prog-bar{flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--aq);border-radius:2px;transition:width .3s}
.prog-txt{font-size:11px;color:var(--text2);font-family:var(--mono);white-space:nowrap}
.score-display{font-size:12px;font-weight:700;font-family:var(--mono);color:var(--aq);white-space:nowrap}

/* MAIN */
.main{max-width:800px;margin:0 auto;padding:1.5rem 1rem 4rem}

/* SECTION LABEL */
.sec-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--aq);font-family:var(--mono);padding:.75rem 0 .5rem;margin-top:1rem;border-bottom:1px solid var(--border);margin-bottom:1rem}

/* QUESTION CARD */
.q-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1.1rem 1.25rem;margin-bottom:.75rem;transition:border-color .2s}
.q-card.correct{border-color:rgba(0,230,118,.3)}
.q-card.wrong{border-color:rgba(255,71,87,.3)}
.q-header{margin-bottom:.85rem}
.q-meta{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem}
.q-num{font-size:10px;font-family:var(--mono);color:var(--text3);background:var(--bg3);padding:2px 8px;border-radius:4px;font-weight:700}
.q-section-tag{font-size:10px;color:var(--text3);font-weight:600}
.q-text{font-size:14px;font-weight:700;color:var(--text);line-height:1.55}
.options{display:flex;flex-direction:column;gap:.4rem}
.option{display:flex;align-items:flex-start;gap:.65rem;padding:.6rem .8rem;background:var(--bg3);border:1px solid var(--border);border-radius:7px;cursor:pointer;transition:all .15s;user-select:none}
.option:hover:not(.disabled){border-color:var(--border2);background:rgba(0,212,200,.05)}
.option.disabled{cursor:default}
.option.correct-ans{border-color:rgba(0,230,118,.5);background:rgba(0,230,118,.07)}
.option.wrong-ans{border-color:rgba(255,71,87,.4);background:rgba(255,71,87,.07)}
.opt-letter{width:20px;height:20px;border-radius:4px;background:var(--bg);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--text2);flex-shrink:0;font-family:var(--mono)}
.option.correct-ans .opt-letter{background:rgba(0,230,118,.2);border-color:rgba(0,230,118,.5);color:var(--green)}
.option.wrong-ans .opt-letter{background:rgba(255,71,87,.2);border-color:rgba(255,71,87,.5);color:var(--red)}
.opt-text{font-size:13px;color:var(--text2);line-height:1.5}
.option.correct-ans .opt-text{color:var(--text)}
.explanation{background:var(--bg3);border-right:2px solid var(--aq);border-radius:0 6px 6px 0;padding:.6rem .85rem;margin-top:.6rem;display:none}
.explanation.show{display:block}
.exp-label{font-size:10px;font-weight:700;color:var(--aq);font-family:var(--mono);margin-bottom:.25rem}
.exp-text{font-size:12.5px;color:var(--text2);line-height:1.6}

/* FINISH */
.finish-card{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:2.5rem;text-align:center;margin-top:2rem;display:none}
.finish-card.show{display:block}
.finish-emoji{font-size:3rem;margin-bottom:.75rem}
.finish-title{font-size:1.5rem;font-weight:900;color:var(--text);margin-bottom:.5rem}
.finish-score{font-size:2.5rem;font-weight:900;font-family:var(--mono);color:var(--aq);margin-bottom:.5rem}
.finish-grade{font-size:1rem;font-weight:700;margin-bottom:.5rem}
.finish-sub{font-size:.9rem;color:var(--text2);margin-bottom:1.5rem}
.retry-btn{background:var(--aq);color:var(--bg);border:none;padding:10px 24px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;font-family:var(--font);margin-left:.5rem}
.level-link{display:inline-block;background:transparent;color:var(--text2);border:1px solid var(--border2);padding:10px 20px;border-radius:8px;font-weight:600;font-size:13px;text-decoration:none;margin-top:.5rem;transition:all .15s}
.level-link:hover{border-color:var(--aq);color:var(--aq)}

/* MOBILE */
@media(max-width:768px){
  .topnav{padding:.4rem .75rem}
  .topnav-title{font-size:11px}
  .level-tabs{display:none}
  .hero{padding:1.25rem .75rem 1rem}
  .hero-title{font-size:1.5rem}
  .main{padding:1rem .5rem 3rem}
  .q-card{padding:.85rem}
  .q-text{font-size:13px}
  .option{padding:.5rem .65rem}
  .opt-text{font-size:12.5px}
  .finish-card{padding:1.5rem}
  .finish-score{font-size:2rem}
}

/* trilingual flag toggle — compact on mobile (3 langs) */
@media(max-width:560px){
  a[title="עברית"],a[title="English"],a[title="中文"]{font-size:11px;padding:3px 7px;gap:3px}
  a[title="עברית"] svg,a[title="English"] svg,a[title="中文"] svg{width:16px;height:11px}
  .lang-flags{flex-wrap:wrap;gap:4px}
}
@media(max-width:380px){
  a[title="עברית"],a[title="English"],a[title="中文"]{font-size:0;padding:3px 5px;gap:0}
  a[title="עברית"] svg,a[title="English"] svg,a[title="中文"] svg{width:18px;height:12px}
}

<script>
const questions = [
  // ── Part 1: String Functions ──
  {n:1,s:"A 部分 —— 字符串函数",t:"哪个函数返回字符串中的字符数？",o:["SIZE()","LEN() / LENGTH()（取决于数据库）","COUNT()","CHARS()"],c:1,e:"LENGTH（在 PostgreSQL/Oracle 中）或 LEN（在 SQL Server 中）用于测量字符串的长度。"},
  {n:2,s:"A 部分 —— 字符串函数",t:"UPPER('sql') 的结果是什么？",o:["sql","SQL","Sql","S-Q-L"],c:1,e:"UPPER 函数把所有字母变成大写字母。"},
  {n:3,s:"A 部分 —— 字符串函数",t:"哪个函数用于连接两个或多个字符串？",o:["MERGE()","ADD()","CONCAT()","JOIN()"],c:2,e:"CONCAT 把多个字符串连接成一个整体。"},
  {n:4,s:"A 部分 —— 字符串函数",t:"函数 TRIM('  hello  ') 做什么？",o:["把字母变成小写。","去除字符串开头和结尾的空格。","删除字符串中所有的空格（包括中间的）。","只返回单词 'hello'。"],c:1,e:"TRIM 只清理两端多余的空格。"},
  {n:5,s:"A 部分 —— 字符串函数",t:"哪个函数返回字符串的特定部分？",o:["PART()","SPLIT()","SUBSTRING()","SECTION()"],c:2,e:"SUBSTRING 让你按起始位置和长度从字符串中切出一段。"},
  {n:6,s:"A 部分 —— 字符串函数",t:"LOWER('Apple') 的结果是什么？",o:["apple","APPLE","Apple","aPPLE"],c:0,e:"LOWER 把所有字符变成小写字母。"},
  {n:7,s:"A 部分 —— 字符串函数",t:"如何找出字符 'a' 在字符串 'Data' 中的位置？",o:["CHARINDEX() / POSITION() / INSTR()","FIND()","LOCATE_A()","WHERE()"],c:0,e:"这些函数返回一个字符在字符串中的数字索引。"},
  {n:8,s:"A 部分 —— 字符串函数",t:"函数 REPLACE('Hello World', 'World', 'SQL') 做什么？",o:["把单词 SQL 加到末尾。","把单词 'World' 替换成单词 'SQL'。","删除 'World'。","检查 'World' 是否存在于字符串中。"],c:1,e:"REPLACE 找到一个子串并用一个新值替换它。"},
  {n:9,s:"A 部分 —— 字符串函数",t:"哪个函数返回字符串中最右边的 3 个字符？",o:["LAST(3)","BACK(3)","RIGHT(string, 3)","END(3)"],c:2,e:"RIGHT 从字符串的右侧取出指定数量的字符。"},
  {n:10,s:"A 部分 —— 字符串函数",t:"函数 LEFT('Database', 4) 返回什么？",o:["base","Data","abas","D"],c:1,e:"LEFT 从字符串的开头（左侧）取出所请求数量的字符。"},
  {n:11,s:"A 部分 —— 字符串函数",t:"哪个函数用于只把首字母大写（在支持的系统中）？",o:["FIRST_UP()","INITCAP()","START_UP()","TOP()"],c:1,e:"INITCAP 把每个单词的首字母大写，其余字母小写。"},
  {n:12,s:"A 部分 —— 字符串函数",t:"如果我们运行 CONCAT('A', NULL, 'B') 会发生什么？",o:["AB","NULL（在大多数系统中）","A B","报错"],c:1,e:"在标准 SQL 中，与 NULL 的拼接返回 NULL，但 MySQL/SQL Server 中的 CONCAT 通常会忽略 NULL 并返回 AB。"},
  {n:13,s:"A 部分 —— 字符串函数",t:"我们如何检查一个字符串是否以 'A' 开头？",o:["WHERE col = 'A%'","WHERE col LIKE 'A%'","WHERE col STARTS WITH 'A'","WHERE col = 'A'"],c:1,e:"带 % 符号的 LIKE 运算符用于模式匹配。"},
  {n:14,s:"A 部分 —— 字符串函数",t:"和 LIKE 一起使用时，\\\"_\\\"（下划线）是什么意思？",o:["任意数量的字符。","任意单个字符。","一个空格。","字符串的结尾。"],c:1,e:"\\\"_\\\" 在它出现的位置代表正好一个字符。"},
  {n:15,s:"A 部分 —— 字符串函数",t:"哪个函数返回一个字符的 ASCII 值？",o:["ASCII()","CODE()","VAL()","CHAR()"],c:0,e:"ASCII() 根据 ASCII 表返回该字符的数值。"},
  {n:16,s:"A 部分 —— 字符串函数",t:"函数 REVERSE('abc') 做什么？",o:["ABC","cba","abc","acb"],c:1,e:"REVERSE 翻转字符串中字符的顺序。"},
  {n:17,s:"A 部分 —— 字符串函数",t:"我们如何只去除右侧的空格？",o:["TRIM_RIGHT()","RTRIM()","LTRIM()","CUT()"],c:1,e:"RTRIM（right trim）只去除末尾的空格。"},
  {n:18,s:"A 部分 —— 字符串函数",t:"STRLEN 函数在 SQL Server 中返回什么？",o:["字符串的长度。","什么都不返回，正确的名称是 LEN()。","单词的数量。","以字节为单位的大小。"],c:1,e:"在 SQL Server 中你用 LEN，在 PostgreSQL/MySQL 中你用 LENGTH。"},
  {n:19,s:"A 部分 —— 字符串函数",t:"在 Oracle/PostgreSQL 中，拼接运算符是什么？",o:["+","&","||","&&"],c:2,e:"双竖线 || 在这些系统中用于连接字符串。"},
  {n:20,s:"A 部分 —— 字符串函数",t:"哪个函数把一个字符串重复多次？",o:["AGAIN()","REPLICATE() / REPEAT()","COPY()","MULTIPLY()"],c:1,e:"REPLICATE 按所请求的次数复制一个字符串。"},
  // ── Part 2: Aggregation & GROUP BY ──
  {n:21,s:"B 部分 —— 聚合与 GROUP BY",t:"函数 COUNT(*) 返回什么？",o:["列中各值的总和。","行数，包括重复和 NULL 值。","只有具有唯一值的行。","最大值。"],c:1,e:"COUNT(*) 统计表中所有的记录，无论其内容如何。"},
  {n:22,s:"B 部分 —— 聚合与 GROUP BY",t:"哪个函数返回一列中的最高值？",o:["HIGH()","TOP()","MAX()","LARGE()"],c:2,e:"MAX 找出一个组中的最大值。"},
  {n:23,s:"B 部分 —— 聚合与 GROUP BY",t:"SUM() 函数做什么？",o:["统计有多少行。","返回平均值。","计算数值的总和。","返回最小值。"],c:2,e:"SUM 把一个数值列中的所有值加总。"},
  {n:24,s:"B 部分 —— 聚合与 GROUP BY",t:"COUNT(column) 和 COUNT(*) 之间有什么区别？",o:["没有区别。","COUNT(column) 会忽略该特定列中的 NULL 值。","COUNT(*) 会忽略 NULL。","COUNT(column) 只统计唯一值。"],c:1,e:"当你指定一个列时，SQL 只统计该列值非 NULL 的行。"},
  {n:25,s:"B 部分 —— 聚合与 GROUP BY",t:"GROUP BY 用来做什么？",o:["对结果排序。","筛选单独的行。","把具有相同值的行分组，以便执行聚合计算。","连接两张表。"],c:2,e:"GROUP BY 把表分成若干组（例如按部门），以便为每个组计算 SUM/AVG。"},
  {n:26,s:"B 部分 —— 聚合与 GROUP BY",t:"GROUP BY 出现在查询的什么位置？",o:["在 WHERE 之前。","在 WHERE 之后、ORDER BY 之前。","在查询的开头。","在 HAVING 之后。"],c:1,e:"子句顺序：SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY。"},
  {n:27,s:"B 部分 —— 聚合与 GROUP BY",t:"你如何筛选聚合函数的结果（比如 SUM > 100）？",o:["WHERE","HAVING","GROUP BY","LIMIT"],c:1,e:"WHERE 在分组之前筛选行，HAVING 在分组之后筛选组。"},
  {n:28,s:"B 部分 —— 聚合与 GROUP BY",t:"MIN() 函数返回什么？",o:["各值的平均。","最低值。","值的数量。","表中的第一个值。"],c:1,e:"MIN 找出最小值。"},
  {n:29,s:"B 部分 —— 聚合与 GROUP BY",t:"哪个函数计算平均值？",o:["AVERAGE()","AVG()","MEAN()","SUM() / COUNT()"],c:1,e:"AVG() 是计算算术平均的内置函数。"},
  {n:30,s:"B 部分 —— 聚合与 GROUP BY",t:"在 AVG(price) 计算中 NULL 值会怎样？",o:["它们被算作 0。","查询返回错误。","它们被排除在计算之外（分子和分母都是）。","它们在最终结果中变成 NULL。"],c:2,e:"聚合函数（COUNT 除外）会完全忽略 NULL。"},
  {n:31,s:"B 部分 —— 聚合与 GROUP BY",t:"可以在不带聚合函数的情况下使用 GROUP BY 吗？",o:["不，它是必需的。","可以，它的效果类似 DISTINCT。","只有在有 JOIN 时。","只在 SQL Server 中。"],c:1,e:"不带计算的分组只是显示该列的唯一值。"},
  {n:32,s:"B 部分 —— 聚合与 GROUP BY",t:"SELECT COUNT(DISTINCT city) FROM customers 返回什么？",o:["该城市中的客户数量。","表中存在的不同（唯一）城市的数量。","城市名称的列表。","客户的总数。"],c:1,e:"DISTINCT 让 COUNT 对每个值只计一次。"},
  {n:33,s:"B 部分 —— 聚合与 GROUP BY",t:"使用 GROUP BY 时最常见的错误是什么？",o:["用 SUM 代替 COUNT。","在 SELECT 中选了一个既不在 GROUP BY 中、也没有被聚合的列。","把 GROUP BY 写在 FROM 之前。","在分组中使用超过 3 个列。"],c:1,e:"SELECT 中的每个列都必须是分组的一部分，或位于一个函数内部（比如 SUM）。"},
  {n:34,s:"B 部分 —— 聚合与 GROUP BY",t:"函数 COUNT(1) 做什么？",o:["只统计第一行。","始终返回 1。","与 COUNT(*) 相同——统计所有行。","只统计值为 1 的行。"],c:2,e:"在大多数数据库中，这是统计所有行的一个捷径。"},
  {n:35,s:"B 部分 —— 聚合与 GROUP BY",t:"我们如何分别计算每位销售员的总销售额？",o:["SELECT SUM(sales) FROM data","SELECT seller, SUM(sales) FROM data GROUP BY seller","SELECT seller, SUM(sales) FROM data WHERE seller = 'all'","SELECT seller FROM data ORDER BY SUM(sales)"],c:1,e:"GROUP BY 为每位销售员创建一个“桶”，并在其中计算总和。"},
  {n:36,s:"B 部分 —— 聚合与 GROUP BY",t:"允许在 HAVING 内部使用别名吗？",o:["总是可以。","取决于数据库（在 MySQL 中可以，在 SQL Server 中通常不可以）。","从不。","只有当它是一个数字时。"],c:1,e:"SQL Server 在 SELECT 之前处理 HAVING，所以它不识别别名。"},
  {n:37,s:"B 部分 —— 聚合与 GROUP BY",t:"当列是文本时，MIN(name) 的结果是什么？",o:["报错，不能对文本运行它。","按字母顺序排在第一的名字。","最短的名字。","最短名字的字符数。"],c:1,e:"MIN 和 MAX 也对字符串有效，按字母顺序。"},
  {n:38,s:"B 部分 —— 聚合与 GROUP BY",t:"WHERE amount > 100 和 HAVING amount > 100 之间有什么区别？",o:["没有区别。","HAVING 更快。","WHERE 筛选单笔交易，HAVING 筛选组。","WHERE 只用于文本。"],c:2,e:"在分组之前筛选 对比 在分组之后筛选。"},
  {n:39,s:"B 部分 —— 聚合与 GROUP BY",t:"可以按多个列分组吗？（例如 城市和性别）",o:["不。","可以，你只需用逗号隔开：GROUP BY city, gender。","只有在使用 UNION 时。","只在 Oracle 中。"],c:1,e:"你可以创建任意细分的子组。"},
  {n:40,s:"B 部分 —— 聚合与 GROUP BY",t:"哪个函数在 SQL 中不是标准函数？",o:["SUM()","AVG()","MEDIAN()","COUNT()"],c:2,e:"在 SQL 中计算中位数需要窗口函数或子查询。"},
  // ── Part 3: JOINs ──
  {n:41,s:"C 部分 —— 表关系（JOIN）",t:"JOIN 的主要作用是什么？",o:["删除重复项。","基于共享的列把两张表的数据合并起来。","对数据排序。","创建一张新表。"],c:1,e:"JOIN 让你在单个查询中合并来自多张相关表的信息。"},
  {n:42,s:"C 部分 —— 表关系（JOIN）",t:"什么是 INNER JOIN？",o:["返回两张表的所有行。","只返回在两张表中都有匹配的行。","只返回左表。","返回没有匹配的行。"],c:1,e:"INNER JOIN 只返回在两张表中都有匹配值的行。"},
  {n:43,s:"C 部分 —— 表关系（JOIN）",t:"LEFT JOIN 返回什么？",o:["只返回右表的行。","返回左表的所有行，以及右表的匹配行（如果没有匹配，出现 NULL）。","只返回只出现在左侧的行。","两张表的交集。"],c:1,e:"LEFT JOIN 即使在没有匹配时也保留左表的所有行。"},
  {n:44,s:"C 部分 —— 表关系（JOIN）",t:"在 RIGHT JOIN 中，如果左表没有匹配会发生什么？",o:["该行被丢弃。","显示一个错误。","显示右表数据，左表列中为 NULL 值。","左表用零填充。"],c:2,e:"RIGHT JOIN 保留右表的所有行。左侧的缺口显示为 NULL。"},
  {n:45,s:"C 部分 —— 表关系（JOIN）",t:"什么是 FULL OUTER JOIN？",o:["只返回共有的部分。","返回两张表的所有行，没有匹配的地方为 NULL。","只返回不匹配的行。","不带条件地连接表。"],c:1,e:"FULL OUTER JOIN 返回两张表的一切，缺口处为 NULL。"},
  {n:46,s:"C 部分 —— 表关系（JOIN）",t:"什么是 CROSS JOIN？",o:["按主键连接。","笛卡尔积——表 A 的每一行都与表 B 的每一行组合。","一张表与它自己的连接。","基于大于/小于的连接。"],c:1,e:"CROSS JOIN 创建两张表之间所有可能的组合。"},
  {n:47,s:"C 部分 —— 表关系（JOIN）",t:"如果表 A 有 5 行、表 B 有 3 行，CROSS JOIN 返回多少行？",o:["8","5","15","2"],c:2,e:"5 乘以 3 = 15。一个笛卡尔积。"},
  {n:48,s:"C 部分 —— 表关系（JOIN）",t:"什么是 SELF JOIN？",o:["两张数据相同的表的连接。","一张表与它自己的连接（例如，为了找出员工和经理之间的关系）。","不带 JOIN 的查询。","对一张表使用 DISTINCT。"],c:1,e:"SELF JOIN 让你在同一张表内部比较行（例如层级关系）。"},
  {n:49,s:"C 部分 —— 表关系（JOIN）",t:"用哪个关键字来定义连接条件？",o:["WHERE","ON","AT","USING"],c:1,e:"语法是 JOIN table ON condition。"},
  {n:50,s:"C 部分 —— 表关系（JOIN）",t:"JOIN 和 UNION 之间有什么区别？",o:["没有区别。","JOIN 合并列（并排），UNION 合并行（一个在另一个下面）。","UNION 需要 ON。","JOIN 要求列数相同。"],c:1,e:"JOIN = 横向连接。UNION = 纵向连接。"},
  {n:51,s:"C 部分 —— 表关系（JOIN）",t:"什么是 Natural Join？",o:["只基于外键的连接。","基于两张表中所有同名列的自动连接。","自然表的连接。","不带保留字的连接。"],c:1,e:"NATURAL JOIN 自动按同名的列进行连接。"},
  {n:52,s:"C 部分 —— 表关系（JOIN）",t:"可以连接超过 2 张表吗？",o:["不。","可以，你可以一个接一个地串联多个 JOIN。","最多 3 张表。","只有在使用子查询时。"],c:1,e:"你可以在单个查询中串联许多 JOIN。"},
  {n:53,s:"C 部分 —— 表关系（JOIN）",t:"如果两张表完全没有匹配值，INNER JOIN 返回什么？",o:["整张第一个表。","一张空表。","带 NULL 的行。","系统错误。"],c:1,e:"没有匹配的 INNER JOIN 返回一张空表。"},
  {n:54,s:"C 部分 —— 表关系（JOIN）",t:"我们在什么情况下使用 LEFT JOIN？",o:["当你只想要两边都存在的数据时。","当你想要完整的客户列表，包括那些没有下订单的客户时。","当我们只有一张表时。","为了提升性能。"],c:1,e:"LEFT JOIN 非常适合保留主表的所有记录。"},
  {n:55,s:"C 部分 —— 表关系（JOIN）",t:"USING(column_name) 子句做什么？",o:["替代 FROM。","当连接列在两张表中同名时，作为 ON 的替代。","用于筛选行。","定义使用哪个索引。"],c:1,e:"当列在两张表中同名时，USING 是 ON 的简写。"},
  {n:56,s:"C 部分 —— 表关系（JOIN）",t:"什么是 Anti-Join（反连接，概念上）？",o:["所有匹配项的连接。","检索一张表中在另一张表里完全没有匹配的行。","删除共享的数据。","按相反顺序的连接。"],c:1,e:"Anti-Join 找出在另一张表中没有匹配的行。"},
  {n:57,s:"C 部分 —— 表关系（JOIN）",t:"你如何用 LEFT JOIN 执行 Anti-Join？",o:["添加 LIMIT 1。","在 WHERE 中检查右表的列为 NULL 的地方。","使用 INNER JOIN。","使用 GROUP BY。"],c:1,e:"LEFT JOIN + WHERE right.col IS NULL = Anti-Join。"},
  {n:58,s:"C 部分 —— 表关系（JOIN）",t:"什么是 Non-Equi Join（非等值连接）？",o:["不带等号的连接。","其条件使用 <、> 或 BETWEEN 等运算符的 JOIN。","大小不等的表的连接。","语法错误。"],c:1,e:"Non-Equi Join 使用等号以外的运算符。"},
  {n:59,s:"C 部分 —— 表关系（JOIN）",t:"什么是别名，它在 JOIN 中为什么重要？",o:["它用于加密数据。","它让你缩短表名，并在列名相同时避免歧义。","它在 INNER JOIN 中是必需的。","它替代 SELECT。"],c:1,e:"在 JOIN 中别名对于区分同名的列至关重要。"},
  {n:60,s:"C 部分 —— 表关系（JOIN）",t:"如果我们在 JOIN 中忘了写 ON 条件会发生什么？",o:["查询正常工作并猜测关系。","你会得到语法错误（在某些版本中是 CROSS JOIN）。","只显示第一行。","数据被删除。"],c:1,e:"没有 ON，你会得到错误或 CROSS JOIN，取决于数据库。"},
  {n:61,s:"C 部分 —— 表关系（JOIN）",t:"如果你只写单词 JOIN，默认是哪种 JOIN？",o:["LEFT JOIN","INNER JOIN","CROSS JOIN","FULL JOIN"],c:1,e:"单独的 JOIN = INNER JOIN。"},
  {n:62,s:"C 部分 —— 表关系（JOIN）",t:"一张 employees 表有一个 manager_id 列，指向同一张表中的 employee_id。需要哪种 JOIN？",o:["OUTER JOIN","SELF JOIN","NATURAL JOIN","CROSS JOIN"],c:1,e:"SELF JOIN 把一张表连接到它自己——非常适合层级关系。"},
  {n:63,s:"C 部分 —— 表关系（JOIN）",t:"JOIN 的性能会受索引影响吗？",o:["不，JOIN 与索引无关。","会，ON 列上的索引能显著加快查询。","只在 LEFT JOIN 中。","只在小表上。"],c:1,e:"ON 列上的索引对 JOIN 性能至关重要。"},
  {n:64,s:"C 部分 —— 表关系（JOIN）",t:"FULL OUTER JOIN 相对于 UNION 的优势是什么？",o:["它更快。","它把两张表的列结构并排保留下来。","它不需要键。","它总是返回更少的行。"],c:1,e:"FULL OUTER JOIN 横向合并——UNION 纵向合并。"},
  {n:65,s:"C 部分 —— 表关系（JOIN）",t:"如果两个连接列都有 NULL 值，JOIN 中会发生什么？",o:["它们被当作匹配。","在 JOIN 中 NULL 永远不等于 NULL，所以没有匹配。","显示一个错误。","系统忽略这些行。"],c:1,e:"在 SQL 中 NULL = NULL 不为真。在 JOIN 中 NULL 不与 NULL 匹配。"},
  {n:66,s:"C 部分 —— 表关系（JOIN）",t:"你如何连接 3 张表：customers、orders 和 products？",o:["一个长长的 JOIN。","两个 JOIN：customers 连到 orders，然后 orders 连到 products。","不能，只允许 2 张。","使用 UNION。"],c:1,e:"你可以串联 JOIN：A JOIN B JOIN C。"},
  {n:67,s:"C 部分 —— 表关系（JOIN）",t:"LEFT JOIN 和 LEFT OUTER JOIN 之间有什么区别？",o:["OUTER 返回更多数据。","没有区别，是同一个命令。","LEFT JOIN 只用于 MySQL。","OUTER JOIN 需要一个 WHERE。"],c:1,e:"LEFT JOIN 和 LEFT OUTER JOIN 完全相同。"},
  {n:68,s:"C 部分 —— 表关系（JOIN）",t:"我们什么时候会故意使用 CROSS JOIN？",o:["为了找出价格之间的匹配。","为了创建所有可能的组合（比如 所有颜色 × 所有尺码）。","当我们有一个强主键时。","为了删除重复项。"],c:1,e:"CROSS JOIN 适合生成产品组合、排班表等等。"},
  {n:69,s:"C 部分 —— 表关系（JOIN）",t:"在 INNER JOIN 中表的顺序重要吗？",o:["重要，它会改变结果。","不重要，逻辑结果是相同的。","只有当行数超过 1000 时。","只在 Oracle 中。"],c:1,e:"在 INNER JOIN 中，表的顺序不改变逻辑结果。"},

const letters = ['A','B','C','D'];
let answers = {};
let correct = 0;
let currentSection = null;

function updateScore(){
  const total = Object.keys(answers).length;
  const pct = total > 0 ? Math.round(correct/total*100) : 0;
  document.getElementById('scoreText').textContent = '✅ ' + correct + ' / ' + total;
  document.getElementById('scoreFill').style.width = (Math.round(correct/questions.length*100)) + '%';
  document.getElementById('progTxt').textContent = total + ' / ' + questions.length;
  document.getElementById('scoreDisplay').textContent = pct + '%';
  document.getElementById('heroAnswered').textContent = total;
  document.getElementById('heroCorrect').textContent = correct;
  document.getElementById('heroPct').textContent = pct + '%';
  if(total === questions.length) showFinish();
}

function selectOption(qIdx, optIdx){
  if(answers[qIdx] !== undefined) return;
  const q = questions[qIdx];
  const isCorrect = optIdx === q.c;
  answers[qIdx] = optIdx;
  if(isCorrect) correct++;
  const card = document.getElementById('qcard-'+qIdx);
  card.classList.add(isCorrect ? 'correct' : 'wrong');
  card.querySelectorAll('.option').forEach((o,i)=>{
    o.classList.add('disabled');
    if(i === q.c) o.classList.add('correct-ans');
    if(i === optIdx && !isCorrect) o.classList.add('wrong-ans');
  });
  const exp = document.getElementById('exp-'+qIdx);
  exp.querySelector('.exp-text').innerHTML = (isCorrect ? '✅ 正确！ ' : '❌ 错误——正确答案以绿色标出。 ') + q.e;
  exp.classList.add('show');
  updateScore();
}

function buildQuiz(){
  const mc = document.getElementById('mainContent');
  mc.innerHTML = '';
  currentSection = null;
  questions.forEach((q,i)=>{
    if(q.s !== currentSection){
      currentSection = q.s;
      mc.innerHTML += `<div class="sec-label">${q.s}</div>`;
    }
    const opts = q.o.map((o,oi)=>`
      <div class="option" onclick="selectOption(${i},${oi})">
        <div class="opt-letter">${letters[oi]}</div>
        <div class="opt-text">${o}</div>
      </div>`).join('');
    mc.innerHTML += `
    <div class="q-card" id="qcard-${i}">
      <div class="q-header">
        <div class="q-meta">
          <div class="q-num">第 ${q.n} 题</div>
          <div class="q-section-tag">${q.s.split('—')[1]?.trim()||q.s}</div>
        </div>
        <div class="q-text">${q.t}</div>
      </div>
      <div class="options">${opts}</div>
      <div class="explanation" id="exp-${i}">
        <div class="exp-label">💡 Explanation</div>
        <div class="exp-text"></div>
      </div>
    </div>`;
  });
  mc.innerHTML += `
  <div class="finish-card" id="finishCard">
    <div class="finish-emoji">🎉</div>
    <div class="finish-title">You finished the intermediate quiz!</div>
    <div class="finish-score" id="finishScore">0/80</div>
    <div class="finish-grade" id="finishGrade"></div>
    <div class="finish-sub" id="finishSub"></div>
    <br>
    <button class="retry-btn" onclick="resetQuiz()">🔄 重新尝试</button>
    <a href="quiz.html" class="level-link">🧠 Ready for the advanced level? ←</a>
  </div>`;
}

function showFinish(){
  const card = document.getElementById('finishCard');
  if(window.fbAutoSave && window.currentUser) window.fbAutoSave(correct, questions.length);
  const pct = Math.round(correct/questions.length*100);
  document.getElementById('finishScore').textContent = correct + ' / ' + questions.length;
  let grade, sub;
  if(pct>=90){grade='⭐ 优秀！';sub='令人印象深刻地掌握了中级水平！';}
  else if(pct>=75){grade='👍 很好';sub='再多练一点你就能完全掌握了！';}
  else if(pct>=60){grade='📚 良好';sub='值得复习一下较薄弱的材料。';}
  else{grade='💪 继续练习';sub='复习一下各章节再试一次！';}
  document.getElementById('finishGrade').textContent = grade;
  document.getElementById('finishSub').textContent = sub;
  card.classList.add('show');
  card.scrollIntoView({behavior:'smooth',block:'center'});
}

function resetQuiz(){
  answers = {}; correct = 0;
  document.getElementById('finishCard').classList.remove('show');
  updateScore();
  buildQuiz();
  window.scrollTo({top:0,behavior:'smooth'});
}

buildQuiz();
updateScore();
</script>

<!-- Firebase SDK -->
<script>
function fbLogin(){if(window._fbLogin)window._fbLogin();else{var b=document.getElementById('fb-login-btn');if(b)b.setAttribute('data-pending','1');}}
function fbLogout(){if(window._fbLogout)window._fbLogout();}
function fbToggleHistory(){if(window._fbToggleHistory)window._fbToggleHistory();}
function triggerSave(){if(window._triggerSave)window._triggerSave();}
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyA04LDMDGohAs1uRnUVwWVTs5coVMrEO64",
  authDomain: "sql-course-507b5.firebaseapp.com",
  projectId: "sql-course-507b5",
  storageBucket: "sql-course-507b5.firebasestorage.app",
  messagingSenderId: "999664091380",
  appId: "1:999664091380:web:349959985ae11ce8c51ea1"
});

const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
let currentUser = null;
window.currentUser = null;
const QUIZ_ID = 'medium';

onAuthStateChanged(auth, async (user) => {
  currentUser = user; window.currentUser = user;
  const loginBtn = document.getElementById('fb-login-btn');
  const logoutBtn = document.getElementById('fb-logout-btn');
  const userInfo = document.getElementById('fb-user-info');
  const histBtn = document.getElementById('fb-history-btn');
  const saveBtn = document.getElementById('fb-save-btn');
  if(user){
    document.getElementById('fb-user-name').textContent = user.displayName;
    document.getElementById('fb-user-photo').src = user.photoURL;
    document.getElementById('fb-user-photo').style.display = 'block';
    loginBtn.style.display='none'; logoutBtn.style.display='flex';
    userInfo.style.display='flex'; histBtn.style.display='flex'; saveBtn.style.display='flex';
    await loadProgress(); await loadHistory();
  } else {
    loginBtn.style.display='flex'; logoutBtn.style.display='none';
    userInfo.style.display='none'; histBtn.style.display='none'; saveBtn.style.display='none';
  }
});

window.fbLogin = async () => { try { await signInWithPopup(auth, provider); } catch(e){console.error(e);} };
window.fbLogout = async () => { await signOut(auth); };
window.fbToggleHistory = () => {
  const w = document.getElementById('fb-history-wrap');
  w.style.display = w.style.display==='none' ? 'block' : 'none';
};
window.triggerSave = async () => {
  if(!currentUser){ window.fbLogin(); return; }
  const scoreEl = document.getElementById('scoreText');
  const txt = scoreEl ? scoreEl.textContent.replace('✅ ','') : '0 / 0';
  const parts = txt.split('/');
  const sc = parseInt(parts[0])||0; const tot = parseInt(parts[1])||0;
  if(tot===0){ showToast('⚠️ 请先至少回答一道题！'); return; }
  await saveProgress(sc, tot);
};

async function saveProgress(score, total){
  if(!currentUser) return;
  const pct = Math.round(score/total*100);
  await setDoc(doc(db,'users',currentUser.uid,'quizzes',QUIZ_ID),{score,total,pct,lastUpdate:new Date().toISOString()},{merge:true});
  await addDoc(collection(db,'users',currentUser.uid,'history'),{quizId:QUIZ_ID,score,total,pct,date:new Date().toISOString()});
  showToast('✅ 进度已保存到云端！');
  await loadHistory();
}
window.fbAutoSave = saveProgress;

async function loadProgress(){
  if(!currentUser) return;
  const snap = await getDoc(doc(db,'users',currentUser.uid,'quizzes',QUIZ_ID));
  if(snap.exists()){
    const d = snap.data();
    const el = document.getElementById('fb-saved-score');
    el.textContent = `Last attempt: ${d.score}/${d.total} (${d.pct}%)`;
    el.style.display = 'block';
  }
}

async function loadHistory(){
  if(!currentUser) return;
  const q = query(collection(db,'users',currentUser.uid,'history'),orderBy('date','desc'),limit(10));
  const snap = await getDocs(q);
  const hist = [];
  snap.forEach(d=>hist.push(d.data()));
  renderChart(hist.filter(h=>h.quizId===QUIZ_ID));
}

function renderChart(history){
  const panel = document.getElementById('fb-history-panel');
  if(!history.length){ panel.innerHTML='<p style="color:var(--text2);font-size:13px;text-align:center;padding:1rem">No history yet — answer questions and save!</p>'; return; }
  const rev = [...history].reverse();
  const best = Math.max(...history.map(h=>h.pct));
  const avg = Math.round(history.reduce((a,h)=>a+h.pct,0)/history.length);
  const bars = rev.map(h=>{
    const d = new Date(h.date);
    const lbl = `${d.getDate()}/${d.getMonth()+1}`;
    const color = h.pct>=80?'var(--aq)':h.pct>=50?'#FFB020':'#FF4060';
    return `<div class="hbar-wrap"><div class="hbar-val">${h.pct}%</div><div class="hbar" style="height:${Math.max(h.pct*1.1,8)}px;background:${color}"></div><div class="hbar-lbl">${lbl}</div></div>`;
  }).join('');
  panel.innerHTML = `<div class="hstats-row"><div class="hstat-mini"><div class="hstat-n" style="color:var(--aq)">${best}%</div><div class="hstat-l">Personal best</div></div><div class="hstat-mini"><div class="hstat-n" style="color:#FFB020">${avg}%</div><div class="hstat-l">Average</div></div><div class="hstat-mini"><div class="hstat-n" style="color:var(--text2)">${history.length}</div><div class="hstat-l">Attempts</div></div></div><div class="hchart">${bars}</div>`;
}

function showToast(msg){
  let t=document.getElementById('fb-toast');
  if(!t){t=document.createElement('div');t.id='fb-toast';document.body.appendChild(t);}
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
