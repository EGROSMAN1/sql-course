  line-height: 1;
}
.py-adv-toggle.enabled {
  background: linear-gradient(135deg, #6d28d9 0%, #9333ea 100%);
  color: #fff;
  border-color: #c4b5fd;
  box-shadow: 0 4px 14px rgba(147,51,234,0.45);
}
.py-adv-toggle:hover, .py-adv-toggle:active {
  transform: scale(1.05);
}
.py-adv-icon { font-size: 14px; }

.py-adv-status {
  pointer-events: auto;
  display: none;
  background: rgba(30,35,70,0.95);
  color: #fff;
  padding: 6px 10px;
  border-radius: 10px;
  font-size: 11.5px;
  max-width: 220px;
  text-align: center;
  border: 1px solid #4a5494;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

/* ---- Modal ---- */
.py-adv-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.78);
  z-index: 10002;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity .3s ease;
  padding: 16px;
  backdrop-filter: blur(4px);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.py-adv-modal.show { opacity: 1; }

.py-adv-modal-inner {
  background: linear-gradient(135deg, #1a1f3a 0%, #2d1f4a 100%);
  border: 2px solid #8b5cf6;
  border-radius: 18px;
  padding: 22px 20px;
  max-width: 360px;
  width: 100%;
  color: #fff;
  text-align: center;
  transform: scale(0.9);
  transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  box-shadow: 0 20px 60px rgba(147,51,234,0.4);
}
.py-adv-modal.show .py-adv-modal-inner { transform: scale(1); }

.py-adv-modal-icon {
  font-size: 48px;
  margin-bottom: 8px;
  animation: py-adv-float 2s ease-in-out infinite;
}
@keyframes py-adv-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.py-adv-modal h2 {
  font-size: 19px;
  margin: 4px 0 8px;
  color: #c4b5fd;
}
.py-adv-modal p {
  font-size: 13px;
  color: #d0d8ec;
  line-height: 1.5;
  margin: 0 0 14px;
}

.py-adv-features {
  list-style: none;
  padding: 0;
  margin: 0 0 16px;
  text-align: start;
  background: rgba(139,92,246,0.1);
  padding: 12px 16px;
  border-radius: 10px;
}
.py-adv-features li {
  font-size: 13px;
  margin-bottom: 6px;
  color: #e0d8ec;
}
.py-adv-features li:last-child { margin-bottom: 0; }

.py-adv-modal-actions {
  display: grid;

  gap: 8px;
  margin-bottom: 12px;

.py-adv-btn {

  font-weight: 700;

  font-family: inherit;
  transition: transform .15s ease;
}
.py-adv-btn-primary {
  background: linear-gradient(135deg, #8b5cf6 0%, #9333ea 100%);
  color: #fff;

.py-adv-btn-secondary {

  color: #aab;
  border: 1px solid rgba(255,255,255,0.2);
}
.py-adv-btn:hover, .py-adv-btn:active { transform: scale(0.98); }

.py-adv-tooltip {
  font-size: 11px;
  color: #888;
  font-style: italic;
}

/* ---- Advanced exercises section (in pandas-lesson) ---- */
.py-adv-section {
  margin-top: 24px;
  padding: 16px;
  background: linear-gradient(135deg, rgba(139,92,246,0.08) 0%, rgba(147,51,234,0.06) 100%);
  border: 1.5px solid rgba(139,92,246,0.3);
  border-radius: 14px;
}
.py-adv-section-title {
  font-size: 16px;

  color: #c4b5fd;

}
.py-adv-section-desc {
  font-size: 13px;
  color: #aab;
  margin-bottom: 12px;
}
.py-adv-locked {
  text-align: center;
  padding: 16px;
}
.py-adv-locked-text {
  font-size: 14px;
  color: #d0d8ec;
  margin-bottom: 10px;
}
.py-adv-enable-btn {
  background: linear-gradient(135deg, #8b5cf6 0%, #9333ea 100%);
  color: #fff;
  border: none;
  padding: 11px 22px;
  border-radius: 22px;
  font-size: 14px;
  font-weight: 700;

  font-family: inherit;
}

<script>
/* PYODIDE ADVANCED MODULE */
/* ============================================================
   PYODIDE ADVANCED MODULE - Real Python in browser
   Loads pandas, numpy, matplotlib on-demand alongside Skulpt
   ============================================================ */

(function() {
  'use strict';
  
  const IS_RTL = document.documentElement.dir === 'rtl' || document.documentElement.lang === 'he';
  
  const T = IS_RTL ? {
    advancedMode: 'מצב מתקדם',
    advancedDesc: 'הפעל Python אמיתי עם pandas/numpy/matplotlib',
    loading: 'טוען Pyodide... (~5MB, פעם אחת בלבד)',
    loadingPackages: 'טוען חבילות (pandas, numpy, matplotlib)...',
    ready: 'Pyodide מוכן! 🐍',
    error: 'שגיאת טעינה - נסה שוב',
    realPython: '🚀 Python אמיתי',
    skulptMode: '⚡ Skulpt (מהיר)',
    switchMode: 'החלף',
    advancedTitle: '🚀 תרגילים מתקדמים (Python אמיתי)',
    advancedSubtitle: 'תרגילים אופציונליים שדורשים pandas/numpy/matplotlib אמיתיים. דורש טעינה ראשונית של ~5MB.',
    enable: '✨ הפעל מצב מתקדם',
    enableTooltip: 'יטען Pyodide (~5MB) פעם אחת לדפדפן',
    disable: 'בטל',
    loadingFirstTime: 'טוען בפעם הראשונה...',
    cached: 'נטען מהמטמון',
    runPyodide: '▶ הרץ ב-Python אמיתי',
    chartGenerated: '📊 גרף נוצר',
    saved: 'נשמר',
  } : {
    advancedMode: 'Advanced Mode',
    advancedDesc: 'Enable real Python with pandas/numpy/matplotlib',
    loading: 'Loading Pyodide... (~5MB, one time)',
    loadingPackages: 'Loading packages (pandas, numpy, matplotlib)...',
    ready: 'Pyodide ready! 🐍',
    error: 'Loading error - try again',
    realPython: '🚀 Real Python',
    skulptMode: '⚡ Skulpt (fast)',
    switchMode: 'Switch',
    advancedTitle: '🚀 Advanced Exercises (Real Python)',
    advancedSubtitle: 'Optional exercises requiring real pandas/numpy/matplotlib. Requires initial ~5MB download.',
    enable: '✨ Enable Advanced Mode',
    enableTooltip: 'Will load Pyodide (~5MB) once per browser',
    disable: 'Disable',
    loadingFirstTime: 'Loading for first time...',
    cached: 'Loaded from cache',
    runPyodide: '▶ Run in Real Python',
    chartGenerated: '📊 Chart generated',
    saved: 'Saved',
  };
  
  // ---- State ----
  let pyodide = null;
  let pyodideLoading = false;
  let pyodideReady = false;
  
  // ---- Load Pyodide on demand ----
  async function loadPyodide() {
    if (pyodideReady) return pyodide;
    if (pyodideLoading) {
      // Wait for current load to complete
      while (pyodideLoading) {
        await new Promise(r => setTimeout(r, 200));
      }
      return pyodide;
    }
    
    pyodideLoading = true;
    updateStatus(T.loading);
    
    try {
      // Load Pyodide from CDN if not already loaded
      if (typeof window.loadPyodide === 'undefined') {
        await loadScript('https://cdn.jsdelivr.net/pyodide/v0.27.0/full/pyodide.js');
      }
      
      // Initialize
      pyodide = await window.loadPyodide({
        indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.27.0/full/'
      });
      
      // Load common packages
      updateStatus(T.loadingPackages);
      await pyodide.loadPackage(['pandas', 'numpy', 'matplotlib']);
      
      // Setup matplotlib backend for browser
      pyodide.runPython(`
import matplotlib
matplotlib.use('AGG')
import matplotlib.pyplot as plt
import io, base64

def _show_plt():
    buf = io.BytesIO()
    plt.savefig(buf, format='png', dpi=80, bbox_inches='tight', facecolor='white')
    buf.seek(0)
    img_b64 = base64.b64encode(buf.read()).decode('utf-8')
    plt.close('all')
    return img_b64

plt.show = lambda *args, **kw: print('__PLT_OUTPUT__' + _show_plt() + '__END_PLT__')
      `);
      
      pyodideReady = true;
      pyodideLoading = false;
      updateStatus(T.ready);
      
      // Hide status after 2 seconds
      setTimeout(() => updateStatus(''), 2000);
      
      return pyodide;
    } catch (e) {
      pyodideLoading = false;
      updateStatus(T.error + ': ' + e.message);
      console.error('Pyodide load error:', e);
      throw e;
    }
  }
  
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const existing = document.querySelector(`script[src="${src}"]`);
      if (existing) return resolve();
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  
  function updateStatus(msg) {
    const el = document.getElementById('py-adv-status');
    if (el) {
      el.textContent = msg;
      el.style.display = msg ? 'block' : 'none';
    }
  }
  
  // ---- Run Python code via Pyodide ----
  async function runPyodide(code) {
    if (!pyodideReady) await loadPyodide();
    
    let stdout = '';
    pyodide.setStdout({
      batched: (text) => { stdout += text + '\n'; }
    });
    pyodide.setStderr({
      batched: (text) => { stdout += text + '\n'; }
    });
    
    try {
      // Wrap code to handle matplotlib plt.show()
      await pyodide.runPythonAsync(code);
      return { output: stdout, error: null };
    } catch (e) {
      return { output: stdout, error: e.message };
    }
  }
  
  // ---- UI: Toggle button + status ----
  function buildToggle() {
    if (document.getElementById('py-adv-toggle')) return;
    
    const isEnabled = localStorage.getItem('py_advanced_enabled') === '1';
    
    const wrap = document.createElement('div');
    wrap.id = 'py-adv-wrap';
    wrap.innerHTML = `
      <button id="py-adv-toggle" class="py-adv-toggle ${isEnabled ? 'enabled' : ''}">
        <span class="py-adv-icon">🚀</span>
        <span class="py-adv-label">${isEnabled ? T.realPython : T.skulptMode}</span>
      </button>
      <div id="py-adv-status" class="py-adv-status"></div>
    `;
    
    document.body.appendChild(wrap);
    
    document.getElementById('py-adv-toggle').addEventListener('click', toggleAdvanced);
    
    // Auto-load if enabled
    if (isEnabled) {
      setTimeout(() => loadPyodide().catch(e => console.warn('Auto-load Pyodide failed:', e)), 1500);
    }
  }
  
  function toggleAdvanced() {
    const isEnabled = localStorage.getItem('py_advanced_enabled') === '1';
    if (isEnabled) {
      // Disable - revert to Skulpt
      localStorage.setItem('py_advanced_enabled', '0');
      location.reload();
    } else {
      // Show confirmation modal
      showEnableModal();
    }
  }
  
  function showEnableModal() {
    const modal = document.createElement('div');
    modal.className = 'py-adv-modal';
    modal.innerHTML = `
      <div class="py-adv-modal-inner">
        <div class="py-adv-modal-icon">🚀</div>
        <h2>${T.advancedTitle}</h2>
        <p>${T.advancedSubtitle}</p>
        <ul class="py-adv-features">
          <li>📊 matplotlib אמיתי לויזואליזציה</li>
          <li>🧮 numpy לחישובים מהירים</li>
          <li>🐼 pandas מלא (לא mini-pandas)</li>
          <li>🤖 scikit-learn בסיסי</li>
        </ul>
        <div class="py-adv-modal-actions">
          <button class="py-adv-btn py-adv-btn-primary" id="py-adv-confirm">${T.enable}</button>
          <button class="py-adv-btn py-adv-btn-secondary" id="py-adv-cancel">${T.disable}</button>
        </div>
        <div class="py-adv-tooltip">${T.enableTooltip}</div>
      </div>
    `;
    
    // Translate Hebrew bullet list if EN
    if (!IS_RTL) {
      modal.querySelector('.py-adv-features').innerHTML = `
        <li>📊 Real matplotlib for visualization</li>
        <li>🧮 numpy for fast computation</li>
        <li>🐼 Full pandas (not mini-pandas)</li>
        <li>🤖 Basic scikit-learn</li>
      `;
    }
    
    document.body.appendChild(modal);
    setTimeout(() => modal.classList.add('show'), 10);
    
    document.getElementById('py-adv-confirm').addEventListener('click', async () => {
      localStorage.setItem('py_advanced_enabled', '1');
      modal.classList.remove('show');
      setTimeout(() => modal.remove(), 300);
      // Update toggle button
      const toggle = document.getElementById('py-adv-toggle');
      if (toggle) {
        toggle.classList.add('enabled');
        toggle.querySelector('.py-adv-label').textContent = T.realPython;
      }
      // Start loading
      try {
        await loadPyodide();
      } catch (e) { /* already handled */ }
    });
    
    document.getElementById('py-adv-cancel').addEventListener('click', () => {
      modal.classList.remove('show');
      setTimeout(() => modal.remove(), 300);
    });
    
    modal.addEventListener('click', e => {
      if (e.target === modal) {
        modal.classList.remove('show');
        setTimeout(() => modal.remove(), 300);
      }
    });
  }
  
  // ---- Public API ----
  window.pyAdvanced = {
    isReady: () => pyodideReady,
    isEnabled: () => localStorage.getItem('py_advanced_enabled') === '1',
    load: loadPyodide,
    run: runPyodide,
    
    // For exercise integration: run code and render output (including matplotlib)
    runAndRender: async function(code, outputEl) {
      try {
        await loadPyodide();
        const result = await runPyodide(code);
        
        let html = '';
        let text = result.output || '';
        
        // Extract matplotlib images
        const plotRegex = /__PLT_OUTPUT__([A-Za-z0-9+/=]+)__END_PLT__/g;
        let match;
        const images = [];
        while ((match = plotRegex.exec(text)) !== null) {
          images.push(match[1]);
        }
        text = text.replace(plotRegex, '').trim();
        
        if (text) html += `<pre>${escapeHTML(text)}</pre>`;
        for (const img of images) {
          html += `<img src="data:image/png;base64,${img}" style="max-width:100%; margin-top:8px; border-radius:6px;" alt="Plot">`;
        }
        if (result.error) {
          html += `<pre style="color:#ff6b6b;">${escapeHTML(result.error)}</pre>`;
        }
        
        if (outputEl) outputEl.innerHTML = html;
        return { output: text, images: images, error: result.error };
      } catch (e) {
        if (outputEl) outputEl.innerHTML = `<pre style="color:#ff6b6b;">${escapeHTML(e.message)}</pre>`;
        return { output: '', images: [], error: e.message };
      }
    }
  };
  
  function escapeHTML(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  
  // ---- Init ----
  function init() {
    buildToggle();
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>

          starter: 'import numpy as np\nfrom sklearn.linear_model import LinearRegression\n\nyears = np.array([[2],[5],[3],[1],[7],[4],[2],[8],[3],[6]])\nsalary = np.array([15000, 22000, 18000, 13000, 25000, 16000, 14000, 28000, 17000, 23000])\n\n# Train and predict for 6 years:\n',
          solution: 'import numpy as np\nfrom sklearn.linear_model import LinearRegression\n\nyears = np.array([[2],[5],[3],[1],[7],[4],[2],[8],[3],[6]])\nsalary = np.array([15000, 22000, 18000, 13000, 25000, 16000, 14000, 28000, 17000, 23000])\n\nmodel = LinearRegression()\nmodel.fit(years, salary)\n\nprediction = model.predict([[6]])\nprint(f"Prediction for 6 years: NIS {prediction[0]:.0f}")\nprint(f"Slope: {model.coef_[0]:.0f} NIS per year")\nprint(f"Intercept: {model.intercept_:.0f}")',
          check: (output) => output.includes('NIS') && /NIS\s*\d{5}/.test(output),
          hint: 'model.fit(years, salary).predict([[6]])'
        },
        {
          id: 'adv-ml-cluster',
          title: 'K-Means Clustering',
          theory: '<p>K-Means partitions points into K groups. Useful for segmentation.</p>',
          q: 'Cluster 12 customers into 3 groups by [age, salary]. Print labels.',
          starter: 'import numpy as np\nfrom sklearn.cluster import KMeans\n\ndata = np.array([\n    [25, 15000], [45, 22000], [32, 18000], [22, 13000],\n    [50, 25000], [35, 16000], [28, 14000], [55, 28000],\n    [30, 17000], [48, 23000], [24, 12000], [38, 19000]\n])\n\n# K-Means with 3 clusters:\n',
          solution: 'import numpy as np\nfrom sklearn.cluster import KMeans\n\ndata = np.array([\n    [25, 15000], [45, 22000], [32, 18000], [22, 13000],\n    [50, 25000], [35, 16000], [28, 14000], [55, 28000],\n    [30, 17000], [48, 23000], [24, 12000], [38, 19000]\n])\n\nkm = KMeans(n_clusters=3, random_state=42, n_init=10)\nkm.fit(data)\nprint("Cluster labels:", km.labels_)\nprint("Centers:")\nprint(km.cluster_centers_.round(0))',
          check: (output) => output.includes('Cluster') || output.includes('labels'),
          hint: 'KMeans(n_clusters=3, random_state=42, n_init=10).fit(data)'
        },
        {
          id: 'adv-ml-classify',
          title: 'Classification - Predict Churn',
          theory: '<p>Logistic regression classifies into categories (0/1).</p>',
          q: 'Train a model to predict churn. Print accuracy.',
          starter: 'import numpy as np\nfrom sklearn.linear_model import LogisticRegression\n\nX = np.array([\n    [25, 45.5, 12], [45, 120.0, 60], [32, 80.3, 24], [58, 150.0, 84], [29, 35.0, 6],\n    [41, 95.0, 36], [36, 70.5, 18], [52, 130.0, 72], [27, 50.0, 8], [48, 110.0, 48],\n    [33, 65.0, 30], [60, 140.0, 96], [30, 55.0, 14], [44, 100.0, 42], [38, 75.0, 22]\n])\ny = np.array([0, 1, 0, 1, 1, 0, 0, 1, 1, 1, 0, 0, 1, 0, 0])\n\n# Train model:\n',
          solution: 'import numpy as np\nfrom sklearn.linear_model import LogisticRegression\n\nX = np.array([\n    [25, 45.5, 12], [45, 120.0, 60], [32, 80.3, 24], [58, 150.0, 84], [29, 35.0, 6],\n    [41, 95.0, 36], [36, 70.5, 18], [52, 130.0, 72], [27, 50.0, 8], [48, 110.0, 48],\n    [33, 65.0, 30], [60, 140.0, 96], [30, 55.0, 14], [44, 100.0, 42], [38, 75.0, 22]\n])\ny = np.array([0, 1, 0, 1, 1, 0, 0, 1, 1, 1, 0, 0, 1, 0, 0])\n\nmodel = LogisticRegression(max_iter=1000)\nmodel.fit(X, y)\naccuracy = model.score(X, y)\nprint(f"Training accuracy: {accuracy:.2%}")',
          check: (output) => output.includes('%') || output.includes('accuracy') || output.includes('0.'),
          hint: 'LogisticRegression().fit(X, y).score(X, y)'
        },
      ]
    }
  ]
};

</script>
<script>
/* PYODIDE UI */
/* ============================================================
   ADVANCED EXERCISES UI - Renders into pandas-lesson page
   Adds a collapsible "Advanced (Real Python)" section
   ============================================================ */

(function() {
  'use strict';
  
  const IS_RTL = document.documentElement.dir === 'rtl' || document.documentElement.lang === 'he';
  
  const T = IS_RTL ? {
    sectionTitle: '🚀 תרגילים מתקדמים (Python אמיתי)',
    sectionDesc: 'pandas, numpy, matplotlib אמיתיים - לאחר שסיימת את התרגילים הבסיסיים',
    expandSection: 'הצג תרגילים מתקדמים',
    collapseSection: 'הסתר',
    enableFirst: 'צריך להפעיל את "מצב מתקדם" קודם',
    enableBtn: '✨ הפעל מצב מתקדם',
    run: '▶ הרץ ב-Python אמיתי',
    running: 'מריץ...',
    showSolution: '💡 הצג פתרון',
    hideSolution: 'הסתר פתרון',
    copy: '📋 העתק',
    copied: '✅ הועתק!',
    correct: '✅ מעולה! התשובה נכונה.',
    wrong: '🤔 הפלט לא תואם. נסה שוב.',
    hint: '💡 רמז',
    moduleProgress: (done, total) => `${done}/${total} הושלמו`,
    completed: 'הושלם',
  } : {
    sectionTitle: '🚀 Advanced Exercises (Real Python)',
    sectionDesc: 'Real pandas, numpy, matplotlib - after completing basic exercises',
    expandSection: 'Show Advanced Exercises',
    collapseSection: 'Hide',
    enableFirst: 'You need to enable "Advanced Mode" first',
    enableBtn: '✨ Enable Advanced Mode',
    run: '▶ Run in Real Python',
    running: 'Running...',
    showSolution: '💡 Show Solution',
    hideSolution: 'Hide Solution',
    copy: '📋 Copy',
    copied: '✅ Copied!',
    correct: '✅ Excellent! Correct answer.',
    wrong: '🤔 Output doesn\'t match. Try again.',
    hint: '💡 Hint',
    moduleProgress: (done, total) => `${done}/${total} completed`,
    completed: 'Completed',
  };
  
  // ---- Get exercises for current lang ----
  function getExercises() {
    if (!window.PYODIDE_ADVANCED_EXERCISES) return [];
    return IS_RTL ? window.PYODIDE_ADVANCED_EXERCISES.he : window.PYODIDE_ADVANCED_EXERCISES.en;
  }
  
  // ---- Storage for completion tracking ----
  function getCompleted() {
    try { return JSON.parse(localStorage.getItem('py_adv_completed') || '[]'); }
    catch (e) { return []; }
  }
  function markCompleted(exId) {
    const c = getCompleted();
    if (!c.includes(exId)) {
      c.push(exId);
      localStorage.setItem('py_adv_completed', JSON.stringify(c));
      // Hook into gam for XP
      if (window.gam && window.gam.addXP) {
        window.gam.addXP(20, IS_RTL ? 'תרגיל מתקדם!' : 'Advanced exercise!');
      }
    }
  }
  
  // ---- Build the advanced section ----
  function buildAdvancedSection() {
    // Find where to insert: after main exercises, before footer
    const target = document.querySelector('main') || document.body;
    if (!target) return;
    
    // Avoid duplicate
    if (document.getElementById('py-adv-section')) return;
    
    // Only show on pages that make sense (pandas-lesson)
    const url = location.pathname.toLowerCase();
    if (!url.includes('pandas-lesson')) return;
    
    const section = document.createElement('section');
    section.id = 'py-adv-section';
    section.className = 'py-adv-section';
    section.style.cssText = 'margin: 40px 16px 20px; max-width: 900px; margin-left: auto; margin-right: auto;';
    
    // Build collapsible UI
    section.innerHTML = `
      <div class="py-adv-section-header" style="cursor:pointer; display:flex; align-items:center; gap:8px; user-select:none;">
        <h2 class="py-adv-section-title">${T.sectionTitle}</h2>
        <span class="py-adv-expand-icon" style="margin-inline-start:auto; font-size:18px; transition:transform .3s;">▼</span>
      </div>
      <div class="py-adv-section-desc">${T.sectionDesc}</div>
      <div class="py-adv-section-body" style="display:none; margin-top:16px;">
        <div id="py-adv-content"></div>
      </div>
    `;
    
    target.appendChild(section);
    
    // Click to toggle
    const header = section.querySelector('.py-adv-section-header');
    const body = section.querySelector('.py-adv-section-body');
    const icon = section.querySelector('.py-adv-expand-icon');
    header.addEventListener('click', () => {
      const isOpen = body.style.display !== 'none';
      body.style.display = isOpen ? 'none' : 'block';
      icon.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
      if (!isOpen) {
        renderExercises();
      }
    });
  }
  
  // ---- Render exercises ----
  function renderExercises() {
    const container = document.getElementById('py-adv-content');
    if (!container) return;
    if (container.dataset.rendered === '1') return;
    container.dataset.rendered = '1';
    
    const isEnabled = window.pyAdvanced && window.pyAdvanced.isEnabled();
    
    if (!isEnabled) {
      // Show "enable first" message
      container.innerHTML = `
        <div class="py-adv-locked">
          <div class="py-adv-locked-text">${T.enableFirst}</div>
          <button class="py-adv-enable-btn" id="py-adv-enable-from-section">${T.enableBtn}</button>
        </div>
      `;
      document.getElementById('py-adv-enable-from-section').addEventListener('click', () => {
        // Trigger the toggle
        const btn = document.getElementById('py-adv-toggle');
        if (btn) btn.click();
        // Reset render
        setTimeout(() => {
          container.dataset.rendered = '0';
          renderExercises();
        }, 1000);
      });
      return;
    }
    
    const modules = getExercises();
    const completed = getCompleted();
    
    let html = '';
    modules.forEach((mod, modIdx) => {
      const modDone = mod.topics.filter(t => completed.includes(t.id)).length;
      const modTotal = mod.topics.length;
      
      html += `
        <div class="py-adv-module">
          <div class="py-adv-module-header">
            <h3>${mod.module}</h3>
            <span class="py-adv-module-progress">${T.moduleProgress(modDone, modTotal)}</span>
          </div>
          <div class="py-adv-topics">
      `;
      
      mod.topics.forEach((topic, topicIdx) => {
        const isDone = completed.includes(topic.id);
        const uniqueId = `pyadv-${modIdx}-${topicIdx}`;
        html += `
          <div class="py-adv-topic ${isDone ? 'done' : ''}" data-ex-id="${topic.id}">
            <div class="py-adv-topic-header">
              <h4>${isDone ? '✅' : '⚪'} ${topic.title}</h4>
            </div>
            <div class="py-adv-theory">${topic.theory}</div>
            <div class="py-adv-question"><b>📝 ${IS_RTL ? 'תרגיל' : 'Exercise'}:</b> ${topic.q}</div>
            <textarea id="code-${uniqueId}" class="py-adv-code" rows="8" spellcheck="false">${topic.starter || ''}</textarea>
            <div class="py-adv-actions">
              <button class="py-adv-run-btn" data-id="${uniqueId}" data-ex="${topic.id}">${T.run}</button>
              <button class="py-adv-sol-btn" data-id="${uniqueId}">${T.showSolution}</button>
              <button class="py-adv-hint-btn" data-id="${uniqueId}" data-hint="${escapeAttr(topic.hint || '')}">${T.hint}</button>
            </div>
            <div id="out-${uniqueId}" class="py-adv-output"></div>
            <div id="verdict-${uniqueId}" class="py-adv-verdict"></div>
            <div id="sol-${uniqueId}" class="py-adv-solution" style="display:none;">
              <div class="py-adv-sol-header">
                <span>💡 ${IS_RTL ? 'פתרון רשמי' : 'Official solution'}</span>
                <button class="py-adv-copy-btn" data-id="${uniqueId}">${T.copy}</button>
              </div>
              <pre id="sol-code-${uniqueId}">${escapeHTML(topic.solution || '')}</pre>
            </div>
          </div>
        `;
      });
      
      html += `</div></div>`;
    });
    
    container.innerHTML = html;
    
    // Store exercise data for check functions
    window._pyAdvExercises = {};
    modules.forEach(mod => {
      mod.topics.forEach(topic => {
        window._pyAdvExercises[topic.id] = topic;
      });
    });
    
    // Wire up buttons
    container.querySelectorAll('.py-adv-run-btn').forEach(btn => {
      btn.addEventListener('click', () => runExercise(btn.dataset.id, btn.dataset.ex));
    });
    container.querySelectorAll('.py-adv-sol-btn').forEach(btn => {
      btn.addEventListener('click', () => toggleSolution(btn.dataset.id));
    });
    container.querySelectorAll('.py-adv-hint-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const hint = btn.dataset.hint;
        if (hint) alert(`💡 ${hint}`);
      });
    });
    container.querySelectorAll('.py-adv-copy-btn').forEach(btn => {
      btn.addEventListener('click', () => copyCode(btn.dataset.id, btn));
    });
  }
  
  async function runExercise(uniqueId, exId) {
    const codeEl = document.getElementById(`code-${uniqueId}`);
    const outEl = document.getElementById(`out-${uniqueId}`);
    const verdictEl = document.getElementById(`verdict-${uniqueId}`);
    const runBtn = document.querySelector(`.py-adv-run-btn[data-id="${uniqueId}"]`);
    
    if (!codeEl || !outEl) return;
    
    const code = codeEl.value;
    
    // Show running state
    runBtn.textContent = T.running;
    runBtn.disabled = true;
    outEl.innerHTML = `<div style="opacity:0.7;">⏳ ${T.running}</div>`;
    verdictEl.textContent = '';
    verdictEl.className = 'py-adv-verdict';
    
    try {
      const result = await window.pyAdvanced.runAndRender(code, outEl);
      
      // Check if correct
      const exercise = window._pyAdvExercises[exId];
      if (exercise && exercise.check) {
        const passed = exercise.check(result.output || '', result.images || []);
        if (passed) {
          verdictEl.textContent = T.correct;
          verdictEl.className = 'py-adv-verdict success';
          markCompleted(exId);
          
          // Visual update
          const topicEl = document.querySelector(`.py-adv-topic[data-ex-id="${exId}"]`);
          if (topicEl) {
            topicEl.classList.add('done');
            const h4 = topicEl.querySelector('h4');
            if (h4 && !h4.textContent.startsWith('✅')) {
              h4.textContent = '✅ ' + h4.textContent.replace(/^[⚪✅]\s*/, '');
            }
          }
          
          // Sound effect
          if (window.gamSound) window.gamSound.play('correct');
        } else {
          verdictEl.textContent = T.wrong;
          verdictEl.className = 'py-adv-verdict fail';
          if (window.gamSound) window.gamSound.play('wrong');
        }
      }
    } catch (e) {
      outEl.innerHTML = `<pre style="color:#ff6b6b;">${escapeHTML(e.message)}</pre>`;
    } finally {
      runBtn.textContent = T.run;
      runBtn.disabled = false;
    }
  }
  
  function toggleSolution(uniqueId) {
    const sol = document.getElementById(`sol-${uniqueId}`);
    const btn = document.querySelector(`.py-adv-sol-btn[data-id="${uniqueId}"]`);
    if (!sol) return;
    
    if (sol.style.display === 'none') {
      sol.style.display = 'block';
      btn.textContent = T.hideSolution;
    } else {
      sol.style.display = 'none';
      btn.textContent = T.showSolution;
    }
  }
  
  function copyCode(uniqueId, btn) {
    const codeEl = document.getElementById(`sol-code-${uniqueId}`);
    if (!codeEl) return;
    const text = codeEl.textContent;
    
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        const oldText = btn.textContent;
        btn.textContent = T.copied;
        setTimeout(() => { btn.textContent = T.copy; }, 1800);
      });
    }
  }
  
  function escapeHTML(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s) {
    if (s == null) return '';
    return String(s).replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }
  
  // ---- Init ----
  function init() {
    // Only on pandas-lesson
    if (!location.pathname.toLowerCase().includes('pandas-lesson')) return;
    // Wait a bit for the main page to render
    setTimeout(buildAdvancedSection, 500);
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>

<script>
// Auto-open certificate if ?openCert=1
(function() {
  if (location.search.includes('openCert=1')) {
    const tryOpen = () => {
      if (window.gamCert && window.gamCert.open) {
        setTimeout(() => window.gamCert.open(), 800);
        return true;
      }
      return false;
    };
    if (!tryOpen()) {
      const interval = setInterval(() => {
        if (tryOpen()) clearInterval(interval);
      }, 200);
      setTimeout(() => clearInterval(interval), 5000);
    }
  }
})();
</script>
