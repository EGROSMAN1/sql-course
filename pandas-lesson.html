    new_data[c].append(self._data[c][i])\n                new_data[var_name].append(v)\n                new_data[value_name].append(self._data[v][i])\n        cols = list(id_vars) + [var_name, value_name]\n        n = len(new_data[var_name])\n        return self._new(new_data, cols, list(range(n)), None, False)\n\n    def pivot_table(self, index=None, columns=None, values=None,\n                    aggfunc=\"mean\", fill_value=None):\n        row_keys = []\n        col_keys = []\n        buckets = {}\n        for i in range(self._nrows):\n            r = self._data[index][i]\n            c = self._data[columns][i]\n            if r not in row_keys:\n                row_keys.append(r)\n            if c not in col_keys:\n                col_keys.append(c)\n            k = (r, c)\n            if k not in buckets:\n                buckets[k] = []\n            v = self._data[values][i]\n            if not _is_na(v):\n                buckets[k].append(v)\n        row_keys = [row_keys[i] for i in _order(row_keys, True)]\n        col_keys = [col_keys[i] for i in _order(col_keys, True)]\n        new_data = {}\n        for c in col_keys:\n            vals = []\n            for r in row_keys:\n                bucket = buckets.get((r, c), [])\n                if not bucket:\n                    vals.append(fill_value)\n                else:\n                    vals.append(_apply_agg(bucket, aggfunc, values))\n            new_data[c] = vals\n        df = self._new(new_data, col_keys, row_keys, index, True)\n        df._index_names = [index] if index is not None else None\n        return df\n\n    def pivot(self, index=None, columns=None, values=None):\n        return self.pivot_table(index, columns, values, \"first\")\n\n    def agg(self, how):\n        if isinstance(how, dict):\n            labels = []\n            vals = []\n            for c in how.keys():\n                labels.append(c)\n                vals.append(_apply_agg(self._data[c], how[c], c))\n            s = Series(vals, index=labels)\n            s._show_index = True\n            return s\n        labels = []\n        vals = []\n        for c in self._columns:\n            labels.append(c)\n            vals.append(_apply_agg(self._data[c], how, c))\n        s = Series(vals, index=labels)\n        s._show_index = True\n        return s\n\n    # ---- merging\n    def merge(self, other, on=None, how=\"inner\", suffixes=(\"_x\", \"_y\")):\n        \"\"\"Join two DataFrames on a key column.\n\n        how: inner | left | right | outer (anything else -> ValueError).\n        Overlapping non-key columns get the `suffixes` pair, like pandas.\n        \"\"\"\n        if how not in (\"inner\", \"left\", \"right\", \"outer\"):\n            raise ValueError(\"'\" + str(how) +\n                             \"' is not a valid Merge type: left, right, inner, outer\")\n        if on is None:\n            shared = [c for c in self._columns if c in other._columns]\n            if not shared:\n                raise ValueError(\"No common columns to perform merge on\")\n            on = shared[0]\n        on_cols = on if isinstance(on, list) else [on]\n        for k in on_cols:\n            if k not in self._data:\n                raise KeyError(k)\n            if k not in other._data:\n                raise KeyError(k)\n\n        overlap = []\n        for c in self._columns:\n            if c not in on_cols and c in other._columns:\n                overlap.append(c)\n\n        left_names = {}\n        right_names = {}\n        out_cols = []\n        for c in self._columns:\n            nm = c + suffixes[0] if c in overlap else c\n            left_names[c] = nm\n            out_cols.append(nm)\n        for c in other._columns:\n            if c in on_cols:\n                continue\n            nm = c + suffixes[1] if c in overlap else c\n            right_names[c] = nm\n            out_cols.append(nm)\n\n        def key_of(df, i):\n            k = tuple([df._data[c][i] for c in on_cols])\n            return k\n\n        right_index = {}\n        for j in range(other._nrows):\n            k = key_of(other, j)\n            if k not in right_index:\n                right_index[k] = []\n            right_index[k].append(j)\n\n        new_data = {}\n        for c in out_cols:\n            new_data[c] = []\n\n        def emit(i, j):\n            for c in self._columns:\n                if i is None:\n                    if c in on_cols:\n                        new_data[left_names[c]].append(other._data[c][j])\n                    else:\n                        new_data[left_names[c]].append(None)\n                else:\n                    new_data[left_names[c]].append(self._data[c][i])\n            for c in other._columns:\n                if c in on_cols:\n                    continue\n                if j is None:\n                    new_data[right_names[c]].append(None)\n                else:\n                    new_data[right_names[c]].append(other._data[c][j])\n\n        if how == \"right\":\n            left_index = {}\n            for i in range(self._nrows):\n                k = key_of(self, i)\n                if k not in left_index:\n                    left_index[k] = []\n                left_index[k].append(i)\n            for j in range(other._nrows):\n                k = key_of(other, j)\n                if k in left_index:\n                    for i in left_index[k]:\n                        emit(i, j)\n                else:\n                    emit(None, j)\n        elif how == \"outer\":\n            keys = []\n            for i in range(self._nrows):\n                k = key_of(self, i)\n                if k not in keys:\n                    keys.append(k)\n            for j in range(other._nrows):\n                k = key_of(other, j)\n                if k not in keys:\n                    keys.append(k)\n            keys = [keys[i] for i in _order([k[0] for k in keys], True)]\n            left_index = {}\n            for i in range(self._nrows):\n                k = key_of(self, i)\n                if k not in left_index:\n                    left_index[k] = []\n                left_index[k].append(i)\n            for k in keys:\n                lefts = left_index.get(k, [])\n                rights = right_index.get(k, [])\n                if lefts and rights:\n                    for i in lefts:\n                        for j in rights:\n                            emit(i, j)\n                elif lefts:\n                    for i in lefts:\n                        emit(i, None)\n                else:\n                    for j in rights:\n                        emit(None, j)\n        else:\n            for i in range(self._nrows):\n                k = key_of(self, i)\n                if k in right_index:\n                    for j in right_index[k]:\n                        emit(i, j)\n                elif how == \"left\":\n                    emit(i, None)\n\n        n = len(new_data[out_cols[0]]) if out_cols else 0\n        return self._new(new_data, out_cols, list(range(n)), None, False)\n\n    def join(self, other, on=None, how=\"left\"):\n        return self.merge(other, on=on, how=how)\n\n    # ---- concat\n    @staticmethod\n    def concat(dfs, ignore_index=True):\n        \"\"\"Concatenate DataFrames vertically.  The column set is the UNION of\n        all inputs; missing cells become None (pandas behaviour).\"\"\"\n        frames = [d for d in dfs]\n        if not frames:\n            return DataFrame({})\n        if isinstance(frames[0], Series):\n            vals = []\n            ix = []\n            for s in frames:\n                vals.extend(s._data)\n                ix.extend(s._index)\n            if ignore_index:\n                ix = list(range(len(vals)))\n            return Series(vals, name=frames[0].name, index=ix)\n        cols = []\n        for df in frames:\n            for c in df._columns:\n                if c not in cols:\n                    cols.append(c)\n        new_data = {}\n        for c in cols:\n            new_data[c] = []\n        index = []\n        for df in frames:\n            for c in cols:\n                if c in df._data:\n                    new_data[c].extend(df._data[c])\n                else:\n                    new_data[c].extend([None] * df._nrows)\n            index.extend(df._index)\n        if ignore_index:\n            index = list(range(len(index)))\n        out = DataFrame({})\n        out._data = new_data\n        out._columns = cols\n        out._index = index\n        out._nrows = len(index)\n        out._index_name = None\n        out._show_index = False\n        return out\n\n    def append(self, other):\n        return DataFrame.concat([self, other])\n\n    # ---- index\n    def set_index(self, col, drop=True):\n        \"\"\"Move a column (or a list of columns -> MultiIndex) into the row\n        index.  Real pandas behaviour: those columns leave .columns.\"\"\"\n        if isinstance(col, list):\n            for c in col:\n                if c not in self._columns:\n                    raise KeyError(c)\n            new_cols = [c for c in self._columns if c not in col]\n            new_data = {}\n            for c in new_cols:\n                new_data[c] = list(self._data[c])\n            new_index = []\n            for i in range(self._nrows):\n                new_index.append(tuple([self._data[c][i] for c in col]))\n            df = self._new(new_data, new_cols, new_index, \"/\".join(\n                [str(c) for c in col]), True)\n            df._index_names = list(col)\n            return df\n        if col not in self._columns:\n            raise KeyError(col)\n        new_cols = [c for c in self._columns if c != col]\n        new_data = {}\n        for c in new_cols:\n            new_data[c] = list(self._data[c])\n        df = self._new(new_data, new_cols, list(self._data[col]), col, True)\n        df._index_names = [col]\n        return df\n\n    def reset_index(self, drop=False):\n        if drop:\n            df = self.copy()\n            df._index = list(range(self._nrows))\n            df._index_name = None\n            df._index_names = None\n            df._show_index = False\n            return df\n        names = self._index_names\n        if names is not None and len(names) > 1:\n            cols = list(names)\n            new_data = {}\n            for j in range(len(names)):\n                new_data[names[j]] = [lab[j] for lab in self._index]\n            for c in self._columns:\n                new_data[c] = list(self._data[c])\n                cols.append(c)\n            df = self._new(new_data, cols, list(range(self._nrows)), None, False)\n            df._index_names = None\n            return df\n        name = self._index_name if self._index_name is not None else \"index\"\n        new_data = {}\n        new_data[name] = list(self._index)\n        cols = [name]\n        for c in self._columns:\n            new_data[c] = list(self._data[c])\n            cols.append(c)\n        df = self._new(new_data, cols, list(range(self._nrows)), None, False)\n        df._index_names = None\n        return df\n\n    def rename_axis(self, name):\n        df = self.copy()\n        df._index_name = name\n        return df\n\n    # ---- info / rendering\n    def info(self):\n        print(\"DataFrame: \" + str(self._nrows) + \" rows x \" +\n              str(len(self._columns)) + \" columns\")\n        print(\"Columns:\")\n        for c in self._columns:\n            non_null = 0\n            for v in self._data[c]:\n                if v is not None:\n                    non_null += 1\n            sample = self._data[c][0] if self._nrows > 0 else None\n            type_name = type(sample).__name__ if sample is not None else \"unknown\"\n            print(\"  \" + str(c) + \" (\" + type_name + \"): \" + str(non_null) + \" non-null\")\n\n    def __str__(self):\n        return self._render_text()\n\n    def __repr__(self):\n        return self._render_text()\n\n    def _render_text(self):\n        if not self._columns and not self._show_index:\n            return \"Empty DataFrame\"\n        show = self._show_index\n        head = []\n        if show:\n            head.append(str(self._index_name) if self._index_name is not None else \"\")\n        for c in self._columns:\n            head.append(str(c))\n        lines = [\"__DATAFRAME__|\" + \"|\".join(head)]\n        for i in range(self._nrows):\n            row_vals = []\n            if show:\n                row_vals.append(_fmt(self._index[i]))\n            for c in self._columns:\n                row_vals.append(_fmt(self._data[c][i]))\n            lines.append(\"__DATAROW__|\" + \"|\".join(row_vals))\n        lines.append(\"__DATAFRAME_END__\")\n        return \"\\n\".join(lines)\n\n\n# ------------------------------------------------------------ accessors\n\nclass _SeriesILoc:\n    \"\"\"s.iloc[0] / s.iloc[-1] / s.iloc[0:3] / s.iloc[[0, 2]] — positional, like pandas.\"\"\"\n\n    def __init__(self, s):\n        self.s = s\n\n    def __getitem__(self, key):\n        s = self.s\n        n = len(s._data)\n        if isinstance(key, slice):\n            idx = list(range(n))[key]\n            return s._like([s._data[i] for i in idx], [s._index[i] for i in idx])\n        if isinstance(key, Series):\n            key = key._data\n        if isinstance(key, list):\n            if len(key) == n and _looks_boolean(key):\n                idx = [i for i in range(n) if key[i]]\n            else:\n                idx = [i if i >= 0 else n + i for i in key]\n            return s._like([s._data[i] for i in idx], [s._index[i] for i in idx])\n        k = key if key >= 0 else n + key\n        if k < 0 or k >= n:\n            raise IndexError(\"single positional indexer is out-of-bounds\")\n        return s._data[k]\n\n    def __len__(self):\n        return len(self.s._data)\n\n\nclass _SeriesLoc:\n    \"\"\"s.loc[label] / s.loc[[l1, l2]] / s.loc[boolean_mask] — by label, like pandas.\"\"\"\n\n    def __init__(self, s):\n        self.s = s\n\n    def __getitem__(self, key):\n        s = self.s\n        if isinstance(key, Series):\n            key = key._data\n        if isinstance(key, list):\n            if len(key) == len(s._data) and _looks_boolean(key):\n                idx = [i for i in range(len(s._data)) if key[i]]\n                return s._like([s._data[i] for i in idx], [s._index[i] for i in idx])\n            out = []\n            oi = []\n            for lab in key:\n                if lab not in s._index:\n                    raise KeyError(str(lab))\n                i = s._index.index(lab)\n                out.append(s._data[i])\n                oi.append(lab)\n            return s._like(out, oi)\n        if key not in s._index:\n            raise KeyError(str(key))\n        return s._data[s._index.index(key)]\n\n\nclass _Loc:\n    \"\"\"df.loc[label] / df.loc[mask] / df.loc[mask, 'col'] / df.loc[:, ['a']]\"\"\"\n\n    def __init__(self, df):\n        self.df = df\n\n    def _rows(self, key):\n        df = self.df\n        if isinstance(key, slice):\n            if key.start is None and key.stop is None:\n                return list(range(df._nrows)), False\n            start = df._index.index(key.start) if key.start is not None else 0\n            stop = df._index.index(key.stop) + 1 if key.stop is not None else df._nrows\n            return list(range(start, stop)), False\n        if isinstance(key, Series):\n            if _looks_boolean(key._data):\n                mask = _as_mask(key, df._nrows)\n                return [i for i in range(df._nrows) if i < len(mask) and mask[i]], False\n            key = key._data\n        if isinstance(key, list):\n            if len(key) == df._nrows and _looks_boolean(key):\n                return [i for i in range(df._nrows) if key[i]], False\n            return [df._index.index(lab) for lab in key], False\n        if key not in df._index and df._groupkeys:\n            # Legacy groupby results keep the group key as a COLUMN and a\n            # 0..n index, while pandas puts it in the index.  Accept\n            # gb.agg(...).loc['HR'] anyway by looking the label up there.\n            gk = df._groupkeys\n            if len(gk) == 1 and gk[0] in df._columns:\n                col = df._data[gk[0]]\n                if key in col:\n                    return [col.index(key)], True\n            elif isinstance(key, tuple) and len(key) == len(gk):\n                for i in range(df._nrows):\n                    if tuple([df._data[c][i] for c in gk]) == key:\n                        return [i], True\n        return [df._index.index(key)], True\n\n    def __getitem__(self, key):\n        df = self.df\n        cols = None\n        single_col = False\n        if isinstance(key, tuple):\n            rows_key = key[0]\n            cols = key[1]\n            if isinstance(cols, str):\n                cols = [cols]\n                single_col = True\n            elif isinstance(cols, slice):\n                cols = list(df._columns)\n        else:\n            rows_key = key\n        idx, single_row = self._rows(rows_key)\n        if cols is None:\n            cols = list(df._columns)\n        if single_row and single_col:\n            return df._data[cols[0]][idx[0]]\n        if single_row:\n            s = Series([df._data[c][idx[0]] for c in cols],\n                       name=df._index[idx[0]], index=list(cols))\n            s._show_index = True\n            return s\n        if single_col:\n            c = cols[0]\n            return Series([df._data[c][i] for i in idx], name=c,\n                          index=[df._index[i] for i in idx])\n        new_data = {}\n        for c in cols:\n            new_data[c] = [df._data[c][i] for i in idx]\n        return df._new(new_data, cols, [df._index[i] for i in idx])\n\n    def __setitem__(self, key, value):\n        df = self.df\n        if isinstance(key, tuple):\n            idx, _s = self._rows(key[0])\n            col = key[1]\n            for i in idx:\n                df._data[col][i] = value\n            return\n        raise TypeError(\"loc assignment needs [rows, col]\")\n\n\nclass _ILoc:\n    \"\"\"df.iloc[3] / df.iloc[0:5] / df.iloc[3, 1] / df.iloc[[0, 2]]\"\"\"\n\n    def __init__(self, df):\n        self.df = df\n\n    def _rows(self, key):\n        df = self.df\n        if isinstance(key, slice):\n            return list(range(df._nrows))[key], False\n        if isinstance(key, Series):\n            key = key._data\n        if isinstance(key, list):\n            if len(key) == df._nrows and _looks_boolean(key):\n                return [i for i in range(df._nrows) if key[i]], False\n            return [i if i >= 0 else df._nrows + i for i in key], False\n        k = key if key >= 0 else df._nrows + key\n        return [k], True\n\n    def __getitem__(self, key):\n        df = self.df\n        cols = None\n        single_col = False\n        if isinstance(key, tuple):\n            rows_key = key[0]\n            ckey = key[1]\n            if isinstance(ckey, int):\n                cols = [df._columns[ckey]]\n                single_col = True\n            elif isinstance(ckey, slice):\n                cols = df._columns[ckey]\n            else:\n                cols = [df._columns[j] if isinstance(j, int) else j for j in ckey]\n        else:\n            rows_key = key\n        idx, single_row = self._rows(rows_key)\n        if cols is None:\n            cols = list(df._columns)\n        if single_row and single_col:\n            return df._data[cols[0]][idx[0]]\n        if single_row:\n            s = Series([df._data[c][idx[0]] for c in cols],\n                       name=df._index[idx[0]], index=list(cols))\n            s._show_index = True\n            return s\n        if single_col:\n            c = cols[0]\n            return Series([df._data[c][i] for i in idx], name=c,\n                          index=[df._index[i] for i in idx])\n        new_data = {}\n        for c in cols:\n            new_data[c] = [df._data[c][i] for i in idx]\n        return df._new(new_data, cols, [df._index[i] for i in idx])\n\n\nclass _At:\n    def __init__(self, df):\n        self.df = df\n\n    def __getitem__(self, key):\n        lab, col = key\n        return self.df._data[col][self.df._index.index(lab)]\n\n    def __setitem__(self, key, value):\n        lab, col = key\n        self.df._data[col][self.df._index.index(lab)] = value\n\n\nclass _IAt:\n    def __init__(self, df):\n        self.df = df\n\n    def __getitem__(self, key):\n        i, j = key\n        return self.df._data[self.df._columns[j]][i]\n\n    def __setitem__(self, key, value):\n        i, j = key\n        self.df._data[self.df._columns[j]][i] = value\n\n\n# --------------------------------------------------------------- groupby\n\ndef _apply_agg(values, how, name=None):\n    s = Series(values, name=name)\n    if callable(how):\n        return how([v for v in values if not _is_na(v)])\n    if how == \"mean\":\n        return s.mean()\n    if how == \"sum\":\n        return s.sum()\n    if how == \"min\":\n        return s.min()\n    if how == \"max\":\n        return s.max()\n    if how == \"count\":\n        return s.count()\n    if how == \"size\":\n        return len(values)\n    if how == \"nunique\":\n        return s.nunique()\n    if how == \"median\":\n        return s.median()\n    if how == \"std\":\n        return s.std()\n    if how == \"var\":\n        return s.var()\n    if how == \"first\":\n        for v in values:\n            if not _is_na(v):\n                return v\n        return None\n    if how == \"last\":\n        for v in values[::-1]:\n            if not _is_na(v):\n                return v\n        return None\n    raise ValueError(\"Unknown aggregation: \" + str(how))\n\n\nclass GroupBy:\n    \"\"\"Result of df.groupby(col) or df.groupby([col1, col2]).\"\"\"\n\n    def __init__(self, df, by, sort=False):\n        self._df = df\n        self._multi = isinstance(by, list)\n        self._by_list = list(by) if self._multi else [by]\n        self._by = by\n        for c in self._by_list:\n            if c not in df._data:\n                raise KeyError(c)\n        self._groups = {}\n        self._order = []\n        for i in range(df._nrows):\n            if self._multi:\n                key = tuple([df._data[c][i] for c in self._by_list])\n            else:\n                key = df._data[self._by_list[0]][i]\n            if key not in self._groups:\n                self._groups[key] = []\n                self._order.append(key)\n            self._groups[key].append(i)\n        if sort:\n            self._order = [self._order[i] for i in _order(\n                [k if not isinstance(k, tuple) else str(k) for k in self._order], True)]\n\n    def __len__(self):\n        return len(self._order)\n\n    def __iter__(self):\n        out = []\n        for key in self._order:\n            out.append((key, self._df._take(self._groups[key])))\n        return iter(out)\n\n    def __getitem__(self, col):\n        if isinstance(col, list):\n            return _GroupByCols(self, col)\n        return _SeriesGroupBy(self, col)\n\n    def groups(self):\n        out = {}\n        for key in self._order:\n            out[key] = [self._df._index[i] for i in self._groups[key]]\n        return out\n\n    def _value_cols(self):\n        return [c for c in self._df._columns if c not in self._by_list]\n\n    def _key_columns(self):\n        new_data = {}\n        for c in self._by_list:\n            new_data[c] = []\n        for key in self._order:\n            if self._multi:\n                for j in range(len(self._by_list)):\n                    new_data[self._by_list[j]].append(key[j])\n            else:\n                new_data[self._by_list[0]].append(key)\n        return new_data\n\n    def _agg(self, fn, cols=None, numeric_only=True):\n        \"\"\"Aggregate.  Non-numeric columns yield None (legacy behaviour).\"\"\"\n        value_cols = cols if cols is not None else self._value_cols()\n        new_data = self._key_columns()\n        for c in value_cols:\n            new_data[c] = []\n        for key in self._order:\n            indices = self._groups[key]\n            for c in value_cols:\n                vals = []\n                for i in indices:\n                    v = self._df._data[c][i]\n                    if _is_na(v):\n                        continue\n                    if numeric_only:\n                        if _is_num(v):\n                            vals.append(v)\n                    else:\n                        vals.append(v)\n                if vals:\n                    new_data[c].append(fn(vals))\n                else:\n                    new_data[c].append(None)\n        out_cols = list(self._by_list) + list(value_cols)\n        out = self._df._new(new_data, out_cols,\n                            list(range(len(self._order))), None, False)\n        out._groupkeys = list(self._by_list)\n        return out\n\n    def mean(self):\n        return self._agg(lambda v: round(sum(v) / len(v), 2))\n\n    def sum(self):\n        return self._agg(sum)\n\n    def max(self):\n        return self._agg(max)\n\n    def min(self):\n        return self._agg(min)\n\n    def median(self):\n        return self._agg(lambda v: _quantile_of(sorted(v), 0.5))\n\n    def std(self):\n        return self._agg(lambda v: _std_of(v))\n\n    def count(self):\n        \"\"\"Non-null count PER COLUMN (pandas).  Note: this differs from the\n        old mini-pandas, where count() returned one 'count' column of row\n        counts -- that is now size().\"\"\"\n        new_data = self._key_columns()\n        value_cols = self._value_cols()\n        for c in value_cols:\n            new_data[c] = []\n        for key in self._order:\n            indices = self._groups[key]\n            for c in value_cols:\n                cnt = 0\n                for i in indices:\n                    if not _is_na(self._df._data[c][i]):\n                        cnt += 1\n                new_data[c].append(cnt)\n        out_cols = list(self._by_list) + list(value_cols)\n        out = self._df._new(new_data, out_cols,\n                            list(range(len(self._order))), None, False)\n        out._groupkeys = list(self._by_list)\n        return out\n\n    def size(self):\n        \"\"\"Rows per group, as a Series indexed by group key (pandas).\"\"\"\n        s = Series([len(self._groups[k]) for k in self._order],\n                   name=\"size\", index=list(self._order))\n        s._show_index = True\n        return s\n\n    def nunique(self):\n        return self._agg(_uniq_len, None, False)\n\n    def first(self):\n        return self._agg(lambda v: v[0], None, False)\n\n    def last(self):\n        return self._agg(lambda v: v[-1], None, False)\n\n    def agg(self, how):\n        \"\"\"gb.agg({'col': 'mean'}) or gb.agg('sum').\"\"\"\n        if isinstance(how, dict):\n            new_data = self._key_columns()\n            value_cols = []\n            for c in how.keys():\n                value_cols.append(c)\n                new_data[c] = []\n            for key in self._order:\n                indices = self._groups[key]\n                for c in value_cols:\n                    vals = [self._df._data[c][i] for i in indices]\n                    new_data[c].append(_apply_agg(vals, how[c], c))\n            out_cols = list(self._by_list) + value_cols\n            out = self._df._new(new_data, out_cols,\n                                list(range(len(self._order))), None, False)\n            out._groupkeys = list(self._by_list)\n            return out\n        value_cols = self._value_cols()\n        new_data = self._key_columns()\n        for c in value_cols:\n            new_data[c] = []\n        for key in self._order:\n            indices = self._groups[key]\n            for c in value_cols:\n                vals = [self._df._data[c][i] for i in indices]\n                new_data[c].append(_apply_agg(vals, how, c))\n        out_cols = list(self._by_list) + list(value_cols)\n        out = self._df._new(new_data, out_cols,\n                            list(range(len(self._order))), None, False)\n        out._groupkeys = list(self._by_list)\n        return out\n\n    def apply(self, fn):\n        vals = []\n        for key in self._order:\n            vals.append(fn(self._df._take(self._groups[key])))\n        s = Series(vals, index=list(self._order))\n        s._show_index = True\n        return s\n\n\ndef _uniq_len(vals):\n    seen = []\n    for v in vals:\n        if v not in seen:\n            seen.append(v)\n    return len(seen)\n\n\nclass _SeriesGroupBy:\n    \"\"\"df.groupby('k')['v'] -> aggregations returning a Series.\"\"\"\n\n    def __init__(self, gb, col):\n        self._gb = gb\n        self._col = col\n\n    def _reduce(self, how):\n        vals = []\n        for key in self._gb._order:\n            indices = self._gb._groups[key]\n            col_vals = [self._gb._df._data[self._col][i] for i in indices]\n            vals.append(_apply_agg(col_vals, how, self._col))\n        s = Series(vals, name=self._col, index=list(self._gb._order))\n        s._show_index = True\n        return s\n\n    def mean(self):\n        return self._reduce(\"mean\")\n\n    def sum(self):\n        return self._reduce(\"sum\")\n\n    def min(self):\n        return self._reduce(\"min\")\n\n    def max(self):\n        return self._reduce(\"max\")\n\n    def count(self):\n        return self._reduce(\"count\")\n\n    def size(self):\n        return self._gb.size()\n\n    def nunique(self):\n        return self._reduce(\"nunique\")\n\n    def median(self):\n        return self._reduce(\"median\")\n\n    def std(self):\n        return self._reduce(\"std\")\n\n    def var(self):\n        return self._reduce(\"var\")\n\n    def first(self):\n        return self._reduce(\"first\")\n\n    def last(self):\n        return self._reduce(\"last\")\n\n    # ---- transforms: one value per ORIGINAL row, original order kept\n    def _transform(self, fn):\n        df = self._gb._df\n        out = [None] * df._nrows\n        for key in self._gb._order:\n            indices = self._gb._groups[key]\n            vals = [df._data[self._col][i] for i in indices]\n            res = fn(vals)\n            for j in range(len(indices)):\n                out[indices[j]] = res[j]\n        return Series(out, name=self._col, index=list(df._index))\n\n    def cumsum(self):\n        return self._transform(lambda v: Series(v).cumsum()._data)\n\n    def cumcount(self):\n        return self._transform(lambda v: list(range(len(v))))\n\n    def cummax(self):\n        return self._transform(lambda v: Series(v).cummax()._data)\n\n    def cummin(self):\n        return self._transform(lambda v: Series(v).cummin()._data)\n\n    def rank(self, method=\"average\", ascending=True):\n        return self._transform(\n            lambda v: _rank_values(v, method, ascending))\n\n    def transform(self, how):\n        if callable(how):\n            return self._transform(lambda v: [how(x) for x in v])\n        return self._transform(\n            lambda v: [_apply_agg(v, how, self._col)] * len(v))\n\n    def apply(self, fn):\n        vals = []\n        for key in self._gb._order:\n            indices = self._gb._groups[key]\n            vals.append(fn(Series(\n                [self._gb._df._data[self._col][i] for i in indices],\n                name=self._col,\n                index=[self._gb._df._index[i] for i in indices])))\n        s = Series(vals, name=self._col, index=list(self._gb._order))\n        s._show_index = True\n        return s\n\n    def agg(self, how):\n        \"\"\"agg('mean'), agg(fn) -> Series;  agg(['mean','max']) -> DataFrame\n        with one column per aggregation, indexed by group key.\"\"\"\n        if isinstance(how, list):\n            names = []\n            for h in how:\n                names.append(h if isinstance(h, str) else getattr(\n                    h, \"__name__\", \"<lambda>\"))\n            new_data = {}\n            for nm in names:\n                new_data[nm] = []\n            for key in self._gb._order:\n                indices = self._gb._groups[key]\n                col_vals = [self._gb._df._data[self._col][i] for i in indices]\n                for j in range(len(how)):\n                    new_data[names[j]].append(\n                        _apply_agg(col_vals, how[j], self._col))\n            df = self._gb._df._new(new_data, names, list(self._gb._order),\n                                   self._gb._by_list[0], True)\n            df._index_names = [self._gb._by_list[0]]\n            return df\n        return self._reduce(how)\n\n\nclass _GroupByCols:\n    def __init__(self, gb, cols):\n        self._gb = gb\n        self._cols = cols\n\n    def mean(self):\n        return GroupBy._agg(self._gb, lambda v: round(sum(v) / len(v), 2), self._cols)\n\n    def sum(self):\n        return GroupBy._agg(self._gb, sum, self._cols)\n\n    def min(self):\n        return GroupBy._agg(self._gb, min, self._cols)\n\n    def max(self):\n        return GroupBy._agg(self._gb, max, self._cols)\n\n    def agg(self, how):\n        return self._gb.agg(how)\n\n\n# ------------------------------------------------------- query() parser\n\ndef _split_top(expr, seps):\n    \"\"\"Split on top-level (non-bracketed) occurrences of the given words.\"\"\"\n    parts = []\n    cur = \"\"\n    depth = 0\n    quote = \"\"\n    i = 0\n    n = len(expr)\n    while i < n:\n        ch = expr[i]\n        if quote != \"\":\n            if ch == quote:\n                quote = \"\"\n            cur += ch\n            i += 1\n            continue\n        if ch == '\"' or ch == \"'\":\n            quote = ch\n            cur += ch\n            i += 1\n            continue\n        if ch in \"([\":\n            depth += 1\n        elif ch in \")]\":\n            depth -= 1\n        if depth == 0:\n            matched = None\n            for sep in seps:\n                if expr[i:i + len(sep)] == sep:\n                    matched = sep\n                    break\n            if matched is not None:\n                parts.append(cur)\n                cur = \"\"\n                i += len(matched)\n                continue\n        cur += ch\n        i += 1\n    parts.append(cur)\n    return parts\n\n\ndef _q_literal(tok, row):\n    tok = tok.strip()\n    if tok == \"\":\n        return None\n    if tok[0] == \"[\" and tok[-1] == \"]\":\n        inner = tok[1:-1].strip()\n        if inner == \"\":\n            return []\n        return [_q_literal(p, row) for p in inner.split(\",\")]\n    if (tok[0] == '\"' and tok[-1] == '\"') or (tok[0] == \"'\" and tok[-1] == \"'\"):\n        return tok[1:-1]\n    if tok == \"True\":\n        return True\n    if tok == \"False\":\n        return False\n    if tok == \"None\":\n        return None\n    if tok in row:\n        return row[tok]\n    if tok[0] == \"@\" and tok[1:] in row:\n        return row[tok[1:]]\n    try:\n        if \".\" in tok or \"e\" in tok or \"E\" in tok:\n            return float(tok)\n        return int(tok)\n    except ValueError:\n        raise ValueError(\"query: cannot resolve '\" + tok + \"'\")\n\n\ndef _eval_query(expr, row):\n    expr = expr.strip()\n    if expr[:1] == \"(\" and expr[-1:] == \")\":\n        # only strip if the parens wrap the whole expression\n        depth = 0\n        wraps = True\n        for i in range(len(expr)):\n            if expr[i] == \"(\":\n                depth += 1\n            elif expr[i] == \")\":\n                depth -= 1\n                if depth == 0 and i < len(expr) - 1:\n                    wraps = False\n                    break\n        if wraps:\n            return _eval_query(expr[1:-1], row)\n    parts = _split_top(expr, [\" or \", \" | \"])\n    if len(parts) > 1:\n        for p in parts:\n            if _eval_query(p, row):\n                return True\n        return False\n    parts = _split_top(expr, [\" and \", \" & \"])\n    if len(parts) > 1:\n        for p in parts:\n            if not _eval_query(p, row):\n                return False\n        return True\n    if expr[:4] == \"not \":\n        return not _eval_query(expr[4:], row)\n    if expr[:1] == \"~\":\n        return not _eval_query(expr[1:], row)\n    for op in [\"==\", \"!=\", \">=\", \"<=\"]:\n        parts = _split_top(expr, [op])\n        if len(parts) == 2:\n            a = _q_literal(parts[0], row)\n            b = _q_literal(parts[1], row)\n            if _is_na(a) or _is_na(b):\n                return op == \"!=\"\n            if op == \"==\":\n                return a == b\n            if op == \"!=\":\n                return a != b\n            if op == \">=\":\n                return a >= b\n            return a <= b\n    for op in [\">\", \"<\"]:\n        parts = _split_top(expr, [op])\n        if len(parts) == 2:\n            a = _q_literal(parts[0], row)\n            b = _q_literal(parts[1], row)\n            if _is_na(a) or _is_na(b):\n                return False\n            if op == \">\":\n                return a > b\n            return a < b\n    parts = _split_top(expr, [\" not in \"])\n    if len(parts) == 2:\n        return _q_literal(parts[0], row) not in _q_literal(parts[1], row)\n    parts = _split_top(expr, [\" in \"])\n    if len(parts) == 2:\n        return _q_literal(parts[0], row) in _q_literal(parts[1], row)\n    v = _q_literal(expr, row)\n    return bool(v) and not _is_na(v)\n\n\n# =============================================================\n# MultiIndex\n# =============================================================\n\nclass MultiIndex:\n    \"\"\"The index produced by df.set_index([col_a, col_b]).  Each label is a\n    tuple; `nlevels` and `names` behave like pandas.\"\"\"\n\n    def __init__(self, tuples, names=None):\n        self._tuples = [tuple(t) for t in tuples]\n        if names is None:\n            names = [None] * (len(self._tuples[0]) if self._tuples else 0)\n        self.names = list(names)\n\n    @staticmethod\n    def from_tuples(tuples, names=None):\n        return MultiIndex(tuples, names)\n\n    @staticmethod\n    def from_arrays(arrays, names=None):\n        rows = []\n        if arrays:\n            for i in range(len(arrays[0])):\n                rows.append(tuple([a[i] for a in arrays]))\n        return MultiIndex(rows, names)\n\n    @property\n    def nlevels(self):\n        return len(self.names)\n\n    @property\n    def levels(self):\n        out = []\n        for j in range(self.nlevels):\n            seen = []\n            for t in self._tuples:\n                if t[j] not in seen:\n                    seen.append(t[j])\n            out.append(sorted(seen, key=lambda x: str(x)))\n        return out\n\n    def get_level_values(self, level):\n        j = level if isinstance(level, int) else self.names.index(level)\n        return Series([t[j] for t in self._tuples])\n\n    def tolist(self):\n        return list(self._tuples)\n\n    def __len__(self):\n        return len(self._tuples)\n\n    def __iter__(self):\n        return iter(self._tuples)\n\n    def __getitem__(self, k):\n        return self._tuples[k]\n\n    def __contains__(self, k):\n        return tuple(k) in self._tuples\n\n    def __repr__(self):\n        return \"MultiIndex(\" + str(self._tuples) + \")\"\n\n    def __str__(self):\n        return self.__repr__()\n\n\n# =============================================================\n# Dates:  pd.to_datetime / pd.date_range / Series.dt\n# =============================================================\n\n_MONTH_NAMES = [\"January\", \"February\", \"March\", \"April\", \"May\", \"June\",\n                \"July\", \"August\", \"September\", \"October\", \"November\",\n                \"December\"]\n_DAY_NAMES = [\"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\",\n              \"Saturday\", \"Sunday\"]\n_MONTH_DAYS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31]\n\n\ndef _is_leap(y):\n    return (y % 4 == 0 and y % 100 != 0) or y % 400 == 0\n\n\ndef _days_in_month(y, m):\n    if m == 2 and _is_leap(y):\n        return 29\n    return _MONTH_DAYS[m - 1]\n\n\ndef _days_from_civil(y, m, d):\n    \"\"\"Days since 1970-01-01 (Howard Hinnant's algorithm, integer only).\"\"\"\n    yy = y - 1 if m <= 2 else y\n    era = (yy if yy >= 0 else yy - 399) // 400\n    yoe = yy - era * 400\n    mp = m - 3 if m > 2 else m + 9\n    doy = (153 * mp + 2) // 5 + d - 1\n    doe = yoe * 365 + yoe // 4 - yoe // 100 + doy\n    return era * 146097 + doe - 719468\n\n\ndef _civil_from_days(z):\n    z = z + 719468\n    era = (z if z >= 0 else z - 146096) // 146097\n    doe = z - era * 146097\n    yoe = (doe - doe // 1460 + doe // 36524 - doe // 146096) // 365\n    y = yoe + era * 400\n    doy = doe - (365 * yoe + yoe // 4 - yoe // 100)\n    mp = (5 * doy + 2) // 153\n    d = doy - (153 * mp + 2) // 5 + 1\n    m = mp + 3 if mp < 10 else mp - 9\n    return (y + 1 if m <= 2 else y, m, d)\n\n\ndef _p2(n):\n    return (\"0\" + str(n))[-2:]\n\n\nclass Timestamp:\n    \"\"\"A very small date/time value -- enough for .dt and date_range.\"\"\"\n\n    def __init__(self, year, month=1, day=1, hour=0, minute=0, second=0):\n        self.year = year\n        self.month = month\n        self.day = day\n        self.hour = hour\n        self.minute = minute\n        self.second = second\n\n    # ---- calendar properties\n    @property\n    def dayofweek(self):\n        return (_days_from_civil(self.year, self.month, self.day) + 3) % 7\n\n    @property\n    def weekday(self):\n        return self.dayofweek\n\n    @property\n    def dayofyear(self):\n        return (_days_from_civil(self.year, self.month, self.day)\n                - _days_from_civil(self.year, 1, 1) + 1)\n\n    @property\n    def quarter(self):\n        return (self.month - 1) // 3 + 1\n\n    @property\n    def days_in_month(self):\n        return _days_in_month(self.year, self.month)\n\n    @property\n    def is_month_end(self):\n        return self.day == _days_in_month(self.year, self.month)\n\n    @property\n    def is_month_start(self):\n        return self.day == 1\n\n    @property\n    def date_only(self):\n        return Timestamp(self.year, self.month, self.day)\n\n    def day_name(self):\n        return _DAY_NAMES[self.dayofweek]\n\n    def month_name(self):\n        return _MONTH_NAMES[self.month - 1]\n\n    def date(self):\n        return self.date_only\n\n    def strftime(self, fmt):\n        out = fmt\n        out = out.replace(\"%Y\", str(self.year))\n        out = out.replace(\"%m\", _p2(self.month))\n        out = out.replace(\"%d\", _p2(self.day))\n        out = out.replace(\"%H\", _p2(self.hour))\n        out = out.replace(\"%M\", _p2(self.minute))\n        out = out.replace(\"%S\", _p2(self.second))\n        out = out.replace(\"%B\", self.month_name())\n        out = out.replace(\"%b\", self.month_name()[:3])\n        out = out.replace(\"%A\", self.day_name())\n        out = out.replace(\"%a\", self.day_name()[:3])\n        return out\n\n    def _ord(self):\n        return (_days_from_civil(self.year, self.month, self.day) * 86400\n                + self.hour * 3600 + self.minute * 60 + self.second)\n\n    def __eq__(self, other):\n        return isinstance(other, Timestamp) and self._ord() == other._ord()\n\n    def __ne__(self, other):\n        return not self.__eq__(other)\n\n    def __lt__(self, other):\n        return self._ord() < other._ord()\n\n    def __le__(self, other):\n        return self._ord() <= other._ord()\n\n    def __gt__(self, other):\n        return self._ord() > other._ord()\n\n    def __ge__(self, other):\n        return self._ord() >= other._ord()\n\n    def __hash__(self):\n        return self._ord()\n\n    def __repr__(self):\n        return \"Timestamp('\" + str(self) + \"')\"\n\n    def __str__(self):\n        s = str(self.year) + \"-\" + _p2(self.month) + \"-\" + _p2(self.day)\n        if self.hour or self.minute or self.second:\n            s += \" \" + _p2(self.hour) + \":\" + _p2(self.minute) + \":\" + \\\n                 _p2(self.second)\n        return s\n\n\ndef _parse_ts(v):\n    \"\"\"Parse one value into a Timestamp.  Accepts 'YYYY-MM-DD[ HH:MM[:SS]]',\n    'DD/MM/YYYY' and 'YYYY/MM/DD'.\"\"\"\n    if isinstance(v, Timestamp):\n        return v\n    if _is_na(v):\n        return None\n    s = str(v).strip()\n    time_part = \"\"\n    if \" \" in s:\n        bits = s.split(\" \")\n        s = bits[0]\n        time_part = bits[1]\n    elif \"T\" in s:\n        bits = s.split(\"T\")\n        s = bits[0]\n        time_part = bits[1]\n    sep = \"-\" if \"-\" in s else (\"/\" if \"/\" in s else None)\n    if sep is None:\n        raise ValueError(\"Cannot parse date: \" + str(v))\n    p = s.split(sep)\n    if len(p) != 3:\n        raise ValueError(\"Cannot parse date: \" + str(v))\n    if len(p[0]) == 4:\n        y, m, d = int(p[0]), int(p[1]), int(p[2])\n    else:\n        d, m, y = int(p[0]), int(p[1]), int(p[2])\n    h = mi = sec = 0\n    if time_part:\n        t = time_part.split(\":\")\n        h = int(t[0])\n        if len(t) > 1:\n            mi = int(t[1])\n        if len(t) > 2:\n            sec = int(float(t[2]))\n    return Timestamp(y, m, d, h, mi, sec)\n\n\ndef to_datetime(obj, errors=\"raise\"):\n    \"\"\"pd.to_datetime -- on a Series returns a Series of Timestamps.\"\"\"\n    if isinstance(obj, Series):\n        out = []\n        for v in obj._data:\n            try:\n                out.append(_parse_ts(v))\n            except ValueError:\n                if errors == \"coerce\":\n                    out.append(None)\n                else:\n                    raise\n        return obj._like(out)\n    if isinstance(obj, list):\n        return [_parse_ts(v) for v in obj]\n    return _parse_ts(obj)\n\n\ndef _add_months(ts, n):\n    m = ts.month - 1 + n\n    y = ts.year + m // 12\n    m = m % 12 + 1\n    return Timestamp(y, m, min(ts.day, _days_in_month(y, m)),\n                     ts.hour, ts.minute, ts.second)\n\n\ndef _shift(ts, freq, n):\n    f = str(freq).upper()\n    if f in (\"D\", \"1D\"):\n        y, m, d = _civil_from_days(\n            _days_from_civil(ts.year, ts.month, ts.day) + n)\n        return Timestamp(y, m, d, ts.hour, ts.minute, ts.second)\n    if f in (\"W\", \"W-SUN\", \"7D\"):\n        y, m, d = _civil_from_days(\n            _days_from_civil(ts.year, ts.month, ts.day) + 7 * n)\n        return Timestamp(y, m, d, ts.hour, ts.minute, ts.second)\n    if f in (\"H\", \"h\"):\n        return ts\n    if f in (\"MS\", \"M\", \"ME\"):\n        nxt = _add_months(Timestamp(ts.year, ts.month, 1), n)\n        if f == \"MS\":\n            return nxt\n        return Timestamp(nxt.year, nxt.month,\n                         _days_in_month(nxt.year, nxt.month))\n    if f in (\"YS\", \"Y\", \"YE\", \"A\", \"AS\"):\n        nxt = Timestamp(ts.year + n, 1 if f in (\"YS\", \"AS\") else 12,\n                        1 if f in (\"YS\", \"AS\") else 31)\n        return nxt\n    if f in (\"QS\", \"Q\", \"QE\"):\n        return _add_months(ts, 3 * n)\n    raise ValueError(\"Unsupported freq: \" + str(freq))\n\n\ndef date_range(start=None, end=None, periods=None, freq=\"D\"):\n    \"\"\"pd.date_range -- returns a Series of Timestamps.\"\"\"\n    f = str(freq).upper()\n    if start is None and end is not None and periods is not None:\n        back = _shift(_parse_ts(end), freq, -(periods - 1))\n        start = back\n    cur = _parse_ts(start)\n    if f == \"MS\":\n        cur = Timestamp(cur.year, cur.month, 1)\n    elif f in (\"ME\", \"M\"):\n        cur = Timestamp(cur.year, cur.month,\n                        _days_in_month(cur.year, cur.month))\n    out = []\n    if periods is not None:\n        for i in range(periods):\n            out.append(cur)\n            cur = _shift(cur, freq, 1)\n    else:\n        stop = _parse_ts(end)\n        guard = 0\n        while cur._ord() <= stop._ord() and guard < 100000:\n            out.append(cur)\n            cur = _shift(cur, freq, 1)\n            guard += 1\n    s = Series(out)\n    s._show_index = True\n    return s\n\n\nclass _DtAccessor:\n    \"\"\"Series.dt -- date parts of a Series of Timestamps.\"\"\"\n\n    def __init__(self, series):\n        self._s = series\n\n    def _map(self, fn):\n        return self._s._like([None if _is_na(v) else fn(_parse_ts(v))\n                              for v in self._s._data])\n\n    @property\n    def year(self):\n        return self._map(lambda t: t.year)\n\n    @property\n    def month(self):\n        return self._map(lambda t: t.month)\n\n    @property\n    def day(self):\n        return self._map(lambda t: t.day)\n\n    @property\n    def hour(self):\n        return self._map(lambda t: t.hour)\n\n    @property\n    def minute(self):\n        return self._map(lambda t: t.minute)\n\n    @property\n    def second(self):\n        return self._map(lambda t: t.second)\n\n    @property\n    def dayofweek(self):\n        return self._map(lambda t: t.dayofweek)\n\n    @property\n    def weekday(self):\n        return self._map(lambda t: t.dayofweek)\n\n    @property\n    def dayofyear(self):\n        return self._map(lambda t: t.dayofyear)\n\n    @property\n    def quarter(self):\n        return self._map(lambda t: t.quarter)\n\n    @property\n    def days_in_month(self):\n        return self._map(lambda t: t.days_in_month)\n\n    @property\n    def date(self):\n        return self._map(lambda t: t.date_only)\n\n    def day_name(self):\n        return self._map(lambda t: t.day_name())\n\n    def month_name(self):\n        return self._map(lambda t: t.month_name())\n\n    def strftime(self, fmt):\n        return self._map(lambda t: t.strftime(fmt))\n\n    def normalize(self):\n        return self._map(lambda t: t.date_only)\n\n\n# =============================================================\n# module-level helpers:  these names ARE the `pandas` module\n# =============================================================\n\ndef concat(objs, ignore_index=True, axis=0):\n    \"\"\"pd.concat([df1, df2]) / pd.concat([s1, s2]).\"\"\"\n    if objs and isinstance(objs[0], Series) and axis == 0:\n        data = []\n        idx = []\n        for s in objs:\n            data.extend(s._data)\n            idx.extend(s._index)\n        if ignore_index:\n            idx = list(range(len(data)))\n        out = Series(data, name=objs[0].name, index=idx)\n        out._show_index = objs[0]._show_index\n        return out\n    return DataFrame.concat(objs, ignore_index)\n\n\ndef merge(left, right, on=None, how=\"inner\", suffixes=(\"_x\", \"_y\")):\n    return left.merge(right, on=on, how=how, suffixes=suffixes)\n\n\ndef isna(v):\n    if isinstance(v, (Series, DataFrame)):\n        return v.isna()\n    return _is_na(v)\n\n\ndef isnull(v):\n    return isna(v)\n\n\ndef notna(v):\n    if isinstance(v, (Series, DataFrame)):\n        return v.notna()\n    return not _is_na(v)\n\n\ndef notnull(v):\n    return notna(v)\n\n\ndef unique(v):\n    return Series(v).unique()\n\n\ndef cut(x, bins, labels=None, right=True, include_lowest=False):\n    \"\"\"pd.cut -- bin values into ranges.  `bins` is an edge list or an int\n    (equal-width bins).  Values outside every bin become NaN.\"\"\"\n    vals = x._data if isinstance(x, Series) else list(x)\n    if isinstance(bins, int):\n        nums = [v for v in vals if not _is_na(v)]\n        lo = min(nums)\n        hi = max(nums)\n        span = (hi - lo) if hi != lo else 1.0\n        pad = span / 1000.0\n        edges = [lo - pad]\n        for i in range(1, bins + 1):\n            edges.append(lo + span * i / float(bins))\n    else:\n        edges = list(bins)\n    out = []\n    for v in vals:\n        if _is_na(v) or not _is_num(v):\n            out.append(None)\n            continue\n        lab = None\n        for i in range(len(edges) - 1):\n            a = edges[i]\n            b = edges[i + 1]\n            if right:\n                inside = (v > a and v <= b) or (\n                    include_lowest and i == 0 and v == a)\n            else:\n                inside = (v >= a and v < b) or (\n                    i == len(edges) - 2 and v == b and include_lowest)\n            if inside:\n                if labels is None or labels is False:\n                    if right:\n                        lab = \"(\" + _fmt(a) + \", \" + _fmt(b) + \"]\"\n                    else:\n                        lab = \"[\" + _fmt(a) + \", \" + _fmt(b) + \")\"\n                else:\n                    lab = labels[i]\n                break\n        out.append(lab)\n    if isinstance(x, Series):\n        return x._like(out)\n    return Series(out)\n\n\ndef qcut(x, q, labels=None):\n    \"\"\"pd.qcut -- equal-frequency bins based on quantiles.\"\"\"\n    vals = x._data if isinstance(x, Series) else list(x)\n    nums = sorted([v for v in vals if not _is_na(v) and _is_num(v)])\n    edges = [_quantile_of(nums, i / float(q)) for i in range(q + 1)]\n    edges[0] = edges[0] - abs(edges[0]) / 1000.0 - 1e-9\n    return cut(x, edges, labels, True, False)\n\n\ndef melt(frame, id_vars=None, value_vars=None, var_name=None,\n         value_name=\"value\"):\n    return frame.melt(id_vars, value_vars, var_name, value_name)\n\n\ndef crosstab(index, columns, values=None, aggfunc=None, margins=False):\n    \"\"\"pd.crosstab(a, b) -- frequency table of two Series.\"\"\"\n    rows = index._data if isinstance(index, Series) else list(index)\n    cols = columns._data if isinstance(columns, Series) else list(columns)\n    vals = None\n    if values is not None:\n        vals = values._data if isinstance(values, Series) else list(values)\n    row_keys = []\n    col_keys = []\n    for v in rows:\n        if v not in row_keys:\n            row_keys.append(v)\n    for v in cols:\n        if v not in col_keys:\n            col_keys.append(v)\n    row_keys = [row_keys[i] for i in _order(row_keys, True)]\n    col_keys = [col_keys[i] for i in _order(col_keys, True)]\n    buckets = {}\n    for i in range(len(rows)):\n        k = (rows[i], cols[i])\n        if k not in buckets:\n            buckets[k] = []\n        buckets[k].append(vals[i] if vals is not None else 1)\n    new_data = {}\n    for c in col_keys:\n        column = []\n        for r in row_keys:\n            bucket = buckets.get((r, c), [])\n            if aggfunc is None or values is None:\n                column.append(len(bucket))\n            elif not bucket:\n                column.append(None)\n            else:\n                column.append(_apply_agg(bucket, aggfunc, c))\n        new_data[c] = column\n    out_cols = list(col_keys)\n    if margins:\n        new_data[\"All\"] = [sum([new_data[c][i] for c in col_keys])\n                           for i in range(len(row_keys))]\n        out_cols.append(\"All\")\n    name = index.name if isinstance(index, Series) else None\n    df = DataFrame({})._new(new_data, out_cols, row_keys, name, True)\n    df._index_names = [name] if name is not None else None\n    if margins:\n        totals = {}\n        for c in out_cols:\n            totals[c] = sum(new_data[c])\n        for c in out_cols:\n            df._data[c].append(totals[c])\n        df._index.append(\"All\")\n        df._nrows += 1\n    return df\n\n\ndef array(v, dtype=None):\n    \"\"\"np.array stand-in -- a plain list is close enough here.\"\"\"\n    return list(v)\n\n\ndef to_numeric(s, errors=\"raise\"):\n    if isinstance(s, Series):\n        return s.astype(\"float\")\n    return float(s)\n\n\n# Missing-data sentinels.  This mini-pandas represents NaN as None, so\n# np.nan / pd.NA / pd.NaT are all None.\nnan = None\nNaN = None\nNAN = None\nNA = None\nNaT = None\ninf = float('inf')\nInf = float('inf')\npi = 3.141592653589793\ne = 2.718281828459045\n\n\nclass _PD:\n    \"\"\"Stand-in for `import pandas as pd` when the prelude is inlined rather\n    than imported as a module.  Kept for backward compatibility -- it simply\n    forwards to the module-level names above.\"\"\"\n    DataFrame = DataFrame\n    Series = Series\n    MultiIndex = MultiIndex\n    Timestamp = Timestamp\n\n    def concat(self, objs, ignore_index=True, axis=0):\n        return concat(objs, ignore_index, axis)\n\n    def merge(self, left, right, on=None, how=\"inner\", suffixes=(\"_x\", \"_y\")):\n        return merge(left, right, on, how, suffixes)\n\n    def isna(self, v):\n        return isna(v)\n\n    def isnull(self, v):\n        return isna(v)\n\n    def notna(self, v):\n        return notna(v)\n\n    def notnull(self, v):\n        return notna(v)\n\n    def unique(self, v):\n        return unique(v)\n\n    def cut(self, x, bins, labels=None, right=True, include_lowest=False):\n        return cut(x, bins, labels, right, include_lowest)\n\n    def qcut(self, x, q, labels=None):\n        return qcut(x, q, labels)\n\n    def melt(self, frame, id_vars=None, value_vars=None, var_name=None,\n             value_name=\"value\"):\n        return melt(frame, id_vars, value_vars, var_name, value_name)\n\n    def crosstab(self, index, columns, values=None, aggfunc=None,\n                 margins=False):\n        return crosstab(index, columns, values, aggfunc, margins)\n\n    def date_range(self, start=None, end=None, periods=None, freq=\"D\"):\n        return date_range(start, end, periods, freq)\n\n    def to_datetime(self, obj, errors=\"raise\"):\n        return to_datetime(obj, errors)\n\n    def to_numeric(self, s, errors=\"raise\"):\n        return to_numeric(s, errors)\n\n\npd = _PD()\npd.NA = None\npd.nan = None\npd.NaT = None\n\n\nclass _NP:\n    \"\"\"Tiny numpy stand-in (np.nan and a couple of reducers).\"\"\"\n    nan = None\n    NaN = None\n    NAN = None\n    inf = float('inf')\n    pi = 3.141592653589793\n    e = 2.718281828459045\n\n    def array(self, v, dtype=None):\n        return list(v)\n\n    def mean(self, v):\n        return Series(v).mean()\n\n    def sum(self, v):\n        return Series(v).sum()\n\n    def median(self, v):\n        return Series(v).median()\n\n    def std(self, v):\n        return Series(v).std()\n\n\nnp = _NP()\n\n\n# =============================================================\n# DATASETS - Israeli context for learning\n# =============================================================\n\n_DATASETS = {\n    \"cities-weather\": {\n        \"name\": \"מזג אוויר בערים בישראל\",\n        \"desc\": \"טמפרטורות ולחות\",\n        \"data\": {\n            \"city\": [\"תל אביב\", \"ירושלים\", \"חיפה\", \"באר שבע\", \"אילת\", \"צפת\"],\n            \"temp\": [24, 19, 23, 27, 31, 17],\n            \"humidity\": [68, 50, 72, 40, 55, 45],\n            \"rain_mm\": [0, 2, 0, 0, 0, 5]\n        }\n    },\n    \"real-estate\": {\n        \"name\": \"מחירי דירות בתל אביב\",\n        \"desc\": \"8 דירות\",\n        \"data\": {\n            \"neighborhood\": [\"פלורנטין\", \"רוטשילד\", \"נווה צדק\", \"יפו\", \"רמת אביב\", \"בבלי\", \"קרית שלום\", \"הצפון הישן\"],\n            \"rooms\": [3, 4, 4, 3, 5, 4, 3, 4],\n            \"sqm\": [75, 95, 110, 70, 130, 100, 65, 90],\n            \"price_m\": [3.2, 5.1, 6.8, 2.9, 4.5, 4.1, 1.9, 4.7]\n        }\n    },\n    \"football\": {\n        \"name\": \"ליגת העל - 5 קבוצות\",\n        \"desc\": \"סטטיסטיקה\",\n        \"data\": {\n            \"team\": [\"מכבי תל אביב\", \"הפועל ב-ש\", \"מכבי חיפה\", \"הפועל ת-א\", \"ביתר\"],\n            \"points\": [55, 52, 48, 42, 38],\n            \"wins\": [17, 16, 14, 12, 10],\n            \"draws\": [4, 4, 6, 6, 8],\n            \"losses\": [3, 4, 4, 6, 6],\n            \"goals_for\": [54, 49, 41, 38, 32],\n            \"goals_against\": [21, 22, 25, 30, 33]\n        }\n    },\n    \"students\": {\n        \"name\": \"ציוני סטודנטים\",\n        \"desc\": \"ציונים ב-3 מקצועות\",\n        \"data\": {\n            \"name\": [\"גל\", \"תומר\", \"יעל\", \"נועה\", \"אביב\", \"מאיה\", \"דניאל\", \"שירה\", \"איתי\", \"רוני\"],\n 40.0, 55.0, 100.0, 75.0],\n            \"tenure_months\": [12, 60, 24, 84, 6, 36, 18, 72, 8, 48, 30, 96, 14, 42, 22],\n            \"churn\": [0, 1, 0, 1, 1, 0, 0, 1, 1, 1, 0, 0, 1, 0, 0],\n            \"plan\": [\"basic\",\"premium\",\"standard\",\"premium\",\"basic\",\"premium\",\"standard\",\"premium\",\"basic\",\"premium\",\"standard\",\"premium\",\"basic\",\"premium\",\"standard\"]\n        }\n    },\n    \"salaries\": {\n        \"name\": \"משכורות לפי מחלקה\",\n        \"desc\": \"12 עובדים\",\n        \"data\": {\n            \"name\": [\"אבי\",\"בני\",\"גלית\",\"דנה\",\"הילה\",\"ויקטור\",\"זוהר\",\"חני\",\"טל\",\"יוסי\",\"כרמל\",\"ליאת\"],\n            \"department\": [\"Sales\",\"R&D\",\"Sales\",\"Marketing\",\"R&D\",\"Sales\",\"Marketing\",\"R&D\",\"Sales\",\"R&D\",\"Marketing\",\"Sales\"],\n            \"salary\": [15000, 22000, 18000, 13000, 25000, 16000, 14000, 28000, 17000, 23000, 12000, 19000],\n            \"years\": [2, 5, 3, 1, 7, 4, 2, 8, 3, 6, 1, 4]\n        }\n    }\n}\n\n\nclass _Datasets:\n    \"\"\"Pre-loaded datasets. Usage: df = data.load('cities-weather')\"\"\"\n\n    def list(self):\n        \"\"\"List all available datasets.\"\"\"\n        for key in _DATASETS:\n            info = _DATASETS[key]\n            print(\"  \" + key + \": \" + info[\"name\"] + \" - \" + info[\"desc\"])\n\n    def load(self, name):\n        \"\"\"Load a dataset as a DataFrame.\"\"\"\n        if name not in _DATASETS:\n            keys = list(_DATASETS.keys())\n            raise ValueError(\"Dataset not found: \" + name)\n        return DataFrame(_DATASETS[name][\"data\"])\n\n    def info(self, name):\n        \"\"\"Show info about a dataset.\"\"\"\n        if name not in _DATASETS:\n            print(\"Dataset not found: \" + name)\n            return\n        info = _DATASETS[name]\n        print(\"DATASET: \" + info[\"name\"])\n        print(\"  \" + info[\"desc\"])\n        df = DataFrame(info[\"data\"])\n        print(\"  shape: \" + str(df.shape[0]) + \" rows x \" + str(df.shape[1]) + \" cols\")\n\n\ndata = _Datasets()\n";
