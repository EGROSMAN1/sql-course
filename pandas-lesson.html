  const btn = document.getElementById('sol-btn-' + i);
  if (!panel) return;
  
  const isOpen = panel.classList.contains('show');
  if (isOpen) {
    panel.classList.remove('show');
    btn.textContent = 'הצג פתרון';
    btn.classList.remove('shown');
  } else {
    panel.classList.add('show');
    btn.textContent = 'הסתר פתרון';
    btn.classList.add('shown');
    setTimeout(() => panel.scrollIntoView({behavior:'smooth',block:'nearest'}), 100);
  }
}


// ===== App logic =====
let currentTopic = null;
let editors = {};
let preludeLoaded = false;
const STORAGE_PREFIX = "pandas_progress_v1_";

function getProgress() {
  if (!currentTopic) return {};
  try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + currentTopic.id) || '{}'); }
  catch { return {}; }
}
function saveProgress(p) {
  if (!currentTopic) return;
  try { localStorage.setItem(STORAGE_PREFIX + currentTopic.id, JSON.stringify(p)); } catch {}
}
function markDone(exIdx) {
  const p = getProgress();
  if (!p.exercisesCompleted) p.exercisesCompleted = [];
  if (!p.exercisesCompleted.includes(exIdx)) {
    p.exercisesCompleted.push(exIdx);
    saveProgress(p);
  }
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Render DataFrame markers as nice HTML tables
function renderOutput(text) {
  if (!text) return '';
  const dfRegex = /__DATAFRAME__\|([^\n]+)\n((?:__DATAROW__\|[^\n]*\n?)+)__DATAFRAME_END__/g;
  let result = '';
  let lastEnd = 0;
  let m;
  while ((m = dfRegex.exec(text)) !== null) {
    if (m.index > lastEnd) result += escapeHtml(text.substring(lastEnd, m.index));
    const headers = m[1].split('|');
    const rows = m[2].split('\n').filter(r => r.startsWith('__DATAROW__'));
    let tableHtml = '<table class="df-table"><thead><tr>' + 
      headers.map(h => '<th>' + escapeHtml(h) + '</th>').join('') + 
      '</tr></thead><tbody>';
    rows.forEach(r => {
      const cells = r.substring('__DATAROW__|'.length).split('|');
      tableHtml += '<tr>' + cells.map(c => '<td>' + escapeHtml(c) + '</td>').join('') + '</tr>';
    });
    tableHtml += '</tbody></table>';
    result += tableHtml;
    lastEnd = m.index + m[0].length;
  }
  if (lastEnd < text.length) result += escapeHtml(text.substring(lastEnd));
  return result;
}

function loadTopic(topicId) {
  currentTopic = ALL_PD_TOPICS_FLAT.find(t => t.id === topicId);
  
  // Fallback: if topic ID is missing, load first topic with friendly note
  if (!currentTopic) {
    currentTopic = ALL_PD_TOPICS_FLAT[0];
    document.getElementById('theoryBox').innerHTML = 
      '<div style="background:var(--tc28);padding:.7rem;border-radius:8px;color:var(--tc29);font-size:13px">' +
      '⚠️ לא נבחר נושא ספציפי. מציג את הנושא הראשון כברירת מחדל. <a href="pandas-course.html">חזור למפת הקורס</a>.' +
      '</div><hr style="border:none;border-top:1px solid var(--tc4);margin:.7rem 0">' +
      currentTopic.theory;
  } else {
    document.getElementById('theoryBox').innerHTML = currentTopic.theory;
  }
  
  // Save last visited
  try { localStorage.setItem('pandas_last_topic', currentTopic.id); } catch {}
  
  // Update headers
  document.getElementById('topicIcon').textContent = currentTopic.icon;
  document.getElementById('topicTitle').textContent = currentTopic.title;
  document.getElementById('moduleLabel').textContent = 'M' + currentTopic.module + ' · ' + currentTopic.moduleIcon + ' ' + currentTopic.moduleTitle;
  document.getElementById('crumbTitle').textContent = currentTopic.title;
  document.title = currentTopic.title + ' · קורס פנדס';
  
  // Setup prev/next
  const idx = ALL_PD_TOPICS_FLAT.findIndex(t => t.id === currentTopic.id);
  const prev = ALL_PD_TOPICS_FLAT[idx - 1];
  const next = ALL_PD_TOPICS_FLAT[idx + 1];
  document.getElementById('prevBtn').href = prev ? 'pandas-lesson.html?topic=' + prev.id : '#';
  document.getElementById('nextBtn').href = next ? 'pandas-lesson.html?topic=' + next.id : '#';
  if (!prev) document.getElementById('prevBtn').classList.add('disabled');
  if (!next) document.getElementById('nextBtn').classList.add('disabled');
  
  renderExercises();
}

function renderExercises() {
  const nav = document.getElementById('exNav');
  const container = document.getElementById('exContainer');
  const prog = getProgress();
  const done = prog.exercisesCompleted || [];
  
  nav.innerHTML = currentTopic.exercises.map((_, i) =>
    `<button class="ex-nav-btn ${done.includes(i)?'done':''}" data-idx="${i}" onclick="jumpEx(${i})">${i+1}</button>`
  ).join('');
  
  container.innerHTML = currentTopic.exercises.map((ex, i) => `
    <div class="exercise ${done.includes(i)?'completed':''}" id="ex-${i}">
      <div class="ex-head">
        <div class="ex-num">${i+1}</div>
        <div class="ex-q">${ex.q}</div>
      </div>
      <div class="editor-wrap">
        <div class="editor-bar">
          <span class="lang">Python · mini-pandas</span>
          <span class="filler"></span>
          <button onclick="resetEditor(${i})">איפוס</button>
        </div>
        <textarea id="code-${i}" spellcheck="false">${escapeHtml(ex.starter || '')}</textarea>
      </div>
      <div class="btn-row">
        <button class="btn btn-run" onclick="checkAnswer(${i})">▶ הרץ קוד</button>
        <button class="btn btn-solution" id="sol-btn-${i}" onclick="toggleSolution(${i})">הצג פתרון</button>
      </div>
      <div class="output-label" id="out-lbl-${i}" style="display:none">פלט:</div>
      <div class="output-box" id="out-${i}"></div>
      <div class="verdict" id="verdict-${i}"></div>
      <div class="solution-panel" id="sol-panel-${i}">
        <div class="solution-header">
          <span class="ico">💡</span>
          <span class="label">פתרון רשמי</span>
          <button class="copy-btn" onclick="copySolutionCode(${i}, this)">📋 העתק</button>
        </div>
        <div class="solution-code" id="sol-code-${i}">${escapeHtml(ex.solution)}</div>
        <div class="solution-note">השווה עם הקוד שלך — אבל אל תפסיק לחשוב!</div>
      </div>
    </div>
  `).join('');
  
  // Init CodeMirror
  currentTopic.exercises.forEach((ex, i) => {
    const ta = document.getElementById('code-' + i);
    if (ta && typeof CodeMirror !== 'undefined') {
      const cm = CodeMirror.fromTextArea(ta, {
        mode: 'python', theme: 'dracula', lineNumbers: true,
        indentUnit: 4, autoCloseBrackets: true, direction: 'ltr',
        extraKeys: {
          'Tab': (c) => c.replaceSelection('    ', 'end'),
          'Ctrl-Enter': () => checkAnswer(i),
          'Cmd-Enter': () => checkAnswer(i),
          'Ctrl-Space': 'autocomplete'
        }
      });
      editors[i] = cm;
    }
  });
}

function getCode(i) {
  return editors[i] ? editors[i].getValue() : (document.getElementById('code-'+i).value || '');
}
function setCode(i, val) {
  if (editors[i]) editors[i].setValue(val);
  else document.getElementById('code-'+i).value = val;
}

function resetEditor(i) {
  const ex = currentTopic.exercises[i];
  setCode(i, ex.starter || '');
  document.getElementById('out-'+i).className = 'output-box';
  document.getElementById('out-lbl-'+i).style.display = 'none';
  document.getElementById('verdict-'+i).className = 'verdict';
}

function showSolution(i) {
  const panel = document.getElementById('sol-panel-' + i);
  const btn = document.getElementById('sol-btn-' + i);
  if (!panel) return;
  const isOpen = panel.classList.contains('show');
  if (isOpen) {
    panel.classList.remove('show');
    btn.textContent = 'הצג פתרון';
    btn.classList.remove('shown');
  } else {
    panel.classList.add('show');
    btn.textContent = 'הסתר פתרון';
    btn.classList.add('shown');
    setTimeout(() => panel.scrollIntoView({behavior:'smooth',block:'nearest'}), 100);
  }
}

function copySolutionCode(i, btnEl) {
  const codeEl = document.getElementById('sol-code-' + i);
  if (!codeEl) return;
  const text = codeEl.textContent;
  const doCopy = () => {
    btnEl.textContent = '✓ הועתק';
    btnEl.classList.add('copied');
    setTimeout(() => {
      btnEl.textContent = '📋 העתק';
      btnEl.classList.remove('copied');
    }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(doCopy, () => fallbackCopy(text, doCopy));
  } else { fallbackCopy(text, doCopy); }
}

function fallbackCopy(text, callback) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-100px;left:0;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); callback(); } catch(e) {}
  document.body.removeChild(ta);
}

function jumpEx(i) {
  const el = document.getElementById('ex-' + i);
  if (!el) return;
  el.scrollIntoView({behavior: 'smooth', block: 'start'});
  el.style.boxShadow = '0 0 0 3px var(--cyan)';
  setTimeout(() => { el.style.boxShadow = ''; }, 1200);
}

async function checkAnswer(i) {
  const ex = currentTopic.exercises[i];
  const code = getCode(i);
  
  const outBox = document.getElementById('out-' + i);
  const outLbl = document.getElementById('out-lbl-' + i);
  const verdict = document.getElementById('verdict-' + i);
  outBox.className = 'output-box show';
  outLbl.style.display = 'block';
  outBox.textContent = 'מריץ...';
  verdict.className = 'verdict';
  
  if (typeof Sk === 'undefined') {
    outBox.textContent = 'Skulpt לא נטען. רענן את הדף.';
    outBox.classList.add('err');
    return;
  }
  
  let output = '';
  let runError = null;
  
  try {
    await new Promise((resolve) => {
      Sk.configure({
        output: (t) => { output += t; },
        read: (f) => {
          if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][f] === undefined) {
            throw "File not found: '" + f + "'";
          }
          return Sk.builtinFiles["files"][f];
        },
        __future__: Sk.python3, execLimit: 8000, retainglobals: true
      });
      
      // Load prelude on first run
      const codeToRun = preludeLoaded ? code : (PYTHON_PRELUDE + '\n\n' + code);
      
      Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, codeToRun, true))
        .then(() => {
          if (!preludeLoaded) {
            preludeLoaded = true;
            // Discard prelude output (none should be produced anyway)
            const preludeLineCount = (PYTHON_PRELUDE.match(/\n/g) || []).length;
            // Actually prelude produces no output, so just trust 'output' variable
          }
          resolve();
        })
        .catch((e) => { runError = e.toString(); resolve(); });
    });
  } catch (e) { runError = String(e); }
  
  if (runError) {
    outBox.className = 'output-box err show';
    outBox.innerHTML = (output ? escapeHtml(output) + '\n\n' : '') + 'שגיאה: ' + escapeHtml(runError);
    verdict.className = 'verdict failure show';
    verdict.textContent = 'יש שגיאה בקוד. תקרא את ההודעה ותתקן.';
    return;
  }
  
  // Render output with DataFrame tables
  outBox.innerHTML = renderOutput(output || '(אין פלט)');
  outBox.className = 'output-box show';
  
  // Run check
  let passed = false;
  try {
    if (typeof ex.check === 'function') {
      passed = ex.check(output, code);
    }
  } catch (e) { passed = false; }
  
  if (passed) {
    verdict.className = 'verdict success show';
    verdict.textContent = '✓ מצוין! תשובה נכונה.';
    if (ex.explain) {
      const _w = document.createElement('div');
      _w.className = 'why-box';
      _w.innerHTML = '<div class="why-title">למה זה עובד</div>' + ex.explain;
      verdict.appendChild(_w);
    }
    markDone(i);

    try {
      const btn = document.getElementById('sol-btn-' + i);
      const usedSolution = btn && btn.classList.contains('shown');
      if (window.gam && window.gam.markExercisePassed) {
        window.gam.markExercisePassed('pandas-lesson', i, usedSolution);
      }
    } catch(e) { console.warn('gam err:', e); }

    document.getElementById('ex-' + i).classList.add('completed');
    document.querySelector('.ex-nav-btn[data-idx="' + i + '"]').classList.add('done');
  } else {
    verdict.className = 'verdict failure show';
    verdict.textContent = 'הקוד רץ אבל הפלט שונה ממה שמצופה. נסה שוב או לחץ "הצג פתרון".';
  }
}

// Init
function init() {
  const params = new URLSearchParams(window.location.search);
  const topicId = params.get('topic');
  loadTopic(topicId);
}

if (typeof Sk !== 'undefined' && typeof CodeMirror !== 'undefined') {
  init();
} else {
  window.addEventListener('load', () => setTimeout(init, 100));
}
</script>

<script>
/* GAMIFICATION ENGINE - pandas-lesson */
/* ============================================================
   GAMIFICATION ENGINE — XP + Streaks + Badges
   Works in both Hebrew (RTL) and English (LTR) pages
   Pure JS + localStorage, no backend needed
   ============================================================ */

(function() {
  'use strict';
  
  // ---- Detect language ----
  const IS_RTL = document.documentElement.dir === 'rtl' || document.documentElement.lang === 'he';
  const T = IS_RTL ? {
    xp: 'נקודות',
    streak: 'רצף ימים',
    streakDays: (n) => n === 1 ? 'יום' : 'ימים',
    level: 'רמה',
    newBadge: 'מדליה חדשה!',
    levelUp: 'עלית רמה!',
    today: 'היום',
    yesterday: 'אתמול',
    daysAgo: (n) => `לפני ${n} ימים`,
    streakStart: 'התחלת רצף — חזור מחר!',
    streakBroken: 'הרצף נשבר 💔',
    streakAlive: (n) => `🔥 ${n} ימים ברצף!`,
    streakFirst: '🎯 יום ראשון בקורס!',
    achievements: 'הישגים',
    progressTitle: 'ההתקדמות שלך',
    close: 'סגור',
    keepGoing: 'תמשיך ככה!',
    perfectDay: 'יום מושלם!',
    earned: 'הרווחת',
    nextLevel: 'לרמה הבאה',
    weeklyGoal: 'יעד שבועי',
    daysLeft: (n) => `עוד ${n} ימים`,
    streakInfo: 'פתח את האתר היום כדי לשמור על הרצף!',
    xpToNext: (n) => `עוד ${n} XP לרמה הבאה`,
  } : {
    xp: 'XP',
    streak: 'Day Streak',
    streakDays: (n) => n === 1 ? 'day' : 'days',
    level: 'Level',
    newBadge: 'New Badge!',
    levelUp: 'Level Up!',
    today: 'Today',
    yesterday: 'Yesterday',
    daysAgo: (n) => `${n} days ago`,
    streakStart: 'Streak started — come back tomorrow!',
    streakBroken: 'Streak broken 💔',
    streakAlive: (n) => `🔥 ${n} day streak!`,
    streakFirst: '🎯 First day of the course!',
    achievements: 'Achievements',
    progressTitle: 'Your Progress',
    close: 'Close',
    keepGoing: 'Keep going!',
    perfectDay: 'Perfect day!',
    earned: 'Earned',
    nextLevel: 'to next level',
    weeklyGoal: 'Weekly Goal',
    daysLeft: (n) => `${n} days left`,
    streakInfo: 'Open the site today to keep your streak alive!',
    xpToNext: (n) => `${n} XP to next level`,
  };
  
  // ---- XP rewards ----
  const XP_REWARDS = {
    EXERCISE_PASS: 10,
    EXERCISE_PASS_NO_HINT: 15,    // bonus if didn't see solution
    QUIZ_PASS: 20,
    MODULE_COMPLETE: 50,
    FIRST_RUN_OF_DAY: 5,           // bonus for opening site each day
    STREAK_BONUS: (days) => Math.min(days * 2, 30),  // bonus per streak day, capped
  };
  
  // ---- Storage keys ----
  const STORAGE = {
    XP: 'gam_xp',
    STREAK: 'gam_streak',
    LAST_DATE: 'gam_lastDate',
    LONGEST_STREAK: 'gam_longest',
    BADGES: 'gam_badges',
    PASSED_EXERCISES: 'gam_passedEx',
    USAGE_DAYS: 'gam_days',
    DAILY_XP: 'gam_dailyXP',
  };
  
  // ---- Storage helpers ----
  function getXP() { return parseInt(localStorage.getItem(STORAGE.XP) || '0', 10); }
  function setXP(n) { localStorage.setItem(STORAGE.XP, n); updateUI(); }
  function addXP(amount, reason) {
    const cur = getXP();
    const newXP = cur + amount;
    setXP(newXP);
    
    // Track daily XP
    const today = todayStr();
    const dailyData = JSON.parse(localStorage.getItem(STORAGE.DAILY_XP) || '{}');
    dailyData[today] = (dailyData[today] || 0) + amount;
    localStorage.setItem(STORAGE.DAILY_XP, JSON.stringify(dailyData));
    
    showXPGain(amount, reason);
    checkLevelUp(cur, newXP);
    checkBadges();
  }
  
  function getStreak() { return parseInt(localStorage.getItem(STORAGE.STREAK) || '0', 10); }
  function setStreak(n) {
    localStorage.setItem(STORAGE.STREAK, n);
    const longest = parseInt(localStorage.getItem(STORAGE.LONGEST_STREAK) || '0', 10);
    if (n > longest) localStorage.setItem(STORAGE.LONGEST_STREAK, n);
    updateUI();
  }
  
  function getBadges() {
    try { return JSON.parse(localStorage.getItem(STORAGE.BADGES) || '[]'); }
    catch (e) { return []; }
  }
  function addBadge(id) {
    const badges = getBadges();
    if (!badges.includes(id)) {
      badges.push(id);
      localStorage.setItem(STORAGE.BADGES, JSON.stringify(badges));
      const def = BADGE_DEFS.find(b => b.id === id);
      if (def) showBadgeUnlock(def);
      return true;
    }
    return false;
  }
  
  function getPassedExercises() {
    try { return JSON.parse(localStorage.getItem(STORAGE.PASSED_EXERCISES) || '{}'); }
    catch (e) { return {}; }
  }
  function markExercisePassed(courseId, exId, usedSolution) {
    const passed = getPassedExercises();
    if (!passed[courseId]) passed[courseId] = {};
    if (!passed[courseId][exId]) {
      passed[courseId][exId] = { date: todayStr(), used: !!usedSolution };
      localStorage.setItem(STORAGE.PASSED_EXERCISES, JSON.stringify(passed));
      
      const xp = usedSolution ? XP_REWARDS.EXERCISE_PASS : XP_REWARDS.EXERCISE_PASS_NO_HINT;
      addXP(xp, IS_RTL ? 'תרגיל הושלם!' : 'Exercise complete!');
      return true;
    }
    return false;
  }
  
  // ---- Date helpers ----
  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function daysBetween(d1Str, d2Str) {
    const d1 = new Date(d1Str);
    const d2 = new Date(d2Str);
    return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
  }
  
  // ---- Streak logic ----
  function updateStreakOnLoad() {
    const lastDate = localStorage.getItem(STORAGE.LAST_DATE);
    const today = todayStr();
    if (!lastDate) {
      // First visit
      localStorage.setItem(STORAGE.LAST_DATE, today);
      setStreak(1);
      addBadge('first_day');
      showToast(T.streakFirst, '🎯');
      return;
    }
    if (lastDate === today) return;  // Already counted today
    
    const diff = daysBetween(lastDate, today);
    if (diff === 1) {
      // Continued streak
      const newStreak = getStreak() + 1;
      setStreak(newStreak);
      localStorage.setItem(STORAGE.LAST_DATE, today);
      addXP(XP_REWARDS.FIRST_RUN_OF_DAY + XP_REWARDS.STREAK_BONUS(newStreak), T.streakAlive(newStreak));
    } else if (diff > 1) {
      // Streak broken
      const oldStreak = getStreak();
      if (oldStreak > 1) {
        showToast(T.streakBroken, '💔');
      }
      setStreak(1);
      localStorage.setItem(STORAGE.LAST_DATE, today);
      addXP(XP_REWARDS.FIRST_RUN_OF_DAY, IS_RTL ? 'התחלת רצף חדש' : 'New streak started');
    }
    
    // Track usage day
    const days = JSON.parse(localStorage.getItem(STORAGE.USAGE_DAYS) || '[]');
    if (!days.includes(today)) {
      days.push(today);
      localStorage.setItem(STORAGE.USAGE_DAYS, JSON.stringify(days));
    }
  }
  
  // ---- Level system ----
  // XP needed for each level: 0, 50, 150, 300, 500, 800, 1200, 1700, 2300, 3000, 4000, 5500, 7500, ...
  function levelForXP(xp) {
    const thresholds = [0, 50, 150, 300, 500, 800, 1200, 1700, 2300, 3000, 4000, 5500, 7500, 10000];
    for (let i = thresholds.length - 1; i >= 0; i--) {
      if (xp >= thresholds[i]) return i + 1;
    }
    return 1;
  }
  function xpForLevel(level) {
    const thresholds = [0, 50, 150, 300, 500, 800, 1200, 1700, 2300, 3000, 4000, 5500, 7500, 10000];
    return thresholds[level - 1] || (10000 + (level - 14) * 2500);
  }
  function checkLevelUp(oldXP, newXP) {
    const oldLvl = levelForXP(oldXP);
    const newLvl = levelForXP(newXP);
    if (newLvl > oldLvl) {
      showLevelUp(newLvl);
      // Badge for reaching levels
      if (newLvl === 5) addBadge('level_5');
      if (newLvl === 10) addBadge('level_10');
    }
  }
  
  // ---- Badge definitions ----
  const BADGE_DEFS = [
    { id: 'first_day',  icon: '🎯', name_he: 'יום ראשון',    name_en: 'First Day',    desc_he: 'התחלת ללמוד!',                   desc_en: 'Started learning!' },
    { id: 'first_ex',   icon: '🐣', name_he: 'תרגיל ראשון',  name_en: 'First Exercise',desc_he: 'פתרת תרגיל ראשון',              desc_en: 'Solved your first exercise' },
    { id: 'streak_3',   icon: '🔥', name_he: '3 ימים ברצף', name_en: '3-Day Streak', desc_he: 'התמדה!',                          desc_en: 'Consistency!' },
    { id: 'streak_7',   icon: '⚡', name_he: 'שבוע ברצף',   name_en: '7-Day Streak', desc_he: 'אלוף של שבוע',                    desc_en: 'A week champion' },
    { id: 'streak_30',  icon: '🏆', name_he: 'חודש ברצף',   name_en: '30-Day Streak',desc_he: 'אגדה',                            desc_en: 'Legend' },
    { id: 'ex_10',      icon: '⭐', name_he: '10 תרגילים',   name_en: '10 Exercises', desc_he: '10 תרגילים נפתרו',                desc_en: '10 exercises solved' },
    { id: 'ex_50',      icon: '🌟', name_he: '50 תרגילים',   name_en: '50 Exercises', desc_he: '50 תרגילים נפתרו',                desc_en: '50 exercises solved' },
    { id: 'ex_100',     icon: '💯', name_he: '100 תרגילים',  name_en: '100 Exercises',desc_he: '100 תרגילים — מקצוען!',           desc_en: '100 exercises — pro!' },
    { id: 'ex_200',     icon: '👑', name_he: '200 תרגילים',  name_en: '200 Exercises',desc_he: 'אלוף האלופים',                    desc_en: 'Champion of champions' },
    { id: 'python_pro', icon: '🐍', name_he: 'Python Pro',  name_en: 'Python Pro',   desc_he: 'סיימת את קורס Python',           desc_en: 'Completed Python course' },
    { id: 'pandas_pro', icon: '🐼', name_he: 'Pandas Pro',  name_en: 'Pandas Pro',   desc_he: 'סיימת את קורס Pandas',           desc_en: 'Completed Pandas course' },
    { id: 'quiz_pro',   icon: '🎓', name_he: 'מומחה חידון',  name_en: 'Quiz Master',  desc_he: 'סיימת 100 שאלות חידון',           desc_en: 'Aced 100 quiz questions' },
    { id: 'level_5',    icon: '🎖️', name_he: 'רמה 5',       name_en: 'Level 5',      desc_he: 'הגעת לרמה 5',                    desc_en: 'Reached Level 5' },
    { id: 'level_10',   icon: '🏅', name_he: 'רמה 10',      name_en: 'Level 10',     desc_he: 'הגעת לרמה 10',                   desc_en: 'Reached Level 10' },
    { id: 'no_hints',   icon: '🧠', name_he: '10 בלי רמזים', name_en: 'No Hints',    desc_he: '10 תרגילים בלי לראות פתרון',     desc_en: '10 exercises without solution' },
  ];
  
  function checkBadges() {
    const passed = getPassedExercises();
    let totalPassed = 0;
    let noHintCount = 0;
    let pythonCount = 0, pandasCount = 0, quizCount = 0;
    
    Object.entries(passed).forEach(([course, exs]) => {
      const count = Object.keys(exs).length;
      totalPassed += count;
      Object.values(exs).forEach(ex => { if (!ex.used) noHintCount++; });
      if (course === 'python-lesson') pythonCount = count;
      if (course === 'pandas-lesson') pandasCount = count;
      if (course === 'quiz-python-100') quizCount = count;
    });
    
    if (totalPassed >= 1)   addBadge('first_ex');
    if (totalPassed >= 10)  addBadge('ex_10');
    if (totalPassed >= 50)  addBadge('ex_50');
    if (totalPassed >= 100) addBadge('ex_100');
    if (totalPassed >= 200) addBadge('ex_200');
    if (noHintCount >= 10)  addBadge('no_hints');
    if (pythonCount >= 170) addBadge('python_pro');
    if (pandasCount >= 150) addBadge('pandas_pro');
    if (quizCount >= 100)   addBadge('quiz_pro');
    
    const streak = getStreak();
    if (streak >= 3)  addBadge('streak_3');
    if (streak >= 7)  addBadge('streak_7');
    if (streak >= 30) addBadge('streak_30');
  }
  
  // ---- UI: HUD (top corner) ----
  function buildHUD() {
    if (document.getElementById('gam-hud')) return;
    
    const hud = document.createElement('div');
    hud.id = 'gam-hud';
    hud.innerHTML = `
      <button id="gam-hud-btn" aria-label="${T.progressTitle}">
        <span class="gam-streak">🔥 <span id="gam-streak-num">0</span></span>
        <span class="gam-xp">⭐ <span id="gam-xp-num">0</span></span>
      </button>
    `;
    document.body.appendChild(hud);
    document.getElementById('gam-hud-btn').addEventListener('click', openPanel);
  }
  
  function updateUI() {
    const xpEl = document.getElementById('gam-xp-num');
    const stEl = document.getElementById('gam-streak-num');
    if (xpEl) xpEl.textContent = getXP();
    if (stEl) stEl.textContent = getStreak();
  }
  
  // ---- UI: XP gain animation ----
  function showXPGain(amount, reason) {
    const div = document.createElement('div');
    div.className = 'gam-toast gam-toast-xp';
    div.innerHTML = `<span class="gam-toast-icon">⭐</span> <strong>+${amount} ${T.xp}</strong>${reason ? `<br><small>${reason}</small>` : ''}`;
    document.body.appendChild(div);
    setTimeout(() => div.classList.add('show'), 10);
    setTimeout(() => { div.classList.remove('show'); setTimeout(() => div.remove(), 400); }, 2500);
  }
  
  function showToast(message, icon) {
    const div = document.createElement('div');
    div.className = 'gam-toast';
    div.innerHTML = `<span class="gam-toast-icon">${icon || '🎉'}</span> ${message}`;
    document.body.appendChild(div);
    setTimeout(() => div.classList.add('show'), 10);
    setTimeout(() => { div.classList.remove('show'); setTimeout(() => div.remove(), 400); }, 3000);
  }
  
  function showLevelUp(level) {
    const div = document.createElement('div');
    div.className = 'gam-celebration';
    div.innerHTML = `
      <div class="gam-celebration-inner">
        <div class="gam-celebration-icon">🎉</div>
        <h2>${T.levelUp}</h2>
        <div class="gam-level-badge">${T.level} ${level}</div>
        <button class="gam-celebration-close">${T.close}</button>
      </div>
    `;
    document.body.appendChild(div);
    setTimeout(() => div.classList.add('show'), 10);
    // סגירה מרוכזת: כפתור, לחיצה מחוץ לחלון, מקש Escape, וסגירה אוטומטית.
    // בלי אלה החלון נשאר פרוס על כל המסך (z-index 10000) וחוסם כל לחיצה בדף.
    var __closed = false;
    var __auto;
    var __closeCel = function () {
      if (__closed) return;
      __closed = true;
      clearTimeout(__auto);
      document.removeEventListener('keydown', __onKey);
      div.classList.remove('show');
      setTimeout(function () { div.remove(); }, 400);
    };
    var __onKey = function (e) { if (e.key === 'Escape') __closeCel(); };
    __auto = setTimeout(__closeCel, 6000);
    div.querySelector('.gam-celebration-close').addEventListener('click', __closeCel);
    div.addEventListener('click', function (e) { if (e.target === div) __closeCel(); });
    document.addEventListener('keydown', __onKey);
  }
  
  function showBadgeUnlock(badge) {
    const name = IS_RTL ? badge.name_he : badge.name_en;
    const desc = IS_RTL ? badge.desc_he : badge.desc_en;
    const div = document.createElement('div');
    div.className = 'gam-celebration gam-badge-unlock';
    div.innerHTML = `
      <div class="gam-celebration-inner">
        <div class="gam-badge-icon-big">${badge.icon}</div>
        <h3>${T.newBadge}</h3>
        <h2>${name}</h2>
        <p>${desc}</p>
        <button class="gam-celebration-close">${T.close}</button>
      </div>
    `;
    document.body.appendChild(div);
    setTimeout(() => div.classList.add('show'), 10);
    // סגירה מרוכזת: כפתור, לחיצה מחוץ לחלון, מקש Escape, וסגירה אוטומטית.
    // בלי אלה החלון נשאר פרוס על כל המסך (z-index 10000) וחוסם כל לחיצה בדף.
    var __closed = false;
    var __auto;
    var __closeCel = function () {
      if (__closed) return;
      __closed = true;
      clearTimeout(__auto);
      document.removeEventListener('keydown', __onKey);
      div.classList.remove('show');
      setTimeout(function () { div.remove(); }, 400);
    };
    var __onKey = function (e) { if (e.key === 'Escape') __closeCel(); };
    __auto = setTimeout(__closeCel, 6000);
    div.querySelector('.gam-celebration-close').addEventListener('click', __closeCel);
    div.addEventListener('click', function (e) { if (e.target === div) __closeCel(); });
    document.addEventListener('keydown', __onKey);
  }
  
  // ---- UI: Progress Panel ----
  function openPanel() {
    if (document.getElementById('gam-panel')) return;
    
    const xp = getXP();
    const streak = getStreak();
    const longest = parseInt(localStorage.getItem(STORAGE.LONGEST_STREAK) || '0', 10);
    const level = levelForXP(xp);
    const nextLevelXP = xpForLevel(level + 1);
    const currentLevelXP = xpForLevel(level);
    const progressPct = Math.floor(((xp - currentLevelXP) / (nextLevelXP - currentLevelXP)) * 100);
    const xpToNext = nextLevelXP - xp;
    
    const earnedBadges = getBadges();
    const passed = getPassedExercises();
    let totalPassed = 0;
    Object.values(passed).forEach(exs => { totalPassed += Object.keys(exs).length; });
    
    const badgesHTML = BADGE_DEFS.map(b => {
      const earned = earnedBadges.includes(b.id);
      const name = IS_RTL ? b.name_he : b.name_en;
      const desc = IS_RTL ? b.desc_he : b.desc_en;
      return `
        <div class="gam-badge ${earned ? 'earned' : 'locked'}" title="${desc}">
          <div class="gam-badge-icon">${b.icon}</div>
          <div class="gam-badge-name">${name}</div>
        </div>
      `;
    }).join('');
    
    // Last 7 days activity
    const dailyData = JSON.parse(localStorage.getItem(STORAGE.DAILY_XP) || '{}');
    const last7 = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      last7.push({ date: ds, xp: dailyData[ds] || 0, label: d.toLocaleDateString(IS_RTL ? 'he-IL' : 'en-US', { weekday: 'short' }) });
    }
    const maxXP = Math.max(...last7.map(d => d.xp), 1);
    const chartHTML = last7.map(d => `
      <div class="gam-chart-bar">
        <div class="gam-chart-fill" style="height: ${(d.xp / maxXP) * 100}%"></div>
        <div class="gam-chart-label">${d.label}</div>
        <div class="gam-chart-val">${d.xp || ''}</div>
      </div>
    `).join('');
    
    const panel = document.createElement('div');
    panel.id = 'gam-panel';
    panel.innerHTML = `
      <div class="gam-panel-inner" role="dialog">
        <button class="gam-panel-close" aria-label="${T.close}">&times;</button>
        <h2 class="gam-panel-title">${T.progressTitle}</h2>
        
        <div class="gam-stats">
          <div class="gam-stat">
            <div class="gam-stat-icon">⭐</div>
            <div class="gam-stat-val">${xp.toLocaleString()}</div>
            <div class="gam-stat-label">${T.xp}</div>
          </div>
          <div class="gam-stat">
            <div class="gam-stat-icon">🔥</div>
            <div class="gam-stat-val">${streak}</div>
            <div class="gam-stat-label">${T.streak}</div>
          </div>
          <div class="gam-stat">
            <div class="gam-stat-icon">🎖️</div>
            <div class="gam-stat-val">${level}</div>
            <div class="gam-stat-label">${T.level}</div>
          </div>
        </div>
        
        <div class="gam-progress-box">
          <div class="gam-progress-header">
            <span>${T.level} ${level}</span>
            <span>${T.level} ${level + 1}</span>
          </div>
          <div class="gam-progress-bar">
            <div class="gam-progress-fill" style="width: ${Math.max(0, Math.min(100, progressPct))}%"></div>
          </div>
          <div class="gam-progress-text">${T.xpToNext(xpToNext)}</div>
        </div>
        
        <div class="gam-section-title">${IS_RTL ? '📈 פעילות שבועית' : '📈 Weekly Activity'}</div>
        <div class="gam-chart">${chartHTML}</div>
        
        <div class="gam-section-title">${T.achievements} (${earnedBadges.length}/${BADGE_DEFS.length})</div>
        <div class="gam-badges">${badgesHTML}</div>
        
        <div class="gam-footer">
          <div>${IS_RTL ? 'תרגילים נפתרו' : 'Exercises solved'}: <strong>${totalPassed}</strong></div>
          <div>${IS_RTL ? 'הרצף הכי ארוך שלך' : 'Longest streak'}: <strong>${longest}</strong> ${T.streakDays(longest)}</div>
        </div>
      </div>
    `;
    document.body.appendChild(panel);
    setTimeout(() => panel.classList.add('show'), 10);
    
    panel.querySelector('.gam-panel-close').addEventListener('click', closePanel);
    panel.addEventListener('click', e => {
      if (e.target === panel) closePanel();
    });
  }
  function closePanel() {
    const p = document.getElementById('gam-panel');
    if (p) { p.classList.remove('show'); setTimeout(() => p.remove(), 300); }
  }
  
  // ---- Public API ----
  window.gam = {
    addXP: addXP,
    markExercisePassed: markExercisePassed,
    completeModule: function(moduleName) {
      addXP(XP_REWARDS.MODULE_COMPLETE, IS_RTL ? `מודול הושלם: ${moduleName}` : `Module complete: ${moduleName}`);
    },
    open: openPanel,
    getXP: getXP,
    getStreak: getStreak,
    getBadges: getBadges,
  };
  
  // ---- Init ----
  function init() {
    buildHUD();
    updateUI();
    updateStreakOnLoad();
    checkBadges();
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>

<script>
/* AI ERROR HELPER */
/* ============================================================
   AI ERROR HELPER — Smart error explanations
   No external API needed - uses pattern matching + offline rules
   Works in Hebrew (RTL) and English (LTR)
   ============================================================ */

(function() {
  'use strict';
  
  const IS_RTL = document.documentElement.dir === 'rtl' || document.documentElement.lang === 'he';
  
  // ---- Error patterns and explanations ----
  // Each entry: { match: regex, he: explanation, en: explanation, hint: suggestion }
  const ERROR_PATTERNS = [
    {
      match: /NameError.*name '(\w+)' is not defined/i,
      he: (m) => `<b>NameError</b>: המשתנה <code>${m[1]}</code> לא הוגדר. 🤔`,
      en: (m) => `<b>NameError</b>: The variable <code>${m[1]}</code> is not defined. 🤔`,
      hint_he: (m) => [
        `📝 בדוק שלא שכחת להגדיר את המשתנה לפני שאתה משתמש בו.`,
        `🔤 ייתכן שיש typo (שגיאת כתיב) בשם המשתנה — שמות בפייתון רגישים לאותיות גדולות/קטנות.`,
        `💡 דוגמה תקינה: <code>${m[1]} = 10</code> ואז <code>print(${m[1]})</code>`,
      ],
      hint_en: (m) => [
        `📝 Check that you defined the variable before using it.`,
        `🔤 There may be a typo in the name — Python names are case-sensitive.`,
        `💡 Valid example: <code>${m[1]} = 10</code> then <code>print(${m[1]})</code>`,
      ],
    },
    {
      match: /SyntaxError.*expected/i,
      he: () => `<b>SyntaxError</b>: יש שגיאה במבנה הקוד. ✏️`,
      en: () => `<b>SyntaxError</b>: There's a problem in the code structure. ✏️`,
      hint_he: () => [
        `🔍 בדוק שיש סוגריים פתיחה וסגירה לכל הקריאות.`,
        `🔍 בדוק שיש <code>:</code> בסוף שורות של <code>if</code>, <code>for</code>, <code>while</code>, <code>def</code>.`,
        `🔍 בדוק שאין גרשיים פתוחות בלי סגירה — לדוגמה <code>"hello</code> צריך להיות <code>"hello"</code>.`,
      ],
      hint_en: () => [
        `🔍 Check that all parentheses are properly opened and closed.`,
        `🔍 Check for the <code>:</code> at the end of <code>if</code>, <code>for</code>, <code>while</code>, <code>def</code> lines.`,
        `🔍 Check for unclosed quotes — e.g. <code>"hello</code> should be <code>"hello"</code>.`,
      ],
    },
    {
      match: /SyntaxError.*EOL while scanning/i,
      he: () => `<b>SyntaxError</b>: חסרה גרשיים סוגרים במחרוזת. 📝`,
      en: () => `<b>SyntaxError</b>: A string is missing a closing quote. 📝`,
      hint_he: () => [`💡 חפש מחרוזת שפותחת ב-<code>"</code> אבל לא נסגרת באותו תו.`],
      hint_en: () => [`💡 Look for a string that opens with <code>"</code> but isn't closed.`],
    },
    {
      match: /IndentationError|unexpected indent/i,
      he: () => `<b>IndentationError</b>: בעיה בהזחת השורות (רווחים בתחילה). 📐`,
      en: () => `<b>IndentationError</b>: Indentation problem (leading spaces). 📐`,
      hint_he: () => [
        `📏 בפייתון, השורות אחרי <code>if</code>, <code>for</code>, <code>def</code> צריכות להיות מוזחות (4 רווחים).`,
        `📏 ודא שכל השורות באותו בלוק מוזחות באותה כמות.`,
        `📏 אל תערבב רווחים וטאבים.`,
      ],
      hint_en: () => [
        `📏 In Python, lines after <code>if</code>, <code>for</code>, <code>def</code> must be indented (4 spaces).`,
        `📏 Make sure all lines in the same block have the same indentation.`,
        `📏 Don't mix spaces and tabs.`,
      ],
    },
    {
      match: /TypeError.*unsupported operand.*'str'.*'int'|'int'.*'str'/i,
      he: () => `<b>TypeError</b>: אי-אפשר לחבר/לבצע פעולה בין מספר למחרוזת. 🔢`,
      en: () => `<b>TypeError</b>: Cannot operate between a number and a string. 🔢`,
      hint_he: () => [
        `🔄 השתמש ב-<code>str(x)</code> כדי להמיר מספר למחרוזת.`,
        `🔄 השתמש ב-<code>int(x)</code> כדי להמיר מחרוזת למספר.`,
        `💡 דוגמה: <code>"גיל: " + str(25)</code> או <code>int("5") + 3</code>`,
      ],
      hint_en: () => [
        `🔄 Use <code>str(x)</code> to convert a number to a string.`,
        `🔄 Use <code>int(x)</code> to convert a string to a number.`,
        `💡 Example: <code>"Age: " + str(25)</code> or <code>int("5") + 3</code>`,
      ],
    },
    {
      match: /TypeError.*takes \d+.*argument.*but \d+/i,
      he: () => `<b>TypeError</b>: שלחת מספר שגוי של ארגומנטים לפונקציה. 🎯`,
      en: () => `<b>TypeError</b>: Wrong number of arguments passed to function. 🎯`,
      hint_he: () => [
        `🔍 בדוק שהפונקציה מקבלת בדיוק את מספר הארגומנטים הדרושים.`,
        `💡 אם הפונקציה מוגדרת כ-<code>def f(a, b)</code> צריך לקרוא כ-<code>f(1, 2)</code>.`,
      ],
      hint_en: () => [
        `🔍 Check that the function receives exactly the required arguments.`,
        `💡 If defined as <code>def f(a, b)</code> call as <code>f(1, 2)</code>.`,
      ],
    },
    {
      match: /ZeroDivisionError/i,
      he: () => `<b>ZeroDivisionError</b>: אי-אפשר לחלק ב-0. ➗`,
      en: () => `<b>ZeroDivisionError</b>: Cannot divide by 0. ➗`,
      hint_he: () => [
        `🔍 בדוק שהמכנה (המספר שמחלקים בו) אינו 0.`,
        `💡 הוסף תנאי לפני החלוקה: <code>if y != 0: print(x / y)</code>`,
      ],
      hint_en: () => [
        `🔍 Check that the denominator isn't 0.`,
        `💡 Add a condition: <code>if y != 0: print(x / y)</code>`,
      ],
    },
    {
      match: /IndexError.*out of range/i,
      he: () => `<b>IndexError</b>: ניסית לגשת לאיבר שלא קיים ברשימה. 📋`,
      en: () => `<b>IndexError</b>: Tried to access an item that doesn't exist in the list. 📋`,
      hint_he: () => [
        `🔢 רשימה באורך 5 — האינדקסים שלה הם 0, 1, 2, 3, 4 (לא 5!).`,
        `📏 השתמש ב-<code>len(list)</code> כדי לבדוק את אורך הרשימה.`,
        `💡 גישה לאיבר האחרון: <code>list[-1]</code>.`,
      ],
      hint_en: () => [
        `🔢 A list of length 5 has indices 0, 1, 2, 3, 4 (not 5!).`,
        `📏 Use <code>len(list)</code> to check list length.`,
        `💡 Access the last item with <code>list[-1]</code>.`,
      ],
    },
    {
      match: /KeyError.*'?([^']+)'?/i,
      he: (m) => `<b>KeyError</b>: המפתח <code>${m[1] || '?'}</code> לא קיים במילון. 🔑`,
      en: (m) => `<b>KeyError</b>: The key <code>${m[1] || '?'}</code> doesn't exist in the dictionary. 🔑`,
      hint_he: (m) => [
        `🔍 בדוק את כתיב המפתח — שמות במילון רגישים לאותיות גדולות/קטנות.`,

        `🔍 כדי לבדוק אם מפתח קיים: <code>if "${m[1] || 'key'}" in dict:</code>`,
      ],
      hint_en: (m) => [
        `🔍 Check the key spelling — dictionary keys are case-sensitive.`,
        `🛡 Use <code>.get()</code> for safe access: <code>dict.get("${m[1] || 'key'}", "default")</code>`,
        `🔍 Check if key exists with <code>if "${m[1] || 'key'}" in dict:</code>`,
      ],
    },
    {
      match: /ValueError.*invalid literal for int/i,
      he: () => `<b>ValueError</b>: ניסית להמיר מחרוזת שאינה מספר ל-int. 🔢`,
      en: () => `<b>ValueError</b>: Tried converting a non-numeric string to int. 🔢`,
      hint_he: () => [
        `🔍 רק מחרוזות עם ספרות יכולות להפוך למספר: <code>int("123")</code> ✅`,
        `❌ לא: <code>int("abc")</code> או <code>int("3.5")</code>`,

        `🔍 Only digit strings can be converted: <code>int("123")</code> ✅`,

        `💡 For decimals use: <code>float("3.5")</code>`,
      ],
    },
    {
      match: /AttributeError.*'(\w+)'.*object has no attribute '(\w+)'/i,
      he: (m) => `<b>AttributeError</b>: לאובייקט מסוג <code>${m[1]}</code> אין המתודה/תכונה <code>${m[2]}</code>. ⚙️`,
      en: (m) => `<b>AttributeError</b>: Object of type <code>${m[1]}</code> has no attribute <code>${m[2]}</code>. ⚙️`,
      hint_he: (m) => [
        `🔍 בדוק את כתיב שם המתודה — Python רגיש לאותיות גדולות/קטנות.`,
        `📚 בדוק שהמתודה <code>${m[2]}</code> אכן קיימת ב-<code>${m[1]}</code>.`,
        `💡 אם זה <code>list</code>, מתודות נפוצות: <code>.append()</code>, <code>.remove()</code>, <code>.sort()</code>.`,
      ],
      hint_en: (m) => [
        `🔍 Check the method name spelling — Python is case-sensitive.`,
        `📚 Verify that <code>${m[2]}</code> exists on <code>${m[1]}</code>.`,
        `💡 If it's <code>list</code>, common methods: <code>.append()</code>, <code>.remove()</code>, <code>.sort()</code>.`,
      ],
    },
    {
      match: /FileNotFoundError/i,
      he: () => `<b>FileNotFoundError</b>: הקובץ לא נמצא. 📁`,
      en: () => `<b>FileNotFoundError</b>: File not found. 📁`,
      hint_he: () => [
        `🔍 בדוק את הנתיב לקובץ.`,
        `💡 בסימולטור שלנו אין גישה לקבצים אמיתיים — השתמש ב-<code>data.load()</code> עבור דאטהסטים.`,
      ],
      hint_en: () => [
        `🔍 Check the file path.`,
        `💡 Our simulator doesn't access real files — use <code>data.load()</code> for datasets.`,
      ],
    },
    {
      match: /ImportError|ModuleNotFoundError/i,
      he: (m) => `<b>ImportError</b>: לא ניתן לייבא את הספרייה. 📚`,
      en: (m) => `<b>ImportError</b>: Cannot import the library. 📚`,
      hint_he: () => [
        `🔍 הסימולטור (Skulpt) תומך רק בספריות מובנות: math, random, re, datetime, itertools, string, collections.`,
        `❌ אינו תומך: numpy, pandas, matplotlib (אך יש לנו DataFrame משלנו דרך <code>data.load()</code>).`,
        `💡 לעבודה אמיתית עם pandas/numpy — הורד Python למחשב או השתמש ב-Google Colab.`,
      ],
      hint_en: () => [
        `🔍 The simulator (Skulpt) only supports built-in libraries: math, random, re, datetime, itertools, string, collections.`,
        `❌ Does not support: numpy, pandas, matplotlib (but we have our own DataFrame via <code>data.load()</code>).`,
        `💡 For real pandas/numpy work — install Python locally or use Google Colab.`,
      ],
    },
    {
      match: /RecursionError|maximum recursion/i,
      he: () => `<b>RecursionError</b>: יותר מדי קריאות רקורסיביות. 🌀`,
      en: () => `<b>RecursionError</b>: Too many recursive calls. 🌀`,
      hint_he: () => [
        `🔍 ודא שיש תנאי עצירה (base case) בפונקציה הרקורסיבית.`,
        `💡 דוגמה: <code>if n == 0: return 1</code>`,
      ],
      hint_en: () => [
        `🔍 Make sure there's a base case in the recursive function.`,
        `💡 Example: <code>if n == 0: return 1</code>`,
      ],
    },
    // Generic fallback
    {
      match: /^([A-Z]\w*Error)/i,
      he: (m) => `<b>${m[1]}</b>: יש שגיאה בקוד. בדוק את ההודעה למעלה. 🔍`,
      en: (m) => `<b>${m[1]}</b>: There's an error in the code. Check the message above. 🔍`,
      hint_he: () => [
        `📖 קרא את הודעת השגיאה בקפידה — היא בדרך כלל מצביעה על מספר השורה והבעיה.`,
        `💡 אם תקועים, לחץ "הצג פתרון" וראה איך זה אמור להיראות.`,
      ],
      hint_en: () => [
        `📖 Read the error message carefully — it usually points to the line number and problem.`,
        `💡 If stuck, click "Show Solution" to see how it should look.`,
      ],
    },
  ];
  
  // ---- Main: explain an error ----
  function explainError(errorText) {
    if (!errorText || typeof errorText !== 'string') return null;
    
    for (const pat of ERROR_PATTERNS) {
      const m = errorText.match(pat.match);
      if (m) {
        const explanation = IS_RTL ? pat.he(m) : pat.en(m);
        const hintFn = IS_RTL ? pat.hint_he : pat.hint_en;
        const hints = hintFn(m);
        return { explanation, hints };
      }
    }
    return null;
  }
  
  // ---- UI: Show explanation box ----
  function showExplanation(targetEl, errorText) {
    const result = explainError(errorText);
    if (!result) return;
    
    // Remove old explanation if exists
    const old = targetEl.parentElement.querySelector('.gam-ai-helper');
    if (old) old.remove();
    
    const box = document.createElement('div');
    box.className = 'gam-ai-helper';
    
    const hintsHTML = result.hints.map(h => `<li>${h}</li>`).join('');
    
    box.innerHTML = `
      <div class="gam-ai-header">
        <span class="gam-ai-icon">🤖</span>
        <span class="gam-ai-title">${IS_RTL ? 'עוזר חכם' : 'AI Helper'}</span>
        <button class="gam-ai-close" aria-label="${IS_RTL ? 'סגור' : 'Close'}">&times;</button>
      </div>
      <div class="gam-ai-body">
        <div class="gam-ai-explain">${result.explanation}</div>
        <div class="gam-ai-hints-title">${IS_RTL ? '💡 איך לתקן:' : '💡 How to fix:'}</div>
        <ul class="gam-ai-hints">${hintsHTML}</ul>
      </div>
    `;
    
    // Insert after the target
    targetEl.parentElement.insertBefore(box, targetEl.nextSibling);
    
    // Animate in
    setTimeout(() => box.classList.add('show'), 10);
    
    // Close button
    box.querySelector('.gam-ai-close').addEventListener('click', () => {
      box.classList.remove('show');
      setTimeout(() => box.remove(), 300);
    });
  }
  
  // ---- Hook into output displays ----
  function observeOutputs() {
    // Find output boxes when they show errors
    const observer = new MutationObserver(mutations => {
      mutations.forEach(m => {
        if (m.type === 'childList' || m.type === 'characterData') {
          const target = m.target;
          // Check if it's an output box with error content
          let el = target.nodeType === 1 ? target : target.parentElement;
          while (el && !el.classList) el = el.parentElement;
          
          if (el && el.classList && (
              el.classList.contains('output-box') ||
              el.classList.contains('out') ||
              el.id?.startsWith('out-'))) {
            const text = el.textContent || '';
            // Check for error patterns
            if (/Error:|Traceback/i.test(text)) {
              // Avoid duplicates
              if (!el.parentElement.querySelector('.gam-ai-helper')) {
                showExplanation(el, text);
              }
            }
          }
        }
      });
    });
    
    observer.observe(document.body, {
      childList: true,
      subtree: true,
      characterData: true,
    });
  }
  
  // ---- Public API ----
  window.gamAI = {
    explain: explainError,
    show: showExplanation,
  };
  
  // ---- Init ----
  function init() {
    observeOutputs();
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
<script>
/* SOUND EFFECTS */
/* ============================================================
   SOUND EFFECTS — Web Audio API (no external files)
   Pure JS, works offline, mobile-friendly
   ============================================================ */

(function() {
  'use strict';
  
  // ---- Mute toggle (saved to localStorage) ----
  function isMuted() { return localStorage.getItem('gam_muted') === '1'; }
  function setMuted(b) { localStorage.setItem('gam_muted', b ? '1' : '0'); }
  
  // ---- AudioContext (lazy initialization, mobile-safe) ----
  let audioCtx = null;
  function getCtx() {
    if (audioCtx) return audioCtx;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
      return audioCtx;
    } catch(e) { return null; }
  }
  
  // ---- Play a tone ----
  function tone(freq, duration, type = 'sine', vol = 0.15, delay = 0) {
    if (isMuted()) return;
    const ctx = getCtx();
    if (!ctx) return;
    
    // Resume context on first user interaction (mobile requirement)
    if (ctx.state === 'suspended') {
      ctx.resume().catch(() => {});
    }
    
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    
    gain.gain.setValueAtTime(0, ctx.currentTime + delay);
    gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + delay + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
    
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + duration);
  }
  
  // ---- Sound presets ----
  const SOUNDS = {
    // Exercise correct - bright ascending chime
    correct: () => {
      tone(523.25, 0.15, 'sine', 0.15, 0);     // C5
      tone(659.25, 0.15, 'sine', 0.15, 0.1);   // E5
      tone(783.99, 0.25, 'sine', 0.18, 0.2);   // G5
    },
    
    // Exercise incorrect - soft descending hum
    wrong: () => {
      tone(330, 0.15, 'sine', 0.1, 0);
      tone(247, 0.2, 'sine', 0.1, 0.12);
    },
    
    // XP earned - quick double pop
    xp: () => {
      tone(800, 0.08, 'sine', 0.12, 0);
      tone(1200, 0.12, 'sine', 0.12, 0.07);
    },
    
    // Level up - triumphant fanfare
    levelUp: () => {
      tone(523.25, 0.12, 'square', 0.1, 0);      // C5
      tone(659.25, 0.12, 'square', 0.1, 0.1);    // E5
      tone(783.99, 0.12, 'square', 0.1, 0.2);    // G5
      tone(1046.50, 0.3,  'square', 0.12, 0.3);  // C6
    },
    
    // Badge unlock - magical sparkle
    badge: () => {
      tone(880, 0.1,  'sine', 0.1, 0);     // A5
      tone(1108.73, 0.1, 'sine', 0.1, 0.08); // C#6
      tone(1318.51, 0.1, 'sine', 0.12, 0.16); // E6
      tone(1760, 0.25, 'sine', 0.13, 0.24); // A6
    },
    
    // Streak continues - soft bell
    streak: () => {
      tone(659.25, 0.15, 'sine', 0.12, 0);
      tone(987.77, 0.3, 'sine', 0.1, 0.1);
    },
    
    // Click - subtle UI tick
    click: () => {
      tone(2000, 0.03, 'sine', 0.06, 0);
    },
    
    // Module complete - full celebration
    complete: () => {
      tone(523.25, 0.1, 'sine', 0.12, 0);
      tone(659.25, 0.1, 'sine', 0.12, 0.08);
      tone(783.99, 0.1, 'sine', 0.12, 0.16);
      tone(1046.50, 0.4, 'sine', 0.15, 0.24);
    },
  };
  
  // ---- Public API ----
  window.gamSound = {
    play: function(name) {
      if (SOUNDS[name]) {
        try { SOUNDS[name](); } catch(e) { /* swallow */ }
      }
    },
    isMuted: isMuted,
    setMuted: setMuted,
    toggle: function() {
      const newState = !isMuted();
      setMuted(newState);
      updateMuteUI();
      if (!newState) SOUNDS.click();  // confirm sound when unmuting
      return newState;
    },
  };
  
  // ---- Mute toggle button (added to HUD) ----
  function updateMuteUI() {
    const btn = document.getElementById('gam-mute-btn');
    if (btn) btn.textContent = isMuted() ? '🔇' : '🔊';
  }
  
  function addMuteButton() {
    if (document.getElementById('gam-mute-btn')) return;
    const hud = document.getElementById('gam-hud');
    if (!hud) {
      // Try again later
      setTimeout(addMuteButton, 500);
      return;
    }
    
    const btn = document.createElement('button');
    btn.id = 'gam-mute-btn';
    btn.className = 'gam-mute-btn';
    btn.textContent = isMuted() ? '🔇' : '🔊';
    btn.setAttribute('aria-label', 'Toggle sound');
    btn.style.cssText = `
      pointer-events: auto;
      background: var(--tc125);
      border: 1.5px solid var(--tc41);
      border-radius: 50%;
      color: var(--tc42);
      width: 36px;
      height: 36px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--tc126);
      margin-inline-end: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform .15s ease;
    `;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      window.gamSound.toggle();
    });
    
    hud.insertBefore(btn, hud.firstChild);
  }
  
  // ---- Hook into gam events (XP, badges, levels) ----
  function hookGamEvents() {
    if (!window.gam) {
      setTimeout(hookGamEvents, 200);
      return;
    }
    
    // Wrap original markExercisePassed
    const origMark = window.gam.markExercisePassed;
    window.gam.markExercisePassed = function(...args) {
      const result = origMark.apply(this, args);
      if (result) window.gamSound.play('correct');
      return result;
    };
  }
  
  // ---- Init ----
  function init() {
    addMuteButton();
    hookGamEvents();
    
    // Observe DOM for badge/level modals to play sounds
    const observer = new MutationObserver(mutations => {
      mutations.forEach(m => {
        m.addedNodes.forEach(node => {
          if (node.nodeType !== 1) return;
          if (node.classList && node.classList.contains('gam-celebration')) {
            if (node.classList.contains('gam-badge-unlock')) {
              window.gamSound.play('badge');
            } else {
              window.gamSound.play('levelUp');
            }
          }
        });
      });
    });
    observer.observe(document.body, { childList: true });
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>

<script>
/* PYODIDE ADVANCED MODULE */
/* ============================================================
   PYODIDE ADVANCED MODULE - Real Python in browser
   Loads pandas, numpy, matplotlib on-demand alongside Skulpt
   ============================================================ */

(function() {
  'use strict';
  
  const IS_RTL = document.documentElement.dir === 'rtl' || document.documentElement.lang === 'he';
  
  const T = IS_RTL ? {
    advancedMode: 'מצב מתקדם',
    advancedDesc: 'הפעל Python אמיתי עם pandas/numpy/matplotlib',
    loading: 'טוען Pyodide... (~5MB, פעם אחת בלבד)',
    loadingPackages: 'טוען חבילות (pandas, numpy, matplotlib)...',
    ready: 'Pyodide מוכן! 🐍',
    error: 'שגיאת טעינה - נסה שוב',
    realPython: '🚀 Python אמיתי',
    skulptMode: '⚡ Skulpt (מהיר)',
    switchMode: 'החלף',
    advancedTitle: '🚀 תרגילים מתקדמים (Python אמיתי)',
    advancedSubtitle: 'תרגילים אופציונליים שדורשים pandas/numpy/matplotlib אמיתיים. דורש טעינה ראשונית של ~5MB.',
    enable: '✨ הפעל מצב מתקדם',
    enableTooltip: 'יטען Pyodide (~5MB) פעם אחת לדפדפן',
    disable: 'בטל',
    loadingFirstTime: 'טוען בפעם הראשונה...',
    cached: 'נטען מהמטמון',
    runPyodide: '▶ הרץ ב-Python אמיתי',
    chartGenerated: '📊 גרף נוצר',
    saved: 'נשמר',
  } : {
    advancedMode: 'Advanced Mode',
    advancedDesc: 'Enable real Python with pandas/numpy/matplotlib',
    loading: 'Loading Pyodide... (~5MB, one time)',
    loadingPackages: 'Loading packages (pandas, numpy, matplotlib)...',
    ready: 'Pyodide ready! 🐍',
    error: 'Loading error - try again',
    realPython: '🚀 Real Python',
    skulptMode: '⚡ Skulpt (fast)',
    switchMode: 'Switch',
    advancedTitle: '🚀 Advanced Exercises (Real Python)',
    advancedSubtitle: 'Optional exercises requiring real pandas/numpy/matplotlib. Requires initial ~5MB download.',
    enable: '✨ Enable Advanced Mode',
    enableTooltip: 'Will load Pyodide (~5MB) once per browser',
    disable: 'Disable',
    loadingFirstTime: 'Loading for first time...',
    cached: 'Loaded from cache',
    runPyodide: '▶ Run in Real Python',
    chartGenerated: '📊 Chart generated',
    saved: 'Saved',
  };
  
  // ---- State ----
  let pyodide = null;
  let pyodideLoading = false;
  let pyodideReady = false;
  
  // ---- Load Pyodide on demand ----
  async function loadPyodide() {
    if (pyodideReady) return pyodide;
    if (pyodideLoading) {
      // Wait for current load to complete
      while (pyodideLoading) {
        await new Promise(r => setTimeout(r, 200));
      }
      return pyodide;
    }
    
    pyodideLoading = true;
    updateStatus(T.loading);
    
    try {
      // Load Pyodide from CDN if not already loaded
      if (typeof window.loadPyodide === 'undefined') {
        await loadScript('https://cdn.jsdelivr.net/pyodide/v0.27.0/full/pyodide.js');
      }
      
      // Initialize
      pyodide = await window.loadPyodide({
        indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.27.0/full/'
      });
      
      // Load common packages
      updateStatus(T.loadingPackages);
      await pyodide.loadPackage(['pandas', 'numpy', 'matplotlib', 'scikit-learn']);
      
      // Setup matplotlib backend for browser
      pyodide.runPython(`
import matplotlib
matplotlib.use('AGG')
import matplotlib.pyplot as plt
import io, base64

def _show_plt():
    buf = io.BytesIO()
    plt.savefig(buf, format='png', dpi=80, bbox_inches='tight', facecolor='white')
    buf.seek(0)
    img_b64 = base64.b64encode(buf.read()).decode('utf-8')
    plt.close('all')
    return img_b64

plt.show = lambda *args, **kw: print('__PLT_OUTPUT__' + _show_plt() + '__END_PLT__')
      `);
      
      pyodideReady = true;
      pyodideLoading = false;
      updateStatus(T.ready);
      
      // Hide status after 2 seconds
      setTimeout(() => updateStatus(''), 2000);
      
      return pyodide;
    } catch (e) {
      pyodideLoading = false;
      updateStatus(T.error + ': ' + e.message);
      console.error('Pyodide load error:', e);
      throw e;
    }
  }
  
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const existing = document.querySelector(`script[src="${src}"]`);
      if (existing) return resolve();
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  
  function updateStatus(msg) {
    const el = document.getElementById('py-adv-status');
    if (el) {
      el.textContent = msg;
      el.style.display = msg ? 'block' : 'none';
    }
  }
  
  // ---- Run Python code via Pyodide ----
  async function runPyodide(code) {
    if (!pyodideReady) await loadPyodide();
    
    let stdout = '';
    pyodide.setStdout({
      batched: (text) => { stdout += text + '\n'; }
    });
    pyodide.setStderr({
      batched: (text) => { stdout += text + '\n'; }
    });
    
    try {
      // Wrap code to handle matplotlib plt.show()
      await pyodide.runPythonAsync(code);
      return { output: stdout, error: null };
    } catch (e) {
      return { output: stdout, error: e.message };
    }
  }
  
  // ---- UI: Toggle button + status ----
  function buildToggle() {
    if (document.getElementById('py-adv-toggle')) return;
    
    const isEnabled = localStorage.getItem('py_advanced_enabled') === '1';
    
    const wrap = document.createElement('div');
    wrap.id = 'py-adv-wrap';
    wrap.innerHTML = `
      <button id="py-adv-toggle" class="py-adv-toggle ${isEnabled ? 'enabled' : ''}">
        <span class="py-adv-icon">🚀</span>
        <span class="py-adv-label">${isEnabled ? T.realPython : T.skulptMode}</span>
      </button>
      <div id="py-adv-status" class="py-adv-status"></div>
    `;
    
    document.body.appendChild(wrap);
    
    document.getElementById('py-adv-toggle').addEventListener('click', toggleAdvanced);
    
    // Auto-load if enabled
    if (isEnabled) {
      setTimeout(() => loadPyodide().catch(e => console.warn('Auto-load Pyodide failed:', e)), 1500);
    }
  }
  
  function toggleAdvanced() {
    const isEnabled = localStorage.getItem('py_advanced_enabled') === '1';
    if (isEnabled) {
      // Disable - revert to Skulpt
      localStorage.setItem('py_advanced_enabled', '0');
      location.reload();
    } else {
      // Show confirmation modal
      showEnableModal();
    }
  }
  
  function showEnableModal() {
    const modal = document.createElement('div');
    modal.className = 'py-adv-modal';
    modal.innerHTML = `
      <div class="py-adv-modal-inner">
        <div class="py-adv-modal-icon">🚀</div>
        <h2>${T.advancedTitle}</h2>
        <p>${T.advancedSubtitle}</p>
        <ul class="py-adv-features">
          <li>📊 matplotlib אמיתי לויזואליזציה</li>
          <li>🧮 numpy לחישובים מהירים</li>
          <li>🐼 pandas מלא (לא mini-pandas)</li>
          <li>🤖 scikit-learn בסיסי</li>
        </ul>
        <div class="py-adv-modal-actions">
          <button class="py-adv-btn py-adv-btn-primary" id="py-adv-confirm">${T.enable}</button>
          <button class="py-adv-btn py-adv-btn-secondary" id="py-adv-cancel">${T.disable}</button>
        </div>
        <div class="py-adv-tooltip">${T.enableTooltip}</div>
      </div>
    `;
    
    // Translate Hebrew bullet list if EN
    if (!IS_RTL) {
      modal.querySelector('.py-adv-features').innerHTML = `
        <li>📊 Real matplotlib for visualization</li>
        <li>🧮 numpy for fast computation</li>
        <li>🐼 Full pandas (not mini-pandas)</li>
        <li>🤖 Basic scikit-learn</li>
      `;
    }
    
    document.body.appendChild(modal);
    setTimeout(() => modal.classList.add('show'), 10);
    
    document.getElementById('py-adv-confirm').addEventListener('click', async () => {
      localStorage.setItem('py_advanced_enabled', '1');
      modal.classList.remove('show');
      setTimeout(() => modal.remove(), 300);
      // Update toggle button
      const toggle = document.getElementById('py-adv-toggle');
      if (toggle) {
        toggle.classList.add('enabled');
        toggle.querySelector('.py-adv-label').textContent = T.realPython;
      }
      // Start loading
      try {
        await loadPyodide();
      } catch (e) { /* already handled */ }
    });
    
    document.getElementById('py-adv-cancel').addEventListener('click', () => {
      modal.classList.remove('show');
      setTimeout(() => modal.remove(), 300);
    });
    
    modal.addEventListener('click', e => {
      if (e.target === modal) {
        modal.classList.remove('show');
        setTimeout(() => modal.remove(), 300);
      }
    });
  }
  
  // ---- Public API ----
  window.pyAdvanced = {
    isReady: () => pyodideReady,
    isEnabled: () => localStorage.getItem('py_advanced_enabled') === '1',
    load: loadPyodide,
    run: runPyodide,
    
    // For exercise integration: run code and render output (including matplotlib)
    runAndRender: async function(code, outputEl) {
      try {
        await loadPyodide();
        const result = await runPyodide(code);
        
        let html = '';
        let text = result.output || '';
        
        // Extract matplotlib images
        const plotRegex = /__PLT_OUTPUT__([A-Za-z0-9+/=]+)__END_PLT__/g;
        let match;
        const images = [];
        while ((match = plotRegex.exec(text)) !== null) {
          images.push(match[1]);
        }
        text = text.replace(plotRegex, '').trim();
        
        if (text) html += `<pre>${escapeHTML(text)}</pre>`;
        for (const img of images) {
          html += `<img src="data:image/png;base64,${img}" style="max-width:100%; margin-top:8px; border-radius:6px;" alt="Plot">`;
        }
        if (result.error) {
          html += `<pre style="color:var(--tc136);">${escapeHTML(result.error)}</pre>`;
        }
        
        if (outputEl) outputEl.innerHTML = html;
        return { output: text, images: images, error: result.error };
      } catch (e) {
        if (outputEl) outputEl.innerHTML = `<pre style="color:var(--tc136);">${escapeHTML(e.message)}</pre>`;
        return { output: '', images: [], error: e.message };
      }
    }
  };
  
  function escapeHTML(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  
  // ---- Init ----
  function init() {
    buildToggle();
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>

    expandSection: 'הצג תרגילים מתקדמים',
    collapseSection: 'הסתר',
    enableFirst: 'צריך להפעיל את "מצב מתקדם" קודם',
    enableBtn: '✨ הפעל מצב מתקדם',
    run: '▶ הרץ ב-Python אמיתי',
    running: 'מריץ...',
    showSolution: '💡 הצג פתרון',
    hideSolution: 'הסתר פתרון',
    copy: '📋 העתק',
    copied: '✅ הועתק!',
    correct: '✅ מעולה! התשובה נכונה.',
    wrong: '🤔 הפלט לא תואם. נסה שוב.',
    hint: '💡 רמז',
    moduleProgress: (done, total) => `${done}/${total} הושלמו`,
    completed: 'הושלם',
  } : {
    sectionTitle: '🚀 Advanced Exercises (Real Python)',
    sectionDesc: 'Real pandas, numpy, matplotlib - after completing basic exercises',
    expandSection: 'Show Advanced Exercises',
    collapseSection: 'Hide',
    enableFirst: 'You need to enable "Advanced Mode" first',
    enableBtn: '✨ Enable Advanced Mode',
    run: '▶ Run in Real Python',
    running: 'Running...',
    showSolution: '💡 Show Solution',
    hideSolution: 'Hide Solution',
    copy: '📋 Copy',
    copied: '✅ Copied!',
    correct: '✅ Excellent! Correct answer.',
    wrong: '🤔 Output doesn\'t match. Try again.',
    hint: '💡 Hint',
    moduleProgress: (done, total) => `${done}/${total} completed`,
    completed: 'Completed',
  };
  
  // ---- Get exercises for current lang ----
  function getExercises() {
    if (!window.PYODIDE_ADVANCED_EXERCISES) return [];
    return IS_RTL ? window.PYODIDE_ADVANCED_EXERCISES.he : window.PYODIDE_ADVANCED_EXERCISES.en;
  }
  
  // ---- Storage for completion tracking ----
  function getCompleted() {
    try { return JSON.parse(localStorage.getItem('py_adv_completed') || '[]'); }
    catch (e) { return []; }
  }
  function markCompleted(exId) {
    const c = getCompleted();
    if (!c.includes(exId)) {
      c.push(exId);
      localStorage.setItem('py_adv_completed', JSON.stringify(c));
      // Hook into gam for XP
      if (window.gam && window.gam.addXP) {
        window.gam.addXP(20, IS_RTL ? 'תרגיל מתקדם!' : 'Advanced exercise!');
      }
    }
  }
  
  // ---- Build the advanced section ----
  function buildAdvancedSection() {
    // Find where to insert: after main exercises, before footer
    const target = document.querySelector('main') || document.body;
    if (!target) return;
    
    // Avoid duplicate
    if (document.getElementById('py-adv-section')) return;
    
    // Only show on pages that make sense (pandas-lesson)
    const url = location.pathname.toLowerCase();
    if (!url.includes('pandas-lesson')) return;
    
    const section = document.createElement('section');
    section.id = 'py-adv-section';
    section.className = 'py-adv-section';
    section.style.cssText = 'margin: 40px 16px 20px; max-width: 900px; margin-left: auto; margin-right: auto;';
    
    // Build collapsible UI
    section.innerHTML = `
      <div class="py-adv-section-header" style="cursor:pointer; display:flex; align-items:center; gap:8px; user-select:none;">
        <h2 class="py-adv-section-title">${T.sectionTitle}</h2>
        <span class="py-adv-expand-icon" style="margin-inline-start:auto; font-size:18px; transition:transform .3s;">▼</span>
      </div>
      <div class="py-adv-section-desc">${T.sectionDesc}</div>
      <div class="py-adv-section-body" style="display:none; margin-top:16px;">
        <div id="py-adv-content"></div>
      </div>
    `;
    
    target.appendChild(section);
    
    // Click to toggle
    const header = section.querySelector('.py-adv-section-header');
    const body = section.querySelector('.py-adv-section-body');
    const icon = section.querySelector('.py-adv-expand-icon');
    header.addEventListener('click', () => {
      const isOpen = body.style.display !== 'none';
      body.style.display = isOpen ? 'none' : 'block';
      icon.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
      if (!isOpen) {
        renderExercises();
      }
    });
  }
  
  // ---- Render exercises ----
  function renderExercises() {
    const container = document.getElementById('py-adv-content');
    if (!container) return;
    if (container.dataset.rendered === '1') return;
    container.dataset.rendered = '1';
    
    const isEnabled = window.pyAdvanced && window.pyAdvanced.isEnabled();
    
    if (!isEnabled) {
      // Show "enable first" message
      container.innerHTML = `
        <div class="py-adv-locked">
          <div class="py-adv-locked-text">${T.enableFirst}</div>
          <button class="py-adv-enable-btn" id="py-adv-enable-from-section">${T.enableBtn}</button>
        </div>
      `;
      document.getElementById('py-adv-enable-from-section').addEventListener('click', () => {
        // Trigger the toggle
        const btn = document.getElementById('py-adv-toggle');
        if (btn) btn.click();
        // Reset render
        setTimeout(() => {
          container.dataset.rendered = '0';
          renderExercises();
        }, 1000);
      });
      return;
    }
    
    const modules = getExercises();
    const completed = getCompleted();
    
    let html = '';
    modules.forEach((mod, modIdx) => {
      const modDone = mod.topics.filter(t => completed.includes(t.id)).length;
      const modTotal = mod.topics.length;
      
      html += `
        <div class="py-adv-module">
          <div class="py-adv-module-header">
            <h3>${mod.module}</h3>
            <span class="py-adv-module-progress">${T.moduleProgress(modDone, modTotal)}</span>
          </div>
          <div class="py-adv-topics">
      `;
      
      mod.topics.forEach((topic, topicIdx) => {
        const isDone = completed.includes(topic.id);
        const uniqueId = `pyadv-${modIdx}-${topicIdx}`;
        html += `
          <div class="py-adv-topic ${isDone ? 'done' : ''}" data-ex-id="${topic.id}">
            <div class="py-adv-topic-header">
              <h4>${isDone ? '✅' : '⚪'} ${topic.title}</h4>
            </div>
            <div class="py-adv-theory">${topic.theory}</div>
            <div class="py-adv-question"><b>📝 ${IS_RTL ? 'תרגיל' : 'Exercise'}:</b> ${topic.q}</div>
            <textarea id="code-${uniqueId}" class="py-adv-code" rows="8" spellcheck="false">${topic.starter || ''}</textarea>
            <div class="py-adv-actions">
              <button class="py-adv-run-btn" data-id="${uniqueId}" data-ex="${topic.id}">${T.run}</button>
              <button class="py-adv-sol-btn" data-id="${uniqueId}">${T.showSolution}</button>
              <button class="py-adv-hint-btn" data-id="${uniqueId}" data-hint="${escapeAttr(topic.hint || '')}">${T.hint}</button>
            </div>
            <div id="out-${uniqueId}" class="py-adv-output"></div>
            <div id="verdict-${uniqueId}" class="py-adv-verdict"></div>
            <div id="sol-${uniqueId}" class="py-adv-solution" style="display:none;">
              <div class="py-adv-sol-header">
                <span>💡 ${IS_RTL ? 'פתרון רשמי' : 'Official solution'}</span>
                <button class="py-adv-copy-btn" data-id="${uniqueId}">${T.copy}</button>
              </div>
              <pre id="sol-code-${uniqueId}">${escapeHTML(topic.solution || '')}</pre>
            </div>
          </div>
        `;
      });
      
      html += `</div></div>`;
    });
    
    container.innerHTML = html;
    
    // Store exercise data for check functions
    window._pyAdvExercises = {};
    modules.forEach(mod => {
      mod.topics.forEach(topic => {
        window._pyAdvExercises[topic.id] = topic;
      });
    });
    
    // Wire up buttons
    container.querySelectorAll('.py-adv-run-btn').forEach(btn => {
      btn.addEventListener('click', () => runExercise(btn.dataset.id, btn.dataset.ex));
    });
    container.querySelectorAll('.py-adv-sol-btn').forEach(btn => {
      btn.addEventListener('click', () => toggleSolution(btn.dataset.id));
    });
    container.querySelectorAll('.py-adv-hint-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const hint = btn.dataset.hint;
        if (hint) alert(`💡 ${hint}`);
      });
    });
    container.querySelectorAll('.py-adv-copy-btn').forEach(btn => {
      btn.addEventListener('click', () => copyCode(btn.dataset.id, btn));
    });
  }
  
  async function runExercise(uniqueId, exId) {
    const codeEl = document.getElementById(`code-${uniqueId}`);
    const outEl = document.getElementById(`out-${uniqueId}`);
    const verdictEl = document.getElementById(`verdict-${uniqueId}`);
    const runBtn = document.querySelector(`.py-adv-run-btn[data-id="${uniqueId}"]`);
    
    if (!codeEl || !outEl) return;
    
    const code = codeEl.value;
    
    // Show running state
    runBtn.textContent = T.running;
    runBtn.disabled = true;
    outEl.innerHTML = `<div style="opacity:0.7;">⏳ ${T.running}</div>`;
    verdictEl.textContent = '';
    verdictEl.className = 'py-adv-verdict';
    
    try {
      const result = await window.pyAdvanced.runAndRender(code, outEl);
      
      // Check if correct
      const exercise = window._pyAdvExercises[exId];
      if (exercise && exercise.check) {
        const passed = exercise.check(result.output || '', result.images || []);
        if (passed) {
          verdictEl.textContent = T.correct;
          verdictEl.className = 'py-adv-verdict success';
          if (exercise.explain) {
            const _w = document.createElement('div');
            _w.className = 'why-box';
            _w.innerHTML = '<div class="why-title">' + (IS_RTL ? 'למה זה עובד' : 'Why this works') + '</div>' + exercise.explain;
            verdictEl.appendChild(_w);
          }
          markCompleted(exId);
          
          // Visual update
          const topicEl = document.querySelector(`.py-adv-topic[data-ex-id="${exId}"]`);
          if (topicEl) {
            topicEl.classList.add('done');
            const h4 = topicEl.querySelector('h4');
            if (h4 && !h4.textContent.startsWith('✅')) {
              h4.textContent = '✅ ' + h4.textContent.replace(/^[⚪✅]\s*/, '');
            }
          }
          
          // Sound effect
          if (window.gamSound) window.gamSound.play('correct');
        } else {
          verdictEl.textContent = T.wrong;
          verdictEl.className = 'py-adv-verdict fail';
          if (window.gamSound) window.gamSound.play('wrong');
        }
      }
    } catch (e) {
      outEl.innerHTML = `<pre style="color:var(--tc136);">${escapeHTML(e.message)}</pre>`;
    } finally {
      runBtn.textContent = T.run;
      runBtn.disabled = false;
    }
  }
  
  function toggleSolution(uniqueId) {
    const sol = document.getElementById(`sol-${uniqueId}`);
    const btn = document.querySelector(`.py-adv-sol-btn[data-id="${uniqueId}"]`);
    if (!sol) return;
    
    if (sol.style.display === 'none') {
      sol.style.display = 'block';
      btn.textContent = T.hideSolution;
    } else {
      sol.style.display = 'none';
      btn.textContent = T.showSolution;
    }
  }
  
  function copyCode(uniqueId, btn) {
    const codeEl = document.getElementById(`sol-code-${uniqueId}`);
    if (!codeEl) return;
    const text = codeEl.textContent;
    
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        const oldText = btn.textContent;
        btn.textContent = T.copied;
        setTimeout(() => { btn.textContent = T.copy; }, 1800);
      });
    }
  }
  
  function escapeHTML(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s) {
    if (s == null) return '';
    return String(s).replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }
  
  // ---- Init ----
  function init() {
    // Only on pandas-lesson
    if (!location.pathname.toLowerCase().includes('pandas-lesson')) return;
    // Wait a bit for the main page to render
    setTimeout(buildAdvancedSection, 500);
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>

<script>
// Auto-open certificate if ?openCert=1
(function() {
  if (location.search.includes('openCert=1')) {
    const tryOpen = () => {
      if (window.gamCert && window.gamCert.open) {
        setTimeout(() => window.gamCert.open(), 800);

      return false;
