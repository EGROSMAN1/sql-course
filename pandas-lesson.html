a{color:var(--tc3);text-decoration:none}

.topnav{display:flex;align-items:center;gap:.7rem;padding:.55rem 1rem;border-bottom:1px solid var(--tc4);background:var(--tc5);position:sticky;top:0;z-index:50;flex-wrap:wrap}

.main{max-width:900px;margin:0 auto;padding:1.2rem 1rem 5rem}

.lesson-head{display:flex;align-items:center;gap:.7rem;margin-bottom:.8rem;flex-wrap:wrap}
.lesson-head .icon{font-size:2rem}
.lesson-head .info{flex:1;min-width:0}
.lesson-head .module-label{font-size:11.5px;font-weight:700;color:var(--tc3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.2rem}
.lesson-head .title{font-size:1.4rem;font-weight:800}

/* Theory */
.theory{background:var(--tc5);border:1px solid var(--tc4);border-radius:11px;padding:1rem 1.2rem;margin-bottom:1.4rem;font-size:14px;line-height:1.7}

.theory li{margin:.25rem 0}
.theory code{background:var(--tc9);color:var(--tc10);padding:1px 6px;border-radius:4px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;direction:ltr;display:inline-block}
.theory pre{background:var(--tc9);padding:.7rem .9rem;border-radius:7px;margin:.6rem 0;direction:ltr;text-align:left;overflow-x:auto;color:var(--tc10);font-family:"SF Mono",monospace;font-size:12.5px;line-height:1.55;border:1px solid var(--tc4)}
.theory b{color:var(--tc2);font-weight:700}

/* Exercise nav */
.ex-nav{display:flex;gap:.35rem;justify-content:center;margin-bottom:1rem;flex-wrap:wrap}
.ex-nav-btn{width:34px;height:30px;border-radius:7px;background:var(--tc7);border:1px solid var(--tc11);color:var(--tc6);font-size:12.5px;font-weight:700;cursor:pointer;font-family:"SF Mono",monospace;transition:all .12s}
.ex-nav-btn:hover{border-color:var(--tc12);color:var(--tc3);transform:translateY(-1px)}
.ex-nav-btn.done{background:var(--tc13);border-color:var(--tc14);color:var(--tc15)}
.ex-nav-btn.current{background:linear-gradient(135deg,#00E5FF,#00E5A0);color:#000;border-color:transparent}

/* Exercise */
.exercise{background:var(--tc5);border:1px solid var(--tc4);border-radius:11px;padding:1rem 1.2rem;margin-bottom:1rem}
.exercise.completed{border-color:var(--tc16)}
.ex-head{display:flex;align-items:flex-start;gap:.7rem;margin-bottom:.7rem;flex-wrap:wrap}
.ex-num{background:var(--tc7);color:var(--tc17);font-weight:800;width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:"SF Mono",monospace;font-size:13px;flex-shrink:0}
.exercise.completed .ex-num{background:linear-gradient(135deg,#00E5A0,#00E5FF);color:#000}

.ex-q code{background:var(--tc9);color:var(--tc18);padding:1px 6px;border-radius:4px;font-family:"SF Mono",monospace;font-size:12.5px;direction:ltr;display:inline-block}

.nav-btn:hover{border-color:var(--tc12);color:var(--tc3)}

.cm-s-dracula.CodeMirror{background:var(--tc9) !important;color:var(--tc10)}
.cm-s-dracula .CodeMirror-gutters{background:var(--tc9);border-right:1px solid var(--tc4)}
.cm-s-dracula .CodeMirror-linenumber{color:var(--tc17)}
.CodeMirror-hints{background:var(--tc7) !important;border:1px solid var(--tc11) !important;border-radius:6px;direction:ltr;font-family:"SF Mono",monospace;font-size:12.5px;z-index:9999}

  .df-table{font-size:11px}
  .df-table th,.df-table td{padding:.3rem .5rem}
}

.tip-box b{color:var(--tc3)}

/* === Solution panel (slides down below editor) === */
.solution-panel{
  border:1px solid var(--tc34);
  border-radius:8px;
  margin-top:.6rem;
  overflow:hidden;
  background:var(--tc35);
  display:none;
}
.solution-panel.show{display:block;animation:slideDown .25s ease-out}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.solution-header{
  background:var(--tc36);
  padding:.55rem .85rem;
  display:flex;align-items:center;gap:.5rem;
  font-size:12.5px;font-weight:700;
  color:var(--tc18);
  border-bottom:1px solid var(--tc37);
}
.solution-header .ico{font-size:.95rem}
.solution-header .label{flex:1}

  background:var(--tc7);border:1px solid var(--tc11);

  padding:3px 9px;border-radius:5px;cursor:pointer;
  font-family:inherit;transition:all .12s;min-height:26px;
}
.solution-header .copy-btn:hover{color:var(--tc18);border-color:var(--tc20)}

  font-family:"SF Mono",Menlo,Consolas,monospace;

/* GAMIFICATION CSS */
/* ============================================================
   GAMIFICATION CSS — Mobile-first, RTL+LTR support
   ============================================================ */

/* ---- HUD (top fixed corner) ---- */
#gam-hud {
  position: fixed;
  bottom: 12px;
  z-index: 9998;
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: 6px;
}
[dir="ltr"] #gam-hud { right: 12px; }
[dir="rtl"] #gam-hud { left: 12px; }

#gam-hud-btn {
  pointer-events: auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  background: linear-gradient(135deg, var(--tc39) 0%, var(--tc40) 100%);
  border: 1.5px solid var(--tc41);
  border-radius: 22px;
  color: var(--tc42);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 14px var(--tc43);
  transition: transform .15s ease, box-shadow .15s ease;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  line-height: 1;
}
#gam-hud-btn:hover, #gam-hud-btn:active {
  transform: scale(1.05);
  box-shadow: 0 6px 18px var(--tc44);
}
#gam-hud-btn .gam-streak,
#gam-hud-btn .gam-xp {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  white-space: nowrap;
}
#gam-hud-btn .gam-streak { color: var(--tc45); }
#gam-hud-btn .gam-xp     { color: var(--tc46); }

/* ---- XP gain toast ---- */
.gam-toast {
  position: fixed;
  bottom: 90px;
  z-index: 9999;
  background: linear-gradient(135deg, #00c896 0%, #00a884 100%);
  color: #fff;
  padding: 12px 18px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 8px 24px rgba(0,200,150,0.4);
  opacity: 0;
  transform: translateY(15px);
  transition: opacity .35s ease, transform .35s ease;
  max-width: calc(100% - 30px);
  pointer-events: none;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
[dir="ltr"] .gam-toast { right: 15px; }
[dir="rtl"] .gam-toast { left: 15px; }
.gam-toast.show { opacity: 1; transform: translateY(0); }
.gam-toast-icon { font-size: 18px; margin-inline-end: 4px; }
.gam-toast-xp { background: linear-gradient(135deg, #ffaa00 0%, #ff8800 100%); box-shadow: 0 8px 24px rgba(255,170,0,0.45); }
.gam-toast small { opacity: 0.92; font-weight: 400; }

/* ---- Celebration modal (level up / badge unlock) ---- */
.gam-celebration {
  position: fixed;
  inset: 0;
  background: var(--tc47);
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity .35s ease;
  padding: 20px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  backdrop-filter: blur(4px);
}
.gam-celebration.show { opacity: 1; }
.gam-celebration-inner {
  background: linear-gradient(135deg, var(--tc48) 0%, var(--tc49) 100%);
  border: 2px solid var(--tc50);
  border-radius: 22px;
  padding: 28px 26px;
  text-align: center;
  max-width: 340px;
  width: 100%;
  color: var(--tc42);
  transform: scale(0.85);
  transition: transform .4s cubic-bezier(.34,1.56,.64,1);
  box-shadow: 0 20px 60px var(--tc51);
}
.gam-celebration.show .gam-celebration-inner { transform: scale(1); }
.gam-celebration-icon {
  font-size: 64px;
  margin-bottom: 10px;
  animation: gam-bounce 0.6s ease infinite alternate;
}
@keyframes gam-bounce {
  from { transform: translateY(0); }
  to   { transform: translateY(-8px); }
}
.gam-celebration h2 {
  margin: 6px 0 14px;
  font-size: 22px;
  color: var(--tc46);
}
.gam-celebration h3 {
  font-size: 13px;
  letter-spacing: 1px;
  color: var(--tc52);
  text-transform: uppercase;
  margin: 0 0 8px;
}
.gam-celebration p { font-size: 14px; opacity: 0.85; margin: 6px 0 14px; }
.gam-level-badge {
  display: inline-block;
  background: linear-gradient(135deg, #ffd700 0%, #ff8800 100%);
  color: #1a1a2e;
  padding: 10px 28px;
  border-radius: 25px;
  font-size: 19px;
  font-weight: 800;
  margin: 6px 0 18px;
}
.gam-badge-icon-big {
  font-size: 72px;
  margin-bottom: 6px;
  animation: gam-spin 1.2s ease-in-out;
}
@keyframes gam-spin {
  0%   { transform: rotate(-15deg) scale(0.7); opacity: 0; }
  100% { transform: rotate(0) scale(1); opacity: 1; }
}
.gam-celebration-close {
  background: var(--tc53);
  border: 1px solid var(--tc54);
  color: var(--tc42);
  padding: 9px 26px;
  border-radius: 22px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s;
  font-family: inherit;
}
.gam-celebration-close:hover, .gam-celebration-close:active { background: var(--tc55); }

/* ---- Progress Panel ---- */
#gam-panel {
  position: fixed;
  inset: 0;
  background: var(--tc56);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity .3s ease;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  backdrop-filter: blur(4px);
}
#gam-panel.show { opacity: 1; }

.gam-panel-inner {
  background: var(--tc39);
  border-radius: 16px;
  padding: 22px 18px 24px;
  width: 100%;
  max-width: 460px;
  max-height: 92vh;
  overflow-y: auto;
  color: var(--tc42);
  position: relative;
  transform: translateY(20px);
  transition: transform .3s ease;
  margin: 14px;
  border: 1px solid var(--tc57);
}
#gam-panel.show .gam-panel-inner { transform: translateY(0); }

.gam-panel-close {
  position: absolute;
  top: 10px;
  background: transparent;
  border: none;
  color: var(--tc58);
  font-size: 28px;
  cursor: pointer;
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  line-height: 1;
}
[dir="ltr"] .gam-panel-close { right: 10px; }
[dir="rtl"] .gam-panel-close { left: 10px; }
.gam-panel-close:hover, .gam-panel-close:active { color: var(--tc42); background: var(--tc59); }

.gam-panel-title {
  font-size: 20px;
  font-weight: 700;
  margin: 0 0 18px;
  color: var(--tc46);
  text-align: center;
}

.gam-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}
.gam-stat {
  background: linear-gradient(135deg, var(--tc60) 0%, var(--tc40) 100%);
  border-radius: 11px;
  padding: 12px 6px;
  text-align: center;
  border: 1px solid var(--tc57);
}
.gam-stat-icon { font-size: 22px; margin-bottom: 3px; }
.gam-stat-val { font-size: 22px; font-weight: 800; color: var(--tc42); line-height: 1.1; }
.gam-stat-label { font-size: 10px; color: var(--tc61); text-transform: uppercase; margin-top: 2px; letter-spacing: .3px; }

.gam-progress-box {
  background: var(--tc60);
  border-radius: 11px;
  padding: 12px;
  margin-bottom: 16px;
  border: 1px solid var(--tc57);
}
.gam-progress-header {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--tc61);
  margin-bottom: 6px;
  font-weight: 600;
}
.gam-progress-bar {
  width: 100%;
  height: 9px;
  background: var(--tc62);
  border-radius: 8px;
  overflow: hidden;
}
.gam-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #ffd700 0%, #ff8800 100%);
  border-radius: 8px;
  transition: width .5s ease;
  box-shadow: 0 0 12px rgba(255,170,0,0.4);
}
.gam-progress-text {
  text-align: center;
  font-size: 11px;
  color: var(--tc63);
  margin-top: 6px;
}

.gam-section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--tc42);
  margin: 16px 0 10px;
  letter-spacing: .3px;
}

.gam-chart {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  height: 100px;
  background: var(--tc60);
  border-radius: 11px;
  padding: 10px 8px 4px;
  margin-bottom: 6px;
  border: 1px solid var(--tc57);
}
.gam-chart-bar {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  position: relative;
  height: 100%;
}
.gam-chart-fill {
  width: 100%;
  background: linear-gradient(180deg, #00d4aa 0%, #00a884 100%);
  border-radius: 4px 4px 0 0;
  min-height: 2px;
  transition: height .6s ease;
}
.gam-chart-label { font-size: 9px; color: var(--tc61); margin-top: 3px; }
.gam-chart-val { font-size: 9px; color: var(--tc46); font-weight: 700; position: absolute; top: -14px; }

.gam-badges {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
  gap: 8px;
  margin-bottom: 14px;
}
.gam-badge {
  background: var(--tc60);
  border-radius: 10px;
  padding: 11px 4px 9px;
  text-align: center;
  border: 1.5px solid var(--tc57);
  transition: transform .15s ease;
  cursor: help;
}
.gam-badge.earned {
  border-color: var(--tc50);
  background: linear-gradient(135deg, var(--tc64) 0%, var(--tc65) 100%);
  box-shadow: 0 0 10px var(--tc66);
}
.gam-badge.earned:hover { transform: scale(1.04); }
.gam-badge.locked { opacity: 0.32; filter: grayscale(0.8); }
.gam-badge-icon { font-size: 28px; margin-bottom: 3px; }
.gam-badge-name { font-size: 10px; font-weight: 700; color: var(--tc42); line-height: 1.18; }

.gam-footer {
  border-top: 1px solid var(--tc57);
  padding-top: 12px;
  font-size: 12px;
  color: var(--tc61);
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.gam-footer strong { color: var(--tc46); }

/* ---- Mobile tweaks ---- */
@media (max-width: 480px) {
  #gam-hud { bottom: 8px; }
  [dir="ltr"] #gam-hud { right: 8px; }
  [dir="rtl"] #gam-hud { left: 8px; }
  #gam-hud-btn { padding: 6px 10px; font-size: 12px; }
  
  .gam-toast { font-size: 13px; padding: 10px 14px; bottom: 90px; }
  [dir="ltr"] .gam-toast { right: 10px; left: 10px; max-width: none; }
  [dir="rtl"] .gam-toast { left: 10px; right: 10px; max-width: none; }
  
  .gam-celebration-inner { padding: 22px 18px; max-width: 100%; }
  .gam-celebration h2 { font-size: 20px; }
  .gam-celebration-icon { font-size: 56px; }
  .gam-badge-icon-big { font-size: 64px; }
  .gam-level-badge { font-size: 17px; padding: 9px 24px; }
  
  .gam-panel-inner { padding: 18px 14px; margin: 0; border-radius: 16px 16px 0 0; max-height: 95vh; }
  .gam-panel-title { font-size: 18px; }
  .gam-stat-val { font-size: 19px; }
  .gam-stat-icon { font-size: 20px; }
  .gam-badges { grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; }
  .gam-badge-icon { font-size: 26px; }
  .gam-badge-name { font-size: 9.5px; }
  .gam-chart { height: 88px; }
}

/* Very small phones */
@media (max-width: 360px) {
  .gam-stats { gap: 5px; }
  .gam-stat { padding: 9px 4px; }
  .gam-stat-val { font-size: 17px; }
  .gam-stat-label { font-size: 9px; }
  .gam-badges { grid-template-columns: repeat(3, 1fr); }
  .gam-badge-name { font-size: 9px; }
}

</style>

const PYTHON_PRELUDE = "# =============================================================\n# MINI-PANDAS v3 - Extended DataFrame API for Skulpt 1.2\n# Auto-injected into Playground + pandas course\n#\n# Design notes\n# ------------\n# * Skulpt 1.2 COERCES the return value of __gt__/__lt__/__eq__/... to bool.\n#   Therefore `df[df[\"age\"] > 28]` can NOT work here, and no part of this file\n#   depends on it.  The supported (and 100%-real-pandas) spelling is:\n#       df[df[\"age\"].gt(28)]\n#       df[df[\"age\"].gt(28) & df[\"score\"].lt(50)]\n#       df[~df[\"city\"].isin([\"TLV\"])]\n#   `&`, `|`, `^`, `~` DO return objects in Skulpt, so masks compose normally.\n# * Missing data is represented by None (legacy).  float('nan') is also\n#   recognised as missing everywhere.\n# * Legacy, non-pandas helpers kept for backward compatibility:\n#       df.filter(col, op, value)      df.where(lambda row: ...)\n#       df.astype(col, dtype)          df.clip(col, lower=, upper=)\n#   They are marked LEGACY below.  The standard pandas signatures also work.\n#\n# Behaviour changes vs. mini-pandas v2 (all of them move TOWARDS real pandas)\n# --------------------------------------------------------------------------\n#   set_index(col)      the column really leaves .columns; shape loses 1 col\n#   describe()          returns a DataFrame (count/mean/std/min/25/50/75/max)\n#   GroupBy.count()     non-null count PER COLUMN;  size() = rows per group\n#   Series.value_counts() returns a Series indexed by value, skipping NaN\n#   df.mean/sum/min/max/count/nunique  return a Series (were dicts)\n#   merge()             adds _x/_y suffixes; validates `how`; right/outer work\n#   pct_change()        prev == 0 gives inf/-inf/nan instead of None\n#   cumsum()            concatenates str columns (pandas) instead of zeroing\n#\n# Deliberate deviations from pandas, kept for backward compatibility\n# ------------------------------------------------------------------\n#   * GroupBy keeps the FIRST-SEEN group order (pandas sorts) and returns the\n#     group key as a COLUMN (pandas uses the index).\n#   * GroupBy.mean() rounds to 2 decimals.\n#   * series[3] is POSITIONAL, not label-based.  Use .loc[label]/.get(label).\n#   * Series prints as a plain list unless it carries a meaningful index\n#     (value_counts, describe, df.mean(), ...), which prints label/value rows.\n#   * df.to_dict() defaults to orient=\"list\".\n# =============================================================\n\n\n# ----------------------------------------------------------------- helpers\n\ndef _is_na(v):\n    \"\"\"True for None and for NaN floats.\"\"\"\n    if v is None:\n        return True\n    if isinstance(v, float) and v != v:\n        return True\n    return False\n\n\ndef _is_num(v):\n    \"\"\"Numeric and not a bool (bools are handled explicitly where needed).\"\"\"\n    return isinstance(v, (int, float)) and not isinstance(v, bool)\n\n\ndef _numeric(v):\n    \"\"\"Numeric value usable in arithmetic (bool counts as 0/1, like pandas).\"\"\"\n    if isinstance(v, bool):\n        return True\n    return isinstance(v, (int, float))\n\n\ndef _num_of(v):\n    if isinstance(v, bool):\n        return 1 if v else 0\n    return v\n\n\ndef _nan():\n    return float('nan')\n\n\ndef _inf(sign):\n    if sign < 0:\n        return -float('inf')\n    return float('inf')\n\n\ndef _safe_div(a, b):\n    if b == 0:\n        if a == 0:\n            return _nan()\n        return _inf(1 if a > 0 else -1)\n    return a / b\n\n\ndef _order(values, ascending=True, na_last=True):\n    \"\"\"Return the index order that sorts `values`, NaN/None always last.\"\"\"\n    n = len(values)\n    good = []\n    bad = []\n    for i in range(n):\n        if _is_na(values[i]):\n            bad.append(i)\n        else:\n            good.append(i)\n    numeric = True\n    for i in good:\n        if not _numeric(values[i]):\n            numeric = False\n            break\n    if numeric:\n        good.sort(key=lambda i: _num_of(values[i]), reverse=not ascending)\n    else:\n        good.sort(key=lambda i: str(values[i]), reverse=not ascending)\n    if na_last:\n        return good + bad\n    return bad + good\n\n\ndef _fmt(v):\n    if v is None:\n        return \"None\"\n    return str(v)\n\n\ndef _mean_of(vals):\n    if not vals:\n        return None\n    return sum(vals) / len(vals)\n\n\ndef _var_of(vals, ddof=1):\n    n = len(vals)\n    if n - ddof <= 0:\n        return _nan()\n    m = sum(vals) / n\n    tot = 0.0\n    for v in vals:\n        tot += (v - m) * (v - m)\n    return tot / (n - ddof)\n\n\ndef _std_of(vals, ddof=1):\n    v = _var_of(vals, ddof)\n    if v != v:\n        return v\n    return v ** 0.5\n\n\ndef _quantile_of(sorted_vals, q):\n    \"\"\"Linear interpolation, identical to pandas' default.\"\"\"\n    n = len(sorted_vals)\n    if n == 0:\n        return None\n    if n == 1:\n        return sorted_vals[0] * 1.0\n    pos = (n - 1) * q\n    lo = int(pos)\n    hi = lo + 1\n    if hi >= n:\n        return sorted_vals[n - 1] * 1.0\n    frac = pos - lo\n    return sorted_vals[lo] + (sorted_vals[hi] - sorted_vals[lo]) * frac\n\n\n_DTYPE_ALIASES = {\n    \"int\": \"int\", \"int64\": \"int\", \"int32\": \"int\", \"integer\": \"int\",\n    \"float\": \"float\", \"float64\": \"float\", \"float32\": \"float\",\n    \"str\": \"str\", \"string\": \"str\", \"object\": \"str\", \"O\": \"str\",\n    \"bool\": \"bool\", \"boolean\": \"bool\",\n}\n\n\ndef _cast(v, dtype):\n    if _is_na(v):\n        if dtype == \"str\":\n            return v\n        return None\n    if dtype == int or dtype == \"int\":\n        return int(v)\n    if dtype == float or dtype == \"float\":\n        return float(v)\n    if dtype == str or dtype == \"str\":\n        return str(v)\n    if dtype == bool or dtype == \"bool\":\n        return bool(v)\n    return v\n\n\ndef _norm_dtype(dtype):\n    if isinstance(dtype, str):\n        return _DTYPE_ALIASES.get(dtype, dtype)\n    return dtype\n\n\ndef _as_mask(key, n):\n    \"\"\"Turn a boolean Series / list of bools into a plain list of bools.\"\"\"\n    if isinstance(key, Series):\n        vals = key._data\n    else:\n        vals = key\n    out = []\n    for v in vals:\n        if _is_na(v):\n            out.append(False)\n        else:\n            out.append(bool(v))\n    return out\n\n\ndef _looks_boolean(vals):\n    if len(vals) == 0:\n        return False\n    for v in vals:\n        if not isinstance(v, bool) and not _is_na(v):\n            return False\n    return True\n\n\ndef _rank_values(values, method=\"average\", ascending=True):\n    \"\"\"Rank a list the way pandas does: 1-based, NaN stays NaN, and tied\n    values share a rank according to `method`.\"\"\"\n    pos = [i for i in range(len(values)) if not _is_na(values[i])]\n    order = _order([values[i] for i in pos], ascending)\n    ordered = [pos[j] for j in order]\n    out = [None] * len(values)\n    k = 0\n    while k < len(ordered):\n        j = k\n        while (j + 1 < len(ordered)\n               and values[ordered[j + 1]] == values[ordered[k]]):\n            j += 1\n        if method == \"min\":\n            r = k + 1\n        elif method == \"max\":\n            r = j + 1\n        elif method == \"first\":\n            r = None\n        elif method == \"dense\":\n            r = None\n        else:  # average\n            r = (k + 1 + j + 1) / 2.0\n        for t in range(k, j + 1):\n            if method == \"first\":\n                out[ordered[t]] = t + 1\n            elif method == \"dense\":\n                out[ordered[t]] = None  # filled below\n            else:\n                out[ordered[t]] = float(r)\n        k = j + 1\n    if method == \"dense\":\n        seen = []\n        for i in ordered:\n            if not seen or values[i] != seen[-1]:\n                seen.append(values[i])\n            out[i] = float(len(seen))\n    return out\n\n\nclass _Rolling:\n    \"\"\"Series.rolling(window) -- a fixed-size moving window.\"\"\"\n\n    def __init__(self, series, window, min_periods=None):\n        self._s = series\n        self._w = window\n        self._mp = window if min_periods is None else min_periods\n\n    def _roll(self, fn):\n        data = self._s._data\n        out = []\n        for i in range(len(data)):\n            if i + 1 < self._w:\n                win = data[:i + 1]\n            else:\n                win = data[i + 1 - self._w:i + 1]\n            vals = [v for v in win if not _is_na(v)]\n            if len(vals) < self._mp:\n                out.append(None)\n            else:\n                out.append(fn(vals))\n        return self._s._like(out)\n\n    def mean(self):\n        return self._roll(_mean_of)\n\n    def sum(self):\n        return self._roll(sum)\n\n    def min(self):\n        return self._roll(min)\n\n    def max(self):\n        return self._roll(max)\n\n    def std(self, ddof=1):\n        return self._roll(lambda v: _std_of(v, ddof))\n\n    def var(self, ddof=1):\n        return self._roll(lambda v: _var_of(v, ddof))\n\n    def count(self):\n        old = self._mp\n        self._mp = 0\n        out = self._roll(len)\n        self._mp = old\n        return out\n\n    def median(self):\n        return self._roll(lambda v: _quantile_of(sorted(v), 0.5))\n\n    def apply(self, fn):\n        return self._roll(fn)\n\n\n# ================================================================= Series\n\nclass Series:\n    \"\"\"A 1-D labelled column.  Mirrors the pandas API that Skulpt allows.\"\"\"\n\n    def __init__(self, data, name=None, index=None):\n        if isinstance(data, Series):\n            if index is None:\n                index = list(data._index)\n            if name is None:\n                name = data.name\n            data = list(data._data)\n        elif isinstance(data, dict):\n            keys = list(data.keys())\n            vals = [data[k] for k in keys]\n            if index is None:\n                index = keys\n            data = vals\n        self._data = list(data)\n        if index is None:\n            self._index = list(range(len(self._data)))\n        else:\n            self._index = list(index)\n        self.name = name\n        # When True __str__ prints \"label  value\" lines instead of a plain\n        # list.  Kept False for ordinary columns so that existing lessons\n        # that print a column keep their exact old output.\n        self._show_index = False\n\n    # ---- construction helper\n    def _like(self, data, index=None, show=None):\n        s = Series(data, name=self.name,\n                   index=self._index if index is None else index)\n        s._show_index = self._show_index if show is None else show\n        return s\n\n    # ---- basics\n    def __len__(self):\n        return len(self._data)\n\n    def __iter__(self):\n        return iter(self._data)\n\n    def __contains__(self, label):\n        return label in self._index\n\n    def __getitem__(self, k):\n        if isinstance(k, slice):\n            return Series(self._data[k], name=self.name, index=self._index[k])\n        if isinstance(k, Series) or isinstance(k, list):\n            mask = _as_mask(k, len(self._data))\n            if len(mask) == len(self._data) and _looks_boolean(\n                    k._data if isinstance(k, Series) else k):\n                d = []\n                ix = []\n                for i in range(len(self._data)):\n                    if mask[i]:\n                        d.append(self._data[i])\n                        ix.append(self._index[i])\n                return Series(d, name=self.name, index=ix)\n            labels = k._data if isinstance(k, Series) else k\n            d = []\n            ix = []\n            for lab in labels:\n                p = self._index.index(lab)\n                d.append(self._data[p])\n                ix.append(lab)\n            return Series(d, name=self.name, index=ix)\n        # Integer keys: label first (that is what pandas 3 does -- s[2024]\n        # on a year-indexed Series is a LABEL lookup), then fall back to the\n        # legacy positional rule so that df.sort_values(...)[\"col\"][0] keeps\n        # working when 0 is not one of the labels.\n        if isinstance(k, int) and not isinstance(k, bool):\n            if k in self._index:\n                return self._data[self._index.index(k)]\n            return self._data[k]\n        if k in self._index:\n            return self._data[self._index.index(k)]\n        raise KeyError(str(k))\n\n    def __setitem__(self, k, v):\n        if isinstance(k, int) and k not in self._index:\n            self._data[k] = v\n            return\n        if k in self._index:\n            self._data[self._index.index(k)] = v\n            return\n        self._data.append(v)\n        self._index.append(k)\n\n    @property\n    def index(self):\n        return list(self._index)\n\n    @property\n    def iloc(self):\n        return _SeriesILoc(self)\n\n    @property\n    def loc(self):\n        return _SeriesLoc(self)\n\n    @property\n    def dt(self):\n        \"\"\"Date parts of a datetime Series: .dt.year, .dt.day_name(), ...\"\"\"\n        return _DtAccessor(self)\n\n    @property\n    def values(self):\n        return list(self._data)\n\n    @property\n    def size(self):\n        return len(self._data)\n\n    @property\n    def shape(self):\n        return (len(self._data),)\n\n    @property\n    def empty(self):\n        return len(self._data) == 0\n\n    @property\n    def dtype(self):\n        for v in self._data:\n            if _is_na(v):\n                continue\n            if isinstance(v, bool):\n                return \"bool\"\n            if isinstance(v, int):\n                return \"int64\"\n            if isinstance(v, float):\n                return \"float64\"\n            return \"object\"\n        return \"object\"\n\n    def tolist(self):\n        return list(self._data)\n\n    def to_list(self):\n        return list(self._data)\n\n    def to_dict(self):\n        out = {}\n        for i in range(len(self._data)):\n            out[self._index[i]] = self._data[i]\n        return out\n\n    # dict-ish helpers (value_counts() used to return a dict)\n    def keys(self):\n        return list(self._index)\n\n    def items(self):\n        out = []\n        for i in range(len(self._data)):\n            out.append((self._index[i], self._data[i]))\n        return out\n\n    def get(self, label, default=None):\n        if label in self._index:\n            return self._data[self._index.index(label)]\n        return default\n\n    def copy(self):\n        return self._like(list(self._data), list(self._index))\n\n    def rename(self, name):\n        return Series(self._data, name=name, index=self._index)\n\n    def reset_index(self, drop=False):\n        if drop:\n            return Series(self._data, name=self.name)\n        cols = {}\n        cols[\"index\"] = list(self._index)\n        cols[self.name if self.name is not None else 0] = list(self._data)\n        return DataFrame(cols)\n\n    def head(self, n=5):\n        return Series(self._data[:n], name=self.name, index=self._index[:n])\n\n    def tail(self, n=5):\n        if n <= 0:\n            return Series([], name=self.name, index=[])\n        return Series(self._data[-n:], name=self.name, index=self._index[-n:])\n\n    # ---- comparisons -> boolean Series (the Skulpt-safe pandas bridge)\n    def _cmp(self, other, op):\n        other_vals = other._data if isinstance(other, Series) else None\n        out = []\n        for i in range(len(self._data)):\n            a = self._data[i]\n            b = other_vals[i] if other_vals is not None else other\n            if _is_na(a) or _is_na(b):\n                out.append(op == \"ne\")\n                continue\n            if op == \"gt\":\n                out.append(a > b)\n            elif op == \"lt\":\n                out.append(a < b)\n            elif op == \"ge\":\n                out.append(a >= b)\n            elif op == \"le\":\n                out.append(a <= b)\n            elif op == \"eq\":\n                out.append(a == b)\n            else:\n                out.append(a != b)\n        return Series(out, name=self.name, index=self._index)\n\n    def gt(self, other):\n        return self._cmp(other, \"gt\")\n\n    def lt(self, other):\n        return self._cmp(other, \"lt\")\n\n    def ge(self, other):\n        return self._cmp(other, \"ge\")\n\n    def le(self, other):\n        return self._cmp(other, \"le\")\n\n    def eq(self, other):\n        return self._cmp(other, \"eq\")\n\n    def ne(self, other):\n        return self._cmp(other, \"ne\")\n\n    # ---- boolean algebra (these DO return objects in Skulpt)\n    def _bool_op(self, other, op):\n        other_vals = other._data if isinstance(other, Series) else None\n        out = []\n        for i in range(len(self._data)):\n            a = self._data[i]\n            a = False if _is_na(a) else bool(a)\n            if other_vals is not None:\n                b = other_vals[i]\n                b = False if _is_na(b) else bool(b)\n            else:\n                b = False if _is_na(other) else bool(other)\n            if op == \"and\":\n                out.append(a and b)\n            elif op == \"or\":\n                out.append(a or b)\n            else:\n                out.append(a != b)\n        return Series(out, name=self.name, index=self._index)\n\n    def __and__(self, other):\n        return self._bool_op(other, \"and\")\n\n    def __or__(self, other):\n        return self._bool_op(other, \"or\")\n\n    def __xor__(self, other):\n        return self._bool_op(other, \"xor\")\n\n    def __rand__(self, other):\n        return self._bool_op(other, \"and\")\n\n    def __ror__(self, other):\n        return self._bool_op(other, \"or\")\n\n    def __invert__(self):\n        out = []\n        for v in self._data:\n            if _is_na(v):\n                out.append(True)\n            elif isinstance(v, bool):\n                out.append(not v)\n            else:\n                out.append(~v)\n        return Series(out, name=self.name, index=self._index)\n\n    # ---- arithmetic\n    def _arith(self, other, op, reverse=False):\n        other_vals = other._data if isinstance(other, Series) else None\n        out = []\n        for i in range(len(self._data)):\n            a = self._data[i]\n            b = other_vals[i] if other_vals is not None else other\n            if reverse:\n                a, b = b, a\n            if _is_na(a) or _is_na(b):\n                out.append(None)\n                continue\n            a = _num_of(a)\n            b = _num_of(b)\n            if op == \"+\":\n                out.append(a + b)\n            elif op == \"-\":\n                out.append(a - b)\n            elif op == \"*\":\n                out.append(a * b)\n            elif op == \"/\":\n                out.append(_safe_div(a * 1.0, b))\n            elif op == \"//\":\n                if b == 0:\n                    out.append(_nan())\n                else:\n                    out.append(a // b)\n            elif op == \"%\":\n                if b == 0:\n                    out.append(_nan())\n                else:\n                    out.append(a % b)\n            elif op == \"**\":\n                out.append(a ** b)\n        return Series(out, name=self.name, index=self._index)\n\n    def __add__(self, o):\n        return self._arith(o, \"+\")\n\n    def __radd__(self, o):\n        return self._arith(o, \"+\", True)\n\n    def __sub__(self, o):\n        return self._arith(o, \"-\")\n\n    def __rsub__(self, o):\n        return self._arith(o, \"-\", True)\n\n    def __mul__(self, o):\n        return self._arith(o, \"*\")\n\n    def __rmul__(self, o):\n        return self._arith(o, \"*\", True)\n\n    def __truediv__(self, o):\n        return self._arith(o, \"/\")\n\n    def __rtruediv__(self, o):\n        return self._arith(o, \"/\", True)\n\n    def __floordiv__(self, o):\n        return self._arith(o, \"//\")\n\n    def __rfloordiv__(self, o):\n        return self._arith(o, \"//\", True)\n\n    def __mod__(self, o):\n        return self._arith(o, \"%\")\n\n    def __rmod__(self, o):\n        return self._arith(o, \"%\", True)\n\n    def __pow__(self, o):\n        return self._arith(o, \"**\")\n\n    def __neg__(self):\n        return self._arith(-1, \"*\")\n\n    def add(self, o):\n        return self._arith(o, \"+\")\n\n    def sub(self, o):\n        return self._arith(o, \"-\")\n\n    def mul(self, o):\n        return self._arith(o, \"*\")\n\n    def div(self, o):\n        return self._arith(o, \"/\")\n\n    def truediv(self, o):\n        return self._arith(o, \"/\")\n\n    # ---- reductions\n    def _nums(self):\n        out = []\n        for v in self._data:\n            if _is_na(v):\n                continue\n            if _numeric(v):\n                out.append(_num_of(v))\n        return out\n\n    def sum(self):\n        return sum(self._nums())\n\n    def mean(self):\n        nums = self._nums()\n        if nums:\n            return sum(nums) / len(nums)\n        return 0\n\n    def median(self):\n        nums = self._nums()\n        if not nums:\n            return None\n        nums = sorted(nums)\n        return _quantile_of(nums, 0.5)\n\n    def std(self, ddof=1):\n        nums = self._nums()\n        if not nums:\n            return None\n        return _std_of(nums, ddof)\n\n    def var(self, ddof=1):\n        nums = self._nums()\n        if not nums:\n            return None\n        return _var_of(nums, ddof)\n\n    def quantile(self, q=0.5):\n        nums = sorted(self._nums())\n        if isinstance(q, list):\n            return Series([_quantile_of(nums, x) for x in q],\n                          name=self.name, index=list(q))\n        return _quantile_of(nums, q)\n\n    def max(self):\n        vals = [v for v in self._data if not _is_na(v)]\n        return max(vals) if vals else None\n\n    def min(self):\n        vals = [v for v in self._data if not _is_na(v)]\n        return min(vals) if vals else None\n\n    def prod(self):\n        tot = 1\n        for v in self._nums():\n            tot = tot * v\n        return tot\n\n    def count(self):\n        cnt = 0\n        for v in self._data:\n            if not _is_na(v):\n                cnt += 1\n        return cnt\n\n    def any(self):\n        for v in self._data:\n            if not _is_na(v) and v:\n                return True\n        return False\n\n    def all(self):\n        for v in self._data:\n            if _is_na(v) or not v:\n                return False\n        return True\n\n    def idxmax(self):\n        best = None\n        best_i = None\n        for i in range(len(self._data)):\n            v = self._data[i]\n            if _is_na(v):\n                continue\n            if best is None or v > best:\n                best = v\n                best_i = i\n        return None if best_i is None else self._index[best_i]\n\n    def idxmin(self):\n        best = None\n        best_i = None\n        for i in range(len(self._data)):\n            v = self._data[i]\n            if _is_na(v):\n                continue\n            if best is None or v < best:\n                best = v\n                best_i = i\n        return None if best_i is None else self._index[best_i]\n\n    def argmax(self):\n        m = self.idxmax()\n        return None if m is None else self._index.index(m)\n\n    # ---- element-wise transforms\n    def unique(self):\n        seen = []\n        for v in self._data:\n            if v not in seen:\n                seen.append(v)\n        return seen\n\n    def nunique(self, dropna=True):\n        seen = []\n        for v in self._data:\n            if dropna and _is_na(v):\n                continue\n            if v not in seen:\n                seen.append(v)\n        return len(seen)\n\n    def value_counts(self, dropna=True, normalize=False, ascending=False):\n        \"\"\"Returns a Series indexed by value (pandas).  NaN/None skipped.\"\"\"\n        counts = {}\n        order = []\n        for v in self._data:\n            if dropna and _is_na(v):\n                continue\n            if v in counts:\n                counts[v] += 1\n            else:\n                counts[v] = 1\n                order.append(v)\n        pairs = [(k, counts[k]) for k in order]\n        pairs.sort(key=lambda p: p[1], reverse=not ascending)\n        labels = [p[0] for p in pairs]\n        vals = [p[1] for p in pairs]\n        if normalize:\n            tot = sum(vals)\n            if tot:\n                vals = [v * 1.0 / tot for v in vals]\n        s = Series(vals, name=\"count\", index=labels)\n        s._show_index = True\n        return s\n\n    def isin(self, values):\n        if isinstance(values, Series):\n            values = values._data\n        return Series([v in values for v in self._data],\n                      name=self.name, index=self._index)\n\n    def between(self, left, right, inclusive=\"both\"):\n        out = []\n        for v in self._data:\n            if _is_na(v):\n                out.append(False)\n                continue\n            if inclusive == \"both\":\n                out.append(v >= left and v <= right)\n            elif inclusive == \"neither\":\n                out.append(v > left and v < right)\n            elif inclusive == \"left\":\n                out.append(v >= left and v < right)\n            else:\n                out.append(v > left and v <= right)\n        return Series(out, name=self.name, index=self._index)\n\n    def isna(self):\n        return Series([_is_na(v) for v in self._data],\n                      name=self.name, index=self._index)\n\n    def isnull(self):\n        return self.isna()\n\n    def notna(self):\n        return Series([not _is_na(v) for v in self._data],\n                      name=self.name, index=self._index)\n\n    def notnull(self):\n        return self.notna()\n\n    def fillna(self, value):\n        if isinstance(value, Series):\n            out = []\n            for i in range(len(self._data)):\n                v = self._data[i]\n                out.append(value.get(self._index[i]) if _is_na(v) else v)\n            return self._like(out)\n        return self._like([value if _is_na(v) else v for v in self._data])\n\n    def dropna(self):\n        d = []\n        ix = []\n        for i in range(len(self._data)):\n            if not _is_na(self._data[i]):\n                d.append(self._data[i])\n                ix.append(self._index[i])\n        return Series(d, name=self.name, index=ix)\n\n    def duplicated(self, keep=\"first\"):\n        seen = []\n        out = []\n        for v in self._data:\n            if v in seen:\n                out.append(True)\n            else:\n                seen.append(v)\n                out.append(False)\n        if keep == \"last\":\n            out = []\n            tail_seen = []\n            for v in self._data[::-1]:\n                if v in tail_seen:\n                    out.append(True)\n                else:\n                    tail_seen.append(v)\n                    out.append(False)\n            out = out[::-1]\n        return Series(out, name=self.name, index=self._index)\n\n    def drop_duplicates(self):\n        seen = []\n        d = []\n        ix = []\n        for i in range(len(self._data)):\n            v = self._data[i]\n            if v not in seen:\n                seen.append(v)\n                d.append(v)\n                ix.append(self._index[i])\n        return Series(d, name=self.name, index=ix)\n\n    def replace(self, old, new=None):\n        if isinstance(old, dict):\n            return self._like([old.get(v, v) for v in self._data])\n        if isinstance(old, list):\n            news = new if isinstance(new, list) else [new] * len(old)\n            out = []\n            for v in self._data:\n                if v in old:\n                    out.append(news[old.index(v)])\n                else:\n                    out.append(v)\n            return self._like(out)\n        return self._like([new if v == old else v for v in self._data])\n\n    def where(self, cond, other=None):\n        \"\"\"Keep value where cond is True, else `other` (pandas semantics).\"\"\"\n        mask = _as_mask(cond, len(self._data))\n        out = []\n        for i in range(len(self._data)):\n            out.append(self._data[i] if mask[i] else other)\n        return self._like(out)\n\n    def mask(self, cond, other=None):\n        mask = _as_mask(cond, len(self._data))\n        out = []\n        for i in range(len(self._data)):\n            out.append(other if mask[i] else self._data[i])\n        return self._like(out)\n\n    def clip(self, lower=None, upper=None):\n        out = []\n        for v in self._data:\n            if _is_na(v):\n                out.append(v)\n                continue\n            if lower is not None and v < lower:\n                v = lower\n            if upper is not None and v > upper:\n                v = upper\n            out.append(v)\n        return self._like(out)\n\n    def abs(self):\n        return self._like([v if _is_na(v) else abs(v) for v in self._data])\n\n    def round(self, n=0):\n        out = []\n        for v in self._data:\n            if _is_na(v) or not _numeric(v):\n                out.append(v)\n            else:\n                out.append(round(v, n))\n        return self._like(out)\n\n    def astype(self, dtype):\n        dt = _norm_dtype(dtype)\n        return self._like([_cast(v, dt) for v in self._data])\n\n    def apply(self, fn):\n        return self._like([fn(v) for v in self._data])\n\n    def map(self, mapping):\n        if isinstance(mapping, dict):\n            return self._like([mapping.get(v, v) for v in self._data])\n        if isinstance(mapping, Series):\n            return self._like([mapping.get(v) for v in self._data])\n        return self._like([mapping(v) for v in self._data])\n\n    def sort_values(self, ascending=True, na_position=\"last\"):\n        order = _order(self._data, ascending, na_position == \"last\")\n        return Series([self._data[i] for i in order], name=self.name,\n                      index=[self._index[i] for i in order])\n\n    def sort_index(self, ascending=True):\n        order = _order(self._index, ascending)\n        return Series([self._data[i] for i in order], name=self.name,\n                      index=[self._index[i] for i in order])\n\n    def nlargest(self, n=5):\n        s = self.dropna().sort_values(False)\n        out = Series(s._data[:n], name=self.name, index=s._index[:n])\n        out._show_index = True\n        return out\n\n    def nsmallest(self, n=5):\n        s = self.dropna().sort_values(True)\n        out = Series(s._data[:n], name=self.name, index=s._index[:n])\n        out._show_index = True\n        return out\n\n    def rank(self, method=\"average\", ascending=True, na_option=\"keep\"):\n        \"\"\"Rank the values (1 = smallest when ascending).  Ties share the\n        average of the positions they span, exactly like pandas.\"\"\"\n        return self._like(_rank_values(self._data, method, ascending))\n\n    def rolling(self, window, min_periods=None):\n        \"\"\"Fixed-size moving window.  Use .mean()/.sum()/.min()/.max()/\n        .std()/.count() on the result.\"\"\"\n        return _Rolling(self, window, min_periods)\n\n    def cumsum(self):\n        kinds = []\n        for v in self._data:\n            if _is_na(v):\n                continue\n            if _numeric(v):\n                kinds.append(\"num\")\n            elif isinstance(v, str):\n                kinds.append(\"str\")\n            else:\n                kinds.append(\"other\")\n        if \"other\" in kinds or (\"num\" in kinds and \"str\" in kinds):\n            raise TypeError(\n                \"cumsum() is not supported for this dtype \"\n                \"(column '\" + str(self.name) + \"' is not numeric)\")\n        if kinds and kinds[0] == \"str\":\n            out = []\n            acc = \"\"\n            for v in self._data:\n                if _is_na(v):\n                    out.append(None)\n                    continue\n                acc = acc + v\n                out.append(acc)\n            return self._like(out)\n        out = []\n        total = 0\n        for v in self._data:\n            if _is_na(v):\n                out.append(None)\n                continue\n            total += _num_of(v)\n            out.append(total)\n        return self._like(out)\n\n    def cumprod(self):\n        out = []\n        total = 1\n        for v in self._data:\n            if _is_na(v):\n                out.append(None)\n                continue\n            total = total * _num_of(v)\n            out.append(total)\n        return self._like(out)\n\n    def cummax(self):\n        out = []\n        best = None\n        for v in self._data:\n            if _is_na(v):\n                out.append(None)\n                continue\n            best = v if best is None or v > best else best\n            out.append(best)\n        return self._like(out)\n\n    def cummin(self):\n        out = []\n        best = None\n        for v in self._data:\n            if _is_na(v):\n                out.append(None)\n                continue\n            best = v if best is None or v < best else best\n            out.append(best)\n        return self._like(out)\n\n    def diff(self, periods=1):\n        out = []\n        for i in range(len(self._data)):\n            j = i - periods\n            if j < 0 or j >= len(self._data):\n                out.append(None)\n                continue\n            a = self._data[i]\n            b = self._data[j]\n            if _is_na(a) or _is_na(b):\n                out.append(None)\n            else:\n                out.append(_num_of(a) - _num_of(b))\n        return self._like(out)\n\n    def shift(self, periods=1):\n        n = len(self._data)\n        out = []\n        for i in range(n):\n            j = i - periods\n            if j < 0 or j >= n:\n                out.append(None)\n            else:\n                out.append(self._data[j])\n        return self._like(out)\n\n    def pct_change(self):\n        \"\"\"(cur-prev)/prev.  prev == 0 yields inf / -inf / nan, like pandas.\"\"\"\n        result = [None]\n        for i in range(1, len(self._data)):\n            prev = self._data[i - 1]\n            curr = self._data[i]\n            if _is_na(prev) or _is_na(curr) or not _numeric(prev) or not _numeric(curr):\n                result.append(None)\n                continue\n            prev = _num_of(prev)\n            curr = _num_of(curr)\n            result.append(_safe_div(curr - prev, prev))\n        return self._like(result)\n\n    def describe(self):\n        nums = sorted(self._nums())\n        if not nums:\n            labels = [\"count\", \"unique\", \"top\", \"freq\"]\n            vc = self.value_counts()\n            top = vc._index[0] if len(vc) else None\n            freq = vc._data[0] if len(vc) else None\n            s = Series([self.count(), self.nunique(), top, freq],\n                       name=self.name, index=labels)\n            s._show_index = True\n            return s\n        labels = [\"count\", \"mean\", \"std\", \"min\", \"25%\", \"50%\", \"75%\", \"max\"]\n        vals = [len(nums) * 1.0, sum(nums) * 1.0 / len(nums), _std_of(nums),\n                nums[0] * 1.0, _quantile_of(nums, 0.25), _quantile_of(nums, 0.5),\n                _quantile_of(nums, 0.75), nums[-1] * 1.0]\n        s = Series(vals, name=self.name, index=labels)\n        s._show_index = True\n        return s\n\n    def agg(self, how):\n        return _apply_agg(self._data, how, self.name)\n\n    def to_frame(self, name=None):\n        col = name if name is not None else (self.name if self.name is not None else 0)\n        df = DataFrame({col: list(self._data)})\n        df._index = list(self._index)\n        return df\n\n    # ---- rendering\n    def _render(self):\n        lines = []\n        n = len(self._data)\n        limit = min(n, 30)\n        width = 0\n        for i in range(limit):\n            w = len(_fmt(self._index[i]))\n            if w > width:\n                width = w\n        for i in range(limit):\n            lines.append(_fmt(self._index[i]).ljust(width) + \"    \" + _fmt(self._data[i]))\n        if n > limit:\n            lines.append(\"... (\" + str(n) + \" total)\")\n        if self.name is not None:\n            lines.append(\"Name: \" + str(self.name))\n        return \"\\n\".join(lines)\n\n    def __str__(self):\n        if self._show_index:\n            return self._render()\n        return str(self._data)\n\n    def __repr__(self):\n        if self._show_index:\n            return self._render()\n        return \"Series(\" + str(self._data) + \")\"\n\n\n# =============================================================== DataFrame\n\nclass DataFrame:\n    \"\"\"Minimal DataFrame implementation covering the common pandas ops.\"\"\"\n\n    def __init__(self, data=None, index=None, columns=None):\n        if data is None:\n            data = {}\n        if isinstance(data, DataFrame):\n            self._data = {}\n            for c in data._columns:\n                self._data[c] = list(data._data[c])\n            self._columns = list(data._columns)\n            self._nrows = data._nrows\n            self._index = list(data._index)\n            self._index_name = data._index_name\n            self._index_names = data._index_names\n            self._groupkeys = data._groupkeys\n            self._show_index = data._show_index\n            return\n        self._index_name = None\n        self._index_names = None\n        self._groupkeys = None\n        self._show_index = False\n        if isinstance(data, list):\n            if len(data) == 0:\n                self._data = {}\n                self._columns = []\n            elif isinstance(data[0], dict):\n                cols = []\n                for row in data:\n                    for k in row.keys():\n                        if k not in cols:\n                            cols.append(k)\n                self._columns = cols\n                self._data = {}\n                for col in self._columns:\n                    self._data[col] = [row.get(col) for row in data]\n            else:\n                # list of lists / scalars\n                if isinstance(data[0], (list, tuple)):\n                    width = len(data[0])\n                    self._columns = list(columns) if columns else list(range(width))\n                    self._data = {}\n                    for j in range(width):\n                        self._data[self._columns[j]] = [row[j] for row in data]\n                else:\n                    self._columns = list(columns) if columns else [0]\n                    self._data = {self._columns[0]: list(data)}\n        elif isinstance(data, Series):\n            name = data.name if data.name is not None else 0\n            self._columns = [name]\n            self._data = {name: list(data._data)}\n            if index is None:\n                index = list(data._index)\n        else:\n            self._data = {}\n            self._columns = []\n            for k in data.keys():\n                v = data[k]\n                if isinstance(v, Series):\n                    v = v._data\n                self._data[k] = list(v)\n                self._columns.append(k)\n        if self._data and self._columns:\n            self._nrows = len(self._data[self._columns[0]])\n        else:\n            self._nrows = 0\n        if columns is not None and not isinstance(data, list):\n            keep = {}\n            for c in columns:\n                keep[c] = self._data.get(c, [None] * self._nrows)\n            self._data = keep\n            self._columns = list(columns)\n        if index is not None:\n            self._index = list(index)\n        else:\n            self._index = list(range(self._nrows))\n\n    # ---- internal constructor keeping index metadata\n    def _new(self, data, columns, index, index_name=None, show_index=None):\n        df = DataFrame({})\n        df._data = data\n        df._columns = list(columns)\n        df._index = list(index)\n        df._nrows = len(index)\n        df._index_name = self._index_name if index_name is None else index_name\n        df._index_names = self._index_names if index_name is None else None\n        df._show_index = self._show_index if show_index is None else show_index\n        return df\n\n    def _take(self, indices):\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [self._data[c][i] for i in indices]\n        return self._new(new_data, self._columns,\n                         [self._index[i] for i in indices])\n\n    def _row_dict(self, i):\n        row = {}\n        for c in self._columns:\n            row[c] = self._data[c][i]\n        return row\n\n    # ---- properties\n    @property\n    def shape(self):\n        return (self._nrows, len(self._columns))\n\n    @property\n    def columns(self):\n        return list(self._columns)\n\n    @property\n    def index(self):\n        if self._index_names is not None and len(self._index_names) > 1:\n            return MultiIndex(self._index, self._index_names)\n        return list(self._index)\n\n    @property\n    def size(self):\n        return self._nrows * len(self._columns)\n\n    @property\n    def empty(self):\n        return self._nrows == 0\n\n    @property\n    def dtypes(self):\n        out = []\n        for c in self._columns:\n            out.append(Series(self._data[c]).dtype)\n        s = Series(out, index=list(self._columns))\n        s._show_index = True\n        return s\n\n    @property\n    def values(self):\n        \"\"\"List of rows (each row is a list of values).\"\"\"\n        result = []\n        for i in range(self._nrows):\n            row = []\n            for c in self._columns:\n                row.append(self._data[c][i])\n            result.append(row)\n        return result\n\n    @property\n    def loc(self):\n        return _Loc(self)\n\n    @property\n    def iloc(self):\n        return _ILoc(self)\n\n    @property\n    def at(self):\n        return _At(self)\n\n    @property\n    def iat(self):\n        return _IAt(self)\n\n    @property\n    def T(self):\n        return self.transpose()\n\n    def transpose(self):\n        new_data = {}\n        cols = []\n        for i in range(self._nrows):\n            lab = self._index[i]\n            cols.append(lab)\n            new_data[lab] = [self._data[c][i] for c in self._columns]\n        df = self._new(new_data, cols, list(self._columns), None, True)\n        return df\n\n    def copy(self):\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = list(self._data[c])\n        return self._new(new_data, self._columns, self._index)\n\n    def head(self, n=5):\n        return self._take(list(range(min(n, self._nrows))))\n\n    def tail(self, n=5):\n        if n <= 0:\n            return self._take([])\n        return self._take(list(range(max(0, self._nrows - n), self._nrows)))\n\n    def sample(self, n=1):\n        return self.head(n)\n\n    def __len__(self):\n        return self._nrows\n\n    def __iter__(self):\n        return iter(self._columns)\n\n    def __contains__(self, col):\n        return col in self._columns\n\n    def __getitem__(self, key):\n        if isinstance(key, str):\n            if key not in self._data:\n                raise KeyError(key)\n            return Series(self._data[key], name=key, index=self._index)\n        if isinstance(key, Series):\n            mask = _as_mask(key, self._nrows)\n            return self._take([i for i in range(self._nrows) if i < len(mask) and mask[i]])\n        if isinstance(key, slice):\n            idx = list(range(self._nrows))[key]\n            return self._take(idx)\n        if isinstance(key, list):\n            if len(key) == self._nrows and _looks_boolean(key):\n                return self._take([i for i in range(self._nrows) if key[i]])\n            new_data = {}\n            cols = []\n            for c in key:\n                if c in self._data:\n                    new_data[c] = list(self._data[c])\n                    cols.append(c)\n            return self._new(new_data, cols, self._index)\n        raise TypeError(\"Invalid key type\")\n\n    def __setitem__(self, key, value):\n        if isinstance(value, Series):\n            value = value._data\n        if isinstance(value, list):\n            if len(value) != self._nrows and self._nrows != 0:\n                raise ValueError(\"Length mismatch\")\n            if self._nrows == 0 and not self._columns:\n                self._nrows = len(value)\n                self._index = list(range(self._nrows))\n            self._data[key] = list(value)\n        else:\n            self._data[key] = [value] * self._nrows\n        if key not in self._columns:\n            self._columns.append(key)\n\n    def __delitem__(self, key):\n        if key in self._columns:\n            self._columns.remove(key)\n            del self._data[key]\n\n    def keys(self):\n        return list(self._columns)\n\n    def items(self):\n        out = []\n        for c in self._columns:\n            out.append((c, Series(self._data[c], name=c, index=self._index)))\n        return out\n\n    def iterrows(self):\n        out = []\n        for i in range(self._nrows):\n            s = Series([self._data[c][i] for c in self._columns],\n                       name=self._index[i], index=list(self._columns))\n            s._show_index = True\n            out.append((self._index[i], s))\n        return out\n\n    def itertuples(self):\n        out = []\n        for i in range(self._nrows):\n            out.append(tuple([self._index[i]] +\n                             [self._data[c][i] for c in self._columns]))\n        return out\n\n    # ---- sorting\n    def sort_values(self, by, ascending=True, na_position=\"last\"):\n        by_list = by if isinstance(by, list) else [by]\n        asc_list = ascending if isinstance(ascending, list) else [ascending] * len(by_list)\n        indices = list(range(self._nrows))\n        k = len(by_list) - 1\n        while k >= 0:\n            col = by_list[k]\n            vals = self._data[col]\n            sub = [indices[j] for j in _order([vals[i] for i in indices],\n                                              asc_list[k], na_position == \"last\")]\n            indices = sub\n            k -= 1\n        return self._take(indices)\n\n    def sort_index(self, ascending=True):\n        order = _order(self._index, ascending)\n        return self._take(order)\n\n    def nlargest(self, n, columns):\n        col = columns[0] if isinstance(columns, list) else columns\n        return self.sort_values(col, False).head(n)\n\n    def nsmallest(self, n, columns):\n        col = columns[0] if isinstance(columns, list) else columns\n        return self.sort_values(col, True).head(n)\n\n    # ---- filtering\n    def filter(self, col=None, op=None, value=None, items=None):\n        \"\"\"LEGACY (not pandas): df.filter('age', '>', 18).\n\n        The pandas-standard spelling for the same thing is\n        df[df['age'].gt(18)].  `items=` selects columns like pandas does.\n        \"\"\"\n        if items is not None:\n            return self[list(items)]\n        mask = []\n        col_data = self._data[col]\n        for v in col_data:\n            if _is_na(v):\n                mask.append(False)\n                continue\n            if op == \">\":\n                mask.append(v > value)\n            elif op == \"<\":\n                mask.append(v < value)\n            elif op == \">=\":\n                mask.append(v >= value)\n            elif op == \"<=\":\n                mask.append(v <= value)\n            elif op == \"==\":\n                mask.append(v == value)\n            elif op == \"!=\":\n                mask.append(v != value)\n            elif op == \"in\":\n                if isinstance(value, list):\n                    mask.append(v in value)\n                else:\n                    mask.append(False)\n            else:\n                raise ValueError(\"Unknown operator: \" + str(op))\n        return self._take([i for i in range(self._nrows) if mask[i]])\n\n    def where(self, fn, other=None):\n        \"\"\"LEGACY when given a function: df.where(lambda row: row['a'] > 1)\n        keeps matching rows.  With a boolean mask it behaves like pandas and\n        replaces non-matching cells with `other`.\"\"\"\n        if isinstance(fn, (Series, list, DataFrame)):\n            if isinstance(fn, DataFrame):\n                new_data = {}\n                for c in self._columns:\n                    m = fn._data.get(c, [False] * self._nrows)\n                    new_data[c] = [self._data[c][i] if m[i] else other\n                                   for i in range(self._nrows)]\n                return self._new(new_data, self._columns, self._index)\n            mask = _as_mask(fn, self._nrows)\n            new_data = {}\n            for c in self._columns:\n                new_data[c] = [self._data[c][i] if mask[i] else other\n                               for i in range(self._nrows)]\n            return self._new(new_data, self._columns, self._index)\n        keep = []\n        for i in range(self._nrows):\n            if fn(self._row_dict(i)):\n                keep.append(i)\n        return self._take(keep)\n\n    def query(self, expr):\n        \"\"\"Simple query parser: comparisons, and/or/not, in, ==, !=, <, >.\"\"\"\n        mask = []\n        for i in range(self._nrows):\n            mask.append(_eval_query(expr, self._row_dict(i)))\n        return self._take([i for i in range(self._nrows) if mask[i]])\n\n    def apply(self, fn, axis=0):\n        \"\"\"axis=0: per column (returns Series).  axis=1: per row.\"\"\"\n        if axis == 1:\n            result = []\n            for i in range(self._nrows):\n                result.append(fn(self._row_dict(i)))\n            return Series(result, index=self._index)\n        result = []\n        for c in self._columns:\n            result.append(fn(self._data[c]))\n        s = Series(result, index=list(self._columns))\n        s._show_index = True\n        return s\n\n    def applymap(self, fn):\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [fn(v) for v in self._data[c]]\n        return self._new(new_data, self._columns, self._index)\n\n    # ---- reductions (return a Series indexed by column, like pandas)\n    def _reduce(self, fn, numeric_only=True):\n        labels = []\n        vals = []\n        for c in self._columns:\n            col = self._data[c]\n            if numeric_only:\n                nums = []\n                skip = False\n                for v in col:\n                    if _is_na(v):\n                        continue\n                    if _numeric(v):\n                        nums.append(_num_of(v))\n                    else:\n                        skip = True\n                        break\n                if skip or not nums:\n                    continue\n                labels.append(c)\n                vals.append(fn(nums))\n            else:\n                labels.append(c)\n                vals.append(fn(col))\n        s = Series(vals, index=labels)\n        s._show_index = True\n        return s\n\n    def sum(self):\n        return self._reduce(sum)\n\n    def mean(self):\n        return self._reduce(lambda v: sum(v) / len(v))\n\n    def median(self):\n        return self._reduce(lambda v: _quantile_of(sorted(v), 0.5))\n\n    def std(self, ddof=1):\n        return self._reduce(lambda v: _std_of(v, ddof))\n\n    def var(self, ddof=1):\n        return self._reduce(lambda v: _var_of(v, ddof))\n\n    def quantile(self, q=0.5):\n        return self._reduce(lambda v: _quantile_of(sorted(v), q))\n\n    def min(self):\n        return self._minmax(True)\n\n    def max(self):\n        return self._minmax(False)\n\n    def _minmax(self, want_min):\n        labels = []\n        vals = []\n        for c in self._columns:\n            good = [v for v in self._data[c] if not _is_na(v)]\n            if not good:\n                continue\n            labels.append(c)\n            vals.append(min(good) if want_min else max(good))\n        s = Series(vals, index=labels)\n        s._show_index = True\n        return s\n\n    def count(self):\n        \"\"\"Non-null count per column.\"\"\"\n        labels = []\n        vals = []\n        for c in self._columns:\n            cnt = 0\n            for v in self._data[c]:\n                if not _is_na(v):\n                    cnt += 1\n            labels.append(c)\n            vals.append(cnt)\n        s = Series(vals, index=labels)\n        s._show_index = True\n        return s\n\n    def nunique(self):\n        labels = []\n        vals = []\n        for c in self._columns:\n            seen = []\n            for v in self._data[c]:\n                if v not in seen:\n                    seen.append(v)\n            labels.append(c)\n            vals.append(len(seen))\n        s = Series(vals, index=labels)\n        s._show_index = True\n        return s\n\n    def idxmax(self, col=None):\n        if col is not None:\n            return self[col].idxmax()\n        labels = []\n        vals = []\n        for c in self._columns:\n            s = Series(self._data[c], name=c, index=self._index)\n            if not s._nums():\n                continue\n            labels.append(c)\n            vals.append(s.idxmax())\n        out = Series(vals, index=labels)\n        out._show_index = True\n        return out\n\n    def idxmin(self, col=None):\n        if col is not None:\n            return self[col].idxmin()\n        labels = []\n        vals = []\n        for c in self._columns:\n            s = Series(self._data[c], name=c, index=self._index)\n            if not s._nums():\n                continue\n            labels.append(c)\n            vals.append(s.idxmin())\n        out = Series(vals, index=labels)\n        out._show_index = True\n        return out\n\n    def describe(self):\n        \"\"\"DataFrame with rows count/mean/std/min/25%/50%/75%/max (pandas).\"\"\"\n        labels = [\"count\", \"mean\", \"std\", \"min\", \"25%\", \"50%\", \"75%\", \"max\"]\n        new_data = {}\n        cols = []\n        for c in self._columns:\n            nums = []\n            ok = True\n            for v in self._data[c]:\n                if _is_na(v):\n                    continue\n                if _numeric(v):\n                    nums.append(_num_of(v))\n                else:\n                    ok = False\n                    break\n            if not ok or not nums:\n                continue\n            nums = sorted(nums)\n            cols.append(c)\n            new_data[c] = [\n                len(nums) * 1.0,\n                sum(nums) * 1.0 / len(nums),\n                _std_of(nums),\n                nums[0] * 1.0,\n                _quantile_of(nums, 0.25),\n                _quantile_of(nums, 0.5),\n                _quantile_of(nums, 0.75),\n                nums[-1] * 1.0,\n            ]\n        df = self._new(new_data, cols, labels, None, True)\n        return df\n\n    def to_dict(self, orient=\"list\"):\n        if orient == \"records\":\n            return [self._row_dict(i) for i in range(self._nrows)]\n        out = {}\n        for c in self._columns:\n            out[c] = list(self._data[c])\n        return out\n\n    # ---- cleaning\n    def drop(self, columns=None, index=None, labels=None, axis=0):\n        if labels is not None:\n            if axis == 1:\n                columns = labels\n            else:\n                index = labels\n        if columns is not None:\n            drop_cols = columns if isinstance(columns, list) else [columns]\n            new_data = {}\n            new_cols = []\n            for c in self._columns:\n                if c not in drop_cols:\n                    new_data[c] = list(self._data[c])\n                    new_cols.append(c)\n            return self._new(new_data, new_cols, self._index)\n        if index is not None:\n            drop_ix = index if isinstance(index, list) else [index]\n            keep = [i for i in range(self._nrows) if self._index[i] not in drop_ix]\n            return self._take(keep)\n        return self.copy()\n\n    def duplicated(self, subset=None, keep=\"first\"):\n        cols = subset if subset is not None else self._columns\n        if not isinstance(cols, list):\n            cols = [cols]\n        seen = []\n        out = []\n        for i in range(self._nrows):\n            key = tuple([self._data[c][i] for c in cols])\n            if key in seen:\n                out.append(True)\n            else:\n                seen.append(key)\n                out.append(False)\n        return Series(out, index=self._index)\n\n    def drop_duplicates(self, subset=None):\n        dup = self.duplicated(subset)._data\n        return self._take([i for i in range(self._nrows) if not dup[i]])\n\n    def isna(self):\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [_is_na(v) for v in self._data[c]]\n        return self._new(new_data, self._columns, self._index)\n\n    def isnull(self):\n        return self.isna()\n\n    def notna(self):\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [not _is_na(v) for v in self._data[c]]\n        return self._new(new_data, self._columns, self._index)\n\n    def fillna(self, value):\n        \"\"\"Scalar, or dict / Series of per-column fill values (pandas).\"\"\"\n        per_col = None\n        if isinstance(value, dict):\n            per_col = value\n        elif isinstance(value, Series):\n            per_col = value.to_dict()\n        new_data = {}\n        for c in self._columns:\n            if per_col is not None:\n                if c not in per_col:\n                    new_data[c] = list(self._data[c])\n                    continue\n                fill = per_col[c]\n            else:\n                fill = value\n            new_data[c] = [fill if _is_na(v) else v for v in self._data[c]]\n        return self._new(new_data, self._columns, self._index)\n\n    def dropna(self, subset=None, how=\"any\"):\n        cols = subset if subset is not None else self._columns\n        if not isinstance(cols, list):\n            cols = [cols]\n        keep = []\n        for i in range(self._nrows):\n            nas = 0\n            for c in cols:\n                if _is_na(self._data[c][i]):\n                    nas += 1\n            if how == \"all\":\n                if nas < len(cols):\n                    keep.append(i)\n            else:\n                if nas == 0:\n                    keep.append(i)\n        return self._take(keep)\n\n    def replace(self, old, new=None):\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = Series(self._data[c]).replace(old, new)._data\n        return self._new(new_data, self._columns, self._index)\n\n    def rename(self, columns=None, index=None):\n        if columns is None:\n            columns = {}\n        new_data = {}\n        new_cols = []\n        for c in self._columns:\n            new_name = columns.get(c, c)\n            new_data[new_name] = list(self._data[c])\n            new_cols.append(new_name)\n        df = self._new(new_data, new_cols, self._index)\n        if index is not None:\n            df._index = [index.get(x, x) for x in df._index]\n        return df\n\n    def astype(self, arg=None, dtype=None):\n        \"\"\"pandas: df.astype('int64') / df.astype({'col': int}).\n        LEGACY also supported: df.astype('col', int).\"\"\"\n        if isinstance(arg, dict):\n            new_data = {}\n            for c in self._columns:\n                if c in arg:\n                    dt = _norm_dtype(arg[c])\n                    new_data[c] = [_cast(v, dt) for v in self._data[c]]\n                else:\n                    new_data[c] = list(self._data[c])\n            return self._new(new_data, self._columns, self._index)\n        if dtype is not None and isinstance(arg, str) and arg in self._data:\n            dt = _norm_dtype(dtype)\n            new_data = {}\n            for c in self._columns:\n                if c == arg:\n                    new_data[c] = [_cast(v, dt) for v in self._data[c]]\n                else:\n                    new_data[c] = list(self._data[c])\n            return self._new(new_data, self._columns, self._index)\n        dt = _norm_dtype(arg)\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [_cast(v, dt) for v in self._data[c]]\n        return self._new(new_data, self._columns, self._index)\n\n    def clip(self, *args, **kw):\n        \"\"\"pandas: df.clip(lower, upper).\n        LEGACY also supported: df.clip('col', lower=..., upper=...).\"\"\"\n        target = kw.get(\"col\")\n        lower = kw.get(\"lower\")\n        upper = kw.get(\"upper\")\n        rest = list(args)\n        if rest and isinstance(rest[0], str) and rest[0] in self._data:\n            target = rest[0]\n            rest = rest[1:]\n        if len(rest) >= 1 and lower is None:\n            lower = rest[0]\n        if len(rest) >= 2 and upper is None:\n            upper = rest[1]\n        new_data = {}\n        for c in self._columns:\n            if target is not None and c != target:\n                new_data[c] = list(self._data[c])\n                continue\n            vals = []\n            skip = False\n            for v in self._data[c]:\n                if _is_na(v) or not _numeric(v):\n                    if not _is_na(v):\n                        skip = True\n                        break\n                    vals.append(v)\n                    continue\n                if lower is not None and v < lower:\n                    v = lower\n                if upper is not None and v > upper:\n                    v = upper\n                vals.append(v)\n            new_data[c] = list(self._data[c]) if skip else vals\n        return self._new(new_data, self._columns, self._index)\n\n    def round(self, n=0):\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = Series(self._data[c]).round(n)._data\n        return self._new(new_data, self._columns, self._index)\n\n    def abs(self):\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = Series(self._data[c]).abs()._data\n        return self._new(new_data, self._columns, self._index)\n\n    def cumsum(self):\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = Series(self._data[c], name=c).cumsum()._data\n        return self._new(new_data, self._columns, self._index)\n\n    # ---- grouping\n    def groupby(self, by, sort=False):\n        return GroupBy(self, by, sort)\n\n    def melt(self, id_vars=None, value_vars=None, var_name=None,\n             value_name=\"value\"):\n        \"\"\"Wide -> long.  Columns not listed in id_vars become rows.\"\"\"\n        if id_vars is None:\n            id_vars = []\n        elif not isinstance(id_vars, list):\n            id_vars = [id_vars]\n        if value_vars is None:\n            value_vars = [c for c in self._columns if c not in id_vars]\n        elif not isinstance(value_vars, list):\n            value_vars = [value_vars]\n        if var_name is None:\n            var_name = self._index_name if self._index_name else \"variable\"\n        new_data = {}\n        for c in id_vars:\n            new_data[c] = []\n        new_data[var_name] = []\n        new_data[value_name] = []\n        for v in value_vars:\n            for i in range(self._nrows):\n                for c in id_vars:\n
