<style>
  :root {

    --text: #f8fafc; --text2: #aab; --text3: #888fa6;
    --cyan: #00d4c8; --green: #00e5a0; --gold: #ffd700; --orange: #ff8800;
    --purple: #8b5cf6; --pink: #ec4899; --red: #ef4444;
    --easy: #10b981; --medium: #f59e0b; --hard: #ef4444;
    --panda: #8b5cf6;
  ;--tc1:#0a0d1f;--tc2:#f8fafc;--tc3:#121530;--tc4:#2a2f5c;--tc5:#8b5cf6;--tc6:#6b21a8;--tc7:#2a1f0a;--tc8:#4a3a1f;--tc9:#ffd700;--tc10:#ffd700;--tc11:rgba(239,68,68,0.1);--tc12:#ef4444;--tc13:rgba(239,68,68,0.3);--tc14:#aab;--tc15:#10b981;--tc16:#f59e0b;--tc17:#252a52;--tc18:#353a6b;--tc19:#10b981;--tc20:#10b981;--tc21:#000;--tc22:#ef4444;--tc23:#1a1f3a;--tc24:rgba(16,185,129,0.18);--tc25:rgba(245,158,11,0.18);--tc26:rgba(239,68,68,0.18);--tc27:rgba(255,215,0,0.2);--tc28:rgba(255,136,0,0.15);--tc29:rgba(255,215,0,0.4);--tc30:rgba(139,92,246,0.06);--tc31:#8b5cf6;--tc32:rgba(139,92,246,0.2);--tc33:#c4b5fd;--tc34:#00d4c8;--tc35:#888fa6;--tc36:#e0e6ff;--tc37:#ff6b6b;--tc38:rgba(0,229,160,0.15);--tc39:rgba(139,92,246,0.15);--tc40:#00e5a0;--tc41:#00e5a0;--tc42:rgba(255,176,32,0.1);--tc43:#ff8800;--tc44:rgba(255,176,32,0.3);--tc45:rgba(255,215,0,0.08);--tc46:rgba(255,136,0,0.04);--tc47:rgba(255,215,0,0.2);--tc48:rgba(255,215,0,0.15);--tc49:rgba(255,215,0,0.3);--tc50:rgba(255,215,0,0.25);--tc51:rgba(0,212,200,.07);--tc52:rgba(0,212,200,.26);--tc53:rgba(0,0,0,.3);--tc54:rgba(0,0,0,.32)}
  * { box-sizing: border-box; }
  body {
    margin: 0;
  -webkit-tap-highlight-color: rgba(0,212,200,0.2);
  -webkit-text-size-adjust: 100%;
    font-family: -apple-system, "Heebo", "Segoe UI", Roboto, sans-serif;
    background: var(--tc1); color: var(--tc2);
    direction: rtl; line-height: 1.5;
  }

  .topbar {
    background: var(--tc3);
    border-bottom: 1px solid var(--tc4);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .home-btn {
    background: linear-gradient(135deg, var(--tc5), var(--tc6));
    color: #fff;
    padding: 7px 12px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 700;
    font-size: 12.5px;
  }
  .score-pill {
    margin-inline-start: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, var(--tc7), var(--tc8));
    border: 1.5px solid var(--tc9);
    padding: 5px 12px;
    border-radius: 14px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--tc10);
  }
  .reset-score-btn {
    background: var(--tc11);
    color: var(--tc12);
    border: 1px solid var(--tc13);
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
  }

  .progress-strip {
    background: var(--tc3);
    padding: 8px 14px;
    border-bottom: 1px solid var(--tc4);
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 11.5px;
  }
  .progress-stat {
    display: flex; align-items: center; gap: 4px; color: var(--tc14);
  }
  .progress-stat .val { font-weight: 700; }
  .progress-stat.easy .val { color: var(--tc15); }
  .progress-stat.medium .val { color: var(--tc16); }
  .progress-stat.hard .val { color: var(--tc12); }
  .progress-bar-wrap {
    flex: 1; height: 6px; background: var(--tc1);
    border-radius: 3px; overflow: hidden; margin-inline-start: 8px;
  }
  .progress-bar-fill {
    height: 100%; background: linear-gradient(90deg, #8b5cf6, #00d4c8);
    transition: width .5s;
  }

  .filter-bar {
    background: var(--tc3);
    border-bottom: 1px solid var(--tc4);
    padding: 8px 14px;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .filter-bar::-webkit-scrollbar { height: 0; }
  .filter-pill {
    padding: 6px 12px;
    background: var(--tc17);
    border: 1px solid var(--tc18);
    border-radius: 14px;
    color: var(--tc14);
    font-size: 11.5px;
    cursor: pointer;
    font-family: inherit;
    flex-shrink: 0;
  }
  .filter-pill.active {
    background: var(--tc5); color: #fff; border-color: var(--tc5); font-weight: 700;
  }
  .filter-pill.diff-easy.active { background: var(--tc19); border-color: var(--tc20); color: var(--tc21); }
  .filter-pill.diff-medium.active { background: #f59e0b; border-color: #f59e0b; color: #000; }
  .filter-pill.diff-hard.active { background: var(--tc22); border-color: var(--tc22); color: #fff; }
  .filter-search {
    flex: 1; min-width: 130px;
    padding: 6px 12px;
    background: var(--tc17);
    border: 1px solid var(--tc18);
    border-radius: 14px;
    color: var(--tc2);
    font-size: 12px;
    font-family: inherit;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 14px;
  }

  .question-card {
    background: var(--tc23);
    border: 1px solid var(--tc4);
    border-radius: 12px;
    padding: 14px;
  }
  
  .q-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--tc4);
    flex-wrap: wrap;
  }
  .q-num {
    background: linear-gradient(135deg, var(--tc5), var(--tc6));
    color: #fff;
    padding: 4px 12px;
    border-radius: 8px;
    font-weight: 800;
    font-size: 14px;
  }
  .q-topic { flex: 1; font-size: 13px; color: var(--tc2); font-weight: 600; }
  .q-badges { display: flex; gap: 5px; flex-wrap: wrap; }
  .badge {
    padding: 3px 9px;
    border-radius: 10px;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .badge-diff-easy { background: var(--tc24); color: var(--tc15); }
  .badge-diff-medium { background: var(--tc25); color: var(--tc16); }
  .badge-diff-hard { background: var(--tc26); color: var(--tc12); }
  .badge-points {
    background: linear-gradient(135deg, var(--tc27), var(--tc28));
    color: var(--tc10);
    border: 1px solid var(--tc29);
  }
  .badge-earned {
    background: linear-gradient(135deg, #00e5a0, #00a884);
    color: #000;
  }

  .question-text {
    background: var(--tc30);
    border-inline-start: 3px solid var(--tc31);
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14.5px;
    line-height: 1.75;
    margin-bottom: 14px;
  }
  .question-text code {
    background: var(--tc32);
    color: var(--tc33);
    padding: 2px 8px;
    border-radius: 4px;
    font-family: "SF Mono", Monaco, Menlo, monospace;
    font-size: 12.5px;
  }
  .question-text b { color: var(--tc34); }

  .editor-label {
    font-size: 11.5px;
    color: var(--tc35);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 6px;
    font-weight: 700;
  }
  .code-editor {
    width: 100%;
    background: var(--tc1);
    color: var(--tc36);
    border: 1px solid var(--tc18);
    border-radius: 8px;
    padding: 12px;
    font-family: "SF Mono", Monaco, Menlo, "Courier New", monospace;
    font-size: 14px;
    direction: ltr;
    text-align: left;
    resize: vertical;
    line-height: 1.6;
    min-height: 140px;
    tab-size: 4;
    user-select: text;
    -webkit-user-select: text;
    -webkit-touch-callout: default;
  }
  .code-editor:focus { outline: none; border-color: var(--tc31); }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: transform .15s;
  }
  .btn:hover, .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.6; cursor: wait; }
  .btn-run { background: linear-gradient(135deg, #00e5a0, #00a884); color: #000; }
  .btn-solution { background: linear-gradient(135deg, #ffd700, #ff8800); color: #1a1a2e; }
  .btn-reset { background: var(--tc11); color: var(--tc12); border: 1px solid var(--tc13); }

  .output-section { margin-top: 12px; display: none; }
  .output-section.show { display: block; }
  .output-box {
    background: var(--tc1);
    border: 1px solid var(--tc4);
    border-radius: 8px;
    padding: 12px;
    font-family: "SF Mono", Monaco, Menlo, monospace;
    font-size: 13px;
    color: var(--tc36);
    white-space: pre-wrap;
    direction: ltr;
    text-align: left;
    max-height: 280px;
    overflow-y: auto;
    min-height: 40px;
  }
  .output-box.error { color: var(--tc37); }

  .verdict {
    margin-top: 10px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    display: none;
  }
  .verdict.show { display: block; animation: pop .4s ease; }
  @keyframes pop {
    0% { transform: scale(0.9); opacity: 0; }
    60% { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
  }
  .verdict.success {
    background: linear-gradient(135deg, var(--tc38), var(--tc39));
    color: var(--tc40);
    border: 2px solid var(--tc41);
  }
  .verdict.fail {
    background: var(--tc42);
    color: var(--tc43);
    border: 1px solid var(--tc44);
  }
  .verdict .points-earned {
    display: block;
    font-size: 22px;
    margin: 4px 0;
    color: var(--tc10);
  }

  .solution-section {
    margin-top: 18px;
    background: linear-gradient(135deg, var(--tc45), var(--tc46));
    border: 2px solid var(--tc29);
    border-radius: 12px;
    padding: 16px;
    display: none;
  }
  .solution-section.show { display: block; animation: slide-in .4s ease; }
  @keyframes slide-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .solution-warning {
    background: var(--tc11);
    border: 1px solid var(--tc13);
    color: var(--tc12);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    margin-bottom: 12px;
  }
  .solution-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--tc47);
  }
  .solution-header h3 { margin: 0; font-size: 17px; color: var(--tc10); }
  .copy-btn {
    margin-inline-start: auto;
    background: var(--tc48);
    color: var(--tc10);
    border: 1px solid var(--tc49);
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 11.5px;
    cursor: pointer;
    font-family: inherit;
  }
  .solution-code {
    background: var(--tc1);
    border: 1px solid var(--tc50);
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
  }
  .solution-code pre {
    margin: 0;
    color: var(--tc10);
    font-family: "SF Mono", Monaco, Menlo, monospace;
    font-size: 13.5px;
    direction: ltr;
    text-align: left;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .nav-row {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    justify-content: space-between;
  }
  .nav-btn {
    background: var(--tc17);
    color: var(--tc2);
    border: 1px solid var(--tc18);
    padding: 9px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
  }
  .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .confetti {
    position: fixed;
    top: -10px;
    width: 8px;
    height: 8px;
    pointer-events: none;
    z-index: 999;
  }

  @media (max-width: 480px) {
    .container { padding: 10px; }
    .question-card { padding: 11px; }
    .q-num { font-size: 13px; padding: 3px 10px; }
    .q-topic { font-size: 12px; }
    .badge { font-size: 11px; padding: 2px 7px; }
    .question-text { font-size: 13.5px; padding: 10px 13px; }
    .code-editor { font-size: 13px; padding: 10px; min-height: 110px; }
    .btn { padding: 9px 14px; font-size: 12.5px; }
    .solution-code pre { font-size: 12px; }
    .progress-strip { flex-wrap: wrap; gap: 6px; }
    .score-pill { padding: 4px 10px; font-size: 11px; }
  }

  /* === CODE EDITOR TOOLBAR === */
  .editor-wrap {
    position: relative;
  }
  .editor-toolbar {
    display: flex;
    gap: 4px;
    padding: 6px;
    background: var(--tc17);
    border: 1px solid var(--tc18);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    flex-wrap: wrap;
  }
  .editor-toolbar .tb-btn {
    background: var(--tc23);
    color: var(--tc14);
    border: 1px solid var(--tc18);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    -webkit-tap-highlight-color: rgba(0,212,200,0.2);
  }
  .editor-toolbar .tb-btn:hover, .editor-toolbar .tb-btn:active {
    background: #00d4c8;
    color: #000;
    border-color: #00d4c8;
  }
  .editor-toolbar .tb-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .editor-toolbar .tb-btn.copied {
    background: #00e5a0;
    color: #000;
    border-color: #00e5a0;
  }
  .editor-wrap .code-editor {
    border-radius: 0 0 8px 8px !important;
    border-top: none !important;
  }
  
  @media (max-width: 480px) {
    .editor-toolbar { padding: 5px; gap: 3px; }
    .editor-toolbar .tb-btn { padding: 5px 8px; font-size: 11px; }
  }

<div class="topbar">
  <a href="index.html" class="home-btn">🏠 דף הבית</a>
  <button class="reset-score-btn" id="reset-score-btn">🔄 איפוס</button>
  <div class="score-pill">
    🐼 <span id="total-score">0</span> / <span id="max-score">2000</span>
  </div>
</div>

<div class="progress-strip">
  <div class="progress-stat easy">🟢 <span class="val" id="easy-done">0</span>/30</div>
  <div class="progress-stat medium">🟡 <span class="val" id="medium-done">0</span>/50</div>
  <div class="progress-stat hard">🔴 <span class="val" id="hard-done">0</span>/20</div>
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
</div>

<div class="filter-bar">
  <button class="filter-pill active" data-filter-type="diff" data-filter="all">הכל (100)</button>
  <button class="filter-pill diff-easy" data-filter-type="diff" data-filter="easy">🟢 קל (30)</button>
  <button class="filter-pill diff-medium" data-filter-type="diff" data-filter="medium">🟡 בינוני (50)</button>

\n            return Series(self._data[key], name=key)\n        if isinstance(key, list):\n            # Boolean mask?\n            if len(key) == self._nrows and len(key) > 0 and isinstance(key[0], bool):\n                new_data = {}\n                for c in self._columns:\n                    new_data[c] = []\n                    for i in range(self._nrows):\n                        if key[i]:\n                            new_data[c].append(self._data[c][i])\n                return DataFrame(new_data)\n            # Column selection\n            new_data = {}\n            for c in key:\n                if c in self._data:\n                    new_data[c] = self._data[c]\n            return DataFrame(new_data)\n        raise TypeError(\"Invalid key type\")\n    \n    def __setitem__(self, key, value):\n        if isinstance(value, Series):\n            value = value._data\n        if isinstance(value, list):\n            if len(value) != self._nrows:\n                raise ValueError(\"Length mismatch\")\n            self._data[key] = list(value)\n        else:\n            self._data[key] = [value] * self._nrows\n        if key not in self._columns:\n            self._columns.append(key)\n    \n    def sort_values(self, by, ascending=True):\n        col_data = self._data[by]\n        indices = list(range(self._nrows))\n        # Handle None values - put at end\n        def sort_key(i):\n            v = col_data[i]\n            if v is None:\n                return (1, 0) if ascending else (0, 0)\n            return (0, v)\n        indices.sort(key=sort_key, reverse=not ascending)\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [self._data[c][i] for i in indices]\n        return DataFrame(new_data)\n    \n    def filter(self, col, op, value):\n        \"\"\"SQL-like filter: df.filter('age', '>', 18)\"\"\"\n        mask = []\n        col_data = self._data[col]\n        for v in col_data:\n            if v is None:\n                mask.append(False); continue\n            if op == \">\": mask.append(v > value)\n            elif op == \"<\": mask.append(v < value)\n            elif op == \">=\": mask.append(v >= value)\n            elif op == \"<=\": mask.append(v <= value)\n            elif op == \"==\": mask.append(v == value)\n            elif op == \"!=\": mask.append(v != value)\n            elif op == \"in\":\n                if isinstance(value, list): mask.append(v in value)\n                else: mask.append(False)\n            else:\n                raise ValueError(\"Unknown operator: \" + op)\n        return self[mask]\n    \n    def where(self, fn):\n        \"\"\"Filter rows: df.where(lambda row: row['age'] > 18)\"\"\"\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = []\n        for i in range(self._nrows):\n            row = {}\n            for c in self._columns:\n                row[c] = self._data[c][i]\n            if fn(row):\n                for c in self._columns:\n                    new_data[c].append(self._data[c][i])\n        return DataFrame(new_data)\n    \n    def apply(self, fn, axis=0):\n        \"\"\"Apply function. axis=0: per column. axis=1: per row.\"\"\"\n        if axis == 1:\n            # Per row - returns Series\n            result = []\n            for i in range(self._nrows):\n                row = {}\n                for c in self._columns:\n                    row[c] = self._data[c][i]\n                result.append(fn(row))\n            return Series(result)\n        # Per column\n        result = {}\n        for c in self._columns:\n            result[c] = fn(self._data[c])\n        return result\n    \n    def mean(self):\n        result = {}\n        for c in self._columns:\n            vals = []\n            for v in self._data[c]:\n                if isinstance(v, (int, float)) and not isinstance(v, bool):\n                    vals.append(v)\n            if vals:\n                result[c] = sum(vals) / len(vals)\n        return result\n    \n    def sum(self):\n        result = {}\n        for c in self._columns:\n            vals = []\n            for v in self._data[c]:\n                if isinstance(v, (int, float)) and not isinstance(v, bool):\n                    vals.append(v)\n            if vals:\n                result[c] = sum(vals)\n        return result\n    \n    def min(self):\n        result = {}\n        for c in self._columns:\n            vals = [v for v in self._data[c] if v is not None]\n            if vals: result[c] = min(vals)\n        return result\n    \n    def max(self):\n        result = {}\n        for c in self._columns:\n            vals = [v for v in self._data[c] if v is not None]\n            if vals: result[c] = max(vals)\n        return result\n    \n    def count(self):\n        \"\"\"Count non-null per column.\"\"\"\n        result = {}\n        for c in self._columns:\n            cnt = 0\n            for v in self._data[c]:\n                if v is not None:\n                    cnt += 1\n            result[c] = cnt\n        return result\n    \n    def describe(self):\n        result = {}\n        for c in self._columns:\n            vals = []\n            for v in self._data[c]:\n                if isinstance(v, (int, float)) and not isinstance(v, bool):\n                    vals.append(v)\n            if vals:\n                result[c] = {\n                    \"count\": len(vals),\n                    \"mean\": round(sum(vals)/len(vals), 2),\n                    \"min\": min(vals),\n                    \"max\": max(vals)\n                }\n        return result\n    \n    def to_dict(self):\n        return dict(self._data)\n    \n    # ===== Data cleaning =====\n    \n    def drop(self, columns=None, index=None):\n        \"\"\"Drop columns or rows.\"\"\"\n        if columns is not None:\n            cols_to_drop = columns if isinstance(columns, list) else [columns]\n            new_data = {}\n            new_cols = []\n            for c in self._columns:\n                if c not in cols_to_drop:\n                    new_data[c] = self._data[c]\n                    new_cols.append(c)\n            result = DataFrame(new_data)\n            result._columns = new_cols\n            return result\n        if index is not None:\n            indices = index if isinstance(index, list) else [index]\n            new_data = {}\n            for c in self._columns:\n                new_data[c] = []\n                for i in range(self._nrows):\n                    if i not in indices:\n                        new_data[c].append(self._data[c][i])\n            return DataFrame(new_data)\n        return DataFrame(self._data)\n    \n    def drop_duplicates(self):\n        \"\"\"Remove duplicate rows.\"\"\"\n        seen = []\n        keep_indices = []\n        for i in range(self._nrows):\n            row_tuple = tuple(self._data[c][i] for c in self._columns)\n            if row_tuple not in seen:\n                seen.append(row_tuple)\n                keep_indices.append(i)\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [self._data[c][i] for i in keep_indices]\n        return DataFrame(new_data)\n    \n    def isna(self):\n        \"\"\"Return df of booleans where values are None.\"\"\"\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [v is None for v in self._data[c]]\n        return DataFrame(new_data)\n    \n    def fillna(self, value):\n        \"\"\"Replace None values.\"\"\"\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [value if v is None else v for v in self._data[c]]\n        return DataFrame(new_data)\n    \n    def dropna(self):\n        \"\"\"Drop rows with any None.\"\"\"\n        keep = []\n        for i in range(self._nrows):\n            has_none = False\n            for c in self._columns:\n                if self._data[c][i] is None:\n                    has_none = True; break\n            if not has_none:\n                keep.append(i)\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [self._data[c][i] for i in keep]\n        return DataFrame(new_data)\n    \n    def rename(self, columns):\n        \"\"\"Rename columns: df.rename({'old':'new'})\"\"\"\n        new_data = {}\n        new_cols = []\n        for c in self._columns:\n            new_name = columns.get(c, c)\n            new_data[new_name] = self._data[c]\n            new_cols.append(new_name)\n        result = DataFrame(new_data)\n        result._columns = new_cols\n        return result\n    \n    def astype(self, col, dtype):\n        \"\"\"Convert column to type. dtype: int, float, str.\"\"\"\n        new_data = dict(self._data)\n        new_vals = []\n        for v in self._data[col]:\n            if v is None:\n                new_vals.append(None)\n            elif dtype == int or dtype == \"int\":\n                new_vals.append(int(v))\n            elif dtype == float or dtype == \"float\":\n                new_vals.append(float(v))\n            elif dtype == str or dtype == \"str\":\n                new_vals.append(str(v))\n            else:\n                new_vals.append(v)\n        new_data[col] = new_vals\n        return DataFrame(new_data)\n    \n    def clip(self, col, lower=None, upper=None):\n        \"\"\"Clip values in column to range.\"\"\"\n        new_data = dict(self._data)\n        new_vals = []\n        for v in self._data[col]:\n            if v is None:\n                new_vals.append(None); continue\n            if lower is not None and v < lower: v = lower\n            if upper is not None and v > upper: v = upper\n            new_vals.append(v)\n        new_data[col] = new_vals\n        return DataFrame(new_data)\n    \n    def nunique(self):\n        \"\"\"Count unique values per column.\"\"\"\n        result = {}\n        for c in self._columns:\n            seen = []\n            for v in self._data[c]:\n                if v not in seen:\n                    seen.append(v)\n            result[c] = len(seen)\n        return result\n    \n    # ===== Grouping / aggregation =====\n    \n    def groupby(self, by):\n        \"\"\"Group by column.\"\"\"\n        return GroupBy(self, by)\n    \n    # ===== Merging =====\n    \n    def merge(self, other, on, how=\"inner\"):\n        \"\"\"Merge two DataFrames on a key column. how: 'inner' or 'left'.\"\"\"\n        # Build index for other df\n        other_index = {}\n        for i in range(other._nrows):\n            k = other._data[on][i]\n            if k not in other_index:\n                other_index[k] = []\n            other_index[k].append(i)\n        \n        # New columns: my cols + other cols (without duplicate 'on')\n        my_cols = list(self._columns)\n        other_cols = [c for c in other._columns if c != on]\n        new_data = {}\n        for c in my_cols:\n            new_data[c] = []\n        for c in other_cols:\n            new_data[c] = []\n        \n        for i in range(self._nrows):\n            key = self._data[on][i]\n            if key in other_index:\n                for j in other_index[key]:\n                    for c in my_cols:\n                        new_data[c].append(self._data[c][i])\n                    for c in other_cols:\n                        new_data[c].append(other._data[c][j])\n            elif how == \"left\":\n                for c in my_cols:\n                    new_data[c].append(self._data[c][i])\n                for c in other_cols:\n                    new_data[c].append(None)\n        return DataFrame(new_data)\n    \n    # ===== Concat =====\n    \n    @staticmethod\n    def concat(dfs):\n        \"\"\"Concatenate list of DataFrames vertically.\"\"\"\n        if not dfs: return DataFrame({})\n        new_data = {}\n        cols = dfs[0]._columns\n        for c in cols:\n            new_data[c] = []\n        for df in dfs:\n            for c in cols:\n                if c in df._data:\n                    new_data[c].extend(df._data[c])\n                else:\n                    new_data[c].extend([None] * df._nrows)\n        return DataFrame(new_data)\n    \n    # ===== Set/reset index =====\n    \n    def set_index(self, col):\n        \"\"\"Make a column the row index (for display only - we don't really track indices).\"\"\"\n        # Just move that column to first position\n        if col not in self._columns:\n            raise ValueError(\"Column not found: \" + col)\n        new_cols = [col] + [c for c in self._columns if c != col]\n        new_data = {}\n        for c in new_cols:\n            new_data[c] = self._data[c]\n        result = DataFrame(new_data)\n        result._columns = new_cols\n        return result\n    \n    def reset_index(self):\n        \"\"\"Add an index column.\"\"\"\n        new_data = {\"index\": list(range(self._nrows))}\n        for c in self._columns:\n            new_data[c] = self._data[c]\n        return DataFrame(new_data)\n    \n    # ===== Info =====\n    \n    def info(self):\n        \"\"\"Print summary.\"\"\"\n        print(\"DataFrame: \" + str(self._nrows) + \" rows x \" + str(len(self._columns)) + \" columns\")\n        print(\"Columns:\")\n        for c in self._columns:\n            non_null = 0\n            for v in self._data[c]:\n                if v is not None: non_null += 1\n            sample = self._data[c][0] if self._nrows > 0 else None\n            type_name = type(sample).__name__ if sample is not None else \"unknown\"\n            print(\"  \" + c + \" (\" + type_name + \"): \" + str(non_null) + \" non-null\")\n    \n    def __str__(self):\n        return self._render_text()\n    \n    def __repr__(self):\n        return self._render_text()\n    \n    def _render_text(self):\n        if not self._columns:\n            return \"Empty DataFrame\"\n        lines = []\n        header = \"__DATAFRAME__|\" + \"|\".join([str(c) for c in self._columns])\n        lines.append(header)\n        for i in range(self._nrows):\n            row_vals = []\n            for c in self._columns:\n                row_vals.append(str(self._data[c][i]))\n            lines.append(\"__DATAROW__|\" + \"|\".join(row_vals))\n        lines.append(\"__DATAFRAME_END__\")\n        return \"\\n\".join(lines)\n\n\nclass GroupBy:\n    \"\"\"Result of df.groupby(col). Supports .mean(), .sum(), .count(), .agg().\"\"\"\n    def __init__(self, df, by):\n        self._df = df\n        self._by = by\n        # Build groups\n        self._groups = {}\n        col_data = df._data[by]\n        for i in range(df._nrows):\n            key = col_data[i]\n            if key not in self._groups:\n                self._groups[key] = []\n            self._groups[key].append(i)\n    \n    def _agg(self, fn):\n        \"\"\"Apply agg function per group, return DataFrame.\"\"\"\n        other_cols = [c for c in self._df._columns if c != self._by]\n        new_data = {self._by: []}\n        for c in other_cols:\n            new_data[c] = []\n        for key, indices in self._groups.items():\n            new_data[self._by].append(key)\n            for c in other_cols:\n                vals = []\n                for i in indices:\n                    v = self._df._data[c][i]\n                    if isinstance(v, (int, float)) and not isinstance(v, bool):\n                        vals.append(v)\n                if vals:\n                    new_data[c].append(fn(vals))\n                else:\n                    new_data[c].append(None)\n        return DataFrame(new_data)\n    \n    def mean(self):\n        return self._agg(lambda v: round(sum(v)/len(v), 2))\n    \n    def sum(self):\n        return self._agg(sum)\n    \n    def max(self):\n        return self._agg(max)\n    \n    def min(self):\n        return self._agg(min)\n    \n    def count(self):\n        \"\"\"Count rows per group.\"\"\"\n        new_data = {self._by: [], \"count\": []}\n        for key, indices in self._groups.items():\n            new_data[self._by].append(key)\n            new_data[\"count\"].append(len(indices))\n        return DataFrame(new_data)\n    \n    def size(self):\n        \"\"\"Same as count - rows per group.\"\"\"\n        return self.count()\n\n\nclass Series:\n    \"\"\"A column from a DataFrame.\"\"\"\n    def __init__(self, data, name=None):\n        self._data = list(data)\n        self.name = name\n    \n    def __len__(self):\n        return len(self._data)\n    \n    def __getitem__(self, i):\n        return self._data[i]\n    \n    def __iter__(self):\n        return iter(self._data)\n    \n    def gt(self, other): return [v > other for v in self._data if v is not None] if False else [v > other if v is not None else False for v in self._data]\n    def lt(self, other): return [v < other if v is not None else False for v in self._data]\n    def ge(self, other): return [v >= other if v is not None else False for v in self._data]\n    def le(self, other): return [v <= other if v is not None else False for v in self._data]\n    def eq(self, other): return [v == other for v in self._data]\n    \n    def mean(self):\n        nums = [v for v in self._data if isinstance(v, (int, float)) and not isinstance(v, bool)]\n        if nums: return sum(nums) / len(nums)\n        return 0\n    \n    def sum(self):\n        nums = [v for v in self._data if isinstance(v, (int, float)) and not isinstance(v, bool)]\n        return sum(nums)\n    \n    def max(self):\n        vals = [v for v in self._data if v is not None]\n        return max(vals) if vals else None\n    \n    def min(self):\n        vals = [v for v in self._data if v is not None]\n        return min(vals) if vals else None\n    \n    def unique(self):\n        seen = []\n        for v in self._data:\n            if v not in seen:\n                seen.append(v)\n        return seen\n    \n    def nunique(self):\n        return len(self.unique())\n    \n    def count(self):\n        cnt = 0\n        for v in self._data:\n            if v is not None: cnt += 1\n        return cnt\n    \n    def value_counts(self):\n        counts = {}\n        for v in self._data:\n            if v in counts: counts[v] += 1\n            else: counts[v] = 1\n        # Sort by count descending\n        items = list(counts.items())\n        items.sort(key=lambda x: -x[1])\n        result = {}\n        for k, v in items:\n            result[k] = v\n        return result\n    \n    def isna(self):\n        return [v is None for v in self._data]\n    \n    def fillna(self, value):\n        return Series([value if v is None else v for v in self._data], name=self.name)\n    \n    def apply(self, fn):\n        return Series([fn(v) for v in self._data], name=self.name)\n    \n    def map(self, mapping):\n        \"\"\"Map values via dict or function.\"\"\"\n        if isinstance(mapping, dict):\n            return Series([mapping.get(v, v) for v in self._data], name=self.name)\n        return Series([mapping(v) for v in self._data], name=self.name)\n    \n    def round(self, n=0):\n        return Series([round(v, n) if isinstance(v, (int, float)) else v for v in self._data], name=self.name)\n    \n    def cumsum(self):\n        result = []\n        total = 0\n        for v in self._data:\n            if isinstance(v, (int, float)):\n                total += v\n            result.append(total)\n        return Series(result, name=self.name)\n    \n    def pct_change(self):\n        result = [None]\n        for i in range(1, len(self._data)):\n            prev = self._data[i-1]\n            curr = self._data[i]\n            if prev and isinstance(prev, (int, float)) and isinstance(curr, (int, float)):\n                result.append((curr - prev) / prev)\n            else:\n                result.append(None)\n        return Series(result, name=self.name)\n    \n    def __str__(self):\n        return str(self._data)\n    \n    def __repr__(self):\n        return \"Series(\" + str(self._dat // ============== APP ==============
(function() {
  'use strict';
  
  const STORAGE_KEY = 'pandas_quiz_100_scores';
  const POINTS = { easy: 10, medium: 20, hard: 30 };
  const BONUS = { easy: 5, medium: 10, hard: 15 };  // first-try
  
  const allQuestions = window.PANDAS_QUIZ;
  let filtered = allQuestions.slice();
  let currentIdx = 0;
  let currentDiff = 'all';
  let currentStatus = null;
  let searchQuery = '';
  
  const attempts = {};
  const solutionViewed = new Set();
  
  function getScores() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
    catch(e) { return {}; }
  }
  function saveScore(num, points) {
    const scores = getScores();
    if (!scores[num] || scores[num].points < points) {
      scores[num] = { points, time: new Date().toISOString() };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
    }
  }
  function getScore(num) { return getScores()[num] || null; }
  function getTotalScore() {
    return Object.values(getScores()).reduce((s, x) => s + x.points, 0);
  }
  function getMaxScore() {
    return allQuestions.reduce((s, q) => s + POINTS[q.difficulty] + BONUS[q.difficulty], 0);
  }
  function getCounts() {
    const scores = getScores();
    const r = { easy: 0, medium: 0, hard: 0 };
    allQuestions.forEach(q => {
      if (scores[q.num]) r[q.difficulty]++;
    });
    return r;
  }
  
  function updateHeader() {
    document.getElementById('total-score').textContent = getTotalScore();
    document.getElementById('max-score').textContent = getMaxScore();
    const c = getCounts();
    document.getElementById('easy-done').textContent = c.easy;
    document.getElementById('medium-done').textContent = c.medium;
    document.getElementById('hard-done').textContent = c.hard;
    const total = c.easy + c.medium + c.hard;
    document.getElementById('progress-fill').style.width = (total / 100 * 100) + '%';
  }
  
  function applyFilters() {
    filtered = allQuestions.filter(q => {
      if (currentDiff !== 'all' && q.difficulty !== currentDiff) return false;
      if (currentStatus === 'done' && !getScore(q.num)) return false;
      if (currentStatus === 'todo' && getScore(q.num)) return false;
      if (searchQuery) {
        const text = (q.q + ' ' + q.topic).toLowerCase();
        if (!text.includes(searchQuery.toLowerCase())) return false;
      }
      return true;
    });
    currentIdx = 0;
    render();
  }
  
  function escapeHtml(s) {
    return String(s).replace(/[&<>"\']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  
  
  // === CODE EDITOR TOOLBAR (copy/paste/cut/select) ===
  function wireEditorToolbar() {
    const editor = document.getElementById('code-input');
    if (!editor) return;
    
    const copyBtn = document.getElementById('tb-copy');
    const pasteBtn = document.getElementById('tb-paste');
    const cutBtn = document.getElementById('tb-cut');
    const selectBtn = document.getElementById('tb-select');
    const clearBtn = document.getElementById('tb-clear');
    
    if (copyBtn) {
      copyBtn.addEventListener('click', () => {
        const text = editor.value;
        if (!text) return;
        const showCopied = () => {
          copyBtn.classList.add('copied');
          copyBtn.innerHTML = '✅ הועתק';
          setTimeout(() => {
            copyBtn.classList.remove('copied');
            copyBtn.innerHTML = '📋 העתק';
          }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(showCopied).catch(() => {
            // Fallback
            editor.select();
            document.execCommand('copy');
            showCopied();
          });
        } else {
          editor.select();
          document.execCommand('copy');
          showCopied();
        }
      });
    }
    
    if (pasteBtn) {
      pasteBtn.addEventListener('click', async () => {
        try {
          if (navigator.clipboard && navigator.clipboard.readText) {
            const text = await navigator.clipboard.readText();
            // Insert at cursor position
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            editor.value = editor.value.slice(0, start) + text + editor.value.slice(end);
            // Move cursor to end of pasted text
            editor.selectionStart = editor.selectionEnd = start + text.length;
            editor.focus();
            pasteBtn.classList.add('copied');
            pasteBtn.innerHTML = '✅ הודבק';
            setTimeout(() => {
              pasteBtn.classList.remove('copied');
              pasteBtn.innerHTML = '📥 הדבק';
            }, 1500);
          } else {
            // Fallback: focus and tell user
            editor.focus();
            alert('להדבקה: לחץ ארוך על העורך ובחר "Paste"');
          }
        } catch(e) {
          editor.focus();
          alert('לא ניתן לגשת ללוח. השתמש ב-Ctrl+V או לחיצה ארוכה');
        }
      });
    }
    
    if (cutBtn) {
      cutBtn.addEventListener('click', () => {
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        const selected = editor.value.slice(start, end) || editor.value;
        const showCut = () => {
          cutBtn.classList.add('copied');
          cutBtn.innerHTML = '✅ נגזר';
          setTimeout(() => {
            cutBtn.classList.remove('copied');
            cutBtn.innerHTML = '✂️ גזור';
          }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(selected).then(() => {
            if (start === end) {
              // Cut everything
              editor.value = '';
            } else {
              editor.value = editor.value.slice(0, start) + editor.value.slice(end);
              editor.selectionStart = editor.selectionEnd = start;
            }
            showCut();
          });
        } else {
          editor.select();
          document.execCommand('cut');
          showCut();
        }
      });
    }
    
    if (selectBtn) {
      selectBtn.addEventListener('click', () => {
        editor.focus();
        editor.select();
      });
    }
    
    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        if (confirm('לנקות את כל הקוד?')) {
          editor.value = '';
          editor.focus();
        }
      });
    }
  }


  function render() {
    updateHeader();
    
    if (filtered.length === 0) {
      document.getElementById('content').innerHTML = 
        '<div style="text-align:center;padding:30px;color:var(--tc14);">לא נמצאו שאלות</div>';
      return;
    }
    
    if (currentIdx >= filtered.length) currentIdx = 0;
    const q = filtered[currentIdx];
    const score = getScore(q.num);
    const basePoints = POINTS[q.difficulty];
    const maxPoints = basePoints + BONUS[q.difficulty];
    
    const diffLabels = { easy: '🟢 קל', medium: '🟡 בינוני', hard: '🔴 קשה' };
    const pointsBadge = score 
      ? `<span class="badge badge-earned">✅ ${score.points} נק'</span>`
      : `<span class="badge badge-points">🏆 עד ${maxPoints} נק'</span>`;
    
    document.getElementById('content').innerHTML = `
      <div class="question-card">
        <div class="q-header">
          <div class="q-num">#${q.num}</div>
          <div class="q-topic">${escapeHtml(q.topic)}</div>
          <div class="q-badges">
            <span class="badge badge-diff-${q.difficulty}">${diffLabels[q.difficulty]}</span>
            ${pointsBadge}
          </div>
        </div>
        
        <div class="question-text">${q.q}</div>
        
        <div class="editor-label">💻 כתוב את הקוד שלך:</div>
        <div class="editor-wrap">
          <div class="editor-toolbar">
            <button class="tb-btn" id="tb-copy" type="button">📋 העתק</button>
            <button class="tb-btn" id="tb-paste" type="button">📥 הדבק</button>
            <button class="tb-btn" id="tb-cut" type="button">✂️ גזור</button>
            <button class="tb-btn" id="tb-select" type="button">🔘 בחר הכל</button>
            <button class="tb-btn" id="tb-clear" type="button">🗑️ נקה</button>
          </div>
          <textarea class="code-editor" id="code-input" spellcheck="false" rows="9">${escapeHtml(q.starter || '')}</textarea>
        </div>
        
        <div class="actions">
          <button class="btn btn-run" id="run-btn">▶ הרץ ובדוק</button>
          <button class="btn btn-solution" id="sol-btn">💡 הצג פתרון</button>
          <button class="btn btn-reset" id="reset-btn">🔄 נקה</button>
        </div>
        
        <div class="output-section" id="output-section">
          <div class="editor-label" style="margin-top:14px;">📤 תוצאה:</div>
          <div class="output-box" id="output-box"></div>
        </div>
        
        <div class="verdict" id="verdict"></div>
        
        <div class="solution-section" id="solution-section">
          ${!score ? '<div class="solution-warning">⚠️ צפייה בפתרון לפני פתרון תפחית את הניקוד בחצי</div>' : ''}
          <div class="solution-header">
            <h3>💡 פתרון רשמי</h3>
            <button class="copy-btn" id="copy-btn">📋 העתק</button>
          </div>
          <div class="solution-code">
            <pre>${escapeHtml(q.solution)}</pre>
          </div>
        </div>
        
        <div class="nav-row">
          <button class="nav-btn" id="prev-btn" ${currentIdx === 0 ? 'disabled' : ''}>→ הקודמת</button>
          <button class="nav-btn" id="next-btn" ${currentIdx === filtered.length - 1 ? 'disabled' : ''}>הבאה ←</button>
        </div>
      </div>
    `;
    
    wireUp(q);
  }
  
  function wireUp(q) {
    document.getElementById('run-btn').addEventListener('click', () => runCode(q));
    wireEditorToolbar();
    document.getElementById('sol-btn').addEventListener('click', () => {
      const sec = document.getElementById('solution-section');
      const btn = document.getElementById('sol-btn');
      if (sec.classList.contains('show')) {
        sec.classList.remove('show');
        btn.innerHTML = '💡 הצג פתרון';
      } else {
        sec.classList.add('show');
        btn.innerHTML = '🙈 הסתר פתרון';
        solutionViewed.add(q.num);
        sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
    document.getElementById('reset-btn').addEventListener('click', () => {
      document.getElementById('code-input').value = q.starter || '';
      document.getElementById('output-section').classList.remove('show');
      document.getElementById('solution-section').classList.remove('show');
      document.getElementById('verdict').classList.remove('show');
      document.getElementById('sol-btn').innerHTML = '💡 הצג פתרון';
    });
    document.getElementById('copy-btn').addEventListener('click', () => {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(q.solution).then(() => {
          const b = document.getElementById('copy-btn');
          b.textContent = '✅ הועתק!';
          setTimeout(() => { b.textContent = '📋 העתק'; }, 1800);
        });
      }
    });
    document.getElementById('prev-btn').addEventListener('click', () => {
      if (currentIdx > 0) { currentIdx--; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    });
    document.getElementById('next-btn').addEventListener('click', () => {
      if (currentIdx < filtered.length - 1) { currentIdx++; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    });
  }
  
  function runCode(q) {
    if (typeof Sk === 'undefined') {
      alert('Python עדיין נטען...');
      return;
    }
    
    const code = document.getElementById('code-input').value;
    const outBox = document.getElementById('output-box');
    const outSection = document.getElementById('output-section');
    const verdict = document.getElementById('verdict');
    const runBtn = document.getElementById('run-btn');
    
    outSection.classList.add('show');
    outBox.textContent = '⏳ מריץ...';
    outBox.classList.remove('error');
    verdict.classList.remove('show');
    runBtn.disabled = true;
    
    attempts[q.num] = (attempts[q.num] || 0) + 1;
    
    let buffer = '';
    Sk.configure({
      output: (text) => { buffer += text; },
      read: (f) => {
        if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][f] === undefined) {
          throw "File not found: '" + f + "'";
        }
        return Sk.builtinFiles["files"][f];
      },
      __future__: Sk.python3,
      execLimit: 8000,
    });
    
    const fullCode = (window.PYTHON_PRELUDE || '') + String.fromCharCode(10) + String.fromCharCode(10) + code;
    
    Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, fullCode, true))
      .then(() => {
        runBtn.disabled = false;
        outBox.textContent = buffer || '(אין פלט)';
        outBox.classList.remove('error');
        
        // Run check function
        let passed = false;
        try {
          const checkFn = eval('(' + q.check + ')');
          passed = checkFn(buffer, code);
        } catch(e) {
          console.warn('Check error:', e);
          passed = false;
        }
        
        if (passed) {
          if (q.explain) {
            const _p = outBox.parentNode;
            const _old = _p.querySelector('.why-box'); if (_old) _old.remove();
            const _w = document.createElement('div');
            _w.className = 'why-box';
            _w.innerHTML = '<div class="why-title">למה זה עובד</div>' + q.explain;
            _p.insertBefore(_w, outBox.nextSibling);
          }
          const basePoints = POINTS[q.difficulty];
          const bonus = BONUS[q.difficulty];
          const maxPoints = basePoints + bonus;
          
          let earned;
          let msg;
          
          if (solutionViewed.has(q.num)) {
            earned = Math.floor(basePoints / 2);
            msg = ' (פתרון נצפה)';
          } else if (attempts[q.num] === 1) {
            earned = maxPoints;
            msg = ' (פעם ראשונה! 🎯)';
          } else {
            earned = basePoints;
            msg = '';
          }
          
          const existing = getScore(q.num);
          if (!existing || existing.points < earned) {
            saveScore(q.num, earned);
          }
          
          verdict.className = 'verdict show success';
          verdict.innerHTML = `
            ✅ <b>תשובה נכונה!</b>
            <span class="points-earned">+${earned} נקודות${msg}</span>
            ${existing && existing.points >= earned ? '<small>(הניקוד הקודם נשמר)</small>' : ''}
          `;
          
          updateHeader();
          if (earned >= 15) launchConfetti();
          
          // Update badge
          setTimeout(() => {
            const badges = document.querySelectorAll('.badge-points, .badge-earned');
            badges.forEach(b => {
              if (b.classList.contains('badge-points')) {
                b.className = 'badge badge-earned';
                b.textContent = `✅ ${earned} נק'`;
              }
            });
          }, 600);
        } else {
          verdict.className = 'verdict show fail';
          verdict.innerHTML = `
            🤔 <b>התשובה לא נכונה</b><br>
            <small>בדוק את הפלט ונסה שוב. צריך עזרה? "הצג פתרון" (אבל זה יפחית את הניקוד)</small>
          `;
        }
      })
      .catch((e) => {
        runBtn.disabled = false;
        outBox.textContent = String(e);
        outBox.classList.add('error');
        verdict.className = 'verdict show fail';
        verdict.innerHTML = '⚠️ <b>שגיאה בקוד</b><br><small>בדוק את ההודעה למעלה</small>';
      });
  }
  
  function launchConfetti() {
    const colors = ['#8b5cf6', '#00e5a0', '#ffd700', '#ec4899'];
    for (let i = 0; i < 25; i++) {
      const conf = document.createElement('div');
      conf.className = 'confetti';
      conf.style.left = Math.random() * 100 + '%';
      conf.style.background = colors[Math.floor(Math.random() * colors.length)];
      conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      conf.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
      conf.style.transition = 'top 2s linear, opacity 2s linear';
      document.body.appendChild(conf);
      requestAnimationFrame(() => {
        conf.style.top = '110vh';
        conf.style.opacity = '0';
      });
      setTimeout(() => conf.remove(), 2200);
    }
  }
  
  // Filter buttons
  document.querySelectorAll('.filter-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.dataset.filterType;
      const value = btn.dataset.filter;
      const isActive = btn.classList.contains('active');
      
      document.querySelectorAll(`.filter-pill[data-filter-type="${type}"]`).forEach(b => b.classList.remove('active'));
      
      if (type === 'diff') {
        currentDiff = value;
        btn.classList.add('active');
      } else if (type === 'status') {
        if (isActive) {
          currentStatus = null;
        } else {
          currentStatus = value;
          btn.classList.add('active');
        }
      }
      
      applyFilters();
    });
  });
  
  let searchTimer;
  document.getElementById('search').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      searchQuery = e.target.value.trim();
      applyFilters();
    }, 250);
  });
  
  document.getElementById('reset-score-btn').addEventListener('click', () => {
    if (confirm('לאפס את כל הניקוד?')) {
      localStorage.removeItem(STORAGE_KEY);
      render();
    }
  });
  
  render();
})();
</script>

<script>(function(){
  var D=document,H=D.documentElement;
  function cur(){return H.getAttribute('data-theme')==='light'?'light':'dark';}
  var btn=D.createElement('button');
  btn.type='button';btn.className='egr-theme-btn';btn.id='egrThemeBtn';
  function paint(){var l=cur()==='light';
    btn.textContent=l?'\u263D':'\u2600';
    btn.title=l?'\u05DE\u05E2\u05D1\u05E8 \u05DC\u05DE\u05E6\u05D1 \u05DB\u05D4\u05D4':'\u05DE\u05E2\u05D1\u05E8 \u05DC\u05DE\u05E6\u05D1 \u05D1\u05D4\u05D9\u05E8';
    btn.setAttribute('aria-label',btn.title);btn.setAttribute('aria-pressed',l?'true':'false');
    var mt=D.querySelector('meta[name="theme-color"]');
    if(mt){if(!mt.dataset.egrDark)mt.dataset.egrDark=mt.getAttribute('content')||'';
      mt.setAttribute('content',l?'#f2f4f8':mt.dataset.egrDark);}}
  btn.addEventListener('click',function(){
    var n=cur()==='light'?'dark':'light';
    H.setAttribute('data-theme',n);
    try{localStorage.setItem('egr-theme',n);}catch(e){}
    paint();});
  function box(el){
    if(!el)return null;
    var c=el.closest?el.closest('header,.topnav,.topbar,.header,nav'):null;
    return c||el.parentElement||el;
  }
  function float(){
    if(btn.parentNode)btn.parentNode.removeChild(btn);
    btn.style.marginInlineStart='';
    btn.classList.add('egr-floating');
    D.body.appendChild(btn);
  }
  function mount(){
    var fl=D.querySelectorAll('a[title="\u05E2\u05D1\u05E8\u05D9\u05EA"],a[title="English"],a[title="\u4E2D\u6587"]');
    var anchor=null,mode=0;
    if(fl.length>=2&&fl[0].parentNode){anchor=fl[0];mode=1;}
    else{
      anchor=D.querySelector('.lang-flags')||D.querySelector('.lang')||
             D.querySelector('.topnav-right')||D.querySelector('.header-right')||
             D.querySelector('.nav-right')||D.querySelector('.topbar-right')||
             D.querySelector('header .hd')||D.querySelector('.header-inner')||
             D.querySelector('.topbar')||D.querySelector('.topnav')||
             D.querySelector('header');
      mode=anchor?2:0;
    }
    if(!mode){float();paint();return;}
    var frame=box(anchor);
    var h0=frame?frame.getBoundingClientRect().height:0;
    var restore=null;
    if(mode===1){
      if(anchor.style&&anchor.style.marginInlineStart==='auto'){
        restore=anchor;btn.style.marginInlineStart='auto';anchor.style.marginInlineStart='0';
      }
      anchor.parentNode.insertBefore(btn,anchor);
    }else{anchor.appendChild(btn);}
    // If squeezing the button in made the bar taller, it does not belong there.
    var h1=frame?frame.getBoundingClientRect().height:0;
    if(frame&&h1>h0+1){
      if(restore)restore.style.marginInlineStart='auto';
      float();
    }
    paint();}
  if(D.readyState==='loading')D.addEventListener('DOMContentLoaded',mount);else mount();
})();</script></body>
