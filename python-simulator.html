  * { box-sizing: border-box; }

  /* Top bar with score */

  .score-pill {

    cursor: pointer;
    font-family: inherit;

  }

  .filter-pill.diff-medium.active { background: #f59e0b; border-color: #f59e0b; }
  .filter-pill.diff-hard.active { background: var(--tc20); border-color: var(--tc20); color: #fff; }
  .filter-search {

    min-width: 130px;
    padding: 6px 12px;
    background: var(--tc16);
    border: 1px solid var(--tc17);

    color: var(--tc2);
    font-size: 12px;
    font-family: inherit;

  .container {

    margin: 0 auto;
    padding: 14px;

  .exercise-card {
    background: var(--tc21);
    border: 1px solid var(--tc4);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;

  .ex-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--tc4);
    flex-wrap: wrap;
  }
  .ex-icon { font-size: 26px; line-height: 1; }
  .ex-title-block { flex: 1; min-width: 0; }
  .ex-num { font-size: 11px; color: var(--tc22); font-weight: 600; }
  .ex-title { font-size: 14px; font-weight: 700; }

  }

  .badge-course-pandas { background: var(--tc25); color: var(--tc26); }
  .badge-diff-easy { background: var(--tc27); color: var(--tc14); }
  .badge-diff-medium { background: var(--tc28); color: var(--tc15); }
  .badge-diff-hard { background: var(--tc29); color: var(--tc10); }
  .badge-points {
    background: linear-gradient(135deg, var(--tc30), var(--tc31));
    color: var(--tc8);
    border: 1px solid var(--tc32);
  }
  .badge-earned {
    background: linear-gradient(135deg, #00e5a0, #00a884);
    color: #000;
  }

  .question-box {
    background: var(--tc33);
    border-inline-start: 3px solid var(--tc7);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 12px;
  }
  .question-box code {
    background: var(--tc34);
    color: var(--tc8);
    padding: 2px 7px;
    border-radius: 4px;
    font-family: "SF Mono", Monaco, Menlo, monospace;
    font-size: 12.5px;
  }
  .question-box b { color: var(--tc13); }

  .editor-section { margin-bottom: 12px; }
  .editor-label {
    font-size: 11.5px;
    color: var(--tc22);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 6px;
    font-weight: 700;
  }
  .code-editor {
    width: 100%;
    background: var(--tc1);
    color: var(--tc35);
    border: 1px solid var(--tc17);
    border-radius: 8px;
    padding: 12px;
    font-family: "SF Mono", Monaco, Menlo, "Courier New", monospace;
    font-size: 14px;
    direction: ltr;
    text-align: left;
    resize: vertical;
    line-height: 1.6;
    min-height: 120px;
    tab-size: 4;
    user-select: text;
    -webkit-user-select: text;
    -webkit-touch-callout: default;
  }
  .code-editor:focus { outline: none; border-color: var(--tc36); }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: transform .15s;
  }
  .btn:hover, .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.6; cursor: wait; }
  .btn-run { background: linear-gradient(135deg, #00e5a0, #00a884); color: #000; }
  .btn-solution { background: linear-gradient(135deg, #ffd700, #ff8800); color: #1a1a2e; }
  .btn-reset { background: var(--tc9); color: var(--tc10); border: 1px solid var(--tc11); }

  .output-section { margin-top: 12px; display: none; }
  .output-section.show { display: block; }
  .output-box {
    background: var(--tc1);
    border: 1px solid var(--tc4);
    border-radius: 8px;
    padding: 12px;
    font-family: "SF Mono", Monaco, Menlo, monospace;
    font-size: 13px;
    color: var(--tc35);
    white-space: pre-wrap;
    direction: ltr;
    text-align: left;
    max-height: 280px;
    overflow-y: auto;
    min-height: 40px;
  }
  .output-box.error { color: var(--tc37); }

  /* Verdict (with points!) */
  .verdict {
    margin-top: 10px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    display: none;
  }
  .verdict.show { display: block; animation: pop .4s ease; }
  @keyframes pop {
    0% { transform: scale(0.9); opacity: 0; }
    60% { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
  }
  .verdict.success {
    background: linear-gradient(135deg, var(--tc38), var(--tc39));
    color: var(--tc40);
    border: 2px solid var(--tc41);
  }
  .verdict.fail {
    background: var(--tc42);
    color: var(--tc43);
    border: 1px solid var(--tc44);
  }
  .verdict .points-earned {
    display: block;
    font-size: 22px;
    margin: 4px 0;
    color: var(--tc8);
  }

  /* SOLUTION PANEL */
  .solution-section {
    margin-top: 18px;
    background: linear-gradient(135deg, var(--tc45), var(--tc46));
    border: 2px solid var(--tc32);
    border-radius: 12px;
    padding: 16px;
    display: none;
  }
  .solution-section.show { display: block; animation: slide-in .4s ease; }
  @keyframes slide-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .solution-warning {
    background: var(--tc9);
    border: 1px solid var(--tc11);
    color: var(--tc10);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    margin-bottom: 12px;
  }
  
  .solution-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--tc47);

  .solution-header h3 {
    margin: 0;
    font-size: 17px;
    color: var(--tc8);
  }
  .copy-btn {
    margin-inline-start: auto;
    background: var(--tc48);
    color: var(--tc8);
    border: 1px solid var(--tc49);
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 11.5px;
    cursor: pointer;
    font-family: inherit;
  }

  .solution-code {
    background: var(--tc1);
    border: 1px solid var(--tc50);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 16px;
    overflow-x: auto;
  }
  .solution-code pre {
    margin: 0;
    color: var(--tc8);
    font-family: "SF Mono", Monaco, Menlo, monospace;
    font-size: 13.5px;
    direction: ltr;
    text-align: left;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .explanation-title {
    font-size: 14px;
    color: var(--tc13);
    font-weight: 700;
    margin: 0 0 10px;
  }
  .exp-line-list { list-style: none; padding: 0; margin: 0 0 14px; }
  .exp-line {
    background: var(--tc51);
    border-inline-start: 2px solid var(--tc36);
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 7px;
  }
  .exp-line-code {
    color: var(--tc13);
    font-family: "SF Mono", Monaco, Menlo, monospace;
    font-size: 13px;
    direction: ltr;
    text-align: left;
    display: block;
    margin-bottom: 5px;
    background: var(--tc1);
    padding: 5px 9px;
    border-radius: 4px;
    border: 1px solid var(--tc17);
  }
  .exp-line-desc { font-size: 13px; color: var(--tc2); line-height: 1.6; }
  .exp-line-desc code {
    background: var(--tc52);
    color: var(--tc13);
    padding: 1px 6px;
    border-radius: 3px;
    font-family: "SF Mono", Monaco, Menlo, monospace;
    font-size: 11.5px;
  }

  .theory-section {
    background: var(--tc53);
    border: 1px solid var(--tc54);
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 10px;
  }
  .theory-section h4 { margin: 0 0 8px; font-size: 13.5px; color: var(--tc55); }
  .theory-section .theory-content { font-size: 13px; color: var(--tc2); line-height: 1.7; }
  .theory-section code {
    background: var(--tc25); color: var(--tc56);
    padding: 1px 6px; border-radius: 4px;
    font-family: "SF Mono", Monaco, Menlo, monospace; font-size: 12px;
  }
  .theory-section pre {
    background: var(--tc1); padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--tc17); overflow-x: auto;
    font-size: 12px; direction: ltr; text-align: left; color: var(--tc56);
  }

  .nav-row {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    justify-content: space-between;
  }
  .nav-btn {
    background: var(--tc16);
    color: var(--tc2);
    border: 1px solid var(--tc17);
    padding: 9px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
  }
  .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  
  /* Confetti effect for big achievements */
  .confetti {
    position: fixed;
    top: -10px;
    width: 8px;
    height: 8px;
    pointer-events: none;
    z-index: 999;
  }
  
  @media (max-width: 480px) {
    .container { padding: 10px; }
    .exercise-card { padding: 11px; }
    .ex-icon { font-size: 22px; }
    .ex-title { font-size: 13px; }
    .badge { font-size: 11px; padding: 2px 7px; }
    .question-box { font-size: 13px; padding: 9px 12px; }
    .code-editor { font-size: 13px; padding: 10px; min-height: 100px; }
    .btn { padding: 9px 14px; font-size: 12.5px; }
    .solution-code pre, .exp-line-code { font-size: 12px; }
    .solution-section { padding: 12px; }
    .progress-strip { flex-wrap: wrap; gap: 6px; }
    .score-pill { padding: 4px 10px; font-size: 11px; }
  }

  /* === CODE EDITOR TOOLBAR === */
  .editor-wrap {
    position: relative;
  }
  .editor-toolbar {
    display: flex;
    gap: 4px;
    padding: 6px;
    background: var(--tc16);
    border: 1px solid var(--tc17);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    flex-wrap: wrap;
  }
  .editor-toolbar .tb-btn {
    background: var(--tc21);
    color: var(--tc12);
    border: 1px solid var(--tc17);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    -webkit-tap-highlight-color: rgba(0,212,200,0.2);
  }
  .editor-toolbar .tb-btn:hover, .editor-toolbar .tb-btn:active {
    background: #00d4c8;
    color: #000;
    border-color: #00d4c8;
  }
  .editor-toolbar .tb-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .editor-toolbar .tb-btn.copied {
    background: #00e5a0;
    color: #000;
    border-color: #00e5a0;
  }
  .editor-wrap .code-editor {
    border-radius: 0 0 8px 8px !important;
    border-top: none !important;
  }
  
  @media (max-width: 480px) {
    .editor-toolbar { padding: 5px; gap: 3px; }
    .editor-toolbar .tb-btn { padding: 5px 8px; font-size: 11px; }
  }

  flex:0 0 auto;width:20px;height:20px;min-width:20px;max-height:20px;padding:0;
  margin-inline-start:6px;border-radius:50%;cursor:pointer;font-size:11px;line-height:1;
  align-self:center;box-sizing:border-box;
  background:transparent;color:inherit;vertical-align:middle;
  border:1px solid rgba(128,128,128,.45);
  transition:background .15s ease,transform .15s ease;-webkit-tap-highlight-color:transparent}
.egr-theme-btn:hover{background:rgba(128,128,128,.18)}
.egr-theme-btn:active{transform:scale(.92)}

  z-index:9999;width:40px;height:40px;max-height:40px;font-size:17px;
  background:var(--bg2,var(--bg-1,#1a1a2e));color:var(--text,var(--fg-1,#e8e8f0));

se</b>: <code>first_name</code>, <code>total_price</code>, <code>is_active</code>. בחרו שמות שמסבירים את עצמם: <code>price</code> ולא <code>p</code>.</p>",

  "topic_title": "המרת סוגי נתונים (Type Casting)",
  "topic_icon": "🔄",
  "course": "python",
  "q": "המשתנה <code>num_text = \"15\"</code>. המר אותו למספר שלם ושמור ב-<code>num</code>. הדפס את <code>num</code> וסוגו.",
  "starter": "num_text = \"15\"\n# המר ל-int\n",
  "solution": "num_text = \"15\"\nnum = int(num_text)\nprint(num)\nprint(type(num))",
  "check_fn": "(output, code) => /^15/.test(output.trim()) && /int/.test(output) && /\\bnum\\s*=\\s*int\\s*\\(/.test(code)",
  "theory": "<p>לפעמים הנתונים שלנו נמצאים בסוג אחד, ואנחנו צריכים אותם בסוג אחר. דוגמה קלאסית: משתמש מקליד באתר מספר, אבל האתר מקבל אותו כטקסט (<code>\"5\"</code>).</p>\n\n<h4>פונקציות ההמרה</h4>\n<ul>\n<li><code>int(x)</code> — הופך למספר שלם. <b>חותך</b> את החלק העשרוני לכיוון האפס (לא מעגל): <code>int(3.9) = 3</code>, וגם <code>int(-3.9) = -3</code></li>\n<li><code>float(x)</code> — הופך למספר עשרוני</li>\n<li><code>str(x)</code> — הופך למחרוזת טקסט</li>\n<li><code>bool(x)</code> — הופך לאמת/שקר</li>\n</ul>\n<p>ההמרה <b>לא משנה</b> את המשתנה המקורי — היא מחזירה ערך חדש. אם רוצים לשמור אותו, צריך השמה: <code>num = int(num_text)</code>.</p>\n\n<h4>מתי ההמרה נכשלת</h4>\n<p><code>int(\"15\")</code> עובד מצוין. אבל <code>int(\"15.5\")</code> <b>יזרוק ValueError</b> — הפונקציה int לא יודעת לקרוא נקודה עשרונית מתוך טקסט. הפתרון הוא המרה בשני שלבים: <code>int(float(\"15.5\"))</code> (התוצאה: 15). גם <code>int(\"abc\")</code> וגם <code>int(\"\")</code> יזרקו ValueError.</p>\n\n<h4>bool — מה נחשב False</h4>\n<p><code>bool(0)</code> הוא False, וכל מספר אחר — כולל שלילי — הוא True. גם מחרוזת ריקה <code>bool(\"\")</code> היא False. <b>אבל שימו לב למלכודת:</b> <code>bool(\"0\")</code> ו-<code>bool(\"False\")</code> הם <b>True</b>, כי מבחינת פייתון אלה מחרוזות שיש בהן תווים.</p>\n\n<h4>הטעות הנפוצה ביותר</h4>\n<p>חיבור של טקסט ומספר עם <code>+</code>: <code>\"I am \" + 25</code> יזרוק <code>TypeError</code>. צריך <code>\"I am \" + str(25)</code>. שימו לב שזו לא 'שגיאה בכל פעולה על טקסט': <code>\"5\" * 3</code> דווקא עובד ומחזיר <code>\"555\"</code> (שכפול הטקסט), ו-<code>\"5\" + \"5\"</code> מחזיר <code>\"55\"</code>. הבעיה היא רק ערבוב של str ו-int באותה פעולה.</p>",
  "explanation": [
   {
    "line": "print(float(7))",
    "exp": "מדפיס למסך: <code>float(7)</code>"
   }
  ],
  "difficulty": "easy",
  "base_points": 10,
  "max_points": 20,
  "explain": "<p>שימו לב לשני שלבים נפרדים: <code>int(num_text)</code> <b>מחשב</b> ערך חדש, ו-<code>num =</code> <b>שומר</b> אותו. בלי ההשמה הערך פשוט נזרק. אחרי ההמרה <code>num_text</code> עדיין נשאר הטקסט <code>\"15\"</code> — לא שינינו אותו, יצרנו לידו מספר חדש.</p>\n<p>אם נדפיס <code>type(num_text)</code> נקבל <code>&lt;class 'str'&gt;</code>, ואם נדפיס <code>type(num)</code> נקבל <code>&lt;class 'int'&gt;</code> — זו הדרך לוודא שההמרה באמת קרתה.</p>"
 },

  "check_fn": "(output, code) => output.trim() === \"True\" && /\\band\\b/.test(code) && /age/.test(code) && /has_license/.test(code)",
  "theory": "<p>לפעמים החלטה תלויה ב<b>כמה תנאים במקביל</b> (למשל: גם הלקוח מעל 18 וגם יש לו מנוי פעיל).</p>\n\n<h4>שלושת האופרטורים הלוגיים</h4>\n<ul>\n<li><b><code>and</code> (וגם)</b>: מחזיר <code>True</code> רק אם <b>כל</b> התנאים True. אם אחד False - הכל נופל.</li>\n<li><b><code>or</code> (או)</b>: מחזיר <code>True</code> אם <b>לפחות אחד</b> מהתנאים True. נפסל רק אם כל התנאים False.</li>\n<li><b><code>not</code> (לא)</b>: הופך את התוצאה. אם <code>True</code> אז <code>False</code>, ולהפך.</li>\n</ul>\n\n<h4>טבלת אמת מלאה</h4>\n<pre><code>True  and True  -&gt; True\nTrue  and False -&gt; False\nFalse and True  -&gt; False\nFalse and False -&gt; False\n\nTrue  or True   -&gt; True\nTrue  or False  -&gt; True\nFalse or True   -&gt; True\nFalse or False  -&gt; False\n\nnot True  -&gt; False\nnot False -&gt; True</code></pre>\n\n<p><b>שים לב ל-or:</b> ה-<code>or</code> של פייתון הוא \"לפחות אחד\", ולא \"או זה או זה אבל לא שניהם\". גם כששני הצדדים True התוצאה היא True.</p>\n\n<h4>משתנה בוליאני כבר הוא תנאי</h4>\n<p>אם משתנה כבר מחזיק <code>True</code> או <code>False</code>, אין שום צורך להשוות אותו ל-<code>True</code>:</p>\n<pre><code>has_license = True\n\nprint(has_license == True)   # עובד, אבל מיותר\nprint(has_license)           # הדרך הנכונה\nprint(not has_license)       # ככה בודקים את המקרה ההפוך</code></pre>\n<p>הכתיבה <code>== True</code> נחשבת סגנון שגוי בפייתון, ובודקי סגנון (PEP 8) אף מסמנים אותה כאזהרה. השווה ל-True רק כשאתה לא בטוח שהערך בוליאני.</p>\n\n<h4>סדר הפעולות בין האופרטורים</h4>\n<p>כשמערבבים אופרטורים, פייתון מחשב לפי סדר קבוע - קודם השוואות, אחר כך <code>not</code>, אחר כך <code>and</code>, ורק בסוף <code>or</code>:</p>\n<pre><code>price = 150\nprint(price &lt; 100 or not price &gt; 200)</code></pre>\n<p>פייתון קורא את זה כך: קודם מחושבות ההשוואות - <code>price &lt; 100</code> הוא False ו-<code>price &gt; 200</code> הוא False. אחר כך <code>not False</code> הופך ל-True. ולבסוף <code>False or True</code> נותן <b>True</b>.</p>\n<p>שים לב ש-<code>not price &gt; 200</code> פירושו <code>not (price &gt; 200)</code> ולא <code>(not price) &gt; 200</code> - ההשוואה תמיד מחושבת לפני ה-<code>not</code>.</p>\n<p><b>עצה מעשית:</b> כשיש ספק, הוסף סוגריים. <code>(price &lt; 100) or (not (price &gt; 200))</code> מתנהג בדיוק אותו דבר, ונקרא הרבה יותר בבירור.</p>\n\n<h4>בדיקת טווח - קיצור דרך</h4>\n<p>במקום <code>x &gt; 0 and x &lt; 3</code> מותר בפייתון לכתוב טווח בשורה אחת, כמו במתמטיקה:</p>\n<pre><code>x = 5\nprint(x &gt; 0 and x &lt; 3)   # False\nprint(0 &lt; x &lt; 3)         # False - בדיוק אותו דבר</code></pre>\n<p>אבל אסור לקצר את זה ל-<code>x &gt; 0 and &lt; 3</code>. אחרי <code>and</code> חייב לבוא תנאי שלם, עם שם המשתנה שוב.</p>",

  "explain": "<p>כשצריך ששני תנאים יתקיימו יחד, משתמשים ב-<code>and</code>. הביטוי כולו יהיה True רק אם שני הצדדים True:</p><pre><code>age = 25\nhas_license = True\nprint(age &gt;= 18 and has_license)   # True</code></pre><p>שים לב מה לא כתבנו: <code>has_license == True</code>. המשתנה כבר מחזיק <code>True</code> או <code>False</code>, ולכן השוואה שלו ל-True היא מיותרת בדיוק כמו לכתוב <code>x + 0</code> במקום <code>x</code>. בפייתון זו נחשבת שגיאת סגנון, ובודקי הקוד המקצועיים מסמנים אותה.</p><p>את המקרה ההפוך בודקים עם <code>not</code>:</p><pre><code>print(age &gt;= 18 and not has_license)   # False</code></pre><p>נסה לשנות את <code>has_license</code> ל-<code>False</code> ולהריץ שוב - תראה שדי בצד אחד שנופל כדי שכל הביטוי ייפול.</p>"

  "theory": "<p>לפעמים החלטה תלויה ב<b>כמה תנאים במקביל</b> (למשל: גם הלקוח מעל 18 וגם יש לו מנוי פעיל).</p>\n\n<h4>שלושת האופרטורים הלוגיים</h4>\n<ul>\n<li><b><code>and</code> (וגם)</b>: מחזיר <code>True</code> רק אם <b>כל</b> התנאים True. אם אחד False - הכל נופל.</li>\n<li><b><code>or</code> (או)</b>: מחזיר <code>True</code> אם <b>לפחות אחד</b> מהתנאים True. נפסל רק אם כל התנאים False.</li>\n<li><b><code>not</code> (לא)</b>: הופך את התוצאה. אם <code>True</code> אז <code>False</code>, ולהפך.</li>\n</ul>\n\n<h4>טבלת אמת מלאה</h4>\n<pre><code>True  and True  -&gt; True\nTrue  and False -&gt; False\nFalse and True  -&gt; False\nFalse and False -&gt; False\n\nTrue  or True   -&gt; True\nTrue  or False  -&gt; True\nFalse or True   -&gt; True\nFalse or False  -&gt; False\n\nnot True  -&gt; False\nnot False -&gt; True</code></pre>\n\n<p><b>שים לב ל-or:</b> ה-<code>or</code> של פייתון הוא \"לפחות אחד\", ולא \"או זה או זה אבל לא שניהם\". גם כששני הצדדים True התוצאה היא True.</p>\n\n<h4>משתנה בוליאני כבר הוא תנאי</h4>\n<p>אם משתנה כבר מחזיק <code>True</code> או <code>False</code>, אין שום צורך להשוות אותו ל-<code>True</code>:</p>\n<pre><code>has_license = True\n\nprint(has_license == True)   # עובד, אבל מיותר\nprint(has_license)           # הדרך הנכונה\nprint(not has_license)       # ככה בודקים את המקרה ההפוך</code></pre>\n<p>הכתיבה <code>== True</code> נחשבת סגנון שגוי בפייתון, ובודקי סגנון (PEP 8) אף מסמנים אותה כאזהרה. השווה ל-True רק כשאתה לא בטוח שהערך בוליאני.</p>\n\n<h4>סדר הפעולות בין האופרטורים</h4>\n<p>כשמערבבים אופרטורים, פייתון מחשב לפי סדר קבוע - קודם השוואות, אחר כך <code>not</code>, אחר כך <code>and</code>, ורק בסוף <code>or</code>:</p>\n<pre><code>price = 150\nprint(price &lt; 100 or not price &gt; 200)</code></pre>\n<p>פייתון קורא את זה כך: קודם מחושבות ההשוואות - <code>price &lt; 100</code> הוא False ו-<code>price &gt; 200</code> הוא False. אחר כך <code>not False</code> הופך ל-True. ולבסוף <code>False or True</code> נותן <b>True</b>.</p>\n<p>שים לב ש-<code>not price &gt; 200</code> פירושו <code>not (price &gt; 200)</code> ולא <code>(not price) &gt; 200</code> - ההשוואה תמיד מחושבת לפני ה-<code>not</code>.</p>\n<p><b>עצה מעשית:</b> כשיש ספק, הוסף סוגריים. <code>(price &lt; 100) or (not (price &gt; 200))</code> מתנהג בדיוק אותו דבר, ונקרא הרבה יותר בבירור.</p>\n\n<h4>בדיקת טווח - קיצור דרך</h4>\n<p>במקום <code>x &gt; 0 and x &lt; 3</code> מותר בפייתון לכתוב טווח בשורה אחת, כמו במתמטיקה:</p>\n<pre><code>x = 5\nprint(x &gt; 0 and x &lt; 3)   # False\nprint(0 &lt; x &lt; 3)         # False - בדיוק אותו דבר</code></pre>\n<p>אבל אסור לקצר את זה ל-<code>x &gt; 0 and &lt; 3</code>. אחרי <code>and</code> חייב לבוא תנאי שלם, עם שם המשתנה שוב.</p>",

  "theory": "<h3>סינון שורות - המסכה הבוליאנית</h3><p>סינון ב-pandas עובד בשני צעדים. תחילה בונים <b>מסכה בוליאנית</b>: סדרת True/False באורך הטבלה, ערך אחד לכל שורה. אחר כך מוסרים אותה ל-DataFrame, שמחזיר רק את השורות שבהן True.</p><pre>mask = df[\"age\"].gt(25)   # [False, True, True, ...]\ndf[mask]                   # רק השורות שבהן True</pre><p>בדרך כלל כותבים זאת בשורה אחת:</p><pre>df[df[\"age\"].gt(25)]</pre><p><b>מתודות ההשוואה</b> - כולן מתודות pandas תקניות שמחזירות מסכה:</p><ul><li><code>.gt(v)</code> גדול מ- &nbsp;|&nbsp; <code>.ge(v)</code> גדול או שווה</li><li><code>.lt(v)</code> קטן מ- &nbsp;|&nbsp; <code>.le(v)</code> קטן או שווה</li><li><code>.eq(v)</code> שווה &nbsp;|&nbsp; <code>.ne(v)</code> שונה</li><li><code>.isin([a, b])</code> נמצא באחד מהערכים ברשימה</li><li><code>.between(a, b)</code> בטווח, כולל שני הקצוות</li></ul><p><b><code>.loc</code></b> עושה את אותו הדבר, ומאפשר לבחור באותה נשימה גם עמודה:</p><pre>df.loc[df[\"points\"].ge(50)]            # אותן שורות\ndf.loc[df[\"points\"].ge(50), \"team\"]    # רק עמודת team מהשורות האלה</pre><p>יש גם <code>df.query(\"age &gt; 25\")</code> - מחרוזת קריאה, נוחה לתנאים פשוטים.</p><p>הסינון <b>מחזיר טבלה חדשה</b> ו-<code>df</code> המקורי אינו משתנה. מספר העמודות נשמר תמיד - סינון מוריד שורות בלבד - ולכן <code>shape</code> של התוצאה הוא (פחות שורות, אותו מספר עמודות).</p><p><b>שים לב לגבול:</b> \"מעל 85\" הוא <code>.gt(85)</code> ואינו כולל את 85 עצמו; \"85 ומעלה\" הוא <code>.ge(85)</code>. ההבדל בין שתי האותיות האלה הוא ההבדל בין דוח נכון לדוח שגוי.</p><h4>מה ההבדל מ-pandas אמיתי?</h4><p>ב-pandas אפשר לכתוב גם <code>df[df[\"age\"] &gt; 25]</code> עם סימן &gt; רגיל. <b>כאן זה לא יעבוד:</b> מנוע הפייתון שרץ בדפדפן (Skulpt) כופה על ערך ההחזרה של אופרטור ההשוואה להיות <code>True</code>/<code>False</code> יחיד, כך שלא ניתן לייצר ממנו מסכה שלמה.</p><p>הפתרון הוא <code>.gt()</code> - <b>וזו מתודת pandas אמיתית לחלוטין</b>, לא המצאה של הסימולטור. <code>df[df[\"age\"].gt(25)]</code> ירוץ בדיוק כך גם ב-pandas אמיתי ויחזיר את אותה תוצאה. זה התחביר היחיד שנשתמש בו כאן, ואפשר לקחת אותו לעבודה כמות שהוא.</p><p><b>אזהרה:</b> בגרסה קודמת של הקורס נלמדה כאן <code>df.filter(\"age\", \"&gt;\", 25)</code>. <b>אל תשתמש בה.</b> ב-pandas <code>filter</code> אמנם קיימת - אבל היא עושה משהו אחר לגמרי: בוחרת <b>עמודות</b> לפי שם, כמו <code>df.filter(items=[\"age\"])</code>. הקריאה בסגנון הישן תזרוק שם <code>TypeError</code>.</p><p><b>ערכים חסרים:</b> שורה שערכה <code>None</code> תיפול מכל תנאי השוואה, פרט ל-<code>.ne()</code> שתחזיר עבורה True. זו בדיוק ההתנהגות של <code>NaN</code> ב-pandas.</p>",

קיימת אבל עושה משהו אחר לגמרי: היא <b>שומרת את כל השורות</b> ומחליפה ב-<code>NaN</code> את הערכים שבהם התנאי אינו מתקיים. סינון שורות נעשה תמיד באמצעות מסכה בוליאנית.</p>",

  "theory": "<h3>pivot_table - חיתוך לפי שני ממדים</h3>\n<p><code>groupby</code> מפצל לפי ממד אחד. <code>pivot_table</code> מפצל לפי <b>שניים</b> ומסדר את התוצאה כטבלה צולבת - שורות, עמודות, וערך מסוכם בכל תא:</p>\n<pre>df.pivot_table(index=\"plan\",           # מה יהיה בשורות\n               columns=\"churn\",        # מה יהיה בעמודות\n               values=\"monthly_bill\",  # איזה מספר לסכם\n               aggfunc=\"mean\")         # איך לסכם</pre>\n<p>ארבעת הפרמטרים הם כל מה שצריך לזכור. <code>aggfunc</code> יכול להיות <code>\"mean\"</code>, <code>\"sum\"</code>, <code>\"count\"</code>, <code>\"min\"</code>, <code>\"max\"</code> - והוא משנה לחלוטין את משמעות הטבלה, גם כשהשורות והעמודות זהות.</p>\n<h4>תאים ריקים - החלק המעניין ביותר</h4>\n<p>אם לצירוף מסוים אין אף שורה בנתונים, התא יהיה <code>None</code> (ב-pandas אמיתי: <code>NaN</code>). זה לא באג אלא <b>ממצא</b>: הוא אומר שהצירוף הזה לא קיים במציאות. בטבלת plan מול churn, התא הריק של standard מגלה שאף לקוח standard לא נטש.</p>\n<h4>לחתוך אחרת: סינון ואז קיבוץ</h4>\n<p>לא כל שאלה דו-ממדית דורשת pivot. כשמעניין רק חלק מהנתונים - מסננים תחילה:</p>\n<pre>active = df[df[\"churn\"].eq(0)]\nactive.groupby(\"plan\").mean()</pre>\n<p>הסינון נעשה במסכה בוליאנית: <code>df[\"churn\"].eq(0)</code> מחזיר עמודה של True/False, ו-<code>df[mask]</code> מחזיר רק את השורות שבהן True. המתודות <code>.eq() .gt() .lt() .ge() .le()</code> קיימות גם ב-pandas אמיתי; שם מקובל לכתוב <code>df[df[\"churn\"] == 0]</code>, שאינו נתמך במנוע של הקורס.</p>\n<h4>ליצור ממד שאינו קיים</h4>\n<p>אם אין עמודה קטגורית שנייה - בונים אותה:</p>\n<pre>df[\"big\"] = df[\"sqm\"].gt(90)\ndf.pivot_table(index=\"rooms\", columns=\"big\", values=\"price_m\", aggfunc=\"mean\")</pre>\n<p>שימו לב: ככל שמוסיפים ממדים, כל תא מתבסס על פחות שורות. טבלה צולבת יפה שכל תא בה מבוסס על תצפית אחת אינה ראיה לכלום - הריצו <code>aggfunc=\"count\"</code> על אותה טבלה כדי לראות כמה שורות עומדות מאחורי כל מספר.</p>",

  "theory": "<h3>טיפול בערכים חסרים</h3><p>ערך חסר הוא תא שאין בו נתון. בסימולטור שלנו הוא מיוצג תמיד כ-<code>None</code>.</p><ul><li><code>df.isna()</code> - טבלה של True/False: True בכל תא חסר</li><li><code>df.fillna(0)</code> - מחליף כל ערך חסר בערך שנתתם</li><li><code>df.dropna()</code> - מסיר כל שורה שיש בה לפחות ערך חסר אחד</li></ul><p>שלושתן מחזירות טבלה <b>חדשה</b>. הטבלה המקורית לא משתנה, ולכן חייבים לשמור את התוצאה: <code>clean = df.dropna()</code>.</p><h4>לספור חסרים</h4><pre>df[\"age\"].isna().sum()   # כמה חסרים בעמודה אחת\ndf.isna().sum()          # כמה חסרים בכל עמודה</pre><p>זה עובד כי <code>True</code> שווה ל-1 ו-<code>False</code> שווה ל-0, ולכן סכימת מסכת החסרים היא בדיוק ספירתם. שתי השורות האלה הן הניב הסטנדרטי בעבודה, והן זהות ב-pandas אמיתי.</p><h4>למלא בערך שונה לכל עמודה</h4><pre>df.fillna({\"age\": df[\"age\"].mean(), \"city\": \"לא ידוע\"})</pre><p>מילון ל-<code>fillna</code> קובע ערך מילוי נפרד לכל עמודה. זו הצורה שבה עובדים בפועל, כי מספר וטקסט לא ממלאים באותו ערך. עמודה שלא הוזכרה במילון נשארת כמו שהיא.</p><h4>להסיר לפי עמודות מפתח בלבד</h4><pre>df.dropna(subset=[\"a\"])   # מסיר רק שורות שבהן a חסר</pre><p><code>dropna()</code> בלי פרמטרים אכזרי: הוא זורק שורה שלמה בגלל תא אחד. <code>subset</code> מצמצם את הבדיקה לעמודות שבאמת חשובות לכם.</p><h4>אזהרה חשובה ל-pandas אמיתי: None מול NaN</h4><p>ב-pandas אמיתי ערך חסר בעמודה מספרית אינו <code>None</code> אלא <code>NaN</code> (Not a Number), והוא מסוג <code>float</code>. יש לכך שתי השלכות שתפגשו ביום הראשון בעבודה:</p><ul><li>עמודת שלמים שיש בה ערך חסר אחד הופכת אוטומטית ל-<code>float64</code>: <code>[1, None, 3]</code> נשמר כ-<code>[1.0, NaN, 3.0]</code>, ומזהים מוצגים כ-1001.0 במקום 1001.</li><li><b>NaN אינו שווה לעצמו.</b> <code>NaN == NaN</code> הוא <code>False</code>. לכן <code>df[df[\"x\"] == None]</code> לעולם לא ימצא ערך חסר - הוא יחזיר טבלה ריקה בלי שום שגיאה. זו בדיוק הסיבה שקיימת <code>isna()</code>.</li></ul><p>בסימולטור <code>float('nan')</code> אינו מזוהה כערך חסר על ידי המתודות האלה. השתמשו תמיד ב-<code>None</code>.</p>",

  "theory": "<h3>חיבור טבלאות</h3><p>זה ה-<code>JOIN</code> של SQL:</p><pre>customers.merge(orders, on=\"customer_id\")   # INNER JOIN - ברירת המחדל</pre><p>רק שורות שיש להן <b>התאמה בשתי הטבלאות</b> נשמרות. שורה בטבלה השמאלית שאין לה זוג בימנית נעלמת, ולהפך. סדר השורות בתוצאה נקבע לפי הטבלה השמאלית, והתוצאה היא טבלה חדשה. עמודת המפתח מופיעה <b>פעם אחת</b> בתוצאה, ולכן 2+2 עמודות נותנות 3 ולא 4.</p><h4>הכלל שחייבים לזכור: merge יכול להגדיל את מספר השורות</h4><p>אם למפתח מסוים יש שורה אחת משמאל ושלוש שורות מימין, יתקבלו <b>שלוש</b> שורות - אחת לכל התאמה. ואם יש שתיים משמאל ושתיים מימין, יתקבלו ארבע. הכלל הכללי: מספר השורות בתוצאה הוא הסכום, על כל מפתח, של מספר ההופעות משמאל כפול מספר ההופעות מימין.</p><p>זו הסיבה מספר אחת לדוחות שגויים - סכום שפתאום גדול פי שניים. לכן ההרגל המקצועי הוא לבדוק תמיד: <code>print(len(left), len(right), len(result))</code>.</p><h4>עמודות בעלות שם זהה</h4><p>אם לשתי הטבלאות יש עמודה באותו שם מלבד מפתח החיבור, merge לא יכול לשמור את שתיהן תחת שם אחד - ולכן הוא מוסיף סיומות: <code>name_x</code> מהטבלה השמאלית ו-<code>name_y</code> מהימנית. אפשר לבחור סיומות משלכם:</p><pre>catalog.merge(stock, on=\"pid\", suffixes=(\"_catalog\", \"_stock\"))</pre><h4>חיבור על כמה עמודות</h4><p>כשהמפתח האמיתי מורכב מכמה שדות, מעבירים רשימה: <code>on=[\"year\", \"city\"]</code>. שורה תתחבר רק אם <b>כל</b> העמודות ברשימה תואמות.</p><p>כל התחביר בנושא הזה - <code>on</code>, <code>how</code>, <code>suffixes</code> - זהה ב-pandas אמיתי.</p>",

  "explain": "<p><code>merge</code> מחבר שתי טבלאות לפי עמודת מפתח משותפת, בדיוק כמו JOIN ב-SQL.</p><p>קראו את שלושת ה-shape: נכנסו 3 שורות ו-2 שורות, ויצאו 2. השורה עם id=3 (התלמיד C) נעלמה כי לא היה לה זוג בטבלת הציונים. זו המהות של INNER JOIN - הוא שומר רק את החיתוך, והוא <b>פעולה שמאבדת נתונים</b>.</p><p>שימו לב גם למספר העמודות: 2 + 2 = 4, אבל בתוצאה יש 3. הסיבה היא ש-<code>id</code> הוא עמודת החיבור והוא מופיע פעם אחת בלבד.</p><p>ההרגל שיציל אתכם בעבודה, וזה בדיוק מה שהתרגיל מדפיס: אחרי כל merge השוו את מספר השורות. אם המספר קטן - איבדתם שורות שלא מצאו התאמה. אם המספר גדל - יש כפילויות במפתח, וזה בדרך כלל באג.</p><p>אם אתם צריכים לשמור את <b>כל</b> שורות הטבלה השמאלית, זה LEFT JOIN, והוא הנושא הבא. התחביר כאן זהה ב-pandas אמיתי.</p>"

  "theory": "<h3>תנאים מורכבים: &amp; , | , ~</h3>\n<p>כל השוואה על עמודה מייצרת <b>מסכה</b> — עמודה של True/False באורך הטבלה:</p>\n<pre>rich = df[\"salary\"].gt(16000)   # [False, True, True, ...]</pre>\n<p>מסכות מחברים באופרטורים לוגיים, ובדיוק בהם נמצא כל הנושא הזה:</p>\n<pre>df[mask_a &amp; mask_b]    # וגם  – שני התנאים יחד\ndf[mask_a | mask_b]    # או   – מספיק שאחד יתקיים\ndf[~mask_a]            # לא   – היפוך המסכה</pre>\n<h4>ההבדל שחייבים להפנים</h4>\n<p><code>&amp;</code> <b>מצמצם</b> ו-<code>|</code> <b>מרחיב</b>. אפשר לבטא \"וגם\" גם בשרשור שני סינונים זה אחרי זה, אבל \"או\" לא ניתן לביטוי בשרשור בשום צורה — כי כל סינון נוסף פועל רק על מה שנשאר. זו הסיבה שהאופרטורים קיימים.</p>\n<h4>סוגריים אינם קישוט</h4>\n<pre>sales_vet = df[\"department\"].eq(\"Sales\") &amp; df[\"years\"].ge(4)\nrnd_rich  = df[\"department\"].eq(\"R&amp;D\") &amp; df[\"salary\"].gt(20000)\nresult    = df[sales_vet | rnd_rich]</pre>\n<p>כשתנאי מורכב מכמה ענפים, תנו לכל ענף שם משלו. זה קריא יותר, וזה גם מאפשר לבדוק כל ענף בנפרד (<code>df[sales_vet].shape[0]</code>) — בדיקת שפיות שמגלה ענף מת שלא מחזיר אף שורה.</p>\n<h4>שייכות לרשימה: isin</h4>\n<pre>df[df[\"plan\"].isin([\"premium\", \"standard\"])]     # אחד מהערכים האלה\ndf[~df[\"neighborhood\"].isin([\"יפו\", \"פלורנטין\"])] # כל מה שאינו ברשימה</pre>\n<p><code>~ ... isin([...])</code> הוא הכתיב הנפוץ ביותר בעבודה אמיתית לשלילת קבוצת ערכים — הרבה יותר קריא משרשרת של <code>ne</code>. יש גם <code>df[\"age\"].between(25, 35)</code> לטווח סגור.</p>\n<h4>מול pandas אמיתי — הנקודה הקריטית</h4>\n<p>ב-pandas האופרטורים הם <code>&amp;</code>, <code>|</code>, <code>~</code> — בדיוק כמו כאן — ו<b>אסור</b> להשתמש ב-<code>and</code>/<code>or</code> על עמודות: זה זורק <code>ValueError: The truth value of a Series is ambiguous</code>, אחת השגיאות הראשונות שכל מתחיל פוגש. ההבדל היחיד: שם משווים באופרטור, <code>df[(df[\"math\"] &gt; 80) &amp; (df[\"english\"] &gt; 85)]</code>, וכל תנאי <b>חייב</b> להיות בסוגריים כי <code>&amp;</code> נקשר חזק יותר   "theory": "<h3>פרויקט: פערי שכר בין מחלקות</h3>\n<p>HR מבקש תמונת מצב: מה הפערים בין המחלקות, האם יש מחלקה חריגה, ומי חורג בתוך המחלקה שלו. בטבלה <code>salaries</code> יש 12 עובדים, ולכל אחד מחלקה, שכר וותק.</p>\n<p>חמישה שלבים: שכר ממוצע וגודל לכל מחלקה, גודל הפער בין הגבוהה לנמוכה, בדיקה האם הוותק מסביר את הפער, זיהוי העובדים הוותיקים, ולבסוף — מי משתכר מעל ממוצע המחלקה שלו.</p>\n<h4>ארבע אזהרות שמלוות כל ניתוח שכר</h4>\n<p><b>1. הדפיסו תוויות, לא רק מספרים.</b> <code>[17000.0, 24500.0, 13000.0]</code> חסר פשר. בנו טבלה שבה שם המחלקה יושב ליד המספר שלה.</p>\n<p><b>2. ממוצע על 3-5 עובדים שביר.</b> עובד יחיד מזיז את ממוצע המחלקה כולה. דווחו תמיד גם את מספר העובדים.</p>\n<p><b>3. פער אינו אפליה.</b> לפני מסקנה, חפשו משתנה מסביר — כאן הוותק.</p>\n<p><b>4. מתאם אינו סיבתיות</b>, ובמיוחד כששני המשתנים מרוכזים באותה מחלקה.</p>\n<h4>הכלים של הפרויקט</h4>\n<pre>g = df.groupby(\"department\")\nreport = g.agg({\"salary\": \"mean\"})       # טבלה עם תווית לכל מספר\nreport[\"employees\"] = list(g[\"salary\"].count())\n\navg = g[\"salary\"].mean()\navg.idxmax()                             # שם המחלקה המובילה, לא מיקומה\ndf.nlargest(3, \"years\")                  # Top-N בלי מיון ידני</pre>\n<h4>סדר הקבוצות</h4>\n<p>כאן הקבוצות מופיעות לפי סדר הופעתן בנתונים (Sales, R&amp;D, Marketing). ב-pandas <code>groupby</code> ממיינת את המפתחות אלפביתית כברירת מחדל. לכן אל תסתמכו לעולם על <b>מיקום</b> קבוצה — הסתמכו על שמה, ולשם כך קיימות <code>idxmax</code> ו-<code>idxmin</code>.</p>",

  "base_points": 30,

  "explain": "זהו התרגיל המסכם, והוא מציג דפוס חדש: השוואה של <b>שורה מול הקבוצה שלה</b>, ולא מול מספר גלובלי.\nשלושת השלבים:\n1. <code>groupby(\"department\")[\"salary\"].mean()</code> — ממוצע לכל מחלקה.\n2. <code>df[\"department\"].map(dept_avg.to_dict())</code> — מרחיב את שלושת הממוצעים לעמודה באורך 12, שבה כל עובד מקבל את ממוצע <b>מחלקתו</b>. זה הצעד שכל התרגיל עומד עליו.\n3. <code>df[\"salary\"].gt(df[\"dept_avg\"])</code> — השוואה בין שתי עמודות, שורה מול שורה.\nהתוצאה: גלית וליאת (Sales), הילה וחני (R&amp;D), זוהר (Marketing) — 5 מתוך 12.\nשימו לב לטל: 17,000 בדיוק, שהוא בדיוק ממוצע Sales. <code>gt</code> אינו כולל שוויון, ולכן הוא בחוץ. בהגדרת \"מעל הממוצע\" הגבול הזה צריך להיקבע במפורש.\nוהתובנה הסטטיסטית שהופכת את התרגיל למעניין: בכל שלוש המחלקות יש <b>פחות</b> עובדים מעל הממוצע מאשר מתחתיו. זה לא במקרה — ממוצע נמשך כלפי מעלה על ידי הערכים הגבוהים, ולכן \"מעל הממוצע\" הוא כמעט תמיד מיעוט. אילו HR היה שואל \"כמה עובדים מקבלים שכר סביר\", חציון היה מדד הוגן יותר מממוצע.\nפער מול pandas שכדאי להכיר: שם הצעד השני הוא פונקציה ייעודית ואלגנטית בהרבה — <code>df.groupby(\"department\")[\"salary\"].transform(\"mean\")</code> מחזירה ישירות עמודה באורך הטבלה. <code>transform</code> אינה קיימת בסימולטור, ולכן העקיפה דרך <code>map</code> על מילון. הרעיון זהה לחלוטין."

  "theory": "<h3>פרויקט: שנת המכירות</h3>\n<p>בטבלה <code>sales</code> יש 12 חודשים, ולכל חודש מחזור (<code>revenue</code>) וכמות יחידות (<code>units</code>). נבנה תמונה שלמה של השנה בחמישה שלבים: סך שנתי והפיזור סביבו, חודש השיא, מחיר ממוצע ליחידה, שיעור השינוי מחודש לחודש, ולבסוף סיכום הצמיחה.</p>\n<h4>שלושה מושגים לפני שמתחילים</h4>\n<p><b>מחיר ממוצע ליחידה</b> = revenue / units. שני חודשים יכולים למכור באותו סכום — אחד בהרבה יחידות זולות, השני במעט יקרות. זה הבדל עסקי מהותי, והוא בלתי נראה במחזור לבדו.</p>\n<p><b>שינוי מחודש לחודש</b> (<code>pct_change</code>) = כמה אחוזים עלה או ירד המחזור לעומת החודש הקודם. לחודש הראשון אין קודם ולכן הוא מקבל None — ומכאן שיש 11 מדידות ולא 12. את המכנה הזה חובה לדווח.</p>\n<p><b>עונתיות</b>: בקמעונאות דצמבר תמיד חזק ופברואר תמיד חלש. לכן קפיצה של 39% בדצמבר אינה \"צמיחה\" אלא עונה. צמיחה אמיתית נמדדת מול אותו חודש בשנה שעברה, ובדאטהסט הזה אין שנה קודמת. כשמדווחים מספר, אמרו במפורש מה הוא מודד.</p>\n<h4>הכלים של הפרויקט</h4>\n<pre>df[\"avg_price\"] = df[\"revenue\"] / df[\"units\"]     # עמודה מחושבת ווקטורית\ndf.loc[df[\"revenue\"].idxmax()]                    # השורה השלמה של המקסימום\n(df[\"revenue\"].pct_change() * 100).round(1)       # דוח קריא, לא 12 ספרות\ndf.iloc[0:6]                                      # חיתוך תקופה לפי מיקום</pre>\n<p><code>idxmax</code> מחזירה את <b>תווית</b> השורה המקסימלית, ו-<code>df.loc[...]</code> שולפת אותה במלואה — כך רואים את כל הנתונים של חודש השיא ולא רק את שמו.</p>",

                if v not in seen:\n                    seen.append(v)\n            result[c] = len(seen)\n        return result\n    \n    # ===== Grouping / aggregation =====\n    \n    def groupby(self, by):\n        \"\"\"Group by column.\"\"\"\n        return GroupBy(self, by)\n    \n    # ===== Merging =====\n    \n    def merge(self, other, on, how=\"inner\"):\n        \"\"\"Merge two DataFrames on a key column. how: 'inner' or 'left'.\"\"\"\n        # Build index for other df\n        other_index = {}\n        for i in range(other._nrows):\n            k = other._data[on][i]\n            if k not in other_index:\n                other_index[k] = []\n            other_index[k].append(i)\n        \n        # New columns: my cols + other cols (without duplicate 'on')\n        my_cols = list(self._columns)\n        other_cols = [c for c in other._columns if c != on]\n        new_data = {}\n        for c in my_cols:\n            new_data[c] = []\n        for c in other_cols:\n            new_data[c] = []\n        \n        for i in range(self._nrows):\n            key = self._data[on][i]\n            if key in other_index:\n                for j in other_index[key]:\n                    for c in my_cols:\n                        new_data[c].append(self._data[c][i])\n                    for c in other_cols:\n                        new_data[c].append(other._data[c][j])\n            elif how == \"left\":\n                for c in my_cols:\n                    new_data[c].append(self._data[c][i])\n                for c in other_cols:\n                    new_data[c].append(None)\n        return DataFrame(new_data)\n    \n    # ===== Concat =====\n    \n    @staticmethod\n    def concat(dfs):\n        \"\"\"Concatenate list of DataFrames vertically.\"\"\"\n        if not dfs: return DataFrame({})\n        new_data = {}\n        cols = dfs[0]._columns\n        for c in cols:\n            new_data[c] = []\n        for df in dfs:\n            for c in cols:\n _groups.items():\n            new_data[self._by].append(key)\n            new_data[\"count\"].append(len(indices))\n        return DataFrame(new_data)\n    \n    def size(self):\n        \"\"\"Same as count - rows per group.\"\"\"\n        return self.count()\n\n\nclass Series:\n    \"\"\"A column from a DataFrame.\"\"\"\n    def __init__(self, data, name=None):\n        self._data = list(data)\n        self.name = name\n    \n    def __len__(self):\n        return len(self._data)\n    \n    def __getitem__(self, i):\n        return self._data[i]\n    \n    def __iter__(self):\n        return iter(self._data)\n    \n    def gt(self, other): return [v > other for v in self._data if v is not None] if False else [v > other if v is not None else False for v in self._data]\n    def lt(self, other): return [v < other if v is not None else False for v in self._data]\n    def ge(self, other): return [v >= other if v is not None else False for v in self._data]\n    def le(self, other): return [v <= other if v is not None else False for v in self._data]\n    def eq(self, other): return [v == other for v in self._data]\n    \n    def mean(self):\n        nums = [v for v in self._data if isinstance(v, (int, float)) and not isinstance(v, bool)]\n        if nums: return sum(nums) / len(nums)\n        return 0\n    \n    def sum(self):\n        nums = [v for v in self._data if isinstance(v, (int, float)) and not isinstance(v, bool)]\n        return sum(nums)\n    \n    def max(self):\n        vals = [v for v in self._data if v is not None]\n        return max(vals) if vals else None\n    \n    def min(self):\n        vals = [v for v in self._data if v is not None]\n        return min(vals) if vals else None\n    \n    def unique(self):\n        seen = []\n        for v in self._data:\n            if v not in seen:\n                seen.append(v)\n        return seen\n    \n    def nunique(self):\n        return len(self.unique())\n    \n    def count(self):\n        cnt = 0\n // =============== APP ===============
(function() {
  'use strict';
  
  const STORAGE_KEY = 'simulator_v2_scores';
  const allExercises = window.SIM_EXERCISES;
  let filteredExercises = allExercises.slice();
  let currentIdx = 0;
  let currentCourse = 'all';
  let currentDifficulty = null;
  let currentStatus = null;
  let searchQuery = '';

  // ===== Scoring storage =====
  function getScores() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
    catch(e) { return {}; }
  }
  function saveScore(exId, points, firstTry) {
    const scores = getScores();
    if (!scores[exId] || scores[exId].points < points) {
      scores[exId] = {
        points: points,
        firstTry: firstTry,
        completedAt: new Date().toISOString(),
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
    }
    return scores[exId];
  }
  function getExerciseScore(exId) {
    const scores = getScores();
    return scores[exId] || null;
  }
  function getTotalScore() {
    const scores = getScores();
    return Object.values(scores).reduce((sum, s) => sum + (s.points || 0), 0);
  }
  function getMaxScore() {
    return allExercises.reduce((sum, e) => sum + e.max_points, 0);
  }
  function getCountsByDifficulty() {
    const scores = getScores();
    const result = {
      easy: { done: 0, total: 0 },
      medium: { done: 0, total: 0 },
      hard: { done: 0, total: 0 },
    };
    allExercises.forEach(e => {
      result[e.difficulty].total++;
      if (scores[e.id]) result[e.difficulty].done++;
    });
    return result;
  }
  
  // ===== Track attempts per exercise (for first-try bonus) =====
  const attempts = {}; // exId -> count
  function recordAttempt(exId) {
    attempts[exId] = (attempts[exId] || 0) + 1;
    return attempts[exId];
  }
  function isFirstTry(exId) {
    return (attempts[exId] || 0) <= 1;
  }
  
  // ===== Track solution-viewed =====
  const solutionViewed = new Set();
  function viewedSolution(exId) {
    solutionViewed.add(exId);
  }
  function hasViewedSolution(exId) {
    return solutionViewed.has(exId);
  }

  // ===== Update header stats =====
  function updateHeader() {
    document.getElementById('total-score').textContent = getTotalScore();
    document.getElementById('max-score').textContent = getMaxScore();
    
    const counts = getCountsByDifficulty();
    document.getElementById('easy-done').textContent = counts.easy.done;
    document.getElementById('easy-total').textContent = counts.easy.total;
    document.getElementById('medium-done').textContent = counts.medium.done;
    document.getElementById('medium-total').textContent = counts.medium.total;
    document.getElementById('hard-done').textContent = counts.hard.done;
    document.getElementById('hard-total').textContent = counts.hard.total;
    
    const total = counts.easy.total + counts.medium.total + counts.hard.total;
    const done = counts.easy.done + counts.medium.done + counts.hard.done;
    const pct = total > 0 ? (done / total) * 100 : 0;
    document.getElementById('progress-fill').style.width = pct + '%';
  }

  function applyFilters() {
    filteredExercises = allExercises.filter(e => {
      if (currentCourse !== 'all' && e.course !== currentCourse) return false;
      if (currentDifficulty && e.difficulty !== currentDifficulty) return false;
      if (currentStatus) {
        const hasScore = !!getExerciseScore(e.id);
        if (currentStatus === 'done' && !hasScore) return false;
        if (currentStatus === 'todo' && hasScore) return false;
      }
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        const text = (e.q + ' ' + e.topic_title + ' ' + e.solution).toLowerCase();
        if (!text.includes(q)) return false;
      }
      return true;
    });
    currentIdx = 0;
    render();
  }

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  
  // === CODE EDITOR TOOLBAR (copy/paste/cut/select) ===
  function wireEditorToolbar() {
    const editor = document.getElementById('code-input');
    if (!editor) return;
    
    const copyBtn = document.getElementById('tb-copy');
    const pasteBtn = document.getElementById('tb-paste');
    const cutBtn = document.getElementById('tb-cut');
    const selectBtn = document.getElementById('tb-select');
    const clearBtn = document.getElementById('tb-clear');
    
    if (copyBtn) {
      copyBtn.addEventListener('click', () => {
        const text = editor.value;
        if (!text) return;
        const showCopied = () => {
          copyBtn.classList.add('copied');
          copyBtn.innerHTML = '✅ הועתק';
          setTimeout(() => {
            copyBtn.classList.remove('copied');
            copyBtn.innerHTML = '📋 העתק';
          }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(showCopied).catch(() => {
            // Fallback
            editor.select();
            document.execCommand('copy');
            showCopied();
          });
        } else {
          editor.select();
          document.execCommand('copy');
          showCopied();
        }
      });
    }
    
    if (pasteBtn) {
      pasteBtn.addEventListener('click', async () => {
        try {
          if (navigator.clipboard && navigator.clipboard.readText) {
            const text = await navigator.clipboard.readText();
            // Insert at cursor position
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            editor.value = editor.value.slice(0, start) + text + editor.value.slice(end);
            // Move cursor to end of pasted text
            editor.selectionStart = editor.selectionEnd = start + text.length;
            editor.focus();
            pasteBtn.classList.add('copied');
            pasteBtn.innerHTML = '✅ הודבק';
            setTimeout(() => {
              pasteBtn.classList.remove('copied');
              pasteBtn.innerHTML = '📥 הדבק';
            }, 1500);
          } else {
            // Fallback: focus and tell user
            editor.focus();
            alert('להדבקה: לחץ ארוך על העורך ובחר "Paste"');
          }
        } catch(e) {
          editor.focus();
          alert('לא ניתן לגשת ללוח. השתמש ב-Ctrl+V או לחיצה ארוכה');
        }
      });
    }
    
    if (cutBtn) {
      cutBtn.addEventListener('click', () => {
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        const selected = editor.value.slice(start, end) || editor.value;
        const showCut = () => {
          cutBtn.classList.add('copied');
          cutBtn.innerHTML = '✅ נגזר';
          setTimeout(() => {
            cutBtn.classList.remove('copied');
            cutBtn.innerHTML = '✂️ גזור';
          }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(selected).then(() => {
            if (start === end) {
              // Cut everything
              editor.value = '';
            } else {
              editor.value = editor.value.slice(0, start) + editor.value.slice(end);
              editor.selectionStart = editor.selectionEnd = start;
            }
            showCut();
          });
        } else {
          editor.select();
          document.execCommand('cut');
          showCut();
        }
      });
    }
    
    if (selectBtn) {
      selectBtn.addEventListener('click', () => {
        editor.focus();
        editor.select();
      });
    }
    
    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        if (confirm('לנקות את כל הקוד?')) {
          editor.value = '';
          editor.focus();
        }
      });
    }
  }


  function render() {
    updateHeader();
    
    if (filteredExercises.length === 0) {
      document.getElementById('content').innerHTML = 
        '<div style="text-align:center;padding:30px;color:var(--tc12);">לא נמצאו תרגילים שמתאימים לסינון</div>';
      return;
    }
    
    if (currentIdx >= filteredExercises.length) currentIdx = filteredExercises.length - 1;
    if (currentIdx < 0) currentIdx = 0;
    
    const ex = filteredExercises[currentIdx];
    const score = getExerciseScore(ex.id);
    
    // Build explanation HTML
    let explanationHTML = '';
    if (ex.explanation && ex.explanation.length > 0) {
      explanationHTML = '<h4 class="explanation-title">📖 הסבר שורה אחר שורה:</h4><ul class="exp-line-list">';
      ex.explanation.forEach(item => {
        explanationHTML += `
          <li class="exp-line">
            <code class="exp-line-code">${escapeHtml(item.line)}</code>
            <div class="exp-line-desc">${item.exp}</div>
          </li>`;
      });
      explanationHTML += '</ul>';
    }
    
    let theoryHTML = '';
    if (ex.theory && ex.theory.length > 20) {
      theoryHTML = `
        <div class="theory-section">
          <h4>📚 רקע תיאורטי</h4>
          <div class="theory-content">${ex.theory}</div>
        </div>`;
    }
    
    // Badges
    const courseBadge = ex.course === 'python' 
      ? '<span class="badge badge-course-python">🐍 Python</span>'
      : '<span class="badge badge-course-pandas">🐼 Pandas</span>';
    
    const diffLabels = { easy: '🟢 קל', medium: '🟡 בינוני', hard: '🔴 קשה' };
    const diffBadge = `<span class="badge badge-diff-${ex.difficulty}">${diffLabels[ex.difficulty]}</span>`;
    
    let pointsBadge;
    if (score) {
      pointsBadge = `<span class="badge badge-earned">✅ ${score.points} נקודות</span>`;
    } else {
      pointsBadge = `<span class="badge badge-points">🏆 עד ${ex.max_points} נקודות</span>`;
    }
    
    const html = `
      <div class="exercise-card">
        <div class="ex-header">
          <div class="ex-icon">${ex.topic_icon}</div>
          <div class="ex-title-block">
            <div class="ex-num">${escapeHtml(ex.topic_title)}</div>
            <div class="ex-title">תרגיל ${currentIdx + 1} / ${filteredExercises.length}</div>
          </div>
          <div class="ex-badges">
            ${courseBadge}
            ${diffBadge}
            ${pointsBadge}
          </div>
        </div>
        
        <div class="question-box">${ex.q}</div>
        
        <div class="editor-section">
          <div class="editor-label">💻 כתוב את הקוד שלך כאן:</div>
          <div class="editor-wrap">
          <div class="editor-toolbar">
            <button class="tb-btn" id="tb-copy" type="button">📋 העתק</button>
            <button class="tb-btn" id="tb-paste" type="button">📥 הדבק</button>
            <button class="tb-btn" id="tb-cut" type="button">✂️ גזור</button>
            <button class="tb-btn" id="tb-select" type="button">🔘 בחר הכל</button>
            <button class="tb-btn" id="tb-clear" type="button">🗑️ נקה</button>
          </div>
          <textarea class="code-editor" id="code-input" spellcheck="false" rows="8">${escapeHtml(ex.starter || '')}</textarea>
        </div>
          
          <div class="actions">
            <button class="btn btn-run" id="run-btn">▶ הרץ ובדוק</button>
            <button class="btn btn-solution" id="sol-btn">💡 הצג פתרון</button>
            <button class="btn btn-reset" id="reset-btn">🔄 איפוס</button>
          </div>
        </div>
        
        <div class="output-section" id="output-section">
          <div class="editor-label">📤 תוצאה:</div>
          <div class="output-box" id="output-box"></div>
        </div>
        
        <div class="verdict" id="verdict"></div>
        
        <div class="solution-section" id="solution-section">
          ${!score ? '<div class="solution-warning">⚠️ צפייה בפתרון לפני פתרון מצליחה תפחית את הניקוד בחצי (' + Math.floor(ex.base_points / 2) + ' נקודות במקום ' + ex.max_points + ')</div>' : ''}
          
          <div class="solution-header">
            <h3>💡 פתרון רשמי</h3>
            <button class="copy-btn" id="copy-btn">📋 העתק</button>
          </div>
          
          <div class="solution-code">
            <pre>${escapeHtml(ex.solution)}</pre>
          </div>
          
          ${explanationHTML}
          
          ${theoryHTML}
        </div>
        
        <div class="nav-row">
          <button class="nav-btn" id="prev-btn" ${currentIdx === 0 ? 'disabled' : ''}>→ הקודם</button>
          <button class="nav-btn" id="next-btn" ${currentIdx === filteredExercises.length - 1 ? 'disabled' : ''}>הבא ←</button>
        </div>
      </div>
    `;
    
    document.getElementById('content').innerHTML = html;
    wireUp(ex);
  }
  
  function wireUp(ex) {
    document.getElementById('run-btn').addEventListener('click', () => runCode(ex));
    wireEditorToolbar();
    document.getElementById('sol-btn').addEventListener('click', () => {
      const sec = document.getElementById('solution-section');
      const btn = document.getElementById('sol-btn');
      if (sec.classList.contains('show')) {
        sec.classList.remove('show');
        btn.innerHTML = '💡 הצג פתרון';
      } else {
        sec.classList.add('show');
        btn.innerHTML = '🙈 הסתר פתרון';
        viewedSolution(ex.id);
        sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
    document.getElementById('reset-btn').addEventListener('click', () => {
      document.getElementById('code-input').value = ex.starter || '';
      document.getElementById('output-section').classList.remove('show');
      document.getElementById('solution-section').classList.remove('show');
      document.getElementById('verdict').classList.remove('show');
      document.getElementById('sol-btn').innerHTML = '💡 הצג פתרון';
    });
    document.getElementById('copy-btn').addEventListener('click', () => {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(ex.solution).then(() => {
          const b = document.getElementById('copy-btn');
          b.textContent = '✅ הועתק!';
          setTimeout(() => { b.textContent = '📋 העתק'; }, 1800);
        });
      }
    });
    
    document.getElementById('prev-btn').addEventListener('click', () => {
      if (currentIdx > 0) { currentIdx--; render(); window.scrollTo({top:0, behavior:'smooth'}); }
    });
    document.getElementById('next-btn').addEventListener('click', () => {
      if (currentIdx < filteredExercises.length - 1) { currentIdx++; render(); window.scrollTo({top:0, behavior:'smooth'}); }
    });
  }
  
  // ===== Run code + score =====
  function runCode(ex) {
    if (typeof Sk === 'undefined') {
      alert('Python עדיין נטען, נסה שוב בעוד שנייה...');
      return;
    }
    
    const codeEl = document.getElementById('code-input');
    const code = codeEl.value;
    const outBox = document.getElementById('output-box');
    const outSection = document.getElementById('output-section');
    const verdict = document.getElementById('verdict');
    const runBtn = document.getElementById('run-btn');
    
    outSection.classList.add('show');
    outBox.textContent = '⏳ מריץ...';
    outBox.classList.remove('error');
    verdict.classList.remove('show');
    runBtn.disabled = true;
    
    recordAttempt(ex.id);
    
    let buffer = '';
    Sk.configure({
      output: (text) => { buffer += text; },
      read: (f) => {
        if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][f] === undefined) {
          throw "File not found: '" + f + "'";
        }
        return Sk.builtinFiles["files"][f];
      },
      __future__: Sk.python3,
      execLimit: 8000,
    });
    
    const fullCode = (window.PYTHON_PRELUDE || '') + String.fromCharCode(10) + String.fromCharCode(10) + code;
    
    Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, fullCode, true))
      .then(() => {
        runBtn.disabled = false;
        outBox.textContent = buffer || '(אין פלט)';
        outBox.classList.remove('error');
        
        // === SCORING ===
        // Run the check function
        let passed = false;
        try {
          if (ex.check_fn) {
            const checkFn = eval('(' + ex.check_fn + ')');
            passed = checkFn(buffer, code);
          } else {
            passed = buffer.length > 0; // fallback - just any output
          }
        } catch (e) {
          console.warn('Check function error:', e);
          passed = false;
        }
        
        if (passed) {
          if (ex.explain) {
            const _p = outBox.parentNode;
            const _old = _p.querySelector('.why-box'); if (_old) _old.remove();
            const _w = document.createElement('div');
            _w.className = 'why-box';
            _w.innerHTML = '<div class="why-title">למה זה עובד</div>' + ex.explain;
            _p.insertBefore(_w, outBox.nextSibling);
          }
          // Calculate points
          const currentScore = getExerciseScore(ex.id);
          let earnedPoints = ex.base_points;
          let bonusText = '';
          
          if (hasViewedSolution(ex.id)) {
            // Halved if viewed solution
            earnedPoints = Math.floor(ex.base_points / 2);
            bonusText = ' (פתרון נצפה)';
          } else {
            // First try bonus
            if (isFirstTry(ex.id)) {
              earnedPoints = ex.max_points;
              bonusText = ' (+10 פעם ראשונה! 🎯)';
            }
          }
          
          const isNewScore = !currentScore || currentScore.points < earnedPoints;
          
          if (isNewScore) {
            saveScore(ex.id, earnedPoints, isFirstTry(ex.id));
          }
          
          verdict.className = 'verdict show success';
          verdict.innerHTML = `
            ✅ <b>תשובה נכונה!</b>
            <span class="points-earned">+${earnedPoints} נקודות${bonusText}</span>
            ${currentScore && currentScore.points >= earnedPoints ? '<small>(הניקוד הקודם נשמר)</small>' : ''}
          `;
          
          updateHeader();
          
          // Mini celebration
          if (earnedPoints >= 20) launchConfetti();
          
          // Re-render the exercise to update badge
          setTimeout(() => {
            const badge = document.querySelector('.badge-points, .badge-earned');
            if (badge) {
              badge.className = 'badge badge-earned';
              badge.textContent = `✅ ${earnedPoints} נקודות`;
            }
          }, 600);
        } else {
          verdict.className = 'verdict show fail';
          verdict.innerHTML = `
            🤔 <b>התשובה לא נכונה</b><br>
            <small>בדוק את הפלט מול הצפוי. אם זקוק לעזרה - לחץ "הצג פתרון" (יפחית את הניקוד בחצי)</small>
          `;
        }
      })
      .catch((e) => {
        runBtn.disabled = false;
        outBox.textContent = String(e);
        outBox.classList.add('error');
        verdict.className = 'verdict show fail';
        verdict.innerHTML = `⚠️ <b>שגיאה בקוד</b><br><small>בדוק את הודעת השגיאה למעלה</small>`;
      });
  }
  
  // ===== Mini confetti =====
  function launchConfetti() {
    const colors = ['#00d4c8', '#00e5a0', '#ffd700', '#ff8800', '#8b5cf6', '#ec4899'];
    for (let i = 0; i < 25; i++) {
      const conf = document.createElement('div');
      conf.className = 'confetti';
      conf.style.left = Math.random() * 100 + '%';
      conf.style.background = colors[Math.floor(Math.random() * colors.length)];
      conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      conf.style.transform = `rotate(${Math.random() * 360}deg)`;
      conf.style.transition = 'top 2s linear, opacity 2s linear';
      document.body.appendChild(conf);
      requestAnimationFrame(() => {
        conf.style.top = '110vh';
        conf.style.opacity = '0';
      });
      setTimeout(() => conf.remove(), 2200);
    }
  }
  
  // ===== Filter handlers =====
  document.querySelectorAll('.filter-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.dataset.filterType;
      const value = btn.dataset.filter;
      
      // Toggle off if clicking active
      const isActive = btn.classList.contains('active');
      
      // Reset siblings of same type
      document.querySelectorAll(`.filter-pill[data-filter-type="${type}"]`).forEach(b => b.classList.remove('active'));
      
      if (type === 'course') {
        currentCourse = value;
        btn.classList.add('active');
      } else if (type === 'difficulty') {
        if (isActive) {
          currentDifficulty = null;
        } else {
          currentDifficulty = value;
          btn.classList.add('active');
        }
      } else if (type === 'status') {
        if (isActive) {
          currentStatus = null;
        } else {
          currentStatus = value;
          btn.classList.add('active');
        }
      }
      
      applyFilters();
    });
  });
  
  let searchTimer;
  document.getElementById('search').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      searchQuery = e.target.value.trim();
      applyFilters();
    }, 250);
  });
  
  // Reset score
  document.getElementById('reset-score-btn').addEventListener('click', () => {
    if (confirm('האם אתה בטוח שברצונך לאפס את כל הניקוד?')) {
      localStorage.removeItem(STORAGE_KEY);
      render();
    }
  });
  
  // Initial render
  render();
})();
</script>

<script>(function(){
  var D=document,H=D.documentElement;
  function cur(){return H.getAttribute('data-theme')==='light'?'light':'dark';}
  var btn=D.createElement('button');
  btn.type='button';btn.className='egr-theme-btn';btn.id='egrThemeBtn';
  function paint(){var l=cur()==='light';
    btn.textContent=l?'\u263D':'\u2600';
    btn.title=l?'\u05DE\u05E2\u05D1\u05E8 \u05DC\u05DE\u05E6\u05D1 \u05DB\u05D4\u05D4':'\u05DE\u05E2\u05D1\u05E8 \u05DC\u05DE\u05E6\u05D1 \u05D1\u05D4\u05D9\u05E8';
    btn.setAttribute('aria-label',btn.title);btn.setAttribute('aria-pressed',l?'true':'false');
    var mt=D.querySelector('meta[name="theme-color"]');
    if(mt){if(!mt.dataset.egrDark)mt.dataset.egrDark=mt.getAttribute('content')||'';
      mt.setAttribute('content',l?'#f2f4f8':mt.dataset.egrDark);}}
  btn.addEventListener('click',function(){
    var n=cur()==='light'?'dark':'light';
    H.setAttribute('data-theme',n);
    try{localStorage.setItem('egr-theme',n);}catch(e){}
    paint();});
  function box(el){
    if(!el)return null;
    var c=el.closest?el.closest('header,.topnav,.topbar,.header,nav'):null;
    return c||el.parentElement||el;
  }
  function float(){
    if(btn.parentNode)btn.parentNode.removeChild(btn);
    btn.style.marginInlineStart='';
    btn.classList.add('egr-floating');
    D.body.appendChild(btn);
  }
  function mount(){
    var fl=D.querySelectorAll('a[title="\u05E2\u05D1\u05E8\u05D9\u05EA"],a[title="English"],a[title="\u4E2D\u6587"]');
    var anchor=null,mode=0;
    if(fl.length>=2&&fl[0].parentNode){anchor=fl[0];mode=1;}
    else{
      anchor=D.querySelector('.lang-flags')||D.querySelector('.lang')||
             D.querySelector('.topnav-right')||D.querySelector('.header-right')||
             D.querySelector('.nav-right')||D.querySelector('.topbar-right')||
             D.querySelector('header .hd')||D.querySelector('.header-inner')||
             D.querySelector('.topbar')||D.querySelector('.topnav')||
             D.querySelector('header');
      mode=anchor?2:0;
    }
    if(!mode){float();paint();return;}
    var frame=box(anchor);
    var h0=frame?frame.getBoundingClientRect().height:0;
    var restore=null;
    if(mode===1){
      if(anchor.style&&anchor.style.marginInlineStart==='auto'){
        restore=anchor;btn.style.marginInlineStart='auto';anchor.style.marginInlineStart='0';
      }
      anchor.parentNode.insertBefore(btn,anchor);
    }else{anchor.appendChild(btn);}
    // If squeezing the button in made the bar taller, it does not belong there.
    var h1=frame?frame.getBoundingClientRect().height:0;
    if(frame&&h1>h0+1){
      if(restore)restore.style.marginInlineStart='auto';
      float();
    }
    paint();}
  if(D.readyState==='loading')D.addEventListener('DOMContentLoaded',mount);else mount();
})();</script></body>
