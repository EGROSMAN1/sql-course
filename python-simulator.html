<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🎯 סימולטור עם ניקוד | קורס דאטה</title>
<meta name="theme-color" content="#00d4c8">

<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>

<style>
  :root {
    --bg: #0a0d1f; --bg2: #121530; --bg3: #1a1f3a; --bg4: #252a52;
    --border: #2a2f5c; --border2: #353a6b;
    --text: #f8fafc; --text2: #aab; --text3: #888fa6;
    --cyan: #00d4c8; --green: #00e5a0; --gold: #ffd700; --orange: #ff8800;
    --purple: #8b5cf6; --pink: #ec4899; --red: #ef4444;
    --easy: #10b981; --medium: #f59e0b; --hard: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
  -webkit-tap-highlight-color: rgba(0,212,200,0.2);
  -webkit-text-size-adjust: 100%;
    font-family: -apple-system, "Heebo", "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    direction: rtl; line-height: 1.5;
  }

  /* Top bar with score */
  .topbar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .home-btn {
    background: linear-gradient(135deg, var(--cyan), var(--green));
    color: #000;
    padding: 7px 12px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 700;
    font-size: 12.5px;
  }
  .score-pill {
    margin-inline-start: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, #2a1f0a, #4a3a1f);
    border: 1.5px solid var(--gold);
    padding: 5px 12px;
    border-radius: 14px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--gold);
  }
  .score-pill .total-icon { font-size: 14px; }
  .reset-score-btn {
    background: rgba(239,68,68,0.1);
    color: var(--red);
    border: 1px solid rgba(239,68,68,0.3);
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
  }

  /* Progress strip */
  .progress-strip {
    background: var(--bg2);
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 11.5px;
  }
  .progress-stat {
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--text2);
  }
  .progress-stat .val { color: var(--cyan); font-weight: 700; }
  .progress-stat.easy .val { color: var(--easy); }
  .progress-stat.medium .val { color: var(--medium); }
  .progress-stat.hard .val { color: var(--hard); }
  .progress-bar-wrap {
    flex: 1;
    height: 6px;
    background: var(--bg);
    border-radius: 3px;
    overflow: hidden;
    margin-inline-start: 8px;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--cyan), var(--green));
    transition: width .5s;
  }

  /* Filter bar */
  .filter-bar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 8px 14px;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .filter-bar::-webkit-scrollbar { height: 0; }
  .filter-pill {
    padding: 6px 12px;
    background: var(--bg4);
    border: 1px solid var(--border2);
    border-radius: 14px;
    color: var(--text2);
    font-size: 11.5px;
    cursor: pointer;
    font-family: inherit;
    flex-shrink: 0;
  }
  .filter-pill.active {
    background: var(--cyan); color: #000; border-color: var(--cyan); font-weight: 700;
  }
  .filter-pill.diff-easy.active { background: var(--easy); border-color: var(--easy); }
  .filter-pill.diff-medium.active { background: var(--medium); border-color: var(--medium); }
  .filter-pill.diff-hard.active { background: var(--hard); border-color: var(--hard); color: #fff; }
  .filter-search {
    flex: 1;
    min-width: 130px;
    padding: 6px 12px;
    background: var(--bg4);
    border: 1px solid var(--border2);
    border-radius: 14px;
    color: var(--text);
    font-size: 12px;
    font-family: inherit;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 14px;
  }

  .exercise-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }
  
  .ex-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .ex-icon { font-size: 26px; line-height: 1; }
  .ex-title-block { flex: 1; min-width: 0; }
  .ex-num { font-size: 11px; color: var(--text3); font-weight: 600; }
  .ex-title { font-size: 14px; font-weight: 700; }
  
  /* Badges */
  .ex-badges { display: flex; gap: 5px; flex-wrap: wrap; }
  .badge {
    padding: 3px 9px;
    border-radius: 10px;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .badge-course-python { background: rgba(55,118,171,0.18); color: #5b9fc7; }
  .badge-course-pandas { background: rgba(139,92,246,0.18); color: #b8a6e5; }
  .badge-diff-easy { background: rgba(16,185,129,0.18); color: var(--easy); }
  .badge-diff-medium { background: rgba(245,158,11,0.18); color: var(--medium); }
  .badge-diff-hard { background: rgba(239,68,68,0.18); color: var(--hard); }
  .badge-points {
    background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,136,0,0.15));
    color: var(--gold);
    border: 1px solid rgba(255,215,0,0.4);
  }
  .badge-earned {
    background: linear-gradient(135deg, var(--green), #00a884);
    color: #000;
  }

  .question-box {
    background: rgba(255,215,0,0.07);
    border-inline-start: 3px solid var(--gold);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 12px;
  }
  .question-box code {
    background: rgba(255,215,0,0.18);
    color: var(--gold);
    padding: 2px 7px;
    border-radius: 4px;
    font-family: "SF Mono", Monaco, Menlo, monospace;
    font-size: 12.5px;
  }
  .question-box b { color: var(--cyan); }

  .editor-section { margin-bottom: 12px; }
  .editor-label {
    font-size: 11.5px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 6px;
    font-weight: 700;
  }
  .code-editor {
    width: 100%;
    background: #0a0d1f;
    color: #e0e6ff;
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 12px;
    font-family: "SF Mono", Monaco, Menlo, "Courier New", monospace;
    font-size: 14px;
    direction: ltr;
    text-align: left;
    resize: vertical;
    line-height: 1.6;
    min-height: 120px;
    tab-size: 4;
    user-select: text;
    -webkit-user-select: text;
    -webkit-touch-callout: default;
  }
  .code-editor:focus { outline: none; border-color: var(--cyan); }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: transform .15s;
  }
  .btn:hover, .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.6; cursor: wait; }
  .btn-run { background: linear-gradient(135deg, var(--green), #00a884); color: #000; }
  .btn-solution { background: linear-gradient(135deg, var(--gold), var(--orange)); color: #1a1a2e; }
  .btn-reset { background: rgba(239,68,68,0.1); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }

  .output-section { margin-top: 12px; display: none; }
  .output-section.show { display: block; }
  .output-box {
    background: #0a0d1f;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-family: "SF Mono", Monaco, Menlo, monospace;
    font-size: 13px;
    color: #e0e6ff;
    white-space: pre-wrap;
    direction: ltr;
    text-align: left;
    max-height: 280px;
    overflow-y: auto;
    min-height: 40px;
  }
  .output-box.error { color: #ff6b6b; }

  /* Verdict (with points!) */
  .verdict {
    margin-top: 10px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    display: none;
  }
  .verdict.show { display: block; animation: pop .4s ease; }
  @keyframes pop {
    0% { transform: scale(0.9); opacity: 0; }
    60% { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
  }
  .verdict.success {
    background: linear-gradient(135deg, rgba(0,229,160,0.15), rgba(0,212,200,0.15));
    color: var(--green);
    border: 2px solid var(--green);
  }
  .verdict.fail {
    background: rgba(255,176,32,0.1);
    color: var(--orange);
    border: 1px solid rgba(255,176,32,0.3);
  }
  .verdict .points-earned {
    display: block;
    font-size: 22px;
    margin: 4px 0;
    color: var(--gold);
  }

  /* SOLUTION PANEL */
  .solution-section {
    margin-top: 18px;
    background: linear-gradient(135deg, rgba(255,215,0,0.08), rgba(255,136,0,0.04));
    border: 2px solid rgba(255,215,0,0.4);
    border-radius: 12px;
    padding: 16px;
    display: none;
  }
  .solution-section.show { display: block; animation: slide-in .4s ease; }
  @keyframes slide-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .solution-warning {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    color: var(--red);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    margin-bottom: 12px;
  }
  
  .solution-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,215,0,0.2);
  }
  .solution-header h3 {
    margin: 0;
    font-size: 17px;
    color: var(--gold);
  }
  .copy-btn {
    margin-inline-start: auto;
    background: rgba(255,215,0,0.15);
    color: var(--gold);
    border: 1px solid rgba(255,215,0,0.3);
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 11.5px;
    cursor: pointer;
    font-family: inherit;
  }

  .solution-code {
    background: #0a0d1f;
    border: 1px solid rgba(255,215,0,0.25);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 16px;
    overflow-x: auto;
  }
  .solution-code pre {
    margin: 0;
    color: var(--gold);
    font-family: "SF Mono", Monaco, Menlo, monospace;
    font-size: 13.5px;
    direction: ltr;
    text-align: left;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .explanation-title {
    font-size: 14px;
    color: var(--cyan);
    font-weight: 700;
    margin: 0 0 10px;
  }
  .exp-line-list { list-style: none; padding: 0; margin: 0 0 14px; }
  .exp-line {
    background: rgba(0,212,200,0.05);
    border-inline-start: 2px solid var(--cyan);
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 7px;
  }
  .exp-line-code {
    color: var(--cyan);
    font-family: "SF Mono", Monaco, Menlo, monospace;
    font-size: 13px;
    direction: ltr;
    text-align: left;
    display: block;
    margin-bottom: 5px;
    background: #0a0d1f;
    padding: 5px 9px;
    border-radius: 4px;
    border: 1px solid var(--border2);
  }
  .exp-line-desc { font-size: 13px; color: var(--text); line-height: 1.6; }
  .exp-line-desc code {
    background: rgba(0,212,200,0.18);
    color: var(--cyan);
    padding: 1px 6px;
    border-radius: 3px;
    font-family: "SF Mono", Monaco, Menlo, monospace;
    font-size: 11.5px;
  }

  .theory-section {
    background: rgba(139,92,246,0.06);
    border: 1px solid rgba(139,92,246,0.25);
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 10px;
  }
  .theory-section h4 { margin: 0 0 8px; font-size: 13.5px; color: var(--purple); }
  .theory-section .theory-content { font-size: 13px; color: var(--text); line-height: 1.7; }
  .theory-section code {
    background: rgba(139,92,246,0.18); color: #c4b5fd;
    padding: 1px 6px; border-radius: 4px;
    font-family: "SF Mono", Monaco, Menlo, monospace; font-size: 12px;
  }
  .theory-section pre {
    background: #0a0d1f; padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--border2); overflow-x: auto;
    font-size: 12px; direction: ltr; text-align: left; color: #c4b5fd;
  }

  .nav-row {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    justify-content: space-between;
  }
  .nav-btn {
    background: var(--bg4);
    color: var(--text);
    border: 1px solid var(--border2);
    padding: 9px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
  }
  .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  
  /* Confetti effect for big achievements */
  .confetti {
    position: fixed;
    top: -10px;
    width: 8px;
    height: 8px;
    pointer-events: none;
    z-index: 999;
  }
  
  @media (max-width: 480px) {
    .container { padding: 10px; }
    .exercise-card { padding: 11px; }
    .ex-icon { font-size: 22px; }
    .ex-title { font-size: 13px; }
    .badge { font-size: 11px; padding: 2px 7px; }
    .question-box { font-size: 13px; padding: 9px 12px; }
    .code-editor { font-size: 13px; padding: 10px; min-height: 100px; }
    .btn { padding: 9px 14px; font-size: 12.5px; }
    .solution-code pre, .exp-line-code { font-size: 12px; }
    .solution-section { padding: 12px; }
    .progress-strip { flex-wrap: wrap; gap: 6px; }
    .score-pill { padding: 4px 10px; font-size: 11px; }
  }

  /* === CODE EDITOR TOOLBAR === */
  .editor-wrap {
    position: relative;
  }
  .editor-toolbar {
    display: flex;
    gap: 4px;
    padding: 6px;
    background: var(--bg4);
    border: 1px solid var(--border2);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    flex-wrap: wrap;
  }
  .editor-toolbar .tb-btn {
    background: var(--bg3);
    color: var(--text2);
    border: 1px solid var(--border2);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    -webkit-tap-highlight-color: rgba(0,212,200,0.2);
  }
  .editor-toolbar .tb-btn:hover, .editor-toolbar .tb-btn:active {
    background: var(--cyan);
    color: #000;
    border-color: var(--cyan);
  }
  .editor-toolbar .tb-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .editor-toolbar .tb-btn.copied {
    background: var(--green);
    color: #000;
    border-color: var(--green);
  }
  .editor-wrap .code-editor {
    border-radius: 0 0 8px 8px !important;
    border-top: none !important;
  }
  
  @media (max-width: 480px) {
    .editor-toolbar { padding: 5px; gap: 3px; }
    .editor-toolbar .tb-btn { padding: 5px 8px; font-size: 11px; }
  }

</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="home-btn">🏠 דף הבית</a>
  <button class="reset-score-btn" id="reset-score-btn">🔄 איפוס ניקוד</button>
  <div class="score-pill">
    <span class="total-icon">🏆</span>
    <span><span id="total-score">0</span> / <span id="max-score">5150</span></span>
  </div>
</div>

<div class="progress-strip">
  <div class="progress-stat easy">
    <span>🟢</span> <span class="val" id="easy-done">0</span>/<span id="easy-total">0</span>
  </div>
  <div class="progress-stat medium">
    <span>🟡</span> <span class="val" id="medium-done">0</span>/<span id="medium-total">0</span>
  </div>
  <div class="progress-stat hard">
    <span>🔴</span> <span class="val" id="hard-done">0</span>/<span id="hard-total">0</span>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
</div>

<div class="filter-bar">
  <button class="filter-pill active" data-filter-type="course" data-filter="all">הכל (170)</button>
  <button class="filter-pill" data-filter-type="course" data-filter="python">🐍 Python</button>
  <button class="filter-pill" data-filter-type="course" data-filter="pandas">🐼 Pandas</button>
  <button class="filter-pill diff-easy" data-filter-type="difficulty" data-filter="easy">🟢 קל</button>
  <button class="filter-pill diff-medium" data-filter-type="difficulty" data-filter="medium">🟡 בינוני</button>
  <button class="filter-pill diff-hard" data-filter-type="difficulty" data-filter="hard">🔴 קשה</button>
  <button class="filter-pill" data-filter-type="status" data-filter="todo">⭕ לא נפתרו</button>
  <button class="filter-pill" data-filter-type="status" data-filter="done">✅ נפתרו</button>
  <input type="search" class="filter-search" id="search" placeholder="🔍 חפש..." autocomplete="off">
</div>

<div class="container">
  <div id="content">טוען...</div>
</div>

vals)\n        return result\n    \n    def sum(self):\n        result = {}\n        for c in self._columns:\n            vals = []\n            for v in self._data[c]:\n                if isinstance(v, (int, float)) and not isinstance(v, bool):\n                    vals.append(v)\n            if vals:\n                result[c] = sum(vals)\n        return result\n    \n    def min(self):\n        result = {}\n        for c in self._columns:\n            vals = [v for v in self._data[c] if v is not None]\n            if vals: result[c] = min(vals)\n        return result\n    \n    def max(self):\n        result = {}\n        for c in self._columns:\n            vals = [v for v in self._data[c] if v is not None]\n            if vals: result[c] = max(vals)\n        return result\n    \n    def count(self):\n        \"\"\"Count non-null per column.\"\"\"\n        result = {}\n        for c in self._columns:\n            cnt = 0\n            for v in self._data[c]:\n                if v is not None:\n                    cnt += 1\n            result[c] = cnt\n        return result\n    \n    def describe(self):\n        result = {}\n        for c in self._columns:\n            vals = []\n            for v in self._data[c]:\n                if isinstance(v, (int, float)) and not isinstance(v, bool):\n                    vals.append(v)\n            if vals:\n                result[c] = {\n                    \"count\": len(vals),\n                    \"mean\": round(sum(vals)/len(vals), 2),\n                    \"min\": min(vals),\n                    \"max\": max(vals)\n                }\n        return result\n    \n    def to_dict(self):\n        return dict(self._data)\n    \n    # ===== Data cleaning =====\n    \n    def drop(self, columns=None, index=None):\n        \"\"\"Drop columns or rows.\"\"\"\n        if columns is not None:\n            cols_to_drop = columns if isinstance(columns, list) else [columns]\n            new_data = {}\n            new_cols = []\n            for c in self._columns:\n                if c not in cols_to_drop:\n                    new_data[c] = self._data[c]\n                    new_cols.append(c)\n            result = DataFrame(new_data)\n            result._columns = new_cols\n            return result\n        if index is not None:\n            indices = index if isinstance(index, list) else [index]\n            new_data = {}\n            for c in self._columns:\n                new_data[c] = []\n                for i in range(self._nrows):\n                    if i not in indices:\n                        new_data[c].append(self._data[c][i])\n            return DataFrame(new_data)\n        return DataFrame(self._data)\n    \n    def drop_duplicates(self):\n        \"\"\"Remove duplicate rows.\"\"\"\n        seen = []\n        keep_indices = []\n        for i in range(self._nrows):\n            row_tuple = tuple(self._data[c][i] for c in self._columns)\n            if row_tuple not in seen:\n                seen.append(row_tuple)\n                keep_indices.append(i)\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [self._data[c][i] for i in keep_indices]\n        return DataFrame(new_data)\n    \n    def isna(self):\n        \"\"\"Return df of booleans where values are None.\"\"\"\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [v is None for v in self._data[c]]\n        return DataFrame(new_data)\n    \n    def fillna(self, value):\n        \"\"\"Replace None values.\"\"\"\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [value if v is None else v for v in self._data[c]]\n        return DataFrame(new_data)\n    \n    def dropna(self):\n        \"\"\"Drop rows with any None.\"\"\"\n        keep = []\n        for i in range(self._nrows):\n            has_none = False\n            for c in self._columns:\n                if self._data[c][i] is None:\n                    has_none = True; break\n            if not has_none:\n                keep.append(i)\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [self._data[c][i] for i in keep]\n        return DataFrame(new_data)\n    \n    def rename(self, columns):\n        \"\"\"Rename columns: df.rename({'old':'new'})\"\"\"\n        new_data = {}\n        new_cols = []\n        for c in self._columns:\n            new_name = columns.get(c, c)\n            new_data[new_name] = self._data[c]\n            new_cols.append(new_name)\n        result = DataFrame(new_data)\n        result._columns = new_cols\n        return result\n    \n    def astype(self, col, dtype):\n        \"\"\"Convert column to type. dtype: int, float, str.\"\"\"\n        new_data = dict(self._data)\n        new_vals = []\n        for v in self._data[col]:\n            if v is None:\n                new_vals.append(None)\n            elif dtype == int or dtype == \"int\":\n                new_vals.append(int(v))\n            elif dtype == float or dtype == \"float\":\n                new_vals.append(float(v))\n            elif dtype == str or dtype == \"str\":\n                new_vals.append(str(v))\n            else:\n                new_vals.append(v)\n        new_data[col] = new_vals\n        return DataFrame(new_data)\n    \n    def clip(self, col, lower=None, upper=None):\n        \"\"\"Clip values in column to range.\"\"\"\n        new_data = dict(self._data)\n        new_vals = []\n        for v in self._data[col]:\n            if v is None:\n                new_vals.append(None); continue\n            if lower is not None and v < lower: v = lower\n            if upper is not None and v > upper: v = upper\n            new_vals.append(v)\n        new_data[col] = new_vals\n        return DataFrame(new_data)\n    \n    def nunique(self):\n        \"\"\"Count unique values per column.\"\"\"\n        result = {}\n        for c in self._columns:\n            seen = []\n            for v in self._data[c]:\n                if v not in seen:\n                    seen.append(v)\n            result[c] = len(seen)\n        return result\n    \n    # ===== Grouping / aggregation =====\n    \n    def groupby(self, by):\n        \"\"\"Group by column.\"\"\"\n        return GroupBy(self, by)\n    \n    # ===== Merging =====\n    \n    def merge(self, other, on, how=\"inner\"):\n        \"\"\"Merge two DataFrames on a key column. how: 'inner' or 'left'.\"\"\"\n        # Build index for other df\n        other_index = {}\n        for i in range(other._nrows):\n            k = other._data[on][i]\n            if k not in other_index:\n                other_index[k] = []\n            other_index[k].append(i)\n        \n        # New columns: my cols + other cols (without duplicate 'on')\n        my_cols = list(self._columns)\n        other_cols = [c for c in other._columns if c != on]\n        new_data = {}\n        for c in my_cols:\n            new_data[c] = []\n        for c in other_cols:\n            new_data[c] = []\n        \n        for i in range(self._nrows):\n            key = self._data[on][i]\n            if key in other_index:\n                for j in other_index[key]:\n                    for c in my_cols:\n                        new_data[c].append(self._data[c][i])\n                    for c in other_cols:\n                        new_data[c].append(other._data[c][j])\n            elif how == \"left\":\n                for c in my_cols:\n                    new_data[c].append(self._data[c][i])\n                for c in other_cols:\n                    new_data[c].append(None)\n        return DataFrame(new_data)\n    \n    # ===== Concat =====\n    \n    @staticmethod\n    def concat(dfs):\n        \"\"\"Concatenate list of DataFrames vertically.\"\"\"\n        if not dfs: return DataFrame({})\n        new_data = {}\n        cols = dfs[0]._columns\n        for c in cols:\n            new_data[c] = []\n        for df in dfs:\n            for c in cols:\n                if c in df._data:\n                    new_data[c].extend(df._data[c])\n                else:\n                    new_data[c].extend([None] * df._nrows)\n        return DataFrame(new_data)\n    \n    # ===== Set/reset index =====\n    \n    def set_index(self, col):\n        \"\"\"Make a column the row index (for display only - we don't really track indices).\"\"\"\n        # Just move that column to first position\n        if col not in self._columns:\n            raise ValueError(\"Column not found: \" + col)\n        new_cols = [col] + [c for c in self._columns if c != col]\n        new_data = {}\n        for c in new_cols:\n            new_data[c] = self._data[c]\n        result = DataFrame(new_data)\n        result._columns = new_cols\n        return result\n    \n    def reset_index(self):\n        \"\"\"Add an index column.\"\"\"\n        new_data = {\"index\": list(range(self._nrows))}\n        for c in self._columns:\n            new_data[c] = self._data[c]\n        return DataFrame(new_data)\n    \n    # ===== Info =====\n    \n    def info(self):\n        \"\"\"Print summary.\"\"\"\n        print(\"DataFrame: \" + str(self._nrows) + \" rows x \" + str(len(self._columns)) + \" columns\")\n        print(\"Columns:\")\n        for c in self._columns:\n            non_null = 0\n            for v in self._data[c]:\n                if v is not None: non_null += 1\n            sample = self._data[c][0] if self._nrows > 0 else None\n            type_name = type(sample).__name__ if sample is not None else \"unknown\"\n            print(\"  \" + c + \" (\" + type_name + \"): \" + str(non_null) + \" non-null\")\n    \n    def __str__(self):\n        return self._render_text()\n    \n    def __repr__(self):\n        return self._render_text()\n    \n    def _render_text(self):\n        if not self._columns:\n            return \"Empty DataFrame\"\n        lines = []\n        header = \"__DATAFRAME__|\" + \"|\".join([str(c) for c in self._columns])\n        lines.append(header)\n        for i in range(self._nrows):\n            row_vals = []\n            for c in self._columns:\n                row_vals.append(str(self._data[c][i]))\n            lines.append(\"__DATAROW__|\" + \"|\".join(row_vals))\n        lines.append(\"__DATAFRAME_END__\")\n        return \"\\n\".join(lines)\n\n\nclass GroupBy:\n    \"\"\"Result of df.groupby(col). Supports .mean(), .sum(), .count(), .agg().\"\"\"\n    def __init__(self, df, by):\n        self._df = df\n        self._by = by\n        # Build groups\n        self._groups = {}\n        col_data = df._data[by]\n        for i in range(df._nrows):\n            key = col_data[i]\n            if key not in self._groups:\n                self._groups[key] = []\n            self._groups[key].append(i)\n    \n    def _agg(self, fn):\n        \"\"\"Apply agg function per group, return DataFrame.\"\"\"\n        other_cols = [c for c in self._df._columns if c != self._by]\n        new_data = {self._by: []}\n        for c in other_cols:\n            new_data[c] = []\n        for key, indices in self._groups.items():\n            new_data[self._by].append(key)\n            for c in other_cols:\n                vals = []\n                for i in indices:\n                    v = self._df._data[c][i]\n                    if isinstance(v, (int, float)) and not isinstance(v, bool):\n                        vals.append(v)\n                if vals:\n                    new_data[c].append(fn(vals))\n                else:\n                    new_data[c].append(None)\n        return DataFrame(new_data)\n    \n    def mean(self):\n        return self._agg(lambda v: round(sum(v)/len(v), 2))\n    \n    def sum(self):\n        return self._agg(sum)\n    \n    def max(self):\n        return self._agg(max)\n    \n    def min(self):\n        return self._agg(min)\n    \n    def count(self):\n        \"\"\"Count rows per group.\"\"\"\n        new_data = {self._by: [], \"count\": []}\n        for key, indices in self._groups.items():\n            new_data[self._by].append(key)\n            new_data[\"count\"].append(len(indices))\n        return DataFrame(new_data)\n    \n    def size(self):\n        \"\"\"Same as count - rows per group.\"\"\"\n        return self.count()\n\n\nclass Series:\n    \"\"\"A column from a DataFrame.\"\"\"\n    def __init__(self, data, name=None):\n        self._data = list(data)\n        self.name = name\n    \n    def __len__(self):\n        return len(self._data)\n    \n    def __getitem__(self, i):\n        return self._data[i]\n    \n    def __iter__(self):\n        return iter(self._data)\n    \n    def gt(self, other): return [v > other for v in self._data if v is not None] if False else [v > other if v is not None else False for v in self._data]\n    def lt(self, other): return [v < other if v is not None else False for v in self._data]\n    def ge(self, other): return [v >= other if v is not None else False for v in self._data]\n    def le(self, other): return [v <= other if v is not None else False for v in self._data]\n    def eq(self, other): return [v == other for v in self._data]\n    \n    def mean(self):\n        nums = [v for v in self._data if isinstance(v, (int, float)) and not isinstance(v, bool)]\n        if nums: return sum(nums) / len(nums)\n        return 0\n    \n    def sum(self):\n        nums = [v for v in self._data if isinstance(v, (int, float)) and not isinstance(v, bool)]\n        return sum(nums)\n    \n    def max(self):\n        vals = [v for v in self._data if v is not None]\n        return max(vals) if vals else None\n    \n    def min(self):\n        vals = [v for v in self._data if v is not None]\n        return min(vals) if vals else None\n    \n    def unique(self):\n        seen = []\n        for v in self._data:\n            if v not in seen:\n                seen.append(v)\n        return seen\n    \n    def nunique(self):\n        return len(self.unique())\n    \n    def count(self):\n        cnt = 0\n        for v in self._data:\n            if v is not None: cnt += 1\n        return cnt\n    \n    def value_counts(self):\n        counts = {}\n        for v in self._data:\n            if v in counts: counts[v] += 1\n            else: counts[v] = 1\n        # Sort by count descending\n        items = list(counts.items())\n        items.sort(key=lambda x: -x[1])\n        result = {}\n        for k, v in items:\n            result[k] = v\n        return result\n    \n    def isna(self):\n        return [v is None for v in self._data]\n    \n    def fillna(self, value):\n        return Series([value if v is None else v for v in self._data], name=self.name)\n    \n    def apply(self, fn):\n        return Series([fn(v) for v in self._data], name=self.name)\n    \n    def map(self, mapping):\n        \"\"\"Map values via dict or function.\"\"\"\n        if isinstance(mapping, dict):\n            return Series([mapping.get(v, v) for v in self._data], name=self.name)\n        return Series([mapping(v) for v in self._data], name=self.name)\n    \n    def round(self, n=0):\n        return Series([round(v, n) if isinstance(v, (int, float)) else v for v in self._data], name=self.name)\n    \n    def cumsum(self):\n        result = []\n        total = 0\n        for v in self._data:\n            if isinstance(v, (int, float)):\n                total += v\n            result.append(total)\n        return Series(result, name=self.name)\n    \n    def pct_change(self):\n        result = [None]\n        for i in range(1, len(self._data)):\n            prev = self._data[i-1]\n            curr = self._data[i]\n            if prev and isinstance(prev, (int, float)) and isinstance(curr, (int, float)):\n                result.append((curr - prev) / prev)\n            else:\n                result.append(None)\n        return Series(result, name=self.name)\n    \n    def __str__(self):\n        return str(self._data)\n    \n    def __repr__(self):\n        return \"Series(\" + str(self._dat 84, 92, 70, 87]\n        }\n    },\n    \"sales\": {\n        \"name\": \"מכירות חודשיות\",\n        \"desc\": \"מחזור בחנות\",\n        \"data\": {\n            \"month\": [\"ינואר\", \"פברואר\", \"מרץ\", \"אפריל\", \"מאי\", \"יוני\", \"יולי\", \"אוגוסט\", \"ספטמבר\", \"אוקטובר\", \"נובמבר\", \"דצמבר\"],\n            \"revenue\": [45000, 38000, 52000, 49000, 61000, 72000, 68000, 71000, 58000, 53000, 64000, 89000],\n            \"units\": [120, 95, 140, 130, 165, 195, 180, 192, 155, 140, 170, 240]\n        }\n    },\n    \"covid-israel\": {\n        \"name\": \"נתוני קורונה ישראל\",\n        \"desc\": \"מקרים בחודש\",\n        \"data\": {\n            \"date\": [\"01/01\", \"08/01\", \"15/01\", \"22/01\", \"29/01\", \"05/02\", \"12/02\", \"19/02\"],\n            \"positive\": [3200, 4500, 6100, 8200, 7800, 5300, 3900, 2400],\n            \"tested\": [45000, 52000, 60000, 67000, 65000, 50000, 41000, 35000],\n            \"hospitalized\": [180, 230, 320, 410, 380, 290, 220, 160]\n        }\n    },\n    \"eurovision\": {\n        \"name\": \"אירוויזיון - ישראל\",\n        \"desc\": \"תוצאות\",\n        \"data\": {\n            \"year\": [2018, 2019, 2021, 2022, 2023, 2024],\n            \"place\": [1, 23, 17, 13, 3, 5],\n            \"points\": [529, 35, 93, 61, 362, 375],\n            \"song\": [\"Toy\", \"Home\", \"Set Me Free\", \"I.M\", \"Unicorn\", \"Hurricane\"]\n        }\n    },\n    \"telecom-churn\": {\n        \"name\": \"נטישת לקוחות טלקום\",\n        \"desc\": \"15 לקוחות עם נתוני נטישה\",\n        \"data\": {\n            \"customer_id\": [101,102,103,104,105,106,107,108,109,110,111,112,113,114,115],\n            \"age\": [25, 45, 32, 58, 29, 41, 36, 52, 27, 48, 33, 60, 30, 44, 38],\n            \"monthly_bill\": [45.5, 120.0, 80.3, 150.0, 35.0, 95.0, 70.5, 130.0, 50.0, 110.0, 65.0, 140.0, 55.0, 100.0, 75.0],\n            \"tenure_months\": [12, 60, 24, 84, 6, 36, 18, 72, 8, 48, 30, 96, 14, 42, 22],\n            \"churn\": [0, 1, 0, 1, 1, 0, 0, 1, 1, 1, 0 // =============== APP ===============
(function() {
  'use strict';
  
  const STORAGE_KEY = 'simulator_v2_scores';
  const allExercises = window.SIM_EXERCISES;
  let filteredExercises = allExercises.slice();
  let currentIdx = 0;
  let currentCourse = 'all';
  let currentDifficulty = null;
  let currentStatus = null;
  let searchQuery = '';

  // ===== Scoring storage =====
  function getScores() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
    catch(e) { return {}; }
  }
  function saveScore(exId, points, firstTry) {
    const scores = getScores();
    if (!scores[exId] || scores[exId].points < points) {
      scores[exId] = {
        points: points,
        firstTry: firstTry,
        completedAt: new Date().toISOString(),
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
    }
    return scores[exId];
  }
  function getExerciseScore(exId) {
    const scores = getScores();
    return scores[exId] || null;
  }
  function getTotalScore() {
    const scores = getScores();
    return Object.values(scores).reduce((sum, s) => sum + (s.points || 0), 0);
  }
  function getMaxScore() {
    return allExercises.reduce((sum, e) => sum + e.max_points, 0);
  }
  function getCountsByDifficulty() {
    const scores = getScores();
    const result = {
      easy: { done: 0, total: 0 },
      medium: { done: 0, total: 0 },
      hard: { done: 0, total: 0 },
    };
    allExercises.forEach(e => {
      result[e.difficulty].total++;
      if (scores[e.id]) result[e.difficulty].done++;
    });
    return result;
  }
  
  // ===== Track attempts per exercise (for first-try bonus) =====
  const attempts = {}; // exId -> count
  function recordAttempt(exId) {
    attempts[exId] = (attempts[exId] || 0) + 1;
    return attempts[exId];
  }
  function isFirstTry(exId) {
    return (attempts[exId] || 0) <= 1;
  }
  
  // ===== Track solution-viewed =====
  const solutionViewed = new Set();
  function viewedSolution(exId) {
    solutionViewed.add(exId);
  }
  function hasViewedSolution(exId) {
    return solutionViewed.has(exId);
  }

  // ===== Update header stats =====
  function updateHeader() {
    document.getElementById('total-score').textContent = getTotalScore();
    document.getElementById('max-score').textContent = getMaxScore();
    
    const counts = getCountsByDifficulty();
    document.getElementById('easy-done').textContent = counts.easy.done;
    document.getElementById('easy-total').textContent = counts.easy.total;
    document.getElementById('medium-done').textContent = counts.medium.done;
    document.getElementById('medium-total').textContent = counts.medium.total;
    document.getElementById('hard-done').textContent = counts.hard.done;
    document.getElementById('hard-total').textContent = counts.hard.total;
    
    const total = counts.easy.total + counts.medium.total + counts.hard.total;
    const done = counts.easy.done + counts.medium.done + counts.hard.done;
    const pct = total > 0 ? (done / total) * 100 : 0;
    document.getElementById('progress-fill').style.width = pct + '%';
  }

  function applyFilters() {
    filteredExercises = allExercises.filter(e => {
      if (currentCourse !== 'all' && e.course !== currentCourse) return false;
      if (currentDifficulty && e.difficulty !== currentDifficulty) return false;
      if (currentStatus) {
        const hasScore = !!getExerciseScore(e.id);
        if (currentStatus === 'done' && !hasScore) return false;
        if (currentStatus === 'todo' && hasScore) return false;
      }
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        const text = (e.q + ' ' + e.topic_title + ' ' + e.solution).toLowerCase();
        if (!text.includes(q)) return false;
      }
      return true;
    });
    currentIdx = 0;
    render();
  }

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  
  // === CODE EDITOR TOOLBAR (copy/paste/cut/select) ===
  function wireEditorToolbar() {
    const editor = document.getElementById('code-input');
    if (!editor) return;
    
    const copyBtn = document.getElementById('tb-copy');
    const pasteBtn = document.getElementById('tb-paste');
    const cutBtn = document.getElementById('tb-cut');
    const selectBtn = document.getElementById('tb-select');
    const clearBtn = document.getElementById('tb-clear');
    
    if (copyBtn) {
      copyBtn.addEventListener('click', () => {
        const text = editor.value;
        if (!text) return;
        const showCopied = () => {
          copyBtn.classList.add('copied');
          copyBtn.innerHTML = '✅ הועתק';
          setTimeout(() => {
            copyBtn.classList.remove('copied');
            copyBtn.innerHTML = '📋 העתק';
          }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(showCopied).catch(() => {
            // Fallback
            editor.select();
            document.execCommand('copy');
            showCopied();
          });
        } else {
          editor.select();
          document.execCommand('copy');
          showCopied();
        }
      });
    }
    
    if (pasteBtn) {
      pasteBtn.addEventListener('click', async () => {
        try {
          if (navigator.clipboard && navigator.clipboard.readText) {
            const text = await navigator.clipboard.readText();
            // Insert at cursor position
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            editor.value = editor.value.slice(0, start) + text + editor.value.slice(end);
            // Move cursor to end of pasted text
            editor.selectionStart = editor.selectionEnd = start + text.length;
            editor.focus();
            pasteBtn.classList.add('copied');
            pasteBtn.innerHTML = '✅ הודבק';
            setTimeout(() => {
              pasteBtn.classList.remove('copied');
              pasteBtn.innerHTML = '📥 הדבק';
            }, 1500);
          } else {
            // Fallback: focus and tell user
            editor.focus();
            alert('להדבקה: לחץ ארוך על העורך ובחר "Paste"');
          }
        } catch(e) {
          editor.focus();
          alert('לא ניתן לגשת ללוח. השתמש ב-Ctrl+V או לחיצה ארוכה');
        }
      });
    }
    
    if (cutBtn) {
      cutBtn.addEventListener('click', () => {
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        const selected = editor.value.slice(start, end) || editor.value;
        const showCut = () => {
          cutBtn.classList.add('copied');
          cutBtn.innerHTML = '✅ נגזר';
          setTimeout(() => {
            cutBtn.classList.remove('copied');
            cutBtn.innerHTML = '✂️ גזור';
          }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(selected).then(() => {
            if (start === end) {
              // Cut everything
              editor.value = '';
            } else {
              editor.value = editor.value.slice(0, start) + editor.value.slice(end);
              editor.selectionStart = editor.selectionEnd = start;
            }
            showCut();
          });
        } else {
          editor.select();
          document.execCommand('cut');
          showCut();
        }
      });
    }
    
    if (selectBtn) {
      selectBtn.addEventListener('click', () => {
        editor.focus();
        editor.select();
      });
    }
    
    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        if (confirm('לנקות את כל הקוד?')) {
          editor.value = '';
          editor.focus();
        }
      });
    }
  }


  function render() {
    updateHeader();
    
    if (filteredExercises.length === 0) {
      document.getElementById('content').innerHTML = 
        '<div style="text-align:center;padding:30px;color:var(--text2);">לא נמצאו תרגילים שמתאימים לסינון</div>';
      return;
    }
    
    if (currentIdx >= filteredExercises.length) currentIdx = filteredExercises.length - 1;
    if (currentIdx < 0) currentIdx = 0;
    
    const ex = filteredExercises[currentIdx];
    const score = getExerciseScore(ex.id);
    
    // Build explanation HTML
    let explanationHTML = '';
    if (ex.explanation && ex.explanation.length > 0) {
      explanationHTML = '<h4 class="explanation-title">📖 הסבר שורה אחר שורה:</h4><ul class="exp-line-list">';
      ex.explanation.forEach(item => {
        explanationHTML += `
          <li class="exp-line">
            <code class="exp-line-code">${escapeHtml(item.line)}</code>
            <div class="exp-line-desc">${item.exp}</div>
          </li>`;
      });
      explanationHTML += '</ul>';
    }
    
    let theoryHTML = '';
    if (ex.theory && ex.theory.length > 20) {
      theoryHTML = `
        <div class="theory-section">
          <h4>📚 רקע תיאורטי</h4>
          <div class="theory-content">${ex.theory}</div>
        </div>`;
    }
    
    // Badges
    const courseBadge = ex.course === 'python' 
      ? '<span class="badge badge-course-python">🐍 Python</span>'
      : '<span class="badge badge-course-pandas">🐼 Pandas</span>';
    
    const diffLabels = { easy: '🟢 קל', medium: '🟡 בינוני', hard: '🔴 קשה' };
    const diffBadge = `<span class="badge badge-diff-${ex.difficulty}">${diffLabels[ex.difficulty]}</span>`;
    
    let pointsBadge;
    if (score) {
      pointsBadge = `<span class="badge badge-earned">✅ ${score.points} נקודות</span>`;
    } else {
      pointsBadge = `<span class="badge badge-points">🏆 עד ${ex.max_points} נקודות</span>`;
    }
    
    const html = `
      <div class="exercise-card">
        <div class="ex-header">
          <div class="ex-icon">${ex.topic_icon}</div>
          <div class="ex-title-block">
            <div class="ex-num">${escapeHtml(ex.topic_title)}</div>
            <div class="ex-title">תרגיל ${currentIdx + 1} / ${filteredExercises.length}</div>
          </div>
          <div class="ex-badges">
            ${courseBadge}
            ${diffBadge}
            ${pointsBadge}
          </div>
        </div>
        
        <div class="question-box">${ex.q}</div>
        
        <div class="editor-section">
          <div class="editor-label">💻 כתוב את הקוד שלך כאן:</div>
          <div class="editor-wrap">
          <div class="editor-toolbar">
            <button class="tb-btn" id="tb-copy" type="button">📋 העתק</button>
            <button class="tb-btn" id="tb-paste" type="button">📥 הדבק</button>
            <button class="tb-btn" id="tb-cut" type="button">✂️ גזור</button>
            <button class="tb-btn" id="tb-select" type="button">🔘 בחר הכל</button>
            <button class="tb-btn" id="tb-clear" type="button">🗑️ נקה</button>
          </div>
          <textarea class="code-editor" id="code-input" spellcheck="false" rows="8">${escapeHtml(ex.starter || '')}</textarea>
        </div>
          
          <div class="actions">
            <button class="btn btn-run" id="run-btn">▶ הרץ ובדוק</button>
            <button class="btn btn-solution" id="sol-btn">💡 הצג פתרון</button>
            <button class="btn btn-reset" id="reset-btn">🔄 איפוס</button>
          </div>
        </div>
        
        <div class="output-section" id="output-section">
          <div class="editor-label">📤 תוצאה:</div>
          <div class="output-box" id="output-box"></div>
        </div>
        
        <div class="verdict" id="verdict"></div>
        
        <div class="solution-section" id="solution-section">
          ${!score ? '<div class="solution-warning">⚠️ צפייה בפתרון לפני פתרון מצליחה תפחית את הניקוד בחצי (' + Math.floor(ex.base_points / 2) + ' נקודות במקום ' + ex.max_points + ')</div>' : ''}
          
          <div class="solution-header">
            <h3>💡 פתרון רשמי</h3>
            <button class="copy-btn" id="copy-btn">📋 העתק</button>
          </div>
          
          <div class="solution-code">
            <pre>${escapeHtml(ex.solution)}</pre>
          </div>
          
          ${explanationHTML}
          
          ${theoryHTML}
        </div>
        
        <div class="nav-row">
          <button class="nav-btn" id="prev-btn" ${currentIdx === 0 ? 'disabled' : ''}>→ הקודם</button>
          <button class="nav-btn" id="next-btn" ${currentIdx === filteredExercises.length - 1 ? 'disabled' : ''}>הבא ←</button>
        </div>
      </div>
    `;
    
    document.getElementById('content').innerHTML = html;
    wireUp(ex);
  }
  
  function wireUp(ex) {
    document.getElementById('run-btn').addEventListener('click', () => runCode(ex));
    wireEditorToolbar();
    document.getElementById('sol-btn').addEventListener('click', () => {
      const sec = document.getElementById('solution-section');
      const btn = document.getElementById('sol-btn');
      if (sec.classList.contains('show')) {
        sec.classList.remove('show');
        btn.innerHTML = '💡 הצג פתרון';
      } else {
        sec.classList.add('show');
        btn.innerHTML = '🙈 הסתר פתרון';
        viewedSolution(ex.id);
        sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
    document.getElementById('reset-btn').addEventListener('click', () => {
      document.getElementById('code-input').value = ex.starter || '';
      document.getElementById('output-section').classList.remove('show');
      document.getElementById('solution-section').classList.remove('show');
      document.getElementById('verdict').classList.remove('show');
      document.getElementById('sol-btn').innerHTML = '💡 הצג פתרון';
    });
    document.getElementById('copy-btn').addEventListener('click', () => {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(ex.solution).then(() => {
          const b = document.getElementById('copy-btn');
          b.textContent = '✅ הועתק!';
          setTimeout(() => { b.textContent = '📋 העתק'; }, 1800);
        });
      }
    });
    
    document.getElementById('prev-btn').addEventListener('click', () => {
      if (currentIdx > 0) { currentIdx--; render(); window.scrollTo({top:0, behavior:'smooth'}); }
    });
    document.getElementById('next-btn').addEventListener('click', () => {
      if (currentIdx < filteredExercises.length - 1) { currentIdx++; render(); window.scrollTo({top:0, behavior:'smooth'}); }
    });
  }
  
  // ===== Run code + score =====
  function runCode(ex) {
    if (typeof Sk === 'undefined') {
      alert('Python עדיין נטען, נסה שוב בעוד שנייה...');
      return;
    }
    
    const codeEl = document.getElementById('code-input');
    const code = codeEl.value;
    const outBox = document.getElementById('output-box');
    const outSection = document.getElementById('output-section');
    const verdict = document.getElementById('verdict');
    const runBtn = document.getElementById('run-btn');
    
    outSection.classList.add('show');
    outBox.textContent = '⏳ מריץ...';
    outBox.classList.remove('error');
    verdict.classList.remove('show');
    runBtn.disabled = true;
    
    recordAttempt(ex.id);
    
    let buffer = '';
    Sk.configure({
      output: (text) => { buffer += text; },
      read: (f) => {
        if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][f] === undefined) {
          throw "File not found: '" + f + "'";
        }
        return Sk.builtinFiles["files"][f];
      },
      __future__: Sk.python3,
      execLimit: 8000,
    });
    
    const fullCode = (window.PYTHON_PRELUDE || '') + String.fromCharCode(10) + String.fromCharCode(10) + code;
    
    Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, fullCode, true))
      .then(() => {
        runBtn.disabled = false;
        outBox.textContent = buffer || '(אין פלט)';
        outBox.classList.remove('error');
        
        // === SCORING ===
        // Run the check function
        let passed = false;
        try {
          if (ex.check_fn) {
            const checkFn = eval('(' + ex.check_fn + ')');
            passed = checkFn(buffer, code);
          } else {
            passed = buffer.length > 0; // fallback - just any output
          }
        } catch (e) {
          console.warn('Check function error:', e);
          passed = false;
        }
        
        if (passed) {
          // Calculate points
          const currentScore = getExerciseScore(ex.id);
          let earnedPoints = ex.base_points;
          let bonusText = '';
          
          if (hasViewedSolution(ex.id)) {
            // Halved if viewed solution
            earnedPoints = Math.floor(ex.base_points / 2);
            bonusText = ' (פתרון נצפה)';
          } else {
            // First try bonus
            if (isFirstTry(ex.id)) {
              earnedPoints = ex.max_points;
              bonusText = ' (+10 פעם ראשונה! 🎯)';
            }
          }
          
          const isNewScore = !currentScore || currentScore.points < earnedPoints;
          
          if (isNewScore) {
            saveScore(ex.id, earnedPoints, isFirstTry(ex.id));
          }
          
          verdict.className = 'verdict show success';
          verdict.innerHTML = `
            ✅ <b>תשובה נכונה!</b>
            <span class="points-earned">+${earnedPoints} נקודות${bonusText}</span>
            ${currentScore && currentScore.points >= earnedPoints ? '<small>(הניקוד הקודם נשמר)</small>' : ''}
          `;
          
          updateHeader();
          
          // Mini celebration
          if (earnedPoints >= 20) launchConfetti();
          
          // Re-render the exercise to update badge
          setTimeout(() => {
            const badge = document.querySelector('.badge-points, .badge-earned');
            if (badge) {
              badge.className = 'badge badge-earned';
              badge.textContent = `✅ ${earnedPoints} נקודות`;
            }
          }, 600);
        } else {
          verdict.className = 'verdict show fail';
          verdict.innerHTML = `
            🤔 <b>התשובה לא נכונה</b><br>
            <small>בדוק את הפלט מול הצפוי. אם זקוק לעזרה - לחץ "הצג פתרון" (יפחית את הניקוד בחצי)</small>
          `;
        }
      })
      .catch((e) => {
        runBtn.disabled = false;
        outBox.textContent = String(e);
        outBox.classList.add('error');
        verdict.className = 'verdict show fail';
        verdict.innerHTML = `⚠️ <b>שגיאה בקוד</b><br><small>בדוק את הודעת השגיאה למעלה</small>`;
      });
  }
  
  // ===== Mini confetti =====
  function launchConfetti() {
    const colors = ['#00d4c8', '#00e5a0', '#ffd700', '#ff8800', '#8b5cf6', '#ec4899'];
    for (let i = 0; i < 25; i++) {
      const conf = document.createElement('div');
      conf.className = 'confetti';
      conf.style.left = Math.random() * 100 + '%';
      conf.style.background = colors[Math.floor(Math.random() * colors.length)];
      conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      conf.style.transform = `rotate(${Math.random() * 360}deg)`;
      conf.style.transition = 'top 2s linear, opacity 2s linear';
      document.body.appendChild(conf);
      requestAnimationFrame(() => {
        conf.style.top = '110vh';
        conf.style.opacity = '0';
      });
      setTimeout(() => conf.remove(), 2200);
    }
  }
  
  // ===== Filter handlers =====
  document.querySelectorAll('.filter-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.dataset.filterType;
      const value = btn.dataset.filter;
      
      // Toggle off if clicking active
      const isActive = btn.classList.contains('active');
      
      // Reset siblings of same type
      document.querySelectorAll(`.filter-pill[data-filter-type="${type}"]`).forEach(b => b.classList.remove('active'));
      
      if (type === 'course') {
        currentCourse = value;
        btn.classList.add('active');
      } else if (type === 'difficulty') {
        if (isActive) {
          currentDifficulty = null;
        } else {
          currentDifficulty = value;
          btn.classList.add('active');
        }
      } else if (type === 'status') {
        if (isActive) {
          currentStatus = null;
        } else {
          currentStatus = value;
          btn.classList.add('active');
        }
      }
      
      applyFilters();
    });
  });
  
  let searchTimer;
  document.getElementById('search').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      searchQuery = e.target.value.trim();
      applyFilters();
    }, 250);
  });
  
  // Reset score
  document.getElementById('reset-score-btn').addEventListener('click', () => {
    if (confirm('האם אתה בטוח שברצונך לאפס את כל הניקוד?')) {
      localStorage.removeItem(STORAGE_KEY);
      render();
    }
  });
  
  // Initial render
  render();
})();
</script>
