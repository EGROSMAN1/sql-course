  "starter": "",
  "solution": "a = DataFrame({\"x\": [1, 2, 3]})\nb = DataFrame({\"x\": [4, 5, 6]})\nresult = pd.concat([a, b])\nprint(a.shape, b.shape, result.shape)\nprint(result[\"x\"])",
  "check_fn": "(o,c) => { const s=String(c).replace(/#.*$/gm,\"\"); return /\\(3,\\s*1\\)\\s+\\(3,\\s*1\\)\\s+\\(6,\\s*1\\)/.test(o) && /\\[1,\\s*2,\\s*3,\\s*4,\\s*5,\\s*6\\]/.test(o) && /pd\\.concat\\s*\\(\\s*\\[/.test(s); }",
  "theory": "<h3>Stacking rows from identical tables</h3><p>This is SQL's <code>UNION ALL</code>: the tables are pasted one below the other.</p><pre>pd.concat([df1, df2])</pre><p>Notice two syntax details: <code>concat</code> is a <b>module-level function</b>, not a table method (you write <code>pd.concat</code>, not <code>df1.concat</code>), and it takes a <b>list</b> - so you can join two tables or twelve in the same call.</p><h4>concat or merge?</h4><ul><li><code>concat</code> - <b>same columns, new rows</b>. Joining January and February into one table.</li><li><code>merge</code> - <b>same rows, new columns</b>. Attaching each order's customer details to it.</li></ul><p>If you're adding more data of the same kind - concat. If you're enriching existing data with more information - merge.</p><h4>What happens when the columns aren't identical</h4><p>The result's columns are the <b>union</b> of the columns of all the tables, and cells with no source are filled with a missing value. This is pandas' behavior, and it's convenient - but it also means a typo in a column name won't raise an error: you'll get two columns, each half full of gaps. So the habit is to check first:</p><pre>print(df1.columns)\nprint(df2.columns)</pre><p>And after concatenating, verify that <code>len(result) == len(df1) + len(df2)</code>.</p><h4>Two final points</h4><p>concat is <code>UNION ALL</code>, not <code>UNION</code> - it does <b>not</b> remove duplicate rows. If needed, add <code>.drop_duplicates()</code> after it.</p><p>In real pandas you'd write <code>pd.concat([df1, df2], ignore_index=True)</code>. Without this parameter the original indexes are kept and each table contributes its own 0,1,2, so you end up with duplicate index numbers. In the simulator this is already the default. There's also <code>axis=1</code> for side-by-side concatenation, which isn't supported here.</p>",

  "explain": "<p><code>pd.concat</code> pastes tables one below the other. Read the three shapes: 3 rows plus 3 rows gives 6, and the number of columns stays 1. <b>concat adds rows, not columns.</b></p><p>Notice the syntax, because it's different from everything you've seen so far in the course: <code>concat</code> isn't a table method but a <b>module-level function</b> - you write <code>pd.concat([a, b])</code>, not <code>a.concat(b)</code>. The reason makes sense: the operation belongs to all the tables equally, and none of them is the \"owner\". And since it takes a list, you can pass it as many tables as you want.</p><p>The check to run after every concat: <code>len(result)</code> must equal the sum of the lengths that went in. If it's smaller - something didn't join.</p><p>And here's the most important distinction on the topic: <b>concat</b> - same columns, new rows (January and February into one table). <b>merge</b> - same rows, new columns (customer details for each order). If you're adding more data of the same kind - concat. If you're enriching existing data - merge.</p>"

  "theory": "<h3>Method chaining</h3>\n<p>Every operation on a DataFrame returns a new DataFrame. So you can chain operation after operation and get a complete analysis in one expression, without intermediate variables:</p>\n<pre>result = (df[df[\"department\"].eq(\"Sales\")]\n            .sort_values(\"salary\", ascending=False)\n            .head(2))</pre>\n<p>The outer parentheses are what let you spread the chain over several lines and read it top to bottom.</p>\n<h4>The first link: a boolean mask</h4>\n<p><code>df[\"salary\"].gt(15000)</code> returns a <b>mask</b> — a column of True/False the length of the table. When you put a mask inside <code>df[...]</code>, only the rows where it's True remain:</p>\n<pre>mask = df[\"department\"].eq(\"Sales\") &amp; df[\"salary\"].gt(15000)\nresult = df[mask]</pre>\n<p>You combine masks with <code>&amp;</code> (and), <code>|</code> (or), and <code>~</code> (not). Alternatively you can write the condition as a string: <code>df.query(\"price_m &lt; 5\")</code>.</p>\n<h4>Link order matters</h4>\n<p>Filter before sorting, and <code>head</code> always after <code>sort_values</code> — otherwise you've cut the table before ranking it. Also note that <code>ascending</code> is True by default; when asking for the \"highest\" you must use <code>ascending=False</code>.</p>\n<h4>What you can't do inside a chain</h4>\n<p>You can't add a column in the middle of a chain, because <code>df[\"x\"] = ...</code> is an assignment statement, not a method. In that case, split it into two steps.</p>\n<h4>Versus real pandas</h4>\n<p>In pandas you write <code>df[df[\"salary\"] &gt; 15000]</code>. The simulator here can't return a mask from the <code>&gt;</code> operator, so you use the methods <code>.gt() .lt() .ge() .le() .eq() .ne()</code> — these are completely real pandas methods, and the code you write here will run in pandas exactly as is. <code>sort_values</code>, <code>head</code>, <code>query</code>, <code>groupby</code>, <code>&amp;</code>, <code>|</code>, <code>~</code> — identical.</p>",

  "solution": "df = data.load(\"telecom-churn\")\nchurned = df[df[\"churn\"].eq(1)]\ntop = churned.sort_values(\"monthly_bill\", ascending=False).iloc[0]\nprint(top[\"customer_id\"], top[\"monthly_bill\"])",
  "check_fn": "(o,c)=>{const s=String(c||\"\").replace(/#[^\\n]*/g,\"\");return /sort_values/.test(s) && /iloc/.test(s) && /104/.test(o) && /150/.test(o) && !/101/.test(o) && !/102/.test(o);}",
  "theory": "<h3>Multi-step analysis: from the business question to code</h3>\n<p>A real business question is almost never a single operation. The safe approach: write the question out in words, break each word into a step, and only then code it.</p>\n<p>\"Which customer paid the most among those who churned?\"</p>\n<pre>churned = df[df[\"churn\"].eq(1)]                                  # 1. narrow down\nranked  = churned.sort_values(\"monthly_bill\", ascending=False)   # 2. rank\ntop     = ranked.iloc[0]                                         # 3. we pull\nprint(top[\"customer_id\"], top[\"monthly_bill\"])</pre>\n<h4>A calculated column is a legitimate step</h4>\n<pre>df[\"price_per_sqm\"] = df[\"price_m\"] * 1000000 / df[\"sqm\"]</pre>\n<p>Arithmetic on columns is vectorized — the expression operates on all rows at once, without a loop and without a list comprehension. Note that an assignment like this <b>changes df itself</b>, so rerunning the same cell adds columns over and over.</p>\n<h4>Normalization changes conclusions</h4>\n<p>Price per square meter, a rate instead of a count, an average instead of a sum — all of these are normalization, and they typically flip the ranking. An absolute number and the size of its base should always appear together.</p>\n<h4>Third step: complex aggregation</h4>\n<pre>g = df.groupby(\"department\")\nreport = g.agg({\"salary\": \"max\"}).rename(columns={\"salary\": \"max_salary\"})\nreport[\"avg_salary\"] = list(g[\"salary\"].mean())\nreport[\"gap\"] = report[\"max_salary\"] - report[\"avg_salary\"]</pre>\n<p>Warning: a row from <code>groupby().max()</code> isn't a real row from the table but the maximum of each column <b>separately</b> — the two values in the row can come from two different employees.</p>\n<h4>iloc for range slicing</h4>\n<p><code>df.iloc[0:6]</code> returns the first six rows by position — useful for comparing periods. Here too: position, not label.</p>",

  "theory": "<h3>Multi-step analysis: from the business question to code</h3>\n<p>A real business question is almost never a single operation. The safe approach: write the question out in words, break each word into a step, and only then code it.</p>\n<p>\"Which customer paid the most among those who churned?\"</p>\n<pre>churned = df[df[\"churn\"].eq(1)]                                  # 1. narrow down\nranked  = churned.sort_values(\"monthly_bill\", ascending=False)   # 2. rank\ntop     = ranked.iloc[0]                                         # 3. we pull\nprint(top[\"customer_id\"], top[\"monthly_bill\"])</pre>\n<h4>A calculated column is a legitimate step</h4>\n<pre>df[\"price_per_sqm\"] = df[\"price_m\"] * 1000000 / df[\"sqm\"]</pre>\n<p>Arithmetic on columns is vectorized — the expression operates on all rows at once, without a loop and without a list comprehension. Note that an assignment like this <b>changes df itself</b>, so rerunning the same cell adds columns over and over.</p>\n<h4>Normalization changes conclusions</h4>\n<p>Price per square meter, a rate instead of a count, an average instead of a sum — all of these are normalization, and they typically flip the ranking. An absolute number and the size of its base should always appear together.</p>\n<h4>Third step: complex aggregation</h4>\n<pre>g = df.groupby(\"department\")\nreport = g.agg({\"salary\": \"max\"}).rename(columns={\"salary\": \"max_salary\"})\nreport[\"avg_salary\"] = list(g[\"salary\"].mean())\nreport[\"gap\"] = report[\"max_salary\"] - report[\"avg_salary\"]</pre>\n<p>Warning: a row from <code>groupby().max()</code> isn't a real row from the table but the maximum of each column <b>separately</b> — the two values in the row can come from two different employees.</p>\n<h4>iloc for range slicing</h4>\n<p><code>df.iloc[0:6]</code> returns the first six rows by position — useful for comparing periods. Here too: position, not label.</p>",

  "explain": "The task: in each department — how far is the highest salary from the average?\nThis is a dispersion measure: a large gap between the maximum and the average points to a single \"star\" pulling the average up, meaning uneven pay within the department. That's exactly what HR is looking for.\nThe result: Sales 2,000, R&amp;D 3,500, Marketing 1,000. R&amp;D is both the highest payer and the least uniform.\nNote that we built a table, not two lists: <code>agg({\"salary\": \"max\"})</code> returns a DataFrame with the department name as a column, so you can add columns to it and see a number next to its label. Two separate lists of numbers force the reader to guess which number belongs to whom.\nImportant warning: a row from <code>groupby().max()</code> is not a real employee. If you took max on both salary and years, the two values could come from two different employees — the maximum is computed per column separately. That is why we explicitly chose a single column.\nIn pandas: g = df.groupby(\"department\")[\"salary\"]; g.max() - g.mean(), or g.agg([\"max\", \"mean\"])."

  "course": "pandas",
  "q": "Load <code>telecom-churn</code>. Find customers aged 30 to 45 (use <code>between</code>) <b>and also</b> with a monthly bill above <b>the average of all customers</b>. Print the average, the customers found, and the shape.",
  "starter": "",
  "solution": "df = data.load(\"telecom-churn\")\navg_bill = df[\"monthly_bill\"].mean()\nmask = df[\"age\"].between(30, 45) & df[\"monthly_bill\"].gt(avg_bill)\nresult = df[mask]\nprint(\"Average bill:\", round(avg_bill, 2))\nprint(result[[\"customer_id\", \"age\", \"monthly_bill\", \"churn\"]])\nprint(result.shape)",
  "check_fn": "(o,c)=>{const s=String(c||\"\").replace(/#[^\\n]*/g,\"\");return /&/.test(s) && /between\\(/.test(s) && /mean\\(/.test(s) && /88\\.09/.test(o) && /102/.test(o) && /106/.test(o) && /114/.test(o) && !/103/.test(o) && !/112/.test(o) && /\\(3, 6\\)/.test(o);}",
  "theory": "<h3>Complex conditions: &amp; , | , ~</h3>\n<p>Every comparison on a column produces a <b>mask</b> — a column of True/False the length of the table:</p>\n<pre>rich = df[\"salary\"].gt(16000)   # [False, True, True, ...]</pre>\n<p>Masks are combined with logical operators, and that's exactly where this whole topic lives:</p>\n<pre>df[mask_a &amp; mask_b]    # and — both conditions together\ndf[mask_a | mask_b]    # or   – enough for one to hold\ndf[~mask_a]            # not   – inverts the mask</pre>\n<h4>The difference you must internalize</h4>\n<p><code>&amp;</code> <b>narrows</b> and <code>|</code> <b>widens</b>. You can express \"and\" by chaining two filters one after another, but \"or\" cannot be expressed by chaining in any form — because each additional filter only operates on what is left. That is exactly why the operators exist.</p>\n<h4>Parentheses aren't decoration</h4>\n<pre>sales_vet = df[\"department\"].eq(\"Sales\") &amp; df[\"years\"].ge(4)\nrnd_rich  = df[\"department\"].eq(\"R&amp;D\") &amp; df[\"salary\"].gt(20000)\nresult    = df[sales_vet | rnd_rich]</pre>\n<p>When a condition is made up of several branches, give each branch its own name. It's more readable, and it also lets you check each branch separately (<code>df[sales_vet].shape[0]</code>) — a sanity check that reveals a dead branch that returns no rows.</p>\n<h4>Membership in a list: isin</h4>\n<pre>df[df[\"plan\"].isin([\"premium\", \"standard\"])]     # one of these values\ndf[~df[\"neighborhood\"].isin([\"Jaffa\", \"Florentin\"])] # everything not in the list</pre>\n<p><code>~ ... isin([...])</code> is the most common notation in real work for negating a set of values — much more readable than a chain of <code>ne</code>. There's also <code>df[\"age\"].between(25, 35)</code> for a closed range.</p>\n<h4>Compared to real pandas — the critical point</h4>\n<p>In pandas the operators are <code>&amp;</code>, <code>|</code>, <code>~</code> — exactly like here — and you <b>must not</b> use <code>and</code>/<code>or</code> on columns: that raises <code>ValueError: The truth value of a Series is ambiguous</code>, one of the first errors every beginner runs into. The only difference: there you compare with an operator, <code>df[(df[\"math\"] &gt; 80) &amp; (df[\"english\"] &gt; 85)]</code>, and every condition <b>must</b> be in parentheses because <code>&amp;</code> binds tighter than <code>&gt;</code>. Here you compare with the methods <code>.gt()</code>/<code>.eq()</code>, so the parentheses aren't needed — everything else is the same.</p>",
  "explanation": [
   {
    "line": "df = data.load(\\\"students\\\")",
    "exp": "Assigns into the variable <code>df</code> the value <code>data.load(\\\"students\\\")</code>"

   {
    "line": "result = df.where(lambda r: r[\\\"math\\\"] > 80 and r[\\\"english\\\"] > 85)",
    "exp": "Assigns to the variable <code>result</code> the value <code>df.where(lambda r: r[\\\"math\\\"] > 80 and r[\\\"englis</code>"

  ],
  "difficulty": "medium",
  "base_points": 20,
  "max_points": 30,
  "explain": "The task: middle-aged customers who pay more than average — a segment defined across two completely different dimensions.\nTwo new things here:\n1. <code>df[\"age\"].between(30, 45)</code> replaces two masks (<code>ge(30) &amp; le(45)</code>) with one. <b>Both endpoints are included</b> — and that's not a technicality: customer 102 is exactly 45, and they're in. Had you written <code>lt(45)</code>, they'd have been dropped. Always ask yourself whether the boundary belongs to the segment or not, and write the answer explicitly.\n2. The threshold isn't a fixed number but <b>computed from the data</b>: <code>df[\"monthly_bill\"].gt(avg_bill)</code> compares every row against a single scalar computed from the whole column. This is far more robust than a hardcoded number — if the data changes, the threshold moves with it. Note that we printed the average (88.09): a threshold that isn't shown is a threshold you can't audit.\nThe result: three customers — 102, 106 and 114 — that is, (3, 6). All six columns remain; filtering rows doesn't touch the columns.\nIt's worth noting who doesn't get in: customer 103 meets the age condition (32) and pays 80.3, above most customers — but below the average. The average here is pulled upward by a few very high accounts, so \"above average\" is a higher bar than it seems. With a median you'd get an entirely different segment."
 },

  "explain": "This is the exercise that shows the difference in numbers: the exact same two masks, two operators, two answers.\n<code>&amp;</code> gives 5 employees, <code>|</code> gives 8. <code>&amp;</code> always narrows and <code>|</code> always widens, and the two groups differ by 3 employees who satisfy only one condition: Galit and Tal earn well but have short tenure, and Victor has long tenure but earns exactly 16,000 — not <b>above</b> 16,000.\nVictor is a point worth stopping on: the difference between <code>gt</code> (above) and <code>ge</code> (at least) is exactly the difference between him and being included in the group. When defining business segments, this boundary is a classic source of disputes — define it explicitly.\nAnd finally: the \"and\" group could also be obtained by chaining two filters. The \"or\" group could not — in any form. That's why <code>|</code> exists."

  "q": "Load <code>football</code>. Using <code>|</code>, find teams with <code>points</code> of 52 or higher <b>or</b> <code>goals_for</code> below 40. Print them, and then print how many teams meet both conditions together.",
  "starter": "",
  "solution": "df = data.load(\"football\")\nstrong = df[\"points\"].ge(52)\nweak_attack = df[\"goals_for\"].lt(40)\nprint(df[strong | weak_attack][[\"team\", \"points\", \"goals_for\"]])\nprint(\"and:\", df[strong & weak_attack].shape[0])",
  "check_fn": "(o,c)=>{const s=String(c||\"\").replace(/#[^\\n]*/g,\"\");return /\\|/.test(s) && /(ge|lt)\\(/.test(s) && /Maccabi Tel Aviv/.test(o) && /Beitar/.test(o) && /Hapoel TA/.test(o) && !/Maccabi Haifa/.test(o);}",
  "theory": "<h3>Complex conditions: &amp; , | , ~</h3>\n<p>Every comparison on a column produces a <b>mask</b> — a column of True/False the length of the table:</p>\n<pre>rich = df[\"salary\"].gt(16000)   # [False, True, True, ...]</pre>\n<p>Masks are combined with logical operators, and that's exactly where this whole topic lives:</p>\n<pre>df[mask_a &amp; mask_b]    # and — both conditions together\ndf[mask_a | mask_b]    # or   – enough for one to hold\ndf[~mask_a]            # not   – inverts the mask</pre>\n<h4>The difference you must internalize</h4>\n<p><code>&amp;</code> <b>narrows</b> and <code>|</code> <b>widens</b>. You can express \"and\" by chaining two filters one after another, but \"or\" cannot be expressed by chaining in any form — because each additional filter only operates on what is left. That is exactly why the operators exist.</p>\n<h4>Parentheses aren't decoration</h4>\n<pre>sales_vet = df[\"department\"].eq(\"Sales\") &amp; df[\"years\"].ge(4)\nrnd_rich  = df[\"department\"].eq(\"R&amp;D\") &amp; df[\"salary\"].gt(20000)\nresult    = df[sales_vet | rnd_rich]</pre>\n<p>When a condition is made up of several branches, give each branch its own name. It's more readable, and it also lets you check each branch separately (<code>df[sales_vet].shape[0]</code>) — a sanity check that reveals a dead branch that returns no rows.</p>\n<h4>Membership in a list: isin</h4>\n<pre>df[df[\"plan\"].isin([\"premium\", \"standard\"])]     # one of these values\ndf[~df[\"neighborhood\"].isin([\"Jaffa\", \"Florentin\"])] # everything not in the list</pre>\n<p><code>~ ... isin([...])</code> is the most common notation in real work for negating a set of values — much more readable than a chain of <code>ne</code>. There's also <code>df[\"age\"].between(25, 35)</code> for a closed range.</p>\n<h4>Compared to real pandas — the critical point</h4>\n<p>In pandas the operators are <code>&amp;</code>, <code>|</code>, <code>~</code> — exactly like here — and you <b>must not</b> use <code>and</code>/<code>or</code> on columns: that raises <code>ValueError: The truth value of a Series is ambiguous</code>, one of the first errors every beginner runs into. The only difference: there you compare with an operator, <code>df[(df[\"math\"] &gt; 80) &amp; (df[\"english\"] &gt; 85)]</code>, and every condition <b>must</b> be in parentheses because <code>&amp;</code> binds tighter than <code>&gt;</code>. Here you compare with the methods <code>.gt()</code>/<code>.eq()</code>, so the parentheses aren't needed — everything else is the same.</p>",

  "explain": "The task: the teams at the extremes — the leaders in points and the weakest in offense.\n<code>|</code> includes a row if <b>at least one</b> of the conditions holds. The result: four groups — Maccabi Tel Aviv and Hapoel Be'er Sheva got in on points, Hapoel Tel Aviv and Beitar got in due to their weak attack.\nNow look at the second row: <b>zero</b> groups meet both conditions together. The leading teams score a lot, so no team is both strong in points and weak on offense.\nThis is the cleanest demonstration of the difference: the exact same two conditions give 4 rows with <code>|</code> and 0 rows with <code>&amp;</code>. If you chained two filters one after another you'd get the 0, because each additional filter operates only on what remains. Chaining is always \"and\".\nThe one team that didn't make it in is Maccabi Haifa — 48 points and 41 goals, in the middle on both dimensions.\nIn pandas: df[(df[\"points\"] &gt;= 52) | (df[\"goals_for\"] &lt; 40)]. With <code>or</code> instead of <code>|</code> you'll get a ValueError."

</b> use <code>and</code>/<code>or</code> on columns: that raises <code>ValueError: The truth value of a Series is ambiguous</code>, one of the first errors every beginner runs into. The only difference: there you compare with an operator, <code>df[(df[\"math\"] &gt; 80) &amp; (df[\"english\"] &gt; 85)]</code>, and every condition <b>must</b> be in parentheses because <code>&amp;</code> binds tighter than <code>&gt;</code>. Here you compare with the methods <code>.gt()</code>/<code>.eq()</code>, so the parentheses aren't needed — everything else is the same.</p>",

  "q": "<b>Step 1 — how bad is it?</b> Load <code>telecom-churn</code>. Print how many customers churned out of how many, and the overall churn rate in percent (rounded to one decimal place).",
  "starter": "",
  "solution": "df = data.load(\"telecom-churn\")\nchurned = df[\"churn\"].sum()\nrate = df[\"churn\"].mean() * 100\nprint(\"Churned:\", churned, \"out of\", df.shape[0])\nprint(\"Churn rate:\", round(rate, 1), \"%\")",
  "check_fn": "(o,c)=>{const s=String(c||\"\").replace(/#[^\\n]*/g,\"\");return /mean\\(/.test(s) && /churn/.test(s) && /46\\.7/.test(o) && /7/.test(o) && /15/.test(o);}",
  "theory": "<h3>Project: why do customers leave?</h3>\n<p>We’re analysts at a telecom company. The <code>telecom-churn</code> table has 15 customers, each with age, monthly bill, tenure in months, plan, and a <code>churn</code> column where 1 = left and 0 = stayed. The goal isn’t \"to run functions\" but to come out with one actionable recommendation.</p>\n<p>Five steps, each one building on the last: the overall churn rate, the churn rate within each plan, the churned profile vs. the retained profile, the size of the lost revenue, and finally — who's at risk now.</p>\n<h4>Three rules that accompany every churn analysis</h4>\n<p><b>1. A count is not a rate.</b> A plan with 4 churners out of 7 customers is healthier than a plan with 3 churners out of 4. Always divide by the group size. This is mistake number one in churn reports, and on a 0/1 column it’s solved in one line: <code>mean()</code> of the churn column <b>is</b> the churn rate.</p>\n<p><b>2. A number without a comparison group isn't a finding.</b> \"the average churned-customer age is 41\" says nothing until you know the age of those who stayed. And compare churners against <b>retained customers</b>, not against all customers — all customers includes the churners themselves, and that comparison artificially shrinks the gap.</p>\n<p><b>3. Rate and sample size always together.</b> 75% churn on 4 customers isn’t a stable finding. Report the rate and the number of customers in the same table.</p>\n<h4>The main tool: groupby on the flag column</h4>\n<pre>df.groupby(\"plan\")[\"churn\"].mean()    # churn rate per plan\ndf.groupby(\"churn\")[\"age\"].mean()     # churned vs. retained in one line</pre>\n<p><b>Caveat:</b> 15 customers is an exercise, not a sample. We'll learn the technique here; a real business conclusion requires thousands of rows.</p>",
  "explanation": [
   {
    "line": "df = data.load(\\\"telecom-churn\\\")",
    "exp": "Assigns to the variable <code>df</code> the value <code>data.load(\\\"telecom-churn\\\")</code>"
   },
   {
    "line": "churn_rate = df[\\\"churn\\\"].mean() * 100",
    "exp": "Assigns to the variable <code>churn_rate</code> the value <code>df[\\\"churn\\\"].mean() * 100</code>"
   },
   {
    "line": "print(round(churn_rate, 1), \\\"%\\\")",
    "exp": "Prints to the screen: <code>round(churn_rate, 1), \\\"%\\\"</code>"
   }
  ],
  "difficulty": "hard",
  "base_points": 30,
  "max_points": 40,
  "explain": "The task: the number every churn report opens with.\nThe key trick: when a column contains only 0 and 1, its <code>mean()</code> <b>is</b> the rate. The average of [0,1,1,0,...] is exactly the fraction of customers whose value is 1. No need to count and divide manually — but it's worth checking: <code>sum()</code> gives 7 and <code>shape[0]</code> gives 15, and 7/15 = 0.467. Two paths to the same answer are the cheapest sanity check there is.\nThe result: 7 out of 15, meaning 46.7%.\nWe showed both the numerator and the denominator, not just the percentage — rule 3 of the project. \"46.7%\" of 15 customers is a completely different number from \"46.7%\" of 15,000.\nCaveat: in the real world, 46.7% annual churn would be a disaster. Here it is simply a balanced demo dataset."

  "explain": "This is the step where most reports in the world go wrong, so it's worth stopping on.\nIf you calculated the <b>sum</b> of churned customers you'd get premium 4, basic 3, and conclude that premium is the worse plan. That's a conclusion that's <b>the opposite of the truth</b>.\nThe sum ignores the size of the group. The actual rates:\nbasic — 3 churned out of 4 customers = 75.0%\npremium — 4 churned out of 7 customers = 57.1%\nstandard — 0 out of 4 = 0%\nIn other words, <b>basic is the worst plan</b>, and premium — which looked the worst by count — is in the middle. This is a base-rate error, the most classic mistake in segment analysis: a large group produces more cases even when it's healthier.\nAgain, the line that solves everything: in a column of 0s and 1s, <code>mean()</code> is the rate.\nAnd now the opposite caution, which is why we also printed the customers column: basic's 75% is based on just 4 customers. One customer changing their decision moves the rate by 25 points. Rate and sample size must appear together — otherwise you've swapped one mistake for another.\nAnd what about standard? 0% churn — this is the group worth learning from, not just ignoring.\nIn pandas: df.groupby(\"plan\")[\"churn\"].agg([\"mean\", \"count\"])."

  "theory": "<h3>Project: why do customers leave?</h3>\n<p>We’re analysts at a telecom company. The <code>telecom-churn</code> table has 15 customers, each with age, monthly bill, tenure in months, plan, and a <code>churn</code> column where 1 = left and 0 = stayed. The goal isn’t \"to run functions\" but to come out with one actionable recommendation.</p>\n<p>Five steps, each one building on the last: the overall churn rate, the churn rate within each plan, the churned profile vs. the retained profile, the size of the lost revenue, and finally — who's at risk now.</p>\n<h4>Three rules that accompany every churn analysis</h4>\n<p><b>1. A count is not a rate.</b> A plan with 4 churners out of 7 customers is healthier than a plan with 3 churners out of 4. Always divide by the group size. This is mistake number one in churn reports, and on a 0/1 column it’s solved in one line: <code>mean()</code> of the churn column <b>is</b> the churn rate.</p>\n<p><b>2. A number without a comparison group isn't a finding.</b> \"the average churned-customer age is 41\" says nothing until you know the age of those who stayed. And compare churners against <b>retained customers</b>, not against all customers — all customers includes the churners themselves, and that comparison artificially shrinks the gap.</p>\n<p><b>3. Rate and sample size always together.</b> 75% churn on 4 customers isn’t a stable finding. Report the rate and the number of customers in the same table.</p>\n<h4>The main tool: groupby on the flag column</h4>\n<pre>df.groupby(\"plan\")[\"churn\"].mean()    # churn rate per plan\ndf.groupby(\"churn\")[\"age\"].mean()     # churned vs. retained in one line</pre>\n<p><b>Caveat:</b> 15 customers is an exercise, not a sample. We'll learn the technique here; a real business conclusion requires thousands of rows.</p>",

  "theory": "<h3>Project: why do customers leave?</h3>\n<p>We’re analysts at a telecom company. The <code>telecom-churn</code> table has 15 customers, each with age, monthly bill, tenure in months, plan, and a <code>churn</code> column where 1 = left and 0 = stayed. The goal isn’t \"to run functions\" but to come out with one actionable recommendation.</p>\n<p>Five steps, each one building on the last: the overall churn rate, the churn rate within each plan, the churned profile vs. the retained profile, the size of the lost revenue, and finally — who's at risk now.</p>\n<h4>Three rules that accompany every churn analysis</h4>\n<p><b>1. A count is not a rate.</b> A plan with 4 churners out of 7 customers is healthier than a plan with 3 churners out of 4. Always divide by the group size. This is mistake number one in churn reports, and on a 0/1 column it’s solved in one line: <code>mean()</code> of the churn column <b>is</b> the churn rate.</p>\n<p><b>2. A number without a comparison group isn't a finding.</b> \"the average churned-customer age is 41\" says nothing until you know the age of those who stayed. And compare churners against <b>retained customers</b>, not against all customers — all customers includes the churners themselves, and that comparison artificially shrinks the gap.</p>\n<p><b>3. Rate and sample size always together.</b> 75% churn on 4 customers isn’t a stable finding. Report the rate and the number of customers in the same table.</p>\n<h4>The main tool: groupby on the flag column</h4>\n<pre>df.groupby(\"plan\")[\"churn\"].mean()    # churn rate per plan\ndf.groupby(\"churn\")[\"age\"].mean()     # churned vs. retained in one line</pre>\n<p><b>Caveat:</b> 15 customers is an exercise, not a sample. We'll learn the technique here; a real business conclusion requires thousands of rows.</p>",

  "difficulty": "hard",
  "base_points": 30,
  "max_points": 40,
  "explain": "This is the step for which the entire analysis was done: turning a finding into an action list.\nNotice where the criterion came from — it wasn't invented, it's derived from step 4. There we saw that churned customers pay 92.86 on average, so <code>monthly_bill &gt; 90</code> defines \"a customer who pays like someone who's about to leave\". The tenure condition targets customers who haven't yet settled in, and <code>churn == 0</code> is mandatory — there's no point in an \"intervention\" for a customer who has already left. Three masks are combined with <code>&amp;</code>.\nThe result: two customers — 106 (95.0 NIS, 36 months) and 114 (100.0 NIS, 42 months), together 195.0 NIS per month.\nThree professional notes:\n1. <b>Check that every condition actually does something.</b> Here all three matter: without <code>churn == 0</code>, customer 110, who already left, would be included; without the tenure condition, customer 112 — an especially long-tenured customer (96 months) and thus arguably the safest — would be included; without the account condition the list would balloon. A condition that doesn't change the result is a dead condition — it looks like rigor but is nothing but noise.\n2. <b>Check that the segment isn't empty before continuing.</b> A threshold of ₪120 would have returned zero customers — not because there's no risk, but because the threshold is too tight for a 15-row table. When a segment comes out empty, you loosen the threshold deliberately and report it — you don't manufacture a finding.\n3. 195 NIS sounds negligible, and that's exactly the point: in a 15-row table every number is small. Run the exact same code on 150,000 customers, and then the last row is the one that justifies a retention budget.\n<b>Project summary:</b> 46.7% overall churn; basic is the problematic plan (75%), not premium; age and tenure barely distinguish; but churners pay 11% more than those who stay — meaning it's the pricier ones who leave. Recommendation: check what's broken in the basic plan, and reach out to customers 106 and 114 before they're next."

  "course": "pandas",
  "q": "<b>Step 1 — overview:</b> Load <code>salaries</code>. Build a report table with the average salary in each department <b>alongside the number of employees in it</b>. Print it.",
  "starter": "",
  "solution": "df = data.load(\"salaries\")\ng = df.groupby(\"department\")\nreport = g.agg({\"salary\": \"mean\"})\nreport[\"employees\"] = list(g[\"salary\"].count())\nprint(report)",
  "check_fn": "(o,c)=>{const s=String(c||\"\").replace(/#[^\\n]*/g,\"\");return /groupby/.test(s) && /mean/.test(s) && /(count|size)/.test(s) && /17000\\.0/.test(o) && /24500\\.0/.test(o) && /13000\\.0/.test(o) && /Sales/.test(o) && /Marketing/.test(o) && !/Avi/.test(o);}",
  "theory": "<h3>Project: pay gaps between departments</h3>\n<p>HR wants a snapshot: what are the gaps between departments, is there an outlier department, and who stands out within their own department. The <code>salaries</code> table has 12 employees, each with a department, salary, and tenure.</p>\n<p>Five steps: average salary and size for each department, the size of the gap between the highest and lowest, checking whether seniority explains the gap, identifying the senior employees, and finally — who earns above their department's average.</p>\n<h4>Four warnings that accompany every salary analysis</h4>\n<p><b>1. Print labels, not just numbers.</b> <code>[17000.0, 24500.0, 13000.0]</code> is meaningless. Build a table where the department name sits next to its number.</p>\n<p><b>2. An average over 3-5 employees is fragile.</b> A single employee shifts the whole department average. Always report the employee count too.</p>\n<p><b>3. A gap is not discrimination.</b> Before concluding, look for an explanatory variable — here, tenure.</p>\n<p><b>4. Correlation is not causation</b>, especially when both variables are concentrated in the same class.</p>\n<h4>The project's tools</h4>\n<pre>g = df.groupby(\"department\")\nreport = g.agg({\"salary\": \"mean\"})       # a table with a label for each number\nreport[\"employees\"] = list(g[\"salary\"].count())\n\navg = g[\"salary\"].mean()\navg.idxmax()                             # the name of the leading class, not its position\ndf.nlargest(3, \"years\")                  # Top-N without manual sorting</pre>\n<h4>Group order</h4>\n<p>Here the groups appear in the order they occur in the data (Sales, R&amp;D, Marketing). In pandas, <code>groupby</code> sorts the keys alphabetically by default. So never rely on a group's <b>position</b> — rely on its name, and that's what <code>idxmax</code> and <code>idxmin</code> are for.</p>",

  "explain": "The task: the first image every payroll report opens with.\nThe result: Sales 17,000 (5 employees), R&amp;D 24,500 (4), Marketing 13,000 (3).\nTwo design decisions worth adopting:\n1. <b>We built a table, not a list.</b> <code>[17000.0, 24500.0, 13000.0]</code> forces the reader to guess which number belongs to whom — and this is exactly where it's dangerous, because our group order is the order of appearance in the data, whereas in pandas it's alphabetical order. Same code, different order, a wrong report.\n2. <b>We added the number of employees.</b> An average of 24,500 over 4 employees isn't the same as an average of 24,500 over 400. Our Marketing is three people — any change to one of them shifts the average by 30%.\nA note on precision: the averages here are rounded to two decimal places. pandas does not round like this.\nIn pandas: df.groupby(\"department\")[\"salary\"].agg([\"mean\", \"count\"])."

  "theory": "<h3>Project: pay gaps between departments</h3>\n<p>HR wants a snapshot: what are the gaps between departments, is there an outlier department, and who stands out within their own department. The <code>salaries</code> table has 12 employees, each with a department, salary, and tenure.</p>\n<p>Five steps: average salary and size for each department, the size of the gap between the highest and lowest, checking whether seniority explains the gap, identifying the senior employees, and finally — who earns above their department's average.</p>\n<h4>Four warnings that accompany every salary analysis</h4>\n<p><b>1. Print labels, not just numbers.</b> <code>[17000.0, 24500.0, 13000.0]</code> is meaningless. Build a table where the department name sits next to its number.</p>\n<p><b>2. An average over 3-5 employees is fragile.</b> A single employee shifts the whole department average. Always report the employee count too.</p>\n<p><b>3. A gap is not discrimination.</b> Before concluding, look for an explanatory variable — here, tenure.</p>\n<p><b>4. Correlation is not causation</b>, especially when both variables are concentrated in the same class.</p>\n<h4>The project's tools</h4>\n<pre>g = df.groupby(\"department\")\nreport = g.agg({\"salary\": \"mean\"})       # a table with a label for each number\nreport[\"employees\"] = list(g[\"salary\"].count())\n\navg = g[\"salary\"].mean()\navg.idxmax()                             # the name of the leading class, not its position\ndf.nlargest(3, \"years\")                  # Top-N without manual sorting</pre>\n<h4>Group order</h4>\n<p>Here the groups appear in the order they occur in the data (Sales, R&amp;D, Marketing). In pandas, <code>groupby</code> sorts the keys alphabetically by default. So never rely on a group's <b>position</b> — rely on its name, and that's what <code>idxmax</code> and <code>idxmin</code> are for.</p>",

  "explain": "The task: check whether there's a third variable that explains the gap from the previous step.\n<code>~vet</code> is the trick that saves you a second mask: the inverted mask is exactly \"everything else\", without writing a new condition that might not be an exact complement.\nResult: veterans 24,500 (4 employees), juniors 15,500 (8). A gap of 9,000 NIS \" — almost exactly the gap we found between the departments.\nAnd now look at the list of veterans: Benny, Hila, Hani, Yossi — <b>all R&amp;D</b>. And that's the whole department.\nIn other words, \"the veteran department\" and \"the paying department\" are exactly the same department, and this data can’t separate them. This is called <b>confounding</b>: two possible explanations — people pay more with tenure, or the R&amp;D field is more expensive in the market — and this data can’t decide between them.\nWhat else could be decisive? Veteran employees in Marketing and young employees in R&amp;D, which can be compared within the same department. Not here.\nThe honest conclusion for the report: \"The gap between departments is consistent with the seniority gap, but the data doesn't allow separating the two.\" Not \"seniority explains the gap.\"\nIn pandas you can also measure the strength of the relationship with a single number: df[\"years\"].corr(df[\"salary\"]) — here about 0.98, very high. But <code>corr</code> doesn't prove causation, and it would be high here too, in this exact confounded case."

  "explain": "This is the wrap-up exercise, and it introduces a new pattern: comparing a <b>row against its group</b>, rather than against a global number.\nThe three steps:\n1. <code>groupby(\"department\")[\"salary\"].mean()</code> — average for each department.\n2. <code>df[\"department\"].map(dept_avg.to_dict())</code> — expands the three averages into a column of length 12, where each employee gets the average of <b>their department</b>. This is the step the whole exercise rests on.\n3. <code>df[\"salary\"].gt(df[\"dept_avg\"])</code> — comparison between two columns, row by row.\nThe result: Galit and Liat (Sales), Hila and Hani (R&amp;D), Zohar (Marketing) — 5 out of 12.\nNote Tal: exactly 17,000, which is exactly the Sales average. <code>gt</code> does not include equality, so it's excluded. When defining \"above average,\" this boundary needs to be set explicitly.\nAnd the statistical insight that makes this exercise interesting: in all three departments, there are <b>fewer</b> employees above the average than below it. That's not a coincidence — the average is pulled upward by the high values, so \"above average\" is almost always the minority. If HR were asking \"how many employees earn a reasonable salary\", the median would be a fairer measure than the average.\nA gap versus real pandas worth knowing: there, the second step is a dedicated and far more elegant function — <code>df.groupby(\"department\")[\"salary\"].transform(\"mean\")</code> returns a column the length of the table directly. <code>transform</code> doesn't exist in the simulator, hence the workaround via <code>map</code> on a dict. The idea is exactly the same."

  "starter": "",
  "solution": "df = data.load(\"sales\")\nprint(\"Annual total:\", df[\"revenue\"].sum())\nprint(\"Monthly average:\", round(df[\"revenue\"].mean()))\nprint(\"Peak:\", df[\"revenue\"].max(), \"| Low:\", df[\"revenue\"].min())",
  "check_fn": "(o,c)=>{const s=String(c||\"\").replace(/#[^\\n]*/g,\"\");return /sum\\(/.test(s) && /mean\\(/.test(s) && /720000/.test(o) && /60000/.test(o) && /89000/.test(o) && /38000/.test(o);}",
  "theory": "<h3>Project: The Sales Year</h3>\n<p>The <code>sales</code> table has 12 months, and each month has revenue (<code>revenue</code>) and a unit count (<code>units</code>). We’ll build a full picture of the year in five steps: the annual total and its spread, the peak month, the average price per unit, the month-over-month rate of change, and finally a growth summary.</p>\n<h4>Three concepts before you start</h4>\n<p><b>Average price per unit</b> = revenue / units. Two months can sell for the same amount — one in many cheap units, the other in a few expensive ones. That's a substantial business difference, and it's invisible in revenue alone.</p>\n<p><b>Month-over-month change</b> (<code>pct_change</code>) = by what percentage turnover rose or fell compared to the previous month. The first month has no previous month, so it gets None — hence there are 11 measurements, not 12. This denominator must be reported.</p>\n<p><b>Seasonality</b>: in retail, December is always strong and February is always weak. So a 39% jump in December is not \"growth\" but seasonality. Real growth is measured against the same month a year earlier, and this dataset has no prior year. When reporting a number, state explicitly what it measures.</p>\n<h4>The project's tools</h4>\n<pre>df[\"avg_price\"] = df[\"revenue\"] / df[\"units\"]     # vectorized computed column\ndf.loc[df[\"revenue\"].idxmax()]                    # the full row of the maximum\n(df[\"revenue\"].pct_change() * 100).round(1)       # a readable report, not 12 digits\ndf.iloc[0:6]                                      # slicing a period by position</pre>\n<p><code>idxmax</code> returns the <b>label</b> of the maximum row, and <code>df.loc[...]</code> retrieves it in full — this way you see all the data for the peak month, not just its name.</p>",

    "exp": "Assigns the value <code>data.load(\\\"sales\\\")</code> to the variable <code>df</code>"

  "difficulty": "hard",
  "base_points": 30,
  "max_points": 40,
  "explain": "The task: four numbers that give a picture, instead of one that gives a headline.\nThe result: 720,000 total, 60,000 average per month, a peak of 89,000 and a low of 38,000.\n\"720,000 for the year\" on its own says nothing about the nature of the year. Combining the average with the range does: the strong month is 2.3 times the weak one, meaning this year isn’t a flat year — it has sharp seasonality. If we had reported only the average, a manager would build a forecast of 60,000 a month and be surprised twice a year.\nThe rule: a summary number always comes with a spread measure alongside it — range, standard deviation, or at least the maximum and minimum.\n<code>sum()</code>, <code>mean()</code>, <code>max()</code> and <code>min()</code> are exactly the same in pandas."

  "theory": "<h3>Project: The Sales Year</h3>\n<p>The <code>sales</code> table has 12 months, and each month has revenue (<code>revenue</code>) and a unit count (<code>units</code>). We’ll build a full picture of the year in five steps: the annual total and its spread, the peak month, the average price per unit, the month-over-month rate of change, and finally a growth summary.</p>\n<h4>Three concepts before you start</h4>\n<p><b>Average price per unit</b> = revenue / units. Two months can sell for the same amount — one in many cheap units, the other in a few expensive ones. That's a substantial business difference, and it's invisible in revenue alone.</p>\n<p><b>Month-over-month change</b> (<code>pct_change</code>) = by what percentage turnover rose or fell compared to the previous month. The first month has no previous month, so it gets None — hence there are 11 measurements, not 12. This denominator must be reported.</p>\n<p><b>Seasonality</b>: in retail, December is always strong and February is always weak. So a 39% jump in December is not \"growth\" but seasonality. Real growth is measured against the same month a year earlier, and this dataset has no prior year. When reporting a number, state explicitly what it measures.</p>\n<h4>The project's tools</h4>\n<pre>df[\"avg_price\"] = df[\"revenue\"] / df[\"units\"]     # vectorized computed column\ndf.loc[df[\"revenue\"].idxmax()]                    # the full row of the maximum\n(df[\"revenue\"].pct_change() * 100).round(1)       # a readable report, not 12 digits\ndf.iloc[0:6]                                      # slicing a period by position</pre>\n<p><code>idxmax</code> returns the <b>label</b> of the maximum row, and <code>df.loc[...]</code> retrieves it in full — this way you see all the data for the peak month, not just its name.</p>",

\n            return Series(self._data[key], name=key)\n        if isinstance(key, list):\n            # Boolean mask?\n            if len(key) == self._nrows and len(key) > 0 and isinstance(key[0], bool):\n                new_data = {}\n                for c in self._columns:\n                    new_data[c] = []\n                    for i in range(self._nrows):\n                        if key[i]:\n                            new_data[c].append(self._data[c][i])\n                return DataFrame(new_data)\n            # Column selection\n            new_data = {}\n            for c in key:\n                if c in self._data:\n                    new_data[c] = self._data[c]\n            return DataFrame(new_data)\n        raise TypeError(\"Invalid key type\")\n    \n    def __setitem__(self, key, value):\n        if isinstance(value, Series):\n            value = value._data\n        if isinstance(value, list):\n            if len(value) != self._nrows:\n                raise ValueError(\"Length mismatch\")\n            self._data[key] = list(value)\n        else:\n            self._data[key] = [value] * self._nrows\n        if key not in self._columns:\n            self._columns.append(key)\n    \n    def sort_values(self, by, ascending=True):\n        col_data = self._data[by]\n        indices = list(range(self._nrows))\n        # Handle None values - put at end\n        def sort_key(i):\n            v = col_data[i]\n            if v is None:\n                return (1, 0) if ascending else (0, 0)\n            return (0, v)\n        indices.sort(key=sort_key, reverse=not ascending)\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [self._data[c][i] for i in indices]\n        return DataFrame(new_data)\n    \n    def filter(self, col, op, value):\n        \"\"\"SQL-like filter: df.filter('age', '>', 18)\"\"\"\n        mask = []\n        col_data = self._data[col]\n        for v in col_data:\n            if v is None:\n                mask.append(False); continue\n            if op == \">\": mask.append(v > value)\n            elif op == \"<\": mask.append(v < value)\n            elif op == \">=\": mask.append(v >= value)\n            elif op == \"<=\": mask.append(v <= value)\n            elif op == \"==\": mask.append(v == value)\n            elif op == \"!=\": mask.append(v != value)\n            elif op == \"in\":\n                if isinstance(value, list): mask.append(v in value)\n                else: mask.append(False)\n            else:\n                raise ValueError(\"Unknown operator: \" + op)\n        return self[mask]\n    \n    def where(self, fn):\n        \"\"\"Filter rows: df.where(lambda row: row['age'] > 18)\"\"\"\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = []\n        for i in range(self._nrows):\n            row = {}\n            for c in self._columns:\n                row[c] = self._data[c][i]\n            if fn(row):\n                for c in self._columns:\n                    new_data[c].append(self._data[c][i])\n        return DataFrame(new_data)\n    \n    def apply(self, fn, axis=0):\n        \"\"\"Apply function. axis=0: per column. axis=1: per row.\"\"\"\n        if axis == 1:\n            # Per row - returns Series\n            result = []\n            for i in range(self._nrows):\n                row = {}\n                for c in self._columns:\n                    row[c] = self._data[c][i]\n                result.append(fn(row))\n            return Series(result)\n        # Per column\n        result = {}\n        for c in self._columns:\n            result[c] = fn(self._data[c])\n        return result\n    \n    def mean(self):\n        result = {}\n        for c in self._columns:\n            vals = []\n            for v in self._data[c]:\n                if isinstance(v, (int, float)) and not isinstance(v, bool):\n                    vals.append(v)\n            if vals:\n                result[c] = sum(vals) / len(
