<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🎯 Simulator with scoring | Data Course</title>
<meta name="theme-color" content="#00d4c8">

<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>

<style>
  :root {
    --bg: #0a0d1f; --bg2: #121530; --bg3: #1a1f3a; --bg4: #252a52;
    --border: #2a2f5c; --border2: #353a6b;
    --text: #f8fafc; --text2: #aab; --text3: #888fa6;
    --cyan: #00d4c8; --green: #00e5a0; --gold: #ffd700; --orange: #ff8800;
    --purple: #8b5cf6; --pink: #ec4899; --red: #ef4444;
    --easy: #10b981; --medium: #f59e0b; --hard: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
  -webkit-tap-highlight-color: rgba(0,212,200,0.2);
  -webkit-text-size-adjust: 100%;
    font-family: -apple-system, "Heebo", "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    direction:ltr; line-height: 1.5;
  }

  /* Top bar with score */
  .topbar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .home-btn {
    background: linear-gradient(135deg, var(--cyan), var(--green));
    color: #000;
    padding: 7px 12px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 700;
    font-size: 12.5px;
  }
  .score-pill {
    margin-inline-start: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, #2a1f0a, #4a3a1f);
    border: 1.5px solid var(--gold);
    padding: 5px 12px;
    border-radius: 14px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--gold);
  }
  .score-pill .total-icon { font-size: 14px; }
  .reset-score-btn {
    background: rgba(239,68,68,0.1);
    color: var(--red);
    border: 1px solid rgba(239,68,68,0.3);
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
  }

  /* Progress strip */
  .progress-strip {
    background: var(--bg2);
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 11.5px;
  }
  .progress-stat {
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--text2);
  }
  .progress-stat .val { color: var(--cyan); font-weight: 700; }
  .progress-stat.easy .val { color: var(--easy); }
  .progress-stat.medium .val { color: var(--medium); }
  .progress-stat.hard .val { color: var(--hard); }
  .progress-bar-wrap {
    flex: 1;
    height: 6px;
    background: var(--bg);
    border-radius: 3px;
    overflow: hidden;
    margin-inline-start: 8px;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--cyan), var(--green));
    transition: width .5s;
  }

  /* Filter bar */
  .filter-bar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 8px 14px;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .filter-bar::-webkit-scrollbar { height: 0; }
  .filter-pill {
    padding: 6px 12px;
    background: var(--bg4);
    border: 1px solid var(--border2);
    border-radius: 14px;
    color: var(--text2);
    font-size: 11.5px;
    cursor: pointer;
    font-family: inherit;
    flex-shrink: 0;
  }
  .filter-pill.active {
    background: var(--cyan); color: #000; border-color: var(--cyan); font-weight: 700;
  }
  .filter-pill.diff-easy.active { background: var(--easy); border-color: var(--easy); }
  .filter-pill.diff-medium.active { background: var(--medium); border-color: var(--medium); }
  .filter-pill.diff-hard.active { background: var(--hard); border-color: var(--hard); color: #fff; }
  .filter-search {
    flex: 1;
    min-width: 130px;
    padding: 6px 12px;
    background: var(--bg4);
    border: 1px solid var(--border2);
    border-radius: 14px;
    color: var(--text);
    font-size: 12px;
    font-family: inherit;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 14px;
  }

  .exercise-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }
  
  .ex-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .ex-icon { font-size: 26px; line-height: 1; }
  .ex-title-block { flex: 1; min-width: 0; }
  .ex-num { font-size: 11px; color: var(--text3); font-weight: 600; }
  .ex-title { font-size: 14px; font-weight: 700; }
  
  /* Badges */
  .ex-badges { display: flex; gap: 5px; flex-wrap: wrap; }
  .badge {
    padding: 3px 9px;
    border-radius: 10px;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .badge-course-python { background: rgba(55,118,171,0.18); color: #5b9fc7; }
  .badge-course-pandas { background: rgba(139,92,246,0.18); color: #b8a6e5; }
  .badge-diff-easy { background: rgba(16,185,129,0.18); color: var(--easy); }
  .badge-diff-medium { background: rgba(245,158,11,0.18); color: var(--medium); }
  .badge-diff-hard { background: rgba(239,68,68,0.18); color: var(--hard); }
  .badge-points {
    background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,136,0,0.15));
    color: var(--gold);
    border: 1px solid rgba(255,215,0,0.4);
  }
  .badge-earned {
    background: linear-gradient(135deg, var(--green), #00a884);
    color: #000;
  }

  .question-box {
    background: rgba(255,215,0,0.07);
    border-inline-start: 3px solid var(--gold);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 12px;
  }
  .question-box code {
    background: rgba(255,215,0,0.18);
    color: var(--gold);
    padding: 2px 7px;
    border-radius: 4px;
    font-family: "SF Mono", Monaco, Menlo, monospace;
    font-size: 12.5px;
  }
  .question-box b { color: var(--cyan); }

  .editor-section { margin-bottom: 12px; }
  .editor-label {
    font-size: 11.5px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 6px;
    font-weight: 700;
  }
  .code-editor {
    width: 100%;
    background: #0a0d1f;
    color: #e0e6ff;
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 12px;
    font-family: "SF Mono", Monaco, Menlo, "Courier New", monospace;
    font-size: 14px;
    direction: ltr;
    text-align: left;
    resize: vertical;
    line-height: 1.6;
    min-height: 120px;
    tab-size: 4;
    user-select: text;
    -webkit-user-select: text;
    -webkit-touch-callout: default;
  }
  .code-editor:focus { outline: none; border-color: var(--cyan); }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: transform .15s;
  }
  .btn:hover, .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.6; cursor: wait; }
  .btn-run { background: linear-gradient(135deg, var(--green), #00a884); color: #000; }
  .btn-solution { background: linear-gradient(135deg, var(--gold), var(--orange)); color: #1a1a2e; }
  .btn-reset { background: rgba(239,68,68,0.1); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }

  .output-section { margin-top: 12px; display: none; }
  .output-section.show { display: block; }
  .output-box {
    background: #0a0d1f;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-family: "SF Mono", Monaco, Menlo, monospace;
    font-size: 13px;
    color: #e0e6ff;
    white-space: pre-wrap;
    direction: ltr;
    text-align: left;
    max-height: 280px;
    overflow-y: auto;
    min-height: 40px;
  }
  .output-box.error { color: #ff6b6b; }

  /* Verdict (with points!) */
  .verdict {
    margin-top: 10px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    display: none;
  }
  .verdict.show { display: block; animation: pop .4s ease; }
  @keyframes pop {
    0% { transform: scale(0.9); opacity: 0; }
    60% { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
  }
  .verdict.success {
    background: linear-gradient(135deg, rgba(0,229,160,0.15), rgba(0,212,200,0.15));
    color: var(--green);
    border: 2px solid var(--green);
  }
  .verdict.fail {
    background: rgba(255,176,32,0.1);
    color: var(--orange);
    border: 1px solid rgba(255,176,32,0.3);
  }
  .verdict .points-earned {
    display: block;
    font-size: 22px;
    margin: 4px 0;
    color: var(--gold);
  }

  /* SOLUTION PANEL */
  .solution-section {
    margin-top: 18px;
    background: linear-gradient(135deg, rgba(255,215,0,0.08), rgba(255,136,0,0.04));
    border: 2px solid rgba(255,215,0,0.4);
    border-radius: 12px;
    padding: 16px;
    display: none;
  }
  .solution-section.show { display: block; animation: slide-in .4s ease; }
  @keyframes slide-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .solution-warning {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    color: var(--red);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    margin-bottom: 12px;
  }
  
  .solution-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,215,0,0.2);
  }
  .solution-header h3 {
    margin: 0;
    font-size: 17px;
    color: var(--gold);
  }
  .copy-btn {
    margin-inline-start: auto;
    background: rgba(255,215,0,0.15);
    color: var(--gold);
    border: 1px solid rgba(255,215,0,0.3);
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 11.5px;
    cursor: pointer;
    font-family: inherit;
  }

  .solution-code {
    background: #0a0d1f;
    border: 1px solid rgba(255,215,0,0.25);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 16px;
    overflow-x: auto;
  }
  .solution-code pre {
    margin: 0;
    color: var(--gold);
    font-family: "SF Mono", Monaco, Menlo, monospace;
    font-size: 13.5px;
    direction: ltr;
    text-align: left;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .explanation-title {
    font-size: 14px;
    color: var(--cyan);
    font-weight: 700;
    margin: 0 0 10px;
  }
  .exp-line-list { list-style: none; padding: 0; margin: 0 0 14px; }
  .exp-line {
    background: rgba(0,212,200,0.05);
    border-inline-start: 2px solid var(--cyan);
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 7px;
  }
  .exp-line-code {
    color: var(--cyan);
    font-family: "SF Mono", Monaco, Menlo, monospace;
    font-size: 13px;
    direction: ltr;
    text-align: left;
    display: block;
    margin-bottom: 5px;
    background: #0a0d1f;
    padding: 5px 9px;
    border-radius: 4px;
    border: 1px solid var(--border2);
  }
  .exp-line-desc { font-size: 13px; color: var(--text); line-height: 1.6; }
  .exp-line-desc code {
    background: rgba(0,212,200,0.18);
    color: var(--cyan);
    padding: 1px 6px;
    border-radius: 3px;
    font-family: "SF Mono", Monaco, Menlo, monospace;
    font-size: 11.5px;
  }

  .theory-section {
    background: rgba(139,92,246,0.06);
    border: 1px solid rgba(139,92,246,0.25);
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 10px;
  }
  .theory-section h4 { margin: 0 0 8px; font-size: 13.5px; color: var(--purple); }
  .theory-section .theory-content { font-size: 13px; color: var(--text); line-height: 1.7; }
  .theory-section code {
    background: rgba(139,92,246,0.18); color: #c4b5fd;
    padding: 1px 6px; border-radius: 4px;
    font-family: "SF Mono", Monaco, Menlo, monospace; font-size: 12px;
  }
  .theory-section pre {
    background: #0a0d1f; padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--border2); overflow-x: auto;
    font-size: 12px; direction: ltr; text-align: left; color: #c4b5fd;
  }

  .nav-row {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    justify-content: space-between;
  }
  .nav-btn {
    background: var(--bg4);
    color: var(--text);
    border: 1px solid var(--border2);
    padding: 9px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
  }
  .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  
  /* Confetti effect for big achievements */
  .confetti {
    position: fixed;
    top: -10px;
    width: 8px;
    height: 8px;
    pointer-events: none;
    z-index: 999;
  }
  
  @media (max-width: 480px) {
    .container { padding: 10px; }
    .exercise-card { padding: 11px; }
    .ex-icon { font-size: 22px; }
    .ex-title { font-size: 13px; }
    .badge { font-size: 11px; padding: 2px 7px; }
    .question-box { font-size: 13px; padding: 9px 12px; }
    .code-editor { font-size: 13px; padding: 10px; min-height: 100px; }
    .btn { padding: 9px 14px; font-size: 12.5px; }
    .solution-code pre, .exp-line-code { font-size: 12px; }
    .solution-section { padding: 12px; }
    .progress-strip { flex-wrap: wrap; gap: 6px; }
    .score-pill { padding: 4px 10px; font-size: 11px; }
  }

  /* === CODE EDITOR TOOLBAR === */
  .editor-wrap {
    position: relative;
  }
  .editor-toolbar {
    display: flex;
    gap: 4px;
    padding: 6px;
    background: var(--bg4);
    border: 1px solid var(--border2);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    flex-wrap: wrap;
  }
  .editor-toolbar .tb-btn {
    background: var(--bg3);
    color: var(--text2);
    border: 1px solid var(--border2);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    -webkit-tap-highlight-color: rgba(0,212,200,0.2);
  }
  .editor-toolbar .tb-btn:hover, .editor-toolbar .tb-btn:active {
    background: var(--cyan);
    color: #000;
    border-color: var(--cyan);
  }
  .editor-toolbar .tb-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .editor-toolbar .tb-btn.copied {
    background: var(--green);
    color: #000;
    border-color: var(--green);
  }
  .editor-wrap .code-editor {
    border-radius: 0 0 8px 8px !important;
    border-top: none !important;
  }
  
  @media (max-width: 480px) {
    .editor-toolbar { padding: 5px; gap: 3px; }
    .editor-toolbar .tb-btn { padding: 5px 8px; font-size: 11px; }
  }


/* ===== In-depth explanation after a correct solution ===== */
.why-box{margin-top:11px;padding:11px 13px;border-radius:9px;background:rgba(0,212,200,.07);
 border:1px solid rgba(0,212,200,.26);font-size:13.5px;line-height:1.8;text-align:left;
 direction:ltr;font-weight:400}
.why-box .why-title{font-weight:700;font-size:12px;margin-bottom:5px;opacity:.9}
.why-box code{background:rgba(0,0,0,.3);padding:1px 5px;border-radius:4px;
 font-family:ui-monospace,Consolas,monospace;font-size:12.5px;direction:ltr;display:inline-block}
.why-box pre{background:rgba(0,0,0,.32);border-radius:8px;padding:9px 11px;overflow:auto;
 direction:ltr;text-align:left;margin:7px 0;font-size:12.5px}
.why-box ul{margin:6px 0;padding-inline-start:20px}.why-box li{margin:3px 0}
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="home-btn">🏠 Home</a>
  <button class="reset-score-btn" id="reset-score-btn">🔄 Reset score</button>
  <div class="score-pill">
    <span class="total-icon">🏆</span>
    <span><span id="total-score">0</span> / <span id="max-score">5150</span></span>
  </div>
</div>

<div class="progress-strip">
  <div class="progress-stat easy">
    <span>🟢</span> <span class="val" id="easy-done">0</span>/<span id="easy-total">0</span>
  </div>
  <div class="progress-stat medium">
    <span>🟡</span> <span class="val" id="medium-done">0</span>/<span id="medium-total">0</span>
  </div>
  <div class="progress-stat hard">
    <span>🔴</span> <span class="val" id="hard-done">0</span>/<span id="hard-total">0</span>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
</div>

<div class="filter-bar">
  <button class="filter-pill active" data-filter-type="course" data-filter="all">All (170)</button>
  <button class="filter-pill" data-filter-type="course" data-filter="python">🐍 Python</button>
  <button class="filter-pill" data-filter-type="course" data-filter="pandas">🐼 Pandas</button>
  <button class="filter-pill diff-easy" data-filter-type="difficulty" data-filter="easy">🟢 Easy</button>
  <button class="filter-pill diff-medium" data-filter-type="difficulty" data-filter="medium">🟡 Medium</button>
  <button class="filter-pill diff-hard" data-filter-type="difficulty" data-filter="hard">🔴 Hard</button>
  <button class="filter-pill" data-filter-type="status" data-filter="todo">⭕ Unsolved</button>
  <button class="filter-pill" data-filter-type="status" data-filter="done">✅ Solved</button>
  <input type="search" class="filter-search" id="search" placeholder="🔍 search..." autocomplete="off">
</div>

<div class="container">
  <div id="content">loading...</div>
</div>

<script>
// =============== DATA ===============
window.SIM_EXERCISES = [
 {
  "id": "variables-0",
  "num": 1,
  "topic_id": "variables",
  "topic_title": "Variables — Python's boxes",
  "topic_icon": "📥",
  "course": "python",
  "q": "Create a variable named <code>age</code> and give it the value <code>30</code>. Print it.",
  "starter": "# Write your code here\n",
  "solution": "age = 30\nprint(age)",
  "check_fn": "(output, code) => output.trim() === \"30\" && /(^|[^A-Za-z0-9_])age\\s*=\\s*30/.test(code)",

  "course": "python",
  "q": "The variable <code>num_text = \"15\"</code>. Convert it to an integer and store it in <code>num</code>. Print <code>num</code> and its type.",
  "starter": "num_text = \"15\"\n# Convert to int\n",
  "solution": "num_text = \"15\"\nnum = int(num_text)\nprint(num)\nprint(type(num))",
  "check_fn": "(output, code) => /^15/.test(output.trim()) && /int/.test(output) && /\\bnum\\s*=\\s*int\\s*\\(/.test(code)",
  "theory": "<p>Sometimes our data is in one type, and we need it in another. A classic example: a user types a number on a website, but the site receives it as text (<code>\"5\"</code>).</p>\n\n<h4>Conversion functions</h4>\n<ul>\n<li><code>int(x)</code> — converts to an integer. <b>Truncates</b> the decimal part toward zero (doesn't round): <code>int(3.9) = 3</code>, and also <code>int(-3.9) = -3</code></li>\n<li><code>float(x)</code> — turns it into a decimal number</li>\n<li><code>str(x)</code> — converts to a text string</li>\n<li><code>bool(x)</code> — converts to True/False</li>\n</ul>\n<p>The conversion <b>does not change</b> the original variable — it returns a new value. If you want to keep it, you need an assignment: <code>num = int(num_text)</code>.</p>\n\n<h4>When the conversion fails</h4>\n<p><code>int(\"15\")</code> works fine. But <code>int(\"15.5\")</code> <b>will throw a ValueError</b> — the int function doesn't know how to read a decimal point from text. The solution is a two-step conversion: <code>int(float(\"15.5\"))</code> (result: 15). Both <code>int(\"abc\")</code> and <code>int(\"\")</code> will throw a ValueError.</p>\n\n<h4>bool — what counts as False</h4>\n<p><code>bool(0)</code> is False, and every other number — including negative — is True. An empty string <code>bool(\"\")</code> is also False. <b>But watch out for the trap:</b> <code>bool(\"0\")</code> and <code>bool(\"False\")</code> are <b>True</b>, because as far as Python is concerned these are strings that have characters in them.</p>\n\n<h4>The most common mistake</h4>\n<p>Adding text and a number with <code>+</code>: <code>\"I am \" + 25</code> will raise <code>TypeError</code>. You need <code>\"I am \" + str(25)</code>. Note this is not 'an error on every text operation': <code>\"5\" * 3</code> actually works and returns <code>\"555\"</code> (repeating the text), and <code>\"5\" + \"5\"</code> returns <code>\"55\"</code>. The issue is only mixing str and int in the same operation.</p>",
  "explanation": [
   {
    "line": "print(float(7))",
    "exp": "Prints to the screen: <code>float(7)</code>"
   }
  ],
  "difficulty": "easy",
  "base_points": 10,
  "max_points": 20,
  "explain": "<p>Notice two separate steps: <code>int(num_text)</code> <b>computes</b> a new value, and <code>num =</code> <b>stores</b> it. Without the assignment, the value is simply discarded. After the conversion, <code>num_text</code> still holds the text <code>\"15\"</code> — we didn’t change it, we created a new number next to it.</p>\n<p>If we print <code>type(num_text)</code> we get <code>&lt;class 'str'&gt;</code>, and if we print <code>type(num)</code> we get <code>&lt;class 'int'&gt;</code> — this is the way to confirm the conversion really happened.</p>"

  "theory": "<p>Sometimes our data is in one type, and we need it in another. A classic example: a user types a number on a website, but the site receives it as text (<code>\"5\"</code>).</p>\n\n<h4>Conversion functions</h4>\n<ul>\n<li><code>int(x)</code> — converts to an integer. <b>Truncates</b> the decimal part toward zero (doesn't round): <code>int(3.9) = 3</code>, and also <code>int(-3.9) = -3</code></li>\n<li><code>float(x)</code> — turns it into a decimal number</li>\n<li><code>str(x)</code> — converts to a text string</li>\n<li><code>bool(x)</code> — converts to True/False</li>\n</ul>\n<p>The conversion <b>does not change</b> the original variable — it returns a new value. If you want to keep it, you need an assignment: <code>num = int(num_text)</code>.</p>\n\n<h4>When the conversion fails</h4>\n<p><code>int(\"15\")</code> works fine. But <code>int(\"15.5\")</code> <b>will throw a ValueError</b> — the int function doesn't know how to read a decimal point from text. The solution is a two-step conversion: <code>int(float(\"15.5\"))</code> (result: 15). Both <code>int(\"abc\")</code> and <code>int(\"\")</code> will throw a ValueError.</p>\n\n<h4>bool — what counts as False</h4>\n<p><code>bool(0)</code> is False, and every other number — including negative — is True. An empty string <code>bool(\"\")</code> is also False. <b>But watch out for the trap:</b> <code>bool(\"0\")</code> and <code>bool(\"False\")</code> are <b>True</b>, because as far as Python is concerned these are strings that have characters in them.</p>\n\n<h4>The most common mistake</h4>\n<p>Adding text and a number with <code>+</code>: <code>\"I am \" + 25</code> will raise <code>TypeError</code>. You need <code>\"I am \" + str(25)</code>. Note this is not 'an error on every text operation': <code>\"5\" * 3</code> actually works and returns <code>\"555\"</code> (repeating the text), and <code>\"5\" + \"5\"</code> returns <code>\"55\"</code>. The issue is only mixing str and int in the same operation.</p>",
  "explanation": [
   {
    "line": "print(bool(0))",
    "exp": "Prints to the screen: <code>bool(0)</code>"
   },
   {
    "line": "print(bool(1))",
    "exp": "Prints to the screen: <code>bool(1)</code>"

  "difficulty": "easy",
  "base_points": 10,
  "max_points": 20,
  "explain": "<p><code>int()</code> doesn't round — it <b>chops off</b> whatever comes after the decimal point. So <code>int(3.9)</code> is 3, not 4, and <code>int(-3.9)</code> is -3, not -4 (truncation is always toward zero).</p>\n<p>If you want real rounding, there's a different function: <code>round(3.9)</code> returns 4. In data work this is an expensive mistake — converting an age or a quantity with int() always 'rounds down'.</p>"
 },

  "theory": "<p>Python is an <b>excellent calculator</b>. The basic operators are reminiscent of arithmetic class, but there are a few special symbols worth knowing when working with data:</p>\n\n<table style=\"width:100%;border-collapse:collapse\">\n<tr><th style=\"text-align:left;padding:.5rem;border-bottom:1px solid var(--border)\">Operator</th><th style=\"text-align:left;padding:.5rem;border-bottom:1px solid var(--border)\">What it does</th><th style=\"text-align:left;padding:.5rem;border-bottom:1px solid var(--border)\">Example</th></tr>\n<tr><td style=\"padding:.5rem\"><code>+</code></td><td style=\"padding:.5rem\">Addition</td><td style=\"padding:.5rem\"><code>5 + 3 = 8</code></td></tr>\n<tr><td style=\"padding:.5rem\"><code>-</code></td><td style=\"padding:.5rem\">Subtraction</td><td style=\"padding:.5rem\"><code>5 - 3 = 2</code></td></tr>\n<tr><td style=\"padding:.5rem\"><code>*</code></td><td style=\"padding:.5rem\">Multiplication</td><td style=\"padding:.5rem\"><code>5 * 3 = 15</code></td></tr>\n<tr><td style=\"padding:.5rem\"><code>/</code></td><td style=\"padding:.5rem\">Division — always returns float!</td><td style=\"padding:.5rem\"><code>10 / 2 = 5.0</code></td></tr>\n<tr><td style=\"padding:.5rem\"><code>//</code></td><td style=\"padding:.5rem\">Integer division — rounds down</td><td style=\"padding:.5rem\"><code>10 // 3 = 3</code></td></tr>\n<tr><td style=\"padding:.5rem\"><code>%</code></td><td style=\"padding:.5rem\">Modulo — remainder of division</td><td style=\"padding:.5rem\"><code>10 % 3 = 1</code></td></tr>\n<tr><td style=\"padding:.5rem\"><code>**</code></td><td style=\"padding:.5rem\">Exponent</td><td style=\"padding:.5rem\"><code>5 ** 3 = 125</code></td></tr>\n</table>\n\n<p style=\"margin-top:.7rem\"><b>Important trick:</b> <code>%</code> (modulo) is the classic way to check evenness. If <code>x % 2 == 0</code> then x is even.</p>\n\n<h4>Order of operations</h4>\n<p>Just like in arithmetic: first <code>**</code>, then <code>*  /  //  %</code>, and finally <code>+  -</code>. That's why <code>2 + 3 * 4</code> is 14, not 20. To compute an average you need parentheses: <code>(a + b) / 2</code>.</p>\n\n<h4>Two traps with negative numbers</h4>\n<p><code>//</code> rounds <b>down</b>, not toward zero: <code>-10 // 3</code> is <code>-4</code> (not -3). And with <code>%</code> the sign is set by the divisor: <code>-10 % 3</code> is <code>2</code>. On positive numbers, both operators behave exactly as you’d expect.</p>\n\n<h4>Division by zero</h4>\n<p><code>10 / 0</code> doesn't return infinity — it stops the program with <code>ZeroDivisionError</code>. The same goes for <code>//</code> and <code>%</code>. This is the most common error in ratio and percentage calculations, and later in the course we'll learn to handle it with try/except.</p>\n\n<h4>A note on decimal numbers</h4>\n<p>Computers store floats as a binary approximation, so <code>0.1 + 0.2</code> prints <code>0.30000000000000004</code>. This isn't a bug — that's why you don't compare float results with <code>==</code>, but round first with <code>round(x, 2)</code>.</p>",
  "explanation": [
   {
    "line": "print(10 / 2)",
    "exp": "Prints to the screen: <code>10 / 2</code>"
   }
  ],
  "difficulty": "easy",
  "base_points": 10,
  "max_points": 20,
  "explain": "<p>In Python 3, the <code>/</code> sign is always <b>decimal division</b>, even when the division comes out even. So <code>10 / 2</code> prints <code>5.0</code> (float) and not <code>5</code>.</p>\n<p>If you need an integer, there are two ways: <code>10 // 2</code> (integer division) or <code>int(10 / 2)</code>. And remember: <code>10 / 0</code> does not return infinity but stops the program with a <code>ZeroDivisionError</code>.</p>"
 },

  "q": "Given: <code>x = 15, y = 20</code>. Print the result of <code>x &lt; y</code>.",
  "starter": "x = 15\ny = 20\n# Print x < y\n",
  "solution": "x = 15\ny = 20\nprint(x < y)",
  "check_fn": "(output, code) => output.trim() === \"True\" && /x\\s*<\\s*y/.test(code)",
  "theory": "<p>To make decisions, the computer first needs to know how to <b>compare</b> two things. A comparison operation always returns a <b>boolean value</b> - either <code>True</code> or <code>False</code>.</p>\n\n<h4>Operators</h4>\n<ul>\n<li><code>&gt;</code> (greater than...) and <code>&lt;</code> (less than...)</li>\n<li><code>&gt;=</code> (greater than or equal) and <code>&lt;=</code> (less than or equal)</li>\n<li><code>==</code> (equal to...) - <b>double equals</b>!</li>\n<li><code>!=</code> (not equal to...)</li>\n</ul>\n\n<h4>The result is a real value you can store</h4>\n<p>A comparison is an expression, just like <code>2 + 2</code>. You can print it, and you can save it in a variable:</p>\n<pre><code>x = 15\ny = 20\nresult = x &lt; y\nprint(result)   # True\nprint(type(result))   # &lt;class 'bool'&gt;</code></pre>\n\n<h4>The most common mistake</h4>\n<p>Don't confuse <code>=</code> (assignment) with <code>==</code> (comparison). <code>x = 5</code> binds the name x to the value 5. <code>x == 5</code> asks \"Does x equal 5?\" and returns True or False.</p>\n\n<h4>Pay attention to data types</h4>\n<pre><code>a = 10\nb = \"10\"\nprint(a == b)   # False! this is int vs str\nprint(a == int(b))   # True - after conversion</code></pre>\n\n<p><b>But watch out for a false generalization:</b> not every two different types are necessarily unequal. Numbers of type int and float do compare equal by value:</p>\n<pre><code>print(10 == 10.0)   # True</code></pre>\n\n<h4>What happens when comparing size between different types</h4>\n<p><code>==</code> and <code>!=</code> between int and str simply return False/True. In contrast, <code>&gt;</code> and <code>&lt;</code> between int and str are an <b>error</b> in Python 3:</p>\n<pre><code>print(10 &gt; \"10\")   # TypeError</code></pre>\n<p>So before comparing sizes - make sure both sides are of the same type (for example with <code>int()</code>).</p>\n\n<h4>Text comparison is case-sensitive</h4>\n<pre><code>print(\"Active\" == \"active\")   # False\nprint(\"Active\".lower() == \"active\")   # True</code></pre>\n<p>This is a very common mistake when comparing user input. If you don't care about upper/lower case - compare after <code>.lower()</code>.</p>\n\n<h4>Chained comparisons</h4>\n<p>In Python you can write a range on a single line, just like in math:</p>\n<pre><code>x = 7\nprint(0 &lt; x &lt; 10)   # True</code></pre>",

    "exp": "Assigns the value <code>15</code> to the variable <code>x</code>"

    "line": "y = 20",
    "exp": "Assigns the value <code>20</code> to the variable <code>y</code>"
   },
   {
    "line": "print(x < y)",
    "exp": "Prints to the screen: <code>x < y</code>"
   }
  ],
  "difficulty": "easy",
  "base_points": 10,
  "max_points": 20,
  "explain": "<p>A comparison is an expression that returns a value, just like a calculation. <code>x &lt; y</code> isn't a \"check\" command - it simply evaluates to the value <code>True</code> or <code>False</code>, so you can print it directly:</p><pre><code>x = 15\ny = 20\nprint(x &lt; y)   # True</code></pre><p>You can also save the result in a variable and use it later:</p><pre><code>is_smaller = x &lt; y\nprint(is_smaller)   # True</code></pre><p>Note: size comparison only works between values of the same type. <code>15 &lt; \"20\"</code> will cause a TypeError, because you can't ask which is bigger between a number and text.</p>"

tive\" == \"active\")   # False\nprint(\"Active\".lower() == \"active\")   # True</code></pre>\n<p>This is a very common mistake when comparing user input. If you don't care about upper/lower case - compare after <code>.lower()</code>.</p>\n\n<h4>Chained comparisons</h4>\n<p>In Python you can write a range on a single line, just like in math:</p>\n<pre><code>x = 7\nprint(0 &lt; x &lt; 10)   # True</code></pre>",

 {
  "id": "logical-ops-0",
  "num": 16,
  "topic_id": "logical-ops",
  "topic_title": "Logical operators — and, or, not",
  "topic_icon": "🧠",
  "course": "python",
  "q": "Given: <code>age = 25</code> and <code>has_license = True</code>. Check whether <code>age &gt;= 18 and has_license == True</code>.",
  "starter": "age = 25\nhas_license = True\n# check both conditions together\n",
  "solution": "age = 25\nhas_license = True\nprint(age >= 18 and has_license)",
  "check_fn": "(output, code) => output.trim() === \"True\" && /\\band\\b/.test(code) && /age/.test(code) && /has_license/.test(code)",
  "theory": "<p>Sometimes a decision depends on<b>several conditions at once</b> (for example: the customer is both over 18 and has an active subscription).</p>\n\n<h4>The three logical operators</h4>\n<ul>\n<li><b><code>and</code> (and)</b>: returns <code>True</code> only if <b>all</b> the conditions are True. If one is False - everything falls.</li>\n<li><b><code>or</code> (or)</b>: returns <code>True</code> if <b>at least one</b> of the conditions is True. It’s False only if all conditions are False.</li>\n<li><b><code>not</code> (not)</b>: inverts the result. If <code>True</code> then <code>False</code>, and vice versa.</li>\n</ul>\n\n<h4>Full truth table</h4>\n<pre><code>True  and True  -&gt; True\nTrue  and False -&gt; False\nFalse and True  -&gt; False\nFalse and False -&gt; False\n\nTrue  or True   -&gt; True\nTrue  or False  -&gt; True\nFalse or True   -&gt; True\nFalse or False  -&gt; False\n\nnot True  -&gt; False\nnot False -&gt; True</code></pre>\n\n<p><b>Note about or:</b> Python's <code>or</code> means \"at least one\", not \"either one or the other but not both\". Even when both sides are True, the result is True.</p>\n\n<h4>A boolean variable is already a condition</h4>\n<p>If a variable already holds <code>True</code> or <code>False</code>, there's no need to compare it to <code>True</code>:</p>\n<pre><code>has_license = True\n\nprint(has_license == True)   # works, but redundant\nprint(has_license)           # the correct way\nprint(not has_license)       # this is how you check the opposite case</code></pre>\n<p>Writing <code>== True</code> is considered bad style in Python, and style checkers (PEP 8) even flag it as a warning. Compare to True only when you're not sure the value is boolean.</p>\n\n<h4>Order of operations between operators</h4>\n<p>When you mix operators, Python evaluates them in a fixed order — first comparisons, then <code>not</code>, then <code>and</code>, and only at the end <code>or</code>:</p>\n<pre><code>price = 150\nprint(price &lt; 100 or not price &gt; 200)</code></pre>\n<p>Python reads this as follows: first the comparisons are computed - <code>price &lt; 100</code> is False and <code>price &gt; 200</code> is False. Then <code>not False</code> becomes True. And finally <code>False or True</code> gives <b>True</b>.</p>\n<p>Note that <code>not price &gt; 200</code> means <code>not (price &gt; 200)</code> and not <code>(not price) &gt; 200</code> - the comparison is always evaluated before the <code>not</code>.</p>\n<p><b>Practical tip:</b> when in doubt, add parentheses. <code>(price &lt; 100) or (not (price &gt; 200))</code> behaves exactly the same way, and reads much more clearly.</p>\n\n<h4>Range check - a shortcut</h4>\n<p>Instead of <code>x &gt; 0 and x &lt; 3</code> Python lets you write a range in one line, just like in math:</p>\n<pre><code>x = 5\nprint(x &gt; 0 and x &lt; 3)   # False\nprint(0 &lt; x &lt; 3)         # False - exactly the same thing</code></pre>\n<p>But you can’t shorten this to <code>x &gt; 0 and &lt; 3</code>. After <code>and</code> a complete condition must follow, with the variable name again.</p>",
  "explanation": [
   {
    "line": "age = 25",
    "exp": "Assigns the value <code>25</code> to the variable <code>age</code>"
   },
   {
    "line": "has_license = True",
    "exp": "Assigns to the variable <code>has_license</code> the value <code>True</code>"
   },
   {
    "line": "print(age >= 18 and has_license == True)",
    "exp": "Prints to the screen: <code>age >= 18 and has_license == True</code>"
   }
  ],
  "difficulty": "easy",
  "base_points": 10,
  "max_points": 20,
  "explain": "<p>When two conditions need to hold together, you use <code>and</code>. The whole expression will be True only if both sides are True:</p><pre><code>age = 25\nhas_license = True\nprint(age &gt;= 18 and has_license)   # True</code></pre><p>Notice what we didn't write: <code>has_license == True</code>. The variable already holds <code>True</code> or <code>False</code>, so comparing it to True is redundant, exactly like writing <code>x + 0</code> instead of <code>x</code>. In Python this is considered a style error, and professional code checkers flag it.</p><p>The opposite case is checked with <code>not</code>:</p><pre><code>print(age &gt;= 18 and not has_license)   # False</code></pre><p>Try changing <code>has_license</code> to <code>False</code> and running it again - you'll see that it's enough for one side to fail for the whole expression to fail.</p>"
 },

  "theory": "<p>Sometimes a decision depends on<b>several conditions at once</b> (for example: the customer is both over 18 and has an active subscription).</p>\n\n<h4>The three logical operators</h4>\n<ul>\n<li><b><code>and</code> (and)</b>: returns <code>True</code> only if <b>all</b> the conditions are True. If one is False - everything falls.</li>\n<li><b><code>or</code> (or)</b>: returns <code>True</code> if <b>at least one</b> of the conditions is True. It’s False only if all conditions are False.</li>\n<li><b><code>not</code> (not)</b>: inverts the result. If <code>True</code> then <code>False</code>, and vice versa.</li>\n</ul>\n\n<h4>Full truth table</h4>\n<pre><code>True  and True  -&gt; True\nTrue  and False -&gt; False\nFalse and True  -&gt; False\nFalse and False -&gt; False\n\nTrue  or True   -&gt; True\nTrue  or False  -&gt; True\nFalse or True   -&gt; True\nFalse or False  -&gt; False\n\nnot True  -&gt; False\nnot False -&gt; True</code></pre>\n\n<p><b>Note about or:</b> Python's <code>or</code> means \"at least one\", not \"either one or the other but not both\". Even when both sides are True, the result is True.</p>\n\n<h4>A boolean variable is already a condition</h4>\n<p>If a variable already holds <code>True</code> or <code>False</code>, there's no need to compare it to <code>True</code>:</p>\n<pre><code>has_license = True\n\nprint(has_license == True)   # works, but redundant\nprint(has_license)           # the correct way\nprint(not has_license)       # this is how you check the opposite case</code></pre>\n<p>Writing <code>== True</code> is considered bad style in Python, and style checkers (PEP 8) even flag it as a warning. Compare to True only when you're not sure the value is boolean.</p>\n\n<h4>Order of operations between operators</h4>\n<p>When you mix operators, Python evaluates them in a fixed order — first comparisons, then <code>not</code>, then <code>and</code>, and only at the end <code>or</code>:</p>\n<pre><code>price = 150\nprint(   "q": "Load <code>students</code>. Filter the students who got <b>above 85</b> in <code>math</code> and print the <code>shape</code> of the result.",
  "starter": "",
  "solution": "df = data.load(\"students\")\nresult = df[df[\"math\"].gt(85)]\nprint(result.shape)",
  "check_fn": "(o,c)=>{const s=c.replace(/#[^\\n]*/g,'');const R=(o.match(/__DATAROW__/g)||[]).length;const T=o.trim();return T==='(5, 4)'&&/\\[\\s*[\"']math[\"']\\s*\\]\\s*\\.gt\\s*\\(\\s*85\\s*\\)/.test(s)&&/(df\\s*\\[|\\.loc\\s*\\[|\\.query\\s*\\()/.test(s)&&/data\\.load\\s*\\(\\s*[\"']students[\"']\\s*\\)/.test(s)&&/\\.shape/.test(s);}",
  "theory": "<h3>Filtering rows - the boolean mask</h3><p>Filtering in pandas works in two steps. First you build a <b>boolean mask</b>: a True/False series the length of the table, one value per row. Then you hand it to the DataFrame, which returns only the rows where it's True.</p><pre>mask = df[\"age\"].gt(25)   # [False, True, True, ...]\ndf[mask]                   # only rows where True</pre><p>Usually this is written in one line:</p><pre>df[df[\"age\"].gt(25)]</pre><p><b>Comparison methods</b> - all standard pandas methods that return a mask:</p><ul><li><code>.gt(v)</code> greater than &nbsp;|&nbsp; <code>.ge(v)</code> greater than or equal</li><li><code>.lt(v)</code> less than &nbsp;|&nbsp; <code>.le(v)</code> less than or equal</li><li><code>.eq(v)</code> equal &nbsp;|&nbsp; <code>.ne(v)</code> not equal</li><li><code>.isin([a, b])</code> is one of the values in the list</li><li><code>.between(a, b)</code> in range, including both endpoints</li></ul><p><b><code>.loc</code></b> does the same thing, and lets you select a column in the same breath:</p><pre>df.loc[df[\"points\"].ge(50)]            # same rows\ndf.loc[df[\"points\"].ge(50), \"team\"]    # only the team column from these rows</pre><p>There's also <code>df.query(\"age &gt; 25\")</code> - a readable string, convenient for simple conditions.</p><p>Filtering <b>returns a new table</b> and the original <code>df</code> is unchanged. The number of columns is always preserved - filtering only removes rows - so the result's <code>shape</code> is (fewer rows, same number of columns).</p><p><b>Watch the boundary:</b> \"above 85\" is <code>.gt(85)</code> and does not include 85 itself; \"85 and above\" is <code>.ge(85)</code>. The difference between these two letters is the difference between a correct report and a wrong one.</p><h4>What's different from real pandas?</h4><p>In real pandas you can also write <code>df[df[\"age\"] &gt; 25]</code> with a plain &gt; sign. <b>Here that won't work:</b> the Python engine running in the browser (Skulpt) forces the return value of the comparison operator to be a single <code>True</code>/<code>False</code>, so it can't produce a full mask from it.</p><p>The solution is <code>.gt()</code> - <b>and this is a completely real pandas method</b>, not something the simulator invented. <code>df[df[\"age\"].gt(25)]</code> will run exactly the same way in real pandas too and return the same result. This is the only syntax we'll use here, and you can take it to work as-is.</p><p><b>Warning:</b> an earlier version of the course taught <code>df.filter(\"age\", \"&gt;\", 25)</code> here. <b>Don't use it.</b> In pandas <code>filter</code> does exist - but it does something completely different: it selects <b>columns</b> by name, like <code>df.filter(items=[\"age\"])</code>. Calling it the old way will throw a <code>TypeError</code> there.</p><p><b>Missing values:</b> a row whose value is <code>None</code> will fail every comparison condition, except <code>.ne()</code>, which will return True for it. This is exactly the behavior of <code>NaN</code> in pandas.</p>",

  "difficulty": "medium",

  "explain": "<p><code>df[\"math\"].gt(85)</code> produces a mask: <code>[True, False, True, ...]</code>, one value for each of the ten students. <code>df[mask]</code> returns only the rows where True - five rows (88, 92, 95, 89, 86).</p><p><code>shape</code> is <code>(5, 4)</code>, not <code>(5, 1)</code>: <b>filtering removes rows, not columns</b>. All four fields of those same five students were kept.</p><p><b>The boundary matters:</b> \"above 85\" is <code>.gt(85)</code>, and the score 85 itself is not included. If you meant \"85 and above\" you would need <code>.ge(85)</code>. A single letter separates two different answers.</p><p><b>Compared to real pandas:</b> the same code works there unchanged. There you could also write <code>df[df[\"math\"] &gt; 85]</code>, but <code>.gt</code> is valid in both places.</p>"

  "theory": "<h3>Complex conditions - combining masks</h3><p>A mask is an object, so you can combine several masks into one condition:</p><ul><li><code>&amp;</code> - and (AND): both conditions must hold</li><li><code>|</code> - or (OR): it's enough for one to hold</li><li><code>~</code> - not (NOT): inverts the mask</li></ul><pre>m1 = df[\"math\"].gt(80)\nm2 = df[\"english\"].gt(80)\ndf[m1 &amp; m2]                                  # both conditions together\ndf[df[\"wins\"].gt(12) | df[\"points\"].ge(50)]  # at least one\ndf[~df[\"team\"].isin([\"Beitar\"])]                # everyone not on the list</pre><p><b>Key warning: Python's <code>and</code> and <code>or</code> won't work here.</b> They operate on a <b>single</b> boolean value, whereas a mask is an entire series of values. Always use <code>&amp;</code>, <code>|</code>, <code>~</code>.</p><p><b>Parentheses:</b> in real pandas you must wrap every condition in parentheses - <code>df[(df[\"a\"] &gt; 1) &amp; (df[\"b\"] &lt; 5)]</code> - because <code>&amp;</code> has higher precedence than <code>&gt;</code>. With <code>.gt()</code> the problem doesn't exist, but the habit of pulling each condition into its own variable (<code>m1</code>, <code>m2</code>) prevents bugs and makes reading and debugging easier.</p><p><b>Two shortcuts worth knowing:</b> <code>.isin([...])</code> replaces a long chain of <code>|</code>, and <code>.between(a, b)</code> replaces <code>.ge(a) &amp; .le(b)</code>:</p><pre>df[df[\"city\"].isin([\"Haifa\", \"Eilat\"])]\ndf[df[\"sqm\"].between(90, 110)]   # includes 90 and includes 110</pre><p>And you can always chain <code>.loc</code> to pull a column out of the result: <code>df.loc[m1 &amp; m2, \"name\"]</code>.</p><h4>What's the difference from real pandas?</h4><p>Everything on this page - <code>&amp;</code>, <code>|</code>, <code>~</code>, <code>.isin</code>, <code>.between</code>, <code>.loc</code> - is standard pandas syntax that will work exactly the same way on the job. The only remaining difference is in the comparison itself: here <code>.gt()</code> instead of <code>&gt;</code>, for reasons of the engine running in the browser.</p><p><b>Warning:</b> an earlier version of the course taught <code>df.where(lambda r: ...)</code> here for filtering rows. <b>Don't use it.</b> In real pandas, <code>DataFrame.where(cond)</code> exists but does something completely different: it <b>keeps all the rows</b> and replaces with <code>NaN</code> the values where the condition doesn't hold. Filtering rows is always done with a boolean mask.</p>",

ining difference is in the comparison itself: here <code>.gt()</code> instead of <code>&gt;</code>, for reasons of the engine running in the browser.</p><p><b>Warning:</b> an earlier version of the course taught <code>df.where(lambda r: ...)</code> here for filtering rows. <b>Don't use it.</b> In real pandas, <code>DataFrame.where(cond)</code> exists but does something completely different: it <b>keeps all the rows</b> and replaces with <code>NaN</code> the values where the condition doesn't hold. Filtering rows is always done with a boolean mask.</p>",

  "starter": "",
  "solution": "df = data.load(\"football\")\ndf[\"diff\"] = df[\"goals_for\"] - df[\"goals_against\"]\nprint(df[[\"team\", \"diff\"]])",
  "check_fn": "(o,c) => {const k=c.replace(/#[^\\n]*/g,'');const rows=(o.match(/__DATAROW__/g)||[]).length;return /df\\[[\"\\']diff[\"\\']\\]\\s*=/.test(k) && /goals_for/.test(k) && /goals_against/.test(k) && /33/.test(o) && /27/.test(o) && /-1/.test(o) && rows === 5;}",
  "theory": "<h3>Creating new columns</h3>\n<p>A new column is created with a simple assignment, just like a key in a dictionary:</p>\n<pre>df[\"total\"] = [100, 200, 300]   # a list with length equal to the number of rows\ndf[\"constant\"] = 0               # a single value - duplicated to all rows</pre>\n<p>Three things worth knowing about assignment:</p>\n<ul>\n<li>It changes the DataFrame <b>in place</b>. No need to write <code>df = df[...]</code>.</li>\n<li>If the name already exists - the old column is silently overwritten, with no error.</li>\n<li>If the list length differs from the number of rows you'll get an error: <code>ValueError: Length mismatch</code>.</li>\n</ul>\n<h4>Vectorized calculation between columns</h4>\n<p>This is the heart of pandas: an arithmetic operation on a column acts on <b>all the rows at once</b>, with no loop and no indexing.</p>\n<pre>df[\"diff\"]  = df[\"goals_for\"] - df[\"goals_against\"]   # column minus column\ndf[\"pct\"]   = df[\"part\"] / df[\"total\"] * 100          # chained operations\ndf[\"bonus\"] = df[\"salary\"] * 0.1                      # column times a number</pre>\n<p>The four operators <code>+</code> <code>-</code> <code>*</code> <code>/</code> work between two columns and between a column and a number, exactly like in real pandas.</p>\n<h4>Rounding the result</h4>\n<p>Division in Python always returns a <code>float</code>, so you'll see values like <code>83.66666666666667</code>. This isn't a bug but the binary representation of fractions. Round with <code>.round(n)</code> on the whole column:</p>\n<pre>df[\"average\"] = ((df[\"math\"] + df[\"english\"]) / 2).round(2)</pre>\n<h4>What is actually different here from real pandas</h4>\n<p>The comparison operators <code>&gt;</code> <code>&lt;</code> <code>==</code> aren't supported on a column in the engine that runs the course (a Skulpt limitation, not a pandas one). Instead, use the methods <code>.gt()</code> <code>.lt()</code> <code>.ge()</code> <code>.le()</code> <code>.eq()</code>, which are real pandas methods in every respect:</p>\n<pre>df[\"is_win\"] = df[\"goals_for\"].gt(df[\"goals_against\"])   # here, and in pandas\n# In pandas you can also do: df[\"goals_for\"] > df[\"goals_against\"]</pre>",

  "theory": "<h3>apply and map - changing values in a column</h3>\n<p><b>apply</b> runs a function on <b>every value</b> in the column individually, and returns a new column:</p>\n<pre>df[\"doubled\"] = df[\"x\"].apply(lambda v: v * 2)\ndf[\"label\"]   = df[\"price\"].apply(lambda v: \"expensive\" if v &gt; 100 else \"cheap\")</pre>\n<p>Note: the lambda receives a <b>single value</b>, not the whole column. So <code>lambda v: v * 2</code> is correct, while <code>lambda v: v.sum()</code> will raise an error.</p>\n<p><b>map</b> translates values using a dictionary - the standard tool for converting codes to text and back:</p>\n<pre>df[\"status\"] = df[\"churn\"].map({0: \"Active\", 1: \"Churned\"})</pre>\n<h4>The map trap: a value not in the dictionary</h4>\n<ul>\n<li>In the course's version - the original value is kept, and you get a mixed column of text and numbers.</li>\n<li>In real pandas - you get <code>NaN</code>.</li>\n</ul>\n<p>In both cases <b>no error is thrown</b>, so a missing dictionary entry is a silent bug. In practice you check right after the mapping that no values were left untranslated.</p>\n<h4>apply on a column vs apply on a row</h4>\n<pre>df[\"col\"].apply(fn)            # fn receives a single value\ndf.apply(fn, axis=1)           # fn receives a whole row\ndf[\"total\"] = df.apply(lambda row: row[\"a\"] + row[\"b\"], axis=1)</pre>\n<h4>When not to use apply</h4>\n<p><code>apply</code> is convenient but slow - it runs a Python loop behind the scenes. When you can write the same thing vectorized, that's preferred:</p>\n<pre>df[\"x\"] * 2                        # fast\ndf[\"x\"].apply(lambda v: v * 2)     # same result, much slower</pre>\n<p>Save <code>apply</code> for logic that can't be expressed with operators - complex conditions, text processing, external functions.</p>",

  "theory": "<h3>A Series is a column</h3>\n<p>Every column selection - <code>df[\"salary\"]</code> - returns a <b>Series</b> object. Every Series has summary methods:</p>\n<ul>\n<li><code>.mean()</code> <code>.sum()</code> <code>.max()</code> <code>.min()</code> <code>.count()</code></li>\n<li><code>.median()</code> - median, <code>.std()</code> - standard deviation, <code>.quantile(q)</code> - percentile</li>\n<li><code>.unique()</code> - the list of unique values, <code>.nunique()</code> - <b>their count</b></li>\n<li><code>.value_counts()</code> - how many times each value appeared, from most common to rarest</li>\n<li><code>.idxmax()</code> / <code>.idxmin()</code> - the <b>label</b> of the extreme value</li>\n<li><code>.round(n)</code> <code>.sort_values()</code> <code>.nlargest(n)</code> <code>.apply(fn)</code> <code>.map(d)</code></li>\n</ul>\n<h4>The average alone doesn't tell the story</h4>\n<p>An average is very sensitive to outliers; a median is not. When the two are far apart - there are outliers or an asymmetric distribution, and that's always a question worth asking before reporting a single number.</p>\n<pre>print(df[\"salary\"].mean())     # 18500.0\nprint(df[\"salary\"].median())   # 17500.0</pre>\n<h4>From number to row: idxmax</h4>\n<p>\"What's the highest price\" is a weak question. \"Which neighborhood holds it\" is the real question:</p>\n<pre>print(df[\"price_m\"].max())                   # 6.8\nprint(df.loc[df[\"price_m\"].idxmax()])        # the entire row</pre>\n<h4>Two points to note</h4>\n<ul>\n<li>All aggregation operations <b>silently skip</b> missing values. Always compare <code>df[\"col\"].count()</code> to the total number of rows, otherwise an average that looks fine might be based on half the data.</li>\n<li>Comparisons on a column are done with methods - <code>.gt() .lt() .ge() .le() .eq() .ne()</code> - not operators. These methods also exist in real pandas and work exactly the same there, but in code you'll encounter at work you'll mostly see the short form <code>df[df[\"math\"] &gt; 80]</code>, which isn't supported by the course's engine.</li>\n</ul>",

  "explain": "<p><code>df[\"math\"]</code> returns the column as a Series, and <code>.mean()</code> summarizes it to a single number. We also printed the median because the mean alone is almost never enough.</p><p>Here the mean is 83.4 and the median is 85. The gap is small, meaning the distribution is reasonable and there is no outlier pulling the mean. If the median were 85 and the mean 60, we would immediately know there is a student or two with a very low score distorting the picture. This is a two-second check that saves reports.</p><p>Notice the output is <code>83.40000000000001</code>, not 83.4 - this is how the browser's execution engine displays binary fractions. You can round with <code>round(x, 2)</code> for a clean display.</p><p>And one more thing: <code>mean</code> silently skips missing values. Always compare <code>df[\"math\"].count()</code> to the total number of rows.</p>"

  "theory": "<h3>GroupBy - the core of pandas</h3>\n<p><code>groupby</code> is the <code>GROUP BY</code> of SQL: you split the rows into groups by a column value, and calculate a summary for each group separately.</p>\n<pre>df.groupby(\"department\").mean()   # average of every numeric column, per department\ndf.groupby(\"plan\").sum()          # sum\ndf.groupby(\"city\").max()          # maximum</pre>\n<p>Available operations: <code>.mean() .sum() .min() .max() .median() .std() .count() .size() .nunique()</code></p>\n<h4>Two ways to select a column</h4>\n<pre>df.groupby(\"department\").mean()[[\"department\", \"salary\"]]   # group, then select\ndf.groupby(\"department\")[\"salary\"].mean()                    # select, then group</pre>\n<p>The second is more efficient and more common in practice - it computes only what you asked for.</p>\n<h4>agg - several calculations at once</h4>\n<pre>df.groupby(\"department\").agg({\"salary\": \"mean\", \"years\": \"max\"})</pre>\n<h4>count vs size - a difference that trips people up</h4>\n<ul>\n<li><code>.size()</code> - how many <b>rows</b> are in each group. One number per group.</li>\n<li><code>.count()</code> - how many <b>non-missing</b> values there are in each column, in each group. Column by column.</li>\n</ul>\n<p>When there are no missing values, both give the same numbers, so the difference only shows up in real data - exactly when it already costs money. To count rows, use <code>size</code>.</p>\n<h4>Two deviations from real pandas worth knowing</h4>\n<ul>\n<li>Here the grouping column stays a <b>regular column</b> in the result. In real pandas it becomes the <b>index</b>, and you return it to a column with <code>.reset_index()</code>.</li>\n<li>Here the groups are returned in the order they <b>appear</b> in the data. In real pandas they are sorted by key by default (<code>sort=True</code>).</li>\n</ul>",

  "theory": "<h3>GroupBy - the core of pandas</h3>\n<p><code>groupby</code> is the <code>GROUP BY</code> of SQL: you split the rows into groups by a column value, and calculate a summary for each group separately.</p>\n<pre>df.groupby(\"department\").mean()   # average of every numeric column, per department\ndf.groupby(\"plan\").sum()          # sum\ndf.groupby(\"city\").max()          # maximum</pre>\n<p>Available operations: <code>.mean() .sum() .min() .max() .median() .std() .count() .size() .nunique()</code></p>\n<h4>Two ways to select a column</h4>\n<pre>df.groupby(\"department\").mean()[[\"department\", \"salary\"]]   # group, then select\ndf.groupby(\"department\")[\"salary\"].mean()                    # select, then group</pre>\n<p>The second is more efficient and more common in practice - it computes only what you asked for.</p>\n<h4>agg - several calculations at once</h4>\n<pre>df.groupby(\"department\").agg({\"salary\": \"mean\", \"years\": \"max\"})</pre>\n<h4>count vs size - a difference that trips people up</h4>\n<ul>\n<li><code>.size()</code> - how many <b>rows</b> are in each group. One number per group.</li>\n<li><code>.count()</code> - how many <b>non-missing</b> values there are in each column, in each group. Column by column.</li>\n</ul>\n<p>When there are no missing values, both give the same numbers, so the difference only shows up in real data - exactly when it already costs money. To count rows, use <code>size</code>.</p>\n<h4>Two deviations from real pandas worth knowing</h4>\n<ul>\n<li>Here the grouping column stays a <b>regular column</b> in the result. In real pandas it becomes the <b>index</b>, and you return it to a column with <code>.reset_index()</code>.</li>\n<li>Here the groups are returned in the order they <b>appear</b> in the data. In real pandas they are sorted by key by default (<code>sort=True</code>).</li>\n</ul>",

  "theory": "<h3>Business questions with GroupBy</h3>\n<p>After grouping, the real work begins: choosing the <b>right</b> aggregation, and sorting the result so the answer jumps out.</p>\n<pre>result = df.groupby(\"department\").mean()\ntop = result.sort_values(\"salary\", ascending=False)</pre>\n<h4>Sum or rate? The most important question on this topic</h4>\n<p>Say you want to know which plan \"churns\" the most. There are two ways to calculate it, and they give <b>opposite</b> answers:</p>\n<pre>df.groupby(\"plan\").sum()    # churn: basic=3, premium=4  -> \"premium is worse\"\ndf.groupby(\"plan\").mean()   # churn: basic=0.75, premium=0.57 -> \"basic is worse\"</pre>\n<p>Who's right? <b>The average.</b> The <code>churn</code> column is 0/1, so its sum counts <b>how many</b> customers churned, and the average measures <b>what fraction</b> of the group churned. Premium has 7 customers and basic only 4, so it's obvious there will be more churners there in absolute number - that measures group size, not the problem.</p>\n<p>The rule: <b>a sum is affected by group size, a rate isn't.</b> When comparing groups of different sizes, you almost always want a rate. And when a column is 0/1, <code>mean()</code> on it is exactly the percentage of 1s.</p>\n<h4>Grouping by something that isn't a column</h4>\n<p>You can create a flag column and group by it - this turns a continuous variable into two groups to compare:</p>\n<pre>df[\"passed\"] = df[\"math\"].gt(80)\ndf.groupby(\"passed\").size()</pre>\n<h4>Always show the group size</h4>\n<p>The average of a two-person group isn't evidence of anything. Show <code>size()</code> next to every group average — that's the habit that separates a trustworthy report from a misleading one.</p>",

  "theory": "<h3>pivot_table - slicing by two dimensions</h3>\n<p><code>groupby</code> splits by one dimension. <code>pivot_table</code> splits by <b>two</b> and arranges the result as a cross table - rows, columns, and a summarized value in every cell:</p>\n<pre>df.pivot_table(index=\"plan\",           # what will be in the rows\n               columns=\"churn\",        # what will be in the columns\n               values=\"monthly_bill\",  # which number to aggregate\n               aggfunc=\"mean\")         # how to aggregate</pre>\n<p>The four parameters are all you need to remember. <code>aggfunc</code> can be <code>\"mean\"</code>, <code>\"sum\"</code>, <code>\"count\"</code>, <code>\"min\"</code>, <code>\"max\"</code> — and it completely changes the meaning of the table, even when the rows and columns are identical.</p>\n<h4>Empty cells - the most interesting part</h4>\n<p>If a particular combination has no rows in the data, the cell will be <code>None</code> (in real pandas: <code>NaN</code>). This isn’t a bug, it’s a <b>finding</b>: it says this combination doesn’t exist in reality. In the plan-vs-churn table, the empty cell for standard reveals that no standard customer churned.</p>\n<h4>Cut it differently: filter, then group</h4>\n<p>Not every two-dimensional question requires a pivot. When only part of the data matters, filter first:</p>\n<pre>active = df[df[\"churn\"].eq(0)]\nactive.groupby(\"plan\").mean()</pre>\n<p>Filtering is done with a boolean mask: <code>df[\"churn\"].eq(0)</code> returns a column of True/False, and <code>df[mask]</code> returns only the rows where it's True. The methods <code>.eq() .gt() .lt() .ge() .le()</code> also exist in real pandas; there it's common to write <code>df[df[\"churn\"] == 0]</code>, which isn't supported in the course's engine.</p>\n<h4>Creating a dimension that doesn't exist</h4>\n<p>If there's no second categorical column - build one:</p>\n<pre>df[\"big\"] = df[\"sqm\"].gt(90)\ndf.pivot_table(index=\"rooms\", columns=\"big\", values=\"price_m\", aggfunc=\"mean\")</pre>\n<p>Note: the more dimensions you add, the fewer rows each cell is based on. A nice-looking cross-tab where every cell is based on a single observation is proof of nothing - run <code>aggfunc=\"count\"</code> on the same table to see how many rows stand behind each number.</p>",

  "check_fn": "(o,c) => {const k=c.replace(/#[^\\n]*/g,'');const rows=(o.match(/__DATAROW__/g)||[]).length;return /pivot_table\\s*\\(/.test(k) && /ge\\s*\\(\\s*4\\s*\\)/.test(k) && /aggfunc\\s*=\\s*[\"\\']count[\"\\']/.test(k) && /aggfunc\\s*=\\s*[\"\\']mean[\"\\']/.test(k) && /Sales\\|3\\|2/.test(o) && /R&D\\|None\\|4/.test(o) && /Marketing\\|3\\|None/.test(o) && /Sales\\|16666\\.67\\|17500/.test(o) && /R&D\\|None\\|24500/.test(o) && rows === 6;}",
  "theory": "<h3>pivot_table - slicing by two dimensions</h3>\n<p><code>groupby</code> splits by one dimension. <code>pivot_table</code> splits by <b>two</b> and arranges the result as a cross table - rows, columns, and a summarized value in every cell:</p>\n<pre>df.pivot_table(index=\"plan\",           # what will be in the rows\n               columns=\"churn\",        # what will be in the columns\n               values=\"monthly_bill\",  # which number to aggregate\n               aggfunc=\"mean\")         # how to aggregate</pre>\n<p>The four parameters are all you need to remember. <code>aggfunc</code> can be <code>\"mean\"</code>, <code>\"sum\"</code>, <code>\"count\"</code>, <code>\"min\"</code>, <code>\"max\"</code> — and it completely changes the meaning of the table, even when the rows and columns are identical.</p>\n<h4>Empty cells - the most interesting part</h4>\n<p>If a particular combination has no rows in the data, the cell will be <code>None</code> (in real pandas: <code>NaN</code>). This isn’t a bug, it’s a <b>finding</b>: it says this combination doesn’t exist in reality. In the plan-vs-churn table, the empty cell for standard reveals that no standard customer churned.</p>\n<h4>Cut it differently: filter, then group</h4>\n<p>Not every two-dimensional question requires a pivot. When only part of the data matters, filter first:</p>\n<pre>active = df[df[\"churn\"].eq(0)]\nactive.groupby(\"plan\").mean()</pre>\n<p>Filtering is done with a boolean mask: <code>df[\"churn\"].eq(0)</code> returns a column of True/False, and <code>df[mask]</code> returns only the rows where it's True. The methods <code>.eq() .gt() .lt() .ge() .le()</code> also exist in real pandas; there it's common to write <code>df[df[\"churn\"] == 0]</code>, which isn't supported in the course's engine.</p>\n<h4>Creating a dimension that doesn't exist</h4>\n<p>If there's no second categorical column - build one:</p>\n<pre>df[\"big\"] = df[\"sqm\"].gt(90)\ndf.pivot_table(index=\"rooms\", columns=\"big\", values=\"price_m\", aggfunc=\"mean\")</pre>\n<p>Note: the more dimensions you add, the fewer rows each cell is based on. A nice-looking cross-tab where every cell is based on a single observation is proof of nothing - run <code>aggfunc=\"count\"</code> on the same table to see how many rows stand behind each number.</p>",
  "explanation": [

  "base_points": 30,

  "explain": "<p>Same rows, same columns, same values column - only <code>aggfunc</code> differs. The two tables answer two completely different questions, and that's the idea worth taking from this exercise.</p><p>The <code>count</code> table says <b>how many people</b> stand behind each cell, and the <code>mean</code> table says <b>how much they earn</b>. Always read them together: the average of 17,500 in the Sales/senior cell looks solid, but it's based on only two employees.</p><p>Notice the empty cells - and here they teach something structural: <b>all of R&amp;D is senior and all of marketing is junior.</b> There isn't a single marketing person with 4 years of tenure. The implication: the salary gap between R&amp;D and marketing that we saw in the previous topic isn't necessarily a gap between fields - it's largely a tenure gap. The two variables are completely confounded with each other, and there's no way to separate them in this data.</p><p>This is exactly what a cross-tab contributes: it doesn't just display numbers, it exposes that the original question was framed carelessly. Run <code>count</code> before you quote <code>mean</code> - always.</p>"

  "theory": "<h3>Conversions and truncation</h3><p><b>astype - type conversion</b>. Two forms, both standard in pandas:</p><pre>df[\"price\"] = df[\"price\"].astype(int)     # one column\ndf = df.astype({\"price\": float, \"count\": int})   # several columns in a dictionary</pre><p>Note: the argument of <code>astype</code> is <b>the type</b>. The column name is chosen beforehand with <code>df[\"price\"]</code>, or appears as a key in the dictionary.</p><p><b>clip - clamping values to a range</b>:</p><pre>df[\"score\"] = df[\"score\"].clip(0, 100)    # one column\ndf[\"bill\"]  = df[\"bill\"].clip(upper=120)  # one bound only\ndf = df.clip(0, 100)                      # the entire table</pre><p><code>lower</code> and <code>upper</code> are both optional - you can give just one of them.</p><h4>Three pitfalls worth knowing in astype</h4><ul><li><code>astype(int)</code> <b>truncates, it doesn't round</b>: 1.9 becomes 1, not 2. To round, use <code>round</code> before converting.</li><li><code>astype(int)</code> on a string that isn't a whole number, like \"1.5\" or an empty string, throws <code>ValueError</code> and stops the entire script. In real pandas the solution is <code>pd.to_numeric(df[\"x\"], errors=\"coerce\")</code>, which converts what it can and turns the rest into NaN.</li><li>The simulator only recognizes <code>int</code>, <code>float</code>, <code>str</code>. If you write <code>\"int64\"</code> you won't get an error - simply no conversion will happen. Always check the output.</li></ul><h4>clip doesn't clean outliers - it hides them</h4><p>A value of 150 that gets clipped to 100 is still in the table, now as the value 100. No row was deleted, and the information about the difference between 105 and 150 is lost permanently. The result is an artificial pile-up of values exactly on the boundary.</p><p>Use <code>clip</code> only when there's a <b>known valid range</b> - a score of 0-100, a percentage of 0-1, an age that isn't negative. When the outliers are real and interesting - it's better to investigate them, not squash them.</p>",

  "starter": "",
  "solution": "students = DataFrame({\"id\": [1, 2, 3], \"name\": [\"A\", \"B\", \"C\"]})\ngrades = DataFrame({\"id\": [1, 2], \"score\": [100, 200]})\nresult = students.merge(grades, on=\"id\")\nprint(students.shape, grades.shape, result.shape)\nprint(result)",
  "check_fn": "(o,c) => { const s=String(c).replace(/#.*$/gm,\"\"); return /\\(3,\\s*2\\)\\s+\\(2,\\s*2\\)\\s+\\(2,\\s*3\\)/.test(o) && /__DATAROW__\\|1\\|A\\|100/.test(o) && /__DATAROW__\\|2\\|B\\|200/.test(o) && !/\\|3\\|C/.test(o) && /\\.merge\\s*\\(/.test(s); }",
  "theory": "<h3>Joining tables</h3><p>This is SQL's <code>JOIN</code>:</p><pre>customers.merge(orders, on=\"customer_id\")   # INNER JOIN - the default</pre><p>Only rows that have <b>a match in both tables</b> are kept. A row in the left table with no matching partner on the right disappears, and vice versa. The row order in the result is determined by the left table, and the result is a new table. The key column appears <b>once</b> in the result, so 2+2 columns give 3, not 4.</p><h4>The rule you must remember: merge can increase the number of rows</h4><p>If a given key has one row on the left and three rows on the right, you'll get <b>three</b> rows - one per match. And if there are two on the left and two on the right, you'll get four. The general rule: the number of rows in the result is the sum, over each key, of the number of occurrences on the left times the number of occurrences on the right.</p><p>This is the number one cause of incorrect reports - a total that's suddenly double. So the professional habit is to always check: <code>print(len(left), len(right), len(result))</code>.</p><h4>Columns with the same name</h4><p>If both tables have a column with the same name besides the join key, merge can't keep both under one name - so it adds suffixes: <code>name_x</code> from the left table and <code>name_y</code> from the right. You can choose your own suffixes:</p><pre>catalog.merge(stock, on=\"pid\", suffixes=(\"_catalog\", \"_stock\"))</pre><h4>Joining on several columns</h4><p>When the real key is made up of several fields, you pass a list: <code>on=[\"year\", \"city\"]</code>. A row will join only if <b>all</b> the columns in the list match.</p><p>All the syntax in this topic - <code>on</code>, <code>how</code>, <code>suffixes</code> - is identical in real pandas.</p>",

  "explain": "<p><code>merge</code> joins two tables on a shared key column, exactly like a JOIN in SQL.</p><p>Read the three shapes: 3 rows and 2 rows went in, and 2 came out. The row with id=3 (student C) disappeared because it had no match in the scores table. This is the essence of INNER JOIN - it keeps only the intersection, and it's an <b>operation that loses data</b>.</p><p>Also note the number of columns: 2 + 2 = 4, but the result has 3. The reason is that <code>id</code> is the join column and it appears only once.</p><p>The habit that will save you on the job, and it's exactly what the exercise prints: after every merge, compare the row counts. If the number is smaller - you lost rows that found no match. If the number is larger - there are duplicate keys, and that's usually a bug.</p><p>If you need to keep <b>all</b> the rows of the left table, that's a LEFT JOIN, and it's the next topic. The syntax here is identical in real pandas.</p>"

  "theory": "<h3>Joining tables</h3><p>This is SQL's <code>JOIN</code>:</p><pre>customers.merge(orders, on=\"customer_id\")   # INNER JOIN - the default</pre><p>Only rows that have <b>a match in both tables</b> are kept. A row in the left table with no matching partner on the right disappears, and vice versa. The row order in the result is determined by the left table, and the result is a new table. The key column appears <b>once</b> in the result, so 2+2 columns give 3, not 4.</p><h4>The rule you must remember: merge can increase the number of rows</h4><p>If a given key has one row on the left and three rows on the right, you'll get <b>three</b> rows - one per match. And if there are two on the left and two on the right, you'll get four. The general rule: the number of rows in the result is the sum, over each key, of the number of occurrences on the left times the number of occurrences on the right.</p><p>This is the number one cause of incorrect reports - a total that's suddenly double. So the professional habit is to always check: <code>print(len(left), len(right), len(result))</code>.</p><h4>Columns with the same name</h4><p>If both tables have a column with the same name besides the join key, merge can't keep both under one name - so it adds suffixes: <code>name_x</code> from the left table and <code>name_y</code> from the right. You can choose your own suffixes:</p><pre>catalog.merge(stock, on=\"pid\", suffixes=(\"_catalog\", \"_stock\"))</pre><h4>Joining on several columns</h4><p>When the real key is made up of several fields, you pass a list: <code>on=[\"year\", \"city\"]</code>. A row will join only if <b>all</b> the columns in the list match.</p><p>All the syntax in this topic - <code>on</code>, <code>how</code>, <code>suffixes</code> - is identical in real pandas.</p>",

  "explain": "<p>Now we print the table itself, not just its size, and this way we see exactly what happened.</p><p>Count the losses: on the left there were three users and two remained in the result - uid=1 (X) disappeared because they never logged in. On the right there were three logins and two remained in the result - uid=4 disappeared because it has no user in the table. <b>INNER JOIN loses from both directions.</b></p><p>And this is exactly where such a mistake gets expensive: if <code>logins</code> is an activity table and you wanted to analyze inactive users - the inner join deleted exactly those, and you'll end up reporting that all users are active.</p><p>The question to ask before every merge is \"which table is my source of truth?\". If the answer is \"the users table\" - you need <code>how=\"left\"</code>, not inner.</p><p>And the loss from the right side (uid=4) is interesting in its own right: a login from a user that doesn't exist in the users list is a sign of a data integrity issue, and it's worth investigating rather than just silently dropping it.</p>"

  "solution": "a = DataFrame({\"id\": [1, 2, 3], \"n\": [\"A\", \"B\", \"C\"]})\nb = DataFrame({\"id\": [1, 2], \"v\": [10, 20]})\ninner = a.merge(b, on=\"id\")\nleft = a.merge(b, on=\"id\", how=\"left\")\nprint(\"inner:\", inner.shape)\nprint(\"left:\", left.shape)\nprint(left)",

  "theory": "<h3>LEFT JOIN - keeps the left table</h3><pre>customers.merge(orders, on=\"id\", how=\"left\")</pre><p><b>Every row</b> in the left table is kept, even if it has no match on the right. In rows with no match, the columns that came from the right table get a missing value.</p><p>So the number of rows in the result equals the number of rows in the left table - unless the key has duplicates in the right table, in which case it will grow.</p><h4>The four values of how</h4><ul><li><code>\"inner\"</code> - only rows that have a match on both sides (the default)</li><li><code>\"left\"</code> - all rows from the left table</li><li><code>\"right\"</code> - all rows from the right table</li><li><code>\"outer\"</code> - all rows from both sides, including those without a partner</li></ul><p>Any other value will throw a <code>ValueError</code> - both here and in real pandas. That's good: a loud error is preferable to a silently wrong result.</p><p><code>a.merge(b, how=\"right\")</code> is equivalent to <code>b.merge(a, how=\"left\")</code>, aside from the column order. In practice, most analysts write only left and outer, arranging the tables accordingly.</p><h4>When to choose left and when inner</h4><p>The question is which table is <b>your truth</b>. If the customer list is the complete inventory and you also want to know who <b>didn't</b> order - that's <code>how=\"left\"</code>. If you only care about actual orders - inner.</p><h4>What to do with the missing values created</h4><p>A left join is the number one source of missing values in real work, and this connects us directly to data cleaning:</p><pre>missing = result[\"v\"].isna().sum()   # how many rows found no match\nresult = result.fillna(0)            # if \"not found\" means 0</pre><p>This decision is a business decision, not a technical one: an \"order total\" with no match is 0, but a \"satisfaction score\" with no match isn't 0 - there you must not invent a value.</p><h4>None here, NaN at work</h4><p>In the simulator, rows with no match get <code>None</code>. In real pandas they get <code>NaN</code>, and this has a result that surprises many people: an integer column that gets missing values added to it automatically becomes <code>float64</code>, so instead of <code>[10, 20, None]</code> you'll see <code>[10.0, 20.0, NaN]</code>.</p>",

  "explain": "<p><code>how=\"left\"</code> changes the rules of the game: every row in the left table survives, even if no match was found for it.</p><p>Compare the two numbers on the exact same data: inner returned 2 rows and left returned 3. The row id=3 (student C), which has no match, disappeared in inner and stayed in left - with <code>None</code> in column v.</p><p>From this comes the check you do after every left join: the number of rows in the result should be <b>equal</b> to the number of rows in the left table. If it's smaller - you wrote inner by mistake. If it's larger - there are duplicate keys in the right table, and that's almost always a bug.</p><p>How do you choose between the two? Ask yourself which table is your source of truth. If the customer list is the full inventory and you also want to know who didn't order - left. If you only care about actual orders - inner. The syntax is identical in real pandas.</p>"
