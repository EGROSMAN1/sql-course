          for c in self._columns:\n                if c not in cols_to_drop:\n                    new_data[c] = self._data[c]\n                    new_cols.append(c)\n            result = DataFrame(new_data)\n            result._columns = new_cols\n            return result\n        if index is not None:\n            indices = index if isinstance(index, list) else [index]\n            new_data = {}\n            for c in self._columns:\n                new_data[c] = []\n                for i in range(self._nrows):\n                    if i not in indices:\n                        new_data[c].append(self._data[c][i])\n            return DataFrame(new_data)\n        return DataFrame(self._data)\n    \n    def drop_duplicates(self):\n        \"\"\"Remove duplicate rows.\"\"\"\n        seen = []\n        keep_indices = []\n        for i in range(self._nrows):\n            row_tuple = tuple(self._data[c][i] for c in self._columns)\n            if row_tuple not in seen:\n                seen.append(row_tuple)\n                keep_indices.append(i)\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [self._data[c][i] for i in keep_indices]\n        return DataFrame(new_data)\n    \n    def isna(self):\n        \"\"\"Return df of booleans where values are None.\"\"\"\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [v is None for v in self._data[c]]\n        return DataFrame(new_data)\n    \n    def fillna(self, value):\n        \"\"\"Replace None values.\"\"\"\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [value if v is None else v for v in self._data[c]]\n        return DataFrame(new_data)\n    \n    def dropna(self):\n        \"\"\"Drop rows with any None.\"\"\"\n        keep = []\n        for i in range(self._nrows):\n            has_none = False\n            for c in self._columns:\n                if self._data[c][i] is None:\n                    has_none = True; break\n            if not has_none:\n                keep.append(i)\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [self._data[c][i] for i in keep]\n        return DataFrame(new_data)\n    \n    def rename(self, columns):\n        \"\"\"Rename columns: df.rename({'old':'new'})\"\"\"\n        new_data = {}\n        new_cols = []\n        for c in self._columns:\n            new_name = columns.get(c, c)\n            new_data[new_name] = self._data[c]\n            new_cols.append(new_name)\n        result = DataFrame(new_data)\n        result._columns = new_cols\n        return result\n    \n    def astype(self, col, dtype):\n        \"\"\"Convert column to type. dtype: int, float, str.\"\"\"\n        new_data = dict(self._data)\n        new_vals = []\n        for v in self._data[col]:\n            if v is None:\n                new_vals.append(None)\n            elif dtype == int or dtype == \"int\":\n                new_vals.append(int(v))\n            elif dtype == float or dtype == \"float\":\n                new_vals.append(float(v))\n            elif dtype == str or dtype == \"str\":\n                new_vals.append(str(v))\n            else:\n                new_vals.append(v)\n        new_data[col] = new_vals\n        return DataFrame(new_data)\n    \n    def clip(self, col, lower=None, upper=None):\n        \"\"\"Clip values in column to range.\"\"\"\n        new_data = dict(self._data)\n        new_vals = []\n        for v in self._data[col]:\n            if v is None:\n                new_vals.append(None); continue\n            if lower is not None and v < lower: v = lower\n            if upper is not None and v > upper: v = upper\n            new_vals.append(v)\n        new_data[col] = new_vals\n        return DataFrame(new_data)\n    \n    def nunique(self):\n        \"\"\"Count unique values per column.\"\"\"\n        result = {}\n        for c in self._columns:\n            seen = []\n            for v in self._data[c]:\n                if v not in seen:\n                    seen.append(v)\n            result[c] = len(seen)\n        return result\n    \n    # ===== Grouping / aggregation =====\n    \n    def groupby(self, by):\n        \"\"\"Group by column.\"\"\"\n        return GroupBy(self, by)\n    \n    # ===== Merging =====\n    \n    def merge(self, other, on, how=\"inner\"):\n        \"\"\"Merge two DataFrames on a key column. how: 'inner' or 'left'.\"\"\"\n        # Build index for other df\n        other_index = {}\n        for i in range(other._nrows):\n            k = other._data[on][i]\n            if k not in other_index:\n                other_index[k] = []\n            other_index[k].append(i)\n        \n        # New columns: my cols + other cols (without duplicate 'on')\n        my_cols = list(self._columns)\n        other_cols = [c for c in other._columns if c != on]\n        new_data = {}\n        for c in my_cols:\n            new_data[c] = []\n        for c in other_cols:\n            new_data[c] = []\n        \n        for i in range(self._nrows):\n            key = self._data[on][i]\n            if key in other_index:\n                for j in other_index[key]:\n                    for c in my_cols:\n                        new_data[c].append(self._data[c][i])\n                    for c in other_cols:\n                        new_data[c].append(other._data[c][j])\n            elif how == \"left\":\n                for c in my_cols:\n                    new_data[c].append(self._data[c][i])\n                for c in other_cols:\n                    new_data[c].append(None)\n        return DataFrame(new_data)\n    \n    # ===== Concat =====\n    \n    @staticmethod\n    def concat(dfs):\n        \"\"\"Concatenate list of DataFrames vertically.\"\"\"\n        if not dfs: return DataFrame({})\n        new_data = {}\n        cols = dfs[0]._columns\n        for c in cols:\n            new_data[c] = []\n        for df in dfs:\n            for c in cols:\n                if c in df._data:\n                    new_data[c].extend(df._data[c])\n                else:\n                    new_data[c].extend([None] * df._nrows)\n        return DataFrame(new_data)\n    \n    # ===== Set/reset index =====\n    \n    def set_index(self, col):\n        \"\"\"Make a column the row index (for display only - we don't really track indices).\"\"\"\n        # Just move that column to first position\n        if col not in self._columns:\n            raise ValueError(\"Column not found: \" + col)\n        new_cols = [col] + [c for c in self._columns if c != col]\n        new_data = {}\n        for c in new_cols:\n            new_data[c] = self._data[c]\n        result = DataFrame(new_data)\n        result._columns = new_cols\n        return result\n    \n    def reset_index(self):\n        \"\"\"Add an index column.\"\"\"\n        new_data = {\"index\": list(range(self._nrows))}\n        for c in self._columns:\n            new_data[c] = self._data[c]\n        return DataFrame(new_data)\n    \n    # ===== Info =====\n    \n    def info(self):\n        \"\"\"Print summary.\"\"\"\n        print(\"DataFrame: \" + str(self._nrows) + \" rows x \" + str(len(self._columns)) + \" columns\")\n        print(\"Columns:\")\n        for c in self._columns:\n            non_null = 0\n            for v in self._data[c]:\n                if v is not None: non_null += 1\n            sample = self._data[c][0] if self._nrows > 0 else None\n            type_name = type(sample).__name__ if sample is not None else \"unknown\"\n            print(\"  \" + c + \" (\" + type_name + \"): \" + str(non_null) + \" non-null\")\n    \n    def __str__(self):\n        return self._render_text()\n    \n    def __repr__(self):\n        return self._render_text()\n    \n    def _render_text(self):\n        if not self._columns:\n            return \"Empty DataFrame\"\n        lines = []\n        header = \"__DATAFRAME__|\" + \"|\".join([str(c) for c in self._columns])\n        lines.append(header)\n        for i in range(self._nrows):\n            row_vals = []\n            for c in self._columns:\n                row_vals.append(str(self._data[c][i]))\n            lines.append(\"__DATAROW__|\" + \"|\".join(row_vals))\n        lines.append(\"__DATAFRAME_END__\")\n        return \"\\n\".join(lines)\n\n\nclass GroupBy:\n    \"\"\"Result of df.groupby(col). Supports .mean(), .sum(), .count(), .agg().\"\"\"\n    def __init__(self, df, by):\n        self._df = df\n        self._by = by\n        # Build groups\n        self._groups = {}\n        col_data = df._data[by]\n        for i in range(df._nrows):\n            key = col_data[i]\n            if key not in self._groups:\n                self._groups[key] = []\n            self._groups[key].append(i)\n    \n    def _agg(self, fn):\n        \"\"\"Apply agg function per group, return DataFrame.\"\"\"\n        other_cols = [c for c in self._df._columns if c != self._by]\n        new_data = {self._by: []}\n        for c in other_cols:\n            new_data[c] = []\n        for key, indices in self._groups.items():\n            new_data[self._by].append(key)\n            for c in other_cols:\n                vals = []\n                for i in indices:\n                    v = self._df._data[c][i]\n                    if isinstance(v, (int, float)) and not isinstance(v, bool):\n                        vals.append(v)\n                if vals:\n                    new_data[c].append(fn(vals))\n                else:\n                    new_data[c].append(None)\n        return DataFrame(new_data)\n    \n    def mean(self):\n        return self._agg(lambda v: round(sum(v)/len(v), 2))\n    \n    def sum(self):\n        return self._agg(sum)\n    \n    def max(self):\n        return self._agg(max)\n    \n    def min(self):\n        return self._agg(min)\n    \n    def count(self):\n        \"\"\"Count rows per group.\"\"\"\n        new_data = {self._by: [], \"count\": []}\n        for key, indices in self._groups.items():\n            new_data[self._by].append(key)\n            new_data[\"count\"].append(len(indices))\n        return DataFrame(new_data)\n    \n    def size(self):\n        \"\"\"Same as count - rows per group.\"\"\"\n        return self.count()\n\n\nclass Series:\n    \"\"\"A column from a DataFrame.\"\"\"\n    def __init__(self, data, name=None):\n        self._data = list(data)\n        self.name = name\n    \n    def __len__(self):\n        return len(self._data)\n    \n    def __getitem__(self, i):\n        return self._data[i]\n    \n    def __iter__(self):\n        return iter(self._data)\n    \n    def gt(self, other): return [v > other for v in self._data if v is not None] if False else [v > other if v is not None else False for v in self._data]\n    def lt(self, other): return [v < other if v is not None else False for v in self._data]\n    def ge(self, other): return [v >= other if v is not None else False for v in self._data]\n    def le(self, other): return [v <= other if v is not None else False for v in self._data]\n    def eq(self, other): return [v == other for v in self._data]\n    \n    def mean(self):\n        nums = [v for v in self._data if isinstance(v, (int, float)) and not isinstance(v, bool)]\n        if nums: return sum(nums) / len(nums)\n        return 0\n    \n    def sum(self):\n        nums = [v for v in self._data if isinstance(v, (int, float)) and not isinstance(v, bool)]\n        return sum(nums)\n    \n    def max(self):\n        vals = [v for v in self._data if v is not None]\n        return max(vals) if vals else None\n    \n    def min(self):\n        vals = [v for v in self._data if v is not None]\n        return min(vals) if vals else None\n    \n    def unique(self):\n        seen = []\n        for v in self._data:\n            if v not in seen:\n                seen.append(v)\n        return seen\n    \n    def nunique(self):\n        return len(self.unique())\n    \n    def count(self):\n        cnt = 0\n        for v in self._data:\n            if v is not None: cnt += 1\n        return cnt\n    \n    def value_counts(self):\n        counts = {}\n        for v in self._data:\n            if v in counts: counts[v] += 1\n            else: counts[v] = 1\n        # Sort by count descending\n        items = list(counts.items())\n        items.sort(key=lambda x: -x[1])\n        result = {}\n        for k, v in items:\n            result[k] = v\n        return result\n    \n    def isna(self):\n        return [v is None for v in self._data]\n    \n    def fillna(self, value):\n        return Series([value if v is None else v for v in self._data], name=self.name)\n    \n    def apply(self, fn):\n        return Series([fn(v) for v in self._data], name=self.name)\n    \n    def map(self, mapping):\n        \"\"\"Map values via dict or function.\"\"\"\n        if isinstance(mapping, dict):\n            return Series([mapping.get(v, v) for v in self._data], name=self.name)\n        return Series([mapping(v) for v in self._data], name=self.name)\n    \n    def round(self, n=0):\n        return Series([round(v, n) if isinstance(v, (int, float)) else v for v in self._data], name=self.name)\n    \n    def cumsum(self):\n        result = []\n        total = 0\n        for v in self._data:\n            if isinstance(v, (int, float)):\n                total += v\n            result.append(total)\n        return Series(result, name=self.name)\n    \n    def pct_change(self):\n        result = [None]\n        for i in range(1, len(self._data)):\n            prev = self._data[i-1]\n            curr = self._data[i]\n            if prev and isinstance(prev, (int, float)) and isinstance(curr, (int, float)):\n                result.append((curr - prev) / prev)\n            else:\n                result.append(None)\n        return Series(result, name=self.name)\n    \n    def __str__(self):\n        return str(self._data)\n    \n    def __repr__(self):\n        return \"Series(\" + str(self._data) + \")\"\n\n\n# =============================================================\n# DATASETS - Israeli context for learning\n# =============================================================\n\n_DATASETS = {\n    \"cities-weather\": {\n        \"name\": \"Weather in Israeli cities\",\n        \"desc\": \"temperatures and humidity\",\n        \"data\": {\n            \"city\": [\"Tel Aviv\", \"Jerusalem\", \"Haifa\", \"Beer Sheva\", \"Eilat\", \"Safed\"],\n            \"temp\": [24, 19, 23, 27, 31, 17],\n            \"humidity\": [68, 50, 72, 40, 55, 45],\n            \"rain_mm\": [0, 2, 0, 0, 0, 5]\n        }\n    },\n    \"real-estate\": {\n        \"name\": \"Apartment prices in Tel Aviv\",\n        \"desc\": \"8 apartments\",\n        \"data\": {\n            \"neighborhood\": [\"Florentin\", \"Rothschild\", \"Neve Tzedek\", \"Jaffa\", \"Ramat Aviv\", \"Bavli\", \"Kiryat Shalom\", \"Old North\"],\n            \"rooms\": [3, 4, 4, 3, 5, 4, 3, 4],\n            \"sqm\": [75, 95, 110, 70, 130, 100, 65, 90],\n            \"price_m\": [3.2, 5.1, 6.8, 2.9, 4.5, 4.1, 1.9, 4.7]\n        }\n    },\n    \"football\": {\n        \"name\": \"Premier League - 5 teams\",\n        \"desc\": \"Statistics\",\n        \"data\": {\n            \"team\": [\"Maccabi Tel Aviv\", \"Hapoel Beer Sheva\", \"Maccabi Haifa\", \"Hapoel Tel Aviv\", \"Beitar\"],\n            \"points\": [55, 52, 48, 42, 38],\n            \"wins\": [17, 16, 14, 12, 10],\n            \"draws\": [4, 4, 6, 6, 8],\n            \"losses\": [3, 4, 4, 6, 6],\n            \"goals_for\": [54, 49, 41, 38, 32],\n            \"goals_against\": [21, 22, 25, 30, 33]\n        }\n    },\n    \"students\": {\n        \"name\": \"student grades\",\n        \"desc\": \"Grades in 3 subjects\",\n        \"data\": {\n            \"name\": [\"Gal\", \"Tomer\", \"Yael\", \"Noa\", \"Aviv\", \"Maya\", \"Daniel\", \"Shira\", \"Itay\", \"Roni\"],\n            \"math\": [88, 76, 92, 84, 70, 95, 81, 89, 73, 86],\n            \"english\": [78, 85, 88, 90, 72, 84, 79, 91, 68, 82],\n            \"history\": [85, 80, 90, 86, 76, 88, 84, 92, 70, 87]\n        }\n    },\n    \"sales\": {\n        \"name\": \"monthly sales\",\n        \"desc\": \"Store turnover\",\n        \"data\": {\n            \"month\": [\"January\", \"February\", \"March\", \"April\", \"May\", \"June\", \"July\", \"August\", \"September\", \"October\", \"November\", \"December\"],\n            \"revenue\": [45000, 38000, 52000, 49000, 61000, 72000, 68000, 71000, 58000, 53000, 64000, 89000],\n            \"units\": [120, 95, 140, 130, 165, 195, 180, 192, 155, 140, 170, 240]\n        }\n    },\n    \"covid-israel\": {\n        \"name\": \"Israel COVID data\",\n        \"desc\": \"Cases per month\",\n        \"data\": {\n            \"date\": [\"01/01\", \"08/01\", \"15/01\", \"22/01\", \"29/01\", \"05/02\", \"12/02\", \"19/02\"],\n            \"positive\": [3200, 4500, 6100, 8200, 7800, 5300, 3900, 2400],\n            \"tested\": [45000, 52000, 60000, 67000, 65000, 50000, 41000, 35000],\n            \"hospitalized\": [180, 230, 320, 410, 380, 290, 220, 160]\n        }\n    },\n    \"eurovision\": {\n        \"name\": \"Eurovision - Israel\",\n        \"desc\": \"results\",\n        \"data\": {\n            \"year\": [2018, 2019, 2021, 2022, 2023, 2024],\n            \"place\": [1, 23, 17, 13, 3, 5],\n            \"points\": [529, 35, 93, 61, 362, 375],\n            \"song\": [\"Toy\", \"Home\", \"Set Me Free\", \"I.M\", \"Unicorn\", \"Hurricane\"]\n        }\n    },\n    \"telecom-churn\": {\n        \"name\": \"Telecom customer churn\",\n        \"desc\": \"15 customers with churn data\",\n        \"data\": {\n            \"customer_id\": [101,102,103,104,105,106,107,108,109,110,111,112,113,114,115],\n            \"age\": [25, 45, 32, 58, 29, 41, 36, 52, 27, 48, 33, 60, 30, 44, 38],\n            \"monthly_bill\": [45.5, 120.0, 80.3, 150.0, 35.0, 95.0, 70.5, 130.0, 50.0, 110.0, 65.0, 140.0, 55.0, 100.0, 75.0],\n            \"tenure_months\": [12, 60, 24, 84, 6, 36, 18, 72, 8, 48, 30, 96, 14, 42, 22],\n            \"churn\": [0, 1, 0, 1, 1, 0, 0, 1, 1, 1, 0, 0, 1, 0, 0],\n            \"plan\": [\"basic\",\"premium\",\"standard\",\"premium\",\"basic\",\"premium\",\"standard\",\"premium\",\"basic\",\"premium\",\"standard\",\"premium\",\"basic\",\"premium\",\"standard\"]\n        }\n    },\n    \"salaries\": {\n        \"name\": \"Salaries by department\",\n        \"desc\": \"12 employees\",\n        \"data\": {\n            \"name\": [\"Avi\",\"Beni\",\"Galit\",\"Dana\",\"Hila\",\"Victor\",\"Zohar\",\"Chani\",\"Tal\",\"Yossi\",\"Carmel\",\"Liat\"],\n            \"department\": [\"Sales\",\"R&D\",\"Sales\",\"Marketing\",\"R&D\",\"Sales\",\"Marketing\",\"R&D\",\"Sales\",\"R&D\",\"Marketing\",\"Sales\"],\n            \"salary\": [15000, 22000, 18000, 13000, 25000, 16000, 14000, 28000, 17000, 23000, 12000, 19000],\n            \"years\": [2, 5, 3, 1, 7, 4, 2, 8, 3, 6, 1, 4]\n        }\n    }\n}\n\n\nclass _Datasets:\n    \"\"\"Pre-loaded datasets. Usage: df = data.load('cities-weather')\"\"\"\n    \n    def list(self):\n        \"\"\"List all available datasets.\"\"\"\n        for key in _DATASETS:\n            info = _DATASETS[key]\n            print(\"  \" + key + \": \" + info[\"name\"] + \" - \" + info[\"desc\"])\n    \n    def load(self, name):\n        \"\"\"Load a dataset as a DataFrame.\"\"\"\n        if name not in _DATASETS:\n            keys = list(_DATASETS.keys())\n            raise ValueError(\"Dataset not found: \" + name)\n        return DataFrame(_DATASETS[name][\"data\"])\n    \n    def info(self, name):\n        \"\"\"Show info about a dataset.\"\"\"\n        if name not in _DATASETS:\n            print(\"Dataset not found: \" + name)\n            return\n        info = _DATASETS[name]\n        print(\"DATASET: \" + info[\"name\"])\n        print(\"  \" + info[\"desc\"])\n        df = DataFrame(info[\"data\"])\n        print(\"  shape: \" + str(df.shape[0]) + \" rows x \" + str(df.shape[1]) + \" cols\")\n\n\ndata = _Datasets()\n";

// =============== APP ===============
(function() {
  'use strict';
  
  const STORAGE_KEY = 'simulator_v2_scores';
  const allExercises = window.SIM_EXERCISES;
  let filteredExercises = allExercises.slice();
  let currentIdx = 0;
  let currentCourse = 'all';
  let currentDifficulty = null;
  let currentStatus = null;
  let searchQuery = '';

  // ===== Scoring storage =====
  function getScores() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
    catch(e) { return {}; }
  }
  function saveScore(exId, points, firstTry) {
    const scores = getScores();
    if (!scores[exId] || scores[exId].points < points) {
      scores[exId] = {
        points: points,
        firstTry: firstTry,
        completedAt: new Date().toISOString(),
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
    }
    return scores[exId];
  }
  function getExerciseScore(exId) {
    const scores = getScores();
    return scores[exId] || null;
  }
  function getTotalScore() {
    const scores = getScores();
    return Object.values(scores).reduce((sum, s) => sum + (s.points || 0), 0);
  }
  function getMaxScore() {
    return allExercises.reduce((sum, e) => sum + e.max_points, 0);
  }
  function getCountsByDifficulty() {
    const scores = getScores();
    const result = {
      easy: { done: 0, total: 0 },
      medium: { done: 0, total: 0 },
      hard: { done: 0, total: 0 },
    };
    allExercises.forEach(e => {
      result[e.difficulty].total++;
      if (scores[e.id]) result[e.difficulty].done++;
    });
    return result;
  }
  
  // ===== Track attempts per exercise (for first-try bonus) =====
  const attempts = {}; // exId -> count
  function recordAttempt(exId) {
    attempts[exId] = (attempts[exId] || 0) + 1;
    return attempts[exId];
  }
  function isFirstTry(exId) {
    return (attempts[exId] || 0) <= 1;
  }
  
  // ===== Track solution-viewed =====
  const solutionViewed = new Set();
  function viewedSolution(exId) {
    solutionViewed.add(exId);
  }
  function hasViewedSolution(exId) {
    return solutionViewed.has(exId);
  }

  // ===== Update header stats =====
  function updateHeader() {
    document.getElementById('total-score').textContent = getTotalScore();
    document.getElementById('max-score').textContent = getMaxScore();
    
    const counts = getCountsByDifficulty();
    document.getElementById('easy-done').textContent = counts.easy.done;
    document.getElementById('easy-total').textContent = counts.easy.total;
    document.getElementById('medium-done').textContent = counts.medium.done;
    document.getElementById('medium-total').textContent = counts.medium.total;
    document.getElementById('hard-done').textContent = counts.hard.done;
    document.getElementById('hard-total').textContent = counts.hard.total;
    
    const total = counts.easy.total + counts.medium.total + counts.hard.total;
    const done = counts.easy.done + counts.medium.done + counts.hard.done;
    const pct = total > 0 ? (done / total) * 100 : 0;
    document.getElementById('progress-fill').style.width = pct + '%';
  }

  function applyFilters() {
    filteredExercises = allExercises.filter(e => {
      if (currentCourse !== 'all' && e.course !== currentCourse) return false;
      if (currentDifficulty && e.difficulty !== currentDifficulty) return false;
      if (currentStatus) {
        const hasScore = !!getExerciseScore(e.id);
        if (currentStatus === 'done' && !hasScore) return false;
        if (currentStatus === 'todo' && hasScore) return false;
      }
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        const text = (e.q + ' ' + e.topic_title + ' ' + e.solution).toLowerCase();
        if (!text.includes(q)) return false;
      }
      return true;
    });
    currentIdx = 0;
    render();
  }

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  
  // === CODE EDITOR TOOLBAR (copy/paste/cut/select) ===
  function wireEditorToolbar() {
    const editor = document.getElementById('code-input');
    if (!editor) return;
    
    const copyBtn = document.getElementById('tb-copy');
    const pasteBtn = document.getElementById('tb-paste');
    const cutBtn = document.getElementById('tb-cut');
    const selectBtn = document.getElementById('tb-select');
    const clearBtn = document.getElementById('tb-clear');
    
    if (copyBtn) {
      copyBtn.addEventListener('click', () => {
        const text = editor.value;
        if (!text) return;
        const showCopied = () => {
          copyBtn.classList.add('copied');
          copyBtn.innerHTML = '✅ copied';
          setTimeout(() => {
            copyBtn.classList.remove('copied');
            copyBtn.innerHTML = '📋 copy';
          }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(showCopied).catch(() => {
            // Fallback
            editor.select();
            document.execCommand('copy');
            showCopied();
          });
        } else {
          editor.select();
          document.execCommand('copy');
          showCopied();
        }
      });
    }
    
    if (pasteBtn) {
      pasteBtn.addEventListener('click', async () => {
        try {
          if (navigator.clipboard && navigator.clipboard.readText) {
            const text = await navigator.clipboard.readText();
            // Insert at cursor position
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            editor.value = editor.value.slice(0, start) + text + editor.value.slice(end);
            // Move cursor to end of pasted text
            editor.selectionStart = editor.selectionEnd = start + text.length;
            editor.focus();
            pasteBtn.classList.add('copied');
            pasteBtn.innerHTML = '✅ pasted';
            setTimeout(() => {
              pasteBtn.classList.remove('copied');
              pasteBtn.innerHTML = '📥 paste';
            }, 1500);
          } else {
            // Fallback: focus and tell user
            editor.focus();
            alert('To paste: long-press the editor and choose "Paste"');
          }
        } catch(e) {
          editor.focus();
          alert('Cannot access the clipboard. Use Ctrl+V or long press');
        }
      });
    }
    
    if (cutBtn) {
      cutBtn.addEventListener('click', () => {
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        const selected = editor.value.slice(start, end) || editor.value;
        const showCut = () => {
          cutBtn.classList.add('copied');
          cutBtn.innerHTML = '✅ derived';
          setTimeout(() => {
            cutBtn.classList.remove('copied');
            cutBtn.innerHTML = '✂️ cut';
          }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(selected).then(() => {
            if (start === end) {
              // Cut everything
              editor.value = '';
            } else {
              editor.value = editor.value.slice(0, start) + editor.value.slice(end);
              editor.selectionStart = editor.selectionEnd = start;
            }
            showCut();
          });
        } else {
          editor.select();
          document.execCommand('cut');
          showCut();
        }
      });
    }
    
    if (selectBtn) {
      selectBtn.addEventListener('click', () => {
        editor.focus();
        editor.select();
      });
    }
    
    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        if (confirm('clear all the code?')) {
          editor.value = '';
          editor.focus();
        }
      });
    }
  }


  function render() {
    updateHeader();
    
    if (filteredExercises.length === 0) {
      document.getElementById('content').innerHTML = 
        '<div style="text-align:center;padding:30px;color:var(--text2);">No exercises matching the filter were found</div>';
      return;
    }
    
    if (currentIdx >= filteredExercises.length) currentIdx = filteredExercises.length - 1;
    if (currentIdx < 0) currentIdx = 0;
    
    const ex = filteredExercises[currentIdx];
    const score = getExerciseScore(ex.id);
    
    // Build explanation HTML
    let explanationHTML = '';
    if (ex.explanation && ex.explanation.length > 0) {
      explanationHTML = '<h4 class="explanation-title">📖 Line-by-line explanation:</h4><ul class="exp-line-list">';
      ex.explanation.forEach(item => {
        explanationHTML += `
          <li class="exp-line">
            <code class="exp-line-code">${escapeHtml(item.line)}</code>
            <div class="exp-line-desc">${item.exp}</div>
          </li>`;
      });
      explanationHTML += '</ul>';
    }
    
    let theoryHTML = '';
    if (ex.theory && ex.theory.length > 20) {
      theoryHTML = `
        <div class="theory-section">\n          <h4>📚 Theoretical background</h4>\n          <div class="theory-content">${ex.theory}</div>\n        </div>`;
    }
    
    // Badges
    const courseBadge = ex.course === 'python' 
      ? '<span class="badge badge-course-python">🐍 Python</span>'
      : '<span class="badge badge-course-pandas">🐼 Pandas</span>';
    
    const diffLabels = { easy: '🟢 easy', medium: '🟡 medium', hard: '🔴 hard' };
    const diffBadge = `<span class="badge badge-diff-${ex.difficulty}">${diffLabels[ex.difficulty]}</span>`;
    
    let pointsBadge;
    if (score) {
      pointsBadge = `<span class="badge badge-earned">✅ ${score.points} points</span>`;
    } else {
      pointsBadge = `<span class="badge badge-points">🏆 up to ${ex.max_points} points</span>`;
    }
    
    const html = `
      <div class="exercise-card">\n        <div class="ex-header">\n          <div class="ex-icon">${ex.topic_icon}</div>\n          <div class="ex-title-block">\n            <div class="ex-num">${escapeHtml(ex.topic_title)}</div>\n            <div class="ex-title">Exercise ${currentIdx + 1} / ${filteredExercises.length}</div>\n          </div>\n          <div class="ex-badges">\n            ${courseBadge}\n            ${diffBadge}\n            ${pointsBadge}\n          </div>\n        </div>\n        \n        <div class="question-box">${ex.q}</div>\n        \n        <div class="editor-section">\n          <div class="editor-label">💻 Write your code here:</div>\n          <div class="editor-wrap">\n          <div class="editor-toolbar">\n            <button class="tb-btn" id="tb-copy" type="button">📋 Copy</button>\n            <button class="tb-btn" id="tb-paste" type="button">📥 Paste</button>\n            <button class="tb-btn" id="tb-cut" type="button">✂️ Cut</button>\n            <button class="tb-btn" id="tb-select" type="button">🔘 Select All</button>\n            <button class="tb-btn" id="tb-clear" type="button">🗑️ Clear</button>\n          </div>\n          <textarea class="code-editor" id="code-input" spellcheck="false" rows="8">${escapeHtml(ex.starter || '')}</textarea>\n        </div>\n          \n          <div class="actions">\n            <button class="btn btn-run" id="run-btn">▶ Run & Check</button>\n            <button class="btn btn-solution" id="sol-btn">💡 Show Solution</button>\n            <button class="btn btn-reset" id="reset-btn">🔄 Reset</button>\n          </div>\n        </div>\n        \n        <div class="output-section" id="output-section">\n          <div class="editor-label">📤 Result:</div>\n          <div class="output-box" id="output-box"></div>\n        </div>\n        \n        <div class="verdict" id="verdict"></div>\n        \n        <div class="solution-section" id="solution-section">\n          ${!score ? '<div class="solution-warning">⚠️ Viewing the solution before a successful solve will halve the score (' + Math.floor(ex.base_points / 2) + ' points instead of ' + ex.max_points + ')</div>' : ''}\n          \n          <div class="solution-header">\n            <h3>💡 Official solution</h3>\n            <button class="copy-btn" id="copy-btn">📋 Copy</button>\n          </div>\n          \n          <div class="solution-code">\n            <pre>${escapeHtml(ex.solution)}</pre>\n          </div>\n          \n          ${explanationHTML}\n          \n          ${theoryHTML}\n        </div>\n        \n        <div class="nav-row">\n          <button class="nav-btn" id="prev-btn" ${currentIdx === 0 ? 'disabled' : ''}>→ Previous</button>\n          <button class="nav-btn" id="next-btn" ${currentIdx === filteredExercises.length - 1 ? 'disabled' : ''}>Next ←</button>\n        </div>\n      </div>
    `;
    
    document.getElementById('content').innerHTML = html;
    wireUp(ex);
  }
  
  function wireUp(ex) {
    document.getElementById('run-btn').addEventListener('click', () => runCode(ex));
    wireEditorToolbar();
    document.getElementById('sol-btn').addEventListener('click', () => {
      const sec = document.getElementById('solution-section');
      const btn = document.getElementById('sol-btn');
      if (sec.classList.contains('show')) {
        sec.classList.remove('show');
        btn.innerHTML = '💡 Show solution';
      } else {
        sec.classList.add('show');
        btn.innerHTML = '🙈 Hide solution';
        viewedSolution(ex.id);
        sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
    document.getElementById('reset-btn').addEventListener('click', () => {
      document.getElementById('code-input').value = ex.starter || '';
      document.getElementById('output-section').classList.remove('show');
      document.getElementById('solution-section').classList.remove('show');
      document.getElementById('verdict').classList.remove('show');
      document.getElementById('sol-btn').innerHTML = '💡 Show solution';
    });
    document.getElementById('copy-btn').addEventListener('click', () => {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(ex.solution).then(() => {
          const b = document.getElementById('copy-btn');
          b.textContent = '✅ copied!';
          setTimeout(() => { b.textContent = '📋 copy'; }, 1800);
        });
      }
    });
    
    document.getElementById('prev-btn').addEventListener('click', () => {
      if (currentIdx > 0) { currentIdx--; render(); window.scrollTo({top:0, behavior:'smooth'}); }
    });
    document.getElementById('next-btn').addEventListener('click', () => {
      if (currentIdx < filteredExercises.length - 1) { currentIdx++; render(); window.scrollTo({top:0, behavior:'smooth'}); }
    });
  }
  
  // ===== Run code + score =====
  function runCode(ex) {
    if (typeof Sk === 'undefined') {
      alert('Python is still loading, try again in a second...');
      return;
    }
    
    const codeEl = document.getElementById('code-input');
    const code = codeEl.value;
    const outBox = document.getElementById('output-box');
    const outSection = document.getElementById('output-section');
    const verdict = document.getElementById('verdict');
    const runBtn = document.getElementById('run-btn');
    
    outSection.classList.add('show');
    outBox.textContent = '⏳ Running...';
    outBox.classList.remove('error');
    verdict.classList.remove('show');
    runBtn.disabled = true;
    
    recordAttempt(ex.id);
    
    let buffer = '';
    Sk.configure({
      output: (text) => { buffer += text; },
      read: (f) => {
        if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][f] === undefined) {
          throw "File not found: '" + f + "'";
        }
        return Sk.builtinFiles["files"][f];
      },
      __future__: Sk.python3,
      execLimit: 8000,
    });
    
    const fullCode = (window.PYTHON_PRELUDE || '') + String.fromCharCode(10) + String.fromCharCode(10) + code;
    
    Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, fullCode, true))
      .then(() => {
        runBtn.disabled = false;
        outBox.textContent = buffer || '(no output)';
        outBox.classList.remove('error');
        
        // === SCORING ===
        // Run the check function
        let passed = false;
        try {
          if (ex.check_fn) {
            const checkFn = eval('(' + ex.check_fn + ')');
            passed = checkFn(buffer, code);
          } else {
            passed = buffer.length > 0; // fallback - just any output
          }
        } catch (e) {
          console.warn('Check function error:', e);
          passed = false;
        }
        
        if (passed) {
          if (ex.explain) {
            const _p = outBox.parentNode;
            const _old = _p.querySelector('.why-box'); if (_old) _old.remove();
            const _w = document.createElement('div');
            _w.className = 'why-box';
            _w.innerHTML = '<div class="why-title">Why This Works</div>' + ex.explain;
            _p.insertBefore(_w, outBox.nextSibling);
          }
          // Calculate points
          const currentScore = getExerciseScore(ex.id);
          let earnedPoints = ex.base_points;
          let bonusText = '';
          
          if (hasViewedSolution(ex.id)) {
            // Halved if viewed solution
            earnedPoints = Math.floor(ex.base_points / 2);
            bonusText = ' (watched solution)';
          } else {
            // First try bonus
            if (isFirstTry(ex.id)) {
              earnedPoints = ex.max_points;
              bonusText = ' (+10 first time! 🎯)';
            }
          }
          
          const isNewScore = !currentScore || currentScore.points < earnedPoints;
          
          if (isNewScore) {
            saveScore(ex.id, earnedPoints, isFirstTry(ex.id));
          }
          
          verdict.className = 'verdict show success';
          verdict.innerHTML = `
            ✅ <b>Correct answer!</b>\n            <span class="points-earned">+${earnedPoints} points${bonusText}</span>\n            ${currentScore && currentScore.points >= earnedPoints ? '<small>(previous score kept)</small>' : ''}
          `;
          
          updateHeader();
          
          // Mini celebration
          if (earnedPoints >= 20) launchConfetti();
          
          // Re-render the exercise to update badge
          setTimeout(() => {
            const badge = document.querySelector('.badge-points, .badge-earned');
            if (badge) {
              badge.className = 'badge badge-earned';
              badge.textContent = `✅ ${earnedPoints} points`;
            }
          }, 600);
        } else {
          verdict.className = 'verdict show fail';
          verdict.innerHTML = `
            🤔 <b>Incorrect answer</b><br>\n            <small>Check the output against what's expected. If you need help, click "Show solution" (will cut the score in half)</small>
          `;
        }
      })
      .catch((e) => {
        runBtn.disabled = false;
        outBox.textContent = String(e);
        outBox.classList.add('error');
        verdict.className = 'verdict show fail';
        verdict.innerHTML = `⚠️ <b>Error in code</b><br><small>Check the error message above</small>`;
      });
  }
  
  // ===== Mini confetti =====
  function launchConfetti() {
    const colors = ['#00d4c8', '#00e5a0', '#ffd700', '#ff8800', '#8b5cf6', '#ec4899'];
    for (let i = 0; i < 25; i++) {
      const conf = document.createElement('div');
      conf.className = 'confetti';
      conf.style.left = Math.random() * 100 + '%';
      conf.style.background = colors[Math.floor(Math.random() * colors.length)];
      conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      conf.style.transform = `rotate(${Math.random() * 360}deg)`;
      conf.style.transition = 'top 2s linear, opacity 2s linear';
      document.body.appendChild(conf);
      requestAnimationFrame(() => {
        conf.style.top = '110vh';
        conf.style.opacity = '0';
      });
      setTimeout(() => conf.remove(), 2200);
    }
  }
  
  // ===== Filter handlers =====
  document.querySelectorAll('.filter-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.dataset.filterType;
      const value = btn.dataset.filter;
      
      // Toggle off if clicking active
      const isActive = btn.classList.contains('active');
      
      // Reset siblings of same type
      document.querySelectorAll(`.filter-pill[data-filter-type="${type}"]`).forEach(b => b.classList.remove('active'));
      
      if (type === 'course') {
        currentCourse = value;
        btn.classList.add('active');
      } else if (type === 'difficulty') {
        if (isActive) {
          currentDifficulty = null;
        } else {
          currentDifficulty = value;
          btn.classList.add('active');
        }
      } else if (type === 'status') {
        if (isActive) {
          currentStatus = null;
        } else {
          currentStatus = value;
          btn.classList.add('active');
        }
      }
      
      applyFilters();
    });
  });
  
  let searchTimer;
  document.getElementById('search').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      searchQuery = e.target.value.trim();
      applyFilters();
    }, 250);
  });
  
  // Reset score
  document.getElementById('reset-score-btn').addEventListener('click', () => {
    if (confirm('Are you sure you want to reset all the scores?')) {
      localStorage.removeItem(STORAGE_KEY);
      render();
    }
  });
  
  // Initial render
  render();
})();
</script>
