k\n            if not has_none:\n                keep.append(i)\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [self._data[c][i] for i in keep]\n        return DataFrame(new_data)\n    \n    def rename(self, columns):\n        \"\"\"Rename columns: df.rename({'old':'new'})\"\"\"\n        new_data = {}\n        new_cols = []\n        for c in self._columns:\n            new_name = columns.get(c, c)\n            new_data[new_name] = self._data[c]\n            new_cols.append(new_name)\n        result = DataFrame(new_data)\n        result._columns = new_cols\n        return result\n    \n    def astype(self, col, dtype):\n        \"\"\"Convert column to type. dtype: int, float, str.\"\"\"\n        new_data = dict(self._data)\n        new_vals = []\n        for v in self._data[col]:\n            if v is None:\n                new_vals.append(None)\n            elif dtype == int or dtype == \"int\":\n                new_vals.append(int(v))\n            elif dtype == float or dtype == \"float\":\n                new_vals.append(float(v))\n            elif dtype == str or dtype == \"str\":\n                new_vals.append(str(v))\n            else:\n                new_vals.append(v)\n        new_data[col] = new_vals\n        return DataFrame(new_data)\n    \n    def clip(self, col, lower=None, upper=None):\n        \"\"\"Clip values in column to range.\"\"\"\n        new_data = dict(self._data)\n        new_vals = []\n        for v in self._data[col]:\n            if v is None:\n                new_vals.append(None); continue\n            if lower is not None and v < lower: v = lower\n            if upper is not None and v > upper: v = upper\n            new_vals.append(v)\n        new_data[col] = new_vals\n        return DataFrame(new_data)\n    \n    def nunique(self):\n        \"\"\"Count unique values per column.\"\"\"\n        result = {}\n        for c in self._columns:\n            seen = []\n            for v in self._data[c]:\n                if v not in seen:\n                    seen.append(v)\n            result[c] = len(seen)\n        return result\n    \n    # ===== Grouping / aggregation =====\n    \n    def groupby(self, by):\n        \"\"\"Group by column.\"\"\"\n        return GroupBy(self, by)\n    \n    # ===== Merging =====\n    \n    def merge(self, other, on, how=\"inner\"):\n        \"\"\"Merge two DataFrames on a key column. how: 'inner' or 'left'.\"\"\"\n        # Build index for other df\n        other_index = {}\n        for i in range(other._nrows):\n            k = other._data[on][i]\n            if k not in other_index:\n                other_index[k] = []\n            other_index[k].append(i)\n        \n        # New columns: my cols + other cols (without duplicate 'on')\n        my_cols = list(self._columns)\n        other_cols = [c for c in other._columns if c != on]\n        new_data = {}\n        for c in my_cols:\n            new_data[c] = []\n        for c in other_cols:\n            new_data[c] = []\n        \n        for i in range(self._nrows):\n            key = self._data[on][i]\n            if key in other_index:\n                for j in other_index[key]:\n                    for c in my_cols:\n                        new_data[c].append(self._data[c][i])\n                    for c in other_cols:\n                        new_data[c].append(other._data[c][j])\n            elif how == \"left\":\n                for c in my_cols:\n                    new_data[c].append(self._data[c][i])\n                for c in other_cols:\n                    new_data[c].append(None)\n        return DataFrame(new_data)\n    \n    # ===== Concat =====\n    \n    @staticmethod\n    def concat(dfs):\n        \"\"\"Concatenate list of DataFrames vertically.\"\"\"\n        if not dfs: return DataFrame({})\n        new_data = {}\n        cols = dfs[0]._columns\n        for c in cols:\n            new_data[c] = []\n        for df in dfs:\n            for c in cols:\n                if c in df._data:\n                    new_data[c].extend(df._data[c])\n                else:\n                    new_data[c].extend([None] * df._nrows)\n        return DataFrame(new_data)\n    \n    # ===== Set/reset index =====\n    \n    def set_index(self, col):\n        \"\"\"Make a column the row index (for display only - we don't really track indices).\"\"\"\n        # Just move that column to first position\n        if col not in self._columns:\n            raise ValueError(\"Column not found: \" + col)\n        new_cols = [col] + [c for c in self._columns if c != col]\n        new_data = {}\n        for c in new_cols:\n            new_data[c] = self._data[c]\n        result = DataFrame(new_data)\n        result._columns = new_cols\n        return result\n    \n    def reset_index(self):\n        \"\"\"Add an index column.\"\"\"\n        new_data = {\"index\": list(range(self._nrows))}\n        for c in self._columns:\n            new_data[c] = self._data[c]\n        return DataFrame(new_data)\n    \n    # ===== Info =====\n    \n    def info(self):\n        \"\"\"Print summary.\"\"\"\n        print(\"DataFrame: \" + str(self._nrows) + \" rows x \" + str(len(self._columns)) + \" columns\")\n        print(\"Columns:\")\n        for c in self._columns:\n            non_null = 0\n            for v in self._data[c]:\n                if v is not None: non_null += 1\n            sample = self._data[c][0] if self._nrows > 0 else None\n            type_name = type(sample).__name__ if sample is not None else \"unknown\"\n            print(\"  \" + c + \" (\" + type_name + \"): \" + str(non_null) + \" non-null\")\n    \n    def __str__(self):\n        return self._render_text()\n    \n    def __repr__(self):\n        return self._render_text()\n    \n    def _render_text(self):\n        if not self._columns:\n            return \"Empty DataFrame\"\n        lines = []\n        header = \"__DATAFRAME__|\" + \"|\".join([str(c) for c in self._columns])\n        lines.append(header)\n        for i in range(self._nrows):\n            row_vals = []\n            for c in self._columns:\n                row_vals.append(str(self._data[c][i]))\n            lines.append(\"__DATAROW__|\" + \"|\".join(row_vals))\n        lines.append(\"__DATAFRAME_END__\")\n        return \"\\n\".join(lines)\n\n\nclass GroupBy:\n    \"\"\"Result of df.groupby(col). Supports .mean(), .sum(), .count(), .agg().\"\"\"\n    def __init__(self, df, by):\n        self._df = df\n        self._by = by\n        # Build groups\n        self._groups = {}\n        col_data = df._data[by]\n        for i in range(df._nrows):\n            key = col_data[i]\n            if key not in self._groups:\n                self._groups[key] = []\n            self._groups[key].append(i)\n    \n    def _agg(self, fn):\n        \"\"\"Apply agg function per group, return DataFrame.\"\"\"\n        other_cols = [c for c in self._df._columns if c != self._by]\n        new_data = {self._by: []}\n        for c in other_cols:\n            new_data[c] = []\n        for key, indices in self._groups.items():\n            new_data[self._by].append(key)\n            for c in other_cols:\n                vals = []\n                for i in indices:\n                    v = self._df._data[c][i]\n                    if isinstance(v, (int, float)) and not isinstance(v, bool):\n                        vals.append(v)\n                if vals:\n                    new_data[c].append(fn(vals))\n                else:\n                    new_data[c].append(None)\n        return DataFrame(new_data)\n    \n    def mean(self):\n        return self._agg(lambda v: round(sum(v)/len(v), 2))\n    \n    def sum(self):\n        return self._agg(sum)\n    \n    def max(self):\n        return self._agg(max)\n    \n    def min(self):\n        return self._agg(min)\n    \n    def count(self):\n        \"\"\"Count rows per group.\"\"\"\n        new_data = {self._by: [], \"count\": []}\n        for key, indices in self._groups.items():\n            new_data[self._by].append(key)\n            new_data[\"count\"].append(len(indices))\n        return DataFrame(new_data)\n    \n    def size(self):\n        \"\"\"Same as count - rows per group.\"\"\"\n        return self.count()\n\n\nclass Series:\n    \"\"\"A column from a DataFrame.\"\"\"\n    def __init__(self, data, name=None):\n        self._data = list(data)\n        self.name = name\n    \n    def __len__(self):\n        return len(self._data)\n    \n    def __getitem__(self, i):\n        return self._data[i]\n    \n    def __iter__(self):\n        return iter(self._data)\n    \n    def gt(self, other): return [v > other for v in self._data if v is not None] if False else [v > other if v is not None else False for v in self._data]\n    def lt(self, other): return [v < other if v is not None else False for v in self._data]\n    def ge(self, other): return [v >= other if v is not None else False for v in self._data]\n    def le(self, other): return [v <= other if v is not None else False for v in self._data]\n    def eq(self, other): return [v == other for v in self._data]\n    \n    def mean(self):\n        nums = [v for v in self._data if isinstance(v, (int, float)) and not isinstance(v, bool)]\n        if nums: return sum(nums) / len(nums)\n        return 0\n    \n    def sum(self):\n        nums = [v for v in self._data if isinstance(v, (int, float)) and not isinstance(v, bool)]\n        return sum(nums)\n    \n    def max(self):\n        vals = [v for v in self._data if v is not None]\n        return max(vals) if vals else None\n    \n    def min(self):\n        vals = [v for v in self._data if v is not None]\n        return min(vals) if vals else None\n    \n    def unique(self):\n        seen = []\n        for v in self._data:\n            if v not in seen:\n                seen.append(v)\n        return seen\n    \n    def nunique(self):\n        return len(self.unique())\n    \n    def count(self):\n        cnt = 0\n        for v in self._data:\n            if v is not None: cnt += 1\n        return cnt\n    \n    def value_counts(self):\n        counts = {}\n        for v in self._data:\n            if v in counts: counts[v] += 1\n            else: counts[v] = 1\n        # Sort by count descending\n        items = list(counts.items())\n        items.sort(key=lambda x: -x[1])\n        result = {}\n        for k, v in items:\n            result[k] = v\n        return result\n    \n    def isna(self):\n        return [v is None for v in self._data]\n    \n    def fillna(self, value):\n        return Series([value if v is None else v for v in self._data], name=self.name)\n    \n    def apply(self, fn):\n        return Series([fn(v) for v in self._data], name=self.name)\n    \n    def map(self, mapping):\n        \"\"\"Map values via dict or function.\"\"\"\n        if isinstance(mapping, dict):\n            return Series([mapping.get(v, v) for v in self._data], name=self.name)\n        return Series([mapping(v) for v in self._data], name=self.name)\n    \n    def round(self, n=0):\n        return Series([round(v, n) if isinstance(v, (int, float)) else v for v in self._data], name=self.name)\n    \n    def cumsum(self):\n        result = []\n        total = 0\n        for v in self._data:\n            if isinstance(v, (int, float)):\n                total += v\n            result.append(total)\n        return Series(result, name=self.name)\n    \n    def pct_change(self):\n        result = [None]\n        for i in range(1, len(self._data)):\n            prev = self._data[i-1]\n            curr = self._data[i]\n            if prev and isinstance(prev, (int, float)) and isinstance(curr, (int, float)):\n                result.append((curr - prev) / prev)\n            else:\n                result.append(None)\n        return Series(result, name=self.name)\n    \n    def __str__(self):\n        return str(self._data)\n    \n    def __repr__(self):\n        return \"Series(\" + str(self._data) + \")\"\n\n\n# =============================================================\n# DATASETS - Israeli context for learning\n# =============================================================\n\n_DATASETS = {\n    \"cities-weather\": {\n        \"name\": \"Weather in Israeli cities\",\n        \"desc\": \"temperatures and humidity\",\n        \"data\": {\n            \"city\": [\"Tel Aviv\", \"Jerusalem\", \"Haifa\", \"Beer Sheva\", \"Eilat\", \"Safed\"],\n            \"temp\": [24, 19, 23, 27, 31, 17],\n            \"humidity\": [68, 50, 72, 40, 55, 45],\n            \"rain_mm\": [0, 2, 0, 0, 0, 5]\n        }\n    },\n    \"real-estate\": {\n        \"name\": \"Apartment prices in Tel Aviv\",\n        \"desc\": \"8 apartments\",\n        \"data\": {\n            \"neighborhood\": [\"Florentin\", \"Rothschild\", \"Neve Tzedek\", \"Jaffa\", \"Ramat Aviv\", \"Bavli\", \"Kiryat Shalom\", \"Old North\"],\n            \"rooms\": [3, 4, 4, 3, 5, 4, 3, 4],\n            \"sqm\": [75, 95, 110, 70, 130, 100, 65, 90],\n            \"price_m\": [3.2, 5.1, 6.8, 2.9, 4.5, 4.1, 1.9, 4.7]\n        }\n    },\n    \"football\": {\n        \"name\": \"Premier League - 5 teams\",\n        \"desc\": \"Statistics\",\n        \"data\": {\n            \"team\": [\"Maccabi Tel Aviv\", \"Hapoel Beer Sheva\", \"Maccabi Haifa\", \"Hapoel Tel Aviv\", \"Beitar\"],\n            \"points\": [55, 52, 48, 42, 38],\n            \"wins\": [17, 16, 14, 12, 10],\n            \"draws\": [4, 4, 6, 6, 8],\n            \"losses\": [3, 4, 4, 6, 6],\n            \"goals_for\": [54, 49, 41, 38, 32],\n            \"goals_against\": [21, 22, 25, 30, 33]\n        }\n    },\n    \"students\": {\n        \"name\": \"student grades\",\n        \"desc\": \"Grades in 3 subjects\",\n        \"data\": {\n            \"name\": [\"Gal\", \"Tomer\", \"Yael\", \"Noa\", \"Aviv\", \"Maya\", \"Daniel\", \"Shira\", \"Itay\", \"Roni\"],\n            \"math\": [88, 76, 92, 84, 70, 95, 81, 89, 73, 86],\n            \"english\": [78, 8 [12, 60, 24, 84, 6, 36, 18, 72, 8, 48, 30, 96, 14, 42, 22],\n            \"churn\": [0, 1, 0, 1, 1, 0, 0, 1, 1, 1, 0, 0, 1, 0, 0],\n            \"plan\": [\"basic\",\"premium\",\"standard\",\"premium\",\"basic\",\"premium\",\"standard\",\"premium\",\"basic\",\"premium\",\"standard\",\"premium\",\"basic\",\"premium\",\"standard\"]\n        }\n    },\n    \"salaries\": {\n        \"name\": \"Salaries by department\",\n        \"desc\": \"12 employees\",\n        \"data\": {\n            \"name\": [\"Avi\",\"Beni\",\"Galit\",\"Dana\",\"Hila\",\"Victor\",\"Zohar\",\"Chani\",\"Tal\",\"Yossi\",\"Carmel\",\"Liat\"],\n            \"department\": [\"Sales\",\"R&D\",\"Sales\",\"Marketing\",\"R&D\",\"Sales\",\"Marketing\",\"R&D\",\"Sales\",\"R&D\",\"Marketing\",\"Sales\"],\n            \"salary\": [15000, 22000, 18000, 13000, 25000, 16000, 14000, 28000, 17000, 23000, 12000, 19000],\n            \"years\": [2, 5, 3, 1, 7, 4, 2, 8, 3, 6, 1, 4]\n        }\n    }\n}\n\n\nclass _Datasets:\n    \"\"\"Pre-loaded datasets. Usage: df = data.load('cities-weather')\"\"\"\n    \n    def list(self):\n        \"\"\"List all available datasets.\"\"\"\n        for key in _DATASETS:\n            info = _DATASETS[key]\n            print(\"  \" + key + \": \" + info[\"name\"] + \" - \" + info[\"desc\"])\n    \n    def load(self, name):\n        \"\"\"Load a dataset as a DataFrame.\"\"\"\n        if name not in _DATASETS:\n            keys = list(_DATASETS.keys())\n            raise ValueError(\"Dataset not found: \" + name)\n        return DataFrame(_DATASETS[name][\"data\"])\n    \n    def info(self, name):\n        \"\"\"Show info about a dataset.\"\"\"\n        if name not in _DATASETS:\n            print(\"Dataset not found: \" + name)\n            return\n        info = _DATASETS[name]\n        print(\"DATASET: \" + info[\"name\"])\n        print(\"  \" + info[\"desc\"])\n        df = DataFrame(info[\"data\"])\n        print(\"  shape: \" + str(df.shape[0]) + \" rows x \" + str(df.shape[1]) + \" cols\")\n\n\ndata = _Datasets()\n";

// ============== APP ==============
(function() {
  'use strict';
  
  const STORAGE_KEY = 'pandas_quiz_100_scores';
  const POINTS = { easy: 10, medium: 20, hard: 30 };
  const BONUS = { easy: 5, medium: 10, hard: 15 };  // first-try
  
  const allQuestions = window.PANDAS_QUIZ;
  let filtered = allQuestions.slice();
  let currentIdx = 0;
  let currentDiff = 'all';
  let currentStatus = null;
  let searchQuery = '';
  
  const attempts = {};
  const solutionViewed = new Set();
  
  function getScores() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
    catch(e) { return {}; }
  }
  function saveScore(num, points) {
    const scores = getScores();
    if (!scores[num] || scores[num].points < points) {
      scores[num] = { points, time: new Date().toISOString() };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
    }
  }
  function getScore(num) { return getScores()[num] || null; }
  function getTotalScore() {
    return Object.values(getScores()).reduce((s, x) => s + x.points, 0);
  }
  function getMaxScore() {
    return allQuestions.reduce((s, q) => s + POINTS[q.difficulty] + BONUS[q.difficulty], 0);
  }
  function getCounts() {
    const scores = getScores();
    const r = { easy: 0, medium: 0, hard: 0 };
    allQuestions.forEach(q => {
      if (scores[q.num]) r[q.difficulty]++;
    });
    return r;
  }
  
  function updateHeader() {
    document.getElementById('total-score').textContent = getTotalScore();
    document.getElementById('max-score').textContent = getMaxScore();
    const c = getCounts();
    document.getElementById('easy-done').textContent = c.easy;
    document.getElementById('medium-done').textContent = c.medium;
    document.getElementById('hard-done').textContent = c.hard;
    const total = c.easy + c.medium + c.hard;
    document.getElementById('progress-fill').style.width = (total / 100 * 100) + '%';
  }
  
  function applyFilters() {
    filtered = allQuestions.filter(q => {
      if (currentDiff !== 'all' && q.difficulty !== currentDiff) return false;
      if (currentStatus === 'done' && !getScore(q.num)) return false;
      if (currentStatus === 'todo' && getScore(q.num)) return false;
      if (searchQuery) {
        const text = (q.q + ' ' + q.topic).toLowerCase();
        if (!text.includes(searchQuery.toLowerCase())) return false;
      }
      return true;
    });
    currentIdx = 0;
    render();
  }
  
  function escapeHtml(s) {
    return String(s).replace(/[&<>"\']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  
  
  // === CODE EDITOR TOOLBAR (copy/paste/cut/select) ===
  function wireEditorToolbar() {
    const editor = document.getElementById('code-input');
    if (!editor) return;
    
    const copyBtn = document.getElementById('tb-copy');
    const pasteBtn = document.getElementById('tb-paste');
    const cutBtn = document.getElementById('tb-cut');
    const selectBtn = document.getElementById('tb-select');
    const clearBtn = document.getElementById('tb-clear');
    
    if (copyBtn) {
      copyBtn.addEventListener('click', () => {
        const text = editor.value;
        if (!text) return;
        const showCopied = () => {
          copyBtn.classList.add('copied');
          copyBtn.innerHTML = '✅ copied';
          setTimeout(() => {
            copyBtn.classList.remove('copied');
            copyBtn.innerHTML = '📋 copy';
          }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(showCopied).catch(() => {
            // Fallback
            editor.select();
            document.execCommand('copy');
            showCopied();
          });
        } else {
          editor.select();
          document.execCommand('copy');
          showCopied();
        }
      });
    }
    
    if (pasteBtn) {
      pasteBtn.addEventListener('click', async () => {
        try {
          if (navigator.clipboard && navigator.clipboard.readText) {
            const text = await navigator.clipboard.readText();
            // Insert at cursor position
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            editor.value = editor.value.slice(0, start) + text + editor.value.slice(end);
            // Move cursor to end of pasted text
            editor.selectionStart = editor.selectionEnd = start + text.length;
            editor.focus();
            pasteBtn.classList.add('copied');
            pasteBtn.innerHTML = '✅ pasted';
            setTimeout(() => {
              pasteBtn.classList.remove('copied');
              pasteBtn.innerHTML = '📥 paste';
            }, 1500);
          } else {
            // Fallback: focus and tell user
            editor.focus();
            alert('To paste: long-press the editor and choose "Paste"');
          }
        } catch(e) {
          editor.focus();
          alert('Cannot access the clipboard. Use Ctrl+V or long press');
        }
      });
    }
    
    if (cutBtn) {
      cutBtn.addEventListener('click', () => {
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        const selected = editor.value.slice(start, end) || editor.value;
        const showCut = () => {
          cutBtn.classList.add('copied');
          cutBtn.innerHTML = '✅ derived';
          setTimeout(() => {
            cutBtn.classList.remove('copied');
            cutBtn.innerHTML = '✂️ cut';
          }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(selected).then(() => {
            if (start === end) {
              // Cut everything
              editor.value = '';
            } else {
              editor.value = editor.value.slice(0, start) + editor.value.slice(end);
              editor.selectionStart = editor.selectionEnd = start;
            }
            showCut();
          });
        } else {
          editor.select();
          document.execCommand('cut');
          showCut();
        }
      });
    }
    
    if (selectBtn) {
      selectBtn.addEventListener('click', () => {
        editor.focus();
        editor.select();
      });
    }
    
    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        if (confirm('clear all the code?')) {
          editor.value = '';
          editor.focus();
        }
      });
    }
  }


  function render() {
    updateHeader();
    
    if (filtered.length === 0) {
      document.getElementById('content').innerHTML = 
        '<div style="text-align:center;padding:30px;color:var(--text2);">No questions found</div>';
      return;
    }
    
    if (currentIdx >= filtered.length) currentIdx = 0;
    const q = filtered[currentIdx];
    const score = getScore(q.num);
    const basePoints = POINTS[q.difficulty];
    const maxPoints = basePoints + BONUS[q.difficulty];
    
    const diffLabels = { easy: '🟢 easy', medium: '🟡 medium', hard: '🔴 hard' };
    const pointsBadge = score 
      ? `<span class="badge badge-earned">✅ ${score.points} pts</span>`
      : `<span class="badge badge-points">🏆 up to ${maxPoints} pts</span>`;
    
    document.getElementById('content').innerHTML = `
      <div class="question-card">\n        <div class="q-header">\n          <div class="q-num">#${q.num}</div>\n          <div class="q-topic">${escapeHtml(q.topic)}</div>\n          <div class="q-badges">\n            <span class="badge badge-diff-${q.difficulty}">${diffLabels[q.difficulty]}</span>\n            ${pointsBadge}\n          </div>\n        </div>\n        \n        <div class="question-text">${q.q}</div>\n        \n        <div class="editor-label">💻 Write your code:</div>\n        <div class="editor-wrap">\n          <div class="editor-toolbar">\n            <button class="tb-btn" id="tb-copy" type="button">📋 Copy</button>\n            <button class="tb-btn" id="tb-paste" type="button">📥 Paste</button>\n            <button class="tb-btn" id="tb-cut" type="button">✂️ Cut</button>\n            <button class="tb-btn" id="tb-select" type="button">🔘 Select All</button>\n            <button class="tb-btn" id="tb-clear" type="button">🗑️ Clear</button>\n          </div>\n          <textarea class="code-editor" id="code-input" spellcheck="false" rows="9">${escapeHtml(q.starter || '')}</textarea>\n        </div>\n        \n        <div class="actions">\n          <button class="btn btn-run" id="run-btn">▶ Run & Check</button>\n          <button class="btn btn-solution" id="sol-btn">💡 Show Solution</button>\n          <button class="btn btn-reset" id="reset-btn">🔄 Clear</button>\n        </div>\n        \n        <div class="output-section" id="output-section">\n          <div class="editor-label" style="margin-top:14px;">📤 Result:</div>\n          <div class="output-box" id="output-box"></div>\n        </div>\n        \n        <div class="verdict" id="verdict"></div>\n        \n        <div class="solution-section" id="solution-section">\n          ${!score ? '<div class="solution-warning">⚠️ Viewing the solution before solving it will cut your score in half</div>' : ''}\n          <div class="solution-header">\n            <h3>💡 Official solution</h3>\n            <button class="copy-btn" id="copy-btn">📋 Copy</button>\n          </div>\n          <div class="solution-code">\n            <pre>${escapeHtml(q.solution)}</pre>\n          </div>\n        </div>\n        \n        <div class="nav-row">\n          <button class="nav-btn" id="prev-btn" ${currentIdx === 0 ? 'disabled' : ''}>→ Previous</button>\n          <button class="nav-btn" id="next-btn" ${currentIdx === filtered.length - 1 ? 'disabled' : ''}>Next ←</button>\n        </div>\n      </div>
    `;
    
    wireUp(q);
  }
  
  function wireUp(q) {
    document.getElementById('run-btn').addEventListener('click', () => runCode(q));
    wireEditorToolbar();
    document.getElementById('sol-btn').addEventListener('click', () => {
      const sec = document.getElementById('solution-section');
      const btn = document.getElementById('sol-btn');
      if (sec.classList.contains('show')) {
        sec.classList.remove('show');
        btn.innerHTML = '💡 Show solution';
      } else {
        sec.classList.add('show');
        btn.innerHTML = '🙈 Hide solution';
        solutionViewed.add(q.num);
        sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
    document.getElementById('reset-btn').addEventListener('click', () => {
      document.getElementById('code-input').value = q.starter || '';
      document.getElementById('output-section').classList.remove('show');
      document.getElementById('solution-section').classList.remove('show');
      document.getElementById('verdict').classList.remove('show');
      document.getElementById('sol-btn').innerHTML = '💡 Show solution';
    });
    document.getElementById('copy-btn').addEventListener('click', () => {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(q.solution).then(() => {
          const b = document.getElementById('copy-btn');
          b.textContent = '✅ copied!';
          setTimeout(() => { b.textContent = '📋 copy'; }, 1800);
        });
      }
    });
    document.getElementById('prev-btn').addEventListener('click', () => {
      if (currentIdx > 0) { currentIdx--; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    });
    document.getElementById('next-btn').addEventListener('click', () => {
      if (currentIdx < filtered.length - 1) { currentIdx++; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    });
  }
  
  function runCode(q) {
    if (typeof Sk === 'undefined') {
      alert('Python is still loading...');
      return;
    }
    
    const code = document.getElementById('code-input').value;
    const outBox = document.getElementById('output-box');
    const outSection = document.getElementById('output-section');
    const verdict = document.getElementById('verdict');
    const runBtn = document.getElementById('run-btn');
    
    outSection.classList.add('show');
    outBox.textContent = '⏳ Running...';
    outBox.classList.remove('error');
    verdict.classList.remove('show');
    runBtn.disabled = true;
    
    attempts[q.num] = (attempts[q.num] || 0) + 1;
    
    let buffer = '';
    Sk.configure({
      output: (text) => { buffer += text; },
      read: (f) => {
        if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][f] === undefined) {
          throw "File not found: '" + f + "'";
        }
        return Sk.builtinFiles["files"][f];
      },
      __future__: Sk.python3,
      execLimit: 8000,
    });
    
    const fullCode = (window.PYTHON_PRELUDE || '') + String.fromCharCode(10) + String.fromCharCode(10) + code;
    
    Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, fullCode, true))
      .then(() => {
        runBtn.disabled = false;
        outBox.textContent = buffer || '(no output)';
        outBox.classList.remove('error');
        
        // Run check function
        let passed = false;
        try {
          const checkFn = eval('(' + q.check + ')');
          passed = checkFn(buffer, code);
        } catch(e) {
          console.warn('Check error:', e);
          passed = false;
        }
        
        if (passed) {
          if (q.explain) {
            const _p = outBox.parentNode;
            const _old = _p.querySelector('.why-box'); if (_old) _old.remove();
            const _w = document.createElement('div');
            _w.className = 'why-box';
            _w.innerHTML = '<div class="why-title">Why This Works</div>' + q.explain;
            _p.insertBefore(_w, outBox.nextSibling);
          }
          const basePoints = POINTS[q.difficulty];
          const bonus = BONUS[q.difficulty];
          const maxPoints = basePoints + bonus;
          
          let earned;
          let msg;
          
          if (solutionViewed.has(q.num)) {
            earned = Math.floor(basePoints / 2);
            msg = ' (watched solution)';
          } else if (attempts[q.num] === 1) {
            earned = maxPoints;
            msg = ' (first time! 🎯)';
          } else {
            earned = basePoints;
            msg = '';
          }
          
          const existing = getScore(q.num);
          if (!existing || existing.points < earned) {
            saveScore(q.num, earned);
          }
          
          verdict.className = 'verdict show success';
          verdict.innerHTML = `
            ✅ <b>Correct answer!</b>\n            <span class="points-earned">+${earned} points${msg}</span>\n            ${existing && existing.points >= earned ? '<small>(previous score kept)</small>' : ''}
          `;
          
          updateHeader();
          if (earned >= 15) launchConfetti();
          
          // Update badge
          setTimeout(() => {
            const badges = document.querySelectorAll('.badge-points, .badge-earned');
            badges.forEach(b => {
              if (b.classList.contains('badge-points')) {
                b.className = 'badge badge-earned';
                b.textContent = `✅ ${earned} pts`;
              }
            });
          }, 600);
        } else {
          verdict.className = 'verdict show fail';
          verdict.innerHTML = `
            🤔 <b>Incorrect answer</b><br>\n            <small>Check the output and try again. Need help? "Show solution" (but this will reduce your score)</small>
          `;
        }
      })
      .catch((e) => {
        runBtn.disabled = false;
        outBox.textContent = String(e);
        outBox.classList.add('error');
        verdict.className = 'verdict show fail';
        verdict.innerHTML = '⚠️ <b>Error in code</b><br><small>Check the message above</small>';
      });
  }
  
  function launchConfetti() {
    const colors = ['#8b5cf6', '#00e5a0', '#ffd700', '#ec4899'];
    for (let i = 0; i < 25; i++) {
      const conf = document.createElement('div');
      conf.className = 'confetti';
      conf.style.left = Math.random() * 100 + '%';
      conf.style.background = colors[Math.floor(Math.random() * colors.length)];
      conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      conf.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
      conf.style.transition = 'top 2s linear, opacity 2s linear';
      document.body.appendChild(conf);
      requestAnimationFrame(() => {
        conf.style.top = '110vh';
        conf.style.opacity = '0';
      });
      setTimeout(() => conf.remove(), 2200);
    }
  }
  
  // Filter buttons
  document.querySelectorAll('.filter-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.dataset.filterType;
      const value = btn.dataset.filter;
      const isActive = btn.classList.contains('active');
      
      document.querySelectorAll(`.filter-pill[data-filter-type="${type}"]`).forEach(b => b.classList.remove('active'));
      
      if (type === 'diff') {
        currentDiff = value;
        btn.classList.add('active');
      } else if (type === 'status') {
        if (isActive) {
          currentStatus = null;
        } else {
          currentStatus = value;
          btn.classList.add('active');
        }
      }
      
      applyFilters();
    });
  });
  
  let searchTimer;
  document.getElementById('search').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      searchQuery = e.target.value.trim();
      applyFilters();
    }, 250);
  });
  
  document.getElementById('reset-score-btn').addEventListener('click', () => {
    if (confirm('reset the entire score?')) {
      localStorage.removeItem(STORAGE_KEY);
      render();
    }
  });
  
  render();
})();
</script>













<script id="mobile-safe-bottom">
(function(){
  if (!window.matchMedia || !matchMedia('(max-width:900px)').matches) return;
  function pad(){
    var best=0;
    var els=document.body.getElementsByTagName('*');
    for (var i=0;i<els.length;i++){
      var e=els[i], cs;
      try{ cs=getComputedStyle(e); }catch(err){ continue; }
      if(cs.position!=='fixed'||cs.display==='none'||cs.visibility==='hidden') continue;
      var b=e.getBoundingClientRect();
      if(b.height<8||b.width<innerWidth*0.34) continue;
      if(b.bottom > innerHeight-6 && b.top > innerHeight*0.55) best=Math.max(best,b.height);
    }
    document.body.style.paddingBottom = best ? (best+14)+'px' : '';
  }
  addEventListener('load',pad); addEventListener('resize',pad);
  setTimeout(pad,1200); setTimeout(pad,3500);
})();
</script>
