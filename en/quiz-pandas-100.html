    explain: "shape[0] counts physical rows in the table. If several rows for the same group appeared, the question of how many groups there are would require nunique on the name column rather than a row count. It's always worth asking whether the row is the unit you want to count, or whether there are duplicates.", "starter": "", "solution": "df = data.load(\"football\")\nprint(df.shape[0])", "check": (out, code) => /\.shape\s*\[\s*0\s*\]/.test(code) && /data\.load\(\s*["']football["']\s*\)/.test(code) && /(^|\D)5(\D|$)/.test(out)}, {"num": 21, "difficulty": "easy", "topic": "mean", "q": "From <code>students</code>: calculate the <b>average</b> of the <code>math</code> scores.",
    explain: "mean automatically skips missing values and calculates the average only over what exists, so an average isn't always the sum divided by the number of rows. Note that the output appears as 83.40000000000001: that's what floating-point arithmetic looks like in practice, and for a clean display you round with round.", "starter": "", "solution": "df = data.load(\"students\")\nprint(df[\"math\"].mean())", "check": (out, code) => /\.mean\(/.test(code) && /df\s*\[\s*["']math["']\s*\]/.test(code) && /83\.4/.test(out)}, {"num": 22, "difficulty": "easy", "topic": "sum", "q": "From <code>sales</code>: calculate <b>total annual revenue</b> (<code>revenue</code>).",
    explain: "sum totals all the column's values and skips missing values. The total annual revenue here is 720000. Note that sum on a completely empty series returns 0, not an error, so in a real report it's worth also checking how many rows actually went into the calculation before drawing a conclusion from the sum.", "starter": "", "solution": "df = data.load(\"sales\")\nprint(df[\"revenue\"].sum())", "check": (out, code) => /\.sum\(/.test(code) && /df\s*\[\s*["']revenue["']\s*\]/.test(code) && /720000/.test(out)}, {"num": 23, "difficulty": "easy", "topic": "max", "q": "From <code>cities-weather</code>: what's the highest temperature?",
    explain: "max returns the maximum value in a column, but doesn't reveal which row it belongs to. To get the row label of the maximum you use idxmax, and to get the full row you sort descending and take head(1). The distinction between the value and the row carrying it comes up in almost every analysis.", "starter": "", "solution": "df = data.load(\"cities-weather\")\nprint(df[\"temp\"].max())", "check": (out, code) => /\.max\(/.test(code) && /df\s*\[\s*["']temp["']\s*\]/.test(code) && /(^|\D)31(\D|$)/.test(out)}, {"num": 24, "difficulty": "easy", "topic": "min", "q": "From <code>salaries</code>: what is the lowest salary?",
    explain: "min returns the lowest value and skips missing values. If all the values in a column are missing, the result will be empty rather than an error — so in a real report you always check count alongside min and max, to know how many values the calculation was actually based on.", "starter": "", "solution": "df = data.load(\"salaries\")\nprint(df[\"salary\"].min())", "check": (out, code) => /\.min\(/.test(code) && /df\s*\[\s*["']salary["']\s*\]/.test(code) && /12000/.test(out)}, {"num": 25, "difficulty": "easy", "topic": "count", "q": "From <code>real-estate</code>: how many neighborhoods are there (<code>nunique</code> (nunique of <code>neighborhood</code>)?",
    explain: "nunique counts how many distinct values a column has and ignores missing values. Note that in this dataset every neighborhood appears once, so nunique happens to equal the number of rows. In a table with duplicates the two numbers would diverge, which is exactly why you check them together when cleaning data.", "starter": "", "solution": "df = data.load(\"real-estate\")\nprint(df[\"neighborhood\"].nunique())", "check": (out, code) => /nunique\(/.test(code) && /df\s*\[\s*["']neighborhood["']\s*\]/.test(code) && /(^|\D)8(\D|$)/.test(out)}, {"num": 26, "difficulty": "easy", "topic": "describe", "q": "From <code>students</code>: print the table's <code>describe()</code> (full statistics).",
    explain: "describe centers count, mean, std, min, the three quartiles, and max for every numeric column into one table. Text columns like name are not included. This is the first operation you run on new data: it immediately exposes unusual ranges, missing values, and asymmetric distributions.", "starter": "", "solution": "df = data.load(\"students\")\nprint(df.describe())", "check": "(out, code) => /describe\\(/.test(code) && /math/.test(out)"}, {"num": 27, "difficulty": "easy", "topic": "value_counts", "q": "From <code>salaries</code>: count how many employees are in each <code>department</code>.",
    explain: "value_counts counts how many times each value appears in a column and returns a Series sorted from most to least common. It's the fastest way to get to know a categorical column. Note that it skips missing values by default, so the sum of the counts may be smaller than the number of rows.", "starter": "", "solution": "df = data.load(\"salaries\")\nprint(df[\"department\"].value_counts())", "check": "(out, code) => /value_counts/.test(code) && (/Sales/.test(out))"}, {"num": 28, "difficulty": "easy", "topic": "value_counts", "q": "From <code>telecom-churn</code>: count how many customers are in each <code>plan</code> type.",
    explain: "value_counts returns the values sorted from most to least common, so the first row is always the largest category. Here premium leads with 7 customers. If you want percentages instead of counts, pass normalize=True, which is more convenient for comparing groups of different sizes.", "starter": "", "solution": "df = data.load(\"telecom-churn\")\nprint(df[\"plan\"].value_counts())", "check": (out, code) => /value_counts/.test(code) && /premium\s+7/.test(out) && /basic\s+4/.test(out) && /standard\s+4/.test(out)}, {"num": 29, "difficulty": "easy", "topic": "unique", "q": "From <code>salaries</code>: find the list of unique departments (<code>unique()</code>).",
    explain: "unique returns the distinct values in a column in their first order of appearance, without sorting. This differs from value_counts, which returns both a count and sorts. When you only want the number of distinct values, use nunique, which avoids building the whole list.", "starter": "", "solution": "df = data.load(\"salaries\")\nprint(df[\"department\"].unique())", "check": "(out, code) => /unique\\(/.test(code) && /Sales/.test(out)"}, {"num": 30, "difficulty": "easy", "topic": "Access to the value", "q": "From <code>cities-weather</code>: print <b>the temperature of Tel Aviv</b>. Filter with <code>.eq()</code> and take the first value with <code>.iloc[0]</code>.",
    explain: "After filtering, the original index is preserved: if the row that remained was originally row number 4, its label stays 4. So [0] on the result may raise a KeyError or return a completely different row. iloc[0] always returns the first value by physical position, so it’s the right choice after filtering or sorting.", "starter": "", "solution": "df = data.load(\"cities-weather\")\ntlv = df[df[\"city\"].eq(\"Tel Aviv\")]\nprint(tlv[\"temp\"].iloc[0])", "check": (out, code) => /\.eq\(/.test(code) && /\.iloc\s*\[\s*0\s*\]/.test(code) && /(^|\D)24(\D|$)/.test(out)}, {"num": 31, "difficulty": "medium", "topic": "GroupBy", "q": "From <code>salaries</code>: group by <code>department</code> and calculate the <b>average salary</b> for each department.",
    explain: "After groupby, it’s best to immediately select the column you’re interested in, here [\"salary\"], and only then apply the aggregation function. That way the result is clean and contains exactly what was asked. If you apply mean to the whole table, text columns like name produce missing values or an error, since a mean of names has no meaning.", "starter": "", "solution": "df = data.load(\"salaries\")\nresult = df.groupby(\"department\")[\"salary\"].mean()\nprint(result)", "check": (out, code) => /groupby\(\s*["']department["']\s*\)/.test(code) && /\.mean\(/.test(code) && /Sales\s+17000/.test(out) && /R&D\s+24500/.test(out) && /Marketing\s+13000/.test(out)}, {"num": 32, "difficulty": "medium", "topic": "GroupBy", "q": "From <code>salaries</code>: group by <code>department</code> and count employees in each department (<code>count</code>).",
    explain: "count after groupby counts, within each group, how many non-missing values there are in each column, so you get one column per field. Here there are no missing values, so all the columns are identical. When there is missing data the numbers diverge, and that's exactly the difference from size, which just counts rows.", "starter": "", "solution": "df = data.load(\"salaries\")\nresult = df.groupby(\"department\").count()\nprint(result)", "check": (out, code) => /groupby/.test(code) && /\.count\(/.test(code) && /Sales\|5\|5\|5/.test(out) && /R&D\|4\|4\|4/.test(out)}, {"num": 33, "difficulty": "medium", "topic": "GroupBy", "q": "From <code>telecom-churn</code>: group by <code>plan</code> and compute the average <code>monthly_bill</code>.",
    explain: "Selecting the column right after groupby avoids unnecessary computation and produces focused output. Note that without the selection, an average of customer_id would also be computed — a number that is arithmetically valid and completely meaningless from a business standpoint. Always ask whether aggregating a column has a real interpretation.", "starter": "", "solution": "df = data.load(\"telecom-churn\")\nresult = df.groupby(\"plan\")[\"monthly_bill\"].mean()\nprint(result)", "check": (out, code) => /groupby\(\s*["']plan["']\s*\)/.test(code) && /monthly_bill/.test(code) && /\.mean\(/.test(code) && /basic\s+46/.test(out) && /premium\s+120/.test(out)}, {"num": 34, "difficulty": "medium", "topic": "GroupBy", "q": "From <code>salaries</code>: group by department and calculate the <b>total salary</b> per department (<code>sum</code>).",
    explain: "Selecting the column before aggregating gives exactly what was asked: total salary in each department. Note that summing the tenure column would have been a meaningless number, and summing a names column in real pandas would have concatenated the strings together without warning. Explicitly selecting the column prevents both mishaps.", "starter": "", "solution": "df = data.load(\"salaries\")\nresult = df.groupby(\"department\")[\"salary\"].sum()\nprint(result)", "check": (out, code) => /groupby/.test(code) && /salary/.test(code) && /\.sum\(/.test(code) && /Sales\s+85000/.test(out) && /R&D\s+98000/.test(out) && /Marketing\s+39000/.test(out)}, {"num": 35, "difficulty": "medium", "topic": "GroupBy + Max", "q": "From <code>salaries</code>: group by department and print the <b>highest salary</b> in each department (<code>max</code>).",
    explain: "max after groupby returns the highest value in each group, but not the row it came from. If you apply max to the whole table, each column gets its own maximum separately, and the resulting row doesn't describe any real employee. To get the employee itself you need idxmax or sorting within each group.", "starter": "", "solution": "df = data.load(\"salaries\")\nresult = df.groupby(\"department\")[\"salary\"].max()\nprint(result)", "check": (out, code) => /groupby/.test(code) && /salary/.test(code) && /\.max\(/.test(code) && /Sales\s+19000/.test(out) && /R&D\s+28000/.test(out) && /Marketing\s+14000/.test(out)}, {"num": 36, "difficulty": "medium", "topic": "GroupBy + Size", "q": "From <code>salaries</code>: group by <code>department</code> and print the <b>size of each group</b> using <code>size()</code>.",
    explain: "size returns how many rows are in each group and returns a single Series. The difference from count is fundamental: size counts rows including ones with missing values, while count counts, per column separately, only the values that are present. When there is missing data the two numbers diverge, and then the distinction is critical.", "starter": "", "solution": "df = data.load(\"salaries\")\nresult = df.groupby(\"department\").size()\nprint(result)", "check": (out, code) => /groupby\(\s*["']department["']\s*\)/.test(code) && /\.size\(/.test(code) && /Sales\s+5/.test(out) && /R&D\s+4/.test(out) && /Marketing\s+3/.test(out)}, {"num": 37, "difficulty": "medium", "topic": "Multiple condition", "q": "From <code>students</code>: filter students with <b>math &gt; 80</b> and also <b>english &gt; 80</b>. Use <code>.gt()</code> and the <code>&amp;</code> operator.",
    explain: "To combine two conditions use logical & for and, | for or, and ~ for negation. These are not Python's and, or, and not: Python's connective words try to convert the entire mask to a single truth value and therefore fail. Golden rule: wrap every condition in parentheses, because & has higher precedence than comparison.", "starter": "", "solution": "df = data.load(\"students\")\nresult = df[df[\"math\"].gt(80) & df[\"english\"].gt(80)]\nprint(result)", "check": (out, code) => /\.gt\(\s*80\s*\)/.test(code) && /&/.test(code) && !/lambda/.test(code) && /Yael\|92\|88/.test(out) && /Noa\|84\|90/.test(out) && !/Tomer/.test(out)}, {"num": 38, "difficulty": "medium", "topic": "Multiple condition", "q": "From <code>telecom-churn</code>: filter customers with <code>monthly_bill &gt; 100</code> and <code>tenure_months &gt; 40</code>.",
    explain: "Each condition produces a separate boolean mask, and & combines them element-by-element so a row stays only if both conditions hold for it. The more conditions you add, the faster the result shrinks, so after multiple filters it is always worth printing shape[0] to make sure you have not ended up with an empty table.", "starter": "", "solution": "df = data.load(\"telecom-churn\")\nresult = df[df[\"monthly_bill\"].gt(100) & df[\"tenure_months\"].gt(40)]\nprint(result)", "check": (out, code) => /\.gt\(\s*100\s*\)/.test(code) && /\.gt\(\s*40\s*\)/.test(code) && /&/.test(code) && !/lambda/.test(code) && /\|102\|/.test(out) && /\|112\|/.test(out) && !/\|101\|/.test(out)}, {"num": 39, "difficulty": "medium", "topic": "condition or", "q": "From <code>cities-weather</code>: filter cities with <code>temp &gt; 25</code> <b>or</b> <code>humidity &gt; 65</code>. Use <code>.gt()</code> and the <code>|</code> operator.",
    explain: "The | operator is logical or: a row is included if at least one of the conditions holds, so the result is always greater than or equal to that of &. Here Tel Aviv gets in thanks to the high humidity even though its temperature is below 25, and Eilat gets in thanks to the heat. Jerusalem fails both conditions and so doesn't appear.", "starter": "", "solution": "df = data.load(\"cities-weather\")\nresult = df[df[\"temp\"].gt(25) | df[\"humidity\"].gt(65)]\nprint(result)", "check": (out, code) => /\.gt\(\s*25\s*\)/.test(code) && /\.gt\(\s*65\s*\)/.test(code) && /\|/.test(code) && !/lambda/.test(code) && /Tel Aviv/.test(out) && /Eilat/.test(out) && !/Jerusalem/.test(out)}, {"num": 40, "difficulty": "medium", "topic": "in operator", "q": "From <code>real-estate</code>: filter apartments in the \"Florentin\" or \"Rothschild\" neighborhoods (use <code>isin</code>).",
    explain: "isin takes a list of values and returns a boolean mask flagging which rows contain one of them. It's the readable alternative to a long chain of eq joined with |, and it's also faster. To get the opposite, i.e. everything not in the list, prefix the mask with ~: df[~df[\"col\"].isin([...])].", "starter": "", "solution": "df = data.load(\"real-estate\")\nresult = df[df[\"neighborhood\"].isin([\"Florentin\", \"Rothschild\"])]\nprint(result)", "check": (out, code) => /\.isin\(/.test(code) && /Florentin/.test(code) && /Florentin\|3\|75/.test(out) && /Rothschild\|4\|95/.test(out) && !/Jaffa/.test(out)}, {"num": 41, "difficulty": "medium", "topic": "New column", "q": "From <code>students</code>: add a column <code>total</code> that is the <b>sum</b> of math + english + history. Build it manually in a loop.",
    explain: "Adding a column is done with a simple assignment: df[\"total\"] = values, where the list length equals the number of rows. The loop here teaches the mechanism, but in pandas it's standard to write this vectorized: df[\"math\"] + df[\"english\"] + df[\"history\"] directly returns a summed Series, with no loop and no risk of a length mistake.", "starter": "", "solution": "df = data.load(\"students\")\ntotals = []\nfor i in range(df.shape[0]):\n    t = df[\"math\"][i] + df[\"english\"][i] + df[\"history\"][i]\n    totals.append(t)\ndf[\"total\"] = totals\nprint(df)", "check": (out, code) => /df\s*\[\s*["']total["']\s*\]\s*=/.test(code) && /for\s/.test(code) && /Gal\|88\|78\|85\|251/.test(out) && /Shira\|89\|91\|92\|272/.test(out)}, {"num": 42, "difficulty": "medium", "topic": "New column", "q": "From <code>real-estate</code>: add a column <code>price_per_sqm</code> = price_m * 1000000 / sqm.",
    explain: "Price per meter is a ratio between two columns, so the calculation happens row by row. round without a second argument returns a whole number, which suits price per meter. With real data you must make sure the denominator is neither zero nor missing, otherwise the calculation will fail or give infinity instead of a number.", "starter": "", "solution": "df = data.load(\"real-estate\")\nprices = []\nfor i in range(df.shape[0]):\n    p = df[\"price_m\"][i] * 1000000 / df[\"sqm\"][i]\n    prices.append(round(p))\ndf[\"price_per_sqm\"] = prices\nprint(df)", "check": (out, code) => /price_per_sqm/.test(code) && /1000000/.test(code) && /df\s*\[\s*["']price_per_sqm["']\s*\]\s*=/.test(code) && /Florentin\|3\|75\|3\.2\|42667/.test(out)}, {"num": 43, "difficulty": "medium", "topic": "New column - condition", "q": "From <code>students</code>: add a <code>grade</code> column that is \"A\" if math &gt; 90, otherwise \"B\".",
    explain: "A one-line conditional expression, value_if_true if condition else value_if_false, is very convenient for building a categorical column. Notice the boundary: the condition is strictly greater than 90, so a score of exactly 90 gets a B. Here the comparison with > is valid because it operates on a single value pulled from the column, not on the whole column.", "starter": "", "solution": "df = data.load(\"students\")\ngrades = []\nfor i in range(df.shape[0]):\n    g = \"A\" if df[\"math\"][i] > 90 else \"B\"\n    grades.append(g)\ndf[\"grade\"] = grades\nprint(df)", "check": (out, code) => /df\s*\[\s*["']grade["']\s*\]\s*=/.test(code) && /["']A["']/.test(code) && /Yael\|92\|88\|90\|A/.test(out) && /Gal\|88\|78\|85\|B/.test(out)}, {"num": 44, "difficulty": "medium", "topic": "New column - calculation", "q": "from<code>football</code>: Add a column <code>goal_diff</code> = goals_for - goals_against.",
    explain: "Arithmetic operations between two columns are done element-by-element and return a new Series, so you can simply write df[\"goals_for\"] - df[\"goals_against\"] with no loop at all. Note that the goal difference can be negative, like for Beitar, and that is real information, not an error.", "starter": "", "solution": "df = data.load(\"football\")\ndiffs = []\nfor i in range(df.shape[0]):\n    diffs.append(df[\"goals_for\"][i] - df[\"goals_against\"][i])\ndf[\"goal_diff\"] = diffs\nprint(df)", "check": (out, code) => /df\s*\[\s*["']goal_diff["']\s*\]\s*=/.test(code) && /goals_against/.test(code) && /Maccabi Tel Aviv\|55\|17\|4\|3\|54\|21\|33/.test(out) && /Beitar\|38\|10\|8\|6\|32\|33\|-1/.test(out)}, {"num": 45, "difficulty": "medium", "topic": "apply", "q": "From <code>students</code>: use <code>apply</code> on the math column — add a column <code>math_pct</code> that is math/100.",
    explain: "apply runs a function on every value in a Series and returns a new Series; the original stays unchanged. This is the general way to apply logic that has no built-in equivalent. For simple arithmetic calculations like dividing by 100, df[\"math\"] / 100 is still preferable — it's shorter and faster than apply.", "starter": "", "solution": "df = data.load(\"students\")\nseries = df[\"math\"]\npcts = series.apply(lambda x: x/100)\ndf[\"math_pct\"] = list(pcts)\nprint(df)", "check": (out, code) => /\.apply\(/.test(code) && /lambda/.test(code) && /math_pct/.test(code) && /Gal\|88\|78\|85\|0\.88/.test(out) && /Maya\|95\|84\|88\|0\.95/.test(out)}, {"num": 46, "difficulty": "medium", "topic": "apply + map", "q": "From <code>cities-weather</code>: add a column <code>temp_f</code> = temp * 9/5 + 32 (Fahrenheit). Use a loop.",
    explain: "The formula for converting to Fahrenheit is multiplying by 9/5 and adding 32. Note that some results print as 73.40000000000001 rather than 73.4 despite round: this is how decimal numbers are stored in memory in binary, and even the constant 73.4 itself will look this way. round did in fact round — only the display isn't exact, and for tidy output you use a string format.", "starter": "", "solution": "df = data.load(\"cities-weather\")\nf_temps = []\nfor i in range(df.shape[0]):\n    f_temps.append(round(df[\"temp\"][i] * 9/5 + 32, 1))\ndf[\"temp_f\"] = f_temps\nprint(df)", "check": (out, code) => /temp_f/.test(code) && /9/.test(code) && /32/.test(code) && /df\s*\[\s*["']temp_f["']\s*\]\s*=/.test(code) && /Tel Aviv\|24\|68\|0\|75\.2/.test(out) && /Eilat\|31\|55\|0\|87\.8/.test(out)}, {"num": 47, "difficulty": "medium", "topic": "mean conditional", "q": "From <code>telecom-churn</code>: calculate the <b>average monthly_bill</b> only for customers who churned (churn=1). Print.",
    explain: "A conditional average is built in two steps: first filter to the desired mask, then apply mean on the column. The same result is also obtained from groupby(\"churn\")[\"monthly_bill\"].mean(), which gives the average for churners and non-churners at once. When comparing two groups, the groupby version is usually more readable.", "starter": "", "solution": "df = data.load(\"telecom-churn\")\nchurners = df[df[\"churn\"].eq(1)]\nprint(churners[\"monthly_bill\"].mean())", "check": (out, code) => /\.eq\(\s*1\s*\)/.test(code) && /\.mean\(/.test(code) && !/\.filter\(/.test(code) && /92\.8/.test(out)}, {"num": 48, "difficulty": "medium", "topic": "percent", "q": "From <code>telecom-churn</code>: calculate the <b>percentage of customers who churned</b> out of the total. Print a number.",
    explain: "A percentage is calculated as the ratio between the number of rows that passed the filter and the total number of rows, times 100. A shortcut worth knowing: when a column contains only 0 and 1, its average is exactly that ratio, so df[\"churn\"].mean() * 100 gives the same answer without filtering and without computing shape twice.", "starter": "", "solution": "df = data.load(\"telecom-churn\")\nchurners = df[df[\"churn\"].eq(1)]\npct = churners.shape[0] / df.shape[0] * 100\nprint(round(pct, 1))", "check": (out, code) => /\.eq\(\s*1\s*\)/.test(code) && /shape\s*\[\s*0\s*\]/.test(code) && !/\.filter\(/.test(code) && /46\.7/.test(out)}, {"num": 49, "difficulty": "medium", "topic": "rate", "q": "From <code>football</code>: for each team — compute <code>win_rate</code> = wins / (wins+draws+losses). Add it as a column.",
    explain: "Win rate is wins divided by total games, so you must first compute the denominator from the sum of three columns. Computing a ratio always requires making sure the denominator isn't zero: a team with no games would crash the loop with a division-by-zero error. Rounding to two decimal places makes the result readable.", "starter": "", "solution": "df = data.load(\"football\")\nrates = []\nfor i in range(df.shape[0]):\n    total = df[\"wins\"][i] + df[\"draws\"][i] + df[\"losses\"][i]\n    rates.append(round(df[\"wins\"][i] / total, 2))\ndf[\"win_rate\"] = rates\nprint(df)", "check": (out, code) => /win_rate/.test(code) && /df\s*\[\s*["']win_rate["']\s*\]\s*=/.test(code) && /draws/.test(code) && /Maccabi Tel Aviv\|55\|17\|4\|3\|54\|21\|0\.71/.test(out) && /Beitar\|38\|10\|8\|6\|32\|33\|0\.42/.test(out)}, {"num": 50, "difficulty": "medium", "topic": "progress", "q": "From <code>covid-israel</code>: add a column <code>positive_rate</code> = positive / tested * 100 (rounded to 2 digits).",
    explain: "The positive rate is the number of positives divided by the number tested, times 100. It is important to understand that this is a ratio, not a count: if the number of tests drops sharply, the rate can rise even without an increase in actual cases. That is why a real report always shows the numerator, the denominator, and the ratio together, not just the percentage.", "starter": "", "solution": "df = data.load(\"covid-israel\")\nrates = []\nfor i in range(df.shape[0]):\n    rates.append(round(df[\"positive\"][i] / df[\"tested\"][i] * 100, 2))\ndf[\"positive_rate\"] = rates\nprint(df)", "check": (out, code) => /positive_rate/.test(code) && /df\s*\[\s*["']positive_rate["']\s*\]\s*=/.test(code) && /tested/.test(code) && /01\/01\|3200\|45000\|180\|7\.11/.test(out) && /22\/01\|8200\|67000\|410\|12\.24/.test(out)}, {"num": 51, "difficulty": "medium", "topic": "Top N", "q": "From <code>salaries</code>: find the <b>3 highest earners</b>. Print names and salaries.",
    explain: "The pattern of descending sort followed by head(n) is the standard way to get a Top N, and selecting columns with double brackets leaves only what’s relevant to the report. An equivalent shortcut is nlargest(3, \"salary\"). Note that if two employees share third place, cutting at 3 will arbitrarily take only one of them.", "starter": "", "solution": "df = data.load(\"salaries\")\nresult = df.sort_values(\"salary\", ascending=False).head(3)\nprint(result[[\"name\", \"salary\"]])", "check": (out, code) => /sort_values/.test(code) && /head\(\s*3\s*\)/.test(code) && /\[\s*\[/.test(code) && /Hani\|28000/.test(out) && /Yossi\|23000/.test(out) && !/Benny/.test(out)}, {"num": 52, "difficulty": "medium", "topic": "Top N", "q": "From <code>real-estate</code>: <b>2 cheapest neighborhoods</b> by price per\"sqm. Calculate price_per_sqm and sort.",
    explain: "Notice that the cheapest apartment by total price is not necessarily the cheapest per square meter: Ramat Aviv costs 4.5 million and still ranks among the two cheapest per meter, because it is especially large. Normalizing by size is at the heart of analytical work — it turns incomparable numbers into a uniform metric.", "starter": "", "solution": "df = data.load(\"real-estate\")\npps = []\nfor i in range(df.shape[0]):\n    pps.append(df[\"price_m\"][i] * 1000000 / df[\"sqm\"][i])\ndf[\"price_per_sqm\"] = pps\nresult = df.sort_values(\"price_per_sqm\").head(2)\nprint(result[[\"neighborhood\", \"price_per_sqm\"]])", "check": (out, code) => /head\(\s*2\s*\)/.test(code) && /price_per_sqm/.test(code) && /sort_values/.test(code) && /Kiryat Shalom\|29230/.test(out) && /Ramat Aviv\|34615/.test(out) && !/Neve Tzedek/.test(out)}, {"num": 53, "difficulty": "medium", "topic": "Bottom N", "q": "From <code>students</code>: the <b>3 weakest students</b> in math. Print name + math.",
    explain: "To find the lowest values you sort ascending and take the first ones; the equivalent shortcut is nsmallest(3, \"math\"). Important point: missing values in the sort column are pushed to the end of the table by default, so they won't accidentally end up in the list of weakest — behavior you can change with na_position.", "starter": "", "solution": "df = data.load(\"students\")\nresult = df.sort_values(\"math\", ascending=True).head(3)\nprint(result[[\"name\", \"math\"]])", "check": (out, code) => /sort_values/.test(code) && /ascending\s*=\s*True/.test(code) && /head\(\s*3\s*\)/.test(code) && /Aviv\|70/.test(out) && /Tomer\|76/.test(out) && !/Gal/.test(out)}, {"num": 54, "difficulty": "medium", "topic": "Sort by name", "q": "From <code>real-estate</code>: sort neighborhoods by <b>alphabetical</b> name. Print neighborhood.",
    explain: "sort_values also works on text columns, and the sort is done by character value, not by language rules. So in Hebrew and other languages the order can look surprising, and in English all uppercase letters come before lowercase ones. When the order matters to the end user, sort by a normalized key rather than by the raw string.", "starter": "", "solution": "df = data.load(\"real-estate\")\nresult = df.sort_values(\"neighborhood\", ascending=True)\nprint(result[\"neighborhood\"])", "check": (out, code) => /sort_values\(\s*["']neighborhood["']/.test(code) && /Babylonian/.test(out) && /'Babylonian'/.test(out) && /'Ramat Aviv'/.test(out)}, {"num": 55, "difficulty": "medium", "topic": "pct_change", "q": "From <code>sales</code>: calculate the <code>pct_change</code> of revenue (percent change between months). Print the Series.",
    explain: "pct_change calculates the relative change between each value and the one before it. The first value is always empty since it has no comparison point, so average calculations on the result must ignore it. Note that the values are fractions, not percentages: 0.3684 means a 36.84 percent increase, and to get percentages you multiply by 100.", "starter": "", "solution": "df = data.load(\"sales\")\nchanges = df[\"revenue\"].pct_change()\nprint(changes)", "check": (out, code) => /pct_change/.test(code) && /df\s*\[\s*["']revenue["']\s*\]/.test(code) && /None/.test(out) && /0\.3684/.test(out) && /-0\.155/.test(out)}, {"num": 56, "difficulty": "medium", "topic": "cumsum", "q": "From <code>sales</code>: calculate the <code>cumsum</code> of revenue (cumulative sum). Print.",
    explain: "cumsum returns a running sum: each value is the sum of everything before it including itself. So the last value, 720000, equals exactly the sum of the entire column — a convenient sanity check. It's important to remember that cumsum depends entirely on row order, so it's meaningful only when the table is sorted chronologically.", "starter": "", "solution": "df = data.load(\"sales\")\ncum = df[\"revenue\"].cumsum()\nprint(cum)", "check": (out, code) => /cumsum/.test(code) && /df\s*\[\s*["']revenue["']\s*\]/.test(code) && /45000/.test(out) && /720000/.test(out)}, {"num": 57, "difficulty": "medium", "topic": "A complex formula", "q": "From <code>football</code>: for each team - calculate <code>efficiency</code> = goals_for / (wins+draws+losses). Add as a column.",
    explain: "Normalizing by number of games played lets you compare teams that played a different number of games. Notice the column name: efficiency is vague, while goals_per_game would accurately describe what's actually computed. Precise column names are part of the analysis, because they prevent the report from being misread later.", "starter": "", "solution": "df = data.load(\"football\")\neffs = []\nfor i in range(df.shape[0]):\n    total = df[\"wins\"][i] + df[\"draws\"][i] + df[\"losses\"][i]\n    effs.append(round(df[\"goals_for\"][i] / total, 2))\ndf[\"efficiency\"] = effs\nprint(df[[\"team\", \"efficiency\"]])", "check": (out, code) => /efficiency/.test(code) && /goals_for/.test(code) && /df\s*\[\s*["']efficiency["']\s*\]\s*=/.test(code) && /Maccabi Tel Aviv\|2\.25/.test(out) && /Beitar\|1\.33/.test(out)}, {"num": 58, "difficulty": "medium", "topic": "A complex formula", "q": "From <code>covid-israel</code>: calculate the <b>average positive_rate</b> for the first week vs. the last week. Use head(4).tail(4).",
    explain: "head and tail cut off the start and end of the period and let you compare two time windows. Look at the result itself: 9.54 vs 9.74 are almost the same, meaning the positive rate barely changed — even though the absolute number of cases dropped from 3200 to 2400. This is exactly why you look at ratios and not just counts.", "starter": "", "solution": "df = data.load(\"covid-israel\")\nrates = []\nfor i in range(df.shape[0]):\n    rates.append(df[\"positive\"][i] / df[\"tested\"][i] * 100)\ndf[\"rate\"] = rates\nfirst = df.head(4)\nlast = df.tail(4)\nprint(\"First 4 avg:\", first[\"rate\"].mean())\nprint(\"Last 4 avg:\", last[\"rate\"].mean())", "check": (out, code) => /head\(\s*4\s*\)/.test(code) && /tail\(\s*4\s*\)/.test(code) && /\.mean\(/.test(code) && /First 4 avg: 9\.54/.test(out) && /Last 4 avg: 9\.74/.test(out)}, {"num": 59, "difficulty": "medium", "topic": "groupby + sort", "q": "From <code>salaries</code>: group by department, calculate the average, and sort from the highest department to lowest.",
    explain: "When you group and then average, it's worth first removing text columns that have no meaning in the aggregation, otherwise you get empty columns or an error. After grouping, the result is a regular table in every respect, so you can go on and sort it like any other DataFrame. Chaining a group-by and a sort is the most common pattern in management reports.", "starter": "", "solution": "df = data.load(\"salaries\")\ngrouped = df.drop(columns=[\"name\"]).groupby(\"department\").mean()\nresult = grouped.sort_values(\"salary\", ascending=False)\nprint(result)", "check": (out, code) => /groupby/.test(code) && /sort_values/.test(code) && /24500/.test(out) && /13000/.test(out) && out.indexOf("R&D") >= 0 && out.indexOf("R&D") < out.indexOf("Sales") && out.indexOf("Sales") < out.indexOf("Marketing")}, {"num": 60, "difficulty": "medium", "topic": "groupby + filter", "q": "From <code>telecom-churn</code>: group churners (churn=1) by plan and count. Print.",
    explain: "Filtering and then grouping is a common sequence, but note the result: the standard category disappeared entirely from the table, because no customer on that plan churned. groupby shows only groups that have rows after filtering, so a report like this can hide exactly the most interesting group — the one with zero cases.", "starter": "", "solution": "df = data.load(\"telecom-churn\")\nchurners = df[df[\"churn\"].eq(1)]\nresult = churners.groupby(\"plan\").count()\nprint(result)", "check": (out, code) => /\.eq\(\s*1\s*\)/.test(code) && /groupby/.test(code) && !/\.filter\(/.test(code) && /premium\|4/.test(out) && /basic\|3/.test(out) && !/standard/.test(out)}, {"num": 61, "difficulty": "medium", "topic": "drop", "q": "From <code>students</code>: remove the <code>history</code> column. Print it.",
    explain: "drop with columns removes columns and returns a new table — the original table stays intact, so you must save the result in a variable. The same method also removes rows if you pass index instead of columns. Note that passing a column name that doesn’t exist will raise an error, unless you add errors=\"ignore\".", "starter": "", "solution": "df = data.load(\"students\")\nresult = df.drop(columns=[\"history\"])\nprint(result)", "check": (out, code) => /drop\(/.test(code) && /columns\s*=/.test(code) && /history/.test(code) && /name\|math\|english/.test(out) && !/history/.test(out)}, {"num": 62, "difficulty": "medium", "topic": "rename", "q": "From <code>students</code>: rename the column <code>math</code> to <code>math_score</code>. Print.",
    explain: "rename takes a dictionary shaped old-name to new-name and changes only what's in it. The important point: if you accidentally write \"Math\" instead of \"math\", pandas won't warn you — it simply won't change anything, and it'll look as if the code didn't work. So after rename it's always worth printing columns to check.", "starter": "", "solution": "df = data.load(\"students\")\nresult = df.rename(columns={\"math\": \"math_score\"})\nprint(result)", "check": (out, code) => /rename/.test(code) && /columns\s*=\s*\{/.test(code) && /math_score/.test(out) && /name\|math_score\|english\|history/.test(out)}, {"num": 63, "difficulty": "medium", "topic": "fillna", "q": "Create a DataFrame with <code>None</code> values: <code>{\"a\": [1, None, 3], \"b\": [4, 5, None]}</code>. Fill None with 0 and print.",
    explain: "fillna replaces missing values with a value you give and returns a new table. But filling with zero isn’t a technical decision, it’s an analytical one: \"no data\" and \"the value is zero\" are completely different things, and zero drags down averages and distorts the distribution. Sometimes it’s more correct to fill with the mean or median, and sometimes to leave it missing.", "starter": "", "solution": "df = DataFrame({\"a\": [1, None, 3], \"b\": [4, 5, None]})\nresult = df.fillna(0)\nprint(result)", "check": (out, code) => /fillna\(\s*0\s*\)/.test(code) && /DataFrame\(/.test(code) && /1\|4/.test(out) && /0\|5/.test(out) && /3\|0/.test(out)}, {"num": 64, "difficulty": "medium", "topic": "dropna", "q": "Create a DataFrame: <code>{\"a\": [1, None, 3], \"b\": [4, 5, 6]}</code>. Remove rows with None.",
    explain: "dropna removes every row that has at least one missing value — notice that here it also deletes the valid value 5 in column b, just because its neighbor in column a is missing. In wide tables this can wipe out most of the data. You can limit the check to specific columns with subset, or require a minimum number of present values with thresh.", "starter": "", "solution": "df = DataFrame({\"a\": [1, None, 3], \"b\": [4, 5, 6]})\nresult = df.dropna()\nprint(result)", "check": (out, code) => /dropna/.test(code) && /DataFrame\(/.test(code) && /1\|4/.test(out) && /3\|6/.test(out) && !/\|5/.test(out)}, {"num": 65, "difficulty": "medium", "topic": "drop_duplicates", "q": "Create a DataFrame: <code>{\"a\": [1, 2, 1, 3], \"b\": [4, 5, 4, 6]}</code>. Remove duplicates.",
    explain: "drop_duplicates compares all columns together by default, so a row is considered a duplicate only if it's completely identical. In practice you usually want to identify duplicates by a business key, like customer number, and then pass subset. The keep parameter determines which copy is kept — the first, the last, or none.", "starter": "", "solution": "df = DataFrame({\"a\": [1, 2, 1, 3], \"b\": [4, 5, 4, 6]})\nresult = df.drop_duplicates()\nprint(result)", "check": (out, code) => /drop_duplicates/.test(code) && /DataFrame\(/.test(code) && /1\|4/.test(out) && /2\|5/.test(out) && /3\|6/.test(out)}, {"num": 66, "difficulty": "medium", "topic": "astype", "q": "From <code>football</code>: convert the <code>points</code> column to <code>float</code>. Use <code>astype</code>.",
    explain: "astype takes only the target type, and you apply it to the column: df[\"points\"].astype(float). To convert several columns at once, you can pass a dict to the whole table, df.astype({\"points\": float}). Note that the conversion fails with an error if there's a value that can't be converted, and for more forgiving handling you use to_numeric with errors.", "starter": "", "solution": "df = data.load(\"football\")\ndf[\"points\"] = df[\"points\"].astype(float)\nprint(df[\"points\"])", "check": (out, code) => /\.astype\(\s*float\s*\)/.test(code) && /df\s*\[\s*["']points["']\s*\]\s*=/.test(code) && /55\.0/.test(out) && /38\.0/.test(out)}, {"num": 67, "difficulty": "medium", "topic": "clip", "q": "From <code>salaries</code>: clip the <code>salary</code> column between 15000 and 25000.",
    explain: "clip trims extreme values into a range: everything below lower becomes lower and everything above upper becomes upper. Note that Hani's salary dropped from 28000 to 25000 and Carmel's rose from 12000 to 15000 — the original data was lost. clip is useful for stabilizing charts and models, but after it you can no longer identify who the outlier was.", "starter": "", "solution": "df = data.load(\"salaries\")\ndf[\"salary\"] = df[\"salary\"].clip(lower=15000, upper=25000)\nprint(df)", "check": (out, code) => /\.clip\(/.test(code) && /lower\s*=\s*15000/.test(code) && /upper\s*=\s*25000/.test(code) && /df\s*\[\s*["']salary["']\s*\]\s*=/.test(code) && /Hani\|R&D\|25000/.test(out) && /Carmel\|Marketing\|15000/.test(out)}, {"num": 68, "difficulty": "medium", "topic": "nunique", "q": "From <code>salaries</code>: how many different departments are there?",
    explain: "nunique counts distinct values, not rows: there are 12 employees here but only 3 departments. That's exactly the difference from count, which would return 12, and from shape[0], which is also 12. When analyzing a categorical column, nunique tells you how many categories there are, and value_counts tells you how large each one is.", "starter": "", "solution": "df = data.load(\"salaries\")\nprint(df[\"department\"].nunique())", "check": (out, code) => /nunique\(/.test(code) && /df\s*\[\s*["']department["']\s*\]/.test(code) && /(^|\D)3(\D|$)/.test(out)}, {"num": 69, "difficulty": "medium", "topic": "set_index", "q": "From <code>football</code>: turn the <code>team</code> column into an index (<code>set_index</code>).",
    explain: "set_index turns a column into the row label. The benefit is access by name instead of by number: after the operation you can retrieve a row with loc[\"Maccabi Haifa\"] instead of remembering its position. The index is also used for joining tables and for label-aligned calculations. reset_index returns the column to its regular place.", "starter": "", "solution": "df = data.load(\"football\")\nresult = df.set_index(\"team\")\nprint(result)\nprint(\"Index:\", list(result.index))", "check": (out, code) => /set_index/.test(code) && /\.index/.test(code) && /Index:/.test(out) && /Maccabi Tel Aviv/.test(out) && /Beitar/.test(out)}, {"num": 70, "difficulty": "medium", "topic": "isna", "q": "Create a DataFrame with None: <code>{\"x\": [1, None, 3]}</code>. Check with <code>isna()</code> and print.",
    explain: "isna returns a table of the same size where True marks a missing value. In practice you almost never look at this table in full, but rather at df.isna().sum(), which gives how many values are missing in each column — the first step in any data cleaning. Note that the opposite method is notna.", "starter": "", "solution": "df = DataFrame({\"x\": [1, None, 3]})\nprint(df.isna())", "check": (out, code) => /isna/.test(code) && /DataFrame\(/.test(code) && /False/.test(out) && /True/.test(out)}, {"num": 71, "difficulty": "medium", "topic": "Merge", "q": "Create 2 tables and join them with <code>merge</code>: employees={name:[\"Avi\",\"Bni\"], dept_id:[1,2]} and departments={dept_id:[1,2], dept_name:[\"Sales\",\"R&D\"]}.",
    explain: "merge joins two tables by a shared key column, exactly like JOIN in SQL. The default is inner: only rows that have a match in both tables are kept, and everything else disappears with no warning. So after every merge it's worth comparing shape before and after, to make sure you haven't accidentally lost rows.", "starter": "", "solution": "employees = DataFrame({\"name\": [\"Avi\", \"Bni\"], \"dept_id\": [1, 2]})\ndepartments = DataFrame({\"dept_id\": [1, 2], \"dept_name\": [\"Sales\", \"R&D\"]})\nresult = employees.merge(departments, on=\"dept_id\")\nprint(result)", "check": (out, code) => /merge/.test(code) && /on\s*=\s*["']dept_id["']/.test(code) && /Avi\|1\|Sales/.test(out) && /Bni\|2\|R&D/.test(out)}, {"num": 72, "difficulty": "medium", "topic": "Merge left", "q": "The same 2 tables — use <code>how=\"left\"</code>. Add a row to employees: dept_id=99 (doesn't exist). Print it.",
    explain: "how=\"left\" keeps all rows of the left table even when they have no match, and fills the columns from the right with a missing value. Here Carmel stays in the result with dept_name empty — and that’s exactly the point: to see who isn’t found in the mapping instead of silently losing them. Counting the missing values after a left join is an excellent quality check.", "starter": "", "solution": "employees = DataFrame({\"name\": [\"Avi\", \"Bni\", \"Carmel\"], \"dept_id\": [1, 2, 99]})\ndepartments = DataFrame({\"dept_id\": [1, 2], \"dept_name\": [\"Sales\", \"R&D\"]})\nresult = employees.merge(departments, on=\"dept_id\", how=\"left\")\nprint(result)", "check": (out, code) => /merge/.test(code) && /how\s*=\s*["']left["']/.test(code) && /Carmel\|99\|None/.test(out) && /Avi\|1\|Sales/.test(out)}, {"num": 73, "difficulty": "medium", "topic": "concat", "q": "Create 2 DataFrames identical in columns and concatenate them vertically (<code>concat</code>): df1={a:[1,2]} and df2={a:[3,4]}.",
    explain: "concat stacks tables on top of each other by rows, so it’s suited to combining monthly files into an annual table. Don’t confuse it with merge: concat adds rows, merge adds columns based on a key. After concat, the original indexes are concatenated and may repeat, so it’s common to renumber them.", "starter": "", "solution": "df1 = DataFrame({\"a\": [1, 2]})\ndf2 = DataFrame({\"a\": [3, 4]})\nresult = DataFrame.concat([df1, df2])\nprint(result)", "check": (out, code) => /concat/.test(code) && /df1/.test(code) && /df2/.test(code) && /\|1/.test(out) && /\|4/.test(out)}, {"num": 74, "difficulty": "medium", "topic": "dates", "q": "From <code>sales</code>: compare <code>revenue</code> in summer months (June, July, August) to winter (December, January, February). Print the totals.",
    explain: "isin is the right tool for filtering by a list of categories, and it's much more readable than a chain of eq combined with |. Note the interpretation: summer leads with 211000 vs 172000, but winter includes December, which is an unusual month with 89000. A sum of three months is very sensitive to a single outlier month, so it's worth looking at the median too.", "starter": "", "solution": "df = data.load(\"sales\")\nsummer = df[df[\"month\"].isin([\"June\",\"July\",\"August\"])]\nwinter = df[df[\"month\"].isin([\"December\",\"January\",\"February\"])]\nprint(\"Summer:\", summer[\"revenue\"].sum())\nprint(\"Winter:\", winter[\"revenue\"].sum())", "check": (out, code) => /\.isin\(/.test(code) && !/\.filter\(/.test(code) && /Summer: 211000/.test(out) && /Winter: 172000/.test(out)}, {"num": 75, "difficulty": "medium", "topic": "Visual representation", "q": "From <code>cities-weather</code>: find the city with the <b>highest ratio</b> between humidity and temp. Compute the ratio, sort, print the city name.",
    explain: "After sorting and slicing, the index labels remain those of the original rows — they aren’t renumbered. So [0] may raise a KeyError or return the wrong row, and iloc[0] is the safe way to take the first value by position. The rule: [] works by label, iloc[] works by position.", "starter": "", "solution": "df = data.load(\"cities-weather\")\nratios = []\nfor i in range(df.shape[0]):\n    ratios.append(df[\"humidity\"][i] / df[\"temp\"][i])\ndf[\"ratio\"] = ratios\nresult = df.sort_values(\"ratio\", ascending=False).head(1)\nprint(result[\"city\"].iloc[0])", "check": (out, code) => /humidity/.test(code) && /temp/.test(code) && /sort_values/.test(code) && /\.iloc\s*\[\s*0\s*\]/.test(code) && /Haifa/.test(out) && !/Eilat/.test(out)}, {"num": 76, "difficulty": "medium", "topic": "apply on series", "q": "From <code>students</code>: for the math column, create a new Series that shows \"Pass\" if > 80, otherwise \"Fail\". Use <code>apply</code>.",
    explain: "apply runs the function on each value individually, so inside the lambda x is a single number and you can use the > operator as usual. Note the boundary: the condition is strictly greater than, so a score of exactly 80 gets Fail. The result is a new Series — the original column hasn't changed.", "starter": "", "solution": "df = data.load(\"students\")\nresult = df[\"math\"].apply(lambda x: \"Pass\" if x > 80 else \"Fail\")\nprint(result)", "check": (out, code) => /\.apply\(/.test(code) && /lambda/.test(code) && /Pass/.test(code) && /'Pass'/.test(out) && /'Fail'/.test(out)}, {"num": 77, "difficulty": "medium", "topic": "map", "q": "From <code>salaries</code>: use <code>map</code> on the department column - return a Series of icons: Sales→💼, R&D→🔬, Marketing→📢.",
    explain: "map maps each value in a Series according to a dictionary, and it is the clean way to replace codes with readable labels. The critical point: a value that does not appear in the dictionary becomes a missing value with no warning at all. So after map it is always worth checking isna().sum() and making sure the mapping covered every category.", "starter": "", "solution": "df = data.load(\"salaries\")\nicons = {\"Sales\": \"💼\", \"R&D\": \"🔬\", \"Marketing\": \"📢\"}\nresult = df[\"department\"].map(icons)\nprint(result)", "check": (out, code) => /\.map\(/.test(code) && /Sales/.test(code) && /Marketing/.test(code) && /💼/.test(out) && /🔬/.test(out) && /📢/.test(out)}, {"num": 78, "difficulty": "medium", "topic": "rounding", "q": "From <code>real-estate</code>: round the price_m column into a new column <code>price_rounded</code> (to 1 digit).",
    explain: "Notice that the new column came out identical to the original: all the prices were already at one decimal place, so rounding did not change anything. That is a good reminder to check the data before applying an operation. Instead of a loop you can write df[\"price_m\"].round(1) and round the whole column at once.", "starter": "", "solution": "df = data.load(\"real-estate\")\nrounded = []\nfor i in range(df.shape[0]):\n    rounded.append(round(df[\"price_m\"][i], 1))\ndf[\"price_rounded\"] = rounded\nprint(df)", "check": (out, code) => /round\(/.test(code) && /df\s*\[\s*["']price_rounded["']\s*\]\s*=/.test(code) && /Florentin\|3\|75\|3\.2\|3\.2/.test(out) && /Neve Tzedek\|4\|110\|6\.8\|6\.8/.test(out)}, {"num": 79, "difficulty": "medium", "topic": "min/max combine", "q": "From <code>students</code>: find the <b>highest total score</b> among math/english/history for each student. Print their name.",
    explain: "After sorting and slicing, always access the value with iloc[0] and not with [0], because the labels remain those of the original rows. A shorter alternative: df[\"total\"].idxmax() directly returns the row label with the highest value, and then df.loc[label, \"name\"] gives the name without any sorting at all.", "starter": "", "solution": "df = data.load(\"students\")\ntotals = []\nfor i in range(df.shape[0]):\n    t = df[\"math\"][i] + df[\"english\"][i] + df[\"history\"][i]\n    totals.append(t)\ndf[\"total\"] = totals\nresult = df.sort_values(\"total\", ascending=False).head(1)\nprint(result[\"name\"].iloc[0])", "check": (out, code) => /sort_values/.test(code) && /head\(\s*1\s*\)/.test(code) && /\.iloc\s*\[\s*0\s*\]/.test(code) && /Shira/.test(out) && !/Maya/.test(out)}, {"num": 80, "difficulty": "medium", "topic": "reset_index", "q": "From <code>football</code>: use <code>reset_index</code> to add a numbering column.",
    explain: "reset_index moves the index back to a regular column and renumbers the rows from zero. Its real use is after filtering or sorting, when the labels are no longer sequential and become confusing. If the old index does not matter to you, reset_index(drop=True) renumbers without adding a column.", "starter": "", "solution": "df = data.load(\"football\")\nresult = df.reset_index()\nprint(result)", "check": (out, code) => /reset_index/.test(code) && /index\|team/.test(out) && /0\|Maccabi Tel Aviv/.test(out)}, {"num": 81, "difficulty": "hard", "topic": "Complex journey", "q": "From <code>telecom-churn</code>: find the <b>plan</b> with the <b>highest churn rate</b>. Print the plan name.",
    explain: "Since churn is a column of 0s and 1s, its mean within each group is exactly the churn rate. idxmax returns the label of the group with the highest value, i.e. the track name itself, without sorting and without positional access. Analytical warning: basic leads with 0.75, but that’s based on only four customers.", "starter": "", "solution": "df = data.load(\"telecom-churn\")\nrates = df.groupby(\"plan\")[\"churn\"].mean()\nprint(rates.idxmax())", "check": (out, code) => /groupby\(\s*["']plan["']\s*\)/.test(code) && /churn/.test(code) && /idxmax/.test(code) && /basic/.test(out) && !/premium/.test(out)}, {"num": 82, "difficulty": "hard", "topic": "Double analysis", "q": "From <code>students</code>: for each student calculate the <b>range</b> (max minus min) of their 3 grades. Find the student with the largest range.",
    explain: "The range is the difference between the highest and lowest value, and it’s a simple spread measure but very sensitive to a single outlier. Don’t confuse it with variance or standard deviation, which measure spread around the mean and take all values into account. Here max and min are Python functions on a list, not pandas methods.", "starter": "", "solution": "df = data.load(\"students\")\nspreads = []\nfor i in range(df.shape[0]):\n    scores = [df[\"math\"][i], df[\"english\"][i], df[\"history\"][i]]\n    spreads.append(max(scores) - min(scores))\ndf[\"spread\"] = spreads\nresult = df.sort_values(\"spread\", ascending=False).head(1)\nprint(result[[\"name\", \"spread\"]])", "check": (out, code) => /max\(/.test(code) && /min\(/.test(code) && /sort_values/.test(code) && /history/.test(code) && /Maya\|11/.test(out)}, {"num": 83, "difficulty": "hard", "topic": "A complex formula", "q": "From <code>football</code>: calculate <code>points_per_game</code> = points / (wins+draws+losses) and sort. Print the Top 3.",
    explain: "Points per game normalize the score by the number of games and let you compare teams that played a different number of games. Note that here the ranking comes out identical to the ranking by points, because all the teams played 24 games — normalizing only changes the picture when the denominators differ, for example mid-season.", "starter": "", "solution": "df = data.load(\"football\")\nppgs = []\nfor i in range(df.shape[0]):\n    games = df[\"wins\"][i] + df[\"draws\"][i] + df[\"losses\"][i]\n    ppgs.append(round(df[\"points\"][i] / games, 2))\ndf[\"ppg\"] = ppgs\nresult = df.sort_values(\"ppg\", ascending=False).head(3)\nprint(result[[\"team\", \"ppg\"]])", "check": (out, code) => /points/.test(code) && /head\(\s*3\s*\)/.test(code) && /sort_values/.test(code) && /Maccabi Tel Aviv\|2\.29/.test(out) && /Maccabi Haifa\|2/.test(out)}, {"num": 84, "difficulty": "hard", "topic": "multi-aggregation", "q": "From <code>salaries</code>: for each department - print: number of employees, average salary, standard deviation. Build it manually.",
    explain: "Looping over unique values is the manual way of doing what groupby does automatically, and it's useful for understanding what happens under the hood. Note the standard deviation: for Marketing it's calculated on only three employees, and a dispersion measure on such a small sample isn't stable and no conclusions should be drawn from it.", "starter": "", "solution": "df = data.load(\"salaries\")\ndepts = df[\"department\"].unique()\nfor d in depts:\n    sub = df[df[\"department\"].eq(d)]\n    print(d, \"count:\", sub.shape[0], \"avg:\", round(sub[\"salary\"].mean(), 1), \"std:\", round(sub[\"salary\"].std(), 1))", "check": (out, code) => /\.eq\(/.test(code) && /unique/.test(code) && /\.std\(/.test(code) && !/\.filter\(/.test(code) && /Sales count: 5/.test(out) && /R&D count: 4/.test(out) && /std:/.test(out)}, {"num": 85, "difficulty": "hard", "topic": "merge + groupby", "q": "Create 2 tables, merge them, then groupby. employees={name:[\"Avi\",\"Bni\",\"Galit\"], dept_id:[1,2,1], salary:[15000,22000,18000]} and departments={dept_id:[1,2], dept_name:[\"Sales\",\"R&D\"]}. After merging - compute average salary by dept_name.",
    explain: "The sequence join-then-group is the heart of working with several tables: first you bring in the readable name from the dimension table, then you group by it. It's important to explicitly choose the aggregation column — without that, an average of dept_id would also get computed, a number that's mathematically valid but has no business meaning whatsoever.", "starter": "", "solution": "employees = DataFrame({\"name\": [\"Avi\",\"Bni\",\"Galit\"], \"dept_id\": [1,2,1], \"salary\": [15000,22000,18000]})\ndepartments = DataFrame({\"dept_id\": [1,2], \"dept_name\": [\"Sales\",\"R&D\"]})\nmerged = employees.merge(departments, on=\"dept_id\")\nresult = merged.groupby(\"dept_name\")[\"salary\"].mean()\nprint(result)", "check": (out, code) => /merge/.test(code) && /groupby\(\s*["']dept_name["']\s*\)/.test(code) && /salary/.test(code) && /Sales\s+16500/.test(out) && /R&D\s+22000/.test(out)}, {"num": 86, "difficulty": "hard", "topic": "pct change", "q": "From <code>sales</code>: which month had <b>the biggest jump</b> in revenue compared to the previous month? Print the month name.",
    explain: "pct_change measures relative, not absolute, change, so a month that jumped from 10 to 20 beats a month that rose from 1000 to 1500. Note that January can never win here, since it has no previous month and its value is missing. After sorting, access the value with iloc[0], since the labels are not renumbered.", "starter": "", "solution": "df = data.load(\"sales\")\nchanges = df[\"revenue\"].pct_change()\ndf[\"change\"] = list(changes)\nresult = df.sort_values(\"change\", ascending=False).head(1)\nprint(result[\"month\"].iloc[0])", "check": (out, code) => /pct_change/.test(code) && /sort_values/.test(code) && /\.iloc\s*\[\s*0\s*\]/.test(code) && /December/.test(out) && !/July/.test(out)}, {"num": 87, "difficulty": "hard", "topic": "multi-filter + agg", "q": "From <code>telecom-churn</code>: for customers with <code>tenure_months &gt; 30</code> - what's the churn rate? Print a percentage.",
    explain: "The combination of filtering then averaging a flag column is a recurring pattern: mean on a column of 0s and 1s returns exactly the rate, and multiplying by 100 turns it into a percentage. The result here is surprising — it's actually the veteran customers who churn more, which turns the common assumption on its head and warrants further investigation.", "starter": "", "solution": "df = data.load(\"telecom-churn\")\nveterans = df[df[\"tenure_months\"].gt(30)]\nchurn_rate = veterans[\"churn\"].mean() * 100\nprint(round(churn_rate, 1))", "check": (out, code) => /\.gt\(\s*30\s*\)/.test(code) && /\.mean\(/.test(code) && !/\.filter\(/.test(code) && /57\.1/.test(out)}, {"num": 88, "difficulty": "hard", "topic": "segmentation", "q": "From <code>salaries</code>: segment employees into categories: Junior (years &lt; 3), Mid (3-5), Senior (&gt;5). Add as a column.",
    explain: "In segmentation, the boundaries are the important decision: they must cover every value and not overlap each other. The order of if/elif is what guarantees this — once a condition is met, the rest aren’t checked at all. pandas has a dedicated tool for this called cut, which takes a list of boundaries and a list of labels and does the same thing in one line.", "starter": "", "solution": "df = data.load(\"salaries\")\nsegments = []\nfor i in range(df.shape[0]):\n    y = df[\"years\"][i]\n    if y < 3: segments.append(\"Junior\")\n    elif y <= 5: segments.append(\"Mid\")\n    else: segments.append(\"Senior\")\ndf[\"segment\"] = segments\nprint(df)", "check": (out, code) => /Junior/.test(code) && /Senior/.test(code) && /df\s*\[\s*["']segment["']\s*\]\s*=/.test(code) && /Avi\|Sales\|15000\|2\|Junior/.test(out) && /Hila\|R&D\|25000\|7\|Senior/.test(out)}, {"num": 89, "difficulty": "hard", "topic": "top by group", "q": "From <code>salaries</code>: in each department - find the employee with the highest salary. Print name, department, salary.",
    explain: "This is the top-per-group pattern: iterate over each category, filter to it, sort, and take the first one. Note the use of iloc[0] — after filtering and sorting the labels don't start from zero. If two employees share the highest salary in the same department, head(1) will take only one of them without warning.", "starter": "", "solution": "df = data.load(\"salaries\")\ndepts = df[\"department\"].unique()\nfor d in depts:\n    sub = df[df[\"department\"].eq(d)]\n    top = sub.sort_values(\"salary\", ascending=False).head(1)\n    print(top[\"name\"].iloc[0], \"-\", d, \"-\", top[\"salary\"].iloc[0])", "check": (out, code) => /\.eq\(/.test(code) && /\.iloc\s*\[\s*0\s*\]/.test(code) && /sort_values/.test(code) && !/\.filter\(/.test(code) && /Liat - Sales - 19000/.test(out) && /Hani - R&D - 28000/.test(out)}, {"num": 90, "difficulty": "hard", "topic": "distance analysis", "q": "From <code>cities-weather</code>: find the <b>two cities</b> whose difference in <code>temp</code> is the largest. Print their names.",
    explain: "The maximum gap between two values is always obtained between the minimum and the maximum, so it's enough to sort and take the edges — no need to check every pair. The critical point: after sort_values the labels stay those of the original rows, so [0] would return the first row of the original table, not the smallest one. iloc[0] and iloc[-1] work by position, so they're the correct choice here.", "starter": "", "solution": "df = data.load(\"cities-weather\")\nsorted_df = df.sort_values(\"temp\", ascending=True)\ncoldest = sorted_df[\"city\"].iloc[0]\nhottest = sorted_df[\"city\"].iloc[-1]\ngap = sorted_df[\"temp\"].iloc[-1] - sorted_df[\"temp\"].iloc[0]\nprint(\"Coldest:\", coldest, \"Hottest:\", hottest, \"Gap:\", gap)", "check": (out, code) => /sort_values/.test(code) && /\.iloc\s*\[\s*0\s*\]/.test(code) && /\.iloc\s*\[\s*-1\s*\]/.test(code) && /Tzfat/.test(out) && /Eilat/.test(out) && /14/.test(out) && !/Tel Aviv/.test(out)}, {"num": 91, "difficulty": "hard", "topic": "correlation", "q": "From <code>football</code>: check whether there's a relationship between wins and goals_for. Calculate whether the teams with the most wins also have the most goals. Compare the Top 3.",
    explain: "The two lists came out identical, which hints at a relationship between wins and goals — but a hint is not proof. Overlap between two lists is not a correlation measure, and with only five teams it could be entirely coincidental. For a real measurement you use corr, which returns a number between minus one and one, and it too does not indicate causation.", "starter": "", "solution": "df = data.load(\"football\")\ntop_wins = df.sort_values(\"wins\", ascending=False).head(3)\ntop_goals = df.sort_values(\"goals_for\", ascending=False).head(3)\nprint(\"Top by wins:\", list(top_wins[\"team\"]))\nprint(\"Top by goals:\", list(top_goals[\"team\"]))", "check": (out, code) => /sort_values/.test(code) && /wins/.test(code) && /goals_for/.test(code) && /Top by wins:/.test(out) && /Top by goals:/.test(out) && /Maccabi Haifa/.test(out)}, {"num": 92, "difficulty": "hard", "topic": "final analysis", "q": "From <code>real-estate</code>: calculate <b>price_per_sqm</b> for each neighborhood, then print <b>overall statistics</b>: average, minimum, and maximum.",
    explain: "The three metrics together tell a story that none of them tells alone: the maximum is more than double the minimum, meaning the market isn't homogeneous and the average alone is misleading. This is why a real report never shows an average without a dispersion measure alongside it, and sometimes a median, which is less sensitive to outliers, is preferable.", "starter": "", "solution": "df = data.load(\"real-estate\")\npps = []\nfor i in range(df.shape[0]):\n    pps.append(df[\"price_m\"][i] * 1000000 / df[\"sqm\"][i])\ndf[\"pps\"] = pps\nprint(\"Mean:\", round(df[\"pps\"].mean()))\nprint(\"Min:\", round(df[\"pps\"].min()))\nprint(\"Max:\", round(df[\"pps\"].max()))", "check": (out, code) => /sqm/.test(code) && /\.mean\(/.test(code) && /\.min\(/.test(code) && /\.max\(/.test(code) && /Mean: 44583/.test(out) && /Min: 29231/.test(out) && /Max: 61818/.test(out)}, {"num": 93, "difficulty": "hard", "topic": "aggregation 2-step", "q": "From <code>telecom-churn</code>: for each plan, compute the <b>average tenure_months</b> only for customers who churned. Print.",
    explain: "Two-stage aggregation: first filter to the relevant population, and only then group. The result reveals two completely different profiles — premium churners were long-time customers, while basic churners left almost immediately. Notice that standard disappears from the table because no such customer churned; a group with zero cases simply doesn’t appear.", "starter": "", "solution": "df = data.load(\"telecom-churn\")\nchurners = df[df[\"churn\"].eq(1)]\nresult = churners.groupby(\"plan\")[\"tenure_months\"].mean()\nprint(result)", "check": (out, code) => /\.eq\(\s*1\s*\)/.test(code) && /groupby\(\s*["']plan["']\s*\)/.test(code) && /tenure_months/.test(code) && !/\.filter\(/.test(code) && /premium\s+66/.test(out) && /basic\s+9/.test(out) && !/standard/.test(out)}, {"num": 94, "difficulty": "hard", "topic": "multi-criteria", "q": "From <code>students</code>: find students who are <b>good at everything</b> - math &gt; 80 and english &gt; 80 and history &gt; 80. Count how many.",
    explain: "You can chain as many conditions as you want with &, and each condition narrows down the result. When you only want to count, there's a nice shortcut: the boolean mask is also a vector of zeros and ones, so mask.sum() returns the number of rows that passed directly — without building a filtered table at all.", "starter": "", "solution": "df = data.load(\"students\")\ngood = df[df[\"math\"].gt(80) & df[\"english\"].gt(80) & df[\"history\"].gt(80)]\nprint(\"Count:\", good.shape[0])", "check": (out, code) => /\.gt\(\s*80\s*\)/.test(code) && /&/.test(code) && !/lambda/.test(code) && /Count:\s*5/.test(out)}, {"num": 95, "difficulty": "hard", "topic": "data quality", "q": "From <code>covid-israel</code>: check — are there weeks where <code>positive_rate</code> &gt; 12%? If so — which ones?",
    explain: "After every filter it’s worth printing the number of rows found too, otherwise an empty table looks exactly like a bug in the code. Look at the result: only one week crossed the threshold, and at just 12.24 — very close to 12. A threshold that separates such close values is an arbitrary decision that should be stated, not an objective truth.", "starter": "", "solution": "df = data.load(\"covid-israel\")\nrates = []\nfor i in range(df.shape[0]):\n    rates.append(df[\"positive\"][i] / df[\"tested\"][i] * 100)\ndf[\"positive_rate\"] = rates\nhigh = df[df[\"positive_rate\"].gt(12)]\nprint(\"Found:\", high.shape[0])\nprint(high[[\"date\", \"positive_rate\"]])", "check": (out, code) => /\.gt\(\s*12\s*\)/.test(code) && /positive_rate/.test(code) && !/\.where\(/.test(code) && /Found:\s*1/.test(out) && /22\/01\|12\.23/.test(out)}, {"num": 96, "difficulty": "hard", "topic": "Sensitive case", "q": "From <code>real-estate</code>: find an <b>apartment cheaper than 3M NIS</b> with <b>5+ rooms</b>. Print the neighborhood name (if none exists - print \"None\").",
    explain: "The empty result is the correct answer: there is no apartment that is both cheaper than 3 million and has 5+ rooms, because size and price move together. The professional lesson is that code must handle the empty case explicitly — without checking shape[0], accessing the first value would crash, and in a real report a crash like that only surfaces for the user.", "starter": "", "solution": "df = data.load(\"real-estate\")\nresult = df[df[\"price_m\"].lt(3) & df[\"rooms\"].ge(5)]\nif result.shape[0] > 0:\n    print(result[\"neighborhood\"].iloc[0])\nelse:\n    print(\"none\")", "check": (out, code) => /\.lt\(\s*3\s*\)/.test(code) && /\.ge\(\s*5\s*\)/.test(code) && /shape\s*\[\s*0\s*\]/.test(code) && !/\.where\(/.test(code) && /Ein/.test(out)}, {"num": 97, "difficulty": "hard", "topic": "time series", "q": "From <code>sales</code>: find the <b>3 months</b> that contributed the <b>highest percentage to the annual total</b> (sort descending).",
    explain: "Computing a share of the total requires first the overall sum and then dividing each value by it. A simple sanity check: the sum of all percentages must come out to 100. The insight here is that three months out of twelve, i.e. a quarter of the time, generate about a third of annual revenue — a concentration that warrants operational attention.", "starter": "", "solution": "df = data.load(\"sales\")\ntotal = df[\"revenue\"].sum()\npcts = []\nfor i in range(df.shape[0]):\n    pcts.append(round(df[\"revenue\"][i] / total * 100, 1))\ndf[\"pct_of_year\"] = pcts\nresult = df.sort_values(\"pct_of_year\", ascending=False).head(3)\nprint(result[[\"month\", \"pct_of_year\"]])", "check": (out, code) => /\.sum\(/.test(code) && /sort_values/.test(code) && /head\(\s*3\s*\)/.test(code) && /December\|12\.4/.test(out) && /Yoni\|10/.test(out) && /August\|9\.9/.test(out)}, {"num": 98, "difficulty": "hard", "topic": "cross-table", "q": "From <code>football</code>: calculate <b>win percentage</b> + <b>average goals per game</b> for each team. Which team has the best balance (sum of both)?",
    explain: "Notice the problem with adding them: the win rate ranges between 0 and 1, while the average goals ranges around 2, so the second component almost completely dominates the weighted score. Adding metrics on different scales without normalizing is a common mistake — the correct way is to standardize each metric before adding, or to declare weights explicitly.", "starter": "", "solution": "df = data.load(\"football\")\nscores = []\nfor i in range(df.shape[0]):\n    total = df[\"wins\"][i] + df[\"draws\"][i] + df[\"losses\"][i]\n    win_pct = df[\"wins\"][i] / total\n    avg_goals = df[\"goals_for\"][i] / total\n    scores.append(round(win_pct + avg_goals, 2))\ndf[\"score\"] = scores\nresult = df.sort_values(\"score\", ascending=False).head(1)\nprint(result[[\"team\", \"score\"]])\nprint(\"Best:\", result[\"team\"].iloc[0])", "check": (out, code) => /wins/.test(code) && /goals_for/.test(code) && /sort_values/.test(code) && /\.iloc\s*\[\s*0\s*\]/.test(code) && /Best: Maccabi Tel Aviv/.test(out) && /2\.96/.test(out)}, {"num": 99, "difficulty": "hard", "topic": "complete analysis", "q": "From <code>telecom-churn</code>: \"Executive report: total customers, % churn, average bill, average tenure. Print.",
    explain: "A good executive report always shows both the absolute size and the rate: 46.7 percent churn sounds dramatic, but that's 7 customers out of 15, and you can't draw conclusions from it about a large population. Note that the average bill prints with a long decimal tail despite round — that's what floating-point arithmetic looks like, and in a real report you'd format the number as a string.", "starter": "", "solution": "df = data.load(\"telecom-churn\")\nchurners = df[df[\"churn\"].eq(1)]\nprint(\"Total customers:\", df.shape[0])\nprint(\"Churn rate:\", round(churners.shape[0] / df.shape[0] * 100, 1), \"%\")\nprint(\"Avg bill:\", round(df[\"monthly_bill\"].mean(), 1))\nprint(\"Avg tenure:\", round(df[\"tenure_months\"].mean(), 1))", "check": (out, code) => /\.eq\(\s*1\s*\)/.test(code) && /shape\s*\[\s*0\s*\]/.test(code) && !/\.filter\(/.test(code) && /Total customers: 15/.test(out) && /Churn rate: 46\.7/.test(out) && /Avg tenure: 38\.1/.test(out)}, {"num": 100, "difficulty": "hard", "topic": "🏆 Final challenge", "q": "🏆 <b>Final challenge</b>: from <code>salaries</code>: 1) add a column <code>annual_bonus</code> = salary * (years/10) 2) group by department and compute total bonus 3) find the department with the highest total bonus. Print its name.",

\n            return Series(self._data[key], name=key)\n        if isinstance(key, list):\n            # Boolean mask?\n            if len(key) == self._nrows and len(key) > 0 and isinstance(key[0], bool):\n                new_data = {}\n                for c in self._columns:\n                    new_data[c] = []\n                    for i in range(self._nrows):\n                        if key[i]:\n                            new_data[c].append(self._data[c][i])\n                return DataFrame(new_data)\n            # Column selection\n            new_data = {}\n            for c in key:\n                if c in self._data:\n                    new_data[c] = self._data[c]\n            return DataFrame(new_data)\n        raise TypeError(\"Invalid key type\")\n    \n    def __setitem__(self, key, value):\n        if isinstance(value, Series):\n            value = value._data\n        if isinstance(value, list):\n            if len(value) != self._nrows:\n                raise ValueError(\"Length mismatch\")\n            self._data[key] = list(value)\n        else:\n            self._data[key] = [value] * self._nrows\n        if key not in self._columns:\n            self._columns.append(key)\n    \n    def sort_values(self, by, ascending=True):\n        col_data = self._data[by]\n        indices = list(range(self._nrows))\n        # Handle None values - put at end\n        def sort_key(i):\n            v = col_data[i]\n            if v is None:\n                return (1, 0) if ascending else (0, 0)\n            return (0, v)\n        indices.sort(key=sort_key, reverse=not ascending)\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [self._data[c][i] for i in indices]\n        return DataFrame(new_data)\n    \n    def filter(self, col, op, value):\n        \"\"\"SQL-like filter: df.filter('age', '>', 18)\"\"\"\n        mask = []\n        col_data = self._data[col]\n        for v in col_data:\n            if v is None:\n                mask.append(False); continue\n            if op == \">\": mask.append(v > value)\n            elif op == \"<\": mask.append(v < value)\n            elif op == \">=\": mask.append(v >= value)\n            elif op == \"<=\": mask.append(v <= value)\n            elif op == \"==\": mask.append(v == value)\n            elif op == \"!=\": mask.append(v != value)\n            elif op == \"in\":\n                if isinstance(value, list): mask.append(v in value)\n                else: mask.append(False)\n            else:\n                raise ValueError(\"Unknown operator: \" + op)\n        return self[mask]\n    \n    def where(self, fn):\n        \"\"\"Filter rows: df.where(lambda row: row['age'] > 18)\"\"\"\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = []\n        for i in range(self._nrows):\n            row = {}\n            for c in self._columns:\n                row[c] = self._data[c][i]\n            if fn(row):\n                for c in self._columns:\n                    new_data[c].append(self._data[c][i])\n        return DataFrame(new_data)\n    \n    def apply(self, fn, axis=0):\n        \"\"\"Apply function. axis=0: per column. axis=1: per row.\"\"\"\n        if axis == 1:\n            # Per row - returns Series\n            result = []\n            for i in range(self._nrows):\n                row = {}\n                for c in self._columns:\n                    row[c] = self._data[c][i]\n                result.append(fn(row))\n            return Series(result)\n        # Per column\n        result = {}\n        for c in self._columns:\n            result[c] = fn(self._data[c])\n        return result\n    \n    def mean(self):\n        result = {}\n        for c in self._columns:\n            vals = []\n            for v in self._data[c]:\n                if isinstance(v, (int, float)) and not isinstance(v, bool):\n                    vals.append(v)\n            if vals:\n                result[c] = sum(vals) / len(vals)\n        return result\n    \n    def sum(self):\n        result = {}\n        for c in self._columns:\n            vals = []\n            for v in self._data[c]:\n                if isinstance(v, (int, float)) and not isinstance(v, bool):\n                    vals.append(v)\n            if vals:\n                result[c] = sum(vals)\n        return result\n    \n    def min(self):\n        result = {}\n        for c in self._columns:\n            vals = [v for v in self._data[c] if v is not None]\n            if vals: result[c] = min(vals)\n        return result\n    \n    def max(self):\n        result = {}\n        for c in self._columns:\n            vals = [v for v in self._data[c] if v is not None]\n            if vals: result[c] = max(vals)\n        return result\n    \n    def count(self):\n        \"\"\"Count non-null per column.\"\"\"\n        result = {}\n        for c in self._columns:\n            cnt = 0\n            for v in self._data[c]:\n                if v is not None:\n                    cnt += 1\n            result[c] = cnt\n        return result\n    \n    def describe(self):\n        result = {}\n        for c in self._columns:\n            vals = []\n            for v in self._data[c]:\n                if isinstance(v, (int, float)) and not isinstance(v, bool):\n                    vals.append(v)\n            if vals:\n                result[c] = {\n                    \"count\": len(vals),\n                    \"mean\": round(sum(vals)/len(vals), 2),\n                    \"min\": min(vals),\n                    \"max\": max(vals)\n                }\n        return result\n    \n    def to_dict(self):\n        return dict(self._data)\n    \n    # ===== Data cleaning =====\n    \n    def drop(self, columns=None, index=None):\n        \"\"\"Drop columns or rows.\"\"\"\n        if columns is not None:\n            cols_to_drop = columns if isinstance(columns, list) else [columns]\n            new_data = {}\n            new_cols = []\n
