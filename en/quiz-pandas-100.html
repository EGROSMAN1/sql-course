<style>
  :root {
    --bg: #0a0d1f; --bg2: #121530; --bg3: #1a1f3a; --bg4: #252a52;
    --border: #2a2f5c; --border2: #353a6b;
    --text: #f8fafc; --text2: #aab; --text3: #888fa6;
    --cyan: #00d4c8; --green: #00e5a0; --gold: #ffd700; --orange: #ff8800;
    --purple: #8b5cf6; --pink: #ec4899; --red: #ef4444;
    --easy: #10b981; --medium: #f59e0b; --hard: #ef4444;
    --panda: #8b5cf6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
  -webkit-tap-highlight-color: rgba(0,212,200,0.2);
  -webkit-text-size-adjust: 100%;
    font-family: -apple-system, "Heebo", "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    direction:ltr; line-height: 1.5;
  }

  .topbar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .home-btn {
    background: linear-gradient(135deg, var(--panda), #6b21a8);
    color: #fff;
    padding: 7px 12px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 700;
    font-size: 12.5px;
  }
  .score-pill {
    margin-inline-start: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, #2a1f0a, #4a3a1f);
    border: 1.5px solid var(--gold);
    padding: 5px 12px;
    border-radius: 14px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--gold);
  }
  .reset-score-btn {
    background: rgba(239,68,68,0.1);
    color: var(--red);
    border: 1px solid rgba(239,68,68,0.3);
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
  }

  .progress-strip {
    background: var(--bg2);
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 11.5px;
  }
  .progress-stat {
    display: flex; align-items: center; gap: 4px; color: var(--text2);
  }
  .progress-stat .val { font-weight: 700; }
  .progress-stat.easy .val { color: var(--easy); }
  .progress-stat.medium .val { color: var(--medium); }
  .progress-stat.hard .val { color: var(--hard); }
  .progress-bar-wrap {
    flex: 1; height: 6px; background: var(--bg);
    border-radius: 3px; overflow: hidden; margin-inline-start: 8px;
  }
  .progress-bar-fill {
    height: 100%; background: linear-gradient(90deg, var(--panda), var(--cyan));
    transition: width .5s;
  }

  .filter-bar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 8px 14px;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .filter-bar::-webkit-scrollbar { height: 0; }
  .filter-pill {
    padding: 6px 12px;
    background: var(--bg4);
    border: 1px solid var(--border2);
    border-radius: 14px;
    color: var(--text2);
    font-size: 11.5px;
    cursor: pointer;
    font-family: inherit;
    flex-shrink: 0;
  }
  .filter-pill.active {
    background: var(--panda); color: #fff; border-color: var(--panda); font-weight: 700;
  }
  .filter-pill.diff-easy.active { background: var(--easy); border-color: var(--easy); color: #000; }
  .filter-pill.diff-medium.active { background: var(--medium); border-color: var(--medium); color: #000; }
  .filter-pill.diff-hard.active { background: var(--hard); border-color: var(--hard); color: #fff; }
  .filter-search {
    flex: 1; min-width: 130px;
    padding: 6px 12px;
    background: var(--bg4);
    border: 1px solid var(--border2);
    border-radius: 14px;
    color: var(--text);
    font-size: 12px;
    font-family: inherit;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 14px;
  }

  .question-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
  }
  
  .q-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .q-num {
    background: linear-gradient(135deg, var(--panda), #6b21a8);
    color: #fff;
    padding: 4px 12px;
    border-radius: 8px;
    font-weight: 800;
    font-size: 14px;
  }
  .q-topic { flex: 1; font-size: 13px; color: var(--text); font-weight: 600; }
  .q-badges { display: flex; gap: 5px; flex-wrap: wrap; }
  .badge {
    padding: 3px 9px;
    border-radius: 10px;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .badge-diff-easy { background: rgba(16,185,129,0.18); color: var(--easy); }
  .badge-diff-medium { background: rgba(245,158,11,0.18); color: var(--medium); }
  .badge-diff-hard { background: rgba(239,68,68,0.18); color: var(--hard); }
  .badge-points {
    background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,136,0,0.15));
    color: var(--gold);
    border: 1px solid rgba(255,215,0,0.4);
  }
  .badge-earned {
    background: linear-gradient(135deg, var(--green), #00a884);
    color: #000;
  }

  .question-text {
    background: rgba(139,92,246,0.06);
    border-inline-start: 3px solid var(--panda);
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14.5px;
    line-height: 1.75;
    margin-bottom: 14px;
  }
  .question-text code {
    background: rgba(139,92,246,0.2);
    color: #c4b5fd;
    padding: 2px 8px;
    border-radius: 4px;
    font-family: "SF Mono", Monaco, Menlo, monospace;
    font-size: 12.5px;
  }
  .question-text b { color: var(--cyan); }

  .editor-label {
    font-size: 11.5px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 6px;
    font-weight: 700;
  }
  .code-editor {
    width: 100%;
    background: #0a0d1f;
    color: #e0e6ff;
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 12px;
    font-family: "SF Mono", Monaco, Menlo, "Courier New", monospace;
    font-size: 14px;
    direction: ltr;
    text-align: left;
    resize: vertical;
    line-height: 1.6;
    min-height: 140px;
    tab-size: 4;
    user-select: text;
    -webkit-user-select: text;
    -webkit-touch-callout: default;
  }
  .code-editor:focus { outline: none; border-color: var(--panda); }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: transform .15s;
  }
  .btn:hover, .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.6; cursor: wait; }
  .btn-run { background: linear-gradient(135deg, var(--green), #00a884); color: #000; }
  .btn-solution { background: linear-gradient(135deg, var(--gold), var(--orange)); color: #1a1a2e; }
  .btn-reset { background: rgba(239,68,68,0.1); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }

  .output-section { margin-top: 12px; display: none; }
  .output-section.show { display: block; }
  .output-box {
    background: #0a0d1f;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-family: "SF Mono", Monaco, Menlo, monospace;
    font-size: 13px;
    color: #e0e6ff;
    white-space: pre-wrap;
    direction: ltr;
    text-align: left;
    max-height: 280px;
    overflow-y: auto;
    min-height: 40px;
  }
  .output-box.error { color: #ff6b6b; }

  .verdict {
    margin-top: 10px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    display: none;
  }
  .verdict.show { display: block; animation: pop .4s ease; }
  @keyframes pop {
    0% { transform: scale(0.9); opacity: 0; }
    60% { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
  }
  .verdict.success {
    background: linear-gradient(135deg, rgba(0,229,160,0.15), rgba(139,92,246,0.15));
    color: var(--green);
    border: 2px solid var(--green);
  }
  .verdict.fail {
    background: rgba(255,176,32,0.1);
    color: var(--orange);
    border: 1px solid rgba(255,176,32,0.3);
  }
  .verdict .points-earned {
    display: block;
    font-size: 22px;
    margin: 4px 0;
    color: var(--gold);
  }

  .solution-section {
    margin-top: 18px;
    background: linear-gradient(135deg, rgba(255,215,0,0.08), rgba(255,136,0,0.04));
    border: 2px solid rgba(255,215,0,0.4);
    border-radius: 12px;
    padding: 16px;
    display: none;
  }
  .solution-section.show { display: block; animation: slide-in .4s ease; }
  @keyframes slide-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .solution-warning {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    color: var(--red);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    margin-bottom: 12px;
  }
  .solution-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,215,0,0.2);
  }
  .solution-header h3 { margin: 0; font-size: 17px; color: var(--gold); }
  .copy-btn {
    margin-inline-start: auto;
    background: rgba(255,215,0,0.15);
    color: var(--gold);
    border: 1px solid rgba(255,215,0,0.3);
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 11.5px;
    cursor: pointer;
    font-family: inherit;
  }
  .solution-code {
    background: #0a0d1f;
    border: 1px solid rgba(255,215,0,0.25);
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
  }
  .solution-code pre {
    margin: 0;
    color: var(--gold);
    font-family: "SF Mono", Monaco, Menlo, monospace;
    font-size: 13.5px;
    direction: ltr;
    text-align: left;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .nav-row {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    justify-content: space-between;
  }
  .nav-btn {
    background: var(--bg4);
    color: var(--text);
    border: 1px solid var(--border2);
    padding: 9px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
  }
  .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .confetti {
    position: fixed;
    top: -10px;
    width: 8px;
    height: 8px;
    pointer-events: none;
    z-index: 999;
  }

  @media (max-width: 480px) {
    .container { padding: 10px; }
    .question-card { padding: 11px; }
    .q-num { font-size: 13px; padding: 3px 10px; }
    .q-topic { font-size: 12px; }
    .badge { font-size: 11px; padding: 2px 7px; }
    .question-text { font-size: 13.5px; padding: 10px 13px; }
    .code-editor { font-size: 13px; padding: 10px; min-height: 110px; }
    .btn { padding: 9px 14px; font-size: 12.5px; }
    .solution-code pre { font-size: 12px; }
    .progress-strip { flex-wrap: wrap; gap: 6px; }
    .score-pill { padding: 4px 10px; font-size: 11px; }
  }

  /* === CODE EDITOR TOOLBAR === */
  .editor-wrap {
    position: relative;
  }
  .editor-toolbar {
    display: flex;
    gap: 4px;
    padding: 6px;
    background: var(--bg4);
    border: 1px solid var(--border2);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    flex-wrap: wrap;
  }
  .editor-toolbar .tb-btn {
    background: var(--bg3);
    color: var(--text2);
    border: 1px solid var(--border2);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    -webkit-tap-highlight-color: rgba(0,212,200,0.2);
  }
  .editor-toolbar .tb-btn:hover, .editor-toolbar .tb-btn:active {
    background: var(--cyan);
    color: #000;
    border-color: var(--cyan);
  }
  .editor-toolbar .tb-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .editor-toolbar .tb-btn.copied {
    background: var(--green);
    color: #000;
    border-color: var(--green);
  }
  .editor-wrap .code-editor {
    border-radius: 0 0 8px 8px !important;
    border-top: none !important;
  }
  
  @media (max-width: 480px) {
    .editor-toolbar { padding: 5px; gap: 3px; }
    .editor-toolbar .tb-btn { padding: 5px 8px; font-size: 11px; }
  }

 border:1px solid rgba(0,212,200,.26);font-size:13.5px;line-height:1.8;text-align:left;

<script>

window.PANDAS_QUIZ = [{"num": 1, "difficulty": "easy", "topic": "Creating a DataFrame", "q": "Create a <code>DataFrame</code> with 2 columns: <code>name</code> with \"Avi\" and \"Bni\", and <code>age</code> with 30 and 25. Print the table.",
    explain: "A DataFrame is built from a dictionary where each key is a column name and each value is the list of cells for that column. All the lists must be the same length, otherwise an error is thrown. Note that the order of the keys in the dictionary determines the order of the columns in the table.", "starter": "", "solution": "df = DataFrame({\"name\": [\"Avi\", \"Bni\"], \"age\": [30, 25]})\nprint(df)", "check": "(out, code) => /Avi/.test(out) && /30/.test(out) && /DataFrame\\(/.test(code)"}, {"num": 2, "difficulty": "easy", "topic": "Creating a DataFrame", "q": "Create a DataFrame of 3 cities: a <code>city</code> column with \"TLV\", \"JLM\", \"HFA\", and a <code>pop</code> column with 460000, 920000, 280000. Print it.",
    explain: "When building a DataFrame from a dictionary, each key becomes a column name and each list becomes the column's content. The three cities and the three numbers must be the same length — if one list is shorter, pandas will throw an error rather than fill in missing values on its own.", "starter": "", "solution": "df = DataFrame({\"city\": [\"TLV\", \"JLM\", \"HFA\"], \"pop\": [460000, 920000, 280000]})\nprint(df)", "check": (out, code) => /DataFrame\(/.test(code) && /TLV/.test(out) && /JLM/.test(out) && /920000/.test(out)}, {"num": 3, "difficulty": "easy", "topic": "Creating a DataFrame", "q": "From a <b>list of dictionaries</b>: <code>[{\"x\":1,\"y\":2}, {\"x\":3,\"y\":4}]</code> - create a DataFrame and print it.",
    explain: "There are two main ways to build a DataFrame: a dictionary of lists (column by column) or a list of dictionaries (row by row). In a list of dictionaries each dictionary is a row, and the keys become the column names. If one dictionary is missing a key that exists in another, pandas fills that cell with None instead of raising an error.", "starter": "", "solution": "df = DataFrame([{\"x\":1,\"y\":2}, {\"x\":3,\"y\":4}])\nprint(df)", "check": (out, code) => /DataFrame\(\s*\[/.test(code) && /x\|y/.test(out) && /1\|2/.test(out) && /3\|4/.test(out)}, {"num": 4, "difficulty": "easy", "topic": "shape and columns", "q": "Load the dataset <code>cities-weather</code>. Print the table's <code>shape</code>.",
    explain: "shape returns a tuple of (number of rows, number of columns). Note that this is an attribute, not a method — you write df.shape without parentheses. To get only the number of rows, use df.shape[0], and this is the standard way to count records.", "starter": "", "solution": "df = data.load(\"cities-weather\")\nprint(df.shape)", "check": (out, code) => /data\.load\(\s*["']cities-weather["']\s*\)/.test(code) && /\.shape/.test(code) && /\(\s*6\s*,\s*4\s*\)/.test(out)}, {"num": 5, "difficulty": "easy", "topic": "shape and columns", "q": "Load <code>students</code> and print the column names (<code>columns</code>).",
    explain: "df.columns returns the column names. Like shape, it's an attribute, not a method. Before any analysis it's worth running shape and columns to know what you're working with — how many rows there are and exactly what the columns are called, including case.", "starter": "", "solution": "df = data.load(\"students\")\nprint(df.columns)", "check": (out, code) => /data\.load/.test(code) && /\.columns/.test(code) && /name/.test(out) && /math/.test(out) && /english/.test(out) && /history/.test(out)}, {"num": 6, "difficulty": "easy", "topic": "head and tail", "q": "Load <code>students</code> and print the <b>first 3 rows</b>.",
    explain: "head(n) returns the first n rows; without an argument the default is 5. This is the first operation you do on any new table to peek at the data without flooding the screen. Note that head returns a new table and doesn't change the original.", "starter": "", "solution": "df = data.load(\"students\")\nprint(df.head(3))", "check": (out, code) => /\.head\(\s*3\s*\)/.test(code) && /Gal/.test(out) && /Tomer/.test(out) && /Yael/.test(out) && !/Noa/.test(out)}, {"num": 7, "difficulty": "easy", "topic": "head and tail", "q": "Load <code>sales</code> and print the <b>last 2 rows</b>.",
    explain: "tail(n) returns the last n rows. The combination of head+tail gives a quick picture of the start and end of the data, and in time series this immediately reveals whether the table is sorted chronologically. It's important to remember that tail doesn't renumber the rows.", "starter": "", "solution": "df = data.load(\"sales\")\nprint(df.tail(2))", "check": (out, code) => /\.tail\(\s*2\s*\)/.test(code) && /November/.test(out) && /December/.test(out) && !/October/.test(out)}, {"num": 8, "difficulty": "easy", "topic": "Access to the column", "q": "From <code>students</code>: print only the <code>math</code> column.",
    explain: "Square brackets with a single column name return a Series — a one-dimensional vector. Double brackets with a list, like df[[\"math\"]], return a DataFrame with one column. The difference matters: you can call mean or sum directly on a Series, while on a DataFrame you get a result per column.", "starter": "", "solution": "df = data.load(\"students\")\nprint(df[\"math\"])", "check": (out, code) => /df\[\s*["']math["']\s*\]/.test(code) && /88/.test(out) && /95/.test(out) && /70/.test(out)}, {"num": 9, "difficulty": "easy", "topic": "Access to the column", "q": "From <code>real-estate</code>: print the columns <code>neighborhood</code> and <code>price_m</code> only.",
    explain: "To select several columns you pass a list inside the square brackets, hence the double brackets: df[[\"a\", \"b\"]]. The list also determines the order of the columns in the result, so you can reorder without an extra step. Writing it without the inner brackets will throw an error.", "starter": "", "solution": "df = data.load(\"real-estate\")\nprint(df[[\"neighborhood\", \"price_m\"]])", "check": (out, code) => /\[\s*\[\s*["']neighborhood["']/.test(code) && /neighborhood\|price_m/.test(out) && !/rooms/.test(out)}, {"num": 10, "difficulty": "easy", "topic": "Built-in datasets", "q": "Use <code>data.list()</code> to print all the available datasets.",
    explain: "data.list() prints all the built-in datasets with a short description. This is the starting point for every exercise: first you see what's available, then you load with data.load using the exact name. Note that the function prints on its own, so there's no need to wrap it in print.", "starter": "", "solution": "data.list()", "check": (out, code) => /data\.list\(\s*\)/.test(code) && /cities-weather/.test(out) && /students/.test(out) && /salaries/.test(out)}, {"num": 11, "difficulty": "easy", "topic": "sorting", "q": "Load <code>salaries</code> and sort from highest salary to lowest. Print.",
    explain: "sort_values sorts by a column, and the default is from smallest to largest; so for a descending sort you need ascending=False. The method returns a new table and doesn't change the original, so you must save the result in a variable. The original index is kept and isn't renumbered.", "starter": "", "solution": "df = data.load(\"salaries\")\nresult = df.sort_values(\"salary\", ascending=False)\nprint(result)", "check": (out, code) => /sort_values/.test(code) && /ascending\s*=\s*False/.test(code) && /Hani\|R&D\|28000/.test(out) && /Carmel\|Marketing\|12000/.test(out)}, {"num": 12, "difficulty": "easy", "topic": "sorting", "q": "Load <code>real-estate</code> and sort from cheapest to most expensive apartment by <code>price_m</code>. Print it.",
    explain: "ascending=True is the default, but writing it explicitly clarifies the intent to whoever reads the code. You can also sort by several columns at once by passing a list, e.g. sort_values([\"rooms\", \"price_m\"]) — first by rooms and within each group by price.", "starter": "", "solution": "df = data.load(\"real-estate\")\nresult = df.sort_values(\"price_m\", ascending=True)\nprint(result)", "check": (out, code) => /sort_values\(\s*["']price_m["']/.test(code) && /Kiryat Shalom\|3\|65\|1\.9/.test(out) && /Neve Tzedek\|4\|110\|6\.8/.test(out)}, {"num": 13, "difficulty": "easy", "topic": "Sort + head", "q": "From <code>football</code>: find the team with the most points (<code>points</code>). Print one row.",
    explain: "The combination of a descending sort followed by head(1) is the classic pattern for pulling the leading record, and it also works when you want Top N. Note that you can chain the two methods in one line because each one returns a new table. A shorter alternative is nlargest(1, \"points\").", "starter": "", "solution": "df = data.load(\"football\")\nresult = df.sort_values(\"points\", ascending=False).head(1)\nprint(result)", "check": (out, code) => /sort_values/.test(code) && /head\(\s*1\s*\)/.test(code) && /Maccabi Tel Aviv\|55/.test(out) && !/Beitar/.test(out)}, {"num": 14, "difficulty": "easy", "topic": "Sort + head", "q": "From <code>sales</code>: find the month with the lowest sales. Print.",
    explain: "To find the minimum, sort in ascending order and take the first row. Note that if two months shared the same revenue, head(1) would arbitrarily return only one of them — when that matters, it's better to filter by the minimum value itself and get all the equal rows.", "starter": "", "solution": "df = data.load(\"sales\")\nresult = df.sort_values(\"revenue\", ascending=True).head(1)\nprint(result)", "check": (out, code) => /sort_values/.test(code) && /head\(\s*1\s*\)/.test(code) && /February\|38000/.test(out) && !/December/.test(out)}, {"num": 15, "difficulty": "easy", "topic": "filtering", "q": "From <code>students</code>: filter only students with <code>math &gt; 85</code>. Print.",
    explain: "Filtering in pandas is done in two steps: first you build a boolean mask — a series of True/False the length of the table — then you pass it in square brackets, df[mask]. In this environment the > operator isn't available on a column, so you use pandas' comparison methods: gt greater than, lt less than, ge greater than or equal, le less than or equal, eq equal, and ne not equal.", "starter": "", "solution": "df = data.load(\"students\")\nresult = df[df[\"math\"].gt(85)]\nprint(result)", "check": (out, code) => /\.gt\(\s*85\s*\)/.test(code) && /df\s*(?:\.loc)?\s*\[/.test(code) && /Yael\|92/.test(out) && /Maya\|95/.test(out) && !/Tomer/.test(out)}, {"num": 16, "difficulty": "easy", "topic": "filtering", "q": "From <code>real-estate</code>: filter apartments with <code>rooms &gt;= 4</code>. Print.",
    explain: "ge is greater-or-equal, meaning greater than or equal to, while gt is greater-than, strictly greater. Here we want four rooms or more, so apartments with exactly 4 rooms must be included and ge is the right choice. Note that the result keeps the original index, so the row numbers aren’t consecutive.", "starter": "", "solution": "df = data.load(\"real-estate\")\nresult = df[df[\"rooms\"].ge(4)]\nprint(result)", "check": (out, code) => /\.ge\(\s*4\s*\)/.test(code) && /df\s*(?:\.loc)?\s*\[/.test(code) && /Rothschild/.test(out) && /Ramat Aviv\|5/.test(out) && !/Florentin/.test(out)}, {"num": 17, "difficulty": "easy", "topic": "filtering", "q": "From <code>salaries</code>: filter employees whose department is \"R&D\".",
    explain: "eq compares equality and returns a boolean mask, exactly like gt and lt. String comparison is case- and whitespace-sensitive: \"R&D\" is not equal to \"r&d\" nor to \"R&D \" with a trailing space. When filtering by several possible values, isin is far more readable than a chain of eq with the or operator.", "starter": "", "solution": "df = data.load(\"salaries\")\nresult = df[df[\"department\"].eq(\"R&D\")]\nprint(result)", "check": (out, code) => /\.eq\(\s*["']R&D["']\s*\)/.test(code) && /df\s*(?:\.loc)?\s*\[/.test(code) && /Benny\|R&D/.test(out) && /Hani\|R&D/.test(out) && !/Marketing/.test(out)}, {"num": 18, "difficulty": "easy", "topic": "filtering", "q": "From <code>telecom-churn</code>: filter only customers who churned (<code>churn == 1</code>). Print.",
