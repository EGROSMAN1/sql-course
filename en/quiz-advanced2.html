<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070d0f;--bg2:#0c1518;--bg3:#111e21;
  --border:rgba(0,212,200,.08);--border2:rgba(0,212,200,.18);
  --text:#e8f4f5;--text2:#6b9098;--text3:#2a4048;
  --aq:#00d4c8;--aq2:rgba(0,212,200,.12);
  --green:#00e676;--red:#ff4757;--orange:#FFB020;--purple:#9B5CFF;
  --font:'Heebo',sans-serif;--mono:'IBM Plex Mono',monospace;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);overflow-x:hidden}
.topnav{background:rgba(7,13,15,.97);border-bottom:1px solid var(--border);padding:.6rem 1.25rem;display:flex;align-items:center;gap:.75rem;position:sticky;top:0;z-index:100;flex-wrap:wrap}
.back-btn{color:var(--aq);text-decoration:none;font-size:12px;font-weight:700;font-family:var(--mono)}
.topnav-title{font-size:13px;font-weight:700;color:var(--text2)}
.topnav-right{display:flex;align-items:center;gap:.5rem;margin-right:auto;flex-wrap:wrap}
.score-badge{background:var(--bg3);border:1px solid var(--border2);color:var(--aq);font-size:12px;font-weight:700;padding:4px 10px;border-radius:6px;font-family:var(--mono)}
.ltabs{display:flex;gap:.3rem;flex-wrap:wrap}
.ltab{font-size:11px;font-weight:700;padding:4px 9px;border-radius:5px;text-decoration:none;border:1px solid var(--border2);color:var(--text2);transition:all .12s}
.ltab:hover{color:var(--text)}
.ltab.active{background:rgba(155,92,255,.15);border-color:var(--purple);color:var(--purple)}
/* Firebase */
.fb-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:.5rem 1.5rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;position:sticky;top:48px;z-index:90}
.fb-login-btn{display:flex;align-items:center;gap:6px;background:#4285f4;color:#fff;border:none;padding:7px 14px;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--font)}
.fb-logout-btn{display:none;align-items:center;gap:5px;background:transparent;color:var(--text2);border:1px solid var(--border2);padding:5px 10px;border-radius:6px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:var(--font)}
.fb-user-info{display:none;align-items:center;gap:.5rem}
.fb-user-photo{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--aq)}
.fb-user-name{font-size:12.5px;font-weight:700;color:var(--text)}
.fb-saved-score{display:none;font-size:11px;color:var(--aq);font-family:var(--mono);background:rgba(0,212,200,.08);padding:3px 9px;border-radius:4px}
.fb-save-btn{display:none;align-items:center;gap:5px;background:var(--aq);color:var(--bg);border:none;padding:7px 14px;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--font);margin-right:auto}
.fb-history-btn{display:none;align-items:center;gap:5px;background:transparent;color:var(--text2);border:1px solid var(--border2);padding:5px 10px;border-radius:6px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:var(--font)}
.fb-history-btn:hover{color:var(--text);border-color:var(--aq)}
.fb-history-wrap{background:var(--bg2);border-bottom:1px solid var(--border);padding:1rem 1.5rem;display:none}
.hstats-row{display:flex;gap:1.5rem;margin-bottom:1rem;justify-content:center}
.hstat-mini{text-align:center}
.hstat-n{font-size:1.4rem;font-weight:900;font-family:var(--mono)}
.hstat-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.hchart{display:flex;align-items:flex-end;gap:.4rem;height:130px;padding:.5rem 0;overflow-x:auto}
.hbar-wrap{display:flex;flex-direction:column;align-items:center;gap:.2rem;min-width:32px;flex-shrink:0}
.hbar{width:24px;border-radius:4px 4px 0 0;min-height:8px}
.hbar-val{font-size:9.5px;color:var(--text2);font-family:var(--mono)}
.hbar-lbl{font-size:9px;color:var(--text3)}
#fb-toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--aq);color:var(--bg);padding:10px 20px;border-radius:8px;font-weight:700;font-size:13px;opacity:0;transition:all .3s;z-index:999;pointer-events:none}
#fb-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Hero */
.hero{padding:2rem 1.5rem 1.5rem;text-align:center;border-bottom:1px solid var(--border);background:radial-gradient(ellipse 70% 60% at 50% 0%,rgba(155,92,255,.07),transparent 70%)}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(155,92,255,.12);border:1px solid rgba(155,92,255,.3);color:var(--purple);font-size:10px;font-weight:700;padding:4px 12px;border-radius:20px;font-family:var(--mono);letter-spacing:1px;margin-bottom:.75rem}
.hero-title{font-size:2rem;font-weight:900;color:var(--text);margin-bottom:.3rem}
.hero-title em{color:var(--purple);font-style:normal}
.hero-desc{color:var(--text2);font-size:.9rem;margin-bottom:1.25rem}
.hero-stats{display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap}
.hs{text-align:center}
.hs-n{font-size:1.6rem;font-weight:900;font-family:var(--mono);color:var(--purple)}
.hs-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
/* Progress */
.prog-bar-wrap{padding:.75rem 1.5rem;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:1rem;position:sticky;top:96px;z-index:80}
.prog-bar{flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--purple);border-radius:2px;transition:width .3s}
.prog-txt{font-size:11px;color:var(--text2);font-family:var(--mono);white-space:nowrap}
.score-display{font-size:12px;font-weight:700;font-family:var(--mono);color:var(--purple);white-space:nowrap}
/* Main */
.main{max-width:800px;margin:0 auto;padding:1.5rem 1rem 4rem}
.sec-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--purple);font-family:var(--mono);padding:.75rem 0 .5rem;margin-top:1rem;border-bottom:1px solid var(--border);margin-bottom:1rem}
/* Cards */
.q-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1.1rem 1.25rem;margin-bottom:.75rem;transition:border-color .2s}
.q-card.correct{border-color:rgba(0,230,118,.3)}
.q-card.wrong{border-color:rgba(255,71,87,.3)}
.q-meta{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem}
.q-num{font-size:10px;font-family:var(--mono);color:var(--text3);background:var(--bg3);padding:2px 8px;border-radius:4px;font-weight:700}
.q-sec-tag{font-size:10px;color:var(--text3);font-weight:600}
.q-text{font-size:14px;font-weight:700;color:var(--text);line-height:1.55;margin-bottom:.85rem}
.options{display:flex;flex-direction:column;gap:.4rem}
.option{display:flex;align-items:flex-start;gap:.65rem;padding:.6rem .8rem;background:var(--bg3);border:1px solid var(--border);border-radius:7px;cursor:pointer;transition:all .15s;user-select:none}
.option:hover:not(.disabled){border-color:var(--border2);background:rgba(155,92,255,.05)}
.option.disabled{cursor:default}
.option.correct-ans{border-color:rgba(0,230,118,.5);background:rgba(0,230,118,.07)}
.option.wrong-ans{border-color:rgba(255,71,87,.4);background:rgba(255,71,87,.07)}
.opt-letter{width:20px;height:20px;border-radius:4px;background:var(--bg);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--text2);flex-shrink:0;font-family:var(--mono)}
.option.correct-ans .opt-letter{background:rgba(0,230,118,.2);border-color:rgba(0,230,118,.5);color:var(--green)}
.option.wrong-ans .opt-letter{background:rgba(255,71,87,.2);border-color:rgba(255,71,87,.5);color:var(--red)}
.opt-text{font-size:13px;color:var(--text2);line-height:1.5}
.option.correct-ans .opt-text{color:var(--text)}
.explanation{background:var(--bg3);border-right:2px solid var(--purple);border-radius:0 6px 6px 0;padding:.6rem .85rem;margin-top:.6rem;display:none}
.explanation.show{display:block}
.exp-label{font-size:10px;font-weight:700;color:var(--purple);font-family:var(--mono);margin-bottom:.25rem}
.exp-text{font-size:12.5px;color:var(--text2);line-height:1.6}
/* Finish */
.finish-card{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:2.5rem;text-align:center;margin-top:2rem;display:none}
.finish-card.show{display:block}
.finish-emoji{font-size:3rem;margin-bottom:.75rem}
.finish-title{font-size:1.5rem;font-weight:900;color:var(--text);margin-bottom:.5rem}
.finish-score{font-size:2.5rem;font-weight:900;font-family:var(--mono);color:var(--purple);margin-bottom:.5rem}
.finish-grade{font-size:1rem;font-weight:700;margin-bottom:.5rem}
.finish-sub{font-size:.9rem;color:var(--text2);margin-bottom:1.5rem}
.retry-btn{background:var(--purple);color:#fff;border:none;padding:10px 24px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;font-family:var(--font)}
.level-link{display:inline-block;background:transparent;color:var(--text2);border:1px solid var(--border2);padding:10px 20px;border-radius:8px;font-weight:600;font-size:13px;text-decoration:none;margin-top:.5rem;transition:all .15s;margin-right:.5rem}
.level-link:hover{border-color:var(--purple);color:var(--purple)}
@media(max-width:768px){
  .ltabs{display:none}
  .hero{padding:1.25rem .75rem 1rem}
  .hero-title{font-size:1.5rem}
  .main{padding:1rem .5rem 3rem}
  .q-text{font-size:13px}
  .opt-text{font-size:12.5px}
}

/* trilingual flag toggle — compact on mobile (3 langs) */
@media(max-width:560px){
  a[title="עברית"],a[title="English"],a[title="中文"]{font-size:11px;padding:3px 7px;gap:3px}
  a[title="עברית"] svg,a[title="English"] svg,a[title="中文"] svg{width:16px;height:11px}
  .lang-flags{flex-wrap:wrap;gap:4px}
}
@media(max-width:380px){
  a[title="עברית"],a[title="English"],a[title="中文"]{font-size:0;padding:3px 5px;gap:0}
  a[title="עברית"] svg,a[title="English"] svg,a[title="中文"] svg{width:18px;height:12px}
}

<script>
const Q=[
  // ── Subqueries ──
  {n:1,s:"Part A — Subqueries",t:"What is a subquery?",o:["A query that runs after the main query.","A query placed inside another query (SELECT, INSERT, UPDATE, or DELETE).","A function for joining tables.","A command for creating a temporary table."],c:1,e:"A subquery is an inner query that passes results to the outer query."},
  {n:2,s:"Part A — Subqueries",t:"Where can a subquery be placed?",o:["Only in WHERE.","Only in FROM.","In SELECT, FROM, WHERE, and HAVING.","Only in ORDER BY."],c:2,e:"Subqueries are versatile and can be used in almost any part of a query."},
  {n:3,s:"Part A — Subqueries",t:"What is a correlated subquery?",o:["A subquery that runs only once.","A subquery that returns more than one column.","A subquery that relies on values from the outer query for each row.","A subquery that performs a JOIN."],c:2,e:"In a correlated subquery, the inner query is re-run for each row processed by the outer query."},
  {n:4,s:"Part A — Subqueries",t:"Which operators do we use when a subquery in WHERE returns more than one value?",o:["= , < , >","IN, ANY, ALL","LIKE, BETWEEN","GROUP BY"],c:1,e:"Operators like IN let you compare a value against a list returned by a subquery."},
  {n:5,s:"Part A — Subqueries",t:"What does the EXISTS operator return?",o:["The first value found.","A count of the rows.","A boolean value (true/false) depending on whether the subquery returned any rows.","An error if the query is empty."],c:2,e:"EXISTS checks for the presence of records without returning the data itself."},
  {n:6,s:"Part A — Subqueries",t:"When do we use a subquery inside the FROM?",o:["To filter rows.","To treat the query result as a temporary table (an inline view).","To compute the average of a single row.","To sort data."],c:1,e:"A subquery in FROM lets you manipulate data and then query it again."},
  {n:7,s:"Part A — Subqueries",t:"What is the limitation of a scalar subquery?",o:["It must return at least 10 rows.","It must return exactly one value (one row and one column).","It works only with numbers.","It cannot appear in SELECT."],c:1,e:"A scalar query serves as a single value within an expression."},
  {n:8,s:"Part A — Subqueries",t:"What happens if a subquery in IN returns NULL?",o:["The query fails.","The NULL value is treated as a match for anything.","Comparison against NULL in IN can lead to unexpected results (usually no rows are returned).","SQL automatically ignores the NULL."],c:2,e:"In SQL, a comparison to NULL is always UNKNOWN."},
  {n:9,s:"Part A — Subqueries",t:"What is the difference between ANY and ALL?",o:["There is no difference.","ANY checks all the values, ALL checks at least one.","ANY returns true if the condition holds for at least one value, ALL requires it to hold for all.","ANY is used only for numbers."],c:2,e:"ANY = at least one. ALL = all of them without exception."},
  {n:10,s:"Part A — Subqueries",t:"How can you write the query 'show employees who earn more than the average'?",o:["WHERE salary > AVG(salary)","WHERE salary > (SELECT AVG(salary) FROM employees)","GROUP BY salary HAVING salary > AVG","JOIN (SELECT AVG...)"],c:1,e:"You cannot use an aggregate function directly in WHERE without a subquery."},
  {n:11,s:"Part A — Subqueries",t:"What is the advantage of a CTE (WITH clause) over a subquery in FROM?",o:["It is faster.","It makes the code more readable and lets you reuse the same 'temporary table' within the same query.","It does not require permissions.","It works only in MySQL."],c:1,e:"A CTE is a modern, clean way to define subqueries."},
  {n:12,s:"Part A — Subqueries",t:"Can a subquery contain ORDER BY?",o:["Always.","Usually not (unless you use TOP or LIMIT), because an inner data set does not require ordering.","Only if there is a JOIN.","Only in WHERE."],c:1,e:"ORDER BY in a subquery is meaningless unless combined with TOP/LIMIT."},
  {n:13,s:"Part A — Subqueries",t:"What happens if a scalar subquery accidentally returns two rows?",o:["The system takes the first one.","The system merges them.","The query fails with a runtime error.","NULL is shown."],c:2,e:"A scalar subquery that returns more than one row causes an error."},
  {n:14,s:"Part A — Subqueries",t:"When is it better to use a JOIN instead of a subquery?",o:["Always.","When you need to show columns from both tables in the final result.","When the tables are very small.","When you want to filter by a single value."],c:1,e:"A JOIN is better when you need columns from both tables. A subquery is better for existence checks and filtering."},
  {n:15,s:"Part A — Subqueries",t:"What does the NOT EXISTS operator do?",o:["Checks whether a column does not exist.","Returns true only if a subquery returns no rows.","Deletes rows that do not exist.","Checks NULL values."],c:1,e:"NOT EXISTS = an Anti-Join — it finds rows with no match in the other table."},
  {n:16,s:"Part A — Subqueries",t:'What is a "Nested Subquery"?',o:["A query inside a JOIN.","A subquery located inside another subquery.","A query that returns a list.","A parallel query."],c:1,e:"A nested subquery enables complex logic but can hurt performance."},
  {n:17,s:"Part A — Subqueries",t:"In which part of a query do we use a subquery to update data in one table based on another table?",o:["SELECT","UPDATE ... SET column = (SELECT ...)","FROM","GROUP BY"],c:1,e:"UPDATE with a subquery in SET lets you take values from another table."},
  {n:18,s:"Part A — Subqueries",t:"What is a subquery in HAVING?",o:["Filtering rows before grouping.","Filtering groups based on a calculation performed in a subquery.","A way to sort groups.","An invalid command."],c:1,e:"HAVING + a subquery = filtering groups by a complex calculation from another table."},
  {n:19,s:"Part A — Subqueries",t:"Can you use IN with a subquery that returns two columns?",o:["Yes, always.","Only if the outer query compares against a pair of columns (in databases like PostgreSQL/Oracle).","No, IN accepts only one column.","Only if the columns are of text type."],c:1,e:"A row subquery (multiple columns) is supported in PostgreSQL and Oracle."},
  {n:20,s:"Part A — Subqueries",t:"What is the performance difference between IN and EXISTS?",o:["IN is always faster.","EXISTS is always slower.","In modern systems the optimizer usually turns them into the same operation, but EXISTS is considered more efficient for large lists.","There is no difference at all."],c:2,e:"EXISTS is better for large lists because it stops at the first match."},
  // ── Window Functions ──
  {n:21,s:"Part B — Window Functions",t:"What is the main characteristic of a window function?",o:["It reduces the number of rows (aggregation).","It performs a calculation over a set of rows without losing the detail of the individual rows.","It works only on time windows.","It replaces GROUP BY."],c:1,e:"SUM() OVER() keeps all the rows and shows the sum next to them — unlike GROUP BY."},
  {n:22,s:"Part B — Window Functions",t:"Which keyword is used to define a window function?",o:["GROUP BY","OVER","WINDOW","PARTITION"],c:1,e:"OVER is the word that defines the 'window' over which the function operates."},
  {n:23,s:"Part B — Window Functions",t:"What does PARTITION BY do?",o:["Sorts the results.","Splits the rows into groups (e.g. by department) for the calculation within the window.","Deletes disk partitions.","Joins tables."],c:1,e:"PARTITION BY is like GROUP BY — but within a window, without collapsing rows."},
  {n:24,s:"Part B — Window Functions",t:"What is the difference between ROW_NUMBER() and RANK()?",o:["There is no difference.","ROW_NUMBER gives a unique running number, RANK gives the same number to equal values (and leaves a gap in the next number).","RANK does not skip numbers.","ROW_NUMBER works only on dates."],c:1,e:"A tie in RANK: both get 1, the next gets 3 (not 2)."},
  {n:25,s:"Part B — Window Functions",t:"How does DENSE_RANK() rank in the case of a tie?",o:["It skips numbers.","It gives random numbers.","It gives the same number to equal values but leaves no gap in the next number.","It always starts from 0."],c:2,e:"A tie in DENSE_RANK: both get 1, the next gets 2 (not 3)."},
  {n:26,s:"Part B — Window Functions",t:"What does the LAG() function do?",o:["Computes the average of the next row.","Accesses the value of a previous row (e.g. to compute growth versus last month).","Delays the query.","Returns the last row in the table."],c:1,e:"LAG = a look backward. LEAD = a look forward."},
  {n:27,s:"Part B — Window Functions",t:"What does the LEAD() function do?",o:["Returns the maximum value.","Accesses the value of the next row in the window.","Finds the leader of the group.","Sorts the data in ascending order."],c:1,e:"LEAD lets you compare the current row to a future row."},
  {n:28,s:"Part B — Window Functions",t:"What is the use of ORDER BY inside the OVER?",o:["Sorting the final result of the query.","Setting the order in which the function processes the rows (critical for a running total).","Defining the column name.","It is invalid."],c:1,e:"ORDER BY inside OVER sets the scan order of the function."},
  {n:29,s:"Part B — Window Functions",t:"How do you compute a running total?",o:["SUM(price) GROUP BY date","SUM(price) OVER (ORDER BY date)","SUM(price) OVER (PARTITION BY date)","ADD(price)"],c:1,e:"SUM() OVER(ORDER BY date) computes a running total over time."},
  {n:30,s:"Part B — Window Functions",t:"What does the FIRST_VALUE() function do?",o:["Returns the first row in the table.","Returns the first value in the defined data window.","Returns the value 1.","Finds the minimum."],c:1,e:"FIRST_VALUE lets you show the first value next to each row."},
  {n:31,s:"Part B — Window Functions",t:"What is the difference between SUM without OVER and SUM with OVER?",o:["There is no difference.","Without OVER it returns an error.","Without OVER it returns one row per group, with OVER it returns the sum for every single row.","OVER is faster."],c:2,e:"GROUP BY collapses rows — OVER keeps them."},
  {n:32,s:"Part B — Window Functions",t:"What is the window frame (e.g. ROWS BETWEEN...)?",o:["Another name for a table.","A precise definition of which rows around the current row are included in the calculation (e.g. a moving average).","A command to resize the screen.","A type of JOIN."],c:1,e:"A window frame defines the range of rows for the calculation — critical for a moving average."},
  {n:33,s:"Part B — Window Functions",t:"What does UNBOUNDED PRECEDING mean?",o:["Up to the next row.","From the start of the window (all the rows before the current row).","No bounds at all.","Only the previous row."],c:1,e:"UNBOUNDED PRECEDING = from the first row in the window up to the current row."},
  {n:34,s:"Part B — Window Functions",t:"Which function splits the rows into 4 equal groups (quartiles)?",o:["QUARTER()","DIVIDE(4)","NTILE(4)","PART(4)"],c:2,e:"NTILE(4) splits all the rows into 4 groups of equal size."},
  {n:35,s:"Part B — Window Functions",t:"What does the LAST_VALUE() function do?",o:["Returns NULL.","Returns the last value in the window (requires a correct frame definition).","Deletes the last row.","Finds the maximum."],c:1,e:"LAST_VALUE requires ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING for a correct result."},
  {n:36,s:"Part B — Window Functions",t:"Can you use window functions in WHERE?",o:["Yes.","No, they are computed after the WHERE (you need a subquery or a CTE).","Only if there is a GROUP BY.","Only in SQL Server."],c:1,e:"Window functions are computed after WHERE — wrap them in a CTE and then filter."},
  {n:37,s:"Part B — Window Functions",t:"What does CURRENT ROW mean within a window definition?",o:["The first row in the table.","The last row that was read.","The row on which the calculation is being performed right now.","A system error."],c:2,e:"CURRENT ROW = the current row in the calculation."},
  {n:38,s:"Part B — Window Functions",t:"Which function returns the relative position of a row as a percentage (0 to 1)?",o:["PERCENT()","PERCENT_RANK()","RANK_PCT()","RATIO()"],c:1,e:"PERCENT_RANK = (rank-1)/(rows-1). It returns 0 for the first and 1 for the last."},
  {n:39,s:"Part B — Window Functions",t:"What is the advantage of LAG/LEAD over a SELF JOIN?",o:["They look nicer.","They are far more efficient and faster in terms of performance.","They do not require a primary key.","They work only on numbers."],c:1,e:"LAG/LEAD are written in a single line and are very efficient — a SELF JOIN burdens the optimizer."},
  {n:40,s:"Part B — Window Functions",t:"What does SELECT ROW_NUMBER() OVER(ORDER BY id) return?",o:["The ID of the row.","A running sequence number (1, 2, 3...) by ID order.","The total number of rows.","Duplicate rows."],c:1,e:"ROW_NUMBER() OVER(ORDER BY id) numbers the rows sequentially by sort order."},
  // ── Dates ──
  {n:41,s:"Part C — Date Functions",t:"Which function returns the current date and time?",o:["NOW() (in MySQL/Postgres)","GETDATE() (in SQL Server)","CURRENT_TIMESTAMP","All answers are correct (depending on the database)."],c:3,e:"Every engine supports its own form — NOW, GETDATE, CURRENT_TIMESTAMP."},
  {n:42,s:"Part C — Date Functions",t:"How can you extract only the year from a date?",o:["YEAR(date) / EXTRACT(YEAR FROM date)","DATE_YEAR()","GET_YEAR()","SUBSTRING(date, 1, 4)"],c:0,e:"YEAR() is common, EXTRACT is the standard ANSI form."},
  {n:43,s:"Part C — Date Functions",t:"What does the DATEDIFF() function do?",o:["Adds two dates together.","Computes the difference (in days, months, etc.) between two dates.","Checks whether a date is valid.","Changes a date format."],c:1,e:"DATEDIFF(day, start, end) = the number of days between two dates."},
  {n:44,s:"Part C — Date Functions",t:"How do you add 10 days to a given date?",o:["date + 10","DATEADD(day, 10, date) / date + INTERVAL '10 days'","ADD_DAYS(date, 10)","INSERT_TIME(10)"],c:1,e:"DATEADD in SQL Server, INTERVAL in MySQL/PostgreSQL."},
  {n:45,s:"Part C — Date Functions",t:"Which function returns the day of the week?",o:["DAY()","WEEK()","DAYNAME() / TO_CHAR(date, 'Day')","DATE_PART()"],c:2,e:"DAYNAME in MySQL, TO_CHAR in Oracle/PostgreSQL."},
  {n:46,s:"Part C — Date Functions",t:"What does the MONTH() function do?",o:["Returns the number of days in the month.","Returns the month number (1-12).","Returns the month name.","Checks whether a month has passed."],c:1,e:"MONTH() returns the month number — 1 for January, 12 for December."},
  {n:47,s:"Part C — Date Functions",t:"What is the standard date format in SQL?",o:["DD-MM-YYYY","MM-DD-YYYY","YYYY-MM-DD","YYYY-DD-MM"],c:2,e:"ISO 8601 = YYYY-MM-DD. This is the international standard."},
  {n:48,s:"Part C — Date Functions",t:"How do you find the last day of the current month?",o:["LAST_DAY()","EOMONTH() (SQL Server) / LAST_DAY() (MySQL)","END_MONTH()","MONTH_LIMIT()"],c:1,e:"EOMONTH in SQL Server, LAST_DAY in MySQL."},
  {n:49,s:"Part C — Date Functions",t:"What does DATEPART(weekday, date) do?",o:["Returns the day name.","Returns a numeric representation of the day of the week.","Returns the week number in the year.","Splits the date."],c:1,e:"DATEPART(weekday) returns 1-7, DATEPART(week) returns the week number in the year."},
  {n:50,s:"Part C — Date Functions",t:"What is the difference between DATE and DATETIME?",o:["There is no difference.","DATE holds only day/month/year, DATETIME also holds hours/minutes/seconds.","DATETIME is only for the future.","DATE takes up more memory."],c:1,e:"DATE = 3 bytes. DATETIME = 8 bytes (including the time)."},
  {n:51,s:"Part C — Date Functions",t:"How do we convert the string '2023-01-01' into a date object?",o:["CAST('2023-01-01' AS DATE) / TO_DATE()","CONVERT_TO_TIME()","MAKE_DATE()","It always happens automatically."],c:0,e:"CAST is the ANSI standard, TO_DATE() is common in Oracle/PostgreSQL."},
  {n:52,s:"Part C — Date Functions",t:"What does EXTRACT(QUARTER FROM date) return?",o:["The day number within the quarter.","The quarter number in the year (1-4).","The sales for the quarter.","25% of the date."],c:1,e:"EXTRACT(QUARTER) = 1 for January-March, 2 for April-June, 3 for July-September, 4 for October-December."},
  {n:53,s:"Part C — Date Functions",t:"What does ISDATE() do?",o:["Checks whether the date is today.","Checks whether a given string is a valid date (returns 1 or 0).","Converts a date to text.","Returns the data type."],c:1,e:"ISDATE() is useful for data cleaning — before a CAST to date."},
  {n:54,s:"Part C — Date Functions",t:"How do you compute a person's age in SQL?",o:["YEAR(NOW()) - YEAR(birthdate)","DATEDIFF(year, birthdate, GETDATE())","The methods above are common, but you must be precise by accounting for the day and month.","AGE(birthdate)"],c:2,e:"Computing an exact age requires comparing the month and day — not just the year."},
  {n:55,s:"Part C — Date Functions",t:"What does TIMESTAMPDIFF do?",o:["Computes a time difference in seconds only.","Computes the difference between two time values in chosen units (hours, minutes, etc.).","Creates a new timestamp.","Changes the time zone."],c:1,e:"TIMESTAMPDIFF(HOUR, start, end) = the number of hours between two times."},
  {n:56,s:"Part C — Date Functions",t:"What is a Unix timestamp?",o:["A date in text format.","The number of seconds elapsed since January 1, 1970.","An Apple date format.","An internal SQL clock."],c:1,e:"A Unix timestamp = epoch time. Widely used in APIs and distributed systems."},
  {n:57,s:"Part C — Date Functions",t:"How can you display a date in the format 'DD/MM/YYYY'?",o:["FORMAT(date, 'dd/MM/yyyy')","TO_CHAR(date, 'DD/MM/YYYY')","CONVERT(VARCHAR, date, 103)","All answers are correct (depending on the database)."],c:3,e:"FORMAT in SQL Server, TO_CHAR in Oracle/PostgreSQL, CONVERT with code 103 in SQL Server."},
  {n:58,s:"Part C — Date Functions",t:"What does SYSDATE do in Oracle?",o:["Deletes the system date.","Returns the current date and time of the server.","Updates the clock.","Returns only the year."],c:1,e:"SYSDATE in Oracle = GETDATE() in SQL Server = NOW() in MySQL."},
  {n:59,s:"Part C — Date Functions",t:"What is the DATE_TRUNC function?",o:["Deleting the date from the table.","'Rounding' a date to a given time unit (e.g. the start of the month or the start of the day).","Trimming a date string.","Extending the date."],c:1,e:"DATE_TRUNC('month', date) = the first date of the month. Useful for monthly reports."},
  {n:60,s:"Part C — Date Functions",t:"What happens if you add a day to December 31?",o:["An error.","The date stays the same.","The date becomes January 1 of the following year.","The system returns NULL."],c:2,e:"SQL automatically handles the month/year rollover in date calculations."}
];

const L=['A','B','C','D'];
let answers={}, correct=0, curSec=null;

function updateScore(){
  const tot=Object.keys(answers).length;
  const pct=tot>0?Math.round(correct/tot*100):0;
  document.getElementById('scoreText').textContent='✅ '+correct+' / '+tot;
  document.getElementById('scoreFill').style.width=(Math.round(correct/Q.length*100))+'%';
  document.getElementById('progTxt').textContent=tot+' / '+Q.length;
  document.getElementById('scoreDisplay').textContent=pct+'%';
  document.getElementById('heroAnswered').textContent=tot;
  document.getElementById('heroCorrect').textContent=correct;
  document.getElementById('heroPct').textContent=pct+'%';
  if(tot===Q.length) showFinish();
}

function selectOption(qi,oi){
  if(answers[qi]!==undefined)return;
  const q=Q[qi]; const ok=oi===q.c;
  answers[qi]=oi; if(ok)correct++;
  const card=document.getElementById('qcard-'+qi);
  card.classList.add(ok?'correct':'wrong');
  card.querySelectorAll('.option').forEach((o,i)=>{
    o.classList.add('disabled');
    if(i===q.c)o.classList.add('correct-ans');
    if(i===oi&&!ok)o.classList.add('wrong-ans');
  });
  const exp=document.getElementById('exp-'+qi);
  exp.querySelector('.exp-text').innerHTML=(ok?'✅ Correct! ':'❌ Wrong — the correct answer is marked in green. ')+q.e;
  exp.classList.add('show');
  updateScore();
}

function buildQuiz(){
  const mc=document.getElementById('mainContent');
  mc.innerHTML=''; curSec=null;
  Q.forEach((q,i)=>{
    if(q.s!==curSec){curSec=q.s;mc.innerHTML+=`<div class="sec-label">${q.s}</div>`;}
    const opts=q.o.map((o,oi)=>`<div class="option" onclick="selectOption(${i},${oi})"><div class="opt-letter">${L[oi]}</div><div class="opt-text">${o}</div></div>`).join('');
    mc.innerHTML+=`<div class="q-card" id="qcard-${i}"><div class="q-meta"><div class="q-num">Question ${q.n}</div><div class="q-sec-tag">${q.s.split('—')[1]?.trim()||q.s}</div></div><div class="q-text">${q.t}</div><div class="options">${opts}</div><div class="explanation" id="exp-${i}"><div class="exp-label">💡 Explanation</div><div class="exp-text"></div></div></div>`;
  });
  mc.innerHTML+=`<div class="finish-card" id="finishCard"><div class="finish-emoji">🏆</div><div class="finish-title">You finished the advanced level!</div><div class="finish-score" id="finishScore">0/60</div><div class="finish-grade" id="finishGrade"></div><div class="finish-sub" id="finishSub"></div><br><button class="retry-btn" onclick="resetQuiz()">🔄 Try again</button><a href="quiz-medium.html" class="level-link">📗 Back to the intermediate level</a></div>`;
}

function showFinish(){
  if(window.fbAutoSave&&window.currentUser)window.fbAutoSave(correct,Q.length);
  const pct=Math.round(correct/Q.length*100);
  document.getElementById('finishScore').textContent=correct+' / '+Q.length;
  const grades=[[90,'🏆 Excellent!','Impressive command of the advanced level!'],[75,'⭐ Very good','A little more practice and you will nail it!'],[60,'👍 Good','Worth reviewing the weaker material.'],[0,'💪 Keep practicing','Review the chapters and try again!']];
  const [,grade,sub]=grades.find(([t])=>pct>=t);
  document.getElementById('finishGrade').textContent=grade;
  document.getElementById('finishSub').textContent=sub;
  const card=document.getElementById('finishCard');
  card.classList.add('show');
  card.scrollIntoView({behavior:'smooth',block:'center'});
}

function resetQuiz(){
  answers={};correct=0;
  document.getElementById('finishCard').classList.remove('show');
  updateScore();buildQuiz();
  window.scrollTo({top:0,behavior:'smooth'});
}

buildQuiz();updateScore();
</script>

<script>
function fbLogin(){if(window._fbLogin)window._fbLogin();else{var b=document.getElementById('fb-login-btn');if(b)b.setAttribute('data-pending','1');}}
function fbLogout(){if(window._fbLogout)window._fbLogout();}
function fbToggleHistory(){if(window._fbToggleHistory)window._fbToggleHistory();}
function triggerSave(){if(window._triggerSave)window._triggerSave();}
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getAuth,signInWithPopup,GoogleAuthProvider,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{getFirestore,doc,setDoc,getDoc,collection,addDoc,query,orderBy,limit,getDocs}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyA04LDMDGohAs1uRnUVwWVTs5coVMrEO64",authDomain:"sql-course-507b5.firebaseapp.com",projectId:"sql-course-507b5",storageBucket:"sql-course-507b5.firebasestorage.app",messagingSenderId:"999664091380",appId:"1:999664091380:web:349959985ae11ce8c51ea1"});
const auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
let currentUser=null;window.currentUser=null;const QID='advanced2';
onAuthStateChanged(auth,async(user)=>{
  currentUser=user;window.currentUser=user;
  const li=document.getElementById('fb-login-btn'),lo=document.getElementById('fb-logout-btn'),ui=document.getElementById('fb-user-info'),hb=document.getElementById('fb-history-btn'),sb=document.getElementById('fb-save-btn');
  if(user){
    document.getElementById('fb-user-name').textContent=user.displayName;
    document.getElementById('fb-user-photo').src=user.photoURL;
    document.getElementById('fb-user-photo').style.display='block';
    li.style.display='none';lo.style.display='flex';ui.style.display='flex';hb.style.display='flex';sb.style.display='flex';
    await loadProg();await loadHist();
  }else{li.style.display='flex';lo.style.display='none';ui.style.display='none';hb.style.display='none';sb.style.display='none';}
});
window._fbLogin=window.fbLogin=async()=>{try{await signInWithPopup(auth,provider);}catch(e){console.error(e);}};
window._fbLogout=window.fbLogout=async()=>{await signOut(auth);};
window._fbToggleHistory=window.fbToggleHistory=()=>{const w=document.getElementById('fb-history-wrap');w.style.display=w.style.display==='none'?'block':'none';};
window._triggerSave=window.triggerSave=async()=>{
  if(!currentUser){window.fbLogin();return;}
  const txt=(document.getElementById('scoreText')?.textContent||'0 / 0').replace('✅ ','');
  const p=txt.split('/');const sc=parseInt(p[0])||0,tot=parseInt(p[1])||0;
  if(tot===0){showToast('⚠️ Answer at least one question first!');return;}
  await saveProg(sc,tot);
};
async function saveProg(score,total){
  if(!currentUser)return;
  const pct=Math.round(score/total*100);
  await setDoc(doc(db,'users',currentUser.uid,'quizzes',QID),{score,total,pct,lastUpdate:new Date().toISOString()},{merge:true});
  await addDoc(collection(db,'users',currentUser.uid,'history'),{quizId:QID,score,total,pct,date:new Date().toISOString()});
  showToast('✅ Progress saved to the cloud!');await loadHist();
}
window.fbAutoSave=saveProg;
async function loadProg(){
  if(!currentUser)return;
  const s=await getDoc(doc(db,'users',currentUser.uid,'quizzes',QID));
  if(s.exists()){const d=s.data();const el=document.getElementById('fb-saved-score');el.textContent=`Last attempt: ${d.score}/${d.total} (${d.pct}%)`;el.style.display='block';}
}
async function loadHist(){
  if(!currentUser)return;
  const q=query(collection(db,'users',currentUser.uid,'history'),orderBy('date','desc'),limit(10));
  const s=await getDocs(q);const hist=[];
  s.forEach(d=>hist.push(d.data()));
  renderChart(hist.filter(h=>h.quizId===QID));
}
function renderChart(h){
  const p=document.getElementById('fb-history-panel');
  if(!h.length){p.innerHTML='<p style="color:var(--text2);font-size:13px;text-align:center;padding:1rem">No history yet — answer questions and save!</p>';return;}
  const rev=[...h].reverse();
  const best=Math.max(...h.map(x=>x.pct)),avg=Math.round(h.reduce((a,x)=>a+x.pct,0)/h.length);
  const bars=rev.map(x=>{const d=new Date(x.date);const lbl=`${d.getDate()}/${d.getMonth()+1}`;const col=x.pct>=80?'var(--aq)':x.pct>=50?'#FFB020':'#FF4060';return`<div class="hbar-wrap"><div class="hbar-val">${x.pct}%</div><div class="hbar" style="height:${Math.max(x.pct*1.1,8)}px;background:${col}"></div><div class="hbar-lbl">${lbl}</div></div>`;}).join('');
  p.innerHTML=`<div class="hstats-row"><div class="hstat-mini"><div class="hstat-n" style="color:var(--aq)">${best}%</div><div class="hstat-l">Personal best</div></div><div class="hstat-mini"><div class="hstat-n" style="color:#FFB020">${avg}%</div><div class="hstat-l">Average</div></div><div class="hstat-mini"><div class="hstat-n" style="color:var(--text2)">${h.length}</div><div class="hstat-l">Attempts</div></div></div><div class="hchart">${bars}</div>`;
}
function showToast(msg){let t=document.getElementById('fb-toast');if(!t){t=document.createElement('div');t.id='fb-toast';document.body.appendChild(t);}t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
</script>
