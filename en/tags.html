</head>
<body>

<div class="topbar">
  <a href="index.html" class="home-btn">🏠 Home</a>
</div>

<div class="hero">
  <h1>🔍 Search exercise</h1>
  <p>Filter from 80+ exercises by topic, difficulty, and course</p>
</div>

<div class="container">

  <!-- Stats -->
  <div class="stats-row" id="stats-row">
    <div class="stat-mini">
      <div class="stat-mini-val" id="stat-total">0</div>
      <div class="stat-mini-label">total</div>
    </div>
    <div class="stat-mini">
      <div class="stat-mini-val" style="color:var(--easy);" id="stat-easy">0</div>
      <div class="stat-mini-label">easy</div>
    </div>
    <div class="stat-mini">
      <div class="stat-mini-val" style="color:var(--medium);" id="stat-medium">0</div>
      <div class="stat-mini-label">medium</div>
    </div>
    <div class="stat-mini">
      <div class="stat-mini-val" style="color:var(--hard);" id="stat-hard">0</div>
      <div class="stat-mini-label">hard</div>
    </div>
  </div>

  <!-- Search bar -->
  <div class="search-bar">
    <input type="search" id="search-input" class="search-input" placeholder="🔍 Search by title... (for example: 'groupby', 'lambda', 'merge')" autocomplete="off">
  </div>

  <!-- Filters -->
  <div class="filter-section">
    <div class="filter-row">
      <div class="filter-label">📚 course</div>
      <div class="pills" id="course-pills"></div>
    </div>
    <div class="filter-row">
      <div class="filter-label">📊 Difficulty level</div>
      <div class="pills" id="difficulty-pills"></div>
    </div>
    <div class="filter-row">
      <div class="filter-label">🏷️ Topic tags</div>
      <div id="tag-groups-container"></div>
    </div>
  </div>

  <!-- Results -->
  <div class="results-header">
    <div class="results-count" id="results-count">loading...</div>
    <button class="clear-btn" id="clear-btn">✕ Clear all</button>
  </div>

  <div class="results-grid" id="results-grid">
    <!-- Results rendered by JS -->
  </div>

</div>

<script>
(function() {
  'use strict';

  const DATA = window.TAGS_DATA;
  
  // ===== State =====
  let activeFilters = {
    search: '',
    course: null,
    difficulty: null,
    tags: new Set(),
  };

  // ===== Render initial stats =====
  function renderStats() {
    const all = DATA.exercises;
    document.getElementById('stat-total').textContent = all.length;
    document.getElementById('stat-easy').textContent = all.filter(e => e.difficulty === 'easy').length;
    document.getElementById('stat-medium').textContent = all.filter(e => e.difficulty === 'medium').length;
    document.getElementById('stat-hard').textContent = all.filter(e => e.difficulty === 'hard').length;
  }

  // ===== Render course pills =====
  function renderCoursePills() {
    const container = document.getElementById('course-pills');
    let html = `<button class="pill ${activeFilters.course === null ? 'active' : ''}" data-course="">All</button>`;
    Object.entries(DATA.courses).forEach(([key, info]) => {
      const count = DATA.exercises.filter(e => e.course === key).length;
      html += `<button class="pill ${activeFilters.course === key ? 'active' : ''}" data-course="${key}">${info.icon} ${info.name} (${count})</button>`;
    });
    container.innerHTML = html;
    container.querySelectorAll('.pill').forEach(btn => {
      btn.addEventListener('click', () => {
        const v = btn.dataset.course;
        activeFilters.course = v === '' ? null : v;
        renderAll();
      });
    });
  }

  // ===== Render difficulty pills =====
  function renderDifficultyPills() {
    const container = document.getElementById('difficulty-pills');
    let html = `<button class="pill ${activeFilters.difficulty === null ? 'active' : ''}" data-diff="">All</button>`;
    Object.entries(DATA.difficulties).forEach(([key, info]) => {
      const count = DATA.exercises.filter(e => e.difficulty === key).length;
      html += `<button class="pill diff-${key} ${activeFilters.difficulty === key ? 'active' : ''}" data-diff="${key}">${info.emoji} ${info.name} (${count})</button>`;
    });
    container.innerHTML = html;
    container.querySelectorAll('.pill').forEach(btn => {
      btn.addEventListener('click', () => {
        const v = btn.dataset.diff;
        activeFilters.difficulty = v === '' ? null : v;
        renderAll();
      });
    });
  }

  // ===== Render tag groups =====
  function renderTagGroups() {
    const container = document.getElementById('tag-groups-container');
    let html = '';
    Object.entries(DATA.tagGroups).forEach(([group, tags]) => {
      // Only show tags that have at least 1 exercise
      const visibleTags = tags.filter(t => DATA.exercises.some(e => e.tags.includes(t)));
      if (visibleTags.length === 0) return;
      
      html += `<div class="tag-group">`;
      html += `<div class="tag-group-title">${group}</div>`;
      html += `<div class="pills">`;
      visibleTags.forEach(tag => {
        const count = DATA.exercises.filter(e => e.tags.includes(tag)).length;
        const isActive = activeFilters.tags.has(tag);
        html += `<button class="pill ${isActive ? 'active' : ''}" data-tag="${tag}">${tag} (${count})</button>`;
      });
      html += `</div></div>`;
    });
    container.innerHTML = html;
    container.querySelectorAll('.pill').forEach(btn => {
      btn.addEventListener('click', () => {
        const tag = btn.dataset.tag;
        if (activeFilters.tags.has(tag)) activeFilters.tags.delete(tag);
        else activeFilters.tags.add(tag);
        renderAll();
      });
    });
  }

  // ===== Filter exercises =====
  function filterExercises() {
    let results = DATA.exercises;
    
    // Search
    if (activeFilters.search) {
      const q = activeFilters.search.toLowerCase();
      results = results.filter(e => 
        e.title.toLowerCase().includes(q) || 
        e.module.toLowerCase().includes(q) ||
        e.tags.some(t => t.toLowerCase().includes(q))
      );
    }
    
    // Course
    if (activeFilters.course) {
      results = results.filter(e => e.course === activeFilters.course);
    }
    
    // Difficulty
    if (activeFilters.difficulty) {
      results = results.filter(e => e.difficulty === activeFilters.difficulty);
    }
    
    // Tags (OR logic - any selected tag matches)
    if (activeFilters.tags.size > 0) {
      results = results.filter(e => 
        e.tags.some(t => activeFilters.tags.has(t))
      );
    }
    
    return results;
  }

  // ===== Render results =====
  function renderResults() {
    const results = filterExercises();
    const grid = document.getElementById('results-grid');
    const countEl = document.getElementById('results-count');
    
    countEl.textContent = results.length === 0 ? 'No exercises found' : `${results.length} exercises found`;
    
    if (results.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">\n          <div class="empty-state-icon">🔍</div>\n          <p>Try changing the filter</p>\n        </div>
      `;
      return;
    }
    
    let html = '';
    results.forEach(ex => {
      const courseInfo = DATA.courses[ex.course] || { icon: '📚', name: ex.course };
      const diffInfo = DATA.difficulties[ex.difficulty] || { emoji: '⚪', name: ex.difficulty };
      const tagsHTML = ex.tags.map(t => `<span class="result-tag">${t}</span>`).join('');
      
      html += `
        <a href="${ex.url}" class="result-card">
          <div class="result-card-header">
            <div class="result-icon">${ex.icon}</div>
            <div class="result-title">${ex.title}</div>
            <div class="result-difficulty-emoji">${diffInfo.emoji}</div>
          </div>
          <div class="result-meta">
            <span>${courseInfo.icon} ${courseInfo.name}</span>
            <span>📂 ${ex.module}</span>
          </div>
          <div class="result-tags">${tagsHTML}</div>
        </a>
      `;
    });
    grid.innerHTML = html;
  }

  // ===== Render all =====
  function renderAll() {
    renderCoursePills();
    renderDifficultyPills();
    renderTagGroups();
    renderResults();
  }

  // ===== Wire up =====
  function init() {
    if (!DATA || !DATA.exercises) {
      document.getElementById('results-grid').innerHTML = '<p style="text-align:center;color:#888;">No data loaded</p>';
      return;
    }
    
    renderStats();
    renderAll();
    
    // Search input
    let searchTimeout;
    document.getElementById('search-input').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        activeFilters.search = e.target.value.trim();
        renderResults();
      }, 200);
    });
    
    // Clear filters
    document.getElementById('clear-btn').addEventListener('click', () => {
      activeFilters = { search: '', course: null, difficulty: null, tags: new Set() };
      document.getElementById('search-input').value = '';
      renderAll();
    });
    
    // URL params - support deep linking
    const params = new URLSearchParams(location.search);
    if (params.has('course')) {
      activeFilters.course = params.get('course');
    }
    if (params.has('diff')) {
      activeFilters.difficulty = params.get('diff');
    }
    if (params.has('tag')) {
      activeFilters.tags.add(params.get('tag'));
    }
    if (params.has('q')) {
      activeFilters.search = params.get('q');
      document.getElementById('search-input').value = activeFilters.search;
    }
    if (params.toString()) renderAll();
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>













<script id="mobile-safe-bottom">
(function(){
  if (!window.matchMedia || !matchMedia('(max-width:900px)').matches) return;
  function pad(){
    var best=0;
    var els=document.body.getElementsByTagName('*');
    for (var i=0;i<els.length;i++){
      var e=els[i], cs;
      try{ cs=getComputedStyle(e); }catch(err){ continue; }
      if(cs.position!=='fixed'||cs.display==='none'||cs.visibility==='hidden') continue;
      var b=e.getBoundingClientRect();
      if(b.height<8||b.width<innerWidth*0.34) continue;
      if(b.bottom > innerHeight-6 && b.top > innerHeight*0.55) best=Math.max(best,b.height);
    }
    document.body.style.paddingBottom = best ? (best+14)+'px' : '';
  }
  addEventListener('load',pad); addEventListener('resize',pad);
  setTimeout(pad,1200); setTimeout(pad,3500);
})();
</script>
