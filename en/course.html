<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080C14;--bg2:#0D1220;--bg3:#111828;--bg4:#16202E;
  --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);
  --text:#F1F5FF;--text2:#8896AA;--text3:#2A3450;
  --blue:#2D6FFF;--blue2:#1a52cc;--blue3:#0a2a7a;
  --cyan:#00E5FF;--green:#00E5A0;--green2:#00b380;
  --orange:#FFB020;--yellow:#FFB020;--red:#FF4060;--purple:#9B5CFF;
  --purple:#d2a8ff;
  --font:'Heebo',sans-serif;--mono:'IBM Plex Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.6}

/* TOP NAV */
.topnav{background:rgba(6,10,15,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:.75rem 1.5rem;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:100}
.back-btn{color:var(--cyan);text-decoration:none;font-size:13px;font-weight:700;font-family:var(--mono);display:flex;align-items:center;gap:6px;transition:opacity .2s}
.back-btn:hover{opacity:.7}
.topnav-title{font-size:14px;font-weight:700;color:var(--text2)}
.topnav-right{margin-right:auto;display:flex;gap:.75rem}
.topnav-link{color:var(--text3);text-decoration:none;font-size:13px;transition:color .2s;font-weight:600}
.topnav-link:hover{color:var(--cyan)}

/* LAYOUT */
.layout{display:flex;min-height:calc(100vh - 49px)}

/* SIDEBAR */
.sidebar{width:260px;flex-shrink:0;background:var(--bg2);border-left:1px solid var(--border);position:sticky;top:49px;height:calc(100vh - 49px);overflow-y:auto;padding:1rem 0;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.sidebar-section{padding:.5rem 1rem;font-size:10px;font-weight:700;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-top:1rem}
.sidebar-item{display:flex;align-items:center;gap:8px;padding:.5rem 1rem;cursor:pointer;transition:all .15s;font-size:13px;color:var(--text2);border-right:2px solid transparent}
.sidebar-item:hover{background:var(--bg3);color:var(--text)}
.sidebar-item.active{background:rgba(74,158,255,.08);color:var(--blue);border-right-color:var(--blue)}
.sidebar-num{font-family:var(--mono);font-size:10px;background:var(--bg4);color:var(--text3);width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700}
.sidebar-item.active .sidebar-num{background:var(--blue3);color:var(--blue)}

/* MAIN */
.main-content{flex:1;padding:2rem;overflow-x:hidden;max-width:860px}

/* CHAPTER HEADER */
.ch-header{margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}
.ch-meta{font-family:var(--mono);font-size:11px;color:var(--cyan);letter-spacing:1px;text-transform:uppercase;margin-bottom:.5rem}
.ch-title{font-size:2rem;font-weight:900;margin-bottom:.5rem}
.ch-desc{color:var(--text2);font-size:14px;line-height:1.8;max-width:660px}

/* SYNTAX BOX */
.syntax-box{background:var(--bg3);border:1px solid var(--border2);border-right:3px solid var(--cyan);border-radius:8px;padding:1rem 1.25rem;margin-bottom:1.5rem;font-family:var(--mono);font-size:12.5px;color:var(--yellow);line-height:1.8}

/* CONCEPT CARDS */
.concepts{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;margin-bottom:2rem}
.concept{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:1rem}
.concept-label{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--text3);text-transform:uppercase;margin-bottom:.4rem;font-family:var(--mono)}
.concept-text{color:var(--text2);font-size:13px;line-height:1.7}
.concept-text strong{color:var(--text);font-weight:600}

/* SECTION DIVIDER */
.sec-div{border:none;border-top:1px solid var(--border);margin:2rem 0}
.sec-label{font-size:.85rem;font-weight:700;color:var(--yellow);margin-bottom:1rem;display:flex;align-items:center;gap:8px}
.sec-label::before{content:'';width:3px;height:14px;background:var(--yellow);border-radius:2px;display:block}

/* EXAMPLE CARD */
.example-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-bottom:1.25rem;overflow:hidden}
.ex-head{padding:.85rem 1rem;display:flex;align-items:flex-start;gap:.75rem;cursor:pointer;user-select:none;transition:background .15s}
.ex-head:hover{background:var(--bg3)}
.ex-num{background:var(--blue3);color:var(--blue);font-size:11px;font-weight:700;width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;font-family:var(--mono)}
.ex-q{font-size:13.5px;color:var(--text);line-height:1.5;flex:1}
.ex-toggle{color:var(--text3);font-size:16px;transition:transform .2s;flex-shrink:0;margin-top:4px}
.example-card.open .ex-toggle{transform:rotate(180deg)}
.ex-body{display:none;border-top:1px solid var(--border)}
.example-card.open .ex-body{display:block}
.ex-explain{background:rgba(74,158,255,.04);border-right:3px solid var(--blue2);padding:.75rem 1rem;margin:.75rem 1rem 0}
.ex-explain p{color:var(--text2);font-size:13px;line-height:1.6}
.ex-explain p strong{color:var(--text);font-weight:600}

/* CODE BLOCK */
.code-block{margin:.75rem 1rem 1rem;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.code-hdr{background:var(--bg4);border-bottom:1px solid var(--border);padding:6px 12px;display:flex;align-items:center;justify-content:space-between}
.code-lang{font-size:11px;color:var(--text3);font-family:var(--mono);font-weight:600;letter-spacing:.5px}
.copy-btn{background:transparent;border:none;color:var(--text2);cursor:pointer;font-size:11px;font-family:var(--font);padding:2px 8px;border-radius:4px;transition:all .15s}
.copy-btn:hover{background:var(--border);color:var(--text)}
.copy-btn.ok{color:var(--green)}
pre{background:var(--bg);padding:1rem;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.8;scrollbar-width:thin;scrollbar-color:var(--border) transparent}

/* SYNTAX HIGHLIGHT */
.kw{color:#ff7b72}.fn{color:#d2a8ff}.str{color:#a5d6ff}.num{color:#79c0ff}
.cmt{color:#4a6080;font-style:italic}.tbl{color:#7ee787}.col{color:#e6edf3}.op{color:#ffa657}

/* TAGS */
.tag{display:inline-flex;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-right:6px;letter-spacing:.3px}
.tag-b{background:rgba(0,230,118,.1);color:var(--green);border:1px solid rgba(0,230,118,.25)}
.tag-m{background:rgba(255,140,66,.1);color:var(--orange);border:1px solid rgba(255,140,66,.25)}
.tag-a{background:rgba(210,168,255,.1);color:var(--purple);border:1px solid rgba(210,168,255,.25)}

.chapter{display:none}
.chapter.active{display:block}

/* HAMBURGER */
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;background:none;border:none;z-index:200}
.hamburger span{display:block;width:24px;height:2px;background:var(--text);border-radius:2px;transition:all .3s}
.hamburger.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px)}
.hamburger.open span:nth-child(2){opacity:0}
.hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px)}
.mobile-menu{display:none;position:fixed;inset:0;top:49px;background:rgba(6,10,15,.98);z-index:150;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem}
.mobile-menu.open{display:flex}
.mobile-menu a{color:var(--text);text-decoration:none;font-size:1.3rem;font-weight:700;padding:.5rem 2rem;border-radius:10px;transition:all .2s}
@media(max-width:768px){
.hamburger{display:flex}
.topnav-links{display:none}
.topnav-title{font-size:12px}
.main{padding:1rem .75rem 4rem}
pre{font-size:11px;line-height:1.5}
.layout{flex-direction:column}
.sidebar{display:none}
.video-grid{grid-template-columns:1fr}
.filter-row{flex-wrap:wrap;gap:.4rem}
.lesson-tabs{padding:0}
.lesson-tab{font-size:11px;padding:.6rem .4rem}
.progress-section{flex-direction:column;gap:1rem}
.step-body p{font-size:13px}
.file-grid{grid-template-columns:1fr}
.section-divider{padding:.6rem .75rem}
.q-text{font-size:13px}
.code-block{margin:.5rem}
}


@media(max-width:768px){
  /* Better touch targets */
  a, button{min-height:40px;display:inline-flex;align-items:center}
  /* Prevent horizontal scroll */
  body{overflow-x:hidden;-webkit-text-size-adjust:100%}
  /* Better table display on mobile */
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* Code blocks */
  pre,code{font-size:11px;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;white-space:pre-wrap;word-break:break-word}
  /* Images responsive */
  img{max-width:100%;height:auto}
}
@media(max-width:480px){
  body{font-size:14px}
  h1{font-size:1.5rem!important}
  h2{font-size:1.2rem!important}
}

@media(max-width:768px){
  /* Topnav */
  .topnav{padding:.5rem .75rem;flex-wrap:wrap;gap:.4rem;height:auto}
  .topnav-links,.nav-links-desktop{display:none!important}

  .quiz-container,.quiz-wrap{padding:.75rem!important}

  .video-grid{grid-template-columns:1fr!important}

  /* Course / Study / Lessons */
  .chapter,.section-block{padding:.85rem!important}

@media(max-width:480px){

{title:"Example 2 — Retrieve a single column: customer company names",tag:"b",
explain:"Select only the company column. Less load on the server and more readable.",
code:`<span class="kw">SELECT</span> <span class="col">company</span> <span class="kw">FROM</span> <span class="tbl">customers</span>;`},
{title:"Example 3 — Multiple columns: employees' first name, last name, and job title",tag:"b",
explain:"Separate columns with a comma. The order you write = the order shown in the result.",
code:`<span class="kw">SELECT</span> <span class="col">first_name</span>, <span class="col">last_name</span>, <span class="col">job_title</span>\n<span class="kw">FROM</span> <span class="tbl">employees</span>;`},
{title:"Example 4 — AS (Alias): an alternative name for a column",tag:"b",
explain:"AS gives a display name. It does not change the table! A name with spaces → in single quotes.",
code:`<span class="kw">SELECT</span> <span class="col">product_name</span> <span class="kw">AS</span> <span class="str">'Product Name'</span>, <span class="col">list_price</span> <span class="kw">AS</span> <span class="str">'Price'</span>\n<span class="kw">FROM</span> <span class="tbl">products</span>;`},
{title:"Example 5 — Retrieve selected fields from orders",tag:"b",
explain:"From the orders table: order ID, date, and ship city — exactly what you need.",
code:`<span class="kw">SELECT</span> <span class="col">id</span>, <span class="col">order_date</span>, <span class="col">ship_city</span>\n<span class="kw">FROM</span> <span class="tbl">orders</span>;`},
]},
{label:"📌 Part 2: DISTINCT & Text Functions",examples:[
{title:"Example 1 — DISTINCT: unique countries",tag:"b",
explain:"DISTINCT removes duplicates. Even with 100 customers from the USA — USA appears only once.",
code:`<span class="kw">SELECT DISTINCT</span> <span class="col">country_region</span>\n<span class="kw">FROM</span> <span class="tbl">customers</span>;`},
{title:"Example 2 — LEFT and RIGHT: phone prefix and suffix",tag:"b",
explain:"LEFT(col,3) = first 3 characters. RIGHT(col,4) = last 4. Useful for short codes.",
code:`<span class="kw">SELECT</span> <span class="col">company</span>, <span class="fn">LEFT</span>(<span class="col">company</span>, <span class="num">3</span>) <span class="kw">AS</span> <span class="str">comp_prefix</span>,\n       <span class="col">business_phone</span>, <span class="fn">RIGHT</span>(<span class="col">business_phone</span>, <span class="num">4</span>) <span class="kw">AS</span> <span class="str">phone_suffix</span>\n<span class="kw">FROM</span> <span class="tbl">customers</span>\n<span class="kw">WHERE</span> <span class="col">business_phone</span> <span class="kw">IS NOT NULL</span>;`},
{title:"Example 3 — SUBSTRING: extract from a specific position",tag:"b",
explain:"SUBSTRING(col, 2, 5) = 5 characters starting at the 2nd. Position starts at 1.",
code:`<span class="kw">SELECT</span> <span class="col">product_name</span>,\n       <span class="fn">SUBSTRING</span>(<span class="col">product_name</span>, <span class="num">2</span>, <span class="num">5</span>) <span class="kw">AS</span> <span class="str">middle_text</span>\n<span class="kw">FROM</span> <span class="tbl">products</span>;`},
{title:"Example 4 — TRIM, LTRIM, RTRIM: cleaning whitespace",tag:"b",
explain:"LTRIM = leading spaces. RTRIM = trailing. TRIM = both sides. Critical for cleaning manually entered data.",
code:`<span class="kw">SELECT</span>\n  <span class="fn">LTRIM</span>(<span class="str">'   LeftSpace'</span>) <span class="kw">AS</span> <span class="str">l_trimmed</span>,\n  <span class="fn">RTRIM</span>(<span class="str">'RightSpace   '</span>) <span class="kw">AS</span> <span class="str">r_trimmed</span>,\n  <span class="fn">TRIM</span>(<span class="str">'   BothSides   '</span>) <span class="kw">AS</span> <span class="str">full_trimmed</span>;`},
{title:"Example 5 — REPLACE and UPPER: replacing and normalizing",tag:"m",
explain:"REPLACE(col,'UK','United Kingdom') replaces text. UPPER() converts to uppercase.",
code:`<span class="kw">SELECT</span> <span class="fn">UPPER</span>(<span class="col">company</span>) <span class="kw">AS</span> <span class="str">company_caps</span>,\n       <span class="fn">REPLACE</span>(<span class="col">country_region</span>, <span class="str">'UK'</span>, <span class="str">'United Kingdom'</span>) <span class="kw">AS</span> <span class="str">country</span>\n<span class="kw">FROM</span> <span class="tbl">customers</span>\n<span class="kw">WHERE</span> <span class="col">country_region</span> = <span class="str">'UK'</span>;`},
]},
{label:"📌 Part 3: Math Calculations",examples:[
{title:"Example 1 — Profit per unit: price minus cost",tag:"b",
explain:"SQL computes on the fly — the table is unchanged. list_price - standard_cost = gross profit.",
code:`<span class="kw">SELECT</span> <span class="col">product_name</span>, <span class="col">list_price</span>, <span class="col">standard_cost</span>,\n       (<span class="col">list_price</span> <span class="op">-</span> <span class="col">standard_cost</span>) <span class="kw">AS</span> <span class="str">unit_profit</span>\n<span class="kw">FROM</span> <span class="tbl">products</span>;`},
{title:"Example 2 — Total inventory value: price × target quantity",tag:"b",
explain:"Multiplying two columns computes the total inventory value per product.",
code:`<span class="kw">SELECT</span> <span class="col">product_name</span>,\n       (<span class="col">list_price</span> <span class="op">*</span> <span class="col">target_level</span>) <span class="kw">AS</span> <span class="str">total_stock_value</span>\n<span class="kw">FROM</span> <span class="tbl">products</span>;`},
{title:"Example 3 — ROUND: price with 17% tax, 2 decimals",tag:"b",
explain:"list_price * 1.17 adds 17%. ROUND(..., 2) rounds to two decimal places.",
code:`<span class="kw">SELECT</span> <span class="col">product_name</span>,\n       <span class="fn">ROUND</span>(<span class="col">list_price</span> <span class="op">*</span> <span class="num">1.17</span>, <span class="num">2</span>) <span class="kw">AS</span> <span class="str">price_with_tax</span>\n<span class="kw">FROM</span> <span class="tbl">products</span>;`},
{title:"Example 4 — MOD: remainder when splitting into packs",tag:"m",
explain:"MOD(target_level, 12) = how many products are left over outside a full pack of 12.",
code:`<span class="kw">SELECT</span> <span class="col">product_name</span>, <span class="col">target_level</span>,\n       <span class="fn">MOD</span>(<span class="col">target_level</span>, <span class="num">12</span>) <span class="kw">AS</span> <span class="str">loose_items</span>\n<span class="kw">FROM</span> <span class="tbl">products</span>;`},
{title:"Example 5 — ABS: absolute difference between stock and target",tag:"m",
explain:"ABS always guarantees a positive result. No matter which is larger — the difference is always positive.",
code:`<span class="kw">SELECT</span> <span class="col">product_name</span>,\n       <span class="fn">ABS</span>(<span class="col">target_level</span> <span class="op">-</span> <span class="col">reorder_level</span>) <span class="kw">AS</span> <span class="str">stock_gap</span>\n<span class="kw">FROM</span> <span class="tbl">products</span>;`},
]},
{label:"📌 Part 4: ORDER BY, LIMIT, OFFSET",examples:[
{title:"Example 1 — ORDER BY DESC: products from most to least expensive",tag:"b",
explain:"DESC = descending order. list_price DESC = from the highest price to the lowest.",
code:`<span class="kw">SELECT</span> <span class="col">product_name</span>, <span class="col">list_price</span>\n<span class="kw">FROM</span> <span class="tbl">products</span>\n<span class="kw">ORDER BY</span> <span class="col">list_price</span> <span class="kw">DESC</span>;`},
{title:"Example 2 — Double sort: country, then city",tag:"b",
explain:"Two columns in ORDER BY: country first, ties broken by city. ASC is the default.",
code:`<span class="kw">SELECT</span> <span class="col">country_region</span>, <span class="col">city</span>, <span class="col">company</span>\n<span class="kw">FROM</span> <span class="tbl">customers</span>\n<span class="kw">ORDER BY</span> <span class="col">country_region</span>, <span class="col">city</span>;`},
{title:"Example 3 — LIMIT: the 5 most expensive products",tag:"b",
explain:"ORDER BY DESC sorts from the most expensive. LIMIT 5 takes only the first 5.",
code:`<span class="kw">SELECT</span> <span class="col">product_name</span>, <span class="col">list_price</span>\n<span class="kw">FROM</span> <span class="tbl">products</span>\n<span class="kw">ORDER BY</span> <span class="col">list_price</span> <span class="kw">DESC</span>\n<span class="kw">LIMIT</span> <span class="num">5</span>;`},
{title:"Example 4 — Sort by last-name length (CHAR_LENGTH)",tag:"m",
explain:"CHAR_LENGTH returns the number of characters. You can sort by any expression — not just a column.",
code:`<span class="kw">SELECT</span> <span class="col">last_name</span>\n<span class="kw">FROM</span> <span class="tbl">employees</span>\n<span class="kw">ORDER BY</span> <span class="fn">CHAR_LENGTH</span>(<span class="col">last_name</span>) <span class="kw">DESC</span>;`},
{title:"Example 5 — OFFSET: skip 10, show the next 5",tag:"m",
explain:"LIMIT 5 OFFSET 10 = the second page of results. OFFSET sets where to start counting.",
code:`<span class="kw">SELECT</span> <span class="col">product_name</span>\n<span class="kw">FROM</span> <span class="tbl">products</span>\n<span class="kw">ORDER BY</span> <span class="col">id</span>\n<span class="kw">LIMIT</span> <span class="num">5</span> <span class="kw">OFFSET</span> <span class="num">10</span>;`},
]},
],
examples:[]},

{num:5,icon:"📅",title:"Dates",desc:"Extracting parts, formatting, and computing differences — full work with dates.",
syntax:"YEAR(date) / MONTH(date) / DAY(date)\nDATE_FORMAT(date, '%d/%m/%Y')\nDATEDIFF(date2, date1) -- number of days\nDATE_ADD(date, INTERVAL 30 DAY)",
concepts:[
{label:"Extracting Parts",text:"<strong>YEAR() MONTH() DAY()</strong> — extract a part of the date. Use in WHERE to filter time periods."},
{label:"DATE_FORMAT",text:"<strong>%d</strong>=day <strong>%m</strong>=month <strong>%Y</strong>=4-digit year <strong>%M</strong>=month name <strong>%H:%i</strong>=hour:minute"},
{label:"DATEDIFF",text:"<strong>DATEDIFF(later, earlier)</strong> = days. Order matters! Reversed → a negative number."},
{label:"DATE_ADD / DATE_SUB",text:"<strong>DATE_ADD(date, INTERVAL 30 DAY)</strong> adds 30 days. DATE_SUB subtracts."},
],
examples:[
{title:"Example 1 — YEAR: the year each order was placed",tag:"b",
explain:"YEAR() extracts the year from the date. Can be combined in WHERE to filter a specific year.",
code:`<span class="kw">SELECT</span> <span class="col">id</span>, <span class="fn">YEAR</span>(<span class="col">order_date</span>) <span class="kw">AS</span> <span class="str">order_year</span>\n<span class="kw">FROM</span> <span class="tbl">orders</span>;`},
{title:"Example 2 — MONTH: the month placed",tag:"b",
explain:"MONTH() returns a number 1-12. You can filter by month across any year.",
code:`<span class="kw">SELECT</span> <span class="col">id</span>, <span class="fn">MONTH</span>(<span class="col">order_date</span>) <span class="kw">AS</span> <span class="str">order_month</span>\n<span class="kw">FROM</span> <span class="tbl">orders</span>;`},
{title:"Example 3 — DATE_FORMAT: day/month/year format",tag:"b",
explain:"'%d/%m/%Y' = DD/MM/YYYY. You can build any display format you like.",
code:`<span class="kw">SELECT</span> <span class="col">id</span>,\n       <span class="fn">DATE_FORMAT</span>(<span class="col">order_date</span>, <span class="str">'%d/%m/%Y'</span>) <span class="kw">AS</span> <span class="str">il_date</span>\n<span class="kw">FROM</span> <span class="tbl">orders</span>;`},
{title:"Example 4 — DATEDIFF: shipping days",tag:"m",
explain:"DATEDIFF(shipped, ordered) = the number of days from order to shipment. Important: order matters!",
code:`<span class="kw">SELECT</span> <span class="col">id</span>,\n       <span class="fn">DATEDIFF</span>(<span class="col">shipped_date</span>, <span class="col">order_date</span>) <span class="kw">AS</span> <span class="str">shipping_days</span>\n<span class="kw">FROM</span> <span class="tbl">orders</span>;`},
{title:"Example 5 — DATE_ADD: net + 30",tag:"m",
explain:"DATE_ADD adds an INTERVAL. You can specify DAY, MONTH, YEAR, HOUR, and more.",
code:`<span class="kw">SELECT</span> <span class="col">id</span>, <span class="col">order_date</span>,\n       <span class="fn">DATE_ADD</span>(<span class="col">order_date</span>, <span class="kw">INTERVAL</span> <span class="num">30</span> <span class="kw">DAY</span>) <span class="kw">AS</span> <span class="str">due_date</span>\n<span class="kw">FROM</span> <span class="tbl">orders</span>;`},
]},

{num:6,icon:"🔎",title:"WHERE — Filtering",desc:"Filtering rows by conditions. The most useful tool in everyday work.",
syntax:"WHERE column = 'value' AND/OR ...\nIN ('a','b','c')\nBETWEEN x AND y\nLIKE '%pattern%'\nIS NULL / IS NOT NULL",
concepts:[
{label:"AND / OR / NOT",text:"<strong>AND</strong> = both. <strong>OR</strong> = at least one. Use parentheses to control precedence: <strong>WHERE (a OR b) AND c</strong>"},
{label:"IN",text:"<strong>IN ('London','Paris')</strong> = shorthand for multiple ORs. More efficient and readable."},
{label:"BETWEEN",text:"<strong>BETWEEN 20 AND 50</strong> = inclusive of both 20 and 50! Equivalent to: >= 20 AND <= 50"},
{label:"LIKE",text:"<strong>%</strong> = any number of characters. <strong>_</strong> = a single character. 'j%' starts with j. '%@gmail%' contains gmail."},
],
examples:[
{title:"Example 1 — Basic WHERE: price over 50",tag:"b",
explain:"A simple comparison condition. You can use: > < >= <= = != (not equal).",
code:`<span class="kw">SELECT</span> <span class="col">product_name</span>, <span class="col">list_price</span>\n<span class="kw">FROM</span> <span class="tbl">products</span>\n<span class="kw">WHERE</span> <span class="col">list_price</span> > <span class="num">50</span>;`},
{title:"Example 2 — AND: country + city",tag:"b",
explain:"AND = both conditions must hold. The customer must be from both the USA and NY.",
code:`<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">customers</span>\n<span class="kw">WHERE</span> <span class="col">country_region</span> = <span class="str">'USA'</span>\n  <span class="kw">AND</span> <span class="col">city</span> = <span class="str">'New York'</span>;`},
{title:"Example 3 — IN: several cities",tag:"b",
explain:"IN = shorthand for OR. Much easier to read and maintain.",
code:`<span class="kw">SELECT</span> <span class="col">company</span>, <span class="col">city</span>\n<span class="kw">FROM</span> <span class="tbl">suppliers</span>\n<span class="kw">WHERE</span> <span class="col">city</span> <span class="kw">IN</span> (<span class="str">'Tokyo'</span>, <span class="str">'London'</span>, <span class="str">'New York'</span>);`},
{title:"Example 4 — LIKE: pattern search",tag:"m",
explain:"% = any number of characters. Here: emails ending in a specific domain.",
code:`<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">employees</span>\n<span class="kw">WHERE</span> <span class="col">email_address</span> <span class="kw">LIKE</span> <span class="str">'%northwindtraders.com'</span>;`},
{title:"Example 5 — IS NULL: orders that weren't shipped",tag:"m",
explain:"NULL = a missing value. You must use IS NULL, not = NULL! A classic beginner mistake.",
code:`<span class="kw">SELECT</span> <span class="col">id</span>, <span class="col">order_date</span>\n<span class="kw">FROM</span> <span class="tbl">orders</span>\n<span class="kw">WHERE</span> <span class="col">shipped_date</span> <span class="kw">IS NULL</span>;`},
]},

{num:7,icon:"📦",title:"GROUP BY & Aggregation",desc:"Grouping data and computing statistics. Includes HAVING, ROLLUP, and UNION.",
syntax:"SELECT column, COUNT(*) / SUM() / AVG()\nFROM table\nGROUP BY column\nHAVING COUNT(*) > 5;",
concepts:[
{label:"Aggregate Functions",text:"<strong>COUNT(*)</strong> count | <strong>SUM()</strong> sum | <strong>AVG()</strong> average | <strong>MIN/MAX()</strong> extremes"},
{label:"The GROUP BY Rule",text:"Every non-aggregate column in SELECT <strong>must</strong> appear in GROUP BY. Otherwise — an error."},
{label:"WHERE vs HAVING",text:"<strong>WHERE</strong> = before grouping (on rows). <strong>HAVING</strong> = after grouping (on groups). Aggregates are not allowed in WHERE."},
{label:"ROLLUP",text:"<strong>GROUP BY col WITH ROLLUP</strong> — adds a grand-total row (NULL in the grouping column)."},
],
examples:[
{title:"Example 1 — COUNT: products in each category",tag:"b",
explain:"GROUP BY groups; COUNT(*) counts every row in the group.",
code:`<span class="kw">SELECT</span> <span class="col">category</span>, <span class="fn">COUNT</span>(*) <span class="kw">AS</span> <span class="str">product_count</span>\n<span class="kw">FROM</span> <span class="tbl">products</span>\n<span class="kw">GROUP BY</span> <span class="col">category</span>;`},
{title:"Example 2 — SUM: shipping fees by company",tag:"b",
explain:"SUM totals shipping_fee for each shipper_id separately.",
code:`<span class="kw">SELECT</span> <span class="col">shipper_id</span>,\n       <span class="fn">SUM</span>(<span class="col">shipping_fee</span>) <span class="kw">AS</span> <span class="str">total_shipping</span>\n<span class="kw">FROM</span> <span class="tbl">orders</span>\n<span class="kw">GROUP BY</span> <span class="col">shipper_id</span>;`},
{title:"Example 3 — WHERE before GROUP BY",tag:"m",
explain:"WHERE filters first (before grouping). Here: only products over 20, then the average per supplier.",
code:`<span class="kw">SELECT</span> <span class="col">supplier_id</span>, <span class="fn">AVG</span>(<span class="col">list_price</span>) <span class="kw">AS</span> <span class="str">avg_price</span>\n<span class="kw">FROM</span> <span class="tbl">products</span>\n<span class="kw">WHERE</span> <span class="col">list_price</span> > <span class="num">20</span>\n<span class="kw">GROUP BY</span> <span class="col">supplier_id</span>;`},
{title:"Example 4 — HAVING: filtering after grouping",tag:"m",
explain:"HAVING acts on the grouped result. Here: only cities with more than 2 customers.",
code:`<span class="kw">SELECT</span> <span class="col">city</span>, <span class="fn">COUNT</span>(*) <span class="kw">AS</span> <span class="str">cnt</span>\n<span class="kw">FROM</span> <span class="tbl">customers</span>\n<span class="kw">GROUP BY</span> <span class="col">city</span>\n<span class="kw">HAVING</span> <span class="fn">COUNT</span>(*) > <span class="num">2</span>;`},
{title:"Example 5 — ROLLUP: with a grand total",tag:"a",
explain:"WITH ROLLUP adds a row with NULL and TOTAL. COALESCE replaces NULL with text.",
code:`<span class="kw">SELECT</span>\n  <span class="fn">COALESCE</span>(<span class="col">category</span>, <span class="str">'--- TOTAL ---'</span>) <span class="kw">AS</span> <span class="str">category</span>,\n  <span class="fn">COUNT</span>(*) <span class="kw">AS</span> <span class="str">total</span>\n<span class="kw">FROM</span> <span class="tbl">products</span>\n<span class="kw">GROUP BY</span> <span class="col">category</span> <span class="kw">WITH ROLLUP</span>;`},
]},

{num:8,icon:"🔗",title:"JOIN",desc:"Combining tables — the most important tool in SQL for real-world database work.",
syntax:"FROM table1 a\nINNER JOIN table2 b ON a.id = b.fk\nLEFT JOIN table3 c ON b.id = c.fk",
concepts:[
{label:"INNER JOIN",text:"Returns only rows with <strong>a match in both tables</strong>. With no match — the row disappears."},
{label:"LEFT JOIN",text:"Returns <strong>all rows from the left table</strong> + matches. With no match → NULL."},
{label:"ON — Join Condition",text:"<strong>ON a.id = b.customer_id</strong> — links a primary key (PK) to a foreign key (FK). Required!"},
{label:"Table Aliases",text:"<strong>FROM orders o JOIN customers c</strong> — o.id instead of orders.id. Shorter and clearer."},
],
examples:[
{title:"Example 1 — INNER JOIN: orders with the customer name",tag:"m",
explain:"orders contains customer_id. JOIN brings in the name from customers.",
code:`<span class="kw">SELECT</span> <span class="col">o.id</span>, <span class="col">o.order_date</span>, <span class="col">c.company</span>\n<span class="kw">FROM</span> <span class="tbl">orders</span> <span class="col">o</span>\n<span class="kw">INNER JOIN</span> <span class="tbl">customers</span> <span class="col">c</span> <span class="kw">ON</span> <span class="col">o.customer_id</span> = <span class="col">c.id</span>;`},
{title:"Example 2 — JOIN: order details with the product name",tag:"m",
explain:"order_details contains product_id. JOIN to products brings in the name.",
code:`<span class="kw">SELECT</span> <span class="col">od.order_id</span>, <span class="col">p.product_name</span>, <span class="col">od.quantity</span>\n<span class="kw">FROM</span> <span class="tbl">order_details</span> <span class="col">od</span>\n<span class="kw">INNER JOIN</span> <span class="tbl">products</span> <span class="col">p</span> <span class="kw">ON</span> <span class="col">od.product_id</span> = <span class="col">p.id</span>;`},
{title:"Example 3 — LEFT JOIN: customers even without orders",tag:"m",
explain:"LEFT JOIN keeps all customers. Those with no orders get NULL in the orders columns.",
code:`<span class="kw">SELECT</span> <span class="col">c.company</span>, <span class="col">o.id</span> <span class="kw">AS</span> <span class="str">order_id</span>\n<span class="kw">FROM</span> <span class="tbl">customers</span> <span class="col">c</span>\n<span class="kw">LEFT JOIN</span> <span class="tbl">orders</span> <span class="col">o</span> <span class="kw">ON</span> <span class="col">c.id</span> = <span class="col">o.customer_id</span>;`},
{title:"Example 4 — 4 tables: a full sales report",tag:"a",
explain:"Each JOIN adds a layer of information. customers → orders → order_details → products.",
code:`<span class="kw">SELECT</span> <span class="col">c.company</span>, <span class="col">o.order_date</span>, <span class="col">p.product_name</span>, <span class="col">od.quantity</span>\n<span class="kw">FROM</span> <span class="tbl">customers</span> <span class="col">c</span>\n<span class="kw">JOIN</span> <span class="tbl">orders</span> <span class="col">o</span> <span class="kw">ON</span> <span class="col">c.id</span> = <span class="col">o.customer_id</span>\n<span class="kw">JOIN</span> <span class="tbl">order_details</span> <span class="col">od</span> <span class="kw">ON</span> <span class="col">o.id</span> = <span class="col">od.order_id</span>\n<span class="kw">JOIN</span> <span class="tbl">products</span> <span class="col">p</span> <span class="kw">ON</span> <span class="col">od.product_id</span> = <span class="col">p.id</span>;`},
{title:"Example 5 — JOIN + GROUP BY: total sales per customer",tag:"a",
explain:"Combining JOIN and GROUP BY: join, then group by customer and sum.",
code:`<span class="kw">SELECT</span> <span class="col">c.company</span>,\n       <span class="fn">SUM</span>(<span class="col">od.quantity</span> <span class="op">*</span> <span class="col">od.unit_price</span>) <span class="kw">AS</span> <span class="str">total_revenue</span>\n<span class="kw">FROM</span> <span class="tbl">customers</span> <span class="col">c</span>\n<span class="kw">JOIN</span> <span class="tbl">orders</span> <span class="col">o</span> <span class="kw">ON</span> <span class="col">c.id</span> = <span class="col">o.customer_id</span>\n<span class="kw">JOIN</span> <span class="tbl">order_details</span> <span class="col">od</span> <span class="kw">ON</span> <span class="col">o.id</span> = <span class="col">od.order_id</span>\n<span class="kw">GROUP BY</span> <span class="col">c.company</span>\n<span class="kw">ORDER BY</span> <span class="str">total_revenue</span> <span class="kw">DESC</span>;`},
]},

{num:9,icon:"🧠",title:"Subqueries, CASE, CTE",desc:"Advanced queries — complex logic in a readable form.",
syntax:"WHERE col > (SELECT AVG(col) FROM ...)\nCASE WHEN ... THEN ... ELSE ... END\nWITH cte AS (SELECT ...) SELECT ...",
concepts:[
{label:"Subquery",text:"A query inside a query. In WHERE, in FROM (a temporary table), or in SELECT (a computed column)."},
{label:"EXISTS",text:"<strong>EXISTS (SELECT 1 FROM ... WHERE ...)</strong> = a boolean check. Faster than IN for large tables."},
{label:"CASE WHEN",text:"<strong>CASE WHEN condition THEN value ... ELSE default END</strong> — like if-else. Can be used anywhere in a query."},
{label:"CTE (WITH)",text:"<strong>WITH name AS (query)</strong> — a named temporary table. Makes long queries readable."},
],
examples:[
{title:"Example 1 — Subquery: products above the average",tag:"m",
explain:"The inner parentheses compute the average; the outer WHERE compares against it.",
code:`<span class="kw">SELECT</span> <span class="col">product_name</span>, <span class="col">list_price</span>\n<span class="kw">FROM</span> <span class="tbl">products</span>\n<span class="kw">WHERE</span> <span class="col">list_price</span> > (<span class="kw">SELECT</span> <span class="fn">AVG</span>(<span class="col">list_price</span>) <span class="kw">FROM</span> <span class="tbl">products</span>);`},
{title:"Example 2 — EXISTS: customers with orders",tag:"m",
explain:"EXISTS checks whether at least one row exists. SELECT 1 = an efficient shorthand (no real value needed).",
code:`<span class="kw">SELECT</span> <span class="col">company</span>\n<span class="kw">FROM</span> <span class="tbl">customers</span> <span class="col">c</span>\n<span class="kw">WHERE</span> <span class="kw">EXISTS</span> (\n  <span class="kw">SELECT</span> <span class="num">1</span> <span class="kw">FROM</span> <span class="tbl">orders</span> <span class="col">o</span>\n  <span class="kw">WHERE</span> <span class="col">o.customer_id</span> = <span class="col">c.id</span>\n);`},
{title:"Example 3 — CASE WHEN: price categories",tag:"m",
explain:"CASE checks conditions in order. It stops at the first one that holds. ELSE = the default.",
code:`<span class="kw">SELECT</span> <span class="col">product_name</span>, <span class="col">list_price</span>,\n  <span class="kw">CASE</span>\n    <span class="kw">WHEN</span> <span class="col">list_price</span> > <span class="num">50</span> <span class="kw">THEN</span> <span class="str">'Expensive'</span>\n    <span class="kw">WHEN</span> <span class="col">list_price</span> <span class="kw">BETWEEN</span> <span class="num">20</span> <span class="kw">AND</span> <span class="num">50</span> <span class="kw">THEN</span> <span class="str">'Mid-range'</span>\n    <span class="kw">ELSE</span> <span class="str">'Cheap'</span>\n  <span class="kw">END</span> <span class="kw">AS</span> <span class="str">price_cat</span>\n<span class="kw">FROM</span> <span class="tbl">products</span>;`},
{title:"Example 4 — CTE: large categories",tag:"a",
explain:"WITH defines a 'table' named CategoryStats. The main query uses it as if it were a real table.",
code:`<span class="kw">WITH</span> <span class="tbl">CategoryStats</span> <span class="kw">AS</span> (\n  <span class="kw">SELECT</span> <span class="col">category</span>, <span class="fn">COUNT</span>(*) <span class="kw">AS</span> <span class="str">cnt</span>\n  <span class="kw">FROM</span> <span class="tbl">products</span> <span class="kw">GROUP BY</span> <span class="col">category</span>\n)\n<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">CategoryStats</span>\n<span class="kw">WHERE</span> <span class="col">cnt</span> > <span class="num">5</span>;`},
]},

{num:10,icon:"🪟",title:"Window Functions",desc:"Sophisticated calculations that keep all rows — ranking, running totals, LAG/LEAD.",
syntax:"RANK() OVER (PARTITION BY col ORDER BY col)\nLAG(col) OVER (PARTITION BY ... ORDER BY ...)\nSUM(col) OVER (ORDER BY col ROWS BETWEEN ...)",
concepts:[
{label:"OVER()",text:"Wrap every Window Function in <strong>OVER(...)</strong>. With OVER = it does not collapse rows!"},
{label:"PARTITION BY",text:"Splits into separate windows. <strong>PARTITION BY category</strong> = a separate ranking for each category."},
{label:"ROW_NUMBER vs RANK",text:"<strong>ROW_NUMBER</strong> = always sequential | <strong>RANK</strong> = ties + gaps | <strong>DENSE_RANK</strong> = ties without gaps"},
{label:"LAG / LEAD",text:"<strong>LAG(col)</strong> = the value from the previous row. <strong>LEAD(col)</strong> = the next one. For computing changes between periods."},
],
examples:[
{title:"Example 1 — ROW_NUMBER: numbering rows",tag:"m",
explain:"ROW_NUMBER() assigns a sequential number. Always unique, even on ties.",
code:`<span class="kw">SELECT</span> <span class="col">product_name</span>, <span class="col">list_price</span>,\n       <span class="fn">ROW_NUMBER</span>() <span class="kw">OVER</span> (<span class="kw">ORDER BY</span> <span class="col">list_price</span> <span class="kw">DESC</span>) <span class="kw">AS</span> <span class="str">row_num</span>\n<span class="kw">FROM</span> <span class="tbl">products</span>;`},
{title:"Example 2 — RANK: ranking within a category",tag:"a",
explain:"PARTITION BY category = a separate window per category. RANK ranks within it.",
code:`<span class="kw">SELECT</span> <span class="col">product_name</span>, <span class="col">category</span>, <span class="col">list_price</span>,\n       <span class="fn">RANK</span>() <span class="kw">OVER</span> (<span class="kw">PARTITION BY</span> <span class="col">category</span> <span class="kw">ORDER BY</span> <span class="col">list_price</span> <span class="kw">DESC</span>) <span class="kw">AS</span> <span class="str">rank_pos</span>\n<span class="kw">FROM</span> <span class="tbl">products</span>;`},
{title:"Example 3 — LAG: a customer's previous order",tag:"a",
explain:"PARTITION BY customer_id = a separate window per customer. LAG returns the previous order date.",
code:`<span class="kw">SELECT</span> <span class="col">customer_id</span>, <span class="col">order_date</span>,\n       <span class="fn">LAG</span>(<span class="col">order_date</span>) <span class="kw">OVER</span> (<span class="kw">PARTITION BY</span> <span class="col">customer_id</span>\n         <span class="kw">ORDER BY</span> <span class="col">order_date</span>) <span class="kw">AS</span> <span class="str">prev_order</span>\n<span class="kw">FROM</span> <span class="tbl">orders</span>;`},
{title:"Example 4 — SUM: a running total",tag:"a",
explain:"SUM() OVER(ORDER BY) = a running total. Each row adds itself to the previous sum.",
code:`<span class="kw">SELECT</span> <span class="col">order_date</span>, <span class="col">shipping_fee</span>,\n       <span class="fn">SUM</span>(<span class="col">shipping_fee</span>) <span class="kw">OVER</span> (<span class="kw">ORDER BY</span> <span class="col">order_date</span>) <span class="kw">AS</span> <span class="str">running_total</span>\n<span class="kw">FROM</span> <span class="tbl">orders</span>;`},
]},

{num:11,icon:"⚙️",title:"DML, DDL, Transactions",desc:"Modifying data and structure. INSERT, UPDATE, DELETE, TRANSACTION, CREATE, ALTER.",
syntax:"INSERT INTO table (cols) VALUES (...);\nUPDATE table SET col=val WHERE ...;\nSTART TRANSACTION; ... COMMIT;",
concepts:[
{label:"DML — Modifying Data",text:"<strong>INSERT</strong> add | <strong>UPDATE</strong> update | <strong>DELETE</strong> delete. Always use WHERE with UPDATE/DELETE!"},
{label:"⚠️ Warning!",text:"<strong>UPDATE/DELETE without WHERE</strong> = changing/deleting the entire table! Always SELECT first with the same WHERE."},
{label:"TRANSACTION",text:"<strong>START TRANSACTION</strong> begins | <strong>COMMIT</strong> confirms | <strong>ROLLBACK</strong> undoes everything. All operations together."},
{label:"DDL — Modifying Structure",text:"<strong>CREATE TABLE</strong> | <strong>ALTER TABLE ADD/DROP</strong> | <strong>DROP TABLE</strong>. DDL cannot be rolled back!"},
],
examples:[
{title:"Example 1 — INSERT: adding a customer",tag:"b",
explain:"Name the columns, then the values in the same order. You can skip columns that have a default.",
code:`<span class="kw">INSERT INTO</span> <span class="tbl">customers</span> (<span class="col">company</span>, <span class="col">last_name</span>, <span class="col">first_name</span>, <span class="col">city</span>)\n<span class="kw">VALUES</span> (<span class="str">'Tech Ltd'</span>, <span class="str">'Cohen'</span>, <span class="str">'Yossi'</span>, <span class="str">'Tel Aviv'</span>);`},
{title:"Example 2 — UPDATE with WHERE",tag:"b",
explain:"WHERE is critical! Without WHERE — every price would be updated. Always SELECT first to check.",
code:`<span class="kw">UPDATE</span> <span class="tbl">products</span>\n<span class="kw">SET</span> <span class="col">list_price</span> = <span class="num">20</span>\n<span class="kw">WHERE</span> <span class="col">id</span> = <span class="num">1</span>;`},
{title:"Example 3 — TRANSACTION: a safe update",tag:"m",
explain:"Everything inside a TRANSACTION. If something fails — ROLLBACK undoes everything; COMMIT saves it.",
code:`<span class="kw">START TRANSACTION</span>;\n<span class="kw">UPDATE</span> <span class="tbl">products</span> <span class="kw">SET</span> <span class="col">list_price</span> = <span class="col">list_price</span> <span class="op">*</span> <span class="num">1.1</span> <span class="kw">WHERE</span> <span class="col">id</span> = <span class="num">5</span>;\n<span class="kw">INSERT INTO</span> <span class="tbl">orders</span> (<span class="col">id</span>, <span class="col">customer_id</span>) <span class="kw">VALUES</span> (<span class="num">9000</span>, <span class="num">4</span>);\n<span class="kw">COMMIT</span>; <span class="cmt">-- or ROLLBACK to undo</span>`},
]},

// ==================== Lesson 5: WINDOW FUNCTIONS on Sakila ====================
{num:5,icon:"🪟",title:"Lesson 5 — Window Functions (Sakila)",desc:"Window functions on the Sakila database — a movie-rental store database. Covers 6 topics: warm-up, ranking, aggregation, offset, value, and CTE.",
syntax:"function() OVER (\n  PARTITION BY column  -- split into groups\n  ORDER BY column      -- order within each window\n  ROWS BETWEEN ...    -- define the range\n)",
concepts:[
{label:"🗄️ Sakila DB — Main Tables",text:"<strong>film</strong> — films | <strong>customer</strong> — customers | <strong>payment</strong> — payments | <strong>rental</strong> — rentals | <strong>actor</strong> — actors | <strong>staff</strong> — staff"},
{label:"What is a Window Function?",text:"A function that operates on a <strong>'window'</strong> of rows relative to the current row — without collapsing (it does not return one row per group). Every row is kept, with a computed value."},
{label:"PARTITION BY",text:"Splits into separate windows, much like GROUP BY — but keeps all rows. Without PARTITION = the whole table is a single window."},
{label:"ORDER BY inside OVER",text:"Defines the <strong>order within the window</strong>. Critical for functions like ROW_NUMBER, LAG, LEAD, and running totals."},
],
sections:[
{label:"⏩ Part 0: Warm-up — GROUP BY vs Window",examples:[
{title:"Example 0.1 — GROUP BY: total payments per customer",tag:"b",
explain:"The classic GROUP BY — returns one row per customer. We don't see individual payment details.",
code:`<span class="kw">SELECT</span> <span class="col">customer_id</span>,\n       <span class="fn">SUM</span>(<span class="col">amount</span>) <span class="kw">AS</span> <span class="str">total_amount</span>\n<span class="kw">FROM</span> <span class="tbl">payment</span>\n<span class="kw">GROUP BY</span> <span class="col">customer_id</span>;`},
{title:"Example 0.2 — GROUP BY: average film length by rating",tag:"b",
explain:"Average length (AVG) for each rating separately. This is the old approach — a Window Function will let us see the average next to each film.",
code:`<span class="kw">SELECT</span> <span class="col">rating</span>,\n       <span class="fn">AVG</span>(<span class="col">length</span>) <span class="kw">AS</span> <span class="str">avg_length</span>\n<span class="kw">FROM</span> <span class="tbl">film</span>\n<span class="kw">GROUP BY</span> <span class="col">rating</span>;`},
]},
{label:"🏆 Part 1: Ranking Functions",examples:[
{title:"1.1 — ROW_NUMBER: global numbering by name",tag:"b",
explain:"ROW_NUMBER() numbers every row sequentially. Always unique, even on ties. ORDER BY first_name = alphabetical order.",
code:`<span class="kw">SELECT</span>\n  <span class="col">first_name</span>, <span class="col">last_name</span>,\n  <span class="fn">ROW_NUMBER</span>() <span class="kw">OVER</span> (<span class="kw">ORDER BY</span> <span class="col">first_name</span>) <span class="kw">AS</span> <span class="str">global_row_num</span>\n<span class="kw">FROM</span> <span class="tbl">customer</span>;`},
{title:"1.2 — ROW_NUMBER: numbering rentals for each customer separately",tag:"m",
explain:"PARTITION BY customer_id = a separate window per customer. ORDER BY rental_date DESC = newest to oldest. This numbers rentals for each customer separately.",
code:`<span class="kw">SELECT</span>\n  <span class="col">customer_id</span>, <span class="col">rental_date</span>,\n  <span class="fn">ROW_NUMBER</span>() <span class="kw">OVER</span> (\n    <span class="kw">PARTITION BY</span> <span class="col">customer_id</span>\n    <span class="kw">ORDER BY</span> <span class="col">rental_date</span> <span class="kw">DESC</span>\n  ) <span class="kw">AS</span> <span class="str">customer_rental_order</span>\n<span class="kw">FROM</span> <span class="tbl">rental</span>;`},
{title:"1.3 — RANK: global ranking by film length",tag:"b",
explain:"RANK() gives the same rank on ties — then skips. Two films of equal length both get rank 1, and the next gets rank 3.",
code:`<span class="kw">SELECT</span>\n  <span class="col">title</span>, <span class="col">length</span>,\n  <span class="fn">RANK</span>() <span class="kw">OVER</span> (<span class="kw">ORDER BY</span> <span class="col">length</span> <span class="kw">DESC</span>) <span class="kw">AS</span> <span class="str">global_rank</span>\n<span class="kw">FROM</span> <span class="tbl">film</span>;`},
{title:"1.4 — RANK: ranking by length within each rating",tag:"m",
explain:"PARTITION BY rating = each rating gets its own ranking. The longest PG film gets rank 1 within PG.",
code:`<span class="kw">SELECT</span>\n  <span class="col">title</span>, <span class="col">rating</span>, <span class="col">length</span>,\n  <span class="fn">RANK</span>() <span class="kw">OVER</span> (\n    <span class="kw">PARTITION BY</span> <span class="col">rating</span>\n    <span class="kw">ORDER BY</span> <span class="col">length</span> <span class="kw">DESC</span>\n  ) <span class="kw">AS</span> <span class="str">rank_in_rating</span>\n<span class="kw">FROM</span> <span class="tbl">film</span>;`},
{title:"1.5 — DENSE_RANK: dense ranking with no gaps",tag:"b",
explain:"DENSE_RANK() is like RANK but without jumps — after two rank-1s comes rank 2 (not 3). Useful for clean rankings.",
code:`<span class="kw">SELECT</span>\n  <span class="col">title</span>, <span class="col">replacement_cost</span>,\n  <span class="fn">DENSE_RANK</span>() <span class="kw">OVER</span> (<span class="kw">ORDER BY</span> <span class="col">replacement_cost</span> <span class="kw">DESC</span>) <span class="kw">AS</span> <span class="str">cost_rank</span>\n<span class="kw">FROM</span> <span class="tbl">film</span>;`},
{title:"1.6 — DENSE_RANK: cost ranking by rating",tag:"m",
explain:"Combining PARTITION + DENSE_RANK. Each rating group gets its own dense cost ranking.",
code:`<span class="kw">SELECT</span>\n  <span class="col">title</span>, <span class="col">rating</span>, <span class="col">replacement_cost</span>,\n  <span class="fn">DENSE_RANK</span>() <span class="kw">OVER</span> (\n    <span class="kw">PARTITION BY</span> <span class="col">rating</span>\n    <span class="kw">ORDER BY</span> <span class="col">replacement_cost</span> <span class="kw">DESC</span>\n  ) <span class="kw">AS</span> <span class="str">cost_rank_in_rating</span>\n<span class="kw">FROM</span> <span class="tbl">film</span>;`},
{title:"1.7 — NTILE(4): split into quartiles by length",tag:"m",
explain:"NTILE(N) splits all rows into N equal groups. NTILE(4) = quartiles (Q1-Q4). Useful for percentile analysis.",
code:`<span class="kw">SELECT</span>\n  <span class="col">title</span>, <span class="col">length</span>,\n  <span class="fn">NTILE</span>(<span class="num">4</span>) <span class="kw">OVER</span> (<span class="kw">ORDER BY</span> <span class="col">length</span>) <span class="kw">AS</span> <span class="str">quartile</span>\n<span class="kw">FROM</span> <span class="tbl">film</span>;`},
{title:"1.8 — NTILE(3): tertiles by rating",tag:"m",
explain:"Splitting into 3 groups (tertiles) within each rating separately. PARTITION BY rating + NTILE(3).",
code:`<span class="kw">SELECT</span>\n  <span class="col">title</span>, <span class="col">rating</span>, <span class="col">length</span>,\n  <span class="fn">NTILE</span>(<span class="num">3</span>) <span class="kw">OVER</span> (\n    <span class="kw">PARTITION BY</span> <span class="col">rating</span>\n    <span class="kw">ORDER BY</span> <span class="col">length</span>\n  ) <span class="kw">AS</span> <span class="str">tertile_in_rating</span>\n<span class="kw">FROM</span> <span class="tbl">film</span>;`},
]},
{label:"📊 Part 2: Aggregation Functions",examples:[
{title:"2.1 — SUM: global running total of payments",tag:"b",
explain:"SUM() OVER(ORDER BY date) = a running total. Each row adds itself to the previous sum. Very useful for financial reports.",
code:`<span class="kw">SELECT</span>\n  <span class="col">payment_date</span>, <span class="col">amount</span>,\n  <span class="fn">SUM</span>(<span class="col">amount</span>) <span class="kw">OVER</span> (<span class="kw">ORDER BY</span> <span class="col">payment_date</span>) <span class="kw">AS</span> <span class="str">running_total</span>\n<span class="kw">FROM</span> <span class="tbl">payment</span>;`},
{title:"2.2 — SUM: a running balance for each customer separately",tag:"m",
explain:"PARTITION BY customer_id = a separate running total per customer. Like a bank account — how much a customer has paid up to each point in time.",
code:`<span class="kw">SELECT</span>\n  <span class="col">customer_id</span>, <span class="col">payment_date</span>, <span class="col">amount</span>,\n  <span class="fn">SUM</span>(<span class="col">amount</span>) <span class="kw">OVER</span> (\n    <span class="kw">PARTITION BY</span> <span class="col">customer_id</span>\n    <span class="kw">ORDER BY</span> <span class="col">payment_date</span>\n  ) <span class="kw">AS</span> <span class="str">customer_running_total</span>\n<span class="kw">FROM</span> <span class="tbl">payment</span>;`},
{title:"2.3 — AVG: comparing each film to the overall average",tag:"b",
explain:"AVG() OVER() with no ORDER BY or PARTITION = the average over the whole table. Shown next to each row. diff_from_avg = the difference.",
code:`<span class="kw">SELECT</span>\n  <span class="col">title</span>, <span class="col">length</span>,\n  <span class="fn">AVG</span>(<span class="col">length</span>) <span class="kw">OVER</span>() <span class="kw">AS</span> <span class="str">global_avg</span>,\n  <span class="col">length</span> <span class="op">-</span> <span class="fn">AVG</span>(<span class="col">length</span>) <span class="kw">OVER</span>() <span class="kw">AS</span> <span class="str">diff_from_avg</span>\n<span class="kw">FROM</span> <span class="tbl">film</span>;`},
{title:"2.4 — AVG: each film vs the average of its rating",tag:"m",
explain:"PARTITION BY rating = a different average per rating. Each film is compared to its group's average — not the overall one.",
code:`<span class="kw">SELECT</span>\n  <span class="col">title</span>, <span class="col">rating</span>, <span class="col">length</span>,\n  <span class="fn">AVG</span>(<span class="col">length</span>) <span class="kw">OVER</span> (<span class="kw">PARTITION BY</span> <span class="col">rating</span>) <span class="kw">AS</span> <span class="str">rating_avg</span>\n<span class="kw">FROM</span> <span class="tbl">film</span>;`},
{title:"2.5 — COUNT: a running count of transactions",tag:"b",
explain:"COUNT() OVER(ORDER BY date) = how many transactions occurred so far. Grows with each row. Useful for tracking activity pace.",
code:`<span class="kw">SELECT</span>\n  <span class="col">payment_id</span>, <span class="col">payment_date</span>,\n  <span class="fn">COUNT</span>(<span class="col">payment_id</span>) <span class="kw">OVER</span> (<span class="kw">ORDER BY</span> <span class="col">payment_date</span>) <span class="kw">AS</span> <span class="str">total_so_far</span>\n<span class="kw">FROM</span> <span class="tbl">payment</span>;`},
{title:"2.6 — COUNT: counting rentals per employee over time",tag:"m",
explain:"PARTITION BY staff_id = separate tracking per employee. How many rentals the employee handled up to each point in time.",
code:`<span class="kw">SELECT</span>\n  <span class="col">staff_id</span>, <span class="col">rental_date</span>,\n  <span class="fn">COUNT</span>(<span class="col">rental_id</span>) <span class="kw">OVER</span> (\n    <span class="kw">PARTITION BY</span> <span class="col">staff_id</span>\n    <span class="kw">ORDER BY</span> <span class="col">rental_date</span>\n  ) <span class="kw">AS</span> <span class="str">staff_rentals_so_far</span>\n<span class="kw">FROM</span> <span class="tbl">rental</span>;`},
{title:"2.7 — MAX: the highest payment in the store (global)",tag:"b",
explain:"MAX() OVER() with no PARTITION = the maximum over the whole table. Appears next to each row — useful for comparisons.",
code:`<span class="kw">SELECT</span>\n  <span class="col">payment_id</span>, <span class="col">amount</span>,\n  <span class="fn">MAX</span>(<span class="col">amount</span>) <span class="kw">OVER</span>() <span class="kw">AS</span> <span class="str">max_global</span>\n<span class="kw">FROM</span> <span class="tbl">payment</span>;`},
{title:"2.8 — MAX: the highest payment of each customer",tag:"m",
explain:"PARTITION BY customer_id = a different maximum per customer. Next to each payment — the highest amount that customer ever paid.",
code:`<span class="kw">SELECT</span>\n  <span class="col">customer_id</span>, <span class="col">amount</span>,\n  <span class="fn">MAX</span>(<span class="col">amount</span>) <span class="kw">OVER</span> (<span class="kw">PARTITION BY</span> <span class="col">customer_id</span>) <span class="kw">AS</span> <span class="str">max_per_customer</span>\n<span class="kw">FROM</span> <span class="tbl">payment</span>;`},
]},
{label:"⬅️ Part 3: Offset Functions (LAG / LEAD)",examples:[
{title:"3.1 — LAG: what was the customer's previous payment?",tag:"m",
explain:"LAG(col) returns the value from the previous row. PARTITION BY customer_id = previous within the same customer. First row → NULL.",
code:`<span class="kw">SELECT</span>\n  <span class="col">customer_id</span>, <span class="col">payment_date</span>, <span class="col">amount</span>,\n  <span class="fn">LAG</span>(<span class="col">amount</span>) <span class="kw">OVER</span> (\n    <span class="kw">PARTITION BY</span> <span class="col">customer_id</span>\n    <span class="kw">ORDER BY</span> <span class="col">payment_date</span>\n  ) <span class="kw">AS</span> <span class="str">prev_amount</span>\n<span class="kw">FROM</span> <span class="tbl">payment</span>;`},
{title:"3.2 — LAG: computing the delta from the previous payment",tag:"m",
explain:"amount - LAG(amount) = how much the payment rose/fell. Positive = rose, negative = fell. Useful for trend analysis.",
code:`<span class="kw">SELECT</span>\n  <span class="col">customer_id</span>, <span class="col">payment_date</span>, <span class="col">amount</span>,\n  <span class="col">amount</span> <span class="op">-</span> <span class="fn">LAG</span>(<span class="col">amount</span>) <span class="kw">OVER</span> (\n    <span class="kw">PARTITION BY</span> <span class="col">customer_id</span>\n    <span class="kw">ORDER BY</span> <span class="col">payment_date</span>\n  ) <span class="kw">AS</span> <span class="str">diff_from_last</span>\n<span class="kw">FROM</span> <span class="tbl">payment</span>;`},
{title:"3.3 — LEAD: what will the next payment be?",tag:"m",
explain:"LEAD(col) = the value from the next row. The opposite of LAG. Last row → NULL. Useful for forecasting and analysis.",
code:`<span class="kw">SELECT</span>\n  <span class="col">customer_id</span>, <span class="col">payment_date</span>, <span class="col">amount</span>,\n  <span class="fn">LEAD</span>(<span class="col">amount</span>) <span class="kw">OVER</span> (\n    <span class="kw">PARTITION BY</span> <span class="col">customer_id</span>\n    <span class="kw">ORDER BY</span> <span class="col">payment_date</span>\n  ) <span class="kw">AS</span> <span class="str">next_amount</span>\n<span class="kw">FROM</span> <span class="tbl">payment</span>;`},
{title:"3.4 — LEAD: the next rental date with a default",tag:"a",
explain:"LEAD(col, 1, default) — the third parameter is a default value when there is no 'next'. Here '2099-01-01' instead of NULL.",
code:`<span class="kw">SELECT</span>\n  <span class="col">customer_id</span>, <span class="col">rental_date</span>,\n  <span class="fn">LEAD</span>(<span class="col">rental_date</span>, <span class="num">1</span>, <span class="str">'2099-01-01'</span>) <span class="kw">OVER</span> (\n    <span class="kw">PARTITION BY</span> <span class="col">customer_id</span>\n    <span class="kw">ORDER BY</span> <span class="col">rental_date</span>\n  ) <span class="kw">AS</span> <span class="str">next_rental_date</span>\n<span class="kw">FROM</span> <span class="tbl">rental</span>;`},
]},
{label:"🔝 Part 4: Value Functions (FIRST_VALUE)",examples:[
{title:"4.1 — FIRST_VALUE: the customer's first rental date",tag:"m",
explain:"FIRST_VALUE(col) returns the first value in the window. With PARTITION BY customer_id = the first date per customer, shown next to every rental.",
code:`<span class="kw">SELECT</span>\n  <span class="col">customer_id</span>, <span class="col">rental_date</span>,\n  <span class="fn">FIRST_VALUE</span>(<span class="col">rental_date</span>) <span class="kw">OVER</span> (\n    <span class="kw">PARTITION BY</span> <span class="col">customer_id</span>\n    <span class="kw">ORDER BY</span> <span class="col">rental_date</span> <span class="kw">ASC</span>\n  ) <span class="kw">AS</span> <span class="str">first_rental_date</span>\n<span class="kw">FROM</span> <span class="tbl">rental</span>;`},
{title:"4.2 — FIRST_VALUE: the cheapest film in the category next to each film",tag:"m",
explain:"ORDER BY rental_rate ASC = cheapest first. FIRST_VALUE takes it. This lets you compare each film to the cheapest in its category.",
code:`<span class="kw">SELECT</span>\n  <span class="col">title</span>, <span class="col">rating</span>, <span class="col">rental_rate</span>,\n  <span class="fn">FIRST_VALUE</span>(<span class="col">rental_rate</span>) <span class="kw">OVER</span> (\n    <span class="kw">PARTITION BY</span> <span class="col">rating</span>\n    <span class="kw">ORDER BY</span> <span class="col">rental_rate</span> <span class="kw">ASC</span>\n  ) <span class="kw">AS</span> <span class="str">cheapest_in_category</span>\n<span class="kw">FROM</span> <span class="tbl">film</span>;`},
]},
{label:"🧮 Part 5: CTE — Common Table Expression",examples:[
{title:"5.1 — Basic CTE: actors and last names",tag:"b",
explain:"WITH name AS (query) — defines a named 'temporary table'. Then you SELECT from it. Very readable, and it cleans up complex queries.",
code:`<span class="kw">WITH</span> <span class="tbl">ActorNames</span> <span class="kw">AS</span> (\n  <span class="kw">SELECT</span> <span class="col">first_name</span>, <span class="col">last_name</span>\n  <span class="kw">FROM</span> <span class="tbl">actor</span>\n)\n<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">ActorNames</span>;`},
{title:"5.2 — CTE: early filtering for English films",tag:"b",
explain:"The CTE filters first (language_id=1), then the main SELECT works on the filtered data. Simplifies long queries.",
code:`<span class="kw">WITH</span> <span class="tbl">EnglishFilms</span> <span class="kw">AS</span> (\n  <span class="kw">SELECT</span> <span class="col">title</span>, <span class="col">language_id</span>\n  <span class="kw">FROM</span> <span class="tbl">film</span>\n  <span class="kw">WHERE</span> <span class="col">language_id</span> = <span class="num">1</span>\n)\n<span class="kw">SELECT</span> <span class="fn">COUNT</span>(*) <span class="kw">FROM</span> <span class="tbl">EnglishFilms</span>;`},
{title:"5.3 — CTE with aggregation: customers who spent over $150",tag:"m",
explain:"The CTE computes total payments per customer. The main query filters for over 150. More readable than a HAVING on a subquery.",
code:`<span class="kw">WITH</span> <span class="tbl">CustomerTotals</span> <span class="kw">AS</span> (\n  <span class="kw">SELECT</span> <span class="col">customer_id</span>,\n         <span class="fn">SUM</span>(<span class="col">amount</span>) <span class="kw">AS</span> <span class="str">total_spent</span>\n  <span class="kw">FROM</span> <span class="tbl">payment</span>\n  <span class="kw">GROUP BY</span> <span class="col">customer_id</span>\n)\n<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">CustomerTotals</span>\n<span class="kw">WHERE</span> <span class="col">total_spent</span> > <span class="num">150</span>;`},
{title:"5.4 — CTE + Window: the latest rental per customer",tag:"a",
explain:"A classic trick: you can't filter on a Window Function directly in WHERE. Solution: ROW_NUMBER in a CTE, then WHERE rn=1 on the outside.",
code:`<span class="kw">WITH</span> <span class="tbl">RankedRentals</span> <span class="kw">AS</span> (\n  <span class="kw">SELECT</span> <span class="col">customer_id</span>, <span class="col">rental_date</span>,\n    <span class="fn">ROW_NUMBER</span>() <span class="kw">OVER</span> (\n      <span class="kw">PARTITION BY</span> <span class="col">customer_id</span>\n      <span class="kw">ORDER BY</span> <span class="col">rental_date</span> <span class="kw">DESC</span>\n    ) <span class="kw">AS</span> <span class="str">rn</span>\n  <span class="kw">FROM</span> <span class="tbl">rental</span>\n)\n<span class="kw">SELECT</span> * <span class="kw">FROM</span> <span class="tbl">RankedRentals</span>\n<span class="kw">WHERE</span> <span class="col">rn</span> = <span class="num">1</span>;`},
]},
],
examples:[]},
];

function buildSidebar(){
const sb=document.getElementById('sidebar');
chapters.forEach((ch,i)=>{
const count=ch.sections ? ch.sections.reduce((s,sec)=>s+sec.examples.length,0) : ch.examples.length;
sb.innerHTML+=`<div class="sidebar-item${i===0?' active':''}" onclick="showCh(${i})" id="si-${i}">
<span class="sidebar-num">${ch.num}</span>${ch.icon} ${ch.title}</div>`;
});
}

function showCh(idx){
document.querySelectorAll('.chapter').forEach(c=>c.classList.remove('active'));
document.querySelectorAll('.sidebar-item').forEach(s=>s.classList.remove('active'));
document.getElementById('ch-'+idx).classList.add('active');
document.getElementById('si-'+idx).classList.add('active');
document.querySelector('.main-content').scrollTop=0;
window.scrollTo(0,0);
}

function tagHTML(t){
if(t==='b')return`<span class="tag tag-b">Basic</span>`;
if(t==='m')return`<span class="tag tag-m">Intermediate</span>`;
return`<span class="tag tag-a">Advanced</span>`;
}

function buildChapters(){
const mc=document.getElementById('mainContent');
chapters.forEach((ch,ci)=>{
let h=`<div class="chapter${ci===0?' active':''}" id="ch-${ci}">`;
h+=`<div class="ch-header"><div class="ch-meta">Chapter ${ch.num}</div>
<h1 class="ch-title">${ch.icon} ${ch.title}</h1>
<p class="ch-desc">${ch.desc}</p></div>`;
h+=`<div class="syntax-box">${ch.syntax.replace(/\n/g,'<br>')}</div>`;
h+=`<div class="sec-label">Key Concepts</div><div class="concepts">`;
ch.concepts.forEach(c=>{
h+=`<div class="concept"><div class="concept-label">${c.label}</div><div class="concept-text">${c.text}</div></div>`;
});
h+='</div><hr class="sec-div">';
// Support sections (multi-part chapters like lesson 1) OR flat examples
if(ch.sections && ch.sections.length){
let globalIdx=0;
ch.sections.forEach((sec,si)=>{
h+=`<div class="sec-label" style="margin-top:${si>0?'2rem':'0'}">${sec.label} <span style="color:var(--text3);font-size:11px;font-weight:400">(${sec.examples.length} examples)</span></div>`;
sec.examples.forEach((ex,ei)=>{
const id=`${ci}-${globalIdx}`;
h+=`<div class="example-card" id="ex-${id}">
<div class="ex-head" onclick="toggleEx('${id}')">
<span class="ex-num">${globalIdx+1}</span>
<span class="ex-q">${ex.title}${tagHTML(ex.tag)}</span>
<span class="ex-toggle">▾</span></div>
<div class="ex-body">
<div class="ex-explain"><p>${ex.explain}</p></div>
<div class="code-block"><div class="code-hdr">
<span class="code-lang">SQL</span>
<button class="copy-btn" onclick="copyCode('${id}',this)">📋 Copy</button></div>
<pre id="code-${id}">${ex.code}</pre></div></div></div>`;
globalIdx++;
});
});
} else {
const total=ch.examples.length;
h+=`<div class="sec-label">Code Examples (${total})</div>`;
ch.examples.forEach((ex,ei)=>{
const id=`${ci}-${ei}`;
h+=`<div class="example-card" id="ex-${id}">
<div class="ex-head" onclick="toggleEx('${id}')">
<span class="ex-num">${ei+1}</span>
<span class="ex-q">${ex.title}${tagHTML(ex.tag)}</span>
<span class="ex-toggle">▾</span></div>
<div class="ex-body">
<div class="ex-explain"><p>${ex.explain}</p></div>
<div class="code-block"><div class="code-hdr">
<span class="code-lang">SQL</span>
<button class="copy-btn" onclick="copyCode('${id}',this)">📋 Copy</button></div>
<pre id="code-${id}">${ex.code}</pre></div></div></div>`;
});
}
h+='</div>';
mc.innerHTML+=h;
});
}

function toggleEx(id){
document.getElementById(`ex-${id}`).classList.toggle('open');
}
function copyCode(id,btn){
const text=document.getElementById(`code-${id}`).innerText;
navigator.clipboard.writeText(text).then(()=>{
btn.textContent='✅ Copied';btn.classList.add('ok');
setTimeout(()=>{btn.textContent='📋 Copy';btn.classList.remove('ok')},2000);
});
}

buildSidebar();
buildChapters();
</script>
<script>
function toggleMenu(){
  document.getElementById('hamburger').classList.toggle('open');
  document.getElementById('mobileMenu').classList.toggle('open');
}
</script>
</body>
</html>
