   # Legacy groupby results keep the group key as a COLUMN and a\n            # 0..n index, while pandas puts it in the index.  Accept\n            # gb.agg(...).loc['HR'] anyway by looking the label up there.\n            gk = df._groupkeys\n            if len(gk) == 1 and gk[0] in df._columns:\n                col = df._data[gk[0]]\n                if key in col:\n                    return [col.index(key)], True\n            elif isinstance(key, tuple) and len(key) == len(gk):\n                for i in range(df._nrows):\n                    if tuple([df._data[c][i] for c in gk]) == key:\n                        return [i], True\n        return [df._index.index(key)], True\n\n    def __getitem__(self, key):\n        df = self.df\n        cols = None\n        single_col = False\n        if isinstance(key, tuple):\n            rows_key = key[0]\n            cols = key[1]\n            if isinstance(cols, str):\n                cols = [cols]\n                single_col = True\n            elif isinstance(cols, slice):\n                cols = list(df._columns)\n        else:\n            rows_key = key\n        idx, single_row = self._rows(rows_key)\n        if cols is None:\n            cols = list(df._columns)\n        if single_row and single_col:\n            return df._data[cols[0]][idx[0]]\n        if single_row:\n            s = Series([df._data[c][idx[0]] for c in cols],\n                       name=df._index[idx[0]], index=list(cols))\n            s._show_index = True\n            return s\n        if single_col:\n            c = cols[0]\n            return Series([df._data[c][i] for i in idx], name=c,\n                          index=[df._index[i] for i in idx])\n        new_data = {}\n        for c in cols:\n            new_data[c] = [df._data[c][i] for i in idx]\n        return df._new(new_data, cols, [df._index[i] for i in idx])\n\n    def __setitem__(self, key, value):\n        df = self.df\n        if isinstance(key, tuple):\n            idx, _s = self._rows(key[0])\n            col = key[1]\n            for i in idx:\n                df._data[col][i] = value\n            return\n        raise TypeError(\"loc assignment needs [rows, col]\")\n\n\nclass _ILoc:\n    \"\"\"df.iloc[3] / df.iloc[0:5] / df.iloc[3, 1] / df.iloc[[0, 2]]\"\"\"\n\n    def __init__(self, df):\n        self.df = df\n\n    def _rows(self, key):\n        df = self.df\n        if isinstance(key, slice):\n            return list(range(df._nrows))[key], False\n        if isinstance(key, Series):\n            key = key._data\n        if isinstance(key, list):\n            if len(key) == df._nrows and _looks_boolean(key):\n                return [i for i in range(df._nrows) if key[i]], False\n            return [i if i >= 0 else df._nrows + i for i in key], False\n        k = key if key >= 0 else df._nrows + key\n        return [k], True\n\n    def __getitem__(self, key):\n        df = self.df\n        cols = None\n        single_col = False\n        if isinstance(key, tuple):\n            rows_key = key[0]\n            ckey = key[1]\n            if isinstance(ckey, int):\n                cols = [df._columns[ckey]]\n                single_col = True\n            elif isinstance(ckey, slice):\n                cols = df._columns[ckey]\n            else:\n                cols = [df._columns[j] if isinstance(j, int) else j for j in ckey]\n        else:\n            rows_key = key\n        idx, single_row = self._rows(rows_key)\n        if cols is None:\n            cols = list(df._columns)\n        if single_row and single_col:\n            return df._data[cols[0]][idx[0]]\n        if single_row:\n            s = Series([df._data[c][idx[0]] for c in cols],\n                       name=df._index[idx[0]], index=list(cols))\n            s._show_index = True\n            return s\n        if single_col:\n            c = cols[0]\n            return Series([df._data[c][i] for i in idx], name=c,\n                          index=[df._index[i] for i in idx])\n        new_data = {}\n        for c in cols:\n            new_data[c] = [df._data[c][i] for i in idx]\n        return df._new(new_data, cols, [df._index[i] for i in idx])\n\n\nclass _At:\n    def __init__(self, df):\n        self.df = df\n\n    def __getitem__(self, key):\n        lab, col = key\n        return self.df._data[col][self.df._index.index(lab)]\n\n    def __setitem__(self, key, value):\n        lab, col = key\n        self.df._data[col][self.df._index.index(lab)] = value\n\n\nclass _IAt:\n    def __init__(self, df):\n        self.df = df\n\n    def __getitem__(self, key):\n        i, j = key\n        return self.df._data[self.df._columns[j]][i]\n\n    def __setitem__(self, key, value):\n        i, j = key\n        self.df._data[self.df._columns[j]][i] = value\n\n\n# --------------------------------------------------------------- groupby\n\ndef _apply_agg(values, how, name=None):\n    s = Series(values, name=name)\n    if callable(how):\n        return how([v for v in values if not _is_na(v)])\n    if how == \"mean\":\n        return s.mean()\n    if how == \"sum\":\n        return s.sum()\n    if how == \"min\":\n        return s.min()\n    if how == \"max\":\n        return s.max()\n    if how == \"count\":\n        return s.count()\n    if how == \"size\":\n        return len(values)\n    if how == \"nunique\":\n        return s.nunique()\n    if how == \"median\":\n        return s.median()\n    if how == \"std\":\n        return s.std()\n    if how == \"var\":\n        return s.var()\n    if how == \"first\":\n        for v in values:\n            if not _is_na(v):\n                return v\n        return None\n    if how == \"last\":\n        for v in values[::-1]:\n            if not _is_na(v):\n                return v\n        return None\n    raise ValueError(\"Unknown aggregation: \" + str(how))\n\n\nclass GroupBy:\n    \"\"\"Result of df.groupby(col) or df.groupby([col1, col2]).\"\"\"\n\n    def __init__(self, df, by, sort=False):\n        self._df = df\n        self._multi = isinstance(by, list)\n        self._by_list = list(by) if self._multi else [by]\n        self._by = by\n        for c in self._by_list:\n            if c not in df._data:\n                raise KeyError(c)\n        self._groups = {}\n        self._order = []\n        for i in range(df._nrows):\n            if self._multi:\n                key = tuple([df._data[c][i] for c in self._by_list])\n            else:\n                key = df._data[self._by_list[0]][i]\n            if key not in self._groups:\n                self._groups[key] = []\n                self._order.append(key)\n            self._groups[key].append(i)\n        if sort:\n            self._order = [self._order[i] for i in _order(\n                [k if not isinstance(k, tuple) else str(k) for k in self._order], True)]\n\n    def __len__(self):\n        return len(self._order)\n\n    def __iter__(self):\n        out = []\n        for key in self._order:\n            out.append((key, self._df._take(self._groups[key])))\n        return iter(out)\n\n    def __getitem__(self, col):\n        if isinstance(col, list):\n            return _GroupByCols(self, col)\n        return _SeriesGroupBy(self, col)\n\n    def groups(self):\n        out = {}\n        for key in self._order:\n            out[key] = [self._df._index[i] for i in self._groups[key]]\n        return out\n\n    def _value_cols(self):\n        return [c for c in self._df._columns if c not in self._by_list]\n\n    def _key_columns(self):\n        new_data = {}\n        for c in self._by_list:\n            new_data[c] = []\n        for key in self._order:\n            if self._multi:\n                for j in range(len(self._by_list)):\n                    new_data[self._by_list[j]].append(key[j])\n            else:\n                new_data[self._by_list[0]].append(key)\n        return new_data\n\n    def _agg(self, fn, cols=None, numeric_only=True):\n        \"\"\"Aggregate.  Non-numeric columns yield None (legacy behaviour).\"\"\"\n        value_cols = cols if cols is not None else self._value_cols()\n        new_data = self._key_columns()\n        for c in value_cols:\n            new_data[c] = []\n        for key in self._order:\n            indices = self._groups[key]\n            for c in value_cols:\n                vals = []\n                for i in indices:\n                    v = self._df._data[c][i]\n                    if _is_na(v):\n                        continue\n                    if numeric_only:\n                        if _is_num(v):\n                            vals.append(v)\n                    else:\n                        vals.append(v)\n                if vals:\n                    new_data[c].append(fn(vals))\n                else:\n                    new_data[c].append(None)\n        out_cols = list(self._by_list) + list(value_cols)\n        out = self._df._new(new_data, out_cols,\n                            list(range(len(self._order))), None, False)\n        out._groupkeys = list(self._by_list)\n        return out\n\n    def mean(self):\n        return self._agg(lambda v: round(sum(v) / len(v), 2))\n\n    def sum(self):\n        return self._agg(sum)\n\n    def max(self):\n        return self._agg(max)\n\n    def min(self):\n        return self._agg(min)\n\n    def median(self):\n        return self._agg(lambda v: _quantile_of(sorted(v), 0.5))\n\n    def std(self):\n        return self._agg(lambda v: _std_of(v))\n\n    def count(self):\n        \"\"\"Non-null count PER COLUMN (pandas).  Note: this differs from the\n        old mini-pandas, where count() returned one 'count' column of row\n        counts -- that is now size().\"\"\"\n        new_data = self._key_columns()\n        value_cols = self._value_cols()\n        for c in value_cols:\n            new_data[c] = []\n        for key in self._order:\n            indices = self._groups[key]\n            for c in value_cols:\n                cnt = 0\n                for i in indices:\n                    if not _is_na(self._df._data[c][i]):\n                        cnt += 1\n                new_data[c].append(cnt)\n        out_cols = list(self._by_list) + list(value_cols)\n        out = self._df._new(new_data, out_cols,\n                            list(range(len(self._order))), None, False)\n        out._groupkeys = list(self._by_list)\n        return out\n\n    def size(self):\n        \"\"\"Rows per group, as a Series indexed by group key (pandas).\"\"\"\n        s = Series([len(self._groups[k]) for k in self._order],\n                   name=\"size\", index=list(self._order))\n        s._show_index = True\n        return s\n\n    def nunique(self):\n        return self._agg(_uniq_len, None, False)\n\n    def first(self):\n        return self._agg(lambda v: v[0], None, False)\n\n    def last(self):\n        return self._agg(lambda v: v[-1], None, False)\n\n    def agg(self, how):\n        \"\"\"gb.agg({'col': 'mean'}) or gb.agg('sum').\"\"\"\n        if isinstance(how, dict):\n            new_data = self._key_columns()\n            value_cols = []\n            for c in how.keys():\n                value_cols.append(c)\n                new_data[c] = []\n            for key in self._order:\n                indices = self._groups[key]\n                for c in value_cols:\n                    vals = [self._df._data[c][i] for i in indices]\n                    new_data[c].append(_apply_agg(vals, how[c], c))\n            out_cols = list(self._by_list) + value_cols\n            out = self._df._new(new_data, out_cols,\n                                list(range(len(self._order))), None, False)\n            out._groupkeys = list(self._by_list)\n            return out\n        value_cols = self._value_cols()\n        new_data = self._key_columns()\n        for c in value_cols:\n            new_data[c] = []\n        for key in self._order:\n            indices = self._groups[key]\n            for c in value_cols:\n                vals = [self._df._data[c][i] for i in indices]\n                new_data[c].append(_apply_agg(vals, how, c))\n        out_cols = list(self._by_list) + list(value_cols)\n        out = self._df._new(new_data, out_cols,\n                            list(range(len(self._order))), None, False)\n        out._groupkeys = list(self._by_list)\n        return out\n\n    def apply(self, fn):\n        vals = []\n        for key in self._order:\n            vals.append(fn(self._df._take(self._groups[key])))\n        s = Series(vals, index=list(self._order))\n        s._show_index = True\n        return s\n\n\ndef _uniq_len(vals):\n    seen = []\n    for v in vals:\n        if v not in seen:\n            seen.append(v)\n    return len(seen)\n\n\nclass _SeriesGroupBy:\n    \"\"\"df.groupby('k')['v'] -> aggregations returning a Series.\"\"\"\n\n    def __init__(self, gb, col):\n        self._gb = gb\n        self._col = col\n\n    def _reduce(self, how):\n        vals = []\n        for key in self._gb._order:\n            indices = self._gb._groups[key]\n            col_vals = [self._gb._df._data[self._col][i] for i in indices]\n            vals.append(_apply_agg(col_vals, how, self._col))\n        s = Series(vals, name=self._col, index=list(self._gb._order))\n        s._show_index = True\n        return s\n\n    def mean(self):\n        return self._reduce(\"mean\")\n\n    def sum(self):\n        return self._reduce(\"sum\")\n\n    def min(self):\n        return self._reduce(\"min\")\n\n    def max(self):\n        return self._reduce(\"max\")\n\n    def count(self):\n        return self._reduce(\"count\")\n\n    def size(self):\n        return self._gb.size()\n\n    def nunique(self):\n        return self._reduce(\"nunique\")\n\n    def median(self):\n        return self._reduce(\"median\")\n\n    def std(self):\n        return self._reduce(\"std\")\n\n    def var(self):\n        return self._reduce(\"var\")\n\n    def first(self):\n        return self._reduce(\"first\")\n\n    def last(self):\n        return self._reduce(\"last\")\n\n    # ---- transforms: one value per ORIGINAL row, original order kept\n    def _transform(self, fn):\n        df = self._gb._df\n        out = [None] * df._nrows\n        for key in self._gb._order:\n            indices = self._gb._groups[key]\n            vals = [df._data[self._col][i] for i in indices]\n            res = fn(vals)\n            for j in range(len(indices)):\n                out[indices[j]] = res[j]\n        return Series(out, name=self._col, index=list(df._index))\n\n    def cumsum(self):\n        return self._transform(lambda v: Series(v).cumsum()._data)\n\n    def cumcount(self):\n        return self._transform(lambda v: list(range(len(v))))\n\n    def cummax(self):\n        return self._transform(lambda v: Series(v).cummax()._data)\n\n    def cummin(self):\n        return self._transform(lambda v: Series(v).cummin()._data)\n\n    def rank(self, method=\"average\", ascending=True):\n        return self._transform(\n            lambda v: _rank_values(v, method, ascending))\n\n    def transform(self, how):\n        if callable(how):\n            return self._transform(lambda v: [how(x) for x in v])\n        return self._transform(\n            lambda v: [_apply_agg(v, how, self._col)] * len(v))\n\n    def apply(self, fn):\n        vals = []\n        for key in self._gb._order:\n            indices = self._gb._groups[key]\n            vals.append(fn(Series(\n                [self._gb._df._data[self._col][i] for i in indices],\n                name=self._col,\n                index=[self._gb._df._index[i] for i in indices])))\n        s = Series(vals, name=self._col, index=list(self._gb._order))\n        s._show_index = True\n        return s\n\n    def agg(self, how):\n        \"\"\"agg('mean'), agg(fn) -> Series;  agg(['mean','max']) -> DataFrame\n        with one column per aggregation, indexed by group key.\"\"\"\n        if isinstance(how, list):\n            names = []\n            for h in how:\n                names.append(h if isinstance(h, str) else getattr(\n                    h, \"__name__\", \"<lambda>\"))\n            new_data = {}\n            for nm in names:\n                new_data[nm] = []\n            for key in self._gb._order:\n                indices = self._gb._groups[key]\n                col_vals = [self._gb._df._data[self._col][i] for i in indices]\n                for j in range(len(how)):\n                    new_data[names[j]].append(\n                        _apply_agg(col_vals, how[j], self._col))\n            df = self._gb._df._new(new_data, names, list(self._gb._order),\n                                   self._gb._by_list[0], True)\n            df._index_names = [self._gb._by_list[0]]\n            return df\n        return self._reduce(how)\n\n\nclass _GroupByCols:\n    def __init__(self, gb, cols):\n        self._gb = gb\n        self._cols = cols\n\n    def mean(self):\n        return GroupBy._agg(self._gb, lambda v: round(sum(v) / len(v), 2), self._cols)\n\n    def sum(self):\n        return GroupBy._agg(self._gb, sum, self._cols)\n\n    def min(self):\n        return GroupBy._agg(self._gb, min, self._cols)\n\n    def max(self):\n        return GroupBy._agg(self._gb, max, self._cols)\n\n    def agg(self, how):\n        return self._gb.agg(how)\n\n\n# ------------------------------------------------------- query() parser\n\ndef _split_top(expr, seps):\n    \"\"\"Split on top-level (non-bracketed) occurrences of the given words.\"\"\"\n    parts = []\n    cur = \"\"\n    depth = 0\n    quote = \"\"\n    i = 0\n    n = len(expr)\n    while i < n:\n        ch = expr[i]\n        if quote != \"\":\n            if ch == quote:\n                quote = \"\"\n            cur += ch\n            i += 1\n            continue\n        if ch == '\"' or ch == \"'\":\n            quote = ch\n            cur += ch\n            i += 1\n            continue\n        if ch in \"([\":\n            depth += 1\n        elif ch in \")]\":\n            depth -= 1\n        if depth == 0:\n            matched = None\n            for sep in seps:\n                if expr[i:i + len(sep)] == sep:\n                    matched = sep\n                    break\n            if matched is not None:\n                parts.append(cur)\n                cur = \"\"\n                i += len(matched)\n                continue\n        cur += ch\n        i += 1\n    parts.append(cur)\n    return parts\n\n\ndef _q_literal(tok, row):\n    tok = tok.strip()\n    if tok == \"\":\n        return None\n    if tok[0] == \"[\" and tok[-1] == \"]\":\n        inner = tok[1:-1].strip()\n        if inner == \"\":\n            return []\n        return [_q_literal(p, row) for p in inner.split(\",\")]\n    if (tok[0] == '\"' and tok[-1] == '\"') or (tok[0] == \"'\" and tok[-1] == \"'\"):\n        return tok[1:-1]\n    if tok == \"True\":\n        return True\n    if tok == \"False\":\n        return False\n    if tok == \"None\":\n        return None\n    if tok in row:\n        return row[tok]\n    if tok[0] == \"@\" and tok[1:] in row:\n        return row[tok[1:]]\n    try:\n        if \".\" in tok or \"e\" in tok or \"E\" in tok:\n            return float(tok)\n        return int(tok)\n    except ValueError:\n        raise ValueError(\"query: cannot resolve '\" + tok + \"'\")\n\n\ndef _eval_query(expr, row):\n    expr = expr.strip()\n    if expr[:1] == \"(\" and expr[-1:] == \")\":\n        # only strip if the parens wrap the whole expression\n        depth = 0\n        wraps = True\n        for i in range(len(expr)):\n            if expr[i] == \"(\":\n                depth += 1\n            elif expr[i] == \")\":\n                depth -= 1\n                if depth == 0 and i < len(expr) - 1:\n                    wraps = False\n                    break\n        if wraps:\n            return _eval_query(expr[1:-1], row)\n    parts = _split_top(expr, [\" or \", \" | \"])\n    if len(parts) > 1:\n        for p in parts:\n            if _eval_query(p, row):\n                return True\n        return False\n    parts = _split_top(expr, [\" and \", \" & \"])\n    if len(parts) > 1:\n        for p in parts:\n            if not _eval_query(p, row):\n                return False\n        return True\n    if expr[:4] == \"not \":\n        return not _eval_query(expr[4:], row)\n    if expr[:1] == \"~\":\n        return not _eval_query(expr[1:], row)\n    for op in [\"==\", \"!=\", \">=\", \"<=\"]:\n        parts = _split_top(expr, [op])\n        if len(parts) == 2:\n            a = _q_literal(parts[0], row)\n            b = _q_literal(parts[1], row)\n            if _is_na(a) or _is_na(b):\n                return op == \"!=\"\n            if op == \"==\":\n                return a == b\n            if op == \"!=\":\n                return a != b\n            if op == \">=\":\n                return a >= b\n            return a <= b\n    for op in [\">\", \"<\"]:\n        parts = _split_top(expr, [op])\n        if len(parts) == 2:\n            a = _q_literal(parts[0], row)\n            b = _q_literal(parts[1], row)\n            if _is_na(a) or _is_na(b):\n                return False\n            if op == \">\":\n                return a > b\n            return a < b\n    parts = _split_top(expr, [\" not in \"])\n    if len(parts) == 2:\n        return _q_literal(parts[0], row) not in _q_literal(parts[1], row)\n    parts = _split_top(expr, [\" in \"])\n    if len(parts) == 2:\n        return _q_literal(parts[0], row) in _q_literal(parts[1], row)\n    v = _q_literal(expr, row)\n    return bool(v) and not _is_na(v)\n\n\n# =============================================================\n# MultiIndex\n# =============================================================\n\nclass MultiIndex:\n    \"\"\"The index produced by df.set_index([col_a, col_b]).  Each label is a\n    tuple; `nlevels` and `names` behave like pandas.\"\"\"\n\n    def __init__(self, tuples, names=None):\n        self._tuples = [tuple(t) for t in tuples]\n        if names is None:\n            names = [None] * (len(self._tuples[0]) if self._tuples else 0)\n        self.names = list(names)\n\n    @staticmethod\n    def from_tuples(tuples, names=None):\n        return MultiIndex(tuples, names)\n\n    @staticmethod\n    def from_arrays(arrays, names=None):\n        rows = []\n        if arrays:\n            for i in range(len(arrays[0])):\n                rows.append(tuple([a[i] for a in arrays]))\n        return MultiIndex(rows, names)\n\n    @property\n    def nlevels(self):\n        return len(self.names)\n\n    @property\n    def levels(self):\n        out = []\n        for j in range(self.nlevels):\n            seen = []\n            for t in self._tuples:\n                if t[j] not in seen:\n                    seen.append(t[j])\n            out.append(sorted(seen, key=lambda x: str(x)))\n        return out\n\n    def get_level_values(self, level):\n        j = level if isinstance(level, int) else self.names.index(level)\n        return Series([t[j] for t in self._tuples])\n\n    def tolist(self):\n        return list(self._tuples)\n\n    def __len__(self):\n        return len(self._tuples)\n\n    def __iter__(self):\n        return iter(self._tuples)\n\n    def __getitem__(self, k):\n        return self._tuples[k]\n\n    def __contains__(self, k):\n        return tuple(k) in self._tuples\n\n    def __repr__(self):\n        return \"MultiIndex(\" + str(self._tuples) + \")\"\n\n    def __str__(self):\n        return self.__repr__()\n\n\n# =============================================================\n# Dates:  pd.to_datetime / pd.date_range / Series.dt\n# =============================================================\n\n_MONTH_NAMES = [\"January\", \"February\", \"March\", \"April\", \"May\", \"June\",\n                \"July\", \"August\", \"September\", \"October\", \"November\",\n                \"December\"]\n_DAY_NAMES = [\"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\",\n              \"Saturday\", \"Sunday\"]\n_MONTH_DAYS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31]\n\n\ndef _is_leap(y):\n    return (y % 4 == 0 and y % 100 != 0) or y % 400 == 0\n\n\ndef _days_in_month(y, m):\n    if m == 2 and _is_leap(y):\n        return 29\n    return _MONTH_DAYS[m - 1]\n\n\ndef _days_from_civil(y, m, d):\n    \"\"\"Days since 1970-01-01 (Howard Hinnant's algorithm, integer only).\"\"\"\n    yy = y - 1 if m <= 2 else y\n    era = (yy if yy >= 0 else yy - 399) // 400\n    yoe = yy - era * 400\n    mp = m - 3 if m > 2 else m + 9\n    doy = (153 * mp + 2) // 5 + d - 1\n    doe = yoe * 365 + yoe // 4 - yoe // 100 + doy\n    return era * 146097 + doe - 719468\n\n\ndef _civil_from_days(z):\n    z = z + 719468\n    era = (z if z >= 0 else z - 146096) // 146097\n    doe = z - era * 146097\n    yoe = (doe - doe // 1460 + doe // 36524 - doe // 146096) // 365\n    y = yoe + era * 400\n    doy = doe - (365 * yoe + yoe // 4 - yoe // 100)\n    mp = (5 * doy + 2) // 153\n    d = doy - (153 * mp + 2) // 5 + 1\n    m = mp + 3 if mp < 10 else mp - 9\n    return (y + 1 if m <= 2 else y, m, d)\n\n\ndef _p2(n):\n    return (\"0\" + str(n))[-2:]\n\n\nclass Timestamp:\n    \"\"\"A very small date/time value -- enough for .dt and date_range.\"\"\"\n\n    def __init__(self, year, month=1, day=1, hour=0, minute=0, second=0):\n        self.year = year\n        self.month = month\n        self.day = day\n        self.hour = hour\n        self.minute = minute\n        self.second = second\n\n    # ---- calendar properties\n    @property\n    def dayofweek(self):\n        return (_days_from_civil(self.year, self.month, self.day) + 3) % 7\n\n    @property\n    def weekday(self):\n        return self.dayofweek\n\n    @property\n    def dayofyear(self):\n        return (_days_from_civil(self.year, self.month, self.day)\n                - _days_from_civil(self.year, 1, 1) + 1)\n\n    @property\n    def quarter(self):\n        return (self.month - 1) // 3 + 1\n\n    @property\n    def days_in_month(self):\n        return _days_in_month(self.year, self.month)\n\n    @property\n    def is_month_end(self):\n        return self.day == _days_in_month(self.year, self.month)\n\n    @property\n    def is_month_start(self):\n        return self.day == 1\n\n    @property\n    def date_only(self):\n        return Timestamp(self.year, self.month, self.day)\n\n    def day_name(self):\n        return _DAY_NAMES[self.dayofweek]\n\n    def month_name(self):\n        return _MONTH_NAMES[self.month - 1]\n\n    def date(self):\n        return self.date_only\n\n    def strftime(self, fmt):\n        out = fmt\n        out = out.replace(\"%Y\", str(self.year))\n        out = out.replace(\"%m\", _p2(self.month))\n        out = out.replace(\"%d\", _p2(self.day))\n        out = out.replace(\"%H\", _p2(self.hour))\n        out = out.replace(\"%M\", _p2(self.minute))\n        out = out.replace(\"%S\", _p2(self.second))\n        out = out.replace(\"%B\", self.month_name())\n        out = out.replace(\"%b\", self.month_name()[:3])\n        out = out.replace(\"%A\", self.day_name())\n        out = out.replace(\"%a\", self.day_name()[:3])\n        return out\n\n    def _ord(self):\n        return (_days_from_civil(self.year, self.month, self.day) * 86400\n                + self.hour * 3600 + self.minute * 60 + self.second)\n\n    def __eq__(self, other):\n        return isinstance(other, Timestamp) and self._ord() == other._ord()\n\n    def __ne__(self, other):\n        return not self.__eq__(other)\n\n    def __lt__(self, other):\n        return self._ord() < other._ord()\n\n    def __le__(self, other):\n        return self._ord() <= other._ord()\n\n    def __gt__(self, other):\n        return self._ord() > other._ord()\n\n    def __ge__(self, other):\n        return self._ord() >= other._ord()\n\n    def __hash__(self):\n        return self._ord()\n\n    def __repr__(self):\n        return \"Timestamp('\" + str(self) + \"')\"\n\n    def __str__(self):\n        s = str(self.year) + \"-\" + _p2(self.month) + \"-\" + _p2(self.day)\n        if self.hour or self.minute or self.second:\n            s += \" \" + _p2(self.hour) + \":\" + _p2(self.minute) + \":\" + \\\n                 _p2(self.second)\n        return s\n\n\ndef _parse_ts(v):\n    \"\"\"Parse one value into a Timestamp.  Accepts 'YYYY-MM-DD[ HH:MM[:SS]]',\n    'DD/MM/YYYY' and 'YYYY/MM/DD'.\"\"\"\n    if isinstance(v, Timestamp):\n        return v\n    if _is_na(v):\n        return None\n    s = str(v).strip()\n    time_part = \"\"\n    if \" \" in s:\n        bits = s.split(\" \")\n        s = bits[0]\n        time_part = bits[1]\n    elif \"T\" in s:\n        bits = s.split(\"T\")\n        s = bits[0]\n        time_part = bits[1]\n    sep = \"-\" if \"-\" in s else (\"/\" if \"/\" in s else None)\n    if sep is None:\n        raise ValueError(\"Cannot parse date: \" + str(v))\n    p = s.split(sep)\n    if len(p) != 3:\n        raise ValueError(\"Cannot parse date: \" + str(v))\n    if len(p[0]) == 4:\n        y, m, d = int(p[0]), int(p[1]), int(p[2])\n    else:\n        d, m, y = int(p[0]), int(p[1]), int(p[2])\n    h = mi = sec = 0\n    if time_part:\n        t = time_part.split(\":\")\n        h = int(t[0])\n        if len(t) > 1:\n            mi = int(t[1])\n        if len(t) > 2:\n            sec = int(float(t[2]))\n    return Timestamp(y, m, d, h, mi, sec)\n\n\ndef to_datetime(obj, errors=\"raise\"):\n    \"\"\"pd.to_datetime -- on a Series returns a Series of Timestamps.\"\"\"\n    if isinstance(obj, Series):\n        out = []\n        for v in obj._data:\n            try:\n                out.append(_parse_ts(v))\n            except ValueError:\n                if errors == \"coerce\":\n                    out.append(None)\n                else:\n                    raise\n        return obj._like(out)\n    if isinstance(obj, list):\n        return [_parse_ts(v) for v in obj]\n    return _parse_ts(obj)\n\n\ndef _add_months(ts, n):\n    m = ts.month - 1 + n\n    y = ts.year + m // 12\n    m = m % 12 + 1\n    return Timestamp(y, m, min(ts.day, _days_in_month(y, m)),\n                     ts.hour, ts.minute, ts.second)\n\n\ndef _shift(ts, freq, n):\n    f = str(freq).upper()\n    if f in (\"D\", \"1D\"):\n        y, m, d = _civil_from_days(\n            _days_from_civil(ts.year, ts.month, ts.day) + n)\n        return Timestamp(y, m, d, ts.hour, ts.minute, ts.second)\n    if f in (\"W\", \"W-SUN\", \"7D\"):\n        y, m, d = _civil_from_days(\n            _days_from_civil(ts.year, ts.month, ts.day) + 7 * n)\n        return Timestamp(y, m, d, ts.hour, ts.minute, ts.second)\n    if f in (\"H\", \"h\"):\n        return ts\n    if f in (\"MS\", \"M\", \"ME\"):\n        nxt = _add_months(Timestamp(ts.year, ts.month, 1), n)\n        if f == \"MS\":\n            return nxt\n        return Timestamp(nxt.year, nxt.month,\n                         _days_in_month(nxt.year, nxt.month))\n    if f in (\"YS\", \"Y\", \"YE\", \"A\", \"AS\"):\n        nxt = Timestamp(ts.year + n, 1 if f in (\"YS\", \"AS\") else 12,\n                        1 if f in (\"YS\", \"AS\") else 31)\n        return nxt\n    if f in (\"QS\", \"Q\", \"QE\"):\n        return _add_months(ts, 3 * n)\n    raise ValueError(\"Unsupported freq: \" + str(freq))\n\n\ndef date_range(start=None, end=None, periods=None, freq=\"D\"):\n    \"\"\"pd.date_range -- returns a Series of Timestamps.\"\"\"\n    f = str(freq).upper()\n    if start is None and end is not None and periods is not None:\n        back = _shift(_parse_ts(end), freq, -(periods - 1))\n        start = back\n    cur = _parse_ts(start)\n    if f == \"MS\":\n        cur = Timestamp(cur.year, cur.month, 1)\n    elif f in (\"ME\", \"M\"):\n        cur = Timestamp(cur.year, cur.month,\n                        _days_in_month(cur.year, cur.month))\n    out = []\n    if periods is not None:\n        for i in range(periods):\n            out.append(cur)\n            cur = _shift(cur, freq, 1)\n    else:\n        stop = _parse_ts(end)\n        guard = 0\n        while cur._ord() <= stop._ord() and guard < 100000:\n            out.append(cur)\n            cur = _shift(cur, freq, 1)\n            guard += 1\n    s = Series(out)\n    s._show_index = True\n    return s\n\n\nclass _DtAccessor:\n    \"\"\"Series.dt -- date parts of a Series of Timestamps.\"\"\"\n\n    def __init__(self, series):\n        self._s = series\n\n    def _map(self, fn):\n        return self._s._like([None if _is_na(v) else fn(_parse_ts(v))\n                              for v in self._s._data])\n\n    @property\n    def year(self):\n        return self._map(lambda t: t.year)\n\n    @property\n    def month(self):\n        return self._map(lambda t: t.month)\n\n    @property\n    def day(self):\n        return self._map(lambda t: t.day)\n\n    @property\n    def hour(self):\n        return self._map(lambda t: t.hour)\n\n    @property\n    def minute(self):\n        return self._map(lambda t: t.minute)\n\n    @property\n    def second(self):\n        return self._map(lambda t: t.second)\n\n    @property\n    def dayofweek(self):\n        return self._map(lambda t: t.dayofweek)\n\n    @property\n    def weekday(self):\n        return self._map(lambda t: t.dayofweek)\n\n    @property\n    def dayofyear(self):\n        return self._map(lambda t: t.dayofyear)\n\n    @property\n    def quarter(self):\n        return self._map(lambda t: t.quarter)\n\n    @property\n    def days_in_month(self):\n        return self._map(lambda t: t.days_in_month)\n\n    @property\n    def date(self):\n        return self._map(lambda t: t.date_only)\n\n    def day_name(self):\n        return self._map(lambda t: t.day_name())\n\n    def month_name(self):\n        return self._map(lambda t: t.month_name())\n\n    def strftime(self, fmt):\n        return self._map(lambda t: t.strftime(fmt))\n\n    def normalize(self):\n        return self._map(lambda t: t.date_only)\n\n\n# =============================================================\n# module-level helpers:  these names ARE the `pandas` module\n# =============================================================\n\ndef concat(objs, ignore_index=True, axis=0):\n    \"\"\"pd.concat([df1, df2]) / pd.concat([s1, s2]).\"\"\"\n    if objs and isinstance(objs[0], Series) and axis == 0:\n        data = []\n        idx = []\n        for s in objs:\n            data.extend(s._data)\n            idx.extend(s._index)\n        if ignore_index:\n            idx = list(range(len(data)))\n        out = Series(data, name=objs[0].name, index=idx)\n        out._show_index = objs[0]._show_index\n        return out\n    return DataFrame.concat(objs, ignore_index)\n\n\ndef merge(left, right, on=None, how=\"inner\", suffixes=(\"_x\", \"_y\")):\n    return left.merge(right, on=on, how=how, suffixes=suffixes)\n\n\ndef isna(v):\n    if isinstance(v, (Series, DataFrame)):\n        return v.isna()\n    return _is_na(v)\n\n\ndef isnull(v):\n    return isna(v)\n\n\ndef notna(v):\n    if isinstance(v, (Series, DataFrame)):\n        return v.notna()\n    return not _is_na(v)\n\n\ndef notnull(v):\n    return notna(v)\n\n\ndef unique(v):\n    return Series(v).unique()\n\n\ndef cut(x, bins, labels=None, right=True, include_lowest=False):\n    \"\"\"pd.cut -- bin values into ranges.  `bins` is an edge list or an int\n    (equal-width bins).  Values outside every bin become NaN.\"\"\"\n    vals = x._data if isinstance(x, Series) else list(x)\n    if isinstance(bins, int):\n        nums = [v for v in vals if not _is_na(v)]\n        lo = min(nums)\n        hi = max(nums)\n        span = (hi - lo) if hi != lo else 1.0\n        pad = span / 1000.0\n        edges = [lo - pad]\n        for i in range(1, bins + 1):\n            edges.append(lo + span * i / float(bins))\n    else:\n        edges = list(bins)\n    out = []\n    for v in vals:\n        if _is_na(v) or not _is_num(v):\n            out.append(None)\n            continue\n        lab = None\n        for i in range(len(edges) - 1):\n            a = edges[i]\n            b = edges[i + 1]\n            if right:\n                inside = (v > a and v <= b) or (\n                    include_lowest and i == 0 and v == a)\n            else:\n                inside = (v >= a and v < b) or (\n                    i == len(edges) - 2 and v == b and include_lowest)\n            if inside:\n                if labels is None or labels is False:\n                    if right:\n                        lab = \"(\" + _fmt(a) + \", \" + _fmt(b) + \"]\"\n                    else:\n                        lab = \"[\" + _fmt(a) + \", \" + _fmt(b) + \")\"\n                else:\n                    lab = labels[i]\n                break\n        out.append(lab)\n    if isinstance(x, Series):\n        return x._like(out)\n    return Series(out)\n\n\ndef qcut(x, q, labels=None):\n    \"\"\"pd.qcut -- equal-frequency bins based on quantiles.\"\"\"\n    vals = x._data if isinstance(x, Series) else list(x)\n    nums = sorted([v for v in vals if not _is_na(v) and _is_num(v)])\n    edges = [_quantile_of(nums, i / float(q)) for i in range(q + 1)]\n    edges[0] = edges[0] - abs(edges[0]) / 1000.0 - 1e-9\n    return cut(x, edges, labels, True, False)\n\n\ndef melt(frame, id_vars=None, value_vars=None, var_name=None,\n         value_name=\"value\"):\n    return frame.melt(id_vars, value_vars, var_name, value_name)\n\n\ndef crosstab(index, columns, values=None, aggfunc=None, margins=False):\n    \"\"\"pd.crosstab(a, b) -- frequency table of two Series.\"\"\"\n    rows = index._data if isinstance(index, Series) else list(index)\n    cols = columns._data if isinstance(columns, Series) else list(columns)\n    vals = None\n    if values is not None:\n        vals = values._data if isinstance(values, Series) else list(values)\n    row_keys = []\n    col_keys = []\n    for v in rows:\n        if v not in row_keys:\n            row_keys.append(v)\n    for v in cols:\n        if v not in col_keys:\n            col_keys.append(v)\n    row_keys = [row_keys[i] for i in _orde  Kept for backward compatibility -- it simply\n    forwards to the module-level names above.\"\"\"\n    DataFrame = DataFrame\n    Series = Series\n    MultiIndex = MultiIndex\n    Timestamp = Timestamp\n\n    def concat(self, objs, ignore_index=True, axis=0):\n        return concat(objs, ignore_index, axis)\n\n    def merge(self, left, right, on=None, how=\"inner\", suffixes=(\"_x\", \"_y\")):\n        return merge(left, right, on, how, suffixes)\n\n    def isna(self, v):\n        return isna(v)\n\n    def isnull(self, v):\n        return isna(v)\n\n    def notna(self, v):\n        return notna(v)\n\n    def notnull(self, v):\n        return notna(v)\n\n    def unique(self, v):\n        return unique(v)\n\n    def cut(self, x, bins, labels=None, right=True, include_lowest=False):\n        return cut(x, bins, labels, right, include_lowest)\n\n    def qcut(self, x, q, labels=None):\n        return qcut(x, q, labels)\n\n    def melt(self, frame, id_vars=None, value_vars=None, var_name=None,\n             value_name=\"value\"):\n        return melt(frame, id_vars, value_vars, var_name, value_name)\n\n    def crosstab(self, index, columns, values=None, aggfunc=None,\n                 margins=False):\n        return crosstab(index, columns, values, aggfunc, margins)\n\n    def date_range(self, start=None, end=None, periods=None, freq=\"D\"):\n        return date_range(start, end, periods, freq)\n\n    def to_datetime(self, obj, errors=\"raise\"):\n        return to_datetime(obj, errors)\n\n    def to_numeric(self, s, errors=\"raise\"):\n        return to_numeric(s, errors)\n\n\npd = _PD()\npd.NA = None\npd.nan = None\npd.NaT = None\n\n\nclass _NP:\n    \"\"\"Tiny numpy stand-in (np.nan and a couple of reducers).\"\"\"\n    nan = None\n    NaN = None\n    NAN = None\n    inf = float('inf')\n    pi = 3.141592653589793\n    e = 2.718281828459045\n\n    def array(self, v, dtype=None):\n        return list(v)\n\n    def mean(self, v):\n        return Series(v).mean()\n\n    def sum(self, v):\n        return Series(v).sum()\n\n    def median(self, v):\n        return Series(v).median()\n\n    def std(self, v):\n        return Series(v).std()\n\n\nnp = _NP()\n\n\n# =============================================================\n# DATASETS - Israeli context for learning\n# =============================================================\n\n_DATASETS = {\n    \"cities-weather\": {\n        \"name\": \"Weather in Israeli cities\",\n        \"desc\": \"temperatures and humidity\",\n        \"data\": {\n            \"city\": [\"Tel Aviv\", \"Jerusalem\", \"Haifa\", \"Beer Sheva\", \"Eilat\", \"Safed\"],\n            \"temp\": [24, 19, 23, 27, 31, 17],\n            \"humidity\": [68, 50, 72, 40, 55, 45],\n            \"rain_mm\": [0, 2, 0, 0, 0, 5]\n        }\n    },\n    \"real-estate\": {\n        \"name\": \"Apartment prices in Tel Aviv\",\n        \"desc\": \"8 apartments\",\n        \"data\": {\n            \"neighborhood\": [\"Florentin\", \"Rothschild\", \"Neve Tzedek\", \"Jaffa\", \"Ramat Aviv\", \"Bavli\", \"Kiryat Shalom\", \"Old North\"],\n            \"rooms\": [3, 4, 4, 3, 5, 4, 3, 4],\n            \"sqm\": [75, 95, 110, 70, 130, 100, 65, 90],\n            \"price_m\": [3.2, 5.1, 6.8, 2.9, 4.5, 4.1, 1.9, 4.7]\n        }\n    },\n    \"football\": {\n        \"name\": \"Premier League - 5 teams\",\n        \"desc\": \"Statistics\",\n        \"data\": {\n            \"team\": [\"Maccabi Tel Aviv\", \"Hapoel Beer Sheva\", \"Maccabi Haifa\", \"Hapoel Tel Aviv\", \"Beitar\"],\n            \"points\": [55, 52, 48, 42, 38],\n            \"wins\": [17, 16, 14, 12, 10],\n            \"draws\": [4, 4, 6, 6, 8],\n            \"losses\": [3, 4, 4, 6, 6],\n            \"goals_for\": [54, 49, 41, 38, 32],\n            \"goals_against\": [21, 22, 25, 30, 33]\n        }\n    },\n    \"students\": {\n        \"name\": \"student grades\",\n        \"desc\": \"Grades in 3 subjects\",\n        \"data\": {\n            \"name\": [\"Gal\", \"Tomer\", \"Yael 30, 44, 38],\n            \"monthly_bill\": [45.5, 120.0, 80.3, 150.0, 35.0, 95.0, 70.5, 130.0, 50.0, 110.0, 65.0, 140.0, 55.0, 100.0, 75.0],\n            \"tenure_months\": [12, 60, 24, 84, 6, 36, 18, 72, 8, 48, 30, 96, 14, 42, 22],\n            \"churn\": [0, 1, 0, 1, 1, 0, 0, 1, 1, 1, 0, 0, 1, 0, 0],\n            \"plan\": [\"basic\",\"premium\",\"standard\",\"premium\",\"basic\",\"premium\",\"standard\",\"premium\",\"basic\",\"premium\",\"standard\",\"premium\",\"basic\",\"premium\",\"standard\"]\n        }\n    },\n    \"salaries\": {\n        \"name\": \"Salaries by department\",\n        \"desc\": \"12 employees\",\n        \"data\": {\n            \"name\": [\"Avi\",\"Beni\",\"Galit\",\"Dana\",\"Hila\",\"Victor\",\"Zohar\",\"Chani\",\"Tal\",\"Yossi\",\"Carmel\",\"Liat\"],\n            \"department\": [\"Sales\",\"R&D\",\"Sales\",\"Marketing\",\"R&D\",\"Sales\",\"Marketing\",\"R&D\",\"Sales\",\"R&D\",\"Marketing\",\"Sales\"],\n            \"salary\": [15000, 22000, 18000, 13000, 25000, 16000, 14000, 28000, 17000, 23000, 12000, 19000],\n            \"years\": [2, 5, 3, 1, 7, 4, 2, 8, 3, 6, 1, 4]\n        }\n    }\n}\n\n\nclass _Datasets:\n    \"\"\"Pre-loaded datasets. Usage: df = data.load('cities-weather')\"\"\"\n\n    def list(self):\n        \"\"\"List all available datasets.\"\"\"\n        for key in _DATASETS:\n            info = _DATASETS[key]\n            print(\"  \" + key + \": \" + info[\"name\"] + \" - \" + info[\"desc\"])\n\n    def load(self, name):\n        \"\"\"Load a dataset as a DataFrame.\"\"\"\n        if name not in _DATASETS:\n            keys = list(_DATASETS.keys())\n            raise ValueError(\"Dataset not found: \" + name)\n        return DataFrame(_DATASETS[name][\"data\"])\n\n    def info(self, name):\n        \"\"\"Show info about a dataset.\"\"\"\n        if name not in _DATASETS:\n            print(\"Dataset not found: \" + name)\n            return\n        info = _DATASETS[name]\n        print(\"DATASET: \" + info[\"name\"]) <script>

function toggleSolution(i, solution) {
  const panel = document.getElementById('sol-panel-' + i);
  const btn = document.getElementById('sol-btn-' + i);
  if (!panel) return;
  
  const isOpen = panel.classList.contains('show');
  if (isOpen) {
    panel.classList.remove('show');
    btn.textContent = 'Show solution';
    btn.classList.remove('shown');
  } else {
    panel.classList.add('show');
    btn.textContent = 'Hide solution';
    btn.classList.add('shown');
    setTimeout(() => panel.scrollIntoView({behavior:'smooth',block:'nearest'}), 100);
  }
}


// ===== App logic =====
let currentTopic = null;
let editors = {};
let preludeLoaded = false;
const STORAGE_PREFIX = "pandas_progress_v1_";

function getProgress() {
  if (!currentTopic) return {};
  try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + currentTopic.id) || '{}'); }
  catch { return {}; }
}
function saveProgress(p) {
  if (!currentTopic) return;
  try { localStorage.setItem(STORAGE_PREFIX + currentTopic.id, JSON.stringify(p)); } catch {}
}
function markDone(exIdx) {
  const p = getProgress();
  if (!p.exercisesCompleted) p.exercisesCompleted = [];
  if (!p.exercisesCompleted.includes(exIdx)) {
    p.exercisesCompleted.push(exIdx);
    saveProgress(p);
  }
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Render DataFrame markers as nice HTML tables
function renderOutput(text) {
  if (!text) return '';
  const dfRegex = /__DATAFRAME__\|([^\n]+)\n((?:__DATAROW__\|[^\n]*\n?)+)__DATAFRAME_END__/g;
  let result = '';
  let lastEnd = 0;
  let m;
  while ((m = dfRegex.exec(text)) !== null) {
    if (m.index > lastEnd) result += escapeHtml(text.substring(lastEnd, m.index));
    const headers = m[1].split('|');
    const rows = m[2].split('\n').filter(r => r.startsWith('__DATAROW__'));
    let tableHtml = '<table class="df-table"><thead><tr>' + 
      headers.map(h => '<th>' + escapeHtml(h) + '</th>').join('') + 
      '</tr></thead><tbody>';
    rows.forEach(r => {
      const cells = r.substring('__DATAROW__|'.length).split('|');
      tableHtml += '<tr>' + cells.map(c => '<td>' + escapeHtml(c) + '</td>').join('') + '</tr>';
    });
    tableHtml += '</tbody></table>';
    result += tableHtml;
    lastEnd = m.index + m[0].length;
  }
  if (lastEnd < text.length) result += escapeHtml(text.substring(lastEnd));
  return result;
}

function loadTopic(topicId) {
  currentTopic = ALL_PD_TOPICS_FLAT.find(t => t.id === topicId);
  
  // Fallback: if topic ID is missing, load first topic with friendly note
  if (!currentTopic) {
    currentTopic = ALL_PD_TOPICS_FLAT[0];
    document.getElementById('theoryBox').innerHTML = 
      '<div style="background:rgba(255,176,32,.08);padding:.7rem;border-radius:8px;color:var(--orange);font-size:13px">' +
      '⚠️ No specific topic selected. Showing the first topic by default. <a href="pandas-course.html">Back to the course map</a>.' +
      '</div><hr style="border:none;border-top:1px solid var(--border);margin:.7rem 0">' +
      currentTopic.theory;
  } else {
    document.getElementById('theoryBox').innerHTML = currentTopic.theory;
  }
  
  // Save last visited
  try { localStorage.setItem('pandas_last_topic', currentTopic.id); } catch {}
  
  // Update headers
  document.getElementById('topicIcon').textContent = currentTopic.icon;
  document.getElementById('topicTitle').textContent = currentTopic.title;
  document.getElementById('moduleLabel').textContent = 'M' + currentTopic.module + ' · ' + currentTopic.moduleIcon + ' ' + currentTopic.moduleTitle;
  document.getElementById('crumbTitle').textContent = currentTopic.title;
  document.title = currentTopic.title + ' · Pandas course';
  
  // Setup prev/next
  const idx = ALL_PD_TOPICS_FLAT.findIndex(t => t.id === currentTopic.id);
  const prev = ALL_PD_TOPICS_FLAT[idx - 1];
  const next = ALL_PD_TOPICS_FLAT[idx + 1];
  document.getElementById('prevBtn').href = prev ? 'pandas-lesson.html?topic=' + prev.id : '#';
  document.getElementById('nextBtn').href = next ? 'pandas-lesson.html?topic=' + next.id : '#';
  if (!prev) document.getElementById('prevBtn').classList.add('disabled');
  if (!next) document.getElementById('nextBtn').classList.add('disabled');
  
  renderExercises();
}

function renderExercises() {
  const nav = document.getElementById('exNav');
  const container = document.getElementById('exContainer');
  const prog = getProgress();
  const done = prog.exercisesCompleted || [];
  
  nav.innerHTML = currentTopic.exercises.map((_, i) =>
    `<button class="ex-nav-btn ${done.includes(i)?'done':''}" data-idx="${i}" onclick="jumpEx(${i})">${i+1}</button>`
  ).join('');
  
  container.innerHTML = currentTopic.exercises.map((ex, i) => `
    <div class="exercise ${done.includes(i)?'completed':''}" id="ex-${i}">\n      <div class="ex-head">\n        <div class="ex-num">${i+1}</div>\n        <div class="ex-q">${ex.q}</div>\n      </div>\n      <div class="editor-wrap">\n        <div class="editor-bar">\n          <span class="lang">Python · mini-pandas</span>\n          <span class="filler"></span>\n          <button onclick="resetEditor(${i})">Reset</button>\n        </div>\n        <textarea id="code-${i}" spellcheck="false">${escapeHtml(ex.starter || '')}</textarea>\n      </div>\n      <div class="btn-row">\n        <button class="btn btn-run" onclick="checkAnswer(${i})">▶ Run code</button>\n        <button class="btn btn-solution" id="sol-btn-${i}" onclick="toggleSolution(${i})">Show solution</button>\n      </div>\n      <div class="output-label" id="out-lbl-${i}" style="display:none">Output:</div>\n      <div class="output-box" id="out-${i}"></div>\n      <div class="verdict" id="verdict-${i}"></div>\n      <div class="solution-panel" id="sol-panel-${i}">\n        <div class="solution-header">\n          <span class="ico">💡</span>\n          <span class="label">Official solution</span>\n          <button class="copy-btn" onclick="copySolutionCode(${i}, this)">📋 Copy</button>\n        </div>\n        <div class="solution-code" id="sol-code-${i}">${escapeHtml(ex.solution)}</div>\n        <div class="solution-note">Compare with your code — but don't stop thinking!</div>\n      </div>\n    </div>
  `).join('');
  
  // Init CodeMirror
  currentTopic.exercises.forEach((ex, i) => {
    const ta = document.getElementById('code-' + i);
    if (ta && typeof CodeMirror !== 'undefined') {
      const cm = CodeMirror.fromTextArea(ta, {
        mode: 'python', theme: 'dracula', lineNumbers: true,
        indentUnit: 4, autoCloseBrackets: true, direction: 'ltr',
        extraKeys: {
          'Tab': (c) => c.replaceSelection('    ', 'end'),
          'Ctrl-Enter': () => checkAnswer(i),
          'Cmd-Enter': () => checkAnswer(i),
          'Ctrl-Space': 'autocomplete'
        }
      });
      editors[i] = cm;
    }
  });
}

function getCode(i) {
  return editors[i] ? editors[i].getValue() : (document.getElementById('code-'+i).value || '');
}
function setCode(i, val) {
  if (editors[i]) editors[i].setValue(val);
  else document.getElementById('code-'+i).value = val;
}

function resetEditor(i) {
  const ex = currentTopic.exercises[i];
  setCode(i, ex.starter || '');
  document.getElementById('out-'+i).className = 'output-box';
  document.getElementById('out-lbl-'+i).style.display = 'none';
  document.getElementById('verdict-'+i).className = 'verdict';
}

function showSolution(i) {
  const panel = document.getElementById('sol-panel-' + i);
  const btn = document.getElementById('sol-btn-' + i);
  if (!panel) return;
  const isOpen = panel.classList.contains('show');
  if (isOpen) {
    panel.classList.remove('show');
    btn.textContent = 'Show solution';
    btn.classList.remove('shown');
  } else {
    panel.classList.add('show');
    btn.textContent = 'Hide solution';
    btn.classList.add('shown');
    setTimeout(() => panel.scrollIntoView({behavior:'smooth',block:'nearest'}), 100);
  }
}

function copySolutionCode(i, btnEl) {
  const codeEl = document.getElementById('sol-code-' + i);
  if (!codeEl) return;
  const text = codeEl.textContent;
  const doCopy = () => {
    btnEl.textContent = '✓ copied';
    btnEl.classList.add('copied');
    setTimeout(() => {
      btnEl.textContent = '📋 copy';
      btnEl.classList.remove('copied');
    }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(doCopy, () => fallbackCopy(text, doCopy));
  } else { fallbackCopy(text, doCopy); }
}

function fallbackCopy(text, callback) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-100px;left:0;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); callback(); } catch(e) {}
  document.body.removeChild(ta);
}

function jumpEx(i) {
  const el = document.getElementById('ex-' + i);
  if (!el) return;
  el.scrollIntoView({behavior: 'smooth', block: 'start'});
  el.style.boxShadow = '0 0 0 3px var(--cyan)';
  setTimeout(() => { el.style.boxShadow = ''; }, 1200);
}

async function checkAnswer(i) {
  const ex = currentTopic.exercises[i];
  const code = getCode(i);
  
  const outBox = document.getElementById('out-' + i);
  const outLbl = document.getElementById('out-lbl-' + i);
  const verdict = document.getElementById('verdict-' + i);
  outBox.className = 'output-box show';
  outLbl.style.display = 'block';
  outBox.textContent = 'running...';
  verdict.className = 'verdict';
  
  if (typeof Sk === 'undefined') {
    outBox.textContent = 'Skulpt didn\'t load. Refresh the page.';
    outBox.classList.add('err');
    return;
  }
  
  let output = '';
  let runError = null;
  
  try {
    await new Promise((resolve) => {
      Sk.configure({
        output: (t) => { output += t; },
        read: (f) => {
          if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][f] === undefined) {
            throw "File not found: '" + f + "'";
          }
          return Sk.builtinFiles["files"][f];
        },
        __future__: Sk.python3, execLimit: 8000, retainglobals: true
      });
      
      // Load prelude on first run
      const codeToRun = preludeLoaded ? code : (PYTHON_PRELUDE + '\n\n' + code);
      
      Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, codeToRun, true))
        .then(() => {
          if (!preludeLoaded) {
            preludeLoaded = true;
            // Discard prelude output (none should be produced anyway)
            const preludeLineCount = (PYTHON_PRELUDE.match(/\n/g) || []).length;
            // Actually prelude produces no output, so just trust 'output' variable
          }
          resolve();
        })
        .catch((e) => { runError = e.toString(); resolve(); });
    });
  } catch (e) { runError = String(e); }
  
  if (runError) {
    outBox.className = 'output-box err show';
    outBox.innerHTML = (output ? escapeHtml(output) + '\n\n' : '') + 'error: ' + escapeHtml(runError);
    verdict.className = 'verdict failure show';
    verdict.textContent = 'There\'s an error in the code. Read the message and fix it.';
    return;
  }
  
  // Render output with DataFrame tables
  outBox.innerHTML = renderOutput(output || '(no output)');
  outBox.className = 'output-box show';
  
  // Run check
  let passed = false;
  try {
    if (typeof ex.check === 'function') {
      passed = ex.check(output, code);
    }
  } catch (e) { passed = false; }
  
  if (passed) {
    verdict.className = 'verdict success show';
    verdict.textContent = '✓ Excellent! Correct answer.';
    if (ex.explain) {
      const _w = document.createElement('div');
      _w.className = 'why-box';
      _w.innerHTML = '<div class="why-title">Why This Works</div>' + ex.explain;
      verdict.appendChild(_w);
    }
    markDone(i);

    try {
      const btn = document.getElementById('sol-btn-' + i);
      const usedSolution = btn && btn.classList.contains('shown');
      if (window.gam && window.gam.markExercisePassed) {
        window.gam.markExercisePassed('pandas-lesson', i, usedSolution);
      }
    } catch(e) { console.warn('gam err:', e); }

    document.getElementById('ex-' + i).classList.add('completed');
    document.querySelector('.ex-nav-btn[data-idx="' + i + '"]').classList.add('done');
  } else {
    verdict.className = 'verdict failure show';
    verdict.textContent = 'The code ran, but the output differs from what\'s expected. Try again or click "Show Solution".';
  }
}

// Init
function init() {
  const params = new URLSearchParams(window.location.search);
  const topicId = params.get('topic');
  loadTopic(topicId);
}

if (typeof Sk !== 'undefined' && typeof CodeMirror !== 'undefined') {
  init();
} else {
  window.addEventListener('load', () => setTimeout(init, 100));
}

      const earned = earnedBadges.includes(b.id);
      const name = IS_RTL ? b.name_he : b.name_en;
      const desc = IS_RTL ? b.desc_he : b.desc_en;
      return `
        <div class="gam-badge ${earned ? 'earned' : 'locked'}" title="${desc}">
          <div class="gam-badge-icon">${b.icon}</div>
          <div class="gam-badge-name">${name}</div>
        </div>
      `;
    }).join('');
    
    // Last 7 days activity
    const dailyData = JSON.parse(localStorage.getItem(STORAGE.DAILY_XP) || '{}');
    const last7 = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      last7.push({ date: ds, xp: dailyData[ds] || 0, label: d.toLocaleDateString(IS_RTL ? 'he-IL' : 'en-US', { weekday: 'short' }) });
    }
    const maxXP = Math.max(...last7.map(d => d.xp), 1);
    const chartHTML = last7.map(d => `
      <div class="gam-chart-bar">
        <div class="gam-chart-fill" style="height: ${(d.xp / maxXP) * 100}%"></div>
        <div class="gam-chart-label">${d.label}</div>
        <div class="gam-chart-val">${d.xp || ''}</div>
      </div>
    `).join('');
    
    const panel = document.createElement('div');
    panel.id = 'gam-panel';
    panel.innerHTML = `
      <div class="gam-panel-inner" role="dialog">\n        <button class="gam-panel-close" aria-label="${T.close}">&Times;</button>\n        <h2 class="gam-panel-title">${T.progressTitle}</h2>\n        \n        <div class="gam-stats">\n          <div class="gam-stat">\n            <div class="gam-stat-icon">⭐</div>\n            <div class="gam-stat-val">${xp.toLocaleString()}</div>\n            <div class="gam-stat-label">${T.xp}</div>\n          </div>\n          <div class="gam-stat">\n            <div class="gam-stat-icon">🔥</div>\n            <div class="gam-stat-val">${streak}</div>\n            <div class="gam-stat-label">${T.streak}</div>\n          </div>\n          <div class="gam-stat">\n            <div class="gam-stat-icon">🎖️</div>\n            <div class="gam-stat-val">${level}</div>\n            <div class="gam-stat-label">${T.level}</div>\n          </div>\n        </div>\n        \n        <div class="gam-progress-box">\n          <div class="gam-progress-header">\n            <span>${T.level} ${level}</span>\n            <span>${T.level} ${level + 1}</span>\n          </div>\n          <div class="gam-progress-bar">\n            <div class="gam-progress-fill" style="width: ${Math.max(0, Math.min(100, progressPct))}%"></div>\n          </div>\n          <div class="gam-progress-text">${T.xpToNext(xpToNext)}</div>\n        </div>\n        \n        <div class="gam-section-title">${IS_RTL ? '📈 Weekly Activity' : '📈 Weekly Activity'}</div>\n        <div class="gam-chart">${chartHTML}</div>\n        \n        <div class="gam-section-title">${T.achievements} (${earnedBadges.length}/${BADGE_DEFS.length})</div>\n        <div class="gam-badges">${badgesHTML}</div>\n        \n        <div class="gam-footer">\n          <div>${IS_RTL ? 'Exercises solved' : 'Exercises solved'}: <strong>${totalPassed}</strong></div>\n          <div>${IS_RTL ? 'Your longest streak' : 'Longest streak'}: <strong>${longest}</strong> ${T.streakDays(longest)}</div>\n        </div>\n      </div>
    `;
    document.body.appendChild(panel);
    setTimeout(() => panel.classList.add('show'), 10);
    
    panel.querySelector('.gam-panel-close').addEventListener('click', closePanel);
    panel.addEventListener('click', e => {
      if (e.target === panel) closePanel();
    });
  }
  function closePanel() {
    const p = document.getElementById('gam-panel');
    if (p) { p.classList.remove('show'); setTimeout(() => p.remove(), 300); }
  }
  
  // ---- Public API ----
  window.gam = {
    addXP: addXP,
    markExercisePassed: markExercisePassed,
    completeModule: function(moduleName) {
      addXP(XP_REWARDS.MODULE_COMPLETE, IS_RTL ? `Module completed: ${moduleName}` : `Module complete: ${moduleName}`);
    },
    open: openPanel,
    getXP: getXP,
    getStreak: getStreak,
    getBadges: getBadges,
  };
  
  // ---- Init ----
  function init() {
    buildHUD();
    updateUI();
    updateStreakOnLoad();
    checkBadges();
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>

<script>
/* AI ERROR HELPER */
/* ============================================================
   AI ERROR HELPER — Smart error explanations
   No external API needed - uses pattern matching + offline rules
   Works in Hebrew (RTL) and English (LTR)
   ============================================================ */

(function() {
  'use strict';
  
  const IS_RTL = document.documentElement.dir === 'rtl' || document.documentElement.lang === 'he';
  
  // ---- Error patterns and explanations ----
  // Each entry: { match: regex, he: explanation, en: explanation, hint: suggestion }
  const ERROR_PATTERNS = [
    {
      match: /NameError.*name '(\w+)' is not defined/i,
      he: (m) => `<b>NameError</b>: the variable <code>${m[1]}</code> is not defined. 🤔`,
      en: (m) => `<b>NameError</b>: The variable <code>${m[1]}</code> is not defined. 🤔`,
      hint_he: (m) => [
        `📝 Check that you didn't forget to define the variable before using it.`,
        `🔤 There may be a typo in the variable name — names in Python are case-sensitive.`,
        `💡 Valid example: <code>${m[1]} = 10</code> and then <code>print(${m[1]})</code>`,
      ],
      hint_en: (m) => [
        `📝 Check that you defined the variable before using it.`,
        `🔤 There may be a typo in the name — Python names are case-sensitive.`,
        `💡 Valid example: <code>${m[1]} = 10</code> then <code>print(${m[1]})</code>`,
      ],
    },
    {
      match: /SyntaxError.*expected/i,
      he: () => `<b>SyntaxError</b>: there's an error in the code's structure. ✏️`,
      en: () => `<b>SyntaxError</b>: There's a problem in the code structure. ✏️`,
      hint_he: () => [
        `🔍 Check that every call has an opening and closing parenthesis.`,
        `🔍 Check that there's a <code>:</code> at the end of <code>if</code>, <code>for</code>, <code>while</code>, <code>def</code> lines.`,
        `🔍 Check that there are no open quotes without a closing one — for example <code>"hello</code> should be <code>"hello"</code>.`,
      ],
      hint_en: () => [
        `🔍 Check that all parentheses are properly opened and closed.`,
        `🔍 Check for the <code>:</code> at the end of <code>if</code>, <code>for</code>, <code>while</code>, <code>def</code> lines.`,
        `🔍 Check for unclosed quotes — e.g. <code>"hello</code> should be <code>"hello"</code>.`,
      ],
    },
    {
      match: /SyntaxError.*EOL while scanning/i,
      he: () => `<b>SyntaxError</b>: a closing quote is missing in the string. 📝`,
      en: () => `<b>SyntaxError</b>: A string is missing a closing quote. 📝`,
      hint_he: () => [`💡 Look for a string that opens with <code>"</code> but doesn't close with the same character.`],
      hint_en: () => [`💡 Look for a string that opens with <code>"</code> but isn't closed.`],
    },
    {
      match: /IndentationError|unexpected indent/i,
      he: () => `<b>IndentationError</b>: a problem with line indentation (spaces at the start). 📐`,
      en: () => `<b>IndentationError</b>: Indentation problem (leading spaces). 📐`,
      hint_he: () => [
        `📏 In Python, the lines after <code>if</code>, <code>for</code>, <code>def</code> need to be indented (4 spaces).`,
        `📏 Make sure all the lines in the same block are indented the same amount.`,
        `📏 Don't mix spaces and tabs.`,
      ],
      hint_en: () => [
        `📏 In Python, lines after <code>if</code>, <code>for</code>, <code>def</code> must be indented (4 spaces).`,
        `📏 Make sure all lines in the same block have the same indentation.`,
        `📏 Don't mix spaces and tabs.`,
      ],
    },
    {
      match: /TypeError.*unsupported operand.*'str'.*'int'|'int'.*'str'/i,
      he: () => `<b>TypeError</b>: you can't add/perform an operation between a number and a string. 🔢`,
      en: () => `<b>TypeError</b>: Cannot operate between a number and a string. 🔢`,
      hint_he: () => [
        `🔄 Use <code>str(x)</code> to convert a number to a string.`,
        `🔄 Use <code>int(x)</code> to convert a string to a number.`,
        `💡 Example: <code>"Age: " + str(25)</code> or <code>int("5") + 3</code>`,
      ],
      hint_en: () => [
        `🔄 Use <code>str(x)</code> to convert a number to a string.`,
        `🔄 Use <code>int(x)</code> to convert a string to a number.`,
        `💡 Example: <code>"Age: " + str(25)</code> or <code>int("5") + 3</code>`,
      ],
    },
    {
      match: /TypeError.*takes \d+.*argument.*but \d+/i,
      he: () => `<b>TypeError</b>: you sent the wrong number of arguments to the function. 🎯`,
      en: () => `<b>TypeError</b>: Wrong number of arguments passed to function. 🎯`,
      hint_he: () => [
        `🔍 Check that the function receives exactly the required number of arguments.`,
        `💡 If the function is defined as <code>def f(a, b)</code> you need to call it as <code>f(1, 2)</code>.`,
      ],
      hint_en: () => [
        `🔍 Check that the function receives exactly the required arguments.`,
        `💡 If defined as <code>def f(a, b)</code> call as <code>f(1, 2)</code>.`,
      ],
    },
    {
      match: /ZeroDivisionError/i,
      he: () => `<b>ZeroDivisionError</b>: you can't divide by 0. ➗`,
      en: () => `<b>ZeroDivisionError</b>: Cannot divide by 0. ➗`,
      hint_he: () => [
        `🔍 Check that the denominator (the number you're dividing by) isn't 0.`,
        `💡 Add a condition before dividing: <code>if y != 0: print(x / y)</code>`,
      ],
      hint_en: () => [
        `🔍 Check that the denominator isn't 0.`,
        `💡 Add a condition: <code>if y != 0: print(x / y)</code>`,
      ],
    },
    {
      match: /IndexError.*out of range/i,
      he: () => `<b>IndexError</b>: You tried to access an item that doesn't exist in the list. 📋`,
      en: () => `<b>IndexError</b>: Tried to access an item that doesn't exist in the list. 📋`,
      hint_he: () => [
        `🔢 A list of length 5 — its indexes are 0, 1, 2, 3, 4 (not 5!).`,
        `📏 Use <code>len(list)</code> to check the length of the list.`,
        `💡 Access to the last element: <code>list[-1]</code>.`,
      ],
      hint_en: () => [
        `🔢 A list of length 5 has indices 0, 1, 2, 3, 4 (not 5!).`,
        `📏 Use <code>len(list)</code> to check list length.`,
        `💡 Access the last item with <code>list[-1]</code>.`,
      ],
    },
    {
      match: /KeyError.*'?([^']+)'?/i,
      he: (m) => `<b>KeyError</b>: the key <code>${m[1] || '?'}</code> doesn't exist in the dictionary. 🔑`,
      en: (m) => `<b>KeyError</b>: The key <code>${m[1] || '?'}</code> doesn't exist in the dictionary. 🔑`,
      hint_he: (m) => [
        `🔍 Check the key spelling — dictionary names are case-sensitive.`,
        `🛡 Use <code>.get()</code> for safe access: <code>dict.get("${m[1] || 'key'}", "default")</code>`,
        `🔍 To check whether a key exists: <code>if "${m[1] || 'key'}" in dict:</code>`,
      ],
      hint_en: (m) => [
        `🔍 Check the key spelling — dictionary keys are case-sensitive.`,
        `🛡 Use <code>.get()</code> for safe access: <code>dict.get("${m[1] || 'key'}", "default")</code>`,
        `🔍 Check if key exists with <code>if "${m[1] || 'key'}" in dict:</code>`,
      ],
    },
    {
      match: /ValueError.*invalid literal for int/i,
      he: () => `<b>ValueError</b>: you tried to convert a string that isn't a number to int. 🔢`,
      en: () => `<b>ValueError</b>: Tried converting a non-numeric string to int. 🔢`,
      hint_he: () => [
        `🔍 Only strings with digits can become a number: <code>int("123")</code> ✅`,
        `❌ Not: <code>int("abc")</code> or <code>int("3.5")</code>`,
        `💡 For a float with decimal digits: <code>float("3.5")</code>`,
      ],
      hint_en: () => [
        `🔍 Only digit strings can be converted: <code>int("123")</code> ✅`,
        `❌ Not: <code>int("abc")</code> or <code>int("3.5")</code>`,
        `💡 For decimals use: <code>float("3.5")</code>`,
      ],
    },
    {
      match: /AttributeError.*'(\w+)'.*object has no attribute '(\w+)'/i,
      he: (m) => `<b>AttributeError</b>: an object of type <code>${m[1]}</code> has no method/attribute <code>${m[2]}</code>. ⚙️`,
      en: (m) => `<b>AttributeError</b>: Object of type <code>${m[1]}</code> has no attribute <code>${m[2]}</code>. ⚙️`,
      hint_he: (m) => [
        `🔍 Check the spelling of the method name — Python is case-sensitive.`,
        `📚 Check that the method <code>${m[2]}</code> actually exists on <code>${m[1]}</code>.`,
        `💡 If it's a <code>list</code>, common methods: <code>.append()</code>, <code>.remove()</code>, <code>.sort()</code>.`,
      ],
      hint_en: (m) => [
        `🔍 Check the method name spelling — Python is case-sensitive.`,
        `📚 Verify that <code>${m[2]}</code> exists on <code>${m[1]}</code>.`,
        `💡 If it's <code>list</code>, common methods: <code>.append()</code>, <code>.remove()</code>, <code>.sort()</code>.`,
      ],
    },
    {
      match: /FileNotFoundError/i,
      he: () => `<b>FileNotFoundError</b>: the file wasn't found. 📁`,
      en: () => `<b>FileNotFoundError</b>: File not found. 📁`,
      hint_he: () => [
        `🔍 Check the file path.`,
        `💡 Our simulator doesn't have access to real files — use <code>data.load()</code> for datasets.`,
      ],
      hint_en: () => [
        `🔍 Check the file path.`,
        `💡 Our simulator doesn't access real files — use <code>data.load()</code> for datasets.`,
      ],
    },
    {
      match: /ImportError|ModuleNotFoundError/i,
      he: (m) => `<b>ImportError</b>: the library cannot be imported. 📚`,
      en: (m) => `<b>ImportError</b>: Cannot import the library. 📚`,
      hint_he: () => [
        `🔍 The simulator (Skulpt) only supports built-in libraries: math, random, re, datetime, itertools, string, collections.`,
        `❌ Doesn't support: numpy, pandas, matplotlib (but we have our own DataFrame via <code>data.load()</code>).`,
        `💡 For real work with pandas/numpy — download Python to your computer or use Google Colab.`,
      ],
      hint_en: () => [
        `🔍 The simulator (Skulpt) only supports built-in libraries: math, random, re, datetime, itertools, string, collections.`,
        `❌ Does not support: numpy, pandas, matplotlib (but we have our own DataFrame via <code>data.load()</code>).`,
        `💡 For real pandas/numpy work — install Python locally or use Google Colab.`,
      ],
    },
    {
      match: /RecursionError|maximum recursion/i,
      he: () => `<b>RecursionError</b>: too many recursive calls. 🌀`,
      en: () => `<b>RecursionError</b>: Too many recursive calls. 🌀`,
      hint_he: () => [
        `🔍 Make sure there's a stopping condition (base case) in the recursive function.`,
        `💡 Example: <code>if n == 0: return 1</code>`,
      ],
      hint_en: () => [
        `🔍 Make sure there's a base case in the recursive function.`,
        `💡 Example: <code>if n == 0: return 1</code>`,
      ],
    },
    // Generic fallback
    {
      match: /^([A-Z]\w*Error)/i,
      he: (m) => `<b>${m[1]}</b>: There's an error in the code. Check the message above. 🔍`,
      en: (m) => `<b>${m[1]}</b>: There's an error in the code. Check the message above. 🔍`,
      hint_he: () => [
        `📖 Read the error message carefully — it usually points to the line number and the problem.`,
        `💡 If you're stuck, click "Show Solution" and see how it's supposed to look.`,
      ],
      hint_en: () => [
        `📖 Read the error message carefully — it usually points to the line number and problem.`,
        `💡 If stuck, click "Show Solution" to see how it should look.`,
      ],
    },
  ];
  
  // ---- Main: explain an error ----
  function explainError(errorText) {
    if (!errorText || typeof errorText !== 'string') return null;
    
    for (const pat of ERROR_PATTERNS) {
      const m = errorText.match(pat.match);
      if (m) {
        const explanation = IS_RTL ? pat.he(m) : pat.en(m);
        const hintFn = IS_RTL ? pat.hint_he : pat.hint_en;
        const hints = hintFn(m);
        return { explanation, hints };
      }
    }
    return null;
  }
  
  // ---- UI: Show explanation box ----
  function showExplanation(targetEl, errorText) {
    const result = explainError(errorText);
    if (!result) return;
    
    // Remove old explanation if exists
    const old = targetEl.parentElement.querySelector('.gam-ai-helper');
    if (old) old.remove();
    
    const box = document.createElement('div');
    box.className = 'gam-ai-helper';
    
    const hintsHTML = result.hints.map(h => `<li>${h}</li>`).join('');
    
    box.innerHTML = `
      <div class="gam-ai-header">\n        <span class="gam-ai-icon">🤖</span>\n        <span class="gam-ai-title">${IS_RTL ? 'AI Helper' : 'AI Helper'}</span>\n        <button class="gam-ai-close" aria-label="${IS_RTL ? 'Close' : 'Close'}">&Times;</button>\n      </div>\n      <div class="gam-ai-body">\n        <div class="gam-ai-explain">${result.explanation}</div>\n        <div class="gam-ai-hints-title">${IS_RTL ? '💡 How to fix:' : '💡 How to fix:'}</div>\n        <ul class="gam-ai-hints">${hintsHTML}</ul>\n      </div>
    `;
    
    // Insert after the target
    targetEl.parentElement.insertBefore(box, targetEl.nextSibling);
    
    // Animate in
    setTimeout(() => box.classList.add('show'), 10);
    
    // Close button
    box.querySelector('.gam-ai-close').addEventListener('click', () => {
      box.classList.remove('show');
      setTimeout(() => box.remove(), 300);
    });
  }
  
  // ---- Hook into output displays ----
  function observeOutputs() {
    // Find output boxes when they show errors
    const observer = new MutationObserver(mutations => {
      mutations.forEach(m => {
        if (m.type === 'childList' || m.type === 'characterData') {
          const target = m.target;
          // Check if it's an output box with error content
          let el = target.nodeType === 1 ? target : target.parentElement;
          while (el && !el.classList) el = el.parentElement;
          
          if (el && el.classList && (
              el.classList.contains('output-box') ||
              el.classList.contains('out') ||
              el.id?.startsWith('out-'))) {
            const text = el.textContent || '';
            // Check for error patterns
            if (/Error:|Traceback/i.test(text)) {
              // Avoid duplicates
              if (!el.parentElement.querySelector('.gam-ai-helper')) {
                showExplanation(el, text);
              }
            }
          }
        }
      });
    });
    
    observer.observe(document.body, {
      childList: true,
      subtree: true,
      characterData: true,
    });
  }
  
  // ---- Public API ----
  window.gamAI = {
    explain: explainError,
    show: showExplanation,
  };
  
  // ---- Init ----
  function init() {
    observeOutputs();
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
<script>
/* SOUND EFFECTS */
/* ============================================================
   SOUND EFFECTS — Web Audio API (no external files)
   Pure JS, works offline, mobile-friendly
   ============================================================ */

(function() {
  'use strict';
  
  // ---- Mute toggle (saved to localStorage) ----
  function isMuted() { return localStorage.getItem('gam_muted') === '1'; }
  function setMuted(b) { localStorage.setItem('gam_muted', b ? '1' : '0'); }
  
  // ---- AudioContext (lazy initialization, mobile-safe) ----
  let audioCtx = null;
  function getCtx() {
    if (audioCtx) return audioCtx;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
      return audioCtx;
    } catch(e) { return null; }
  }
  
  // ---- Play a tone ----
  function tone(freq, duration, type = 'sine', vol = 0.15, delay = 0) {
    if (isMuted()) return;
    const ctx = getCtx();
    if (!ctx) return;
    
    // Resume context on first user interaction (mobile requirement)
    if (ctx.state === 'suspended') {
      ctx.resume().catch(() => {});
    }
    
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    
    gain.gain.setValueAtTime(0, ctx.currentTime + delay);
    gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + delay + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
    
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + duration);
  }
  
  // ---- Sound presets ----
  const SOUNDS = {
    // Exercise correct - bright ascending chime
    correct: () => {
      tone(523.25, 0.15, 'sine', 0.15, 0);     // C5

    // Exercise incorrect - soft descending hum

    // XP earned - quick double pop

      tone(783.99, 0.12, 'square', 0.1, 0.2);    // G5
      tone(1046.50, 0.3,  'square', 0.12, 0.3);  // C6
    },
    
    // Badge unlock - magical sparkle
    badge: () => {
