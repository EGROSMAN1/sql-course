<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pandas lesson - live code</title>
<meta name="description" content="An interactive Pandas lesson. Practice DataFrame in a live simulator - mini-pandas + 9 built-in Israeli datasets.">
<meta name="robots" content="noindex">

<style>
:root{
  --bg:#080C14;--bg2:#0D1220;--bg3:#111828;--bg4:#16202E;
  --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);
  --text:#F1F5FF;--text2:#8896AA;--text3:#5A6478;
  --cyan:#00E5FF;--green:#00E5A0;--orange:#FFB020;--red:#FF4060;
  --py-yellow:#FFDE57;
  --code-bg:#0a0e15;--code-text:#FFD580;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Heebo",Roboto,system-ui,Arial,sans-serif;line-height:1.55;direction:ltr;min-height:100vh}
a{color:var(--cyan);text-decoration:none}

.topnav{display:flex;align-items:center;gap:.7rem;padding:.55rem 1rem;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:50;flex-wrap:wrap}
.back-btn{color:var(--text2);font-size:13px;font-weight:600;padding:5px 10px;border-radius:6px;background:var(--bg3);transition:all .12s;white-space:nowrap}
.back-btn:hover{color:var(--text);background:var(--bg4)}
.crumb{flex:1;font-size:13.5px;color:var(--text);font-weight:700;min-width:0;text-align:center}
.crumb em{color:var(--cyan);font-style:normal}

.main{max-width:900px;margin:0 auto;padding:1.2rem 1rem 5rem}

.lesson-head{display:flex;align-items:center;gap:.7rem;margin-bottom:.8rem;flex-wrap:wrap}
.lesson-head .icon{font-size:2rem}
.lesson-head .info{flex:1;min-width:0}
.lesson-head .module-label{font-size:11.5px;font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.2rem}
.lesson-head .title{font-size:1.4rem;font-weight:800}

/* Theory */
.theory{background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:1rem 1.2rem;margin-bottom:1.4rem;font-size:14px;line-height:1.7}
.theory h3{font-size:1.05rem;color:var(--cyan);margin-bottom:.5rem;font-weight:700}
.theory p{margin:.4rem 0}
.theory ul, .theory ol{padding-right:1.5rem;margin:.4rem 0}
.theory li{margin:.25rem 0}
.theory code{background:var(--code-bg);color:var(--code-text);padding:1px 6px;border-radius:4px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;direction:ltr;display:inline-block}
.theory pre{background:var(--code-bg);padding:.7rem .9rem;border-radius:7px;margin:.6rem 0;direction:ltr;text-align:left;overflow-x:auto;color:var(--code-text);font-family:"SF Mono",monospace;font-size:12.5px;line-height:1.55;border:1px solid var(--border)}
.theory b{color:var(--text);font-weight:700}

/* Exercise nav */
.ex-nav{display:flex;gap:.35rem;justify-content:center;margin-bottom:1rem;flex-wrap:wrap}
.ex-nav-btn{width:34px;height:30px;border-radius:7px;background:var(--bg3);border:1px solid var(--border2);color:var(--text2);font-size:12.5px;font-weight:700;cursor:pointer;font-family:"SF Mono",monospace;transition:all .12s}
.ex-nav-btn:hover{border-color:var(--cyan);color:var(--cyan);transform:translateY(-1px)}
.ex-nav-btn.done{background:rgba(0,229,160,.12);border-color:var(--green);color:var(--green)}
.ex-nav-btn.current{background:linear-gradient(135deg,var(--cyan),var(--green));color:#000;border-color:transparent}

/* Exercise */
.exercise{background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:1rem 1.2rem;margin-bottom:1rem}
.exercise.completed{border-color:rgba(0,229,160,.35)}
.ex-head{display:flex;align-items:flex-start;gap:.7rem;margin-bottom:.7rem;flex-wrap:wrap}
.ex-num{background:var(--bg3);color:var(--text3);font-weight:800;width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:"SF Mono",monospace;font-size:13px;flex-shrink:0}
.exercise.completed .ex-num{background:linear-gradient(135deg,var(--green),var(--cyan));color:#000}
.ex-q{font-size:14px;color:var(--text);line-height:1.65;flex:1;min-width:100%;margin-top:.2rem}
.ex-q code{background:var(--code-bg);color:var(--py-yellow);padding:1px 6px;border-radius:4px;font-family:"SF Mono",monospace;font-size:12.5px;direction:ltr;display:inline-block}

/* Editor */
.editor-wrap{background:var(--code-bg);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:.6rem}
.editor-bar{display:flex;align-items:center;gap:.4rem;background:var(--bg3);padding:.35rem .65rem;font-size:11px;color:var(--text2);border-bottom:1px solid var(--border)}
.editor-bar .lang{font-weight:700;color:var(--py-yellow)}
.editor-bar .filler{flex:1}
.editor-bar button{background:transparent;border:none;color:var(--text2);font-size:11px;padding:2px 8px;border-radius:4px;cursor:pointer;font-family:inherit;transition:all .12s}
.editor-bar button:hover{color:var(--text);background:var(--bg)}

.btn-row{display:flex;gap:.4rem;flex-wrap:wrap}
.btn{padding:.55rem .9rem;border-radius:8px;font-weight:700;font-size:12.5px;cursor:pointer;transition:all .12s;font-family:inherit;border:none;display:inline-flex;align-items:center;gap:.3rem}
.btn-run{background:linear-gradient(135deg,var(--green),var(--cyan));color:#000;flex:1;min-width:120px;justify-content:center}
.btn-run:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,229,160,.25)}
.btn-solution{background:var(--bg3);color:var(--text2);border:1px solid var(--border2)}
.btn-solution:hover{color:var(--py-yellow);border-color:var(--py-yellow)}
.btn-solution.shown{background:rgba(255,222,87,.12);color:var(--py-yellow);border-color:rgba(255,222,87,.3)}

.output-label{font-size:11px;color:var(--text3);margin:.6rem 0 .25rem;font-weight:700}
.output-box{background:var(--code-bg);border:1px solid var(--border);border-radius:7px;padding:.7rem .85rem;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12px;color:var(--code-text);white-space:pre-wrap;direction:ltr;text-align:left;min-height:24px;display:none;line-height:1.55}
.output-box.show{display:block}
.output-box.err{color:#ffb0b8;background:rgba(255,64,96,.04);border-color:rgba(255,64,96,.2)}
.verdict{margin-top:.55rem;padding:.5rem .8rem;border-radius:7px;font-size:12.5px;font-weight:600;display:none}
.verdict.show{display:block}
.verdict.success{background:rgba(0,229,160,.1);color:var(--green);border:1px solid rgba(0,229,160,.3)}
.verdict.failure{background:rgba(255,176,32,.08);color:var(--orange);border:1px solid rgba(255,176,32,.25)}

/* DataFrame HTML tables */
.df-table{border-collapse:collapse;margin:.5rem 0;font-size:12px;font-family:"SF Mono",monospace;direction:ltr;display:block;overflow-x:auto;max-width:100%;background:var(--bg2)}
.df-table thead{background:var(--bg3)}
.df-table th{padding:.45rem .7rem;font-weight:700;color:var(--cyan);border:1px solid var(--border);text-align:left;white-space:nowrap}
.df-table td{padding:.35rem .7rem;border:1px solid var(--border);color:var(--text);white-space:nowrap}
.df-table tbody tr:nth-child(odd){background:rgba(255,255,255,.02)}
.df-table tbody tr:hover{background:rgba(0,229,255,.05)}

/* Bottom nav */
.bottom-nav{display:flex;gap:.6rem;justify-content:space-between;margin-top:2rem;padding-top:1rem;border-top:1px solid var(--border)}
.nav-btn{flex:1;background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:.7rem .9rem;border-radius:9px;font-weight:600;font-size:13px;text-align:center;transition:all .15s}
.nav-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.nav-btn.disabled{opacity:.4;pointer-events:none}

/* CodeMirror */
.CodeMirror{height:auto !important;min-height:90px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:13px;direction:ltr;text-align:left}
.cm-s-dracula.CodeMirror{background:#0a0e15 !important;color:#FFD580}
.cm-s-dracula .CodeMirror-gutters{background:#0a0e15;border-right:1px solid var(--border)}
.cm-s-dracula .CodeMirror-linenumber{color:var(--text3)}
.CodeMirror-hints{background:var(--bg3) !important;border:1px solid var(--border2) !important;border-radius:6px;direction:ltr;font-family:"SF Mono",monospace;font-size:12.5px;z-index:9999}
.CodeMirror-hint{color:var(--text);padding:5px 10px}
li.CodeMirror-hint-active{background:var(--cyan) !important;color:#000 !important}

@media(max-width:768px){
  .main{padding:.8rem .6rem 4rem}
  .lesson-head .title{font-size:1.2rem}
  .theory{padding:.85rem 1rem;font-size:13px}
  .exercise{padding:.85rem 1rem}
  .ex-q{font-size:13px}
  .ex-q code{font-size:11.5px}
  .CodeMirror{font-size:12.5px;min-height:80px}
  .output-box{font-size:11.5px}
  .df-table{font-size:11px}
  .df-table th,.df-table td{padding:.3rem .5rem}
}

.tip-box{background:rgba(0,229,255,.05);border:1px solid rgba(0,229,255,.25);border-radius:8px;padding:.75rem .9rem;font-size:12.5px;color:var(--text2);margin-bottom:1rem}
.tip-box b{color:var(--cyan)}

/* ============== UNIVERSAL MOBILE PACK ============== */
/* Prevent iOS text auto-resize on rotation */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* iOS safe area insets for notched devices */
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
/* Prevent horizontal scroll on tiny phones */
html,body{overflow-x:hidden;max-width:100vw}
/* Better tap highlight */
a,button,select,input{-webkit-tap-highlight-color:rgba(0,229,255,.15)}
/* Smooth scrolling on iOS */
.cell-output,.output-box,.theory pre,.df-table{-webkit-overflow-scrolling:touch}
/* Prevent iOS input zoom (inputs need >=16px) */
input,select,textarea{font-size:16px !important}
/* Min touch target 44px (Apple HIG) */
button:not(.cell-icon-btn):not(.jump-btn):not(.ex-nav-btn):not(.reset-btn):not(.tb-btn){min-height:38px}
/* iOS Safari sticky header fix */
@supports (-webkit-touch-callout:none){
  .topnav{position:-webkit-sticky;position:sticky}
}

@media(max-width:768px){
  .main{padding:.85rem .65rem 4rem}
  .lesson-head .title{font-size:1.2rem}
  .lesson-head .icon{font-size:1.7rem}
  .theory{padding:.85rem 1rem;font-size:13px}
  .theory pre{font-size:12px}
  .exercise{padding:.85rem .95rem}
  .ex-q{font-size:13px}
  .ex-q code{font-size:11.5px}
  .CodeMirror{font-size:12.5px;min-height:80px}
  .output-box{font-size:11.5px}
  .df-table{font-size:11px}
  .df-table th,.df-table td{padding:.3rem .5rem}
  .tip-box{font-size:12px}
}
@media(max-width:480px){
  .main{padding:.7rem .55rem 4rem}
  .topnav{padding:.45rem .65rem}
  .crumb{font-size:12.5px}
  .lesson-head .title{font-size:1.1rem}
  .theory{padding:.75rem .85rem;font-size:12.5px}
  .theory pre{padding:.55rem .7rem;font-size:11.5px}
  .ex-nav-btn{width:30px;height:28px;font-size:11px}
  .exercise{padding:.75rem .85rem}
  .ex-num{width:26px;height:26px;font-size:11.5px}
  .ex-q{font-size:12.5px}
  .CodeMirror{font-size:12px;min-height:72px}
  .btn-run{flex:1 1 100%}
}
@media(max-width:400px){
  .topnav{padding:.4rem .5rem;gap:.4rem}
  .back-btn{font-size:11.5px;padding:4px 8px}
  .crumb{font-size:11.5px}
  .main{padding:.65rem .5rem 4rem}
  .lesson-head{gap:.55rem}
  .lesson-head .icon{font-size:1.6rem}
  .lesson-head .title{font-size:1.05rem}
  .lesson-head .module-label{font-size:10.5px}
  .theory{padding:.7rem .8rem;font-size:12px;line-height:1.6;border-radius:9px}
  .theory h3{font-size:.95rem}
  .theory pre{padding:.5rem .65rem;font-size:11px}
  .theory code{font-size:11px}
  .tip-box{padding:.6rem .75rem;font-size:11.5px}
  .ex-nav{gap:.22rem}
  .ex-nav-btn{width:28px;height:26px;font-size:10.5px}
  .exercise{padding:.7rem .8rem;border-radius:9px}
  .ex-num{width:24px;height:24px;font-size:11px}
  .ex-q{font-size:12px}
  .ex-q code{font-size:10.5px}
  .editor-bar{padding:.28rem .55rem;font-size:10.5px}
  .editor-bar button{font-size:10.5px;padding:2px 7px;min-height:28px}
  .CodeMirror{font-size:11.5px;min-height:68px}
  .btn{padding:.5rem .75rem;font-size:11.5px;min-height:38px}
  .btn-run{flex:1 1 100%;min-width:auto}
  .output-box{font-size:11.5px;padding:.5rem .65rem}
  .df-table{font-size:10.5px}
  .df-table th,.df-table td{padding:.25rem .45rem}
  .nav-btn{padding:.55rem .55rem;font-size:11px}
}
@media(max-width:360px){
  .lesson-head .title{font-size:1rem}
  .theory{font-size:11.5px;padding:.65rem .7rem}
  .CodeMirror{font-size:11px}
}


/* === Solution panel (slides down below editor) === */
.solution-panel{
  border:1px solid rgba(255,222,87,.25);
  border-radius:8px;
  margin-top:.6rem;
  overflow:hidden;
  background:rgba(255,222,87,.04);
  display:none;
}
.solution-panel.show{display:block;animation:slideDown .25s ease-out}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.solution-header{
  background:rgba(255,222,87,.08);
  padding:.55rem .85rem;
  display:flex;align-items:center;gap:.5rem;
  font-size:12.5px;font-weight:700;
  color:var(--py-yellow);
  border-bottom:1px solid rgba(255,222,87,.15);
}
.solution-header .ico{font-size:.95rem}
.solution-header .label{flex:1}
.solution-header .copy-btn{
  background:var(--bg3);border:1px solid var(--border2);
  color:var(--text2);font-size:10.5px;font-weight:700;
  padding:3px 9px;border-radius:5px;cursor:pointer;
  font-family:inherit;transition:all .12s;min-height:26px;
}
.solution-header .copy-btn:hover{color:var(--py-yellow);border-color:var(--py-yellow)}
.solution-header .copy-btn.copied{color:var(--green);border-color:var(--green)}
.solution-code{
  background:var(--code-bg);
  color:var(--code-text);
  padding:.7rem .85rem;
  font-family:"SF Mono",Menlo,Consolas,monospace;
  font-size:12px;
  white-space:pre-wrap;
  direction:ltr;text-align:left;
  line-height:1.6;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
.solution-note{
  padding:.45rem .85rem;
  font-size:11px;color:var(--text3);
  background:var(--bg);border-top:1px solid var(--border);
}
@media(max-width:480px){
  .solution-header{padding:.5rem .7rem;font-size:12px}
  .solution-code{font-size:11.5px;padding:.6rem .7rem}
  .solution-note{font-size:10.5px;padding:.4rem .7rem}
}
@media(max-width:400px){
  .solution-header{padding:.45rem .65rem;font-size:11.5px}
  .solution-header .copy-btn{font-size:10px;padding:2px 7px}
  .solution-code{font-size:11px;padding:.55rem .65rem}
}

/* Home button - return to homepage */
.home-btn{
  background:linear-gradient(135deg,var(--cyan),var(--green));
  color:#000;font-size:14px;font-weight:800;
  padding:5px 11px;border-radius:7px;
  transition:all .15s;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;
  min-width:36px;min-height:32px;
  white-space:nowrap;
}
.home-btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,229,255,.3)}
@media(max-width:400px){
  .home-btn{font-size:13px;padding:4px 9px;min-width:32px;min-height:30px}
}

/* === MOBILE OVERFLOW SAFETY === */
@media(max-width:480px){
  /* Force all content to wrap, never overflow */
  *{max-width:100%}
  pre, code, table{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
}
</style>

/* GAMIFICATION CSS */
/* ============================================================
   GAMIFICATION CSS — Mobile-first, RTL+LTR support
   ============================================================ */

/* ---- HUD (top fixed corner) ---- */
#gam-hud {
  position: fixed;
  bottom: 12px;
  z-index: 9998;
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: 6px;
}
[dir="ltr"] #gam-hud { right: 12px; }
[dir="ltr"] #gam-hud { left: 12px; }

#gam-hud-btn {
  pointer-events: auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  background: linear-gradient(135deg, #1a1f3a 0%, #2d3561 100%);
  border: 1.5px solid #4a5494;
  border-radius: 22px;
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  transition: transform .15s ease, box-shadow .15s ease;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  line-height: 1;
}
#gam-hud-btn:hover, #gam-hud-btn:active {
  transform: scale(1.05);
  box-shadow: 0 6px 18px rgba(74,84,148,0.5);
}
#gam-hud-btn .gam-streak,
#gam-hud-btn .gam-xp {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  white-space: nowrap;
}
#gam-hud-btn .gam-streak { color: #ffb84a; }
#gam-hud-btn .gam-xp     { color: #ffd700; }

/* ---- XP gain toast ---- */
.gam-toast {
  position: fixed;
  bottom: 90px;
  z-index: 9999;
  background: linear-gradient(135deg, #00c896 0%, #00a884 100%);
  color: #fff;
  padding: 12px 18px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 8px 24px rgba(0,200,150,0.4);
  opacity: 0;
  transform: translateY(15px);
  transition: opacity .35s ease, transform .35s ease;
  max-width: calc(100% - 30px);
  pointer-events: none;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
[dir="ltr"] .gam-toast { right: 15px; }
[dir="ltr"] .gam-toast { left: 15px; }
.gam-toast.show { opacity: 1; transform: translateY(0); }
.gam-toast-icon { font-size: 18px; margin-inline-end: 4px; }
.gam-toast-xp { background: linear-gradient(135deg, #ffaa00 0%, #ff8800 100%); box-shadow: 0 8px 24px rgba(255,170,0,0.45); }
.gam-toast small { opacity: 0.92; font-weight: 400; }

/* ---- Celebration modal (level up / badge unlock) ---- */
.gam-celebration {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity .35s ease;
  padding: 20px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  backdrop-filter: blur(4px);
}
.gam-celebration.show { opacity: 1; }
.gam-celebration-inner {
  background: linear-gradient(135deg, #1f2444 0%, #353a6b 100%);
  border: 2px solid #ffd700;
  border-radius: 22px;
  padding: 28px 26px;
  text-align: center;
  max-width: 340px;
  width: 100%;
  color: #fff;
  transform: scale(0.85);
  transition: transform .4s cubic-bezier(.34,1.56,.64,1);
  box-shadow: 0 20px 60px rgba(255,215,0,0.3);
}
.gam-celebration.show .gam-celebration-inner { transform: scale(1); }
.gam-celebration-icon {

<script>
// ===== INLINED pandas-data.js =====
// ============================================================
// PANDAS COURSE - mini-pandas based, 10 modules, 150 exercises
// Hebrew RTL · works in Skulpt
// ============================================================

const PANDAS_COURSE = {
  modules: [
    {
      num: 1,
      id: "m1",
      icon: "📦",
      title: "Introduction to DataFrame",
      desc: "What a DataFrame is, how to load data, and a first look",
      topics: [
        {
          id: "pd-create-df",
          icon: "🎯",
          title: "Creating a DataFrame",
          theory: `<h3>What is a DataFrame?</h3><p><b>DataFrame</b> is a table: rows, and named columns. Like a table in SQL or a sheet in Excel.</p><p><b>Way A - a dictionary of columns</b> (the most common):</p><pre>df = DataFrame({"name": ["Gal", "Tomer"], "age": [30, 25]})</pre><p>Each key in the dictionary is a column name, and each value is the list of data for that column. All the lists must be the same length.</p><p><b>Way B - a list of dictionaries</b>, where each dictionary is a row:</p><pre>df = DataFrame([{"x": 1, "y": 2}, {"x": 3, "y": 4}])</pre><p><b>Three properties worth knowing right away:</b></p><ul><li><code>df.shape</code> - a tuple <code>(number of rows, number of columns)</code></li><li><code>df.columns</code> - the column names</li><li><code>df.index</code> - the row labels (by default 0, 1, 2, ...)</li></ul><h4>What's different from real pandas?</h4><p>The environment here is <b>mini-pandas</b>: a reduced implementation of pandas that runs in the browser. It uses the same method names and the same syntax, but it <b>isn't</b> pandas itself, and there are differences worth knowing.</p><ul><li>In real work you'll first write <code>import pandas as pd</code> and then <code>pd.DataFrame({...})</code>. Here <code>DataFrame</code> is available directly, with no import.</li><li>There's no numpy here, no real <code>dtype</code> and no <code>NaN</code> - a missing value is represented by <code>None</code>.</li><li>Some outputs look different: a single column is printed here as a Python list, whereas pandas prints a Series in a column with an index and dtype.</li></ul><p>Every topic in the course will have a "What's different from real pandas?" section that explicitly marks where the syntax or the result differ, so that what you learn will also work outside the simulator.</p>`,
          exercises: [
            {
              q: "Create a <code>DataFrame</code> with 2 columns: <code>name</code> with \"Gal\" and \"Tomer\", and <code>age</code> with 30 and 25. Print it.",
          explain: "<p>The dictionary you passed to <code>DataFrame</code> maps <b>column name to its list of values</b>: the key <code>\"name\"</code> became the first column and the key <code>\"age\"</code> the second. Both lists have length 2, so two rows were created - Gal in row 0 and Tomer in row 1.</p><p>If one list had a different length, the construction would fail: <b>all columns must be the same length</b>, because every position in the list is a row.</p><p><b>Compared to real pandas:</b> the exact same line would be written there as <code>pd.DataFrame({\"name\": [...], \"age\": [...]})</code> after <code>import pandas as pd</code>. The only difference is in the display - pandas prints an aligned table with an index column, and here the output is formatted by the simulator.</p>",
              starter: "",
              solution: "df = DataFrame({\"name\": [\"Gal\", \"Tomer\"], \"age\": [30, 25]})\nprint(df)",
              check: (o,c)=>{const s=c.replace(/#[^\n]*/g,'');const R=(o.match(/__DATAROW__/g)||[]).length;const T=o.trim();return /__DATAFRAME__\|name\|age/.test(o)&&/__DATAROW__\|Gal\|30/.test(o)&&/__DATAROW__\|Tomer\|25/.test(o)&&R===2&&/DataFrame\s*\(/.test(s)&&/print\s*\(/.test(s);}
            },
            {
              q: "Create a DataFrame of 3 cities: columns <code>city</code> and <code>population</code>. Tel Aviv 460000, Jerusalem 920000, Haifa 280000. Print it.",
          explain: "<p>Note that <b>the order is preserved</b>: the cities appear in the table in exactly the order you wrote them in the list, and each value in <code>population</code> is matched to the city at the same position. That is all the \"pairing\" going on here - matching by position in the list.</p><p>This is also the source of a common mistake: if you change the order of just one list, the data gets mixed up silently, with no error at all. When entering data manually, row by row (a list of dicts) is safer than column by column.</p>",
              starter: "",
              solution: "df = DataFrame({\"city\": [\"Tel Aviv\", \"Jerusalem\", \"Haifa\"], \"population\": [460000, 920000, 280000]})\nprint(df)",
              check: (o,c)=>{const s=c.replace(/#[^\n]*/g,'');const R=(o.match(/__DATAROW__/g)||[]).length;const T=o.trim();return /__DATAFRAME__\|city\|population/.test(o)&&R===3&&/__DATAROW__\|Tel Aviv\|460000/.test(o)&&/__DATAROW__\|Jerusalem\|920000/.test(o)&&/__DATAROW__\|Haifa\|280000/.test(o)&&/DataFrame\s*\(/.test(s)&&/print\s*\(/.test(s);}
            },
            {
              q: "Create a DataFrame with 3 columns (<code>a</code>, <code>b</code>, <code>c</code>) of 4 values each, and print the <code>shape</code>.",
          explain: "<p><code>shape</code> always returns a tuple in the order <b>(rows, columns)</b> - rows first. Here you got <code>(4, 3)</code>: 4 values in each list became 4 rows, and 3 keys in the dictionary became 3 columns.</p><p>This reversal is a classic source of error. If you expected <code>(3, 4)</code>, remember the rule: <code>shape[0]</code> is how many <b>records</b> you have, <code>shape[1]</code> is how many <b>fields</b> each record has.</p><p><code>shape</code> is a property, not a method - <code>df.shape</code> without parentheses. <code>df.shape()</code> will give an error, both here and in pandas.</p>",
              starter: "",
              solution: "df = DataFrame({\"a\": [1, 2, 3, 4], \"b\": [5, 6, 7, 8], \"c\": [9, 10, 11, 12]})\nprint(df.shape)",
              check: (o,c)=>{const s=c.replace(/#[^\n]*/g,'');const R=(o.match(/__DATAROW__/g)||[]).length;const T=o.trim();return T==='(4, 3)'&&/DataFrame\s*\(/.test(s)&&/\.shape/.test(s)&&/print\s*\(/.test(s);}
            },
            {
              q: "Create a DataFrame from a <b>list of dictionaries</b>: <code>[{\"x\":1,\"y\":2}, {\"x\":3,\"y\":4}]</code>. Print <code>columns</code>.",
          explain: "<p>This is the second form of construction: <b>a list of dictionaries, each dictionary a row</b>. This time the keys are not names of whole columns but field names within a row, and <code>DataFrame</code> collects them into a set of columns.</p><p>When do you use each form? A dictionary-of-lists suits data that is already organized by columns; a list-of-dictionaries suits data that arrives record-by-record - for example, a JSON response from an API or rows from a database. Both forms are also valid in real pandas.</p><p><code>df.columns</code> returns a plain Python list here. In real pandas it returns an <code>Index</code> object, which prints as <code>Index(['x', 'y'], dtype='object')</code> - but behaves very similarly: you can loop over it, check membership with <code>in</code>, and access by position.</p>",
              starter: "",
              solution: "df = DataFrame([{\"x\": 1, \"y\": 2}, {\"x\": 3, \"y\": 4}])\nprint(df.columns)",
              check: (o,c)=>{const s=c.replace(/#[^\n]*/g,'');const R=(o.match(/__DATAROW__/g)||[]).length;const T=o.trim();return /^\[\s*'x'\s*,\s*'y'\s*\]$/.test(T)&&/DataFrame\s*\(\s*\[/.test(s)&&/\.columns/.test(s)&&/print\s*\(/.test(s);}
            },
            {
              q: "Create a completely empty DataFrame (from an empty dictionary) and print <code>shape</code>.",
          explain: "<p><code>(0, 0)</code> - zero rows and zero columns. An empty table is a perfectly valid object, not an error, and this matters a lot in practice: <b>a filter that finds no rows returns an empty table, not a crash</b>. So after every filter it's worth checking <code>if df.shape[0] == 0:</code> before continuing to compute averages.</p><p>Note the difference: <code>DataFrame({})</code> gives <code>(0, 0)</code>, but <code>DataFrame({\"a\": []})</code> gives <code>(0, 1)</code> - a column exists with no values at all. It's not the same situation.</p>",
              starter: "",
              solution: "df = DataFrame({})\nprint(df.shape)",
              check: (o,c)=>{const s=c.replace(/#[^\n]*/g,'');const R=(o.match(/__DATAROW__/g)||[]).length;const T=o.trim();return T==='(0, 0)'&&/DataFrame\s*\(\s*\{\s*\}\s*\)/.test(s)&&/\.shape/.test(s)&&/print\s*\(/.test(s);}
            },
          ]
        },
        {
          id: "pd-load-data",

          theory: `<h3>Filtering rows - the boolean mask</h3><p>Filtering in pandas works in two steps. First you build a <b>boolean mask</b>: a True/False series the length of the table, one value per row. Then you hand it to the DataFrame, which returns only the rows where it's True.</p><pre>mask = df["age"].gt(25)   # [False, True, True, ...]\ndf[mask]                   # only rows where True</pre><p>Usually this is written in one line:</p><pre>df[df["age"].gt(25)]</pre><p><b>Comparison methods</b> - all standard pandas methods that return a mask:</p><ul><li><code>.gt(v)</code> greater than &nbsp;|&nbsp; <code>.ge(v)</code> greater than or equal</li><li><code>.lt(v)</code> less than &nbsp;|&nbsp; <code>.le(v)</code> less than or equal</li><li><code>.eq(v)</code> equal &nbsp;|&nbsp; <code>.ne(v)</code> not equal</li><li><code>.isin([a, b])</code> is one of the values in the list</li><li><code>.between(a, b)</code> in range, including both endpoints</li></ul><p><b><code>.loc</code></b> does the same thing, and lets you select a column in the same breath:</p><pre>df.loc[df["points"].ge(50)]            # same rows\ndf.loc[df["points"].ge(50), "team"]    # only the team column from these rows</pre><p>There's also <code>df.query("age &gt; 25")</code> - a readable string, convenient for simple conditions.</p><p>Filtering <b>returns a new table</b> and the original <code>df</code> is unchanged. The number of columns is always preserved - filtering only removes rows - so the result's <code>shape</code> is (fewer rows, same number of columns).</p><p><b>Watch the boundary:</b> "above 85" is <code>.gt(85)</code> and does not include 85 itself; "85 and above" is <code>.ge(85)</code>. The difference between these two letters is the difference between a correct report and a wrong one.</p><h4>What's different from real pandas?</h4><p>In real pandas you can also write <code>df[df["age"] &gt; 25]</code> with a plain &gt; sign. <b>Here that won't work:</b> the Python engine running           theory: `<h3>Creating new columns</h3>\n<p>A new column is created with a simple assignment, just like a key in a dictionary:</p>\n<pre>df["total"] = [100, 200, 300]   # a list the length of the number of rows\ndf["constant"] = 0               # a single value - duplicated to every row</pre>\n<p>Three things worth knowing about assignment:</p>\n<ul>\n<li>It changes the DataFrame <b>in place</b>. No need to write <code>df = df[...]</code>.</li>\n<li>If the name already exists - the old column is silently overwritten, with no error.</li>\n<li>If the list length differs from the number of rows you'll get an error: <code>ValueError: Length mismatch</code>.</li>\n</ul>\n<h4>Vectorized calculation between columns</h4>\n<p>This is the heart of pandas: an arithmetic operation on a column acts on <b>all the rows at once</b>, with no loop and no indexing.</p>\n<pre>df["diff"]  = df["goals_for"] - df["goals_against"]   # column minus column\ndf["pct"]   = df["part"] / df["total"] * 100          # chaining operations\ndf["bonus"] = df["salary"] * 0.1                      # column times a number</pre>\n<p>The four operators <code>+</code> <code>-</code> <code>*</code> <code>/</code> work between two columns and between a column and a number, exactly like in real pandas.</p>\n<h4>Rounding the result</h4>\n<p>Division in Python always returns a <code>float</code>, so you'll see values like <code>83.66666666666667</code>. This isn't a bug but the binary representation of fractions. Round with <code>.round(n)</code> on the whole column:</p>\n<pre>df["average"] = ((df["math"] + df["english"]) / 2).round(2)</pre>\n<h4>What is actually different here from real pandas</h4>\n<p>The comparison operators <code>&gt;</code> <code>&lt;</code> <code>==</code> aren't supported on a column in the engine that runs the course (a Skulpt limitation, not a pandas one). Instead, use the methods <code>.gt()</code> <code>.lt()</code> <code>.ge()</code> <code>.le()</code> <code>.eq()</code>, which are real pandas methods in every respect:</p>\n<pre>df["is_win"] = df["goals_for"].gt(df["goals_against"])   # here, and in pandas\n# in pandas you can also: df["goals_for"] > df["goals_against"]</pre>`,

          title: "apply and map",
          theory: `<h3>apply and map - changing values in a column</h3>\n<p><b>apply</b> runs a function on <b>every value</b> in the column individually, and returns a new column:</p>\n<pre>df["doubled"] = df["x"].apply(lambda v: v * 2)\ndf["label"]   = df["price"].apply(lambda v: "expensive" if v &gt; 100 else "cheap")</pre>\n<p>Note: the lambda receives a <b>single value</b>, not the whole column. So <code>lambda v: v * 2</code> is correct, while <code>lambda v: v.sum()</code> will raise an error.</p>\n<p><b>map</b> translates values using a dictionary - the standard tool for converting codes to text and back:</p>\n<pre>df["status"] = df["churn"].map({0: "Active", 1: "Churned"})</pre>\n<h4>The map trap: a value not in the dictionary</h4>\n<ul>\n<li>In the course's version - the original value is kept, and you get a mixed column of text and numbers.</li>\n<li>In real pandas - you get <code>NaN</code>.</li>\n</ul>\n<p>In both cases <b>no error is thrown</b>, so a missing dictionary entry is a silent bug. In practice you check right after the mapping that no values were left untranslated.</p>\n<h4>apply on a column vs apply on a row</h4>\n<pre>df["col"].apply(fn)            # fn receives a single value\ndf.apply(fn, axis=1)           # fn receives a whole row\ndf["total"] = df.apply(lambda row: row["a"] + row["b"], axis=1)</pre>\n<h4>When not to use apply</h4>\n<p><code>apply</code> is convenient but slow - it runs a Python loop behind the scenes. When you can write the same thing vectorized, that's preferred:</p>\n<pre>df["x"] * 2                        # fast\ndf["x"].apply(lambda v: v * 2)     # same result, much slower</pre>\n<p>Save <code>apply</code> for logic that can't be expressed with operators - complex conditions, text processing, external functions.</p>`,

          explain: "<p><code>apply</code> runs the function on each value in the column separately. The <code>v</code> in the lambda is a single score - not the whole column - so <code>v * 2</code> is correct while <code>v.sum()</code> would throw an error.</p><p>Notice that the original <code>math</code> column hasn't changed. <code>apply</code> always <b>returns</b> a new column and doesn't modify in place; assigning it to a new name is what creates the second column.</p><p>And honestly: in this case we wouldn't use apply at all. Multiplying by a constant is <code>df[\"math\"] * 2</code> - shorter and an order of magnitude faster, and it works both here and in real pandas. <code>apply</code> is reserved for cases where the logic is too complex to express with operators, like in the next exercise.</p>",

          explain: "<p>Here the lambda contains a conditional expression: <code>\"expensive\" if v &gt; 4 else \"cheap\"</code>. This is Python's one-line if form, and it's required inside a lambda because you can't write a regular multi-line <code>if</code> there.</p><p>Notice that the comparison <code>v &gt; 4</code> works here without a problem, because <code>v</code> is a <b>plain number</b>, not a column. The restriction on comparison operators only applies when comparing an entire column - there you need <code>.gt()</code>.</p><p><b>The boundary question:</b> the condition is <code>&gt; 4</code>, not <code>&gt;= 4</code>, so an apartment priced at exactly 4 million would be classified as cheap. There's no such apartment in this data, so the error won't surface - which is exactly why, in real work, you explicitly ask whether the boundary is included, and document the decision.</p><p>For three categories you nest conditions: <code>lambda v: \"expensive\" if v &gt; 5 else (\"medium\" if v &gt; 3 else \"cheap\")</code>. In real pandas you'd use <code>pd.cut</code> for tiers and <code>np.where</code> for a single threshold.</p>",

          explain: "<p>Unit conversion is a classic use of apply. Two professional notes that go beyond the code itself.</p><p><b>The column name.</b> We called it <code>temp_kelvin</code>, not <code>celsius_to_kelvin</code>. A column name should answer the question \"what is this value\", not \"how was it computed\". Names that describe an operation confuse anyone reading the table a month later.</p><p><b>The precision of the constant.</b> Absolute zero is 273.15 degrees, not 273. In the course we rounded for simplicity, but when working with real measurement data, a constant deviation like this accumulates and distorts comparisons.</p><p>After every column calculation it is worth doing a sanity check: a temperature in Kelvin cannot be negative. A check like this immediately catches a sign flip or a unit mix-up.</p><p>And here too - in real pandas, and in this course, <code>df[\"temp\"] + 273</code> is enough, with no apply at all.</p>",

          explain: "<p>The operation itself is simple, but it's important to understand what it says. Encoding Sales=1, R&amp;D=2, Marketing=3 introduces into the data <b>an order relationship that doesn't exist in reality</b>. There's no sense in which Marketing is three times greater than Sales, and yet any model or average that receives this column will treat it as a numeric scale.</p><p>The technique is called label encoding, and it's suitable only for categories that have a real order - for example basic less than standard less than premium. For an unordered category, one-hot encoding is used, which creates a separate zero/one column for each value (in pandas: <code>pd.get_dummies</code>).</p><p>We printed the two columns side by side on purpose: this way you can see that the mapping is indeed correct. Printing the codes column alone doesn't let you verify anything.</p><p>Another trap: if a new department is added that isn't in the dictionary, it won't throw an error - it will remain a string here, and become <code>NaN</code> in real pandas.</p>",

          theory: `<h3>A Series is a column</h3>\n<p>Every column selection - <code>df["salary"]</code> - returns a <b>Series</b> object. Every Series has summary methods:</p>\n<ul>\n<li><code>.mean()</code> <code>.sum()</code> <code>.max()</code> <code>.min()</code> <code>.count()</code></li>\n<li><code>.median()</code> - median, <code>.std()</code> - standard deviation, <code>.quantile(q)</code> - percentile</li>\n<li><code>.unique()</code> - the list of unique values, <code>.nunique()</code> - <b>their count</b></li>\n<li><code>.value_counts()</code> - how many times each value appeared, from most common to rarest</li>\n<li><code>.idxmax()</code> / <code>.idxmin()</code> - the <b>label</b> of the extreme value</li>\n<li><code>.round(n)</code> <code>.sort_values()</code> <code>.nlargest(n)</code> <code>.apply(fn)</code> <code>.map(d)</code></li>\n</ul>\n<h4>The average alone doesn't tell the story</h4>\n<p>An average is very sensitive to outliers; a median is not. When the two are far apart - there are outliers or an asymmetric distribution, and that's always a question worth asking before reporting a single number.</p>\n<pre>print(df["salary"].mean())     # 18500.0\nprint(df["salary"].median())   # 17500.0</pre>\n<h4>From number to row: idxmax</h4>\n<p>\"What is the highest price\" is a weak question. \"Which neighborhood holds it\" is the real question:</p>\n<pre>print(df["price_m"].max())                   # 6.8\nprint(df.loc[df["price_m"].idxmax()])        # the whole row</pre>\n<h4>Two points to note</h4>\n<ul>\n<li>All summary operations <b>silently skip</b> missing values. Always compare <code>df["col"].count()</code> to the total number of rows, otherwise an average that looks fine might be based on half the data.</li>\n<li>Comparisons on a column are done with methods - <code>.gt() .lt() .ge() .le() .eq() .ne()</code> - not operators. These methods also exist in real pandas and work exactly the same there, but in code you'll encounter at work you'll mostly see the short form <code>df[df["math"] &gt; 80]</code>, which isn't supported by the course's engine.</li>\n</ul>`,

          theory: `<h3>GroupBy - the core of pandas</h3>\n<p><code>groupby</code> is the <code>GROUP BY</code> of SQL: you split the rows into groups by a column value, and calculate a summary for each group separately.</p>\n<pre>df.groupby("department").mean()   # average of every numeric column, per department\ndf.groupby("plan").sum()          # sum\ndf.groupby("city").max()          # maximum</pre>\n<p>Available operations: <code>.mean() .sum() .min() .max() .median() .std() .count() .size() .nunique()</code></p>\n<h4>Two ways to select a column</h4>\n<pre>df.groupby("department").mean()[["department", "salary"]]   # group, then select\ndf.groupby("department")["salary"].mean()                    # select, then group</pre>\n<p>The second is more efficient and more common in practice - it computes only what you asked for.</p>\n<h4>agg - several calculations at once</h4>\n<pre>df.groupby("department").agg({"salary": "mean", "years": "max"})</pre>\n<h4>count vs size - a difference that trips people up</h4>\n<ul>\n<li><code>.size()</code> - how many <b>rows</b> are in each group. One number per group.</li>\n<li><code>.count()</code> - how many <b>non-missing</b> values there are in each column, in each group. Column by column.</li>\n</ul>\n<p>When there are no missing values, both give the same numbers, so the difference only shows up in real data - exactly when it already costs money. To count rows, use <code>size</code>.</p>\n<h4>Two deviations from real pandas worth knowing</h4>\n<ul>\n<li>Here the grouping column stays a <b>regular column</b> in the result. In real pandas it becomes the <b>index</b>, and you return it to a column with <code>.reset_index()</code>.</li>\n<li>Here the groups are returned in the order they <b>appear</b> in the data. In real pandas they are sorted by key by default (<code>sort=True</code>).</li>\n</ul>`,

        {
          id: "pd-groupby-deep",
          icon: "🔬",
          title: "Advanced GroupBy",
          theory: `<h3>Business questions with GroupBy</h3>\n<p>After grouping, the real work begins: choosing the <b>right</b> aggregation, and sorting the result so the answer jumps out.</p>\n<pre>result = df.groupby("department").mean()\ntop = result.sort_values("salary", ascending=False)</pre>\n<h4>Sum or rate? The most important question on this topic</h4>\n<p>Say you want to know which plan "churns" the most. There are two ways to calculate it, and they give <b>opposite</b> answers:</p>\n<pre>df.groupby("plan").sum()    # churn: basic=3, premium=4  -> "premium is worse"\ndf.groupby("plan").mean()   # churn: basic=0.75, premium=0.57 -> "basic is worse"</pre>\n<p>Who's right? <b>The average.</b> The <code>churn</code> column is 0/1, so its sum counts <b>how many</b> customers churned, and the average measures <b>what fraction</b> of the group churned. Premium has 7 customers and basic only 4, so it's obvious there will be more churners there in absolute number - that measures group size, not the problem.</p>\n<p>The rule: <b>a sum is affected by group size, a rate isn't.</b> When comparing groups of different sizes, you almost always want a rate. And when a column is 0/1, <code>mean()</code> on it is exactly the percentage of 1s.</p>\n<h4>Grouping by something that isn't a column</h4>\n<p>You can create a flag column and group by it - this turns a continuous variable into two groups to compare:</p>\n<pre>df["passed"] = df["math"].gt(80)\ndf.groupby("passed").size()</pre>\n<h4>Always show the group size</h4>\n<p>The average of a two-person group isn't evidence of anything. Show <code>size()</code> next to every group average — that's the habit that separates a trustworthy report from a misleading one.</p>`,
          exercises: [

              q: "Load <code>telecom-churn</code>. <b>Which plan loses the largest share of its customers?</b> Note: summing the <code>churn</code> column counts churned customers and is therefore affected by the plan's size. Instead, compute the churn <b>rate</b> - the average <code>churn</code> per <code>plan</code> - and also print the <code>size()</code> of each plan to see why the sum is misleading.",
          explain: "<p>The correct answer is <b>basic</b>: it loses 75% of its customers, compared to 57% in premium and 0% in standard.</p><p>Notice how easy it would have been to get this wrong. If we'd computed <code>groupby(\"plan\").sum()</code> we'd have gotten 3 churners in basic and 4 in premium, and concluded that premium is the problematic one - <b>the complete opposite of the truth</b>. The reason is simple: premium has 7 customers and basic only 4, so in absolute numbers the larger group will almost always have more churners.</p><p>This is the rule worth remembering from this whole topic: <b>a sum is affected by group size, a rate isn't.</b> When a column contains 0 and 1, <code>mean()</code> on it is exactly the rate of 1s - that is, the churn percentage.</p><p>That's why we also printed <code>size()</code>. A rate without group size is still incomplete: 0% churn in standard is impressive, but it's based on only 4 customers. In a real report you always show both side by side.</p>",
              starter: "",
              solution: "df = data.load(\"telecom-churn\")\nrate = df.groupby(\"plan\").mean()\nprint(rate[[\"plan\", \"churn\"]])\nprint(df.groupby(\"plan\").size())",

          explain: "<p>Chaining is the central ability of pandas: <code>groupby</code> returns a GroupBy, <code>mean()</code> returns a DataFrame, and <code>sort_values</code> takes it and sorts it. Each step takes the previous one's output, and this builds a processing pipeline in a single line.</p><p><code>ascending=False</code> is what makes the sort descending. Forgot it? You'll get the weakest department at the top of the list - a silent mistake that's very easy to miss when you only read the table's first row.</p><p>The result: R&amp;D 24,500, Sales 17,000, Marketing 13,000. After sorting, the answer jumps out without reading the whole table, and that's exactly the goal - a sorted table is a table that answers a question.</p><p>In real pandas, since <code>groupby</code> returns the key as the index, you'd write <code>.sort_values(\"salary\", ascending=False)</code> exactly the same way - or <code>.sort_index()</code> to sort by department name.</p>",

          explain: "<p>You can group by any column - including one you've created yourself. <code>df[\"math\"].gt(80)</code> returns a boolean column, and grouping by it splits the class into two groups: 7 above 80 and 3 below.</p><p>This is the binning technique: turning a continuous variable (a score) into a category (pass/fail) to enable comparison. The cost is information - scores of 81 and 95 now look identical - and the gain is clarity.</p><p><b>The comparison itself is interesting:</b> those who excel in math average 84.57 in English, and those who don't - 75. There's a link between the subjects, and that's a hypothesis worth testing. Notice that grouping always surfaces links like this - that's its whole purpose.</p><p>We printed <code>size()</code> first on purpose: 84.57 is based on 7 students and 75 on only 3. The gap looks big, but with 3 observations it could stem from a single student. <b>An average without a group size isn't evidence.</b></p><p>Notice that <code>.gt(80)</code> doesn't include 80 itself. In real pandas you'd write <code>df[\"math\"] &gt; 80</code>, but <code>.gt()</code> is valid there too.</p>",

            {
              q: "Load <code>telecom-churn</code>. Group by <code>plan</code> and calculate the <b>minimum</b> tenure (<code>tenure_months</code>) in each plan. Print <code>plan</code> and <code>tenure_months</code>.",
          explain: "<p><code>min()</code> returns the lowest value in each group: the least-tenured customer on basic has been there 6 months, on standard 18, and on premium 36.</p><p>These numbers tell a story: <b>there is not a single new premium customer.</b> The minimum tenure there is 3 years, while basic has customers as young as half a year. This alone explains a large part of the churn gap we saw in the first exercise - newer customers churn more, and basic is full of new customers.</p><p>And this is an important methodological point: the gap we found between the plans is not necessarily \"the basic plan is bad\". It could simply be that it contains younger customers, and the two variables are confounded with each other. Minimum and maximum are the fastest way to spot this kind of imbalance between groups, before drawing any causal conclusions.</p><p>Code identical to real pandas (except for the position of the key column).</p>",

        {
          id: "pd-pivot-like",
          icon: "🔀",
          title: "pivot-like analyses",
          theory: `<h3>pivot_table - slicing by two dimensions</h3>\n<p><code>groupby</code> splits by one dimension. <code>pivot_table</code> splits by <b>two</b> and arranges the result as a cross table - rows, columns, and a summarized value in every cell:</p>\n<pre>df.pivot_table(index="plan",           # what will be in the rows\n               columns="churn",        # what will be in the columns\n               values="monthly_bill",  # which number to aggregate\n               aggfunc="mean")         # how to aggregate</pre>\n<p>The four parameters are all you need to remember. <code>aggfunc</code> can be <code>"mean"</code>, <code>"sum"</code>, <code>"count"</code>, <code>"min"</code>, <code>"max"</code> - and it completely changes the meaning of the table, even when the rows and columns are identical.</p>\n<h4>Empty cells - the most interesting part</h4>\n<p>If a particular combination has no rows in the data, the cell will be <code>None</code> (in real pandas: <code>NaN</code>). This isn’t a bug, it’s a <b>finding</b>: it says this combination doesn’t exist in reality. In the plan-vs-churn table, the empty cell for standard reveals that no standard customer churned.</p>\n<h4>Cut it differently: filter, then group</h4>\n<p>Not every two-dimensional question requires a pivot. When only part of the data matters, filter first:</p>\n<pre>active = df[df["churn"].eq(0)]\nactive.groupby("plan").mean()</pre>\n<p>Filtering is done with a boolean mask: <code>df["churn"].eq(0)</code> returns a column of True/False, and <code>df[mask]</code> returns only the rows where it's True. The methods <code>.eq() .gt() .lt() .ge() .le()</code> also exist in real pandas; there it's common to write <code>df[df["churn"] == 0]</code>, which isn't supported in the course's engine.</p>\n<h4>Creating a dimension that doesn't exist</h4>\n<p>If there's no second categorical column - build one:</p>\n<pre>df["big"] = df["sqm"].gt(90)\ndf.pivot_table(index="rooms", columns="big", values="price_m", aggfunc="mean")</pre>\n<p>Note: the more dimensions you add, the fewer rows each cell is based on. A nice-looking cross-tab where every cell is based on a single observation is proof of nothing - run <code>aggfunc="count"</code> on the same table to see how many rows stand behind each number.</p>`,

          explain: "<p>Two steps: filter and then group. <code>df[\"churn\"].eq(0)</code> produces a column of True/False, and <code>df[mask]</code> keeps only the rows where it's True. The result is a new DataFrame - the original data isn't affected.</p><p><b>Why filter at all?</b> Because the overall average mixes two different populations. Among the premium customers who stayed, the average bill is 111.67, versus 120.71 for the whole group - meaning it's specifically the higher-bill customers who churned. An insight like this disappears completely when you look at a single average.</p><p>Note the order: <b>always filter before grouping.</b> Had we grouped first, we'd no longer have individual rows to filter.</p><p>As for syntax: <code>.eq(0)</code> is a real pandas method and will also work there. In code you'll encounter on the job you'll mostly see the form <code>df[df[\"churn\"] == 0]</code>, which isn't supported by the course engine.</p>",

      topics: [
        {
          id: "pd-missing",
          icon: "❓",
          title: "Missing values (None / NaN)",
          theory: `<h3>Handling Missing Values</h3><p>A missing value is a cell with no data. In our simulator it's always represented as <code>None</code>.</p><ul><li><code>df.isna()</code> - a table of True/False: True in every missing cell</li><li><code>df.fillna(0)</code> - replaces every missing value with the value you gave</li><li><code>df.dropna()</code> - removes every row that has at least one missing value</li></ul><p>All three return a <b>new</b> table. The original table doesn't change, so you must save the result: <code>clean = df.dropna()</code>.</p><h4>Counting missing values</h4><pre>df["age"].isna().sum()   # how many are missing in one column\ndf.isna().sum()          # how many are missing in each column</pre><p>This works because <code>True</code> equals 1 and <code>False</code> equals 0, so summing the missing-value mask is exactly counting them. These two lines are the standard idiom in practice, and they're identical in real pandas.</p><h4>Filling with a different value per column</h4><pre>df.fillna({"age": df["age"].mean(), "city": "unknown"})</pre><p>A dictionary passed to <code>fillna</code> sets a separate fill value for each column. This is how it's done in practice, since a number and text aren't filled with the same value. A column not mentioned in the dictionary stays as it is.</p><h4>Removing rows by key columns only</h4><pre>df.dropna(subset=["a"])   # removes only rows where a is missing</pre><p><code>dropna()</code> with no parameters is ruthless: it drops an entire row because of a single cell. <code>subset</code> narrows the check to the columns that actually matter to you.</p><h4>Important warning for real pandas: None vs. NaN</h4><p>In real pandas, a missing value in a numeric column isn't <code>None</code> but <code>NaN</code> (Not a Number), and it's of type <code>float</code>. This has two consequences you'll meet on day one at work:</p><ul><li>An integer column with even one missing value automatically becomes <code>float64</code>: <code>[1, None, 3]</code> is stored as <code>[1.0, NaN, 3.0]</code>, and IDs are displayed as 1001.0 instead of 1001.</li><li><b>NaN is not equal to itself.</b> <code>NaN == NaN</code> is <code>False</code>. So <code>df[df["x"] == None]</code> will never find a missing value - it will return an empty table with no error at all. This is exactly why <code>isna()</code> exists.</li></ul><p>In the simulator, <code>float('nan')</code> is not recognized as a missing value by these methods. Always use <code>None</code>.</p>`,
          exercises: [
            {
              q: "Create a DataFrame with <code>x</code> = [1, None, 3, None, 5]. Print the column before, replace missing values with 0 using <code>fillna(0)</code> and print after. Finally print the average before and after, and check whether it changed.",
          explain: "<p><code>fillna</code> replaces every missing value with the value you gave and returns a <b>new</b> table. The original keeps its None, so you have to save the result: <code>result = df.fillna(0)</code>.</p><p>Now look at the two averages. Before filling, the average was 3.0, because <code>mean</code> skips missing values and computed (1+3+5)/3. After filling it's 1.8, because now there are five real values and two of them are zeros. <b>Filling with 0 isn't neutral</b> - it changes every statistic you compute afterward.</p><p>0 is appropriate when the meaning of the missingness is \"didn't happen\", for example a number of purchases. When the meaning is \"wasn't measured\" - it's better to fill with the mean or leave it missing.</p><p>In real pandas the same line works exactly the same way, but the result would be <code>[1.0, 0.0, 3.0, 0.0, 5.0]</code>: a missing value there is NaN, which is a float, so its mere presence turns the whole column into float64.</p>",
              starter: "",
              solution: "df = DataFrame({\"x\": [1, None, 3, None, 5]})\nprint(\"Before:\", df[\"x\"])\nresult = df.fillna(0)\nprint(\"After:\", result[\"x\"])\nprint(\"Mean before:\", df[\"x\"].mean())\nprint(\"Mean after:\", result[\"x\"].mean())",
              check: (o,c) => { const s=String(c).replace(/#.*$/gm,""); return /\[1,\s*None,\s*3,\s*None,\s*5\]/.test(o) && /\[1,\s*0,\s*3,\s*0,\s*5\]/.test(o) && /:\s*3\.0\s*$/m.test(o) && /:\s*1\.8\s*$/m.test(o) && /\.fillna\s*\(\s*0\s*\)/.test(s) && /\.mean\s*\(\s*\)/.test(s); }
            },
            {
              q: "Create a DataFrame with <code>a</code> = [1, None, 3] and <code>b</code> = [10, 20, None]. Print how many rows there are, how many remain after <code>dropna()</code>, and how many remain after <code>dropna(subset=[\"a\"])</code>. Finally print the result of <code>dropna()</code>.",
          explain: "<p>Three rows went in and one came out. <code>dropna()</code> removes every row that has <b>at least</b> one missing value - the second row was dropped because of a=None and took the valid b=20 with it, and the third was dropped because of b=None and took a=3 with it.</p><p>This is the cost of <code>dropna()</code>: you throw away an entire row because of one cell. In a wide table with twenty columns this can delete most of your data.</p><p>That is why <code>subset</code> exists: <code>df.dropna(subset=[\"a\"])</code> checks only a and ignores missing values in the other columns - and here two rows remain instead of one. This way you keep useful rows instead of deleting everything.</p><p>The habit: compare <code>len(df)</code> before and after. If the difference is large, filling (<code>fillna</code>) is preferable to dropping. The syntax here, including <code>subset</code>, is identical in real pandas.</p>",
              starter: "",
              solution: "df = DataFrame({\"a\": [1, None, 3], \"b\": [10, 20, None]})\nprint(\"Rows before:\", len(df))\nprint(\"After dropna:\", len(df.dropna()))\nprint(\"After dropna on a only:\", len(df.dropna(subset=[\"a\"])))\nprint(df.dropna())",
              check: (o,c) => { const s=String(c).replace(/#.*$/gm,""); return /:\s*3\s*$/m.test(o) && /:\s*1\s*$/m.test(o) && /:\s*2\s*$/m.test(o) && /__DATAROW__\|1\|10/.test(o) && (o.match(/__DATAROW__/g)||[]).length===1 && /\.dropna\s*\(\s*\)/.test(s) && /subset\s*=/.test(s); }
            },
            {
              q: "Create a DataFrame: <code>{x: [10, None, 30, None]}</code>. Compute the column average with <code>mean()</code>, print it, then use it to fill in the missing values and print the column.",
          explain: "<p>Filling with the mean is the most common step in cleaning numeric data, and it's done in two steps: first you calculate, then you fill.</p><p>The point that determines the result: <code>mean()</code> <b>skips</b> missing values and doesn't count them in the denominator. There are two valid values here, so the average is (10+30)/2 = 20.0. If the missing values were counted as zeros we'd get 10 - and that's a very common mistake.</p><p>Note that we wrote <code>mean_val</code> and didn't type 20 ourselves. A hardcoded value would work on this example and break the moment the data changes.</p><p>The cost: filling with the mean preserves the average but <b>artificially reduces the spread</b> - the more cells you fill with the same value, the more uniform the column looks than it really is.</p><p>In real pandas the idiom is identical: <code>df[\"x\"] = df[\"x\"].fillna(df[\"x\"].mean())</code>, and for all numeric columns at once <code>df.fillna(df.mean(numeric_only=True))</code>.</p>",
              starter: "",
              solution: "df = DataFrame({\"x\": [10, None, 30, None]})\nmean_val = df[\"x\"].mean()\nprint(\"Mean excluding missing values:\", mean_val)\nresult = df.fillna(mean_val)\nprint(result[\"x\"])",
              check: (o,c) => { const s=String(c).replace(/#.*$/gm,""); return /:\s*20\.0\s*$/m.test(o) && /\[10,\s*20\.0,\s*30,\s*20\.0\]/.test(o) && /\.fillna\s*\(/.test(s) && /\.mean\s*\(\s*\)/.test(s) && !/fillna\s*\(\s*20/.test(s); }
            },
            {
              q: "Create a DataFrame: <code>{age: [25, None, 30, None, 40], city: [\"TLV\", \"HFA\", None, \"TLV\", \"BSH\"]}</code>. Print the missing-value mask of <code>age</code>, the number of missing values in age, and the number of missing values in every column of the table.",
          explain: "<p><code>isna()</code> returns a <b>mask</b>: one value per row, True if the cell is missing. In Python, True equals 1 and False equals 0, so <code>.sum()</code> on the mask counts exactly the number of gaps.</p><p><code>df.isna().sum()</code> does this for all columns at once, and it's the first line an analyst runs on a new dataset. Notice that it also works on a text column - a gap is a gap, regardless of type.</p><p>Why do you even need <code>isna</code>, and why must you never check <code>df[\"age\"] == None</code>? Because in real pandas a missing value in a numeric column is NaN, and NaN is the one value that isn't equal to itself. A comparison like that would return False for every row and give you 0 gaps - a wrong answer with no error message at all.</p><p>The next step in real work is to translate this into percentages: <code>df.isna().mean() * 100</code>. It's the percentage that determines what you do - a gap of a few percent, you fill in; a gap of tens of percent, you usually drop the column.</p>",
              starter: "",
              solution: "df = DataFrame({\"age\": [25, None, 30, None, 40], \"city\": [\"TLV\", \"HFA\", None, \"TLV\", \"BSH\"]})\nprint(df[\"age\"].isna())\nprint(\"Missing in age:\", df[\"age\"].isna().sum())\nprint(df.isna().sum())",
              check: (o,c) => { const s=String(c).replace(/#.*$/gm,""); return /\[False,\s*True,\s*False,\s*True,\s*False\]/.test(o) && /:\s*2\s*$/m.test(o) && /^age\s+2\s*$/m.test(o) && /^city\s+1\s*$/m.test(o) && /\.isna\s*\(\s*\)/.test(s) && /\.sum\s*\(\s*\)/.test(s); }
            },
            {
              q: "Create a DataFrame: <code>{a: [1,2,None], b: [10,None,30], city: [\"TLV\",None,\"HFA\"]}</code>. Print the result of <code>fillna(-1)</code> on the whole table once, and a second time fill per column: a with 0, b with its average, and city with the string \"Unknown\".",
          explain: "<p>Compare the two tables. In the first we asked for <code>fillna(-1)</code> on the whole table, and the fill value was applied indiscriminately - even to the <code>city</code> column, where it produced the meaningless text \"-1\".</p><p>And even in numeric columns -1 is dangerous: it's a perfectly legal value. No operation that comes after will know it's a \"marker for missing\" - <code>mean</code>, <code>min</code> and <code>sum</code> will treat it as real data. Sentinel values like -1, 0 or 999 are legitimate only when they're agreed upon and documented.</p><p>The second table is how it's actually done in practice: a <b>dictionary</b> for <code>fillna</code>, a matching fill value for each column. Numbers got numbers, text got readable text. Note that here too we calculated the mean rather than typing it in.</p><p>This syntax is identical in real pandas: <code>df.fillna({\"age\": df[\"age\"].mean(), \"city\": \"unknown\"})</code>. A column not mentioned in the dictionary stays unchanged.</p>",
              starter: "",
              solution: "df = DataFrame({\"a\": [1, 2, None], \"b\": [10, None, 30], \"city\": [\"TLV\", None, \"HFA\"]})\nprint(df.fillna(-1))\nprint(df.fillna({\"a\": 0, \"b\": df[\"b\"].mean(), \"city\": \"Unknown\"}))",
              check: (o,c) => { const s=String(c).replace(/#.*$/gm,""); return /__DATAROW__\|2\|-1\|-1/.test(o) && /__DATAROW__\|-1\|30\|HFA/.test(o) && /__DATAROW__\|2\|20\.0\|/.test(o) && /__DATAROW__\|0\|30\|HFA/.test(o) && /\.fillna\s*\(\s*-1\s*\)/.test(s) && /\.fillna\s*\(\s*\{/.test(s) && /\.mean\s*\(\s*\)/.test(s); }
            },
          ]

        {
          id: "pd-rename-drop",
          icon: "✏️",
          title: "rename, drop, drop_duplicates",
          theory: `<h3>Arranging the structure</h3><ul><li><code>df.rename(columns={"old":"new"})</code> - rename a column</li><li><code>df.drop(columns="x")</code> - remove a column</li><li><code>df.drop(columns=["a","b"])</code> - remove several columns</li><li><code>df.drop_duplicates()</code> - remove completely identical rows</li><li><code>df.drop_duplicates(subset=["id"])</code> - remove duplicates by a key column</li></ul><p>All of these return a <b>new</b> table and do not change the original. You must save the result: <code>df = df.drop(columns="x")</code>.</p><h4>Always write <code>columns=</code> in rename</h4><p>This isn't decoration. In real pandas, the form <code>df.rename({"old":"new"})</code> without the word <code>columns</code> refers to the <b>row</b> names, not the columns: it will run with no error and simply change nothing. With <code>columns=</code> the code is correct both here and there.</p><h4>drop_duplicates compares the entire row</h4><p>Two rows are considered duplicates only if <b>all</b> the cells in them are identical. If the same customer has two rows with different amounts, <code>drop_duplicates()</code> won't touch them. That's what <code>subset</code> is for: <code>df.drop_duplicates(subset=["customer_id"])</code> leaves one row per customer, keeping the first occurrence.</p><h4>A difference from pandas worth knowing</h4><p>If you ask to remove a column that doesn't exist, the simulator simply does nothing, whereas pandas will throw a <code>KeyError</code>. Don't rely on the silence - print <code>df.columns</code> or <code>df.shape</code> after every structural change. Also, in pandas there's <code>inplace=True</code> and <code>keep="last"</code>, which aren't supported here.</p>`,
          exercises: [
            {
              q: "Load <code>salaries</code>. Rename the column <code>salary</code> to <code>monthly_pay</code>. Print the column names before, after, and again from the original table.",
          explain: "<p><code>rename</code> takes a dictionary shaped like {\"old name\": \"new name\"} and returns a new table. The third line of the output is the point: <b>the original hasn't changed</b> - <code>df</code> still contains <code>salary</code>. If you don't save the result, you haven't changed anything.</p><p>Always write the word <code>columns=</code>. In real pandas, writing <code>df.rename({\"salary\":\"monthly_pay\"})</code> without this word refers to <b>row</b> names: it will run without any error and simply not change anything. This is one of those silent failures that's hard to spot, and one word prevents it.</p><p>Also note the habit this exercise teaches: after every structural change, print <code>df.columns</code> and verify. If you pass a column name that doesn't exist, you won't get an error - nothing will simply happen.</p>",
              starter: "",
              solution: "df = data.load(\"salaries\")\nprint(\"Before:\", df.columns)\nresult = df.rename(columns={\"salary\": \"monthly_pay\"})\nprint(\"After:\", result.columns)\nprint(\"Original:\", df.columns)",
              check: (o,c) => { const s=String(c).replace(/#.*$/gm,""); return /'monthly_pay'/.test(o) && /'salary'/.test(o) && /'name'/.test(o) && /'department'/.test(o) && /\.rename\s*\(\s*columns\s*=/.test(s); }
            },
            {
              q: "Load <code>football</code>. Delete the columns <code>draws</code> and <code>losses</code>. Print the shape before and after, and the names of the remaining columns.",
          explain: "<p><code>drop(columns=[...])</code> takes a list and removes all the columns in it in a single operation.</p><p>Read both shapes: (5, 7) became (5, 5). <b>The number of rows didn't change</b> - still five groups. Removing columns narrows the table rather than shortening it, and that's different from <code>drop(index=...)</code>, which removes rows.</p><p>Always write <code>columns=</code>. The older form <code>df.drop([\"draws\"], axis=1)</code> is still common in old pandas code, but it's less readable and isn't supported here.</p><p>Pro tip: when you want to keep three columns out of twenty, it's better to select what stays rather than list what's removed - <code>df[[\"team\",\"points\"]]</code>. The code won't break when new columns are added to the source.</p><p>Difference from pandas: a wrong column name would throw a <code>KeyError</code> there, and here simply nothing happens. Printing <code>shape</code> afterward is your protection.</p>",
              starter: "",
              solution: "df = data.load(\"football\")\nprint(\"Before:\", df.shape)\nresult = df.drop(columns=[\"draws\", \"losses\"])\nprint(\"After:\", result.shape)\nprint(result.columns)",
              check: (o,c) => { const s=String(c).replace(/#.*$/gm,""); return /\(5,\s*7\)/.test(o) && /\(5,\s*5\)/.test(o) && /'team'/.test(o) && /'points'/.test(o) && !/draws/.test(o) && !/losses/.test(o) && /\.drop\s*\(\s*columns\s*=/.test(s); }
            },
            {
              q: "Load <code>telecom-churn</code>. Remove the <code>customer_id</code> column (a single column — a string, not a list). Print the shape before and after, and the columns that remain.",
          explain: "<p>When removing a single column you can pass a string instead of a list: <code>drop(columns=\"customer_id\")</code>. Both forms are valid, and the list is only needed when there's more than one column.</p><p>The shape changed from (15, 6) to (15, 5): 15 rows, one less column. That's the fast way to confirm you removed a column and not accidentally rows.</p><p>And why remove a customer id at all? <code>customer_id</code> is unique per row, so it contains no repeating pattern that can be learned from. In analysis it's just noise, and in a predictive model it can lead to memorization. Remove it before the analysis and keep it aside if you need to join the results back to customers.</p><p>The syntax is identical in real pandas. The only difference: if you get the column name wrong, pandas will immediately throw a <code>KeyError</code>, while the simulator will stay silent.</p>",
              starter: "",
              solution: "df = data.load(\"telecom-churn\")\nprint(\"Before:\", df.shape)\nresult = df.drop(columns=\"customer_id\")\nprint(\"After:\", result.shape)\nprint(result.columns)",
              check: (o,c) => { const s=String(c).replace(/#.*$/gm,""); return /\(15,\s*6\)/.test(o) && /\(15,\s*5\)/.test(o) && /'age'/.test(o) && /'churn'/.test(o) && !/customer_id/.test(o) && /\.drop\s*\(\s*columns\s*=/.test(s); }
            },
            {
              q: "Create a DataFrame: <code>{id: [1,1,2,2], v: [10,10,20,30]}</code>. Print the original shape, the shape after <code>drop_duplicates()</code>, the shape after <code>drop_duplicates(subset=[\"id\"])</code>, and the result of <code>drop_duplicates()</code> itself.",
          explain: "<p>The critical point of <code>drop_duplicates</code>: the unit of comparison is the <b>entire row</b>, not a single cell.</p><p>Look at the result. The two rows with id=1 are completely identical (1, 10), so one of them was removed. But the two rows with id=2 differ from each other (2, 20) vs. (2, 30) - they're <b>not</b> duplicates, and both remained. From 4 rows, 3 remained.</p><p>And this is exactly the trap: if id is a customer identifier and you expect one row per customer, <code>drop_duplicates()</code> will report that everything is clean and you'll keep working with duplicate data.</p><p>The solution is <code>subset</code>: <code>drop_duplicates(subset=[\"id\"])</code> compares only the key column, so it left only two rows - one per id, the first occurrence. This is the common usage on the job, and the syntax is identical in pandas.</p><p>A good habit: print shape before and after. If the number didn't go down - the rows probably aren't really identical.</p>",
              starter: "",
              solution: "df = DataFrame({\"id\": [1, 1, 2, 2], \"v\": [10, 10, 20, 30]})\nprint(\"Before:\", df.shape)\nprint(\"Fully identical rows:\", df.drop_duplicates().shape)\nprint(\"By id only:\", df.drop_duplicates(subset=[\"id\"]).shape)\nprint(df.drop_duplicates())",
              check: (o,c) => { const s=String(c).replace(/#.*$/gm,""); return /\(4,\s*2\)/.test(o) && /\(3,\s*2\)/.test(o) && /\(2,\s*2\)/.test(o) && /__DATAROW__\|1\|10/.test(o) && /__DATAROW__\|2\|20/.test(o) && /__DATAROW__\|2\|30/.test(o) && (o.match(/__DATAROW__/g)||[]).length===3 && /\.drop_duplicates\s*\(\s*\)/.test(s) && /subset\s*=/.test(s); }
            },
            {
              q: "Load <code>students</code>. In a single call rename <code>math</code> to <code>matematika</code> and <code>english</code> to <code>anglit</code>. Print the columns before and after.",
          explain: "<p>A single dictionary can contain as many renamings as you want - there is no need to call <code>rename</code> twice. Each pair in the dictionary is \"old name\": \"new name\".</p><p>Notice the output: <code>name</code> and <code>history</code> were not mentioned in the dictionary, so they stayed exactly as they were, both in name and position. <code>rename</code> only touches what you asked for, and the order of the columns is preserved.</p><p>And as always - <code>columns=</code>. Without this keyword, the code will run in real pandas with no error and simply change nothing.</p><p>When is this used in practice? Almost always right after reading a file from a client, when column names come with spaces and capital letters. Real pandas has a shortcut for this: <code>df.columns = df.columns.str.strip().str.lower()</code> normalizes all the names in one line. This shortcut does not exist in the simulator.</p>",
              starter: "",
              solution: "df = data.load(\"students\")\nresult = df.rename(columns={\"math\": \"matematika\", \"english\": \"anglit\"})\nprint(df.columns)\nprint(result.columns)",
              check: (o,c) => { const s=String(c).replace(/#.*$/gm,""); return /'math'/.test(o) && /'english'/.test(o) && /'matematika'/.test(o) && /'anglit'/.test(o) && /'history'/.test(o) && /\.rename\s*\(\s*columns\s*=/.test(s); }
            },
          ]

        {
          id: "pd-astype-clip",
          icon: "🔧",
          title: "astype, clip",
          theory: `<h3>Conversions and truncation</h3><p><b>astype - type conversion</b>. Two forms, both valid in pandas:</p><pre>df["price"] = df["price"].astype(int)     # one column\ndf = df.astype({"price": float, "count": int})   # multiple columns via a dict</pre><p>Note: the argument to <code>astype</code> is <b>the type</b>. The column name is chosen beforehand with <code>df["price"]</code>, or appears as a key in the dict.</p><p><b>clip - clamping values to a range</b>:</p><pre>df["score"] = df["score"].clip(0, 100)    # single column\ndf["bill"]  = df["bill"].clip(upper=120)  # one bound only\ndf = df.clip(0, 100)                      # whole table</pre><p><code>lower</code> and <code>upper</code> are both optional - you can give just one of them.</p><h4>Three traps worth knowing in astype</h4><ul><li><code>astype(int)</code> <b>truncates, not rounds</b>: 1.9 becomes 1, not 2. To round, use <code>round</code> before converting.</li><li><code>astype(int)</code> on a string that isn't a whole number, like "1.5" or an empty string, raises <code>ValueError</code> and stops the whole script. In real pandas the fix is <code>pd.to_numeric(df["x"], errors="coerce")</code>, which converts what it can and turns the rest into NaN.</li><li>The simulator only recognizes <code>int</code>, <code>float</code>, <code>str</code>. If you write <code>"int64"</code> you won't get an error - the conversion simply won't happen. Always check the output.</li></ul><h4>clip doesn't clean outliers - it hides them</h4><p>A value of 150 that got compressed to 100 is still in the table, now as the value 100. No row was deleted, and the information about the difference between 105 and 150 is lost for good. The result is an artificial pile-up of values right at the boundary.</p><p>Use <code>clip</code> only when there's a <b>known valid range</b> - a 0-100 score, a 0-1 percentage, a non-negative age. When the outliers are real and interesting - it's better to investigate them, not compress them.</p>`,
          exercises: [
            {
              q: "Create a DataFrame with <code>{price: [\"10\",\"20\",\"30\"]}</code> (strings). Print the column and its sum before the conversion, convert the column to <code>int</code> with <code>astype</code>, and print the column and the sum again.",
          explain: "<p>How do you spot that a number is actually a string? <b>By the quote marks when printed</b>: <code>['10', '20', '30']</code> are strings, <code>[10, 20, 30]</code> are numbers.</p><p>And here's why it's critical: the sum before conversion is 0, not 60. The simulator simply skips whatever isn't a number. In real pandas the result is worse - <code>\"102030\"</code>, because <code>+</code> on strings concatenates them. <b>In both cases you get no error at all</b>, just a wrong number in the report. This is why the first step with a new file is to check the column types.</p><p>Notice the syntax: <code>df[\"price\"].astype(int)</code> - first you select the column, then you convert. The argument to <code>astype</code> is the type. The assignment back, <code>df[\"price\"] = ...</code>, is what updates the table.</p><p>What happens when the conversion fails? If one of the cells has \"1.5\" or an empty string, converting to int raises <code>ValueError</code> and stops the script. In real work you don't trust the input to be clean, and you use <code>pd.to_numeric(df[\"price\"], errors=\"coerce\")</code>, which converts what it can and turns the rest into NaN.</p>",
              starter: "",
              solution: "df = DataFrame({\"price\": [\"10\", \"20\", \"30\"]})\nprint(\"Before:\", df[\"price\"])\nprint(\"Sum before:\", df[\"price\"].sum())\ndf[\"price\"] = df[\"price\"].astype(int)\nprint(\"After:\", df[\"price\"])\nprint(\"Sum after:\", df[\"price\"].sum())",
              check: (o,c) => { const s=String(c).replace(/#.*$/gm,""); return /\['10',\s*'20',\s*'30'\]/.test(o) && /\[10,\s*20,\s*30\]/.test(o) && /:\s*0\s*$/m.test(o) && /:\s*60\s*$/m.test(o) && /\.astype\s*\(\s*(int\s*\)|\{[^}]*\bint\b[^}]*\}\s*\))/.test(s); }
            },
            {
              q: "Load <code>real-estate</code>. Convert <code>rooms</code> to float with <code>astype({\"rooms\": float})</code> and print the column. Then print the original <code>price_m</code>, convert it to int and print it - notice what happens to the digit after the decimal point.",
          explain: "<p>The second form of <code>astype</code> is a dict: <code>df.astype({\"rooms\": float})</code>. It's convenient when converting several columns at once - <code>df.astype({\"rooms\": float, \"sqm\": int})</code> - and returns a new table.</p><p>Converting to float added a decimal point: 3 became 3.0. Why would you want that? Because divisions and averages are more precise with float, and because in the real world a numeric column that has a missing value <b>must</b> be float.</p><p>Now the opposite direction, which is the trap. Compare the last two rows: 3.2 became 3, 5.1 became 5, and <b>6.8 became 6, not 7</b>. <code>astype(int)</code> truncates the decimal part rather than rounding it. If you want rounding, round before converting. Silent truncation is a classic source of discrepancies in financial reports.</p><p>And why this matters especially in real pandas: there, the moment a single missing value enters an integer column, the whole column automatically turns into float64, and then ids get displayed as 1001.0. The modern fix there is the capitalized type <code>\"Int64\"</code>, which isn't recognized in the simulator.</p>",
