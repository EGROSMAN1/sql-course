          explain: "<p><code>clip</code> compresses every value into a range: whatever is smaller than <code>lower</code> becomes <code>lower</code>, and whatever is bigger than <code>upper</code> becomes <code>upper</code>. You can write <code>clip(0, 100)</code> or <code>clip(lower=0, upper=100)</code> - it's the same thing.</p><p>And now the important point, which is why the exercise also prints the row count: <b>clip doesn't remove outliers</b>. Four rows went in and four came out. 150 is still in the table, it's just that now it looks like 100.</p><p>Notice also what's lost: 105 and 150 were two completely different values, and after the clip they're identical. Any analysis that comes later will see an artificial pile-up of values right at the boundary, with no way to know there were two separate cases there.</p><p>When should you use it? When there's a <b>known valid range</b> and any deviation from it is necessarily an input error - a score between 0 and 100, a percentage, a non-negative age. When shouldn't you? When the outlier is real, for example a million-shekel transaction in a store that averages 200 shekels. There, clip only hides the problem.</p><p>The syntax is the same in real pandas: <code>df[\"score\"] = df[\"score\"].clip(0, 100)</code>.</p>",

          title: "merge - inner join",
          theory: `<h3>Joining tables</h3><p>This is SQL's <code>JOIN</code>:</p><pre>customers.merge(orders, on="customer_id")   # INNER JOIN - the default</pre><p>Only rows that have <b>a match in both tables</b> are kept. A row in the left table with no matching partner on the right disappears, and vice versa. The row order in the result is determined by the left table, and the result is a new table. The key column appears <b>once</b> in the result, so 2+2 columns give 3, not 4.</p><h4>The rule you must remember: merge can increase the number of rows</h4><p>If a given key has one row on the left and three rows on the right, you'll get <b>three</b> rows - one per match. And if there are two on the left and two on the right, you'll get four. The general rule: the number of rows in the result is the sum, over each key, of the number of occurrences on the left times the number of occurrences on the right.</p><p>This is the number one cause of incorrect reports - a total that's suddenly double. So the professional habit is to always check: <code>print(len(left), len(right), len(result))</code>.</p><h4>Columns with the same name</h4><p>If both tables have a column with the same name besides the join key, merge can't keep both under one name - so it adds suffixes: <code>name_x</code> from the left table and <code>name_y</code> from the right. You can choose your own suffixes:</p><pre>catalog.merge(stock, on="pid", suffixes=("_catalog", "_stock"))</pre><h4>Joining on several columns</h4><p>When the real key is made up of several fields, you pass a list: <code>on=["year", "city"]</code>. A row will join only if <b>all</b> the columns in the list match.</p><p>All the syntax in this topic - <code>on</code>, <code>how</code>, <code>suffixes</code> - is identical in real pandas.</p>`,
          exercises: [
            {
              q: "Create <code>students = {id:[1,2,3], name:[\"A\",\"B\",\"C\"]}</code> and <code>grades = {id:[1,2], score:[100,200]}</code>. Join them with <code>merge</code> on <code>id</code>. Print the three shapes (left, right, result) and the resulting table.",
          explain: "<p><code>merge</code> joins two tables on a shared key column, exactly like a JOIN in SQL.</p><p>Read the three shapes: 3 rows and 2 rows went in, and 2 came out. The row with id=3 (student C) disappeared because it had no match in the scores table. This is the essence of INNER JOIN - it keeps only the intersection, and it's an <b>operation that loses data</b>.</p><p>Also note the number of columns: 2 + 2 = 4, but the result has 3. The reason is that <code>id</code> is the join column and it appears only once.</p><p>The habit that will save you on the job, and it's exactly what the exercise prints: after every merge, compare the row counts. If the number is smaller - you lost rows that found no match. If the number is larger - there are duplicate keys, and that's usually a bug.</p><p>If you need to keep <b>all</b> the rows of the left table, that's a LEFT JOIN, and it's the next topic. The syntax here is identical in real pandas.</p>",
              starter: "",
              solution: "students = DataFrame({\"id\": [1, 2, 3], \"name\": [\"A\", \"B\", \"C\"]})\ngrades = DataFrame({\"id\": [1, 2], \"score\": [100, 200]})\nresult = students.merge(grades, on=\"id\")\nprint(students.shape, grades.shape, result.shape)\nprint(result)",
              check: (o,c) => { const s=String(c).replace(/#.*$/gm,""); return /\(3,\s*2\)\s+\(2,\s*2\)\s+\(2,\s*3\)/.test(o) && /__DATAROW__\|1\|A\|100/.test(o) && /__DATAROW__\|2\|B\|200/.test(o) && !/\|3\|C/.test(o) && /\.merge\s*\(/.test(s); }
            },
            {
              q: "Create <code>users = {uid:[1,2,3], name:[\"X\",\"Y\",\"Z\"]}</code> and <code>logins = {uid:[2,3,4], date:[\"a\",\"b\",\"c\"]}</code>. Join on <code>uid</code>. Print all three shapes and the result, and identify who disappeared from each side.",
          explain: "<p>Now we print the table itself, not just its size, and this way we see exactly what happened.</p><p>Count the losses: on the left there were three users and two remained in the result - uid=1 (X) disappeared because they never logged in. On the right there were three logins and two remained in the result - uid=4 disappeared because it has no user in the table. <b>INNER JOIN loses from both directions.</b></p><p>And this is exactly where such a mistake gets expensive: if <code>logins</code> is an activity table and you wanted to analyze inactive users - the inner join deleted exactly those, and you'll end up reporting that all users are active.</p><p>The question to ask before every merge is \"which table is my source of truth?\". If the answer is \"the users table\" - you need <code>how=\"left\"</code>, not inner.</p><p>And the loss from the right side (uid=4) is interesting in its own right: a login from a user that doesn't exist in the users list is a sign of a data integrity issue, and it's worth investigating rather than just silently dropping it.</p>",
              starter: "",
              solution: "users = DataFrame({\"uid\": [1, 2, 3], \"name\": [\"X\", \"Y\", \"Z\"]})\nlogins = DataFrame({\"uid\": [2, 3, 4], \"date\": [\"a\", \"b\", \"c\"]})\nresult = users.merge(logins, on=\"uid\")\nprint(users.shape, logins.shape, result.shape)\nprint(result)",

            {
              q: "Create <code>products = {pid:[10,20,30], name:[\"Pen\",\"Book\",\"Pencil\"]}</code> and <code>sales = {pid:[10,20,10], qty:[5,3,2]}</code>. Merge on <code>pid</code>. Print the three shapes on three separate lines and the result. Note how many times Pen appears.",
          explain: "<p>Here's the most important thing to know about merge: <b>it can return more rows than the table you started from had.</b></p><p>Look at the result: product 10 (Pen) has two sales, so it appears <b>twice</b> - once with qty=5 and once with qty=2. Meanwhile Pencil disappeared because it was never sold. Three rows went in, three came out, but they're not the same three.</p><p>Why is this dangerous? Because any calculation that comes after the merge will count Pen twice. If the products table had a price column, summing it after the merge would be inflated - and this is one of the most common mistakes in business reports.</p><p>How do you prevent it? Before merging, check whether the key is unique in the table you're joining to: <code>products[\"pid\"].nunique() == len(products)</code>. And after merge, compare the row count, like here. If it grew - you need to decide whether the duplication is legitimate (a product with several sales) or a bug in the data.</p><p>In real pandas there's a dedicated tool for this: <code>merge(..., validate=\"one_to_many\")</code> raises an error if your assumption about key uniqueness is violated. It doesn't exist in the simulator, so here you check manually.</p>",

              solution: "products = DataFrame({\"pid\": [10, 20, 30], \"name\": [\"Pen\", \"Book\", \"Pencil\"]})\nsales = DataFrame({\"pid\": [10, 20, 10], \"qty\": [5, 3, 2]})\nresult = products.merge(sales, on=\"pid\")\nprint(\"Products:\", products.shape)\nprint(\"Sales:\", sales.shape)\nprint(\"Result:\", result.shape)\nprint(result)",

            {
              q: "Join <code>{x:[1,2,3], n:[\"A\",\"B\",\"C\"]}</code> with <code>{x:[4,5,6], v:[10,20,30]}</code> on <code>x</code> - there is no match at all. Print the shape, the column names, and the result of the comparison <code>len(result) == 0</code>.",
          explain: "<p>When there is no shared key at all, an inner join returns an empty table. Look at both parts of the output: the row count is 0, but <b>the columns are preserved</b> - x, n and v are all still there. An empty table is a table with structure, not nothing.</p><p>And this is not an error. The code runs successfully and simply reports that there's no overlap. So after a merge you're not sure about, check explicitly: <code>if len(result) == 0</code>.</p><p>Now the reason that will cost you the most time on the job. When a merge result comes out empty even though you're sure there are matches, the immediate suspect is <b>the key's type</b>: in one table the identifier is the number 101 and in the other it's the string \"101\". When printed, both look like 101, neither throws an error, and simply nothing connects. The same thing happens with extra spaces in text (\"Tel Aviv \" vs. \"Tel Aviv\").</p><p>The check: print the values from both sides and compare both value and type. If needed - align the types with <code>astype</code> before the merge.</p>",
              starter: "",
              solution: "a = DataFrame({\"x\": [1, 2, 3], \"n\": [\"A\", \"B\", \"C\"]})\nb = DataFrame({\"x\": [4, 5, 6], \"v\": [10, 20, 30]})\nresult = a.merge(b, on=\"x\")\nprint(result.shape)\nprint(result.columns)\nprint(\"Empty?\", len(result) == 0)",
              check: (o,c) => { const s=String(c).replace(/#.*$/gm,""); return /\(0,\s*3\)/.test(o) && /'x'/.test(o) && /'n'/.test(o) && /'v'/.test(o) && /True/.test(o) && /\.merge\s*\(/.test(s) && /len\s*\(/.test(s); }
            },
            {
              q: "Create <code>catalog = {pid:[1,2], name:[\"Pen\",\"Book\"], price:[5,30]}</code> and <code>stock = {pid:[1,2], name:[\"pen-blue\",\"book-red\"], qty:[100,50]}</code> - notice that both contain a column named <code>name</code>. Join on <code>pid</code>, print the columns and the result, then join again with <code>suffixes=(\"_catalog\",\"_stock\")</code> and print the columns.",
          explain: "<p>What happens when both tables contain a column with the same name, other than the join key? You can't keep both under the name <code>name</code>, so merge <b>automatically adds suffixes</b>: <code>name_x</code> from the left table and <code>name_y</code> from the right.</p><p>Remember the rule: <b>x is left, y is right</b>. In the resulting table, <code>name_x</code> holds Pen and Book from the catalog, and <code>name_y</code> holds pen-blue and book-red from inventory.</p><p>The problem with <code>_x</code> and <code>_y</code> is that they're meaningless. A month after you write the code you won't remember which table was left. So in real work, you give meaningful suffixes: <code>suffixes=(\"_catalog\", \"_stock\")</code>, so the columns explain themselves.</p><p>Notice that the key column <code>pid</code> <b>didn't</b> get a suffix - it's identical in both tables by definition, so it appears only once.</p><p>An even cleaner way: rename before joining, with <code>rename(columns={\"name\": \"product_name\"})</code>. When the names differ from the start, there's no collision and no suffixes. The syntax here, including <code>suffixes</code>, is identical in real pandas.</p>",
              starter: "",
              solution: "catalog = DataFrame({\"pid\": [1, 2], \"name\": [\"Pen\", \"Book\"], \"price\": [5, 30]})\nstock = DataFrame({\"pid\": [1, 2], \"name\": [\"pen-blue\", \"book-red\"], \"qty\": [100, 50]})\nresult = catalog.merge(stock, on=\"pid\")\nprint(result.columns)\nprint(result)\nnamed = catalog.merge(stock, on=\"pid\", suffixes=(\"_catalog\", \"_stock\"))\nprint(named.columns)",

        {
          id: "pd-merge-left",
          icon: "⬅️",
          title: "merge - LEFT JOIN",
          theory: `<h3>LEFT JOIN - keeps the left table</h3><pre>customers.merge(orders, on="id", how="left")</pre><p><b>Every row</b> in the left table is kept, even if it has no match on the right. In rows with no match, the columns that came from the right table get a missing value.</p><p>So the number of rows in the result equals the number of rows in the left table - unless the key has duplicates in the right table, in which case it will grow.</p><h4>The four values of how</h4><ul><li><code>"inner"</code> - only rows that have a match on both sides (the default)</li><li><code>"left"</code> - all rows from the left table</li><li><code>"right"</code> - all rows from the right table</li><li><code>"outer"</code> - all rows from both sides, including those without a partner</li></ul><p>Any other value will throw a <code>ValueError</code> - both here and in real pandas. That's good: a loud error is preferable to a silently wrong result.</p><p><code>a.merge(b, how="right")</code> is equivalent to <code>b.merge(a, how="left")</code>, aside from the column order. In practice, most analysts write only left and outer, arranging the tables accordingly.</p><h4>When to choose left and when inner</h4><p>The question is which table is <b>your truth</b>. If the customer list is the complete inventory and you also want to know who <b>didn't</b> order - that's <code>how="left"</code>. If you only care about actual orders - inner.</p><h4>What to do with the missing values created</h4><p>A left join is the number one source of missing values in real work, and this connects us directly to data cleaning:</p><pre>missing = result["v"].isna().sum()   # how many rows found no match\nresult = result.fillna(0)            # if "not found" means 0</pre><p>This decision is a business decision, not a technical one: an "order total" with no match is 0, but a "satisfaction score" with no match isn't 0 - there you must not invent a value.</p><h4>None here, NaN at work</h4><p>In the simulator, rows with no match get <code>None</code>. In real pandas they get <code>NaN</code>, and this has a result that surprises many people: an integer column that gets missing values added to it automatically becomes <code>float64</code>, so instead of <code>[10, 20, None]</code> you'll see <code>[10.0, 20.0, NaN]</code>.</p>`,
          exercises: [
            {
              q: "<code>a = {id:[1,2,3], n:[\"A\",\"B\",\"C\"]}</code>, <code>b = {id:[1,2], v:[10,20]}</code>. On the same data, perform both an inner merge and a left merge. Print both shapes and the left result.",
          explain: "<p><code>how=\"left\"</code> changes the rules of the game: every row in the left table survives, even if no match was found for it.</p><p>Compare the two numbers on the exact same data: inner returned 2 rows and left returned 3. The row id=3 (student C), which has no match, disappeared in inner and stayed in left - with <code>None</code> in column v.</p><p>From this comes the check you do after every left join: the number of rows in the result should be <b>equal</b> to the number of rows in the left table. If it's smaller - you wrote inner by mistake. If it's larger - there are duplicate keys in the right table, and that's almost always a bug.</p><p>How do you choose between the two? Ask yourself which table is your source of truth. If the customer list is the full inventory and you also want to know who didn't order - left. If you only care about actual orders - inner. The syntax is identical in real pandas.</p>",
              starter: "",
              solution: "a = DataFrame({\"id\": [1, 2, 3], \"n\": [\"A\", \"B\", \"C\"]})\nb = DataFrame({\"id\": [1, 2], \"v\": [10, 20]})\ninner = a.merge(b, on=\"id\")\nleft = a.merge(b, on=\"id\", how=\"left\")\nprint(\"inner:\", inner.shape)\nprint(\"left:\", left.shape)\nprint(left)",
              check: (o,c) => { const s=String(c).replace(/#.*$/gm,""); return /inner:\s*\(2,\s*3\)/.test(o) && /left:\s*\(3,\s*3\)/.test(o) && /__DATAROW__\|1\|A\|10/.test(o) && /__DATAROW__\|3\|C\|None/.test(o) && /how\s*=\s*["']left["']/.test(s) && /\.merge\s*\(/.test(s); }
            },
            {
              q: "On the same two tables from the previous exercise, perform a left merge and print the <code>v</code> column. Then count how many missing values were created with <code>isna().sum()</code>, and finally print the column after <code>fillna(0)</code>.",
          explain: "<p>Here you see what <code>shape</code> hid: column v contains <code>[10, 20, None]</code>. This missing value <b>wasn't in the original data</b> - the merge created it, because row id=3 found no match.</p><p>This is why left join is the number-one source of missing values in real work, and it connects us directly to the missing-values topic: after every left join, <b>count</b> how many gaps were created, and decide what to do with them.</p><p>The decision here is a business one, not a technical one. If v is \"order total\", then \"no order found\" means 0 - and this is exactly the case where <code>fillna(0)</code> is the right move. But if v is \"satisfaction score\", there's no data and you must not invent a zero; there you leave it missing, because a zero would drag the average down and distort the analysis.</p><p>The gap from real pandas: there, the result isn't <code>[10, 20, None]</code> but <code>[10.0, 20.0, NaN]</code>. The missing value is NaN, which is a float, so its mere presence turns the entire column from int to float64. If you ever see customer ids displayed as 1001.0 after joining tables - this is why.</p>",

            {
              q: "<code>employees = {id:[1,2,3,4], name:[\"X\",\"Y\",\"Z\",\"W\"]}</code>, <code>departments = {id:[1,3], dept:[\"A\",\"B\"]}</code>. Perform a left merge and print the table. Count how many employees ended up without a department, and finally print the table after filling the missing department values with the text \"No department\" (using a dict for fillna).",
          explain: "<p>Four employees went in and four came out - that's what left join guarantees. Employees Y and W got <code>None</code> in the department column because their ids weren't found in the departments table.</p><p>Notice what we got here, and why it's far more useful than inner: if we'd done inner, Y and W would have disappeared and we'd be reporting that the company has two employees. With left they stayed, and now we have a <b>real finding</b> - two employees aren't assigned to any department. This is exactly the kind of problem an analyst is supposed to discover and report, not hide.</p><p>So the step after every left join is always to count the gaps: <code>result[\"dept\"].isna().sum()</code>. This number is the finding, not a technical side effect.</p><p>And before showing the table to the client, you fill the gaps with a readable value. Notice that we used a dict - <code>fillna({\"dept\": \"No department\"})</code> - rather than <code>fillna(\"No department\")</code> on the whole table. This way only the column we wanted is affected, and other columns (like ids or numbers) don't accidentally get text.</p>",

            {
              q: "A left merge with 0 matches: <code>{id:[10,20], n:[\"a\",\"b\"]}</code> and <code>{id:[99], v:[5]}</code>. Print the shape of left and of inner, the left table, and the percentage of rows that found no match.",
          explain: "<p>The edge case: no key matches at all. Compare the two results on the same data - inner returns 0 rows, i.e. an empty table, while left returns both original rows with <code>None</code> in column v.</p><p>This is exactly what left guarantees: the number of rows in the result equals the number of rows in the left table, regardless of how many matches were found.</p><p>But stop for a moment and ask: does this result make sense? The mismatch rate here is 100 percent. A column that's entirely empty after joining tables is almost always <b>a sign of a bug, not a finding</b>. The immediate suspects: a mismatched key type (the number 99 vs. the string \"99\"), extra spaces in text, or simply joining on the wrong column.</p><p>So it's worth calculating the mismatch percentage and not just looking at the table: a low percentage is normal and interesting, a percentage of 100 is a malfunction. If 100 percent of the rows found no match - don't continue the analysis, investigate the key.</p>",

          explain: "<p>This is the summary exercise for the topic: the exact same data, four join types, four different answers.</p><p>The data: on the left, ids 1 and 2; on the right, 2 and 3. Only id 2 is shared.</p><ul><li><b>inner</b> - one row. Only the match. id=1 and id=3 both disappeared.</li><li><b>left</b> - two rows. All of the left kept, id=1 got None in v.</li><li><b>right</b> - two rows. All of the right kept, id=3 got None in n.</li><li><b>outer</b> - three rows. <b>No row is lost</b>: 1 missing on the right, 2 fully matched, 3 missing on the left.</li></ul><p>outer is the right tool when you're comparing two sources and want to know what's in each of them and what's missing from the other - for example comparing a customer list in the billing system to the list in the CRM. The rows with the gaps <b>are</b> the answer.</p><p>And finally, notice the error: <code>how=\"banana\"</code> raises a <code>ValueError</code> that lists the four valid values. That's intentional - a loud error is better than a silently wrong result. The exact same behavior in real pandas.</p><p>Note: <code>a.merge(b, how=\"right\")</code> is equivalent to <code>b.merge(a, how=\"left\")</code>, up to column order. In practice most analysts only ever write left and outer, and arrange their tables accordingly.</p>",

          theory: `<h3>Stacking rows from identical tables</h3><p>This is SQL's <code>UNION ALL</code>: the tables are pasted one below the other.</p><pre>pd.concat([df1, df2])</pre><p>Notice two syntax details: <code>concat</code> is a <b>module-level function</b>, not a table method (you write <code>pd.concat</code>, not <code>df1.concat</code>), and it takes a <b>list</b> - so you can join two tables or twelve in the same call.</p><h4>concat or merge?</h4><ul><li><code>concat</code> - <b>same columns, new rows</b>. Joining January and February into one table.</li><li><code>merge</code> - <b>same rows, new columns</b>. Attaching each order's customer details to it.</li></ul><p>If you're adding more data of the same kind - concat. If you're enriching existing data with more information - merge.</p><h4>What happens when the columns aren't identical</h4><p>The result's columns are the <b>union</b> of the columns of all the tables, and cells with no source are filled with a missing value. This is pandas' behavior, and it's convenient - but it also means a typo in a column name won't raise an error: you'll get two columns, each half full of gaps. So the habit is to check first:</p><pre>print(df1.columns)\nprint(df2.columns)</pre><p>And after concatenating, verify that <code>len(result) == len(df1) + len(df2)</code>.</p><h4>Two final points</h4><p>concat is <code>UNION ALL</code>, not <code>UNION</code> - it does <b>not</b> remove duplicate rows. If needed, add <code>.drop_duplicates()</code> after it.</p><p>In real pandas you'd write <code>pd.concat([df1, df2], ignore_index=True)</code>. Without this parameter the original indexes are kept and each table contributes its own 0,1,2, so you end up with duplicate index numbers. In the simulator this is already the default. There's also <code>axis=1</code> for side-by-side concatenation, which isn't supported here.</p>`,

          explain: "<p><code>pd.concat</code> pastes tables one below the other. Read the three shapes: 3 rows plus 3 rows gives 6, and the number of columns stays 1. <b>concat adds rows, not columns.</b></p><p>Notice the syntax, because it's different from everything you've seen so far in the course: <code>concat</code> isn't a table method but a <b>module-level function</b> - you write <code>pd.concat([a, b])</code>, not <code>a.concat(b)</code>. The reason makes sense: the operation belongs to all the tables equally, and none of them is the \"owner\". And since it takes a list, you can pass it as many tables as you want.</p><p>The check to run after every concat: <code>len(result)</code> must equal the sum of the lengths that went in. If it's smaller - something didn't join.</p><p>And here's the most important distinction on the topic: <b>concat</b> - same columns, new rows (January and February into one table). <b>merge</b> - same rows, new columns (customer details for each order). If you're adding more data of the same kind - concat. If you're enriching existing data - merge.</p>",

          explain: "<p>This is the pattern you'll use in almost every real project: <b>accumulate into a list, and concatenate once at the end.</b></p><p>The classic scenario: you have 12 files, one per month, and need a single yearly table. The code always looks like this:</p><pre>frames = []\nfor month in months:\n    frames.append(load(month))\nresult = pd.concat(frames)</pre><p>And the important rule: <b>don't call concat inside the loop.</b> Concatenating a table on every round creates a new copy of everything accumulated so far, so the cost grows quadratically - with 12 files you won't notice, with 1000 the code will grind to a halt. Accumulating into a list and concatenating once at the end is a single operation.</p><p>Also notice we printed <code>len(frames)</code> before the concatenation and <code>len(result)</code> after. Three tables of two rows each give six - that's the confirmation that the concatenation did what you expected.</p><p>In real pandas, the exact same pattern: <code>result = pd.concat(frames, ignore_index=True)</code>.</p>",

          explain: "<p>This is the real-world scenario for concat: two quarters merged into one table, and then computing on it - total sales for the half-year is 1000, and there'd have been no way to get that from two separate tables without joining.</p><p>Notice the first line of output: the column names of both tables are identical, <code>month</code> and <code>sales</code>. <b>That's what makes the join work</b>, and that's the check worth doing before any concat.</p><p>And what if they aren't identical? The result's columns will be the union of all of them, and the missing cells will be filled with a missing value. That's convenient, but it also means that if you accidentally capitalized \"Sales\" in one of the files, <b>you won't get an error</b> - you'll get two separate columns, each half full of gaps, and a wrong sum.</p><p>Another point worth remembering: concat is UNION ALL, not UNION. It does <b>not</b> remove duplicate rows. If you joined two files that partly overlap - for example a report sent twice - add <code>.drop_duplicates()</code> afterward, or the sum will be inflated.</p><p>In real pandas: <code>result = pd.concat([q1, q2], ignore_index=True)</code>.</p>",

          explain: "<p>The edge case that really trips people up in concat isn't an empty table - it's <b>tables with different columns</b>.</p><p>Table a has x and y, and table b has only x. The result: 5 rows and 2 columns, and the rows that came from b got <code>None</code> in column y. The result's columns are the <b>union</b> of the columns of all the tables, and every cell with no source is filled with a missing value. This is exactly pandas' behavior, where the value would be NaN.</p><p>And this is exactly the danger: <b>there's no error</b>. If a column name in one file is accidentally off by one character - \"Sales\" vs \"sales\", or a stray trailing space - you'll get two separate columns instead of one, each half full of gaps, and any sum you compute will be wrong.</p><p>So always two steps: before joining, <code>print(a.columns)</code> and <code>print(b.columns)</code>, and afterward count the gaps - <code>result[\"y\"].isna().sum()</code>. If the number is bigger than expected, the columns probably didn't match.</p><p>And what do you do with the gaps that were created? The same business decision you learned in the missing-values topic: if y is \"quantity\" and \"not reported\" means 0 - <code>fillna(0)</code>. If you have no idea what belonged there - leave it missing.</p>",

          explain: "<p>The summary exercise demonstrates pandas' central pattern: <b>chaining</b>. Every operation returns a new table, so you can go straight into the next one - <code>pd.concat([a, b]).sort_values(\"a\").head(3)</code>.</p><p>Read the result in order:</p><ul><li><b>concat</b> - 5 plus 5 gives 10 rows, and the sum of b is 550. These two checks are the verification that the join succeeded.</li><li><b>sort_values</b> - sorts all 10 rows by a. Notice that now the rows from both tables are <b>interleaved</b>: the value 1 came from the first table, 2 from the second, 3 again from the first. That's what turns two pasted-together tables into one real table.</li><li><b>head(3)</b> - the three smallest. concat then sort then head is exactly the Top-N pattern you've learned.</li></ul><p>And why sort after concat at all? Because right after joining, the row order reflects the <b>order of the files you loaded</b>, not the data itself. Any report that relies on order needs an explicit sort.</p><p>In real pandas, the same chain: <code>pd.concat([a, b], ignore_index=True).sort_values(\"a\").head(3)</code>. The <code>ignore_index=True</code> there isn't decoration - without it each table contributes its own index 0,1,2,3,4, and after sorting you'll see duplicated, confusing index numbers.</p>",

          theory: `<h3>Method chaining</h3>\n<p>Every operation on a DataFrame returns a new DataFrame. So you can chain operation after operation and get a complete analysis in one expression, without intermediate variables:</p>\n<pre>result = (df[df["department"].eq("Sales")]\n            .sort_values("salary", ascending=False)\n            .head(2))</pre>\n<p>The outer parentheses are what let you spread the chain over several lines and read it top to bottom.</p>\n<h4>The first link: a boolean mask</h4>\n<p><code>df["salary"].gt(15000)</code> returns a <b>mask</b> — a column of True/False the length of the table. When you put a mask inside <code>df[...]</code>, only the rows where it's True remain:</p>\n<pre>mask = df["department"].eq("Sales") &amp; df["salary"].gt(15000)\nresult = df[mask]</pre>\n<p>You combine masks with <code>&amp;</code> (and), <code>|</code> (or), and <code>~</code> (not). Alternatively you can write the condition as a string: <code>df.query("price_m &lt; 5")</code>.</p>\n<h4>Link order matters</h4>\n<p>Filter before sorting, and <code>head</code> always after <code>sort_values</code> — otherwise you've cut the table before ranking it. Also note that <code>ascending</code> is True by default; when asking for the "highest" you must use <code>ascending=False</code>.</p>\n<h4>What you can't do inside a chain</h4>\n<p>You can’t add a column in the middle of a chain, because <code>df["x"] = ...</code> is an assignment statement, not a method. In such cases you split it into two steps.</p>\n<h4>Versus real pandas</h4>\n<p>In pandas you write <code>df[df["salary"] &gt; 15000]</code>. The simulator here can't return a mask from the <code>&gt;</code> operator, so you use the methods <code>.gt() .lt() .ge() .le() .eq() .ne()</code> — these are completely real pandas methods, and the code you write here will run in pandas exactly as is. <code>sort_values</code>, <code>head</code>, <code>query</code>, <code>groupby</code>, <code>&amp;</code>, <code>|</code>, <code>~</code> — identical.</p>`,

          explain: "The task: among Sales employees only, who are the two highest earners above 15,000?\nThe two conditions are on the same row, so you combine them into a single mask with <code>&amp;</code>:\n<code>df[\"department\"].eq(\"Sales\") &amp; df[\"salary\"].gt(15000)</code>.\nThen a chain of two links: sort_values descending, then head(2).\nThe result: Liat (19,000) and Galit (18,000). Tal, who earns exactly 17,000, passes the filter but falls out of the ranking.\nNote: the default for sort_values is ascending=True. Without ascending=False you’d get the two lowest — the opposite answer.\nIn real pandas this is exactly the same line, just with operators: df[(df[\"department\"] == \"Sales\") &amp; (df[\"salary\"] &gt; 15000)]. The parentheses around each condition are mandatory, because &amp; binds tighter than == and without them the code breaks.",

          theory: `<h3>Multi-step analysis: from the business question to code</h3>\n<p>A real business question is almost never a single operation. The safe approach: write the question out in words, break each word into a step, and only then code it.</p>\n<p>"Which customer paid the most among those who churned?"</p>\n<pre>churned = df[df["churn"].eq(1)]                                  # 1. narrow down to\nranked  = churned.sort_values("monthly_bill", ascending=False)   # 2. we rank\ntop     = ranked.iloc[0]                                         # 3. we pull\nprint(top["customer_id"], top["monthly_bill"])</pre>\n<h4>A calculated column is a legitimate step</h4>\n<pre>df["price_per_sqm"] = df["price_m"] * 1000000 / df["sqm"]</pre>\n<p>Arithmetic on columns is vectorized — the expression operates on all rows at once, without a loop and without a list comprehension. Note that an assignment like this <b>changes df itself</b>, so rerunning the same cell adds columns over and over.</p>\n<h4>Normalization changes conclusions</h4>\n<p>Price per square meter, a rate instead of a count, an average instead of a sum — all of these are normalization, and they typically flip the ranking. An absolute number and the size of its base should always appear together.</p>\n<h4>Third step: complex aggregation</h4>\n<pre>g = df.groupby("department")\nreport = g.agg({"salary": "max"}).rename(columns={"salary": "max_salary"})\nreport["avg_salary"] = list(g["salary"].mean())\nreport["gap"] = report["max_salary"] - report["avg_salary"]</pre>\n<p>Warning: a row from <code>groupby().max()</code> isn't a real row from the table but the maximum of each column <b>separately</b> — the two values in the row can come from two different employees.</p>\n<h4>iloc for range slicing</h4>\n<p><code>df.iloc[0:6]</code> returns the first six rows by position — useful for comparing periods. Here too: position, not label.</p>`,

              q: "Load <code>salaries</code>. For each department compute <b>the gap between the maximum salary and the average salary</b> (max minus mean). Build a report table with the department name, the max, the average and the gap, and print it.",
          explain: "The task: in each department — how far is the highest salary from the average?\nThis is a dispersion measure: a large gap between the maximum and the average points to a single \"star\" pulling the average up, meaning uneven pay within the department. That's exactly what HR is looking for.\nThe result: Sales 2,000, R&amp;D 3,500, Marketing 1,000. R&amp;D is both the highest payer and the least uniform.\nNote that we built a table, not two lists: <code>agg({\"salary\": \"max\"})</code> returns a DataFrame with the department name as a column, so you can add columns to it and see a number next to its label. Two separate lists of numbers force the reader to guess which number belongs to whom.\nImportant warning: a row from <code>groupby().max()</code> is not a real employee. If you took max on both salary and years, the two values could come from two different employees — the maximum is computed per column separately. That is why we explicitly chose a single column.\nIn pandas: g = df.groupby(\"department\")[\"salary\"]; g.max() - g.mean(), or g.agg([\"max\", \"mean\"]).",

        {
          id: "pd-complex-conditions",
          icon: "🧠",
          title: "Complex conditions",
          theory: `<h3>Complex conditions: &amp; , | , ~</h3>\n<p>Every comparison on a column produces a <b>mask</b> — a column of True/False the length of the table:</p>\n<pre>rich = df["salary"].gt(16000)   # [False, True, True, ...]</pre>\n<p>Masks are combined with logical operators, and that's exactly where this whole topic lives:</p>\n<pre>df[mask_a &amp; mask_b]    # and — both conditions together\ndf[mask_a | mask_b]    # or   – enough for one to hold\ndf[~mask_a]            # not   – inverts the mask</pre>\n<h4>The difference you must internalize</h4>\n<p><code>&amp;</code> <b>narrows</b> and <code>|</code> <b>widens</b>. You can express "and" by chaining two filters one after another, but "or" cannot be expressed by chaining in any form — because each additional filter only operates on what is left. That is exactly why the operators exist.</p>\n<h4>Parentheses aren't decoration</h4>\n<pre>sales_vet = df["department"].eq("Sales") &amp; df["years"].ge(4)\nrnd_rich  = df["department"].eq("R&amp;D") &amp; df["salary"].gt(20000)\nresult    = df[sales_vet | rnd_rich]</pre>\n<p>When a condition is made up of several branches, give each branch its own name. It's more readable, and it also lets you check each branch separately (<code>df[sales_vet].shape[0]</code>) — a sanity check that reveals a dead branch that returns no rows.</p>\n<h4>Membership in a list: isin</h4>\n<pre>df[df["plan"].isin(["premium", "standard"])]     # one of these values\ndf[~df["neighborhood"].isin(["Jaffa", "Florentin"])] # everything not in the list</pre>\n<p><code>~ ... isin([...])</code> is the most common notation in real work for negating a set of values — much more readable than a chain of <code>ne</code>. There's also <code>df["age"].between(25, 35)</code> for a closed range.</p>\n<h4>Compared to real pandas — the critical point</h4>\n<p>In pandas the operators are <code>&amp;</code>, <code>|</code>, <code>~</code> — exactly like here — and you <b>must not</b> use <code>and</code>/<code>or</code> on columns: that raises <code>ValueError: The truth value of a Series is ambiguous</code>, one of the first errors every beginner runs into. The only difference: there you compare with an operator, <code>df[(df["math"] &gt; 80) &amp; (df["english"] &gt; 85)]</code>, and every condition <b>must</b> be in parentheses because <code>&amp;</code> binds tighter than <code>&gt;</code>. Here you compare with the methods <code>.gt()</code>/<code>.eq()</code>, so the parentheses aren't needed — everything else is the same.</p>`,
          exercises: [
            {
              q: "Load <code>telecom-churn</code>. Find customers aged 30 to 45 (use <code>between</code>) <b>and also</b> with a monthly bill above <b>the average of all customers</b>. Print the average, the customers found, and the shape.",
          explain: "The task: middle-aged customers who pay more than average — a segment defined across two completely different dimensions.\nTwo new things here:\n1. <code>df[\"age\"].between(30, 45)</code> replaces two masks (<code>ge(30) &amp; le(45)</code>) with one. <b>Both endpoints are included</b> — and that's not a technicality: customer 102 is exactly 45, and they're in. Had you written <code>lt(45)</code>, they'd have been dropped. Always ask yourself whether the boundary belongs to the segment or not, and write the answer explicitly.\n2. The threshold isn't a fixed number but <b>computed from the data</b>: <code>df[\"monthly_bill\"].gt(avg_bill)</code> compares every row against a single scalar computed from the whole column. This is far more robust than a hardcoded number — if the data changes, the threshold moves with it. Note that we printed the average (88.09): a threshold that isn't shown is a threshold you can't audit.\nThe result: three customers — 102, 106 and 114 — that is, (3, 6). All six columns remain; filtering rows doesn't touch the columns.\nIt's worth noting who doesn't get in: customer 103 meets the age condition (32) and pays 80.3, above most customers — but below the average. The average here is pulled upward by a few very high accounts, so \"above average\" is a higher bar than it seems. With a median you'd get an entirely different segment.",
              starter: "",
              solution: "df = data.load(\"telecom-churn\")\navg_bill = df[\"monthly_bill\"].mean()\nmask = df[\"age\"].between(30, 45) & df[\"monthly_bill\"].gt(avg_bill)\nresult = df[mask]\nprint(\"Average bill:\", round(avg_bill, 2))\nprint(result[[\"customer_id\", \"age\", \"monthly_bill\", \"churn\"]])\nprint(result.shape)",
              check: (o,c)=>{const s=String(c||"").replace(/#[^\n]*/g,"");return /&/.test(s) && /between\(/.test(s) && /mean\(/.test(s) && /88\.09/.test(o) && /102/.test(o) && /106/.test(o) && /114/.test(o) && !/103/.test(o) && !/112/.test(o) && /\(3, 6\)/.test(o);}
            },
            {
              q: "Load <code>salaries</code>. Define two masks: salary above 16,000 and tenure of 4 years or more. Print <b>how many employees meet both</b> (<code>&amp;</code>) and <b>how many meet at least one</b> (<code>|</code>), and then print the \"both\" group.",
          explain: "This is the exercise that shows the difference in numbers: the exact same two masks, two operators, two answers.\n<code>&amp;</code> gives 5 employees, <code>|</code> gives 8. <code>&amp;</code> always narrows and <code>|</code> always widens, and the two groups differ by 3 employees who satisfy only one condition: Galit and Tal earn well but have short tenure, and Victor has long tenure but earns exactly 16,000 — not <b>above</b> 16,000.\nVictor is a point worth stopping on: the difference between <code>gt</code> (above) and <code>ge</code> (at least) is exactly the difference between him and being included in the group. When defining business segments, this boundary is a classic source of disputes — define it explicitly.\nAnd finally: the \"and\" group could also be obtained by chaining two filters. The \"or\" group could not — in any form. That's why <code>|</code> exists.",

          explain: "The task: the teams at the extremes — the leaders in points and the weakest in offense.\n<code>|</code> includes a row if <b>at least one</b> of the conditions holds. The result: four groups — Maccabi Tel Aviv and Hapoel Be'er Sheva got in on points, Hapoel Tel Aviv and Beitar got in due to their weak attack.\nNow look at the second row: <b>zero</b> groups meet both conditions together. The leading teams score a lot, so no team is both strong in points and weak on offense.\nThis is the cleanest demonstration of the difference: the exact same two conditions give 4 rows with <code>|</code> and 0 rows with <code>&amp;</code>. If you chained two filters one after another you'd get the 0, because each additional filter operates only on what remains. Chaining is always \"and\".\nThe one team that didn't make it in is Maccabi Haifa — 48 points and 41 goals, in the middle on both dimensions.\nIn pandas: df[(df[\"points\"] &gt;= 52) | (df[\"goals_for\"] &lt; 40)]. With <code>or</code> instead of <code>|</code> you'll get a ValueError.",

          explain: "The task: affordable apartments, but not in neighborhoods the client ruled out.\n<code>df[\"neighborhood\"].isin([...])</code> returns True for every row whose value is in the list, and <code>~</code> flips the mask — that is, \"everything that is not in the list\". Three negations in one line, instead of three chained <code>ne</code> calls.\nThe result: Ramat Aviv, Bavli, and Old North — 3 of the 6 apartments that met the price condition.\nNotice that the negation here did half the work: without it, six apartments would remain. The blacklist isn't decoration.\n<code>~ ... isin([...])</code> is the most common notation in real work for filtering a set of values, and it's completely identical in pandas. The opposite is also useful: <code>df[df[\"plan\"].isin([\"premium\", \"standard\"])]</code>.",

          icon: "📞",
          title: "Case Study: Churn analysis",
          theory: `<h3>Project: why do customers leave?</h3>\n<p>We’re analysts at a telecom company. The <code>telecom-churn</code> table has 15 customers, each with age, monthly bill, tenure in months, plan, and a <code>churn</code> column where 1 = left and 0 = stayed. The goal isn’t "to run functions" but to come out with one actionable recommendation.</p>\n<p>Five steps, each one building on the last: the overall churn rate, the churn rate within each plan, the churned profile vs. the retained profile, the size of the lost revenue, and finally — who's at risk now.</p>\n<h4>Three rules that accompany every churn analysis</h4>\n<p><b>1. A count is not a rate.</b> A plan with 4 churners out of 7 customers is healthier than a plan with 3 churners out of 4. Always divide by the group size. This is mistake number one in churn reports, and on a 0/1 column it’s solved in one line: <code>mean()</code> of the churn column <b>is</b> the churn rate.</p>\n<p><b>2. A number without a comparison group isn't a finding.</b> "the average churned-customer age is 41" says nothing until you know the age of those who stayed. And compare churners against <b>retained customers</b>, not against all customers — all customers includes the churners themselves, and that comparison artificially shrinks the gap.</p>\n<p><b>3. Rate and sample size always together.</b> 75% churn on 4 customers isn’t a stable finding. Report the rate and the number of customers in the same table.</p>\n<h4>The main tool: groupby on the flag column</h4>\n<pre>df.groupby("plan")["churn"].mean()    # churn rate per plan\ndf.groupby("churn")["age"].mean()     # churners vs. retained in one line</pre>\n<p><b>Caveat:</b> 15 customers is an exercise, not a sample. We'll learn the technique here; a real business conclusion requires thousands of rows.</p>`,
          exercises: [
            {
              q: "<b>Step 1 — how bad is it?</b> Load <code>telecom-churn</code>. Print how many customers churned out of how many, and the overall churn rate in percent (rounded to one decimal place).",
          explain: "The task: the number every churn report opens with.\nThe key trick: when a column contains only 0 and 1, its <code>mean()</code> <b>is</b> the rate. The average of [0,1,1,0,...] is exactly the fraction of customers whose value is 1. No need to count and divide manually — but it's worth checking: <code>sum()</code> gives 7 and <code>shape[0]</code> gives 15, and 7/15 = 0.467. Two paths to the same answer are the cheapest sanity check there is.\nThe result: 7 out of 15, meaning 46.7%.\nWe showed both the numerator and the denominator, not just the percentage — rule 3 of the project. \"46.7%\" of 15 customers is a completely different number from \"46.7%\" of 15,000.\nCaveat: in the real world, 46.7% annual churn would be a disaster. Here it is simply a balanced demo dataset.",
              starter: "",
              solution: "df = data.load(\"telecom-churn\")\nchurned = df[\"churn\"].sum()\nrate = df[\"churn\"].mean() * 100\nprint(\"Churned:\", churned, \"out of\", df.shape[0])\nprint(\"Churn rate:\", round(rate, 1), \"%\")",
              check: (o,c)=>{const s=String(c||"").replace(/#[^\n]*/g,"");return /mean\(/.test(s) && /churn/.test(s) && /46\.7/.test(o) && /7/.test(o) && /15/.test(o);}
            },
            {
              q: "<b>Step 2 — which plan is worst?</b> Group by <code>plan</code> and calculate the churn <b>rate</b> for each plan (not the sum!). Build a table with the plan name, the number of customers in it, and the churn rate as a percentage.",
          explain: "This is the step where most reports in the world go wrong, so it's worth stopping on.\nIf you calculated the <b>sum</b> of churned customers you'd get premium 4, basic 3, and conclude that premium is the worse plan. That's a conclusion that's <b>the opposite of the truth</b>.\nThe sum ignores the size of the group. The actual rates:\nbasic — 3 churned out of 4 customers = 75.0%\npremium — 4 churned out of 7 customers = 57.1%\nstandard — 0 out of 4 = 0%\nIn other words, <b>basic is the worst plan</b>, and premium — which looked the worst by count — is in the middle. This is a base-rate error, the most classic mistake in segment analysis: a large group produces more cases even when it's healthier.\nAgain, the line that solves everything: in a column of 0s and 1s, <code>mean()</code> is the rate.\nAnd now the opposite caution, which is why we also printed the customers column: basic's 75% is based on just 4 customers. One customer changing their decision moves the rate by 25 points. Rate and sample size must appear together — otherwise you've swapped one mistake for another.\nAnd what about standard? 0% churn — this is the group worth learning from, not just ignoring.\nIn pandas: df.groupby(\"plan\")[\"churn\"].agg([\"mean\", \"count\"]).",
              starter: "",
              solution: "df = data.load(\"telecom-churn\")\ng = df.groupby(\"plan\")\nreport = g.agg({\"churn\": \"mean\"}).rename(columns={\"churn\": \"churn_rate\"})\nreport[\"customers\"] = list(g[\"churn\"].count())\nreport[\"churn_pct\"] = (report[\"churn_rate\"] * 100).round(1)\nprint(report[[\"plan\", \"customers\", \"churn_pct\"]])",
              check: (o,c)=>{const s=String(c||"").replace(/#[^\n]*/g,"");return /groupby/.test(s) && /mean/.test(s) && /75\.0/.test(o) && /57\.1/.test(o) && /basic/.test(o) && /premium/.test(o) && !/\[3, 4, 0\]/.test(o);}

            {
              q: "<b>Step 3 — who churns?</b> Group by <code>churn</code> and compare churned vs. retained customers: average age and average tenure (rounded to one decimal place).",
          explain: "The task: describe the churner — but <b>against a control group</b>.\n<code>df.groupby(\"churn\")</code> is the trick: grouping by the flag column itself gives both groups in a single line, instead of two separate filters. Row 0 = retained, row 1 = churned.\nthe results:\nAge — retained 38.6, churned 41.3. A difference of 2.7 years.\ntenure — retained 35.0 months, churned 41.7 months. A difference of 6.7 months.\nAnd now the interpretation, which is the important part: <b>these are not findings</b>. 2.7 years of age across 15 customers is noise, not a pattern. If we'd only printed \"average churned age 41\" it would have sounded like a discovery — and that's exactly why a control group is mandatory, not decoration. A number with nothing to compare it to can look meaningful almost every time.\nOne more caution: the churned customers are aged 27 to 58. An average over such a range hides more than it reveals. When the spread is wide, the median (<code>median</code>) or the range tell you more than the average.\nIn the next step we'll see a variable where the gap is indeed large.",
              starter: "",
              solution: "df = data.load(\"telecom-churn\")\nprint(df.groupby(\"churn\")[\"age\"].mean().round(1))\nprint(df.groupby(\"churn\")[\"tenure_months\"].mean().round(1))",
              check: (o,c)=>{const s=String(c||"").replace(/#[^\n]*/g,"");return /groupby/.test(s) && /mean/.test(s) && /38\.6/.test(o) && /41\.3/.test(o) && /35\.0/.test(o) && /41\.7/.test(o);}
            },
            {
              q: "<b>Step 4 — how much money is on the table?</b> Compare the average monthly bill of the churned customers to that of <b>the retained customers</b> (not of all customers!) and print both averages and the gap between them.",
          explain: "The task: are the customers who leave worth more or less than those who stay?\nThe result: churners 92.86, retained 83.91, a gap of 8.94 NIS per month — almost 11% more.\nThis is the strongest finding in the whole project, and it overturns step 1's conclusion: not only do 46.7% leave, but it's specifically the <b>high-value</b> customers who leave. The revenue loss is greater than the churn rate alone.\nAnd now the methodological rule that this exercise exists for. You could have compared the churners to the <b>average of all customers</b> (88.09) and gotten a gap of 4.77 — almost half the real gap. Why? Because all customers <b>includes the churners themselves</b>, meaning we compared a group to a group that contains it, and that always dulls the difference.\nThe rule: when comparing group A to group B, B must be the complement of A — whoever isn't A. Not \"everyone\".\nIn pandas, one line: df.groupby(\"churn\")[\"monthly_bill\"].mean().",
              starter: "",
              solution: "df = data.load(\"telecom-churn\")\nchurned = df[df[\"churn\"].eq(1)][\"monthly_bill\"].mean()\nstayed = df[df[\"churn\"].eq(0)][\"monthly_bill\"].mean()\nprint(\"Churned:\", round(churned, 2))\nprint(\"Stayed:\", round(stayed, 2))\nprint(\"Gap:\", round(churned - stayed, 2))",
              check: (o,c)=>{const s=String(c||"").replace(/#[^\n]*/g,"");return /mean\(/.test(s) && /92\.86/.test(o) && /83\.91/.test(o) && /8\.94/.test(o);}
            },
            {
              q: "<b>Step 5 — who is at risk now?</b> Based on the findings, define a risk segment: customers who have <b>not</b> churned yet, who pay more than 90 a month (like the churned ones), and whose tenure is under 60 months. Print them, their count, and the total monthly revenue at risk.",
          explain: "This is the step for which the entire analysis was done: turning a finding into an action list.\nNotice where the criterion came from — it wasn't invented, it's derived from step 4. There we saw that churned customers pay 92.86 on average, so <code>monthly_bill &gt; 90</code> defines \"a customer who pays like someone who's about to leave\". The tenure condition targets customers who haven't yet settled in, and <code>churn == 0</code> is mandatory — there's no point in an \"intervention\" for a customer who has already left. Three masks are combined with <code>&amp;</code>.\nThe result: two customers — 106 (95.0 NIS, 36 months) and 114 (100.0 NIS, 42 months), together 195.0 NIS per month.\nThree professional notes:\n1. <b>Check that every condition actually does something.</b> Here all three matter: without <code>churn == 0</code>, customer 110, who already left, would be included; without the tenure condition, customer 112 — an especially long-tenured customer (96 months) and thus arguably the safest — would be included; without the account condition the list would balloon. A condition that doesn't change the result is a dead condition — it looks like rigor but is nothing but noise.\n2. <b>Check that the segment isn't empty before continuing.</b> A threshold of ₪120 would have returned zero customers — not because there's no risk, but because the threshold is too tight for a 15-row table. When a segment comes out empty, you loosen the threshold deliberately and report it — you don't manufacture a finding.\n3. 195 NIS sounds negligible, and that's exactly the point: in a 15-row table every number is small. Run the exact same code on 150,000 customers, and then the last row is the one that justifies a retention budget.\n<b>Project summary:</b> 46.7% overall churn; basic is the problematic plan (75%), not premium; age and tenure barely distinguish; but churners pay 11% more than those who stay — meaning it's the pricier ones who leave. Recommendation: check what's broken in the basic plan, and reach out to customers 106 and 114 before they're next.",
              starter: "",
              solution: "df = data.load(\"telecom-churn\")\nat_risk = df[df[\"churn\"].eq(0) & df[\"monthly_bill\"].gt(90) & df[\"tenure_months\"].lt(60)]\nprint(at_risk[[\"customer_id\", \"monthly_bill\", \"tenure_months\"]])\nprint(\"At risk:\", at_risk.shape[0], \"| Monthly revenue at risk:\", at_risk[\"monthly_bill\"].sum())",

        {
          id: "pd-project-salary",
          icon: "💰",
          title: "Case Study: Salary gaps",
          theory: `<h3>Project: pay gaps between departments</h3>\n<p>HR wants a snapshot: what are the gaps between departments, is there an outlier department, and who stands out within their own department. The <code>salaries</code> table has 12 employees, each with a department, salary, and tenure.</p>\n<p>Five steps: average salary and size for each department, the size of the gap between the highest and lowest, checking whether seniority explains the gap, identifying the senior employees, and finally — who earns above their department's average.</p>\n<h4>Four warnings that accompany every salary analysis</h4>\n<p><b>1. Print labels, not just numbers.</b> <code>[17000.0, 24500.0, 13000.0]</code> is meaningless. Build a table where the department name sits next to its number.</p>\n<p><b>2. An average over 3-5 employees is fragile.</b> A single employee shifts the whole department average. Always report the employee count too.</p>\n<p><b>3. A gap is not discrimination.</b> Before concluding, look for an explanatory variable — here, tenure.</p>\n<p><b>4. Correlation is not causation</b>, especially when both variables are concentrated in the same class.</p>\n<h4>The project's tools</h4>\n<pre>g = df.groupby("department")\nreport = g.agg({"salary": "mean"})       # a table with a label for each number\nreport["employees"] = list(g["salary"].count())\n\navg = g["salary"].mean()\navg.idxmax()                             # the name of the leading class, not its position\ndf.nlargest(3, "years")                  # Top-N without manual sorting</pre>\n<h4>Group order</h4>\n<p>Here the groups appear in the order they occur in the data (Sales, R&amp;D, Marketing). In pandas, <code>groupby</code> sorts the keys alphabetically by default. So never rely on a group's <b>position</b> — rely on its name, and that's what <code>idxmax</code> and <code>idxmin</code> are for.</p>`,
          exercises: [
            {
              q: "<b>Step 1 — overview:</b> Load <code>salaries</code>. Build a report table with the average salary in each department <b>alongside the number of employees in it</b>. Print it.",
          explain: "The task: the first image every payroll report opens with.\nThe result: Sales 17,000 (5 employees), R&amp;D 24,500 (4), Marketing 13,000 (3).\nTwo design decisions worth adopting:\n1. <b>We built a table, not a list.</b> <code>[17000.0, 24500.0, 13000.0]</code> forces the reader to guess which number belongs to whom — and this is exactly where it's dangerous, because our group order is the order of appearance in the data, whereas in pandas it's alphabetical order. Same code, different order, a wrong report.\n2. <b>We added the number of employees.</b> An average of 24,500 over 4 employees isn't the same as an average of 24,500 over 400. Our Marketing is three people — any change to one of them shifts the average by 30%.\nA note on precision: the averages here are rounded to two decimal places. pandas does not round like this.\nIn pandas: df.groupby(\"department\")[\"salary\"].agg([\"mean\", \"count\"]).",
              starter: "",
              solution: "df = data.load(\"salaries\")\ng = df.groupby(\"department\")\nreport = g.agg({\"salary\": \"mean\"})\nreport[\"employees\"] = list(g[\"salary\"].count())\nprint(report)",
              check: (o,c)=>{const s=String(c||"").replace(/#[^\n]*/g,"");return /groupby/.test(s) && /mean/.test(s) && /(count|size)/.test(s) && /17000\.0/.test(o) && /24500\.0/.test(o) && /13000\.0/.test(o) && /Sales/.test(o) && /Marketing/.test(o) && !/Avi/.test(o);}
            },
            {
              q: "<b>Step 2 — the size of the gap:</b> find <b>which</b> department pays the most and which the least (by name, with <code>idxmax</code>/<code>idxmin</code>), and print both the difference in shekels and the ratio between them.",
          explain: "The task: translate the table into a single number you can say in a meeting.\n<code>idxmax()</code> returns the <b>label</b> of the maximum value — here \"R&amp;D\" — not its position. This is the only safe way to identify a group, because position varies between tools and between versions.\nThe result: R&amp;D 24,500 vs. Marketing 13,000. A difference of 11,500 NIS, a ratio of 1.88.\nTwo numbers, not one, deliberately: 11,500 answers \"how much money\", and 1.88 answers \"how big is the gap\". The ratio is the metric actually reported in salary analyses, because it's comparable across companies and years — 11,500 NIS means something completely different in a company where the average salary is 50,000.\nand a caveat that must accompany the number: it's calculated between an average of 4 employees and an average of 3. One senior employee leaving Marketing changes it completely. The gap is real; confidence in it is low.\nand before concluding \"discrimination\" — in the next step we'll check whether there's an explanation.",
              starter: "",
              solution: "df = data.load(\"salaries\")\navg = df.groupby(\"department\")[\"salary\"].mean()\nprint(\"Highest:\", avg.idxmax(), avg.max())\nprint(\"Lowest:\", avg.idxmin(), avg.min())\nprint(\"Gap:\", round(avg.max() - avg.min()), \"| Ratio:\", round(avg.max() / avg.min(), 2))",
              check: (o,c)=>{const s=String(c||"").replace(/#[^\n]*/g,"");return /groupby/.test(s) && /(idxmax|idxmin)/.test(s) && /11500/.test(o) && /1\.88/.test(o) && /R&D/.test(o) && /Marketing/.test(o);}
            },
            {
              q: "<b>Step 3 — Does tenure explain it?</b> Split the employees into veterans (<code>years</code> 5 and above) and juniors using a mask and <code>~</code>, and compare the average salary and the number of employees in each group. Also print the list of veterans.",
          explain: "The task: check whether there's a third variable that explains the gap from the previous step.\n<code>~vet</code> is the trick that saves you a second mask: the inverted mask is exactly \"everything else\", without writing a new condition that might not be an exact complement.\nResult: veterans 24,500 (4 employees), juniors 15,500 (8). A gap of 9,000 NIS \" — almost exactly the gap we found between the departments.\nAnd now look at the list of veterans: Benny, Hila, Hani, Yossi — <b>all R&amp;D</b>. And that's the whole department.\nIn other words, \"the veteran department\" and \"the paying department\" are exactly the same department, and this data can’t separate them. This is called <b>confounding</b>: two possible explanations — people pay more with tenure, or the R&amp;D field is more expensive in the market — and this data can’t decide between them.\nWhat else could be decisive? Veteran employees in Marketing and young employees in R&amp;D, which can be compared within the same department. Not here.\nThe honest conclusion for the report: \"The gap between departments is consistent with the seniority gap, but the data doesn't allow separating the two.\" Not \"seniority explains the gap.\"\nIn pandas you can also measure the strength of the relationship with a single number: df[\"years\"].corr(df[\"salary\"]) — here about 0.98, very high. But <code>corr</code> doesn't prove causation, and it would be high here too, in this exact confounded case.",
              starter: "",
              solution: "df = data.load(\"salaries\")\nvet = df[\"years\"].ge(5)\nprint(\"Veterans:\", round(df[vet][\"salary\"].mean()), \"|\", df[vet].shape[0], \"employees\")\nprint(\"Newcomers:\", round(df[~vet][\"salary\"].mean()), \"|\", df[~vet].shape[0], \"employees\")\nprint(df[vet][[\"name\", \"department\", \"years\", \"salary\"]])",
              check: (o,c)=>{const s=String(c||"").replace(/#[^\n]*/g,"");return /mean\(/.test(s) && /~/.test(s) && /24500/.test(o) && /15500/.test(o) && /Bni/.test(o) && /Hani/.test(o) && !/Dana/.test(o) && !/Carmel/.test(o);}
            },
            {
              q: "<b>Step 4 — who are the veterans:</b> use <code>nlargest</code> to find the three employees with the highest seniority and print their name, department, seniority and salary. Also print the top five, to see what happens at the boundary.",
          explain: "<code>nlargest(3, \"years\")</code> is the idiomatic way to do Top-N: it's equivalent to <code>sort_values(\"years\", ascending=False).head(3)</code> but shorter and clearer in its intent.\nThe result: Hani (8 years, 28,000), Hila (7, 25,000), Yossi (6, 23,000) — all three in R&amp;D, and the three highest salaries in the company. This reinforces the finding from the previous stage, and also reinforces its limitation.\nThat is why we printed five and not three: in fifth place sits Victor with 4 years — and Liat has exactly the same tenure. If HR had asked for \"the five most senior employees,\" one of the two would make the cut and the other would not, and the decision would fall to the original order in the table — in other words, completely arbitrary.\nThis is true in every real Top-N: <b>always check the boundary</b>. If there's a tie at the cutoff value, either extend the list, or add an explicit tie-breaking criterion (for example salary), or report that an arbitrary decision was made.\nIn pandas this works word for word, but don't access the result with <code>[0]</code>: after nlargest the original index is preserved, and <code>.iloc[0]</code> is the correct way.",
              starter: "",
              solution: "df = data.load(\"salaries\")\ntop3 = df.nlargest(3, \"years\")\nprint(top3[[\"name\", \"department\", \"years\", \"salary\"]])\nprint(df.sort_values(\"years\", ascending=False)[[\"name\", \"years\"]].head(5))",
              check: (o,c)=>{const s=String(c||"").replace(/#[^\n]*/g,"");return /(nlargest|sort_values)/.test(s) && /Hani/.test(o) && /Hila/.test(o) && /Yossi/.test(o) && /28000/.test(o) && /25000/.test(o) && /23000/.test(o) && !/Dana/.test(o);}
            },
            {
              q: "<b>Step 5 — outliers within the department:</b> who earns <b>above their department's average</b>? Calculate the average for each department, attach each employee's department average to them (<code>map</code> over a dictionary), and filter. Print the outliers and their count.",
          explain: "This is the wrap-up exercise, and it introduces a new pattern: comparing a <b>row against its group</b>, rather than against a global number.\nThe three steps:\n1. <code>groupby(\"department\")[\"salary\"].mean()</code> — average for each department.\n2. <code>df[\"department\"].map(dept_avg.to_dict())</code> — expands the three averages into a column of length 12, where each employee gets the average of <b>their department</b>. This is the step the whole exercise rests on.\n3. <code>df[\"salary\"].gt(df[\"dept_avg\"])</code> — comparison between two columns, row by row.\nThe result: Galit and Liat (Sales), Hila and Hani (R&amp;D), Zohar (Marketing) — 5 out of 12.\nNote Tal: exactly 17,000, which is exactly the Sales average. <code>gt</code> does not include equality, so it's excluded. When defining \"above average,\" this boundary needs to be set explicitly.\nAnd the statistical insight that makes this exercise interesting: in all three departments, there are <b>fewer</b> employees above the average than below it. That's not a coincidence — the average is pulled upward by the high values, so \"above average\" is almost always the minority. If HR were asking \"how many employees earn a reasonable salary\", the median would be a fairer measure than the average.\nA gap versus real pandas worth knowing: there, the second step is a dedicated and far more elegant function — <code>df.groupby(\"department\")[\"salary\"].transform(\"mean\")</code> returns a column the length of the table directly. <code>transform</code> doesn't exist in the simulator, hence the workaround via <code>map</code> on a dict. The idea is exactly the same.",

          title: "Case Study: Sales Analysis",
          theory: `<h3>Project: The Sales Year</h3>\n<p>The <code>sales</code> table has 12 months, and each month has revenue (<code>revenue</code>) and a unit count (<code>units</code>). We’ll build a full picture of the year in five steps: the annual total and its spread, the peak month, the average price per unit, the month-over-month rate of change, and finally a growth summary.</p>\n<h4>Three concepts before you start</h4>\n<p><b>Average price per unit</b> = revenue / units. Two months can sell for the same amount — one in many cheap units, the other in a few expensive ones. That's a substantial business difference, and it's invisible in revenue alone.</p>\n<p><b>Month-over-month change</b> (<code>pct_change</code>) = by what percentage turnover rose or fell compared to the previous month. The first month has no previous month, so it gets None — hence there are 11 measurements, not 12. This denominator must be reported.</p>\n<p><b>Seasonality</b>: in retail, December is always strong and February is always weak. So a 39% jump in December is not "growth" but seasonality. Real growth is measured against the same month a year earlier, and this dataset has no prior year. When reporting a number, state explicitly what it measures.</p>\n<h4>The project's tools</h4>\n<pre>df["avg_price"] = df["revenue"] / df["units"]     # vectorized calculated column\ndf.loc[df["revenue"].idxmax()]                    # the full row of the maximum\n(df["revenue"].pct_change() * 100).round(1)       # a readable report, not 12 digits\ndf.iloc[0:6]                                      # slicing a period by position</pre>\n<p><code>idxmax</code> returns the <b>label</b> of the maximum row, and <code>df.loc[...]</code> retrieves it in full — this way you see all the data for the peak month, not just its name.</p>`,
          exercises: [
            {
              q: "<b>Step 1 — the yearly picture:</b> load <code>sales</code>. Print the year's total revenue, the monthly average, and the strongest and weakest month (values only).",
          explain: "The task: four numbers that give a picture, instead of one that gives a headline.\nThe result: 720,000 total, 60,000 average per month, a peak of 89,000 and a low of 38,000.\n\"720,000 for the year\" on its own says nothing about the nature of the year. Combining the average with the range does: the strong month is 2.3 times the weak one, meaning this year isn’t a flat year — it has sharp seasonality. If we had reported only the average, a manager would build a forecast of 60,000 a month and be surprised twice a year.\nThe rule: a summary number always comes with a spread measure alongside it — range, standard deviation, or at least the maximum and minimum.\n<code>sum()</code>, <code>mean()</code>, <code>max()</code> and <code>min()</code> are exactly the same in pandas.",
              starter: "",
              solution: "df = data.load(\"sales\")\nprint(\"Annual total:\", df[\"revenue\"].sum())\nprint(\"Monthly average:\", round(df[\"revenue\"].mean()))\nprint(\"Peak:\", df[\"revenue\"].max(), \"| Low:\", df[\"revenue\"].min())",
              check: (o,c)=>{const s=String(c||"").replace(/#[^\n]*/g,"");return /sum\(/.test(s) && /mean\(/.test(s) && /720000/.test(o) && /60000/.test(o) && /89000/.test(o) && /38000/.test(o);}

            {
              q: "<b>Step 2 — peak month:</b> use <code>idxmax</code> and <code>.loc</code> to find the complete row for the month with the highest revenue, and print month, revenue and units. Also print the top three months.",
          explain: "<code>df[\"revenue\"].idxmax()</code> returns the row label where the maximum value is, and <code>df.loc[...]</code> retrieves the entire row. This way you get all the data for the peak month at once, not just its name.\nThe result: December, 89,000 NIS, 240 units.\nAnd the important cross-check: December is the peak month both in revenue and in units (240, the highest of the year). In other words the peak comes from <b>volume</b> and not from price — we sold more, not sold pricier. In the next step we will see that December is actually among the cheapest months per unit, and that is exactly the same story from the other side.\nTwo notes:\n1. Don't grab the first one after sorting with <code>[0]</code>. In pandas, sort_values preserves the original labels, so <code>df.sort_values(\"revenue\", ascending=False)[\"month\"][0]</code> will return <b>January</b> — the month that was in row 0 before the sort. A wrong answer, with no error message. <code>idxmax</code> or <code>.iloc[0]</code> are the correct ways.\n2. Seasonality: December is strong every year in retail. \"December was the best month\" is not a finding — it's the calendar.",
              starter: "",
              solution: "df = data.load(\"sales\")\npeak = df.loc[df[\"revenue\"].idxmax()]\nprint(peak[\"month\"], peak[\"revenue\"], peak[\"units\"])\nprint(df.sort_values(\"revenue\", ascending=False)[[\"month\", \"revenue\", \"units\"]].head(3))",
              check: (o,c)=>{const s=String(c||"").replace(/#[^\n]*/g,"");return /(idxmax|iloc)/.test(s) && /December/.test(o) && /89000/.test(o) && /240/.test(o) && !/January/.test(o);}

            {
              q: "<b>Step 3 — price per unit:</b> create a column <code>avg_price</code> (revenue divided by units) using a vectorized calculation, and find the month with the highest price per unit and the lowest. Also print the three most expensive with their unit quantities.",
          explain: "The result: February is the most expensive — 400.0 NIS per unit; June is the cheapest — 369.23.\nAnd now the crossover that turns the number into an insight: February is also the month with the <b>lowest</b> revenue (38,000), and December — the peak month — is among the cheapest (370.83). In other words, the pattern is: <b>selling a lot when prices are cut, and little when prices go up</b>. This is a plausible explanation for the seasonality we saw, and it suggests this is about promotions, not just demand.\nBut right after it comes a caveat that must appear in the report: all 12 prices range between 369 and 400 — a spread of only about 8%. \"The most expensive month\" sounds dramatic, but in practice February is 8% pricier than June. When the range is narrow, the words \"the highest\" are misleading if the range is not shown alongside them.\nWe also printed the units column specifically in the expensive-months table — to see that the expensive months are also the months with the lowest sales. Placing two measures side by side in the same table is what turns two facts into one story.\nIn pandas: df[\"avg_price\"] = df[\"revenue\"] / df[\"units\"] — word for word.",

              q: "<b>Step 4 — month-over-month change:</b> compute <code>pct_change</code> on revenue, convert to percentages and round to one decimal place, and print a table with the month name, revenue, and change.",
          explain: "The task: turn technical output into a report you can submit.\n<code>pct_change()</code> returns fractions with 12 digits after the decimal point: -0.1555555555555556. Nobody reads it like that. Two operations fix this: multiplying by 100 and rounding with <code>round(1)</code>. And we attached the result to the month name — a number without a label is not a report.\nThe result: January None, February -15.6%, March +36.8%, ... December +39.1%.\nThe None in the first row isn't a bug: January has no previous month to compare to. From this follows something easy to miss — there are <b>11 measurements here, not 12</b>, and every percentage you report in the next step needs to be relative to this denominator.\nAnd what do we see in the table? Massive volatility: from -18.3% in September to +39.1% in December. There's no smooth trend here, just sharp swings in both directions. This is exactly why at the aggregation stage (half versus half) you get a different, calmer picture — a 27% increase — which is the metric reported to management.\nIn pandas <code>pct_change</code> is identical, but returns NaN instead of None for the first value.",
              starter: "",
              solution: "df = data.load(\"sales\")\ndf[\"growth_pct\"] = (df[\"revenue\"].pct_change() * 100).round(1)\nprint(df[[\"month\", \"revenue\", \"growth_pct\"]])",
              check: (o,c)=>{const s=String(c||"").replace(/#[^\n]*/g,"");return /pct_change/.test(s) && /None/.test(o) && /-15\.6/.test(o) && /39\.1/.test(o) && /20\.8/.test(o) && /January/.test(o);}

              q: "<b>Step 5 — growth summary:</b> in how many months was growth positive, out of how many measurable months? And which month grew the most (use <code>idxmax</code>)?",
          explain: "The last exercise in the course, and it closes the story.\nThe result: 6 months of growth <b>out of 11</b>, and the strongest growth in December — 39.1%.\nPay attention to the denominator: 11, not 12. January gets None in pct_change, and <code>gt(0)</code> silently treats None as False — no error and no warning. Had you reported \"6 out of 12\" you'd have reported 50% instead of 55%. A row that silently disappears is the most common bug when working with missing values, and it's always worth checking how many values actually entered the calculation.\nAnd now let's gather all five steps into one picture: December is the peak month in revenue (89,000), the peak in units (240), the peak in growth (39.1%) — <b>and yet among the cheapest per unit</b> (370.83). In other words, December's success is built on volume, not margin, and likely on promotions.\nThe conclusion you could submit: the year grew — 27% between the first half and the second — but 6 rising months out of 11 is a volatile pattern, not a stable trend, and the peak is concentrated in a single seasonal month that sold cheap. Before declaring growth you need last year's data for comparison.\nThat's the difference between running functions and analyzing: the same four numbers, one story.",

              check: (o,c)=>{const s=String(c||"").replace(/#[^\n]*/g,"");return /pct_change/.test(s) && /gt\(/.test(s) && /idxmax/.test(s) && /6/.test(o) && /11/.test(o) && /December/.test(o) && /39\.1/.test(o);}

<script>
// ===== INLINED PYTHON_PRELUDE =====
