/* GAMIFICATION CSS */
/* ============================================================
   GAMIFICATION CSS — Mobile-first, RTL+LTR support
   ============================================================ */

/* ---- HUD (top fixed corner) ---- */
#gam-hud {
  position: fixed;

#gam-hud-btn .gam-xp {

  align-items: center;
  gap: 3px;

}
#gam-hud-btn .gam-streak { color: var(--tc53); }
#gam-hud-btn .gam-xp     { color: var(--tc54); }

/* ---- XP gain toast ---- */
.gam-toast {

[dir="rtl"] .gam-toast { left: 15px; }

.gam-toast-icon { font-size: 18px; margin-inline-end: 4px; }

#gam-panel {

  align-items: center;

<script>
// ===== EXERCISES DATA (100 questions) =====
// =============================================================
// 100 תרגילי פייתון - מהקשה לקל
// כולם תרגילי קוד חי הרצה בסימולטור Skulpt
// =============================================================

const EXERCISES_100 = [
  // ============== TIER 1: קשה (1-30) — פונקציות, מבני נתונים, לוגיקה ==============
  
  { num: 1, difficulty: 'hard', topic: 'קבצים + try/except',
    q: "כתוב פונקציה <code>load_data()</code> שמדמה טעינה מקובץ: בהינתן <code>raw = \"אלירן,32\\nתומר,28\"</code>, פצל לשורות, פצל כל שורה בפסיק, ובנה מילון שבו המפתח הוא השם והערך הוא הגיל כמספר שלם (<code>int</code>). החזר את המילון מהפונקציה, שמור אותו במשתנה והדפס אותו.",
    explain: "פירוק טקסט לשורות ואז לשדות הוא הצעד הראשון בכל טעינת קובץ: split('\\n') מפריד שורות, split(',') מפריד עמודות. שים לב ש-split תמיד מחזיר מחרוזות — הגיל '32' הוא טקסט עד שתמיר אותו ב-int(), ובלי ההמרה כל חישוב עליו ייכשל או יתנהג כשרשור. הצורה name, age = line.split(',') קריאה יותר מ-parts[0]/parts[1], אבל היא מתפוצצת אם בשורה יש מספר שדות אחר — לכן בקוד אמיתי בודקים את אורך הרשימה לפני הפירוק.",
    starter: '',
    solution: "raw = \"אלירן,32\\nתומר,28\"\n\ndef load_data():\n    result = {}\n    for line in raw.split(\"\\n\"):\n        name, age = line.split(\",\")\n        result[name] = int(age)\n    return result\n\ndata = load_data()\nprint(data)",
    expected: "{'אלירן': 32, 'תומר': 28}",
    check: (out, code) => { const c = code.replace(/#.*/g, ""); return /\{/.test(out) && /אלירן/.test(out) && /תומר/.test(out) && /32/.test(out) && /28/.test(out) && !/אלירן,32/.test(out) && /def\s+load_data/.test(c) && /\breturn\b/.test(c) && /\.split\s*\(/.test(c) && /load_data\s*\(\s*\)/.test(c.replace(/def\s+load_data\s*\(\s*\)/,"")); }
  },
  { num: 2, difficulty: 'hard', topic: 'while + לולאת תפריט',
    q: "בנה לולאת <code>while True</code> המדמה תפריט: היא עוברת אחד-אחד על <code>actions = [\"work\", \"rest\", \"exit\"]</code>, מדפיסה בכל איטרציה את הפעולה הנוכחית, וכשהיא מגיעה ל-<code>\"exit\"</code> מוסיפה <code>\"Finished\"</code> לרשימת <code>log</code> ושוברת. בסוף הדפס את <code>log</code>.",
    explain: "while True יוצר לולאה אינסופית שהיציאה ממנה היא באחריותך — break הוא היציאה. התבנית הזו נכונה כשלא ידוע מראש כמה איטרציות יהיו (תפריט שממתין לפקודת המשתמש), אבל היא מסוכנת: אם האינדקס i גדל בלי גבול ותנאי ה-break לא מתקיים, תקבל IndexError או לולאה תקועה. כשעוברים על רשימה שאורכה ידוע — for הוא הכלי הנכון.",
    starter: '',
    solution: 'actions = ["work", "rest", "exit"]\nlog = []\ni = 0\nwhile True:\n    action = actions[i]\n    print(action)\n    if action == "exit":\n        log.append("Finished")\n        break\n    i += 1\n\nprint(log)',
    expected: "work\nrest\nexit\n['Finished']",
    check: (out, code) => { const c = code.replace(/#.*/g, ""); return /work/.test(out) && /rest/.test(out) && /exit/.test(out) && /Finished/.test(out) && /while\s+True/.test(c) && /\bbreak\b/.test(c) && /actions\s*\[/.test(c) && /\.append\s*\(/.test(c); }
  },
  { num: 3, difficulty: 'hard', topic: 'רשימת מילונים',
    q: "תן: <code>products = [{\"name\": \"PC\", \"price\": 1000}, {\"name\": \"Mouse\", \"price\": 50}, {\"name\": \"Keyboard\", \"price\": 300}]</code>. כתוב פונקציה <code>get_expensive(items)</code> שמקבלת רשימת מוצרים ומחזירה רשימה של <b>שמות</b> המוצרים שמחירם מעל 100 (ולא את המילונים עצמם). הפעל אותה על <code>products</code> והדפס את התוצאה.",
    explain: "רשימת מילונים היא המבנה הכי נפוץ לייצוג טבלה בפייתון טהור — כל מילון הוא שורה וכל מפתח הוא עמודה. הלולאה עוברת שורה-שורה, התנאי מסנן, ו-append אוסף רק את מה שביקשו — כאן p['name'] ולא p כולו, אחרת מוחזרות שורות שלמות במקום שמות. אותה לוגיקה בשורה אחת: [p['name'] for p in items if p['price'] > 100].",
    starter: '',
    solution: 'products = [{"name": "PC", "price": 1000}, {"name": "Mouse", "price": 50}, {"name": "Keyboard", "price": 300}]\n\ndef get_expensive(items):\n    result = []\n    for p in items:\n        if p["price"] > 100:\n            result.append(p["name"])\n    return result\n\nprint(get_expensive(products))',
    expected: "['PC', 'Keyboard']",
    check: (out, code) => { const c = code.replace(/#.*/g, ""); return /\['PC',\s*'Keyboard'\]/.test(out) && !/price/.test(out) && !/Mouse/.test(out) && /def\s+get_expensive/.test(c) && /\breturn\b/.test(c) && /100/.test(c) && /get_expensive\s*\(\s*products\s*\)/.test(c); }
  },
  { num: 4, difficulty: 'hard', topic: 'try/except מרובה',
    q: "תפוס שתי שגיאות שונות בשני בלוקי <code>try</code> <b>נפרדים</b>: בבלוק הראשון חשב <code>10 / 0</code> ותפוס <code>ZeroDivisionError</code>, בבלוק השני חשב <code>int(\"abc\")</code> ותפוס <code>ValueError</code>. הדפס הודעה ייחודית לכל סוג שגיאה.",
    explain: "כל בלוק try נעצר בשגיאה הראשונה — כל מה שאחריה בתוך אותו try פשוט לא רץ. לכן כדי לבדוק שתי שגיאות שונות צריך שני בלוקי try נפרדים, ולא try אחד עם שני except. תפיסת סוג שגיאה ספציפי (ZeroDivisionError, ValueError) עדיפה על except חשוף, כי היא מטפלת רק במה שציפית לו ומשאירה באגים אמיתיים גלויים.",
    starter: '',
    solution: 'try:\n    print(10 / 0)\nexcept ZeroDivisionError:\n    print("Cannot divide by zero")\n\ntry:\n    print(int("abc"))\nexcept ValueError:\n    print("Please enter numbers only")',
    expected: 'Cannot divide by zero\nPlease enter numbers only',
    check: (out, code) => { const c = code.replace(/#.*/g, ""); return /Cannot divide by zero/.test(out) && /numbers only/.test(out) && (c.match(/\btry\s*:/g) || []).length >= 2 && /except\s+ZeroDivisionError/.test(c) && /except\s+ValueError/.test(c) && /10\s*\/\s*0/.test(c) && /int\s*\(\s*["']abc["']\s*\)/.test(c); }
  },
  { num: 5, difficulty: 'hard', topic: 'סטים - חיתוך',
    q: 'תן: <code>set_a = {1, 2, 3, 7}</code> ו-<code>set_b = {3, 4, 5, 7}</code>. הפק רשימה ממוינת של איברים משותפים בלבד.',
    explain: "חיתוך סטים עונה על 'מה משותף לשתי הקבוצות' בפעולה אחת, במקום לולאה כפולה עם in. הכתיב set_a & set_b זהה במשמעותו ל-set_a.intersection(set_b). כיוון שסט אינו שומר סדר, עוטפים ב-sorted() כדי לקבל פלט קבוע וניתן להשוואה — sorted מחזיר רשימה חדשה, בעוד ש-.sort() קיים רק על רשימות ומשנה אותן במקום.",
    starter: '',
    solution: 'set_a = {1, 2, 3, 7}\nset_b = {3, 4, 5, 7}\ncommon = list(set_a.intersection(set_b))\ncommon.sort()\nprint(common)',
    expected: '[3, 7]',
    check: (out, code) => { const c = code.replace(/#.*/g, ""); return /\[3,\s*7\]/.test(out) && /set_a\s*&\s*set_b|set_a\.intersection\s*\(\s*set_b|set_b\.intersection\s*\(\s*set_a/.test(c) && /sorted\s*\(|\.sort\s*\(/.test(c); }
  },
  { num: 6, difficulty: 'hard', topic: 'מילון דינמי',
    q: 'בנה <code>update_inventory(inventory, item)</code>: אם הפריט קיים, הוסף 1 לכמות. אם לא, הוסף עם כמות 1. הוסף "apple" שלוש פעמים ו-"banana" פעם אחת, הדפס את המילון.',
    explain: "מילון שמועבר לפונקציה מועבר כהפניה: הפונקציה משנה את המילון המקורי גם בלי return — לכן inventory מתעדכן אחרי הקריאות. תבנית if item in inv / else היא הצורה המפורשת; הקיצור המקצועי הוא inv[item] = inv.get(item, 0) + 1, שמחזיר 0 כשהמפתח חסר. אם תכתוב inv[item] += 1 בלי בדיקה תקבל KeyError בפעם הראשונה.",
    starter: '',
    solution: 'def update_inventory(inv, item):\n    if item in inv:\n        inv[item] += 1\n    else:\n        inv[item] = 1\n\ninventory = {}\nupdate_inventory(inventory, "apple")\nupdate_inventory(inventory, "apple")\nupdate_inventory(inventory, "apple")\nupdate_inventory(inventory, "banana")\nprint(inventory)',
    expected: "'apple': 3",
    check: (out, code) => /apple.*3/.test(out) && /banana.*1/.test(out) && /def\s+update_inventory/.test(code)
  },
  { num: 7, difficulty: 'hard', topic: 'מילון + f-string',
    q: "תן: <code>students = {\"Gal\": 95, \"Tomer\": 78, \"Yael\": 92, \"Dan\": 90, \"Noa\": 65}</code>. בלולאה הדפס רק את הסטודנטים שציונם <b>מעל</b> 90 (90 בדיוק אינו נכלל) בפורמט: <code>{name} got {grade}</code>.",
    explain: "for name, grade in students.items() פורק כל זוג מפתח-ערך לשני משתנים; בלי .items() הלולאה מחזירה מפתחות בלבד וה-grade לא היה קיים. שים לב לגבול: 'מעל 90' הוא > 90 ולכן סטודנט עם 90 בדיוק לא נכלל — החלפה ל->= היא הטעות הנפוצה ביותר בסינון, וכאן היא משנה את התוצאה.",
    starter: '',
    solution: "students = {\"Gal\": 95, \"Tomer\": 78, \"Yael\": 92, \"Dan\": 90, \"Noa\": 65}\nfor name, grade in students.items():\n    if grade > 90:\n        print(f\"{name} got {grade}\")",
    expected: "Gal got 95\nYael got 92",
    check: (out, code) => { const c = code.replace(/#.*/g, ""); return /Gal got 95/.test(out) && /Yael got 92/.test(out) && !/Tomer/.test(out) && !/Dan/.test(out) && !/Noa/.test(out) && /\.items\s*\(\s*\)/.test(c) && /f["']/.test(c) && /grade\s*>\s*90/.test(c); }
  },
  { num: 8, difficulty: 'hard', topic: 'פונקציה + default',
    q: 'בנה <code>calculate_discount(price, discount=0.10)</code> שמחזירה את המחיר אחרי הנחה. הפעל פעמיים: <code>(100)</code> ו-<code>(200, 0.25)</code>. הדפס תוצאות.',
    explain: "ערך ברירת מחדל הופך פרמטר לאופציונלי: קריאה עם ארגומנט אחד משתמשת ב-0.10, וקריאה עם שניים דורסת אותו. הכתיב 0.1 ו-0.10 זהים לחלוטין למחשב. שני כללים לזכור: פרמטר עם ברירת מחדל חייב לבוא אחרי פרמטרים בלעדיה, וברירת מחדל מסוג רשימה או מילון היא מלכודת — היא נוצרת פעם אחת ומשותפת לכל הקריאות.",
    starter: '',
    solution: 'def calculate_discount(price, discount=0.10):\n    return price - (price * discount)\n\nprint(calculate_discount(100))\nprint(calculate_discount(200, 0.25))',
    expected: '90.0\n150.0',
    check: (out, code) => { const c = code.replace(/#.*/g, ""); return /\b90(\.0)?\b/.test(out) && /\b150(\.0)?\b/.test(out) && /def\s+calculate_discount\s*\(\s*price\s*,\s*discount\s*=\s*0\.10?\b/.test(c) && /\breturn\b/.test(c) && /calculate_discount\s*\(\s*100\s*\)/.test(c) && /calculate_discount\s*\(\s*200\s*,\s*0\.25\s*\)/.test(c); }
  },
  { num: 9, difficulty: 'hard', topic: 'set לניקוי כפילויות',
    q: "תן: <code>words = [\"apple\", \"banana\", \"apple\", \"cherry\", \"banana\", \"date\"]</code>. הפק רשימה ללא כפילויות וממוינת אלפביתית (המיון הכרחי — סט אינו שומר סדר). הדפס את הרשימה ואת כמות האיברים הייחודיים.",
    explain: "set(words) מסיר כפילויות בשורה אחת, אבל משלם על כך בסדר: סט הוא אוסף לא מסודר, ולכן חייבים sorted() כדי לקבל פלט יציב. sorted() כבר מחזיר רשימה — list() סביבו מיותר. אם דווקא חשוב לשמור את סדר ההופעה המקורי, השתמש ב-list(dict.fromkeys(words)).",
    starter: '',
    solution: 'words = ["apple", "banana", "apple", "cherry", "banana", "date"]\nunique = sorted(list(set(words)))\nprint(unique)\nprint(len(unique))',
    expected: "['apple', 'banana', 'cherry', 'date']\n4",
    check: (out, code) => { const c = code.replace(/#.*/g, ""); return /\['apple',\s*'banana',\s*'cherry',\s*'date'\]/.test(out) && /\b4\b/.test(out) && /set\s*\(\s*words\s*\)/.test(c) && /sorted\s*\(|\.sort\s*\(/.test(c) && /len\s*\(/.test(c); }

<script>
// ===== APP LOGIC =====
let editors = {};
let currentTier = 'all';
const STORAGE_KEY = 'python_100_progress_v1';

function getProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}
function saveProgress(p) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch {}
}
function markDone(num) {
  const p = getProgress();
  p[num] = true;
  saveProgress(p);
  updateProgressUI();
}
function resetProgress() {
  saveProgress({});
  updateProgressUI();
}
function updateProgressUI() {
  const p = getProgress();
  const done = Object.keys(p).length;
  document.getElementById('progCount').textContent = done + '/100';
  document.getElementById('progFill').style.width = (done) + '%';
  // Update jump-nav buttons
  document.querySelectorAll('.jump-btn').forEach(b => {
    const n = parseInt(b.dataset.num);
    if (p[n]) b.classList.add('done');
    else b.classList.remove('done');
  });
  // Update exercise cards
  document.querySelectorAll('.exercise').forEach(e => {
    const n = parseInt(e.dataset.num);
    if (p[n]) e.classList.add('completed');
    else e.classList.remove('completed');
  });
}

function filterTier(tier) {
  currentTier = tier;
  document.querySelectorAll('.tier-tab').forEach(t => t.classList.toggle('active', t.dataset.tier === tier));
  document.querySelectorAll('.exercise').forEach(e => {
    e.style.display = (tier === 'all' || e.dataset.tier === tier) ? '' : 'none';
  });
  document.querySelectorAll('.jump-btn').forEach(b => {
    b.style.display = (tier === 'all' || b.dataset.tier === tier) ? '' : 'none';
  });
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderExercises() {
  const container = document.getElementById('exercises');
  const jumpNav = document.getElementById('jumpNav');
  
  // Jump nav
  jumpNav.innerHTML = EXERCISES_100.map(ex =>
    `<button class="jump-btn ${ex.difficulty}" data-num="${ex.num}" data-tier="${ex.difficulty}" onclick="jumpTo(${ex.num})">${ex.num}</button>`
  ).join('');
  
  // Exercises
  container.innerHTML = EXERCISES_100.map(ex => {
    const tierLabel = ex.difficulty === 'hard' ? 'קשה' : (ex.difficulty === 'medium' ? 'בינוני' : 'קל');
    return `
    <div class="exercise" id="ex-${ex.num}" data-num="${ex.num}" data-tier="${ex.difficulty}">
      <div class="ex-head">
        <div class="ex-num">${ex.num}</div>
        <span class="ex-tag ${ex.difficulty}">${tierLabel}</span>
        <span class="ex-topic">${escapeHtml(ex.topic)}</span>
        <div class="ex-q">${ex.q}</div>
      </div>
      <div class="editor-wrap">
        <div class="editor-bar">
          <span class="lang">Python</span>
          <span class="filler"></span>
          <button onclick="resetEditor(${ex.num})">איפוס</button>
        </div>
        <textarea id="code-${ex.num}" spellcheck="false">${escapeHtml(ex.starter || '')}</textarea>
      </div>
      <div class="btn-row">
        <button class="btn btn-run" onclick="checkAnswer(${ex.num})">▶ הרץ קוד</button>
        <button class="btn btn-solution" id="sol-btn-${ex.num}" onclick="showSolution(${ex.num})">הצג פתרון</button>
      </div>
      <div class="output-label" id="out-lbl-${ex.num}" style="display:none">פלט:</div>
      <div class="output-box" id="out-${ex.num}"></div>
      <div class="verdict" id="verdict-${ex.num}"></div>
      <div class="solution-panel" id="sol-panel-${ex.num}">
        <div class="solution-header">
          <span class="ico">💡</span>
          <span class="label">פתרון רשמי</span>
          <button class="copy-btn" onclick="copySolutionCode(${ex.num}, this)">📋 העתק</button>
        </div>
        <div class="solution-code" id="sol-code-${ex.num}">${escapeHtml(ex.solution)}</div>
        <div class="solution-note">השווה עם הקוד שלך — אבל אל תפסיק לחשוב!</div>
      </div>
    </div>`;
  }).join('');
  
  // Initialize CodeMirror
  EXERCISES_100.forEach(ex => {
    const ta = document.getElementById('code-' + ex.num);
    if (ta && typeof CodeMirror !== 'undefined') {
      const cm = CodeMirror.fromTextArea(ta, {
        mode: 'python', theme: 'dracula', lineNumbers: true,
        indentUnit: 4, autoCloseBrackets: true, direction: 'ltr',
        extraKeys: {
          'Tab': (c) => c.replaceSelection('    ', 'end'),
          'Ctrl-Enter': () => checkAnswer(ex.num),
          'Cmd-Enter': () => checkAnswer(ex.num),
          'Ctrl-Space': 'autocomplete'
        }
      });
      editors[ex.num] = cm;
    }
  });
  
  updateProgressUI();
}

function getCode(num) {
  return editors[num] ? editors[num].getValue() : (document.getElementById('code-' + num).value || '');
}
function setCode(num, val) {
  if (editors[num]) editors[num].setValue(val);
  else document.getElementById('code-' + num).value = val;
}

function resetEditor(num) {
  const ex = EXERCISES_100.find(e => e.num === num);
  if (!ex) return;
  setCode(num, ex.starter || '');
  document.getElementById('out-' + num).className = 'output-box';
  document.getElementById('out-lbl-' + num).style.display = 'none';
  document.getElementById('verdict-' + num).className = 'verdict';
}

function showSolution(num) {
  const panel = document.getElementById('sol-panel-' + num);
  const btn = document.getElementById('sol-btn-' + num);
  if (!panel) return;
  const isOpen = panel.classList.contains('show');
  if (isOpen) {
    panel.classList.remove('show');
    btn.textContent = 'הצג פתרון';
    btn.classList.remove('shown');
  } else {
    panel.classList.add('show');
    btn.textContent = 'הסתר פתרון';
    btn.classList.add('shown');
    setTimeout(() => panel.scrollIntoView({behavior:'smooth',block:'nearest'}), 100);
  }
}

function copySolutionCode(num, btnEl) {
  const codeEl = document.getElementById('sol-code-' + num);
  if (!codeEl) return;
  const text = codeEl.textContent;
  const doCopy = () => {
    btnEl.textContent = '✓ הועתק';
    btnEl.classList.add('copied');
    setTimeout(() => {
      btnEl.textContent = '📋 העתק';
      btnEl.classList.remove('copied');
    }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(doCopy, () => fallbackCopy(text, doCopy));
  } else { fallbackCopy(text, doCopy); }
}

function fallbackCopy(text, callback) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-100px;left:0;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); callback(); } catch(e) {}
  document.body.removeChild(ta);
}

function jumpTo(num) {
  const el = document.getElementById('ex-' + num);
  if (!el) return;
  el.scrollIntoView({behavior: 'smooth', block: 'start'});
  el.style.boxShadow = '0 0 0 3px var(--cyan)';
  setTimeout(() => { el.style.boxShadow = ''; }, 1200);
}

async function checkAnswer(num) {
  const ex = EXERCISES_100.find(e => e.num === num);
  if (!ex) return;
  const code = getCode(num);
  
  const outBox = document.getElementById('out-' + num);
  const outLbl = document.getElementById('out-lbl-' + num);
  const verdict = document.getElementById('verdict-' + num);
  outBox.className = 'output-box show';
  outLbl.style.display = 'block';
  outBox.textContent = 'מריץ...';
  verdict.className = 'verdict';
  
  if (typeof Sk === 'undefined') {
    outBox.textContent = 'Skulpt לא נטען. רענן את הדף.';
    outBox.classList.add('err');
    return;
  }
  
  let output = '';
  let runError = null;
  
  try {
    await new Promise((resolve) => {
      Sk.configure({
        output: (t) => { output += t; },
        read: (f) => {
          if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][f] === undefined) {
            throw "File not found: '" + f + "'";
          }
          return Sk.builtinFiles["files"][f];
        },
        __future__: Sk.python3, execLimit: 5000
      });
      Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, code, true))
        .then(() => resolve())
        .catch((e) => { runError = e.toString(); resolve(); });
    });
  } catch (e) { runError = String(e); }
  
  if (runError) {
    outBox.className = 'output-box err show';
    outBox.textContent = (output ? output + '\n\n' : '') + 'שגיאה: ' + runError;
    verdict.className = 'verdict failure show';
    verdict.textContent = 'יש שגיאה בקוד. תקרא את ההודעה ותתקן.';
    return;
  }
  
  outBox.textContent = output || '(אין פלט)';
  outBox.className = 'output-box show';
  
  // Run check
  let passed = false;
  try {
    if (typeof ex.check === 'function') {
      passed = ex.check(output, code);
    } else if (ex.expected) {
      passed = output.trim() === ex.expected.trim() || output.includes(ex.expected);
    }
  } catch (e) { passed = false; }
  
  if (passed) {
    verdict.className = 'verdict success show';
    verdict.textContent = '✓ מצוין! התשובה נכונה.';
    if (ex.explain) {
      const _w = document.createElement('div');
      _w.className = 'why-box';
      _w.innerHTML = '<div class="why-title">למה זה עובד</div>' + ex.explain;
      verdict.appendChild(_w);
    }
    markDone(num);

    try {
      const btn = document.getElementById('sol-btn-' + num);
      const usedSolution = btn && btn.classList.contains('shown');
      if (window.gam && window.gam.markExercisePassed) {
        window.gam.markExercisePassed('quiz-python-100', num, usedSolution);
      }
    } catch(e) { console.warn('gam err:', e); }

  } else {
    verdict.className = 'verdict failure show';
    verdict.textContent = 'הפלט שונה ממה שמצופה. נסה שוב או לחץ על "הצג פתרון".';
  }
}

// Init
if (typeof Sk !== 'undefined' && typeof CodeMirror !== 'undefined') {
  renderExercises();
} else {
  window.addEventListener('load', () => setTimeout(renderExercises, 100));
}
</script>

    keepGoing: 'Keep going!',
    perfectDay: 'Perfect day!',
    earned: 'Earned',
    nextLevel: 'to next level',
    weeklyGoal: 'Weekly Goal',
    daysLeft: (n) => `${n} days left`,
    streakInfo: 'Open the site today to keep your streak alive!',
    xpToNext: (n) => `${n} XP to next level`,
  };
  
  // ---- XP rewards ----
  const XP_REWARDS = {
    EXERCISE_PASS: 10,
    EXERCISE_PASS_NO_HINT: 15,    // bonus if didn't see solution
    QUIZ_PASS: 20,
    MODULE_COMPLETE: 50,
    FIRST_RUN_OF_DAY: 5,           // bonus for opening site each day
    STREAK_BONUS: (days) => Math.min(days * 2, 30),  // bonus per streak day, capped
  };
  
  // ---- Storage keys ----
  const STORAGE = {
    XP: 'gam_xp',
    STREAK: 'gam_streak',
    LAST_DATE: 'gam_lastDate',
    LONGEST_STREAK: 'gam_longest',
    BADGES: 'gam_badges',
    PASSED_EXERCISES: 'gam_passedEx',
    USAGE_DAYS: 'gam_days',
    DAILY_XP: 'gam_dailyXP',
  };
  
  // ---- Storage helpers ----
  function getXP() { return parseInt(localStorage.getItem(STORAGE.XP) || '0', 10); }
  function setXP(n) { localStorage.setItem(STORAGE.XP, n); updateUI(); }
  function addXP(amount, reason) {
    const cur = getXP();
    const newXP = cur + amount;
    setXP(newXP);
    
    // Track daily XP
    const today = todayStr();
    const dailyData = JSON.parse(localStorage.getItem(STORAGE.DAILY_XP) || '{}');
    dailyData[today] = (dailyData[today] || 0) + amount;
    localStorage.setItem(STORAGE.DAILY_XP, JSON.stringify(dailyData));
    
    showXPGain(amount, reason);
    checkLevelUp(cur, newXP);
    checkBadges();
  }
  
  function getStreak() { return parseInt(localStorage.getItem(STORAGE.STREAK) || '0', 10); }
  function setStreak(n) {
    localStorage.setItem(STORAGE.STREAK, n);
    const longest = parseInt(localStorage.getItem(STORAGE.LONGEST_STREAK) || '0', 10);
    if (n > longest) localStorage.setItem(STORAGE.LONGEST_STREAK, n);
    updateUI();
  }
  
  function getBadges() {
    try { return JSON.parse(localStorage.getItem(STORAGE.BADGES) || '[]'); }
    catch (e) { return []; }
  }
  function addBadge(id) {
    const badges = getBadges();
    if (!badges.includes(id)) {
      badges.push(id);
      localStorage.setItem(STORAGE.BADGES, JSON.stringify(badges));
      const def = BADGE_DEFS.find(b => b.id === id);
      if (def) showBadgeUnlock(def);
      return true;
    }
    return false;
  }
  
  function getPassedExercises() {
    try { return JSON.parse(localStorage.getItem(STORAGE.PASSED_EXERCISES) || '{}'); }
    catch (e) { return {}; }
  }
  function markExercisePassed(courseId, exId, usedSolution) {
    const passed = getPassedExercises();
    if (!passed[courseId]) passed[courseId] = {};
    if (!passed[courseId][exId]) {
      passed[courseId][exId] = { date: todayStr(), used: !!usedSolution };
      localStorage.setItem(STORAGE.PASSED_EXERCISES, JSON.stringify(passed));
      
      const xp = usedSolution ? XP_REWARDS.EXERCISE_PASS : XP_REWARDS.EXERCISE_PASS_NO_HINT;
      addXP(xp, IS_RTL ? 'תרגיל הושלם!' : 'Exercise complete!');
      return true;
    }
    return false;
  }
  
  // ---- Date helpers ----
  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function daysBetween(d1Str, d2Str) {
    const d1 = new Date(d1Str);
    const d2 = new Date(d2Str);
    return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
  }
  
  // ---- Streak logic ----
  function updateStreakOnLoad() {
    const lastDate = localStorage.getItem(STORAGE.LAST_DATE);
    const today = todayStr();
    if (!lastDate) {
      // First visit
      localStorage.setItem(STORAGE.LAST_DATE, today);
      setStreak(1);
      addBadge('first_day');
      showToast(T.streakFirst, '🎯');
      return;
    }
    if (lastDate === today) return;  // Already counted today
    
    const diff = daysBetween(lastDate, today);
    if (diff === 1) {
      // Continued streak
      const newStreak = getStreak() + 1;
      setStreak(newStreak);
      localStorage.setItem(STORAGE.LAST_DATE, today);
      addXP(XP_REWARDS.FIRST_RUN_OF_DAY + XP_REWARDS.STREAK_BONUS(newStreak), T.streakAlive(newStreak));
    } else if (diff > 1) {
      // Streak broken
      const oldStreak = getStreak();
      if (oldStreak > 1) {
        showToast(T.streakBroken, '💔');
      }
      setStreak(1);
      localStorage.setItem(STORAGE.LAST_DATE, today);
      addXP(XP_REWARDS.FIRST_RUN_OF_DAY, IS_RTL ? 'התחלת רצף חדש' : 'New streak started');
    }
    
    // Track usage day
    const days = JSON.parse(localStorage.getItem(STORAGE.USAGE_DAYS) || '[]');
    if (!days.includes(today)) {
      days.push(today);
      localStorage.setItem(STORAGE.USAGE_DAYS, JSON.stringify(days));
    }
  }
  
  // ---- Level system ----
  // XP needed for each level: 0, 50, 150, 300, 500, 800, 1200, 1700, 2300, 3000, 4000, 5500, 7500, ...
  function levelForXP(xp) {
    const thresholds = [0, 50, 150, 300, 500, 800, 1200, 1700, 2300, 3000, 4000, 5500, 7500, 10000];
    for (let i = thresholds.length - 1; i >= 0; i--) {
      if (xp >= thresholds[i]) return i + 1;
    }
    return 1;
  }
  function xpForLevel(level) {
    const thresholds = [0, 50, 150, 300, 500, 800, 1200, 1700, 2300, 3000, 4000, 5500, 7500, 10000];
    return thresholds[level - 1] || (10000 + (level - 14) * 2500);
  }
  function checkLevelUp(oldXP, newXP) {
    const oldLvl = levelForXP(oldXP);
    const newLvl = levelForXP(newXP);
    if (newLvl > oldLvl) {
      showLevelUp(newLvl);
      // Badge for reaching levels
      if (newLvl === 5) addBadge('level_5');
      if (newLvl === 10) addBadge('level_10');
    }
  }
  
  // ---- Badge definitions ----
  const BADGE_DEFS = [
    { id: 'first_day',  icon: '🎯', name_he: 'יום ראשון',    name_en: 'First Day',    desc_he: 'התחלת ללמוד!',                   desc_en: 'Started learning!' },
    { id: 'first_ex',   icon: '🐣', name_he: 'תרגיל ראשון',  name_en: 'First Exercise',desc_he: 'פתרת תרגיל ראשון',              desc_en: 'Solved your first exercise' },
    { id: 'streak_3',   icon: '🔥', name_he: '3 ימים ברצף', name_en: '3-Day Streak', desc_he: 'התמדה!',                          desc_en: 'Consistency!' },
    { id: 'streak_7',   icon: '⚡', name_he: 'שבוע ברצף',   name_en: '7-Day Streak', desc_he: 'אלוף של שבוע',                    desc_en: 'A week champion' },
    { id: 'streak_30',  icon: '🏆', name_he: 'חודש ברצף',   name_en: '30-Day Streak',desc_he: 'אגדה',                            desc_en: 'Legend' },
    { id: 'ex_10',      icon: '⭐', name_he: '10 תרגילים',   name_en: '10 Exercises', desc_he: '10 תרגילים נפתרו',                desc_en: '10 exercises solved' },
    { id: 'ex_50',      icon: '🌟', name_he: '50 תרגילים',   name_en: '50 Exercises', desc_he: '50 תרגילים נפתרו',                desc_en: '50 exercises solved' },
    { id: 'ex_100',     icon: '💯', name_he: '100 תרגילים',  name_en: '100 Exercises',desc_he: '100 תרגילים — מקצוען!',           desc_en: '100 exercises — pro!' },
    { id: 'ex_200',     icon: '👑', name_he: '200 תרגילים',  name_en: '200 Exercises',desc_he: 'אלוף האלופים',                    desc_en: 'Champion of champions' },
    { id: 'python_pro', icon: '🐍', name_he: 'Python Pro',  name_en: 'Python Pro',   desc_he: 'סיימת את קורס Python',           desc_en: 'Completed Python course' },
    { id: 'pandas_pro', icon: '🐼', name_he: 'Pandas Pro',  name_en: 'Pandas Pro',   desc_he: 'סיימת את קורס Pandas',           desc_en: 'Completed Pandas course' },
    { id: 'quiz_pro',   icon: '🎓', name_he: 'מומחה חידון',  name_en: 'Quiz Master',  desc_he: 'סיימת 100 שאלות חידון',           desc_en: 'Aced 100 quiz questions' },
    { id: 'level_5',    icon: '🎖️', name_he: 'רמה 5',       name_en: 'Level 5',      desc_he: 'הגעת לרמה 5',                    desc_en: 'Reached Level 5' },
    { id: 'level_10',   icon: '🏅', name_he: 'רמה 10',      name_en: 'Level 10',     desc_he: 'הגעת לרמה 10',                   desc_en: 'Reached Level 10' },
    { id: 'no_hints',   icon: '🧠', name_he: '10 בלי רמזים', name_en: 'No Hints',    desc_he: '10 תרגילים בלי לראות פתרון',     desc_en: '10 exercises without solution' },
  ];
  
  function checkBadges() {
    const passed = getPassedExercises();
    let totalPassed = 0;
    let noHintCount = 0;
    let pythonCount = 0, pandasCount = 0, quizCount = 0;
    
    Object.entries(passed).forEach(([course, exs]) => {
      const count = Object.keys(exs).length;
      totalPassed += count;
      Object.values(exs).forEach(ex => { if (!ex.used) noHintCount++; });
      if (course === 'python-lesson') pythonCount = count;
      if (course === 'pandas-lesson') pandasCount = count;
      if (course === 'quiz-python-100') quizCount = count;
    });
    
    if (totalPassed >= 1)   addBadge('first_ex');
    if (totalPassed >= 10)  addBadge('ex_10');
    if (totalPassed >= 50)  addBadge('ex_50');
    if (totalPassed >= 100) addBadge('ex_100');
    if (totalPassed >= 200) addBadge('ex_200');
    if (noHintCount >= 10)  addBadge('no_hints');
    if (pythonCount >= 170) addBadge('python_pro');
    if (pandasCount >= 150) addBadge('pandas_pro');
    if (quizCount >= 100)   addBadge('quiz_pro');
    
    const streak = getStreak();
    if (streak >= 3)  addBadge('streak_3');
    if (streak >= 7)  addBadge('streak_7');
    if (streak >= 30) addBadge('streak_30');
  }
  
  // ---- UI: HUD (top corner) ----
  function buildHUD() {
    if (document.getElementById('gam-hud')) return;
    
    const hud = document.createElement('div');
    hud.id = 'gam-hud';
    hud.innerHTML = `
      <button id="gam-hud-btn" aria-label="${T.progressTitle}">
        <span class="gam-streak">🔥 <span id="gam-streak-num">0</span></span>
        <span class="gam-xp">⭐ <span id="gam-xp-num">0</span></span>
      </button>
    `;
    document.body.appendChild(hud);
    document.getElementById('gam-hud-btn').addEventListener('click', openPanel);
  }
  
  function updateUI() {
    const xpEl = document.getElementById('gam-xp-num');
    const stEl = document.getElementById('gam-streak-num');
    if (xpEl) xpEl.textContent = getXP();
    if (stEl) stEl.textContent = getStreak();
  }
  
  // ---- UI: XP gain animation ----
  function showXPGain(amount, reason) {
    const div = document.createElement('div');
    div.className = 'gam-toast gam-toast-xp';
    div.innerHTML = `<span class="gam-toast-icon">⭐</span> <strong>+${amount} ${T.xp}</strong>${reason ? `<br><small>${reason}</small>` : ''}`;
    document.body.appendChild(div);
    setTimeout(() => div.classList.add('show'), 10);
    setTimeout(() => { div.classList.remove('show'); setTimeout(() => div.remove(), 400); }, 2500);
  }
  
  function showToast(message, icon) {
    const div = document.createElement('div');
    div.className = 'gam-toast';
    div.innerHTML = `<span class="gam-toast-icon">${icon || '🎉'}</span> ${message}`;
    document.body.appendChild(div);
    setTimeout(() => div.classList.add('show'), 10);
    setTimeout(() => { div.classList.remove('show'); setTimeout(() => div.remove(), 400); }, 3000);
  }
  
  function showLevelUp(level) {
    const div = document.createElement('div');
    div.className = 'gam-celebration';
    div.innerHTML = `
      <div class="gam-celebration-inner">
        <div class="gam-celebration-icon">🎉</div>
        <h2>${T.levelUp}</h2>
        <div class="gam-level-badge">${T.level} ${level}</div>
        <button class="gam-celebration-close">${T.close}</button>
      </div>
    `;
    document.body.appendChild(div);
    setTimeout(() => div.classList.add('show'), 10);
    // סגירה מרוכזת: כפתור, לחיצה מחוץ לחלון, מקש Escape, וסגירה אוטומטית.
    // בלי אלה החלון נשאר פרוס על כל המסך (z-index 10000) וחוסם כל לחיצה בדף.
    var __closed = false;
    var __auto;
    var __closeCel = function () {
      if (__closed) return;
      __closed = true;
      clearTimeout(__auto);
      document.removeEventListener('keydown', __onKey);
      div.classList.remove('show');
      setTimeout(function () { div.remove(); }, 400);
    };
    var __onKey = function (e) { if (e.key === 'Escape') __closeCel(); };
    __auto = setTimeout(__closeCel, 6000);
    div.querySelector('.gam-celebration-close').addEventListener('click', __closeCel);
    div.addEventListener('click', function (e) { if (e.target === div) __closeCel(); });
    document.addEventListener('keydown', __onKey);
  }
  
  function showBadgeUnlock(badge) {
    const name = IS_RTL ? badge.name_he : badge.name_en;
    const desc = IS_RTL ? badge.desc_he : badge.desc_en;
    const div = document.createElement('div');
    div.className = 'gam-celebration gam-badge-unlock';
    div.innerHTML = `
      <div class="gam-celebration-inner">
        <div class="gam-badge-icon-big">${badge.icon}</div>
        <h3>${T.newBadge}</h3>
        <h2>${name}</h2>
        <p>${desc}</p>
        <button class="gam-celebration-close">${T.close}</button>
      </div>
    `;
    document.body.appendChild(div);
    setTimeout(() => div.classList.add('show'), 10);
    // סגירה מרוכזת: כפתור, לחיצה מחוץ לחלון, מקש Escape, וסגירה אוטומטית.
    // בלי אלה החלון נשאר פרוס על כל המסך (z-index 10000) וחוסם כל לחיצה בדף.
    var __closed = false;
    var __auto;
    var __closeCel = function () {
      if (__closed) return;
      __closed = true;
      clearTimeout(__auto);
      document.removeEventListener('keydown', __onKey);
      div.classList.remove('show');
      setTimeout(function () { div.remove(); }, 400);
    };
    var __onKey = function (e) { if (e.key === 'Escape') __closeCel(); };
    __auto = setTimeout(__closeCel, 6000);
    div.querySelector('.gam-celebration-close').addEventListener('click', __closeCel);
    div.addEventListener('click', function (e) { if (e.target === div) __closeCel(); });
    document.addEventListener('keydown', __onKey);
  }
  
  // ---- UI: Progress Panel ----
  function openPanel() {
    if (document.getElementById('gam-panel')) return;
    
    const xp = getXP();
    const streak = getStreak();
    const longest = parseInt(localStorage.getItem(STORAGE.LONGEST_STREAK) || '0', 10);
    const level = levelForXP(xp);
    const nextLevelXP = xpForLevel(level + 1);
    const currentLevelXP = xpForLevel(level);
    const progressPct = Math.floor(((xp - currentLevelXP) / (nextLevelXP - currentLevelXP)) * 100);
    const xpToNext = nextLevelXP - xp;
    
    const earnedBadges = getBadges();
    const passed = getPassedExercises();
    let totalPassed = 0;
    Object.values(passed).forEach(exs => { totalPassed += Object.keys(exs).length; });
    
    const badgesHTML = BADGE_DEFS.map(b => {
      const earned = earnedBadges.includes(b.id);
      const name = IS_RTL ? b.name_he : b.name_en;
      const desc = IS_RTL ? b.desc_he : b.desc_en;
      return `
        <div class="gam-badge ${earned ? 'earned' : 'locked'}" title="${desc}">
          <div class="gam-badge-icon">${b.icon}</div>
          <div class="gam-badge-name">${name}</div>
        </div>
      `;
    }).join('');
    
    // Last 7 days activity
    const dailyData = JSON.parse(localStorage.getItem(STORAGE.DAILY_XP) || '{}');
    const last7 = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      last7.push({ date: ds, xp: dailyData[ds] || 0, label: d.toLocaleDateString(IS_RTL ? 'he-IL' : 'en-US', { weekday: 'short' }) });
    }
    const maxXP = Math.max(...last7.map(d => d.xp), 1);
    const chartHTML = last7.map(d => `
      <div class="gam-chart-bar">
        <div class="gam-chart-fill" style="height: ${(d.xp / maxXP) * 100}%"></div>
        <div class="gam-chart-label">${d.label}</div>
        <div class="gam-chart-val">${d.xp || ''}</div>
      </div>
    `).join('');
    
    const panel = document.createElement('div');
    panel.id = 'gam-panel';
    panel.innerHTML = `
      <div class="gam-panel-inner" role="dialog">
        <button class="gam-panel-close" aria-label="${T.close}">&times;</button>
        <h2 class="gam-panel-title">${T.progressTitle}</h2>
        
        <div class="gam-stats">
          <div class="gam-stat">
            <div class="gam-stat-icon">⭐</div>
            <div class="gam-stat-val">${xp.toLocaleString()}</div>
            <div class="gam-stat-label">${T.xp}</div>
          </div>
          <div class="gam-stat">
            <div class="gam-stat-icon">🔥</div>
            <div class="gam-stat-val">${streak}</div>
            <div class="gam-stat-label">${T.streak}</div>
          </div>
          <div class="gam-stat">
            <div class="gam-stat-icon">🎖️</div>
            <div class="gam-stat-val">${level}</div>
            <div class="gam-stat-label">${T.level}</div>
          </div>
        </div>
        
        <div class="gam-progress-box">
          <div class="gam-progress-header">
            <span>${T.level} ${level}</span>
            <span>${T.level} ${level + 1}</span>
          </div>
          <div class="gam-progress-bar">
            <div class="gam-progress-fill" style="width: ${Math.max(0, Math.min(100, progressPct))}%"></div>
          </div>
          <div class="gam-progress-text">${T.xpToNext(xpToNext)}</div>
        </div>
        
        <div class="gam-section-title">${IS_RTL ? '📈 פעילות שבועית' : '📈 Weekly Activity'}</div>
        <div class="gam-chart">${chartHTML}</div>
        
        <div class="gam-section-title">${T.achievements} (${earnedBadges.length}/${BADGE_DEFS.length})</div>
        <div class="gam-badges">${badgesHTML}</div>
        
        <div class="gam-footer">
          <div>${IS_RTL ? 'תרגילים נפתרו' : 'Exercises solved'}: <strong>${totalPassed}</strong></div>
          <div>${IS_RTL ? 'הרצף הכי ארוך שלך' : 'Longest streak'}: <strong>${longest}</strong> ${T.streakDays(longest)}</div>
        </div>
      </div>
    `;
    document.body.appendChild(panel);
    setTimeout(() => panel.classList.add('show'), 10);
    
    panel.querySelector('.gam-panel-close').addEventListener('click', closePanel);
    panel.addEventListener('click', e => {
      if (e.target === panel) closePanel();
    });
  }
  function closePanel() {
    const p = document.getElementById('gam-panel');
    if (p) { p.classList.remove('show'); setTimeout(() => p.remove(), 300); }
  }
  
  // ---- Public API ----
  window.gam = {
    addXP: addXP,
    markExercisePassed: markExercisePassed,
    completeModule: function(moduleName) {
      addXP(XP_REWARDS.MODULE_COMPLETE, IS_RTL ? `מודול הושלם: ${moduleName}` : `Module complete: ${moduleName}`);
    },
    open: openPanel,
    getXP: getXP,
    getStreak: getStreak,
    getBadges: getBadges,
  };
  
  // ---- Init ----
  function init() {
    buildHUD();
    updateUI();
    updateStreakOnLoad();
    checkBadges();
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>

<script>
/* AI ERROR HELPER */
/* ============================================================
   AI ERROR HELPER — Smart error explanations
   No external API needed - uses pattern matching + offline rules
   Works in Hebrew (RTL) and English (LTR)
   ============================================================ */

(function() {
  'use strict';
  
  const IS_RTL = document.documentElement.dir === 'rtl' || document.documentElement.lang === 'he';
  
  // ---- Error patterns and explanations ----
  // Each entry: { match: regex, he: explanation, en: explanation, hint: suggestion }
  const ERROR_PATTERNS = [
    {
      match: /NameError.*name '(\w+)' is not defined/i,
      he: (m) => `<b>NameError</b>: המשתנה <code>${m[1]}</code> לא הוגדר. 🤔`,
      en: (m) => `<b>NameError</b>: The variable <code>${m[1]}</code> is not defined. 🤔`,
      hint_he: (m) => [
        `📝 בדוק שלא שכחת להגדיר את המשתנה לפני שאתה משתמש בו.`,
        `🔤 ייתכן שיש typo (שגיאת כתיב) בשם המשתנה — שמות בפייתון רגישים לאותיות גדולות/קטנות.`,
        `💡 דוגמה תקינה: <code>${m[1]} = 10</code> ואז <code>print(${m[1]})</code>`,
      ],
      hint_en: (m) => [
        `📝 Check that you defined the variable before using it.`,
        `🔤 There may be a typo in the name — Python names are case-sensitive.`,
        `💡 Valid example: <code>${m[1]} = 10</code> then <code>print(${m[1]})</code>`,
      ],
    },
    {

        `📏 ודא שכל השורות באותו בלוק מוזחות באותה כמות.`,

      hint_en: (m) => [
        `🔍 Check the key spelling — dictionary keys are case-sensitive.`,
        `🛡 Use <code>.get()</code> for safe access: <code>dict.get("${m[1] || 'key'}", "default")</code>`,
        `🔍 Check if key exists with <code>if "${m[1] || 'key'}" in dict:</code>`,
      ],
    },
    {
      match: /ValueError.*invalid literal for int/i,
      he: () => `<b>ValueError</b>: ניסית להמיר מחרוזת שאינה מספר ל-int. 🔢`,
      en: () => `<b>ValueError</b>: Tried converting a non-numeric string to int. 🔢`,
      hint_he: () => [
        `🔍 רק מחרוזות עם ספרות יכולות להפוך למספר: <code>int("123")</code> ✅`,

      match: /AttributeError.*'(\w+)'.*object has no attribute '(\w+)'/i,

        `🔍 Check the method name spelling — Python is case-sensitive.`,
        `📚 Verify that <code>${m[2]}</code> exists on <code>${m[1]}</code>.`,
        `💡 If it's <code>list</code>, common methods: <code>.append()</code>, <code>.remove()</code>, <code>.sort()</code>.`,
      ],
    },
    {
      match: /FileNotFoundError/i,
      he: () => `<b>FileNotFoundError</b>: הקובץ לא נמצא. 📁`,
      en: () => `<b>FileNotFoundError</b>: File not found. 📁`,
      hint_he: () => [
        `🔍 בדוק את הנתיב לקובץ.`,
        `💡 בסימולטור שלנו אין גישה לקבצים אמיתיים — השתמש ב-<code>data.load()</code> עבור דאטהסטים.`,
      ],
      hint_en: () => [
        `🔍 Check the file path.`,
        `💡 Our simulator doesn't access real files — use <code>data.load()</code> for datasets.`,
      ],
    },
    {
      match: /ImportError|ModuleNotFoundError/i,
      he: (m) => `<b>ImportError</b>: לא ניתן לייבא את הספרייה. 📚`,
      en: (m) => `<b>ImportError</b>: Cannot import the library. 📚`,
      hint_he: () => [
        `🔍 הסימולטור (Skulpt) תומך רק בספריות מובנות: math, random, re, datetime, itertools, string, collections.`,
        `❌ אינו תומך: numpy, pandas, matplotlib (אך יש לנו DataFrame משלנו דרך <code>data.load()</code>).`,
        `💡 לעבודה אמיתית עם pandas/numpy — הורד Python למחשב או השתמש ב-Google Colab.`,
      ],
      hint_en: () => [
        `🔍 The simulator (Skulpt) only supports built-in libraries: math, random, re, datetime, itertools, string, collections.`,
        `❌ Does not support: numpy, pandas, matplotlib (but we have our own DataFrame via <code>data.load()</code>).`,
        `💡 For real pandas/numpy work — install Python locally or use Google Colab.`,
      ],
    },
    {
      match: /RecursionError|maximum recursion/i,
      he: () => `<b>RecursionError</b>: יותר מדי קריאות רקורסיביות. 🌀`,
      en: () => `<b>RecursionError</b>: Too many recursive calls. 🌀`,
      hint_he: () => [
        `🔍 ודא שיש תנאי עצירה (base case) בפונקציה הרקורסיבית.`,
        `💡 דוגמה: <code>if n == 0: return 1</code>`,
      ],
      hint_en: () => [
        `🔍 Make sure there's a base case in the recursive function.`,
        `💡 Example: <code>if n == 0: return 1</code>`,
      ],
    },
    // Generic fallback
    {
      match: /^([A-Z]\w*Error)/i,
      he: (m) => `<b>${m[1]}</b>: יש שגיאה בקוד. בדוק את ההודעה למעלה. 🔍`,
      en: (m) => `<b>${m[1]}</b>: There's an error in the code. Check the message above. 🔍`,
      hint_he: () => [
        `📖 קרא את הודעת השגיאה בקפידה — היא בדרך כלל מצביעה על מספר השורה והבעיה.`,
        `💡 אם תקועים, לחץ "הצג פתרון" וראה איך זה אמור להיראות.`,
      ],
      hint_en: () => [
        `📖 Read the error message carefully — it usually points to the line number and problem.`,
        `💡 If stuck, click "Show Solution" to see how it should look.`,
      ],
    },
  ];
  
  // ---- Main: explain an error ----
  function explainError(errorText) {
    if (!errorText || typeof errorText !== 'string') return null;
    
    for (const pat of ERROR_PATTERNS) {
      const m = errorText.match(pat.match);
      if (m) {
        const explanation = IS_RTL ? pat.he(m) : pat.en(m);
        const hintFn = IS_RTL ? pat.hint_he : pat.hint_en;
        const hints = hintFn(m);
        return { explanation, hints };
      }
    }
    return null;
  }
  
  // ---- UI: Show explanation box ----
  function showExplanation(targetEl, errorText) {
    const result = explainError(errorText);
    if (!result) return;
    
    // Remove old explanation if exists
    const old = targetEl.parentElement.querySelector('.gam-ai-helper');
    if (old) old.remove();
    
    const box = document.createElement('div');
    box.className = 'gam-ai-helper';
    
    const hintsHTML = result.hints.map(h => `<li>${h}</li>`).join('');
    
    box.innerHTML = `
      <div class="gam-ai-header">
        <span class="gam-ai-icon">🤖</span>
        <span class="gam-ai-title">${IS_RTL ? 'עוזר חכם' : 'AI Helper'}</span>
        <button class="gam-ai-close" aria-label="${IS_RTL ? 'סגור' : 'Close'}">&times;</button>
      </div>
      <div class="gam-ai-body">
        <div class="gam-ai-explain">${result.explanation}</div>
        <div class="gam-ai-hints-title">${IS_RTL ? '💡 איך לתקן:' : '💡 How to fix:'}</div>
        <ul class="gam-ai-hints">${hintsHTML}</ul>
      </div>
    `;
    
    // Insert after the target
    targetEl.parentElement.insertBefore(box, targetEl.nextSibling);
    
    // Animate in
    setTimeout(() => box.classList.add('show'), 10);
    
    // Close button
    box.querySelector('.gam-ai-close').addEventListener('click', () => {
      box.classList.remove('show');
      setTimeout(() => box.remove(), 300);
    });
  }
  
  // ---- Hook into output displays ----
  function observeOutputs() {
    // Find output boxes when they show errors
    const observer = new MutationObserver(mutations => {
      mutations.forEach(m => {
        if (m.type === 'childList' || m.type === 'characterData') {
          const target = m.target;
          // Check if it's an output box with error content
          let el = target.nodeType === 1 ? target : target.parentElement;
          while (el && !el.classList) el = el.parentElement;
          
          if (el && el.classList && (
              el.classList.contains('output-box') ||
              el.classList.contains('out') ||
              el.id?.startsWith('out-'))) {
            const text = el.textContent || '';
            // Check for error patterns
            if (/Error:|Traceback/i.test(text)) {
              // Avoid duplicates
              if (!el.parentElement.querySelector('.gam-ai-helper')) {
                showExplanation(el, text);
              }
            }
          }
        }
      });
    });
    
    observer.observe(document.body, {
      childList: true,
      subtree: true,
      characterData: true,
    });
  }
  
  // ---- Public API ----
  window.gamAI = {
    explain: explainError,
    show: showExplanation,
  };
  
  // ---- Init ----
  function init() {
    observeOutputs();
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
<script>
/* SOUND EFFECTS */
/* ============================================================
   SOUND EFFECTS — Web Audio API (no external files)
   Pure JS, works offline, mobile-friendly
   ============================================================ */

(function() {
  'use strict';
  
  // ---- Mute toggle (saved to localStorage) ----
  function isMuted() { return localStorage.getItem('gam_muted') === '1'; }
  function setMuted(b) { localStorage.setItem('gam_muted', b ? '1' : '0'); }
  
  // ---- AudioContext (lazy initialization, mobile-safe) ----
  let audioCtx = null;
  function getCtx() {
    if (audioCtx) return audioCtx;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
      return audioCtx;
    } catch(e) { return null; }
  }
  
  // ---- Play a tone ----
  function tone(freq, duration, type = 'sine', vol = 0.15, delay = 0) {
    if (isMuted()) return;
    const ctx = getCtx();
    if (!ctx) return;
    
    // Resume context on first user interaction (mobile requirement)
    if (ctx.state === 'suspended') {
      ctx.resume().catch(() => {});
    }
    
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    
    gain.gain.setValueAtTime(0, ctx.currentTime + delay);
    gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + delay + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
    
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + duration);
  }
  
  // ---- Sound presets ----
  const SOUNDS = {
    // Exercise correct - bright ascending chime
    correct: () => {
      tone(523.25, 0.15, 'sine', 0.15, 0);     // C5
      tone(659.25, 0.15, 'sine', 0.15, 0.1);   // E5
      tone(783.99, 0.25, 'sine', 0.18, 0.2);   // G5
    },
    
    // Exercise incorrect - soft descending hum
    wrong: () => {
      tone(330, 0.15, 'sine', 0.1, 0);
      tone(247, 0.2, 'sine', 0.1, 0.12);
    },
    
    // XP earned - quick double pop
    xp: () => {
      tone(800, 0.08, 'sine', 0.12, 0);
      tone(1200, 0.12, 'sine', 0.12, 0.07);
    },
    
    // Level up - triumphant fanfare
    levelUp: () => {
      tone(523.25, 0.12, 'square', 0.1, 0);      // C5
      tone(659.25, 0.12, 'square', 0.1, 0.1);    // E5
      tone(783.99, 0.12, 'square', 0.1, 0.2);    // G5
      tone(1046.50, 0.3,  'square', 0.12, 0.3);  // C6
    },
    
    // Badge unlock - magical sparkle
    badge: () => {
      tone(880, 0.1,  'sine', 0.1, 0);     // A5
      tone(1108.73, 0.1, 'sine', 0.1, 0.08); // C#6
      tone(1318.51, 0.1, 'sine', 0.12, 0.16); // E6
      tone(1760, 0.25, 'sine', 0.13, 0.24); // A6
    },
    
    // Streak continues - soft bell
    streak: () => {
      tone(659.25, 0.15, 'sine', 0.12, 0);
      tone(987.77, 0.3, 'sine', 0.1, 0.1);
    },
    
    // Click - subtle UI tick
    click: () => {
      tone(2000, 0.03, 'sine', 0.06, 0);
    },
    
    // Module complete - full celebration
    complete: () => {
      tone(523.25, 0.1, 'sine', 0.12, 0);
      tone(659.25, 0.1, 'sine', 0.12, 0.08);
      tone(783.99, 0.1, 'sine', 0.12, 0.16);
      tone(1046.50, 0.4, 'sine', 0.15, 0.24);
    },
  };
  
  // ---- Public API ----
  window.gamSound = {
    play: function(name) {
      if (SOUNDS[name]) {
        try { SOUNDS[name](); } catch(e) { /* swallow */ }
      }
    },
    isMuted: isMuted,
    setMuted: setMuted,
    toggle: function() {
      const newState = !isMuted();
      setMuted(newState);
      updateMuteUI();
      if (!newState) SOUNDS.click();  // confirm sound when unmuting
      return newState;
    },
  };
  
  // ---- Mute toggle button (added to HUD) ----
  function updateMuteUI() {
    const btn = document.getElementById('gam-mute-btn');
    if (btn) btn.textContent = isMuted() ? '🔇' : '🔊';
  }
  
  function addMuteButton() {
    if (document.getElementById('gam-mute-btn')) return;
    const hud = document.getElementById('gam-hud');
    if (!hud) {
      // Try again later
      setTimeout(addMuteButton, 500);
      return;
    }
    
    const btn = document.createElement('button');
    btn.id = 'gam-mute-btn';
    btn.className = 'gam-mute-btn';
    btn.textContent = isMuted() ? '🔇' : '🔊';
    btn.setAttribute('aria-label', 'Toggle sound');
    btn.style.cssText = `
      pointer-events: auto;
      background: var(--tc92);
      border: 1.5px solid var(--tc49);
      border-radius: 50%;
      color: var(--tc50);
      width: 36px;
      height: 36px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--tc93);
      margin-inline-end: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform .15s ease;
    `;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      window.gamSound.toggle();
    });
    
    hud.insertBefore(btn, hud.firstChild);
  }
  
  // ---- Hook into gam events (XP, badges, levels) ----
  function hookGamEvents() {
    if (!window.gam) {
      setTimeout(hookGamEvents, 200);
      return;
    }
    
    // Wrap original markExercisePassed
    const origMark = window.gam.markExercisePassed;
    window.gam.markExercisePassed = function(...args) {
      const result = origMark.apply(this, args);
      if (result) window.gamSound.play('correct');
      return result;
    };
  }
  
  // ---- Init ----
  function init() {
    addMuteButton();
    hookGamEvents();
    
    // Observe DOM for badge/level modals to play sounds
    const observer = new MutationObserver(mutations => {
      mutations.forEach(m => {
        m.addedNodes.forEach(node => {
          if (node.nodeType !== 1) return;
          if (node.classList && node.classList.contains('gam-celebration')) {
            if (node.classList.contains('gam-badge-unlock')) {
              window.gamSound.play('badge');
            } else {
              window.gamSound.play('levelUp');
            }
          }
        });

.cert-close {
  position: absolute;
  top: 8px;
  background: transparent;
  border: none;
  color: var(--tc66);
  font-size: 26px;
  cursor: pointer;
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  line-height: 1;
}
[dir="ltr"] .cert-close { right: 8px; }
[dir="rtl"] .cert-close { left: 8px; }
.cert-close:hover { color: var(--tc50); background: var(--tc67); }

.cert-modal-title { font-size: 18px; text-align: center; margin: 0 0 12px; color: var(--tc54); }

.cert-eligible-banner {
  background: linear-gradient(135deg, #00d4aa 0%, #00a884 100%);
  color: #fff;
  padding: 9px;
  border-radius: 9px;
  text-align: center;
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 12px;
}

.cert-name-input-wrap {
  margin-bottom: 12px;
}
.cert-name-input-wrap label {
  display: block;
  font-size: 12.5px;
  margin-bottom: 4px;
  color: var(--tc69);
  font-weight: 600;
}
.cert-name-input-wrap input {
  width: 100%;
  padding: 10px 12px;
  border-radius: 8px;
  background: var(--tc68);
  border: 1.5px solid var(--tc65);
  color: var(--tc50);
  font-size: 15px;
  box-sizing: border-box;
  font-family: inherit;
}
.cert-name-input-wrap input:focus { outline: none; border-color: var(--tc58); }

.cert-preview-wrap {
  background: #f5f5f5;
  padding: 10px;
  border-radius: 9px;
  margin-bottom: 12px;
  overflow: auto;
}
.cert-preview {
  transform-origin: top center;
}
${getCertificateCSS()}
/* Scale preview down */
.cert-preview .cert-doc { transform: scale(0.85); transform-origin: top center; margin-bottom: -10%; }

.cert-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.cert-btn {
  padding: 11px;
  border-radius: 9px;
  border: none;
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}
.cert-btn-primary {
  background: linear-gradient(135deg, #ffd700 0%, #ff8800 100%);
  color: #1a1a2e;
}
.cert-btn-share {
  background: var(--tc104);
  color: #fff;
}
.cert-btn:hover, .cert-btn:active { transform: scale(0.98); }

.cert-stats-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px;
  text-align: center;
  font-size: 10px;
  color: var(--tc69);
  padding-top: 12px;
  border-top: 1px solid var(--tc65);
}
.cert-stats-strip strong {
  display: block;
  font-size: 16px;
  color: var(--tc54);
  margin-bottom: 2px;
}

/* Locked state */
.cert-locked { text-align: center; padding: 16px 8px; }
.cert-locked-icon { font-size: 56px; margin-bottom: 8px; opacity: 0.6; }
.cert-locked h2 { font-size: 19px; margin: 8px 0 6px; color: var(--tc54); }
.cert-locked p { color: var(--tc69); font-size: 13.5px; margin-bottom: 14px; }
.cert-progress-wrap { margin-bottom: 14px; }
.cert-progress-bar {
  width: 100%;
  height: 12px;
  background: var(--tc70);
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 4px;
}
.cert-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #ffd700 0%, #ff8800 100%);
  border-radius: 8px;
  transition: width .5s ease;
}
.cert-progress-text { font-size: 12.5px; color: var(--tc54); font-weight: 700; }
.cert-stats-mini {
  background: var(--tc68);
  padding: 10px;
  border-radius: 8px;
  font-size: 13px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  text-align: ${IS_RTL ? 'right' : 'left'};
}
.cert-stats-mini strong { color: #ffd700; }

@media (max-width: 480px) {
  .cert-modal-inner { padding: 14px 10px; }
  .cert-modal-title { font-size: 16px; }
  .cert-preview .cert-doc { transform: scale(0.55); transform-origin: top center; }
  .cert-preview-wrap { padding: 6px; max-height: 220px; }
  .cert-actions { grid-template-columns: 1fr; }
  .cert-btn { padding: 10px; font-size: 13px; }
  .cert-stats-strip strong { font-size: 14px; }
  .cert-stats-strip { font-size: 9.5px; gap: 3px; }
}

  // ---- Add certificate button to gam panel ----
  function addCertButton() {
    // Watch for gam panel to open
    const obs = new MutationObserver(() => {
      const panel = document.getElementById('gam-panel');
      if (panel && !panel.querySelector('.cert-link-btn')) {
        const footer = panel.querySelector('.gam-footer');
        if (footer) {
          const link = document.createElement('button');
          link.className = 'cert-link-btn';
          link.textContent = '🏆 ' + (IS_RTL ? 'תעודת השלמה' : 'Certificate');
          link.style.cssText = `
            margin-top: 12px;
            padding: 10px 16px;
            background: linear-gradient(135deg, #ffd700 0%, #ff8800 100%);
            color: #1a1a2e;
            border: none;
            border-radius: 9px;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
          `;
          link.addEventListener('click', () => {
            // Close gam panel first
            const closeBtn = panel.querySelector('.gam-panel-close');
            if (closeBtn) closeBtn.click();
            setTimeout(open, 350);
          });
          footer.appendChild(link);
        }
      }
    });
    obs.observe(document.body, { childList: true, subtree: false });
  }
  
  function init() {
    injectCertCSS();
    addCertButton();
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

<script>(function(){
  var D=document,H=D.documentElement;
  function cur(){return H.getAttribute('data-theme')==='light'?'light':'dark';}
  var wrap=D.createElement('div');
  wrap.className='egr-theme';wrap.id='egrTheme';
  wrap.setAttribute('role','group');
  wrap.setAttribute('aria-label','Theme');
  var bD=D.createElement('button'),bL=D.createElement('button');
  bD.type='button';bL.type='button';
  bD.id='egrThemeDark';bL.id='egrThemeLight';
  bD.innerHTML='<span class="egr-i" aria-hidden="true">\u263E</span><span>Dark Mode</span>';
  bL.innerHTML='<span class="egr-i" aria-hidden="true">\u2600</span><span>Light Mode</span>';
  bD.title='Dark Mode';bL.title='Light Mode';
  wrap.appendChild(bD);wrap.appendChild(bL);
  function paint(){var l=cur()==='light';
    bD.setAttribute('aria-pressed',l?'false':'true');
    bL.setAttribute('aria-pressed',l?'true':'false');
    var mt=D.querySelector('meta[name="theme-color"]');
    if(mt){if(!mt.dataset.egrDark)mt.dataset.egrDark=mt.getAttribute('content')||'';
      mt.setAttribute('content',l?'#f2f4f8':mt.dataset.egrDark);}}
  function set(t){H.setAttribute('data-theme',t);
    try{localStorage.setItem('egr-theme',t);}catch(e){}
    paint();}
  bD.addEventListener('click',function(){set('dark');});
  bL.addEventListener('click',function(){set('light');});
  function box(el){if(!el)return null;
    var c=el.closest?el.closest('header,.topnav,.topbar,.header,nav'):null;
    return c||el.parentElement||el;}
  function float(){if(wrap.parentNode)wrap.parentNode.removeChild(wrap);
    wrap.style.marginInlineStart='';wrap.classList.add('egr-floating');
    D.body.appendChild(wrap);}
  function mount(){
    var fl=D.querySelectorAll('a[title="\u05E2\u05D1\u05E8\u05D9\u05EA"],a[title="English"],a[title="\u4E2D\u6587"]');
    var anchor=null,mode=0;
    if(fl.length>=2&&fl[0].parentNode){anchor=fl[0];mode=1;}
    else{
      anchor=D.querySelector('.lang-flags')||D.querySelector('.lang')||
             D.querySelector('.topnav-right')||D.querySelector('.header-right')||
             D.querySelector('.nav-right')||D.querySelector('.topbar-right')||
             D.querySelector('header .hd')||D.querySelector('.header-inner')||
             D.querySelector('.topbar')||D.querySelector('.topnav')||
             D.querySelector('header');
      mode=anchor?2:0;
    }
    if(!mode){float();paint();return;}
    var frame=box(anchor);
    var h0=frame?frame.getBoundingClientRect().height:0;
    var restore=null;
    if(mode===1){
      if(anchor.style&&anchor.style.marginInlineStart==='auto'){
        restore=anchor;wrap.style.marginInlineStart='auto';anchor.style.marginInlineStart='0';
      }
      anchor.parentNode.insertBefore(wrap,anchor);
    }else{anchor.appendChild(wrap);}
    function fits(){
      var r=wrap.getBoundingClientRect();
      var h1=frame?frame.getBoundingClientRect().height:0;
      var fr=frame?frame.getBoundingClientRect():null;
      if(r.width<40||r.height<10)return false;
      if(frame&&h1>h0+1)return false;
      if(fr&&(r.right>fr.right+2||r.left<fr.left-2))return false;
      return true;
    }
    if(!fits()){
      // keep the full wording, just tighten it
      wrap.classList.add('egr-mid');
      if(!fits()){
        // last try inside the header: shorter words
        wrap.classList.remove('egr-mid');wrap.classList.add('egr-compact');
        bD.lastChild.textContent='Dark';bL.lastChild.textContent='Light';
        if(!fits()){
          wrap.classList.remove('egr-compact');
          bD.lastChild.textContent='Dark Mode';bL.lastChild.textContent='Light Mode';
          if(restore)restore.style.marginInlineStart='auto';
          float();
        }
      }
    }
    paint();}
  function guardCovered(){
    if(wrap.classList.contains('egr-floating'))return;
    var r=wrap.getBoundingClientRect();
    if(r.width<10)return;
    var t=D.elementFromPoint(r.left+r.width*0.75, r.top+r.height/2);
    if(t&&!wrap.contains(t)){float();paint();}
  }
  function start(){mount();
    setTimeout(guardCovered,3000);setTimeout(guardCovered,8000);}
  if(D.readyState==='loading')D.addEventListener('DOMContentLoaded',start);else start();
})();</script></body>
