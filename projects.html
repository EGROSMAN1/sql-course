<script>window.PYTHON_PRELUDE = "# =============================================================\n# MINI-PANDAS v2 - Extended DataFrame API for Skulpt\n# Auto-injected into Playground + pandas course\n# =============================================================\n\nclass DataFrame:\n    \"\"\"Minimal DataFrame implementation with ~95% of pandas common ops.\"\"\"\n    \n    def __init__(self, data):\n        if isinstance(data, list):\n            if len(data) == 0:\n                self._data = {}\n                self._columns = []\n            else:\n                self._columns = list(data[0].keys())\n                self._data = {}\n                for col in self._columns:\n                    self._data[col] = [row.get(col) for row in data]\n        else:\n            self._data = dict(data)\n            self._columns = list(self._data.keys())\n        if self._data:\n            first_col = self._columns[0]\n            self._nrows = len(self._data[first_col])\n        else:\n            self._nrows = 0\n    \n    @property\n    def shape(self):\n        return (self._nrows, len(self._columns))\n    \n    @property\n    def columns(self):\n        return list(self._columns)\n    \n    @property\n    def values(self):\n        \"\"\"Return list of rows (each row is a list of values).\"\"\"\n        result = []\n        for i in range(self._nrows):\n            row = []\n            for c in self._columns:\n                row.append(self._data[c][i])\n            result.append(row)\n        return result\n    \n    def head(self, n=5):\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = self._data[c][:n]\n        return DataFrame(new_data)\n    \n    def tail(self, n=5):\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = self._data[c][-n:]\n        return DataFrame(new_data)\n    \n    def __len__(self):\n        return self._nrows\n    \n    def __getitem__(self, key):\n        if isinstance(key, str):\n            return Series(self._data[key], name=key)\n        if isinstance(key, list):\n            # Boolean mask?\n            if len(key) == self._nrows and len(key) > 0 and isinstance(key[0], bool):\n                new_data = {}\n                for c in self._columns:\n                    new_data[c] = []\n                    for i in range(self._nrows):\n                        if key[i]:\n                            new_data[c].append(self._data[c][i])\n                return DataFrame(new_data)\n            # Column selection\n            new_data = {}\n            for c in key:\n                if c in self._data:\n                    new_data[c] = self._data[c]\n            return DataFrame(new_data)\n        raise TypeError(\"Invalid key type\")\n    \n    def __setitem__(self, key, value):\n        if isinstance(value, Series):\n            value = value._data\n        if isinstance(value, list):\n            if len(value) != self._nrows:\n                raise ValueError(\"Length mismatch\")\n            self._data[key] = list(value)\n        else:\n            self._data[key] = [value] * self._nrows\n        if key not in self._columns:\n            self._columns.append(key)\n    \n    def sort_values(self, by, ascending=True):\n        col_data = self._data[by]\n        indices = list(range(self._nrows))\n        # Handle None values - put at end\n        def sort_key(i):\n            v = col_data[i]\n            if v is None:\n                return (1, 0) if ascending else (0, 0)\n            return (0, v)\n        indices.sort(key=sort_key, reverse=not ascending)\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [self._data[c][i] for i in indices]\n        return DataFrame(new_data)\n    \n    def filter(self, col, op, value):\n        \"\"\"SQL-like filter: df.filter('age', '>', 18)\"\"\"\n        mask = []\n        col_data = self._data[col]\n        for v in col_data:\n            if v is None:\n                mask.append(False); continue\n            if op == \">\": mask.append(v > value)\n            elif op == \"<\": mask.append(v < value)\n            elif op == \">=\": mask.append(v >= value)\n            elif op == \"<=\": mask.append(v <= value)\n            elif op == \"==\": mask.append(v == value)\n            elif op == \"!=\": mask.append(v != value)\n            elif op == \"in\":\n                if isinstance(value, list): mask.append(v in value)\n                else: mask.append(False)\n            else:\n                raise ValueError(\"Unknown operator: \" + op)\n        return self[mask]\n    \n    def where(self, fn):\n        \"\"\"Filter rows: df.where(lambda row: row['age'] > 18)\"\"\"\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = []\n        for i in range(self._nrows):\n            row = {}\n            for c in self._columns:\n                row[c] = self._data[c][i]\n            if fn(row):\n                for c in self._columns:\n                    new_data[c].append(self._data[c][i])\n        return DataFrame(new_data)\n    \n    def apply(self, fn, axis=0):\n        \"\"\"Apply function. axis=0: per column. axis=1: per row.\"\"\"\n        if axis == 1:\n            # Per row - returns Series\n            result = []\n            for i in range(self._nrows):\n                row = {}\n                for c in self._columns:\n                    row[c] = self._data[c][i]\n                result.append(fn(row))\n            return Series(result)\n        # Per column\n        result = {}\n        for c in self._columns:\n            result[c] = fn(self._data[c])\n        return result\n    \n    def mean(self):\n        result = {}\n        for c in self._columns:\n            vals = []\n            for v in self._data[c]:\n                if isinstance(v, (int, float)) and not isinstance(v, bool):\n                    vals.append(v)\n            if vals:\n                result[c] = sum(vals) / len(vals)\n        return result\n    \n    def sum(self):\n        result = {}\n        for c in self._columns:\n            vals = []\n            for v in self._data[c]:\n                if isinstance(v, (int, float)) and not isinstance(v, bool):\n                    vals.append(v)\n            if vals:\n                result[c] = sum(vals)\n        return result\n    \n    def min(self):\n        result = {}\n        for c in self._columns:\n            vals = [v for v in self._data[c] if v is not None]\n            if vals: result[c] = min(vals)\n        return result\n    \n    def max(self):\n        result = {}\n        for c in self._columns:\n            vals = [v for v in self._data[c] if v is not None]\n            if vals: result[c] = max(vals)\n        return result\n    \n    def count(self):\n        \"\"\"Count non-null per column.\"\"\"\n        result = {}\n        for c in self._columns:\n            cnt = 0\n            for v in self._data[c]:\n                if v is not None:\n                    cnt += 1\n            result[c] = cnt\n        return result\n    \n    def describe(self):\n        result = {}\n        for c in self._columns:\n            vals = []\n            for v in self._data[c]:\n                if isinstance(v, (int, float)) and not isinstance(v, bool):\n                    vals.append(v)\n            if vals:\n                result[c] = {\n                    \"count\": len(vals),\n                    \"mean\": round(sum(vals)/len(vals), 2),\n                    \"min\": min(vals),\n                    \"max\": max(vals)\n                }\n        return result\n    \n    def to_dict(self):\n        return dict(self._data)\n    \n    # ===== Data cleaning =====\n    \n    def drop(self, columns=None, index=None):\n        \"\"\"Drop columns or rows.\"\"\"\n        if columns is not None:\n            cols_to_drop = columns if isinstance(columns, list) else [columns]\n            new_data = {}\n            new_cols = []\n            for c in self._columns:\n                if c not in cols_to_drop:\n                    new_data[c] = self._data[c]\n                    new_cols.append(c)\n            result = DataFrame(new_data)\n            result._columns = new_cols\n            return result\n        if index is not None:\n            indices = index if isinstance(index, list) else [index]\n            new_data = {}\n            for c in self._columns:\n                new_data[c] = []\n                for i in range(self._nrows):\n                    if i not in indices:\n                        new_data[c].append(self._data[c][i])\n            return DataFrame(new_data)\n        return DataFrame(self._data)\n    \n    def drop_duplicates(self):\n        \"\"\"Remove duplicate rows.\"\"\"\n        seen = []\n        keep_indices = []\n        for i in range(self._nrows):\n            row_tuple = tuple(self._data[c][i] for c in self._columns)\n            if row_tuple not in seen:\n                seen.append(row_tuple)\n                keep_indices.append(i)\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [self._data[c][i] for i in keep_indices]\n        return DataFrame(new_data)\n    \n    def isna(self):\n        \"\"\"Return df of booleans where values are None.\"\"\"\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [v is None for v in self._data[c]]\n        return DataFrame(new_data)\n    \n    def fillna(self, value):\n        \"\"\"Replace None values.\"\"\"\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [value if v is None else v for v in self._data[c]]\n        return DataFrame(new_data)\n    \n    def dropna(self):\n        \"\"\"Drop rows with any None.\"\"\"\n        keep = []\n        for i in range(self._nrows):\n            has_none = False\n            for c in self._columns:\n                if self._data[c][i] is None:\n                    has_none = True; break\n            if not has_none:\n                keep.append(i)\n        new_data = {}\n        for c in self._columns:\n            new_data[c] = [self._data[c][i] for i in keep]\n        return DataFrame(new_data)\n    \n    def rename(self, columns):\n        \"\"\"Rename columns: df.rename({'old':'new'})\"\"\"\n        new_data = {}\n        new_cols = []\n        for c in self._columns:\n            new_name = columns.get(c, c)\n            new_data[new_name] = self._data[c]\n            new_cols.append(new_name)\n        result = DataFrame(new_data)\n        result._columns = new_cols\n        return result\n    \n    def astype(self, col, dtype):\n        \"\"\"Convert column to type. dtype: int, float, str.\"\"\"\n        new_data = dict(self._data)\n        new_vals = []\n        for v in self._data[col]:\n            if v is None:\n                new_vals.append(None)\n            elif dtype == int or dtype == \"int\":\n                new_vals.append(int(v))\n            elif dtype == float or dtype == \"float\":\n                new_vals.append(float(v))\n            elif dtype == str or dtype == \"str\":\n                new_vals.append(str(v))\n            else:\n                new_vals.append(v)\n        new_data[col] = new_vals\n        return DataFrame(new_data)\n    \n    def clip(self, col, lower=None, upper=None):\n        \"\"\"Clip values in column to range.\"\"\"\n        new_data = dict(self._data)\n        new_vals = []\n        for v in self._data[col]:\n            if v is None:\n                new_vals.append(None); continue\n            if lower is not None and v < lower: v = lower\n            if upper is not None and v > upper: v = upper\n            new_vals.append(v)\n        new_data[col] = new_vals\n        return DataFrame(new_data)\n    \n    def nunique(self):\n        \"\"\"Count unique values per column.\"\"\"\n        result = {}\n        for c in self._columns:\n            seen = []\n            for v in self._data[c]:\n                if v not in seen:\n                    seen.append(v)\n            result[c] = len(seen)\n        return result\n    \n    # ===== Grouping / aggregation =====\n    \n    def groupby(self, by):\n        \"\"\"Group by column.\"\"\"\n        return GroupBy(self, by)\n    \n    # ===== Merging =====\n    \n    def merge(self, other, on, how=\"inner\"):\n        \"\"\"Merge two DataFrames on a key column. how: 'inner' or 'left'.\"\"\"\n        # Build index for other df\n        other_index = {}\n        for i in range(other._nrows):\n            k = other._data[on][i]\n            if k not in other_index:\n                other_index[k] = []\n            other_index[k].append(i)\n        \n        # New columns: my cols + other cols (without duplicate 'on')\n        my_cols = list(self._columns)\n        other_cols = [c for c in other._columns if c != on]\n        new_data = {}\n        for c in my_cols:\n            new_data[c] = []\n        for c in other_cols:\n            new_data[c] = []\n        \n        for i in range(self._nrows):\n            key = self._data[on][i]\n            if key in other_index:\n                for j in other_index[key]:\n                    for c in my_cols:\n                        new_data[c].append(self._data[c][i])\n                    for c in other_cols:\n                        new_data[c].append(other._data[c][j])\n            elif how == \"left\":\n                for c in my_cols:\n                    new_data[c].append(self._data[c][i])\n                for c in other_cols:\n                    new_data[c].append(None)\n        return DataFrame(new_data)\n    \n    # ===== Concat =====\n    \n    @staticmethod\n    def concat(dfs):\n        \"\"\"Concatenate list of DataFrames vertically.\"\"\"\n        if not dfs: return DataFrame({})\n        new_data = {}\n        cols = dfs[0]._columns\n        for c in cols:\n            new_data[c] = []\n        for df in dfs:\n            for c in cols:\n                if c in df._data:\n                    new_data[c].extend(df._data[c])\n                else:\n                    new_data[c].extend([None] * df._nrows)\n        return DataFrame(new_data)\n    \n    # ===== Set/reset index =====\n    \n    def set_index(self, col):\n        \"\"\"Make a column the row index (for display only - we don't really track indices).\"\"\"\n        # Just move that column to first position\n        if col not in self._columns:\n            raise ValueError(\"Column not found: \" + col)\n        new_cols = [col] + [c for c in self._columns if c != col]\n        new_data = {}\n        for c in new_cols:\n            new_data[c] = self._data[c]\n        result = DataFrame(new_data)\n        result._columns = new_cols\n        return result\n    \n    def reset_index(self):\n        \"\"\"Add an index column.\"\"\"\n        new_data = {\"index\": list(range(self._nrows))}\n        for c in self._columns:\n            new_data[c] = self._data[c]\n        return DataFrame(new_data)\n    \n    # ===== Info =====\n    \n    def info(self):\n        \"\"\"Print summary.\"\"\"\n        print(\"DataFrame: \" + str(self._nrows) + \" rows x \" + str(len(self._columns)) + \" columns\")\n        print(\"Columns:\")\n        for c in self._columns:\n            non_null = 0\n            for v in self._data[c]:\n                if v is not None: non_null += 1\n            sample = self._data[c][0] if self._nrows > 0 else None\n            type_name = type(sample).__name__ if sample is not None else \"unknown\"\n            print(\"  \" + c + \" (\" + type_name + \"): \" + str(non_null) + \" non-null\")\n    \n    def __str__(self):\n        return self._render_text()\n    \n    def __repr__(self):\n        return self._render_text()\n    \n    def _render_text(self):\n        if not self._columns:\n            return \"Empty DataFrame\"\n        lines = []\n        header = \"__DATAFRAME__|\" + \"|\".join([str(c) for c in self._columns])\n        lines.append(header)\n        for i in range(self._nrows):\n            row_vals = []\n            for c in self._columns:\n                row_vals.append(str(self._data[c][i]))\n            lines.append(\"__DATAROW__|\" + \"|\".join(row_vals))\n        lines.append(\"__DATAFRAME_END__\")\n        return \"\\n\".join(lines)\n\n\nclass GroupBy:\n    \"\"\"Result of df.groupby(col). Supports .mean(), .sum(), .count(), .agg().\"\"\"\n    def __init__(self, df, by):\n        self._df = df\n        self._by = by\n        # Build groups\n        self._groups = {}\n        col_data = df._data[by]\n        for i in range(df._nrows):\n            key = col_data[i]\n            if key not in self._groups:\n                self._groups[key] = []\n            self._groups[key].append(i)\n    \n    def _agg(self, fn):\n        \"\"\"Apply agg function per group, return DataFrame.\"\"\"\n        other_cols = [c for c in self._df._columns if c != self._by]\n        new_data = {self._by: []}\n        for c in other_cols:\n            new_data[c] = []\n        for key, indices in self._groups.items():\n            new_data[self._by].append(key)\n            for c in other_cols:\n                vals = []\n                for i in indices:\n                    v = self._df._data[c][i]\n                    if isinstance(v, (int, float)) and not isinstance(v, bool):\n                        vals.append(v)\n                if vals:\n                    new_data[c].append(fn(vals))\n                else:\n                    new_data[c].append(None)\n        return DataFrame(new_data)\n    \n    def mean(self):\n        return self._agg(lambda v: round(sum(v)/len(v), 2))\n    \n    def sum(self):\n        return self._agg(sum)\n    \n    def max(self):\n        return self._agg(max)\n    \n    def min(self):\n        return self._agg(min)\n    \n    def count(self):\n        \"\"\"Count rows per group.\"\"\"\n        new_data = {self._by: [], \"count\": []}\n        for key, indices in self._groups.items():\n            new_data[self._by].append(key)\n            new_data[\"count\"].append(len(indices))\n        return DataFrame(new_data)\n    \n    def size(self):\n        \"\"\"Same as count - rows per group.\"\"\"\n        return self.count()\n\n\nclass Series:\n    \"\"\"A column from a DataFrame.\"\"\"\n    def __init__(self, data, name=None):\n        self._data = list(data)\n        self.name = name\n    \n    def __len__(self):\n        return len(self._data)\n    \n    def __getitem__(self, i):\n        return self._data[i]\n    \n    def __iter__(self):\n        return iter(self._data)\n    \n    def gt(self, other): return [v > other for v in self._data if v is not None] if False else [v > other if v is not None else False for v in self._data]\n    def lt(self, other): return [v < other if v is not None else False for v in self._data]\n    def ge(self, other): return [v >= other if v is not None else False for v in self._data]\n    def le(self, other): return [v <= other if v is not None else False for v in self._data]\n    def eq(self, other): return [v == other for v in self._data]\n    \n    def mean(self):\n        nums = [v for v in self._data if isinstance(v, (int, float)) and not isinstance(v, bool)]\n        if nums: return sum(nums) / len(nums)\n        return 0\n    \n    def sum(self):\n        nums = [v for v in self._data if isinstance(v, (int, float)) and not isinstance(v, bool)]\n        return sum(nums)\n    \n    def max(self):\n        vals = [v for v in self._data if v is not None]\n        return max(vals) if vals else None\n    \n    def min(self):\n        vals = [v for v in self._data if v is not None]\n        return min(vals) if vals else None\n    \n    def unique(self):\n        seen = []\n        for v in self._data:\n            if v not in seen:\n                seen.append(v)\n        return seen\n    \n    def nunique(self):\n        return len(self.unique())\n    \n    def count(self):\n        cnt = <body>

<div class="topbar">
  <a href="index.html" class="home-btn">🏠 דף הבית</a>
  <a href="en/projects.html" class="back-btn">English →</a>
</div>

<div class="hero">
  <h1>🚀 פרויקטים מודרכים</h1>
  <p>5 פרויקטים מציאותיים מ-Partner ועד משרד הבריאות. כל פרויקט = 5-7 שלבים שמובילים אותך מתחילת הניתוח עד התובנה העסקית.</p>
</div>

<div class="container">

  <!-- Project list -->
  <div id="project-list" class="project-list">
    <div class="project-grid" id="project-grid">
      <!-- Cards rendered by JS -->
    </div>
  </div>

  <!-- Project detail (hidden by default) -->
  <div id="project-detail" class="project-detail">
    <button class="project-back" id="back-btn">← חזרה לרשימה</button>
    
    <div id="project-detail-content">
      <!-- Detail rendered by JS -->
    </div>
  </div>

</div>

<script>
(function() {
  'use strict';

  const IS_RTL = document.documentElement.dir === 'rtl';
  const T = IS_RTL ? {
    difficulty: 'רמה',
    duration: 'משך',
    completed: '✅ הושלם',
    inProgress: '⏳ בתהליך',
    dataset: 'דאטהסט',
    step: 'שלב',
    of: 'מתוך',
    run: '▶ הרץ',
    showSolution: '💡 הצג פתרון',
    hideSolution: 'הסתר פתרון',
    hint: '💡 רמז',
    copy: '📋 העתק',
    copied: '✅ הועתק!',
    correct: '✅ מעולה! עבור לשלב הבא',
    wrong: '🤔 הפלט לא תואם. נסה שוב.',
    next: 'הבא ←',
    prev: '→ הקודם',
    restart: '🔄 התחל מחדש',
    notStarted: 'עוד לא התחלת',
    backToList: '← חזרה לרשימה',
    running: 'מריץ...',
    skulptLoading: 'טוען Python...',
  } : {
    difficulty: 'Level',
    duration: 'Time',
    completed: '✅ Completed',
    inProgress: '⏳ In Progress',
    dataset: 'Dataset',
    step: 'Step',
    of: 'of',
    run: '▶ Run',
    showSolution: '💡 Show Solution',
    hideSolution: 'Hide Solution',
    hint: '💡 Hint',
    copy: '📋 Copy',
    copied: '✅ Copied!',
    correct: '✅ Excellent! Continue to next step',
    wrong: '🤔 Output doesn\'t match. Try again.',
    next: 'Next →',
    prev: '← Previous',
    restart: '🔄 Restart',
    notStarted: 'Not started',
    backToList: '← Back to list',
    running: 'Running...',
    skulptLoading: 'Loading Python...',
  };

  // ---- Data ----
  const projects = (window.GUIDED_PROJECTS && (IS_RTL ? window.GUIDED_PROJECTS.he : window.GUIDED_PROJECTS.en)) || [];

  // ---- Storage ----
  const STORAGE_KEY = 'guided_projects_progress';
  function getProgress() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
    catch(e) { return {}; }
  }
  function saveProgress(progress) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  }
  function markStepComplete(projectId, stepIdx) {
    const p = getProgress();
    if (!p[projectId]) p[projectId] = { steps: [] };
    if (!p[projectId].steps.includes(stepIdx)) {
      p[projectId].steps.push(stepIdx);
    }
    saveProgress(p);
    
    // Award XP via gam system
    if (window.gam && window.gam.addXP) {
      window.gam.addXP(15, IS_RTL ? 'שלב הושלם!' : 'Step completed!');
    }
  }
  function getProjectStatus(projectId, totalSteps) {
    const p = getProgress();
    if (!p[projectId]) return { state: 'new', completed: 0, total: totalSteps };
    const done = p[projectId].steps.length;
    if (done === 0) return { state: 'new', completed: 0, total: totalSteps };
    if (done >= totalSteps) return { state: 'completed', completed: done, total: totalSteps };
    return { state: 'in-progress', completed: done, total: totalSteps };
  }
  function isStepDone(projectId, stepIdx) {
    const p = getProgress();
    return p[projectId] && p[projectId].steps && p[projectId].steps.includes(stepIdx);
  }

  // ---- Render project list ----
  function renderProjectList() {
    const grid = document.getElementById('project-grid');
    let html = '';
    projects.forEach((project, idx) => {
      const status = getProjectStatus(project.id, project.steps.length);
      let statusBadge = '';
      if (status.state === 'completed') statusBadge = `<div class="project-status-badge completed">${T.completed}</div>`;
      else if (status.state === 'in-progress') statusBadge = `<div class="project-status-badge in-progress">${T.inProgress} ${status.completed}/${status.total}</div>`;
      
      const tagsHTML = (project.tags || []).map(t => `<span class="project-tag">${t}</span>`).join('');
      
      html += `
        <div class="project-card ${status.state}" data-idx="${idx}">
          ${statusBadge}
          <div class="project-card-header">
            <div class="project-icon">${project.icon}</div>
            <div class="project-title">${project.title}</div>
          </div>
          <div class="project-meta">
            <span>📊 ${project.difficulty}</span>
            <span>⏱ ${project.duration}</span>
            <span>📝 ${project.steps.length} ${T.step}${project.steps.length > 1 ? (IS_RTL ? 'ים' : 's') : ''}</span>
          </div>
          <div class="project-desc">${project.desc}</div>
          <div class="project-tags">${tagsHTML}</div>
        </div>
      `;
    });
    grid.innerHTML = html;
    
    grid.querySelectorAll('.project-card').forEach(card => {
      card.addEventListener('click', () => {
        const idx = parseInt(card.dataset.idx, 10);
        openProject(idx);
      });
    });
  }

  // ---- Open a project ----
  let currentProject = null;
  let currentStepIdx = 0;
  
  function openProject(idx) {
    currentProject = projects[idx];
    
    // Resume from last completed step + 1
    const progress = getProgress();
    if (progress[currentProject.id]) {
      const lastDone = Math.max(-1, ...(progress[currentProject.id].steps || [-1]));
      currentStepIdx = Math.min(lastDone + 1, currentProject.steps.length - 1);
    } else {
      currentStepIdx = 0;
    }
    
    document.getElementById('project-list').classList.add('hidden');
    document.getElementById('project-detail').classList.add('active');
    renderProjectDetail();
    
    // Scroll to top
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  
  function closeProject() {
    document.getElementById('project-list').classList.remove('hidden');
    document.getElementById('project-detail').classList.remove('active');
    currentProject = null;
    renderProjectList(); // Refresh list to show updated progress
  }
  
  document.getElementById('back-btn').addEventListener('click', closeProject);

  // ---- Render project detail ----
  function renderProjectDetail() {
    if (!currentProject) return;
    const totalSteps = currentProject.steps.length;
    const allDone = isProjectComplete();
    
    // Dots
    let dotsHTML = '';
    for (let i = 0; i < totalSteps; i++) {
      let cls = '';
      if (isStepDone(currentProject.id, i)) cls = 'completed';
      else if (i === currentStepIdx) cls = 'current';
      dotsHTML += `<div class="step-dot ${cls}"></div>`;
    }
    
    let html = `
      <div class="project-detail-header">
        <h1 class="project-detail-title">
          <span>${currentProject.icon}</span>
          <span>${currentProject.title}</span>
        </h1>
        <div class="project-detail-desc">${currentProject.desc}</div>
        <div class="project-detail-dataset">📊 ${T.dataset}: <code>${currentProject.dataset}</code> — ${currentProject.datasetDesc}</div>
        <div class="steps-progress">${dotsHTML}</div>
      </div>
    `;
    
    if (allDone) {
      html += `
        <div class="conclusion-card">
          <h2>🏆 ${IS_RTL ? 'סיימת את הפרויקט!' : 'You finished the project!'}</h2>
          <p>${currentProject.conclusion}</p>
          <button class="btn btn-primary" id="restart-btn">${T.restart}</button>
        </div>
      `;
    }
    
    // Render current step
    const step = currentProject.steps[currentStepIdx];
    const isDone = isStepDone(currentProject.id, currentStepIdx);
    
    html += `
      <div class="step-card" id="current-step-card">
        <h3>${T.step} ${currentStepIdx + 1}/${totalSteps} — ${step.title.replace(/^[\u{1F300}-\u{1FAFF}\u{2600}-\u{26FF}]\s*/u, '')} ${isDone ? '✅' : ''}</h3>
        <div class="step-narrative">${step.narrative}</div>
        <div class="step-question">${step.q}</div>
        <textarea class="code-editor" id="code-input" rows="8" spellcheck="false">${step.starter || ''}</textarea>
        <div class="step-actions">
          <button class="btn btn-primary" id="run-btn">${T.run}</button>
          <button class="btn btn-secondary" id="show-sol-btn">${T.showSolution}</button>
          <button class="btn btn-hint" id="hint-btn">${T.hint}</button>
        </div>
        <div class="output-box" id="output-box"></div>
        <div class="verdict" id="verdict"></div>
        <div class="solution-panel" id="solution-panel">
          <div class="solution-header">
            <span>💡 ${IS_RTL ? 'פתרון רשמי' : 'Official Solution'}</span>
            <button class="copy-sol" id="copy-sol-btn">${T.copy}</button>
          </div>
          <pre id="solution-code"></pre>
        </div>
        <div class="step-nav">
          <button class="btn btn-secondary" id="prev-btn" ${currentStepIdx === 0 ? 'style="opacity:0.4;pointer-events:none;"' : ''}>${T.prev}</button>
          <button class="btn btn-primary" id="next-btn" ${currentStepIdx === totalSteps - 1 ? 'style="opacity:0.4;pointer-events:none;"' : ''}>${T.next}</button>
        </div>
      </div>
    `;
    
    document.getElementById('project-detail-content').innerHTML = html;
    
    // Wire up
    wireUpStep();
    
    if (allDone) {
      const rb = document.getElementById('restart-btn');
      if (rb) rb.addEventListener('click', restartProject);
    }
  }
  
  function isProjectComplete() {
    if (!currentProject) return false;
    const p = getProgress();
    return p[currentProject.id] && (p[currentProject.id].steps || []).length >= currentProject.steps.length;
  }
  
  function restartProject() {
    const p = getProgress();
    if (p[currentProject.id]) {
      p[currentProject.id].steps = [];
      saveProgress(p);
    }
    currentStepIdx = 0;
    renderProjectDetail();
  }
  
  function wireUpStep() {
    const step = currentProject.steps[currentStepIdx];
    
    document.getElementById('run-btn').addEventListener('click', runCode);
    
    document.getElementById('show-sol-btn').addEventListener('click', () => {
      const panel = document.getElementById('solution-panel');
      const btn = document.getElementById('show-sol-btn');
      if (panel.classList.contains('show')) {
        panel.classList.remove('show');
        btn.textContent = T.showSolution;
      } else {
        document.getElementById('solution-code').textContent = step.solution || '';
        panel.classList.add('show');
        btn.textContent = T.hideSolution;
      }
    });
    
    document.getElementById('hint-btn').addEventListener('click', () => {
      alert('💡 ' + (step.hint || (IS_RTL ? 'נסה לקרוא את הסיפור שוב' : 'Try reading the narrative again')));
    });
    
    document.getElementById('copy-sol-btn').addEventListener('click', () => {
      const text = step.solution || '';
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          const btn = document.getElementById('copy-sol-btn');
          btn.textContent = T.copied;
          setTimeout(() => { btn.textContent = T.copy; }, 1800);
        });
      }
    });
    
    document.getElementById('prev-btn').addEventListener('click', () => {
      if (currentStepIdx > 0) { currentStepIdx--; renderProjectDetail(); }
    });
    document.getElementById('next-btn').addEventListener('click', () => {
      if (currentStepIdx < currentProject.steps.length - 1) { currentStepIdx++; renderProjectDetail(); }
    });
  }

  // ---- Run code via Skulpt ----
  function runCode() {
    if (typeof Sk === 'undefined') {
      alert(T.skulptLoading);
      return;
    }
    
    const code = document.getElementById('code-input').value;
    const outBox = document.getElementById('output-box');
    const verdict = document.getElementById('verdict');
    const runBtn = document.getElementById('run-btn');
    
    outBox.className = 'output-box show';
    outBox.textContent = T.running;
    verdict.className = 'verdict';
    verdict.textContent = '';
    runBtn.disabled = true;
    
    let buffer = '';
    
    Sk.configure({
      output: (text) => { buffer += text; },
      read: (f) => {
        if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][f] === undefined) {
          throw "File not found: '" + f + "'";
        }
        return Sk.builtinFiles["files"][f];
      },
      __future__: Sk.python3,
      execLimit: 8000,
    });
    
    // Prepend mini-pandas + datasets
    const prelude = window.PYTHON_PRELUDE || '';
    const fullCode = prelude + '\n\n' + code;
    
    Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, fullCode, true))
      .then(() => {
        runBtn.disabled = false;
        outBox.textContent = buffer || (IS_RTL ? '(אין פלט)' : '(no output)');
        outBox.classList.remove('error');
        
        // Check answer
        const step = currentProject.steps[currentStepIdx];
        let passed = false;
        try {
          if (step.check) passed = step.check(buffer);
        } catch (e) { passed = false; }
        
        if (passed) {
          verdict.className = 'verdict show success';
          verdict.textContent = T.correct;
          markStepComplete(currentProject.id, currentStepIdx);
          if (window.gamSound) window.gamSound.play('correct');
          
          // Auto-advance after 1.5s
          setTimeout(() => {
            if (currentStepIdx < currentProject.steps.length - 1) {
              currentStepIdx++;
              renderProjectDetail();
              window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
              renderProjectDetail();  // Show conclusion
            }
          }, 1500);
        } else {
          verdict.className = 'verdict show fail';
          verdict.textContent = T.wrong;
          if (window.gamSound) window.gamSound.play('wrong');
        }
      })
      .catch((e) => {
        runBtn.disabled = false;
        outBox.textContent = String(e);
        outBox.classList.add('error');
      });
  }

  // ---- Init ----
  function init() {
    if (!projects || projects.length === 0) {
      document.getElementById('project-grid').innerHTML = '<p style="text-align:center;color:var(--tc61);padding:20px;">' + (IS_RTL ? 'אין פרויקטים זמינים' : 'No projects available') + '</p>';
      return;
    }
    renderProjectList();
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

  function getXP() { return parseInt(localStorage.getItem(STORAGE.XP) || '0', 10); }

  function addXP(amount, reason) {
    const cur = getXP();
    const newXP = cur + amount;
    setXP(newXP);
    
    // Track daily XP
    const today = todayStr();
    const dailyData = JSON.parse(localStorage.getItem(STORAGE.DAILY_XP) || '{}');
    dailyData[today] = (dailyData[today] || 0) + amount;
    localStorage.setItem(STORAGE.DAILY_XP, JSON.stringify(dailyData));
    
    showXPGain(amount, reason);
    checkLevelUp(cur, newXP);
    checkBadges();
  }
  
  function getStreak() { return parseInt(localStorage.getItem(STORAGE.STREAK) || '0', 10); }

    localStorage.setItem(STORAGE.STREAK, n);
    const longest = parseInt(localStorage.getItem(STORAGE.LONGEST_STREAK) || '0', 10);
    if (n > longest) localStorage.setItem(STORAGE.LONGEST_STREAK, n);
    updateUI();
  }
  
  function getBadges() {
    try { return JSON.parse(localStorage.getItem(STORAGE.BADGES) || '[]'); }
    catch (e) { return []; }
  }
  function addBadge(id) {
    const badges = getBadges();
    if (!badges.includes(id)) {
      badges.push(id);
      localStorage.setItem(STORAGE.BADGES, JSON.stringify(badges));
      const def = BADGE_DEFS.find(b => b.id === id);

      return true;

    return false;
  }
  
  function getPassedExercises() {
    try { return JSON.parse(localStorage.getItem(STORAGE.PASSED_EXERCISES) || '{}'); }
    catch (e) { return {}; }
  }
  function markExercisePassed(courseId, exId, usedSolution) {
    const passed = getPassedExercises();
    if (!passed[courseId]) passed[courseId] = {};
    if (!passed[courseId][exId]) {
      passed[courseId][exId] = { date: todayStr(), used: !!usedSolution };
      localStorage.setItem(STORAGE.PASSED_EXERCISES, JSON.stringify(passed));
      
      const xp = usedSolution ? XP_REWARDS.EXERCISE_PASS : XP_REWARDS.EXERCISE_PASS_NO_HINT;
      addXP(xp, IS_RTL ? 'תרגיל הושלם!' : 'Exercise complete!');
      return true;
    }
    return false;
  }
  
  // ---- Date helpers ----
  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function daysBetween(d1Str, d2Str) {
    const d1 = new Date(d1Str);
    const d2 = new Date(d2Str);
    return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
  }
  
  // ---- Streak logic ----
  function updateStreakOnLoad() {
    const lastDate = localStorage.getItem(STORAGE.LAST_DATE);
    const today = todayStr();
    if (!lastDate) {
      // First visit
      localStorage.setItem(STORAGE.LAST_DATE, today);
      setStreak(1);
      addBadge('first_day');
      showToast(T.streakFirst, '🎯');
      return;
    }
    if (lastDate === today) return;  // Already counted today
    
    const diff = daysBetween(lastDate, today);
    if (diff === 1) {
      // Continued streak
      const newStreak = getStreak() + 1;
      setStreak(newStreak);
      localStorage.setItem(STORAGE.LAST_DATE, today);
      addXP(XP_REWARDS.FIRST_RUN_OF_DAY + XP_REWARDS.STREAK_BONUS(newStreak), T.streakAlive(newStreak));
    } else if (diff > 1) {
      // Streak broken
      const oldStreak = getStreak();
      if (oldStreak > 1) {
        showToast(T.streakBroken, '💔');
      }
      setStreak(1);
      localStorage.setItem(STORAGE.LAST_DATE, today);
      addXP(XP_REWARDS.FIRST_RUN_OF_DAY, IS_RTL ? 'התחלת רצף חדש' : 'New streak started');
    }
    
    // Track usage day
    const days = JSON.parse(localStorage.getItem(STORAGE.USAGE_DAYS) || '[]');
    if (!days.includes(today)) {
      days.push(today);
      localStorage.setItem(STORAGE.USAGE_DAYS, JSON.stringify(days));
    }
  }
  
  // ---- Level system ----
  // XP needed for each level: 0, 50, 150, 300, 500, 800, 1200, 1700, 2300, 3000, 4000, 5500, 7500, ...
  function levelForXP(xp) {
    const thresholds = [0, 50, 150, 300, 500, 800, 1200, 1700, 2300, 3000, 4000, 5500, 7500, 10000];
    for (let i = thresholds.length - 1; i >= 0; i--) {
      if (xp >= thresholds[i]) return i + 1;
    }
    return 1;
  }
  function xpForLevel(level) {
    const thresholds = [0, 50, 150, 300, 500, 800, 1200, 1700, 2300, 3000, 4000, 5500, 7500, 10000];
    return thresholds[level - 1] || (10000 + (level - 14) * 2500);
  }
  function checkLevelUp(oldXP, newXP) {
    const oldLvl = levelForXP(oldXP);
    const newLvl = levelForXP(newXP);
    if (newLvl > oldLvl) {
      showLevelUp(newLvl);
      // Badge for reaching levels
      if (newLvl === 5) addBadge('level_5');
      if (newLvl === 10) addBadge('level_10');
    }
  }
  
  // ---- Badge definitions ----
  const BADGE_DEFS = [
    { id: 'first_day',  icon: '🎯', name_he: 'יום ראשון',    name_en: 'First Day',    desc_he: 'התחלת ללמוד!',                   desc_en: 'Started learning!' },
    { id: 'first_ex',   icon: '🐣', name_he: 'תרגיל ראשון',  name_en: 'First Exercise',desc_he: 'פתרת תרגיל ראשון',              desc_en: 'Solved your first exercise' },
    { id: 'streak_3',   icon: '🔥', name_he: '3 ימים ברצף', name_en: '3-Day Streak', desc_he: 'התמדה!',                          desc_en: 'Consistency!' },
    { id: 'streak_7',   icon: '⚡', name_he: 'שבוע ברצף',   name_en: '7-Day Streak', desc_he: 'אלוף של שבוע',                    desc_en: 'A week champion' },
    { id: 'streak_30',  icon: '🏆', name_he: 'חודש ברצף',   name_en: '30-Day Streak',desc_he: 'אגדה',                            desc_en: 'Legend' },

    { id: 'ex_200',     icon: '👑', name_he: '200 תרגילים',  name_en: '200 Exercises',desc_he: 'אלוף האלופים',                    desc_en: 'Champion of champions' },

    { id: 'pandas_pro', icon: '🐼', name_he: 'Pandas Pro',  name_en: 'Pandas Pro',   desc_he: 'סיימת את קורס Pandas',           desc_en: 'Completed Pandas course' },
    { id: 'quiz_pro',   icon: '🎓', name_he: 'מומחה חידון',  name_en: 'Quiz Master',  desc_he: 'סיימת 100 שאלות חידון',           desc_en: 'Aced 100 quiz questions' },
    { id: 'level_5',    icon: '🎖️', name_he: 'רמה 5',       name_en: 'Level 5',      desc_he: 'הגעת לרמה 5',                    desc_en: 'Reached Level 5' },
    { id: 'level_10',   icon: '🏅', name_he: 'רמה 10',      name_en: 'Level 10',     desc_he: 'הגעת לרמה 10',                   desc_en: 'Reached Level 10' },

  function checkBadges() {
    const passed = getPassedExercises();
    let totalPassed = 0;
    let noHintCount = 0;
    let pythonCount = 0, pandasCount = 0, quizCount = 0;
    
    Object.entries(passed).forEach(([course, exs]) => {
      const count = Object.keys(exs).length;
      totalPassed += count;
      Object.values(exs).forEach(ex => { if (!ex.used) noHintCount++; });
      if (course === 'python-lesson') pythonCount = count;
      if (course === 'pandas-lesson') pandasCount = count;
      if (course === 'quiz-python-100') quizCount = count;
    });
    
    if (totalPassed >= 1)   addBadge('first_ex');
    if (totalPassed >= 10)  addBadge('ex_10');
    if (totalPassed >= 50)  addBadge('ex_50');
    if (totalPassed >= 100) addBadge('ex_100');
    if (totalPassed >= 200) addBadge('ex_200');
    if (noHintCount >= 10)  addBadge('no_hints');
    if (pythonCount >= 170) addBadge('python_pro');
    if (pandasCount >= 150) addBadge('pandas_pro');
    if (quizCount >= 100)   addBadge('quiz_pro');
    
    const streak = getStreak();
    if (streak >= 3)  addBadge('streak_3');

  function showXPGain(amount, reason) {
    const div = document.createElement('div');
    div.className = 'gam-toast gam-toast-xp';
    div.innerHTML = `<span class="gam-toast-icon">⭐</span> <strong>+${amount} ${T.xp}</strong>${reason ? `<br><small>${reason}</small>` : ''}`;
    document.body.appendChild(div);
    setTimeout(() => div.classList.add('show'), 10);
    setTimeout(() => { div.classList.remove('show'); setTimeout(() => div.remove(), 400); }, 2500);
  }
  
  function showToast(message, icon) {
    const div = document.createElement('div');
    div.className = 'gam-toast';
    div.innerHTML = `<span class="gam-toast-icon">${icon || '🎉'}</span> ${message}`;
    document.body.appendChild(div);
    setTimeout(() => div.classList.add('show'), 10);
    setTimeout(() => { div.classList.remove('show'); setTimeout(() => div.remove(), 400); }, 3000);
  }
  
  function showLevelUp(level) {
    const div = document.createElement('div');
    div.className = 'gam-celebration';
    div.innerHTML = `
      <div class="gam-celebration-inner">
        <div class="gam-celebration-icon">🎉</div>
        <h2>${T.levelUp}</h2>
        <div class="gam-level-badge">${T.level} ${level}</div>
        <button class="gam-celebration-close">${T.close}</button>
      </div>
    `;
    document.body.appendChild(div);
    setTimeout(() => div.classList.add('show'), 10);
    div.querySelector('.gam-celebration-close').addEventListener('click', () => {
      div.classList.remove('show');
      setTimeout(() => div.remove(), 400);
    });
    div.addEventListener('click', e => {
      if (e.target === div) { div.classList.remove('show'); setTimeout(() => div.remove(), 400); }
    });
  }
  
  function showBadgeUnlock(badge) {
    const name = IS_RTL ? badge.name_he : badge.name_en;
    const desc = IS_RTL ? badge.desc_he : badge.desc_en;
    const div = document.createElement('div');
    div.className = 'gam-celebration gam-badge-unlock';
    div.innerHTML = `
      <div class="gam-celebration-inner">
        <div class="gam-badge-icon-big">${badge.icon}</div>
        <h3>${T.newBadge}</h3>
        <h2>${name}</h2>
        <p>${desc}</p>
        <button class="gam-celebration-close">${T.close}</button>
      </div>
    `;
    document.body.appendChild(div);
    setTimeout(() => div.classList.add('show'), 10);
    div.querySelector('.gam-celebration-close').addEventListener('click', () => {
      div.classList.remove('show');
      setTimeout(() => div.remove(), 400);
    });
    div.addEventListener('click', e => {
      if (e.target === div) { div.classList.remove('show'); setTimeout(() => div.remove(), 400); }
    });
  }
  
  // ---- UI: Progress Panel ----
  function openPanel() {
    if (document.getElementById('gam-panel')) return;
    
    const xp = getXP();
    const streak = getStreak();
    const longest = parseInt(localStorage.getItem(STORAGE.LONGEST_STREAK) || '0', 10);
    const level = levelForXP(xp);
    const nextLevelXP = xpForLevel(level + 1);
    const currentLevelXP = xpForLevel(level);
    const progressPct = Math.floor(((xp - currentLevelXP) / (nextLevelXP - currentLevelXP)) * 100);
    const xpToNext = nextLevelXP - xp;
    
    const earnedBadges = getBadges();
    const passed = getPassedExercises();
    let totalPassed = 0;
    Object.values(passed).forEach(exs => { totalPassed += Object.keys(exs).length; });
    
    const badgesHTML = BADGE_DEFS.map(b => {
      const earned = earnedBadges.includes(b.id);
      const name = IS_RTL ? b.name_he : b.name_en;
      const desc = IS_RTL ? b.desc_he : b.desc_en;
      return `
        <div class="gam-badge ${earned ? 'earned' : 'locked'}" title="${desc}">
          <div class="gam-badge-icon">${b.icon}</div>
          <div class="gam-badge-name">${name}</div>
        </div>
      `;
    }).join('');
    
    // Last 7 days activity
    const dailyData = JSON.parse(localStorage.getItem(STORAGE.DAILY_XP) || '{}');
    const last7 = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      last7.push({ date: ds, xp: dailyData[ds] || 0, label: d.toLocaleDateString(IS_RTL ? 'he-IL' : 'en-US', { weekday: 'short' }) });
    }
    const maxXP = Math.max(...last7.map(d => d.xp), 1);
    const chartHTML = last7.map(d => `
      <div class="gam-chart-bar">
        <div class="gam-chart-fill" style="height: ${(d.xp / maxXP) * 100}%"></div>
        <div class="gam-chart-label">${d.label}</div>
        <div class="gam-chart-val">${d.xp || ''}</div>
      </div>
    `).join('');
    
    const panel = document.createElement('div');
    panel.id = 'gam-panel';
    panel.innerHTML = `
      <div class="gam-panel-inner" role="dialog">
        <button class="gam-panel-close" aria-label="${T.close}">&times;</button>
        <h2 class="gam-panel-title">${T.progressTitle}</h2>
        
        <div class="gam-stats">
          <div class="gam-stat">
            <div class="gam-stat-icon">⭐</div>
            <div class="gam-stat-val">${xp.toLocaleString()}</div>
            <div class="gam-stat-label">${T.xp}</div>
          </div>
          <div class="gam-stat">
            <div class="gam-stat-icon">🔥</div>
            <div class="gam-stat-val">${streak}</div>
            <div class="gam-stat-label">${T.streak}</div>
          </div>
          <div class="gam-stat">
            <div class="gam-stat-icon">🎖️</div>
            <div class="gam-stat-val">${level}</div>
            <div class="gam-stat-label">${T.level}</div>
          </div>
        </div>
        
        <div class="gam-progress-box">
          <div class="gam-progress-header">
            <span>${T.level} ${level}</span>
            <span>${T.level} ${level + 1}</span>
          </div>
          <div class="gam-progress-bar">
            <div class="gam-progress-fill" style="width: ${Math.max(0, Math.min(100, progressPct))}%"></div>
          </div>
          <div class="gam-progress-text">${T.xpToNext(xpToNext)}</div>
        </div>
        
        <div class="gam-section-title">${IS_RTL ? '📈 פעילות שבועית' : '📈 Weekly Activity'}</div>
        <div class="gam-chart">${chartHTML}</div>
        
        <div class="gam-section-title">${T.achievements} (${earnedBadges.length}/${BADGE_DEFS.length})</div>
        <div class="gam-badges">${badgesHTML}</div>
        
        <div class="gam-footer">
          <div>${IS_RTL ? 'תרגילים נפתרו' : 'Exercises solved'}: <strong>${totalPassed}</strong></div>
          <div>${IS_RTL ? 'הרצף הכי ארוך שלך' : 'Longest streak'}: <strong>${longest}</strong> ${T.streakDays(longest)}</div>
        </div>
      </div>
    `;
    document.body.appendChild(panel);
    setTimeout(() => panel.classList.add('show'), 10);
    
    panel.querySelector('.gam-panel-close').addEventListener('click', closePanel);
    panel.addEventListener('click', e => {
      if (e.target === panel) closePanel();
    });
  }
  function closePanel() {
    const p = document.getElementById('gam-panel');
    if (p) { p.classList.remove('show'); setTimeout(() => p.remove(), 300); }
  }
  
  // ---- Public API ----
  window.gam = {
    addXP: addXP,
    markExercisePassed: markExercisePassed,
    completeModule: function(moduleName) {
      addXP(XP_REWARDS.MODULE_COMPLETE, IS_RTL ? `מודול הושלם: ${moduleName}` : `Module complete: ${moduleName}`);
    },
    open: openPanel,
    getXP: getXP,
    getStreak: getStreak,
    getBadges: getBadges,
  };
  
  // ---- Init ----
  function init() {
    buildHUD();
    updateUI();
    updateStreakOnLoad();
    checkBadges();
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
<script>
/* ============================================================
   SOUND EFFECTS — Web Audio API (no external files)
   Pure JS, works offline, mobile-friendly
   ============================================================ */

(function() {
  'use strict';
  
  // ---- Mute toggle (saved to localStorage) ----
  function isMuted() { return localStorage.getItem('gam_muted') === '1'; }
  function setMuted(b) { localStorage.setItem('gam_muted', b ? '1' : '0'); }
  
  // ---- AudioContext (lazy initialization, mobile-safe) ----
  let audioCtx = null;
  function getCtx() {
    if (audioCtx) return audioCtx;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
      return audioCtx;
    } catch(e) { return null; }
  }
  
  // ---- Play a tone ----
  function tone(freq, duration, type = 'sine', vol = 0.15, delay = 0) {
    if (isMuted()) return;
    const ctx = getCtx();
    if (!ctx) return;
    
    // Resume context on first user interaction (mobile requirement)
    if (ctx.state === 'suspended') {
      ctx.resume().catch(() => {});
    }
    
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    
    gain.gain.setValueAtTime(0, ctx.currentTime + delay);
    gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + delay + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
    
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + duration);
  }
  
  // ---- Sound presets ----
  const SOUNDS = {
    // Exercise correct - bright ascending chime
    correct: () => {
      tone(523.25, 0.15, 'sine', 0.15, 0);     // C5
      tone(659.25, 0.15, 'sine', 0.15, 0.1);   // E5
      tone(783.99, 0.25, 'sine', 0.18, 0.2);   // G5
    },
    
    // Exercise incorrect - soft descending hum
    wrong: () => {
      tone(330, 0.15, 'sine', 0.1, 0);
      tone(247, 0.2, 'sine', 0.1, 0.12);
    },
    
    // XP earned - quick double pop
    xp: () => {
      tone(800, 0.08, 'sine', 0.12, 0);
      tone(1200, 0.12, 'sine', 0.12, 0.07);
    },
    
    // Level up - triumphant fanfare
    levelUp: () => {
      tone(523.25, 0.12, 'square', 0.1, 0);      // C5
      tone(659.25, 0.12, 'square', 0.1, 0.1);    // E5
      tone(783.99, 0.12, 'square', 0.1, 0.2);    // G5
      tone(1046.50, 0.3,  'square', 0.12, 0.3);  // C6
    },
    
    // Badge unlock - magical sparkle
    badge: () => {
      tone(880, 0.1,  'sine', 0.1, 0);     // A5
      tone(1108.73, 0.1, 'sine', 0.1, 0.08); // C#6
      tone(1318.51, 0.1, 'sine', 0.12, 0.16); // E6
      tone(1760, 0.25, 'sine', 0.13, 0.24); // A6
    },
    
    // Streak continues - soft bell
    streak: () => {
      tone(659.25, 0.15, 'sine', 0.12, 0);
      tone(987.77, 0.3, 'sine', 0.1, 0.1);
    },
    
    // Click - subtle UI tick
    click: () => {
      tone(2000, 0.03, 'sine', 0.06, 0);
    },
    
    // Module complete - full celebration
    complete: () => {
      tone(523.25, 0.1, 'sine', 0.12, 0);
      tone(659.25, 0.1, 'sine', 0.12, 0.08);
      tone(783.99, 0.1, 'sine', 0.12, 0.16);
      tone(1046.50, 0.4, 'sine', 0.15, 0.24);
    },
  };
  
  // ---- Public API ----
  window.gamSound = {
    play: function(name) {
      if (SOUNDS[name]) {
        try { SOUNDS[name](); } catch(e) { /* swallow */ }
      }
    },
    isMuted: isMuted,
    setMuted: setMuted,
    toggle: function() {
      const newState = !isMuted();
      setMuted(newState);
      updateMuteUI();
      if (!newState) SOUNDS.click();  // confirm sound when unmuting
      return newState;
    },
  };
  
  // ---- Mute toggle button (added to HUD) ----
  function updateMuteUI() {
    const btn = document.getElementById('gam-mute-btn');
    if (btn) btn.textContent = isMuted() ? '🔇' : '🔊';
  }
  
  function addMuteButton() {
    if (document.getElementById('gam-mute-btn')) return;
    const hud = document.getElementById('gam-hud');
    if (!hud) {
      // Try again later
      setTimeout(addMuteButton, 500);
      return;
    }
    
    const btn = document.createElement('button');
    btn.id = 'gam-mute-btn';
    btn.className = 'gam-mute-btn';
    btn.textContent = isMuted() ? '🔇' : '🔊';
    btn.setAttribute('aria-label', 'Toggle sound');
    btn.style.cssText = `
      pointer-events: auto;
      background: var(--tc62);
      border: 1.5px solid var(--tc39);
      border-radius: 50%;
      color: var(--tc40);
      width: 36px;
      height: 36px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--tc63);
      margin-inline-end: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform .15s ease;
    `;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      window.gamSound.toggle();
    });
    
    hud.insertBefore(btn, hud.firstChild);
  }
  
  // ---- Hook into gam events (XP, badges, levels) ----
  function hookGamEvents() {
    if (!window.gam) {
      setTimeout(hookGamEvents, 200);
      return;
    }
    
    // Wrap original markExercisePassed
    const origMark = window.gam.markExercisePassed;
    window.gam.markExercisePassed = function(...args) {
      const result = origMark.apply(this, args);
      if (result) window.gamSound.play('correct');
      return result;
    };
  }
  
  // ---- Init ----
  function init() {
    addMuteButton();
    hookGamEvents();
    
    // Observe DOM for badge/level modals to play sounds
    const observer = new MutationObserver(mutations => {
      mutations.forEach(m => {
        m.addedNodes.forEach(node => {
          if (node.nodeType !== 1) return;
          if (node.classList && node.classList.contains('gam-celebration')) {
            if (node.classList.contains('gam-badge-unlock')) {
              window.gamSound.play('badge');
            } else {
              window.gamSound.play('levelUp');
            }
          }
        });
      });
    });
    observer.observe(document.body, { childList: true });
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
<script>(function(){
  var D=document,H=D.documentElement;
  function cur(){return H.getAttribute('data-theme')==='light'?'light':'dark';}
  var btn=D.createElement('button');
  btn.type='button';btn.className='egr-theme-btn';btn.id='egrThemeBtn';
  function paint(){var l=cur()==='light';
    btn.textContent=l?'\u263D':'\u2600';
    btn.title=l?'\u05DE\u05E2\u05D1\u05E8 \u05DC\u05DE\u05E6\u05D1 \u05DB\u05D4\u05D4':'\u05DE\u05E2\u05D1\u05E8 \u05DC\u05DE\u05E6\u05D1 \u05D1\u05D4\u05D9\u05E8';
    btn.setAttribute('aria-label',btn.title);btn.setAttribute('aria-pressed',l?'true':'false');
    var mt=D.querySelector('meta[name="theme-color"]');
    if(mt){if(!mt.dataset.egrDark)mt.dataset.egrDark=mt.getAttribute('content')||'';
      mt.setAttribute('content',l?'#f2f4f8':mt.dataset.egrDark);}}
  btn.addEventListener('click',function(){
    var n=cur()==='light'?'dark':'light';
    H.setAttribute('data-theme',n);
    try{localStorage.setItem('egr-theme',n);}catch(e){}
    paint();});
  function box(el){
    if(!el)return null;
    var c=el.closest?el.closest('header,.topnav,.topbar,.header,nav'):null;
    return c||el.parentElement||el;
  }
  function float(){
    if(btn.parentNode)btn.parentNode.removeChild(btn);
    btn.style.marginInlineStart='';
    btn.classList.add('egr-floating');
    D.body.appendChild(btn);
  }
  function mount(){
    var fl=D.querySelectorAll('a[title="\u05E2\u05D1\u05E8\u05D9\u05EA"],a[title="English"],a[title="\u4E2D\u6587"]');
    var anchor=null,mode=0;
    if(fl.length>=2&&fl[0].parentNode){anchor=fl[0];mode=1;}
    else{
      anchor=D.querySelector('.lang-flags')||D.querySelector('.lang')||
             D.querySelector('.topnav-right')||D.querySelector('.header-right')||
             D.querySelector('.nav-right')||D.querySelector('.topbar-right')||
             D.querySelector('header .hd')||D.querySelector('.header-inner')||
             D.querySelector('.topbar')||D.querySelector('.topnav')||
             D.querySelector('header');
      mode=anchor?2:0;
    }
    if(!mode){float();paint();return;}
    var frame=box(anchor);
    var h0=frame?frame.getBoundingClientRect().height:0;
    var restore=null;
    if(mode===1){
      if(anchor.style&&anchor.style.marginInlineStart==='auto'){
        restore=anchor;btn.style.marginInlineStart='auto';anchor.style.marginInlineStart='0';
      }
      anchor.parentNode.insertBefore(btn,anchor);
    }else{anchor.appendChild(btn);}
    // If squeezing the button in made the bar taller, it does not belong there.
    var h1=frame?frame.getBoundingClientRect().height:0;
    if(frame&&h1>h0+1){
      if(restore)restore.style.marginInlineStart='auto';
      float();
    }
    paint();}
  if(D.readyState==='loading')D.addEventListener('DOMContentLoaded',mount);else mount();
})();</script></body>
