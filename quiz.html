<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בחן את עצמך — SQL Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080C14;--bg2:#0D1220;--bg3:#111828;--bg4:#16202E;
  --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);
  --text:#F1F5FF;--text2:#8896AA;--text3:#2A3450;
  --blue:#2D6FFF;--blue2:#1a52cc;--blue3:#0a2a7a;
  --cyan:#00E5FF;--green:#00E5A0;--green2:#00b380;
  --orange:#FFB020;--yellow:#FFB020;--red:#FF4060;--purple:#9B5CFF;
  --purple:#d2a8ff;
  --font:'Heebo',sans-serif;--mono:'IBM Plex Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.6;min-height:100vh}
.topnav{background:rgba(6,10,15,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:.75rem 1.5rem;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:100;flex-wrap:wrap}
.back-btn{color:var(--cyan);text-decoration:none;font-size:13px;font-weight:700;font-family:var(--mono)}
.topnav-title{font-size:14px;font-weight:700;color:var(--text2)}
.topnav-links{margin-right:auto;display:flex;gap:1rem;flex-wrap:wrap}
.topnav-link{color:var(--text3);text-decoration:none;font-size:13px;font-weight:600;transition:color .2s}
.topnav-link:hover{color:var(--cyan)}

/* HERO */
.hero{background:linear-gradient(135deg,var(--bg2),var(--bg3));border-bottom:1px solid var(--border);padding:2.5rem 2rem;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 50% 50%,rgba(188,140,255,.05) 0%,transparent 70%);pointer-events:none}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(188,140,255,.1);border:1px solid rgba(188,140,255,.25);color:var(--purple);font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px;margin-bottom:1rem;letter-spacing:.5px}
.hero-title{font-size:2rem;font-weight:900;margin-bottom:.5rem}
.hero-sub{color:var(--text2);font-size:14px;margin-bottom:1.5rem}
.hero-stats{display:flex;gap:2rem;justify-content:center;flex-wrap:wrap}
.hero-stat{text-align:center}
.hero-stat-num{font-size:1.8rem;font-weight:900;color:var(--purple);font-family:var(--mono)}
.hero-stat-label{font-size:12px;color:var(--text3)}

/* SCORE BAR */
.score-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:.75rem 1.5rem;display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;position:sticky;top:49px;z-index:90}
.score-info{font-size:13px;color:var(--text2)}
.score-info strong{color:var(--text);font-size:15px}
.score-track{flex:1;min-width:150px;background:var(--bg3);border-radius:4px;height:8px;overflow:hidden}
.score-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--blue));border-radius:4px;transition:width .4s}
.score-pct{font-family:var(--mono);font-size:13px;color:var(--purple);font-weight:700;white-space:nowrap}
.reset-btn{background:transparent;border:1px solid var(--border2);color:var(--text3);font-family:var(--font);font-size:12px;padding:5px 12px;border-radius:6px;cursor:pointer;transition:all .15s}
.reset-btn:hover{border-color:var(--red);color:var(--red)}

/* MAIN */
.main{max-width:860px;margin:0 auto;padding:2rem 1.5rem 5rem}

/* SECTION LABEL */
.section-label{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin:2rem 0 1rem;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.section-label.easy{color:var(--green)}
.section-label.medium{color:var(--orange)}
.section-label.hard{color:var(--red)}

/* QUESTION CARD */
.q-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;margin-bottom:1.25rem;overflow:hidden;transition:border-color .2s}
.q-card.correct{border-color:var(--green2)}
.q-card.wrong{border-color:var(--red)}
.q-header{padding:1rem 1.25rem;border-bottom:1px solid var(--border)}
.q-meta{display:flex;align-items:center;gap:.75rem;margin-bottom:.5rem}
.q-num{background:var(--bg4);color:var(--text3);font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.q-diff{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.diff-easy{background:rgba(0,230,118,.1);color:var(--green);border:1px solid rgba(0,230,118,.25)}
.diff-medium{background:rgba(255,140,66,.1);color:var(--orange);border:1px solid rgba(255,140,66,.25)}
.diff-hard{background:rgba(255,71,87,.1);color:var(--red);border:1px solid rgba(255,71,87,.25)}
.q-topic{font-size:10px;color:var(--text3);font-family:var(--mono)}
.q-text{font-size:14px;font-weight:600;color:var(--text);line-height:1.6}
.q-body{padding:1rem 1.25rem}

/* OPTIONS */
.options{display:flex;flex-direction:column;gap:.6rem}
.option{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem;cursor:pointer;transition:all .15s;display:flex;align-items:flex-start;gap:.75rem;text-align:right}
.option:hover:not(.disabled){background:var(--bg4);border-color:var(--border2)}
.option.selected{border-color:var(--blue);background:rgba(74,158,255,.06)}
.option.correct-ans{border-color:var(--green2)!important;background:rgba(0,168,84,.08)!important}
.option.wrong-ans{border-color:var(--red)!important;background:rgba(255,71,87,.08)!important}
.option.disabled{cursor:default;pointer-events:none}
.opt-letter{width:26px;height:26px;border-radius:6px;background:var(--bg4);border:1px solid var(--border2);color:var(--text3);font-size:12px;font-weight:700;font-family:var(--mono);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.option.correct-ans .opt-letter{background:var(--green2);color:#fff;border-color:var(--green2)}
.option.wrong-ans .opt-letter{background:var(--red);color:#fff;border-color:var(--red)}
.option.selected .opt-letter{background:var(--blue);color:#fff;border-color:var(--blue)}
.opt-text{font-size:13px;color:var(--text2);line-height:1.5;flex:1;font-family:var(--mono)}
.option.correct-ans .opt-text,.option.wrong-ans .opt-text{color:var(--text)}

/* EXPLANATION */
.explanation{display:none;margin-top:.75rem;background:rgba(74,158,255,.04);border-right:3px solid var(--blue2);border-radius:0 6px 6px 0;padding:.75rem 1rem}
.explanation.show{display:block}
.explanation p{font-size:13px;color:var(--text2);line-height:1.7}
.explanation strong{color:var(--text);font-weight:600}
.result-icon{font-size:1.1rem;margin-left:.4rem}

/* FINISH */
.finish-card{background:linear-gradient(135deg,rgba(188,140,255,.08),rgba(74,158,255,.05));border:1px solid rgba(188,140,255,.2);border-radius:16px;padding:2.5rem;text-align:center;margin-top:2rem;display:none}
.finish-card.show{display:block}
.finish-emoji{font-size:3rem;margin-bottom:.75rem}
.finish-title{font-size:1.6rem;font-weight:900;color:var(--purple);margin-bottom:.5rem}
.finish-score{font-size:3rem;font-weight:900;font-family:var(--mono);margin:.75rem 0}
.finish-sub{color:var(--text2);font-size:14px}
.finish-grade{display:inline-block;font-size:1rem;font-weight:700;padding:.4rem 1.2rem;border-radius:20px;margin:.75rem 0}
.grade-a{background:rgba(0,230,118,.15);color:var(--green);border:1px solid rgba(0,230,118,.3)}
.grade-b{background:rgba(74,158,255,.15);color:var(--blue);border:1px solid rgba(74,158,255,.3)}
.grade-c{background:rgba(255,140,66,.15);color:var(--orange);border:1px solid rgba(255,140,66,.3)}
.grade-d{background:rgba(255,71,87,.15);color:var(--red);border:1px solid rgba(255,71,87,.3)}
.retry-btn{background:var(--blue);color:#fff;border:none;padding:12px 28px;border-radius:10px;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;margin-top:1rem;transition:all .2s}
.retry-btn:hover{background:var(--blue);transform:translateY(-1px)}

/* HAMBURGER */
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;background:none;border:none;z-index:200}
.hamburger span{display:block;width:24px;height:2px;background:var(--text);border-radius:2px;transition:all .3s}
.hamburger.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px)}
.hamburger.open span:nth-child(2){opacity:0}
.hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px)}
.mobile-menu{display:none;position:fixed;inset:0;top:49px;background:rgba(6,10,15,.98);z-index:150;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem}
.mobile-menu.open{display:flex}
.mobile-menu a{color:var(--text);text-decoration:none;font-size:1.3rem;font-weight:700;padding:.5rem 2rem;border-radius:10px}

@media(max-width:768px){
.hero{padding:2rem .75rem 1.5rem}
.hero-title{font-size:1.5rem}
.hero-sub{font-size:13px}
.hero-stats{gap:.75rem;flex-wrap:wrap}
.hero-stat-num{font-size:1.5rem}
.quiz-container{padding:.75rem}
.question-card{padding:1rem}
.q-text{font-size:14px}
.options{gap:.5rem}
.option-btn{font-size:13px;padding:.7rem .85rem;text-align:right}
.explain-box{font-size:13px;padding:.65rem .85rem}
.nav-links,.nav-cta{display:none}
.finish-card{padding:2rem 1rem}
.finish-score{font-size:2.5rem}
.hamburger{display:flex}
.topnav-links{display:none}
.main{padding:1rem .75rem 4rem}
.opt-text{font-size:11px}
.score-bar{gap:.75rem}
.score-track{min-width:80px}
}

@media(max-width:768px){
  /* Better touch targets */
  a, button{min-height:40px;display:inline-flex;align-items:center}
  /* Prevent horizontal scroll */
  body{overflow-x:hidden;-webkit-text-size-adjust:100%}
  /* Better table display on mobile */
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* Code blocks */
  pre,code{font-size:11px;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;white-space:pre-wrap;word-break:break-word}
  /* Images responsive */
  img{max-width:100%;height:auto}
}
@media(max-width:480px){
  body{font-size:14px}
  h1{font-size:1.5rem!important}
  h2{font-size:1.2rem!important}
}

/* ===== MOBILE RESPONSIVE ===== */
@media(max-width:768px){
  /* Topnav */
  .topnav{padding:.5rem .75rem;flex-wrap:wrap;gap:.4rem;height:auto}
  .topnav-links,.nav-links-desktop{display:none!important}
  .topnav-title{font-size:12px;max-width:calc(100% - 120px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .back-btn{font-size:11px}
  .hamburger{display:flex!important}
  
  /* Layout */
  .main,.main-content,.content{padding:.75rem .6rem 3rem!important}
  .layout{flex-direction:column!important}
  .sidebar-left,.sidebar{display:none!important}
  
  /* Typography */
  h1{font-size:1.5rem!important;line-height:1.2}
  h2{font-size:1.25rem!important}
  h3{font-size:1.05rem!important}
  pre,code{font-size:11px!important;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
  
  /* Tables */
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  
  /* Practice page */
  .lesson-tabs{overflow-x:auto;flex-wrap:nowrap!important;gap:.25rem;padding:.25rem .5rem}
  .lesson-tab{font-size:11px!important;padding:.5rem .6rem!important;white-space:nowrap;flex-shrink:0}
  .lesson-badge{display:none!important}
  .q-card{padding:.85rem!important}
  .q-text{font-size:13.5px!important;line-height:1.6}
  .q-hint,.q-answer{font-size:12.5px!important;padding:.6rem .75rem!important}
  .q-actions{flex-wrap:wrap;gap:.4rem}
  .q-meta{flex-wrap:wrap;gap:.3rem}
  .section-divider{padding:.5rem .6rem!important;font-size:13px!important}
  
  /* Quiz pages */
  .quiz-container,.quiz-wrap{padding:.75rem!important}
  .question-card{padding:1rem!important;border-radius:10px}
  .q-text,.question-text{font-size:14px!important;line-height:1.6}

  .hero-title,.quiz-title{font-size:1.5rem!important}
  .hero-stats,.quiz-stats{gap:.6rem!important;flex-wrap:wrap}
  .hero-stat-num,.stat-number{font-size:1.4rem!important}
  .finish-card{padding:1.5rem 1rem!important}
  .finish-score{font-size:2.2rem!important}
  .hero,.quiz-hero{padding:2rem .75rem 1.5rem!important}
  
  /* Videos pages */
  .video-grid{grid-template-columns:1fr!important}
  .filter-row,.filter-bar{flex-wrap:wrap!important;gap:.35rem!important}
  .filter-btn{font-size:11px!important;padding:.25rem .6rem!important}
  .video-card,.vid-card{border-radius:8px}
  .video-thumb,.vid-thumb{border-radius:8px 8px 0 0}
  
  /* Course / Study / Lessons */
  .chapter,.section-block{padding:.85rem!important}
  .code-block,.sql-block{margin:.5rem 0!important;border-radius:8px!important;font-size:11.5px!important}
  .tip-box,.note-box,.info-box{padding:.75rem!important;font-size:13px}
  .step-body p{font-size:13px!important}
  .file-grid{grid-template-columns:1fr!important}
  .progress-section{flex-direction:column!important;gap:.75rem!important}
  
  /* Reference page */
  .cards{grid-template-columns:1fr!important}
  .catnav,.cat-nav{padding:.3rem .5rem!important}
  .cbtn,.cat-btn{font-size:10.5px!important;padding:.2rem .55rem!important}
  
  /* Setup page */
  .steps-grid{grid-template-columns:1fr!important}
  .step-card{padding:1rem!important}
  
  /* General touch improvements */
  a,button{min-height:40px}
  .btn,.button{padding:.65rem 1.1rem!important;font-size:13px!important}
  img{max-width:100%;height:auto}
  
  /* Score badges */
  .score-badge,.badge{font-size:11px!important;padding:3px 8px!important}
  
  /* Bottom padding for mobile */
  body{padding-bottom:env(safe-area-inset-bottom)}
}

@media(max-width:480px){
  .topnav-title{font-size:11px}
  .q-text,.question-text{font-size:13px!important}
  .option-btn,.answer-btn{font-size:12.5px!important}
  .hero-title,.quiz-title{font-size:1.3rem!important}
  pre,code{font-size:10.5px!important}
  .main,.main-content,.content{padding:.6rem .5rem 2.5rem!important}
}

/* ─── FIREBASE AUTH BAR ─── */
.fb-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:.5rem 1.5rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;position:sticky;top:48px;z-index:90}
.fb-login-btn{display:flex;align-items:center;gap:6px;background:#4285f4;color:#fff;border:none;padding:7px 14px;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;transition:opacity .15s;font-family:var(--font)}
.fb-login-btn:hover{opacity:.88}
.fb-logout-btn{display:none;align-items:center;gap:5px;background:transparent;color:var(--text2);border:1px solid var(--border2);padding:5px 10px;border-radius:6px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:var(--font)}
.fb-logout-btn:hover{color:var(--text)}
.fb-user-info{display:none;align-items:center;gap:.5rem}
.fb-user-photo{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--aq)}
.fb-user-name{font-size:12.5px;font-weight:700;color:var(--text)}
.fb-saved-score{display:none;font-size:11px;color:var(--aq);font-family:var(--mono);background:rgba(0,212,200,.08);padding:3px 9px;border-radius:4px}
.fb-save-btn{display:none;align-items:center;gap:5px;background:var(--aq);color:var(--bg);border:none;padding:7px 14px;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--font);margin-right:auto}
.fb-history-btn{display:none;align-items:center;gap:5px;background:transparent;color:var(--text2);border:1px solid var(--border2);padding:5px 10px;border-radius:6px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:var(--font)}
.fb-history-btn:hover{color:var(--text);border-color:var(--aq)}
.fb-history-wrap{background:var(--bg2);border-bottom:1px solid var(--border);padding:1rem 1.5rem;display:none}
.hstats-row{display:flex;gap:1.5rem;margin-bottom:1rem;justify-content:center}
.hstat-mini{text-align:center}
.hstat-n{font-size:1.4rem;font-weight:900;font-family:var(--mono)}
.hstat-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.hchart{display:flex;align-items:flex-end;gap:.4rem;height:130px;padding:.5rem 0;overflow-x:auto}
.hbar-wrap{display:flex;flex-direction:column;align-items:center;gap:.2rem;min-width:32px;flex-shrink:0}
.hbar{width:24px;border-radius:4px 4px 0 0;transition:all .3s;min-height:8px}
.hbar-val{font-size:9.5px;color:var(--text2);font-family:var(--mono)}
.hbar-lbl{font-size:9px;color:var(--text3)}
#fb-toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--aq);color:var(--bg);padding:10px 20px;border-radius:8px;font-weight:700;font-size:13px;opacity:0;transition:all .3s;z-index:999;pointer-events:none}
#fb-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

</style>

      "SELECT FullName FROM Application.People p JOIN Sales.Orders o ON p.PersonID = o.SalespersonPersonID WHERE COUNT(o.OrderID) = MAX(COUNT(o.OrderID));",

    correct:0,
    explain:'<strong>TOP 1</strong> עם ORDER BY COUNT(*) DESC מחזיר את העובד עם הכי הרבה הזמנות. ב-SQL Server TOP משמש במקום LIMIT.'
  },
  {

      "SELECT StockItemName FROM Warehouse.StockItems s LEFT JOIN Sales.OrderLines ol ON s.StockItemID = ol.StockItemID WHERE ol.OrderID IS NULL;",
      "SELECT StockItemName FROM Warehouse.StockItems WHERE NOT EXISTS (SELECT * FROM Sales.Orders WHERE YEAR(OrderDate) = 2016);"
    ],
    correct:0,
    explain:'<strong>NOT IN</strong> עם תת-שאילתה שמסננת הזמנות מ-2016 בלבד. תשובה ג מוצאת מוצרים שלא הוזמנו בכלל, לא רק ב-2016.'
  },

  // ===== חלק 6: JOIN + SQL Server =====
  {
    num:26, diff:'medium', topic:'INNER JOIN · SQL Server',
    text:'איזו שאילתה מחברת נכון בין מוצר לספק שלו?',
    options:[
      "SELECT si.StockItemName, s.SupplierName FROM Warehouse.StockItems si JOIN Purchasing.Suppliers s ON si.SupplierID = s.SupplierID;",

    options:[
      "SELECT c.CustomerName, o.OrderID FROM Sales.Customers c JOIN Sales.Orders o ON c.CustomerID = o.CustomerID;",

    explain:'<strong>LEFT JOIN</strong> מטבלת Customers — שומר את כל הלקוחות. לקוחות ללא הזמנות יקבלו NULL בעמודות ה-Orders.'

      "Orders → Customers → People (Salesperson) → OrderLines → StockItems",

    explain:'הסדר הלוגי: <strong>Orders</strong> (מרכז) → Customers (מי הזמין) → People (מי מכר) → OrderLines (פרטי שורות) → StockItems (שם המוצר).'

    num:29, diff:'hard', topic:'Self JOIN · SQL Server',
    text:'בטבלת הלקוחות יש עמודה BillToCustomerID. איך נראה את שם הלקוח לצד שם הלקוח שמשלם עליו?',
    options:[
      "SELECT c.CustomerName, b.CustomerName FROM Sales.Customers c JOIN Sales.Customers b ON c.BillToCustomerID = b.CustomerID;",
      "SELECT c.CustomerName, c.BillToCustomerID FROM Sales.Customers c;",
      "SELECT c1.CustomerName, c2.CustomerName FROM Sales.Customers c1 JOIN Sales.Customers c2 ON c1.CustomerID = c2.CustomerID;",
      "SELECT CustomerName FROM Sales.Customers WHERE BillToCustomerID IS NOT NULL;"
    ],
    correct:0,
    explain:'<strong>Self JOIN</strong> — מחברים טבלה לעצמה עם שני aliases שונים (c ו-b). c הוא הלקוח, b הוא מי שמשלם עליו.'

      "SELECT si.StockItemName FROM Warehouse.StockItems si JOIN Sales.OrderLines ol ON si.StockItemID = ol.StockItemID;",
      "SELECT si.StockItemName FROM Warehouse.StockItems si LEFT JOIN Sales.OrderLines ol ON si.StockItemID = ol.StockItemID WHERE ol.OrderLineID IS NULL;",
      "SELECT si.StockItemName FROM Warehouse.StockItems si WHERE EXISTS (SELECT * FROM Sales.OrderLines);",
      "SELECT si.StockItemName FROM Warehouse.StockItems si RIGHT JOIN Sales.OrderLines ol ON si.StockItemID = ol.StockItemID WHERE si.StockItemID IS NULL;"

    correct:1,
    explain:'<strong>LEFT JOIN + WHERE IS NULL</strong> — הטריק הקלאסי: מחברים, ואז מסננים רק שורות שלא נמצאה להן התאמה (NULL).'

  {
    num:31, diff:'hard', topic:'CASE + DATEDIFF · Sakila',
    text:'איך נבדוק אם סרט הוחזר באיחור?',
    options:[
      "CASE WHEN DATEDIFF(return_date, rental_date) > rental_duration THEN 'Late' ELSE 'On Time' END",
      "CASE WHEN return_date > rental_duration THEN 'Late' ELSE 'On Time' END",
      "CASE WHEN return_date - rental_date > 7 THEN 'Late' END",
      "IF(return_date > rental_date, 'Late', 'On Time')"
    ],
    correct:0,
    explain:'<strong>DATEDIFF(return_date, rental_date)</strong> מחשב מספר ימים בפועל ומשווה ל-rental_duration. תשובה ב משווה תאריך למספר ימים — שגוי.'
  },
  {
    num:32, diff:'hard', topic:'CASE + Subquery · Sakila',
    text:"איך נסווג לקוח כ-'High Spender' אם הוא מעל הממוצע הכללי?",
    options:[
      "CASE WHEN SUM(amount) > (SELECT AVG(total) FROM (SELECT SUM(amount) AS total FROM payment GROUP BY customer_id) AS sub) THEN 'High Spender' ELSE 'Regular' END",
      "CASE WHEN amount > AVG(amount) THEN 'High Spender' END",
      "CASE WHEN SUM(amount) > AVG(SUM(amount)) THEN 'High Spender' END",
      "SELECT first_name FROM payment HAVING SUM(amount) > AVG(amount)"
    ],
    correct:0,
    explain:'<strong>תת-שאילתה בתוך CASE</strong> — ממוצע הסכומים מחושב בנפרד (ממוצע של סכומים, לא של תשלומים בודדים).'
  },
  {
    num:33, diff:'hard', topic:'CASE חישוב דינמי · Sakila',
    text:'איך נעלה מחיר ב-20% רק לסרטים שהושכרו מעל 30 פעם?',
    options:[
      "CASE WHEN COUNT(rental_id) > 30 THEN rental_rate * 1.2 ELSE rental_rate END",
      "CASE WHEN rental_count > 30 THEN rental_rate + 20% END",
      "UPDATE film SET rental_rate = rental_rate * 1.2 WHERE count > 30",
      "SELECT title, rental_rate * 1.2 AS New_Price FROM film"
    ],
    correct:0,
    explain:'<strong>חישוב מתמטי בתוך CASE</strong> — rental_rate * 1.2 מעלה ב-20%. תשובה ב שגויה כי + 20% אינו תחביר תקני.'
  }
];

const diffLabel = {easy:'קל',medium:'בינוני',hard:'קשה'};
const diffClass = {easy:'diff-easy',medium:'diff-medium',hard:'diff-hard'};
const sectionClass = {easy:'easy',medium:'medium',hard:'hard'};
const sectionTitle = {easy:'🟢 חלק א׳ — CASE WHEN (Sakila)',medium:'🟠 חלק ב׳ — Subqueries + JOIN',hard:'🔴 חלק ג׳ — רמה קשה מאוד'};

let answers = {};
let correct = 0;
let answered = 0;

function updateScore(){
  const total = Object.keys(answers).length;
  const pct = total > 0 ? Math.round(correct/total*100) : 0;
  document.getElementById('scoreText').textContent = correct+' / '+total;
  document.getElementById('scoreFill').style.width = pct+'%';
  document.getElementById('scorePct').textContent = pct+'%';
  document.getElementById('heroAnswered').textContent = total;
  if(total === questions.length) showFinish();
}

function selectOption(qIdx, optIdx){
  if(answers[qIdx] !== undefined) return;
  const q = questions[qIdx];
  const isCorrect = optIdx === q.correct;
  answers[qIdx] = optIdx;
  if(isCorrect) correct++;
  answered++;

  // Style card
  const card = document.getElementById('qcard-'+qIdx);
  card.classList.add(isCorrect ? 'correct' : 'wrong');

  // Style options
  const opts = card.querySelectorAll('.option');
  opts.forEach((o,i)=>{
    o.classList.add('disabled');
    if(i === q.correct) o.classList.add('correct-ans');
    if(i === optIdx && !isCorrect) o.classList.add('wrong-ans');
  });

  // Show explanation
  document.getElementById('exp-'+qIdx).classList.add('show');
  updateScore();
}

function buildQuiz(){
  const mc = document.getElementById('mainContent');
  let lastDiff = null;
  questions.forEach((q,i)=>{
    if(q.diff !== lastDiff){
      mc.innerHTML += `<div class="section-label ${sectionClass[q.diff]}">${sectionTitle[q.diff]}</div>`;
      lastDiff = q.diff;
    }
    const letters = ['א','ב','ג','ד'];
    let optsHtml = q.options.map((o,oi)=>`
      <div class="option" onclick="selectOption(${i},${oi})">
        <div class="opt-letter">${letters[oi]}</div>
        <div class="opt-text">${o}</div>
      </div>`).join('');

    mc.innerHTML += `
    <div class="q-card" id="qcard-${i}">
      <div class="q-header">
        <div class="q-meta">
          <div class="q-num">שאלה ${q.num}</div>
          <div class="q-diff ${diffClass[q.diff]}">${diffLabel[q.diff]}</div>
          <div class="q-topic">${q.topic}</div>
        </div>
        <div class="q-text">${q.text}</div>
      </div>
      <div class="q-body">
        <div class="options">${optsHtml}</div>
        <div class="explanation" id="exp-${i}">
          <p>${q.correct === answers[i] ? '✅' : '❌'} <strong>${q.correct === answers[i] ? 'נכון!' : 'לא נכון.'}</strong> ${q.explain}</p>
        </div>
      </div>
    </div>`;
  });

  mc.innerHTML += `
  <div class="finish-card" id="finishCard">
    <div class="finish-emoji">🎉</div>
    <div class="finish-title">סיימת את הקוויז!</div>
    <div class="finish-score" id="finishScore">0/15</div>
    <div id="finishGrade"></div>
    <div class="finish-sub" id="finishSub"></div>
    <br>
    <button class="retry-btn" onclick="resetQuiz()">🔄 נסה שוב</button>
  </div>`;
}

function showFinish(){
  if(window.fbAutoSave && window.currentUser) window.fbAutoSave(correct, questions.length);
  const card = document.getElementById('finishCard');
  card.classList.add('show');
  card.scrollIntoView({behavior:'smooth',block:'center'});
  document.getElementById('finishScore').textContent = correct+'/'+questions.length;
  const pct = Math.round(correct/questions.length*100);
  let grade, sub;
  if(pct>=90){grade='<span class="finish-grade grade-a">⭐ מצוין! A</span>';sub='ביצועים יוצאי דופן — אתה שולט ב-SQL ברמה גבוהה!';}
  else if(pct>=75){grade='<span class="finish-grade grade-b">👍 טוב מאוד! B</span>';sub='עבודה טובה! כדאי לחזור על הנושאים שטעית בהם.';}
  else if(pct>=60){grade='<span class="finish-grade grade-c">📚 עובר! C</span>';sub='בסיס טוב, אבל יש מקום לשיפור. חזור על החומר.';}
  else{grade='<span class="finish-grade grade-d">💪 ממשיכים להתאמן! D</span>';sub='אל תתייאש — חזור לחומר הלימוד ונסה שוב!';}
  document.getElementById('finishGrade').innerHTML = grade;
  document.getElementById('finishSub').textContent = sub;
}

function resetQuiz(){
  answers = {}; correct = 0; answered = 0;
  document.getElementById('mainContent').innerHTML = '';
  buildQuiz();
  updateScore();
  window.scrollTo({top:0,behavior:'smooth'});
}

function toggleMenu(){
  document.getElementById('hamburger').classList.toggle('open');
  document.getElementById('mobileMenu').classList.toggle('open');
}

buildQuiz();
updateScore();
</script>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyA04LDMDGohAs1uRnUVwWVTs5coVMrEO64",
  authDomain: "sql-course-507b5.firebaseapp.com",
  projectId: "sql-course-507b5",
  storageBucket: "sql-course-507b5.firebasestorage.app",
  messagingSenderId: "999664091380",
  appId: "1:999664091380:web:349959985ae11ce8c51ea1"
});

const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
let currentUser = null;
window.currentUser = null;
const QUIZ_ID = document.body.dataset.quizId || 'quiz';

onAuthStateChanged(auth, async (user) => {
  currentUser = user; window.currentUser = user;
  const loginBtn = document.getElementById('fb-login-btn');
  const logoutBtn = document.getElementById('fb-logout-btn');
  const userInfo = document.getElementById('fb-user-info');
  const histBtn = document.getElementById('fb-history-btn');
  const saveBtn = document.getElementById('fb-save-btn');
  if (user) {
    document.getElementById('fb-user-name').textContent = user.displayName;
    document.getElementById('fb-user-photo').src = user.photoURL;
    document.getElementById('fb-user-photo').style.display = 'block';
    loginBtn.style.display = 'none';
    logoutBtn.style.display = 'flex';
    userInfo.style.display = 'flex';
    histBtn.style.display = 'flex';
    saveBtn.style.display = 'flex';
    await loadProgress();
    await loadHistory();
  } else {
    loginBtn.style.display = 'flex';
    logoutBtn.style.display = 'none';
    userInfo.style.display = 'none';
    histBtn.style.display = 'none';
    saveBtn.style.display = 'none';
  }
});

window.fbLogin = async () => {
  try { await signInWithRedirect(auth, provider); }
  catch(e) { console.error(e); }
};

window.fbLogout = async () => { await signOut(auth); };

window.fbToggleHistory = () => {
  const wrap = document.getElementById('fb-history-wrap');
  wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none';
};

window.triggerSave = async () => {
  if (!currentUser) { fbLogin(); return; }
  // Get current score from page
  const scoreEl = document.getElementById('scoreText') || document.getElementById('score-display');
  const txt = scoreEl ? scoreEl.textContent : '0 / 0';
  const parts = txt.split('/');
  const score = parseInt(parts[0]) || 0;
  const total = parseInt(parts[1]) || 0;
  if (total === 0) { showToast('⚠️ ענה על לפחות שאלה אחת קודם!'); return; }
  await saveProgress(score, total);
};

async function saveProgress(score, total) {
  if (!currentUser) return;
  const pct = Math.round(score/total*100);
  const ref = doc(db, 'users', currentUser.uid, 'quizzes', QUIZ_ID);
  await setDoc(ref, { score, total, pct, lastUpdate: new Date().toISOString() }, { merge: true });
  await addDoc(collection(db, 'users', currentUser.uid, 'history'), {
    quizId: QUIZ_ID, score, total, pct, date: new Date().toISOString()
  });
  showToast('✅ ההתקדמות נשמרה בענן!');
  await loadHistory();
}

window.fbAutoSave = saveProgress;

async function loadProgress() {
  if (!currentUser) return;
  const snap = await getDoc(doc(db, 'users', currentUser.uid, 'quizzes', QUIZ_ID));
  if (snap.exists()) {
    const d = snap.data();
    const el = document.getElementById('fb-saved-score');
    el.textContent = `ניסיון אחרון: ${d.score}/${d.total} (${d.pct}%)`;
    el.style.display = 'block';
  }
}

async function loadHistory() {
  if (!currentUser) return;
  const q = query(collection(db, 'users', currentUser.uid, 'history'), orderBy('date','desc'), limit(10));
  const snap = await getDocs(q);
  const hist = [];
  snap.forEach(d => hist.push(d.data()));
  renderChart(hist.filter(h => h.quizId === QUIZ_ID));
}

function renderChart(history) {
  const panel = document.getElementById('fb-history-panel');
  if (!history.length) {
    panel.innerHTML = '<p style="color:var(--text2);font-size:13px;text-align:center;padding:1rem">עדיין אין היסטוריה — ענה על שאלות ושמור!</p>';
    return;
  }
  const rev = [...history].reverse();
  const best = Math.max(...history.map(h=>h.pct));
  const avg = Math.round(history.reduce((a,h)=>a+h.pct,0)/history.length);
  const bars = rev.map(h => {
    const d = new Date(h.date);
    const lbl = `${d.getDate()}/${d.getMonth()+1}`;
    const color = h.pct>=80?'var(--aq)':h.pct>=50?'#FFB020':'#FF4060';
    const ht = Math.max(h.pct*1.1, 8);
    return `<div class="hbar-wrap">
      <div class="hbar-val">${h.pct}%</div>
      <div class="hbar" style="height:${ht}px;background:${color}"></div>
      <div class="hbar-lbl">${lbl}</div>
    </div>`;
  }).join('');
  panel.innerHTML = `
    <div class="hstats-row">
      <div class="hstat-mini"><div class="hstat-n" style="color:var(--aq)">${best}%</div><div class="hstat-l">שיא אישי</div></div>
      <div class="hstat-mini"><div class="hstat-n" style="color:#FFB020">${avg}%</div><div class="hstat-l">ממוצע</div></div>
      <div class="hstat-mini"><div class="hstat-n" style="color:var(--text2)">${history.length}</div><div class="hstat-l">ניסיונות</div></div>
    </div>
    <div class="hchart">${bars}</div>`;
}

function showToast(msg) {
  let t = document.getElementById('fb-toast');
  if(!t){t=document.createElement('div');t.id='fb-toast';document.body.appendChild(t);}
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
